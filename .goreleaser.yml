version: 2

project_name: nimi-runtime
dist: dist/runtime

builds:
  - id: nimi
    dir: runtime
    main: ./cmd/nimi
    binary: nimi
    mod_timestamp: "{{ .CommitTimestamp }}"
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: runtime-binary
    ids:
      - nimi
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}
    builds_info:
      mtime: "{{ .CommitDate }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

release:
  # Global RC/stable tag and GitHub Release ownership stays in the workflow;
  # GoReleaser is the reproducible Runtime archive builder only.
  disable: true

snapshot:
  # Canary builds pass the final stable version so RC and stable can promote
  # the exact same archives. Ad-hoc local snapshots keep a unique fallback.
  version_template: >-
    {{ if index .Env "NIMI_RELEASE_VERSION" }}{{ .Env.NIMI_RELEASE_VERSION }}{{ else }}0.0.0-next-{{ .ShortCommit }}-{{ .Timestamp }}{{ end }}
