[package]
name = "nimiplatform-realm-agent-studio"
version = "0.1.0"
description = "Realm Agent Studio desktop shell"
authors = ["Nimi Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset"] }
nimi-kit-shell-tauri = { path = "../../../kit/shell/tauri" }

[dev-dependencies]
tempfile = "3"
