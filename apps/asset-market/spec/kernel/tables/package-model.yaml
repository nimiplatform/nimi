# Asset Market — Package Model
# Authoritative source for current bundle/package fields, enums, readiness, and future reservations.

package_model:
  current_active_objects:
    - Asset
    - Bundle
    - Package

  reserved_future_objects:
    - PackageListing

  categories:
    - scenes
    - characters
    - styles

  package_kinds:
    active:
      - realm-bundle
      - avatar
    reserved_future:
      - avatar-sprite2d-preview
    naming_convention:
      launched_avatar: avatar
      preview_only_avatar: avatar-<preview-kind>-preview
    invariants:
      - package_kind is the structural discriminator for Package-specific readiness and consumer routing
      - category remains the market-facing classification axis
      - package_kind and category must not be inferred from each other
      - reserved_future values are not publishable or acquirable until promoted to active by admitted Asset Market rules

  package_kind_profiles:
    realm-bundle:
      status: active
      meaning: Generic Realm Bundle package for Forge/import creator workflows
      required_package_fields: []
      allowed_backend_kind_values: []
    avatar:
      status: active
      meaning: Launched Avatar visual package for admitted Live2D and VRM backends
      required_package_fields:
        - backend_kind
        - backend_capability_profile_ref
        - avatar_model_layout
        - provenance
        - compatibility_diagnostics
      allowed_backend_kind_values:
        - live2d
        - vrm
      forbidden_backend_kind_values:
        - sprite2d
        - canvas2d
        - video
      import_targets:
        - avatar
      readiness_issues:
        - avatar_backend_kind_missing_or_unsupported
        - avatar_model_layout_missing_or_invalid
        - avatar_entry_asset_not_in_bundle
        - avatar_required_asset_not_in_bundle
        - backend_capability_profile_ref_missing_or_mismatched
        - avatar_provenance_missing_or_invalid
        - avatar_compatibility_diagnostics_blocking

  avatar_model_layout:
    required_fields:
      - layout_version
      - backend_kind
      - entry_asset_id
      - runtime_root
      - required_asset_ids
    backend_specific:
      live2d:
        required_fields:
          - model3_json_asset_id
          - model3_json_path
        entry_path_rule: entry asset must resolve to a .model3.json file under runtime_root
      vrm:
        required_fields:
          - vrm_asset_id
          - vrm_file_path
        entry_path_rule: entry asset must resolve to a .vrm file under runtime_root
    invariants:
      - backend_kind must match the parent Package backend_kind
      - entry_asset_id must belong to Bundle.memberAssetIds
      - every required_asset_id must belong to Bundle.memberAssetIds
      - runtime_root must be relative, normalized, and non-empty
      - layout paths must not be absolute paths or URLs

  avatar_package_provenance:
    required_fields:
      - source_type
      - source_fingerprint
      - admitted_at
      - validator
    source_type_enum:
      - first_party_curated
      - imported_local_materialization
      - future_reviewed_ugc
    invariants:
      - future_reviewed_ugc is reserved until AM-MOD admission
      - source_fingerprint must be stable across republish for unchanged bytes
      - provenance is package evidence, not Agent Center authority

  media_filters:
    - images
    - videos
    - audio

  bundle:
    required_fields:
      - id
      - ownerId
      - memberAssetIds
      - title
      - description
      - tags
      - version
      - status
      - isReady
      - readinessIssues
      - compatibleApps
      - importTargets
      - createdAt
      - updatedAt
    optional_fields:
      - coverAssetId
      - publishedAt
    ordered_fields:
      - memberAssetIds
    invariants:
      - memberAssetIds count must be >= 1 for ready bundles
      - coverAssetId must belong to memberAssetIds when present
      - memberAssetIds must preserve explicit order
      - publishedAt is required once status becomes published or archived

  package:
    required_fields:
      - id
      - bundleId
      - ownerId
      - title
      - description
      - coverAssetId
      - package_kind
      - category
      - backend_kind
      - backend_capability_profile_ref
      - avatar_model_layout
      - provenance
      - compatibility_diagnostics
      - price
      - version
      - status
      - isReady
      - readinessIssues
      - createdAt
      - updatedAt
    optional_fields:
      - publishedAt
    invariants:
      - package must bind to exactly one bundleId
      - package ownerId must match bundle ownerId
      - a published package must reference a published bundle
      - package_kind must belong to package_kinds.active before a package can be ready or published
      - package_kind-specific required_package_fields must be present before package can be ready or published
      - avatar packages must use backend_kind live2d or vrm
      - avatar-sprite2d-preview remains non-active and cannot be published, acquired, imported, or activated
      - category must belong to categories and remain a market-facing classification
      - package_kind and category must not be inferred from each other
      - price may be 0 for free packages
      - publishedAt is required once status becomes published or archived

  lifecycle:
    bundle_statuses:
      - draft
      - published
      - archived
    package_statuses:
      - draft
      - published
      - archived

  readiness:
    bundle_required_for_ready:
      - ownerId present
      - title
      - version
      - status
      - memberAssetIds count >= 1
      - if coverAssetId exists, coverAssetId belongs to memberAssetIds
    package_required_for_ready:
      - bundleId present
      - ownerId present
      - title present
      - description present
      - coverAssetId present
      - package_kind present and active
      - package_kind-specific fields present and valid
      - category present
      - price present
      - version present
      - status present

  acquisition:
    object: PackageAcquisition
    key_fields:
      - packageId
      - bundleId
      - accountId
      - status
      - sourceType
      - acquiredAt

  import:
    object: BundleImport
    key_fields:
      - bundleId
      - accountId
      - targetApp
      - targetContext
      - status
      - importedAt

  upstream_mappings:
    - SceneCard may be published into a Realm Asset
    - ScenePack may be published into a Realm Bundle
    - Field-level conversion remains intentionally unspecified in the current spec
