schema: nimi.simulator.module/v1
module_id: desktop
composition:
  factory_entry: src/shell/renderer/renderer/factory.tsx
  factory_export: desktopCanonicalRendererFactory
  style_entry: src/shell/renderer/styles.css
renderer:
  entry: src/simulator/renderer.ts
  export: desktopSimulatorRenderer
  adapter_entry: src/simulator/adapter.ts
  adapter_export: desktopSimulatorAdapterFactory
  surfaces:
    - id: main
      factory_surface: main
      label: Nimi Desktop
      initial_route: /
requires:
  kit_capabilities: []
  sdk_methods:
    - nimi.runtime.account.getAccountSessionStatus
    - nimi.runtime.account.beginLogin
    - nimi.runtime.account.completeLogin
    - nimi.runtime.account.logout
  simulator_commands:
    - desktop.auth.begin-login
    - desktop.auth.complete-login
    - desktop.auth.logout
    - desktop.auth.oauth.open
    - desktop.context-projection.request
    - desktop.handoff.request
    - desktop.locale.apply
    - desktop.renderer.timer.fire
  simulator_events:
    - desktop.auth.login.pending
    - desktop.auth.oauth.callback
    - desktop.auth.session.anonymous
    - desktop.auth.session.authenticated
    - desktop.context-projection.requested
    - desktop.handoff.requested
    - desktop.renderer.timer.fired
fixtures:
  conformance: src/simulator/fixture.ts
