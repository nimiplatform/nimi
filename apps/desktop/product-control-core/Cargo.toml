[package]
name = "nimi-desktop-product-control-core"
version = "0.1.0"
edition = "2021"
description = "Desktop-owned first-run product-control core for the Electron host."
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = true, features = ["clock"] }
dirs = "6"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
