[package]
name = "nimi-desktop-product-control-core"
version = "0.1.0"
edition = "2021"
description = "Shared Desktop-owned first-run evidence core for Electron and Tauri shells."
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = true, features = ["clock"] }
dirs = "6"
nimi-shell-tauri = { path = "../../../kit/shell/tauri" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
