# Lookdev — Runtime Account Caller (LD-SHELL-010)
# Authoritative identity used by Lookdev when calling RuntimeAccountService
# (BeginLogin, CompleteLogin, GetAccountSessionStatus, Logout). The caller is
# fixed; runtime owns refresh-token custody and short-lived access-token
# projection (LD-SHELL-011, spec K-ACCSVC-008).

caller:
  app_id: app.nimi.lookdev
  app_instance_id: app.nimi.lookdev.local-first-party
  device_id: local-first-party-device
  mode: ACCOUNT_CALLER_MODE_LOCAL_FIRST_PARTY_APP
  scopes: []

# Notes
# - app_id MUST equal the Tauri identifier (LD-SHELL-001 Standalone App Boundary).
# - app_instance_id MUST be a stable per-install constant. Lookdev runs as a
#   single primary window; there is no multi-window same-process scenario.
# - device_id is informational; runtime admission keys on (app_id, app_instance_id)
#   per runtime/internal/appregistry/registry.go AdmitLocalFirstPartyInstance.
# - mode is fixed to LOCAL_FIRST_PARTY_APP; DESKTOP_LAUNCHED_AVATAR is rejected
#   by runtime helpers as AVATAR_BINDING_ONLY and is not admitted for Lookdev.
