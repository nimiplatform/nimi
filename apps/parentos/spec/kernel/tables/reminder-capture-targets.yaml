schema_version: 1

field_contract:
  target:
    ruleId: { type: string, required: true }
    actionType: { type: enum, required: true, values: [record_data] }
    captureProtocolId: { type: string, required: true }
    targetMetricIds: { type: array, required: true }
    dateDefaultPolicy:
      type: enum
      required: true
      values: [today, scheduledDate, dueDate]
    completionPolicy: { type: string, required: true }

targets:
  - ruleId: PO-REM-OUTD-001
    actionType: record_data
    captureProtocolId: outdoor-goal
    targetMetricIds: [outdoor.weekly_goal_minutes]
    dateDefaultPolicy: today
    completionPolicy: "Complete only after the weekly outdoor goal value is persisted for the child."
  - ruleId: PO-REM-OUTD-002
    actionType: record_data
    captureProtocolId: outdoor-activity
    targetMetricIds: [outdoor.activity_minutes]
    dateDefaultPolicy: today
    completionPolicy: "Complete only after a dated outdoor activity duration is persisted."
  - ruleId: PO-REM-GRO-001
    actionType: record_data
    captureProtocolId: growth-infant-monthly
    targetMetricIds: [growth.height, growth.weight, growth.head_circumference]
    dateDefaultPolicy: scheduledDate
    completionPolicy: "Complete only after one event contains height, weight, and head circumference for the target child."
  - ruleId: PO-REM-GRO-002
    actionType: record_data
    captureProtocolId: growth-child-quarterly
    targetMetricIds: [growth.height, growth.weight]
    dateDefaultPolicy: scheduledDate
    completionPolicy: "Complete only after one event contains height and weight for the target child."
  - ruleId: PO-REM-GRO-003
    actionType: record_data
    captureProtocolId: growth-school-biannual
    targetMetricIds: [growth.height, growth.weight]
    dateDefaultPolicy: scheduledDate
    completionPolicy: "Complete only after one event contains height and weight for the target child."
  - ruleId: PO-REM-FIT-001
    actionType: record_data
    captureProtocolId: fitness-school-assessment
    targetMetricIds: [fitness.run_50m, fitness.vital_capacity]
    dateDefaultPolicy: scheduledDate
    completionPolicy: "Complete only after one school-year fitness assessment event persists at least one admitted fitness metric for the target child."
  - ruleId: PO-REM-FIT-002
    actionType: record_data
    captureProtocolId: fitness-school-assessment
    targetMetricIds: [fitness.run_50m, fitness.standing_long_jump, fitness.sit_and_reach, fitness.rope_skipping]
    dateDefaultPolicy: today
    completionPolicy: "Complete only after one home fitness mini-test event persists at least one admitted fitness metric for the target child."
  - ruleId: PO-REM-TAN-001
    actionType: record_data
    captureProtocolId: tanner-female-self-assessment
    targetMetricIds: [development.tanner_breast_stage, development.tanner_pubic_hair_stage]
    dateDefaultPolicy: scheduledDate
    completionPolicy: "Complete only after one female Tanner self-assessment event persists breast stage and pubic hair stage for the target child."
  - ruleId: PO-REM-TAN-002
    actionType: record_data
    captureProtocolId: tanner-male-self-assessment
    targetMetricIds: [development.tanner_genital_stage, development.tanner_pubic_hair_stage]
    dateDefaultPolicy: scheduledDate
    completionPolicy: "Complete only after one male Tanner self-assessment event persists genital stage and pubic hair stage for the target child."

constraints:
  - "Every actionType=record_data rule in reminder-rules.yaml and reminder-rules-extended.yaml must have exactly one target row here."
  - "Orthodontic protocol actionType=record_data rules are governed by orthodontic-protocols.yaml checkinType bindings and must not be duplicated here."
  - "Every target ruleId must resolve to reminder-rules.yaml with kind=task and actionType=record_data."
  - "Every captureProtocolId must resolve in health-capture-protocols.yaml."
  - "Every targetMetricId must resolve in health-metric-registry.yaml."
  - "Opening the capture modal must not complete the reminder; completion requires the persisted record event to satisfy completionPolicy."
