routes:
  - path: /timeline
    displayName: "成长时间线"
    feature: timeline
    description: "主页。展示今日重点、本周安排、阶段关注和逾期摘要。"
    isDefault: true
    nav: true
    icon: calendar

  - path: /profile
    surfaceKind: health-record-console
    displayName: "成长档案"
    feature: profile
    description: "孩子的完整档案入口。"
    nav: true
    icon: user
    authority: health-record-console-contract.md

  - path: /profile/health/:metricId
    surfaceKind: health-record-metric-detail
    displayName: "健康指标详情"
    feature: profile
    description: "健康指标的通用兜底只读历史详情页；优先使用各领域既有详情页。"
    parent: /profile
    routeKind: detail
    authority: health-record-console-contract.md
    summarySource: health_record_events

  - path: /profile/growth
    surfaceKind: health-record-domain-detail
    displayName: "生长曲线"
    feature: profile
    description: "身高体重头围与其他结构化测量图表。"
    parent: /profile
    routeKind: detail
    authority: health-record-console-contract.md
    summarySource: health_record_events

  - path: /profile/milestones
    surfaceKind: health-record-domain-detail
    displayName: "发育里程碑"
    feature: profile
    description: "发育里程碑达成追踪。"
    parent: /profile
    routeKind: detail
    authority: profile-contract.md
    summarySource: milestone_records

  - path: /profile/vaccines
    surfaceKind: health-record-domain-detail
    displayName: "疫苗记录"
    feature: profile
    description: "疫苗接种记录和计划。"
    parent: /profile
    routeKind: detail
    authority: profile-contract.md
    summarySource: vaccine_records

  - path: /profile/vision
    surfaceKind: health-record-domain-detail
    displayName: "视力档案"
    feature: profile
    description: "视力、验光、眼轴和眼健康记录。"
    parent: /profile
    routeKind: detail
    authority: health-record-console-contract.md
    summarySource: health_record_events

  - path: /profile/dental
    surfaceKind: health-record-domain-detail
    displayName: "口腔发育"
    feature: profile
    description: "牙齿萌出、换牙、龋齿和口腔检查记录。"
    parent: /profile
    routeKind: detail
    authority: profile-contract.md
    summarySource: health_record_events

  - path: /profile/allergies
    surfaceKind: health-record-domain-detail
    displayName: "过敏记录"
    feature: profile
    description: "过敏原追踪、严重程度和状态变化。"
    parent: /profile
    routeKind: detail
    authority: profile-contract.md
    summarySource: allergy_records

  - path: /profile/sleep
    surfaceKind: health-record-domain-detail
    displayName: "睡眠记录"
    feature: profile
    description: "每日睡眠时长、作息规律和睡眠质量。"
    parent: /profile
    routeKind: detail
    authority: health-record-console-contract.md
    summarySource: health_record_events

  - path: /profile/medical-events
    surfaceKind: health-record-domain-detail
    displayName: "就医记录"
    feature: profile
    description: "门诊、住院、筛查、用药和其他医学事件。"
    parent: /profile
    routeKind: detail
    authority: health-record-console-contract.md
    summarySource: health_record_events

  - path: /profile/posture
    surfaceKind: health-record-domain-detail
    displayName: "体态档案"
    feature: profile
    description: "姿态、足弓和身体对齐相关评估。"
    parent: /profile
    routeKind: detail
    authority: profile-contract.md
    summarySource: null

  - path: /profile/tanner
    surfaceKind: health-record-domain-detail
    displayName: "青春期发育"
    feature: profile
    description: "Tanner 分期和青春期发育记录。"
    parent: /profile
    routeKind: detail
    authority: health-record-console-contract.md
    summarySource: health_record_events

  - path: /profile/fitness
    surfaceKind: health-record-domain-detail
    displayName: "体能测评"
    feature: profile
    description: "学校体测和运动能力评估。"
    parent: /profile
    routeKind: detail
    authority: health-record-console-contract.md
    summarySource: health_record_events

  - path: /profile/outdoor
    surfaceKind: health-record-domain-detail
    displayName: "每周户外目标"
    feature: profile
    description: "户外活动记录、每周进度追踪和历史周回顾。"
    parent: /profile
    routeKind: detail
    authority: health-record-console-contract.md
    summarySource: health_record_events

  - path: /profile/report-upload
    displayName: "智能识别"
    feature: profile
    description: "上传本地图像并在家长确认后导入体检数据。"
    parent: /profile
    routeKind: tool
    redirectTarget: /profile

  - path: /journal
    displayName: "观察日记"
    feature: journal
    description: "文字、照片、语音观察记录与 AI 标签建议。"
    nav: true
    icon: book-open

  - path: /observe
    displayName: "专项观察"
    feature: journal
    description: "进入专项观察工作流，记录带维度的结构化观察。"
    parent: /journal
    routeKind: tool

  - path: /reminders
    displayName: "提醒列表"
    feature: timeline
    description: "查看今日重点、本周任务、阶段提醒和提醒历史。"

  - path: /advisor
    displayName: "成长顾问"
    feature: advisor
    description: "基于本地档案和审核知识域的顾问问答。"
    nav: true
    icon: message-circle

  - path: /reports
    displayName: "成长报告"
    feature: reports
    description: "查看和管理结构化与叙事成长报告。"
    nav: true
    icon: bar-chart

  - path: /settings
    displayName: "设置"
    feature: settings
    description: "孩子管理、养育模式、提醒和 AI 设置入口。"
    nav: true
    icon: settings

  - path: /settings/children
    displayName: "孩子管理"
    feature: settings
    description: "添加和编辑孩子档案。"
    parent: /settings

  - path: /settings/nurture-mode
    displayName: "养育模式"
    feature: settings
    description: "全局和按领域的养育模式配置。"
    parent: /settings

  - path: /settings/reminders
    displayName: "提醒管理"
    feature: settings
    description: "查看和管理已自定义频率的提醒。"
    parent: /settings

  - path: /settings/ai
    displayName: "AI 模型设置"
    feature: settings
    description: "配置对话、语音转写和 OCR 等 AI 能力的模型偏好。"
    parent: /settings

constraints:
  - "Exactly one route may have isDefault: true."
  - "Every route registered in routes.tsx must exist here."
  - "Every nav: true route must appear in shell-layout navigation, and no other route may appear there."
  - "Child-route feature values must match the parent route feature."
  - "Orphan or unrouted pages are not authority surfaces until listed here."
  - "Every /profile/* child route must declare routeKind: archive | tool | detail."
  - "archive routes with summarySource must reference a valid local-storage.yaml table name or null."
  - "tool routes must not have summarySource."
  - "/profile/* archive/tool child routes with redirectTarget are retained route shells only; they must redirect to /profile and must not mount independent read/write pages."
  - "/profile/* routes with surfaceKind: health-record-domain-detail are retained rich domain detail surfaces. They may render charts, timeline cards, domain analysis, settings, and record drill-down interactions, but structured health-record writes must route through PO-CAPT or an explicitly retained owner contract."
  - "/profile/health/:metricId is a generic fallback PO-HREC metric detail/history route. Console metric registry detailRoute values must prefer the richer domain detail surface when one exists."
  - "/profile is governed by health-record-console-contract.md as the current health record console, not by the retired archive-section grid."
  - "/profile and /profile/* routes must not own independent add-data write paths after PO-CAPT admission; structured writes enter through capture-orchestrator-contract.md."
