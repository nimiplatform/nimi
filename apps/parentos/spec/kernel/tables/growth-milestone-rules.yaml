  - ruleId: growth-milestone-percentile-shift-up
    kind: percentile_shift
    appliesToMetricIds: [growth.height, growth.weight]
    triggerCondition:
      type: percentile_shift
      minMagnitudePoints: 5
      direction: upward
      evidenceWindowMonths: 12
    titleTemplate: "从 P{startPercentile} 升至 P{endPercentile}"
    deltaMagnitudeTemplate: "↑{magnitudePoints}"
    deltaUnitLabel: "PCT · 跃升"
  - ruleId: growth-milestone-percentile-shift-down
    kind: percentile_shift
    appliesToMetricIds: [growth.height, growth.weight]
    triggerCondition:
      type: percentile_shift
      minMagnitudePoints: 5
      direction: downward
      evidenceWindowMonths: 12
    titleTemplate: "从 P{startPercentile} 降至 P{endPercentile}"
    deltaMagnitudeTemplate: "↓{magnitudePoints}"
    deltaUnitLabel: "PCT · 回落"
  - ruleId: growth-milestone-measurement-density-spike
    kind: measurement_density
    appliesToMetricIds: [growth.height, growth.weight, growth.head_circumference]
    triggerCondition:
      type: measurement_density
      windowDays: 1
      minCount: 5
      evidenceWindowMonths: 3
    titleTemplate: "近三个月密集测量"
    deltaMagnitudeTemplate: "{count}"
    deltaUnitLabel: "条 · 测量"
