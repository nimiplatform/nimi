schema_version: 3

field_contract:
  asset:
    assetId: { type: string, required: true }
    path: { type: string, required: true }
    storageModel: { type: enum, required: true, values: [directory_backed_asset] }
    format: { type: enum, required: true, values: [json] }
    authorityClass:
      type: enum
      required: true
      values: [reference_dataset, curated_knowledge_asset, design_asset]
    ownerContract: { type: string, required: true }
    assetContract: { type: string, required: true }
    generatedModule: { type: string, required: false }
    runtimeProjectionAdmission: { type: string, required: false }
    updatePolicy: { type: string, required: true }

assets:
  - assetId: growth-standards
    path: apps/parentos/data/knowledge/assets/growth-standards/asset.json
    storageModel: directory_backed_asset
    format: json
    authorityClass: reference_dataset
    ownerContract: profile-contract.md#PO-PROF-004
    assetContract: knowledge-asset-contract.md#PO-KNOW-001
    generatedModule: growth-standards.gen.ts
    updatePolicy: "External clinical/growth reference data. Spec owns schema, source attribution, fail-close behavior, and evaluator binding; the asset body owns numeric/reference content."
  - assetId: milestone-catalog
    path: apps/parentos/data/knowledge/assets/milestone-catalog/asset.json
    storageModel: directory_backed_asset
    format: json
    authorityClass: curated_knowledge_asset
    ownerContract: profile-contract.md#PO-PROF-007
    assetContract: knowledge-asset-contract.md#PO-KNOW-001
    generatedModule: milestone-catalog.gen.ts
    updatePolicy: "Curated developmental milestone content. Spec owns ID stability and consumption rules; the asset body owns catalog content and age windows."
  - assetId: sensitive-periods
    path: apps/parentos/data/knowledge/assets/sensitive-periods/asset.json
    storageModel: directory_backed_asset
    format: json
    authorityClass: curated_knowledge_asset
    ownerContract: timeline-contract.md#PO-TIME-006
    assetContract: knowledge-asset-contract.md#PO-KNOW-001
    generatedModule: sensitive-periods.gen.ts
    updatePolicy: "Curated sensitive-period content. Spec owns direct-lookup behavior and safety boundary; the asset body owns period content."
  - assetId: observation-framework
    path: apps/parentos/data/knowledge/assets/observation-framework/asset.json
    storageModel: directory_backed_asset
    format: json
    authorityClass: curated_knowledge_asset
    ownerContract: journal-contract.md#PO-JOUR-006
    assetContract: knowledge-asset-contract.md#PO-KNOW-001
    generatedModule: observation-framework.gen.ts
    updatePolicy: "Curated observation dimensions and quick tags. Spec owns closed-set tagging behavior; the asset body owns dimension content."
  - assetId: ability-model
    path: apps/parentos/data/knowledge/assets/ability-model/asset.json
    storageModel: directory_backed_asset
    format: json
    authorityClass: design_asset
    ownerContract: app-shell-contract.md#PO-SHELL-011
    assetContract: knowledge-asset-contract.md#PO-KNOW-001
    updatePolicy: "Non-frozen design asset. It may support future product design but must not be treated as stable runtime authority without admission."

constraints:
  - "Spec contracts own dataset schemas, admission gates, source attribution, safety boundaries, and fail-close behavior."
  - "Reference data assets own concrete numeric/reference/content values and must not create product behavior outside their owner contract."
  - "Active asset paths point to directory-backed asset manifests. Old top-level data/knowledge/<assetId>.json files are not admitted."
  - "Directory-backed manifests must follow knowledge-asset-contract.md, including schemaVersion, contentVersion, provenance, review state, sections, ordering, schema.json, cross-reference integrity, and projection fingerprinting."
  - "authorityClass=design_asset must not declare generatedModule or enter runtime without runtimeProjectionAdmission pointing to an admitted spec anchor."
  - "Unreferenced shards, direct JSON reads outside the admitted asset kernel, and generated-as-authority posture are fail-close violations after the atomic cut."
  - "Generated runtime constants must be produced from admitted spec plus admitted data assets; generated files must not be hand-edited."
  - "A health evaluator must fail closed or return an admitted non-scored status when a referenced data asset is missing, malformed, stale, or outside declared coverage."
