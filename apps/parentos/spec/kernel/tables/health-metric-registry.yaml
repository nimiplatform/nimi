constraints:
  - "metricId values are stable and may not be renamed without a hard-cut authority decision."
  - "Every metric referenced by a capture protocol, reminder capture target, or console row must appear in this file."
  - "Derived metrics must list no manual capture protocol unless a future authority explicitly admits parent-entered derived values."
  - "A UI component must not define metric metadata locally."
