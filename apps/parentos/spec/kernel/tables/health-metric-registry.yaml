schema_version: 1

field_contract:
  metric:
    metricId: { type: string, required: true }
    groupId: { type: string, required: true }
    displayName: { type: string, required: true }
    unit: { type: string, required: false }
    precision: { type: integer, required: false }
    valueShape:
      type: enum
      required: true
      values: [number, enum, boolean, text, date, duration, composite, event]
    valueCardinality:
      type: enum
      required: true
      values: [single, left_right_pair, multi_metric_set, event_payload]
    recordKind:
      type: enum
      required: true
      values: [measurement, assessment, event, status_timeline, config, derived]
    captureProtocolIds: { type: array, required: true }
    evaluationPolicyRef: { type: string, required: false }
    freshnessPolicyRef: { type: string, required: false }
    detailRoute: { type: string, required: false }
    sourceSupport:
      type: array
      required: true
      values: [manual, ocr, imported, reminder, derived]
    safetyClass:
      type: enum
      required: true
      values: [descriptive, professional_review_prompt, no_evaluation]
    applicableAgeRange:
      type: object
      required: false
      fields:
        startMonths: { type: integer, required: true }
        endMonths: { type: integer, required: true }
    applicableSex:
      type: enum
      required: false
      values: [male, female, both]

groups:
  - groupId: growth
    displayName: Growth
    rank: 10
  - groupId: vision
    displayName: Vision Health
    rank: 20
  - groupId: fitness
    displayName: Fitness
    rank: 30
  - groupId: sleep
    displayName: Sleep
    rank: 40
  - groupId: outdoor
    displayName: Outdoor
    rank: 50
  - groupId: vaccine
    displayName: Vaccines
    rank: 60
  - groupId: dental
    displayName: Dental
    rank: 70
  - groupId: medical
    displayName: Medical Events
    rank: 80
  - groupId: development
    displayName: Development
    rank: 90

