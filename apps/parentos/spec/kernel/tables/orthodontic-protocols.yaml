apiVersion: nimi.spec/v1
kind: OrthodonticProtocolCatalog
description: >
  Authoritative catalogue of admitted orthodontic dynamic reminder rules and
  daily-compliance checkin types. This is the SOLE spec home for orthodontic
  protocol ruleIds. Runtime code must NOT synthesize new ruleIds outside this
  file (PO-ORTHO-001 fail-close invariant).

schema:
  caseType:
    type: enum
    required: true
    values: [early-intervention, fixed-braces, clear-aligners, unknown-legacy]
    notes: >
      `unknown-legacy` is a MIGRATION-ONLY transitional value. It is produced
      by migration v9 for children whose pre-contract dental_records contained
      `ortho-start` rows. Runtime (insert_orthodontic_case / update_orthodontic_case)
      MUST reject `unknown-legacy` on write so only the migration can author it;
      the UI must expose these as "待确认历史疗程" and require the parent to
      re-classify them to one of the three primary types. Protocol reminder
      seeding MUST NOT run for `unknown-legacy` cases until re-classified.
  stage:       { type: enum, required: true, values: [assessment, planning, active, retention, completed] }
  applianceType:
    type: enum
    required: true
    values:
      - twin-block
      - expander
      - activator
      - metal-braces
      - ceramic-braces
      - clear-aligner
      - retainer-fixed
      - retainer-removable
  applianceStatus: { type: enum, required: true, values: [active, paused, completed] }

  currentPhase:
    type: string
    required: false
    notes: >
      Per-appliance treatment phase (PO-ORTHO-013). When non-null it MUST be a
      `phaseId` admitted for the row's `applianceType` in `appliancePhases`
      below. NULL = "phase not yet set" (admitted intermediate state). Paired
      with `phaseStartedAt`: both NULL or both set.

  activationIntervalDays:
    type: integer
    required: false
    notes: >
      Expander-only per-appliance activation-turn cadence in days (PO-ORTHO-014).
      Overrides `PO-ORTHO-EXPANDER-ACTIVATION#defaultIntervalDays` for both the
      reminder next-trigger and the UI "下次转动" projection. MUST be NULL for
      every non-expander appliance type; MUST be positive for `expander` when set.

  nextReviewAgenda:
    type: string
    required: false
    notes: >
      Parent-entered free-text describing what the appliance's next review visit
      is for (PO-ORTHO-015). Never AI-generated. Out of scope for any AI prompt.

  # v1 compliance is a per-CYCLE continuous projection derived from wear-gap
  # intervals (see PO-ORTHO-008). There is no daily bucket. The legacy
  # `complianceThresholds` table is retired in v15 along with `wear-daily`.
  cycleProjection:
    formula: >
      cycleNetWearHours = max(0, (now − cycleAnchor) − Σ closed_gap_hours_in_cycle
                          − open_gap_hours_in_cycle_so_far)
      cycleTargetHours  = daysPerAligner × prescribedHoursPerDay (default 22)
      predictedSwitchDate = cycleAnchor + (cycleTargetHours / netWearRate) days
    note: >
      Cycle math runs in the Rust command layer and the renderer derive module.
      UI wording must be cycle-relative ("本副已净戴 X / Y 小时", "下次换套预计
      M/D（推后 N 天）"), never daily-bucket ("达成 / 部分 / 缺席"). PO-ORTHO-008.

  pauseSemantics:
    level: appliance            # pause is an appliance-level status, never a case-level status
    cascade: rules-only         # when an appliance pauses its protocol reminders dismiss; the case stays active

  nextReviewDateDerivation:
    source: "min(active appliances.nextReviewDate)"
    persistence: "orthodontic_cases.nextReviewDate is a cached projection only; appliances remain the source of truth"

# Minimum child age in months for each appliance type (early intervention gate).
# Reminder surfaces must not propose or activate an appliance under its minAge.
applianceMinAge:
  twin-block:          48
  expander:            48
  activator:           48
  metal-braces:        84
  ceramic-braces:      84
  clear-aligner:       84
  retainer-fixed:      84
  retainer-removable:  84

# Per-appliance treatment-phase sequences (PO-ORTHO-013). Each applianceType has
# a clinically-ordered list of phases; `orthodontic_appliances.currentPhase`
# stores one `phaseId` from its type's sequence (or NULL = not yet set).
# Each entry is `{ phaseId, label, description, expectedMonths }`:
# - `label` is the short phase name shown on the appliance card pill.
# - `description` is a one-sentence plain-language explanation for parents,
#   surfaced in the phase-set / phase-advance dialog so a non-clinical reader
#   understands what the phase means. It is descriptive only — it states what
#   the phase IS, never prescribes wear behavior or asserts efficacy
#   (PO-ORTHO-010 boundary). Human-authored static catalog text, never AI-generated.
# - `expectedMonths` is a typical-duration projection for the per-appliance month
#   counter — never a hard deadline, never a "落后" verdict source (PO-ORTHO-010).
# Phase transitions are parent-initiated and adjacency-only
# (advance_orthodontic_appliance_phase). phaseId values are stable identifiers;
# renaming or removing one is a breaking change requiring a data migration.
appliancePhases:
  expander:
    - phaseId: widening
      label: "加力扩弓"
      description: "按医嘱定期加力，逐步把过窄的牙弓扩开。"
      expectedMonths: 3
    - phaseId: holding
      label: "保持稳定"
      description: "停止加力，让扩开的牙弓在原位保持，等待骨质长稳。"
      expectedMonths: 6
  twin-block:
    - phaseId: functional
      label: "功能导下颌"
      description: "矫治器引导下颌向前生长，改善上下颌的位置关系。"
      expectedMonths: 9
    - phaseId: settling
      label: "咬合稳定"
      description: "下颌位置基本到位后，让新的咬合关系逐渐稳定下来。"
      expectedMonths: 3
  activator:
    - phaseId: functional
      label: "功能导下颌"
      description: "矫治器引导下颌向前生长，改善上下颌的位置关系。"
      expectedMonths: 9
    - phaseId: settling
      label: "咬合稳定"
      description: "下颌位置基本到位后，让新的咬合关系逐渐稳定下来。"
      expectedMonths: 3
  metal-braces:
    - phaseId: leveling
      label: "排齐整平"
      description: "用弓丝把拥挤、高低不齐的牙齿先排齐、整平。"
      expectedMonths: 8
    - phaseId: space-closure
      label: "关闭间隙"
      description: "逐步关闭拔牙或牙缝留下的空隙。"
      expectedMonths: 6
    - phaseId: finishing
      label: "咬合精调"
      description: "对每颗牙的位置和上下咬合做精细调整。"
      expectedMonths: 4
    - phaseId: debond-prep
      label: "拆机准备"
      description: "效果达标后，准备拆除矫治器并转入保持期。"
      expectedMonths: 2
  ceramic-braces:
    - phaseId: leveling
      label: "排齐整平"
      description: "用弓丝把拥挤、高低不齐的牙齿先排齐、整平。"
      expectedMonths: 8
    - phaseId: space-closure
      label: "关闭间隙"
      description: "逐步关闭拔牙或牙缝留下的空隙。"
      expectedMonths: 6
    - phaseId: finishing
      label: "咬合精调"
      description: "对每颗牙的位置和上下咬合做精细调整。"
      expectedMonths: 4
    - phaseId: debond-prep
      label: "拆机准备"
      description: "效果达标后，准备拆除矫治器并转入保持期。"
      expectedMonths: 2
  clear-aligner:
    - phaseId: active-series
      label: "主动序列"
      description: "按医嘱依次佩戴每一副牙套，把牙齿逐步移动到目标位置。"
      expectedMonths: 12
    - phaseId: refinement
      label: "精调序列"
      description: "主体排齐后，用补充牙套对个别牙齿做最后微调。"
      expectedMonths: 3
  retainer-fixed:
    - phaseId: stabilizing
      label: "稳定保持期"
      description: "矫治刚结束、牙齿仍易移动，靠固定保持器维持效果。"
      expectedMonths: 12
    - phaseId: long-term
      label: "长期保持期"
      description: "牙齿位置趋于稳定，进入长期维持阶段。"
      expectedMonths: 24
  retainer-removable:
    - phaseId: full-time
      label: "全日佩戴"
      description: "除进食、刷牙外全天佩戴保持器，巩固矫治效果。"
      expectedMonths: 6
    - phaseId: night-time
      label: "夜间佩戴"
      description: "牙齿趋于稳定后，改为仅夜间睡觉时佩戴。"
      expectedMonths: 12
    - phaseId: intermittent
      label: "间歇佩戴"
      description: "牙齿长期稳定后，按医嘱每周佩戴若干晚。"
      expectedMonths: 24

# Admitted dynamic reminder rules emitted by the protocol catalog compiler.
# ruleId stability contract: these IDs persist into reminder_states, so
# renaming or removing an admitted id is a breaking change and requires a
# data migration.
#
# Binding: every admitted ruleId below must also appear in the compiled
# REMINDER_RULES catalog consumed by the reminder engine (PO-TIME-007
# unknown-ruleId fail-close). The knowledge-base compile step unions
# reminder-rules.yaml and orthodontic-protocols.yaml#rules into one catalog.
rules:
  # ── Active protocol rules (case.stage=active) ──────────────────────────

  - ruleId: PO-ORTHO-UNWEAR-OPEN
    applianceTypes: [clear-aligner, twin-block, activator, retainer-removable]
    domain: dental
    title: "未戴时间过长"
    description: "您可能忘记戴回牙套。已未戴超过 4 小时——长时间不戴会影响治疗节奏，建议尽快戴回。"
    priority: P1
    actionType: record_data
    cadence: event_driven
    triggerWhen: "open_unwear_interval_age >= 4h"
    completeWhen: "unwear_interval.endAt is set OR interval is deleted"
    nurtureMode: { relaxed: push, balanced: push, advanced: push }
    source: "AAO-2023 removable-appliance wear protocol; reframed for desktop client"
    # Event-driven, not cadence-driven. NOT seeded at appliance creation;
    # written by `insert_unwear_interval` when a new open interval is created
    # (stateId = "ortho-unwear-{intervalId}", nextTriggerAt = startAt + 4h).
    # Closed by `close_unwear_interval` / `delete_unwear_interval`.
    # Replaces the retired PO-ORTHO-WEAR-DAILY and PO-ORTHO-RETENTION-WEAR
    # daily-push rules (see PO-ORTHO-005b).

  - ruleId: PO-ORTHO-ALIGNER-CHANGE
    applianceTypes: [clear-aligner]
    domain: dental
    title: "更换下一副牙套"
    description: "按医嘱更换下一副隐形牙套。"
    priority: P1
    actionType: record_data
    cadence: per-stage
    checkinType: aligner-change
    defaultIntervalDays: 14
    nurtureMode: { relaxed: push, balanced: push, advanced: push }
    source: "AAO-2023 aligner-change protocol"

  - ruleId: PO-ORTHO-EXPANDER-ACTIVATION
    applianceTypes: [expander]
    domain: dental
    title: "扩弓器加力"
    description: "按医嘱对扩弓器加力。达到设定总激活次数后自动停止提醒。"
    priority: P1
    actionType: record_data
    cadence: interval
    checkinType: expander-activation
    defaultIntervalDays: 1
    intervalOverrideField: activationIntervalDays
    stopWhen: "completedActivations >= prescribedActivations"
    nurtureMode: { relaxed: push, balanced: push, advanced: push }
    source: "AAO-2023 expander protocol"
    # PO-ORTHO-014: when the appliance row has a non-null
    # `activationIntervalDays`, it overrides `defaultIntervalDays` for both the
    # reminder next-trigger computation and the UI "下次转动" projection.

  - ruleId: PO-ORTHO-REVIEW-FIXED
    applianceTypes: [metal-braces, ceramic-braces]
    domain: dental
    title: "固定矫治器复诊"
    description: "按医嘱前往正畸机构复诊、调整弓丝或更换结扎。"
    priority: P1
    actionType: go_hospital
    cadence: interval
    defaultIntervalDays: 28
    writesToDentalRecord: ortho-adjustment
    nurtureMode: { relaxed: push, balanced: push, advanced: push }
    source: "AAO-2023 fixed-appliance adjustment cadence"

  - ruleId: PO-ORTHO-REVIEW-ALIGNER
    applianceTypes: [clear-aligner]
    domain: dental
    title: "隐形牙套复诊"
    description: "按医嘱前往正畸机构复诊、领取下一阶段牙套。"
    priority: P1
    actionType: go_hospital
    cadence: interval
    defaultIntervalDays: 56
    writesToDentalRecord: ortho-review
    nurtureMode: { relaxed: push, balanced: push, advanced: push }
    source: "AAO-2023 aligner review cadence"

  - ruleId: PO-ORTHO-REVIEW-INTERCEPTIVE
    applianceTypes: [twin-block, expander, activator]
    domain: dental
    title: "早期矫治复诊"
    description: "按医嘱前往正畸机构复查，评估下一阶段装置方案。"
    priority: P1
    actionType: go_hospital
    cadence: interval
    defaultIntervalDays: 42
    writesToDentalRecord: ortho-review
    nurtureMode: { relaxed: push, balanced: push, advanced: push }
    source: "AAO-2023 interceptive-orthodontics cadence"

  # ── Retention protocol rules (case.stage=retention) ────────────────────
  # Daily wear is now event-driven via PO-ORTHO-UNWEAR-OPEN above; retention
  # appliances share the same wear-gap stream as active-phase appliances.

  - ruleId: PO-ORTHO-RETENTION-REVIEW
    applianceTypes: [retainer-fixed, retainer-removable]
    domain: dental
    title: "保持期复查"
    description: "按医嘱前往正畸机构复查保持效果与咬合稳定性。"
    priority: P2
    actionType: go_hospital
    cadence: interval
    defaultIntervalDays: 180
    writesToDentalRecord: ortho-review
    nurtureMode: { relaxed: push, balanced: push, advanced: push }
    source: "AAO-2023 retention follow-up"

# Dental follow-up protocols (non-orthodontic). These replace the old
# synthetic "dental-auto-*" ruleIds produced by the dental form. They are
# spec-backed, static-id rules emitted into the same compiled catalog.
dentalFollowUpRules:
  - ruleId: PO-DEN-FOLLOWUP-CLEANING
    domain: dental
    title: "定期洁牙复诊"
    description: "按临床建议每 6 个月进行一次口腔洁治与检查。"
    intervalMonths: 6
    priority: P2
    actionType: go_hospital
    nurtureMode: { relaxed: silent, balanced: push, advanced: push }
    triggeredBy: { dentalEventType: cleaning }
    source: "NHC-stomatology-2023"

  - ruleId: PO-DEN-FOLLOWUP-FLUORIDE
    domain: dental
    title: "涂氟复查"
    description: "按临床建议每 6 个月进行一次涂氟，直到恒牙列完成。"
    intervalMonths: 6
    priority: P2
    actionType: go_hospital
    nurtureMode: { relaxed: silent, balanced: push, advanced: push }
    triggeredBy: { dentalEventType: fluoride }
    source: "AAPD-2023"

  - ruleId: PO-DEN-FOLLOWUP-SEALANT
    domain: dental
    title: "窝沟封闭复查"
    description: "封闭后约 12 个月复查封闭剂完整性。"
    intervalMonths: 12
    priority: P2
    actionType: go_hospital
    nurtureMode: { relaxed: silent, balanced: push, advanced: push }
    triggeredBy: { dentalEventType: sealant }
    source: "AAPD-2023"

  - ruleId: PO-DEN-FOLLOWUP-FILLING
    domain: dental
    title: "补牙后复查"
    description: "龋齿充填后约 6 个月复查补料边缘与继发龋。"
    intervalMonths: 6
    priority: P2
    actionType: go_hospital
    nurtureMode: { relaxed: silent, balanced: push, advanced: push }
    triggeredBy: { dentalEventType: filling }
    source: "AAPD-2023"

  - ruleId: PO-DEN-FOLLOWUP-CHECKUP
    domain: dental
    title: "口腔常规检查"
    description: "按临床建议每 6 个月进行一次口腔检查。"
    intervalMonths: 6
    priority: P2
    actionType: go_hospital
    nurtureMode: { relaxed: silent, balanced: push, advanced: push }
    triggeredBy: { dentalEventType: checkup }
    source: "NHC-stomatology-2023"

# Checkin discriminator: only these two values are admitted in
# orthodontic_checkins.checkinType. All other orthodontic-lifecycle events
# (review, adjustment, issue, end) write to dental_records instead.
admittedCheckinTypes:
  - aligner-change
  - expander-activation

# AI boundary for orthodontic summaries.
aiBoundary:
  allowed:
    - fact-restatement of recorded cases, appliances, and checkin counts
    - descriptive trend wording ("observed", "recorded", "this week vs last")
    - compliance-bucket wording that matches complianceThresholds verbatim
  forbidden:
    - treatment recommendation of any kind
    - efficacy inference ("treatment is working", "bite is improving")
    - wear-time prescriptions ("should increase wear", "please wear more")
    - comparative ranking against other children
    - diagnosis language

constraints:
  - "Every ruleId in rules[] and dentalFollowUpRules[] must round-trip into the compiled REMINDER_RULES catalog."
  - "Runtime code must not synthesize ruleIds outside this file; PO-TIME-007 fail-close enforces this."
  - "applianceMinAge keys must match the applianceType enum exactly."
  - "appliancePhases keys must match the applianceType enum exactly (every type has a sequence; no extra keys)."
  - "phaseId values must be unique within each applianceType sequence; renaming or removing a phaseId is a breaking change."
  - "every appliancePhases entry must carry a non-empty label, description, and positive expectedMonths."
  - "orthodontic_appliances.currentPhase, when non-null, must be a phaseId from that row's applianceType sequence (PO-ORTHO-013)."
  - "orthodontic_appliances.activationIntervalDays is expander-only and must be NULL for every other applianceType (PO-ORTHO-014)."
  - "admittedCheckinTypes must match orthodontic_checkins.checkinType SQLite column semantics exactly."
  - "pauseSemantics.level must remain 'appliance'; any attempt to introduce case-level pause is a contract violation."
