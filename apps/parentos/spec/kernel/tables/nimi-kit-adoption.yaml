forbidden_patterns:
  - id: parentos.no_page_style_visual_authority
    scope: apps/parentos/src/shell/renderer
    pattern: from\s+['"][^'"]*page-style(?:\.js)?['"]|\bS\.
    reason: ParentOS kit consumption authority lives in this app-local manifest and
      kit primitives, not app-shell/page-style visual constants.
    source_rule: P-DESIGN-020
  - id: parentos.no_page_style_s_export
    scope: apps/parentos/src/shell/renderer/app-shell/page-style.ts
    pattern: \bexport\s+const\s+S\b
    reason: The S visual facade is a retired app-local shared design truth.
    source_rule: P-DESIGN-020
  - id: parentos.no_inline_backdrop_filter
    scope: apps/parentos/src/shell/renderer
    pattern: "backdropFilter\\s*:|backdrop-filter\\s*:"
    reason: Glass material must resolve through Surface material classes and kit
      material tokens.
    source_rule: P-DESIGN-022
  - id: parentos.no_root_color_authority
    scope: apps/parentos/src/shell/renderer/styles.css
    pattern: ":root\\s*\\{[\\s\\S]*--color-[a-z0-9-]+\\s*:"
    reason: ParentOS renderer CSS must not define a root --color-* token registry.
    source_rule: P-DESIGN-007
  - id: parentos.no_visual_constant_facades
    scope: apps/parentos/src/shell/renderer
    pattern: \b(?:export\s+)?const\s+[A-Z0-9_]*(?:VISUAL|STYLE|COLORS|COLOR|TOKENS)[A-Z0-9_]*\s*=[\s\S]{0,1600}(?:#[0-9a-fA-F]{3,8}\b|rgba?\()
    reason: ParentOS visual constants for shared families must move to kit tokens or
      app-local domain semantics without becoming shared primitive truth.
    source_rule: P-DESIGN-019
  - id: parentos.profile_detail_outer_shell_must_use_profile_detail_shell
    scope: apps/parentos/src/shell/renderer/features/profile
    pattern: "pt-\\[72px\\]"
    reason: Detail-page outer shell must consume the admitted ParentOS
      `ProfileDetailShell` or `GenericMetricDetailShell` (which compose kit
      `PageDetailLayout`, the single owner of the `pt-[72px]` token). Direct
      `pt-[72px]` in any profile-feature file indicates a hand-rolled detail
      shell bypass.
    source_rule: P-DESIGN-020
  - id: parentos.no_handrolled_overlay_backdrop
    scope: apps/parentos/src/shell/renderer
    pattern: "fixed\\s+inset-0"
    reason: ParentOS overlays must converge on OverlayShell per P-DESIGN-013
      and PO-KITUI-005. Existing local-shell and inline-backdrop matches are
      recorded as a Wave 2 migration baseline; new or increased matches fail.
    source_rule: P-DESIGN-013
    allowed_matches:
      - { path: apps/parentos/src/shell/renderer/features/journal/journal-page-overlays.tsx, count: 2 }
      - { path: apps/parentos/src/shell/renderer/features/journal/journal-sub-components.tsx, count: 1 }
      - { path: apps/parentos/src/shell/renderer/features/profile/dental-photo-lightbox.tsx, count: 1 }
      - { path: apps/parentos/src/shell/renderer/features/profile/health-record-modal-shell.tsx, count: 1 }
      - { path: apps/parentos/src/shell/renderer/features/profile/orthodontic-stage-confirm-dialog.tsx, count: 1 }
      - { path: apps/parentos/src/shell/renderer/features/profile/orthodontic-unwear-form.tsx, count: 1 }
      - { path: apps/parentos/src/shell/renderer/features/profile/profile-todo-drawer.tsx, count: 1 }
      - { path: apps/parentos/src/shell/renderer/features/profile/report-upload-page.tsx, count: 1 }
      - { path: apps/parentos/src/shell/renderer/features/reminders/reminder-explain-drawer.tsx, count: 1 }
      - { path: apps/parentos/src/shell/renderer/features/settings/avatar-crop-modal.tsx, count: 1 }
