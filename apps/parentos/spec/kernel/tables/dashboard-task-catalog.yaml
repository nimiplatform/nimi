version: 1

# Dashboard Task Catalog
#
# Authority surface for the ParentOS dashboard task orchestration projection
# governed by `apps/parentos/spec/kernel/timeline-contract.md#PO-TIME-010`.
# Wave-1 admitted the schema; wave-2 admits the first batch of rows. Later
# waves may extend the row set as additional capture protocols, observation
# dimensions, and reviewed micro-action content sources land.
#
# Owner contracts referenced by rows MUST be one of:
#   - apps/parentos/spec/kernel/timeline-contract.md
#   - apps/parentos/spec/kernel/reminder-interaction-contract.md
#   - apps/parentos/spec/kernel/capture-orchestrator-contract.md
#   - apps/parentos/spec/kernel/journal-contract.md
#   - apps/parentos/spec/kernel/orthodontic-contract.md
#
# Rows MUST NOT duplicate reminder-rules.yaml, orthodontic-protocols.yaml, or
# custom_todos truth. Rows of family=must-do reference existing reminder rules
# via ownerContract; they do not redefine reminder eligibility.

field_contract:
  taskId:
    type: string
    required: true
    description: "Readable kebab-case id for the catalog row (e.g. `dashboard-maintain-growth-infant`). Convention mirrors `reminder-rules.yaml#ruleId` / `feature-matrix.yaml#featureId`; ULIDs are not used because catalog rows are static authoritative spec rows, not user-created records."
  family:
    type: enum
    values: [must-do, maintain, observe, connect]
    required: true
    description: "Task family per timeline-contract#PO-TIME-010. personal family is owned by custom_todos and is not admitted in this catalog."
  ownerContract:
    type: string
    required: true
    description: "Path to the admitted owner contract. Must resolve to one of the admitted ParentOS kernel contracts."
  cadencePolicy:
    type: enum
    values: [anchor, interval, windowed]
    required: true
    description: "anchor = anchored to a child biological date such as birth-day-of-month; interval = fixed recurring interval; windowed = active inside named monthly window."
  biologicalAnchor:
    type: enum
    values: [birthDayOfMonth, none]
    required: true
    description: "Whether the row anchors on the child's birth-day-of-month."
  slotPreference:
    type: enum
    values: [weekend-heavy, weekday-evening-light, hard-time]
    required: true
    description: "Preferred slot for dashboard surfacing."
  dispersionWindow:
    type: enum
    values: [week-1, week-2, week-3, week-4, rolling]
    required: true
    description: "Monthly window for dispersion. rolling = no monthly window."
  mutualExclusionGroup:
    type: string
    required: false
    description: "Optional group key for same-day mutual exclusion. Rows that share a value compete for the day's surface slot."
  displayWindowDays:
    type: integer
    required: true
    description: "Number of days the row remains in the main dashboard list once eligible."
  snoozeDefaultDays:
    type: integer
    required: true
    description: "Default snooze duration in days when the parent defers the task."
  decayStrategy:
    type: enum
    values: [low-disturbance-downgrade, resurface-next-cycle]
    required: true
    description: "How an ignored eligible row exits the main dashboard list."
  metricIdRefs:
    type: array
    required: false
    description: "References into health-metric-registry.yaml. Required when family=maintain has structured persistence."
  captureProtocolIdRef:
    type: string
    required: false
    description: "Reference into health-capture-protocols.yaml. Required when family=maintain."
  observationDimensionRef:
    type: string
    required: false
    description: "Reference into reference-data-assets.yaml#observation-framework. Required when family=observe and the row creates journal evidence with a structured dimension."
  microActionContentRef:
    type: string
    required: false
    description: "Reference into knowledge-source-readiness.yaml#domain. Required when family=connect. The referenced domain row must be status=reviewed (see reminder-interaction-contract.md#PO-REMI-014)."
  featureId:
    type: string
    required: true
    description: "Reference into feature-matrix.yaml. Typically PO-FEAT-056."

constraints:
  - "taskId must be unique across all rows."
  - "family=maintain rows must populate captureProtocolIdRef and at least one metricIdRefs entry."
  - "family=connect rows must populate microActionContentRef AND the referenced knowledge-source-readiness.yaml row must be status=reviewed (reminder-interaction-contract.md#PO-REMI-014 fail-close)."
  - "family=observe rows must populate observationDimensionRef OR remain projection-only with no structured capture target."
  - "family=must-do rows must point at existing reminder-rules.yaml / orthodontic-protocols.yaml authority via ownerContract; this catalog must not duplicate those rules."
  - "ownerContract must resolve to an admitted ParentOS kernel contract path."
  - "Rows must not weaken the PO-TIME-003 P0 delivery invariant. A row whose dispersion or mutual-exclusion semantics would suppress a P0 reminder is a PO-TIME-010 fail-close violation."
  - "Rows must not recompute PO-HREC freshness locally; freshness must be consumed from the PO-HREC-006 snapshot."
  - "Wave-1 admitted the schema. Wave-2 admits the first batch of rows below. Subsequent waves may extend the catalog as additional capture protocols, observation dimensions, or reviewed micro-action content sources land."

rows:
  - taskId: dashboard-maintain-growth-infant
    family: maintain
    ownerContract: apps/parentos/spec/kernel/timeline-contract.md
    cadencePolicy: anchor
    biologicalAnchor: birthDayOfMonth
    slotPreference: weekend-heavy
    dispersionWindow: rolling
    mutualExclusionGroup: profile-maintenance
    displayWindowDays: 5
    snoozeDefaultDays: 3
    decayStrategy: low-disturbance-downgrade
    metricIdRefs: [growth.height, growth.weight, growth.head_circumference]
    captureProtocolIdRef: growth-infant-monthly
    featureId: PO-FEAT-056

  - taskId: dashboard-maintain-growth-child
    family: maintain
    ownerContract: apps/parentos/spec/kernel/timeline-contract.md
    cadencePolicy: anchor
    biologicalAnchor: birthDayOfMonth
    slotPreference: weekend-heavy
    dispersionWindow: rolling
    mutualExclusionGroup: profile-maintenance
    displayWindowDays: 5
    snoozeDefaultDays: 3
    decayStrategy: low-disturbance-downgrade
    metricIdRefs: [growth.height, growth.weight]
    captureProtocolIdRef: growth-child-quarterly
    featureId: PO-FEAT-056

  - taskId: dashboard-maintain-sleep
    family: maintain
    ownerContract: apps/parentos/spec/kernel/timeline-contract.md
    cadencePolicy: interval
    biologicalAnchor: none
    slotPreference: weekday-evening-light
    dispersionWindow: rolling
    mutualExclusionGroup: profile-maintenance
    displayWindowDays: 2
    snoozeDefaultDays: 1
    decayStrategy: low-disturbance-downgrade
    metricIdRefs: [sleep.duration_minutes]
    captureProtocolIdRef: sleep-night
    featureId: PO-FEAT-056

  - taskId: dashboard-maintain-outdoor
    family: maintain
    ownerContract: apps/parentos/spec/kernel/timeline-contract.md
    cadencePolicy: interval
    biologicalAnchor: none
    slotPreference: weekend-heavy
    dispersionWindow: rolling
    mutualExclusionGroup: profile-maintenance
    displayWindowDays: 3
    snoozeDefaultDays: 2
    decayStrategy: low-disturbance-downgrade
    metricIdRefs: [outdoor.activity_minutes]
    captureProtocolIdRef: outdoor-activity
    featureId: PO-FEAT-056

  - taskId: dashboard-maintain-vision
    family: maintain
    ownerContract: apps/parentos/spec/kernel/timeline-contract.md
    cadencePolicy: windowed
    biologicalAnchor: none
    slotPreference: weekend-heavy
    dispersionWindow: week-3
    mutualExclusionGroup: profile-maintenance
    displayWindowDays: 5
    snoozeDefaultDays: 7
    decayStrategy: low-disturbance-downgrade
    metricIdRefs: [vision.left_visual_acuity, vision.right_visual_acuity]
    captureProtocolIdRef: vision-basic
    featureId: PO-FEAT-056

  - taskId: dashboard-observe-growth-journal
    family: observe
    ownerContract: apps/parentos/spec/kernel/journal-contract.md
    cadencePolicy: windowed
    biologicalAnchor: none
    slotPreference: weekday-evening-light
    dispersionWindow: week-2
    displayWindowDays: 3
    snoozeDefaultDays: 2
    decayStrategy: resurface-next-cycle
    featureId: PO-FEAT-056
