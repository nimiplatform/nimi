schema_version: 1

status_taxonomy:
  - status: on_track
    colorAlias: green
    meaning: "Within admitted descriptive reference, freshness, or completion expectations."
  - status: watch
    colorAlias: yellow
    meaning: "Outside preferred band, stale, or crossing an admitted trend-delta threshold requiring parent attention."
  - status: professional_review_prompt
    colorAlias: red
    meaning: "Meets an admitted descriptive threshold for consulting a qualified professional."
  - status: unrated
    colorAlias: neutral
    meaning: "No admitted evaluation policy exists."
  - status: missing
    colorAlias: neutral
    meaning: "No record exists."
  - status: error
    colorAlias: error
    meaning: "Projection or evaluation failed."

evaluation_object:
  required_fields:
    - status
    - statusReasonCode
    - shortLabel
    - explanation
    - sourceRefs
    - computedAt
    - inputs
    - safetyBoundary

policies:
  - policyId: growth.percentile-band
    appliesTo: [growth.height, growth.weight, growth.head_circumference]
    sourceRefs: [reference-data-assets.yaml#growth-standards]
    outputRules:
      - status: missing
        when: "no latest record"
      - status: professional_review_prompt
        when: "percentile is admitted and percentile < 3 or percentile > 97"
      - status: on_track
        when: "percentile is admitted and 3 <= percentile <= 97"
      - status: unrated
        when: "percentile cannot be computed from admitted reference data"
  - policyId: growth.bmi-percentile-band
    appliesTo: [growth.bmi]
    sourceRefs: [reference-data-assets.yaml#growth-standards]
    outputRules:
      - status: missing
        when: "height or weight source value is missing"
      - status: professional_review_prompt
        when: "admitted BMI percentile exists and falls outside P3-P97"
      - status: on_track
        when: "admitted BMI percentile exists and falls within P3-P97"
      - status: unrated
        when: "admitted BMI reference is unavailable for age or sex"
  - policyId: vision.age-reference-band
    appliesTo: [vision.left_visual_acuity, vision.right_visual_acuity]
    sourceRefs: [reference-data-assets.yaml#growth-standards.referenceRanges.vision]
    outputRules:
      - status: missing
        when: "no latest record"
      - status: watch
        when: "value is outside age reference band"
      - status: on_track
        when: "value is within age reference band"
  - policyId: vision.axial-reference-band
    appliesTo: [vision.left_axial_length, vision.right_axial_length]
    sourceRefs: [reference-data-assets.yaml#growth-standards.referenceRanges.axialLength]
    outputRules:
      - status: missing
        when: "no latest record"
      - status: professional_review_prompt
        when: "value crosses admitted professional-review reference threshold"
      - status: watch
        when: "rule-defined trend delta crosses watch threshold"
      - status: on_track
        when: "value and trend are within admitted reference thresholds"
  - policyId: vision.iop-reference-band
    appliesTo: [vision.left_iop, vision.right_iop]
    sourceRefs: [reference-data-assets.yaml#growth-standards]
    outputRules:
      - status: missing
        when: "no latest record"
      - status: professional_review_prompt
        when: "value crosses admitted professional-review reference threshold"
      - status: on_track
        when: "value is within admitted reference band"
  - policyId: fitness.standard-grade
    appliesTo: [fitness.run_50m, fitness.vital_capacity]
    sourceRefs: [China National Student Physical Fitness Standards]
    outputRules:
      - status: missing
        when: "no latest assessment"
      - status: watch
        when: "assessment grade is below admitted pass/qualified threshold"
      - status: on_track
        when: "assessment grade meets admitted threshold"
      - status: unrated
        when: "age, sex, or school stage does not resolve to an admitted standard"
  - policyId: development.tanner-stage-reference
    appliesTo: [development.tanner_breast_stage, development.tanner_genital_stage, development.tanner_pubic_hair_stage]
    sourceRefs: [profile-contract.md#PO-PROF-012]
    outputRules:
      - status: missing
        when: "no latest self-assessment exists"
      - status: professional_review_prompt
        when: "age, sex, and stage cross an admitted professional-review prompt threshold"
      - status: watch
        when: "rule-defined trend delta crosses puberty-progress watch threshold"
      - status: on_track
        when: "stage and trend are within admitted descriptive reference expectations"
      - status: unrated
        when: "age, sex, or required stage input is unavailable"
  - policyId: sleep.age-reference-band
    appliesTo: [sleep.duration_minutes]
    sourceRefs: [profile-contract.md#PO-PROF-010]
    outputRules:
      - status: missing
        when: "no latest record"
      - status: watch
        when: "duration is outside age reference band"
      - status: on_track
        when: "duration is within age reference band"
  - policyId: outdoor.goal-presence
    appliesTo: [outdoor.weekly_goal_minutes]
    sourceRefs: [reminder-rules.yaml#PO-REM-OUTD-001]
    outputRules:
      - status: missing
        when: "no goal configured"
      - status: on_track
        when: "goal is configured"
  - policyId: outdoor.goal-progress
    appliesTo: [outdoor.activity_minutes]
    sourceRefs: [reminder-rules.yaml#PO-REM-OUTD-002]
    outputRules:
      - status: missing
        when: "no activity records in current week"
      - status: watch
        when: "current week total is below prorated configured goal"
      - status: on_track
        when: "current week total meets prorated configured goal"
  - policyId: vaccine.rule-completion
    appliesTo: [vaccine.administration]
    sourceRefs: [reminder-rules.yaml]
    outputRules:
      - status: missing
        when: "no administration record exists for the expected rule"
      - status: on_track
        when: "administration record exists and resolves to an admitted vaccine rule"
      - status: error
        when: "record rule id cannot be resolved"
  - policyId: dental.event-severity
    appliesTo: [dental.event]
    sourceRefs: [profile-contract.md#PO-PROF-008]
    outputRules:
      - status: missing
        when: "no latest dental event exists"
      - status: professional_review_prompt
        when: "event payload uses an admitted professional-review severity or referral marker"
      - status: on_track
        when: "event payload is informational or routine"
      - status: unrated
        when: "event type has no admitted evaluation"
  - policyId: medical.result-projection
    appliesTo: [medical.event]
    sourceRefs: [profile-contract.md#PO-PROF-011]
    outputRules:
      - status: missing
        when: "no medical event exists"
      - status: professional_review_prompt
        when: "screening result is refer or fail, or event payload explicitly records professional follow-up"
      - status: on_track
        when: "event payload is routine and has no follow-up marker"
      - status: unrated
        when: "event type has no admitted evaluation"
  - policyId: development.catalog-window
    appliesTo: [development.milestone]
    sourceRefs: [reference-data-assets.yaml#milestone-catalog]
    outputRules:
      - status: missing
        when: "no record exists for a milestone expected in the current age window"
      - status: on_track
        when: "milestone is achieved within the admitted catalog window"
      - status: watch
        when: "catalog-defined observation window has passed without achievement and the catalog marks parent attention"
      - status: unrated
        when: "catalog has no admitted timing window"

constraints:
  - "Color aliases are rendering aliases only; rule computation must use status."
  - "professional_review_prompt must never be worded as diagnosis, danger, disease, or treatment advice."
  - "Trend delta rules must name an admitted numeric threshold; free-form changing quickly wording is forbidden."
  - "Missing data and evaluation failure must remain distinct statuses."
