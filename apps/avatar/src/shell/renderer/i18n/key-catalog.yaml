version: 1
owner: apps/avatar
catalog_id: avatar_i18n_key_catalog
description: >
  App-owned i18n key coverage catalog for the Nimi Avatar renderer. This file
  lists every i18n key consumed by Avatar shell code, the active Avatar kernel
  semantic anchor for the related surface fragment, and the consuming component
  path.

  This catalog is not repo-wide product authority. Product semantics live under
  `.nimi/spec/avatar/embodiment-surface.authority.yaml`; concrete copy lives in bundled locale JSON
  resources. Both `locales/en/avatar.json` and `locales/zh/avatar.json` MUST
  cover every key listed here in 1:1 alignment; drift is a CI failure.

  Hard rules:
  - Keys MUST be dot-namespaced under `Avatar.{section}.{leaf}`.
  - Surface fragments expressing fail-close reasons MUST use Runtime / account /
    binding language, never CORS / shared auth / workaround leakage (see
    K-NAV-SHELL-DEGRADED-002 + K-NAV-SHELL-FIRST-PARTY-RUNTIME hard rules).
  - This catalog MUST NOT contain concrete copy, default text, or translation
    baselines. Locale JSON resources are the only concrete copy source.
  - Locale leaves MUST NOT be empty strings or TODO placeholders.
  - When introducing or removing a key, update this catalog and both locale JSON
    files before the consuming component references the key.

