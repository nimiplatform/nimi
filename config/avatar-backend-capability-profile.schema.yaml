# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/canonical/avatar/embodiment-surface.authority.yaml
# Rationale: docs/authority/avatar-embodiment-rationale.md
schema_id: nimi.avatar.backend-capability-profile.v1
table_family: product_catalog
owner: avatar
catalog_id: avatar_backend_capability_profile_schema
entries:
  - id: nimi.avatar.backend-capability-profile.v1
admission_id: avatar-apml-auto-adapter
description: >
  Backend-agnostic Avatar capability profile schema. Profiles describe the
  capabilities of a loaded Avatar backend/model for generated motion routing.
  They are Avatar backend facts only and must not define APML syntax or runtime
  activity ontology.

required_fields:
  - profile_id
  - backend_kind
  - model_fingerprint
  - generated_motion
  - evidence

backend_kind_enum:
  - vrm
  - live2d
  - nimi2d
  - future

generated_motion:
  required_fields:
    - supported_routes
    - unsupported_routes
    - safety_limits
  route_id_source: config/avatar-generated-motion-routes.yaml
  unsupported_route_semantics: fail_closed

vrm_section:
  required_when_backend_kind: vrm
  required_fields:
    - humanoid_bones
    - expression_presets
    - lookat
    - pose_limits
  humanoid_bones:
    required_for_generated_motion:
      - hips
      - spine
      - chest
      - neck
      - head
      - left_upper_arm
      - left_lower_arm
      - left_hand
      - right_upper_arm
      - right_lower_arm
      - right_hand
      - left_upper_leg
      - left_lower_leg
      - right_upper_leg
      - right_lower_leg
  pose_limits:
    units: degrees
    rule: provider must clamp generated rotations to profile limits before output

live2d_section:
  required_when_backend_kind: live2d
  required_fields:
    - motion_groups
    - expression_ids
    - parameter_ids
  rule: >
    Live2D parameter ids are backend facts. They must not be promoted to APML
    syntax or runtime activity ontology.

nimi2d_section:
  required_when_backend_kind: nimi2d
  schema_ref: config/avatar-nimi2d-backend-capability-profile.schema.yaml
  required_fields:
    - package_manifest_ref
    - package_digest_sha256
    - proven_tier
    - default_outfit_ref
    - live_action_lanes
  rule: >
    Nimi2D capability profiles consume Nimi2D package evidence. They must not
    close default generated asset viability, must not claim true viseme below
    tier-2, and must fail closed when package proven_tier does not support the
    requested Avatar live-action lane.

evidence:
  required_fields:
    - source
    - observed_at
    - validator
  source_enum:
    - model_manifest
    - runtime_probe
    - static_asset_inspection
    - human_review

invariants:
  - Avatar capability profiles consume runtime activity ids only as references from generated-motion-routes.yaml.
  - Profiles must not introduce avatar-local APML ids.
  - Missing capability for a route is fail_closed, not idle fallback.
  - Nimi2D profiles must consume proven_tier and validator evidence from Nimi2D package manifests.
  - Profile validation must fail on placeholder success, unknown backend_kind, or empty evidence.
