# Platform ↔ Runtime Error Code Mapping
# Resolves semantic overlap between protocol-error-codes.yaml (P-PROTO-*)
# and reason-codes.yaml (K-ERR-*) by defining the formal correspondence.
#
# Direction: Platform protocol error → Runtime reason code
# Source rules: P-PROTO-020, P-PROTO-030, P-PROTO-035, P-PROTO-040, P-PROTO-050, P-PROTO-070, P-PROTO-010, K-ERR-004, K-AUTHSVC-013
#
# Categories:
#   mapped — same or equivalent code exists in both layers
#   realm_only — protocol-layer concept with no runtime equivalent
#   unmapped_v1 — potential mapping deferred to future version

version: 1
mappings:
  # ── mapped: Auth errors → runtime AUTH family ──
  - platform_error: PRINCIPAL_UNAUTHORIZED
    platform_source: P-PROTO-020
    runtime_reason_code: PRINCIPAL_UNAUTHORIZED
    runtime_code_number: 8
    runtime_source: K-AUTH-001
    category: mapped
    note: Exact Runtime reason code exists; do not broaden to token-invalid semantics

  - platform_error: EXTERNAL_PRINCIPAL_PROOF_INVALID
    platform_source: P-PROTO-020
    runtime_reason_code: EXTERNAL_PRINCIPAL_PROOF_INVALID
    runtime_code_number: 114
    runtime_source: K-AUTHSVC-006
    category: mapped
    note: Exact Runtime reason code exists; unsupported proof type remains a different auth-service error

  # ── realm_only: Version negotiation (protocol-layer only) ──
  - platform_error: PROTOCOL_MAJOR_MISMATCH
    platform_source: P-PROTO-001
    runtime_reason_code: null
    category: realm_only
    note: Version negotiation is protocol-only; runtime does not participate

  - platform_error: PROTOCOL_MINOR_UNSUPPORTED
