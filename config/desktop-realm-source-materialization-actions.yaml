table_family: state_machine
owner: desktop
machine_id: desktop_realm_source_local_materialization_action_model
authority_refs:
  - rule.nimi.desktop.product-surfaces.r006
  - rule.nimi.desktop.product-surfaces.r007
  - K-AGCORE-139
  - K-AGCORE-151
  - K-AGCORE-152
states:
  - state: materialization_available
    source_kinds: [worldCharacter, personaCharacter]
    primary_action: Become my partner
    primary_action_zh: 成为我的伙伴
    emits: materialize_realm_source_intent
    runtime_operation: MaterializeRealmSource
    request_fields: [sourceRef, requestId]
    description: Desktop has a closed CharacterSourceRefV3 and emits intent only. Runtime owns canonical account/bearer resolution, Realm source-visibility enforcement, Packet v3 acquisition and strict validation, SnapshotV2/provenance, and LocalAgent identity.
  - state: sign_in_required
    source_kinds: [worldCharacter, personaCharacter]
    primary_action: Sign in required
    disabled: true
    description: No current authenticated Realm account is available; Desktop does not manufacture an app permission or alternate bearer path.
  - state: source_not_ready
    source_kinds: [worldCharacter, personaCharacter]
    primary_action: Source not ready
    disabled: true
    description: Canonical Realm source or dependency readiness is incomplete; materialization remains fail closed without a user permission prompt.
  - state: source_access_denied
    source_kinds: [worldCharacter, personaCharacter]
    primary_action: Source unavailable
    disabled: true
    description: Realm canonical visibility or account policy denied materialization; Desktop must not infer an alternate permission or identity path.
  - state: materializing
    source_kinds: [worldCharacter, personaCharacter]
    primary_action: Materializing
    disabled: true
    description: Runtime owns the in-flight idempotent materialization transaction; Desktop cannot construct or upload packet data.
  - state: local_agent_available
    source_kinds: [worldCharacter, personaCharacter]
    primary_action: Open partner
    description: Bounded Runtime source status plus inventory/provenance has exactly one Runtime-owned LocalAgent for this source; Desktop may open it by opaque localAgentRef.
  - state: local_agent_ambiguous
    source_kinds: [worldCharacter, personaCharacter]
    primary_action: Open from partners
    description: Runtime inventory/provenance has more than one matching Runtime-owned LocalAgent; Desktop fails closed instead of choosing an arbitrary localAgentRef.
  - state: runtime_unavailable
    source_kinds: [worldCharacter, personaCharacter]
    primary_action: Runtime unavailable
    disabled: true
    description: Runtime, SDK lifecycle, auth-backed inventory, or bounded source status is unavailable/unknown/partial; Desktop keeps the action disabled with a readable failure state.
  - state: materialization_error
    source_kinds: [worldCharacter, personaCharacter]
    primary_action: Materialization unavailable
    disabled: true
    description: Runtime returned a bounded typed failure reason; Desktop preserves zero partial-success or local identity state.
transitions: []
