version: 13
table_family: protocol_surface
owner: runtime
protocol_id: runtime_protected_local_rpc_transport_matrix
surfaces:
  - RuntimeAuthService
  - RuntimeServiceControlService
  - RuntimeAccountService
  - RuntimeAuditService
  - RuntimeAppService
  - RuntimeArtifactService
  - RuntimeAgentService
  - RuntimeDevelopmentService
  - RuntimeLocalService
description: >-
  Closed verified-platform-transport and verified-origin admission for Desktop
  control, generated machine/account first-party product profiles, the
  independent verified-native-host bundled Avatar profile, and the common
  third-party local-app kernel. Logical carriers may reuse the same
  OS-verified physical endpoint only with independent attestation. Physical carriers are
  selected only by same-OS profiles. Immutable package/install/update/promotion
  remains typed unavailable; local_development is the only 0K positive
  third-party trust class.
authority_refs:
  - K-PLOCAL-001
  - K-PLOCAL-002
  - K-PLOCAL-006
  - K-PLOCAL-007
  - K-PLOCAL-008
  - K-PLOCAL-009
  - K-PLOCAL-010
  - K-PLOCAL-006
  - K-APP-017
  - K-ACCSVC-026
  - K-GRANT-014
  - K-AGCORE-032
  - K-AGCORE-052
  - K-AGCORE-053
  - K-AUDIT-024
  - K-APP-032
  - K-VOICE-021
transport_classes: [public_tcp, desktop_control, avatar_control, local_app_bootstrap, local_app_host]
verified_platform_transport:
  binding_name: verified_platform_transport
  profile_key: os
  custody_profile_ref: protected-local-custody-profiles.yaml#same-os
  service_principal_profile_ref: protected-local-runtime-principal-profiles.yaml#same-os
  transport_profile_ref: protected-local-os-profiles.yaml#same-os
  executable_trust_profile_ref: .nimi/spec/platform/kernel/tables/protected-local-executable-trust-sets.yaml#same-os
  launch_session_profile_ref: protected-local-launch-session-profiles.yaml#same-os
  cross_platform_profile_mix: forbidden
  non_product_local_development_profile_bundle:
    profile_id: macos_local_development_v1
    custody_profile_ref: protected-local-custody-profiles.yaml#macos-local-development
    service_principal_profile_ref: protected-local-runtime-principal-profiles.yaml#macos-local-development
    transport_profile_ref: protected-local-os-profiles.yaml#macos-local-development
    executable_trust_profile_ref: .nimi/spec/platform/kernel/tables/protected-local-executable-trust-sets.yaml#macos-local-development
    launch_session_profile_ref: protected-local-launch-session-profiles.yaml#macos-local-development
    compile_time_selection_only: true
    product_admission_promotion: forbidden
transport_class_bindings:
  public_tcp:
    binding: public_tcp_binding_only
    verified_platform_transport_profile: not_applicable
  desktop_control:
    binding: verified_platform_transport
    carrier_role: desktop_control
    profile_bundle_ref: verified_platform_transport
    protected_subprofiles:
      desktop_machine_product_v1:
        profile_ref: first-party-protected-runtime-profiles.yaml#desktop_machine_product_v1
        required_origin_role: verified_desktop_process
        renderer_selectable: false
      desktop_account_product_v1:
        profile_ref: first-party-protected-runtime-profiles.yaml#desktop_account_product_v1
        required_origin_role: desktop_account_host
        renderer_selectable: false
  avatar_control:
    binding: verified_platform_transport
    carrier_role: bundled_avatar_host
    profile_bundle_ref: verified_platform_transport
    protected_subprofiles:
      bundled_avatar_v1:
        profile_ref: first-party-protected-runtime-profiles.yaml#bundled_avatar_v1
        required_origin_role: bundled_avatar_host
        renderer_selectable: false
    host_owner: verified_avatar_native_host
    open_desktop_session_requirement: forbidden
    live_desktop_process_requirement: forbidden
    desktop_account_control_inheritance: forbidden
  local_app_bootstrap:
    binding: verified_platform_transport
    carrier_role: local_app_bootstrap
    profile_bundle_ref: verified_platform_transport
  local_app_host:
    binding: verified_platform_transport
    carrier_role: local_app_host
    profile_bundle_ref: verified_platform_transport
method_platform_binding:
  coverage: every_methods_row
  declared_method_count: 159
  selector_field: allowed_transport_classes
  resolver: transport_class_bindings
  protected_binding_description: verified_platform_transport
  profile_resolution: same_os
  missing_or_ambiguous_binding: fail_generation
  profile_membership_authority: first-party-protected-runtime-profiles.yaml
  inline_protected_subprofiles_status: deterministic_projection
  profile_member_kind_validation: required
  missing_intent_postcondition_negative_or_gate_ref: fail_generation
platform_admission:
  windows: admitted_fixed_service_and_process_verification
  macos: fail_closed_pending_native_admission
  macos_local_development: local_development_candidate_fail_closed_pending_real_acceptance
  linux: fail_closed_pending_native_admission
  forbidden_fallbacks:
    - localhost_grpc
    - same_user_daemon
    - direct_tauri_dev
    - manual_electron
    - argv
    - env
    - temp_file
    - renderer_ipc
    - portable_bearer
    - raw_executable_self_auth
non_product_local_development_supervisor_consistency:
  profile_id: macos_local_development_v1
  admission: local_development_candidate_fail_closed_pending_real_acceptance
  implementation_bindings: [desktop_electron_supervisor]
  electron_profile_bundle: verified_platform_transport.non_product_local_development_profile_bundle
  tauri_binding: fail_closed_pending_independent_Rust_WKWebView_command_install_update_and_live_acceptance
  electron_positive_does_not_enable_tauri: true
  generic_proxy: forbidden
trust_classes:
  admitted_positive: [local_development]
  opaque_typed_unavailable: [verified, user_imported]
  bundled_excluded: true
origin_roles:
  - binding_only
  - verified_desktop_process
  - desktop_account_host
  - local_app_control
  - local_app_process
  - local_app_session
  - bundled_avatar_host
operation_classes:
  - binding_bootstrap
  - desktop_session_bootstrap
  - local_app_session_bootstrap
  - runtime_service_control
  - desktop_account_projection
  - desktop_account_control
  - desktop_binding_control
  - local_app_public_permission_projection
  - local_app_public_permission_request
  - realm_broker_transport
  - local_app_launch_preparation
  - local_app_process_binding
  - local_development_control
  - local_development_run_end
  - desktop_product_control
  - desktop_runtime_audit_projection
  - desktop_machine_product
  - desktop_account_product
  - local_app_json_storage
  - blocked_pending_separate_authority
matrix_schema:
  fields:
    - method_id
    - operation_class
    - allowed_transport_classes
    - required_origin_roles
    - required_origin_roles_by_transport
    - request_may_select_role
    - portable_session_allowed
    - public_tcp_disposition
    - broker_operation_policy_ref
    - generic_proxy
    - source_rule
  protected_profile_fields:
    source: first-party-protected-runtime-profiles.yaml
    projection_fields: [protected_subprofiles, required_origin_roles, required_origin_roles_by_transport]
    editable_here: false
public_tcp_privileged_disposition: deny
request_role_selection: forbidden
portable_privileged_session: forbidden
desktop_session_requirement:
  bootstrap_exemption: /nimi.runtime.v1.RuntimeAuthService/OpenDesktopSession
  all_other_desktop_control_methods: live_boot_scoped_desktop_session_required
  correlation_or_metadata_rebind: forbidden
avatar_session_requirement:
  logical_transport_class: avatar_control
  connection_binding: exact_verified_avatar_native_host_connection
  profile_ref: first-party-protected-runtime-profiles.yaml#bundled_avatar_v1
  open_desktop_session: forbidden
  live_desktop_process: forbidden
  desktop_account_control: forbidden
  renderer_or_request_selected_identity: forbidden
open_desktop_session_wire:
  request:
    message: OpenDesktopSessionRequest
    fields: []
    request_metadata_authority_inputs: []
    unknown_field_disposition: reject
  response:
    message: OpenDesktopSessionResponse
    fields:
      - { name: desktop_session_id, type: bytes, exact_length: 32, authority: correlation_only_non_portable }
      - { name: runtime_boot_epoch, type: bytes, exact_length: 32, authority: stale_projection_rejection_only }
  renderer_projection: forbidden
  app_projection: forbidden
  connection_binding: exact_verified_desktop_control_connection
  session_reuse_or_rebind: forbidden
  source_rule: K-PLOCAL-006
open_local_app_session_wire:
  request:
    message: OpenLocalAppSessionRequest
    fields: []
    request_metadata_authority_inputs: []
    unknown_field_disposition: reject
  response:
    message: OpenLocalAppSessionResponse
    projection_fields: [state, trust_class, account_generation, runtime_boot_epoch, reason_code]
    forbidden_fields:
      - local_app_principal_id
      - immutable_lineage_id
      - local_record_id
      - permission_id
      - permission_state
      - permission_decision_id
      - session_id
      - session_proof
      - launch_lease
      - process_proof
      - endpoint
      - token
      - credential
  connection_binding: exact_bound_local_app_process_and_current_launch_lease
  atomic_transition: launch_lease_consume_and_private_local_app_session_insert
  renderer_projection: typed_session_and_permission_posture_only
  ordinary_grpc_disposition: deny
  source_rule: K-PLOCAL-008
renew_local_app_session_wire:
  request:
    message: RenewLocalAppSessionRequest
    fields: []
    request_metadata_authority_inputs: []
    unknown_field_disposition: reject
  response:
    message: OpenLocalAppSessionResponse
    projection_fields: [state, trust_class, account_generation, runtime_boot_epoch, reason_code]
    forbidden_fields:
      - local_app_principal_id
      - immutable_lineage_id
      - local_record_id
      - permission_id
      - permission_state
      - permission_decision_id
      - session_id
      - session_proof
      - launch_lease
      - process_proof
      - endpoint
      - token
      - credential
  connection_binding: exact_current_local_app_host_connection_and_private_session
  atomic_transition: revoke_previous_private_session_and_insert_replacement_on_same_connection
  renderer_projection: forbidden
  app_projection: forbidden
  ordinary_grpc_disposition: deny
  source_rule: K-PLOCAL-008
