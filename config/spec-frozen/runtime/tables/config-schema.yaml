version: 1
table_family: protocol_surface
owner: runtime
protocol_id: runtime_config_schema
surfaces:
  - schemaVersion
  - runtimeId
  - localService.enabled
  - localService.mode
  - grpcAddr
  - httpAddr
  - shutdownTimeoutSeconds
  - localStatePath
  - aiHealthIntervalSeconds
  - aiHttpTimeoutSeconds
  - globalConcurrencyLimit
  - perAppConcurrencyLimit
  - idempotencyCapacity
  - maxDelegationDepth
  - auditRingBufferSize
  - usageStatsBufferSize
  - localAuditCapacity
  - dataRootRef
  - managedRoots.models
  - managedRoots.dependencies
  - managedRoots.environments
  - managedRoots.logs
  - managedRoots.audit
  - sessionTtlMinSeconds
  - sessionTtlMaxSeconds
  - auth.jwt.issuer
  - auth.jwt.audience
  - auth.jwt.jwksUrl
  - auth.jwt.revocationUrl
  - providers
  - engines.llama.enabled
  - engines.llama.version
  - engines.llama.port
  - engines.media.enabled
  - engines.media.version
  - engines.media.port
  - engines.speech.enabled
  - engines.speech.version
  - engines.speech.port
  - engines.sidecar.enabled
  - engines.sidecar.version
  - engines.sidecar.port
  - defaultLocalTextModel
  - defaultCloudProvider
  - logLevel
  - modelCatalogCustomDir
  - appRegistryPath
  - allowLoopbackProviderEndpoint
  - scheduling.diskDenialThresholdBytes
  - scheduling.slowdownRamThresholdBytes
  - scheduling.slowdownVramThresholdBytes
  - scheduling.slowdownDiskThresholdBytes
  - scheduling.preemptionOccupancyPercent
  - fields
  - constraints
  - restart
  - hot
  - immutable
  - production_authority
  - provider_value_schema
production_authority:
  closed_field_partition: true
  field_classes:
    boot_security_immutable:
      - grpcAddr
      - httpAddr
      - localStatePath
      - appRegistryPath
      - auth.jwt.issuer
      - auth.jwt.audience
      - auth.jwt.jwksUrl
      - auth.jwt.revocationUrl
    service_owned_immutable:
      - schemaVersion
      - runtimeId
    service_owned_mutable:
      - localService.enabled
      - localService.mode
      - shutdownTimeoutSeconds
      - dataRootRef
      - managedRoots.models
      - managedRoots.dependencies
      - managedRoots.environments
      - managedRoots.logs
      - managedRoots.audit
      - aiHealthIntervalSeconds
      - aiHttpTimeoutSeconds
      - globalConcurrencyLimit
      - perAppConcurrencyLimit
      - idempotencyCapacity
      - maxDelegationDepth
      - auditRingBufferSize
      - usageStatsBufferSize
      - localAuditCapacity
      - sessionTtlMinSeconds
      - sessionTtlMaxSeconds
      - engines.llama.enabled
      - engines.llama.version
      - engines.llama.port
      - engines.media.enabled
      - engines.media.version
      - engines.media.port
      - engines.speech.enabled
      - engines.speech.version
      - engines.speech.port
      - engines.sidecar.enabled
      - engines.sidecar.version
      - engines.sidecar.port
      - defaultLocalTextModel
      - defaultCloudProvider
      - logLevel
      - modelCatalogCustomDir
      - allowLoopbackProviderEndpoint
      - scheduling.diskDenialThresholdBytes
      - scheduling.slowdownRamThresholdBytes
      - scheduling.slowdownVramThresholdBytes
      - scheduling.slowdownDiskThresholdBytes
      - scheduling.preemptionOccupancyPercent
    service_secret:
      - providers
  boot_security_sources: [signed_os_service_definition, signed_runtime_release_projection]
  mutable_write_authority: typed_protected_desktop_control_to_service_owned_state
  secret_write_authority: runtime_connector_or_service_private_custody_only
  forbidden_input_sources: [environment_variable, argv, user_writable_config, renderer_metadata, app_manifest]
  unknown_fields: reject
  interactive_user_config_file: forbidden
  retired_import: forbidden_pre_release_hardcut
  read_projection: typed_redacted_no_physical_path_no_secret
  non_product_fixture: separately_signed_synthetic_only_no_product_evidence
  non_release_checkpoint_profile:
    profile: dev_kernel_checkpoint
    activation_source: signed_runtime_candidate_projection_only
    schema_version: 5
    product_control_root: service_owned_trial_development_state_lineage_partition
    partition_identity: exact_trial_id_plus_preserved_development_state_candidate_id_plus_preserved_acceptance_round_id
    binary_candidate_binding:
      field: runtimeCandidateId
      source: exact_current_build_record_verified_runtime_candidate_id
      state_identity_effect: none
    development_state_lineage_binding:
      fields: [developmentStateCandidateId, acceptanceRoundId]
      first_install_source: current_build_record_verified_runtime_candidate_id_plus_cryptographically_random_acceptance_round_id
      signed_update_source: exact_preceding_protected_profile_lineage
      update_semantics: preserve_product_control_runtime_identity_local_app_kernel_grants_model_registry_audit_and_service_owned_config
      forbidden_reset_sources: [runtime_candidate_change, boot_epoch_change, desktop_restart, renderer_state, environment_variable, argv, home, temp, endpoint, request_field]
      reset_semantics: explicit_destructive_repair_operation_only
    acceptance_round_binding:
      field: acceptanceRoundId
      source: cryptographically_random_value_generated_by_first_signed_install_then_exactly_preserved_by_signed_updates
      restart_semantics: same_protected_profile_preserves_same_round_and_completed_first_run_state
      next_round_semantics: ordinary_signed_runtime_update_preserves_round
      shared_payload_effect: none
      forbidden_sources: [environment_variable, argv, home, userprofile, temp, renderer_metadata, endpoint, request_field]
    explicit_development_data_root_binding:
      field: developmentDataRootRef
      source: signed_installer_explicit_operator_selection_or_exact_preceding_protected_profile_binding_or_canonical_development_updater_data_root_selection
      development_updater_source: exact_dataRootRef_only_from_current_~/.nimi/runtime/config.json_promoted_to_explicit_signed_installer_input_before_service_mutation
      validation: existing_absolute_non_volume_root_non_reparse_directory_accessible_to_fixed_service
      runtime_effect: dataRootRef_and_managed_payload_roots_resolve_below_binding
      product_control_effect: fresh_lineage_visible_confirmable_proposal_existing_lineage_preserves_existing_selection
      update_semantics: preserve_non_empty_validated_binding_across_binary_candidate_rotation_unless_operator_explicitly_replaces_it
      preserved_scope: payload_root_selector_plus_same_lineage_service_owned_selection
      invalid_preserved_binding: fail_update_closed_without_candidate_fallback
    first_run_data_root_proposal: signed_explicit_development_data_root_binding_or_verified_interactive_windows_sid_profile_mapping_plus_trial_id_plus_runtime_candidate_id
    first_run_data_root_proposal_disposition: non_record_visible_confirmable_proposal_only
    first_run_data_root_proposal_forbidden_sources: [environment_variable, argv, home, userprofile, temp, renderer_metadata, endpoint, request_field]
    cross_candidate_state_inheritance: exact_same_signed_development_state_lineage_only
    cross_candidate_payload_reuse: independently_verify_current_candidate_catalog_hash_manifest_compatibility_and_activation_without_redownload_when_payload_is_unchanged
    fresh_round_condition: first_install_or_explicit_destructive_repair_reset_only
    fresh_round_effect: new_isolated_control_partition_with_new_install_id_and_no_shared_payload_mutation
    forbidden_activation_sources: [environment_variable, argv, home, temp, renderer_metadata, endpoint, request_field]
    existing_or_partially_damaged_record: normal_repair_fail_closed_within_same_round
    account_realm_authority: installer_owned_candidate_bound_real_realm_development_deployment
    account_web_login_origin: candidate_bound_expected_oauth_redirect_only
    account_realm_runtime_env_override: forbidden
    account_oauth_flow: real_system_browser_pkce_loopback_callback_runtime_token_custody
    fixture_account_realm_authority: none
    fixture_provider_scope: exact_loopback_non_release_provider_seed_only
    forbidden_account_fixture_behaviors: [fixture_authorize_redirect, fixture_token_exchange, fixture_jwks, fixture_revocation, fixture_issuer, shared_realm_provider_endpoint]
    release_posture: non_release
    product_close_promotion: non_promotable_to_product_close
# Production service-owned Runtime state schema; no user-writable config file is an input.
# Source rule: K-CFG-017, K-DAEMON-009
fields:
  - key: schemaVersion
    type: int
    default: "1"
    reload: immutable
    description: Service-owned state schema version; initialized by the signed Runtime service release
    source_rule: K-DAEMON-009

  - key: runtimeId
    type: string
    default: ""
    reload: immutable
    description: Stable local Runtime daemon identity; generated once by the service and never reassigned for the lifetime of service-owned state
    source_rule: K-CFG-018

  - key: localService.enabled
    type: bool
    default: "true"
    reload: restart
    description: Whether the Runtime daemon runs the local AI service plane; false leaves the daemon control-only with local materialization disabled
    source_rule: K-CFG-018

  - key: localService.mode
    type: string
    default: "desktop-local"
    reload: restart
    description: Runtime local service posture; desktop-local means the daemon is the on-device local AI service for this machine
    source_rule: K-CFG-018

  - key: grpcAddr
    type: string
    default: "127.0.0.1:46371"
    reload: restart
    description: gRPC 监听地址
    source_rule: K-DAEMON-009

  - key: httpAddr
    type: string
    default: "127.0.0.1:46372"
    reload: restart
    description: HTTP 监听地址
    source_rule: K-DAEMON-009

  - key: shutdownTimeoutSeconds
    type: int
    default: "10"
    reload: restart
    description: 优雅停机超时（秒）
    source_rule: K-DAEMON-003

  - key: localStatePath
    type: string
    default: "<service-owned-state>/runtime/local-state.json"
    reload: immutable
    description: OS-profile-specific service-principal-owned local state path; never projected to Desktop or selected from user configuration
    source_rule: K-LOCAL-016
    authority_note: Runtime-owned local AI state path; the pre-release hardcut imports no Desktop/user-session state and accepts no fallback truth.

  - key: dataRootRef
    type: string
    default: ""
    reload: restart
    description: Product-control-service selected nimi_data root copied into service-owned state through typed protected control; empty means materialization and app install fail closed
    source_rule: K-CFG-018

  - key: managedRoots.models
    type: string
    default: "<dataRootRef>/models"
    reload: restart
    description: Runtime-managed local model payload root derived from selected nimi_data
    source_rule: K-CFG-018

  - key: managedRoots.dependencies
    type: string
    default: "<dataRootRef>/dependencies"
    reload: restart
    description: Runtime-managed dependency payload root derived from selected nimi_data
    source_rule: K-CFG-018

  - key: managedRoots.environments
    type: string
    default: "<dataRootRef>/environments"
    reload: restart
    description: Runtime-managed executable environment root derived from selected nimi_data
    source_rule: K-CFG-018

  - key: managedRoots.logs
    type: string
    default: "<dataRootRef>/logs"
    reload: restart
    description: Runtime/product operational log root derived from selected nimi_data
    source_rule: K-CFG-018

  - key: managedRoots.audit
    type: string
    default: "<dataRootRef>/audit"
    reload: restart
    description: Runtime audit projection root derived from selected nimi_data
    source_rule: K-CFG-018

  - key: appRegistryPath
    type: string
    default: "<service-owned-state>/apps/registry.json"
    reload: immutable
    description: Service-owned verified Platform app-registry projection path fixed by signed boot security configuration; missing or invalid projection fails closed
    source_rule: K-CFG-017
    authority_note: Runtime consumes this file read-only as the explicit daemon projection source for Platform app admission. Runtime must not hardcode .nimi/spec/** as the source and must not own registry truth.

  - key: aiHealthIntervalSeconds
    type: int
    default: "8"
    reload: hot
    description: AI Provider 探活间隔（秒）
    source_rule: K-PROV-003

  - key: aiHttpTimeoutSeconds
    type: int
    default: "30"
    reload: hot
    description: AI Provider HTTP 超时（秒）
    source_rule: K-PROV-003

  - key: globalConcurrencyLimit
    type: int
    default: "8"
    reload: hot
    description: AI 全局并发上限
    source_rule: K-DAEMON-007

  - key: perAppConcurrencyLimit
    type: int
    default: "2"
    reload: hot
    description: AI 单 App 并发上限
    source_rule: K-DAEMON-007

  - key: idempotencyCapacity
    type: int
    default: "10000"
    reload: hot
    description: 幂等性存储容量上限
    source_rule: K-DAEMON-006

  - key: auditRingBufferSize
    type: int
    default: "20000"
    reload: hot
    description: 审计事件环形缓冲上限
    source_rule: K-AUDIT-007

  - key: usageStatsBufferSize
    type: int
    default: "50000"
    reload: hot
    description: 使用量样本环形缓冲上限
    source_rule: K-AUDIT-008

  - key: localAuditCapacity
    type: int
    default: "5000"
    reload: hot
    description: Local 审计事件存储上限
    source_rule: K-LOCAL-016

  - key: sessionTtlMinSeconds
    type: int
    default: "60"
    reload: hot
    description: Session TTL 下限（秒）
    source_rule: K-AUTHSVC-004

  - key: sessionTtlMaxSeconds
    type: int
    default: "86400"
    reload: hot
    description: Session TTL 上限（秒）
    source_rule: K-AUTHSVC-004

  - key: auth.jwt.issuer
    type: string
    default: ""
    reload: restart
    description: JWT iss 校验目标；与 audience / jwksUrl / revocationUrl 缺一不可，空值=拒绝所有 bearer token
    source_rule: K-AUTHN-009

  - key: auth.jwt.audience
    type: string
    default: ""
    reload: restart
    description: JWT aud 校验目标；与 issuer / jwksUrl / revocationUrl 缺一不可，空值=拒绝所有 bearer token
    source_rule: K-AUTHN-009

  - key: auth.jwt.jwksUrl
    type: string
    default: ""
    reload: restart
    description: JWT 公钥来源 JWKS 地址；非 loopback host 必须使用 https，且与 issuer / audience / revocationUrl 同时配置
    source_rule: K-AUTHN-004

  - key: auth.jwt.revocationUrl
    type: string
    default: ""
    reload: restart
    description: JWT 会话撤销内省地址；非 loopback host 必须使用 https，且与 issuer / audience / jwksUrl 同时配置
    source_rule: K-AUTHN-006

  - key: providers
    type: map
    default: "{}"
    reload: restart
    description: Service-owned provider routing projection keyed by provider name; credentials remain in Runtime custody and only credentialRef is stored
    source_rule: K-DAEMON-009

  - key: engines.llama.enabled
    type: bool
    default: "false"
    reload: restart
    description: 启用 llama 引擎 SUPERVISED 模式
    source_rule: K-LENG-004

  - key: engines.llama.version
    type: string
    default: "b8645"
    reload: restart
    description: llama 受管引擎版本
    source_rule: K-LENG-004

  - key: engines.llama.port
    type: int
    default: "1234"
    reload: restart
    description: llama 监听端口
    source_rule: K-LENG-004

  - key: engines.media.enabled
    type: bool
    default: "false"
    reload: restart
    description: 启用 media 引擎 SUPERVISED 模式
    source_rule: K-LENG-004

  - key: engines.media.version
    type: string
    default: "0.1.0"
    reload: restart
    description: media 受管引擎版本
    source_rule: K-LENG-004

  - key: engines.media.port
    type: int
    default: "8321"
    reload: restart
    description: media 监听端口
    source_rule: K-LENG-004

  - key: engines.speech.enabled
    type: bool
    default: "false"
    reload: restart
    description: 启用 speech 引擎 SUPERVISED 模式
    source_rule: K-LENG-004

  - key: engines.speech.version
    type: string
    default: ""
    reload: restart
    description: speech 受管引擎版本
    source_rule: K-LENG-004

  - key: engines.speech.port
    type: int
    default: "8330"
    reload: restart
    description: speech 监听端口
    source_rule: K-LENG-004

  - key: engines.sidecar.enabled
    type: bool
    default: "false"
    reload: restart
    description: 启用 sidecar 引擎（ATTACHED_ENDPOINT 模式）
    source_rule: K-LENG-002

  - key: engines.sidecar.version
    type: string
    default: ""
    reload: restart
    description: sidecar 引擎版本
    source_rule: K-LENG-002

  - key: engines.sidecar.port
    type: int
    default: "0"
    reload: restart
    description: sidecar 监听端口
    source_rule: K-LENG-002

  - key: defaultLocalTextModel
    type: string
    default: ""
    reload: hot
    description: 默认本地文本模型 ID 覆盖
    source_rule: K-CFG-013

  - key: defaultCloudProvider
    type: string
    default: ""
    reload: hot
    description: 默认云端 provider
    source_rule: K-CFG-013

  - key: logLevel
    type: string
    default: "info"
    reload: hot
    description: 日志级别（debug/info/warn/error）
    source_rule: K-CFG-017

  - key: modelCatalogCustomDir
    type: string
    default: "<service-owned-state>/model-catalog/providers"
    reload: restart
    description: Service-owned provider catalog directory selected only through typed protected configuration
    source_rule: K-MCAT-005

  - key: allowLoopbackProviderEndpoint
    type: bool
    default: "false"
    reload: restart
    description: 是否允许 loopback 地址的 HTTP provider endpoint
    source_rule: K-SEC-002

  # === Scheduling risk thresholds (K-SCHED-004, K-SCHED-005) ===

  - key: scheduling.diskDenialThresholdBytes
    type: int
    default: "524288000"
    reload: hot
    description: 磁盘可用空间低于此值触发 scheduling denied（字节）
    source_rule: K-SCHED-004

  - key: scheduling.slowdownRamThresholdBytes
    type: int
    default: "2147483648"
    reload: hot
    description: 可用 RAM 低于此值触发 slowdown_risk（字节，默认 2 GB）
    source_rule: K-SCHED-005

  - key: scheduling.slowdownVramThresholdBytes
    type: int
    default: "1073741824"
    reload: hot
    description: 可用 VRAM 低于此值触发 slowdown_risk（字节，默认 1 GB）
    source_rule: K-SCHED-005

  - key: scheduling.slowdownDiskThresholdBytes
    type: int
    default: "2147483648"
    reload: hot
    description: 磁盘可用空间低于此值触发 slowdown_risk（字节，默认 2 GB；高于 denial 阈值）
    source_rule: K-SCHED-005

  - key: scheduling.preemptionOccupancyPercent
    type: int
    default: "75"
    reload: hot
    description: 全局 slot 占用率超过此百分比触发 preemption_risk（0-100）
    source_rule: K-SCHED-005

# providers 值结构
provider_value_schema:
  fields:
    - key: baseUrl
      type: string
      required: false
    - key: credentialRef
      type: string
      required: false
    - key: defaultModel
      type: string
      required: false
  constraints:
    - credentialRef must resolve inside Runtime service-principal custody; raw apiKey, apiKeyEnv, environment lookup, and renderer-readable credential projection are forbidden
    - source_rule: K-CFG-005

# localService 值约束
local_service_schema:
  fields:
    - key: enabled
      type: bool
      required: true
    - key: mode
      type: string
      required: true
  constraints:
    - localService.mode 仅允许 closed value "desktop-local"；其他值写入校验必须拒绝并返回 CONFIG_SCHEMA_INVALID
    - source_rule: K-CFG-018

# reload 列语义
reload_semantics:
  restart: 变更后需要 daemon 重启才生效（涉及网络绑定、进程模型等启动时固化的资源）
  hot: 变更后无需重启，下次使用时即刻生效
  immutable: 不可变更（schemaVersion）

# JWT 验签配置约束
jwt_constraint: 仅支持 auth.jwt.jwksUrl，不支持 auth.jwt.publicKeyPath
