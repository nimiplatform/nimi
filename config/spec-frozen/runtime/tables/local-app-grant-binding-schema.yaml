version: 2
table_family: protocol_surface
owner: runtime
protocol_id: runtime_local_app_permission_lifecycle_boundary
source_rule: K-GRANT-014
surfaces:
  - current_admission
  - authority_classes
  - future_owner_lifecycle
  - forbidden_public_fields

current_admission:
  admitted_public_permissions: []
  positive_mutation_path: absent
  store_identity: absent_pre_admission
  product_status: unavailable
  protected_operation_posture: fail_closed

authority_classes:
  base_entitlement:
    permission_record: forbidden
    user_prompt: forbidden
  user_permission:
    permission_record: required_only_after_atomic_permission_admission
    public_id_source: platform_permission_catalog
  one_shot_consent:
    permission_record: forbidden
    authority_carrier: owner_issued_bounded_handle
  app_owned_authority:
    permission_record: forbidden
    owner: app_native_host
  os_right:
    permission_record: forbidden
    owner: operating_system

future_owner_lifecycle:
  activation_condition: complete_permission_admission_slice
  owner: canonical_permission_decision_owner
  key:
    - local_os_user_anchor
    - account_id
    - local_app_principal_id
    - permission_id
    - owner_selector_digest
  minimum_fields:
    - permission_decision_id
    - permission_id
    - owner_selector_digest
    - decision_generation
    - decision_revision
    - state
    - requested_at
    - decided_at
    - expires_at
    - user_decision_evidence_ref
  state_enum: [pending, granted, denied, expired, revoked]
  invariants:
    - catalog_row_alone_is_not_authority
    - selector_is_owner_issued_not_app_supplied
    - account_switch_never_transfers_permission
    - principal_tombstone_never_transfers_permission
    - every_protected_operation_reads_current_owner_decision
    - lifecycle_mutation_does_not_rotate_identity_session
    - no_app_id_only_positive_lookup
    - no_trust_tier_permission_effect
    - no_base_entitlement_permission_row
    - no_app_owned_authority_permission_row

forbidden_public_fields:
  - capability_scope
  - resource_scope
  - capability_resource_fingerprint
  - internal_operation_id
  - internal_resource_ref
  - account_id
  - local_app_principal_id
  - owner_selector_digest
  - permission_decision_id
  - bearer
  - token
  - session_proof

public_surface:
  status_input: [permission_id]
  request_input: [permission_id, reason]
  posture_enum: [prompt, pending, granted, denied, unavailable]
  app_mutation_methods: forbidden
