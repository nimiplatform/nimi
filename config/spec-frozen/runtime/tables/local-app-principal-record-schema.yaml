version: 1
table_family: protocol_surface
owner: runtime
protocol_id: runtime_local_app_principal_record_schema
source_rules: [K-APP-028, K-APP-029, K-APP-030, K-APP-031]
local_os_user_anchor:
  owner: runtime_protected_local
  platform_profile_ref: protected-local-os-profiles.yaml#same-os
  profile_field: local_os_user_anchor_derivation
  platform_sources:
    windows: verified_interactive_user_sid
    linux: verified_peer_uid_and_login_session
    macos: verified_peer_euid_and_audit_session
  request_supplied: forbidden
  active_anchors_per_data_root: 1
principal: &runtime_local_app_principal_surface
  owner: runtime_k_app
  store_identity: local_app_principals
  fields:
    - local_os_user_anchor
    - local_app_principal_id
    - principal_kind
    - app_id
    - development_authorization_id
    - canonical_project_file_id
    - state
    - created_at
    - tombstoned_at
  enums:
    principal_kind: [development]
    state: [active, tombstoned]
  invariants:
    - local_app_principal_id_is_random_non_reused_and_opaque
    - development_principal_has_only_development_authorization_id_and_canonical_project_file_id
    - app_id_is_not_a_security_or_storage_key
    - tombstoned_principal_cannot_be_reactivated
record: &runtime_local_app_record_surface
  owner: runtime_k_app
  store_identity: local_app_records
  fields:
    - local_os_user_anchor
    - local_app_record_id
    - local_app_principal_id
    - trust_class
    - canonical_project_file_id
    - project_generation
    - active_capability_fingerprint
    - execution_profile_ref
    - host_executable_digest
    - payload_root_digest
    - lifecycle_state
  enums:
    trust_class: [local_development]
    lifecycle_state: [active, dormant, revoked, security_revoked, removed]
  opaque_fields:
    - execution_profile_ref
    - host_executable_digest
    - payload_root_digest
  forbidden_fields:
    - grant_boolean
    - permission_result
    - account_owner
    - session_proof
    - operation_policy_result
invalidation:
  runtime_restart_preserves_principal_record: true
  runtime_restart_invalidates_launch_leases_and_sessions: true
  project_revoke_tombstones_principal: true
  run_once_terminal_tombstones_principal_and_removes_record: true
  subsequent_run_once_reuses_principal: false
  reauthorization_reuses_principal: false
store_separation:
  principal_and_record_are_distinct_records: true
  shared_serialized_record: forbidden
  app_id_positive_key: forbidden
  tombstone_or_deletion_never_activates_another_record: true
principal_lineage_binding:
  development: [development_authorization_id, canonical_project_file_id, app_id]
  development_branch_required: true
surfaces:
  principal: *runtime_local_app_principal_surface
  record: *runtime_local_app_record_surface
