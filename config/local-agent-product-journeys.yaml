schema_version: nimi.local-agent-product-journeys/v4
authority_class: non_authoritative_execution_manifest
owner: local-agent-product-harness
journeys:
  - journey_id: first-party-installed-first-run
    driver_gate: first-run
    product_gate: gate_0
    applicable_layer: L2
    environment:
      type: installed_windows_first_party_product
      requires_real_realm: true
      supports_real_realm: true
      requires_desktop: true
      requires_zhiyu: false
      requires_native_macos: false
      start_limits: {provider: 0, realm: 1, runtime: 2, desktop: 1, zhiyu: 0}
    prerequisites: [fresh_same_source_developer_signed_windows_x64_candidate, fixed_windows_runtime_service, installed_desktop_candidate, real_realm_account]
    isolation_level: fresh_product_root_same_candidate
    time_budget_ms: 1800000
    checkpoints:
      - {checkpoint_id: candidate-built-signed-installed, prerequisite_ids: []}
      - {checkpoint_id: ordinary-desktop-first-run-completed, prerequisite_ids: [candidate-built-signed-installed]}
      - {checkpoint_id: product-control-owner-ready, prerequisite_ids: [ordinary-desktop-first-run-completed]}
      - {checkpoint_id: execution-evidence-ref-parseable, prerequisite_ids: [product-control-owner-ready]}

  - journey_id: first-party-direct-nimi
    driver_gate: direct-nimi
    product_gate: gate_1
    applicable_layer: L2
    environment:
      type: installed_windows_first_party_product
      requires_real_realm: true
      supports_real_realm: true
      requires_desktop: true
      requires_zhiyu: false
      requires_native_macos: false
      start_limits: {provider: 1, realm: 1, runtime: 2, desktop: 1, zhiyu: 0}
    prerequisites: [first_party_gate_0_same_candidate_pass]
    isolation_level: reuse_gate_0_product_root_and_candidate
    time_budget_ms: 1800000
    checkpoints:
      - {checkpoint_id: direct-nimi-admitted-local-text-route, prerequisite_ids: []}
      - {checkpoint_id: direct-nimi-real-local-stream-delta, prerequisite_ids: [direct-nimi-admitted-local-text-route]}
      - {checkpoint_id: direct-nimi-single-terminal, prerequisite_ids: [direct-nimi-real-local-stream-delta]}
      - {checkpoint_id: direct-nimi-usage-reason, prerequisite_ids: [direct-nimi-single-terminal]}
      - {checkpoint_id: direct-nimi-cancel, prerequisite_ids: [direct-nimi-usage-reason]}
      - {checkpoint_id: direct-nimi-timeout, prerequisite_ids: [direct-nimi-cancel]}
      - {checkpoint_id: direct-nimi-model-unavailable, prerequisite_ids: [direct-nimi-timeout]}
      - {checkpoint_id: direct-nimi-no-cloud-fallback, prerequisite_ids: [direct-nimi-model-unavailable]}

  - journey_id: first-party-partner-core
    driver_gate: partner-core
    product_gate: gate_2
    applicable_layer: L2
    environment:
      type: installed_windows_first_party_product
      requires_real_realm: true
      supports_real_realm: true
      requires_desktop: true
      requires_zhiyu: false
      requires_native_macos: false
      start_limits: {provider: 1, realm: 1, runtime: 2, desktop: 2, zhiyu: 0}
    prerequisites: [first_party_gate_0_same_candidate_pass, first_party_gate_1_pass]
    isolation_level: reuse_gate_0_product_root_and_candidate
    time_budget_ms: 3600000
    checkpoints:
      - {checkpoint_id: realm-source-selected, prerequisite_ids: []}
      - {checkpoint_id: materialization-owner-verified, prerequisite_ids: [realm-source-selected]}
      - {checkpoint_id: materialization-idempotence-verified, prerequisite_ids: [materialization-owner-verified]}
      - {checkpoint_id: characters-projection-visible, prerequisite_ids: [materialization-idempotence-verified]}
      - {checkpoint_id: ordinary-desktop-open-owner-readback, prerequisite_ids: [characters-projection-visible]}
      - {checkpoint_id: partner-route-ready, prerequisite_ids: [ordinary-desktop-open-owner-readback]}
      - {checkpoint_id: partner-turn-committed-reloaded, prerequisite_ids: [partner-route-ready]}
      - {checkpoint_id: partner-negative-mutation-closure, prerequisite_ids: [partner-turn-committed-reloaded]}

  - journey_id: dev-kernel-core
    applicable_layer: L2
    environment:
      type: fixed_windows_service_local_development_cross_app
      requires_real_realm: false
      supports_real_realm: false
      requires_desktop: true
      requires_zhiyu: true
      requires_native_macos: false
      # Maximum observed start/replacement events. Runtime allows the product-
      # control Storage sync restart plus the explicit journey restart; Zhiyu
      # includes five launchers plus the observed edit/build replacement.
      start_limits: {provider: 1, realm: 1, runtime: 3, desktop: 1, zhiyu: 6}
    prerequisites: [fixed_windows_runtime_service, desktop_tauri_candidate, zhiyu_renderer_build, zhiyu_electron_build]
    isolation_level: exclusive_fixed_service_candidate_plus_clean_desktop_zhiyu_roots
    time_budget_ms: 1200000
    checkpoints:
      - {checkpoint_id: fixed-service-ready, prerequisite_ids: []}
      - {checkpoint_id: production-account-login, prerequisite_ids: [fixed-service-ready]}
      - {checkpoint_id: developer-mode-enabled, prerequisite_ids: [production-account-login]}
      - {checkpoint_id: run-once-project-admitted, prerequisite_ids: [developer-mode-enabled]}
      - {checkpoint_id: local-app-session-bound, prerequisite_ids: [run-once-project-admitted]}
      - {checkpoint_id: app-private-storage-base-entitlement, prerequisite_ids: [local-app-session-bound]}
      - {checkpoint_id: reserved-permission-unavailable, prerequisite_ids: [local-app-session-bound]}
      - {checkpoint_id: reserved-permission-request-denied, prerequisite_ids: [reserved-permission-unavailable]}
      - {checkpoint_id: process-mismatch-denied, prerequisite_ids: [app-private-storage-base-entitlement, reserved-permission-request-denied]}
      - {checkpoint_id: allow-project-admitted, prerequisite_ids: [process-mismatch-denied]}
      - {checkpoint_id: allow-project-authority-boundary, prerequisite_ids: [allow-project-admitted]}
      - {checkpoint_id: edit-build-process-replaced, prerequisite_ids: [allow-project-authority-boundary]}
      - {checkpoint_id: app-private-storage-after-process-replacement, prerequisite_ids: [edit-build-process-replaced]}
      - {checkpoint_id: mode-off-live-authority-revoked, prerequisite_ids: [app-private-storage-after-process-replacement]}
      - {checkpoint_id: allow-project-reused-after-mode-reenable, prerequisite_ids: [mode-off-live-authority-revoked]}
      - {checkpoint_id: fixed-service-restarted, prerequisite_ids: [allow-project-reused-after-mode-reenable]}
      - {checkpoint_id: app-private-storage-after-runtime-restart, prerequisite_ids: [fixed-service-restarted]}
      - {checkpoint_id: account-switch-invalidated, prerequisite_ids: [app-private-storage-after-runtime-restart]}
      - {checkpoint_id: project-revoked-session-invalidated, prerequisite_ids: [account-switch-invalidated]}
      - {checkpoint_id: desktop-real-shell-acceptance, prerequisite_ids: [project-revoked-session-invalidated]}
      - {checkpoint_id: zhiyu-real-shell-acceptance, prerequisite_ids: [project-revoked-session-invalidated]}
      - {checkpoint_id: protected-carrier-privacy-closeout, prerequisite_ids: [desktop-real-shell-acceptance, zhiyu-real-shell-acceptance]}
