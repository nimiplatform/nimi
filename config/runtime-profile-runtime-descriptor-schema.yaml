# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/runtime/ai-provider.authority.yaml
# Authority: .nimi/spec/runtime/ai-provider.authority.yaml
version: 1
table_family: product_record_schema
owner: runtime
record_id: runtime_profile_runtime_descriptor
path: config/runtime-profile-runtime-descriptor-schema.yaml
source_rule: K-AIEXEC-008
schema_version: 1
required_top_level_fields:
  - schema_version
  - descriptor_id
  - profile_ref
  - source_profile_digest
  - projection_origin
  - requirement_refs
  - capability_slices
allowed_top_level_fields:
  - schema_version
  - descriptor_id
  - profile_ref
  - source_profile_digest
  - projection_origin
  - requirement_refs
  - capability_slices
  - asset_bindings
  - default_params
  - editable_fields
  - prepare_requirements
  - contract_states
  - projection_warnings
forbidden_top_level_fields:
  - RuntimeRouteBinding
  - selectedBindings
  - selected_source_records
  - install_evidence
  - materialization_evidence
  - workflow_binding_id
  - backend_environment_evidence
  - scheduler_state
  - provider_health
  - credential_payload
capability_slice_schema:
  required_fields:
    - slice_id
    - capability
    - execution_mode
    - contract_state
    - readiness_policy
    - params_ref
  execution_mode_values:
    - local
    - cloud_connector
  contract_state_values:
    - declared
    - proposed
    - unsupported
  local_required_fields:
    - execution.backend
    - model.family
  local_optional_fields:
    - backend_profile
    - host_requirements
    - environment_requirements
    - asset_refs
    - ordered_companion_occurrences
  cloud_connector_required_fields:
    - provider
    - provider_capability
    - remote_model_catalog_id
    - provider_model_id
    - credential_policy
  cloud_connector_optional_fields:
    - connector_selector
    - params_schema_ref
    - provider_model_alias
asset_binding_schema:
  source_rule: K-LOCAL-023
  required_fields:
    - binding_id
    - asset_role
    - component_kind
    - source
    - expected_identity
    - readiness_policy
  source_variants:
    huggingface:
      required_fields:
        - repo_id
        - revision
        - entries
        - access_policy
      access_policy_values:
        - public
        - requires_auth
        - gated
        - unknown
      optional_fields:
        - repo_type
        - format
        - variant
        - expected_integrity
    manual:
      required_fields:
        - expected_name
        - association_instructions
      optional_fields:
        - expected_format
        - allowed_file_patterns
        - expected_integrity
        - risk_label
ordered_companion_occurrence_schema:
  source_rule: K-LOCAL-031
  required_fields:
    - occurrence_id
    - order
    - role
    - engineSlot
    - asset_binding_ref
    - required
  optional_fields:
    - weight
    - options
    - applies_to
runtime_output_boundaries:
  not_descriptor_fields:
    - selected_source_evidence
    - observed_integrity
    - local_readiness_ref
    - workflow_binding_id
    - materialization_cache_key
    - activation_gate_response
    - execution_evidence
rules:
  - descriptor fields are validation inputs only
  - runtime independently validates backend and model family
  - runtime outputs must not be written back into AIProfile or AIConfig
  - cloud connector descriptors are non-secret and consume runtime connector custody
  - ordered companion occurrence identity must not collapse to engineSlot
invariants:
  - id: descriptor-validation-input-only
    requirement: Profile runtime descriptor fields are validation inputs only; Runtime independently validates backend and model family.
  - id: runtime-output-boundary
    requirement: Runtime output fields listed under runtime_output_boundaries.not_descriptor_fields must not be descriptor fields and must not be written back into AIProfile or AIConfig.
  - id: forbidden-runtime-and-secret-fields
    requirement: Runtime route bindings, selected bindings, setup evidence, scheduler/provider state, and credential payloads are forbidden top-level descriptor fields.
  - id: cloud-connector-custody
    requirement: Cloud connector descriptors are non-secret and consume Runtime connector custody.
  - id: ordered-companion-identity
    requirement: Ordered companion occurrence identity must not collapse to engineSlot.
