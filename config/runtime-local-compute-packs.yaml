  - pack selection may produce a plan, dependency environments, and confirmation payloads; it must not perform first heavy or network materialization
  - pack-to-consumer arbitration is upstream of consumer activation; activation gates evaluate a selected consumer, not an ambiguous pack
  - pack-level optional dependency families are projection hints only and must not weaken required dependency evaluation for a selected consumer
  - consumer ids referenced by packs must remain in lockstep with local-environment-consumer-requirements.yaml
  - missing local pack dependencies project Runtime local environment setup, failed, unsupported, cancelled, or repair state
  - local compute pack projection must not instruct ordinary users to install uv, Python, Torch, CUDA, or native packages through system package managers or PATH mutation
