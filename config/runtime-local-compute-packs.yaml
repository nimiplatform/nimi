# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/runtime/local-compute.authority.yaml
# Authority: .nimi/spec/runtime/local-compute.authority.yaml
version: 1
table_family: product_catalog
owner: runtime
catalog_id: runtime_local_compute_packs
entries:
  - packs_1
  - packs_2
  - packs_3
  - packs_4
  - packs_5
  - packs_6
  - packs_7
  - packs_8
  - pack selection may be explicit or derived from an admitted capability
    consumer
  - pack selection must resolve a Runtime-owned local environment plan before
    heavy materialization
  - pack selection must not make Runtime core readiness depend on local compute
    readiness
  - cloud-only usage must not select a local compute pack implicitly
  - Desktop may project pack status and confirmation only; it must not
    materialize packs
  - pack selection may produce a plan, dependency environments, and confirmation
    payloads; it must not perform first heavy or network materialization
  - pack-to-consumer arbitration is upstream of consumer activation; activation
    gates evaluate a selected consumer, not an ambiguous pack
  - pack-level optional dependency families are projection hints only and must
    not weaken required dependency evaluation for a selected consumer
  - consumer ids referenced by packs must remain in lockstep with
    local-environment-consumer-requirements.yaml
  - missing local pack dependencies project Runtime local environment setup,
    failed, unsupported, cancelled, or repair state
  - local compute pack projection must not instruct ordinary users to install
    uv, Python, Torch, CUDA, or native packages through system package managers
    or PATH mutation

# Canonical product-facing local compute pack authority.
# Packs are requested capability bundles. They are not model rows, engine-local
# installers, Desktop installers, or developer script entrypoints.

packs:
  - pack_id: local-text
    product_label: Local text
    owner: runtime_local_environment_plan
    user_entrypoints:
      - local_model_install
      - local_compute_setup
    capabilities:
      - text.generate
      - text.embed
    required_dependency_families:
      - native-engine-package.llama
    optional_dependency_families:
      - accelerator.cuda.runtime
    consumers:
      - llama.cpp.cuda
      - llama.cpp.metal
    cloud_only_impact: none

  - pack_id: local-image-native
    product_label: Local image native
    owner: runtime_local_environment_plan
    user_entrypoints:
      - local_model_install
      - local_compute_setup
    capabilities:
      - image.generate
    required_dependency_families:
      - python.tool.uv
      - python.runtime
      - python.venv
      - python.package-set
      - native-engine-package.stablediffusion-ggml
    optional_dependency_families:
      - accelerator.cuda.runtime
    consumers:
      - stable-diffusion.cpp.metal
      - stable-diffusion.cpp.cuda
    cloud_only_impact: none

  - pack_id: local-image-python
    product_label: Local image Python workflows
    owner: runtime_local_environment_plan
    user_entrypoints:
