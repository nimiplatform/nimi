version: 2
policy_id: nimi.nimicoding-host-boundary-hardcut.v2

authority:
  path: .nimi/spec/platform/kernel/package-authority-admission-contract.md
  required_rule_ids:
    - P-PKG-010
    - P-PKG-011

package:
  name: "@nimiplatform/nimi-coding"
  required_version: 0.3.1
  required_dependency_range: ^0.3.1

# These are active package projections removed by nimi-coding 0.3.0. They must
# not survive in the host's live config/contracts/methodology surface. Historical
# evidence under .nimi/topics/** and .nimi/local/** is intentionally out of scope.
retired_active_projection_paths:
  - .nimi/config/audit-execution-artifacts.yaml
  - .nimi/config/audit-sweep.yaml
  - .nimi/config/external-execution-artifacts.yaml
  - .nimi/config/host-adapter.yaml
  - .nimi/config/host-profile.yaml
  - .nimi/config/installer-evidence.yaml
  - .nimi/config/skill-installer.yaml
  - .nimi/config/skill-manifest.yaml
  - .nimi/config/skills.yaml
  - .nimi/contracts/acceptance.schema.yaml
  - .nimi/contracts/admission-checklist.schema.yaml
  - .nimi/contracts/audit-chunk.schema.yaml
  - .nimi/contracts/audit-closeout.schema.yaml
  - .nimi/contracts/audit-finding.schema.yaml
  - .nimi/contracts/audit-ledger.schema.yaml
  - .nimi/contracts/audit-plan.schema.yaml
  - .nimi/contracts/audit-remediation-map.schema.yaml
  - .nimi/contracts/audit-rerun.schema.yaml
  - .nimi/contracts/audit-sweep-result.yaml
  - .nimi/contracts/authority-convergence-audit.schema.yaml
  - .nimi/contracts/closeout.schema.yaml
  - .nimi/contracts/decision-review.schema.yaml
  - .nimi/contracts/doc-spec-audit-result.yaml
  - .nimi/contracts/execution-packet.schema.yaml
  - .nimi/contracts/external-host-compatibility.yaml
  - .nimi/contracts/forbidden-shortcuts.catalog.yaml
  - .nimi/contracts/high-risk-admission.schema.yaml
  - .nimi/contracts/high-risk-execution-result.yaml
  - .nimi/contracts/orchestration-state.schema.yaml
  - .nimi/contracts/overflow-continuation.schema.yaml
  - .nimi/contracts/packet.schema.yaml
  - .nimi/contracts/pending-note.schema.yaml
  - .nimi/contracts/prompt.schema.yaml
  - .nimi/contracts/remediation.schema.yaml
  - .nimi/contracts/result.schema.yaml
  - .nimi/contracts/spec-reconstruction-result.yaml
  - .nimi/contracts/sweep-design-result.yaml
  - .nimi/contracts/topic-goal.schema.yaml
  - .nimi/contracts/topic-run-ledger.schema.yaml
  - .nimi/contracts/topic-step-decision.schema.yaml
  - .nimi/contracts/topic.schema.yaml
  - .nimi/contracts/true-close.schema.yaml
  - .nimi/contracts/wave.schema.yaml
  - .nimi/contracts/worker-output.schema.yaml
  - .nimi/contracts/workflow-consumer.schema.yaml
  - .nimi/methodology/audit-sweep-p0p1-recall.yaml
  - .nimi/methodology/authority-convergence-policy.yaml
  - .nimi/methodology/overflow-continuation-policy.yaml
  - .nimi/methodology/skill-exchange-projection.yaml
  - .nimi/methodology/skill-handoff.yaml
  - .nimi/methodology/skill-installer-result.yaml
  - .nimi/methodology/skill-installer-summary-projection.yaml
  - .nimi/methodology/skill-runtime.yaml
  - .nimi/methodology/spec-target-truth-profile.yaml
  - .nimi/methodology/topic-lifecycle-report.yaml
  - .nimi/methodology/topic-lifecycle.yaml
  - .nimi/methodology/topic-naming-ontology.yaml
  - .nimi/methodology/topic-ontology.yaml
  - .nimi/methodology/topic-validation-policy.yaml
  - .nimi/methodology/wave-dag-policy.yaml

preserved_historical_roots:
  - .nimi/topics
  - .nimi/local

# The installed package must itself expose the 0.3.x responsibility boundary.
# Version pinning alone is insufficient if node_modules is stale or modified.
forbidden_installed_package_paths:
  - adapters
  - cli/commands/audit-sweep.mjs
  - cli/commands/closeout.mjs
  - cli/commands/handoff.mjs
  - cli/commands/sweep.mjs
  - cli/commands/topic-runner.mjs
  - cli/commands/topic.mjs
  - cli/lib/audit-sweep-runtime
  - cli/lib/authority-convergence.mjs
  - cli/lib/codex-sdk-runner.mjs
  - cli/lib/handoff.mjs
  - cli/lib/topic-runner.mjs
  - cli/lib/topic.mjs
  - contracts/audit-sweep-result.yaml
  - contracts/topic.schema.yaml
  - contracts/workflow-consumer.schema.yaml
  - methodology/audit-sweep-p0p1-recall.yaml
  - methodology/skill-runtime.yaml
  - methodology/topic-lifecycle.yaml

entrypoint_scan:
  roots:
    - AGENTS.md
    - CLAUDE.md
    - README.md
    - .cursorrules
    - .claude
    - .github
    - docs
  included_extensions:
    - .md
    - .mjs
    - .js
    - .cjs
    - .json
    - .yaml
    - .yml
    - .sh
    - .ps1
    - .cmd
    - .ts
  excluded_path_segments:
    - _archive
    - dist
    - testdata
    - worktrees
  forbidden_substrings:
    - audit_sweep
    - audit-sweep
    - topic-runner
    - nimicoding topic
    - nimicoding sweep
    - nimicoding handoff
    - nimicoding closeout
    - .nimi/config/audit-sweep.yaml
    - .nimi/config/host-adapter.yaml
    - .nimi/config/host-profile.yaml
    - .nimi/config/skill-manifest.yaml
    - .nimi/config/skills.yaml
    - .nimi/contracts/audit-sweep-result.yaml
    - .nimi/contracts/workflow-consumer.schema.yaml
    - .nimi/methodology/audit-sweep-p0p1-recall.yaml
    - .nimi/methodology/skill-handoff.yaml
    - .nimi/methodology/skill-runtime.yaml

required_package_scripts:
  check:nimicoding-host-hardcut: node scripts/check-nimicoding-host-hardcut.mjs
  test:nimicoding-host-hardcut: node --test scripts/nimicoding-host-hardcut.test.mjs
  nimicoding:sync: pnpm exec nimicoding sync --check
  nimicoding:sync:apply: pnpm check:nimicoding-host-hardcut && pnpm exec nimicoding sync --apply
  check:nimi-coding-seed-sync: pnpm nimicoding:sync
  nimicoding:doctor: pnpm exec nimicoding doctor

forbidden_package_scripts:
  - nimicoding:start
  - nimicoding:start:yes
  - nimicoding:clear
  - nimicoding:audit-sweep
  - nimicoding:sweep
  - nimicoding:topic
  - nimicoding:handoff
  - nimicoding:closeout
