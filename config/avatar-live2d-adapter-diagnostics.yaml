# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/canonical/avatar/embodiment-surface.authority.yaml
# Rationale: docs/authority/avatar-embodiment-rationale.md
version: 1
table_family: closed_enum
owner: avatar
enum_id: live2d_adapter_diagnostics
registry_id: "nimi.avatar.live2d-adapter-diagnostics.v1"
authority: "avatar.kernel.live2d_asset_compatibility"
description: >
  Closed diagnostic registry for existing Live2D package adaptation. Codes are
  Avatar compatibility diagnostics, not Runtime/APML/MCP/A2A ontology.

namespace: "AVATAR_LIVE2D_COMPAT_*"
closed_code_set: true
consumer_posture:
  desktop: "may display typed diagnostics but does not own meanings"
  runtime: "does not own or reinterpret these Avatar compatibility diagnostics"
  sdk: "does not define additional codes"

codes: &live2d_adapter_diagnostic_values
  AVATAR_LIVE2D_COMPAT_MANIFEST_MISSING:
    meaning: "Requested tier requires a manifest but none was selected."
    trigger: "semantic_basic or companion_complete validation starts without an embedded or explicit external sidecar manifest."
    severity: "error"
    claim_semantics: "fail_closed_for_manifest_required_tiers"
  AVATAR_LIVE2D_COMPAT_MANIFEST_INVALID:
    meaning: "Manifest JSON or schema is invalid."
    trigger: "manifest JSON cannot parse, uses unsupported manifest_kind/schema_version, contains forbidden fields, or violates the closed v1 schema."
    severity: "error"
    claim_semantics: "fail_closed"
  AVATAR_LIVE2D_COMPAT_MODEL_ID_MISMATCH:
    meaning: "Manifest target does not match resolved model."
    trigger: "target_model.model_id or expected runtime digest does not match the selected Cubism package."
    severity: "error"
    claim_semantics: "fail_closed"
  AVATAR_LIVE2D_COMPAT_LICENSE_UNVERIFIED:
    meaning: "Fixture or package license evidence is insufficient for the requested use."
    trigger: "license posture is unknown for committable fixture use or evidence is absent for the claimed fixture posture."
    severity: "error"
    claim_semantics: "fail_closed_for_fixture_or_distribution_claim"
  AVATAR_LIVE2D_COMPAT_MOTION_MISSING:
    meaning: "A supported motion mapping points to a missing group."
    trigger: "a supported motion group or NAS fallback motion is not present in FileReferences.Motions."
    severity: "error"
    claim_semantics: "fail_closed_for_claimed_semantic_motion_support"
  AVATAR_LIVE2D_COMPAT_EXPRESSION_MISSING:
    meaning: "A supported expression mapping points to a missing expression."
    trigger: "a supported expression id is absent from FileReferences.Expressions."
    severity: "error"
    claim_semantics: "fail_closed_for_claimed_expression_support"
  AVATAR_LIVE2D_COMPAT_POSE_UNAVAILABLE:
    meaning: "Supported pose mapping was claimed but pose support is unavailable."
    trigger: "a supported pose mapping is declared while FileReferences.Pose is absent or unusable."
    severity: "error"
    claim_semantics: "fail_closed_for_claimed_pose_support"
  AVATAR_LIVE2D_COMPAT_LIPSYNC_PARAMETER_MISSING:
    meaning: "Supported lipsync mapping lacks a valid mouth parameter."
    trigger: "mouth_open_y_parameter or declared ParamMouthForm support cannot be proven against the model parameter set when inspection is available."
    severity: "error"
    claim_semantics: "fail_closed_for_claimed_lipsync_support"
  AVATAR_LIVE2D_COMPAT_PHYSICS_UNAVAILABLE:
    meaning: "Supported physics was claimed but physics is unavailable or invalid."
    trigger: "model_physics is declared while FileReferences.Physics is absent or Cubism rejects the physics data."
    severity: "error"
    claim_semantics: "fail_closed_for_claimed_physics_support"
  AVATAR_LIVE2D_COMPAT_HIT_REGION_MISSING:
    meaning: "Supported hit-region mapping points to absent hit areas."
    trigger: "a declared supported hit-region alias has no matching HitAreas entry."
    severity: "error"
    claim_semantics: "fail_closed_for_claimed_region_support"
  AVATAR_LIVE2D_COMPAT_UNSUPPORTED_SEMANTIC:
    meaning: "A runtime semantic request has no supported model-local mapping."
    trigger: "Avatar receives a typed Runtime projection semantic that the selected manifest/tier cannot map."
    severity: "error"
    claim_semantics: "must_not_count_request_as_successful_playback"

invariants:
  - "Unknown AVATAR_LIVE2D_COMPAT_* codes require this registry to be updated before use."
  - "Diagnostics are emitted by Avatar validation or Avatar carrier execution only."
  - "Desktop renderer evidence and import UI cannot close a diagnostic by themselves."
  - "Diagnostics never widen public APML, Runtime activity, MCP, A2A, or SDK ontology."

refs:
  markdown_contract: "docs/authority/avatar-embodiment-rationale.md"
  manifest_schema: "config/avatar-live2d-adapter-manifest.schema.yaml"
  tier_table: "config/avatar-live2d-compatibility-tiers.yaml"

values: *live2d_adapter_diagnostic_values
