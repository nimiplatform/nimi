# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/runtime/local-compute.authority.yaml
# Authority: .nimi/spec/runtime/local-compute.authority.yaml
version: 1
table_family: product_catalog
owner: runtime
catalog_id: runtime_accelerator_consumer_requirements
entries:
  - consumers_1
  - consumers_2
  - consumers_3

# Accelerator-specific projection of canonical local environment consumer
# requirements. The canonical cross-family consumer graph is
# `local-environment-consumer-requirements.yaml`; this file preserves CUDA
# consumer projection rows without becoming a parallel truth system.

consumers:
  - consumer_id: llama.cpp.cuda
    consumer_kind: native_engine_package_variant
    engine: llama
    package_variant: llama-cpp-windows-amd64-cuda
    capability_refs:
      - text.generate
      - text.embed
    accelerator_plane: cuda
    dependency_ids:
      - nvidia-cuda-user-space-runtime
    version_constraints:
      cuda_major: 12
      package_abi: package_declared
    activation_gate:
      required_dependency_states:
        - ready_system
        - ready_managed
    fallback_policy:
      fallback_variants:
        - llama-cpp-windows-amd64-vulkan
        - llama-cpp-windows-amd64-cpu
      fallback_requires_explicit_runtime_policy: true
    health_projection:
      ready: ready
      materializable_requires_confirmation: blocked_needs_confirmation
      queued: blocked_materializing
      downloading: blocked_materializing
      verifying: blocked_materializing
      installing: blocked_materializing
      repair_required: blocked_repair_required
      failed: blocked_setup_failed
      unsupported: unsupported
      cancelled: blocked_cancelled
    audit_fields:
      - selected_source_record_id
      - selected_package_variant
      - fallback_reason

  - consumer_id: stable-diffusion.cpp.cuda
    consumer_kind: native_engine_package_variant
    engine: media
    backend_family: stablediffusion-ggml
    package_variant: sd-win-cuda12-x64-stablediffusion-ggml
    capability_refs:
      - image.generate
    accelerator_plane: cuda
    dependency_ids:
      - nvidia-cuda-user-space-runtime
    version_constraints:
      cuda_major: 12
      package_abi: package_declared
    activation_gate:
      required_dependency_states:
        - ready_system
        - ready_managed
    fallback_policy:
      fallback_variants: []
      fallback_requires_explicit_runtime_policy: true
    health_projection:
      ready: ready
      materializable_requires_confirmation: blocked_needs_confirmation
      queued: blocked_materializing
      downloading: blocked_materializing
      verifying: blocked_materializing
      installing: blocked_materializing
      repair_required: blocked_repair_required
      failed: blocked_setup_failed
      unsupported: unsupported
      cancelled: blocked_cancelled
    audit_fields:
      - selected_source_record_id
      - selected_package_variant
      - backend_entry_id

  - consumer_id: media.diffusers.cuda
    consumer_kind: python_pipeline
    engine: media
    backend_family: diffusers
    package_variant: diffusers-windows-amd64-cuda
    capability_refs:
      - image.generate
      - video.generate
    accelerator_plane: cuda
    dependency_ids:
      - nvidia-cuda-user-space-runtime
    canonical_consumer_ref: local-environment-consumer-requirements.yaml#media.diffusers.cuda
    version_constraints:
      cuda_major: 12
    activation_gate:
      required_dependency_states:
        - ready_system
        - ready_managed
    fallback_policy:
      fallback_variants: []
      fallback_requires_explicit_runtime_policy: true
    health_projection:
      ready: ready
      materializable_requires_confirmation: blocked_needs_confirmation
      queued: blocked_materializing
      downloading: blocked_materializing
      verifying: blocked_materializing
      installing: blocked_materializing
      repair_required: blocked_repair_required
      failed: blocked_setup_failed
      unsupported: unsupported
      cancelled: blocked_cancelled
    audit_fields:
      - selected_source_record_id
      - selected_package_variant
