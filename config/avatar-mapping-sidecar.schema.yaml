# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/avatar/embodiment-surface.authority.yaml
# Authority: .nimi/spec/avatar/embodiment-surface.authority.yaml
schema_id: nimi.avatar.mapping-sidecar.v1
table_family: product_catalog
owner: avatar
catalog_id: avatar_mapping_sidecar_schema
entries:
  - id: nimi.avatar.mapping-sidecar.v1
admission_id: avatar-apml-auto-adapter
description: >
  Schema for sidecar mappings from Avatar route ids to backend/model-specific
  names. Sidecars carry confidence and source classification only. They do not
  own semantic ids and must not contain generated keyframe math.

required_fields:
  - sidecar_id
  - route_id
  - backend_kind
  - profile_id
  - confidence
  - threshold
  - manual_confirmation
  - source_kind
  - target_fields

route_id_source: config/avatar-generated-motion-routes.yaml
default_threshold: 0.82
confidence:
  min: 0
  max: 1
  fail_closed_when_below_threshold: true
threshold:
  required: true
  min: 0.82
  max: 1
  default_floor_ref: default_threshold
  lower_than_default_threshold: invalid_sidecar_fail_closed
  rule: >
    threshold must be greater than or equal to default_threshold. Route-specific
    sidecars may raise the threshold for stricter admission, but must not lower
    it to admit mappings that would fail the default confidence floor.

manual_confirmation_enum:
  - unconfirmed
  - confirmed
  - rejected

source_kind_enum:
  - deterministic_manifest
  - static_name_match
  - llm_semantic_match
  - human_review

target_fields:
  required: true
  min_items: 1
  description: >
    Backend/model-specific names that the sidecar maps the Avatar route to.
    These are backend facts only and must be validated against a matching
    capability profile before they can support a route.
  target_kind_enum:
    - humanoid_bone
    - expression_preset
    - lookat
    - motion_group
    - parameter_id
    - manifest_entry
  required_fields:
    - target_kind
    - name
  optional_fields:
    - role

forbidden_fields:
  - keyframes
  - rotations
  - curves
  - easing
  - duration
  - apml_tag

invariants:
  - LLM output is mapping-only and requires manual_confirmation: confirmed before route support.
  - confidence below threshold is fail_closed.
  - threshold below default_threshold is invalid sidecar input and fails closed.
  - sidecars must not create runtime activity ids or public APML syntax.
  - sidecars must not claim support without matching backend capability profile facts.
  - target_fields are backend/model facts only and must not become Avatar-local ontology.
