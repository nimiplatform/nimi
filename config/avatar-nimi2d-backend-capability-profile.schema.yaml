# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/canonical/avatar/embodiment-surface.authority.yaml
# Rationale: docs/authority/avatar-embodiment-rationale.md
schema_id: nimi.avatar.nimi2d-backend-capability-profile.v1
table_family: protocol_surface
owner: avatar
catalog_id: avatar_nimi2d_backend_capability_profile_schema
protocol_id: avatar_nimi2d_backend_capability_profile
surfaces:
  - avatar.nimi2d.capability_profile
authority: avatar.kernel.nimi2d_backend
description: >
  Closed Avatar-local capability profile schema for the Nimi2D backend branch.
  Profiles describe what a loaded Nimi2D package can safely execute inside the
  Avatar carrier. They consume Nimi2D package evidence and Runtime typed
  projection, but do not admit default generated asset viability.

required_fields:
  - profile_id
  - backend_kind
  - package
  - renderability
  - renderer
  - live_action_lanes
  - evidence

fields:
  profile_id:
    type: string
    pattern: "^avatar\\.nimi2d\\.capability-profile:[a-z0-9][a-z0-9_-]{2,63}$"
  backend_kind:
    literal: nimi2d
  package:
    required_fields:
      - package_manifest_ref
      - package_id
      - package_digest_sha256
      - package_kind
      - proven_tier
      - requested_tier
      - validator_evidence_ref
    fields:
      package_manifest_ref:
        type: opaque_ref
      package_id:
        source: ".nimi/spec/nimi2d/kernel/tables/package-manifest.schema.yaml"
      package_digest_sha256:
        type: lowercase_hex
        length: 64
      package_kind:
        enum:
          - character_package
      proven_tier:
        enum:
          - tier-0_static_layered
          - tier-1_agent_basic
          - tier-2_viseme_gesture
          - tier-3_full_body_semantic
      requested_tier:
        enum:
          - tier-0_static_layered
          - tier-1_agent_basic
          - tier-2_viseme_gesture
          - tier-3_full_body_semantic
      validator_evidence_ref:
        type: opaque_ref
  renderability:
    required_fields:
      - base_body_renderable
      - default_outfit_ref
      - base_body_only_unreachable
      - outfit_switch_atomic
    fields:
      base_body_renderable:
        literal: false
      default_outfit_ref:
        type: opaque_ref
      base_body_only_unreachable:
        literal: true
      outfit_switch_atomic:
        literal: true
  renderer:
    required_fields:
      - canvas
      - bindings
    fields:
      canvas:
        required_fields:
          - width_px
          - height_px
        fields:
          width_px:
            type: positive_integer
          height_px:
            type: positive_integer
      bindings:
        description: >
          Avatar-owned renderer binding from Nimi2D package layer refs to
          live-action lanes. The profile may omit a lane binding only when the
          corresponding lane is unsupported or fail_closed.
        binding_fields:
          layer_refs:
            type: non_empty_string_array
          translate_x_range_px:
            type: optional_two_number_range
          translate_y_range_px:
            type: optional_two_number_range
          scale_x_range:
            type: optional_two_number_range
          scale_y_range:
            type: optional_two_number_range
          opacity_range:
            type: optional_two_number_range
        supported_bindings:
          - speech_mouth
          - expression
          - idle_life
          - motion_routes
        motion_routes:
          description: >
            Optional route-id keyed transform bindings. A route binding is
            consumed only when the composer snapshot `motion` equals the route
            id; renderers must not hardcode route ids.
          key_pattern: "^[a-z][a-z0-9_.-]{0,63}$"
          value: binding_fields
  live_action_lanes:
    required_fields:
      - static_layer
      - idle_life
      - expression
      - speech_mouth
      - gesture_motion
      - true_viseme
      - semantic_full_body
    lane_status_enum:
      - supported
      - unsupported
      - fail_closed
    lane_fields:
      status:
        enum:
          - supported
          - unsupported
          - fail_closed
      minimum_tier:
        enum:
          - tier-0_static_layered
          - tier-1_agent_basic
          - tier-2_viseme_gesture
          - tier-3_full_body_semantic
      evidence_ref:
        type: opaque_ref_optional
      failure_code:
        type: string_optional
  evidence:
    required_fields:
      - source
      - observed_at
      - validator
      - generation_bench_status
    source_enum:
      - nimi2d_package_manifest
      - runtime_probe
      - static_asset_inspection
      - human_review
    generation_bench_status:
      enum:
        - go
        - conditional_go
        - no_go
        - not_applicable_hand_authored

invariants:
  - "Profiles consume proven_tier, never requested_tier, for lane support."
  - "Base body renderability must remain false."
  - "Default outfit is required before any ready visual state."
  - "Tier-1 speech mouth is jaw/amplitude only; true viseme starts at tier-2."
  - "Renderer canvas and layer bindings are Avatar-owned runtime bindings, not Nimi2D package truth."
  - "A Nimi2D runtime capability profile cannot close Generation Bench."
  - "Unsupported non-idle lanes fail closed and cannot count idle fallback as success."

refs:
  contract: "docs/authority/avatar-embodiment-rationale.md"
  nimi2d_package_manifest: ".nimi/spec/nimi2d/kernel/tables/package-manifest.schema.yaml"
  nimi2d_generation_bench: ".nimi/spec/nimi2d/kernel/generation-bench-contract.md"
