version: 1
table_family: product_catalog
owner: sdks
catalog_id: sdks_adapter_source_roots
entries:
  - id: vercel-ai
    name: Vercel AI SDK
    owner: sdks/typescript/adapters/vercel-ai
    semantics: Independent package `@nimiplatform/sdk-adapter-vercel-ai`; LanguageModelV3 adapter plus manifest-declared language-model provider factory, without claiming full ProviderV3 parity.
  - id: openai-compatible
    name: OpenAI-compatible
    owner: sdks/typescript/adapters/openai-compatible
    semantics: Strict Chat Completions-compatible migration bridge.
  - id: mastra
    name: Mastra
    owner: sdks/typescript/adapters/mastra
    semantics: Independent package `@nimiplatform/sdk-adapter-mastra` with its own Nimi -> LanguageModelV3 mapping (no sibling-adapter dependency); a NimiAiModel becomes a Mastra `MastraModelConfig` accepted by Agents, and the same package exposes Runtime-backed embedding and non-realtime voice helper surfaces for Mastra RAG/STT/TTS migration while Runtime/Cognition remain owner of route, credentials, Memory/Knowledge, voice assets, artifacts, and caller-supplied speech submit idempotency keys.
  - id: langgraph
    name: LangGraph
    owner: sdks/typescript/adapters/langgraph
    semantics: Graph workflow adapter; public package name remains owner-gated.
  - id: llamaindex
    name: LlamaIndex
    owner: sdks/typescript/adapters/llamaindex
    semantics: Retrieval/query interop adapter; public package name remains owner-gated.
  - id: react
    name: React
    owner: sdks/typescript/adapters/react
    semantics: Common React app framework adapter; public package name remains owner-gated.
  - id: next
    name: Next
    owner: sdks/typescript/adapters/next
    semantics: Common Next app framework adapter; public package name remains owner-gated.
