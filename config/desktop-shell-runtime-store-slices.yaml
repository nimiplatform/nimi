# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/desktop/shell-runtime.authority.yaml
# Rationale: docs/authority/desktop-shell-runtime-rationale.md
config_id: desktop_shell_runtime_store_slices
owner: desktop
source_rule: rule.nimi.desktop.shell-runtime.r041
slices:
  - name: auth
    factory: createAuthSlice
    file: auth-slice.ts
    authority_boundary: runtime_account_redacted_projection
  - name: runtime
    factory: createRuntimeSlice
    file: runtime-slice.ts
    authority_boundary: transient_runtime_inputs_and_projection
  - name: ui
    factory: createUiSlice
    file: ui-slice.ts
    authority_boundary: renderer_ui_navigation_and_bootstrap_presentation
