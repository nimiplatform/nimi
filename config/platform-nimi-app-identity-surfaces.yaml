# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/platform/app-ecosystem.authority.yaml
# Authority: .nimi/spec/platform/app-ecosystem.authority.yaml
version: 1
table_family: product_catalog
owner: platform
catalog_id: platform_nimi_app_identity_surfaces
source_rule: P-NAPP-012
entries:
  - canonical app_id is the shared display and routing identifier used by Platform, Runtime projections, SDK appId, and OS bundle derivation
  - registered_app_subject is the Runtime-assigned random non-reused security subject for registration-bound private storage, app-scoped audience, sessions, and audit
  - trust_class and publisher trust tier are provenance/review facts and never security principals
  - native_bundle_identifier is derived only as ai.nimi.apps.<app_id>
  - native_bundle_identifier is OS bundle/signing/update identity only and must not be used as Runtime or Platform app identity
  - developer/testing posture must not be encoded into app_id

identity_schema:
  owner: platform_nimi_app_identity_surfaces
  fields:
    - source_root
    - product_surface
    - canonical_app_id
    - sdk_app_id
    - runtime_app_id
    - runtime_caller_mode
    - principal_posture
    - development_integration_profile
    - native_shell
    - native_bundle_identifier
    - native_bundle_identifier_required
    - npm_package
    - product_status
    - source_rule
  app_id_pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)*$"
  native_bundle_identifier_prefix: ai.nimi.apps
  native_bundle_identifier_derivation: "ai.nimi.apps.<canonical_app_id>"
  invariants:
    - sdk_app_id must equal canonical_app_id
    - runtime_app_id must equal canonical_app_id
    - native_bundle_identifier must equal ai.nimi.apps.<canonical_app_id> when native_bundle_identifier_required is true
    - active source must not use app.nimi.* or dev.nimi.* as app identity
    - app_id must not key registration-bound private storage, audience, session, or audit state
    - a local development integration profile must use an isolated Runtime registered_app_subject

apps:
  - source_root: apps/desktop
    product_surface: desktop-shell
    canonical_app_id: nimi.desktop
    sdk_app_id: nimi.desktop
    runtime_app_id: nimi.desktop
    runtime_caller_mode: desktop-shell
    principal_posture: protected_desktop_shell_not_third_party
    development_integration_profile: null
    native_shell: electron
    native_bundle_identifier: ai.nimi.apps.nimi.desktop
    native_bundle_identifier_required: true
    npm_package: "@nimiplatform/desktop"
    product_status: first-party-shell
    source_rule: P-NAPP-012

  - source_root: apps/web
    product_surface: web-shell
    canonical_app_id: nimi.web
    sdk_app_id: nimi.web
    runtime_app_id: nimi.web
    runtime_caller_mode: web-cloud-adapter
    principal_posture: web_cloud_not_local_app
    development_integration_profile: null
    native_shell: none
    native_bundle_identifier: null
    native_bundle_identifier_required: false
    npm_package: "@nimiplatform/web"
    product_status: first-party-web
    source_rule: P-NAPP-012

  - source_root: apps/avatar
    product_surface: avatar-formal-app
    canonical_app_id: nimi.avatar
    sdk_app_id: nimi.avatar
    runtime_app_id: nimi.avatar
    runtime_caller_mode: formal-app-session
    principal_posture: registered_release_eas
    development_integration_profile: null
    native_shell: none
    native_bundle_identifier: null
    native_bundle_identifier_required: false
    npm_package: "@nimiplatform/avatar"
    product_status: bundled-formal-app
    source_rule: P-NAPP-012

  - source_root: apps/lab
    product_surface: nimi-lab
    canonical_app_id: nimi.lab
    sdk_app_id: nimi.lab
    runtime_app_id: nimi.lab
    runtime_caller_mode: local-app
    principal_posture: isolated_local_development
    development_integration_profile:
      trust_class: local_development
      shipped_identity_inheritance: forbidden
    native_shell: tauri
    native_bundle_identifier: ai.nimi.apps.nimi.lab
    native_bundle_identifier_required: true
    npm_package: "@nimiplatform/lab"
    product_status: local-development-nimi-app
    source_rule: P-NAPP-012

  - source_root: apps/zhiyu
    product_surface: zhiyu-formal-companion-app
    canonical_app_id: nimi.zhiyu
    sdk_app_id: nimi.zhiyu
    runtime_app_id: nimi.zhiyu
    runtime_caller_mode: formal-app-session
    principal_posture: registered_release_eas
    development_integration_profile:
      trust_class: local_development
      principal_posture: isolated_local_development
      shipped_identity_inheritance: forbidden
    native_shell: none
    native_bundle_identifier: null
    native_bundle_identifier_required: false
    npm_package: "@nimiplatform/zhiyu"
    product_status: bundled-formal-app-with-isolated-development-integration
    source_rule: P-NAPP-012
