components:
  schemas:
    AccountRelationType:
      enum:
        - ALLY
        - RIVAL
        - ENEMY
      type: string
    AccountStatus:
      enum:
        - ONBOARDING
        - ACTIVE
        - SUSPENDED
        - BANNED
      type: string
    AddFriendBodyDto:
      properties:
        requestMessage:
          maxLength: 200
          type: string
      type: object
    AddGroupParticipantInputDto:
      properties:
        accountId:
          type: string
      required:
        - accountId
      type: object
    AddGroupSourceParticipantInputDto:
      properties:
        sourceRef:
          $ref: '#/components/schemas/GroupSourceRefDto'
      required:
        - sourceRef
      type: object
    AssetDetailDto:
      properties:
        authorId:
          type: string
        clonePolicy:
          enum:
            - ALLOW
            - DENY
            - INHERIT
          type: string
        createdAt:
          type: string
        id:
          type: string
        kind:
          enum:
            - WORK
            - ITEM
          type: string
        originKind:
          enum:
            - ORIGINAL
            - CLONE
            - DERIVED
          type: string
        ownerId:
          type: string
        previewResourceId:
          nullable: true
          type: string
        resourceRefs:
          items:
            type: string
          type: array
        rootAssetId:
          nullable: true
          type: string
        sourceAssetId:
          nullable: true
          type: string
        status:
          enum:
            - DRAFT
            - READY
            - ARCHIVED
            - DELETED
          type: string
        structuredPayload:
          additionalProperties: true
          nullable: true
          type: object
        transferPolicy:
          enum:
            - ALLOW
            - DENY
            - INHERIT
          type: string
        updatedAt:
          type: string
        usePolicy:
          allOf:
            - $ref: '#/components/schemas/UsePolicyDto'
          nullable: true
          type: object
      required:
        - id
        - kind
        - status
        - originKind
        - ownerId
        - authorId
        - resourceRefs
        - transferPolicy
        - clonePolicy
        - createdAt
        - updatedAt
      type: object
    AssetListDto:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AssetDetailDto'
          type: array
      required:
        - items
      type: object
    AttachmentDisplayKind:
      enum:
        - IMAGE
        - VIDEO
        - AUDIO
        - TEXT
        - CARD
      type: string
    AttachmentEnvelopeDto:
      properties:
        displayKind:
          allOf:
            - $ref: '#/components/schemas/AttachmentDisplayKind'
        duration:
          type: number
        height:
          type: number
        preview:
          $ref: '#/components/schemas/AttachmentEnvelopeDto'
        subtitle:
          type: string
        targetId:
          type: string
        targetType:
          allOf:
            - $ref: '#/components/schemas/AttachmentTargetType'
        thumbnail:
          type: string
        title:
          type: string
        url:
          type: string
        width:
          type: number
      required:
        - targetType
        - targetId
      type: object
    AttachmentReferenceDto:
      properties:
        targetId:
          type: string
        targetType:
          allOf:
            - $ref: '#/components/schemas/AttachmentTargetType'
      required:
        - targetType
        - targetId
      type: object
    AttachmentTargetType:
      enum:
        - RESOURCE
        - ASSET
        - BUNDLE
      type: string
    Auth2faVerifyDto:
      properties:
        code:
          type: string
        tempToken:
          type: string
      required:
        - tempToken
        - code
      type: object
    AuthErrorDto:
      properties:
        message:
          type: string
        reasonCode:
          enum:
            - AUTH_REQUIRED
            - AUTH_INSUFFICIENT_SCOPE
            - AUTH_INVALID_CREDENTIALS
            - AUTH_INVALID_REQUEST
            - AUTH_TOKEN_EXPIRED
            - AUTH_TOKEN_VERIFICATION_UNAVAILABLE
            - AUTH_INVALID_REFRESH_TOKEN
            - AUTH_REFRESH_TOKEN_REVOKED
            - AUTH_REFRESH_TOKEN_REPLAY_DETECTED
            - AUTH_ACCOUNT_RESTRICTED
            - AUTH_INVALID_TOKEN_TYPE
            - AUTH_INVALID_2FA_TOKEN
            - AUTH_INVALID_2FA_CODE
            - AUTH_2FA_NOT_ENABLED
            - AUTH_2FA_SETUP_EXPIRED
            - AUTH_INVALID_WALLET_NONCE
            - AUTH_INVALID_WALLET_SIGNATURE
            - AUTH_WALLET_ADDRESS_REQUIRED
            - AUTH_WALLET_MESSAGE_REQUIRED
            - AUTH_WALLET_SIGNATURE_REQUIRED
            - AUTH_WALLET_NONCE_REQUIRED
            - AUTH_WALLET_CHALLENGE_UNAVAILABLE
            - AUTH_INVALID_OAUTH_CREDENTIAL
            - AUTH_OAUTH_PROVIDER_UNAVAILABLE
            - AUTH_OAUTH_IDENTITY_NOT_FOUND
            - AUTH_OAUTH_IDENTITY_CONFLICT
            - AUTH_OAUTH_LAST_LOGIN_METHOD
            - AUTH_CURRENT_PASSWORD_REQUIRED
            - AUTH_INVALID_CURRENT_PASSWORD
            - AUTH_PASSWORD_NOT_SET
            - AUTH_HANDLE_UNAVAILABLE
            - AUTH_EMAIL_ALREADY_IN_USE
            - AUTH_EMAIL_OTP_EXPIRED
            - AUTH_INVALID_EMAIL_OTP
            - AUTH_EMAIL_OTP_UNAVAILABLE
            - AUTH_RATE_LIMITED
            - AUTH_SESSION_REVOCATION_UNAVAILABLE
            - AUTH_ACCOUNT_NOT_FOUND
          type: string
        statusCode:
          enum:
            - 400
            - 401
            - 403
            - 404
            - 409
            - 429
            - 503
          type: number
        traceId:
          type: string
      required:
        - statusCode
        - message
        - reasonCode
        - traceId
      type: object
    AuthTokensDto:
      properties:
        accessToken:
          type: string
        expiresIn:
          type: number
        refreshToken:
          nullable: true
          type: string
        tokenType:
          example: Bearer
          type: string
        user:
          $ref: '#/components/schemas/AuthUserDto'
      required:
        - accessToken
        - tokenType
        - expiresIn
      type: object
    AuthUserDto:
      properties:
        avatarUrl:
          nullable: true
          type: string
        bio:
          nullable: true
          type: string
        birthYear:
          nullable: true
          type: number
        city:
          nullable: true
          type: string
        countryCode:
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        displayName:
          type: string
        email:
          type: string
        gender:
          allOf:
            - $ref: '#/components/schemas/Gender'
          nullable: true
        handle:
          type: string
        hasPassword:
          type: boolean
        id:
          type: string
        isTwoFactorEnabled:
          type: boolean
        languages:
          items:
            type: string
          type: array
        lastHandleChangeAt:
          format: date-time
          type: string
        oauthProviders:
          items:
            type: string
          type: array
        presenceEmoji:
          nullable: true
          type: string
        presenceStatus:
          nullable: true
          type: string
        presenceText:
          nullable: true
          type: string
        role:
          allOf:
            - $ref: '#/components/schemas/PublicAccountRole'
        socialProfiles:
          items:
            $ref: '#/components/schemas/AuthUserSocialProfileDto'
          type: array
        status:
          allOf:
            - $ref: '#/components/schemas/AccountStatus'
        tags:
          items:
            type: string
          type: array
        tiers:
          $ref: '#/components/schemas/AuthUserTierSummaryDto'
        updatedAt:
          format: date-time
          type: string
        wallets:
          items:
            $ref: '#/components/schemas/AuthUserWalletDto'
          type: array
      required:
        - id
        - handle
        - displayName
        - languages
        - tags
        - status
        - role
        - hasPassword
        - isTwoFactorEnabled
        - wallets
        - oauthProviders
        - socialProfiles
        - tiers
        - createdAt
        - updatedAt
      type: object
    AuthUserSocialProfileDto:
      properties:
        followers:
          type: number
        handle:
          type: string
        isVerified:
          type: boolean
        platform:
          type: string
        url:
          type: string
        verifiedAt:
          format: date-time
          type: string
      required:
        - platform
        - handle
      type: object
    AuthUserTierSummaryDto:
      properties:
        assetTier:
          type: number
        influenceTier:
          type: number
        interactionTier:
          type: number
        vitalityScore:
          type: number
      required:
        - assetTier
        - influenceTier
        - interactionTier
        - vitalityScore
      type: object
    AuthUserWalletDto:
      properties:
        address:
          type: string
        boundOnChains:
          items:
            type: string
          type: array
        chainNamespace:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - address
        - boundOnChains
        - createdAt
      type: object
    BindEmailDto:
      properties:
        email:
          type: string
        emailOtpCode:
          description: 6-digit OTP sent to the target email address
          type: string
        password:
          type: string
      required:
        - email
        - password
        - emailOtpCode
      type: object
    BlockUserBodyDto:
      properties:
        reason:
          maxLength: 500
          type: string
      type: object
    BootstrapOasisWorldDto:
      properties:
        confirm:
          enum:
            - bootstrap-oasis-world-core
          type: string
      required:
        - confirm
      type: object
    BundleDetailDto:
      properties:
        compatibleApps:
          items:
            type: string
          type: array
        coverAssetId:
          type: string
        createdAt:
          type: string
        description:
          type: string
        id:
          type: string
        importPolicy:
          allOf:
            - $ref: '#/components/schemas/ImportPolicyDto'
          nullable: true
          type: object
        members:
          items:
            $ref: '#/components/schemas/BundleMemberDto'
          type: array
        ownerId:
          type: string
        status:
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
          type: string
        tags:
          items:
            type: string
          type: array
        title:
          type: string
        updatedAt:
          type: string
        version:
          type: string
      required:
        - id
        - ownerId
        - coverAssetId
        - title
        - description
        - tags
        - version
        - status
        - compatibleApps
        - members
        - createdAt
        - updatedAt
      type: object
    BundleListDto:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BundleDetailDto'
          type: array
      required:
        - items
      type: object
    BundleMemberDto:
      properties:
        assetId:
          type: string
        sortOrder:
          type: number
      required:
        - assetId
        - sortOrder
      type: object
    CanDmResultDto:
      properties:
        canDm:
          type: boolean
        reason:
          type: string
      required:
        - canDm
      type: object
    CanWithdrawDto:
      properties:
        balance:
          description: Current Gem balance
          type: string
        canWithdraw:
          type: boolean
        connectStatus:
          allOf:
            - $ref: '#/components/schemas/StripeConnectStatus'
        minAmount:
          description: Minimum withdrawal amount in Gems
          type: string
        reason:
          nullable: true
          type: string
      required:
        - canWithdraw
        - balance
        - minAmount
        - connectStatus
      type: object
    ChangeEmailDto:
      properties:
        emailOtpCode:
          description: 6-digit OTP sent to the new email address
          type: string
        newEmail:
          type: string
        password:
          type: string
      required:
        - newEmail
        - password
        - emailOtpCode
      type: object
    CharacterProfileCoreDto:
      additionalProperties: false
      properties:
        assets:
          allOf:
            - additionalProperties: false
              properties:
                externalRefs:
                  items:
                    additionalProperties: false
                    properties:
                      kind:
                        minLength: 1
                        type: string
                      label:
                        type: string
                      purpose:
                        type: string
                      refId:
                        minLength: 1
                        type: string
                      uri:
                        description: >-
                          Absolute HTTPS URI without userinfo, fragments, or
                          credential/expiring-signature query parameters.
                        format: uri
                        pattern: ^https://
                        type: string
                    required:
                      - refId
                      - kind
                      - uri
                    type: object
                  type: array
                intents:
                  items:
                    additionalProperties: false
                    properties:
                      intentId:
                        minLength: 1
                        type: string
                      kind:
                        minLength: 1
                        type: string
                      summary:
                        type: string
                    required:
                      - intentId
                      - kind
                    type: object
                  type: array
                resourceRefs:
                  items:
                    additionalProperties: false
                    properties:
                      kind:
                        minLength: 1
                        type: string
                      label:
                        type: string
                      purpose:
                        type: string
                      refId:
                        minLength: 1
                        type: string
                    required:
                      - refId
                      - kind
                    type: object
                  type: array
              required:
                - resourceRefs
                - intents
              type: object
        authoring:
          allOf:
            - additionalProperties: false
              properties:
                extensions:
                  additionalProperties:
                    additionalProperties: false
                    properties:
                      extensionSchemaVersion:
                        minLength: 1
                        type: string
                      fields:
                        additionalProperties: true
                        type: object
                      namespace:
                        minLength: 1
                        type: string
                      productSemantic:
                        type: boolean
                    required:
                      - extensionSchemaVersion
                      - namespace
                      - productSemantic
                      - fields
                    type: object
                  type: object
                notes:
                  items:
                    type: string
                  type: array
                source:
                  minLength: 1
                  type: string
              required:
                - source
              type: object
        capabilities:
          additionalProperties: false
          properties:
            tools:
              items:
                additionalProperties: false
                properties:
                  name:
                    type: string
                  summary:
                    type: string
                  toolId:
                    minLength: 1
                    type: string
                required:
                  - toolId
                type: object
              type: array
          type: object
        identity:
          allOf:
            - additionalProperties: false
              properties:
                aliases:
                  items:
                    type: string
                  type: array
                handle:
                  type: string
                name:
                  minLength: 1
                  type: string
                summary:
                  minLength: 1
                  type: string
              required:
                - name
                - summary
              type: object
        interactionProfile:
          allOf:
            - additionalProperties: false
              properties:
                cadence:
                  type: string
                dialogueExemplars:
                  items:
                    additionalProperties: false
                    properties:
                      character:
                        minLength: 1
                        type: string
                      exemplarId:
                        minLength: 1
                        type: string
                      user:
                        type: string
                    required:
                      - exemplarId
                      - character
                    type: object
                  type: array
                greeting:
                  type: string
                greetingVariants:
                  items:
                    type: string
                  type: array
                interactionModes:
                  items:
                    type: string
                  type: array
                scenario:
                  type: string
                tone:
                  type: string
              required:
                - interactionModes
              type: object
        knowledge:
          additionalProperties: false
          properties:
            constraints:
              items:
                type: string
              type: array
            topics:
              items:
                type: string
              type: array
          type: object
        narrative:
          allOf:
            - additionalProperties: false
              properties:
                archetype:
                  type: string
                milestones:
                  items:
                    additionalProperties: false
                    properties:
                      milestoneId:
                        minLength: 1
                        type: string
                      sequence:
                        type: number
                      summary:
                        type: string
                      title:
                        type: string
                    required:
                      - milestoneId
                    type: object
                  type: array
                summary:
                  minLength: 1
                  type: string
                traits:
                  items:
                    type: string
                  type: array
              required:
                - summary
              type: object
        presentation:
          allOf:
            - additionalProperties: false
              properties:
                avatarResourceRef:
                  type: string
                displayName:
                  minLength: 1
                  type: string
                profileCoverResourceRef:
                  type: string
                profileLine:
                  type: string
                shortBio:
                  type: string
              required:
                - displayName
              type: object
        profileCoverage:
          $ref: '#/components/schemas/ProfileCoverageManifestV1Dto'
        profileHash:
          pattern: ^[a-f0-9]{64}$
          type: string
        profileSchemaVersion:
          enum:
            - realm.character-profile-core/v1
          type: string
        psychology:
          additionalProperties: false
          properties:
            boundaries:
              items:
                type: string
              type: array
            drives:
              items:
                type: string
              type: array
          type: object
        relationships:
          items:
            additionalProperties: false
            properties:
              relationType:
                minLength: 1
                type: string
              relationshipId:
                minLength: 1
                type: string
              summary:
                type: string
              targetRef:
                additionalProperties: false
                properties:
                  entityId:
                    minLength: 1
                    type: string
                  kind:
                    enum:
                      - worldEntity
                    type: string
                  worldId:
                    minLength: 1
                    type: string
                required:
                  - kind
                  - worldId
                  - entityId
                type: object
            required:
              - relationshipId
              - targetRef
              - relationType
            type: object
          type: array
      required:
        - profileSchemaVersion
        - identity
        - presentation
        - narrative
        - interactionProfile
        - assets
        - authoring
        - profileCoverage
        - profileHash
      type: object
