    OAuthTokenRequestDto:
      properties:
        client_id:
          description: Public client identifier; must be in admitted set (R-OAUTH-007).
          example: nimi-desktop
          type: string
        code:
          description: Authorization code obtained from /api/auth/oauth/authorize redirect.
          type: string
        code_verifier:
          description: >-
            PKCE code_verifier; SHA-256 hash must equal the code_challenge bound
            at issuance (R-OAUTH-003 / R-OAUTH-006).
          type: string
        grant_type:
          description: >-
            Must equal "authorization_code"; any other value fails-close
            unsupported_grant_type (R-OAUTH-010).
          example: authorization_code
          type: string
        redirect_uri:
          description: >-
            Loopback redirect URI; must byte-for-byte match the redirect_uri
            presented at /authorize (R-OAUTH-005 / R-OAUTH-006).
          type: string
      required:
        - grant_type
        - code
        - code_verifier
        - redirect_uri
        - client_id
      type: object
