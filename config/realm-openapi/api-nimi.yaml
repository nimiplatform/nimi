components:
  schemas:
    AbilityDefinitionDto:
      properties:
        cost:
          items:
            $ref: '#/components/schemas/ResourceCostDto'
          type: array
        description:
          type: string
        id:
          type: string
        name:
          type: string
        tierRequired:
          type: number
      required:
        - id
        - name
      type: object
    AccountGrantProjectionRowDto:
      properties:
        appId:
          type: string
        expiresAt:
          format: date-time
          nullable: true
          type: string
        grantId:
          type: string
        qualifier:
          nullable: true
          type: string
        scopeFamily:
          allOf:
            - $ref: '#/components/schemas/AppPermissionScopeFamily'
        scopeName:
          allOf:
            - $ref: '#/components/schemas/AppPermissionScopeName'
        state:
          allOf:
            - $ref: '#/components/schemas/AccountGrantProjectionState'
        subjectAccountId:
          type: string
        version:
          type: number
      required:
        - grantId
        - subjectAccountId
        - appId
        - scopeFamily
        - scopeName
        - state
        - version
      type: object
    AccountGrantProjectionState:
      enum:
        - pending
        - granted
        - denied
        - expired
        - revoked
        - superseded
      type: string
    AccountGrantsProjectionDto:
      properties:
        accountId:
          type: string
        grants:
          items:
            $ref: '#/components/schemas/AccountGrantProjectionRowDto'
          type: array
        schemaVersion:
          type: number
        updatedAt:
          format: date-time
          type: string
      required:
        - schemaVersion
        - accountId
        - updatedAt
        - grants
      type: object
    AccountRole:
      enum:
        - USER
        - AGENT
        - SERVICE_ACC
        - SYSTEM_BOT
        - ADMIN
      type: string
    AccountStatus:
      enum:
        - ONBOARDING
        - CHECK_INVITED
        - ACTIVE
        - SUSPENDED
        - BANNED
      type: string
    AddFriendBodyDto:
      properties:
        requestMessage:
          maxLength: 200
          type: string
      type: object
    AddGroupAgentInputDto:
      properties:
        agentAccountId:
          type: string
      required:
        - agentAccountId
      type: object
    AddGroupParticipantInputDto:
      properties:
        accountId:
          type: string
      required:
        - accountId
      type: object
    AgentAppearanceDto:
      properties:
        artStyle:
          type: string
        eyes:
          type: string
        fashionStyle:
          type: string
        hair:
          type: string
        signatureItems:
          items:
            type: string
          type: array
        skin:
          type: string
      required:
        - artStyle
        - hair
        - eyes
        - skin
        - fashionStyle
        - signatureItems
      type: object
    AgentAuthoringBehaviorCandidatePayloadDto:
      properties:
        directives:
          items:
            type: string
          type: array
      required:
        - directives
      type: object
    AgentAuthoringDialogueCandidatePayloadDto:
      properties:
        exemplars:
          items:
            type: string
          type: array
      required:
        - exemplars
      type: object
    AgentAuthoringDraftBatchDto:
      properties:
        agentId:
          type: string
        appliedAt:
          format: date-time
          nullable: true
          type: string
        candidates:
          items:
            $ref: '#/components/schemas/AgentAuthoringDraftCandidateDto'
          type: array
        createdAt:
          format: date-time
          type: string
        createdBy:
          type: string
        failureCode:
          nullable: true
          type: string
        failureMessage:
          nullable: true
          type: string
        id:
          type: string
        metadata:
          allOf:
            - $ref: '#/components/schemas/AgentAuthoringDraftBatchMetadataDto'
          nullable: true
          type: object
        skeletonId:
          type: string
        sourceKind:
          enum:
            - CBDB
          type: string
        status:
          enum:
            - ready_for_review
            - partially_applied
            - applied
            - failed
          type: string
        updatedAt:
          format: date-time
          type: string
        worldId:
          type: string
      required:
        - id
        - worldId
        - agentId
        - skeletonId
        - sourceKind
        - status
        - createdBy
        - failureCode
        - failureMessage
        - metadata
        - createdAt
        - updatedAt
        - appliedAt
        - candidates
      type: object
    AgentAuthoringDraftBatchListDto:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AgentAuthoringDraftBatchDto'
          type: array
      required:
        - items
      type: object
    AgentAuthoringDraftBatchMetadataDto:
      properties:
        notes:
          nullable: true
          type: string
        runtimeAppId:
          nullable: true
          type: string
        surfaceId:
          nullable: true
          type: string
      type: object
    AgentAuthoringDraftCandidateDto:
      properties:
        appliedAt:
          format: date-time
          nullable: true
          type: string
        editedValue:
          allOf:
            - $ref: '#/components/schemas/AgentAuthoringDraftCandidateValueDto'
          nullable: true
          type: object
        generatedAt:
          format: date-time
          type: string
        id:
          type: string
        modelId:
          type: string
        promptDigestSha256:
          type: string
        provenance:
          $ref: '#/components/schemas/AgentAuthoringRuntimeTraceDto'
        reviewStatus:
          enum:
            - pending
            - accepted
            - rejected
            - edited
            - applied
          type: string
        reviewedAt:
          format: date-time
          nullable: true
          type: string
        reviewerId:
          nullable: true
          type: string
        routePolicy:
          nullable: true
          type: string
        runtimeTraceId:
          nullable: true
          type: string
        sourceRefs:
          items:
            $ref: '#/components/schemas/AgentAuthoringSourceRefDto'
          type: array
        targetKey:
          enum:
            - description
            - contentStyle
            - publicPositioning
            - avatar
            - profileCover
            - voice
            - greeting
            - dialogueExemplars
            - behaviorDna
          type: string
        value:
          $ref: '#/components/schemas/AgentAuthoringDraftCandidateValueDto'
      required:
        - id
        - targetKey
        - value
        - sourceRefs
        - modelId
        - routePolicy
        - promptDigestSha256
        - runtimeTraceId
        - generatedAt
        - reviewStatus
        - reviewerId
        - reviewedAt
        - appliedAt
        - provenance
      type: object
    AgentAuthoringDraftCandidateValueDto:
      properties:
        behavior:
          $ref: '#/components/schemas/AgentAuthoringBehaviorCandidatePayloadDto'
        dialogue:
          $ref: '#/components/schemas/AgentAuthoringDialogueCandidatePayloadDto'
        kind:
          enum:
            - text
            - media
            - voice
            - dialogue
            - behavior
          type: string
        media:
          $ref: '#/components/schemas/AgentAuthoringMediaCandidatePayloadDto'
        provenance:
          items:
            $ref: '#/components/schemas/AgentAuthoringValueProvenanceSegmentDto'
          type: array
        text:
          nullable: true
          type: string
        voice:
          $ref: '#/components/schemas/AgentAuthoringVoiceCandidatePayloadDto'
      required:
        - kind
        - provenance
      type: object
    AgentAuthoringFinalMediaStateDto:
      properties:
        avatarResourceId:
          nullable: true
          type: string
        avatarUrl:
          nullable: true
          type: string
        profileCoverResourceId:
          nullable: true
          type: string
        profileCoverUrl:
          nullable: true
          type: string
      required:
        - avatarUrl
        - avatarResourceId
        - profileCoverUrl
        - profileCoverResourceId
      type: object
    AgentAuthoringFinalStateDto:
      properties:
        media:
          $ref: '#/components/schemas/AgentAuthoringFinalMediaStateDto'
        settings:
          $ref: '#/components/schemas/OwnerAgentSettingsDto'
        voice:
          $ref: '#/components/schemas/AgentAuthoringFinalVoiceStateDto'
      required:
        - settings
        - media
        - voice
      type: object
    AgentAuthoringFinalVoiceStateDto:
      properties:
        voice:
          allOf:
            - $ref: '#/components/schemas/AgentAuthoringVoiceCandidatePayloadDto'
          nullable: true
          type: object
      required:
        - voice
      type: object
    AgentAuthoringGenerationContextDto:
      properties:
        currentFinalState:
          $ref: '#/components/schemas/AgentAuthoringFinalStateDto'
        groundingRefs:
          items:
            $ref: '#/components/schemas/AgentAuthoringSourceRefDto'
          type: array
        requiredTargets:
          items:
            enum:
              - description
              - contentStyle
              - publicPositioning
              - avatar
              - profileCover
              - voice
              - greeting
              - dialogueExemplars
              - behaviorDna
            type: string
          type: array
        sourceSkeleton:
          $ref: '#/components/schemas/CreatorWorldAgentSourceSkeletonDto'
        targetStatuses:
          items:
            $ref: '#/components/schemas/AgentAuthoringTargetStatusDto'
          type: array
      required:
        - sourceSkeleton
        - currentFinalState
        - requiredTargets
        - groundingRefs
        - targetStatuses
      type: object
    AgentAuthoringMediaCandidatePayloadDto:
      properties:
        height:
          type: number
        mime:
          type: string
        model:
          type: string
        moderation:
          $ref: '#/components/schemas/AgentAuthoringMediaModerationDto'
        prompt:
          type: string
        provenance:
          items:
            $ref: '#/components/schemas/AgentAuthoringValueProvenanceSegmentDto'
          type: array
        resourceId:
          type: string
        url:
          type: string
        width:
          type: number
      required:
        - resourceId
        - url
        - prompt
        - model
        - width
        - height
        - mime
        - moderation
        - provenance
      type: object
    AgentAuthoringMediaModerationDto:
      properties:
        provider:
          nullable: true
          type: string
        reason:
          nullable: true
          type: string
        status:
          enum:
            - passed
            - blocked
            - not_checked
          type: string
      required:
        - status
      type: object
    AgentAuthoringRuntimeTraceDto:
      properties:
        promptTemplateId:
          nullable: true
          type: string
        runtimeAppId:
          type: string
        scenarioId:
          nullable: true
          type: string
        skeletonId:
          type: string
        sourceDigestSha256:
          nullable: true
          type: string
        surfaceId:
          type: string
      required:
        - runtimeAppId
        - surfaceId
        - skeletonId
      type: object
    AgentAuthoringSourceRefDto:
      properties:
        factPath:
          nullable: true
          type: string
        label:
          nullable: true
          type: string
        sourceKind:
          nullable: true
          type: string
        sourceRef:
          type: string
      required:
        - sourceRef
      type: object
    AgentAuthoringTargetStatusDto:
      properties:
        appliedAt:
          format: date-time
          nullable: true
          type: string
        latestBatchId:
          nullable: true
          type: string
        latestCandidateId:
          nullable: true
          type: string
        latestReviewStatus:
          enum:
            - pending
            - accepted
            - rejected
            - edited
            - applied
          nullable: true
          type: string
        targetKey:
          enum:
            - description
            - contentStyle
            - publicPositioning
            - avatar
            - profileCover
            - voice
            - greeting
            - dialogueExemplars
            - behaviorDna
          type: string
      required:
        - targetKey
        - latestReviewStatus
        - latestBatchId
        - latestCandidateId
        - appliedAt
      type: object
    AgentAuthoringValueProvenanceSegmentDto:
      properties:
        category:
          enum:
            - source_fact
            - historical_inference
            - creator_preference
            - ai_authored_texture
          type: string
        refs:
          items:
            type: string
          type: array
        summary:
          type: string
      required:
        - category
        - refs
        - summary
      type: object
    AgentAuthoringVoiceCandidatePayloadDto:
      properties:
        historicalClaim:
          enum:
            - narration_direction_not_authentic_voice
          type: string
        narrationDirection:
          type: string
        providerVoiceRef:
          nullable: true
          type: string
        speechModelId:
          nullable: true
          type: string
        speechRoutePolicy:
          enum:
            - local
            - cloud
          nullable: true
          type: string
        voiceAssetResourceId:
          nullable: true
          type: string
      required:
        - historicalClaim
        - narrationDirection
      type: object
    AgentBiologicalDto:
      properties:
        ethnicity:
          type: string
        gender:
          type: string
        heightCm:
          type: number
        visualAge:
          type: string
        weightKg:
          type: number
      required:
        - gender
        - visualAge
        - ethnicity
        - heightCm
        - weightKg
      type: object
    AgentCapabilitiesDto:
      properties:
        canCreate:
          type: boolean
        currentCount:
          type: number
        maxAllowed:
          type: number
        remaining:
          type: number
      required:
        - canCreate
        - currentCount
        - maxAllowed
        - remaining
      type: object
    AgentCategory:
      enum:
        - GENERAL
        - COMPANION
        - ASSISTANT
        - GAME
        - CRYPTO
        - NSFW_AGENT
      type: string
    AgentCommunicationDto:
      properties:
        formality:
          enum:
            - casual
            - formal
            - slang
          type: string
        responseLength:
          enum:
            - short
            - medium
            - long
          type: string
        sentiment:
          enum:
            - positive
            - neutral
            - cynical
          type: string
        summary:
          type: string
      required:
        - responseLength
        - formality
        - sentiment
      type: object
    AgentDisplayDto:
      properties:
        faction:
          type: string
        isNative:
          type: boolean
        isTransitGuest:
          type: boolean
        location:
          type: string
        rank:
          type: string
        role:
          type: string
        sceneName:
          type: string
        statusSummary:
          type: string
        voiceSummary:
          type: string
      required:
        - isNative
        - isTransitGuest
      type: object
    AgentDnaDto:
      properties:
        appearance:
          $ref: '#/components/schemas/AgentAppearanceDto'
        biological:
          $ref: '#/components/schemas/AgentBiologicalDto'
        communication:
          $ref: '#/components/schemas/AgentCommunicationDto'
        identity:
          $ref: '#/components/schemas/AgentIdentityDto'
        nsfwLevel:
          type: string
        personality:
          $ref: '#/components/schemas/AgentPersonalityDto'
        voice:
          $ref: '#/components/schemas/AgentVoiceConfigDto'
      required:
        - identity
        - biological
        - appearance
        - personality
        - communication
      type: object
    AgentFriendLimitDto:
      properties:
        canAdd:
          description: Whether the account can add another AgentFriend.
          type: boolean
        limit:
          description: Single backend-owned baseline agent-friend quota.
          type: number
        used:
          description: Number of active AgentFriend relations the account holds.
          type: number
      required:
        - used
        - limit
        - canAdd
      type: object
    AgentHandleAvailabilityResponseDto:
      properties:
        available:
          type: boolean
        message:
          type: string
        normalized:
          type: string
      required:
        - available
        - normalized
      type: object
    AgentIdentityDto:
      properties:
        name:
          type: string
        role:
          type: string
        species:
          type: string
        summary:
          type: string
        worldview:
          type: string
      required:
        - name
        - role
        - worldview
        - species
      type: object
    AgentImportance:
      enum:
        - PRIMARY
        - SECONDARY
        - BACKGROUND
      type: string
    AgentMetadataDto:
      properties:
        activeWorldId:
          type: string
        category:
          allOf:
            - $ref: '#/components/schemas/AgentCategory'
        importance:
          allOf:
            - $ref: '#/components/schemas/AgentImportance'
        origin:
          allOf:
            - $ref: '#/components/schemas/AgentOrigin'
        ownerWorldId:
          nullable: true
          type: string
        ownershipType:
          allOf:
            - $ref: '#/components/schemas/AgentOwnershipType'
        state:
          allOf:
            - $ref: '#/components/schemas/AgentState'
        tier:
          allOf:
            - $ref: '#/components/schemas/VerificationTier'
        wakeStrategy:
          allOf:
            - $ref: '#/components/schemas/AgentWakeStrategy'
        worldId:
          type: string
      type: object
    AgentOrigin:
      enum:
        - COMMUNITY
        - NAF
        - PARTNER
        - SYSTEM
      type: string
    AgentOriginDto:
      properties:
        agentId:
          type: string
        isNative:
          description: Whether Agent is native to the World
          type: boolean
        masterId:
          description: Agent creator (Master) ID
          type: string
        worldCreatorId:
          description: World creator ID (null for OASIS world)
          nullable: true
          type: string
        worldId:
          description: World ID the Agent belongs to
          type: string
      required:
        - agentId
        - masterId
        - worldId
        - worldCreatorId
        - isNative
      type: object
    AgentOwnershipType:
      enum:
        - MASTER_OWNED
        - WORLD_OWNED
      type: string
    AgentPersonalityDto:
      properties:
        emotionBaseline:
          type: string
        goals:
          items:
            type: string
          type: array
        interests:
          items:
            type: string
          type: array
        mbti:
          type: string
        relationshipMode:
          type: string
        summary:
          type: string
      required:
        - mbti
        - interests
        - goals
        - relationshipMode
      type: object
    AgentProfileDto:
      properties:
        activeWorldId:
          type: string
        greeting:
          description: >-
            Ordinary RealmAgent first-turn opening message
            (AgentProfile.greeting). When present and non-empty, an empty
            AgentFriend chat thread opens with it as the first assistant
            message.
          nullable: true
          type: string
        importance:
          allOf:
            - $ref: '#/components/schemas/AgentImportance'
        ownerWorldId:
          nullable: true
          type: string
        ownershipType:
          allOf:
            - $ref: '#/components/schemas/AgentOwnershipType'
        state:
          allOf:
            - $ref: '#/components/schemas/AgentState'
        stats:
          $ref: '#/components/schemas/AgentStatsDto'
        worldId:
          type: string
      type: object
    AgentRelationType:
      enum:
        - ALLY
        - RIVAL
        - ENEMY
      type: string
    AgentRelationshipOtherAccountDto:
      properties:
        avatarUrl:
          nullable: true
          type: string
        displayName:
          nullable: true
          type: string
        handle:
          type: string
        id:
          type: string
        isAgent:
          type: boolean
      required:
        - id
        - handle
        - displayName
        - avatarUrl
        - isAgent
      type: object
    AgentRelationshipRecordDto:
      properties:
        context:
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        direction:
          type: string
        id:
          type: string
        otherAccount:
          $ref: '#/components/schemas/AgentRelationshipOtherAccountDto'
        strength:
          type: number
        type:
          allOf:
            - $ref: '#/components/schemas/AgentRelationType'
      required:
        - id
        - type
        - strength
        - context
        - createdAt
        - direction
        - otherAccount
      type: object
    AgentResponseMetadataDto:
      properties:
        activeWorldId:
          nullable: true
          type: string
        category:
          nullable: true
          type: string
        importance:
          allOf:
            - $ref: '#/components/schemas/AgentImportance'
          nullable: true
        origin:
          allOf:
            - $ref: '#/components/schemas/AgentOrigin'
        ownerWorldId:
          nullable: true
          type: string
        ownershipType:
          allOf:
            - $ref: '#/components/schemas/AgentOwnershipType'
        state:
          allOf:
            - $ref: '#/components/schemas/AgentState'
        tier:
          allOf:
            - $ref: '#/components/schemas/VerificationTier'
        wakeStrategy:
          nullable: true
          type: string
        worldId:
          type: string
      type: object
    AgentResponseProfileDto:
      properties:
        activeWorldId:
          nullable: true
          type: string
        importance:
          allOf:
            - $ref: '#/components/schemas/AgentImportance'
          nullable: true
        ownerWorldId:
          nullable: true
          type: string
        ownershipType:
          allOf:
            - $ref: '#/components/schemas/AgentOwnershipType'
        state:
          allOf:
            - $ref: '#/components/schemas/AgentState'
        stats:
          $ref: '#/components/schemas/AgentResponseProfileStatsDto'
        worldId:
          type: string
      type: object
    AgentResponseProfileStatsDto:
      properties:
        engagementCount:
          type: number
        influenceTier:
          type: number
        interactionTier:
          type: number
        lastActiveAt:
          format: date-time
          nullable: true
          type: string
        vitalityScore:
          type: number
      type: object
    AgentResponseTierSummaryDto:
      properties:
        assetTier:
          type: number
        influenceTier:
          type: number
        interactionTier:
          type: number
        vitalityScore:
          type: number
      type: object
    AgentResponseUserDto:
      properties:
        agent:
          $ref: '#/components/schemas/AgentResponseMetadataDto'
        agentProfile:
          $ref: '#/components/schemas/AgentResponseProfileDto'
        avatarUrl:
          nullable: true
          type: string
        bio:
          nullable: true
          type: string
        createdAt:
          type: string
        displayName:
          type: string
        friendCount:
          description: >-
            Owner-visible friend count for this account. For RealmAgent users,
            this is derived from ACTIVE HUMAN_AGENT Friendship rows.
          type: number
        handle:
          type: string
        id:
          type: string
        isAgent:
          type: boolean
        isOnline:
          type: boolean
        presenceEmoji:
          nullable: true
          type: string
        presenceStatus:
          nullable: true
          type: string
        presenceText:
          nullable: true
          type: string
        profileCoverUrl:
          nullable: true
          type: string
        stats:
          $ref: '#/components/schemas/AgentStatsDto'
        status:
          allOf:
            - $ref: '#/components/schemas/AccountStatus'
        tiers:
          $ref: '#/components/schemas/AgentResponseTierSummaryDto'
      required:
        - id
        - handle
        - displayName
        - createdAt
      type: object
    AgentRuleDto:
      properties:
        agentId:
          type: string
        category:
          enum:
            - CONSTRAINT
            - MECHANISM
            - DEFINITION
            - RELATION
            - POLICY
          type: string
        conflictsWith:
          items:
            type: string
          type: array
        createdAt:
          format: date-time
          type: string
        createdBy:
          type: string
        dependsOn:
          items:
            type: string
          type: array
        hardness:
          enum:
            - HARD
            - FIRM
            - SOFT
            - AESTHETIC
          type: string
        id:
          type: string
        importance:
          type: number
        inheritedWorldDomain:
          enum:
            - AXIOM
            - PHYSICS
            - SOCIETY
            - ECONOMY
            - CHARACTER
            - NARRATIVE
            - META
          type: string
        layer:
          enum:
            - DNA
            - BEHAVIORAL
            - RELATIONAL
            - CONTEXTUAL
          type: string
        lineageId:
          type: string
        priority:
          type: number
        provenance:
          enum:
            - CREATOR
            - WORLD_INHERITED
            - NARRATIVE_EMERGED
            - SYSTEM
          type: string
        reasoning:
          type: string
        ruleKey:
          type: string
        scope:
          enum:
            - SELF
            - DYAD
            - GROUP
            - WORLD
          type: string
        sourceRef:
          type: string
        statement:
          type: string
        status:
          enum:
            - ACTIVE
            - DEPRECATED
            - SUPERSEDED
            - PROPOSED
            - ARCHIVED
          type: string
        structured:
          additionalProperties: true
          type: object
        title:
          type: string
        updatedAt:
          format: date-time
          type: string
        updatedBy:
