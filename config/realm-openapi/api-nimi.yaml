components:
  schemas:
    AccountGrantViewRowDto:
      properties:
        appId:
          type: string
        expiresAt:
          format: date-time
          nullable: true
          type: string
        grantId:
          type: string
        qualifier:
          nullable: true
          type: string
        scopeFamily:
          allOf:
            - $ref: '#/components/schemas/AppPermissionScopeFamily'
        scopeName:
          allOf:
            - $ref: '#/components/schemas/AppPermissionScopeName'
        state:
          allOf:
            - $ref: '#/components/schemas/AccountGrantViewState'
        subjectAccountId:
          type: string
        version:
          type: number
      required:
        - grantId
        - subjectAccountId
        - appId
        - scopeFamily
        - scopeName
        - state
        - version
      type: object
    AccountGrantViewState:
      enum:
        - pending
        - granted
        - denied
        - expired
        - revoked
        - superseded
      type: string
    AccountGrantsViewDto:
      properties:
        accountId:
          type: string
        grants:
          items:
            $ref: '#/components/schemas/AccountGrantViewRowDto'
          type: array
        schemaVersion:
          type: number
        updatedAt:
          format: date-time
          type: string
      required:
        - schemaVersion
        - accountId
        - updatedAt
        - grants
      type: object
    AccountRelationType:
      enum:
        - ALLY
        - RIVAL
        - ENEMY
      type: string
    AccountStatus:
      enum:
        - ONBOARDING
        - CHECK_INVITED
        - ACTIVE
        - SUSPENDED
        - BANNED
      type: string
    AddFriendBodyDto:
      properties:
        requestMessage:
          maxLength: 200
          type: string
      type: object
    AddGroupParticipantInputDto:
      properties:
        accountId:
          type: string
      required:
        - accountId
      type: object
    AddGroupSourceParticipantInputDto:
      properties:
        sourceRef:
          $ref: '#/components/schemas/GroupSourceRefDto'
      required:
        - sourceRef
      type: object
    AppPermissionGrantDecisionDto:
      properties:
        expectedVersion:
          minimum: 1
          type: number
        reason:
          maxLength: 2000
          type: string
      required:
        - expectedVersion
      type: object
    AppPermissionGrantDto:
      properties:
        appId:
          type: string
        deniedAt:
          format: date-time
          nullable: true
          type: string
        deniedByAccountId:
          nullable: true
          type: string
        expiredAt:
          format: date-time
          nullable: true
          type: string
        expiresAt:
          format: date-time
          nullable: true
          type: string
        grantId:
          type: string
        grantedAt:
          format: date-time
          nullable: true
          type: string
        grantedByAccountId:
          nullable: true
          type: string
        qualifier:
          nullable: true
          type: string
        reason:
          type: string
        requestedAt:
          format: date-time
          type: string
        requestedByAccountId:
          type: string
        revokedAt:
          format: date-time
          nullable: true
          type: string
        revokedByAccountId:
          nullable: true
          type: string
        scopeFamily:
          allOf:
            - $ref: '#/components/schemas/AppPermissionScopeFamily'
        scopeName:
          allOf:
            - $ref: '#/components/schemas/AppPermissionScopeName'
        state:
          allOf:
            - $ref: '#/components/schemas/AppPermissionGrantState'
        subjectAccountId:
          type: string
        supersededAt:
          format: date-time
          nullable: true
          type: string
        supersededByAccountId:
          nullable: true
          type: string
        supersededByGrantId:
          nullable: true
          type: string
        version:
          type: number
      required:
        - grantId
        - subjectAccountId
        - appId
        - scopeFamily
        - scopeName
        - state
        - reason
        - version
        - requestedAt
        - requestedByAccountId
      type: object
    AppPermissionGrantGrantDto:
      properties:
        expectedVersion:
          minimum: 1
          type: number
        expiresAt:
          format: date-time
          type: string
        reason:
          maxLength: 2000
          type: string
      required:
        - expectedVersion
      type: object
    AppPermissionGrantListDto:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AppPermissionGrantDto'
          type: array
      required:
        - items
      type: object
    AppPermissionGrantRequestDto:
      properties:
        appId:
          type: string
        qualifier:
          maxLength: 160
          type: string
        reason:
          maxLength: 2000
          type: string
        scopeFamily:
          allOf:
            - $ref: '#/components/schemas/AppPermissionScopeFamily'
        scopeName:
          allOf:
            - $ref: '#/components/schemas/AppPermissionScopeName'
      required:
        - appId
        - scopeFamily
        - scopeName
        - reason
      type: object
    AppPermissionGrantState:
      enum:
        - PENDING
        - GRANTED
        - DENIED
        - EXPIRED
        - REVOKED
        - SUPERSEDED
      type: string
    AppPermissionGrantStatusDto:
      properties:
        generatedAt:
          format: date-time
          type: string
        grants:
          items:
            $ref: '#/components/schemas/AppPermissionGrantDto'
          type: array
      required:
        - generatedAt
        - grants
      type: object
    AppPermissionGrantSupersedeDto:
      properties:
        expectedVersion:
          minimum: 1
          type: number
        reason:
          maxLength: 2000
          type: string
        supersededByGrantId:
          type: string
      required:
        - expectedVersion
      type: object
    AppPermissionScopeFamily:
      enum:
        - account
        - data
        - realm_source
        - ai_spend
        - memory
        - knowledge
        - notification
        - file_device
        - audit
        - ai_profile
      type: string
    AppPermissionScopeName:
      enum:
        - account.read
        - account.session.read
        - data.scope.read
        - data.scope.write
        - realm_source.snapshot.consume
        - realm_source.snapshot.bind
        - ai.spend.meter
        - ai.spend.delegate
        - memory.read.bounded
        - memory.write.admitted
        - knowledge.read.bounded
        - knowledge.write.admitted
        - notification.send
        - notification.subscribe
        - file.read.scoped
        - file.write.scoped
        - device.use.scoped
        - audit.read.scoped
        - ai_profile.selection.consume
      type: string
    AssetDetailDto:
      properties:
        authorId:
          type: string
        clonePolicy:
          enum:
            - ALLOW
            - DENY
            - INHERIT
          type: string
        createdAt:
          type: string
        id:
          type: string
        kind:
          enum:
            - WORK
            - ITEM
          type: string
        originKind:
          enum:
            - ORIGINAL
            - CLONE
            - DERIVED
          type: string
        ownerId:
          type: string
        previewResourceId:
          nullable: true
          type: string
        resourceRefs:
          items:
            type: string
          type: array
        rootAssetId:
          nullable: true
          type: string
        sourceAssetId:
          nullable: true
          type: string
        status:
          enum:
            - DRAFT
            - READY
            - ARCHIVED
            - DELETED
          type: string
        structuredPayload:
          additionalProperties: true
          nullable: true
          type: object
        transferPolicy:
          enum:
            - ALLOW
            - DENY
            - INHERIT
          type: string
        updatedAt:
          type: string
        usePolicy:
          allOf:
            - $ref: '#/components/schemas/UsePolicyDto'
          nullable: true
          type: object
      required:
        - id
        - kind
        - status
        - originKind
        - ownerId
        - authorId
        - resourceRefs
        - transferPolicy
        - clonePolicy
        - createdAt
        - updatedAt
      type: object
    AssetListDto:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AssetDetailDto'
          type: array
      required:
        - items
      type: object
    AttachmentDisplayKind:
      enum:
        - IMAGE
        - VIDEO
        - AUDIO
        - TEXT
        - CARD
      type: string
    AttachmentEnvelopeDto:
      properties:
        displayKind:
          allOf:
            - $ref: '#/components/schemas/AttachmentDisplayKind'
        duration:
          type: number
        height:
          type: number
        preview:
          $ref: '#/components/schemas/AttachmentEnvelopeDto'
        subtitle:
          type: string
        targetId:
          type: string
        targetType:
          allOf:
            - $ref: '#/components/schemas/AttachmentTargetType'
        thumbnail:
          type: string
        title:
          type: string
        url:
          type: string
        width:
          type: number
      required:
        - targetType
        - targetId
      type: object
    AttachmentReferenceDto:
      properties:
        targetId:
          type: string
        targetType:
          allOf:
            - $ref: '#/components/schemas/AttachmentTargetType'
      required:
        - targetType
        - targetId
      type: object
    AttachmentTargetType:
      enum:
        - RESOURCE
        - ASSET
        - BUNDLE
      type: string
    Auth2faVerifyDto:
      properties:
        code:
          type: string
        tempToken:
          type: string
      required:
        - tempToken
        - code
      type: object
    AuthTokensDto:
      properties:
        accessToken:
          type: string
        expiresIn:
          type: number
        refreshToken:
          nullable: true
          type: string
        tokenType:
          example: Bearer
          type: string
        user:
          $ref: '#/components/schemas/AuthUserDto'
      required:
        - accessToken
        - tokenType
        - expiresIn
      type: object
    AuthUserDto:
      properties:
        avatarUrl:
          nullable: true
          type: string
        bio:
          nullable: true
          type: string
        birthYear:
          nullable: true
          type: number
        city:
          nullable: true
          type: string
        countryCode:
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        displayName:
          type: string
        email:
          type: string
        gender:
          allOf:
            - $ref: '#/components/schemas/Gender'
          nullable: true
        handle:
          type: string
        hasPassword:
          type: boolean
        id:
          type: string
        isTwoFactorEnabled:
          type: boolean
        languages:
          items:
            type: string
          type: array
        lastHandleChangeAt:
          format: date-time
          type: string
        oauthProviders:
          items:
            type: string
          type: array
        presenceEmoji:
          nullable: true
          type: string
        presenceStatus:
          nullable: true
          type: string
        presenceText:
          nullable: true
          type: string
        role:
          allOf:
            - $ref: '#/components/schemas/PublicAccountRole'
        socialProfiles:
          items:
            $ref: '#/components/schemas/AuthUserSocialProfileDto'
          type: array
        status:
          allOf:
            - $ref: '#/components/schemas/AccountStatus'
        tags:
          items:
            type: string
          type: array
        tiers:
          $ref: '#/components/schemas/AuthUserTierSummaryDto'
        updatedAt:
          format: date-time
          type: string
        wallets:
          items:
            $ref: '#/components/schemas/AuthUserWalletDto'
          type: array
      required:
        - id
        - handle
        - displayName
        - languages
        - tags
        - status
        - role
        - hasPassword
        - isTwoFactorEnabled
        - wallets
        - oauthProviders
        - socialProfiles
        - tiers
        - createdAt
        - updatedAt
      type: object
    AuthUserSocialProfileDto:
      properties:
        followers:
          type: number
        handle:
          type: string
        isVerified:
          type: boolean
        platform:
          type: string
        url:
          type: string
        verifiedAt:
          format: date-time
          type: string
      required:
        - platform
        - handle
      type: object
    AuthUserTierSummaryDto:
      properties:
        assetTier:
          type: number
        influenceTier:
          type: number
        interactionTier:
          type: number
        vitalityScore:
          type: number
      required:
        - assetTier
        - influenceTier
        - interactionTier
        - vitalityScore
      type: object
    AuthUserWalletDto:
      properties:
        address:
          type: string
        boundOnChains:
          items:
            type: string
          type: array
        chainNamespace:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - address
        - boundOnChains
        - createdAt
      type: object
    BindEmailDto:
      properties:
        email:
          type: string
        emailOtpCode:
          description: 6-digit OTP sent to the target email address
          type: string
        password:
          type: string
      required:
        - email
        - password
        - emailOtpCode
      type: object
    BlockUserBodyDto:
      properties:
        reason:
          maxLength: 500
          type: string
      type: object
    BootstrapOasisWorldDto:
      properties:
        confirm:
          enum:
            - bootstrap-oasis-world-core
          type: string
      required:
        - confirm
      type: object
    BundleDetailDto:
      properties:
        compatibleApps:
          items:
            type: string
          type: array
        coverAssetId:
          type: string
        createdAt:
          type: string
        description:
          type: string
        id:
          type: string
        importPolicy:
          allOf:
            - $ref: '#/components/schemas/ImportPolicyDto'
          nullable: true
          type: object
        members:
          items:
            $ref: '#/components/schemas/BundleMemberDto'
          type: array
        ownerId:
          type: string
        status:
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
          type: string
        tags:
          items:
            type: string
          type: array
        title:
          type: string
        updatedAt:
          type: string
        version:
          type: string
      required:
        - id
        - ownerId
        - coverAssetId
        - title
        - description
        - tags
        - version
        - status
        - compatibleApps
        - members
        - createdAt
        - updatedAt
      type: object
    BundleListDto:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BundleDetailDto'
          type: array
      required:
        - items
      type: object
    BundleMemberDto:
      properties:
        assetId:
          type: string
        sortOrder:
          type: number
      required:
        - assetId
        - sortOrder
      type: object
    CanWithdrawDto:
      properties:
        balance:
          description: Current Gem balance
          type: string
        canWithdraw:
          type: boolean
        connectStatus:
          allOf:
            - $ref: '#/components/schemas/StripeConnectStatus'
        minAmount:
          description: Minimum withdrawal amount in Gems
          type: string
        reason:
          nullable: true
          type: string
      required:
        - canWithdraw
        - balance
        - minAmount
        - connectStatus
      type: object
    ChangeEmailDto:
      properties:
        emailOtpCode:
          description: 6-digit OTP sent to the new email address
          type: string
        newEmail:
          type: string
        password:
          type: string
      required:
        - newEmail
        - password
        - emailOtpCode
      type: object
    ChatEventEnvelopeDto:
      properties:
        actorId:
          type: string
        chatId:
          type: string
        eventId:
          type: string
        kind:
          type: string
        occurredAt:
          type: string
        payload:
          additionalProperties: true
          type: object
        seq:
          type: number
        sessionId:
          type: string
      required:
        - sessionId
        - seq
        - eventId
        - chatId
        - kind
        - occurredAt
        - actorId
        - payload
      type: object
    ChatFriendRequestPayloadDto:
      properties:
        requestId:
          type: string
        requestMessage:
          type: string
        status:
          type: string
      required:
        - requestId
        - status
      type: object
    ChatGiftPayloadDto:
      properties:
        amount:
          type: number
        interactionId:
          type: string
        status:
          type: string
        tokenSymbol:
          type: string
      required:
        - interactionId
      type: object
    ChatLinkRefPayloadDto:
      properties:
        title:
          type: string
        url:
          type: string
      required:
        - url
      type: object
    ChatPostRefPayloadDto:
      properties:
        postId:
          type: string
      required:
        - postId
      type: object
    ChatSyncResultDto:
      properties:
        events:
          items:
            $ref: '#/components/schemas/ChatEventEnvelopeDto'
          type: array
        highWatermarkSeq:
          type: number
        mode:
          enum:
            - delta
            - full
          type: string
        snapshot:
          $ref: '#/components/schemas/ChatSyncSnapshotDto'
      required:
        - mode
        - highWatermarkSeq
        - events
      type: object
    ChatSyncSnapshotDto:
      properties:
        chat:
          $ref: '#/components/schemas/ChatViewDto'
        messages:
          items:
            $ref: '#/components/schemas/MessageViewDto'
          type: array
      required:
        - chat
        - messages
      type: object
    ChatTextPayloadDto:
      properties:
        content:
          type: string
      required:
        - content
      type: object
    ChatUserRefPayloadDto:
      properties:
        snapshot:
          additionalProperties: true
          type: object
        userId:
          type: string
      required:
        - userId
      type: object
    ChatViewDto:
      properties:
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        lastMessage:
          allOf:
            - $ref: '#/components/schemas/MessageViewDto'
          nullable: true
          type: object
        lastMessageAt:
          format: date-time
          nullable: true
          type: string
        otherUser:
          $ref: '#/components/schemas/UserLiteDto'
        unreadCount:
          type: number
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - createdAt
        - updatedAt
        - lastMessageAt
        - unreadCount
        - otherUser
        - lastMessage
      type: object
    CheckEmailDto:
      properties:
        email:
          description: Email address to check
          type: string
      required:
        - email
      type: object
    CheckEmailResponseDto:
      properties:
        available:
          description: Whether the email is available (not registered)
          type: boolean
        entryRoute:
          description: Recommended auth entry route for this email address
          enum:
            - register_with_otp
            - login_with_otp
            - login_with_password
          type: string
      required:
        - available
        - entryRoute
      type: object
    CloneAssetDto:
      properties:
        clonePolicy:
          enum:
            - ALLOW
            - DENY
            - INHERIT
          type: string
        ownerId:
          type: string
        status:
          enum:
            - DRAFT
            - READY
            - ARCHIVED
            - DELETED
          type: string
        transferPolicy:
          enum:
            - ALLOW
            - DENY
            - INHERIT
          type: string
        usePolicy:
          allOf:
            - $ref: '#/components/schemas/UsePolicyDto'
          nullable: true
          type: object
      type: object
    CommitRealmGroupSourceMessageCandidateInputDto:
      properties:
        auditLineageRef:
          type: string
        body:
          type: string
        bodyHash:
          type: string
        candidateEvidenceRef:
          type: string
        candidateId:
          type: string
        candidateKind:
          enum:
            - REALM_GROUP_MESSAGE_CANDIDATE
          type: string
        commitDisposition:
          enum:
            - MESSAGE_CANDIDATE
            - REFUSAL_CANDIDATE
          type: string
        createdAt:
          format: date-time
          type: string
        evidenceHash:
          type: string
        expectedRuntimeParticipantSlotId:
          type: string
        expectedRuntimeSourceRef:
          type: string
        expiresAt:
          format: date-time
          type: string
        idempotencyKey:
          type: string
        messageType:
          enum:
            - TEXT
          type: string
        outputCandidateRef:
          type: string
        policyVerdictRef:
          type: string
        refusalCode:
          type: string
        refusalHash:
          type: string
        refusalReason:
          type: string
        runtimeTraceRef:
          type: string
        triggerRef:
          type: string
      required:
        - candidateId
        - candidateKind
        - candidateEvidenceRef
        - evidenceHash
        - runtimeTraceRef
        - expectedRuntimeParticipantSlotId
        - expectedRuntimeSourceRef
        - triggerRef
        - outputCandidateRef
        - auditLineageRef
        - policyVerdictRef
        - createdAt
        - expiresAt
        - commitDisposition
        - idempotencyKey
      type: object
    ConnectDashboardLinkDto:
      properties:
        url:
          type: string
      required:
        - url
      type: object
    ConnectOnboardingResponseDto:
      properties:
        accountId:
          type: string
        onboardingUrl:
          type: string
      required:
        - accountId
        - onboardingUrl
      type: object
    ContentRatingString:
      enum:
        - UNRATED
        - G
        - PG13
        - R18
        - EXPLICIT
      type: string
    CreateAssetDto:
      properties:
        authorId:
          type: string
        clonePolicy:
          enum:
            - ALLOW
            - DENY
            - INHERIT
          type: string
        kind:
          enum:
            - WORK
            - ITEM
          type: string
        originKind:
          enum:
            - ORIGINAL
            - CLONE
            - DERIVED
          type: string
        ownerId:
          type: string
        previewResourceId:
          nullable: true
          type: string
        resourceRefs:
          items:
            type: string
          type: array
        rootAssetId:
          type: string
        sourceAssetId:
          type: string
        status:
          enum:
            - DRAFT
            - READY
            - ARCHIVED
            - DELETED
          type: string
        structuredPayload:
          additionalProperties: true
          type: object
        transferPolicy:
          enum:
            - ALLOW
            - DENY
            - INHERIT
          type: string
        usePolicy:
          allOf:
            - $ref: '#/components/schemas/UsePolicyDto'
          nullable: true
          type: object
      required:
        - kind
        - originKind
        - transferPolicy
        - clonePolicy
      type: object
    CreateAudioDirectUploadDto:
      properties:
        controllerId:
          type: string
        controllerKind:
          enum:
            - ACCOUNT
            - WORLD
          type: string
        deliveryAccess:
          enum:
            - PUBLIC
            - SIGNED
          type: string
        durationSec:
          type: number
        filename:
          description: Original filename for extension inference
          type: string
        hashSha256:
          type: string
        height:
          type: number
        instrumental:
          type: boolean
        label:
          type: string
        lyricsSource:
          type: string
        metadata:
          additionalProperties: true
          type: object
        mimeType:
          type: string
        sizeBytes:
          type: number
        sourceArtifactId:
          type: string
        sourceJobId:
          type: string
        sourceRef:
          type: string
        style:
          type: string
        tags:
          items:
            type: string
          type: array
        title:
          type: string
        traceId:
          type: string
        width:
          type: number
        worldId:
          type: string
      type: object
    CreateBundleDto:
      properties:
        compatibleApps:
          items:
            type: string
          type: array
        coverAssetId:
          type: string
        description:
          type: string
        importPolicy:
          allOf:
            - $ref: '#/components/schemas/ImportPolicyDto'
          nullable: true
          type: object
        memberAssetIds:
          items:
            type: string
          type: array
        status:
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
          type: string
        tags:
          items:
            type: string
          type: array
        title:
          type: string
        version:
          type: string
      required:
        - memberAssetIds
        - coverAssetId
        - title
        - description
        - version
      type: object
    CreateConnectOnboardingDto:
