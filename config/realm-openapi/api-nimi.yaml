    IntrospectSessionRequestDto:
      properties:
        audience:
          description: JWT `aud` claim — audience, MUST match the stored row.
          type: string
        expires_at:
          description: >-
            JWT `exp` rendered as RFC3339 — diagnostic only; Runtime validates
            temporal claims and Realm does not compare it with the stored row.
            The response echoes the stored value (TTL invariant, K-AUTHN-006).
          type: string
        issued_at:
          description: >-
            JWT `iat` rendered as RFC3339 — diagnostic only; Runtime validates
            temporal claims and Realm does not compare it with the stored row.
          type: string
        issuer:
          description: JWT `iss` claim — issuer, MUST match the stored row.
          type: string
        session_id:
          description: JWT `sid` claim — opaque ULID identifying the session record.
          type: string
        subject_user_id:
          description: JWT `sub` claim — subject user id, MUST match the stored row.
          type: string
      required:
        - session_id
        - subject_user_id
        - issuer
        - audience
        - issued_at
        - expires_at
      type: object
    IntrospectSessionResponseDto:
      properties:
        active:
          description: >-
            true only when the session row exists, subject/issuer/audience match
            the stored row, and the row is not revoked.
          type: boolean
        expires_at:
          description: >-
            RFC3339 echo of the stored row's `expires_at`. Omitted only when the
            session row was not found (K-AUTHN-006 TTL invariant).
          type: string
        revoked:
          description: >-
            true only when the matched session row carries a `revoked_at`
            timestamp; missing or identity-mismatched rows use the non-revealing
            unknown-session shape with revoked=false.
          type: boolean
      required:
        - active
        - revoked
      type: object
