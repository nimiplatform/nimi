  /api/auth/jwks:
    get:
      operationId: getAuthJwks
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  keys:
                    items:
                      additionalProperties: false
                      properties:
                        alg:
                          enum:
                            - RS256
                          type: string
                        e:
                          type: string
                        kid:
                          type: string
                        kty:
                          enum:
                            - RSA
                          type: string
                        'n':
                          type: string
                        use:
                          enum:
                            - sig
                          type: string
                      required:
                        - kid
                        - use
                        - alg
                        - kty
                        - 'n'
                        - e
                      type: object
                    minItems: 1
                    type: array
                required:
                  - keys
                type: object
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorDto'
          description: Authentication rate limit exceeded
      summary: Get JWKS
      tags:
        - Jwks
  /api/auth/jwks/source-materialization:
    get:
      operationId: getSourceMaterializationJwks
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  keys:
                    items:
                      additionalProperties: false
                      properties:
                        alg:
                          enum:
                            - RS256
                          type: string
                        e:
                          type: string
                        key_ops:
                          items:
                            enum:
                              - verify
                            type: string
                          maxItems: 1
                          minItems: 1
                          type: array
                        kid:
                          type: string
                        kty:
                          enum:
                            - RSA
                          type: string
                        'n':
                          type: string
                        purpose:
                          enum:
                            - realm-source-materialization
                          type: string
                        use:
                          enum:
                            - sig
                          type: string
                      required:
                        - kid
                        - use
                        - alg
                        - kty
                        - 'n'
                        - e
                        - purpose
                        - key_ops
                      type: object
                    minItems: 1
                    type: array
                required:
                  - keys
                type: object
          description: ''
          headers:
            Cache-Control:
              description: >-
                Current materialization key authority; stale caches are
                forbidden.
              schema:
                example: no-store, max-age=0
                type: string
            Pragma:
              description: Legacy intermediary cache prevention.
              schema:
                example: no-cache
                type: string
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorDto'
          description: Authentication rate limit exceeded
      summary: Get Realm source materialization verification JWKS
      tags:
        - Jwks
