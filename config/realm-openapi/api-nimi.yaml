      properties:
        active:
          description: >-
            true only when the session row exists, is not revoked, and `now <
            expires_at`.
          type: boolean
        expires_at:
          description: >-
            RFC3339 echo of the stored row's `expires_at`. Omitted only when the
            session row was not found (K-AUTHN-006 TTL invariant).
          type: string
        revoked:
          description: >-
            true when the session row carries a `revoked_at` timestamp or any
            presented claim diverges from the stored row.
          type: boolean
      required:
        - active
        - revoked
