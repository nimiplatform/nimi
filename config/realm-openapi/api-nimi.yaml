    CharacterSourceRefV3Dto:
      discriminator:
        mapping:
          personaCharacter: '#/components/schemas/PersonaCharacterSourceRefV3Dto'
          worldCharacter: '#/components/schemas/WorldCharacterSourceRefV3Dto'
        propertyName: kind
      oneOf:
        - $ref: '#/components/schemas/WorldCharacterSourceRefV3Dto'
        - $ref: '#/components/schemas/PersonaCharacterSourceRefV3Dto'
    ChatEventEnvelopeDto:
      properties:
        actorId:
          type: string
        chatId:
          type: string
        eventId:
          type: string
        kind:
          type: string
        occurredAt:
          type: string
        payload:
          additionalProperties: true
          type: object
        seq:
          type: number
        sessionId:
          type: string
      required:
        - sessionId
        - seq
        - eventId
        - chatId
        - kind
        - occurredAt
        - actorId
        - payload
      type: object
    ChatFriendRequestPayloadDto:
      properties:
