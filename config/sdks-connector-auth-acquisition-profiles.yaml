# Non-authoritative SDK connector acquisition configuration.
# Normative authority: .nimi/spec/sdks/feature-clients.authority.yaml#definition.nimi.sdks.feature-clients.connector-auth-plane
version: 1
table_family: product_catalog
owner: sdks
catalog_id: sdks_connector_auth_acquisition_profiles
entries:
  - openai_chatgpt_plan
profiles:
  - profile_id: openai_chatgpt_plan
    provider_auth_profile: openai_chatgpt_plan
    issuer: https://auth.openai.com
    initial_client_id: dynamic_agent_client
    agent_name_hint: Nimi
    authorization_url: https://auth.openai.com/api/accounts/authorize
    token_url: https://auth.openai.com/api/accounts/oauth/token
    jwks_url: https://auth.openai.com/.well-known/jwks.json
    resource: https://api.openai.com/v1
    scopes:
      - openid
      - profile
      - email
      - offline_access
      - resource.invoke
      - chatgpt.tokens.use.direct
    callback_host: 127.0.0.1
    callback_path: /auth/callback
    acquisition_timeout_seconds: 600
