# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/canonical/desktop/shell-runtime.authority.yaml
# Rationale: docs/authority/desktop-shell-runtime-rationale.md
config_id: desktop_shell_runtime_feature_flags
owner: desktop
source_rule: rule.nimi.desktop.shell-runtime.r042
flags:
  - flag: enableRuntimeTab
    default_desktop: true
    default_web: false
  - flag: enableDeveloperTools
    default_desktop: false
    default_web: false
    gated_by: developer_mode
  - flag: enableSettingsExtensions
    default_desktop: true
    default_web: false
  - flag: enableTitlebarDrag
    default_desktop: true
    default_web: false
  - flag: enableMenuBarShell
    default_desktop: true
    default_web: false
    desktop_platform_defaults:
      macos: true
      other: false
  - flag: enableRuntimeBootstrap
    default_desktop: true
    default_web: false
