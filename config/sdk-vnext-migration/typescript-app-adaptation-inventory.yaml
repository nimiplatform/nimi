version: 1
table_family: product_catalog
owner: sdks
catalog_id: sdks_typescript_app_adaptation_inventory
scope:
  first_party_adaptation_gate: check:sdk-vnext-first-party-adaptation
  import_scan_roots:
    - apps
    - kit
    - examples
adaptation_status_values:
  - implemented
  - pending
  - blocked
subpath_migration_rules:
  - current_subpath: "@nimiplatform/sdk"
    decision: retain-redesign
    vnext_targets:
      - "@nimiplatform/sdk"
    reason: Root imports migrate to explicit `createNimiClient`/`NimiClient` composition with no singleton after owner approval.

  - current_subpath: "@nimiplatform/sdk/ai"
    decision: retain-redesign
    vnext_targets:
      - "@nimiplatform/sdk/ai"
    reason: AI config, Runtime text, embedding, scheduling, and profile surfaces remain Nimi-native under the vNext AI module.

  - current_subpath: "@nimiplatform/sdk/ai-app"
    decision: hardcut
    vnext_targets:
      - "@nimiplatform/sdk/agent"
      - "@nimiplatform/sdk/features/conversation"
      - "@nimiplatform/sdk/features/evaluation"
      - "@nimiplatform/sdk/features/toolkits"
    hardcut_reason: AI App conflates app-session convenience with SDK authority; vNext splits surviving behavior into Agent and feature modules.
    reason: First-party chat/session callers must move to Agent and feature surfaces instead of restoring `ai-app`.

  - current_subpath: "@nimiplatform/sdk/ai-provider"
    decision: hardcut
    vnext_targets:
      - "@nimiplatform/sdk/ai"
      - "@nimiplatform/sdk/features/generation"
      - sdks/typescript/adapters/vercel-ai
      - sdks/typescript/adapters/openai-compatible
    hardcut_reason: AI Provider conflates external framework provider shape with Nimi Runtime Scenario semantics; vNext keeps framework compatibility adapter-owned.
    reason: Examples migrate text framework use to adapters and media/speech/embedding use to explicit vNext AI/generation surfaces.

  - current_subpath: "@nimiplatform/sdk/app"
    decision: retain-redesign
    vnext_targets:
      - "@nimiplatform/sdk/app"
    reason: App identity, scope, permission, and platform catalog capability remain under the vNext App module.

  - current_subpath: "@nimiplatform/sdk/platform-catalog"
    decision: hardcut
    vnext_targets:
      - "@nimiplatform/sdk/app"
    hardcut_reason: Platform catalog is app binding/first-run capability, not a standalone vNext package subpath.
    reason: First-party platform catalog callers must migrate to App-owned contracts.

  - current_subpath: "@nimiplatform/sdk/realm"
    decision: retain-direct
    vnext_targets:
      - "@nimiplatform/sdk/realm"
    reason: Realm remains a generated Realm projection facade under the same public subpath.

  - current_subpath: "@nimiplatform/sdk/runtime"
    decision: retain-redesign
    vnext_targets:
      - "@nimiplatform/sdk/runtime"
      - "@nimiplatform/sdk/agent"
    reason: Runtime remains public, but local helper and agent identity behavior is split between Runtime and Agent surfaces.

  - current_subpath: "@nimiplatform/sdk/runtime/browser"
    decision: hardcut
    vnext_targets:
      - "@nimiplatform/sdk/runtime"
    hardcut_reason: Browser/Tauri behavior is no longer a legacy subpath; unsupported construction fails closed in the main Runtime module.
    reason: First-party browser imports must move to explicit Runtime construction or app-provided transport.

  - current_subpath: "@nimiplatform/sdk/scope"
    decision: hardcut
    vnext_targets:
      - "@nimiplatform/sdk/app"
    hardcut_reason: Scope catalog is App-owned in vNext and must not remain a parallel public subpath.
    reason: Scope callers migrate to App contracts.

  - current_subpath: "@nimiplatform/sdk/scope/permission"
    decision: hardcut
    vnext_targets:
      - "@nimiplatform/sdk/app"
    hardcut_reason: Permission grants are App-owned in vNext and must not remain a parallel public subpath.
    reason: Permission callers migrate to App contracts.

  - current_subpath: "@nimiplatform/sdk/types"
    decision: retain-direct
    vnext_targets:
      - "@nimiplatform/sdk/types"
    reason: Public errors, JSON, metadata, and compatibility types remain under the vNext Types module.

  - current_subpath: "@nimiplatform/sdk/world"
    decision: hardcut
    vnext_targets:
      - "@nimiplatform/sdk/realm"
      - "@nimiplatform/sdk/features/workflow"
    hardcut_reason: World is product/domain-specific; surviving reads belong to Realm and Workflow feature surfaces.
    reason: First-party world callers migrate to Realm world operations and workflow helpers.
entries:
  - id: desktop
    package_name: "@nimiplatform/desktop"
    source_root: apps/desktop
    current_subpaths:
      - "@nimiplatform/sdk"
      - "@nimiplatform/sdk/ai"
      - "@nimiplatform/sdk/ai-app"
      - "@nimiplatform/sdk/app"
      - "@nimiplatform/sdk/platform-catalog"
      - "@nimiplatform/sdk/realm"
      - "@nimiplatform/sdk/runtime"
      - "@nimiplatform/sdk/runtime/browser"
      - "@nimiplatform/sdk/scope"
      - "@nimiplatform/sdk/types"
      - "@nimiplatform/sdk/world"
    required_flow_inventory:
      - auth-session-and-runtime-platform
      - chat-ai-app-hardcut-to-agent-conversation
      - runtime-config-local-model-center
      - realm-resource-world-reads
      - app-permission-platform-catalog
    adaptation_status: implemented
    acceptance_blocker: false
    pending_blockers: []
    required_gate: pnpm --filter @nimiplatform/desktop run typecheck; pnpm --filter @nimiplatform/desktop run build:renderer

  - id: tester
    package_name: "@nimiplatform/tester"
    source_root: apps/tester
    current_subpaths:
      - "@nimiplatform/sdk"
      - "@nimiplatform/sdk/ai"
      - "@nimiplatform/sdk/ai-app"
      - "@nimiplatform/sdk/app"
      - "@nimiplatform/sdk/platform-catalog"
      - "@nimiplatform/sdk/realm"
      - "@nimiplatform/sdk/runtime"
      - "@nimiplatform/sdk/scope/permission"
      - "@nimiplatform/sdk/types"
      - "@nimiplatform/sdk/world"
    required_flow_inventory:
      - runtime-projection-testers
      - ai-config-testers
      - realm-testers
      - current-legacy-subpath-negative-cases
    adaptation_status: implemented
    acceptance_blocker: false
    pending_blockers: []
    required_gate: pnpm --filter @nimiplatform/tester run typecheck

  - id: avatar
    package_name: "@nimiplatform/avatar"
    source_root: apps/avatar
    current_subpaths:
      - "@nimiplatform/sdk"
      - "@nimiplatform/sdk/runtime"
      - "@nimiplatform/sdk/runtime/browser"
      - "@nimiplatform/sdk/types"
    required_flow_inventory:
      - runtime-browser-hardcut
