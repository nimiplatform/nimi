version: 1
table_family: protocol_surface
owner: sdks
protocol_id: sdks_typescript_surface_migration_matrix
decision_values:
  - retain-redesign
  - retain-direct
  - delete-hardcut
  - defer-blocking
  - owner-decision
legacy_subpath_policies:
  - keep-vnext-name
  - hardcut-old-subpath
  - source-root-placeholder
surfaces:
  - current_package_subpath: "@nimiplatform/sdk"
    current_role: app_composition_root
    decision: retain-redesign
    legacy_subpath_policy: keep-vnext-name
    target_exports:
      - "@nimiplatform/sdk"
    target_owner: sdks/typescript/index
    verification_gates:
      - check:sdk-vnext-package-contract
      - check:sdk-release-contracts
    rationale: Root remains the base package developer entry, but composition must be vNext-native and cannot re-export old SDK implementation.

  - current_package_subpath: "@nimiplatform/sdk/runtime"
    current_role: runtime_projection
    decision: retain-redesign
    legacy_subpath_policy: keep-vnext-name
    target_exports:
      - "@nimiplatform/sdk/runtime"
    target_owner: sdks/typescript/runtime
    verification_gates:
      - check:sdk-vnext-runtime-facade
      - check:sdk-vnext-runtime-consumer-smoke
      - check:runtime-bridge-method-drift
      - check:sdk-vnext-package-contract
      - check:sdk-release-contracts
      - check:sdk-release-contracts
    rationale: Runtime capability must survive over generated Runtime core, not old Runtime helpers or private Runtime imports.

  - current_package_subpath: "@nimiplatform/sdk/runtime/browser"
    current_role: runtime_browser_transport_projection
    decision: retain-redesign
    legacy_subpath_policy: hardcut-old-subpath
    target_exports:
      - "@nimiplatform/sdk/runtime"
    target_owner: sdks/typescript/runtime
    verification_gates:
      - check:sdk-vnext-runtime-consumer-smoke
      - check:sdk-vnext-package-contract
      - check:no-app-realm-rest-bypass
    rationale: Browser-safe transport remains required, but it belongs inside the vNext Runtime module instead of a compatibility subpath.

  - current_package_subpath: "@nimiplatform/sdk/runtime/agent-identity"
    current_role: runtime_agent_identity_projection
    decision: retain-redesign
    legacy_subpath_policy: hardcut-old-subpath
    target_exports:
      - "@nimiplatform/sdk/runtime"
      - "@nimiplatform/sdk/agent"
    target_owner: sdks/typescript/runtime + sdks/typescript/core/agent
    verification_gates:
      - check:sdk-vnext-runtime-consumer-smoke
      - check:runtime-bridge-method-drift
    rationale: Agent identity is Runtime-backed projection data; old subpath should not become a separate legacy surface.

  - current_package_subpath: "@nimiplatform/sdk/realm"
    current_role: realm_projection
    decision: retain-redesign
    legacy_subpath_policy: keep-vnext-name
    target_exports:
      - "@nimiplatform/sdk/realm"
    target_owner: sdks/typescript/realm
    verification_gates:
      - check:sdks-generators
      - check:sdks-conformance-typed-core
      - check:sdk-vnext-realm-consumer-smoke
      - check:no-app-realm-rest-bypass
    rationale: Realm projection must survive over generated Realm core and admitted operation contracts.

  - current_package_subpath: "@nimiplatform/sdk/world"
    current_role: world_domain_facade
    decision: retain-redesign
    legacy_subpath_policy: hardcut-old-subpath
    target_exports:
      - "@nimiplatform/sdk/realm"
      - "@nimiplatform/sdk/features/workflow"
    target_owner: sdks/typescript/features/workflow
    verification_gates:
      - check:sdk-vnext-world-consumer-smoke
      - check:sdk-release-contracts
    rationale: World-domain consumption must be redesigned as Realm/Workflow-facing capability instead of keeping the old product-specific subpath.

  - current_package_subpath: "@nimiplatform/sdk/types"
    current_role: types_projection
    decision: retain-redesign
    legacy_subpath_policy: keep-vnext-name
    target_exports:
      - "@nimiplatform/sdk/types"
      - "@nimiplatform/sdk/contracts"
    target_owner: sdks/typescript/types
    verification_gates:
      - check:sdk-vnext-package-contract
      - check:sdk-vnext-public-surface-smoke
    rationale: Public type/error boundary remains useful, but cross-cutting AI/Agent contracts move to the vNext contracts module.

  - current_package_subpath: "@nimiplatform/sdk/ai-provider"
    current_role: ai_provider_projection
    decision: retain-redesign
    legacy_subpath_policy: source-root-placeholder
    target_exports:
      - sdks/typescript/adapters/vercel-ai
    target_owner: sdks/typescript/adapters/vercel-ai
    verification_gates:
      - check:sdk-release-contracts
      - check:live-provider-invariants
    rationale: Vercel-compatible provider behavior survives as an adapter source root; public adapter package naming remains owner-gated before release.

  - current_package_subpath: "@nimiplatform/sdk/ai"
    current_role: ai_config_projection
    decision: retain-redesign
    legacy_subpath_policy: keep-vnext-name
    target_exports:
      - "@nimiplatform/sdk/ai"
    target_owner: sdks/typescript/core/ai
    verification_gates:
      - check:live-provider-invariants
      - check:sdk-vnext-ai-consumer-smoke
      - check:sdk-consumer-smoke
      - check:sdk-release-contracts
    rationale: AI capability survives as Nimi-native consume/config contracts over vNext Runtime/Realm surfaces, not provider routing truth.

  - current_package_subpath: "@nimiplatform/sdk/ai-app"
    current_role: app_ai_session_loop_dx
    decision: retain-redesign
    legacy_subpath_policy: hardcut-old-subpath
    target_exports:
      - "@nimiplatform/sdk/agent"
      - "@nimiplatform/sdk/features/conversation"
    target_owner: sdks/typescript/core/agent
    verification_gates:
      - check:sdk-consumer-smoke
      - check:sdk-release-contracts
    rationale: App AI session helpers survive as Agent and Conversation features; old AI App subpath must not imply Runtime Agent ownership.

  - current_package_subpath: "@nimiplatform/sdk/scope"
    current_role: scope_projection
    decision: retain-redesign
    legacy_subpath_policy: hardcut-old-subpath
    target_exports:
      - "@nimiplatform/sdk/app"
    target_owner: sdks/typescript/core/app
    verification_gates:
      - check:sdk-vnext-package-contract
      - check:sdk-vnext-app-consumer-smoke
    rationale: Scope belongs to the vNext App permission/binding model instead of a separate compatibility subpath.

  - current_package_subpath: "@nimiplatform/sdk/scope/permission"
    current_role: permission_client_projection
    decision: retain-redesign
    legacy_subpath_policy: hardcut-old-subpath
    target_exports:
      - "@nimiplatform/sdk/app"
    target_owner: sdks/typescript/core/app
    verification_gates:
      - check:no-app-realm-rest-bypass
      - check:sdk-vnext-app-consumer-smoke
    rationale: Permission client survives inside vNext App contracts and must remain a typed projection over admitted permission authority.

  - current_package_subpath: "@nimiplatform/sdk/app"
    current_role: nimi_app_client_projection
    decision: retain-redesign
    legacy_subpath_policy: keep-vnext-name
    target_exports:
      - "@nimiplatform/sdk/app"
    target_owner: sdks/typescript/core/app
    verification_gates:
      - check:app-identity-surfaces
      - check:sdk-vnext-app-consumer-smoke
    rationale: App identity, install, registry, launch, and status capability remains a first-class vNext public surface.

  - current_package_subpath: "@nimiplatform/sdk/platform-catalog"
    current_role: generated_platform_catalog_projection
    decision: retain-redesign
    legacy_subpath_policy: hardcut-old-subpath
    target_exports:
      - "@nimiplatform/sdk/app"
    target_owner: sdks/typescript/core/app
    verification_gates:
      - check:platform-catalog-drift
      - check:sdk-vnext-app-consumer-smoke
    rationale: Platform catalog projection remains generated/admitted app data, not a standalone SDK authority subpath.
