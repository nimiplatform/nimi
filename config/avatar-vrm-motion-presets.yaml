# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/canonical/avatar/embodiment-surface.authority.yaml
# Rationale: docs/authority/avatar-embodiment-rationale.md
version: 1
table_family: product_catalog
owner: avatar
catalog_id: avatar_vrm_motion_presets
description: >
  Interchange-only motion preset registry for the VRM backend branch. This
  registry is not the APML/runtime motion support surface. Each preset id maps
  to a built-in .vrma asset shipped with apps/avatar; per-model overrides may
  live at <model_path>/motions/<preset_id>.vrma and take priority for
  interchange playback. Missing preset_id fail-closes for interchange playback
  (log warn, no fake motion).

  Generated motion provider authority supersedes this registry as APML
  auto-adapter runtime support proof. Generated motion provider support
  is now governed by generated-motion-routes.yaml,
  backend-capability-profile.schema.yaml, mapping-sidecar.schema.yaml, and
  generated-motion-provider-contract.md. .vrma remains authoring/interchange
  evidence only.

  This table hard-cuts the stale unbacked preset rows. Only `idle_subtle` is admitted as a built-in
  interchange asset because it is the only physical `.vrma` file present with
  concrete license/source metadata. Runtime support for `listen_lean`,
  `nod_yes`, `shake_no`, and `greet_wave` is governed by
  generated-motion-routes.yaml and generated-motion-provider-contract.md, not
  this registry.

  Drift checks:
    - every entry MUST have non-placeholder `license` + `source` fields
      (no "TBD", "candidate", "VRoid Hub 候选", etc.)
    - generated-motion route ids do not need to resolve to this registry
    - per-model override at <model_path>/motions/<preset_id>.vrma must
      target an admitted preset id; otherwise registry rejects the
      override and falls back to the builtin

builtin_dir: apps/avatar/assets/vrm-motion-presets

presets: &avatar_vrm_motion_preset_entries
  - id: idle_subtle
    file: idle_subtle.vrma
    loop: true
    license: MIT (forked from _external/airi)
    source: _external/airi/packages/stage-ui-three/src/assets/vrm/animations/idle_loop.vrma
    attribution: apps/avatar/assets/vrm-motion-presets/THIRD_PARTY_LICENSES.md

constraints:
  - description: >
      Registry v1 contains exactly one built-in interchange entry:
      `idle_subtle`. Adding any other built-in `.vrma` entry requires a real
      physical file, concrete license/source metadata, tests, and authority
      evidence.
  - description: >
      `license` and `source` must be concrete strings (non-empty,
      non-placeholder). Spec validator rejects entries containing "TBD",
      "candidate", "VRoid Hub 候选", or similar placeholder tokens.
  - description: >
      Built-in `.vrma` files must physically exist for interchange playback at
      apps/avatar/assets/vrm-motion-presets/<file> and load via
      `@pixiv/three-vrm-animation` `loadVrmAnimation` at PoC time. This file
      existence check is not APML auto-adapter runtime support proof.
  - description: >
      Per-model override at <model_path>/motions/<preset_id>.vrma must
      reference an admitted preset id; unknown id is rejected at registry
      load (log warn) and the builtin is used.

drift_checks:
  - description: >
      Any change to `presets[].id` must propagate to interchange-only tests
      and to vrm-motion-preset-registry.ts.
  - description: >
      Any change to `presets[].file` must rename the corresponding asset
      file in apps/avatar/assets/vrm-motion-presets/.
  - description: >
      Removing a preset id at registry level requires updating every
      activity-mapping.yaml entry that references it in the same packet.
entries: *avatar_vrm_motion_preset_entries
