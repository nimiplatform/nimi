# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/canonical/platform/app-ecosystem.authority.yaml
# Rationale: docs/authority/platform-app-ecosystem-rationale.md
version: 2
table_family: product_catalog
owner: platform
catalog_id: platform_nimi_app_registry
entries:
  - apps_1
  - apps_2
  - registry rows must reference admitted trust tier, package signature policy, release channel, factory AIProfile selection, canonical capability ids, and local compute pack rows
  - registry must not admit a row with package_kind outside nimi-app
  - registry rows must not embed provider, connector, engine, or model identifier strings
  - avatar registry row admission_status is admitted after Avatar productization master gate clearance
  - ordinary Apps visibility requires admission_status admitted and ordinary_visibility ordinary-visible
  - no ordinary-visible first-party app is admitted in this cut
  - Avatar must remain hidden-internal for ordinary Apps even when package/update coordination rows exist
  - Realm Persona Studio and Realm World Studio are admitted only as developer-only
    first-party Apps in this cut so standalone desktop dev-shell account
    registration can consume Runtime-mediated bounded account results without
    any app-held Realm access or refresh token
  - Zhiyu is admitted only as a first-party bundled developer-only App in R1;
    it does not satisfy ordinary Apps catalog discovery or ordinary release
    readiness
  - CI fixtures are not registry or product truth
  - verified non-bundled discovery may resolve an immutable release descriptor,
    but 0K does not claim local package/install readiness
  - permission_requirements carries only admitted public permission ids and
    user-facing reasons; an empty list is valid and never blocks app launch
  - base entitlements, first-party product operations, app-owned commands, and
    OS rights are forbidden from permission_requirements

# Canonical Nimi App registry — Platform admission/catalog authority.
# See nimi-app-admission-contract.md (P-NAPP-001..P-NAPP-011; P-NAPP-013..P-NAPP-015; P-NAPP-018..P-NAPP-029)
# and nimi-app-local-admission-contract.md (P-NAPP-030..P-NAPP-032).

app_schema:
  owner: platform_nimi_app_registry
  fields:
    - app_id
    - display_label
    - publisher
    - trust_tier_ref
    - package_kind
    - package_signature_policy_ref
    - update_channel_ref
    - ai_profile_selection_ref
    - capability_set_refs
    - local_compute_pack_refs
    - runtime_registration_mode
    - permission_requirements
    - health_repair_projection
    - ordinary_visibility
    - release_descriptor_ref
    - install_storage_policy_ref
    - source_repo_url
    - admission_status
    - source_rule
  enums:
    package_kind:
      - nimi-app
    runtime_registration_mode:
      - app-managed
    admission_status:
      - admitted
      - gated_by_avatar_master_gate
      - deferred
      - retired
    ordinary_visibility:
      - ordinary-visible
      - hidden-internal
      - developer-only
      - not-admitted-visible
    health_repair_projection:
      - unavailable
      - setup-required
      - needs-confirmation
      - in-progress
      - failed
      - unsupported
      - repair-required
      - stale-projection

field_owners:
  permission_requirements:
    owner: platform_public_permission_catalog
    schema_ref: P-PERM-007
    item_shape:
      required:
        - id
        - reason
      additional_fields: forbidden

apps:
