# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/canonical/platform/core-protocol.authority.yaml
# Rationale: docs/authority/platform-core-protocol-rationale.md
version: 1
table_family: protocol_surface
owner: platform
protocol_id: platform_desktop_open_intents
surfaces:
  - desktop-open.openIntent
  - desktop-open.intentEnvelope
  - desktop-open.resultCodes
authority:
  id: platform.desktop-open-intents
  owner: platform
  source_rule: P-DOPEN-001
  sdk_surface: "@nimiplatform/sdk/app"
  kit_core_surface: "@nimiplatform/kit/core/desktop-open"
  standard_shell_operation: desktop-open.openIntent
desktop_target_catalog_ref: .nimi/spec/desktop/kernel/tables/desktop-open-targets.yaml
envelope:
  schema_version: 1
  source_app: host-injected-metadata
  source_host:
    - electron-standard-shell
    - tauri-standard-shell
    - desktop-electron-local-app-host
    - dev-fixture
  request_id: host-generated-or-validated
  request_id_grammar: "^desktop-open-[A-Za-z0-9][A-Za-z0-9._:-]{0,114}$"
  request_id_max_length: 128
  intent: closed_desktop_open_intent
result_codes:
  admitted:
    - desktop-open-desktop-not-running
    - desktop-open-desktop-not-ready
    - desktop-open-intent-invalid
    - desktop-open-target-unsupported
    - desktop-open-bridge-auth-failed
    - desktop-open-host-unavailable
  not_admitted:
    - desktop-open-bridge-unavailable
transport:
  production: desktop_presence_descriptor_exact_loopback_bridge
  forbidden:
    - os_custom_scheme_launch
    - oauth.openExternalUrl
    - raw_url_payload
    - external_menu_bar_event
source_rule: P-DOPEN-001
