# Non-authoritative Desktop shell UI machine configuration.
# Normative authority: .nimi/spec/canonical/desktop/shell-ui.authority.yaml
# Rationale: docs/authority/desktop-shell-ui-rationale.md
version: 1
table_family: owner_matrix
owner: desktop
matrix_id: desktop_nimi_kit_allowlists
rows:
  - allow.webkit_app_region
  - allow.measured_panel_width
app: desktop
items:
  - id: allow.webkit_app_region
    pattern_type: inline_style_property
    pattern: WebkitAppRegion
    scope: apps/desktop/src
    reason: Native shell drag regions are transport-level requirements, not visual contract drift.
    source_rule: P-DESIGN-021
  - id: allow.measured_panel_width
    pattern_type: inline_style_property
    pattern: width
    scope: apps/desktop/src/shell/renderer/features/runtime-config
    reason: User-resizable runtime panel widths are measured runtime layout state.
    source_rule: P-DESIGN-021
