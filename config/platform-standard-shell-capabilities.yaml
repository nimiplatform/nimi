# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/platform/ui-design-system.authority.yaml
# Authority: .nimi/spec/platform/ui-design-system.authority.yaml
version: 1
table_family: protocol_surface
owner: platform
protocol_id: platform_standard_shell_capabilities
surfaces:
  - runtime
  - runtime-lifecycle
  - runtime-defaults
  - filesystem
  - window
  - notification
  - storage
  - ai-config
  - agent-center
  - desktop-open
  - local-app
authority:
  id: platform.standard-shell-capabilities
  owner: platform
  source_rule: P-KIT-041C
  package_surface: "@nimiplatform/kit/shell/capabilities"
  rust_host_surface: nimi_shell_tauri::capabilities
  electron_host_surface: "@nimiplatform/kit/shell/electron/main"
  renderer_surface: "@nimiplatform/kit/shell/renderer/bridge"
  protected_host_surface: kit/shell/protected-local

error_envelope:
  required_fields:
    - code
    - reasonCode
    - actionHint
    - source
  optional_fields:
    - details
  codes:
    - capability-unavailable
    - protected-carrier-required
    - runtime-service-unavailable
    - runtime-service-untrusted
    - runtime-service-error-unclassified
    - runtime-service-repair-required
    - external-daemon-required
    - runtime-permission-denied
    - runtime-unauthenticated
    - forbidden-renderer-access
    - invalid-path
    - not-found
    - resource-exhausted
    - invalid-payload
    - host-internal-error

storage_payload_policy:
  root_source: host_owned_runtime_app_storage_root
  host_resolution:
    - runtime_get_app_storage
    - runtime_attested_launch_projection
    - runtime_local_app_principal_session_projection
  renderer_payloads:
    data.pathResolve:
      allowed_fields:
        - relativePath
    storage.readJson:
      allowed_fields:
        - relativePath
    storage.writeJson:
      allowed_fields:
        - relativePath
        - value
    storage.removeJson:
      allowed_fields:
        - relativePath
      result_shape:
        - path
        - removed
      idempotent_missing_file: true
    artifacts.write:
      allowed_fields:
        - relativePath
        - mimeType
        - dataBase64
    artifacts.readRuntimeBytes:
      allowed_fields:
        - artifactId
      result_shape:
        - dataBase64
        - mimeType
        - sizeBytes
        - mimeInferred
  forbidden_renderer_fields:
    - path
    - storageRoot
    - root
    - absolutePath
    - dataRoot
    - cacheRoot
    - tempRoot
  local_app_json_operations:
    admitted_operations:
      - storage.readJson
      - storage.writeJson
      - storage.removeJson
    principal_partition: runtime_derived_local_app_principal_id
    permission_scopes:
      storage.readJson: file.read.scoped#app-local-drafts
      storage.writeJson: file.write.scoped#app-local-drafts
      storage.removeJson: file.write.scoped#app-local-drafts
    operation_ids:
      storage.readJson: app_storage.json.read
      storage.writeJson: app_storage.json.write
      storage.removeJson: app_storage.json.remove
    resource_ref: "storage:<canonical-relative-json-path>"
    relative_path_max_bytes: 240
    document_max_bytes: 262144
    principal_partition_quota_bytes: 16777216
    required_suffix: .json
    result_fields:
      storage.readJson: [value, sizeBytes]
      storage.writeJson: [value, sizeBytes]
      storage.removeJson: [removed]
    absolute_path_projection: forbidden
    exact_grant_per_operation_and_resource: required
    missing_remove_disposition: idempotent_success

protected_service_control_policy:
  operations: [runtime-lifecycle.status, runtime-lifecycle.start, runtime-lifecycle.restart]
  request_fields:
    runtime-lifecycle.status: []
    runtime-lifecycle.start: []
    runtime-lifecycle.restart: []
  result_fields: [state, releaseId, reasonCode, retryable]
  state_values: [stopped, start_pending, running, restart_pending, unavailable]
  product_stop_operation: absent
  service_name_binary_path_argv_endpoint_config_or_trust_path_input: forbidden
  owner: runtime_os_service_manager
  carrier: kit.shell.protected-local
  source_rule: P-KIT-041

capability_set_schema:
  owner: platform_standard_shell_capabilities
  source_rule: P-KIT-044
  fields:
    - set_id
    - host_class
    - app_package_kind
    - launch_resolution
    - auth_binding
    - authority_status
    - allowed_operations
    - planned_operations
    - planned_operations_disposition
    - forbidden_operations
    - negative_tests
    - source_rule

capability_sets:
  - set_id: bundled-avatar-standard-shell-v1
    host_class: verified-independent-avatar-native-host
    app_package_kind: bundled-nimi-app
    launch_resolution: verified_avatar_native_host_process_and_exact_native_sender_on_avatar_control
    auth_binding: runtime_owned_bundled_avatar_protected_profile
    authority_status: fixed_profile_app_private_and_floating_window_only
    allowed_operations:
      - runtime.unary
      - runtime.streamOpen
      - runtime.streamClose
      - runtime-lifecycle.status
      - storage.readJson
      - storage.writeJson
      - storage.removeJson
      - diagnostics.rendererEntryProbe
      - local-assets.resolveUrl
      - avatar.assetResolve
      - floating-window.setBounds
      - floating-window.setIgnoreCursorEvents
      - floating-window.setAlwaysOnTop
      - floating-window.hide
      - floating-window.close
      - floating-window.beginManualDrag
      - floating-window.moveManualDrag
      - floating-window.constrainToVisibleArea
    planned_operations: []
    planned_operations_disposition: deny_until_separate_operation_admission
    forbidden_operations:
      - runtime-lifecycle.start
      - runtime-lifecycle.restart
      - runtime-defaults.get
      - auth.sessionLoad
      - auth.sessionSave
      - auth.sessionClear
      - oauth.openExternalUrl
      - oauth.tokenExchange
      - oauth.listenForCode
      - local-agent.identity
      - local-agent.runtimeTrustedCaller
      - ai-profile.get
      - agent-center.avatarAssetImport
      - agent-center.avatarAssetValidate
      - agent-center.avatarAssetResolvePreview
      - agent-center.live2dAdapterImport
      - agent-center.backgroundImport
      - agent-center.backgroundGet
      - agent-center.backgroundValidate
      - agent-center.backgroundRemove
      - agent-center.agentResourcesRemove
      - agent-center.accountResourcesRemove
      - platform-projection.get
      - file-dialog.open
      - file-reveal.reveal
      - export.saveFile
      - artifacts.write
      - desktop-private.product-control
      - tauri-only.commands
      - electron.raw-ipc
      - node.raw-fs
    negative_tests:
      - bundled-avatar-denies-unbound-or-replaced-native-host-process
      - bundled-avatar-denies-unbound-or-replaced-native-sender
      - bundled-avatar-denies-non-avatar-control-carrier
      - bundled-avatar-denies-open-desktop-session-or-live-desktop-dependency
      - bundled-avatar-denies-desktop-account-control-inheritance
      - bundled-avatar-denies-renderer-selected-profile
      - bundled-avatar-denies-runtime-start-restart
      - bundled-avatar-denies-auth-and-oauth-custody
      - bundled-avatar-denies-agent-center-mutation
      - bundled-avatar-denies-desktop-private-commands
      - bundled-avatar-storage-root-stays-host-private
      - bundled-avatar-window-commands-bind-verified-native-sender
    source_rule: P-KIT-047

  - set_id: local-app-standard-shell-v1
    host_class: protected-local-app-host
    app_package_kind: nimi-app
    launch_resolution: runtime_prepare_local_app_launch_and_verified_process_binding
    auth_binding: runtime_owned_request_empty_local_app_session
    authority_status: permission_model_v1_with_exact_admitted_operation_families
    allowed_operations:
      - local-app.sessionStatus
      - local-app.permissionStatus
      - local-app.permissionRequest
      - local-app.textGenerateCandidate
      - local-app.conversationOpen
      - local-app.conversationSendTurn
      - local-app.conversationInterruptTurn
      - local-app.conversationSubscribe
      - local-app.conversationSnapshot
      - local-app.artifactPut
      - local-app.artifactReadBytes
      - local-app.agentConfigurationSnapshot
      - local-app.agentUpdateConfiguration
      - local-app.agentReadinessSnapshot
      - local-app.agentAIProfilePreview
      - local-app.agentAIProfileApply
      - local-app.agentAutonomySnapshot
      - local-app.agentUpdateAutonomy
      - local-app.agentPresentationSnapshot
      - local-app.agentCommitPresentation
      - local-app.realmWorldCoreList
      - local-app.realmWorldCoreCreate
      - storage.readJson
      - storage.writeJson
      - storage.removeJson
      - desktop-open.openIntent
    planned_operations:
      - data.pathResolve
      - config.get
      - config.set
      - ai-config.get
      - ai-config.set
      - local-assets.resolveUrl
      - shell-ui.confirmDialog
      - shell-ui.startWindowDrag
      - shell-ui.focusMainWindow
    planned_operations_disposition: deny_until_separate_operation_admission
    forbidden_operations:
      - runtime.unary
      - runtime.streamOpen
      - runtime.streamClose
      - runtime-lifecycle.status
      - runtime-lifecycle.start
      - runtime-lifecycle.restart
      - runtime-defaults.get
      - auth.sessionLoad
      - auth.sessionSave
      - auth.sessionClear
      - oauth.openExternalUrl
      - oauth.tokenExchange
      - oauth.listenForCode
      - diagnostics.rendererEntryProbe
      - local-agent.identity
      - local-agent.runtimeTrustedCaller
      - ai-profile.get
      - avatar.assetResolve
      - agent-center.avatarAssetImport
      - agent-center.avatarAssetValidate
      - agent-center.avatarAssetResolvePreview
      - agent-center.live2dAdapterImport
      - agent-center.backgroundImport
      - agent-center.backgroundGet
      - agent-center.backgroundValidate
      - agent-center.backgroundRemove
      - agent-center.agentResourcesRemove
      - agent-center.accountResourcesRemove
      - platform-projection.get
      - file-dialog.open
      - file-reveal.reveal
      - export.saveFile
      - artifacts.write
      - floating-window.setBounds
      - floating-window.setIgnoreCursorEvents
      - floating-window.setAlwaysOnTop
      - floating-window.hide
      - floating-window.close
      - floating-window.beginManualDrag
      - floating-window.moveManualDrag
      - floating-window.constrainToVisibleArea
      - desktop-private.product-control
      - tauri-only.commands
      - electron.raw-ipc
      - node.raw-fs
    negative_tests:
      - local-app-session-does-not-imply-protected-operation-authority
      - local-app-reserved-permission-request-fails-closed
      - local-app-denies-runtime-lifecycle
      - local-app-denies-generic-runtime-proxy
      - local-app-denies-auth-session-custody
      - local-app-denies-oauth-token-exchange
      - local-app-denies-platform-projection
      - local-app-denies-desktop-private-bridge
      - local-app-denies-tauri-only-commands
      - local-app-denies-file-system-handoff
      - local-app-denies-floating-window
      - local-app-process-mismatch_denied
      - local-app-reserved-permission-unavailable-on-protected-operation
      - local-app-storage-zero-permission-allowed
      - local-app-storage-path-escape-denied
      - local-app-storage-cross-principal-denied
      - local-app-storage-quota-exceeded
      - local-app-storage-root-never-projected
    source_rule: P-KIT-044

local_app_operation_contract:
  source_rule: P-KIT-044
  renderer_forbidden_fields:
    - endpoint
    - authorization
    - token
    - localAppPrincipalId
    - localAppRecordId
    - trustClass
    - provenanceRevision
    - launchLease
    - bootstrap
    - processId
    - sessionId
    - sessionProof
    - accountId
    - permissionDecisionId
    - runtimeBootEpoch
  status_states: [authorizing, ready, denied, runtime-unavailable, revoked, project-changed]
  fixed_service_required: true
  generic_method_id_or_bytes_proxy: forbidden
  operation_families:
    storageReadJson:
      command: storage.readJson
      operation_id: app_storage.json.read
      authority_class: base_entitlement
      request_fields: [relativePath]
      response_fields: [value, sizeBytes]
      owner: runtime_app_service
    storageWriteJson:
      command: storage.writeJson
      operation_id: app_storage.json.write
      authority_class: base_entitlement
      request_fields: [relativePath, value]
      response_fields: [value, sizeBytes]
      owner: runtime_app_service
    storageRemoveJson:
      command: storage.removeJson
      operation_id: app_storage.json.remove
      authority_class: base_entitlement
      request_fields: [relativePath]
      response_fields: [removed]
      owner: runtime_app_service
    realmWorldCoreList:
      command: local-app.realmWorldCoreList
      operation_id: realm.world_core.list
      authority_class: base_entitlement
      request_fields: [take, visibility]
      response_fields: [worldCores]
      transport_boundary: exact_runtime_account_unary
      effect_boundary: read
      owner: runtime_account_service
    realmWorldCoreCreate:
      command: local-app.realmWorldCoreCreate
      operation_id: realm.world_core.create
      authority_class: base_entitlement
      request_fields: [core, id, origin, visibility]
      response_fields: [worldCore]
      transport_boundary: exact_runtime_account_unary
      effect_boundary: write
      owner: runtime_account_service
    textGenerateCandidate:
      command: local-app.textGenerateCandidate
      operation_id: runtime.ai.text_candidate.generate
      authority_class: user_permission
      permission_id: ai.text.generate
      request_fields: [messages, temperature, topP, maxTokens]
      response_fields: [text, finishReason, traceId]
      transport_boundary: unary
      effect_boundary: foreground_compute
      typed_failures: [protected-carrier-required, runtime-service-unavailable, runtime-service-untrusted, runtime-service-error-unclassified, runtime-unauthenticated, runtime-permission-denied, process-replaced, account-changed, runtime-restarted, permission-denied, permission-revoked, invalid-payload, resource-exhausted, host-internal-error]
      owner: runtime_ai_service
    conversationOpen:
      command: local-app.conversationOpen
      operation_id: runtime_agent.conversation.open
      authority_class: user_permission
      request_fields: [agentHandle, disposition]
      response_fields: [conversationAnchorId, activeTurnId, activeStreamId]
      transport_boundary: unary
      effect_boundary: write
      typed_failures: [protected-carrier-required, runtime-service-unavailable, runtime-service-untrusted, runtime-service-error-unclassified, runtime-unauthenticated, process-replaced, account-changed, runtime-restarted, permission-unavailable, permission-denied, permission-revoked, invalid-payload, resource-exhausted, host-internal-error]
      owner: runtime_agent_service
    conversationSendTurn:
      command: local-app.conversationSendTurn
      operation_id: runtime_agent.conversation.turn_send
      authority_class: user_permission
      request_fields: [agentHandle, conversationAnchorId, requestId, text, attachments]
      response_fields: [messageId]
      transport_boundary: unary
      effect_boundary: write
      typed_failures: [protected-carrier-required, runtime-service-unavailable, runtime-service-untrusted, runtime-service-error-unclassified, runtime-unauthenticated, process-replaced, account-changed, runtime-restarted, permission-unavailable, permission-denied, permission-revoked, invalid-payload, resource-exhausted, host-internal-error]
      owner: runtime_app_service
    conversationInterruptTurn:
      command: local-app.conversationInterruptTurn
      operation_id: runtime_agent.conversation.turn_interrupt
      authority_class: user_permission
      request_fields: [agentHandle, conversationAnchorId]
      response_fields: [messageId]
      transport_boundary: unary
      effect_boundary: write
      typed_failures: [protected-carrier-required, runtime-service-unavailable, runtime-service-untrusted, runtime-service-error-unclassified, runtime-unauthenticated, process-replaced, account-changed, runtime-restarted, permission-unavailable, permission-denied, permission-revoked, invalid-payload, not-found, host-internal-error]
      owner: runtime_app_service
    conversationSubscribe:
      command: local-app.conversationSubscribe
      operation_id: runtime_agent.conversation.turn_subscribe
      authority_class: user_permission
      request_fields: [agentHandle, conversationAnchorId]
      response_fields: [subscriptionId]
      event_fields: [eventType, sequence, messageId, messageType, payload, reasonCode, traceId, timestampUnixMs]
      transport_boundary: server_stream
      effect_boundary: stream_read
      typed_failures: [protected-carrier-required, runtime-service-unavailable, runtime-service-untrusted, runtime-service-error-unclassified, runtime-unauthenticated, process-replaced, account-changed, runtime-restarted, permission-unavailable, permission-denied, permission-revoked, invalid-payload, resource-exhausted, not-found, host-internal-error]
      owner: runtime_app_service
    conversationSnapshot:
      command: local-app.conversationSnapshot
      operation_id: runtime_agent.conversation.snapshot
      authority_class: user_permission
      request_fields: [agentHandle, conversationAnchorId]
      response_fields: [snapshot]
      transport_boundary: unary
      effect_boundary: read
      typed_failures: [protected-carrier-required, runtime-service-unavailable, runtime-service-untrusted, runtime-service-error-unclassified, runtime-unauthenticated, process-replaced, account-changed, runtime-restarted, permission-unavailable, permission-denied, permission-revoked, invalid-payload, not-found, host-internal-error]
      owner: runtime_agent_service
    artifactPut:
      command: local-app.artifactPut
      operation_id: runtime_agent.conversation.turn_send
      authority_class: user_permission
      permission_id: agents.interact
      request_fields: [mimeType, displayName, data]
      response_fields: [artifactId]
      transport_boundary: unary
      effect_boundary: write
      typed_failures: [protected-carrier-required, runtime-service-unavailable, runtime-service-untrusted, runtime-service-error-unclassified, runtime-unauthenticated, process-replaced, account-changed, runtime-restarted, permission-unavailable, permission-denied, permission-revoked, invalid-payload, resource-exhausted, host-internal-error]
      owner: runtime_artifact_service
    artifactReadBytes:
      command: local-app.artifactReadBytes
      operation_id: artifacts.read_runtime_bytes
      authority_class: user_permission
      permission_id: artifacts.open
      request_fields: [artifactId]
      response_fields: [bytes, mimeType]
      transport_boundary: unary
      effect_boundary: read
      typed_failures: [protected-carrier-required, runtime-service-unavailable, runtime-service-untrusted, runtime-service-error-unclassified, runtime-unauthenticated, process-replaced, account-changed, runtime-restarted, permission-unavailable, permission-denied, permission-revoked, invalid-payload, not-found, resource-exhausted, host-internal-error]
      owner: runtime_artifact_service
    agentConfigurationSnapshot:
      command: local-app.agentConfigurationSnapshot
      operation_id: runtime_agent.configuration.snapshot
      authority_class: user_permission
      permission_id: agents.configure
      request_fields: [agentHandle]
      response_fields: [capabilities, routeIntents, readiness, configurationRevision]
      transport_boundary: unary
      effect_boundary: read
      owner: runtime_agent_service
    agentUpdateConfiguration:
      command: local-app.agentUpdateConfiguration
      operation_id: runtime_agent.configuration.update
      authority_class: user_permission
      permission_id: agents.configure
      request_fields: [agentHandle, expectedConfigurationRevision, routeIntents]
      response_fields: [capabilities, routeIntents, readiness, configurationRevision]
      transport_boundary: unary
      effect_boundary: write
      owner: runtime_agent_service
    agentReadinessSnapshot:
      command: local-app.agentReadinessSnapshot
      operation_id: runtime_agent.readiness.snapshot
      authority_class: user_permission
      permission_id: agents.configure
      request_fields: [agentHandle]
      response_fields: [capabilities, configurationRevision]
      transport_boundary: unary
      effect_boundary: read
      owner: runtime_agent_service
    agentAIProfilePreview:
      command: local-app.agentAIProfilePreview
      operation_id: runtime_agent.ai_profile.preview
      authority_class: user_permission
      permission_id: agents.configure
      request_fields: [agentHandle, profileJson, runtimeDescriptorJson]
      response_fields: [before, after, outcome, baseRevision, blockingCapabilities, reasonCodes, actionRefs, probeWarnings]
      transport_boundary: unary
      effect_boundary: read
      owner: runtime_agent_service
    agentAIProfileApply:
      command: local-app.agentAIProfileApply
      operation_id: runtime_agent.ai_profile.apply
      authority_class: user_permission
      permission_id: agents.configure
      request_fields: [agentHandle, expectedConfigurationRevision, profileJson, runtimeDescriptorJson]
      response_fields: [outcome, projection, blockingCapabilities, reasonCodes, actionRefs, probeWarnings]
      transport_boundary: unary
      effect_boundary: write
      owner: runtime_agent_service
    agentAutonomySnapshot:
      command: local-app.agentAutonomySnapshot
      operation_id: runtime_agent.autonomy.snapshot
      authority_class: user_permission
      permission_id: agents.configure
      request_fields: [agentHandle]
      response_fields: [enabled, config, usedTokensInWindow, windowStartedAt, budgetExhausted, suspendedUntil, autonomyRevision]
      transport_boundary: unary
      effect_boundary: read
      owner: runtime_agent_service
    agentUpdateAutonomy:
      command: local-app.agentUpdateAutonomy
      operation_id: runtime_agent.autonomy.update
      authority_class: user_permission
      permission_id: agents.configure
      request_fields: [agentHandle, expectedAutonomyRevision, intent]
      response_fields: [enabled, config, usedTokensInWindow, windowStartedAt, budgetExhausted, suspendedUntil, autonomyRevision]
      transport_boundary: unary
      effect_boundary: write
      owner: runtime_agent_service
    agentPresentationSnapshot:
      command: local-app.agentPresentationSnapshot
      operation_id: runtime_agent.presentation.snapshot
      authority_class: user_permission
      permission_id: agents.configure
      request_fields: [agentHandle]
      response_fields: [profile, defaultVoiceReference, presentationRevision]
      transport_boundary: unary
      effect_boundary: read
      owner: runtime_agent_service
    agentCommitPresentation:
      command: local-app.agentCommitPresentation
      operation_id: runtime_agent.presentation.commit
      authority_class: user_permission
      permission_id: agents.configure
      request_fields: [agentHandle, expectedPresentationRevision, intent]
      response_fields: [profile, defaultVoiceReference, presentationRevision]
      transport_boundary: unary
      effect_boundary: write
      owner: runtime_agent_service

capabilities:
  - id: runtime
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: unary
        command: nimi.shell.runtime.unary
        negative_states:
          - capability-unavailable
          - protected-carrier-required
          - runtime-permission-denied
          - runtime-unauthenticated
          - invalid-payload
          - host-internal-error
      - id: streamOpen
        command: nimi.shell.runtime.stream.open
        negative_states:
          - capability-unavailable
          - protected-carrier-required
          - runtime-permission-denied
          - runtime-unauthenticated
          - invalid-payload
          - host-internal-error
      - id: streamClose
        command: nimi.shell.runtime.stream.close
        negative_states:
          - capability-unavailable
          - not-found
          - invalid-payload
          - host-internal-error
  - id: runtime-lifecycle
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: status
        command: nimi.shell.runtimeLifecycle.status
        negative_states:
          - capability-unavailable
          - protected-carrier-required
          - runtime-permission-denied
          - runtime-unauthenticated
      - id: start
        command: nimi.shell.runtimeLifecycle.start
        negative_states:
          - runtime-service-unavailable
      - id: restart
        command: nimi.shell.runtimeLifecycle.restart
        negative_states:
          - runtime-service-unavailable
          - runtime-service-untrusted
          - runtime-service-repair-required
  - id: runtime-defaults
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: get
        command: nimi.shell.runtimeDefaults.get
        negative_states:
          - capability-unavailable
          - invalid-payload
  - id: oauth
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: openExternalUrl
        command: nimi.shell.oauth.openExternalUrl
        negative_states:
          - capability-unavailable
          - forbidden-renderer-access
          - invalid-payload
      - id: tokenExchange
        command: nimi.shell.oauth.tokenExchange
        negative_states:
          - capability-unavailable
          - invalid-payload
          - host-internal-error
      - id: listenForCode
        command: nimi.shell.oauth.listenForCode
        negative_states:
          - capability-unavailable
          - invalid-payload
          - host-internal-error
  - id: desktop-open
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: openIntent
        command: nimi.shell.desktopOpen.openIntent
        negative_states:
          - capability-unavailable
          - forbidden-renderer-access
          - invalid-payload
          - host-internal-error
  - id: shell-ui
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: confirmDialog
        command: nimi.shell.ui.confirmDialog
        negative_states:
          - capability-unavailable
          - invalid-payload
          - host-internal-error
      - id: startWindowDrag
        command: nimi.shell.ui.startWindowDrag
        negative_states:
          - capability-unavailable
          - host-internal-error
      - id: focusMainWindow
        command: nimi.shell.ui.focusMainWindow
        negative_states:
          - capability-unavailable
          - host-internal-error
  - id: diagnostics
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: rendererEntryProbe
