      operation_id: runtime.app-storage.asset.reveal
      request_fields: [relativePath]
      response_fields: [revealed]
      transport_boundary: exact_protected_native_host
      effect_boundary: os_file_manager_reveal
      typed_failures: [protected-carrier-required, runtime-service-unavailable, runtime-service-untrusted, runtime-service-error-unclassified, runtime-unauthenticated, process-replaced, account-changed, runtime-restarted, invalid-path, not-found, integrity-failure, host-internal-error]
