    production_core_binding: Maps Vercel LanguageModelV3 generate/stream calls onto NimiAiModel with target-library migration semantics (text, reasoning, function and provider tool definitions, tool choice, client and provider tool-call return, provider-executed tool results, provider approval request/response rounds, streaming tool-input protocol, Vercel framework-owned execute callbacks, Vercel framework-owned multi-step loops, multimodal image/audio/video file input, URL/document sources, raw provider chunk events, and text/json-object/json-schema structured output), validated by a conformance suite that drives the real `ai` package (generateText, streamText, generateObject, streamObject, tool, stepCountIs) through the adapter plus L3 adapter tests for provider tools, provider-executed results, approvals, sources, and raw chunks. Runtime provider backends fail closed when a real provider route cannot preserve provider tools or true raw chunks; adapter support describes Vercel target-library interface coverage per S-AIP-008.
