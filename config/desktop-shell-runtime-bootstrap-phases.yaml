    order: 4
    async: true
    gated_by: enableRuntimeBootstrap
  - phase: auth-session
    order: 5
    async: true
  - phase: bootstrap-ready
    order: 6
    async: false
constraints:
  - constraint: idempotency-guard
    source_rule: rule.nimi.desktop.shell-runtime.r010
