config_id: desktop_shell_runtime_bootstrap_phases
owner: desktop
source_rule: rule.nimi.desktop.shell-runtime.r001
phases:
  - phase: runtime-defaults
    order: 1
    async: true
  - phase: platform-client
    order: 2
    async: true
  - phase: runtime-host
    order: 3
    async: true
    gated_by: enableRuntimeBootstrap
