# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/runtime/local-compute.authority.yaml
# Authority: .nimi/spec/runtime/local-compute.authority.yaml
version: 1
table_family: owner_matrix
owner: runtime
matrix_id: runtime_managed_image_backend_packages
rows:
  - package entries are source candidates for
    native-engine-package.stablediffusion-ggml; selected source records remain
    owned by local environment materializers
  - supported package entries must provide package source identity, package
    format, install directory, executable candidates, launch mode, wrapper
    driver, and hash or digest proof before managed source promotion
  - Runtime must not infer a stablediffusion-ggml package from engine startup
    branches, command-line backend installers, or ad hoc code paths
  - startup may resolve package candidates but must not perform first heavy or
    network materialization without Runtime local environment dependency
    confirmation and job control

entries:
  - entry_id: macos-apple-silicon-stablediffusion-ggml-canonical
    host_match:
      os: darwin
      arch: arm64
      gpu_vendor: apple
    backend_family: stablediffusion-ggml
    dependency_family: native-engine-package.stablediffusion-ggml
    package_source: canonical_localai_derived
    package_format: oci_payload
    install_dir_name: metal-stablediffusion-ggml
    image_ref: quay.io/go-skynet/local-ai-backends:latest-metal-darwin-arm64-stablediffusion-ggml
    oci_layer_digest: sha256:89cdb483a81a98a4cd46d178d23c3540d15e7a27e53ff940984d848e16767b5e
    executable_candidates: [run.sh]
    supported_model_families: [flux, sdxl]
    launch_mode: package_entrypoint
    wrapper_driver: localai-package-entrypoint
    product_state: supported

  - entry_id: macos-apple-silicon-stablediffusion-ggml-official-sdcpp
    host_match:
      os: darwin
      arch: arm64
      gpu_vendor: apple
    backend_family: stablediffusion-ggml
    dependency_family: native-engine-package.stablediffusion-ggml
    package_source: experimental_official_sdcpp
    package_format: direct_archive
    install_dir_name: metal-stablediffusion-ggml-official-sdcpp
    image_ref: ""
    archive_url: https://github.com/leejet/stable-diffusion.cpp/releases/download/master-552-87ecb95/sd-master-87ecb95-bin-Darwin-macOS-15.7.4-arm64.zip
    archive_sha256: f57c43020b172ae9e5095d7aea3c3c1c470717fbbd6b65118545c702053076b1 # pragma: allowlist secret
    executable_candidates: [sd-cli]
    supported_model_families: [flux, sdxl]
    launch_mode: runtime_wrapper
    wrapper_driver: stable-diffusion.cpp
    product_state: proposed
    detail: >-
      Runtime-private experimental source only. It may be selected explicitly for
      diagnostic comparison, but it is not the canonical supported macOS package
      source, is not admitted as a supported runtime-owned package source, and
      must never be auto-selected or used as an implicit fallback.

  - entry_id: windows-x64-nvidia-stablediffusion-ggml
    host_match:
      os: windows
      arch: amd64
      gpu_vendor: nvidia
      gpu_driver_visible: true
    backend_family: stablediffusion-ggml
    dependency_family: native-engine-package.stablediffusion-ggml
    package_source: canonical_runtime_wrapper
    package_format: direct_archive
    install_dir_name: sd-win-cuda12-x64-stablediffusion-ggml-bfbef5b
    image_ref: ""
    archive_url: https://github.com/leejet/stable-diffusion.cpp/releases/download/master-813-bfbef5b/sd-master-bfbef5b-bin-win-cuda12-x64.zip
    archive_sha256: e101fcd3ab323547ef8b4387b5edc6e4a1a70837d394ca744cd847a30e3a9a71 # pragma: allowlist secret
    dependency_requirements:
      - dependency_id: nvidia-cuda-user-space-runtime
        consumer_id: stable-diffusion.cpp.cuda
        readiness_owner: runtime_local_environment_plan
        source_table: local-environment-dependencies.yaml
        accelerator_projection_table: shared-accelerator-dependencies.yaml
        first_network_materialization_requires_confirmation: true
    executable_candidates: [sd.exe, sd-cli.exe]
    supported_model_families: [flux, ideogram4, minimax-h3, qwen-image, sdxl, z-image]
    launch_mode: runtime_wrapper
    wrapper_driver: stable-diffusion.cpp
    product_state: supported
    detail: >-
      The minimax-h3 family marker denotes engine-package compatibility for the
      Runtime-controlled Windows subset only. It is not a statement of
      unconditional global product availability or licensing eligibility;
      model acquisition and use remain subject to the applicable model terms
      and regional or product obligations.

  - entry_id: linux-x64-nvidia-stablediffusion-ggml
    host_match:
      os: linux
      arch: amd64
      gpu_vendor: nvidia
      gpu_driver_visible: true
    backend_family: stablediffusion-ggml
    dependency_family: native-engine-package.stablediffusion-ggml
    package_source: canonical_unavailable
    package_format: none
    install_dir_name: ""
    image_ref: ""
    product_state: unsupported
    detail: >-
      No published runtime-owned managed image backend package is currently
      available for this host tuple.

rules:
  - package entries are source candidates for native-engine-package.stablediffusion-ggml; selected source records remain owned by local environment materializers
  - supported package entries must provide package source identity, package format, install directory, executable candidates, launch mode, wrapper driver, and hash or digest proof before managed source promotion
  - Runtime must not infer a stablediffusion-ggml package from engine startup branches, command-line backend installers, or ad hoc code paths
  - startup may resolve package candidates but must not perform first heavy or network materialization without Runtime local environment dependency confirmation and job control
