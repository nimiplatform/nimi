# Voice source columns project voice.create standardized feature support; provider rows remain catalog facts, not a second voice contract.
# supports_native_stream_tts declares whether an admitted provider route can natively stream playable non-final audio before full synthesis completion under audio.synthesize (K-MMPROV-023a, K-VOICE-019). It is NOT a new capability token and must not be inferred from provider name, route kind, or endpoint family. DashScope true means the CosyVoice WebSocket SpeechSynthesizer route is admitted at contract/adapter level; product-green still requires named live-provider proof through the acceptance matrix.
