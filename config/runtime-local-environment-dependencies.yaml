      - runtime_data_root
    source_policy: uv-managed-python
    source_candidates:
      - source_kind: managed
        priority: 1
        admission: explicit_confirmation_before_first_network_materialization
      - source_kind: unavailable
        priority: 2
        admission: fail_closed
    managed_root: environments
    activation_env_delta: process_env_only
    materializer_ref: materializer.python.runtime
    source_manifest_ref: managed-python-runtime-source
    verification_evidence_ref: python-runtime-evidence
    required_proof:
