        admission: explicit_confirmation_before_first_network_materialization
      - source_kind: unavailable
        priority: 2
        admission: fail_closed
    managed_root: environments
    activation_env_delta: process_env_only
    materializer_ref: materializer.native-engine-package.stablediffusion-ggml
    source_manifest_ref: managed-image-backend-package-source
    verification_evidence_ref: native-engine-package-evidence
    required_proof:
