      - archive_hash
      - canonical_root
      - executable_artifact
      - selected_source_record

  - family_id: python.tool.uv
    owner: runtime_local_environment_plan
    dependency_kind: python_tool
    environment_key_fields:
      - tool_id
      - platform_tuple
      - runtime_data_root
    source_policy: system-first-managed-fallback
    source_candidates:
