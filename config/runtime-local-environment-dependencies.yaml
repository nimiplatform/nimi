  - family_id: python.venv
    owner: runtime_local_environment_plan
    dependency_kind: python_virtual_environment
    environment_key_fields:
      - engine_id
      - backend_family
      - python_version
      - package_lock_hash
      - platform_tuple
      - runtime_data_root
    source_policy: runtime-built-from-managed-python
    source_candidates:
