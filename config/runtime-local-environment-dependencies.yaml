version: 1
table_family: product_catalog
owner: runtime
catalog_id: runtime_local_environment_dependencies
entries:
  - dependency_families_1
  - dependency_families_2
  - dependency_families_3
  - dependency_families_4
  - dependency_families_5
  - dependency_families_6
  - dependency_families_7
  - dependency_families_8
  - dependency_families_9
  - dependency_families_10
  - dependency families are resolved by Runtime local environment plan before
    activation
  - uv, Python, venv, package sets, and Torch wheels are managed dependency
    families, not user prerequisites
  - engine package selection consumes dependency graph truth and must not select
    private prerequisites
  - each dependency family materializes strictly under its managed_root K-CFG-018
    data-plane root resolved from the selected dataRootRef; engine-private or
    home-directory install roots are not admitted
  - model import may request a plan but must not become dependency source truth
  - imported model and companion assets may produce model-family selected source
    records only; they must not become Python, uv, CUDA, DLL, package-manager,
    or native engine package roots
  - missing uv, Python runtime, venv, package set, Torch wheel, native package,
    model asset, or companion asset readiness projects Runtime local environment
    setup or repair state, not ordinary-user package-manager or PATH
    prerequisites
  - companion asset dependency identity includes parent asset binding so
    companion records cannot collide across parent model assets
  - startup, route resolution, Desktop page load, SDK reads, passive import
    review, health probes, and background maintenance must not trigger first
    heavy or network materialization
  - no dependency family may mutate user PATH, machine PATH, shell profiles, or
    system CUDA
  - missing, incompatible, corrupt, cancelled, or unconfirmed dependencies fail
    closed

# Canonical Runtime local environment dependency graph authority.
# This table supersedes dependency truth scattered across engine installers,
# Desktop projection, model import rows, and developer scripts.
# Materializer execution authority is registered in
# local-environment-materializers.yaml. Source manifest and verification evidence
# schema families are defined in local-environment-source-manifests.yaml and
# local-environment-verification-evidence.yaml.

# The per-family `managed_root` field is a closed reference to a K-CFG-018
# data-plane root id (config-schema.yaml `managedRoots.*`). Each materializer
# stages and verifies its family artifacts strictly under that data-plane root
# resolved from the user-selected `dataRootRef`; no engine-private or
# home-directory install root is admitted as a parallel truth.
data_plane_root_binding:
  authority: K-CFG-018
  root_id_source: tables/config-schema.yaml#managedRoots
  admitted_root_ids:
    - models
    - dependencies
    - environments
  binding:
    models: model payload trees (model.asset, model.companion-asset)
    dependencies: standalone downloaded dependency payloads (uv tool, shared accelerator/CUDA runtime)
    environments: Nimi-managed executable environment trees (native engine packages, the managed Python interpreter, venvs, package sets, Torch wheels)

dependency_families:
  - family_id: accelerator.cuda.runtime
    owner: runtime_local_environment_plan
    dependency_kind: shared_accelerator_runtime
    environment_key_fields:
      - dependency_id
      - host_profile_id
      - platform_tuple
      - runtime_data_root
    source_policy: system-first-managed-fallback
    source_candidates:
      - source_kind: system
        priority: 1
        admission: positive_compatibility_proof_required
      - source_kind: managed
        priority: 2
        admission: explicit_confirmation_before_first_network_materialization
      - source_kind: bundled
        priority: 3
        admission: not_admitted_for_default_consumer_path
      - source_kind: unavailable
        priority: 4
        admission: fail_closed
    managed_root: dependencies
    activation_env_delta: path_prepend_process_only
    materializer_ref: materializer.accelerator.cuda.runtime
    source_manifest_ref: managed-cuda-runtime-source
    verification_evidence_ref: accelerator-cuda-runtime-evidence
    persistent_mutation:
      user_path: forbidden
      machine_path: forbidden
      shell_profile: forbidden
      system_cuda: forbidden
    required_proof:
      - canonical_root
      - required_artifact_set
      - version_metadata_or_binary_version
      - driver_compatibility
      - selected_source_record

  - family_id: native-engine-package.llama
    owner: runtime_local_environment_plan
    dependency_kind: native_engine_package
    environment_key_fields:
      - engine_id
      - package_variant
      - platform_tuple
      - runtime_data_root
    source_policy: declared-managed-package-only
    source_candidates:
      - source_kind: managed
        priority: 1
        admission: explicit_confirmation_before_first_network_materialization
      - source_kind: unavailable
        priority: 2
        admission: fail_closed
    managed_root: environments
    activation_env_delta: process_env_only
    materializer_ref: materializer.native-engine-package.llama
    source_manifest_ref: managed-native-engine-package-source
    verification_evidence_ref: native-engine-package-evidence
    required_proof:
      - declared_package_source
      - archive_hash
      - canonical_root
      - executable_artifact
      - selected_source_record

  - family_id: native-engine-package.stablediffusion-ggml
    owner: runtime_local_environment_plan
    dependency_kind: native_engine_package
    environment_key_fields:
      - engine_id
      - backend_family
      - package_variant
      - platform_tuple
