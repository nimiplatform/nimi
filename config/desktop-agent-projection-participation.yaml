# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/desktop/agent-projection.authority.yaml
# Rationale: docs/authority/desktop-agent-projection-rationale.md
# Companion status/method/ref semantics remain owned by Avatar, SDK, and Runtime and are not duplicated here.
config_id: desktop_agent_projection_participation
owner: desktop
companion_panel:
  surface_kind: desktop_companion_panel
  source_rule: rule.nimi.desktop.agent-projection.r184
  user_controls:
    - explicit_user_trigger
    - cancel_or_interrupt
    - replay_open
realm_group_control_refs:
  source_rule: rule.nimi.desktop.agent-projection.r191
  required:
    - group_thread_ref
    - membership_snapshot_ref
    - agent_slot_ref
    - trigger_event_ref
    - read_cursor_ref
    - room_orchestration_ref
  optional:
    - reply_target_ref
realm_group_projection_states:
  source_rule: rule.nimi.desktop.agent-projection.r194
  values:
    - queued
    - running
    - refused
    - cancelled
    - timed_out
    - candidate
realm_group_fail_closed_inputs:
  source_rule: rule.nimi.desktop.agent-projection.r196
  values:
    - public_prompt_assembly
    - provider_model_selection
    - local_memory_verdict
    - local_capability_verdict
    - local_concurrency_verdict
    - group_local_queue_truth
    - group_local_fairness_truth
    - group_local_budget_truth
    - group_local_cancellation_truth
    - group_local_timeout_truth
    - GROUP_LIMITED_capability_enum
