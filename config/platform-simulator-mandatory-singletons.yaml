# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/platform/simulator.authority.yaml
# Rationale: docs/authority/platform-simulator-rationale.md
version: 1
table_family: product_catalog
owner: platform
catalog_id: platform_simulator_mandatory_singletons
source_rule: rule.nimi.platform.simulator.p-sim-006
entries:
  - react
  - react-dom
  - scheduler
  - "@nimiplatform/kit"
  - "@nimiplatform/sdk"
  - i18next
  - react-i18next
  - react-router-dom
  - "@tanstack/react-query"
  - zustand

identity_contract:
  required_tuple:
    - package_root
    - exact_version
    - lock_identity
    - export_subpath
    - phase
    - ordered_conditions
    - canonical_target
  context_sensitive_runtime_identity: required
  one_target_per_tuple: required
  version_string_only_proof: forbidden
  package_realpath_only_proof: forbidden
  app_override: forbidden
  app_lockfile: forbidden

packages:
  - name: react
    version_authority: simulator_root_lockfile_exact
    source_authority: simulator_final_resolver
    phases: [types, runtime]
    runtime_identity: required
    presence: required
  - name: react-dom
    version_authority: simulator_root_lockfile_exact
    source_authority: simulator_final_resolver
    phases: [types, runtime]
    runtime_identity: required
    presence: required
  - name: scheduler
    version_authority: simulator_root_lockfile_exact
    source_authority: simulator_final_resolver
    phases: [runtime]
    runtime_identity: required
    presence: when_reachable
  - name: "@nimiplatform/kit"
    version_authority: workspace_package_plus_simulator_root_lockfile_exact
    source_authority: workspace_kit_package
    phases: [types, runtime, style]
    runtime_identity: required
    presence: required
  - name: "@nimiplatform/sdk"
    version_authority: workspace_package_plus_simulator_root_lockfile_exact
    source_authority: workspace_sdk_package
    phases: [types, runtime]
    runtime_identity: required
    presence: required
  - name: i18next
    version_authority: simulator_root_lockfile_exact
    source_authority: simulator_final_resolver
    phases: [types, runtime]
    runtime_identity: required
    presence: when_reachable
  - name: react-i18next
    version_authority: simulator_root_lockfile_exact
    source_authority: simulator_final_resolver
    phases: [types, runtime]
    runtime_identity: required
    presence: when_reachable
  - name: react-router-dom
    version_authority: simulator_root_lockfile_exact
    source_authority: simulator_final_resolver
    phases: [types, runtime]
    runtime_identity: required
    presence: when_reachable
  - name: "@tanstack/react-query"
    version_authority: simulator_root_lockfile_exact
    source_authority: simulator_final_resolver
    phases: [types, runtime]
    runtime_identity: required
    presence: when_reachable
  - name: zustand
    version_authority: simulator_root_lockfile_exact
    source_authority: simulator_final_resolver
    phases: [types, runtime]
    runtime_identity: required
    presence: when_reachable
