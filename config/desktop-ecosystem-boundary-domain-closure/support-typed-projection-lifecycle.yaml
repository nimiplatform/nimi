status: migrated
date: "2026-06-01"
domain: support-typed-projection-lifecycle
migrated_in_this_commit: true
authority_posture:
  spec_status: alignment
  authority_owner:
    - kit/ui/src/hooks/typed-projection.ts
    - apps/desktop/src/shell/renderer/features/support/**
    - apps/tester/src/shell/routes/settings.tsx
  work_type: alignment
  parallel_truth: forbidden
scope:
  included:
    - Shared renderer typed-projection lifecycle for loading, ready, failed, and reload states.
    - Fail-closed projection semantics that never synthesize placeholder data after an upstream rejection.
    - Desktop Support consumption through its existing D-SUP typed projection surface.
    - Tester settings second-consumer proof for SDK local runtime facade and Realm data sync projections.
  excluded:
    - Desktop Support product copy, section routing, Tauri IPC commands, and OS helper behavior.
    - Runtime, Realm, or SDK projection ownership; this domain only covers app-facing renderer lifecycle state over typed projections.
    - Desktop self-update mechanics and support log export mechanics.
preflight_violation_inventory:
  platform_truth:
    - finding: Desktop Support owned a reusable async typed-projection lifecycle hook under the app tree.
      evidence_before: apps/desktop/src/shell/renderer/features/support/support-projection.ts implemented useState/useEffect/useRef loading, failed, and reload behavior.
      disposition: migrated_to_kit_ui_useTypedProjection
  duplicate_implementation:
    - finding: Tester settings duplicated the same one-shot fail-closed projection lifecycle for SDK local runtime facade and Realm data sync projections.
      evidence_before: apps/tester/src/shell/routes/settings.tsx carried LocalRuntimeFacadeProjectionState, RealmDataSyncProjectionState, cancelled flags, and setter effects.
      disposition: replaced_with_kit_ui_useTypedProjection
  boundary_imports:
    - finding: Desktop Support projection lifecycle did not import Runtime or Realm private code, but it lived in Desktop as reusable app-facing shell behavior.
      disposition: moved to Kit UI with no apps, runtime/internal, @renderer, or SDK imports.
  token_session_runtime_realm_responsibility:
    - finding: The lifecycle wrapper is not token, session, Runtime truth, or Realm truth; it is renderer-safe consumption mechanics over already-typed projections.
      disposition: Kit owns lifecycle mechanics; Runtime/Realm/SDK keep typed projection authority; apps render product-specific states.
audited_globs:
  - apps/desktop/src/shell/renderer/features/support/**
  - apps/desktop/test/support-surface-contract.test.ts
  - apps/desktop/test/support-typed-projection-domain-boundary.test.ts
  - apps/tester/src/shell/routes/settings.tsx
  - apps/tester/test/tester-contract.test.mjs
  - kit/ui/src/**
  - kit/ui/test/typed-projection.test.tsx
  - kit/auth/src/logic/runtime-account-browser-broker.ts
  - kit/auth/test/runtime-account-browser-broker.test.ts
  - apps/desktop/test/kit-shared-primitives-domain-boundary.test.ts
migrated:
  shared_owners:
    - kit/ui/src/hooks/typed-projection.ts
  responsibilities:
    - Kit UI owns reusable renderer typed-projection lifecycle state and fail-closed error fallback handling.
    - Desktop Support owns only product-specific section composition and a compatibility alias over the Kit hook.
    - Tester owns only settings product rendering and consumes the Kit hook for non-Desktop SDK projection flows.
  desktop_consumers:
    - apps/desktop/src/shell/renderer/features/support/support-projection.ts re-exports useTypedProjection as useSupportProjection from @nimiplatform/kit/ui.
    - apps/desktop/src/shell/renderer/features/support/support-diagnostics-section.tsx consumes the shared hook through the Support alias.
    - apps/desktop/src/shell/renderer/features/support/support-logs-section.tsx consumes the shared hook through the Support alias.
    - apps/desktop/src/shell/renderer/features/support/support-repair-section.tsx consumes the shared hook through the Support alias.
    - apps/desktop/src/shell/renderer/features/support/support-recovery-section.tsx consumes the shared hook through the Support alias.
  tester_consumers:
    - apps/tester/src/shell/routes/settings.tsx consumes useTypedProjection from @nimiplatform/kit/ui for resolveTesterLocalRuntimeFacadeProjection.
    - apps/tester/src/shell/routes/settings.tsx consumes useTypedProjection from @nimiplatform/kit/ui for resolveTesterRealmDataSyncProjection.
legal_desktop_residue:
  - path: apps/desktop/src/shell/renderer/features/support/support-projection.ts
    rationale: Thin Desktop Support compatibility alias only; no lifecycle implementation remains app-local.
  - path: apps/desktop/src/shell/renderer/features/support/support-*-section.tsx
    rationale: Desktop owns D-SUP product section composition, copy, action wiring, and fail-closed rendering around typed projections.
  - path: apps/desktop/src/shell/renderer/features/support/support-updates-section.tsx
    rationale: Updates consumes the DesktopReleaseInfo app-store projection and update actions; self-update authority is outside this typed projection lifecycle domain.
ancillary_compile_repairs:
  - path: kit/auth/src/logic/runtime-account-browser-broker.ts
    rationale: Tester typecheck exposed that the previously migrated Auth broker structural client types were narrower than the SDK PlatformClient return types; widened reason-code fields and made caller structurally SDK-compatible without importing SDK into Kit auth.
  - path: kit/auth/test/runtime-account-browser-broker.test.ts
    rationale: Updated broker test caller fixtures to the same structural caller shape consumed by Desktop and Tester.
  - path: apps/desktop/test/kit-shared-primitives-domain-boundary.test.ts
    rationale: Fixed an existing strict-nullability test helper issue so Desktop typecheck can cover the current migration.
tester_proof:
  - apps/tester/src/shell/routes/settings.tsx uses useTypedProjection from @nimiplatform/kit/ui in a settings flow distinct from Desktop Support.
  - apps/tester/test/tester-contract.test.mjs verifies Tester consumes the Kit typed projection lifecycle hook and removed local setter/effect duplication for the migrated projections.
regression_guards:
  - apps/desktop/test/support-typed-projection-domain-boundary.test.ts requires Kit ownership of useTypedProjection, blocks Desktop Support app-local lifecycle implementation, and requires Tester second-consumer proof.
  - kit/ui/test/typed-projection.test.tsx verifies fail-closed error handling, no placeholder data, fallback error messages, and reload behavior.
  - apps/desktop/test/support-surface-contract.test.ts keeps D-SUP fail-closed Support section behavior intact.
  - apps/tester/test/tester-contract.test.mjs blocks Tester from reintroducing local projection setter/effect duplication for the migrated projections.
prohibited_patterns:
  - target: apps/desktop/src/shell/renderer/features/support/support-projection.ts
    required:
      - useTypedProjection as useSupportProjection
      - "@nimiplatform/kit/ui"
    absent:
      - useState
      - useEffect
      - useRef
      - function useSupportProjection
  - target: apps/tester/src/shell/routes/settings.tsx
    required:
      - useTypedProjection
      - resolveTesterLocalRuntimeFacadeProjection
      - resolveTesterRealmDataSyncProjection
    absent:
      - setLocalRuntimeFacadeProjection
      - setRealmDataSyncProjection
      - LocalRuntimeFacadeProjectionState
      - RealmDataSyncProjectionState
  - target: kit/ui/src/hooks/typed-projection.ts
    absent:
      - "from 'apps/"
      - "@renderer"
      - "@runtime"
      - "@nimiplatform/sdk"
