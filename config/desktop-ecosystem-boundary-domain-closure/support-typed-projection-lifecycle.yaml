    - command: pnpm --filter @nimiplatform/kit build
      evidence: Kit public @nimiplatform/kit/ui export compiles into dist.
    - command: pnpm --filter @nimiplatform/tester typecheck
      evidence: Tester compiles against the Kit UI typed projection export and Auth broker structural client type.
    - command: pnpm --filter @nimiplatform/desktop typecheck
      evidence: Desktop compiles with the Support projection alias and current boundary tests.
    - command: >-
        pnpm --filter @nimiplatform/desktop exec tsx --test test/support-typed-projection-domain-boundary.test.ts test/support-surface-contract.test.ts test/kit-shared-primitives-domain-boundary.test.ts
      evidence: Desktop Support lifecycle hardcut, D-SUP surface contract, and Kit primitive boundary tests pass.
    - command: pnpm --filter @nimiplatform/tester exec node --test test/tester-contract.test.mjs test/scaffold-boundary.test.mjs
      evidence: Tester second-consumer contract and scaffold boundary tests pass.
    - command: pnpm check:nimi-kit
      evidence: Kit registry, package dist, build, and canonical capability catalog checks pass.
    - command: >-
        node -e "const fs=require('fs'); const yaml=require('yaml'); yaml.parse(fs.readFileSync('config/desktop-ecosystem-boundary-domain-closure/support-typed-projection-lifecycle.yaml','utf8'));"
      evidence: Support typed projection lifecycle closure record parses as YAML.
    - command: pnpm check:no-legacy-imports
      evidence: Legacy import guard passes.
    - command: pnpm check:no-absolute-user-paths
      evidence: Absolute user-home path guard passes.
