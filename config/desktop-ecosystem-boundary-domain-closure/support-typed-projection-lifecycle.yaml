      evidence: Patch whitespace passes.
  command_notes:
    - command: pnpm --filter @nimiplatform/tester typecheck
      status: failed-before-ancillary-auth-type-repair
      evidence: Initial run exposed the Auth broker structural client type incompatibility fixed in this commit; rerun passed.
    - command: pnpm --filter @nimiplatform/desktop typecheck
      status: failed-before-ancillary-test-helper-repair
