status: legalized
date: "2026-06-01"
domain: avatar-shell-local-assets-and-launch-handoff
authority_posture:
  spec_status: alignment
  authority_owner:
    - NIMI_APP_ECOSYSTEM_BOUNDARIES.md
    - .nimi/spec/avatar/kernel/app-shell-contract.md
    - .nimi/spec/avatar/kernel/embodiment-projection-contract.md
    - .nimi/spec/avatar/kernel/live2d-render-contract.md
    - .nimi/spec/avatar/kernel/avatar-debug-session-contract.md
    - .nimi/spec/avatar/kernel/carrier-visual-acceptance-contract.md
    - apps/avatar/src/shell/renderer/**
    - sdk/src/runtime/**
    - kit/features/avatar/**
  work_type: alignment
  parallel_truth: forbidden
scope:
  included:
    - Avatar app shell launch handoff boundary from Desktop to the Runtime-admitted local first-party Avatar app.
    - Desktop Agent Center local Avatar resource custody, validation evidence, and local UI configuration.
    - Desktop Avatar live-instance health projection over Runtime-projected nimi.avatar app storage roots.
    - Kit avatar shared headless/runtime/VRM/Live2D presentation, framing, motion, and voice playback helper surfaces.
    - Desktop Agent Chat composer/start-with-chat Avatar launch gating and instance arbitration.
    - Tester second-consumer proof for shared Kit avatar/runtime presentation helpers.
  excluded:
    - Runtime Agent canonical identity, presentation profile, memory, autonomy, pending hooks, and lifecycle surfaces; closed under runtime-agent.
    - Public Nimi App admission and installed package projection for nimi.avatar; closed under nimi-app-admission-registry-install-projection.
    - Realm agent/account/profile truth and media/resource APIs; closed under realm-data.
    - Product-local generic storage helpers; closed under product-local-state.
audited_globs:
  - .nimi/spec/avatar/kernel/**
  - apps/avatar/src/shell/renderer/**
  - apps/desktop/src-tauri/src/desktop_agent_center_store/**
  - apps/desktop/src-tauri/src/desktop_avatar_instance_registry/**
  - apps/desktop/src/shell/renderer/bridge/runtime-bridge/chat-agent-avatar-*.ts
  - apps/desktop/src/shell/renderer/bridge/runtime-bridge/chat-agent-center-local-config-store.ts
  - apps/desktop/src/shell/renderer/features/chat/chat-agent-avatar-*.ts
  - apps/desktop/src/shell/renderer/features/chat/chat-agent-avatar-*.tsx
  - apps/desktop/src/shell/renderer/features/chat/chat-agent-center-avatar-*.ts
  - apps/desktop/src/shell/renderer/features/chat/chat-agent-center-avatar-*.tsx
  - apps/desktop/src/shell/renderer/features/chat/chat-agent-center-local-config*.ts
  - apps/desktop/src/shell/renderer/features/chat/chat-agent-shell-local-avatar-controls.ts
  - apps/desktop/src/shell/renderer/features/chat/chat-agent-shell-presentation*.tsx
  - apps/desktop/test/*avatar*.test.ts
  - apps/desktop/test/desktop-macos-smoke-live2d.test.ts
  - apps/tester/src/shell/routes/settings.tsx
  - apps/tester/test/tester-contract.test.mjs
  - kit/features/avatar/**
legalized:
  shared_owners:
    - apps/avatar/src/shell/renderer/**
    - kit/features/avatar/**
    - sdk/src/runtime/local-agent-identity.ts
    - sdk/src/runtime/runtime-agent-presentation-profile.ts
    - sdk/src/runtime/runtime-agent-voice-lipsync-parsers.ts
    - sdk/src/runtime/runtime-app-storage.ts
  responsibilities:
    - Avatar app/kernel owns Avatar shell composition, carrier visual runtime, hit-region/window behavior, launch-context interpretation, Live2D app runtime, and Avatar debug session evidence.
    - Kit owns reusable avatar presentation profile normalization, AvatarStage UI, voice playback cues, VRM framing/state/render helpers, and Live2D framing/motion/state helpers.
    - SDK Runtime owns local-agent identity parsing/projection, Runtime Agent presentation profile, voice/lipsync parsers, and app storage root projections.
    - Desktop owns only host-local Agent Center custody for imported Avatar resources/backgrounds, local validation evidence, and product UI state around those resources.
  desktop_app_owned:
    - path: apps/desktop/src-tauri/src/desktop_agent_center_store/**
      rationale: Desktop owns Agent Center local Avatar resource import, validation evidence, operation log, background asset custody, and account/local-agent scoped config as host-local product state; it must not own Avatar app shell semantics, Runtime Agent presentation truth, Realm identity, or public app admission.
    - path: apps/desktop/src-tauri/src/desktop_avatar_instance_registry/**
      rationale: Desktop reads the Avatar app's short-lived live-instance projection only from Runtime-projected nimi.avatar app storage roots and filters it by liveness/freshness; it does not accept binding/auth/package truth from the projection.
    - path: apps/desktop/src/shell/renderer/bridge/runtime-bridge/chat-agent-avatar-launcher.ts
      rationale: Desktop owns the OS handoff command seam and instance-id construction for the Desktop-launched Avatar flow; payload remains the minimal agentId/avatarInstanceId/launchSource triple and rejects auth, Realm, package, binding, and visual truth.
    - path: apps/desktop/src/shell/renderer/bridge/runtime-bridge/chat-agent-avatar-instance-registry.ts
      rationale: Desktop owns a thin renderer bridge over the local live-instance projection and validates localAgentRef through SDK Runtime identity helpers.
    - path: apps/desktop/src/shell/renderer/bridge/runtime-bridge/chat-agent-center-local-config-store.ts
      rationale: Desktop owns Tauri command wiring for Agent Center local resource custody; payload parsing delegates to the local config validator and does not launch Avatar directly.
    - path: apps/desktop/src/shell/renderer/features/chat/chat-agent-shell-local-avatar-controls.ts
      rationale: Desktop owns product UI orchestration, start-with-chat gating, instance arbitration call sites, and warnings; it launches only after local resource/backend evidence and Runtime account/anchor inputs are present.
    - path: apps/desktop/src/shell/renderer/features/chat/chat-agent-avatar-live2d-*.ts
      rationale: Desktop owns concrete Live2D source loading, Cubism bootstrap, and viewport host recovery for its chat surface; shared framing/motion/state policy is imported from Kit avatar/live2d.
    - path: apps/desktop/src/shell/renderer/features/chat/chat-agent-avatar-vrm-*.ts
      rationale: Desktop owns lazy host wiring and concrete Three/VRM viewport diagnostics for its chat surface; shared VRM framing/state/render policy is imported from Kit avatar/vrm.
tester_proof:
  - apps/tester/src/shell/routes/settings.tsx consumes SDK Runtime voice schedule projection and Kit avatar cue helpers in a product settings flow distinct from Desktop Agent Chat.
  - apps/tester/test/tester-contract.test.mjs verifies Tester settings consume SDK Runtime voice schedule projection and Kit avatar cue helpers.
  - apps/tester/src/tester/kit-component-gallery.tsx proves Tester consumes Kit UI Avatar primitives as a separate Nimi ecosystem app.
  - kit/features/avatar/test/*.test.* prove shared Kit avatar behavior outside Desktop.
regression_guards:
  - apps/desktop/test/avatar-shell-local-assets-domain-boundary.test.ts aggregates this domain hardcut across Avatar app authority, Kit shared avatar helpers, Desktop legal residue, and Tester proof.
  - apps/desktop/test/chat-agent-avatar-configuration-surface.test.ts blocks launch handoff widening and requires local resource/backend evidence before handoff.
  - apps/desktop/test/chat-agent-avatar-instance-registry.test.ts blocks authority-bearing live-instance records and validates minimal registry command payload shape.
  - apps/desktop/test/chat-agent-avatar-launch-arbitration.test.ts covers start-with-chat and explicit launch instance arbitration.
  - apps/desktop/test/chat-agent-voice-playback-boundary.test.ts blocks Desktop voice playback estimator ownership and requires Kit avatar helpers.
  - apps/desktop/test/chat-agent-avatar-vrm-framing.test.ts and apps/desktop/test/chat-agent-avatar-live2d-framing.test.ts cover Kit-backed framing policies through Desktop aliases.
  - kit/features/avatar/test/avatar-*.test.* cover shared Kit avatar headless/runtime/voice/VRM/Live2D behavior.
  - apps/tester/test/tester-contract.test.mjs covers Tester as second consumer for Kit avatar helper surfaces.
prohibited_patterns:
  - target: apps/desktop/src/shell/renderer/bridge/runtime-bridge/chat-agent-avatar-launcher.ts
    absent_or_allowlisted:
      - pattern: apps/avatar
        allowlist: none
      - pattern: accessToken
        allowlist: forbidden field list only
      - pattern: refreshToken
        allowlist: forbidden field list only
      - pattern: conversationAnchorId
        allowlist: forbidden field list and instance-id guard only
      - pattern: avatarPackageId
        allowlist: forbidden field list only
  - target: apps/desktop/src/shell/renderer/features/chat/chat-agent-avatar-live2d-framing.ts
    required:
      - "@nimiplatform/kit/features/avatar/live2d"
  - target: apps/desktop/src/shell/renderer/features/chat/chat-agent-avatar-vrm-framing.ts
    required:
      - "@nimiplatform/kit/features/avatar/vrm"
  - target: apps/desktop/src-tauri/src/desktop_avatar_instance_registry/**
    absent_or_allowlisted:
      - pattern: conversation_anchor_id
        allowlist: none
      - pattern: binding_id
        allowlist: none
      - pattern: access_token
        allowlist: none
      - pattern: refresh_token
        allowlist: none
  - target: apps/desktop/src-tauri/src/desktop_agent_center_store/**
    absent_or_allowlisted:
      - pattern: refresh_token
        allowlist: none
      - pattern: access_token
        allowlist: none
      - pattern: realm_base_url
        allowlist: none
