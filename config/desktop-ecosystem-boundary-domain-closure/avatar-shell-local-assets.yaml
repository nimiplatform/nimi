scope:
  included:
    - Avatar app shell launch handoff boundary from Desktop to the Runtime-admitted local first-party Avatar app.
    - Desktop Agent Center local Avatar resource custody, validation evidence, and local UI configuration.
    - Desktop Avatar live-instance health projection over Runtime-projected nimi.avatar app storage roots.
    - Kit avatar shared headless/runtime/VRM/Live2D presentation, framing, motion, and voice playback helper surfaces.
    - Desktop Agent Chat composer/start-with-chat Avatar launch gating and instance arbitration.
    - Tester second-consumer proof for shared Kit avatar/runtime presentation helpers.
  excluded:
    - Runtime Agent canonical identity, presentation profile, memory, autonomy, pending hooks, and lifecycle surfaces; closed under runtime-agent.
    - Public Nimi App admission and installed package projection for nimi.avatar; closed under nimi-app-admission-registry-install-projection.
    - Realm agent/account/profile truth and media/resource APIs; closed under realm-data.
    - Product-local generic storage helpers; closed under product-local-state.
