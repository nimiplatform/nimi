legalized:
  shared_owners:
    - apps/avatar/src/shell/renderer/**
    - kit/features/avatar/**
    - sdks/typescript/runtime/index.ts
    - sdks/typescript/runtime/app-storage.ts
  responsibilities:
    - Avatar app/kernel owns Avatar shell composition, carrier visual runtime, hit-region/window behavior, launch-context interpretation, Live2D/VRM runtime execution, and Avatar debug session evidence.
    - Kit owns reusable avatar presentation profile normalization, Agent Center appearance surfaces, AvatarStage UI, and voice playback cues.
    - SDK Runtime owns local-agent identity parsing/projection, Runtime Agent presentation profile, voice/lipsync parsers, and app storage root projections.
    - Desktop owns only host-local Agent Center custody for imported Avatar resources/backgrounds, local validation evidence, and product UI state around those resources.
  desktop_app_owned:
    - path: apps/desktop/src-tauri/src/desktop_agent_center_store/**
      rationale: Desktop owns Agent Center local Avatar resource import, validation evidence, operation log, background asset custody, and account/local-agent scoped config as host-local product state; it must not own Avatar app shell semantics, Runtime Agent presentation truth, Realm identity, or public app admission.
    - path: apps/desktop/src-tauri/src/desktop_avatar_instance_registry/**
      rationale: Desktop reads the Avatar app's short-lived live-instance projection only from Runtime-projected nimi.avatar app storage roots and filters it by liveness/freshness; it does not accept binding/auth/package truth from the projection.
    - path: apps/desktop/src/shell/renderer/bridge/runtime-bridge/chat-agent-avatar-launcher.ts
      rationale: Desktop owns the OS handoff command seam and instance-id construction for the Desktop-launched Avatar flow; payload remains the minimal agentId/avatarInstanceId/launchSource triple and rejects auth, Realm, package, binding, and visual truth.
    - path: apps/desktop/src/shell/renderer/bridge/runtime-bridge/chat-agent-avatar-instance-registry.ts
      rationale: Desktop owns a thin renderer bridge over the local live-instance projection and validates localAgentRef through SDK Runtime identity helpers.
    - path: apps/desktop/src/shell/renderer/bridge/runtime-bridge/chat-agent-center-local-config-store.ts
      rationale: Desktop owns Tauri command wiring for Agent Center local resource custody; payload parsing delegates to the local config validator and does not launch Avatar directly.
    - path: apps/desktop/src/shell/renderer/features/chat/chat-agent-shell-local-avatar-controls.ts
      rationale: Desktop owns product UI orchestration, start-with-chat gating, instance arbitration call sites, and warnings; it launches only after local resource/backend evidence and Runtime account/anchor inputs are present.
    - path: apps/desktop/src/shell/renderer/features/chat/chat-agent-shell-local-avatar-controls.ts
      rationale: Desktop owns product UI orchestration around Avatar handoff readiness; it does not render Live2D/VRM locally.
tester_proof:
  - apps/tester/src/shell/routes/settings.tsx consumes SDK Runtime voice schedule projection and Kit avatar cue helpers in a product settings flow distinct from Desktop Agent Chat.
  - apps/tester/test/tester-contract.test.mjs verifies Tester settings consume SDK Runtime voice schedule projection and Kit avatar cue helpers.
  - apps/tester/src/tester/kit-component-gallery.tsx proves Tester consumes Kit UI Avatar primitives as a separate Nimi ecosystem app.
  - kit/features/avatar/test/*.test.* prove shared Kit avatar behavior outside Desktop.
regression_guards:
  - apps/desktop/test/chat-agent-avatar-launcher.test.ts blocks launch handoff widening and rejects local asset, backend profile, calibration, auth, package, and binding payload drift.
  - apps/desktop/test/chat-agent-shell-avatar-asset-diagnostics.test.ts requires local resource/backend evidence before handoff readiness is shown.
  - apps/desktop/test/chat-agent-avatar-instance-registry.test.ts blocks authority-bearing live-instance records and validates minimal registry command payload shape.
  - apps/desktop/test/chat-agent-avatar-launch-arbitration.test.ts covers start-with-chat and explicit launch instance arbitration.
  - apps/desktop/test/chat-agent-voice-playback-boundary.test.ts blocks Desktop voice playback estimator ownership and requires Kit avatar helpers.
  - kit/features/avatar/test/avatar-*.test.* cover shared Kit avatar headless/runtime/voice/VRM/Live2D behavior.
  - apps/tester/test/tester-contract.test.mjs covers Tester as second consumer for Kit avatar helper surfaces.
