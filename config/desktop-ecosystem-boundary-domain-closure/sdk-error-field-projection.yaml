status: migrated
date: "2026-06-01"
domain: sdk-error-field-projection
migrated_in_this_commit: true
authority_posture:
  spec_status: alignment
  authority_owner:
    - sdk/src/types/index.ts
    - apps/desktop/src/runtime/net/error-normalize.ts
    - apps/desktop/src/shell/renderer/infra/realm/realm-api.ts
    - apps/desktop/src/shell/renderer/features/relationship/profile-private-state.ts
    - apps/tester/src/shell/routes/settings.tsx
  work_type: alignment
  parallel_truth: forbidden
scope:
  included:
    - NimiError field extraction for code, reasonCode, actionHint, traceId, retryable, and message.
    - Structured object, snake_case field, JSON-like string, and Error.cause parsing.
    - Desktop Realm data error logging/offline projection consumption through SDK types.
    - Desktop private profile access classification through SDK types.
    - Tester settings second-consumer proof for SDK typed error-field projection.
  excluded:
    - Runtime reason-code message catalog and local AI compatibility mapping, already SDK Runtime-owned.
    - Offline reason-code ownership and createOfflineNimiError, already closed under offline-typed-error-projection.
    - Runtime telemetry emission and Desktop product log sinks.
preflight_violation_inventory:
  platform_truth:
    - finding: Desktop owned reusable NimiError/reason/actionHint/trace/retryable extraction under app-local runtime telemetry.
      evidence_before: apps/desktop/src/runtime/telemetry/error-fields.ts implemented extractRuntimeErrorFields using SDK JSON parsing.
      disposition: migrated_to_sdk_types_extractNimiErrorFields
  duplicate_implementation:
    - finding: Tester already consumed SDK Runtime reason-code helpers but had no second-consumer proof for the broader typed error-field envelope.
      evidence_before: apps/tester/src/shell/routes/settings.tsx used extractRuntimeReasonCodeFromError but not shared NimiError field extraction.
      disposition: Tester settings now consumes extractNimiErrorFields from @nimiplatform/sdk/types.
  boundary_imports:
    - finding: Desktop renderer imported @runtime/telemetry/error-fields from Realm API and relationship private-profile code.
      disposition: both imports now consume @nimiplatform/sdk/types; the Desktop error-fields file is deleted.
  token_session_runtime_realm_responsibility:
    - finding: The migrated helper only reads typed error metadata and does not create, refresh, persist, or own access/refresh tokens or Runtime/Realm session state.
      disposition: SDK types owns app-facing envelope parsing; Runtime/Realm remain authoritative for emitted reason codes and session truth.
audited_globs:
  - apps/desktop/src/runtime/telemetry/**
  - apps/desktop/src/runtime/net/error-normalize.ts
  - apps/desktop/src/shell/renderer/infra/realm/**
  - apps/desktop/src/shell/renderer/features/relationship/profile-private-state.ts
  - apps/desktop/test/sdk-error-field-projection-domain-boundary.test.ts
  - apps/desktop/test/offline-error-classification.test.ts
  - apps/desktop/test/offline-typed-error-domain-boundary.test.ts
  - apps/tester/src/shell/routes/settings.tsx
  - apps/tester/test/tester-contract.test.mjs
  - sdk/src/types/index.ts
  - sdk/test/types.test.ts
migrated:
  shared_owners:
    - sdk/src/types/index.ts
  responsibilities:
    - SDK types owns extractNimiErrorFields and the app-facing typed error-field projection shape.
    - Desktop consumes SDK extraction for API normalization, Realm data error logging, and private profile access checks.
    - Tester consumes SDK extraction in a settings Runtime reason projection as a non-Desktop app proof.
  desktop_consumers:
    - apps/desktop/src/runtime/net/error-normalize.ts consumes extractNimiErrorFields.
    - apps/desktop/src/shell/renderer/infra/realm/realm-api.ts consumes extractNimiErrorFields.
    - apps/desktop/src/shell/renderer/features/relationship/profile-private-state.ts consumes extractNimiErrorFields.
  tester_consumers:
    - apps/tester/src/shell/routes/settings.tsx consumes extractNimiErrorFields from @nimiplatform/sdk/types and renders the projected trace id.
legal_desktop_residue:
  - path: apps/desktop/src/runtime/net/error-normalize.ts
    rationale: Desktop keeps HTTP/API error normalization for its Realm bridge behavior; typed error-field parsing is SDK-owned.
  - path: apps/desktop/src/shell/renderer/infra/realm/realm-api.ts
    rationale: Desktop owns Realm data error logging and offline coordinator reaction wiring; error envelope parsing is SDK-owned.
  - path: apps/desktop/src/shell/renderer/features/relationship/profile-private-state.ts
    rationale: Desktop owns restricted-profile fallback presentation and 403 classification; reason-code field extraction is SDK-owned.
tester_proof:
  - apps/tester/src/shell/routes/settings.tsx consumes extractNimiErrorFields from @nimiplatform/sdk/types.
  - apps/tester/test/tester-contract.test.mjs verifies Tester consumes extractNimiErrorFields and renders runtimeReasonProjection.traceId.
regression_guards:
  - apps/desktop/test/sdk-error-field-projection-domain-boundary.test.ts blocks Desktop app-local runtime telemetry error-field ownership and requires Tester second-consumer proof.
  - sdk/test/types.test.ts covers extractNimiErrorFields behavior for structured, snake_case, JSON-like, and Error.cause inputs.
  - apps/desktop/test/offline-error-classification.test.ts keeps Realm data API offline reaction wired through a unified error outlet.
  - apps/tester/test/tester-contract.test.mjs requires Tester settings to consume the SDK typed error-field projection.
prohibited_patterns:
  - target: apps/desktop/src
    absent:
      - extractRuntimeErrorFields
      - telemetry/error-fields
      - "@runtime/telemetry/error-fields"
  - target: apps/desktop/src/runtime/telemetry/error-fields.ts
    absent_file: true
  - target: apps/tester/src/shell/routes/settings.tsx
    required:
      - extractNimiErrorFields
      - runtimeReasonProjection.traceId
verification:
  status: passed
  passed:
    - command: pnpm --filter @nimiplatform/sdk exec tsx --test test/types.test.ts
      evidence: SDK typed error-field extraction and offline typed error tests pass.
    - command: >-
        pnpm --filter @nimiplatform/desktop exec tsx --test test/sdk-error-field-projection-domain-boundary.test.ts test/offline-typed-error-domain-boundary.test.ts test/offline-error-classification.test.ts
      evidence: Desktop hardcut proves SDK ownership, deleted app-local error-fields file, and offline Realm data outlet behavior.
    - command: pnpm --filter @nimiplatform/tester exec node --test test/tester-contract.test.mjs test/scaffold-boundary.test.mjs
      evidence: Tester consumes SDK typed error-field projection as second app proof.
    - command: pnpm --filter @nimiplatform/sdk build
      evidence: SDK public types export compiles into dist.
    - command: pnpm --filter @nimiplatform/desktop typecheck
      evidence: Desktop compiles after deleting app-local error-fields implementation.
    - command: pnpm --filter @nimiplatform/tester typecheck
      evidence: Tester compiles after SDK build completed.
    - command: >-
        pnpm --filter @nimiplatform/desktop exec tsx --test test/contacts-private-profile-fallback.test.ts test/sdk-error-field-projection-domain-boundary.test.ts
      evidence: Private profile restricted-state fallback still passes with SDK-owned error field extraction.
    - command: >-
        rg -n "extractRuntimeErrorFields|telemetry/error-fields|@runtime/telemetry/error-fields" apps/desktop/src apps/tester/src sdk/src kit --glob '!**/dist/**' --glob '!**/generated/**' --glob '!**/gen/**'
      evidence: No prohibited app-local error-field extractor references remain.
    - command: >-
        node -e "const fs=require('fs'); const yaml=require('yaml'); yaml.parse(fs.readFileSync('config/desktop-ecosystem-boundary-domain-closure/sdk-error-field-projection.yaml','utf8'));"
      evidence: SDK error-field projection closure record parses as YAML.
    - command: pnpm check:no-legacy-imports
      evidence: Legacy import guard passes.
    - command: pnpm check:no-absolute-user-paths
      evidence: Absolute user-home path guard passes.
    - command: pnpm check:no-app-realm-rest-bypass
      evidence: App Realm REST bypass guard passes.
    - command: git diff --check
      evidence: Patch whitespace passes.
  command_notes:
    - command: pnpm --filter @nimiplatform/tester typecheck
      status: failed-during-parallel-sdk-dist-rewrite
      evidence: Initial run overlapped with pnpm --filter @nimiplatform/sdk build, which temporarily removed SDK dist exports; rerun after SDK build passed.
