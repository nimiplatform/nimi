status: migrated
date: "2026-06-01"
domain: realm-agent-profile-create-data
migrated_in_this_commit: true
authority_posture:
  spec_status: alignment
  authority_owner:
    - .nimi/spec/realm/**
    - .nimi/spec/sdk/kernel/nimi-app-client-contract.md
    - sdk/src/realm/extensions/agent-profile.ts
  work_type: alignment
  parallel_truth: forbidden
scope:
  included:
    - Realm Agent detail lookup by id/handle, unsupported legacy handle-prefix rejection, and world banner enrichment.
    - Realm master-agent create/list helper ownership for creator flows.
    - Desktop Agent Detail and World create wrappers consuming SDK Realm helpers.
    - Tester consumption of the same SDK Realm Agent profile/create helpers as second-app proof.
  excluded:
    - Desktop Agent Detail UI read filters, offline cache fallback, cache TTL, and product navigation state.
    - Realm canonical service definitions and generated service clients.
preflight_violation_inventory:
  platform_truth:
    - finding: Desktop Agent Detail data selected Realm AgentsService and WorldsService methods directly.
      evidence_before:
        - apps/desktop/src/shell/renderer/features/agent-detail/data/realm-agent-detail-data.ts called AgentsService.getAgent.
        - apps/desktop/src/shell/renderer/features/agent-detail/data/realm-agent-detail-data.ts called AgentsService.getAgentByHandle.
        - apps/desktop/src/shell/renderer/features/agent-detail/data/realm-agent-detail-data.ts called WorldsService.worldControllerGetWorld for world banner enrichment.
      disposition: SDK Realm agent-profile extension now owns lookup method selection, unsupported legacy handle-prefix rejection, and world banner enrichment.
    - finding: Desktop Realm Agent create data selected CreatorService methods directly.
      evidence_before:
        - apps/desktop/src/shell/renderer/features/world/data/realm-agent-create-data.ts called CreatorService.creatorControllerCreateAgent.
        - apps/desktop/src/shell/renderer/features/world/data/realm-agent-create-data.ts called CreatorService.creatorControllerListAgents.
      disposition: SDK Realm agent-profile extension now owns master-agent create/list service method selection and payload forwarding.
  duplicate_implementation:
    - finding: Desktop behavior tests owned Agent lookup fallback and creator create/list request behavior after the behavior belonged to Realm/SDK.
      disposition: SDK owner tests now cover lookup fallback, world enrichment, creator create/list forwarding, and fail-closed permission failures; Desktop tests are boundary assertions.
  boundary_imports:
    - finding: Desktop imported generated SDK Realm service facades while retaining direct Realm method selection locally.
      disposition: Desktop imports agent-profile helper functions from @nimiplatform/sdk/realm and retains only app-owned orchestration.
  token_session_runtime_realm_responsibility:
    - finding: Realm Agent profile/detail and creator service contracts are Realm responsibilities exposed to apps through SDK, not Desktop platform truth.
      disposition: SDK exposes app-facing helper methods over a caller-provided Realm transport; Desktop session transport remains in callRealmApi.
audited_globs:
  - apps/desktop/src/shell/renderer/features/agent-detail/data/realm-agent-detail-data.ts
  - apps/desktop/src/shell/renderer/features/world/data/realm-agent-create-data.ts
  - apps/desktop/test/agent-identity-inference-contract.test.ts
  - apps/desktop/test/data-sync-agent-flow-owner-contract.test.ts
  - apps/desktop/test/creator-data-capability-contract.test.ts
  - apps/desktop/test/t5-explore-world-realmagent-acceptance.test.ts
  - apps/tester/src/tester/tester-realm-agent-profile-projection.ts
  - apps/tester/src/shell/routes/settings.tsx
  - apps/tester/test/tester-contract.test.mjs
  - sdk/src/realm/extensions/agent-profile.ts
  - sdk/src/realm/index.ts
  - sdk/test/realm-agent-profile-extension.test.ts
migrated:
  shared_owners:
    - sdk/src/realm/extensions/agent-profile.ts
  responsibilities:
    - SDK owns Realm Agent detail lookup service method selection and unsupported legacy handle-prefix rejection.
    - SDK owns Realm Agent profile world banner enrichment through WorldsService.
    - SDK owns Realm creator master-agent create/list service method selection and request payload forwarding.
    - Desktop owns Agent Detail cache/fallback/read-filter orchestration and World create UI inflight cache only.
  desktop_consumers:
    - apps/desktop/src/shell/renderer/features/agent-detail/data/realm-agent-detail-data.ts
    - apps/desktop/src/shell/renderer/features/world/data/realm-agent-create-data.ts
  tester_consumers:
    - apps/tester/src/tester/tester-realm-agent-profile-projection.ts
    - apps/tester/src/shell/routes/settings.tsx
legal_desktop_residue:
  - path: apps/desktop/src/shell/renderer/features/agent-detail/data/realm-agent-detail-data.ts
    rationale: Desktop owns product cache TTL, offline cache fallback, viewer-context read filtering, and final app error emission; Realm lookup and world enrichment semantics come from SDK.
  - path: apps/desktop/src/shell/renderer/features/world/data/realm-agent-create-data.ts
    rationale: Desktop owns product inflight cache and UI-facing wrapper names; Realm creator create/list behavior comes from SDK.
tester_proof:
  - apps/tester/src/tester/tester-realm-agent-profile-projection.ts consumes loadRealmAgentDetails, loadRealmCreatorAgents, and createRealmMasterAgent from @nimiplatform/sdk/realm.
  - apps/tester/src/shell/routes/settings.tsx renders the SDK Realm agent profile projection in Tester settings.
  - apps/tester/test/tester-contract.test.mjs asserts Tester consumes the SDK Realm agent-profile helpers.
regression_guards:
  - sdk/test/realm-agent-profile-extension.test.ts covers SDK owner behavior for unsupported handle prefixes, id-to-handle fallback, world banner enrichment, creator create/list forwarding, and fail-closed creator list errors.
  - apps/desktop/test/agent-identity-inference-contract.test.ts asserts Desktop delegates Agent detail lookup behavior to SDK and blocks direct AgentsService method selection.
  - apps/desktop/test/data-sync-agent-flow-owner-contract.test.ts asserts Desktop delegates creator create/list behavior to SDK and blocks direct CreatorService method selection.
  - apps/desktop/test/creator-data-capability-contract.test.ts keeps Desktop creator capability boundaries.
  - apps/desktop/test/t5-explore-world-realmagent-acceptance.test.ts keeps Desktop Explore/RealmAgent acceptance wiring.
  - apps/tester/test/tester-contract.test.mjs keeps Tester second-consumer proof.
prohibited_patterns:
  - target: apps/desktop/src/shell/renderer/features/agent-detail/data apps/desktop/src/shell/renderer/features/world/data/realm-agent-create-data.ts
    absent:
      - "realm.services.AgentsService"
      - "realm.services.CreatorService"
      - "realm.services.WorldsService.worldControllerGetWorld"
  - target: apps/desktop/src/shell/renderer/features/agent-detail/data/realm-agent-detail-data.ts
    required:
      - loadRealmAgentDetails
      - "@nimiplatform/sdk/realm"
  - target: apps/desktop/src/shell/renderer/features/world/data/realm-agent-create-data.ts
    required:
      - createRealmMasterAgent
      - loadRealmCreatorAgents
      - "@nimiplatform/sdk/realm"
verification:
  status: passed
  passed:
    - command: >-
        pnpm --filter @nimiplatform/sdk exec tsx --test test/realm-agent-profile-extension.test.ts test/realm-social-feed-extension.test.ts
      evidence: SDK Agent profile/create owner tests and adjacent social-feed extension tests pass.
    - command: >-
        pnpm --filter @nimiplatform/desktop exec tsx --test test/data-sync-agent-flow-owner-contract.test.ts test/agent-identity-inference-contract.test.ts test/creator-data-capability-contract.test.ts test/t5-explore-world-realmagent-acceptance.test.ts
      evidence: Desktop boundary and adjacent creator/explore acceptance tests pass.
    - command: pnpm --filter @nimiplatform/sdk build
      evidence: SDK Realm public exports compile into dist.
    - command: pnpm --filter @nimiplatform/tester exec node --test test/tester-contract.test.mjs
      evidence: Tester second-consumer contract passes after SDK build.
    - command: pnpm --filter @nimiplatform/desktop typecheck
      evidence: Desktop compiles against SDK Realm Agent profile/create helpers.
    - command: pnpm --filter @nimiplatform/tester typecheck
      evidence: Tester compiles against SDK Realm Agent profile/create helpers.
    - command: >-
        rg "realm\.services\.(AgentsService|CreatorService|WorldsService\.worldControllerGetWorld)" apps/desktop/src/shell/renderer/features/agent-detail/data apps/desktop/src/shell/renderer/features/world/data/realm-agent-create-data.ts
      evidence: No audited Desktop Agent detail/create direct Realm service method selection remains.
    - command: pnpm check:no-app-realm-rest-bypass
      evidence: App Realm REST bypass guard passes.
    - command: pnpm check:no-legacy-imports
      evidence: Legacy import guard passes.
    - command: pnpm check:no-absolute-user-paths
      evidence: Absolute user-home path guard passes.
    - command: git diff --check
      evidence: Patch whitespace passes.
