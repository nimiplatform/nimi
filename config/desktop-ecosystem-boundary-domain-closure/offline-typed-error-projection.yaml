status: migrated
date: "2026-06-01"
domain: offline-typed-error-projection
closure_result:
  kind: refactor
  migrated_in_this_commit: true
  production_code_changed_in_this_commit: true
  refactor_progress_credit: true
authority_posture:
  spec_status: alignment
  authority_owner:
    - sdk/src/types/index.ts
    - kit/core/src/offline-coordinator.ts
    - apps/desktop/src/shell/renderer/infra/offline/**
    - apps/tester/src/shell/routes/settings.tsx
  work_type: alignment
  parallel_truth: forbidden
scope:
  included:
    - Offline typed NimiError envelope construction and retryable/source/trace defaults.
    - Realm/Runtime offline reason-code classification and transport-owner projection.
    - SDK-owned generic Nimi error message projection for offline outbox failure reasons.
    - Desktop direct consumption of SDK classification and Kit coordinator without Desktop error forwarding shells.
    - Tester settings second-consumer proof for SDK offline typed error projection.
  excluded:
    - Desktop IndexedDB offline cache and outbox persistence, which remain product-local data durability.
    - Realm/Runtime transport retry internals owned by SDK Realm/Runtime clients.
    - Product UI copy and offline-tier presentation.
preflight_violation_inventory:
  platform_truth:
    - finding: Desktop infra/offline previously owned construction of SDK NimiError-shaped offline envelopes, including reasonCode/actionHint/retryable/source and trace defaulting.
      evidence_before: apps/desktop/src/shell/renderer/infra/offline/errors.ts imported createNimiError and createNimiClientId from @nimiplatform/sdk/runtime.
      disposition: migrated_to_sdk_types_createOfflineNimiError.
    - finding: Desktop infra/offline retained a thin forwarding shell over SDK typed error helpers after the first migration.
      evidence_before: apps/desktop/src/shell/renderer/infra/offline/errors.ts exported createOfflineError/getErrorMessage/isRealmOfflineError/isRuntimeOfflineError/isNimiErrorLike.
      disposition: forwarding_shell_deleted; consumers import SDK types directly.
    - finding: Offline reason-code ownership was already in SDK types, and reconnect tier ownership was already in Kit core.
      evidence_current:
        - sdk/src/types/index.ts classifyOfflineError/classifyOfflineReasonCode
        - kit/core/src/offline-coordinator.ts OfflineCoordinator
      disposition: retained_shared_owner.
  duplicate_implementation:
    - finding: Tester had SDK offline classification proof but no shared typed offline error envelope proof.
      evidence_before: apps/tester/src/shell/routes/settings.tsx used classifyOfflineError over a hand-shaped object.
      disposition: Tester now consumes createOfflineNimiError from @nimiplatform/sdk/types.
  boundary_imports:
    - finding: Desktop offline facade should not import or re-export SDK typed error helpers.
      disposition: apps/desktop/src/shell/renderer/infra/offline/index.ts exports only Kit coordinator plus Desktop cache/outbox surfaces.
  token_session_runtime_realm_responsibility:
    - finding: Offline errors are transport/projection metadata, not Runtime method ownership or Realm truth.
      disposition: SDK types owns the typed error envelope and classifiers; Runtime/Realm clients own transport behavior; Desktop owns only UI/cache/outbox reactions.
audited_globs:
  - apps/desktop/src/shell/renderer/infra/offline/**
  - apps/desktop/src/shell/renderer/features/**/data/*.ts
  - apps/desktop/src/shell/renderer/infra/local-agent-courier/**
  - apps/desktop/src/shell/renderer/infra/realm/realm-api.ts
  - apps/desktop/test/offline-*.test.ts
  - apps/desktop/test/data-sync-chat-flow.test.ts
  - apps/desktop/test/data-sync-world-flow-contract.test.ts
  - apps/tester/src/shell/routes/settings.tsx
  - apps/tester/test/tester-contract.test.mjs
  - sdk/src/types/index.ts
  - sdk/test/types.test.ts
  - kit/core/src/offline-coordinator.ts
  - kit/test/offline-coordinator.test.ts
migrated:
  shared_owners:
    - sdk/src/types/index.ts
    - kit/core/src/offline-coordinator.ts
  responsibilities:
    - SDK types owns createOfflineNimiError, getNimiErrorMessage, NimiError-shaped offline envelope defaults, and offline reason-code classification.
    - Kit core owns OfflineCoordinator tier/reconnect state and timer-driven reconnect coordination.
    - Desktop consumes those shared owners and keeps only product-local cache/outbox adapters and UI reaction wiring.
  desktop_consumers:
    - apps/desktop/src/shell/renderer/infra/realm/realm-api.ts consumes isRealmOfflineErrorLike from @nimiplatform/sdk/types and getOfflineCoordinator from the Desktop offline cache/coordinator facade.
    - apps/desktop/src/shell/renderer/features/**/data/*.ts consume SDK offline classifiers and message projection directly while retaining Desktop cache/outbox reactions.
    - apps/desktop/src/shell/renderer/infra/local-agent-courier/** consumes SDK Realm/Runtime offline classifiers directly while retaining courier scheduling.
    - apps/desktop/src/shell/renderer/infra/offline/index.ts consumes OfflineCoordinator from @nimiplatform/kit/core/offline-coordinator and exports only Desktop cache/coordinator surfaces.
  tester_consumers:
    - apps/tester/src/shell/routes/settings.tsx consumes createOfflineNimiError, classifyOfflineError, and classifyOfflineReasonCode from @nimiplatform/sdk/types.
    - apps/tester/src/shell/auth/auth-gate.tsx consumes OfflineCoordinator from @nimiplatform/kit/core/offline-coordinator.
deleted_desktop_residue:
  - path: apps/desktop/src/shell/renderer/infra/offline/errors.ts
    rationale: Thin forwarding shell over SDK typed error helpers; Desktop consumers now import SDK types directly.
legal_desktop_residue:
  - path: apps/desktop/src/shell/renderer/infra/offline/cache-manager.ts
    rationale: Desktop owns product-local IndexedDB cache and outbox persistence for offline UI continuity; SDK/Kit own shared classification and coordination primitives.
  - path: apps/desktop/src/shell/renderer/infra/offline/index.ts
    rationale: Desktop keeps a bounded app facade for product-local cache/outbox persistence and coordinator access; it no longer exports SDK typed error helpers.
  - path: apps/desktop/src/shell/renderer/features/**/data/*.ts
    rationale: Desktop owns product data fallback/cache reaction wiring; Realm/Runtime service truth and offline error classification are SDK-owned.
  - path: apps/desktop/src/shell/renderer/infra/local-agent-courier/**
    rationale: Desktop owns local courier scheduling against local Runtime availability; offline classification and reconnect tier state are shared SDK/Kit-owned primitives.
tester_proof:
  - apps/tester/src/shell/routes/settings.tsx consumes SDK createOfflineNimiError and classifiers in a non-Desktop settings projection.
  - apps/tester/test/tester-contract.test.mjs proves Tester consumes the SDK offline typed error helper and rejects local offline reason-code sets.
  - apps/tester/src/shell/auth/auth-gate.tsx consumes Kit OfflineCoordinator in runtime-unavailable flow.
regression_guards:
  - apps/desktop/test/offline-typed-error-domain-boundary.test.ts blocks Desktop from retaining offline typed-error forwarding shells and requires Tester second-consumer proof.
  - apps/desktop/test/offline-error-classification.test.ts blocks Desktop local offline reason-code sets, message regex classifiers, and typed-error forwarding shells.
  - apps/desktop/test/offline-reconnect-strategy.test.ts and apps/desktop/test/offline-degradation-tier.test.ts cover Kit OfflineCoordinator behavior through Desktop bindings.
  - sdk/test/types.test.ts covers SDK offline typed error creation, generic error message projection, and offline classification.
  - kit/test/offline-coordinator.test.ts covers Kit coordinator tier/reconnect behavior.
prohibited_patterns:
  - target: apps/desktop/src/shell/renderer/infra/offline/errors.ts
    absent_file: true
  - target: apps/desktop/src/shell/renderer/infra/offline/index.ts
    absent:
      - createOfflineError
      - getErrorMessage
      - isRealmOfflineError
      - isRuntimeOfflineError
      - isNimiErrorLike
  - target: apps/tester/src/shell/routes/settings.tsx
    required:
      - createOfflineNimiError
      - classifyOfflineError
      - classifyOfflineReasonCode
    absent:
      - REALM_OFFLINE_REASON_CODES
      - RUNTIME_OFFLINE_REASON_CODES
verification:
  status: passed
  passed:
    - command: pnpm --filter @nimiplatform/sdk build
      evidence: SDK public types export compiles into package dist before app consumer tests.
    - command: node -e "const fs=require('fs'); const yaml=require('yaml'); yaml.parse(fs.readFileSync('config/desktop-ecosystem-boundary-domain-closure/offline-typed-error-projection.yaml','utf8'));"
      evidence: Offline typed error closure record parses as YAML.
    - command: pnpm --filter @nimiplatform/sdk exec tsx --test test/types.test.ts
      evidence: SDK typed offline error helper, generic message projection, and offline reason-code/classification tests pass.
    - command: pnpm --filter @nimiplatform/desktop exec tsx --test test/offline-typed-error-domain-boundary.test.ts test/offline-error-classification.test.ts test/offline-degradation-tier.test.ts test/offline-reconnect-strategy.test.ts test/offline-outbox-manager.test.ts test/data-sync-chat-flow.test.ts test/data-sync-world-flow-contract.test.ts test/local-agent-provision-courier.test.ts test/local-agent-termination-courier.test.ts
      evidence: Desktop offline typed-error hardcut, direct SDK classifier consumption, degradation tier, reconnect strategy, outbox/cache behavior, and courier offline behavior pass.
    - command: pnpm --filter @nimiplatform/tester exec node --test test/tester-contract.test.mjs
      evidence: Tester consumes SDK offline typed error helper and Kit OfflineCoordinator as second app proof.
    - command: pnpm --filter @nimiplatform/kit exec vitest run test/offline-coordinator.test.ts
      evidence: Kit OfflineCoordinator tier/reconnect focused tests pass.
    - command: pnpm --filter @nimiplatform/desktop typecheck
      evidence: Desktop compiles after removing the offline error forwarding shell.
    - command: pnpm --filter @nimiplatform/tester typecheck
      evidence: Tester compiles against the rebuilt SDK package.
    - command: pnpm check:no-legacy-imports
      evidence: Legacy import guard passes.
    - command: pnpm check:no-absolute-user-paths
      evidence: Absolute user-home path guard passes.
    - command: pnpm check:no-app-realm-rest-bypass
      evidence: App Realm REST bypass guard passes.
    - command: git diff --check
      evidence: Patch whitespace passes.
  command_notes:
    - command: pnpm --filter @nimiplatform/tester typecheck
      status: failed-while-sdk-build-was-running-then-passed
      evidence: A concurrent run could not resolve SDK while sdk/dist was being rebuilt; rerun after SDK build completed passed.
