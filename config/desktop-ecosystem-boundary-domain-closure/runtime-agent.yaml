legal_desktop_residue:
  - path: apps/desktop/src/shell/renderer/features/chat/chat-agent-runtime-agent.ts
    rationale: Desktop owns product turn submission orchestration and telemetry around the SDK Runtime Agent turn API; Runtime owns execution/session truth.
  - path: apps/desktop/src/shell/renderer/features/chat/chat-agent-runtime-agent-stream.ts
    rationale: Desktop owns a renderer AsyncIterable queue mechanic for UI streaming; event schema, terminal recovery, and projection summaries are SDK-owned.
  - path: apps/desktop/src/shell/renderer/features/chat/chat-agent-runtime-agent-stream-consumer.ts
    rationale: Desktop adapts SDK Runtime Agent consume events into product stream parts; SDK owns event matching, timeline summaries, and snapshot recovery semantics.
  - path: apps/desktop/src/shell/renderer/features/chat/chat-agent-runtime-agent-utils.ts
    rationale: Desktop owns renderer telemetry and UI debug metadata packaging; structured message action parsing remains SDK-owned.
  - path: apps/desktop/src/shell/renderer/features/chat/chat-agent-diagnostics*.*
    rationale: Desktop owns product diagnostics layout and user intent wiring; inspect projections and reusable inspect sidebar are SDK/Kit-owned.
  - path: apps/desktop/src/shell/renderer/infra/runtime-agent-*.ts
    rationale: Desktop owns thin adapters that inject getPlatformClient and authenticated subject context into SDK host surfaces.
  - path: apps/desktop/src/shell/renderer/infra/local-agent-courier/**
    rationale: Desktop may run a local courier because this app hosts the local Runtime loopback; durable intent/ack truth is Realm-owned and lifecycle delivery is SDK Runtime-owned.
  - path: apps/desktop/src/shell/renderer/features/chat/chat-agent-avatar-*.*
    rationale: Desktop owns product-specific avatar viewport/state and asset diagnostics; reusable runtime presentation, voice playback, and avatar primitives are Kit/SDK-owned.
tester_proof:
  - apps/tester/test/tester-runtime-agent-inspect-surface.test.mjs proves Tester consumes SDK Runtime Agent inspect host surface.
  - apps/tester/test/tester-runtime-agent-memory-surface.test.mjs proves Tester consumes SDK Runtime Agent memory host surface.
  - apps/tester/test/tester-runtime-agent-lifecycle-surface.test.mjs proves Tester consumes SDK Runtime Agent lifecycle host surface.
  - apps/tester/test/tester-runtime-agent-presentation-profile-surface.test.mjs proves Tester consumes SDK Runtime Agent presentation profile host surface.
  - apps/tester/test/tester-runtime-agent-group-message-candidate-surface.test.mjs proves Tester consumes SDK Runtime Agent group-message candidate host surface.
  - apps/tester/test/tester-runtime-agent-delegated-capability-surface.test.mjs proves Tester consumes SDK Runtime Agent delegated capability host surface.
  - apps/tester/test/tester-contract.test.mjs proves Tester settings renders the Runtime Agent projections in a product flow distinct from Desktop chat.
regression_guards:
  - apps/desktop/test/agent-hardcut-residue-contract.test.ts blocks retired routeSnapshot, local agent chat store, local message history replay, and legacy route fields.
  - apps/desktop/test/agent-chat-projection-boundary.test.ts blocks Desktop Agent Chat transcript/store authority and requires Runtime conversation summary projection.
  - apps/desktop/test/chat-agent-route-state-boundary.test.ts blocks route identity from becoming Desktop runtimeFields truth.
  - apps/desktop/test/runtime-agent-inspect.test.ts blocks Desktop inspect adapter from owning SDK Runtime Agent projection helpers.
  - apps/desktop/test/runtime-agent-memory.test.ts blocks Desktop memory adapter from owning Runtime memory sidecar/query/write policy.
  - apps/desktop/test/runtime-agent-presentation-profile.test.ts blocks Desktop presentation adapter from owning Runtime presentation profile request projection.
  - apps/desktop/test/chat-agent-voice-playback-boundary.test.ts blocks Desktop avatar voice playback estimator ownership and requires Kit avatar helpers.
  - apps/desktop/test/local-agent-provision-courier.test.ts and apps/desktop/test/local-agent-termination-courier.test.ts cover Desktop courier fail-closed delivery over SDK Runtime lifecycle surfaces.
  - sdk/test/runtime-agent-*.test.ts and sdk/test/runtime/runtime-agent-*.test.ts cover shared Runtime Agent SDK helpers.
  - apps/tester/test/tester-runtime-agent-*.test.mjs cover Tester as second consumer.
