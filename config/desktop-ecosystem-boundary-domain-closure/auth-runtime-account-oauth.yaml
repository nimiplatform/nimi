status: migrated
date: "2026-06-01"
domain: auth-runtime-account-oauth
migrated_in_this_commit: true
authority_posture:
  spec_status: alignment
  authority_owner:
    - .nimi/spec/runtime/kernel/tables/runtime-rpc-auth-posture/identity-access.yaml
    - .nimi/spec/platform/kernel/kit-contract.md
    - .nimi/spec/platform/kernel/nimi-app-scaffolding-contract.md
    - kit/auth/**
    - kit/core/src/oauth/**
    - kit/shell/tauri/src/oauth_commands.rs
    - sdk/src/nimi-app-runtime-platform-client.ts
    - sdk/src/runtime/runtime-account-caller.ts
  work_type: alignment
  parallel_truth: forbidden
scope:
  included:
    - Runtime account browser-login broker orchestration for desktop-browser auth shells.
    - OAuth authorize URL admission, loopback callback use, and refresh-token custody hardcut.
    - Desktop web-shell credential login metadata persistence and local-first-party RuntimeAccountService login split.
    - Tester single-login model proof for generated/scaffolded Nimi apps.
  excluded:
    - Realm AuthService credential endpoints used only by the web shell mode.
    - Desktop product auth UI composition, status feedback, drag behavior, query invalidation, and logout UX.
    - Desktop macOS product smoke projection probe, which directly exercises Runtime account APIs as test evidence rather than user login flow.
preflight_violation_inventory:
  platform_truth:
    - finding: Desktop local-first-party account truth must be RuntimeAccountService-owned; Desktop must not rebuild authorize URLs or own refresh-token custody.
      evidence_before: apps/desktop/src/shell/renderer/features/auth/desktop-auth-adapter.ts owned beginLogin/completeLogin broker sequencing.
      disposition: migrated_to_kit_auth
    - finding: OAuth loopback listener and token exchange are Kit shell/Tauri responsibilities.
      evidence_current: kit/shell/tauri/src/oauth_commands.rs and kit/core/src/oauth/** own command contracts and parsers.
      disposition: already_shared_owner_hardcut
  duplicate_implementation:
    - finding: Desktop and Tester both implemented the same Runtime account browser broker handshake.
      desktop_before: apps/desktop/src/shell/renderer/features/auth/desktop-auth-adapter.ts
      tester_before: apps/tester/src/shell/auth/runtime-account-auth.ts
      disposition: migrated_to kit/auth/src/logic/runtime-account-browser-broker.ts
  boundary_imports:
    - finding: Kit auth helper must not import SDK directly.
      disposition: createRuntimeAccountBrowserBroker uses structural client/caller input; apps inject SDK getPlatformClient and Runtime account caller.
  token_session_responsibility:
    - finding: Browser auth flow must pass only OAuth code to Runtime; refreshToken must be empty and never renderer-owned.
      disposition: "kit/auth/src/logic/runtime-account-browser-broker.ts hardcodes refreshToken: '' for completeLogin."
  runtime_realm_responsibility:
    - finding: Web shell may call Realm AuthService credential endpoints; local Desktop shell must fail closed to RuntimeAccountService.
      disposition: apps/desktop/src/shell/renderer/features/auth/desktop-auth-adapter.ts retains isWebShellMode guard and localFirstPartyBlocked.
audited_globs:
  - apps/desktop/src/shell/renderer/features/auth/**
  - apps/desktop/src/shell/renderer/infra/bootstrap/*auth*.ts
  - apps/desktop/src/shell/renderer/infra/bootstrap/desktop-macos-smoke-driver-deps.ts
  - apps/desktop/src/shell/renderer/app-shell/providers/auth-slice.ts
  - apps/desktop/test/*auth*.test.ts
  - apps/desktop/test/*oauth*.test.ts
  - kit/test/desktop-callback-no-exchange.test.ts
  - sdk/test/runtime/platform-runtime-auth-transparent-injection.test.ts
  - apps/desktop/test/auth-runtime-account-domain-boundary.test.ts
  - apps/tester/src/shell/auth/**
  - apps/tester/test/scaffold-boundary.test.mjs
  - apps/tester/test/tester-contract.test.mjs
  - kit/auth/src/**
  - kit/auth/test/**
  - kit/core/src/oauth/**
  - kit/shell/tauri/src/oauth_commands.rs
  - sdk/src/nimi-app-runtime-platform-client.ts
  - sdk/src/runtime/runtime-account-caller.ts
migrated:
  shared_owners:
    - kit/auth/src/logic/runtime-account-browser-broker.ts
    - kit/auth/src/logic/desktop-web-auth.ts
    - kit/core/src/oauth/**
    - kit/shell/tauri/src/oauth_commands.rs
    - sdk/src/runtime/runtime-account-caller.ts
    - sdk/src/nimi-app-runtime-platform-client.ts
  responsibilities:
    - Runtime account browser broker begin/complete sequencing with callback origin derivation and ttl calculation.
    - Runtime-supplied authorize URL validation and retired desktop relay URL rejection.
    - Runtime-owned refresh-token custody hardcut during browser login completion.
    - SDK-owned Runtime account caller construction for Desktop shell and generated/local-first-party apps.
  desktop_consumers:
    - apps/desktop/src/shell/renderer/features/auth/desktop-auth-adapter.ts consumes createRuntimeAccountBrowserBroker and injects Desktop shell caller/getPlatformClient.
    - apps/desktop/src/shell/renderer/features/auth/web-auth-menu.tsx passes the shared broker to DesktopShellAuthPage.
  tester_consumers:
    - apps/tester/src/shell/auth/runtime-account-auth.ts consumes createRuntimeAccountBrowserBroker and injects local-first-party app caller/getPlatformClient.
    - apps/tester/src/shell/auth/runtime-login-page.tsx passes the shared broker to DesktopShellAuthPage.
legal_desktop_residue:
  - path: apps/desktop/src/shell/renderer/features/auth/desktop-auth-adapter.ts
    rationale: Desktop owns product adapter composition, web-shell Realm credential calls, product query invalidation, and app-specific user projection; Kit owns shared broker choreography.
  - path: apps/desktop/src/shell/renderer/features/auth/login-page.tsx
    rationale: Desktop/Web own product route behavior and oauth_next UI continuation; Realm API owns OAuth transaction and Kit owns desktop-browser handshake.
  - path: apps/desktop/src/shell/renderer/features/auth/web-auth-menu.tsx
    rationale: Desktop owns auth page composition, drag behavior, and status feedback; Kit owns reusable auth page UI and runtime account broker.
  - path: apps/desktop/src/shell/renderer/features/auth/logout.ts
    rationale: Desktop owns local logout UX cleanup and stream/query reset; RuntimeAccountService owns server-side account session logout truth.
  - path: apps/desktop/src/shell/renderer/app-shell/providers/auth-slice.ts
    rationale: Desktop owns renderer auth projection for UI state; token/session truth remains Runtime/Realm-owned and persistence is constrained by Kit hardcuts.
  - path: apps/desktop/src/shell/renderer/infra/bootstrap/desktop-macos-smoke-driver-deps.ts
    rationale: Product smoke directly exercises Runtime account APIs to verify projection state; it is test/evidence scaffold, not user auth broker or platform truth.
tester_proof:
  - apps/tester/src/shell/auth/runtime-account-auth.ts consumes createRuntimeAccountBrowserBroker from @nimiplatform/kit/auth.
  - apps/tester/test/scaffold-boundary.test.mjs proves Tester uses the Kit broker and rejects local beginLogin/completeLogin duplication.
  - apps/tester/test/tester-contract.test.mjs proves Tester auth/runtime bootstrap consumes Kit shell bridge primitives and the Kit Runtime account broker.
regression_guards:
  - apps/desktop/test/auth-runtime-account-domain-boundary.test.ts blocks Desktop/Tester local Runtime account browser broker duplication and requires Kit ownership.
  - kit/auth/test/runtime-account-browser-broker.test.ts covers shared broker begin/complete behavior, authorize URL validation, and refreshToken empty hardcut.
  - apps/desktop/test/auth-security-hardcut.test.ts blocks retired desktop callback/session persistence flows.
  - apps/desktop/test/auth-refresh-token-retention.test.ts blocks web auth raw token persistence regression.
  - apps/tester/test/scaffold-boundary.test.mjs blocks Tester dev-standalone bypass and Desktop private auth imports.
prohibited_patterns:
  - target: apps/desktop/src/shell/renderer/features/auth apps/tester/src/shell/auth
    absent_or_allowlisted:
      - pattern: runtime.account.beginLogin(
        allowlist: none
      - pattern: runtime.account.completeLogin(
        allowlist: none
      - pattern: validateRuntimeOAuthAuthorizationUrl
        allowlist: kit/auth only
      - pattern: desktop-runtime-oauth-url|#/login|desktop_callback
        allowlist: Kit comments/tests that document retired relay rejection
  - target: kit/auth/src/logic/runtime-account-browser-broker.ts
    absent:
      - "from '@nimiplatform/sdk"
      - "import('@nimiplatform/sdk"
  - target: apps/desktop/src
    absent_or_allowlisted:
      - pattern: runtime.account.beginLogin(
        allowlist: apps/desktop/src/shell/renderer/infra/bootstrap/desktop-macos-smoke-driver-deps.ts
      - pattern: runtime.account.completeLogin(
        allowlist: apps/desktop/src/shell/renderer/infra/bootstrap/desktop-macos-smoke-driver-deps.ts
verification:
  status: passed
  passed:
    - command: >-
        node -e "const fs=require('fs'); const yaml=require('yaml'); yaml.parse(fs.readFileSync('config/desktop-ecosystem-boundary-domain-closure/auth-runtime-account-oauth.yaml','utf8'));"
      evidence: Auth/OAuth Runtime account closure record parses as YAML.
    - command: pnpm --filter @nimiplatform/kit build
      evidence: Kit auth public export compiles into package dist before app consumer tests.
    - command: >-
        pnpm --filter @nimiplatform/kit exec vitest run --environment jsdom auth/test/runtime-account-browser-broker.test.ts auth/test/desktop-shell-auth-page.test.tsx auth/test/auth-view-email-login.test.tsx
      evidence: Kit shared Runtime account broker, DesktopShellAuthPage, and auth email UI focused tests pass.
    - command: >-
        pnpm --filter @nimiplatform/desktop exec tsx --test test/auth-runtime-account-domain-boundary.test.ts test/auth-security-hardcut.test.ts test/auth-refresh-token-retention.test.ts test/oauth-next-continuation.test.ts
      evidence: Desktop Auth/OAuth domain hardcut, token persistence hardcuts, and oauth_next continuation pass.
    - command: pnpm --filter @nimiplatform/tester exec node --test test/scaffold-boundary.test.mjs test/tester-contract.test.mjs
      evidence: Tester second-consumer scaffold and app contract tests pass with shared Kit Runtime account broker consumption.
    - command: pnpm --filter @nimiplatform/sdk exec tsx --test test/runtime-account-caller.test.ts test/nimi-app-runtime-platform-client.test.ts test/runtime/platform-runtime-auth-transparent-injection.test.ts
      evidence: SDK Runtime account caller helpers, Nimi App runtime platform client, and transparent runtime auth injection pass.
    - command: pnpm check:no-legacy-imports
      evidence: Legacy import guard passes.
    - command: pnpm check:no-absolute-user-paths
      evidence: Absolute user-home path guard passes.
    - command: pnpm check:no-app-realm-rest-bypass
      evidence: App Realm REST bypass guard passes.
    - command: pnpm check:nimi-kit
      evidence: Kit registry/package/dist/canonical capability checks pass after the auth export change.
    - command: git diff --check
      evidence: Patch whitespace passes.
