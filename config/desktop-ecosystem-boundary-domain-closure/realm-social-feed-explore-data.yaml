status: migrated
date: "2026-06-01"
domain: realm-social-feed-explore-data
migrated_in_this_commit: true
authority_posture:
  spec_status: alignment
  authority_owner:
    - .nimi/spec/realm/**
    - .nimi/spec/sdks/kernel/nimi-app-client-contract.md
    - sdk/src/realm/extensions/social-feed.ts
    - sdk/src/realm/extensions/social-snapshot.ts
  work_type: alignment
  parallel_truth: forbidden
scope:
  included:
    - Realm social profile, friend, block/unblock, post feed, post mutation, report, explore agent search, and explore feed service helper ownership.
    - Offline social mutation execution method selection over a caller-provided Realm transport.
    - Desktop social/feed/explore data wrappers consuming SDK Realm helpers.
    - Tester consumption of the same SDK Realm social/feed/explore helpers as second-app proof.
  excluded:
    - Desktop blocked-content filtering, offline cache persistence, local social outbox storage, and local-agent courier side effects.
    - Source detail and RealmPersona/WorldCharacterCore authoring data, which remain separate audit domains.
preflight_violation_inventory:
  platform_truth:
    - finding: Desktop social/feed/explore data files selected Realm service methods directly for UserService, MeService, PostsService, SearchService, ExploreService, and GovernanceService.
      evidence_before:
        - apps/desktop/src/shell/renderer/features/social/data/profile-data.ts called getMe, updateMe, getUser, addFriend, removeFriend, blockUser, and unblockUser.
        - apps/desktop/src/shell/renderer/features/social/data/post-feed-data.ts called getHomeFeed, listLikedPosts, getPost, createPost, deletePost, updatePost, likePost, unlikePost, and reportControllerCreateReport.
        - apps/desktop/src/shell/renderer/features/explore/data/realm-explore-data.ts called searchIndexedUsers and getExploreFeed.
        - apps/desktop/src/shell/renderer/features/social/data/offline-social-outbox.ts replayed Realm mutations through direct app-owned service calls.
      disposition: SDK Realm social-feed extension now owns method selection and request/error projection; Desktop wrappers call SDK helpers.
  duplicate_implementation:
    - finding: Desktop home feed scope/cursor forwarding behavior was tested and effectively owned in Desktop.
      disposition: SDK owner test now covers scope/cursor forwarding and fail-closed action context; Desktop keeps only a boundary assertion that it delegates to SDK.
  boundary_imports:
    - finding: Desktop imported only SDK Realm generated types while retaining direct service call implementation locally.
      disposition: Desktop imports SDK Realm helper functions from @nimiplatform/sdk/realm and retains only app-owned orchestration.
  token_session_runtime_realm_responsibility:
    - finding: Social graph, feed, report, explore, and profile service contracts are Realm responsibilities, not Desktop app truth.
      disposition: Realm canonical service method use is exposed through SDK helper functions; Desktop session transport remains in callRealmApi.
audited_globs:
  - apps/desktop/src/shell/renderer/features/social/data/profile-data.ts
  - apps/desktop/src/shell/renderer/features/social/data/post-feed-data.ts
  - apps/desktop/src/shell/renderer/features/social/data/offline-social-outbox.ts
  - apps/desktop/src/shell/renderer/features/social/data/realm-social-data.ts
  - apps/desktop/src/shell/renderer/features/explore/data/realm-explore-data.ts
  - apps/desktop/test/home-feed-scope-segmentation.test.ts
  - apps/desktop/test/data-sync-post-visibility.test.ts
  - apps/desktop/test/data-sync-social-flow.test.ts
  - apps/desktop/test/t5-explore-world-realmagent-acceptance.test.ts
  - apps/tester/src/tester/tester-realm-social-feed-projection.ts
  - apps/tester/src/shell/routes/settings.tsx
  - apps/tester/test/tester-contract.test.mjs
  - sdk/src/realm/extensions/social-feed.ts
  - sdk/src/realm/index.ts
  - sdk/test/realm-social-feed-extension.test.ts
migrated:
  shared_owners:
    - sdk/src/realm/extensions/social-feed.ts
  responsibilities:
    - SDK owns Realm social/feed/explore service method selection and request argument forwarding.
    - SDK owns post feed scope/cursor forwarding, post mutation helpers, relationship/block helpers, report helper, explore search/feed helpers, and social mutation replay helper.
    - Desktop owns blocked-user feed filtering, offline fallback/cache persistence, local outbox storage, and local-agent courier side effects.
  desktop_consumers:
    - apps/desktop/src/shell/renderer/features/social/data/profile-data.ts
    - apps/desktop/src/shell/renderer/features/social/data/post-feed-data.ts
    - apps/desktop/src/shell/renderer/features/social/data/offline-social-outbox.ts
    - apps/desktop/src/shell/renderer/features/explore/data/realm-explore-data.ts
  tester_consumers:
    - apps/tester/src/tester/tester-realm-social-feed-projection.ts
    - apps/tester/src/shell/routes/settings.tsx
legal_desktop_residue:
  - path: apps/desktop/src/shell/renderer/features/social/data/profile-data.ts
    rationale: App-owned orchestration for offline cache fallback, contact reload, blocked-user event dispatch, and local-agent courier side effects; Realm method truth comes from SDK helpers.
  - path: apps/desktop/src/shell/renderer/features/social/data/post-feed-data.ts
    rationale: App-owned blocked-content filtering and offline queue decision; Realm post/feed service behavior comes from SDK helpers.
  - path: apps/desktop/src/shell/renderer/features/social/data/offline-social-outbox.ts
    rationale: App-owned durable offline queue storage and retry bookkeeping; replay method selection is delegated to SDK executeRealmSocialMutation.
  - path: apps/desktop/src/shell/renderer/features/explore/data/realm-explore-data.ts
    rationale: App-owned limit clamping and product data facade; Realm explore/search behavior comes from SDK helpers.
tester_proof:
  - apps/tester/src/tester/tester-realm-social-feed-projection.ts consumes loadRealmPostFeed, loadRealmExploreFeedItems, and executeRealmSocialMutation from @nimiplatform/sdk/realm.
  - apps/tester/src/shell/routes/settings.tsx renders the SDK Realm social/feed projection in Tester settings.
  - apps/tester/test/tester-contract.test.mjs asserts Tester consumes the SDK Realm social/feed helpers.
regression_guards:
  - sdk/test/realm-social-feed-extension.test.ts covers SDK owner behavior for post feed scope/cursor forwarding, fail-closed action context, social mutation replay, and explore forwarding.
  - apps/desktop/test/home-feed-scope-segmentation.test.ts asserts Desktop delegates post feed Realm service behavior to SDK and keeps Home UI scope wiring.
  - apps/desktop/test/data-sync-post-visibility.test.ts keeps Desktop blocked-content filtering behavior in the app.
  - apps/desktop/test/data-sync-social-flow.test.ts keeps Desktop social flow fail-closed/courier/cache behavior while requiring SDK social snapshot ownership.
  - apps/tester/test/tester-contract.test.mjs keeps Tester second-consumer proof.
prohibited_patterns:
  - target: apps/desktop/src/shell/renderer/features/social/data apps/desktop/src/shell/renderer/features/explore/data
    absent:
      - "realm.services.UserService"
      - "realm.services.MeService"
      - "realm.services.PostsService"
      - "realm.services.SearchService"
      - "realm.services.ExploreService"
      - "realm.services.GovernanceService"
  - target: apps/desktop/src/shell/renderer/features/social/data/post-feed-data.ts
    required:
      - loadRealmPostFeed
      - createRealmPost
      - createRealmReport
      - "@nimiplatform/sdk/realm"
  - target: apps/desktop/src/shell/renderer/features/explore/data/realm-explore-data.ts
    required:
      - loadRealmExploreAgents
      - loadRealmExploreFeedItems
  - target: apps/desktop/src/shell/renderer/features/social/data/offline-social-outbox.ts
    required:
      - executeRealmSocialMutation
verification:
  status: passed
  passed:
    - command: >-
        pnpm --filter @nimiplatform/sdk exec tsx --test test/realm-social-feed-extension.test.ts test/realm-feed-extension.test.ts test/realm/realm-data-sync-extensions.test.ts
      evidence: SDK owner and adjacent Realm extension tests pass.
    - command: >-
        pnpm --filter @nimiplatform/desktop exec tsx --test test/home-feed-scope-segmentation.test.ts test/data-sync-post-visibility.test.ts test/data-sync-social-flow.test.ts test/t5-explore-world-realmagent-acceptance.test.ts
      evidence: Desktop boundary, blocked filtering, social flow, and Explore acceptance tests pass.
    - command: pnpm --filter @nimiplatform/sdk build
      evidence: SDK Realm public exports compile into dist.
    - command: pnpm --filter @nimiplatform/desktop typecheck
      evidence: Desktop compiles against SDK Realm social/feed helpers.
    - command: pnpm --filter @nimiplatform/tester exec node --test test/tester-contract.test.mjs
      evidence: Tester second-consumer contract passes after SDK build.
    - command: pnpm --filter @nimiplatform/tester typecheck
      evidence: Tester compiles against SDK Realm social/feed helpers.
    - command: >-
        rg -n "realm\.services\.(UserService|PostsService|ExploreService|SearchService|GovernanceService|MeService)" apps/desktop/src/shell/renderer/features/social/data apps/desktop/src/shell/renderer/features/explore/data
      evidence: No audited Desktop social/feed/explore direct Realm service method selection remains.
    - command: pnpm check:no-app-realm-rest-bypass
      evidence: App Realm REST bypass guard passes.
    - command: pnpm check:no-legacy-imports
      evidence: Legacy import guard passes.
    - command: pnpm check:no-absolute-user-paths
      evidence: Absolute user-home path guard passes.
    - command: git diff --check
      evidence: Patch whitespace passes.
  command_notes:
    - command: pnpm --filter @nimiplatform/tester exec node --test test/tester-contract.test.mjs
      status: failed-command-ordering
      evidence: Failed only when started in parallel with pnpm --filter @nimiplatform/sdk build while SDK dist was being rebuilt; rerun after SDK build passed.
