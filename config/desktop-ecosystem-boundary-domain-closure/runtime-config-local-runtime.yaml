legal_desktop_residue:
  - path: apps/desktop/src/shell/renderer/features/runtime-config/**
    rationale: Desktop owns product-specific runtime-config screens, tabs, copy, selection UI, transient import form state, and local model center presentation while delegating platform truth to SDK/Runtime/Kit surfaces.
  - path: apps/desktop/src/shell/renderer/infra/bootstrap/runtime-local-runtime-client.ts
    rationale: Desktop owns only bootstrap binding of the SDK localRuntime client provider to the current PlatformClient and warning telemetry sink; SDK owns all localRuntime API/projection behavior.
  - path: apps/desktop/src/shell/renderer/bridge/runtime-bridge/local-runtime-os-helpers.ts
    rationale: Desktop owns admitted OS picker/reveal wrappers for runtime_local_pick_* and runtime_local_assets_reveal_* Tauri commands; these helpers do not implement Runtime asset lifecycle, parsers, route truth, or storage truth.
  - path: apps/desktop/src-tauri/src/local_runtime/commands/mod.rs
    rationale: Desktop Tauri keeps only admitted OS picker/reveal helpers. Runtime asset lifecycle, health, transfer, dependency jobs, route selection, and audit truth are not implemented in Desktop Tauri.
  - path: apps/desktop/src/shell/renderer/features/runtime-config/runtime-config-local-model-center-progress-cache.ts
    rationale: Dismissed transfer-session IDs are local UI persistence only; transfer state remains Runtime-owned.
  - path: apps/desktop/src/shell/renderer/features/runtime-config/runtime-config-panel-controller-install-actions-models.ts
    rationale: Retained lifecycle calls are non-product maintenance wiring through SDK localRuntime with explicit caller metadata, not Desktop-owned lifecycle truth.
tester_proof:
  - apps/tester/test/tester-contract.test.mjs proves Tester consumes SDK Runtime model catalog, connector inventory, local runtime facade, dependency state/parser projections, recommendation feed projections, route provider health, reason-code projections, and Kit model picker/config surfaces.
  - apps/tester/test/tester-runtime-route-capability-runtime.test.mjs proves Tester consumes SDK runtime route capability host runtime as a second app.
  - apps/tester/test/tester-runtime-connector-projection.test.mjs proves Tester consumes SDK runtime config connector projection as a second app.
regression_guards:
  - apps/desktop/test/local-ai-model-toggle-contract.test.ts blocks Desktop routeSnapshot/local provider fallback, local model lifecycle Tauri ownership, removed route resolver files, and non-helper Tauri local_runtime files.
  - apps/desktop/test/local-ai-runtime-dependency-projection.test.ts blocks Desktop file fallback and duplicated local environment dependency state machines.
  - apps/desktop/test/local-runtime-transfer-plane-contract.test.ts blocks retired local-ai bridge progress truth and requires SDK runtime transfer APIs.
  - apps/desktop/test/retired-runtime-ipc-hardcut.test.ts requires the Desktop local-runtime SDK facade files to stay physically absent.
  - apps/desktop/test/runtime-config-provider-authority-hardcut.test.ts blocks provider inference from endpoint host patterns.
  - scripts/check-desktop-local-runtime-helper-boundary.mjs limits Desktop runtime_local_* commands to picker/reveal helpers.
  - scripts/check-no-local-ai-private-calls.mjs blocks renderer private local_ai_* Tauri command calls.
  - package script check:no-local-ai-tauri-commands blocks Desktop Tauri local_ai_* commands.
  - scripts/check-desktop-no-legacy-runtime-config-path.mjs blocks retired ~/.nimi/config.json Desktop runtime config paths.
