status: migrated
date: "2026-06-01"
domain: runtime-llm-route-host-access
migrated_in_this_commit: true
authority_posture:
  spec_status: alignment
  authority_owner:
    - .nimi/spec/sdks/kernel/runtime-contract.md
    - .nimi/spec/sdks/kernel/surface-contract.md
    - sdk/src/runtime/runtime-route-host-access.ts
    - sdk/src/runtime/runtime-route-host-facade.ts
    - sdk/src/runtime/runtime-route-provider-health.ts
    - sdk/src/runtime/runtime-call-options.ts
    - sdk/src/runtime/reason-code-messages.ts
  work_type: alignment
  parallel_truth: forbidden
scope:
  included:
    - Runtime route request metadata, target call options, stream call options, provider health, local warm orchestration, and text generation timeout constants.
    - Runtime reason-code extraction/local-AI reason projection bridge removal.
    - Desktop chat, voice transcription, RealmAgent draft generation, and conversation route bootstrap consumption of the SDK host route access surface.
    - Tester consumption of the same SDK host route access surface as second-app proof.
  excluded:
    - Product-specific chat turn orchestration, prompt construction, draft parsing, and UI state.
    - Desktop telemetry emission wiring around local warm metrics.
    - Runtime daemon execution semantics and model health implementation.
preflight_violation_inventory:
  platform_truth:
    - finding: Desktop owned a runtime/llm-adapter execution facade for request metadata, call options, local warm, provider health, reason-code parsing, and timeout constants.
      evidence_before:
        - apps/desktop/src/runtime/llm-adapter/execution/runtime-ai-bridge.ts exported buildRuntimeRequestMetadata, buildRuntimeCallOptions, buildRuntimeStreamOptions, ensureRuntimeLocalModelWarm, and getRuntimeClient.
        - apps/desktop/src/runtime/llm-adapter/execution/health-check.ts wrapped Runtime model/connector health.
        - apps/desktop/src/runtime/llm-adapter/execution/runtime-ai-bridge-output.ts re-exported SDK reason-code projection under a Desktop runtime facade.
        - apps/desktop/src/runtime/llm-adapter/execution/types.ts owned TEXT_GENERATE_TIMEOUT_MS.
      disposition: SDK Runtime host route access surface now owns these app-facing helpers; Desktop facade files are deleted.
  duplicate_implementation:
    - finding: Desktop duplicated SDK Runtime call option and reason-code helper composition.
      disposition: Desktop imports createHostRuntimeRouteAccessSurface and RUNTIME_TEXT_GENERATE_TIMEOUT_MS from @nimiplatform/sdk/runtime.
  boundary_imports:
    - finding: Desktop production code imported @runtime/llm-adapter from chat, voice transcription, world draft generation, and runtime bootstrap paths.
      disposition: no @runtime/llm-adapter production imports remain; Desktop imports only app shell infra wiring or SDK Runtime directly.
  token_session_runtime_realm_responsibility:
    - finding: The facade did not own Realm/session truth, but it did own Runtime execution metadata and local warm authority in an app-local runtime folder.
      disposition: Runtime execution metadata/local warm/provider health are SDK projections over Runtime client methods; Desktop only injects getPlatformClient and telemetry.
audited_globs:
  - apps/desktop/src/runtime/llm-adapter/execution/**
  - apps/desktop/src/shell/renderer/infra/runtime-route-host-access.ts
  - apps/desktop/src/shell/renderer/infra/bootstrap/runtime-bootstrap-conversation-route-runtime.ts
  - apps/desktop/src/shell/renderer/features/chat/chat-nimi-runtime.ts
  - apps/desktop/src/shell/renderer/features/chat/chat-agent-voice-transcribe-runtime.ts
  - apps/desktop/src/shell/renderer/features/chat/chat-agent-runtime-types.ts
  - apps/desktop/src/shell/renderer/features/world/create-agent/realm-agent-ai-generation.ts
  - apps/desktop/test/llm-health-check.test.ts
  - apps/desktop/test/runtime-ai-bridge-metadata.test.ts
  - apps/desktop/test/runtime-ai-bridge-reason-map.test.ts
  - apps/desktop/test/d-strm-006-timeout-awareness.test.ts
  - apps/desktop/test/conversation-route-runtime-bootstrap.test.ts
  - apps/desktop/test/chat-agent-voice-transcribe-runtime.test.ts
  - apps/desktop/test/chat-agent-local-mode-turn-routing.test.ts
  - apps/tester/src/tester/tester-runtime-route-host-access.ts
  - apps/tester/src/shell/routes/settings.tsx
  - apps/tester/test/tester-contract.test.mjs
  - sdk/src/runtime/runtime-route-host-access.ts
  - sdk/src/runtime/{index,browser}.ts
  - sdk/test/runtime/runtime-route-host-access.test.ts
migrated:
  shared_owners:
    - sdk/src/runtime/runtime-route-host-access.ts
    - sdk/src/runtime/runtime-route-provider-health.ts
    - sdk/src/runtime/runtime-call-options.ts
    - sdk/src/runtime/reason-code-messages.ts
  responsibilities:
    - SDK owns host Runtime route access composition, provider health delegation, local warm orchestration, request metadata, call/stream options, and text generation timeout default.
    - SDK owns Runtime reason-code extraction and local-AI reason projection.
    - Desktop owns only configured shell infra injection of PlatformClient runtime and telemetry metric emission.
  deleted_desktop_aliases:
    - apps/desktop/src/runtime/llm-adapter/execution/health-check.ts
    - apps/desktop/src/runtime/llm-adapter/execution/inference-audit.ts
    - apps/desktop/src/runtime/llm-adapter/execution/runtime-ai-bridge-output.ts
    - apps/desktop/src/runtime/llm-adapter/execution/runtime-ai-bridge.ts
    - apps/desktop/src/runtime/llm-adapter/execution/types.ts
  desktop_consumers:
    - apps/desktop/src/shell/renderer/infra/runtime-route-host-access.ts
    - apps/desktop/src/shell/renderer/infra/bootstrap/runtime-bootstrap-conversation-route-runtime.ts
    - apps/desktop/src/shell/renderer/features/chat/chat-nimi-runtime.ts
    - apps/desktop/src/shell/renderer/features/chat/chat-agent-voice-transcribe-runtime.ts
    - apps/desktop/src/shell/renderer/features/world/create-agent/realm-agent-ai-generation.ts
  tester_consumers:
    - apps/tester/src/tester/tester-runtime-route-host-access.ts
    - apps/tester/src/shell/routes/settings.tsx
legal_desktop_residue:
  - path: apps/desktop/src/shell/renderer/infra/runtime-route-host-access.ts
    rationale: App shell wiring only; it injects getPlatformClient().runtime, app identity, caller/surface IDs, and Kit telemetry for warm metrics while SDK owns route access behavior.
  - path: apps/desktop/src/shell/renderer/features/chat/chat-nimi-runtime.ts
    rationale: Product chat orchestration and text message shaping; Runtime route metadata/local warm/call options come from SDK host access.
  - path: apps/desktop/src/shell/renderer/features/chat/chat-agent-voice-transcribe-runtime.ts
    rationale: Product voice transcription input validation and transcript handling; request metadata and Runtime client access come through SDK-configured shell infra.
  - path: apps/desktop/src/shell/renderer/features/world/create-agent/realm-agent-ai-generation.ts
    rationale: Product-specific RealmAgent draft prompt/parsing/review flow; Runtime metadata/client access comes through SDK-configured shell infra.
tester_proof:
  - apps/tester/src/tester/tester-runtime-route-host-access.ts creates a Tester route host access surface through createHostRuntimeRouteAccessSurface.
  - apps/tester/src/shell/routes/settings.tsx renders Runtime route host access projection in Tester settings.
  - apps/tester/test/tester-contract.test.mjs asserts Tester consumes the SDK Runtime route host access surface.
regression_guards:
  - sdk/test/runtime/runtime-route-host-access.test.ts covers SDK host access metadata, call/stream options, provider health delegation, and local warm behavior.
  - apps/desktop/test/llm-health-check.test.ts requires deleted Desktop health-check facade and SDK owner surface consumption.
  - apps/desktop/test/runtime-ai-bridge-metadata.test.ts requires deleted Desktop runtime-ai-bridge facade and SDK metadata/call-option ownership.
  - apps/desktop/test/runtime-ai-bridge-reason-map.test.ts requires deleted Desktop reason-code wrapper and SDK reason-code ownership.
  - apps/desktop/test/d-strm-006-timeout-awareness.test.ts requires text generate timeout default from SDK Runtime.
  - apps/desktop/test/conversation-route-runtime-bootstrap.test.ts and apps/desktop/test/chat-agent-voice-transcribe-runtime.test.ts cover Desktop compatibility through the new shell infra wiring.
  - apps/tester/test/tester-contract.test.mjs keeps Tester second-consumer proof.
prohibited_patterns:
  - target: apps/desktop/src/runtime/llm-adapter/execution/**
    absent_files:
      - health-check.ts
      - inference-audit.ts
      - runtime-ai-bridge-output.ts
      - runtime-ai-bridge.ts
      - types.ts
  - target: apps/desktop/src apps/desktop/test
    absent:
      - "@runtime/llm-adapter"
      - "from '../src/runtime/llm-adapter"
      - "from '../../src/runtime/llm-adapter"
  - target: apps/desktop/src/shell/renderer/infra/runtime-route-host-access.ts
    required:
      - createHostRuntimeRouteAccessSurface
      - getPlatformClient().runtime
      - emitRuntimeLog
verification:
  status: passed
  passed:
    - command: >-
        pnpm --filter @nimiplatform/sdk exec tsx --test test/runtime/runtime-route-host-access.test.ts test/runtime/runtime-route-provider-health.test.ts test/runtime/runtime-call-options.test.ts test/runtime/reason-code-messages.test.ts
      evidence: SDK owner tests pass for route host access, provider health, call options, and reason-code projection.
    - command: >-
        pnpm --filter @nimiplatform/desktop exec tsx --test test/llm-health-check.test.ts test/runtime-ai-bridge-metadata.test.ts test/runtime-ai-bridge-reason-map.test.ts test/d-strm-006-timeout-awareness.test.ts test/conversation-route-runtime-bootstrap.test.ts test/chat-agent-voice-transcribe-runtime.test.ts test/chat-agent-local-mode-turn-routing.test.ts
      evidence: Desktop hardcut/compat tests pass for deleted facades, SDK timeout, bootstrap route runtime, voice transcription, and local warm routing.
    - command: pnpm --filter @nimiplatform/tester exec node --test test/tester-contract.test.mjs
      evidence: Tester second-consumer contract passes and requires SDK Runtime route host access consumption.
    - command: pnpm --filter @nimiplatform/sdk build
      evidence: SDK Runtime host access surface compiles into dist.
    - command: pnpm --filter @nimiplatform/desktop typecheck
      evidence: Desktop compiles after deleting @runtime/llm-adapter execution files.
    - command: pnpm --filter @nimiplatform/tester typecheck
      evidence: Tester compiles against SDK Runtime route host access surface.
    - command: >-
        rg -n "@runtime/llm-adapter|from ['\"][^'\"]*runtime/llm-adapter" apps/desktop/src apps/desktop/test --glob '!**/dist/**'
      evidence: No prohibited Desktop imports remain; command returned no matches.
    - command: pnpm check:no-legacy-imports
      evidence: Legacy import guard passes.
    - command: pnpm check:no-absolute-user-paths
      evidence: Absolute user-home path guard passes.
    - command: pnpm check:no-app-realm-rest-bypass
      evidence: App Realm REST bypass guard passes.
    - command: git diff --check
      evidence: Patch whitespace passes.
