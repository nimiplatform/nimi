status: migrated
date: "2026-06-01"
domain: shell-bridge-error-normalization
migrated_in_this_commit: true
authority_posture:
  spec_status: alignment
  authority_owner:
    - kit/shell/renderer/src/bridge/nimi-error.ts
    - apps/desktop/src/shell/renderer/bridge/runtime-bridge/invoke.ts
    - apps/tester/src/tester/tester-tauri.ts
  work_type: alignment
  parallel_truth: forbidden
scope:
  included:
    - Renderer shell bridge structured-error parsing for reasonCode/actionHint/traceId/retryable/details payloads.
    - Renderer shell bridge user-message projection over SDK Runtime reason-code messages and bridge reason aliases.
    - Desktop bridge error compatibility wrapper with app i18n translation and telemetry unchanged.
    - Tester Tauri command wrapper as second app consumer of Kit bridge Nimi error normalization.
  excluded:
    - Runtime or Realm token/session custody.
    - Desktop bridge command telemetry, payload summarization, and Tauri OS command ownership.
    - App-specific i18n dictionaries and display copy translation.
preflight_violation_inventory:
  platform_truth:
    - finding: Desktop owned reusable renderer bridge structured-error parsing and reason-code user-message projection in apps/desktop/src/shell/renderer/bridge/runtime-bridge/invoke.ts.
      evidence_before:
        - Desktop implemented BRIDGE_ERROR_CODE_MAP, BRIDGE_ERROR_MAP, parseBridgeJsonPayload, extractBridgeErrorCode, toBridgeUserMessage, and toBridgeNimiError locally.
        - The logic normalized SDK Runtime reason-code projections and generic shell bridge reason aliases, which other Nimi apps need when consuming Tauri bridge commands.
      disposition: migrated_to_kit_shell_renderer_bridge_nimi_error
  duplicate_implementation:
    - finding: Tester consumed Kit invoke directly but had no shared structured-error normalization for app command failures.
      evidence_before: apps/tester/src/tester/tester-tauri.ts returned invoke(command, args) without converting bridge errors into NimiError envelopes.
      disposition: Tester now wraps command failures with Kit toShellBridgeNimiError.
  boundary_imports:
    - finding: Desktop bridge invoke imported SDK Runtime error helpers directly and combined SDK reason handling with app-specific bridge wiring.
      disposition: Kit shell bridge consumes SDK through kit/core/sdk-contract; Desktop imports only the Kit bridge projection and remains responsible for app translation/telemetry.
  token_session_runtime_realm_responsibility:
    - finding: The migrated normalizer only projects existing error metadata; it does not create, refresh, persist, authorize, or route Runtime/Realm sessions.
      disposition: Kit owns renderer bridge normalization; Runtime/Realm truth and token custody remain out of scope.
audited_globs:
  - apps/desktop/src/shell/renderer/bridge/runtime-bridge/invoke.ts
  - apps/desktop/src/shell/renderer/bridge/runtime-bridge/types.ts
  - apps/desktop/test/runtime-bridge-invoke.test.ts
  - apps/desktop/test/error-boundary-normalization.test.ts
  - apps/desktop/test/shell-bridge-error-normalization-domain-boundary.test.ts
  - apps/tester/src/tester/tester-tauri.ts
  - apps/tester/test/tester-contract.test.mjs
  - kit/core/src/sdk-contract.ts
  - kit/shell/renderer/src/bridge/**
  - kit/test/shell-bridge-nimi-error.test.ts
migrated:
  shared_owners:
    - kit/shell/renderer/src/bridge/nimi-error.ts
  responsibilities:
    - Kit shell renderer owns ShellBridgeStructuredError parsing, shell bridge reason-code extraction, user-message projection, and toShellBridgeNimiError.
    - Kit core SDK contract exposes the SDK error/reason helpers required by the shell bridge without direct feature-level SDK imports.
    - Desktop keeps only an app i18n wrapper and bridge invoke telemetry around Kit normalization.
    - Tester consumes toShellBridgeNimiError for Tauri command failure normalization.
  desktop_consumers:
    - apps/desktop/src/shell/renderer/bridge/runtime-bridge/invoke.ts imports getShellBridgeUserMessageProjection and toShellBridgeNimiError from @nimiplatform/kit/shell/renderer/bridge.
  tester_consumers:
    - apps/tester/src/tester/tester-tauri.ts imports toShellBridgeNimiError from @nimiplatform/kit/shell/renderer/bridge and throws normalized failures.
legal_desktop_residue:
  - path: apps/desktop/src/shell/renderer/bridge/runtime-bridge/invoke.ts
    rationale: Desktop owns concrete Tauri command invocation, telemetry emission, payload summarization, and app i18n translation. Shared structured-error normalization is Kit-owned.
  - path: apps/desktop/src/shell/renderer/bridge/runtime-bridge/types.ts
    rationale: Existing Desktop bridge type barrel remains for Desktop command projections; structured bridge error parsing no longer depends on its RuntimeBridgeStructuredError type.
tester_proof:
  - apps/tester/src/tester/tester-tauri.ts consumes toShellBridgeNimiError from Kit.
  - apps/tester/test/tester-contract.test.mjs verifies Tester Tauri helper consumes the Kit shell bridge and shared error normalizer while rejecting direct Tauri private imports.
regression_guards:
  - apps/desktop/test/shell-bridge-error-normalization-domain-boundary.test.ts blocks Desktop app-local bridge error maps/parsers and requires Desktop plus Tester Kit consumption.
  - kit/test/shell-bridge-nimi-error.test.ts verifies Kit structured payload parsing, SDK Runtime reason-code projection, bridge reason-code projection, and app translation injection.
  - apps/desktop/test/runtime-bridge-invoke.test.ts keeps Desktop compatibility behavior for toBridgeNimiError through the Kit normalizer.
  - apps/desktop/test/error-boundary-normalization.test.ts keeps D-ERR-011 structured field extraction evidence pointed at Kit ownership.
  - apps/tester/test/tester-contract.test.mjs keeps Tester second-consumer proof in place.
prohibited_patterns:
  - target: apps/desktop/src/shell/renderer/bridge/runtime-bridge/invoke.ts
    required:
      - "@nimiplatform/kit/shell/renderer/bridge"
      - toShellBridgeNimiError
      - getShellBridgeUserMessageProjection
    absent:
      - const BRIDGE_ERROR_CODE_MAP
      - const BRIDGE_ERROR_MAP
      - function parseBridgeJsonPayload
      - function extractBridgeErrorCode
      - getRuntimeReasonCodeMessage
  - target: apps/tester/src/tester/tester-tauri.ts
    required:
      - toShellBridgeNimiError
      - "@nimiplatform/kit/shell/renderer/bridge"
    absent:
      - "@renderer/"
      - "@runtime/"
      - "@tauri-apps/api"
  - target: kit/shell/renderer/src/bridge/nimi-error.ts
    required:
      - parseShellBridgeJsonPayload
      - getShellBridgeUserMessageProjection
      - toShellBridgeNimiError
      - getRuntimeReasonCodeMessage
    absent:
      - "@renderer/"
      - "@runtime/"
      - "apps/"
