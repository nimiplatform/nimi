status: migrated
date: "2026-06-01"
domain: realm-auth-login-session-projection
migrated_in_this_commit: true
authority_posture:
  spec_status: alignment
  authority_owner:
    - .nimi/spec/realm/**
    - .nimi/spec/sdks/kernel/nimi-app-client-contract.md
    - sdk/src/realm/extensions/auth.ts
    - kit/auth/src/logic/runtime-account-browser-broker.ts
  work_type: alignment
  parallel_truth: forbidden
scope:
  included:
    - Realm AuthService check-email, password-login, email OTP, two-factor, wallet, and OAuth app-facing helper ownership.
    - AuthTokens, CheckEmail, OAuthLogin, email OTP, wallet challenge, and anonymous-session error projection validation.
    - Desktop WebShell auth adapter consumption of SDK Realm auth helpers.
    - Tester consumption of the same SDK Realm auth helpers as second-app proof.
  excluded:
    - RuntimeAccountService local-first-party account custody and browser broker handoff, already owned by Runtime/Kit.
    - Desktop token application, WebShell enablement, session metadata persistence, Runtime bootstrap readiness, OAuth Tauri bridge wiring, and query invalidation.
preflight_violation_inventory:
  platform_truth:
    - finding: Desktop auth adapter selected Realm AuthService methods directly for login, OTP, two-factor, wallet, and OAuth flows.
      evidence_before:
        - apps/desktop/src/shell/renderer/features/auth/desktop-auth-adapter.ts called AuthService.checkEmail.
        - apps/desktop/src/shell/renderer/features/auth/desktop-auth-adapter.ts called AuthService.passwordLogin.
        - apps/desktop/src/shell/renderer/features/auth/desktop-auth-adapter.ts called AuthService.requestEmailOtp and verifyEmailOtp.
        - apps/desktop/src/shell/renderer/features/auth/desktop-auth-adapter.ts called AuthService.verifyTwoFactor.
        - apps/desktop/src/shell/renderer/features/auth/desktop-auth-adapter.ts called AuthService.walletChallenge, walletLogin, and oauthLogin.
      disposition: SDK Realm auth extension now owns service method selection and response projection; Desktop calls SDK helpers through callRealmApi.
    - finding: Desktop auth-session-utils owned AuthTokens, OAuthLoginResult, CheckEmail, auth user, and anonymous-session error projection validation.
      disposition: SDK Realm auth extension now owns these projections; Desktop auth-session-utils was deleted instead of kept as a thin re-export.
  duplicate_implementation:
    - finding: Desktop behavior tests asserted SDK-owned auth DTO coercion and anonymous-session routing behavior through Desktop helpers.
      disposition: SDK owner test now covers DTO projection and anonymous-session classification; Desktop tests assert SDK ownership and app boundary wiring.
  boundary_imports:
    - finding: Desktop imported generated Realm model types while retaining direct AuthService implementation locally.
      disposition: Desktop imports SDK Realm auth helper functions and DTO projection types from @nimiplatform/sdk/realm.
  token_session_runtime_realm_responsibility:
    - finding: Realm AuthService login/OTP/wallet/OAuth business truth and DTO validation are Realm/SDK responsibilities, while RuntimeAccountService local-first-party custody stays Runtime-owned.
      disposition: Desktop keeps local-first-party fail-closed gating and Runtime account broker wiring; cloud/WebShell auth service behavior is SDK-owned.
audited_globs:
  - apps/desktop/src/shell/renderer/features/auth/desktop-auth-adapter.ts
  - apps/desktop/src/shell/renderer/features/auth/web-auth-menu.tsx
  - apps/desktop/src/shell/renderer/features/auth/auth-session-utils.ts
  - apps/desktop/test/auth-bootstrap-guard.test.ts
  - apps/desktop/test/auth-runtime-account-domain-boundary.test.ts
  - apps/desktop/test/check-no-anonymous-fallback-shim.test.ts
  - apps/desktop/test/desktop-shell-guardrails.test.ts
  - apps/tester/src/tester/tester-realm-auth-projection.ts
  - apps/tester/src/shell/routes/settings.tsx
  - apps/tester/test/tester-contract.test.mjs
  - sdk/src/realm/extensions/auth.ts
  - sdk/src/realm/index.ts
  - sdk/test/realm-auth-extension.test.ts
migrated:
  shared_owners:
    - sdk/src/realm/extensions/auth.ts
  responsibilities:
    - SDK owns Realm AuthService method selection for check-email, password-login, email OTP, two-factor, wallet, and OAuth flows.
    - SDK owns auth DTO validation for tokens, OAuth login result, check-email result, email OTP result, wallet challenge result, and anonymous-session classification.
    - Desktop owns only WebShell/local-first-party gating, Runtime bootstrap readiness, token application, session metadata persistence, OAuth bridge wiring, and post-login query invalidation.
  deleted_desktop_aliases:
    - apps/desktop/src/shell/renderer/features/auth/auth-session-utils.ts
  desktop_consumers:
    - apps/desktop/src/shell/renderer/features/auth/desktop-auth-adapter.ts
    - apps/desktop/src/shell/renderer/features/auth/web-auth-menu.tsx
  tester_consumers:
    - apps/tester/src/tester/tester-realm-auth-projection.ts
    - apps/tester/src/shell/routes/settings.tsx
legal_desktop_residue:
  - path: apps/desktop/src/shell/renderer/features/auth/desktop-auth-adapter.ts
    rationale: App-owned auth adapter composes WebShell availability, RuntimeAccountService fail-closed local-first-party policy, bootstrap readiness, platform client token application, OAuth Tauri bridge wiring, and query invalidation; Realm AuthService behavior comes from SDK helpers.
  - path: apps/desktop/src/shell/renderer/features/auth/web-auth-menu.tsx
    rationale: App-owned auth UI adapter wiring normalizes current app-store user through SDK auth projection and renders Kit auth UI.
tester_proof:
  - apps/tester/src/tester/tester-realm-auth-projection.ts consumes checkRealmAuthEmail, loginRealmAuthPassword, loginRealmOAuth, and toRealmOAuthLoginResultDto from @nimiplatform/sdk/realm.
  - apps/tester/src/shell/routes/settings.tsx renders the SDK Realm auth projection in Tester settings.
  - apps/tester/test/tester-contract.test.mjs asserts Tester consumes the SDK Realm auth helpers.
regression_guards:
  - sdk/test/realm-auth-extension.test.ts covers SDK owner behavior for DTO projection, AuthService method selection, and anonymous-session classification.
  - apps/desktop/test/auth-runtime-account-domain-boundary.test.ts asserts Desktop delegates AuthService and DTO projection behavior to SDK.
  - apps/desktop/test/auth-bootstrap-guard.test.ts keeps Desktop/Kit Runtime account broker bootstrap and custody hardcuts.
  - apps/desktop/test/desktop-shell-guardrails.test.ts keeps shell auth helper centralization and SDK auth projection checks.
  - apps/desktop/test/check-no-anonymous-fallback-shim.test.ts keeps anonymous fallback drift guard aligned with SDK auth projection ownership.
  - apps/tester/test/tester-contract.test.mjs keeps Tester second-consumer proof.
prohibited_patterns:
  - target: apps/desktop/src/shell/renderer/features/auth apps/desktop/src/public-web
    absent:
      - "realm.services.AuthService"
      - "auth-session-utils"
      - "toAuthTokensDto"
      - "toOAuthLoginResultDto"
      - "toCheckEmailResponseDto"
      - "isExpectedAnonymousSessionError"
  - target: apps/desktop/src/shell/renderer/features/auth/desktop-auth-adapter.ts
    required:
      - checkRealmAuthEmail
      - loginRealmAuthPassword
      - verifyRealmEmailOtp
      - loginRealmOAuth
      - "@nimiplatform/sdk/realm"
  - target: apps/desktop/src/shell/renderer/features/auth/web-auth-menu.tsx
    required:
      - toRealmAuthUserRecord
      - "@nimiplatform/sdk/realm"
verification:
  status: passed
  passed:
    - command: pnpm --filter @nimiplatform/sdk exec tsx --test test/realm-auth-extension.test.ts
      evidence: SDK owner tests pass for Realm auth DTO projection, AuthService method selection, and anonymous-session classification.
    - command: >-
        pnpm --filter @nimiplatform/desktop exec tsx --test test/auth-runtime-account-domain-boundary.test.ts test/auth-bootstrap-guard.test.ts test/desktop-shell-guardrails.test.ts test/check-no-anonymous-fallback-shim.test.ts
      evidence: Desktop auth boundary, bootstrap, guardrail, and anonymous fallback hardcuts pass.
    - command: pnpm --filter @nimiplatform/sdk build
      evidence: SDK Realm public exports compile into dist.
    - command: pnpm --filter @nimiplatform/desktop typecheck
      evidence: Desktop compiles against SDK Realm auth helpers.
    - command: pnpm --filter @nimiplatform/tester exec node --test test/tester-contract.test.mjs
      evidence: Tester second-consumer contract passes and requires SDK Realm auth projection consumption.
    - command: pnpm --filter @nimiplatform/tester typecheck
      evidence: Tester compiles against SDK Realm auth helpers after SDK build.
    - command: >-
        rg -n "realm\.services\.AuthService|auth-session-utils" apps/desktop/src/shell/renderer/features/auth apps/desktop/src/public-web --glob '!**/.cache/**' --glob '!**/dist/**' --glob '!**/locales/**'
      evidence: No audited Desktop auth production direct AuthService or deleted helper imports remain.
    - command: >-
        rg -n "realm\.services\.AuthService" apps/desktop/src/shell/renderer apps/desktop/src/public-web apps/desktop/src-tauri/src --glob '!**/.cache/**' --glob '!**/dist/**' --glob '!**/locales/**' --glob '!**/gen/**'
      evidence: No Desktop production direct AuthService method selection remains.
    - command: pnpm check:no-app-realm-rest-bypass
      evidence: App Realm REST bypass guard passes.
    - command: pnpm check:no-legacy-imports
      evidence: Legacy import guard passes.
    - command: pnpm check:no-absolute-user-paths
      evidence: Absolute user-home path guard passes.
    - command: git diff --check
      evidence: Patch whitespace passes.
  command_notes:
    - command: pnpm --filter @nimiplatform/tester typecheck
      status: failed-command-ordering
      evidence: Failed only when started in parallel with pnpm --filter @nimiplatform/sdk build while SDK dist was being rebuilt; rerun after SDK build passed.
