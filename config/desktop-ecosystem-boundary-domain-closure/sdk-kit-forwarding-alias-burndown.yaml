preflight_violation_inventory:
  platform_truth:
    - finding: Desktop modules forwarded SDK/Kit owner symbols as if Desktop were a public owner.
      examples:
        - conversation-capability.ts re-exported applyAIProfileToConfig and createEmptyAIConfig from SDK AI.
        - account app/profile bridge modules re-exported SDK projection types.
        - web-auth-menu.tsx re-exported Kit WebAuthMenuMode.
        - first-run/index.ts re-exported SDK first-run install-level policy symbols.
      disposition: removed forwarding exports; app consumers import SDK/Kit owner surfaces directly or use local Desktop aliases only for app-owned feature APIs.
  duplicate_implementation:
    - finding: No duplicate implementation was introduced; issue was alias ownership leakage.
      disposition: direct-owner import and hardcut.
  boundary_imports:
    - finding: public-web still re-exports Kit bridge/telemetry symbols.
      disposition: allowlisted as admitted public-for-web scaffold from public-web-facade closure.
  token_session_runtime_realm_responsibility:
    - finding: no token/session/runtime/realm ownership changed in this domain.
      disposition: not applicable.
migrated:
  shared_owners:
    - sdks/typescript/core/ai/**
    - sdks/typescript/core/app/**
    - kit/auth/**
  desktop_consumers:
    - apps/desktop/src/shell/renderer/app-shell/providers/runtime-slice.ts imports applyAIProfileToConfig from SDK directly.
    - apps/desktop/src/shell/renderer/app-shell/providers/desktop-ai-config-service.ts imports SDK AI helpers directly.
    - apps/desktop/src/shell/renderer/features/runtime-config/runtime-config-profile-library.ts imports SDK account profile projection types directly and exposes local feature aliases.
  tester_consumers:
    - apps/tester/src/shell/ai/tester-ai-config-settings.tsx imports SDK AI helpers directly.
    - apps/tester/src/tester/tester-ai-config-store.ts consumes SDK host AIProfile surface directly.
desktop_app_owned_residue:
  - path: apps/desktop/src/shell/renderer/features/chat/conversation-capability.ts
    rationale: Desktop owns conversation capability submodel composition over SDK runtime route projections; it no longer forwards SDK AI helper values.
  - path: apps/desktop/src/shell/renderer/bridge/runtime-bridge/account-app-library.ts
    rationale: Desktop owns the Tauri command adapter and local mutation-kind type; SDK owns account app library projection parsing/types.
  - path: apps/desktop/src/shell/renderer/bridge/runtime-bridge/account-profile-library.ts
    rationale: Desktop owns the Tauri command adapter; SDK owns account profile projection parsing/types.
  - path: apps/desktop/src/shell/renderer/features/runtime-config/runtime-config-profile-library.ts
    rationale: Desktop feature layer owns read-through UI projection cache and local aliases over SDK types, not SDK type forwarding.
  - path: apps/desktop/src/shell/renderer/features/auth/web-auth-menu.tsx
    rationale: Desktop owns auth menu composition; Kit owns WebAuthMenuMode.
tester_proof:
  - apps/tester/src/shell/ai/tester-ai-config-settings.tsx imports applyAIProfileToConfig from @nimiplatform/sdk/ai directly.
  - apps/tester/test/tester-ai-profile-surface.test.mjs proves SDK host AIProfile preview/apply as second app consumer.
  - apps/tester/test/tester-contract.test.mjs verifies Tester AI config uses Kit model-config and SDK AIProfile surfaces.
regression_guards:
  - apps/desktop/test/sdk-kit-forwarding-alias-domain-boundary.test.ts blocks SDK/Kit forwarding exports in Desktop source outside admitted public-web scaffold.
  - apps/desktop/test/ai-profile-config-domain-boundary.test.ts continues to assert SDK/Kit AIProfile owner consumption.
prohibited_patterns:
  - target: audited AI/profile/account/auth files
    absent:
      - "export { ... } from '@nimiplatform/sdk...'"
      - "export type { ... } from '@nimiplatform/sdk...'"
      - "export { ... } from '@nimiplatform/kit...'"
      - "export type { ... } from '@nimiplatform/kit...'"
  - target: apps/desktop/src
    allowlisted_remaining_forwarders:
      - apps/desktop/src/public-web/bridge.ts
      - apps/desktop/src/public-web/infra/index.ts
      - apps/desktop/src/shell/renderer/bridge/runtime-bridge.ts
      - apps/desktop/src/shell/renderer/bridge/runtime-bridge/runtime-types.ts
      - apps/desktop/src/shell/renderer/bridge/runtime-bridge/shared.ts
      - apps/desktop/src/shell/renderer/features/apps/apps-lifecycle-bridge.ts
      - apps/desktop/src/shell/renderer/features/runtime-config/runtime-config-catalog-sdk-service.ts
      - apps/desktop/src/shell/renderer/features/world/world-detail-types.ts
      - apps/desktop/src/shell/renderer/first-run/runtime-materialization.ts
      - apps/desktop/src/shell/renderer/infra/offline/index.ts
      - apps/desktop/src/shell/renderer/infra/runtime-agent-inspect.ts
    note: The allowlist is not completion for those domains; it makes remaining forwarding explicit and bounded for subsequent domain closures.
