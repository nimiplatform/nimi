status: migrated
date: "2026-06-01"
domain: runtime-external-agent-access-surface
migrated_in_this_commit: true
authority_posture:
  spec_status: alignment
  authority_owner:
    - .nimi/spec/sdk/kernel/runtime-contract.md
    - .nimi/spec/sdk/kernel/surface-contract.md
    - sdk/src/runtime/runtime-external-agent.ts
    - runtime/internal/services/externalagent/**
  work_type: alignment
  parallel_truth: forbidden
scope:
  included:
    - Runtime External Agent gateway status, token issuance, revocation, and ledger access surface.
    - Desktop runtime-config External Agent access UI consumption of the SDK Runtime surface.
    - Tester consumption of the same SDK Runtime surface with a second-app Runtime client double.
    - Hardcut removal of the Desktop runtime/external-agent facade.
  excluded:
    - Runtime External Agent action registry implementation and gateway server admission.
    - Delegated capability control-plane diagnostics, which remain covered by the Runtime Agent domain.
preflight_violation_inventory:
  platform_truth:
    - finding: Desktop exposed External Agent token and gateway access through apps/desktop/src/runtime/external-agent/index.ts.
      evidence_before:
        - The facade imported getPlatformClient and called runtime.externalAgent.issueToken, revokeToken, listTokens, and getGatewayStatus.
        - Runtime token ledger projection was made reachable through @runtime/external-agent, making Runtime access appear Desktop-owned.
      disposition: Desktop facade deleted; SDK Runtime owns the host access surface and projections.
  duplicate_implementation:
    - finding: Desktop duplicated the SDK Runtime projector composition around token issue, token ledger, and gateway status responses.
      disposition: createHostRuntimeExternalAgentAccessSurface in SDK now performs Runtime method calls and projection once.
  boundary_imports:
    - finding: Desktop runtime-config UI imported @runtime/external-agent for platform Runtime access.
      disposition: UI now imports createHostRuntimeExternalAgentAccessSurface and ExternalAgentTokenLedgerRecord from @nimiplatform/sdk/runtime.
  token_session_runtime_realm_responsibility:
    - finding: External Agent token issuance, revocation, and ledger reads are Runtime responsibilities, not app-owned session or Realm state.
      disposition: Desktop supplies only getPlatformClient().runtime as app wiring; SDK submits typed requests to Runtime and projects responses.
audited_globs:
  - apps/desktop/src/runtime/external-agent/**
  - apps/desktop/src/shell/renderer/features/runtime-config/runtime-config-external-agent-access*.tsx
  - apps/desktop/test/external-agent-*.test.ts
  - apps/desktop/test/d-auth-010-external-principal-token-ui.test.ts
  - apps/desktop/test/bootstrap-reentry-contract.test.ts
  - apps/tester/src/tester/tester-external-agent-projection.ts
  - apps/tester/test/tester-contract.test.mjs
  - sdk/src/runtime/runtime-external-agent.ts
  - sdk/test/runtime/runtime-external-agent.test.ts
migrated:
  shared_owners:
    - sdk/src/runtime/runtime-external-agent.ts
  responsibilities:
    - SDK owns External Agent app-facing token/gateway access composition over public Runtime client methods.
    - SDK owns token issue, token ledger, and gateway status projection helpers.
    - Desktop runtime-config UI owns only product-specific state, validation copy, and user intent wiring.
  deleted_desktop_aliases:
    - apps/desktop/src/runtime/external-agent/index.ts
  desktop_consumers:
    - apps/desktop/src/shell/renderer/features/runtime-config/runtime-config-external-agent-access.tsx
    - apps/desktop/src/shell/renderer/features/runtime-config/runtime-config-external-agent-access-model.tsx
  tester_consumers:
    - apps/tester/src/tester/tester-external-agent-projection.ts
    - apps/tester/test/tester-contract.test.mjs
legal_desktop_residue:
  - path: apps/desktop/src/shell/renderer/features/runtime-config/runtime-config-external-agent-access.tsx
    rationale: Product-specific Runtime Config UI state, validation, copy, and click handlers; Runtime External Agent access is delegated to SDK.
  - path: apps/desktop/src/shell/renderer/features/runtime-config/runtime-config-external-agent-access-model.tsx
    rationale: Product-specific UI presentation helpers and token status display over SDK-owned token record shape.
tester_proof:
  - apps/tester/src/tester/tester-external-agent-projection.ts creates a Tester External Agent access surface through createHostRuntimeExternalAgentAccessSurface.
  - apps/tester/test/tester-contract.test.mjs asserts Tester consumes the SDK Runtime External Agent access surface and projections.
regression_guards:
  - apps/desktop/test/external-agent-token-ledger-fail-close.test.ts requires deleted Desktop facade, SDK owner surface, and no Tauri/token ledger bypass in UI.
  - apps/desktop/test/external-agent-delegation-control-surface.test.ts blocks renderer action request bypass and requires no Desktop external-agent bridge.
  - apps/desktop/test/external-agent-phase-contract.test.ts blocks app-local execution phase parsing resurrection.
  - apps/desktop/test/external-agent-tier1-capability-contract.test.ts blocks app-local action descriptors and sync commands.
  - apps/desktop/test/d-auth-010-external-principal-token-ui.test.ts keeps the UI flow pointed at the SDK Runtime surface.
  - apps/desktop/test/bootstrap-reentry-contract.test.ts requires deleted Desktop external-agent facade and no action bridge teardown residue.
  - sdk/test/runtime/runtime-external-agent.test.ts covers SDK owner projection and host access surface behavior.
prohibited_patterns:
  - target: apps/desktop/src/runtime/external-agent/index.ts
    absent_file: true
  - target: apps/desktop/src apps/desktop/test
    absent:
      - "@runtime/external-agent"
      - "issueExternalAgentToken"
      - "listExternalAgentTokens"
      - "getExternalAgentGatewayStatus"
      - "revokeExternalAgentToken"
  - target: apps/desktop/src/shell/renderer/features/runtime-config/runtime-config-external-agent-access.tsx
    required:
      - createHostRuntimeExternalAgentAccessSurface
      - "@nimiplatform/sdk/runtime"
    absent:
      - tauriInvoke
      - external_agent_list_tokens
verification:
  status: passed
  passed:
    - command: pnpm --filter @nimiplatform/sdk exec tsx --test test/runtime/runtime-external-agent.test.ts
      evidence: SDK owner tests pass for External Agent projections and host access surface delegation.
    - command: >-
        pnpm --filter @nimiplatform/desktop exec tsx --test test/external-agent-token-ledger-fail-close.test.ts test/external-agent-delegation-control-surface.test.ts test/external-agent-phase-contract.test.ts test/external-agent-tier1-capability-contract.test.ts test/d-auth-010-external-principal-token-ui.test.ts test/bootstrap-reentry-contract.test.ts
      evidence: Desktop hardcut and UI compatibility tests pass for deleted facade, no Tauri bypass, no action bridge, and SDK surface consumption.
    - command: pnpm --filter @nimiplatform/tester exec node --test test/tester-contract.test.mjs
      evidence: Tester second-consumer contract passes and requires SDK Runtime External Agent access surface/projection usage.
    - command: pnpm --filter @nimiplatform/sdk build
      evidence: SDK runtime public exports compile into dist.
    - command: pnpm --filter @nimiplatform/desktop typecheck
      evidence: Desktop compiles after deleting @runtime/external-agent and consuming SDK Runtime surface directly.
    - command: pnpm --filter @nimiplatform/tester typecheck
      evidence: Tester compiles against the SDK Runtime External Agent access surface.
    - command: >-
        rg -n "@runtime/external-agent|issueExternalAgentToken|listExternalAgentTokens|getExternalAgentGatewayStatus|revokeExternalAgentToken" apps/desktop/src apps/desktop/test --glob '!**/dist/**'
      evidence: No prohibited Desktop External Agent facade imports or legacy function names remain; command returned no matches.
    - command: pnpm check:no-legacy-imports
      evidence: Legacy import guard passes.
    - command: pnpm check:no-absolute-user-paths
      evidence: Absolute user-home path guard passes.
    - command: pnpm check:no-app-realm-rest-bypass
      evidence: App Realm REST bypass guard passes.
    - command: >-
        node -e "const fs=require('fs'); const yaml=require('yaml'); yaml.parse(fs.readFileSync('config/desktop-ecosystem-boundary-domain-closure/runtime-external-agent-access-surface.yaml','utf8'));"
      evidence: Closure record parses as YAML.
    - command: git diff --check
      evidence: Patch whitespace passes.
  command_notes:
    - command: pnpm --filter @nimiplatform/tester typecheck
      status: failed-command-ordering
      evidence: Failed only when started in parallel before pnpm --filter @nimiplatform/sdk build completed; rerun after SDK build passed.
