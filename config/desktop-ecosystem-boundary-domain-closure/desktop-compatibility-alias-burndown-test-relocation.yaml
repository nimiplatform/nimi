    - sdk/src/types/network-retry.ts
    - kit/telemetry/src/telemetry/runtime-log.ts
    - kit/ui/src/hooks/typed-projection.ts
  responsibilities:
    - SDK owns network retry delay, retry lifecycle, retry classification, and API error normalization behavior plus tests.
    - Kit telemetry owns runtime log normalization, sink injection, and fallback behavior plus tests.
    - Kit UI owns typed projection lifecycle behavior plus tests.
    - Desktop owns direct shared-owner consumption, bridge installation, product section composition, and boundary hardcut tests only.
  deleted_desktop_aliases:
    - apps/desktop/src/runtime/net/request-with-retry.ts
    - apps/desktop/src/runtime/net/error-normalize.ts
    - apps/desktop/src/runtime/telemetry/logger.ts
    - apps/desktop/src/shell/renderer/features/support/support-projection.ts
  relocated_tests:
    - from: apps/desktop/test/network-retry-lifecycle.test.ts
      to: sdk/test/network-retry-lifecycle.test.ts
    - from: apps/desktop/test/retry-jitter.test.ts
      to: sdk/test/retry-jitter.test.ts
  desktop_residue:
    - apps/desktop/test/network-retry-domain-boundary.test.ts asserts SDK ownership and absent @runtime/net aliases.
    - apps/desktop/test/sdk-error-field-projection-domain-boundary.test.ts asserts SDK error-field/API normalization imports and absent error-normalize alias.
    - apps/desktop/test/runtime-telemetry-domain-boundary.test.ts asserts Kit telemetry ownership and absent @runtime/telemetry/logger alias.
    - apps/desktop/test/support-typed-projection-domain-boundary.test.ts asserts Kit UI ownership, direct support section imports, and absent support-projection alias.
    - apps/desktop/test/telemetry-log-format.test.ts keeps Desktop bridge/logging integration coverage only.
tester_proof:
  - apps/tester/src/tester/tester-workbench.tsx consumes SDK requestWithRetry and Kit runtime telemetry.
  - apps/tester/src/shell/routes/settings.tsx consumes SDK typed error-field projection and Kit typed projection lifecycle.
  - apps/tester/test/tester-contract.test.mjs verifies Tester second-consumer imports and blocks Desktop/private import regressions.
regression_guards:
