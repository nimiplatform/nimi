  work_type: alignment
  parallel_truth: forbidden
scope:
  included:
    - Burn down Desktop thin re-export aliases after SDK/Kit ownership was established.
    - Move SDK-owned network retry behavior tests out of Desktop and into SDK.
    - Keep Desktop tests focused on hardcut boundary assertions and Desktop bridge behavior.
    - Preserve Tester as second-consumer proof for every shared responsibility touched in this cleanup.
  excluded:
    - New Runtime, Realm, SDK, or Kit API design.
    - Desktop product UI rewrites unrelated to direct shared-owner imports.
    - Token/session custody, provider/model routing, and Realm/Runtime authority.
preflight_violation_inventory:
  platform_truth:
    - finding: Desktop still exposed owner-package behavior through thin alias files after extraction.
      evidence_before:
        - apps/desktop/src/runtime/net/request-with-retry.ts re-exported SDK network retry helpers.
        - apps/desktop/src/runtime/net/error-normalize.ts re-exported SDK API error normalization.
        - apps/desktop/src/runtime/telemetry/logger.ts re-exported Kit runtime telemetry.
        - apps/desktop/src/shell/renderer/features/support/support-projection.ts re-exported Kit typed projection as a Support hook.
      disposition: aliases_deleted_consumers_import_owners_directly
  duplicate_tests:
    - finding: SDK-owned D-NET behavior tests still lived under apps/desktop/test.
      evidence_before:
        - apps/desktop/test/network-retry-lifecycle.test.ts
        - apps/desktop/test/retry-jitter.test.ts
      disposition: moved_to_sdk_owner_package
  boundary_imports:
    - finding: Desktop production code continued importing @runtime/net, @runtime/telemetry/logger, and local support-projection aliases after shared ownership was closed.
      disposition: production imports now target @nimiplatform/sdk/types, @nimiplatform/kit/telemetry, and @nimiplatform/kit/ui directly.
  token_session_runtime_realm_responsibility:
    - finding: The cleanup touches app-facing helper imports, telemetry routing, and renderer lifecycle helpers only.
      disposition: no token, session, Runtime truth, Realm truth, provider routing, or model selection ownership moved in this domain.
audited_globs:
