  - apps/desktop/test/sdk-error-field-projection-domain-boundary.test.ts
  - apps/desktop/test/runtime-telemetry-domain-boundary.test.ts
  - apps/desktop/test/support-typed-projection-domain-boundary.test.ts
  - sdk/test/network-retry.test.ts
