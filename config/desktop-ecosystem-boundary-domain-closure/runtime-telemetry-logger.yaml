status: migrated
date: "2026-06-01"
domain: runtime-telemetry-logger
migrated_in_this_commit: true
authority_posture:
  spec_status: alignment
  authority_owner:
    - kit/telemetry/src/telemetry/runtime-log.ts
    - apps/tester/src/tester/tester-workbench.tsx
  work_type: alignment
  parallel_truth: forbidden
scope:
  included:
    - Runtime log message normalization to action:/phase: telemetry names.
    - Shared injected runtime-log sink and console fallback behavior.
    - Desktop runtime log emission through direct Kit telemetry imports.
    - Tester workbench second-consumer proof for Kit runtime telemetry.
  excluded:
    - Renderer event forwarding, debug buffer persistence, and session trace ids already owned by Kit renderer telemetry.
    - Runtime execution, provider routing, model selection, and Realm/Runtime session truth.
    - Desktop-specific bridge wiring that installs the runtime logger sink during bootstrap.
preflight_violation_inventory:
  platform_truth:
    - finding: Desktop owned reusable runtime log formatting and injected-sink mechanics under apps/desktop/src/runtime/telemetry/logger.ts.
      evidence_before: Desktop implemented runtimeLogger state, fallbackConsoleLog, normalizeRuntimeLogMessage, emitRuntimeLog, and setRuntimeLogger locally.
      disposition: migrated_to_kit_telemetry_runtime_log
  duplicate_implementation:
    - finding: Tester already consumed Kit renderer telemetry but had no proof for the extracted runtime-log sink surface.
      evidence_before: apps/tester/src/tester/tester-workbench.tsx imported createRendererFlowId/logRendererEvent only.
      disposition: Tester workbench now consumes emitRuntimeLog from @nimiplatform/kit/telemetry on history load failure.
  boundary_imports:
    - finding: Desktop renderer and runtime helpers imported @runtime/telemetry/logger as a Desktop-owned shared surface.
      disposition: Desktop compatibility alias removed; app call sites import @nimiplatform/kit/telemetry directly.
  token_session_runtime_realm_responsibility:
    - finding: The migrated logger formats and routes telemetry payloads only; it does not create, refresh, persist, or authorize tokens and does not own Runtime/Realm state.
      disposition: Kit telemetry owns renderer-safe logging mechanics; Desktop owns the installed bridge sink; Tester proves app consumption.
audited_globs:
  - apps/desktop/src/runtime/telemetry/**
  - apps/desktop/src/runtime/**
  - apps/desktop/src/shell/renderer/infra/**
  - apps/desktop/test/telemetry-log-format.test.ts
  - apps/desktop/test/telemetry-redaction.test.ts
  - apps/desktop/test/runtime-telemetry-domain-boundary.test.ts
  - apps/tester/src/tester/tester-workbench.tsx
  - apps/tester/test/tester-contract.test.mjs
  - kit/telemetry/src/telemetry/**
  - kit/test/renderer-telemetry.test.ts
migrated:
  shared_owners:
    - kit/telemetry/src/telemetry/runtime-log.ts
  responsibilities:
    - Kit telemetry owns RuntimeLogPayload/RuntimeLogMessage types, toRuntimeLogMessage, setRuntimeLogger, and emitRuntimeLog.
    - Desktop imports Kit telemetry directly and keeps no @runtime/telemetry/logger compatibility file.
    - Tester consumes Kit runtime telemetry directly in the workbench error path.
  desktop_consumers:
    - Desktop runtime and renderer call sites import emitRuntimeLog, setRuntimeLogger, and RuntimeLogMessage from @nimiplatform/kit/telemetry.
    - apps/desktop/src/runtime/telemetry/logger.ts is absent.
  tester_consumers:
    - apps/tester/src/tester/tester-workbench.tsx consumes emitRuntimeLog from @nimiplatform/kit/telemetry when run-history loading fails.
legal_desktop_residue:
  - path: apps/desktop/src/shell/renderer/infra/bootstrap/runtime-bootstrap.ts
    rationale: Desktop owns the concrete bridge sink installation that forwards runtime logs to renderer telemetry during Desktop bootstrap.
tester_proof:
  - apps/tester/src/tester/tester-workbench.tsx imports emitRuntimeLog from @nimiplatform/kit/telemetry.
  - apps/tester/test/tester-contract.test.mjs verifies Tester workbench consumes Kit runtime telemetry and rejects Desktop/private telemetry imports.
regression_guards:
  - apps/desktop/test/runtime-telemetry-domain-boundary.test.ts blocks Desktop app-local runtime logger implementation, requires the alias file to be absent, and requires Tester proof.
  - kit/test/renderer-telemetry.test.ts verifies shared runtime log message normalization and injected sink behavior.
  - apps/desktop/test/telemetry-log-format.test.ts keeps Desktop bridge telemetry behavior passing through direct Kit telemetry imports.
  - apps/tester/test/tester-contract.test.mjs keeps Tester consumption of Kit telemetry in place.
prohibited_patterns:
  - target: apps/desktop/src/runtime/telemetry/logger.ts
    absent_file: true
  - target: apps/desktop/src
    absent:
      - "@runtime/telemetry/logger"
  - target: apps/desktop/src/shell/renderer/infra/bootstrap/runtime-bootstrap.ts
    required:
      - "@nimiplatform/kit/telemetry"
      - setRuntimeLogger
  - target: apps/tester/src/tester/tester-workbench.tsx
    required:
      - emitRuntimeLog
      - history-load-failed
    absent:
      - "@renderer/.*telemetry"
      - runtime-bridge/logging
  - target: kit/telemetry/src/telemetry/runtime-log.ts
    absent:
      - "@renderer"
      - "@runtime"
      - "apps/"
verification:
  status: passed
  passed:
    - command: pnpm --filter @nimiplatform/kit exec vitest run test/renderer-telemetry.test.ts --config ui/vitest.config.ts
      evidence: Kit renderer/runtime telemetry focused tests pass, including shared runtime log normalization and injected sink behavior.
    - command: >-
        pnpm --filter @nimiplatform/desktop exec tsx --test test/runtime-telemetry-domain-boundary.test.ts test/telemetry-log-format.test.ts test/telemetry-redaction.test.ts
      evidence: Desktop hardcut, direct Kit telemetry bridge behavior, and telemetry redaction tests pass.
    - command: pnpm --filter @nimiplatform/tester exec node --test test/tester-contract.test.mjs test/scaffold-boundary.test.mjs
      evidence: Tester consumes Kit runtime telemetry as second app proof.
    - command: pnpm --filter @nimiplatform/kit build
      evidence: Kit telemetry export compiles into package dist.
    - command: pnpm --filter @nimiplatform/desktop typecheck
      evidence: Desktop compiles against direct Kit runtime telemetry imports.
    - command: pnpm --filter @nimiplatform/tester typecheck
      evidence: Tester compiles after Kit build completed.
    - command: pnpm check:nimi-kit
      evidence: Kit registry, package dist, build, and canonical capability catalog checks pass.
    - command: pnpm check:no-legacy-imports
      evidence: Legacy import guard passes.
    - command: pnpm check:no-absolute-user-paths
      evidence: Absolute user-home path guard passes.
    - command: pnpm check:no-app-realm-rest-bypass
      evidence: App Realm REST bypass guard passes.
    - command: >-
        node -e "const fs=require('fs'); const yaml=require('yaml'); yaml.parse(fs.readFileSync('config/desktop-ecosystem-boundary-domain-closure/runtime-telemetry-logger.yaml','utf8'));"
      evidence: Runtime telemetry logger closure record parses as YAML.
    - command: git diff --check
      evidence: Patch whitespace passes.
  command_notes:
    - command: pnpm --filter @nimiplatform/kit exec vitest run test/renderer-telemetry.test.ts
      status: failed-missing-jsdom-config
      evidence: Direct vitest invocation used the default non-browser environment; rerun with ui/vitest.config.ts passed.
    - command: pnpm --filter @nimiplatform/tester typecheck
      status: failed-during-parallel-kit-dist-rewrite
      evidence: Initial run overlapped with Kit build/check:nimi-kit dist rewrite; reruns after Kit build completed passed.
