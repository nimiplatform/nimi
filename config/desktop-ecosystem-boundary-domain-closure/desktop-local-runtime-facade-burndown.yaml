      evidence: App Realm REST bypass guard passes.
    - command: >-
        rg -n "@runtime/local-runtime|from '../../../runtime/local-runtime|from '../src/runtime/local-runtime" apps/desktop/src apps/desktop/test --glob '!**/dist/**'
      evidence: No prohibited local-runtime facade imports remain; command returned no matches.
    - command: >-
        node -e "const fs=require('fs'); const yaml=require('yaml'); for (const f of ['config/desktop-ecosystem-boundary-domain-closure/desktop-local-runtime-facade-burndown.yaml','config/desktop-ecosystem-boundary-domain-closure/runtime-config-local-runtime.yaml']) yaml.parse(fs.readFileSync(f,'utf8'));"
      evidence: New and updated closure records parse as YAML.
