  duplicate_implementation:
    - finding: Desktop runtime-config surfaces duplicated single-line NimiError detail formatting.
      disposition: Current Desktop consumers call SDK formatNimiRuntimeErrorDetail and formatNimiRuntimeErrorBanner directly.
  boundary_imports:
    - finding: Desktop previously had a local runtime-config-connector-error production helper.
      disposition: The helper is deleted and current consumers import the SDK Runtime owner directly.
  retired_apps_surface:
    - finding: This closure previously referenced apps-lifecycle-bridge.ts as a Desktop error-presentation consumer.
      disposition: The immutable-package 0K hardcut deleted that bridge; no Apps runtime-error consumer is claimed by this closure.
migrated:
  sdk_owner:
    - path: sdks/typescript/runtime/reason-messages.ts
      responsibility: Runtime reason-code messages, reason extraction, NimiError detail and banner formatting, and user-facing Runtime error projection.
    - path: sdks/typescript/runtime/projection-helpers.test.ts
      responsibility: Owner behavior coverage for Runtime user-facing projection and NimiError formatting.
  desktop_consumers:
    - apps/desktop/src/shell/renderer/features/chat/chat-runtime-error-message.ts delegates projection to SDK and keeps i18n resolver glue.
    - apps/desktop/src/shell/renderer/features/runtime-config/runtime-config-provider-commands.ts imports SDK banner formatting directly.
    - apps/desktop/src/shell/renderer/features/runtime-config/runtime-config-connector-test-command.ts imports SDK detail and banner formatting directly.
    - apps/desktop/src/shell/renderer/features/runtime-config/runtime-config-page-cloud.tsx imports SDK banner formatting directly.
