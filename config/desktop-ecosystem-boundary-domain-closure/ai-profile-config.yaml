      evidence: AIProfile config closure record parses as YAML.
    - command: pnpm --filter @nimiplatform/desktop exec tsx --test test/ai-profile-config-domain-boundary.test.ts test/built-in-ai-config-evidence.test.ts test/runtime-config-profile-apply-validation.test.ts test/first-run-local-baseline-authority.test.ts test/first-run-acceptance-evidence.test.ts test/app-first-launch-ai-config.test.ts
      evidence: Desktop domain hardcut, built-in AIConfig evidence, preview-gated profile apply, first-run local baseline, first-run materialization/admission, and app first-launch AIConfig tests pass.
    - command: pnpm --filter @nimiplatform/tester exec node --test test/tester-ai-profile-surface.test.mjs test/tester-contract.test.mjs
      evidence: Tester proves SDK host AIProfile preview/apply behavior and Kit/SDK AIProfile consumption in Settings.
    - command: pnpm --filter @nimiplatform/sdk exec tsx --test test/ai-profile-library.test.ts test/host-ai-profile-surface.test.ts test/runtime/first-run-materialization.test.ts test/host-ai-config.test.ts
      evidence: SDK AIProfile parsing, host AIProfile surface, first-run materialization projection, and scoped host AIConfig behavior pass.
    - command: pnpm --filter @nimiplatform/kit exec vitest run --environment jsdom features/model-config/test/model-config-panel.test.tsx features/model-config/test/use-model-config-profile-controller.test.tsx features/model-config/test/profile-controller-core.test.ts
      evidence: Kit model-config UI/controller/profile core tests pass for preview-gated apply behavior.
    - command: pnpm check:no-ai-profile-provider-model-constants
      evidence: Factory AIProfile consumer paths contain no provider/model default constants outside admitted authority.
    - command: pnpm check:no-fourth-ai-default-owner-surface
      evidence: No renamed fourth AI default owner surface exists in active spec/code.
    - command: pnpm check:no-legacy-imports
      evidence: Legacy import guard passes.
    - command: pnpm check:no-absolute-user-paths
      evidence: Absolute user-home path guard passes.
    - command: git diff --check
      evidence: Patch whitespace passes.
