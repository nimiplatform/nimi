domain: nimi-app-registry-immutable-package-unavailable-projection
authority_posture:
  spec_status: alignment
  authority_owner:
    - .nimi/spec/platform/kernel/nimi-app-admission-contract.md
    - .nimi/spec/platform/kernel/nimi-app-local-admission-contract.md
    - .nimi/spec/runtime/kernel/app-lifecycle-contract.md
    - .nimi/spec/runtime/kernel/app-projection-contract.md
