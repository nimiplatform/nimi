    - sdks/typescript/core/app/registry-transport.ts
    - sdks/typescript/core/app/bridge-projection.ts
    - sdks/typescript/core/app/account-inventory.ts
    - sdks/typescript/runtime/app-lifecycle.ts
    - sdks/typescript/runtime/app-storage.ts
