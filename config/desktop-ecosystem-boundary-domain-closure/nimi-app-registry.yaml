    - kit/shell/tauri/src/platform_projection/apps_packages.rs
    - kit/shell/tauri/src/platform_projection/apps_bridge.rs
  work_type: alignment
  parallel_truth: forbidden
scope:
  included:
    - Platform-owned admitted catalog and release-descriptor discovery projections.
    - Runtime-owned account inventory, optional local-record source, and selector-free immutable-package readiness projection.
    - Desktop Apps read-only composition of catalog, account, local-record, and package-readiness dimensions through SDK owners.
    - Desktop Tauri host materialization of Kit-owned registry, package, and bridge projection records.
    - Developer Mode navigation as the only Desktop Apps entry to the positive 0K local_development lifecycle.
  excluded:
    - Positive immutable install, uninstall, update, repair, promotion, open, install jobs, and job event watches; these remain typed unavailable until 0P/P admission.
    - Production package/import implementation or package-held runnable truth.
    - App-id fallback, renderer-owned lifecycle truth, and Desktop-owned package schema.
audited_globs:
  - apps/desktop/src-tauri/src/apps_registry_projection.rs
  - apps/desktop/src-tauri/src/apps_packages_projection.rs
  - apps/desktop/src/shell/renderer/bridge/runtime-bridge/apps-projection.ts
  - apps/desktop/src/shell/renderer/features/apps/**
  - apps/desktop/test/apps-*.test.ts
  - apps/desktop/test/nimi-app-registry-domain-boundary.test.ts
  - sdks/typescript/core/app/**
  - sdks/typescript/runtime/app-lifecycle.ts
  - kit/shell/tauri/src/platform_projection/apps_registry.rs
  - kit/shell/tauri/src/platform_projection/apps_packages.rs
  - kit/shell/tauri/src/platform_projection/apps_bridge.rs
migrated:
  shared_owners:
    - path: .nimi/spec/platform/kernel/nimi-app-admission-contract.md
      responsibility: Catalog discovery authority and the opaque immutable-package seam; 0K admits no positive immutable package lifecycle.
    - path: .nimi/spec/platform/kernel/nimi-app-local-admission-contract.md
      responsibility: local_development as the sole mutable third-party provenance and the positive Developer Mode lifecycle.
    - path: .nimi/spec/runtime/kernel/app-lifecycle-contract.md
      responsibility: Runtime local record lifecycle and typed-unavailable immutable operation posture.
    - path: .nimi/spec/runtime/kernel/app-projection-contract.md
      responsibility: Runtime account inventory, local-record, storage, and selector-free package-readiness projections.
    - path: sdks/typescript/core/app/**
      responsibility: NimiAppClient read projection, source separation, registry filtering, and bridge payload parsing.
    - path: sdks/typescript/runtime/app-lifecycle.ts
      responsibility: Account inventory, app-keyed storage, and selector-free immutable-package readiness helpers only.
    - path: kit/shell/tauri/src/platform_projection/**
      responsibility: Reusable Tauri registry, package, and bridge projection record builders.
  desktop_consumers:
    - apps/desktop/src-tauri/src/apps_registry_projection.rs is a Kit-backed registry materializer and owns no registry schema.
    - apps/desktop/src-tauri/src/apps_packages_projection.rs reads Runtime GetAppPackageReadiness and owns no install-evidence fallback.
    - apps/desktop/src/shell/renderer/bridge/runtime-bridge/apps-projection.ts consumes the standard platform projection bridge and SDK parser.
    - apps/desktop/src/shell/renderer/features/apps/apps-live-bridge.ts loads SDK catalog rows plus Runtime account inventory and selector-free package readiness; it loads no jobs.
    - apps/desktop/src/shell/renderer/features/apps/apps-panel-projection.ts calls NimiAppClient.list only and projects separate source dimensions.
    - apps/desktop/src/shell/renderer/features/apps/apps-card-actions.ts exposes details and account sign-in only.
    - apps/desktop/src/shell/renderer/features/apps/apps-panel-view.ts routes positive local development to Developer Mode.
legal_desktop_residue:
  - path: apps/desktop/src-tauri/src/apps_registry_projection.rs
    rationale: Desktop may materialize a Kit-owned host projection; it cannot define catalog or admission truth.
  - path: apps/desktop/src-tauri/src/apps_packages_projection.rs
    rationale: Desktop may materialize the Runtime-owned typed-unavailable package seam; it cannot infer install state from files or local evidence.
  - path: apps/desktop/src/shell/renderer/features/apps/**
    rationale: Desktop owns read-only product composition and navigation while SDK, Runtime, and Kit own projection semantics.
regression_guards:
  - apps/desktop/test/nimi-app-registry-domain-boundary.test.ts proves Platform, Runtime, SDK, and Kit ownership and blocks Desktop schema or lifecycle ownership.
  - apps/desktop/test/apps-bridge-projection-bridge.test.ts proves the standard platform projection carrier and SDK parser path.
  - apps/desktop/test/apps-immutable-package-unavailable.test.ts proves physical lifecycle-surface removal, selector-free readiness, no jobs, and Developer Mode as the positive entry.
  - apps/desktop/test/apps-card-state-derivation.test.ts proves inventory, access, and immutable-package state remain separate dimensions.
  - apps/desktop/test/apps-panel-ordinary-visible-projection.test.ts proves read-only ordinary-visible catalog composition.
  - apps/desktop/test/apps-panel-controller.test.ts proves only details, sign-in, and projection retry controller behavior.
prohibited_patterns:
  - target: apps/desktop/src/shell/renderer/features/apps
    absent:
      - apps-lifecycle-bridge.ts
      - apps-ai-profile-section.tsx
      - apps-open-ai-config-gate.ts
      - desktopAppLifecycleBridge
      - NimiRuntimeAppLifecycleClient
      - loadActiveJobs
      - listJobs
      - watchJobEvents
  - target: apps/desktop/src/shell/renderer/features/apps/apps-card-actions.ts
    exact:
      - "AppCardActionId = 'sign_in' | 'details'"
  - target: apps/desktop/src/shell/renderer/features/apps/apps-live-bridge.ts
    required:
      - "loadPackageReadiness: async ()"
    absent:
      - "packageReadiness({ appId"
