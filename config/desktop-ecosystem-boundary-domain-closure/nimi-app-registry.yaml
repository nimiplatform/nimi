    - kit/shell/tauri/src/platform_projection/apps_packages.rs
    - kit/shell/tauri/src/platform_projection/apps_bridge.rs
  responsibilities:
    - Platform spec tables own public Nimi App admission, package kind, ordinary visibility, trust tier references, release descriptor floor, and source/admission status.
    - Kit shell Tauri owns reusable platform catalog and projection builders for registry, packages, and bridge payloads.
    - SDK app owns NimiAppClient read projection, registry transport filtering, bridge payload parsing, and account app-library parser.
    - SDK Runtime owns app lifecycle mutation/read surfaces: install, uninstall, update, healthRepair, open, job projection, event watch, and storage projection.
    - Desktop consumes these shared owners through thin host materializers and product Apps UI composition.
  desktop_consumers:
    - 'apps/desktop/src-tauri/src/apps_registry_projection.rs materializes "~/.nimi/apps/registry.json" with Kit registry projection builders.'
    - 'apps/desktop/src-tauri/src/apps_packages_projection.rs materializes "~/.nimi/apps/packages.json" from selected data root and Runtime install evidence through Kit package projection builders.'
    - kit/shell/tauri/src/standard_platform_projection.rs exposes the shared Apps bridge projection capability backed by Kit projection builders.
    - apps/desktop/src/shell/renderer/bridge/runtime-bridge/apps-projection.ts invokes the standard platform projection bridge and validates the payload with SDK parseNimiAppBridgeProjection.
    - apps/desktop/src/shell/renderer/features/apps/apps-live-bridge.ts constructs SDK NimiAppClient over SDK registry transport.
    - apps/desktop/src/shell/renderer/features/apps/apps-panel-projection.ts composes SDK app rows/status with SDK Runtime appLifecycle jobs/storage.
    - apps/desktop/src/shell/renderer/features/apps/apps-lifecycle-bridge.ts routes all lifecycle mutations through getPlatformClient().runtime.appLifecycle.
  tester_consumers:
    - apps/tester/src/shell/routes/settings.tsx consumes SDK parseNimiAppBridgeProjection and parseAccountAppLibraryRecord in a Tester settings flow.
    - apps/tester/src-tauri/src/main.rs consumes Kit apps_bridge projection builder from a non-Desktop shell.
    - apps/tester/test/tester-contract.test.mjs proves Tester does not fork Desktop apps projection enums or parsers.
    - apps/tester/test/scaffold-boundary.test.mjs keeps ADMISSION as submitted app input rather than public Nimi App admission truth.
legal_desktop_residue:
  - path: apps/desktop/src-tauri/src/apps_registry_projection.rs
    rationale: Desktop owns host-local materialization under "~/.nimi/apps/registry.json"; registry truth and schema validation are Platform/Kit-owned.
  - path: apps/desktop/src-tauri/src/apps_packages_projection.rs
    rationale: Desktop may read selected local data root and Runtime-written install evidence on the same host; package record shape and validation are Kit-owned and lifecycle truth is Runtime-owned.
  - path: apps/desktop/src-tauri/src/account_apps_projection.rs
    rationale: Desktop owns account-scoped app-library display/launch preference projection and fail-closed local file writing; it does not admit apps or define public registry truth.
  - path: apps/desktop/src/shell/renderer/features/apps/**
    rationale: Desktop owns product Apps panel composition, card actions, and UI state; registry/readiness/lifecycle/storage semantics come from SDK and Runtime.
tester_proof:
  - apps/tester/src/shell/routes/settings.tsx uses SDK app bridge and account app-library parsers in a second app.
  - apps/tester/src-tauri/src/main.rs uses Kit apps_bridge projection from Tester shell infrastructure.
  - apps/tester/test/tester-contract.test.mjs guards SDK app parser consumption and blocks local enum copies.
  - apps/tester/test/scaffold-boundary.test.mjs guards Tester as a scaffolded Nimi app whose ADMISSION file is submitted input, not Platform admission truth.
regression_guards:
  - apps/desktop/test/nimi-app-registry-domain-boundary.test.ts blocks Desktop ownership of Nimi App admission, registry schema, release descriptor schema, bridge row shapes, lifecycle mutation, and Tester forked parsers.
  - apps/desktop/test/apps-t4-w5-acceptance.test.ts blocks status_unavailable resurrection, pre-admission ordinary visibility leaks, and default durable-data deletion on uninstall.
  - apps/desktop/test/apps-lifecycle-bridge.test.ts covers Runtime appLifecycle routing and fail-closed lifecycle normalization.
  - apps/desktop/test/apps-panel-ordinary-visible-projection.test.ts covers SDK ordinary-visible projection consumption.
  - sdk/test/app-registry-transport.test.ts covers SDK registry filtering, release descriptor validation, install evidence mapping, and read-only NimiAppClient transport posture.
  - sdk/test/app-bridge-projection.test.ts covers SDK bridge payload parser fail-closed behavior.
  - sdk/test/runtime-app-storage.test.ts and sdk/test/nimi-app-runtime-platform-client.test.ts cover Runtime app storage and Nimi App Runtime platform client surfaces.
  - apps/tester/test/tester-contract.test.mjs and apps/tester/test/scaffold-boundary.test.mjs cover Tester as second consumer.
