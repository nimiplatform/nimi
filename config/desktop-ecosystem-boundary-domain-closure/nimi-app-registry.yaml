scope:
  included:
    - Public Nimi App admission, admitted package kind, ordinary visibility, registry rows, and release descriptor truth.
    - '"~/.nimi/apps/registry.json" and "~/.nimi/apps/packages.json" materialization from Platform catalog truth and Runtime install evidence.'
    - Desktop Apps bridge payload projection into SDK Nimi App transport loader shapes.
    - Desktop Apps panel consumption of SDK NimiAppClient read projection and SDK Runtime appLifecycle jobs/storage/open/install/update/repair.
    - Account app-library projection residue as Desktop account-scoped display/launch preference, not Nimi App admission truth.
    - Tester as a second SDK app projection consumer.
  excluded:
