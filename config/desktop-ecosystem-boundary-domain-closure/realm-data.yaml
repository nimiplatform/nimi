legal_desktop_residue:
  - path: apps/desktop/src/shell/renderer/infra/realm/realm-api.ts
    rationale: Desktop owns app session/error orchestration around the SDK Realm client; it does not define Realm DTOs, endpoint paths, or service contracts.
  - path: apps/desktop/src/shell/renderer/infra/realm/realm-platform-session.ts
    rationale: Desktop owns product auth/session wiring for the renderer Realm client; Realm authority and service APIs remain SDK/Realm-owned.
  - path: apps/desktop/src/shell/renderer/features/chat/data/realm-group-chat-data.ts
    rationale: Desktop adapts product UI calls and authenticated-user state to SDK Realm group chat helpers and SDK Runtime candidate handoff; it must not call GroupChatsService methods directly.
  - path: apps/desktop/src/shell/renderer/features/notification/**
    rationale: Desktop owns notification panel UI state, optimistic read UI, query keys, and action wiring; notification list shape, filters, unread projection, and gift review posture are SDK/Kit-owned.
  - path: apps/desktop/src/shell/renderer/features/settings/**
    rationale: Desktop owns settings page layout and form state; Realm settings/security/account operations are SDK helper calls against getPlatformClient().realm.
  - path: apps/desktop/src/public-web/realm/index.ts
    rationale: Public-web export is a Desktop boundary facade over admitted Realm platform client session helpers, not a parallel Realm transport.
tester_proof:
  - apps/tester/test/tester-contract.test.mjs proves Tester consumes SDK Realm notification, account settings, group chat, media URL, resource upload, endpoint, data sync, and Kit Realm chat attachment projections.
  - apps/tester/test/tester-contract.test.mjs proves Tester consumes Kit Realm human chat and commerce wallet/gift projections.
  - apps/tester/src/shell/routes/settings.tsx renders these projections in a product flow distinct from Desktop chat/settings surfaces.
regression_guards:
  - apps/desktop/test/realm-data-domain-boundary.test.ts blocks Desktop app-owned Realm service facades for group chat, notification, attachments, preferences, and privacy.
  - apps/desktop/test/realm-notification-projection-boundary.test.ts blocks Desktop notification-model resurrection and app-owned notification projection functions.
  - apps/desktop/test/settings-security-flow.test.ts blocks settings/security pages from returning to dataSync and requires SDK Realm helpers.
  - apps/desktop/test/settings-destructive-action-gates.test.ts blocks destructive account actions from dataSync bypass.
  - apps/desktop/test/chat-realtime-url-boundary.test.ts requires SDK Realm realtime URL projection.
  - apps/desktop/test/chat-send-cache.test.ts requires shared Realm merge logic for chat send cache.
  - scripts/check-no-app-realm-rest-bypass.mjs blocks app production `realm.raw/unsafeRaw.request`, literal `/api` paths/URLs, and direct `/api` fetches.
  - sdk/test/realm-group-chat-extension.test.ts proves SDK Realm group chat helpers call typed service facades and fail closed.
  - sdk/test/realm-notifications-extension.test.ts proves SDK Realm notification helpers normalize projections and fail closed.
prohibited_patterns:
  - target: apps/desktop/src/shell/renderer/**
    absent:
      - dataSync.
      - GroupChatsService.
      - NotificationsService.
      - HumanChatsService.
      - ResourcesService.
      - chat-attachment-contract
      - function toNotificationListView
      - function toNotificationItemView
      - realm.unsafeRaw.request
      - realm.raw.request
      - "path: '/api/"
      - "url: '/api/"
      - "fetch('/api/"
verification:
  status: passed-with-known-tooling-drift
  passed:
    - command: node -e "const fs=require('fs'); const yaml=require('yaml'); yaml.parse(fs.readFileSync('config/desktop-ecosystem-boundary-domain-closure/realm-data.yaml','utf8'));"
      evidence: Realm Data closure record parses as YAML.
    - command: pnpm --filter @nimiplatform/desktop exec tsx --test test/realm-data-domain-boundary.test.ts test/realm-notification-projection-boundary.test.ts test/settings-security-flow.test.ts test/settings-destructive-action-gates.test.ts test/chat-realtime-url-boundary.test.ts test/chat-send-cache.test.ts test/notification-panel-actions.test.ts test/post-attachment-flow.test.ts
      evidence: Desktop Realm Data boundary, settings, notification, realtime URL, send cache, and attachment hardcuts pass.
    - command: pnpm --filter @nimiplatform/sdk exec tsx --test test/realm-group-chat-extension.test.ts test/realm-notifications-extension.test.ts
      evidence: SDK Realm group chat and notification extension behavior passes.
    - command: pnpm --filter @nimiplatform/tester exec node --test test/tester-contract.test.mjs
      evidence: Tester second-consumer contract passes for Realm Data projections and Kit Realm helpers.
    - command: pnpm check:no-app-realm-rest-bypass
      evidence: Desktop/Tester production apps do not bypass Realm through app-level REST.
    - command: pnpm check:no-legacy-imports
      evidence: No forbidden legacy/private imports are present.
    - command: pnpm check:no-absolute-user-paths
      evidence: No absolute user path regressions are present.
    - command: git diff --check
      evidence: Patch whitespace passes.
  known_tooling_drift:
    - command: pnpm check:realm-sdk-generator-smoke
      status: failed-before-smoke-validation
      evidence: Realm SDK generated output drift was reported before smoke validation; the command attempted to remove extension exports from sdk/src/realm/index.ts.
      closure_impact: Not a Realm Data ownership blocker for this domain closure; it requires separate SDK generator alignment if this gate is mandatory for broader release validation.
      side_effect: Reverted generated index side effect before committing this domain.
