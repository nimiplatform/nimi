status: legalized
date: "2026-06-01"
domain: product-local-state
authority_posture:
  spec_status: alignment
  authority_owner:
    - .nimi/spec/runtime/kernel/config-contract.md
    - .nimi/spec/platform/kernel/tables/nimi-data-directory-ownership.yaml
    - sdk/src/ai/host-ai-config.ts
    - sdk/src/runtime/runtime-app-storage.ts
    - kit/core/src/storage-json.ts
  work_type: alignment
  parallel_truth: forbidden
scope:
  included:
    - Desktop renderer product-local localStorage preferences and UI selection state
    - Desktop Runtime Config panel UI-only persisted state after Runtime truth is stripped
    - Desktop scoped AIConfig persistence as SDK store consumption
    - Desktop hard cuts for agent behavior storage and saved-post local storage
    - Tester product-local preference and prompt-draft persistence as second consumer of Kit storage helpers
    - Runtime app-storage root projection as second proof that app storage roots are Runtime/SDK-owned
  excluded:
    - Runtime data root selection and managed roots, already closed under runtime-config-local-runtime.
    - Realm account, social, settings, resource, and notification truth, already closed under realm-data.
