domain: kit-overlay-forwarding-shell
closure_result:
  kind: refactor
  migrated_in_this_commit: true
  production_code_changed_in_this_commit: true
  refactor_progress_credit: true
authority_posture:
  spec_status: alignment
  authority_owner:
    - .nimi/spec/platform/kernel/kit-contract.md
    - .nimi/spec/platform/kernel/tables/nimi-kit-registry.yaml
    - kit/AGENTS.md
    - apps/desktop/AGENTS.md
  work_type: alignment
  parallel_truth: forbidden
scope:
  included:
    - Desktop local OverlayShell forwarding shell under apps/desktop/src/shell/renderer/components/overlay.
    - Desktop OverlayShell consumers that still imported the forwarding shell.
    - Misplaced Desktop pure Kit UI primitive behavior test.
    - Tester Kit component gallery as second app consumer proof.
  excluded:
    - Desktop product-specific modal content and user-intent handlers.
    - Admitted public-for-web Desktop facades under apps/desktop/src/public-web.
audited_globs:
  - apps/desktop/src/shell/renderer/components/overlay/**
  - apps/desktop/src/shell/renderer/features/**/*
  - apps/desktop/test/renderer-design-primitives.test.tsx
  - apps/desktop/test/kit-ui-boundary.test.ts
  - apps/desktop/test/kit-shared-primitives-domain-boundary.test.ts
  - kit/ui/test/primitives.test.tsx
  - apps/tester/src/tester/kit-component-gallery.tsx
migrated:
  shared_owner: kit/ui
  responsibility: Kit owns OverlayShell behavior, slots, size mapping, and canonical overlay classes.
  desktop_consumers:
    - apps/desktop/src/shell/renderer/features/explore/quick-add-friend-modal.tsx
    - apps/desktop/src/shell/renderer/features/home/add-friend-modal.tsx
    - apps/desktop/src/shell/renderer/features/notification/notification-reject-gift-dialog.tsx
    - apps/desktop/src/shell/renderer/features/profile/create-post-modal-panels.tsx
    - apps/desktop/src/shell/renderer/features/relationship/profile-detail-dialogs.tsx
  tester_consumers:
    - apps/tester/src/tester/kit-component-gallery.tsx
deleted_desktop_residue:
  - path: apps/desktop/src/shell/renderer/components/overlay/index.ts
    rationale: Thin forwarding shell re-exported Kit UI and created a parallel Desktop import path for shared overlay primitives.
  - path: apps/desktop/test/renderer-design-primitives.test.tsx
    rationale: Pure Kit UI behavior coverage belongs to kit/ui/test/primitives.test.tsx; Desktop keeps only hardcut/boundary tests.
legal_desktop_residue:
  - path: apps/desktop/src/shell/renderer/features/**/*
    rationale: Desktop retains product modal content, localized copy, intent handlers, E2E ids, and screen composition while consuming OverlayShell from Kit.
tester_proof:
  - apps/tester/src/tester/kit-component-gallery.tsx imports and renders OverlayShell in the app-developer component gallery.
regression_guards:
  - apps/desktop/test/kit-ui-boundary.test.ts blocks resurrecting Desktop local Kit UI forwarding shells, including overlay.
  - apps/desktop/test/kit-shared-primitives-domain-boundary.test.ts verifies Desktop imports Kit primitives directly and Tester consumes OverlayShell.
  - kit/ui/test/primitives.test.tsx owns OverlayShell behavior coverage.
prohibited_patterns:
  - target: apps/desktop/src/shell/renderer
    absent:
      - "@renderer/components/overlay"
  - target: apps/desktop/src/shell/renderer/components
    absent_files:
      - overlay/index.ts
verification:
  status: passed
  passed:
    - command: node -e "const fs=require('fs'); const yaml=require('yaml'); yaml.parse(fs.readFileSync('config/desktop-ecosystem-boundary-domain-closure/kit-overlay-forwarding-shell.yaml','utf8'));"
      evidence: Closure record parses as YAML.
    - command: pnpm --filter @nimiplatform/desktop exec tsx --test test/kit-ui-boundary.test.ts test/kit-shared-primitives-domain-boundary.test.ts
      evidence: Desktop hardcut blocks local Kit UI forwarding shells, including overlay, and Tester proof includes OverlayShell.
    - command: pnpm --filter @nimiplatform/kit exec vitest run --environment jsdom ui/test/primitives.test.tsx
      evidence: Kit UI owns OverlayShell behavior coverage.
    - command: pnpm --filter @nimiplatform/tester exec node --test test/tester-contract.test.mjs
      evidence: Tester Kit gallery and app-consumer contract pass.
    - command: pnpm --filter @nimiplatform/desktop typecheck
      evidence: Desktop compiles after direct Kit OverlayShell imports.
    - command: pnpm --filter @nimiplatform/tester typecheck
      evidence: Tester compiles after OverlayShell gallery consumption.
    - command: rg -n "@renderer/components/overlay|components/overlay" apps/desktop/src/shell/renderer apps/tester/src kit/ui/test
      evidence: No Desktop renderer or Tester source imports the removed overlay forwarding shell.
    - command: pnpm check:no-legacy-imports
      evidence: Legacy import guard passes.
    - command: pnpm check:no-absolute-user-paths
      evidence: Absolute user-home path guard passes.
    - command: git diff --check
      evidence: Patch whitespace passes.
