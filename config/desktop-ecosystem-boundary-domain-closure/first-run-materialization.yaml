  authority_owner:
    - sdk/src/runtime/first-run-materialization.ts
    - runtime local environment dependency plan APIs
    - apps/desktop/src/shell/renderer/first-run/runtime-materialization.ts
  work_type: alignment
  parallel_truth: forbidden
scope:
  included:
    - apps/desktop/src/shell/renderer/first-run/runtime-materialization.ts
    - apps/desktop/src/shell/renderer/first-run/index.ts
    - apps/desktop/src/shell/renderer/first-run/first-run-setup-checklist.ts
