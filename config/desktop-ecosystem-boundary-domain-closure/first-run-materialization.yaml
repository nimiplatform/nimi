preflight_violation_inventory:
  platform_truth:
    - finding: Desktop re-exported FIRST_RUN_MATERIALIZATION_CONSUMER_SCOPE from @nimiplatform/sdk/runtime through first-run/runtime-materialization.ts and first-run/index.ts.
      disposition: removed Desktop re-export; Desktop tests import the constant directly from SDK when asserting SDK ownership.
  duplicate_implementation:
    - finding: Desktop tests asserted SDK-owned progress aggregation, transient retry classification, and stale job readiness behavior.
      disposition: moved those behavior assertions to sdk/test/runtime/first-run-materialization.test.ts.
  boundary_imports:
    - finding: Desktop first-run materialization wrapper imports SDK helpers and localRuntime.
      disposition: legal Desktop app wrapper because it only injects localRuntime and maps SDK materialization status to Desktop product-control UI state.
  token_session_runtime_realm_responsibility:
    - finding: Runtime dependency readiness/job truth must remain Runtime-owned and projected by SDK.
      disposition: Desktop retains no Runtime dependency classifier ownership; SDK tests cover materialization behavior and Tester consumes SDK projection helpers.
migrated:
  sdk_owner:
    - path: sdk/src/runtime/first-run-materialization.ts
      responsibility: First-run materialization status, Runtime dependency plan projection, progress aggregation, retryable transient failure classification, repairable dependency classification, and start/cancel/retry/repair request helpers.
  desktop_consumers:
    - path: apps/desktop/src/shell/renderer/first-run/product-control-workflow.tsx
      responsibility: Consumes Desktop wrapper for workflow wiring and product-control state transitions.
    - path: apps/desktop/src/shell/renderer/first-run/first-run-setup-checklist.ts
      responsibility: Consumes SDK progress projection for UI checklist rendering without owning progress math.
  tester_consumers:
    - path: apps/tester/src/shell/routes/settings.tsx
      responsibility: Consumes SDK first-run materialization projection helpers in a separate app surface.
desktop_app_owned_residue:
  - path: apps/desktop/src/shell/renderer/first-run/runtime-materialization.ts
    rationale: App wrapper injects Desktop's localRuntime default and maps SDK materialization status into ProductControlState for Desktop UI flow. It no longer re-exports SDK materialization truth.
  - path: apps/desktop/test/first-run-materialization-resume.test.ts
    rationale: Desktop-only product-control confirmation gating and product-state repair/retry gating.
  - path: apps/desktop/test/first-run-wizard.test.ts
    rationale: Desktop first-run phase rendering and checklist UI projection.
tester_proof:
  - apps/tester/src/shell/routes/settings.tsx imports aggregateMaterializationDownloadProgress, retryableInterruptedFirstRunMaterializationJobs, and repairableFirstRunMaterializationDependencies from @nimiplatform/sdk/runtime.
  - apps/tester/test/tester-contract.test.mjs verifies Tester settings consumes SDK first-run materialization projections.
regression_guards:
  - apps/desktop/test/first-run-materialization-domain-boundary.test.ts blocks Desktop re-export of FIRST_RUN_MATERIALIZATION_CONSUMER_SCOPE and verifies SDK behavior tests stay in SDK.
  - sdk/test/runtime/first-run-materialization.test.ts owns materialization progress, retry, repair, stale job, and Runtime dependency projection behavior.
  - apps/desktop/test/first-run-materialization-resume.test.ts verifies only Desktop product-control gating remains in Desktop.
prohibited_patterns:
  - target: apps/desktop/src/shell/renderer/first-run/runtime-materialization.ts apps/desktop/src/shell/renderer/first-run/index.ts
    absent:
      - "export { FIRST_RUN_MATERIALIZATION_CONSUMER_SCOPE"
  - target: apps/desktop/test/first-run-materialization-resume.test.ts apps/desktop/test/first-run-wizard.test.ts
    absent:
      - "waiting for lock on uv cache"
      - "model file hash mismatch"
      - "job-stale-failed"
      - "aggregateMaterializationDownloadProgress projects Runtime job progress"
