status: legalized
date: "2026-06-01"
domain: desktop-public-web-facade
closure_result:
  kind: legalize_existing_state_plus_scaffold_fix
  migrated_in_this_commit: false
  production_code_changed_in_this_commit: true
  refactor_progress_credit: false
authority_posture:
  spec_status: alignment
  authority_owner:
    - apps/web/AGENTS.md
    - apps/web/README.md
    - apps/desktop/AGENTS.md
  work_type: alignment
  parallel_truth: forbidden
scope:
  included:
    - apps/desktop/src/public-web/**
    - apps/web/src/desktop-adapter/**
    - apps/web/src/web-shell-main.tsx
    - apps/web/vite.config.ts
    - apps/web/tsconfig.json
    - apps/web/test/public-web-boundary.test.ts
  excluded:
    - Desktop renderer product implementation behind the facade.
    - Web landing and legal-page content.
    - Runtime, Realm, SDK, and Kit owner surfaces already tracked by migrated domains.
preflight_violation_inventory:
  platform_truth:
    - finding: apps/desktop/src/public-web contains thin re-export facades.
      disposition: legalized_as_admitted_public_for_web_scaffold_boundary.
      evidence:
        - apps/web/AGENTS.md requires Web source to import Desktop surfaces through @desktop-public/*.
        - apps/web/README.md documents the public-for-web boundary and listed surfaces.
  duplicate_implementation:
    - finding: No duplicate SDK/Kit/Runtime implementation was found in public-web; files expose Desktop app shell surfaces to Web.
      disposition: legal Desktop/Web scaffold facade, not shared owner extraction.
  boundary_imports:
    - finding: Web source has one admitted direct @renderer import for adapter override typing/runtime loading.
      evidence: apps/web/src/desktop-adapter/runtime-bootstrap.web.ts imports @renderer/bridge as an adapter dependency.
      disposition: allowlisted adapter override; ordinary Web source must use @desktop-public/*.
    - finding: Web production build resolved @nimiplatform/kit/telemetry to the kit telemetry source directory instead of its entrypoint.
      evidence_before: pnpm --filter @nimiplatform/web build failed with EISDIR on kit/telemetry/src.
      disposition: fixed Vite alias to exact kit/telemetry source entrypoints.
  token_session_runtime_realm_responsibility:
    - finding: public-web/realm exposes Realm platform session helpers needed by Web shell bootstrap.
      disposition: legal Web shell bridge to Desktop renderer app; Realm truth remains SDK/Realm-owned.
legalized_facades:
  - path: apps/desktop/src/public-web/app/index.ts
    consumer: apps/web/src/web-shell-main.tsx
    classification: admitted public-for-web app entry.
  - path: apps/desktop/src/public-web/i18n/index.ts
    consumer: apps/web/src/web-shell-main.tsx
    classification: admitted public-for-web i18n entry.
  - path: apps/desktop/src/public-web/bridge.ts
    consumer: apps/web/src/desktop-adapter/bridge.web.ts
    classification: admitted public-for-web bridge type/function facade.
  - path: apps/desktop/src/public-web/infra/index.ts
    consumer: apps/web/src/desktop-adapter/runtime-bootstrap.web.ts
    classification: admitted public-for-web infra facade.
  - path: apps/desktop/src/public-web/app-store/index.ts
    consumer: apps/web/src/desktop-adapter/runtime-bootstrap.web.ts
    classification: admitted public-for-web app-store facade.
  - path: apps/desktop/src/public-web/realm/index.ts
    consumer: apps/web/src/desktop-adapter/runtime-bootstrap.web.ts
    classification: admitted public-for-web Realm session facade.
  - path: apps/desktop/src/public-web/styles.css
    consumer: apps/web/src/web-styles.css
    classification: admitted public-for-web renderer styles entry.
tester_proof:
  status: not_applicable
  rationale: No shared owner extraction happened in this domain; Web is the second app/scaffold consumer for Desktop renderer reuse.
regression_guards:
  - apps/web/test/public-web-boundary.test.ts verifies the admitted facade file set, blocks ordinary Web source from importing Desktop internals directly, and requires docs/config to preserve the @desktop-public contract.
  - apps/web/test/public-web-boundary.test.ts verifies Web Vite resolves @nimiplatform/kit/telemetry to a concrete source entrypoint for production builds.
prohibited_patterns:
  - target: apps/web/src
    absent_except_allowlist:
      - "@renderer/*"
      - "@runtime/*"
      - "../desktop/src/**"
  - target: apps/desktop/src/public-web
    absent:
      - runtime/internal
      - runtime/cmd
      - src-tauri
      - "@runtime/"
verification:
  status: passed
  commands:
    - command: pnpm --filter @nimiplatform/web exec tsx --test test/public-web-boundary.test.ts test/runtime-bootstrap.web.test.ts test/bridge.web.test.ts test/web-styles-sources.test.ts
      result: passed
      evidence: 11 tests passed.
    - command: pnpm --filter @nimiplatform/web typecheck
      result: passed
    - command: pnpm --filter @nimiplatform/web build
      result: passed
      evidence: Production build resolves @nimiplatform/kit/telemetry through exact source entrypoint aliases.
    - command: pnpm check:no-legacy-imports
      result: passed
    - command: pnpm check:no-absolute-user-paths
      result: passed
    - command: git diff --check
      result: passed
