# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/runtime/local-compute.authority.yaml
# Rationale: docs/authority/runtime-local-compute-rationale.md
version: 1
table_family: owner_matrix
owner: runtime
matrix_id: runtime_local_environment_source_manifests
rows:
  - manifest_families_1
  - manifest_families_2
  - manifest_families_3
  - manifest_families_4
  - manifest_families_5
  - manifest_families_6
  - manifest_families_7
  - manifest_families_8
  - manifest_families_9
  - manifest_families_10
  - managed promotion requires declared source identity plus hash, digest,
    signature, or equivalent lock proof
  - imported source manifests are valid only for model.asset and
    model.companion-asset
  - imported model paths must not become Python, uv, CUDA, DLL, package-manager,
    or native engine package roots
  - package directories, transfer records, endpoint reachability, and script
    results are not source manifests

# Canonical source manifest schema families for Runtime local environment
# materializers. These schemas define source identity required before managed or
# imported selected source promotion.

manifest_families:
  - manifest_ref: managed-native-engine-package-source
    applies_to:
      - native-engine-package.llama
    required_fields:
      - package_source
      - package_variant
      - platform_tuple
      - archive_url_or_artifact_ref
      - archive_hash
      - executable_candidates
      - runtime_root_class

  - manifest_ref: managed-image-backend-package-source
    applies_to:
      - native-engine-package.stablediffusion-ggml
    required_fields:
      - managed_image_backend_package_entry_id
      - package_source
      - package_format
      - install_dir_name
      - archive_url_or_image_ref
      - archive_hash_or_image_digest
      - executable_candidates
      - launch_mode
      - wrapper_driver
      - dependency_requirements

  - manifest_ref: managed-uv-tool-source
    applies_to:
      - python.tool.uv
    required_fields:
      - tool_id
      - source_kind
      - version
      - platform_tuple
      - executable_artifact
      - archive_url_or_artifact_ref
      - hash_or_signature
      - runtime_root_class

  - manifest_ref: managed-python-runtime-source
    applies_to:
      - python.runtime
    required_fields:
      - python_version
      - selected_uv_record
      - platform_tuple
      - runtime_root_class
      - interpreter_artifact

  - manifest_ref: managed-python-venv-source
    applies_to:
      - python.venv
    required_fields:
      - selected_python_record
      - engine_id
      - backend_family
      - package_lock_hash
      - platform_tuple
      - runtime_root_class

  - manifest_ref: managed-python-package-lock-source
    applies_to:
      - python.package-set
    required_fields:
      - package_lock_id
      - package_lock_hash
      - selected_venv_record
      - critical_import_probes
      - runtime_root_class

  - manifest_ref: managed-torch-wheel-source
    applies_to:
      - python.torch-wheel
    required_fields:
      - torch_version
      - accelerator_plane
      - cuda_abi
      - wheel_index_or_artifact_ref
      - wheel_hash_or_lock
      - selected_venv_record
      - runtime_root_class

  - manifest_ref: managed-cuda-runtime-source
    applies_to:
      - accelerator.cuda.runtime
    required_fields:
      - dependency_id
      - source_kind
      - platform_tuple
      - cuda_major
      - required_artifact_set
      - archive_url_or_system_root
      - archive_hash_or_system_identity
      - driver_compatibility_rule
      - runtime_root_class

  - manifest_ref: managed-or-imported-model-asset-source
    applies_to:
      - model.asset
    required_fields:
      - asset_id
      - source_kind
      - catalog_ref_or_import_ref
      - integrity_hash_or_declared_local_import
      - capability_mapping
      - runtime_root_class

  - manifest_ref: managed-or-imported-companion-asset-source
    applies_to:
      - model.companion-asset
    required_fields:
      - asset_id
      - companion_kind
      - parent_asset_record
      - source_kind
      - catalog_ref_or_import_ref
      - integrity_hash_or_declared_local_import
      - runtime_root_class

rules:
  - managed promotion requires declared source identity plus hash, digest, signature, or equivalent lock proof
  - imported source manifests are valid only for model.asset and model.companion-asset
  - imported model paths must not become Python, uv, CUDA, DLL, package-manager, or native engine package roots
  - package directories, transfer records, endpoint reachability, and script results are not source manifests
