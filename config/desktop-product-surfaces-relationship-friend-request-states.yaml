table_family: state_machine
owner: desktop
machine_id: desktop_relationship_friend_request_model
authority_refs:
  - rule.nimi.desktop.product-surfaces.r032
states:
  - state: received_pending
    description: An inbound friend request addressed to the current account is awaiting resolution. The account may accept or reject it.
  - state: sent_pending
    description: An outbound friend request from the current account is awaiting the other party's resolution. The account may cancel it; it must not be re-sent as a duplicate.
  - state: accepted
    description: The friend request resolved into an active relationship. The relation is available to shared social/profile consumers and is no longer a request.
  - state: rejected
    description: A received friend request was declined by the current account. No relationship is created and no duplicate request is auto-generated.
  - state: cancelled
    description: A sent friend request was withdrawn by the current account before the other party resolved it. No relationship is created.
transitions:
  - from: received_pending
    to: accepted
    guard: The account accepts the inbound request; Realm social admission creates the canonical relationship.
  - from: received_pending
    to: rejected
    guard: The account rejects the inbound request; no relationship is created.
  - from: sent_pending
    to: accepted
    guard: The other party accepts the outbound request; Realm social admission creates the canonical relationship.
  - from: sent_pending
    to: cancelled
    guard: The account cancels its own outbound request before the other party resolves it.
