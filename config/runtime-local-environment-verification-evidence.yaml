# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/runtime/local-compute.authority.yaml
# Rationale: docs/authority/runtime-local-compute-rationale.md
version: 1
table_family: owner_matrix
owner: runtime
matrix_id: runtime_local_environment_verification_evidence
rows:
  - evidence_families_1
  - evidence_families_2
  - evidence_families_3
  - evidence_families_4
  - evidence_families_5
  - evidence_families_6
  - evidence_families_7
  - evidence_families_8
  - evidence_families_9
  - file_existence
  - directory_presence
  - endpoint_reachability
  - transfer_completion
  - package_directory_presence
  - path_precedence
  - import_success_without_lock_identity
  - script_exit_without_structured_evidence
  - ready_system and ready_managed require family-specific evidence plus
    selected source record promotion
  - verification evidence must be persisted or auditable enough for repair,
    retry, activation gate failure, and Desktop/SDK bounded projection
  - failed evidence cannot produce fallback ready without a new selected source
    record

# Canonical verification evidence schema families for Runtime local environment
# selected source promotion.

evidence_families:
  - evidence_ref: accelerator-cuda-runtime-evidence
    applies_to:
      - accelerator.cuda.runtime
    required_fields:
      - canonical_root
      - required_artifact_set
      - version_metadata_or_binary_version
      - driver_compatibility
      - source_manifest_identity
      - selected_source_record

  - evidence_ref: native-engine-package-evidence
    applies_to:
      - native-engine-package.llama
      - native-engine-package.stablediffusion-ggml
    required_fields:
      - declared_package_source
      - archive_hash_or_image_digest
      - canonical_root
      - executable_artifact
      - package_abi_or_wrapper_driver
      - source_manifest_identity
      - selected_source_record

  - evidence_ref: python-tool-uv-evidence
    applies_to:
      - python.tool.uv
    required_fields:
      - canonical_executable
      - version_metadata
      - source_root
      - source_manifest_identity
      - selected_source_record

  - evidence_ref: python-runtime-evidence
    applies_to:
      - python.runtime
    required_fields:
      - selected_uv_record
      - canonical_interpreter
      - python_version
      - source_manifest_identity
      - selected_source_record

  - evidence_ref: python-venv-evidence
    applies_to:
      - python.venv
    required_fields:
      - canonical_venv_root
      - interpreter_binding
      - package_lock_hash
      - source_manifest_identity
      - selected_source_record

  - evidence_ref: python-package-set-evidence
    applies_to:
      - python.package-set
    required_fields:
      - package_lock_hash
      - installed_distribution_set
      - critical_import_probe_results
      - source_manifest_identity
      - selected_source_record

  - evidence_ref: python-torch-wheel-evidence
    applies_to:
      - python.torch-wheel
    required_fields:
      - wheel_source
      - wheel_hash_or_lock
      - torch_version
      - accelerator_abi_compatibility
      - import_probe
      - source_manifest_identity
      - selected_source_record

  - evidence_ref: model-asset-evidence
    applies_to:
      - model.asset
    required_fields:
      - asset_record
      - integrity_hash_or_declared_local_import
      - capability_mapping
      - source_manifest_identity
      - selected_source_record

  - evidence_ref: model-companion-asset-evidence
    applies_to:
      - model.companion-asset
    required_fields:
      - asset_record
      - parent_asset_binding
      - integrity_hash_or_declared_local_import
      - source_manifest_identity
      - selected_source_record

forbidden_ready_inputs:
  - file_existence
  - directory_presence
  - endpoint_reachability
  - transfer_completion
  - package_directory_presence
  - path_precedence
  - import_success_without_lock_identity
  - script_exit_without_structured_evidence

rules:
  - ready_system and ready_managed require family-specific evidence plus selected source record promotion
  - verification evidence must be persisted or auditable enough for repair, retry, activation gate failure, and Desktop/SDK bounded projection
  - failed evidence cannot produce fallback ready without a new selected source record
