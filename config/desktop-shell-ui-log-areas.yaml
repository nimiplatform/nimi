# Non-authoritative Desktop shell UI machine configuration.
# Normative authority: .nimi/spec/desktop/shell-ui.authority.yaml
# Rationale: docs/authority/desktop-shell-ui-rationale.md
table_family: closed_enum
owner: desktop
enum_id: desktop_log_areas
values:
  - runtime
  - renderer-bootstrap
  - bridge
  - realm-data
  - local-ai
  - external-agent
  - auth
  - net
# Desktop Log Areas
# Source class: desktop renderer/runtime log area literals and typed bridge
# telemetry projections. Implementation evidence is admitted through desktop
# renderer and bridge roots, not through retired per-area file paths.

areas:
  - area: runtime
    description: Default area for runtime subsystem logs
    source_rule: D-TEL-001

  - area: renderer-bootstrap
    description: Bootstrap sequence phase logging
    source_rule: D-TEL-001

  - area: bridge
    description: Tauri IPC invoke start/success/fail traces
    source_rule: D-TEL-005

  - area: realm-data
    description: Realm feature-data action errors and API call traces
    source_rule: D-TEL-001

  - area: local-ai
    description: Local AI model lifecycle, inference audit, health probe
    source_rule: D-TEL-001

  - area: external-agent
    description: External agent gateway/token projection
    source_rule: D-TEL-001

  - area: auth
    description: Authentication session lifecycle events
    source_rule: D-TEL-001

  - area: net
    description: Network retry events and error normalization
    source_rule: D-TEL-007
