# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/desktop/agent-projection.authority.yaml
# Rationale: docs/authority/desktop-agent-projection-rationale.md
config_id: desktop_agent_projection_conversation_capabilities
owner: desktop
builder:
  source_rule: rule.nimi.desktop.agent-projection.r055
  inputs:
    - selection_store.selected_bindings
    - runtime.route.list_options
    - runtime.route.resolve
    - runtime.route.check_health
    - runtime.route.describe
projection:
  source_rule: rule.nimi.desktop.agent-projection.r068
  fields:
    - capability
    - selected_binding
    - resolved_binding
    - health
    - metadata
    - supported
    - reason_code
reason_codes:
  source_rule: rule.nimi.desktop.agent-projection.r069
  values:
    - selection_missing
    - selection_cleared
    - binding_unresolved
    - route_unhealthy
    - metadata_missing
    - capability_unsupported
    - host_denied
  priority:
    source_rule: rule.nimi.desktop.agent-projection.r071
    values:
      - host_denied
      - selection_cleared
      - selection_missing
      - capability_unsupported
      - binding_unresolved
      - route_unhealthy
      - metadata_missing
  producer_mapping:
    source_rule: rule.nimi.desktop.agent-projection.r070
    rows:
      - input: selected_binding_key_missing_and_no_admitted_resolution
        reason_code: selection_missing
      - input: selected_binding_null
        reason_code: selection_cleared
      - input: selected_binding_invalid_mismatched_stale_or_resolution_empty
        reason_code: binding_unresolved
      - input: route_health_unavailable_or_unhealthy
        reason_code: route_unhealthy
      - input: route_metadata_missing_or_invalid
        reason_code: metadata_missing
      - input: runtime_capability_unsupported
        reason_code: capability_unsupported
      - input: host_capability_gate_denied
        reason_code: host_denied
voice_workflow:
  source_rule: rule.nimi.desktop.agent-projection.r084
  intents:
    - voice_workflow.voice_clone
    - voice_workflow.voice_design
