    consumer_kind: native_engine_package_variant
    engine: llama
    pack_refs:
      - local-text
    dependency_families:
      - native-engine-package.llama
    activation_gate:
      required_states:
        - ready_system
        - ready_managed
      fail_closed_reasons:
        - engine_package_missing
        - selected_source_record_missing

