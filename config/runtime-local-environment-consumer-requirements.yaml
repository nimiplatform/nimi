# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/runtime/local-compute.authority.yaml
# Authority: .nimi/spec/runtime/local-compute.authority.yaml
version: 1
table_family: owner_matrix
owner: runtime
matrix_id: runtime_local_environment_consumer_requirements
rows:
  - consumers_1
  - consumers_2
  - consumers_3
  - consumers_4
  - consumers_5
  - consumers_6
  - consumers_7
  - consumers_8
  - consumers_9
  - consumers_10
  - consumers_11
  - consumers_12
  - consumers_13
  - consumers_14
  - consumer declarations are table truth; engine-local installers must not add
    hidden dependencies
  - Python pipelines must prove uv, Python runtime, venv, package-set, and Torch
    or driver packages independently
  - speech driver packages are verified as python.package-set evidence and must
    not become engine-local installer truth
  - vulkan_runtime_unavailable and metal_runtime_unavailable are host capability
    projection reasons, not dependency family materializers
  - native image activation must not require Python unless a Python pipeline
    consumer is selected
  - cloud-only usage has no consumer row in this table and must not resolve
    local compute dependencies
  - consumers may consume activation gates and selected source record references
    only; they must not install, repair, or re-resolve dependency sources
  - engine startup, Python pipeline startup, route resolution, and health checks
    must fail closed for missing selected source records instead of
    materializing hidden dependencies
  - CUDA Torch consumers require both python.torch-wheel and
    accelerator.cuda.runtime selected source records; one record must not imply
    the other
  - activation readiness must not be inferred from endpoint reachability, local
    package directories, import success, transfer completion, or script exit

# Canonical local environment consumer requirement declarations.
# Consumers declare requirements; Runtime resolves plans and source records.

consumers:
