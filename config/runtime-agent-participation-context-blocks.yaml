      - realm_group_source
      - oasis_world_participation
      - external_agent_entry
    required_fields:
      - participant_ref
      - identity_source
  - id: recent_group_transcript_projection
    source_rule: K-AGCORE-076
    profiles:
      - realm_group_source
    required_fields:
      - transcript_ref
      - trust_posture
  - id: agent_slot_projection
    source_rule: K-AGCORE-076
