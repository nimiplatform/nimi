      - oasis_world_participation
    required_fields:
      - event_or_transcript_ref
      - trust_posture
  - id: external_participant_identity_ref
    source_rule: K-AGCORE-079
    profiles:
      - external_agent_entry
    required_fields:
      - external_participant_id
      - identity_source
  - id: external_payload_ref
    source_rule: K-AGCORE-079
    profiles:
      - external_agent_entry
    required_fields:
      - payload_ref
      - protocol_kind
  - id: gateway_verdict_ref
    source_rule: K-AGCORE-079
    profiles:
      - external_agent_entry
    required_fields:
      - gateway_verdict_id
  - id: domain_context_ref
    source_rule: K-AGCORE-079
    profiles:
