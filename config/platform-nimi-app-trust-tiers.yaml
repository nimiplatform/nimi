# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/platform/app-ecosystem.authority.yaml
# Rationale: docs/authority/platform-app-ecosystem-rationale.md
version: 1
table_family: product_catalog
owner: platform
catalog_id: platform_nimi_app_trust_tiers
entries:
  - tiers_1
  - tier_id values are closed: nimi-first-party, nimi-verified-partner, nimi-community
  - ecosystem expansion authority governs signature_policy_ref, review_posture_ref, and kill_switch_ref behavior
  - publisher review tier has no Nimi API permission or local principal effect
  - tier_id values must remain stable; no consumer may rename or rotate them silently

# Canonical Nimi App trust tier enum.
# See nimi-app-admission-contract.md (P-NAPP-004) and nimi-ecosystem-contract.md (P-ECO-003).

tier_schema:
  owner: platform_nimi_app_trust_tiers
  fields:
    - tier_id
    - tier_label
    - signature_policy_ref
    - nimi_api_permission_effect
    - review_posture_ref
    - kill_switch_ref
    - identity_assurance_required
    - source_repo_visibility_required
    - source_rule
  enums:
    tier_id:
      - nimi-first-party
      - nimi-verified-partner
      - nimi-community
    identity_assurance_required:
      - unconstrained
      - pseudonymous
      - domain-verified
      - identity-verified
    source_repo_visibility_required:
      - unconstrained
      - public

tiers:
  - tier_id: nimi-first-party
    tier_label: Nimi First-Party
    signature_policy_ref: nimi-first-party-signature-policy
    nimi_api_permission_effect: none_provenance_and_review_only
    review_posture_ref: review-internal
    kill_switch_ref: kill-switch-coordinated
    identity_assurance_required: unconstrained
    source_repo_visibility_required: unconstrained
    source_rule: P-NAPP-004

  - tier_id: nimi-verified-partner
    tier_label: Nimi Verified Partner
    signature_policy_ref: nimi-verified-partner-signature-policy
    nimi_api_permission_effect: none_provenance_and_review_only
    review_posture_ref: review-manual-full
    kill_switch_ref: kill-switch-coordinated
    identity_assurance_required: domain-verified
    source_repo_visibility_required: public
    source_rule: P-NAPP-004

  - tier_id: nimi-community
    tier_label: Nimi Community
    signature_policy_ref: nimi-community-signature-policy
    nimi_api_permission_effect: none_provenance_and_review_only
    review_posture_ref: review-automated-with-manual-kill-switch
    kill_switch_ref: kill-switch-immediate
    identity_assurance_required: pseudonymous
    source_repo_visibility_required: public
    source_rule: P-NAPP-004
