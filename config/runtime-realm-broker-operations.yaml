# Non-authoritative machine configuration (active consumer contract).
# Normative authority: .nimi/spec/runtime/rpc-foundations.authority.yaml
# External Realm authority (cross-repo): realm:spec/realm/core.authority.yaml + realm:spec/realm/feed.authority.yaml + realm:spec/realm/asset.authority.yaml
version: 4
table_family: protocol_surface
owner: runtime
protocol_id: runtime_realm_broker_operations
surfaces:
  - WorldCoreController_discoverPersonaCharacters
  - WorldCoreController_getPersonaCharacter
  - WorldCoreController_getWorldCharacter
  - WorldCoreController_getWorldEntity
  - WorldCoreController_listPersonaCharacters
  - WorldCoreController_listWorldRelationships
  - WorldPublicController_getWorld
  - WorldPublicController_getWorldDetailWithCharacters
  - WorldPublicController_listWorlds
source_rule: K-ACCSVC-023
authority_status: admitted_exact_protected_source_readiness_operations
production_consumption: admitted_exact_rows_only
generic_proxy: forbidden
unlisted_operation_disposition: deny_broker_operation_not_admitted
description: >
  Exact RuntimeAccountService.InvokeRealmUnary admission for protected
  source-readiness journeys. Every row requires either the verified protected
  Desktop account host or the fixed independent bundled Avatar native-host profile,
  plus the current
  authenticated account, Runtime-only Realm bearer custody, the configured
  canonical Realm base, and the row-specific OpenAPI request shape. No other
  Realm operation is admitted by this table. Packet issuance and all raw
  materialization transport stay outside this protected broker.

operation_schema:
  required_fields:
    - operation_id
    - authority_ref
    - http_method
    - path_template
    - request_schema_ref
    - response_schema_ref
    - authorization_profile
    - allowed_runtime_caller_modes
    - protected_transport_ref
    - realm_base_policy
    - response_max_bytes
    - credential_response_policy
    - consumer_refs
    - source_rule
  authorization_profile_values:
    - protected_desktop_source_readiness
    - protected_bundled_avatar_source_readiness
  credential_response_policy_values:
    - forbidden

policy_templates:
  desktop_source_read: &desktop_source_read
    authorization_profile: protected_desktop_source_readiness
    allowed_runtime_caller_modes: [ACCOUNT_CALLER_MODE_DESKTOP_SHELL]
    protected_transport_ref: /nimi.runtime.v1.RuntimeAccountService/InvokeRealmUnary
    realm_base_policy: runtime-configured-canonical-exact
    response_max_bytes: 1048576
    credential_response_policy: forbidden
    source_rule: K-ACCSVC-023
  desktop_and_bundled_avatar_source_read: &desktop_and_bundled_avatar_source_read
    authorization_profile: protected_bundled_avatar_source_readiness
    allowed_runtime_caller_modes:
      - ACCOUNT_CALLER_MODE_DESKTOP_SHELL
      - ACCOUNT_CALLER_MODE_AVATAR_NATIVE_HOST
    protected_transport_ref: /nimi.runtime.v1.RuntimeAccountService/InvokeRealmUnary
    realm_base_policy: runtime-configured-canonical-exact
    response_max_bytes: 1048576
    credential_response_policy: forbidden
    source_rule: K-ACCSVC-023
operations:
  - <<: *desktop_source_read
    operation_id: WorldCoreController_getPersonaCharacter
    authority_ref: realm:spec/realm/core.authority.yaml#rule.realm.core.r007
    http_method: GET
    path_template: /api/realm/core/persona-characters/by-id/{personaCharacterId}
    request_schema_ref: realm-openapi://operation/WorldCoreController_getPersonaCharacter/request
    response_schema_ref: realm-openapi://operation/WorldCoreController_getPersonaCharacter/response
    consumer_refs:
      - apps/desktop/src/shell/renderer/features/source-detail/data/realm-source-detail-data.ts

  - <<: *desktop_source_read
    operation_id: WorldCoreController_getWorldCharacter
    authority_ref: realm:spec/realm/core.authority.yaml#rule.realm.core.r006
    http_method: GET
    path_template: /api/realm/core/world-characters/by-id/{characterId}
    request_schema_ref: realm-openapi://operation/WorldCoreController_getWorldCharacter/request
    response_schema_ref: realm-openapi://operation/WorldCoreController_getWorldCharacter/response
    consumer_refs:
      - apps/desktop/src/shell/renderer/features/source-detail/data/realm-source-detail-data.ts

  - <<: *desktop_source_read
    operation_id: WorldCoreController_getWorldEntity
    authority_ref: realm:spec/realm/core.authority.yaml#rule.realm.core.r005
    http_method: GET
    path_template: /api/realm/core/world-entities/{entityId}
    request_schema_ref: realm-openapi://operation/WorldCoreController_getWorldEntity/request
    response_schema_ref: realm-openapi://operation/WorldCoreController_getWorldEntity/response
    consumer_refs:
      - apps/desktop/src/shell/renderer/features/source-detail/data/realm-source-detail-data.ts

  - <<: *desktop_and_bundled_avatar_source_read
    operation_id: WorldCoreController_listPersonaCharacters
    authority_ref: realm:spec/realm/core.authority.yaml#rule.realm.core.r007
    http_method: GET
    path_template: /api/realm/core/persona-characters
    request_schema_ref: realm-openapi://operation/WorldCoreController_listPersonaCharacters/request
    response_schema_ref: realm-openapi://operation/WorldCoreController_listPersonaCharacters/response
    consumer_refs:
      - apps/desktop/src/shell/renderer/features/explore/data/realm-explore-data.ts
      - apps/avatar/src/shell/renderer/app-shell/app-bootstrap.ts

  - <<: *desktop_source_read
    operation_id: WorldCoreController_discoverPersonaCharacters
    authority_ref: realm:spec/realm/core.authority.yaml#rule.realm.core.r007
    http_method: GET
    path_template: /api/realm/core/persona-characters/discovery
    request_schema_ref: realm-openapi://operation/WorldCoreController_discoverPersonaCharacters/request
    response_schema_ref: realm-openapi://operation/WorldCoreController_discoverPersonaCharacters/response
    consumer_refs:
      - apps/desktop/src/shell/renderer/features/explore/data/realm-explore-data.ts

  - <<: *desktop_source_read
    operation_id: WorldCoreController_listWorldRelationships
    authority_ref: realm:spec/realm/core.authority.yaml#rule.realm.core.r018
    http_method: GET
    path_template: /api/realm/core/worlds/{worldId}/relationships
    request_schema_ref: realm-openapi://operation/WorldCoreController_listWorldRelationships/request
    response_schema_ref: realm-openapi://operation/WorldCoreController_listWorldRelationships/response
    consumer_refs:
      - apps/desktop/src/shell/renderer/features/source-detail/data/realm-source-detail-data.ts

  - <<: *desktop_source_read
    operation_id: WorldPublicController_getWorld
    authority_ref: realm:spec/realm/core.authority.yaml#rule.realm.core.r004
    http_method: GET
    path_template: /api/world/by-id/{worldId}
    request_schema_ref: realm-openapi://operation/WorldPublicController_getWorld/request
    response_schema_ref: realm-openapi://operation/WorldPublicController_getWorld/response
    consumer_refs:
      - apps/desktop/src/shell/renderer/features/world/data/realm-world-data.ts

  - <<: *desktop_source_read
    operation_id: WorldPublicController_getWorldDetailWithCharacters
    authority_ref: realm:spec/realm/core.authority.yaml#rule.realm.core.r004
    http_method: GET
    path_template: /api/world/by-id/{worldId}/detail-with-characters
    request_schema_ref: realm-openapi://operation/WorldPublicController_getWorldDetailWithCharacters/request
    response_schema_ref: realm-openapi://operation/WorldPublicController_getWorldDetailWithCharacters/response
    consumer_refs:
      - apps/desktop/src/shell/renderer/features/world/data/realm-world-data.ts
      - apps/desktop/src/shell/renderer/features/source-detail/data/realm-source-detail-data.ts

  - <<: *desktop_source_read
    operation_id: WorldPublicController_listWorlds
    authority_ref: realm:spec/realm/core.authority.yaml#rule.realm.core.r004
    http_method: GET
    path_template: /api/world
    request_schema_ref: realm-openapi://operation/WorldPublicController_listWorlds/request
    response_schema_ref: realm-openapi://operation/WorldPublicController_listWorlds/response
    consumer_refs:
      - apps/desktop/src/shell/renderer/features/world/data/realm-world-data.ts

forbidden_operation_classes:
  - every_realm_operation_not_listed_in_operations
  - auth_login_refresh_token_exchange
  - credential_or_session_issuance
  - direct_upload_url_or_signed_credential_issuance
  - arbitrary_http_proxy

explicitly_not_admitted:
  - operation_id: WorldPublicController_listWorldCharacters
    authority_ref: realm:spec/realm/core.authority.yaml#rule.realm.core.r006
    reason: no_desktop_source_readiness_consumer
  - operation_id: getExploreFeed
    authority_ref: realm:spec/realm/feed.authority.yaml#rule.realm.feed.r006
    reason: social_feed_is_outside_source_readiness_scope
  - operation_id: createImageDirectUpload
    authority_ref: realm:spec/realm/asset.authority.yaml#rule.realm.asset.r103
    reason: response_may_issue_signed_upload_credentials
  - operation_id: createVideoDirectUpload
    authority_ref: realm:spec/realm/asset.authority.yaml#rule.realm.asset.r103
    reason: response_may_issue_signed_upload_credentials
  - operation_id: createAudioDirectUpload
    authority_ref: realm:spec/realm/asset.authority.yaml#rule.realm.asset.r103
    reason: response_may_issue_signed_upload_credentials
