source_rule: K-ACCSVC-023
authority_status: admitted_exact_protected_runtime_operations
production_consumption: admitted_exact_rows_only
generic_proxy: forbidden
unlisted_operation_disposition: deny_broker_operation_not_admitted
description: >
  Exact RuntimeAccountService.InvokeRealmUnary admission for protected Desktop product journeys and the six Desktop-supervised Local App realm.data operations. Every row requires either the verified protected Desktop account host, the fixed independent bundled Avatar native-host profile, or the verified Local App carrier with a current Runtime-derived operation decision, plus the current authenticated account, Runtime-only Realm bearer custody, the configured canonical Realm base, and the row-specific OpenAPI request shape. No other Realm operation is admitted by this table. Sensitive account and commerce rows remain separately classified. Packet issuance and all raw materialization transport stay outside this protected broker.

operation_schema:
  required_fields:
    - operation_id
    - authority_ref
    - http_method
    - path_template
    - request_schema_ref
    - response_schema_ref
    - authorization_profile
    - allowed_runtime_caller_modes
    - protected_transport_ref
    - realm_base_policy
    - response_max_bytes
    - credential_response_policy
    - source_rule
  authorization_profile_values:
    - protected_desktop_source_readiness
    - protected_bundled_avatar_source_readiness
    - protected_desktop_product
    - protected_desktop_sensitive
    - protected_desktop_commerce
    - protected_local_app_world_core
    - protected_local_app_persona_character_owner
  credential_response_policy_values:
    - forbidden

