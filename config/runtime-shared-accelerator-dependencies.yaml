# Accelerator-specific projection of canonical Runtime local environment
# dependency authority. The canonical cross-family dependency graph, source
# policy, job lifecycle, and selected source schema live in
# `local-environment-dependencies.yaml`, `local-environment-job-states.yaml`, and
# `selected-source-record-schema.yaml`; this file preserves CUDA-specific
# compatibility detail without becoming a parallel truth system.

dependencies:
  - dependency_id: nvidia-cuda-user-space-runtime
    canonical_family_ref: accelerator.cuda.runtime
    dependency_family: accelerator
    accelerator_plane: cuda
    host_profile_refs:
      - windows-amd64-nvidia-cuda
    canonical_source_policy_ref: local-environment-dependencies.yaml#accelerator.cuda.runtime
    source_policy_projection: system-first-managed-fallback
    source_candidates:
      - source_kind: system
        priority: 1
        admission: positive_compatibility_proof_required
      - source_kind: managed
        priority: 2
        admission: explicit_confirmation_before_first_network_materialization
      - source_kind: bundled
        priority: 3
        admission: not_admitted_for_default_consumer_path
      - source_kind: unavailable
        priority: 4
        admission: fail_closed
    version_constraints:
      cuda_major: 12
      driver_compatibility: runtime_must_verify_driver_supports_selected_cuda_runtime
      consumer_abi: selected_consumer_package_must_declare_cuda_abi_compatibility
    required_artifacts:
      - cudart64_12.dll
      - cublas64_12.dll
      - cublasLt64_12.dll
    system_source_policy:
      discovery_hints:
        - nvidia_driver_api
        - cuda_install_registry
        - allowlisted_program_files_roots
        - path_hint_after_canonical_verification
      reject_sources:
        - model_directory
        - import_directory
        - arbitrary_user_selected_directory
        - unverified_path_precedence_only
      required_proof:
        - canonical_root
        - required_artifact_set
        - version_metadata_or_binary_version
        - driver_compatibility
        - selected_source_record
    managed_sources:
      - source_id: sdcpp-master-951-f89d9b1-cuda12.8-win-x64-runtime
        install_dir_name: nvidia-cuda12.8-sdcpp-f89d9b1
        source_owner: runtime_shared_dependency_source
        release_owner: leejet/stable-diffusion.cpp
        release_tag_ref: master-951-f89d9b1
        archive_name: cudart-sd-bin-win-cu12-x64.zip
        archive_url: https://github.com/leejet/stable-diffusion.cpp/releases/download/master-951-f89d9b1/cudart-sd-bin-win-cu12-x64.zip
        archive_sha256: fe20366827d357c00797eebb58244dddab7fd9a348d70090c3871004c320f38d # pragma: allowlist secret
        package_format: direct_archive
        stage_policy: staged_extract_verify_atomic_promote
        product_state: supported
    verification_owner: runtime_local_environment_plan
    activation_policy:
      env: path_prepend_process_only
      persistent_path_mutation: forbidden
      shell_profile_mutation: forbidden
      machine_or_user_cuda_mutation: forbidden
    repair_policy:
      missing_artifact: repair_required
      hash_mismatch: failed
      incompatible_driver: failed
      corrupt_selected_source: repair_required
      activation_during_repair: forbidden
      automatic_reinstall_without_allowed_confirmation: forbidden
    canonical_job_state_ref: local-environment-job-states.yaml
    states_projection:
      - unknown
      - ready_system
      - ready_managed
      - materializable_requires_confirmation
      - queued
      - downloading
      - verifying
      - installing
      - repair_required
      - failed
      - unsupported
      - cancelled
    selected_source_record_ref: selected-source-record-schema.yaml#accelerator.cuda.runtime

