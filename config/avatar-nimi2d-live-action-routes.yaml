# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/canonical/avatar/embodiment-surface.authority.yaml
# Rationale: docs/authority/avatar-embodiment-rationale.md
version: 1
table_family: product_catalog
owner: avatar
catalog_id: avatar_nimi2d_live_action_routes
authority: avatar.kernel.nimi2d_backend
description: >
  Avatar-local live-action route families for the Nimi2D backend. These routes
  are downstream of typed runtime projection and Nimi2D package capability
  evidence. They are not public APML syntax and they do not close Nimi2D
  Generation Bench.

source_authority:
  runtime_projection: .nimi/spec/runtime/kernel/agent-presentation-stream-contract.md
  runtime_activity_ontology: .nimi/spec/runtime/kernel/tables/agent-activity-ontology.yaml
  nimi2d_package_manifest: .nimi/spec/canonical/nimi2d/asset-package.authority.yaml

routes: &avatar_nimi2d_live_action_route_entries
  - route_id: nimi2d_static_visible
    lane: static_layer
    projection_event: avatar.backend.load
    minimum_tier: tier-0_static_layered
    success_condition: default_outfit_visible
    unsupported_semantics: fail_closed

  - route_id: nimi2d_idle_life
    lane: idle_life
    projection_event: runtime.agent.presentation.activity_requested
    runtime_activity_id: idle
    minimum_tier: tier-1_agent_basic
    success_condition: local_idle_motion_composed_without_token_stream
    unsupported_semantics: remain_static_without_success_event

  - route_id: nimi2d_listen_focus
    lane: gesture_motion
    projection_event: runtime.agent.presentation.activity_requested
    runtime_activity_id: listening
    minimum_tier: tier-1_agent_basic
    success_condition: package_motion_primitive_applied
    unsupported_semantics: fail_closed

  - route_id: nimi2d_emote_expression
    lane: expression
    projection_event: runtime.agent.state.emotion_changed
    minimum_tier: tier-1_agent_basic
    success_condition: package_expression_channel_applied
    unsupported_semantics: fail_closed

  - route_id: nimi2d_speak_jaw_amplitude
    lane: speech_mouth
    projection_event: runtime.agent.presentation.voice_playback_requested
    minimum_tier: tier-1_agent_basic
    success_condition: jaw_amplitude_mouth_channel_applied
    unsupported_semantics: silent_mouth

  - route_id: nimi2d_true_viseme
    lane: true_viseme
    projection_event: runtime.agent.presentation.voice_playback_requested
    minimum_tier: tier-2_viseme_gesture
    success_condition: true_viseme_channel_applied
    unsupported_semantics: unsupported_tier1_true_viseme

  - route_id: nimi2d_semantic_full_body
    lane: semantic_full_body
    projection_event: runtime.agent.presentation.motion_requested
    minimum_tier: tier-3_full_body_semantic
    success_condition: full_body_semantic_action_composed
    unsupported_semantics: fail_closed

invariants:
  - "Route ids are Avatar backend route ids, not public APML tags."
  - "Route success depends on package proven_tier and capability profile evidence."
  - "LLM-streamed numeric frame control is forbidden."
  - "Tier-1 true viseme is forbidden success."
  - "Live Action route success cannot replace Nimi2D Generation Bench go/no-go."

entries: *avatar_nimi2d_live_action_route_entries
