# Non-authoritative machine configuration.
# Normative authority: .nimi/spec/platform/app-ecosystem.authority.yaml
# Authority: .nimi/spec/platform/app-ecosystem.authority.yaml
version: 2
table_family: product_catalog
owner: platform
catalog_id: nimi_app_permission_catalog
entries:
  - authority_classes
  - base_entitlements
  - first_party_service_operations
  - public_permissions
  - public_request_shape
  - public_posture
authority_refs:
  - P-PERM-002
  - P-PERM-003
  - P-PERM-007
  - P-PERM-015
  - P-PERM-016
  - P-PERM-017
  - P-PERM-019

authority_classes:
  - id: base_entitlement
    semantics: principal-private Nimi surface required for an admitted app to function; no user permission or manifest declaration
  - id: user_permission
    semantics: durable user decision over Nimi, Realm, Agent, Cognition, or another owner resource
  - id: one_shot_consent
    semantics: owner-issued handle for one explicit picker selection; never a generic durable permission
  - id: app_owned_authority
    semantics: app native-host product domain, including its own SQLite, media, settings, cache, routes, and exact commands
  - id: os_right
    semantics: authority granted by the operating system or an admitted native sandbox; Nimi may constrain or disclose but never simulate control with a permission row

base_entitlements:
  - id: app.private_storage
    owner: runtime
    manifest_declaration: forbidden
    user_prompt: forbidden
    permission_record: forbidden
    boundary: current live local-app session plus Runtime-derived principal and account partition; canonical relative JSON paths, quotas, suffix and symlink/escape policy
  - id: app.opaque_data_partition
    owner: runtime
    manifest_declaration: forbidden
    user_prompt: forbidden
    permission_record: forbidden
    boundary: host-private opaque per-app-per-account partition handle; no raw account id, credential, storage root, or renderer projection
  - id: app.host_commands
    owner: app_native_host
    manifest_declaration: forbidden
    user_prompt: forbidden
    permission_record: forbidden
    boundary: exact app-registered typed commands with origin, URL, payload and collision checks; no protected Nimi-operation proxy
  - id: app.session_posture
    owner: runtime
    manifest_declaration: forbidden
    user_prompt: forbidden
    permission_record: forbidden
    boundary: bounded signed-in posture, generation and typed recovery reason only; no token, credential, raw account profile, principal or session proof
  - id: app.permission_posture
    owner: permission_decision_owner
    manifest_declaration: forbidden
    user_prompt: forbidden
    permission_record: forbidden
    boundary: calling app's public permission ids and public posture only; no raw operation, resource fingerprint, secret, internal decision key, or other-app state
  - id: ai.metering
    owner: runtime
    manifest_declaration: forbidden
    user_prompt: forbidden
    permission_record: forbidden
    boundary: mandatory per-execution usage, budget and policy enforcement; an app cannot request or disable metering
  - id: ai.route_profile_consumption
    owner: runtime
    manifest_declaration: forbidden
    user_prompt: forbidden
    permission_record: forbidden
    boundary: consume the Runtime-selected route/profile only inside an independently authorized AI operation; no provider credential or caller-selected provider/model authority

first_party_service_operations:
  - id: realm.source_materialize
    owner: realm_and_runtime
    authority_rule: P-PERM-014
    third_party_requestable: false
    manifest_declaration: forbidden
    user_permission_record: forbidden
    boundary: authenticated Realm account plus canonical source visibility and readiness, exact CharacterSourceRefV3, fresh Runtime audience challenge, signed Packet v3, current JWKS, replay defense and atomic Runtime commit
    forbidden_authority_inputs:
      - app_id
      - scope_family
      - scope_name
      - qualifier
      - access_grant_id
      - app_permission_grant
      - runtime_local_grant

public_permissions:
  - permission_id: agents.interact
    admission: admitted
    authority_class: user_permission
    decision_owner: runtime
    manifest_allowed: true
    decision_mode: durable_revocable
    selector_owner: runtime
    selector_shape: account_scope_all_local_agents_including_future
    title_key: AppPermissions.agentsInteract.title
    description_key: AppPermissions.agentsInteract.description
    user_semantics: interact with all local Agents in the owner-granted account scope, including future Agents, and receive bounded Runtime-owned state and outputs
    selector_projection: runtime_materialized_opaque_agent_handles_without_pregrant_inventory_or_selector_construction
    internal_operation_families:
      - agent_conversation_open
      - agent_conversation_turn_send
      - agent_conversation_turn_interrupt
      - agent_conversation_turn_subscribe
      - agent_conversation_snapshot
    reserved_scope_extensions:
      - Runtime conversation history for granted Agents, including disclosed cross-surface visibility
      - bounded source and turn summaries
      - bounded companion state and presence
      - calling-app Agent events and redacted delegation read projections
      - Avatar live-instance handoff without raw Avatar control
      - image bytes derived from the calling app's Conversation
    forbidden_operation_families:
      - agent_inventory_before_owner_grant
      - agent_selector_construction
      - principal_substitution
      - direct_avatar_control
      - embedded_avatar_rendering
    invariants:
      - no_zero_permission_full_agent_inventory
      - runtime_materializes_current_and_future_agent_handles_from_account_scope
      - runtime_history_for_granted_agents_is_cross_surface_visible
      - automatic_image_bytes_remain_bound_to_calling_app_conversation
      - generic_artifact_access_requires_artifacts_open
      - voice_requires_agents_voice
      - delegation_decision_requires_agents_delegate
      - microphone_capture_remains_os_right
      - ai_usage_remains_metered
    atomic_publication_requirement: P-PERM-017 applies independently to the currently admitted five-operation slice and every reserved scope extension
  - permission_id: agents.configure
    admission: admitted
    authority_class: user_permission
    decision_owner: runtime
    manifest_allowed: true
    decision_mode: durable_revocable
    selector_owner: runtime
    selector_shape: account_local_agents_scope_intersect_agents_interact
    user_semantics: read complete public Agent Center state and change AI configuration, model configuration, autonomy, and appearance for Agents in the effective agents.interact scope
    internal_operation_families:
      - configuration-snapshot
      - update-configuration
      - readiness-snapshot
      - autonomy-snapshot
      - update-autonomy
      - presentation-snapshot
      - commit-presentation
    invariants:
      - no_provider_credentials
      - no_turn_execution
      - no_avatar_raw_control
      - no_third_party_realm_character_materialization
      - revision_aware_settings
      - agents_interact_revoke_invalidates_effective_grant_but_preserves_owner_history
  - permission_id: agents.voice
    admission: reserved
    authority_class: user_permission
    decision_owner: runtime
    manifest_allowed: true
    decision_mode: durable_revocable
    selector_owner: runtime
    selector_shape: account_local_agents_scope_intersect_agents_interact_and_calling_app_conversation
    user_semantics: transcribe voice and replay voice streams and final voice artifacts for calling-app Conversations with Agents in the effective agents.interact scope
    invariants:
      - microphone_capture_remains_os_right
      - final_voice_artifact_replay_does_not_require_artifacts_open
      - stream_revalidates_effective_grant
      - agents_interact_revoke_invalidates_effective_grant_but_preserves_owner_history
    admission_blocker: transcription, stream playback, final artifact replay, OS-right separation, endpoint enforcement, carrier and SDK surface, combined JIT item, settings, revoke, audit, and atomic publication are not admitted
  - permission_id: agents.delegate
    admission: reserved
    authority_class: user_permission
    decision_owner: runtime
    manifest_allowed: true
    decision_mode: durable_revocable
    selector_owner: runtime
    selector_shape: account_local_agents_scope_intersect_agents_interact_and_calling_app_conversation
    user_semantics: approve or deny pending delegation requests for calling-app Conversations with Agents in the effective agents.interact scope
    invariants:
      - every_decision_requires_explicit_user_presence
      - every_decision_requires_expected_revision
      - every_decision_is_consumed_once
      - completed_external_effects_are_not_reversed_by_revoke
      - agents_interact_revoke_invalidates_effective_grant_but_preserves_owner_history
    admission_blocker: presence, expected-revision and single-consumption enforcement, endpoint mapping, carrier and SDK surface, combined JIT item, settings, revoke, audit, and atomic publication are not admitted
  - permission_id: artifacts.open
    admission: reserved
    authority_class: one_shot_consent
    decision_owner: runtime_artifact_owner
    manifest_allowed: false
    decision_mode: one_shot
    selector_owner: nimi_artifact_picker
    selector_shape: selected_artifact_handle
    user_semantics: open one existing Nimi artifact explicitly selected by the user
    admission_blocker: owner picker and non-forgeable selection proof are not admitted
  - permission_id: account.profile.read
    admission: reserved
    authority_class: user_permission
    decision_owner: realm
    manifest_allowed: false
    decision_mode: durable_revocable
    selector_owner: realm_profile_field_picker
    selector_shape: selected_profile_fields
    user_semantics: read the basic profile fields selected by the user
    admission_blocker: field-level selector and endpoint enforcement are not admitted
  - permission_id: memory.read
    admission: reserved
    authority_class: user_permission
    decision_owner: cognition
    manifest_allowed: false
    decision_mode: durable_revocable
    selector_owner: cognition_memory_picker
    selector_shape: selected_memory_collections_and_time_bounds_intersect_agents_interact
    user_semantics: read only bounded Memory Observatory records from the collections and time ranges selected by the user for Agents in the effective agents.interact scope
    invariants:
      - observatory_read_only
      - server_enforced_record_and_time_bounds
      - no_memory_write
    admission_blocker: public Cognition selector, Agent-scope intersection, bounded Observatory endpoint enforcement, combined JIT item, settings, revoke, audit, and atomic publication are not admitted
  - permission_id: memory.write
    admission: reserved
    authority_class: user_permission
    decision_owner: cognition
    manifest_allowed: false
    decision_mode: durable_revocable
    selector_owner: cognition_memory_picker
    selector_shape: selected_memory_collections
    user_semantics: add or change memory in collections selected by the user
    admission_blocker: public selector and endpoint enforcement are not admitted
  - permission_id: knowledge.read
    admission: reserved
    authority_class: user_permission
    decision_owner: cognition
    manifest_allowed: false
    decision_mode: durable_revocable
    selector_owner: cognition_knowledge_picker
    selector_shape: selected_knowledge_bases
    user_semantics: read knowledge bases selected by the user
    admission_blocker: public selector and endpoint enforcement are not admitted
  - permission_id: knowledge.write
    admission: reserved
    authority_class: user_permission
    decision_owner: cognition
    manifest_allowed: false
    decision_mode: durable_revocable
    selector_owner: cognition_knowledge_picker
    selector_shape: selected_knowledge_bases
    user_semantics: change knowledge bases selected by the user
    admission_blocker: public selector and endpoint enforcement are not admitted
  - permission_id: notifications.send
    admission: reserved
    authority_class: user_permission
    decision_owner: runtime_notification_owner
    manifest_allowed: false
    decision_mode: durable_revocable
    selector_owner: notification_policy_owner
    selector_shape: admitted_channels_and_audience
    user_semantics: send Nimi notifications as the calling app
    admission_blocker: third-party delivery policy and enforcement are not admitted
  - permission_id: notifications.receive
    admission: reserved
    authority_class: user_permission
    decision_owner: runtime_notification_owner
    manifest_allowed: false
    decision_mode: durable_revocable
    selector_owner: notification_policy_owner
    selector_shape: selected_event_classes
    user_semantics: receive selected Nimi events while the app is not active
    admission_blocker: third-party background delivery and enforcement are not admitted
  - permission_id: files.open
    admission: reserved
    authority_class: one_shot_consent
    decision_owner: native_file_picker_owner
    manifest_allowed: false
    decision_mode: one_shot
    selector_owner: native_file_picker_owner
    selector_shape: selected_read_handle
    user_semantics: read one external file explicitly selected by the user
    admission_blocker: common picker handle and cross-shell enforcement are not admitted
  - permission_id: files.save
    admission: reserved
    authority_class: one_shot_consent
    decision_owner: native_file_picker_owner
    manifest_allowed: false
    decision_mode: one_shot
    selector_owner: native_file_picker_owner
    selector_shape: selected_write_handle
    user_semantics: write one external target explicitly selected by the user
    admission_blocker: common picker handle and cross-shell enforcement are not admitted
  - permission_id: realm.library.read
    admission: reserved
    authority_class: user_permission
    decision_owner: realm
    manifest_allowed: false
    decision_mode: durable_revocable
    selector_owner: realm_library_picker
    selector_shape: selected_resource_types_and_ids
    user_semantics: view Realm creations selected by the user
    admission_blocker: public selector, canonical permission record shape and endpoint enforcement matrix are not admitted
  - permission_id: realm.library.manage
    admission: reserved
    authority_class: user_permission
    decision_owner: realm
    manifest_allowed: false
    decision_mode: durable_revocable
    selector_owner: realm_library_picker
    selector_shape: selected_resource_types_and_ids
    user_semantics: change Realm creations selected by the user
    admission_blocker: public selector, canonical permission record shape and endpoint enforcement matrix are not admitted
  - permission_id: realm.publish
    admission: reserved
    authority_class: one_shot_consent
    decision_owner: realm
    manifest_allowed: false
    decision_mode: one_shot
    selector_owner: realm_publish_preview
    selector_shape: selected_destination_and_preview_digest
    user_semantics: publish explicitly previewed content to a selected Realm destination
    invariants:
      - preview_digest_must_match_exact_published_content
      - selected_destination_cannot_expand_after_consent
      - handle_is_single_use_and_expires_before_replay
      - no_durable_publish_grant_or_settings_row
    admission_blocker: owner-controlled publish preview, non-forgeable single-use handle, exact digest/destination enforcement, expiry, audit and replay rejection are not admitted
  - permission_id: ai.background
    admission: reserved
    authority_class: user_permission
    decision_owner: runtime
    manifest_allowed: false
    decision_mode: durable_revocable_with_budget
    selector_owner: runtime_budget_owner
    selector_shape: workload_class_and_budget_ceiling
    user_semantics: continue AI work while the app is not in the foreground
    admission_blocker: visible activity, budget ceiling, cancellation and background policy are not admitted
  - permission_id: shared_resources.open
    admission: reserved
    authority_class: one_shot_consent
    decision_owner: source_resource_owner
    manifest_allowed: false
    decision_mode: one_shot
    selector_owner: source_app_broker
    selector_shape: exported_resource_handle
    user_semantics: open one resource explicitly exported by another app and selected by the user
    admission_blocker: source-owner export broker and non-forgeable handle are not admitted

public_request_shape:
  required_fields:
    - permission_id
    - reason
  optional_fields: []
  host_derived_fields:
    - app_id
    - local_app_principal_id
    - account_id
    - os_user_anchor
  owner_selected_fields:
    - selector
    - selector_digest
  forbidden_caller_fields:
    - app_id
    - account_id
    - principal_id
    - operation_id
    - resource_ref
    - scope_family
    - scope_name
    - qualifier
    - permission_decision_id
    - token
    - credential

public_posture:
  closed_set:
    - prompt
    - pending
    - granted
    - denied
    - unavailable
  internal_lifecycle_states:
    - pending
    - granted
    - denied
    - expired
    - revoked
  internal_states_are_public_api: false
