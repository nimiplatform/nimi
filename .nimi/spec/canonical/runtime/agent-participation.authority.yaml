    relations: []
  - id: definition.nimi.runtime.agent-participation.domain-seam-plane
    kind: definition
    owner: team.runtime
    lifecycle: active
    title: Runtime participation domain seam plane
    meaning: The Runtime participation domain seam plane owns the closed domain future-consumer seam matrix for world and scenario participation, including per-seam typed context admission, domain truth separation, product implementation gates, and pre-promotion write prohibitions.
    relations: []
  - id: definition.nimi.runtime.agent-participation.promotion-plane
    kind: definition
    owner: team.runtime
    lifecycle: active
    title: Runtime participation promotion plane
    meaning: The Runtime participation promotion plane owns explicit candidate promotion boundaries from participation output into durable truth, including the closed promotion target registry, per-target source profile admission, required promotion evidence, and fail-closed promotion invariants.
    relations: []
  - id: definition.nimi.runtime.agent-participation.realm-group-consumer-plane
    kind: definition
    owner: team.runtime
    lifecycle: active
    title: Runtime realm group participation consumer plane
    meaning: The Runtime realm group participation consumer plane owns the Runtime-side consumer binding for Realm group agent participation, including profile reuse, typed Realm group context admission, candidate output lineage, inherited participation policy, room orchestration binding, and the consumer fail-closed boundary.
    relations: []
  - id: rule.nimi.runtime.agent-participation.r108
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Participation profile registry is closed
    modality: must
    scope:
      - runtime.agent-participation
    statement: Participation profile kinds are exactly canonical_agent_chat, realm_group_source, scenario_sandbox, oasis_world_participation, external_agent_entry, and debug_or_probe as pinned in the participation profiles table, each profile is a fixed composition over the closed participation axes rather than a product-local lane name, apps, SDKs, and product domains never extend profile kinds as open strings, an external agent never defaults into the canonical agent chat profile, SANDBOX_PROJECTION identity never aliases NPC_WORLD_ACTOR through profile composition, and canonical agent chat capability grants never carry into another profile through composition defaults.
    condition: Whenever a participation profile is declared, selected, or composed.
    failure: Reject unadmitted profile kinds, open-string extension, and forbidden composition defaults.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.profile-registry-plane
  - id: rule.nimi.runtime.agent-participation.r109
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Canonical chat profile is a reference composition
    modality: must
    scope:
      - runtime.agent-participation
    statement: The canonical_agent_chat profile composes RUNTIME transcript ownership, USER_OWNED_NIMI_AGENT identity, RUNTIME execution, CANONICAL_OWNER_POLICY memory read, CANONICAL_WRITE_ALLOWED memory write, CANONICAL_AGENT_SCOPE capability, TRUSTED_USER input trust, CANONICAL_CHAT output destination, EXISTING_CANONICAL_POLICY promotion posture, and CANONICAL_CHAT_BUDGET concurrency, and references existing RuntimeAgentService authority without rewriting canonical conversation anchors, chat track and life track separation, token budget authority, life track cadence authority, or admitted canonical memory policy.
    condition: Whenever the canonical agent chat profile is composed or consumed.
    failure: Reject canonical profile compositions that deviate from the fixed posture or rewrite referenced authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.profile-registry-plane
  - id: rule.nimi.runtime.agent-participation.r110
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Realm group source profile posture is fixed
    modality: must
    scope:
      - runtime.agent-participation
    statement: The realm_group_source profile represents a Runtime-executed agent reply candidate for a Realm group transcript and composes REALM transcript ownership, USER_OWNED_NIMI_AGENT identity, RUNTIME execution by default, DYADIC_PRIVATE_EXCLUDED memory read, WRITE_NONE memory write, PROFILE_LIMITED capability scope, UNTRUSTED_MULTI_PARTY_TRANSCRIPT input trust, REALM_GROUP_MESSAGE_CANDIDATE output destination, EXPLICIT_CANDIDATE promotion posture, and PER_AGENT_PARTICIPATION_QUEUE concurrency, and Runtime never directly commits Realm group messages because Realm-authenticated commit and anti-spoof validation remain Realm-owned product truth.
    condition: Whenever the realm group source profile is composed or executed.
    failure: Reject deviating compositions and direct Runtime group commits.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.profile-registry-plane
  - id: rule.nimi.runtime.agent-participation.r111
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Domain future profiles compose future-consumer posture
    modality: must
    scope:
