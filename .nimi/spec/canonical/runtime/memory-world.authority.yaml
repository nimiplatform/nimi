    scope:
      - runtime.memory-world
    statement: Any stable World Evolution Engine execution event or envelope contract has its semantic home in this runtime authority rather than workflow, audit, SDK projection, or platform boundary text, such a contract reuses Realm provenance anchors, Realm commit-envelope anchors, and runtime audit correlation floors rather than duplicating them, and no expansion introduces a second commit-envelope contract, a second run-mode vocabulary, a second effectClass vocabulary, a second canonical history contract, or a second audit-truth contract nor redefines Realm run-mode authority, the Realm effectClass vocabulary, Realm commit-envelope authority, or the runtime audit-record schema as semantic truth.
    condition: Whenever a world evolution event or envelope contract is introduced or expanded.
    failure: Reject parallel truth families and Realm or audit redefinition.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.world-evolution-plane
  - id: rule.nimi.runtime.memory-world.r050
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Commit, history, and audit boundaries hold
    modality: must
    scope:
      - runtime.memory-world
    statement: Realm commit authorization and the commit authorization matrix remain Realm-governed, Realm history append remains Realm-governed, runtime audit remains observability and correlation authority, shared kernel commit semantics are limited to adapter-bound commit requests never a new write contract, shared kernel history semantics are limited to explicit append candidates or derived commit artifacts never automatic history truth, and shared kernel replay and checkpoint evidence is never represented as the canonical audit ledger.
    condition: Whenever world evolution work approaches commit, history, or audit authority.
    failure: Reject new write contracts, automatic history truth, and ledger substitution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.world-evolution-plane
  - id: rule.nimi.runtime.memory-world.r051
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Workflow reuse is substrate only
    modality: must
    scope:
      - runtime.memory-world
    statement: The runtime workflow DAG, task, node, and output event model is not the semantic owner of the World Evolution Engine, allowed reuse is limited to implementation substrate such as the workflow status vocabulary, the ordered runtime-local stream traits of sequence, trace_id, timestamp, reason_code, and terminal close behavior, stream transport and subscriber lifecycle, and internal dispatch or queue helpers hidden beneath this authority, workflow, task, node, edge, callback_ref, external_async, route_policy, and fallback are forbidden as top-level world evolution semantics, workflow DAG identity is never exposed as shared kernel semantic identity, workflow output events are never promoted into shared kernel canonical event truth, workflow node payloads and payload Struct alone are never a stable semantic envelope, and an implementation reusing workflow substrate first projects all externally relevant semantics into the world evolution event, stage, checkpoint, replay, supervision, and commit-request vocabulary.
    condition: Whenever workflow substrate is reused for world evolution execution.
    failure: Reject workflow vocabulary and event promotion as world evolution truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.world-evolution-plane
  - id: rule.nimi.runtime.memory-world.r052
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Canonical runtime event shape is minimal and closed
    modality: must
    scope:
      - runtime.memory-world
    statement: The World Evolution Engine event envelope carries eventId, worldId, appId, sessionId, traceId, tick, timestamp, eventKind, stage from the fixed stage vocabulary, actorRefs reused from Realm provenance, causation, correlation, Realm-compatible effectClass, reason, and evidenceRefs, additional event-kind payload remains subordinate to the envelope with payload Struct alone never treated as semantic truth, and schemaId, schemaVersion, scope, runMode, Realm commit authorization results, and history-append authorization results are not canonical runtime event fields and appear only when a later stage derives a commit-request or history-append candidate.
    condition: Whenever a world evolution event envelope is defined or emitted.
    failure: Reject envelope field widening and payload-as-truth events.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.world-evolution-plane
  - id: rule.nimi.runtime.memory-world.r053
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Execution stages separate with fixed ordering
    modality: must
    scope:
      - runtime.memory-world
    statement: World evolution execution uses the fixed semantic stage boundary INGRESS, NORMALIZE, SCHEDULE, DISPATCH, TRANSITION, EFFECT, COMMIT_REQUEST, CHECKPOINT, and TERMINAL, TRANSITION owns runtime-local state evolution and may derive effect intents without executing external effects, EFFECT executes external or observable work without redefining the transition result after the fact, COMMIT_REQUEST may derive Realm-facing mutation candidates without itself claiming canonical Realm mutation authority, CHECKPOINT may persist runtime-local recovery state without being represented as Realm shared present or history truth, and implementations may optimize or batch internal steps only while preserving this semantic ordering.
    condition: Whenever world evolution execution stages run or are reordered.
    failure: Reject cross-stage authority leaks and broken semantic ordering.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.world-evolution-plane
  - id: rule.nimi.runtime.memory-world.r054
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Replay is recorded and fail closed
    modality: must
    scope:
      - runtime.memory-world
    statement: World evolution replay semantics are fixed to recorded replay consuming recorded runtime execution events, recorded supervision outcomes, recorded commit-request outcomes, and recorded checkpoint artifacts, replay never silently substitutes fresh inference, fresh route selection, or fresh fallback decisions in place of recorded execution evidence, missing required replay evidence fails close rather than synthesizing a pseudo-success path, and re-inference replay or hybrid replay stays outside the canonical runtime contract until later explicit authority.
    condition: Whenever world evolution execution is replayed.
    failure: Fail close on missing evidence instead of fresh substitution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.world-evolution-plane
  - id: rule.nimi.runtime.memory-world.r055
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Checkpoints are recovery artifacts only
    modality: must
    scope:
      - runtime.memory-world
    statement: A world evolution checkpoint is a runtime-local recovery artifact containing only runtime-local state required to resume scheduling or supervision plus references to prior runtime event ids, prior commit-request outcomes, and prior checkpoint ids, a checkpoint is never treated as Realm world state, Realm world history, a substitute for commit authorization, or a substitute for audit truth, checkpoint restore restores runtime-local execution context only, and any Realm-visible mutation after restore requires a newly staged explicitly authorized commit path.
    condition: Whenever a checkpoint is written, read, or restored.
    failure: Reject checkpoint promotion to Realm truth or authorization substitute.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.world-evolution-plane
  - id: rule.nimi.runtime.memory-world.r056
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Supervision outcomes are closed and honest
    modality: must
    scope:
      - runtime.memory-world
    statement: World evolution supervision uses the closed outcome set CONTINUE, DEFER, ABORT, and QUARANTINE, optional re-attempt behavior exists only as an internal runtime strategy preserving the same semantic input, the same execution mode, and the same authority boundary, a re-attempt never becomes route migration, fallback migration, or hidden owner migration, and supervision outcomes are runtime-local execution truth represented in runtime events or checkpoint evidence never in Realm canonical truth.
    condition: Whenever supervision decides or re-attempts world evolution work.
    failure: Reject out-of-set outcomes and migration disguised as re-attempt.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.world-evolution-plane
  - id: rule.nimi.runtime.memory-world.r057
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Commit requests stage losslessly under Realm authority
    modality: must
    scope:
      - runtime.memory-world
    statement: A commit-request candidate derives only at COMMIT_REQUEST stage as a lossless projection to the Realm commit envelope fields worldId, appId, sessionId, effectClass, scope, schemaId, schemaVersion, actorRefs, reason, and evidenceRefs, runtime may attach sidecar staging metadata such as sourceEventIds, traceId, tick, causation, correlation, and checkpoint or supervision references that remains runtime-local only and never becomes a second commit-envelope contract, runtime never invents a new runMode vocabulary and never self-authorizes commit eligibility outside the Realm commit authorization matrix, REPLAY and any non-CANON_MUTATION runtime-local continuity path never stage shared-history append as if they were CANON_MUTATION, and missing Realm envelope fields or unverifiable provenance fail close before the candidate is presented as a valid commit path.
    condition: Whenever a Realm-facing commit-request candidate is staged.
    failure: Fail close on missing fields and reject self-authorized or mislabeled staging.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.world-evolution-plane
