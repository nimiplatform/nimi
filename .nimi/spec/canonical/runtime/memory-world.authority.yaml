format: nimicoding.authority/v1
units:
  - id: definition.nimi.runtime.memory-world.canonical-memory-plane
    kind: definition
    owner: team.runtime
    lifecycle: active
    title: Runtime canonical memory plane
    meaning: The Runtime canonical memory plane owns RuntimeAgentService-side canonical memory semantics for agent-facing memory scopes, including canonical review ownership and scheduling, the read-only canonical review status projection, runtime-private chat track sidecar consumption, the runtime-private canonical truth read boundary, dual-phase review commit coordination, and the stabilization boundary between chat and life conversational evidence and canonical memory candidate admission.
    relations: []
  - id: definition.nimi.runtime.memory-world.memory-service-plane
    kind: definition
    owner: team.runtime
    lifecycle: active
    title: Runtime cognition memory service plane
    meaning: The Runtime cognition memory service plane owns the runtime-facing retained memory topology through RuntimeCognitionService and the retained runtime-private memory depth, including bank scope and isolation truth, the provider-agnostic typed memory boundary, embedding profile identity and the memory embedding consume split, the closed public memory operation family, canonical bind and cutover boundaries, replication state, lifecycle, and backlog truth, derived projection lineage and cascade, and retain-time duplicate suppression.
    relations: []
  - id: definition.nimi.runtime.memory-world.memory-substrate-plane
    kind: definition
    owner: team.runtime
    lifecycle: active
    title: Runtime memory substrate plane
    meaning: The Runtime memory substrate plane owns the runtime-private binding between retained runtime-private memory depth and any future admitted memory provider, including provider admission state, the runtime-owned locator and identity overlay, the provider feature floor, substrate failure and replay semantics, public boundary preservation, the RealmSyncBridge ingress boundary, and the runtime-owned derived replay boundary above provider-native storage.
    relations: []
  - id: definition.nimi.runtime.memory-world.knowledge-plane
    kind: definition
    owner: team.runtime
    lifecycle: active
    title: Runtime knowledge projection plane
    meaning: The Runtime knowledge projection plane owns the runtime-local knowledge projection family absorbed into RuntimeCognitionService after the RuntimeKnowledgeService retirement, including knowledge bank and page lifecycle, keyword and hybrid retrieval, same-bank graph and backlink relations, single-document ingest with task polling, workspace binding authorization, the knowledge action scope matrix, and the explicit deferral set for unadmitted knowledge expansions.
    relations: []
  - id: definition.nimi.runtime.memory-world.scheduling-plane
    kind: definition
    owner: team.runtime
    lifecycle: active
    title: Runtime scheduling judgement plane
    meaning: The Runtime scheduling judgement plane owns the non-blocking preflight scheduling evaluation model over the runtime execution semaphore baseline, including the closed judgement state enum, the batch Peek contract, aggregate fold and merge semantics, shared occupancy telemetry, denied hard rules, advisory risk states, the Peek and Acquire relationship, and target-scoped capability and resource hint semantics.
    relations: []
  - id: definition.nimi.runtime.memory-world.world-evolution-plane
    kind: definition
    owner: team.runtime
    lifecycle: active
    title: Runtime world evolution plane
    meaning: The Runtime world evolution plane owns runtime-local World Evolution Engine execution semantics, including the execution event envelope home, execution stage separation, recorded replay, checkpoint recovery, supervision and fault-isolation outcomes, commit-request staging toward Realm-owned commit authority, and the workflow partial reuse boundary, while Realm remains the referenced canonical truth owner for shared world state and history.
    relations: []
  - id: rule.nimi.runtime.memory-world.r001
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Canonical review authority is Runtime owned
    modality: must
    scope:
      - runtime.memory-world
    statement: RuntimeAgentService owns canonical review for agent-facing memory scopes including review scheduling, review token-budget admission, review trigger policy, review executor selection, and truth candidate admission and supersession policy, canonical review for AGENT_CORE, AGENT_DYADIC, and admitted WORLD_SHARED scopes executes through a RuntimeAgentService-owned runtime-private review path using a dedicated runtime-private review executor contract rather than an extension of the admitted life turn result contract, retired public Reflect semantics are never reintroduced as the canonical review scheduler, admitted review output is limited to narrative candidates, truth candidates, optional relation candidates, summary, token usage, and review-window metadata carried on the APML canonical-review root admitted by the runtime agent participation output wire authority with no JSON executor output compatibility, internal library extraction of review storage mechanics transfers no review ownership, scheduling, admission policy, or recovery semantics, and truth candidate admission and conflict handling remain RuntimeAgentService-owned even when retained memory depth persists the resulting state.
    condition: Whenever canonical review is scheduled, executed, or its output admitted.
    failure: Reject review semantics owned outside RuntimeAgentService and out-of-boundary review output.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.canonical-memory-plane
  - id: rule.nimi.runtime.memory-world.r002
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Review status projection is narrow and read only
    modality: must
    scope:
      - runtime.memory-world
    statement: The canonical review status projection is bank-level scheduler and follow-up observability limited to the validated canonical bank locator, review executor availability, the last committed review follow-up id, checkpoint basis, and completion time, the next eligibility time derived from runtime-owned review cadence policy, and whether a recoverable runtime review run blocks fresh scheduling, it derives only from RuntimeAgentService-owned review persistence, committed follow-up rows, and review cadence constants and is never derived by SDKs or apps from memory metadata, summaries, timestamps, UI state, or app-local caches, it never exposes admitted truth state, narrative bodies, prepared review outcomes, or model-facing canonical review input or output payloads, it admits no mutation, redaction, forget, retire, or review execution command, recoverable prepared or memory_committed review runs surface as explicit blocking state rather than ordinary eligibility or pseudo-success, and missing canonical bank state surfaces as explicit BANK_UNAVAILABLE readiness rather than caller-synthesized lifecycle state.
    condition: Whenever canonical review status is projected or consumed.
    failure: Reject widened projections, consumer-derived status, and synthesized lifecycle state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.canonical-memory-plane
  - id: rule.nimi.runtime.memory-world.r003
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Chat sidecar consumption is validated and bounded
    modality: must
    scope:
      - runtime.memory-world
    statement: Runtime-private chat track sidecar parsing and validation remain runtime-owned with renderer or client code never the semantic owner of sidecar payloads, admitted sidecar output is limited to posture patch, emotion update, hook cancellations, typed HookIntent, and canonical memory candidates carried on the APML chat-track-sidecar root admitted by the runtime agent participation output wire authority with no JSON executor output compatibility, sidecar output never admits proactive initiate-chat semantics, arbitrary state mutation, direct world or user mutation, or free-form scheduling logic, typed HookIntent and canonical memory candidates returned by the sidecar pass the same runtime-owned validators used elsewhere on RuntimeAgentService, and invalid sidecar output fails closed without silently mutating committed posture, hook, or memory truth.
    condition: Whenever a chat track sidecar result is parsed or applied.
    failure: Fail closed on invalid sidecar output instead of silent commitment.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.canonical-memory-plane
  - id: rule.nimi.runtime.memory-world.r004
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Canonical truth reads use the private typed facade
    modality: must
    scope:
      - runtime.memory-world
    statement: RuntimeAgentService consumes admitted truths, narrative context, canonical review inputs, and review checkpoints only through the runtime-private typed read boundary provided by retained runtime-private memory depth and never by direct database access, runtime-private truth read surfaces return typed runtime contract data rather than raw store rows or provider-native blobs, the facade may be implemented by a runtime-owned internal memory library only behind the retained runtime-private memory boundary, and prompt assembly may inject admitted truths and narrative context from this read path without that creating a public truth API.
    condition: Whenever canonical truth or review input is read for runtime agent execution.
    failure: Reject direct store access, raw row exposure, and public truth API creation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.canonical-memory-plane
  - id: rule.nimi.runtime.memory-world.r005
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Review commit coordination is dual phase and idempotent
    modality: must
    scope:
      - runtime.memory-world
    statement: RuntimeAgentService submits canonical review outcomes through a single runtime-private commit request identified by review_run_id, retained runtime-private memory depth commits all review-owned narrative, truth, and lineage mutations atomically and idempotently for that review_run_id, RuntimeAgentService publishes follow-up checkpoint, hook, or event truth only after that commit succeeds, the admitted coordination model is idempotent dual-phase coordination and never distributed transaction coupling across Agent Core and retained memory depth, internal library extraction preserves this coordination model rather than collapsing RuntimeAgentService into direct store mutation, and review recovery and coordination never absorb backlog or replay ownership or mutate pending replay truth outside the retained memory depth boundary.
    condition: Whenever a canonical review run commits or recovers.
    failure: Reject non-atomic commits, publication before commit, and coordination-side backlog ownership.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.canonical-memory-plane
  - id: rule.nimi.runtime.memory-world.r006
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Evidence stabilizes before canonical admission
    modality: must
    scope:
      - runtime.memory-world
    statement: Chat transcript, conversation continuity, and life-turn conversational evidence are source evidence inputs and never canonical memory truth by default, runtime-private chat sidecar and life turn outputs emit canonical memory candidates only after RuntimeAgentService-owned stabilization over the current evidence window, explicit same-window self-correction or contradiction is not emitted by default as two conflicting durable canonical candidates from the same evidence window, candidate source_event_id and provenance preserve evidence lineage without implying every intermediate utterance becomes durable memory truth, retain-time dedup remains a downstream concern over stabilized candidates and never the primary owner of immediate conversational correction, and truth admission, supersession, and later derived projection updates remain the downstream path for cross-window correction after durable memory has been committed.
    condition: Whenever conversational evidence approaches canonical memory candidate admission.
    failure: Reject raw transcript persistence as truth and unstabilized conflicting candidates.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.canonical-memory-plane
  - id: rule.nimi.runtime.memory-world.r007
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Standalone cognition ownership stays outside
    modality: must
    scope:
      - runtime.memory-world
    statement: Runtime memory, runtime knowledge projection, and RuntimeAgentService consumption never own standalone cognition semantics, runtime consumption of standalone cognition kernels, prompt context, or advisory outputs remains adapter-owned rather than semantic ownership, runtime never redefines the cognition object model, cleanup semantics, or standalone public surface by implementation convention, runtime memory and knowledge never absorb cognition kernel, prompt, working-state, or routine ownership by implementation convenience, and overlapping record or page mechanics never make retained runtime memory or the retired runtime knowledge topology the continuing owner of cognition memory or knowledge projections.
    condition: Whenever runtime consumes or overlaps with standalone cognition semantics.
    failure: Reject runtime redefinition or absorption of cognition-owned semantics.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.canonical-memory-plane
      - type: applies_to
        target: definition.nimi.runtime.memory-world.knowledge-plane
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-service-plane
  - id: rule.nimi.runtime.memory-world.r008
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Cognition service is the sole public memory owner
    modality: must
    scope:
      - runtime.memory-world
    statement: RuntimeCognitionService is the sole admitted runtime-facing cognition owner surface replacing RuntimeMemoryService and RuntimeKnowledgeService, no second runtime-facing memory or knowledge owner surface remains admitted in steady state beside it, retained runtime-private memory depth stays explicit so topology replacement never collapses RuntimeAgentService, bank and access, provider, replication, workflow, or canonical review truth into cognition by implication, and working memory such as prompt assembly state, tool traces, turn plans, and other runtime execution scratch state remains outside retained runtime memory truth.
    condition: Whenever runtime-facing memory or knowledge topology is defined or consumed.
    failure: Reject second owner surfaces and implicit truth collapse into cognition.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-service-plane
  - id: rule.nimi.runtime.memory-world.r009
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Memory bank scope and isolation are fixed
    modality: must
    scope:
      - runtime.memory-world
    statement: Every memory unit belongs to exactly one bank and banks are isolated from one another, the scope-typed bank locator family carries dedicated owner branches for AGENT_CORE, AGENT_DYADIC, and WORLD_SHARED as canonical agent-facing scopes and APP_PRIVATE and WORKSPACE_PRIVATE as infra-only scopes as pinned in the runtime memory bank scope table, public app-facing bank creation is admitted only for APP_PRIVATE and WORKSPACE_PRIVATE while canonical agent-facing scopes are provisioned only by runtime-owned internal paths, infra scopes are never collapsed into canonical agent memory, WORLD_SHARED continuity is keyed by world with account able to constrain access but never becoming the physical truth owner, internal typed-principal normalization preserves the admitted public locator family, owner-role meaning, and locator-key compatibility, and cross-scope owner combinations never appear as a normal public contract form.
    condition: Whenever a memory bank is created, addressed, or its scope interpreted.
    failure: Reject cross-scope owner shapes, public canonical creation, and account-owned world truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-service-plane
  - id: rule.nimi.runtime.memory-world.r010
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Memory provider boundary stays typed and internal
    modality: must
    scope:
      - runtime.memory-world
    statement: Runtime-facing memory RPC and SDK surfaces expose Nimi-owned operation names and types through RuntimeCognitionService, primary semantic memory payloads use Nimi-owned typed messages with dynamic envelopes limited to metadata, attributes, or extensions fields, the typed memory record family reserves episodic, semantic, and observational records rather than collapsing durable memory into free-form blob payloads, provider-native wire shapes, bank config fields, and provider-specific storage semantics remain internal, extracting memory mechanics into runtime-owned internal libraries is not provider admission and creates no public engine-facing naming or proto layer, memory is explicit opt-in rather than a baseline product capability with the default experimental substrate being runtime-managed Hindsight when enabled without an attached override, retired public Reflect is never reintroduced as a substrate-owned pseudo-review surface, and provider engines never own account authn, app authz, agent ownership, or canonical memory semantics.
    condition: Whenever the runtime memory provider boundary is exposed or crossed.
    failure: Reject provider-native public shapes and provider-owned auth or canonical semantics.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-service-plane
  - id: rule.nimi.runtime.memory-world.r011
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Embedding profile identity is immutable and fail closed
    modality: must
    scope:
      - runtime.memory-world
    statement: A bank may bind embedding_profile null and remains valid operational memory truth without embedding-backed retain, recall, or dedup behavior, a bound non-null profile carries at least provider, model_id, dimension, distance_metric, version, and migration_policy and becomes part of bank identity, bank writes and embedding-backed recalls use the same bound profile with provider engines never silently switching embedding models, any material change to bound profile identity is a bank-identity change rather than route retargeting whose first admitted switching form is runtime-owned create-new-bank-or-generation rebuild plus explicit cutover never silent in-place mutation, runtime-owned embedding execution is the only admitted embedding authority, the resolved profile dimension authority is the runtime model catalog so a text.embed model with no admitted catalog dimension fails close rather than fabricating a dimension or silently retargeting, an execution vector length mismatching the resolved profile dimension fails close and never mutates the resolved profile to match an observed length, and supervised default Hindsight embedding runs through a runtime-owned llama OpenAI-compatible loopback rather than direct external embedding provider configuration.
    condition: Whenever an embedding profile is bound, changed, resolved, or executed against.
    failure: Fail close on identity drift, dimension gaps, and vector mismatch instead of mutation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-service-plane
  - id: rule.nimi.runtime.memory-world.r012
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Embedding intent and resolved truth are split
    modality: must
    scope:
      - runtime.memory-world
    statement: Runtime Agent AI Config owns the agent-instance committed text.embed consume intent for memory, cognition, activity and query, knowledge and retrieval, and future local agent consume paths keyed once per Runtime Local Agent instance using v2 target refs with the retired provider plus model_id durable memory identity not readmitted, Desktop and host surfaces render controls and submit typed mutations through Runtime and SDK only and never own user-editable memory embedding source or binding persistence, standalone cognition may retain standalone profile authority for non-runtime use while RuntimeCognitionService persists no independent runtime embedding intent, runtime is the only admitted owner of resolved embedding profile, binding legality and readiness, bank identity, rebuild, migration, and cutover state, the resolved profile preserves the typed runtime execution binding carrying connector_id, remote_model_catalog_id, provider_model_id, and provider for cloud source or the v2 local binding through profile_binding_id or readiness_ref for local source in addition to provider, model, and dimension facts, runtime embedding execution consumes that typed binding and fails close when it is absent rather than reconstructing a target from version, raw model_id, or the retired connector and model pair, and renderer-local heuristics, local-asset presence checks, or host convenience projections are never reinterpreted as runtime bank truth.
    condition: Whenever memory embedding intent is committed, resolved, or executed.
    failure: Fail close on missing typed bindings and reject host-owned intent persistence.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-service-plane
  - id: rule.nimi.runtime.memory-world.r013
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Realm replication keeps local authority and observable conflicts
    modality: must
    scope:
      - runtime.memory-world
    statement: Runtime local memory is the operational authority while Realm remains the replicated persistence and governance plane whose ownership is defined by Realm authority and referenced not redefined here, RealmSyncBridge is runtime-owned and provider-independent, replication into Realm preserves explicit provenance and version history, conflict handling stays observable and auditable with silent overwrite merge never admitted, app or SDK code never bypasses runtime to mutate agent canonical memory once runtime-owned memory authority is active, moderation or governance invalidation committed in Realm propagates down into runtime local memory, and runtime never continues serving a locally cached canonical memory item as valid after observing a replicated invalidation nor overrides or ignores an admitted replicated governance decision.
    condition: Whenever runtime memory replicates to or observes governance from Realm.
    failure: Reject silent merges, bypass writes, and served-after-invalidation reads.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-service-plane
  - id: rule.nimi.runtime.memory-world.r014
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Public memory family is closed on cognition
    modality: must
    scope:
      - runtime.memory-world
    statement: The runtime-facing public memory family is exactly CreateBank, GetBank, ListBanks, DeleteBank, Retain, Recall, History, DeleteMemory, and SubscribeMemoryEvents admitted only on RuntimeCognitionService and never written back as a separate future public service, Reflect is retired from the public steady-state surface and survives only as a re-audit baseline for the cutover, app-facing access remains infra-scoped while canonical agent-facing scopes stay runtime-private and are never widened back into a public memory service by migration convenience, app-facing bank creation may omit an embedding profile with the null-profile truth preserved, runtime-facing memory reads may expose additive narrative projections while canonical truth, review admission, and replication truth remain outside the public service surface, and internal library extraction never recreates RuntimeMemoryService as a second public owner surface.
    condition: Whenever the public memory operation family is exposed or extended.
    failure: Reject out-of-family public operations and canonical scope widening.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-service-plane
  - id: rule.nimi.runtime.memory-world.r015
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Canonical bind and cutover stay on typed runtime paths
    modality: must
    scope:
      - runtime.memory-world
    statement: The private loopback HTTP convenience path for canonical bind is not the admitted steady-state product contract, Desktop and app consumers read and write Runtime Local Agent memory embedding consume intent only through Runtime Agent AI Config typed SDK surfaces, they inspect resolved memory embedding state and request canonical bank bind, rebuild, or cutover only through admitted runtime memory and RuntimeCognitionService typed surfaces, the public cognition memory family is never expanded by migration convenience just to expose canonical agent-facing bank control, and canonical agent-facing bind, rebuild, and cutover semantics remain on runtime-private typed paths owned by retained runtime-private memory depth.
    condition: Whenever canonical bank bind, rebuild, or cutover is requested by a host.
    failure: Reject convenience transports and public family expansion for canonical control.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-service-plane
  - id: rule.nimi.runtime.memory-world.r016
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Private embedding operation family is minimal and explicit
    modality: must
    scope:
      - runtime.memory-world
    statement: Retained runtime-private memory depth provides exactly the typed logical operations InspectMemoryEmbeddingState, RequestCanonicalMemoryEmbeddingBind, and RequestMemoryEmbeddingCutover as a runtime-private typed boundary rather than a new public RPC family or a second embedding intent owner, hosts never persist or replay the text.embed intent through localStorage, renderer stores, app-local config files, or per-request snapshots, InspectMemoryEmbeddingState returns typed runtime contract data covering at least the current intent resolution verdict and config_revision, the resolved embedding profile identity or a fail-close unavailable result, current canonical bank binding status, pending rebuild, generation, or cutover state, and explicit unavailable or blocked reasons, request payloads carry explicit runtime target identity whenever host-facing config scope cannot uniquely determine the canonical bank lifecycle owner with no inference from active app scope, renderer-local selected agent, or convenience default bank, RequestCanonicalMemoryEmbeddingBind performs only runtime-owned bind admission executing first canonical bind when the bank is unbound and the intent resolves, an idempotent no-op or typed already-bound success when the resolved profile matches existing bank identity without minting second bank truth, and the runtime-owned rebuild or generation path expressing the switch as pending cutover on material identity change never silent in-place rebinding, host bridges may expose these operations as host logical methods while retained runtime-private memory depth stays the semantic owner, and RequestMemoryEmbeddingCutover commits explicit cutover only when the admitted rebuild or generation result is ready and fails close otherwise.
    condition: Whenever the runtime-private memory embedding operation family is invoked.
    failure: Fail close on unready cutover and reject inferred targets and host intent replay.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-service-plane
  - id: rule.nimi.runtime.memory-world.r017
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Memory unavailability fails closed with explicit reasons
    modality: must
    scope:
      - runtime.memory-world
    statement: When the explicitly enabled memory engine, embedding bridge, or required local memory substrate is unavailable, dependent RPCs fail with UNAVAILABLE and the explicit runtime reason stays explicit including AI_LOCAL_SERVICE_UNAVAILABLE when the managed local memory service is unavailable, no substitute provider, synthetic success payload, or degraded shadow engine masks the failure, introducing a runtime-owned internal library boundary never weakens or reinterprets these fail-close outcomes, provider-dependent operations surface the same UNAVAILABLE failure family when no admitted memory provider is installed, and when Realm replication is unavailable local operational writes continue only when local admission succeeds and sync backlog remains observable never hidden as fully synchronized success.
    condition: Whenever a required memory substrate, engine, or replication path is unavailable.
    failure: Fail with explicit UNAVAILABLE reasons instead of substitutes or pseudo-success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-service-plane
  - id: rule.nimi.runtime.memory-world.r018
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Replication state is typed with observable outcomes
    modality: must
    scope:
      - runtime.memory-world
    statement: Append-only commit lineage is the default replication model, each replicated write retains an observable version basis for merge or invalidation handling, replication state remains externally distinguishable as at least PENDING, SYNCED, CONFLICT, or INVALIDATED as pinned in the runtime memory replication outcome table, governance or moderation invalidation from Realm produces an explicit invalidation outcome rather than silent disappearance, and implementation-facing transport exposes typed replication state, conflict detail, and invalidation detail families as first-class runtime contract data never provider-native opaque text.
    condition: Whenever memory replication state is recorded or exposed.
    failure: Reject silent disappearance and opaque untyped replication state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-service-plane
  - id: rule.nimi.runtime.memory-world.r019
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Replication lifecycle transitions are committed truth
    modality: must
    scope:
      - runtime.memory-world
    statement: Replication observation ingress is runtime-private and requires no new public RPC surface, runtime mutates replication state only through admitted typed MemoryReplicationState families never free-form provider blobs, committed replication transitions update the authoritative record replication state before publication so read APIs and event replay observe the same truth, MEMORY_EVENT_TYPE_REPLICATION_UPDATED originates from the committed record mutation path never snapshot inference or accepted-write decoration, admitted transitions are PENDING to SYNCED, CONFLICT, or INVALIDATED and CONFLICT to SYNCED or INVALIDATED with SYNCED and INVALIDATED terminal unless a later rule explicitly admits otherwise, and invalidated records fail closed out of default history and recall visibility until the caller explicitly opts into invalidated results.
    condition: Whenever a replication lifecycle transition is committed or published.
    failure: Reject undeclared transitions, decorated events, and default invalidated visibility.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-service-plane
  - id: rule.nimi.runtime.memory-world.r020
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Replication backlog is committed single-owner truth
    modality: must
    scope:
      - runtime.memory-world
    statement: The replication backlog for canonical memory records whose replication remains operationally pending is runtime-local committed state never transient goroutine state or inferred scheduler memory, canonical writes admitting replication pending enqueue exactly one backlog item for the bank locator plus memory_id pair in the same committed local mutation path, infra scopes never enter the replication backlog, backlog items retain at least local version, basis version, enqueue time, last attempt time, attempt count, and local backlog status, backlog claim and replay ownership remains on retained runtime-private memory depth with internal helper extraction creating no second backlog or replay owner, backlog truth remains deferred bridge telemetry never product-ready cloud sync until a later Realm memory redesign admits real bridge transport, runtime-private bridge loops claim backlog items for single-owner processing only on explicit internal paths with normal daemon startup implying no active Realm synchronization, and terminal replication outcomes remove or terminalize the corresponding backlog item in the same committed state transition.
    condition: Whenever replication backlog items are enqueued, claimed, or terminalized.
    failure: Reject duplicate or infra backlog items, second owners, and implied active sync.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-service-plane
  - id: rule.nimi.runtime.memory-world.r021
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Derived projections keep lineage and cascade fail closed
    modality: must
    scope:
      - runtime.memory-world
    statement: Retained runtime-private memory depth owns narrative projection storage, local truth storage, source-junction lineage for derived outputs, and cascade mutation of derived outputs after canonical delete, invalidation, or supersession while owning neither canonical review scheduling, truth admission policy, nor posture policy, derived projections retain explicit lineage back to canonical source records as a non-optional property committed before publication of derived results, lineage rows soft-deactivate on cascade rather than hard-deleting audit history by default, canonical delete, governance invalidation, or admitted dyadic delete invalidates dependent derived outputs immediately and fails them closed out of default serving paths, canonical supersession prefers stale over silent delete for derived outputs whose canonical source lineage remains valid unless a stricter invalidation rule applies, invalidated and stale are not interchangeable with stale narrative projections remaining additive explicitly stale adaptation lag never silently treated as an admitted truth row or canonical source record, later runtime-owned review or decay policy may suppress, replace, or down-rank stale projections without silently promoting narrative projection into canonical memory, and runtime-facing cognition recall may expose admitted narrative projections while admitted truths remain runtime-private and are consumed through RuntimeAgentService-owned internal paths only.
    condition: Whenever derived memory projections are stored, cascaded, or served.
    failure: Reject lineage-free derivations, silent promotion, and default invalidated serving.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-service-plane
  - id: rule.nimi.runtime.memory-world.r022
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Retain-time duplicate suppression is narrow and conservative
    modality: must
    scope:
      - runtime.memory-world
    statement: Retain-time duplicate suppression is admitted only for banks with a non-null bound embedding profile, remains same-bank only without widening into cross-bank matching, remains conservative reusing an existing retained row only when the runtime can determine a stabilized semantic candidate is materially the same memory under the admitted first-slice rule of strict normalized semantic subject, predicate, and object equality inside the same eligible bank, returns the existing retained row in RetainResponse rather than mutating that row in place, preserves existing canonical row immutability without silently rewriting prior payload, provenance, or version lineage, requires no updates or extends relation admission, owns neither dialogue-window stabilization before candidate admission nor in-place canonical rewriting nor structural relation admission, and never publishes MEMORY_EVENT_TYPE_RECORD_RETAINED as if a new canonical row were inserted when reusing an existing retained row.
    condition: Whenever retain-time duplicate suppression evaluates a stabilized candidate.
