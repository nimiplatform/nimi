    statement: Runtime derives one dependency environment key per required dependency family from canonical dependency authority where the CUDA accelerator runtime keys on dependency id, host profile id, platform tuple, and runtime data root, the native llama engine package keys on engine id, package variant, platform tuple, and data root, the native stablediffusion-ggml engine package adds the backend family, the uv tool keys on tool id, platform tuple, and data root, the Python runtime keys on Python version, platform tuple, and data root, the venv keys on engine id, backend family, Python version, package lock hash, platform tuple, and data root, the package set keys on engine id, backend family, package lock hash, platform tuple, and data root, the Torch wheel keys on Torch version, accelerator plane, CUDA ABI, platform tuple, and data root, the model asset keys on asset id, model family, and data root, and the companion asset keys on asset id, parent asset id, companion kind, and data root, dependency environment identity is canonical with consumer membership projected through the activation gate and the record selected consumers, consumer scope is not key material unless a dependency family explicitly admits consumer-scoped selected source ownership, and the model and companion families persist semantic identities without local record handles, route-local handles, or string namespaces.
