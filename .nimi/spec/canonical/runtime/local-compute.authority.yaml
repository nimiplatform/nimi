    scope:
      - runtime.local-compute
    statement: Activation state resolves in the priority order of unsupported, then repair_required, then failed, then cancelled, then setup_in_progress, then setup_required, then ready, the queued, downloading, verifying, and installing dependency states project setup_in_progress, the unknown and needs_confirmation states project setup_required, and non-ready states never project active, degraded-ready, best-effort-ready, endpoint-ready, or import-ready.
