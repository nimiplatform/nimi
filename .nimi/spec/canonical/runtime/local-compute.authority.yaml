      - runtime.local-compute
    statement: The llama engine config namespace admits typed optional keys where ctx_size is an integer bounded 512 through 1048576 projecting --ctx-size, cache_type_k and cache_type_v take the closed cache quantization enum projecting --cache-type-k and --cache-type-v, flash_attn is tri-state on, off, or auto projecting --flash-attn, mmproj is an existing relative gguf path projecting --mmproj, and n_gpu_layers is a non-negative integer projecting --n-gpu-layers, invalid values for known keys fail registration closed rather than being silently dropped, unknown keys inside the namespace are ignored for forward compatibility while entering audit detail, an unset ctx_size leaves the server default without runtime enlargement of the context window, mmproj resolves relative to the models root and never escapes it, and multiple mmproj candidates in the bundle file list without an explicit mmproj selection fail registration closed.
