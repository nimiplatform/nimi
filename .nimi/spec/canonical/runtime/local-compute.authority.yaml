    scope:
      - runtime.local-compute
    statement: RuntimeLocalService owns the runtime baseline reference for product first-run ready admission as durable evidence rather than a route probe id, file path, process health result, or renderer-supplied string, the reference is valid only when it resolves the selected first-run local factory profile reference and install level, the selected runtime data root reference, all required dependency families and selected source record ids for the selected baseline, activation responses showing every required dependency ready_system or ready_managed for each required consumer, the materialization job terminal evidence or system-source verification evidence behind the selected records, and the observation time, Runtime verifier identity, and audit sequence, materialization success alone is never readiness with the reference minted only after activation succeeds for the selected baseline and previous materialization terminal states never reused without fresh activation verification, and file existence, endpoint reachability, route health checks, process liveness, import success, transfer completion, script exit, warmup success, or previous health success never mint or satisfy the reference.
