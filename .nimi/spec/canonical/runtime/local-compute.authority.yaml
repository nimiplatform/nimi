    scope:
      - runtime.local-compute
    statement: Engine startup, Python pipeline startup, route resolution, provider health checks, passive import review, SDK reads, Desktop page load, and background maintenance never perform first heavy or network materialization, missing uv, Python runtime, venv, package set, Torch wheel, native engine package, model asset, or companion asset readiness projects Runtime setup, confirmation, failed, unsupported, cancelled, or repair state, ordinary users are never instructed to install these dependencies through a system package manager, global Python environment, user PATH, machine PATH, shell profile, or engine-private directory, and visible terminal or external package-manager flows exist only as diagnostic export never as dependency state truth.
    condition: Whenever a passive surface encounters missing local dependencies.
    failure: Reject silent heavy materialization and ordinary-user manual installation instructions.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.environment-materializer-plane
  - id: rule.nimi.runtime.local-compute.r087
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Import-derived records are model families only
    modality: must
    scope:
      - runtime.local-compute
    statement: Explicit local imports may produce selected source records only for the model asset and companion asset families, imported paths never become Python, uv, CUDA, DLL, package-manager, Torch, or native engine package roots, and native stablediffusion-ggml source candidates link to the managed image backend package registry while selected source record promotion stays owned by the local environment materializer without inference from engine startup branches, command-line backend installers, or ad hoc code paths.
    condition: Whenever imports or package registries interact with selected source records.
    failure: Reject import-derived non-model records and promotion outside the materializer.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.environment-materializer-plane
  - id: rule.nimi.runtime.local-compute.r088
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Materializer projection preserves non-ready states
    modality: must
    scope:
      - runtime.local-compute
    statement: RuntimeLocalService owns the app-facing materializer projection and command surface that reads the materializer registry for dependency families, resolves source candidates and source manifests from Runtime authority, projects current selected source summaries with bounded diagnostics, projects confirmation payloads covering the dependency family, known size, storage category, and no-system-mutation policy before first network or storage-heavy materialization, starts, observes, cancels, retries, and repairs materializer jobs by dependency environment and Runtime job id, and projects activation gate failures without probing or installing dependencies, the projection preserves the non-ready distinction among needs_confirmation, queued, downloading, verifying, installing, repair_required, failed, unsupported, and cancelled, and product-facing setup-required or confirmation text stays a projection of needs_confirmation never a ready state.
    condition: Whenever the materializer projection or command surface is served.
    failure: Reject collapsed non-ready states and confirmation text treated as readiness.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.environment-materializer-plane
  - id: rule.nimi.runtime.local-compute.r089
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Terminal jobs carry typed dispositions
    modality: must
    scope:
      - runtime.local-compute
    statement: Terminal dependency jobs project typed reason code and recovery disposition fields in addition to bounded diagnostic detail, failure detail stays human and debug context that SDK, Desktop, tester, and app consumers never parse to decide retry, auto-recovery, repair, or setup-state transitions, Runtime owns the classification of interrupted, manual-retry, repair-required, unsupported, and not-retryable outcomes, and local transfer records appear only as progress or diagnostic detail never targeting materializer commands, creating selected source records, or projecting readiness.
    condition: Whenever a dependency job terminates or transfer detail is projected.
    failure: Reject untyped terminals, consumer-parsed failure text, and transfer-driven readiness.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.environment-materializer-plane
  - id: rule.nimi.runtime.local-compute.r090
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Download progress projection is bounded and honest
    modality: must
    scope:
      - runtime.local-compute
    statement: The dependency job projection carries bytes received as fetched on-disk bytes including any resumed prefix, bytes total as the known final size or zero when unknown, percent as an integer zero through one hundred projected only when the total is known with unknown totals rendering an indeterminate affordance rather than a fabricated percentage, speed in bytes per second computed only from positive observed bytes over positive elapsed time and otherwise absent, and ETA seconds projected only when total, speed, and remaining bytes are all positive and otherwise absent, the fields are meaningful only while a job actively transfers in downloading or verifying and project zero or absent for every other state without back-filling, carry-over, or fabrication, consumers gate percentage, rate, and ETA display on the transferring states and treat zero rate or ETA as not yet known rather than stalled, and the progress projection is an additive non-breaking detail that never changes job lifecycle, selected-source promotion, activation, or readiness semantics with bytes never promoting, selecting, or substituting for verification evidence.
    condition: Whenever dependency job download progress is projected or rendered.
    failure: Reject fabricated progress values and progress-derived readiness or selection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.environment-materializer-plane
  - id: rule.nimi.runtime.local-compute.r091
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Install-level plan resolution is deterministic
    modality: must
    scope:
      - runtime.local-compute
    statement: Local environment plan resolution accepts an optional install level of minimal or recommended where a set install level without an explicit asset id resolves the pack model asset and companion asset dependencies internally through the deterministic curated-preset resolver from the preset plus host posture, an explicit asset id always wins and an unset install level preserves explicit-identity behavior, a compute pack may host multiple preset model slots so install-level resolution emits one model asset dependency per resolved hosted-slot capability each carrying its resolver-filled asset id and one companion dependency per resolved companion of those slots without key collisions because model asset keys derive from the asset id, the pack to hosted-capability relation is explicit Runtime authority mapping the local text pack to text generation, the local speech pack to transcription plus synthesis, and the local native image pack to image generation and is never keyed on consumer scope, and a resolver fail-close leaves the dependency in unsupported state carrying the typed resolver reason code and a non-empty stable pack default dependency id never projected as a ready or startable dependency.
    condition: Whenever install-level plan resolution runs or its dependencies are emitted.
    failure: Reject nondeterministic slot resolution, consumer-scope keying, and startable unresolved dependencies.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.environment-materializer-plane
  - id: rule.nimi.runtime.local-compute.r092
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Profile execution declarations resolve in fixed order
    modality: must
    scope:
      - runtime.local-compute
    statement: Local execution declarations admit required entries that must be satisfiable or resolution fails with a reason code, optional entries that skip with a warning when unavailable, alternatives groups selecting one member preferring the preferred entry id then declaration order and failing when all members are unavailable, and preferred mappings from capability to entry id that only influence alternative selection priority, resolution walks required then optional then alternatives, and the resulting local execution plan carries the selection rationale and preflight decisions.
    condition: Whenever a local execution declaration set is resolved.
    failure: Fail resolution closed on unsatisfiable required entries instead of silent skips.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.profile-application-plane
  - id: rule.nimi.runtime.local-compute.r093
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Profile surface normalizes unified asset entries
    modality: must
    scope:
      - runtime.local-compute
    statement: ResolveProfile receives a single local profile descriptor and normalizes its asset entries into a local execution plan, every entry is an asset entry carrying an asset kind from the closed set of chat, image, video, tts, stt, embedding, vae, clip, lora, controlnet, and auxiliary plus an optional engine slot that passive assets must carry, runnable entries with kinds chat, image, video, tts, stt, or embedding and no engine slot enter the execution resolver producing Service and Node bindings, passive entries participate in unified asset resolution with paths injected through their engine slot at workflow execution, ApplyProfile installs runnable assets before passive assets through the unified install and import entry points, the daemon executes only the profile passed to it with profile enumeration owned by the desktop or app host, and a capability filter executes only entries matching the capability or declaring none.
    condition: Whenever a local profile is resolved or applied.
    failure: Reject undeclared asset kinds, slotless passive entries, and daemon-side profile enumeration.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.profile-application-plane
  - id: rule.nimi.runtime.local-compute.r094
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Apply pipeline has four staged results
    modality: must
    scope:
      - runtime.local-compute
    statement: ApplyProfile executes the resolved local execution plan in four stages where preflight recollects the device profile and validates hardware compatibility and port availability, install executes the unified install and import entry points and persists state, bootstrap starts local services with attached-endpoint mode performing connection validation only, and health runs engine-specific probing with media and speech probing their canonical health and catalog endpoints, and every stage yields a stage result carrying the stage, ok flag, reason code, and detail.
    condition: Whenever a profile apply pipeline executes.
    failure: Reject skipped stages and stage outcomes without typed stage results.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.profile-application-plane
  - id: rule.nimi.runtime.local-compute.r095
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Apply failure rolls back in reverse
    modality: must
    scope:
      - runtime.local-compute
    statement: When any apply stage fails Runtime cleans up the completed stage side effects in reverse order removing the models and services installed by the run, marks the result rollback applied, carries both the original failure and the rollback failure reason codes without attempting a second rollback when rollback itself fails, and confines rollback to runtime-internal registration state from the install stage without deleting externally downloaded assets.
    condition: Whenever a profile apply stage fails.
    failure: Reject partial cleanup claims and rollback that deletes external artifacts.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.profile-application-plane
  - id: rule.nimi.runtime.local-compute.r096
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Local state persists atomically with bounded audit
    modality: must
    scope:
      - runtime.local-compute
    statement: Local model state persists to the single configured runtime local-state file written atomically through a temporary file and rename, the format carries schemaVersion 2 and ignores unknown fields for forward compatibility, persisted asset and service records retain the internal engine runtime mode so an explicit attached loopback is never confused with a recommended supervised loopback, local audit events append with a default five-thousand-entry capacity overridable by daemon configuration and FIFO eviction beyond it, and every install, remove, start, stop, and health state change triggers persistence.
    condition: Whenever local asset or service state changes or is reloaded.
    failure: Reject non-atomic writes, dropped engine runtime mode, and unbounded audit growth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.profile-application-plane
  - id: rule.nimi.runtime.local-compute.r097
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Adapter routing is table driven exact first
    modality: must
    scope:
      - runtime.local-compute
    statement: Node adapter selection follows the canonical local adapter routing table where llama chat, text generation, embedding, and image and audio understanding capabilities route to the llama native adapter, media image generation, image editing, video generation, and image-to-video route to the media native adapter, speech transcription and synthesis route to the speech native adapter, sidecar music routes to the sidecar music adapter, and the wildcard engine and capability pair routes to the OpenAI-compatible adapter, with exact matches taking precedence over wildcards.
    condition: Whenever a node adapter is selected.
    failure: Reject adapter selection outside the canonical routing table or wildcard-over-exact ordering.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.profile-application-plane
  - id: rule.nimi.runtime.local-compute.r098
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Policy gates are explicit and typed
    modality: must
    scope:
      - runtime.local-compute
    statement: A local node policy gate identifier conditionally forbids a provider and capability combination making the gated node unavailable with a reason code, a host-known provider and capability combination without support carries a gate identifier in the provider.capability.unsupported style and never continues exposing a native adapter, gate information passes to audit and callers through local provider hints, and the hint-level gate identifier and the structured audit gate context express different granularities without requiring type alignment.
    condition: Whenever a local policy gate is set, projected, or audited.
    failure: Reject gated nodes projected available and unsupported combinations exposing native adapters.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.profile-application-plane
  - id: rule.nimi.runtime.local-compute.r099
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Node catalogs generate from active services
    modality: must
    scope:
      - runtime.local-compute
    statement: Node catalog listing generates live from services in ACTIVE status producing one node per service capability with node identity in the service id colon capability form, provider fields exist only as compatibility projections from the engine which stays the local execution truth source, the adapter follows the canonical routing table, availability requires health plus absence of policy gates, llama nodes additionally require a resolvable bundle, complete primary artifacts, and capability probe success, media and speech nodes require their canonical catalog probe with a ready entry comparable to the target logical model id and otherwise project unavailable and fail closed, descriptor-backed workflow nodes match the validated backend and family and may expose selected runtime-private implementation detail without silently substituting a different authored backend or family, media provider hints expose the runtime support class following the actual managed backend rather than a coarse engine-wide host classification, provider hints expose the local default rank ordering for the current host and capability, and listing supports capability, service, and provider filters.
    condition: Whenever a node catalog is generated or filtered.
    failure: Reject persisted catalogs, probe-free availability, and silent backend substitution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.profile-application-plane
  - id: rule.nimi.runtime.local-compute.r100
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Durable identity supersedes prefix routing
    modality: must
    scope:
      - runtime.local-compute
    statement: Durable local execution identity supersedes raw model id prefix routing which stays readable only as retired migration input or catalog and display metadata, execution, health, warm, generate, lease, and resident load resolve a durable v2 local reference through the profile binding id or readiness reference before selecting engine or provider facts, engine-first local defaults never silently switch models across families with fallback admitted only within the declared engine set of the same logical model, descriptor-backed profile workflows admit no implicit backend fallback and fail closed with profile and workflow readiness detail and no live AIConfig write for required slices, an unexecutable media path fails closed without pretending ready or silently falling back to cloud or provider aliases, and voice clone and voice design workflows are never projected as canonical local speech success before explicit local workflow admission.
    condition: Whenever local execution identity or engine fallback is resolved.
    failure: Reject prefix-derived execution truth, cross-family silent fallback, and alias rescue.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.profile-application-plane
  - id: rule.nimi.runtime.local-compute.r101
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Companion occurrences are ordered and validated
    modality: must
    scope:
      - runtime.local-compute
    statement: Profile workflow companion binding is occurrence-based carrying a stable occurrence id, explicit order, admitted role, runtime-private engine slot, portable asset binding reference, required policy, backend-admitted weight and options, and optional applicability constraints, passive assets used by a workflow appear through occurrences with a missing required occurrence role or slot failing closed with AI_LOCAL_ASSET_SLOT_MISSING, runnable main assets are never represented as companion occurrences with slot semantics on them failing closed with AI_LOCAL_ASSET_SLOT_FORBIDDEN, the same engine slot repeats only with distinct occurrence ids and explicit order while slot maps keyed only by engine slot are no longer authoritative for descriptor-backed workflows, engine slot value domains are backend-defined and validated against the authored backend and family with unsupported roles or options failing closed rather than skipped or defaulted, Runtime resolves ordered occurrences into backend injection parameters preserving order, duplicate use, required policy, weight, and options before execution, an uninstalled or unhealthy required occurrence asset fails workflow readiness without marking the shared reusable main asset globally unhealthy, passive asset paths resolve from the asset manifest parent and entry never from the asset id, logical model id, or local-import source repos, and legacy unordered slot-map entries are consumed only as migration input normalized into ordered occurrences before prepare, materialization, cache-key calculation, or execution failing closed when identity or order cannot be preserved.
    condition: Whenever profile workflow companion occurrences are declared, normalized, or resolved.
    failure: Fail closed with the exact typed slot reasons instead of skipping, defaulting, or poisoning shared assets.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.profile-application-plane
  - id: rule.nimi.runtime.local-compute.r102
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Profile overrides are bounded to engine parameters
    modality: must
    scope:
      - runtime.local-compute
    statement: Profile entry overrides may cover only engine-specific execution parameters and never the model parameter, download file lists, any path field, or engine slot bindings, an attempted protected-field override fails ResolveProfile closed with AI_LOCAL_PROFILE_OVERRIDE_FORBIDDEN, overrides apply after runtime slot path injection and before engine request construction, overrides never trigger asset reinstallation or service restart and affect only the single workflow execution, and entries without overrides use the asset default parameters.
    condition: Whenever profile entry overrides are declared or applied.
    failure: Fail closed on protected-field overrides instead of applying or ignoring them.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.profile-application-plane
  - id: rule.nimi.runtime.local-compute.r103
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Asset kind registry is closed and proto aligned
    modality: must
    scope:
      - runtime.local-compute
    statement: The local asset kind registry admits exactly the proto LocalAssetKind values chat, image, video, tts, stt, and embedding as runnable kinds numbered one through six and vae, clip, lora, controlnet, and auxiliary as passive kinds numbered ten through fourteen, each runnable kind maps to exactly one capability token with chat to chat, image to image.generate, video to video.generate, tts to audio.synthesize, stt to audio.transcribe, and embedding to text.embed, and passive kinds carry no capability token and are never directly scheduled or invoked.
    condition: Whenever a local asset kind is declared, persisted, or mapped to a capability token.
    failure: Reject undeclared asset kinds, runnable kinds without their declared capability token, and scheduled or invoked passive kinds.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
  - id: rule.nimi.runtime.local-compute.r104
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Capability tokens resolve to asset kinds first match wins
    modality: must
    scope:
      - runtime.local-compute
    statement: Capability token to asset kind resolution during asset registration and profile resolution walks canonical tokens before local manifest tokens with first match winning, canonical tokens map chat, text.generate, text.generate.vision, text.generate.audio, and text.generate.video to chat, text.embed to embedding, image.generate and image.edit to image, video.generate to video, audio.synthesize, voice_workflow.voice_clone, and voice_workflow.voice_design to tts, audio.transcribe to stt, and music.generate and music.generate.iteration to auxiliary, local manifest tokens map embedding, image, video, tts, and stt to their same-named kinds and music to auxiliary, and the offline migration inputs llm to chat plus vae, clip, controlnet, lora, and auxiliary to their same-named kinds are consumed only by offline migration tooling and never accepted as legacy artifact-kind aliases on runtime or public asset contracts.
    condition: Whenever a capability or manifest token is resolved to a local asset kind.
    failure: Reject token mappings outside the declared closed table and legacy alias acceptance on runtime or public surfaces.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
