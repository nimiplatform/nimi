  - id: rule.nimi.runtime.local-compute.r069
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Python pipeline runtime management is fixed
    modality: must
    scope:
      - runtime.local-compute
    statement: The python-pipeline backend uses uv as the sole Python bootstrap pipeline without a second bootstrap implementation, the managed Python version is fixed at 3.12, the venv is shared per supervised media engine version rather than created per model and lives under the data-plane environments root in the per-engine per-version python directory without home-directory roots, the venv binds engine version, Python version, package set lock hash, host platform tuple, and the python-pipeline backend class with any binding factor change triggering rebuild, creation stages then verifies then atomically promotes with verification failure entering rebuild or fail-close, budgets fix Python runtime creation at one hundred twenty seconds, dependency install at six hundred seconds, and pipeline warmup at three hundred seconds, retry applies only to transient network transfer failures and never treats ABI incompatibility, missing wheels, or import errors as retryable success paths, no implicit offline fallback exists with wheel sources declared explicitly by engine bootstrap config, and the venv is owned by the runtime engine supervisor with cleanup only through engine version retirement, explicit repair or maintenance, or atomic reclamation.
