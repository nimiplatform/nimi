    statement: Runtime owns local environment setup truth whose unit is a Runtime local environment plan rather than a model row, engine installer, Desktop workflow, package-manager command, developer script, or provider health probe, plans resolve the requested compute pack or capability, installed and imported assets, host profile, consumer requirements, dependency source policy, and current selected source records into dependency state, confirmation requirements, activation gates, repair requirements, and product-safe Desktop projection, managed dependency families cover the CUDA runtime, native engine packages, uv, managed Python, venv, package sets, Torch wheels, model assets, and companion assets rather than CUDA alone, system sources require positive canonicalized proof and managed sources live under Runtime-owned roots, and cloud API setup, account and session, provider connector configuration, and Runtime core status never require local engines, Python, Torch, CUDA, models, or accelerator dependency materialization.
