    statement: The managed image backend package registry is the single normative source for runtime-owned image backend package materialization, package refs are never inferred from ad hoc code branches or engine command-line backend installers, a host tuple may carry multiple package source entries while exactly one supported entry stays canonical for default resolution on that tuple, proposed package entries are runtime-private experimental sources selected only by an explicit runtime-private selector and never auto-selected, implicitly promoted, or used as hidden fallback when the canonical source is unavailable or slow, current admission supports the darwin arm64 Apple stablediffusion-ggml tuple through the canonical LocalAI-derived OCI payload with the official direct archive staying runtime-private experimental, supports the windows amd64 NVIDIA stablediffusion-ggml tuple through the runtime-owned direct archive package and wrapper launch path with CUDA resolved as a shared accelerator dependency before activation or health success, and keeps the linux amd64 NVIDIA tuple unsupported until a published runtime-owned package exists, and a topology recognized in the supervised backend matrix with unsupported package admission fails closed without silently promoting the host tuple.
