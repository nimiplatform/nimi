    lifecycle: active
    title: Supervised llama residency projects LocalWarmState
    modality: must
    scope:
      - runtime.local-compute
    statement: Public supervised llama residency truth projects only LocalWarmState where COLD means installed and routable without current residency, WARMING means loading, switching, or ready proving is in progress, READY means a serviceable resident worker currently hits the model, and FAILED means the latest load, switch, or ready proof failed, no parallel public residency enum exists, ACTIVE expresses routability backed by proven or on-demand execution rather than residency, endpoint, bootstrap, bundle, or minimal execution failures are never wrapped as ACTIVE with COLD warmth, COLD never expresses probe failure, eviction detail stays runtime-private, every llama request explicitly binds its target model with same-model requests reusing the same resident worker and cross-model switches explicitly coordinated by Runtime failing closed when unsafe, and static manifest or configuration order never implicitly selects the current model.
