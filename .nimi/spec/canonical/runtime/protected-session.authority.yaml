format: nimicoding.authority/v1
units:
  - id: definition.nimi.runtime.protected-session.protected-local-session-plane
    kind: definition
    owner: team.runtime
    lifecycle: active
    title: Runtime protected local session plane
    meaning: The Runtime protected local session plane owns OS peer and process identity, protected-local transport identity, process-bound Desktop control sessions, lifecycle operation admission, the Runtime boot epoch, and security-critical generation state, including the closed transport classes and immutable origin roles, mutual endpoint authentication, process identity and liveness, executable identity and trust, the local-app launch lease and common session, local-development authorization and session, the Desktop-supervised bundled Avatar profile, and lifecycle transactions, boot epoch, and recovery.
    relations: []
  - id: definition.nimi.runtime.protected-session.account-session-plane
    kind: definition
    owner: team.runtime
    lifecycle: active
    title: Runtime account session plane
    meaning: The Runtime account session plane owns local-machine account session truth, custody, login lifecycle, refresh, logout, user switch, daemon restart recovery, the Runtime-mediated Realm broker, Runtime-issued scoped app binding issuance, fresh local presence verification, the redacted workspace membership projection consumption seam, the local-app caller posture and per-operation authority coordinator, account session events and audit, device identity participation, and the Web and cloud boundary, while workspace membership and world data truth remain Realm-owned authority that this plane only references.
    relations: []
  - id: definition.nimi.runtime.protected-session.config-plane
    kind: definition
    owner: team.runtime
    lifecycle: active
    title: Runtime configuration plane
    meaning: The Runtime configuration plane owns the canonical service-principal-owned configuration location, production source priority, schema versioning, provider name canonicalization, secret policy, atomic write, the typed protected command surface, validation fail-close, hot reload boundaries, the credential plane boundary, default value governance, cross-layer projection, the service schema transition framework including the signed dev_kernel_checkpoint and first_party_product_acceptance non-release build profiles, transition backup and drift boundaries, field authority, and the data root reference and service posture boundary.
    relations: []
  - id: definition.nimi.runtime.protected-session.rpc-plane
    kind: definition
    owner: team.runtime
    lifecycle: active
    title: Runtime RPC surface plane
    meaning: The Runtime RPC surface plane owns the admitted Runtime kernel RPC service scope, the Runtime target identity v2 hard cut, design-to-proto naming mapping, forbidden external contract names, the connector RPC field and compensation contracts, connector state machine anchors, connector model catalog read semantics, catalog browsing and overlay mutation surfaces, preset voice and voice asset method sets, the external agent service RPC boundary, the cognition and agent service method-set boundaries, the reserved runtime.agent chat access matrix, and the local environment plan and materializer projection surface anchors.
    relations: []
  - id: rule.nimi.runtime.protected-session.r001
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Protected-local session authority is solely owned
    modality: must
    scope:
      - runtime.protected-session
    statement: The protected local session contract is the sole normative owner for OS peer and process identity, protected-local transport identity, process-bound Desktop control sessions, lifecycle operation admission, the Runtime boot epoch, and security-critical generation state, and Account, app-lifecycle, Platform release, Desktop UX, Kit carrier, and SDK contracts reference these facts and do not restate or replace them.
    condition: Whenever protected-local session authority ownership is interpreted.
    failure: Reject restatement or replacement of these facts outside this owner.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r002
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Protected origins derive from verified connections only
    modality: must
    scope:
      - runtime.protected-session
    statement: Runtime derives every protected origin from a mutually authenticated local connection and a verified live process, an app id, caller enum, source host, manifest, renderer metadata, loopback address, or portable session or bearer is self-asserted context and is never origin proof, protected-local unavailability fails closed, and public TCP and app-owned metadata are not fallback transports.
    condition: Whenever a protected origin is derived or protected-local transport is unavailable.
    failure: Fail closed without falling back to public TCP or app-owned metadata.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r003
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Production Runtime runs under the isolated service principal
    modality: must
    scope:
      - runtime.protected-session
    statement: Production Runtime protected state and process memory execute under the isolated OS service principal selected by the row pinned in the protected-local runtime principal profiles table, account, connector and provider, authenticated Realm, and anchor-key custody additionally use the platform custody profile selected by the row pinned in the protected-local custody profiles table, that principal is distinct from the interactive Desktop user and every bundled, local-app, renderer, and app-owned host principal, a same-interactive-user Runtime process, user-session generic keyring, user-writable service definition, or environment- or argv-selected production endpoint cannot claim product readiness, missing service-principal isolation fails closed before custody load or any listener, same-user fixtures may exercise isolated unit logic only and cannot open a product protected listener or serve as checkpoint evidence, service acceptance uses the same fixed production service principal with a service-owned development-state lineage root defined by the principal-profile table, and the signed binary candidate is verified independently and does not silently rotate that durable state identity.
    condition: Whenever production Runtime protected state, custody, or listeners are established.
    failure: Fail closed before custody load or any listener when principal isolation is missing.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r004
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Service-principal semantics are platform-neutral
    modality: must
    scope:
      - runtime.protected-session
    statement: Production Runtime is a non-interactive OS service principal distinct from the interactive user, only the signed installer may establish its fixed service definition, missing principal isolation fails before custody or listeners, the same-OS row pinned in the protected-local runtime principal profiles table alone selects the service manager, principal constraints, process isolation, control mechanics, and acceptance isolation, the Windows row is the admitted current behavior, and the macOS launchd system-daemon row and Linux system-service row are requirements-only and remain fail-closed pending independent native admission.
    condition: Whenever service-principal semantics are selected for a platform.
    failure: Fail closed on unadmitted platform rows and service definitions outside the signed installer.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r005
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The macOS local development service profile is non-product
    modality: must
    scope:
      - runtime.protected-session
    statement: The macOS tables additionally define one local_development_non_product_admitted service profile that uses the distinct _nimiruntimedev system principal, the ai.nimi.runtime.dev launchd label, RuntimeDev state and trust roots, nimi-dev sockets, and the System Keychain namespace and compile-time local-CA trust root owned by P-NAPP-037, it may establish a real protected listener and account-bound local-development session only in a binary built for that exact non-product profile, and it cannot connect to production endpoints or custody, cannot be selected at runtime, cannot advance the production macOS row, and cannot serve as Developer ID, SMAppService, notarization, Gatekeeper, or Tauri evidence.
    condition: Whenever the macOS local development service profile is used or evaluated.
    failure: Reject production connection, runtime selection, row advancement, and evidence claims from this profile.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r006
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The signed installer owns Runtime release lifecycle
    modality: must
    scope:
      - runtime.protected-session
    statement: The signed installer and service updater own Runtime release staging, installation, and atomic replacement, Desktop may read verified service status and request start or restart only through the typed OS service-control gateway and never selects or spawns the Runtime executable, directly stops the service, or ties service lifetime to Desktop lifetime, production Desktop quit leaves the Runtime service running, and administrative uninstall and updater-controlled drain remain service-manager operations outside Desktop process ownership.
    condition: Whenever Runtime release staging, installation, replacement, or service control occurs.
    failure: Reject Desktop executable selection, spawning, direct stops, and lifetime coupling.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r007
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: RequestRuntimeRestart is the sole restart trigger
    modality: must
    scope:
      - runtime.protected-session
    statement: The protected RuntimeServiceControlService.RequestRuntimeRestart wire is the sole Runtime-side restart trigger, its request is empty and it is admitted only on the exact desktop_control connection after that connection has opened its boot-scoped Desktop session, Runtime begins a graceful drain and self-exits and the fixed OS service manager, not Desktop, starts the replacement process, success is never the RPC acknowledgement alone because Kit must observe a different service-profile process identity and creation marker, a different runtime_boot_epoch, and a fresh mutually verified protected handshake before projecting running, and public TCP, local-app transports, portable credentials, service-name or path arguments, direct service-manager stop or start, and caller-selected timeout or recovery policy are forbidden.
    condition: Whenever a Runtime restart is requested or restart success is projected.
    failure: Reject restarts outside this wire and running projections before fresh verified observation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r008
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: RegisterApp and OpenSession stay binding-only
    modality: must
    scope:
      - runtime.protected-session
    statement: RuntimeAuthService.RegisterApp and RuntimeAuthService.OpenSession remain BINDING_ONLY bootstrap surfaces that may establish only a non-privileged app binding and must not derive account-control, Realm broker, AI, artifact, realtime, media, lifecycle, or local-app launch authority, and a portable value cannot establish Desktop, bundled-app, or local-app privilege on the same or another connection.
    condition: Whenever the binding-only bootstrap surfaces are consumed.
    failure: Reject derived privileged authority and portable-value privilege establishment.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r009
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Local-app authority cannot be manufactured
    modality: must
    scope:
      - runtime.protected-session
    statement: The 0K local-app kernel admits the Windows fixed-service child channel, macOS and Linux remain fail-closed until independently admitted, and no temporary nonce, metadata, portable bearer, app-owned host stamp, localhost fallback, direct daemon, or compatibility path may manufacture local-app authority.
    condition: Whenever local-app kernel authority is established on a platform.
    failure: Fail closed on unadmitted platforms and manufactured local-app authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r010
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The transport-class vocabulary is closed
    modality: must
    scope:
      - runtime.protected-session
    statement: The closed RPC transport-class vocabulary is public_tcp, desktop_control, local_app_bootstrap, and local_app_host, local-app launch consumes local_app_bootstrap and the app process opens local_app_host, the same-OS row pinned in the protected-local launch session profiles table alone selects the physical launcher, process witness, and carrier, immutable and development execution profiles share the common session contract, and distinct principals, provenance, and process bindings prevent inheritance.
    condition: Whenever transport classes are interpreted or selected.
    failure: Reject transport classes and launcher selections outside the closed vocabulary and pinned table.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r011
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Transport matrix rows resolve through one resolver
    modality: must
    scope:
      - runtime.protected-session
    statement: Every row pinned in the protected-local RPC transport matrix table resolves its allowed_transport_classes through the closed method_platform_binding resolver, protected classes resolve to verified_platform_transport plus one same-OS profile bundle, missing, ambiguous, or cross-OS resolution fails generation, this adds no per-method transport or role admission, and Runtime-private refresh is a direct in-process helper call and is never a transport class or an invocation of a public refresh RPC.
    condition: Whenever transport-matrix rows or Runtime-private refresh are resolved.
    failure: Fail generation on missing, ambiguous, or cross-OS resolution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r012
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Origin roles are immutable and Runtime-derived
    modality: must
    scope:
      - runtime.protected-session
    statement: The admitted origin roles are binding_only, verified_desktop_process, desktop_account_host, bundled_avatar_host, local_app_control, local_app_process, and local_app_session, Runtime derives immutable and development provenance and execution profile from the K-APP record plus launch lease, requests cannot select a separate role or convert one principal into another, a transport role is derived by Runtime from the verified connection and written to immutable origin context before protocol parsing, authentication, authorization, token access, or business request parsing, requests and metadata cannot select, override, or upgrade a role, and public TCP cannot construct a protected role.
    condition: Whenever an origin role is derived or interpreted.
    failure: Reject role selection, override, upgrade, and public-TCP protected roles.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r013
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Bootstrap promotion is atomic and non-portable
    modality: must
    scope:
      - runtime.protected-session
    statement: Desktop control and a local-app host never share a portable session, and local_app_bootstrap to local_app_host promotion is atomic on the same verified child connection and service-owned transaction that consumes the launch lease.
    condition: Whenever sessions or bootstrap promotion cross transport classes.
    failure: Reject shared portable sessions and non-atomic promotion.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r014
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Launch and session semantics are platform-neutral
    modality: must
    scope:
      - runtime.protected-session
    statement: Launch and session semantics are platform-neutral, the Runtime-owned lease, exact-process bind, empty session-open request, atomic same-connection promotion, private session row, per-operation revalidation, and revocation rules do not vary by OS, and the same-OS row pinned in the protected-local launch session profiles table may select only the launcher, child-process witness, and physical carriers and must reference the same-OS service-principal, verified-transport, and executable-trust profiles.
    condition: Whenever launch or session semantics are selected for a platform.
    failure: Reject platform variation of the neutral semantics and profile rows exceeding their selection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r015
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: PrepareLocalAppLaunch creates one opaque lease
    modality: must
    scope:
      - runtime.protected-session
    statement: PrepareLocalAppLaunch may create one short-lived service-owned launch lease only after protected local_app_control resolves the exact OS-user anchor, local principal and record, provenance revision, release-or-project generation, capability fingerprint, execution profile, host and payload digest slots, current account id and generation, and Runtime boot epoch, and the host-private projection carries only an opaque 32-byte local_app_bootstrap and never enters renderer or app state.
    condition: Whenever a local-app launch lease is created or projected.
    failure: Reject lease creation without the full resolution and projections beyond the opaque bootstrap.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r016
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: BindLocalAppProcess verifies the exact process
    modality: must
    scope:
      - runtime.protected-session
    statement: The verified launcher or supervisor starts the Runtime-resolved host, then BindLocalAppProcess submits only the bootstrap and PID over the protected control connection, Runtime independently opens and verifies the process, creation marker, login session, locked executable identity, code-signing identity, execution profile, build, host, and payload digest, and record generation before process resume or session admission, the child opens the profile-selected service-owned local_app_bootstrap carrier, Runtime requires the native peer process witness to match the retained bound process, and PID, bootstrap, path, argv, env, preload, and renderer metadata are selectors only.
    condition: Whenever a local-app process is bound.
    failure: Reject resume or session admission before independent verification and witness match.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r017
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: OpenLocalAppSession consumes and promotes atomically
    modality: must
    scope:
      - runtime.protected-session
    statement: OpenLocalAppSession has an empty request and exists only on the verified local_app_bootstrap connection already bound to the current lease, process, and record, success atomically consumes the bootstrap, promotes that same connection to local_app_host, and creates a session bound to OS-user anchor, principal and record, provenance revision, release-or-project generation, execution profile and digests, process tuple, account generation, current account id, and Runtime boot epoch, a valid identity may open with zero user permissions for redacted permission posture and admitted base entitlements only and receives no protected Agent, account, or resource inventory, and a future user_permission operation must separately resolve its admitted public permission, owner-issued selector, current owner decision, and domain policy.
    condition: Whenever a local-app session is opened.
    failure: Reject non-empty requests, unbound connections, and inventory or permission exposure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r018
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: RenewLocalAppSession rotates on the same connection
    modality: must
    scope:
      - runtime.protected-session
    statement: RenewLocalAppSession has an empty request and exists only on the exact verified local_app_host connection that already owns the current local_app_session, before the short-lived technical session expires the native host may use it to atomically revoke the previous Runtime-private row and replace it with a new row on that same live connection, Runtime revalidates the process, supervisor, authorization, record and provenance, project generation, account generation, capability fingerprint, execution profile, and boot epoch before replacement, renewal never consumes another launch lease, changes the origin role, repeats durable consent, or exposes session id or proof, and public TCP, ordinary gRPC, bootstrap connections without a session, and renderer or app code cannot call or select this operation.
    condition: Whenever a local-app technical session is renewed.
    failure: Reject renewal without revalidation and callers outside the exact live host connection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r019
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Lease and session lifetimes fail closed
    modality: must
    scope:
      - runtime.protected-session
    statement: The launch lease TTL is 30 seconds and the process-bind deadline is 10 seconds, duplicate, expired, revoked, wrong process, principal, record, generation, account, or epoch, and ordinary-gRPC calls fail closed, logout or account switch, lifecycle or security revoke, process replacement or exit, incompatible generation or profile change, and Runtime restart revoke the applicable lease or session transactionally, and a future permission-decision mutation does not rotate identity or session but every next protected call must read the current owner decision.
    condition: Whenever lease or session lifetime, revocation, or permission mutation applies.
    failure: Fail closed and revoke transactionally.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r020
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The session row is the sole session truth
    modality: must
    scope:
      - runtime.protected-session
    statement: After consumption the connection retains only Runtime-private opaque session state, the K-PLOCAL session row is the sole launch, process, and session truth and contains no permission authority, every admitted operation revalidates the live process, current record and account, and its own authority class, and a user-permission operation also revalidates the current owner decision and selector because an opaque handle, request metadata, session existence, or launch-time snapshot is insufficient.
    condition: Whenever an admitted operation runs on a local-app session.
    failure: Reject operations without per-operation revalidation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r021
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Only the Windows launch row is admitted
    modality: must
    scope:
      - runtime.protected-session
    statement: The Windows row is admitted independently and carries the current fixed-service named-pipe and retained-process-witness behavior, and the macOS and Linux rows are requirements-only and remain protected-carrier-required until their complete native principal, transport, trust, launcher, and session chains are admitted.
    condition: Whenever platform rows for launch and session carriers are evaluated.
    failure: Fail closed on unadmitted platform rows.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r022
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Local development has two separated lifetimes
    modality: must
    scope:
      - runtime.protected-session
    statement: Local development has two different lifetimes, Runtime owns the durable user development authorization in protected service state binding the canonical project root, app id, manifest capability fingerprint, current account id, and the exact local_development provenance and an isolated Runtime-assigned principal, run_once persists only while its Desktop-owned supervisor run remains live, allow_project preserves the principal and record authorization posture across supervisor, Desktop, and Runtime replacement without repeated presence while every durable binding remains exact, each new run and Runtime boot epoch still receives new lease, process, and session authority, it never autostarts, and neither record is an immutable release, signature, listing, production grant, or app-owned configuration truth.
    condition: Whenever local-development authorization lifetimes are interpreted.
    failure: Reject autostart, lifetime conflation, and reinterpretation as release or grant truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r023
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The consent store lives under the service authority root
    modality: must
    scope:
      - runtime.protected-session
    statement: Protected bootstrap supplies the local-development consent store as an absolute path under the stable OS-protected service authority root, it is not derived from the Runtime candidate payload root, acceptance round, selected product data root, argv, environment, renderer input, or app input, and candidate replacement may recreate candidate-local principal projections but never the durable consent decision.
    condition: Whenever the local-development consent store location is resolved.
    failure: Reject derivation from forbidden sources and consent recreation on candidate replacement.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r024
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Development technical sessions bind the exact host
    modality: must
    scope:
      - runtime.protected-session
    statement: Runtime separately owns every short-lived technical session binding the development authorization, verified Desktop supervisor process, actual host PID and creation marker, current host executable identity, shell kind, controlled renderer origin and output roots, account generation, and Runtime boot epoch, the Desktop supervisor opens a development launch, starts the exact Electron or Tauri host, and binds its retained process witness over the live local_app_control connection, Runtime then requires the native local_app_host carrier peer PID to equal that bound host and derives local_app_process plus the Runtime-held development record before atomically creating common local_app_session state, another principal's provenance, session, storage, permission, and operation authority remain non-convertible, and PID, path, parent PID, argv, env, project manifest, localhost, and a caller-supplied digest are never sufficient authority.
    condition: Whenever a local-development technical session is created.
    failure: Reject session creation without the bound witness conjunction and non-convertible authority claims.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r025
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Development session material stays private
    modality: must
    scope:
      - runtime.protected-session
    statement: Session proof and launch material remain Runtime and native-host private and are never returned through renderer IPC, CLI output, terminal environment, argv, files, preload APIs, or app code, Kit may expose only typed status and admitted business operations, Runtime revalidates authorization, capability fingerprint, process liveness, supervisor liveness, account generation, boot epoch, shell, controlled outputs, and operation policy on every call, and the native Kit host renews an otherwise unchanged live technical session only through request-empty RenewLocalAppSession while expiry or any failed revalidation revokes the session and fails closed instead of reopening, falling back, or requesting durable project approval again.
    condition: Whenever development session material is handled or a call is revalidated.
    failure: Fail closed on failed revalidation without reopening or re-approval and reject material exposure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r026
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The development authority summary is bounded and inert
    modality: must
    scope:
      - runtime.protected-session
    statement: The verified Desktop local_app_control origin may read one exact bounded GetLocalDevelopmentAuthoritySummary projection for local development diagnostics, Runtime derives its two sections from the existing Developer Mode record and current-account development authorizations, there is no permission summary or local permission store before a public permission is admitted, the projection contains only closed state values, per-state counts, and reason codes and never contains account, project, principal, record, authorization, permission decision, request, presence, operation, resource, path, token, secret, session, or boot-epoch identifiers, the read is side-effect free and does not expire, revoke, approve, deny, rotate, or otherwise advance any authorization, permission, presence, or session lifecycle, an unavailable source remains an explicit unavailable section and must not be reconstructed from Desktop-local state, and ordinary TCP and local-app-host transports deny the method before handler dispatch.
    condition: Whenever the local development authority summary is read.
    failure: Deny before handler dispatch off the admitted origin and reject identifier disclosure or side effects.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r027
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Development rebuilds rotate technical state only
    modality: must
    scope:
      - runtime.protected-session
    statement: Renderer HMR and reload may retain the host process, but a controlled Electron main or preload rebuild, Tauri Rust rebuild, host process replacement, technical-session rotation, or Runtime restart must obtain a new launch lease, process bind, and session without another confirmation while the exact allow_project authorization remains valid, host or supervisor exit, revoke, mode off, logout, account switch, authorization mismatch, app, root, capability, or shell change, uncontrolled output, or remote dev-server origin revokes the applicable launch or session before the next operation, a different account requires its own confirmation, and returning to the authorization's original account may reuse the unchanged consent without a separate credential or Realm-presence challenge.
    condition: Whenever development hosts rebuild, rotate, or change account context.
    failure: Revoke before the next operation on the listed events and reject confirmation reuse across accounts.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r028
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The bundled Avatar profile rides desktop control
    modality: must
    scope:
      - runtime.protected-session
