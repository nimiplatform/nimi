      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r059
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Protected state lives in one transactional database
    modality: must
    scope:
      - runtime.protected-session
    statement: Runtime stores Desktop sessions, lifecycle operations, local-app lease consumption, local-app sessions, generations, and revocation state in one service-owned transactional database protected by the isolated Runtime principal, this database uses a fixed schema, foreign keys, WAL, and durable transactions, it is not a second credential store and does not HMAC-chain every ordinary row, account and connector or provider credentials remain exclusively in the custody profile owned by K-ACCSVC-007, and production generic user-session keyrings, automatic legacy import, Desktop or app storage, and user-writable backup restore remain forbidden.
    condition: Whenever protected session and lifecycle state is stored.
    failure: Reject credential storage outside the custody profile and forbidden stores or imports.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r060
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Durable anchoring is limited to security floors
    modality: must
    scope:
      - runtime.protected-session
    statement: Additional durable anchoring is limited to state whose rollback would recreate security authority after a valid transition, namely the installer-owned active release generation, credential-custody generation, and explicitly admitted non-rollbackable revocation floors, and session rows, UX intents, ordinary local-app launch and run operations, audit outbox rows, and crash-recovery bookkeeping do not each advance a separate HMAC chain.
    condition: Whenever durable anchoring scope is decided.
    failure: Reject anchoring beyond the admitted state set.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r061
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Every boot creates a random epoch and revokes stale state
    modality: must
    scope:
      - runtime.protected-session
    statement: Every Runtime start creates a 32-byte CSPRNG boot epoch, before any listener is opened one database transaction revokes nonterminal sessions, launch leases, and operations from older boot epochs and writes a sanitized startup audit, and integer generations may order records but never replace the random boot epoch identity.
    condition: Whenever Runtime starts.
    failure: Reject listener opening before the revocation transaction and startup audit complete.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r062
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Protected-local failures are typed and redacted
    modality: must
    scope:
      - runtime.protected-session
    statement: Typed failures use the PROTECTED_LOCAL_*, DESKTOP_*, LOCAL_APP_*, and LIFECYCLE_CHALLENGE_* rows pinned in the reason codes and error mapping matrix tables, and error detail contains only the stable reason, retryability, and a non-secret action hint and never includes endpoint material, executable path, process tuple, operation id, durable anchor, account material, or credential values.
    condition: Whenever protected-local failures are reported.
    failure: Reject error details beyond the stable reason, retryability, and non-secret action hint.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r063
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Account authority allocation is owner-only
    modality: must
    scope:
      - runtime.protected-session
    statement: Runtime is the sole owner of authenticated Realm unary, realtime, and media data planes, Runtime alone owns account and token custody, private refresh, authenticated Realm credential exchange, the Runtime-owned portion of public permission enforcement, and the per-operation local-app decision coordinator, Platform owns app catalog, trust-class, and public permission vocabulary, K-APP-* owns the local-app principal and record and Developer Mode state, K-GRANT-* may own only owner-internal lifecycle records for admitted Runtime permissions, K-PLOCAL-* owns launch leases and local-app sessions, Desktop owns account-control UX, Developer Mode UX, future product permission UX, and the verified native supervisor and launcher but no Developer Mode or permission truth, SDK and Kit own typed APIs and trusted carriers only, and app-tools remains authoring and build tooling.
    condition: Whenever account, session, or permission authority ownership is allocated.
    failure: Reject ownership claims outside this single-owner allocation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r064
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Apps never own account or credential truth
    modality: must_not
    scope:
      - runtime.protected-session
    statement: Apps own account or session truth, bearer or refresh tokens, or signed upload credentials, or a Desktop host, Kit bridge, SDK client, renderer, app manifest, or app-supplied callback originates credentials, refreshes authenticated Realm state, or becomes a parallel unary, realtime, or media authority instead of carrying only owner-attested opaque inputs and results.
    condition: Whenever app-side account or credential handling is designed or executed.
    failure: Reject app-owned truth, originated credentials, and parallel authorities.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r065
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The joint local-app decision duplicates no state
    modality: must
    scope:
      - runtime.protected-session
    statement: The single-owner allocation is admitted such that K-PLOCAL-* is the sole authority for transport, process, executable, challenge, boot-epoch, and security-ledger facts, K-APP-*, K-GRANT-*, and K-ACCSVC-* jointly admit the common local-app decision without duplicating each other's state, and Realm, realtime, and media operations still require their own exact operation rows because local-app origin or permission posture never creates blanket authorization.
    condition: Whenever the joint local-app decision or operation admission is interpreted.
    failure: Reject state duplication and blanket authorization from origin or posture.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r066
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: RuntimeAccountService owns local account authority
    modality: must
    scope:
      - runtime.protected-session
    statement: RuntimeAccountService owns local machine-level account session truth, custody, login lifecycle, refresh, logout, user switch, daemon restart recovery, the Runtime-mediated Realm broker, and Runtime-issued scoped app binding issuance and is the sole owner of local account authority and refresh-token custody.
    condition: Whenever local account authority ownership is interpreted.
    failure: Reject parallel owners of account authority or refresh-token custody.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r067
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Account subjects derive from custody internally
    modality: must
    scope:
      - runtime.protected-session
    statement: RuntimeAuthService under K-AUTHSVC-* continues to own app sessions and external-principal sessions, neither service replaces the other, and RuntimeAccountService does not accept a caller-provided subject_user_id as account truth because the account subject must be derived internally from Runtime account custody.
    condition: Whenever account subjects or session-service ownership are resolved.
    failure: Reject caller-provided subjects and cross-service replacement.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r068
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Realm mediation returns bounded results only
    modality: must
    scope:
      - runtime.protected-session
    statement: RuntimeAccountService is also the sole account custody and Realm credential mediation owner for Nimi local apps, InvokeRealmUnary currently applies only to the Desktop and bundled callers explicitly admitted in the matrix, the LOCAL_APP row remains deny until an exact Realm operation independently completes owner admission, the checkpoint's selected RuntimeAgent and Cognition operations do not borrow generic Realm unary, any caller ultimately obtains only a bounded application result and never a Realm bearer, and no app, Desktop, SDK, Kit, renderer, or app-owned host may hold an access or refresh token, durable shared session, login bootstrap, or subject truth or write a token or session back into Runtime.
    condition: Whenever Realm credential mediation or broker admission is consumed.
    failure: Deny unadmitted callers and reject bearer, token, session, or subject custody outside Runtime.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r069
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Public token and refresh RPCs stay removed
    modality: must
    scope:
      - runtime.protected-session
    statement: Public GetAccessToken and RefreshAccountSession have been removed from the public protocol, generated clients, Runtime handlers, Kit, and app projections, and Runtime may access or refresh account bearer material only through non-RPC private helpers while executing an independently admitted broker or service operation.
    condition: Whenever account bearer material is accessed or refreshed.
    failure: Reject public token or refresh surfaces and bearer access outside private helpers.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r070
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The account method set is frozen
    modality: must
    scope:
      - runtime.protected-session
    statement: The RuntimeAccountService method set is fixed to GetAccountSessionStatus, SubscribeAccountSessionEvents, BeginLogin, CompleteLogin, RequestPresenceVerification, InvokeRealmUnary, Logout, SwitchAccount, IssueScopedAppBinding, RevokeScopedAppBinding, IssueWorkspaceBinding, RevokeWorkspaceBinding, GetLocalAppPermissionStatus, and RequestLocalAppPermission, the admitted method set is frozen, IssueWorkspaceBinding and RevokeWorkspaceBinding are admitted only for workspace-specific attachment mint and revoke under K-ACCSVC-019 and K-BIND-018, RequestPresenceVerification is admitted only for fresh local user-presence checks under K-ACCSVC-021, and any further method must undergo a new rule admission before proto or RPC table projection.
    condition: Whenever the RuntimeAccountService method surface is defined or extended.
    failure: Reject undeclared methods and extension without new rule admission.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r071
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Permission methods expose public posture only
    modality: must
    scope:
      - runtime.protected-session
    statement: The two local-app permission methods are protected local-app-host methods governed by P-PERM-002, P-PERM-007, P-PERM-017, and K-ACCSVC-026 exposing only a public permission id, public posture, requestability, and a typed reason, internal operation, resource, and grant identity and approval control are not RPC surface, and the removed GetAccessToken and RefreshAccountSession identities remain reserved and must not be reintroduced under aliases.
    condition: Whenever local-app permission methods or removed identities are surfaced.
    failure: Reject internal identity exposure and alias reintroduction of removed identities.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r072
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The account session state machine is closed
    modality: must
    scope:
      - runtime.protected-session
    statement: RuntimeAccountService maintains the account session states anonymous with no usable account session, login_pending with an active login attempt, authenticated with valid account material and projection, refresh_pending while account material refreshes, expired when existing material has expired and cannot authorize work, reauth_required when user action is needed to continue, switching while the active account switches atomically, logging_out while local material and bindings are revoked, and unavailable when account state cannot be safely decided or custodied which must fail close, none of these states is terminal, and the single-active-account invariant holds in that a single Runtime instance has at most one authenticated account at a time and SwitchAccount is an atomic transition with no two valid account projections existing simultaneously.
    condition: Whenever account session state is maintained or switched.
    failure: Fail close in unavailable and reject concurrent valid account projections.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r073
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The account transition table is exact
    modality: must
    scope:
      - runtime.protected-session
    statement: "The account session transition table is: anonymous on accepted BeginLogin moves to login_pending emitting login.started with the same attempt returning the same pending attempt before expiry; login_pending on completed and verified proof moves to authenticated emitting login.completed and account.status with the account projection emitted only after the custody write succeeds; login_pending on timeout, cancel, or failure moves to anonymous or reauth_required emitting login.failed or login.timed_out with expired proof failing close; authenticated on proactive or reactive refresh start moves to refresh_pending emitting refresh.started with only one in-flight refresh per account at a time; refresh_pending on refresh success moves to authenticated emitting refresh.completed and account.status with the new token atomically replacing the old token; refresh_pending on a transport failure provably not leaving the process stays refresh_pending emitting refresh.deferred, recovering refresh custody and retrying with single-flight backoff without consuming rotation; refresh_pending when the request may have been sent with an uncertain result moves to reauth_required emitting refresh.failed and account.status, clearing custody and never risking reuse of the single-use refresh token; refresh_pending when Realm explicitly rejects the token or the response contract is invalid moves to reauth_required emitting refresh.failed and account.status, clearing custody and requiring a real login; refresh_pending when the token expires before recovery moves to expired emitting refresh.failed and account.status with authenticated calls failing close; authenticated on Logout moves to logging_out emitting logout.started with repeated logout observing the same transition; logging_out on local and remote revoke completion moves to anonymous emitting binding.revoked, logout.completed, and account.status with bindings revoked before final anonymous; authenticated on SwitchAccount moves to switching emitting switch.started with no two valid accounts existing simultaneously; switching on new-account completion moves to authenticated emitting binding.revoked, switch.completed, and account.status with old bindings revoked before the new projection; any non-terminal state on custody unavailability moves to unavailable emitting custody.unavailable and account.status failing close; and unavailable on custody recovery with valid material moves to authenticated emitting custody.recovered and account.status with the projection emitted only after validation."
    condition: Whenever account session state transitions execute.
    failure: Reject transitions, events, or orderings outside this table.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r074
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The account status snapshot is fixed and redacted
    modality: must
    scope:
      - runtime.protected-session
    statement: GetAccountSessionStatus separates the RPC call result from current account state, a successful RPC returns an AccountSessionSnapshot whose fields are fixed to sequence, state, reason_code, account_reason_code, and account_projection, and the projection contains at most account_id, display information, realm_environment_id when admitted, and the K-ACCSVC-018 admitted workspace membership projection and never returns a raw token, refresh token, JWT, or subject_user_id field.
    condition: Whenever account session status is read.
    failure: Reject snapshots outside the fixed field set and token or subject disclosure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r075
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Account event delivery is ordered and honest
    modality: must
    scope:
      - runtime.protected-session
    statement: SubscribeAccountSessionEvents server-stream events carry delivery_kind of snapshot, replay, or live, a first subscription with after_sequence 0 immediately receives the current snapshot and then only live events with higher sequence, a reconnect first replays in ascending sequence order, then receives the current snapshot, and then only live events with higher sequence, replay_truncated or a sequence gap requires the caller to call status again and forbids guessing or synthesizing state, and uint64 sequence values crossing the JS boundary always use decimal strings.
    condition: Whenever account session events are subscribed or delivered.
    failure: Reject out-of-order delivery and synthesized state after truncation or gaps.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r076
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Login attempts keep the verifier inside Runtime
    modality: must
    scope:
      - runtime.protected-session
    statement: BeginLogin creates a login attempt and returns a UX instruction envelope such as oauth_authorization_url, callback_origin, pkce_challenge, state, and expires_at while Kit and Desktop never obtain the PKCE verifier, and CompleteLogin accepts the typed proof envelope of K-ACCSVC-008 which Runtime validates before writing custody and transitioning state.
    condition: Whenever login attempts are created or completed.
    failure: Reject verifier exposure and state transitions before validated custody writes.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r077
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Realm unary brokering is bounded and typed
    modality: must
    scope:
      - runtime.protected-session
    statement: InvokeRealmUnary executes a single admitted Realm operation according to the realm broker operations table, Platform app capability and grant, Runtime app-session scope, and the host-bound caller envelope, Runtime internally obtains and refreshes the bearer, validates the canonical Realm base, operation, path, query, body, and response size, and returns only bounded application JSON, response headers, bearer, access, and refresh tokens, JWT, and credential-like JSON keys and values are never returned to the app and scanner hits fail close, timeout_ms is a Runtime-owned whole-operation budget within which Runtime completes typed broker mapping, the native protected carrier's gRPC deadline preserves a fixed completion and serialization margin beyond that budget and never preemptively collapses a Realm timeout into runtime-service-unavailable, only DNS, connection, TLS, timeout, and response-read failures and HTTP 408, 502, 503, and 504 map to BROKER_REALM_UNAVAILABLE and REALM_UNAVAILABLE, 401 still failing after one forced refresh and exactly one retry maps to BROKER_AUTH_INVALID and AUTH_TOKEN_INVALID, 403 maps to BROKER_FORBIDDEN and PRINCIPAL_UNAUTHORIZED, 404, 409, 429, and 400 or 422 map to BROKER_NOT_FOUND and REALM_NOT_FOUND, BROKER_CONFLICT and REALM_CONFLICT, BROKER_RATE_LIMITED and REALM_RATE_LIMITED, and BROKER_REQUEST_REJECTED and REALM_REQUEST_REJECTED respectively, 3xx, 405 and 415, and malformed success responses map to BROKER_CONTRACT_FAILED and REALM_CONTRACT_INVALID, other 5xx map to BROKER_OPERATION_FAILED and REALM_OPERATION_FAILED, and these branches never borrow AI_PROVIDER_*.
    condition: Whenever a Realm broker unary operation executes or fails.
    failure: Fail close on scanner hits and reject mappings outside this branch table.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r078
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Logout success is Runtime-owned
    modality: must
    scope:
      - runtime.protected-session
    statement: Logout revokes the local session and all bindings and is idempotent, caller-facing logout success may be projected only after Runtime has accepted or completed the Runtime-owned logout transition or has emitted a corresponding account status projection, and local first-party apps may stop local side effects while logout is pending but must not claim signed-out-locally success while Runtime custody may still contain an authenticated session.
    condition: Whenever logout executes or is projected.
    failure: Reject premature logout success projections.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r079
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Switch is atomic and binding subjects are internal
    modality: must
    scope:
      - runtime.protected-session
    statement: SwitchAccount is an atomic transition in which old bindings are revoked before the new projection, IssueScopedAppBinding follows the scoped app binding contract with the account subject derived internally, and RevokeScopedAppBinding follows the scoped app binding contract.
    condition: Whenever accounts switch or scoped bindings are issued or revoked.
    failure: Reject non-atomic switches and externally supplied binding subjects.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r080
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Presence verification uses a Runtime verifier chain
    modality: must
    scope:
      - runtime.protected-session
    statement: RequestPresenceVerification invokes a Runtime-owned presence verifier chain for a caller-stated purpose and bounded TTL, it must not treat an existing account session, access token, refresh token, Realm server session, app-local password prompt, or caller assertion as fresh presence, Runtime may use a formal local OS verifier first and then a Runtime-owned fresh Nimi reauth provider NIMI_REAUTH that forces a new Realm login interaction with prompt=login, Runtime-generated state and nonce, and subject match, and missing or unavailable presence capability returns presence_verification_unavailable and fail-closes.
    condition: Whenever presence verification is requested.
    failure: Return presence_verification_unavailable and fail close without substitute proofs.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r081
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Account RPC callers follow their matrix rows
    modality: must
    scope:
      - runtime.protected-session
    statement: Public local account RPCs follow the rows pinned in the account RPC permission matrix table, BeginLogin, CompleteLogin, Logout, and SwitchAccount are Desktop account UX operations requiring ACCOUNT_CALLER_MODE_DESKTOP_SHELL, non-Desktop local first-party apps, third-party local apps, binding-only Avatar, and ordinary renderers must request Desktop-owned account UX instead of calling them, local apps may consume admitted status and event, presence, grant, and selected operation surfaces only after principal, record, session, and policy resolution but cannot call login completion, raw token, logout, or switch, local apps require the common host-bound local-app session and app_id or a host envelope is never sufficient, and unauthenticated or anonymous status may be projected only after the caller mode's registry and envelope admission succeeds because shape-only AccountCaller is never sufficient.
    condition: Whenever public local account RPCs are admitted per caller mode.
    failure: Deny callers outside their admitted matrix rows.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r082
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Desktop shell admission joins connection and envelope
    modality: must
    scope:
      - runtime.protected-session
    statement: For ACCOUNT_CALLER_MODE_DESKTOP_SHELL, admission is the live K-PLOCAL-006 desktop_account_host connection joined to the native host-owned app, app-instance, device, caller-kind, and source-host envelope, the generic binding-only RegisterApp registry is neither required nor sufficient for Desktop account status or control, and this keeps the request-body AccountCaller non-authoritative while allowing the fixed production service, which exposes no ordinary public TCP listener, to perform Desktop-owned login.
    condition: Whenever Desktop shell account admission is evaluated.
    failure: Reject registry-based or body-based Desktop admission.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r083
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Raw tokens and removed identities never return
    modality: must_not
    scope:
      - runtime.protected-session
    statement: Any RuntimeAccountService method accepts a raw Realm token, refresh token, raw JWT, or caller-provided subject_user_id as account truth, or any registry, first-party, bundled, Desktop, Avatar, Zhiyu, local-app, renderer, or test posture restores the removed public token and refresh identities, whereas Runtime service code may obtain bearer material only through a private helper and consume it inside the same Runtime-owned operation.
    condition: Whenever account methods receive credentials or removed identities are proposed.
    failure: Reject the input or restoration and keep bearer access private.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r084
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Account event families and payloads are closed
    modality: must
    scope:
      - runtime.protected-session
    statement: The account event families are account.status, login.started, login.completed, login.failed, login.timed_out, refresh.started, refresh.completed, refresh.failed, logout.started, logout.completed, switch.started, switch.completed, custody.unavailable, custody.recovered, binding.issued, binding.activated, binding.suspended, binding.revoked, binding.expired, binding.superseded, and binding.replay_detected, minimal payload fields are event_id, monotonically increasing sequence, emitted_at, reason_code, account_projection_redacted only when an account is involved, and binding_id only when a binding is involved, redaction forbids any form of access token, refresh token, PKCE verifier, auth code, or secret material, the account projection contains only account_id and display information, binding events contain only binding_id and the relation tuple without carrier-internal material, reconnect behavior is uniquely specified by the delivery_kind ordering of K-ACCSVC-005, the snapshot reflects the current sequence at the subscription point, replay and live are strictly increasing without duplicates, and when replay is unavailable replay_truncated is emitted and the caller must re-pull status.
    condition: Whenever account session events are emitted or redacted.
    failure: Reject undeclared families, missing payload fields, and redaction violations.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r085
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Custody is exclusive and platform-neutral
    modality: must
    scope:
      - runtime.protected-session
    statement: The platform-neutral custody semantics are that RuntimeAccountService exclusively holds durable credential material inside the isolated Runtime service principal, material enters only the Runtime-private service call chain, write, rotation, reuse detection, recovery, audit redaction, and fail-close-on-unavailability semantics do not change per platform, callers, Desktop, Kit, SDK, renderer, and apps cannot select a custody backend, key source, protected state location, or fallback, the protected-local custody profiles table is pinned as the sole machine-readable authority for each platform's protected store, key binding, durable anchor, and unavailable disposition, each profile depends on its isolated principal through service_principal_profile_ref, platform primitives appearing in a profile do not change this rule's owner, material visibility, rotation, or fail-close semantics, and unadmitted profiles carry requirements only and cannot produce a positive custody chain.
    condition: Whenever credential custody is established or selected.
    failure: Reject caller-selected custody and positive chains from unadmitted profiles.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r086
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Custody rotation and recovery rules are fixed
    modality: must
    scope:
      - runtime.protected-session
    statement: Runtime owns refresh material and Desktop and apps store no durable token, access tokens exist only in Runtime custody and the private service call chain and are never projected to app, Desktop, SDK, Kit, renderer, or host or used for app-direct Realm connection, refresh token rotation is atomic with the new token committed before the old is discarded, observing an old refresh token again after rotation revokes the local chain, emits refresh.failed with reason replay, and enters reauth_required or unavailable, Runtime rebuilds the single-flight proactive refresh timer keyed to access-token expiry after login, successful refresh, and service restart recovery, the first 401 on Realm unary triggers one forced reactive refresh and exactly one retry with a second 401 entering reauth, when transport proves the request body never left the process Runtime recovers unmarked custody, stays refresh_pending, and retries, once a request may have been sent with an unknown result Runtime clears custody and enters reauth_required without reusing the rotation token, audit never records token values, auth codes, PKCE verifiers, or refresh material, interactive-user generic keyrings, Credential Manager or vault, login Keychain, secret-service or libsecret session stores, Desktop secure stores, and app-owned vaults are forbidden production custody, no retained user-session credential is imported and fresh login and connector credential re-entry are required, and custody unavailability never falls back to in-memory durable account truth, Desktop shared auth, or app-local custody.
    condition: Whenever custody material is written, rotated, recovered, or unavailable.
    failure: Fail close per the custody disposition without fallback custody.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r087
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Login attempt and proof envelope shapes are fixed
    modality: must
    scope:
      - runtime.protected-session
    statement: BeginLogin creates login_attempt_id, a PKCE verifier and challenge stored only inside Runtime, the redirect URI and allowed callback origin, state and nonce, expires_at, and a UX instruction envelope of kit-readable fields without the verifier, and the CompleteLogin proof envelope carries login_attempt_id, the callback code or a sealed kit-produced completion ticket, the returned state and nonce, redirect and callback metadata, and Desktop UX trace metadata without token material.
    condition: Whenever login attempts and proof envelopes are shaped.
    failure: Reject envelopes exposing the verifier or token material.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r088
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The browser callback is the default login path
    modality: must
    scope:
      - runtime.protected-session
    statement: The local first-party default login path is the Nimi Auth Browser callback in which the app and kit receive only code and state while Runtime holds the login attempt, state, and PKCE verifier and executes the code exchange, when platform constraints require kit to perform the OAuth exchange kit must return a sealed completion ticket and Desktop never observes bearer or refresh tokens, the sealed completion ticket is not the default branch and implementations must fail closed until its crypto, key custody, and replay semantics are separately admitted, and under no path may Desktop or kit become the refresh-token custody owner or durable account session owner.
    condition: Whenever login route execution paths are selected.
    failure: Fail closed on unadmitted sealed-ticket semantics and reject custody ownership drift.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r089
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Proof replay has exact reason codes
    modality: must
    scope:
      - runtime.protected-session
    statement: A repeated proof for a completed attempt returns idempotent success only when no sensitive material is exposed again, and an expired, mismatched, or already consumed proof fails close with reason codes proof_expired, proof_mismatched, or proof_consumed.
    condition: Whenever login proofs are replayed.
    failure: Fail close with the exact reason codes.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r090
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Login route ownership is table-fixed
    modality: must
    scope:
      - runtime.protected-session
    statement: "In local first-party mode the login route decision is owned by Runtime with the default product path being the Nimi Auth Browser callback code and state, and route ownership is: checkEmail is local first-party superseded with the Nimi Auth Browser route owning the UX decision and Web or cloud use allowed only after an explicit Web or cloud adapter; passwordLogin is local first-party superseded with Desktop opening the Nimi Auth Browser flow and Web or cloud using the adapter; oauthLogin has Runtime owning the Nimi Auth attempt and callback code exchange with sealed proof used only for platform-forced kit token observation and Web or cloud using the adapter; requestEmailOtp is local first-party superseded with the Nimi Auth Browser route owning the UX decision and Web or cloud using the adapter; verifyEmailOtp has Runtime completing the browser callback proof and custody with Web or cloud using the adapter; walletChallenge is local first-party superseded unless the Nimi Auth Browser internally delegates wallet UX, with Web or cloud using the adapter; walletLogin has Runtime completing the Nimi Auth callback and custody with Web or cloud using the adapter; and in local first-party mode Desktop never calls a Realm route directly as login authority."
    condition: Whenever login routes are owned or invoked.
    failure: Reject direct Desktop Realm login routes and ownership outside this table.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r091
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Logout and revocation follow one exact order
    modality: must
    scope:
      - runtime.protected-session
    statement: The minimal remote-revocation detection surface is refresh-time failure and JWKS and revocation verification with push and poll channels outside Phase 1 admission, the logout and remote revocation event order is detection of revoke or failure, then suspend or revoke of all active bindings, then clearing custody material, then emitting account.status of reauth_required or anonymous, any order violation fails close and emits logout.failed, a failed Logout projects fail-closed into reauth_required, unavailable, or an explicit logout-failed UX state and never converts renderer-local cache clearing into account logout success, and local first-party consumers may clear volatile streams, optimistic UI, or query state as side effects while account state remains Runtime-owned until Runtime emits the authoritative transition.
    condition: Whenever logout or remote revocation executes.
    failure: Fail close with logout.failed on order violations and reject synthesized logout success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r092
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Daemon restart recovery is typed
    modality: must
    scope:
      - runtime.protected-session
    statement: After a daemon restart Runtime attempts to recover the account session from secure custody, successful recovery with unexpired material yields authenticated plus custody.recovered, unavailable custody yields unavailable, readable custody with expired material yields expired, readable custody failing reuse or inconsistency detection yields reauth_required, all bindings become invalid at daemon restart and callers must re-request them, and Runtime completes binding revocation event delivery with reason daemon_restart_no_recovery before the recovery projection.
    condition: Whenever the daemon restarts and account state recovers.
    failure: Fail into the exact recovery states and reject projections before revocation delivery.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r093
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The registration caller matrix is exact
    modality: must
    scope:
      - runtime.protected-session
    statement: "The app registration caller matrix is: the Desktop shell registers through Runtime-mediated Desktop host registration, requires authenticated or anonymous account state for account UX only, sources bindings from the Runtime account broker with account-control exclusive to this caller mode, and is forbidden durable token custody, public refresh, renderer caller truth, and any bearer projection; an SDK local first-party app registers through bundled first-party bootstrap, requires the current Runtime-owned account generation when required, sources Runtime-owned first-party bindings, and is forbidden account control, tokens, and app-provided subject or session; a third-party local app as LOCAL_APP registers through PrepareLocalAppLaunch plus verified process bind plus request-empty OpenLocalAppSession, requires the current Runtime-owned account generation when an operation requires account, sources the local-app principal, record, and session with an admitted public permission decision only when applicable, and is forbidden account control, tokens, caller-selected principal, account, permission, or selector, and app_id fallback; the default Avatar app nimi.avatar registers through shipped bundled first-party bootstrap, requires the current Runtime-owned account generation when required, sources the Runtime-owned first-party service entitlement, and is forbidden third-party local-app principal and permission posture, account control, and tokens; binding-only Avatar mode has no direct account registration and sources a Runtime-issued scoped binding from the owner surface while forbidden account access tokens, refresh tokens, anchor creation, and independent auth truth; a Web or cloud app registers through the explicit Web or cloud adapter with a Web or cloud session and is forbidden local Runtime account authority claims; and an external principal uses a binding-only external-principal session with no local account state, no binding source, an unavailable public permission surface, and every local protected account claim forbidden."
    condition: Whenever a caller registers for account participation.
    failure: Reject registrations, states, binding sources, or claims outside each caller's row.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r094
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Broker activation switches atomically
    modality: must
    scope:
      - runtime.protected-session
    statement: The account broker implementation may land as an inert substrate before the Desktop and SDK switch, in inert mode it must not act as active first-party local account truth, provide production account projection to Desktop, Avatar, or SDK, publish production first-party scoped bindings, read, mirror, or reconcile Desktop shared auth, or become a Desktop or SDK local auth fallback, the active owner switch must close atomically with Runtime broker activation, SDK and kit local first-party seam removal, and Desktop login UX adapter conversion in one authority transition that deletes or hard-blocks the replaced Desktop shared-auth and SDK local token and subject owner paths before completion, and the same switch must activate the Runtime-mediated broker so all local app data calls complete credential exchange, refresh, and Realm invocation inside Runtime with app, host, and SDK bearer providers and direct Realm paths deleted.
    condition: Whenever the account broker lands or the active owner switch executes.
    failure: Reject inert-mode authority behavior and non-atomic owner switches.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r095
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Session kinds split custody and lifetime
    modality: must
    scope:
      - runtime.protected-session
    statement: The account session answers who is logged in on this machine's Runtime, the app session answers which registered app instance is calling and is owned by RuntimeAuthService, the external-principal session remains a binding-only RuntimeAuthService concept, the removed public credential-grant family cannot be restored and no external session can upgrade into local protected account authority, K-AUTHSVC-012 is split so the app session stays in memory and dies on restart while the account session uses secure Runtime custody with restart recovery per K-ACCSVC-007 and K-ACCSVC-011, and the scoped binding subject is derived by Runtime from account custody internally with the caller's subject_user_id forbidden.
    condition: Whenever session kinds and their custody are related.
    failure: Reject restored grant families, external upgrades, and caller-derived binding subjects.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r096
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Account lifecycle audit is complete and redacted
    modality: must
    scope:
      - runtime.protected-session
    statement: Account lifecycle, binding issuance, binding revocation, login attempts, refresh, logout, switch, and custody unavailability and recovery are audited, minimal fields follow K-AUDIT-001, token values, auth codes, PKCE verifiers, and refresh material are never recorded, and audit fields include account_id, login_attempt_id, and binding_id when applicable, reason_code, and device_id.
    condition: Whenever account lifecycle events are audited.
    failure: Reject missing audit records and credential-material logging.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r097
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Device identity participates without exposure
    modality: must
    scope:
      - runtime.protected-session
    statement: device_id, already present in RegisterApp of the runtime auth proto, participates in the account custody partition key, login attempt audit context, and scoped binding relation, and device_id is never exposed to Avatar or local first-party apps as account truth.
    condition: Whenever device identity participates in custody, audit, or binding.
    failure: Reject device_id exposure as account truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r098
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The Web and cloud boundary is fenced
    modality: must
    scope:
      - runtime.protected-session
    statement: Web and cloud mode is not a local first-party Runtime account mode, a Web app may have no local daemon and must use the explicit Web or cloud adapter to interact with Realm directly, the Web or cloud adapter is unreachable from local first-party SDK, Desktop, and the default Avatar app, and any Web or cloud exception is explicitly fenced and never leaks into local first-party Runtime mode.
    condition: Whenever Web or cloud account interaction is designed.
    failure: Reject adapter reachability and exception leakage into local first-party mode.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r099
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Workspace membership is a redacted Realm projection
    modality: must
    scope:
      - runtime.protected-session
    statement: Workspace membership truth is Realm-owned product authority projected into Runtime account custody, login, and refresh as a redacted membership projection, Runtime must not create a local workspace registry, accept caller-provided workspace membership, or infer membership from workspace_id, subject_user_id, app-local cache, SDK state, Desktop state, or knowledge bank metadata, the admitted projection shape is workspace_id, membership_state in active, suspended, revoked, and unknown, realm_environment_id, observed_at, and optional redacted display metadata, the projection is derived only during account login, account refresh, custody recovery, or an admitted Realm membership refresh owned by RuntimeAccountService, a missing, stale, unavailable, or unknown projection fails closed for workspace binding issuance and workspace binding consumption, active membership is required at both issue time and consume time, membership loss, realm-environment mismatch, custody unavailability, refresh failure, logout, account switch, policy revocation, or daemon restart revokes or invalidates related workspace bindings before any positive WORKSPACE_PRIVATE allow can be returned, and the projection surfaces to local first-party status only as redacted account projection without exposing Realm tokens, raw JWT claims, subject_user_id, or membership proof material that apps can replay.
    condition: Whenever workspace membership is projected or consumed.
    failure: Fail closed on missing or stale projections and revoke bindings before positive allows.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r100
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Workspace binding methods stay blocked pending authority
    modality: must
    scope:
      - runtime.protected-session
    statement: RuntimeAccountService is the only possible owner of workspace binding issuance, revocation, and the internal resolver seam used by runtime knowledge authorization, no transport or origin is admitted for public IssueWorkspaceBinding or RevokeWorkspaceBinding which are explicit blocked_pending_authority rows denying ordinary authenticated, SDK, Desktop, binding-only, local-app, Web or cloud, and external-principal callers, a future admission must name the exact protected origin and operation policy before either method may be implemented or exported, workspace binding issue and revoke are workspace-specific authority not implemented by broadening IssueScopedAppBinding or RevokeScopedAppBinding, if independently admitted later issue and revoke may only mutate workspace knowledge attachments and must not return account truth, membership truth, Realm tokens, or resolver decisions, ResolveWorkspaceBinding is not a public RPC, not an SDK- or Desktop-visible method, and not a probing surface but an internal Go runtime capability consumed by RuntimeCognitionService through the cognition KnowledgeAuthorizer seam, resolver matching uses Runtime-authenticated caller identity from the app session and envelope and account projection as runtime_app_id, app_instance_id, device_id, account_id, and realm_environment_id and never KnowledgeRequestContext.app_id, subject_user_id, attachment self-claims, app-local cache, Desktop state, or SDK state as proof, issue-time and consume-time validation both require K-ACCSVC-018 active membership for the target workspace, and account state other than authenticated, refresh or custody uncertainty, or a stale workspace membership projection fails closed.
    condition: Whenever workspace bindings are issued, revoked, or resolved.
    failure: Deny the blocked methods and fail closed on non-authenticated or stale membership state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r101
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Fresh presence has exact provider semantics
    modality: must
    scope:
      - runtime.protected-session
    statement: RequestPresenceVerification is a Runtime-owned user-presence check for app surfaces needing a second confirmation before revealing sensitive local data, it confirms that the currently present operator passed a Runtime-owned local interaction within a bounded TTL and is not durable identity proof, Realm may participate only through the Runtime-owned fresh Nimi reauth provider with ordinary Realm session state insufficient, Runtime selects and executes the concrete provider chain of OS credential, Windows Hello or PIN, or macOS LocalAuthentication first, Nimi reauth fallback, or another admitted local interaction, apps and SDKs must not select providers by passing passwords, tokens, secrets, or raw challenge material, a current authenticated account session is necessary for account projection but never sufficient for positive presence verification, Realm login, access-token refresh, GetAccessToken, InvokeRealmUnary, server-side /me, and app-owned session checks do not satisfy this method, Runtime-owned NIMI_REAUTH may satisfy it only when Runtime forces a fresh Realm OAuth login prompt, owns the loopback callback, allocates that callback only on loopback ports 1024..49151 below the OS dynamic-port range, validates state and code-verifier exchange, verifies the returned account subject matches the current Runtime account, and discards any token material instead of turning it into app-owned session truth, the request carries a non-empty purpose and a bounded TTL that Runtime may clamp downward, a positive response includes a verified_until timestamp no later than the accepted TTL window, when Runtime has neither a formal local presence verifier nor a formal fresh Nimi reauth fallback for the host and Realm configuration the method returns accepted=false, state unavailable, and account reason presence_verification_unavailable with no sensitive app data shown, and provider result, method, state, and expiry may be projected while provider secrets, password material, bearer tokens, and OS challenge details are never returned or logged.
    condition: Whenever fresh local presence verification executes.
    failure: Return unavailable and fail closed without substitute proofs or secret disclosure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r102
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The Windows presence launcher is single-use loopback
    modality: must
    scope:
      - runtime.protected-session
    statement: On Windows the fixed restricted-service principal cannot acquire an interactive-user token merely to launch a browser, so for a protected Desktop control operation only Runtime may deliver its generated authorization URL to a single-use, random, loopback-only Desktop browser launcher, Runtime must first derive the protected Desktop transport and process origin and must reject non-loopback, redirected, or malformed launchers, the launcher endpoint must be random and single-use with reuse or delivery failure failing closed, Runtime must retain the OAuth attempt, state, nonce, PKCE verifier, callback, exchange, subject match, and final presence verdict, the launcher receives no bearer or verifier, cannot select a provider, cannot assert completion, and is neither authorization nor presence proof, and the launcher endpoint is request-scoped technical metadata only and must not be persisted or logged.
    condition: Whenever the Windows presence browser launcher is used.
    failure: Fail closed on reuse, delivery failure, or malformed launchers.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r103
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Account states fail close without fabrication
    modality: must
    scope:
      - runtime.protected-session
    statement: Fresh presence verification follows the fail-close doctrine in that a missing, unavailable, cancelled, expired, or non-verified provider fails closed and is never replaced by ordinary login state, access-token state, Realm server state, or app-owned prompts with the only Realm-backed exception being the Runtime-owned NIMI_REAUTH flow of K-ACCSVC-021, and unknown account state, unavailable custody, a missing or non-active binding, an expired, replayed, or mismatched login proof, a failed refresh with no recovery path, unrecoverable custody after daemon restart, failed remote-revocation detection without proof that the local session remains valid, and an account projection missing required fields all fail close without fabricated success.
    condition: Whenever account or presence state cannot be positively established.
    failure: Fail close without fabricated success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r104
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The local-app caller posture is Runtime-derived
    modality: must
    scope:
      - runtime.protected-session
    statement: K-PLOCAL-008 admits a local-app session only from an atomically consumed launch lease on the verified child channel, the LOCAL_APP caller class and local_app_principal_id are Runtime-derived and the request cannot select caller class, account, principal, record, permission decision, release, or capabilities, account-control and credential-bearing methods remain denied, a zero-permission session is valid origin proof and may use only base entitlements and its own public permission posture, it cannot list protected Agent, account, or resource inventory, and every user-permission operation remains unavailable until its full P-PERM-017 slice is admitted.
    condition: Whenever the local-app caller posture is evaluated.
    failure: Deny caller-selected identity and unavailable operations.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r105
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: One coordinator returns one immutable decision
    modality: must
    scope:
      - runtime.protected-session
    statement: RuntimeAccountService owns the private provenance-agnostic per-operation coordinator that on every selected local-app operation combines the current account generation when required, K-APP-* principal and record resolution, K-PLOCAL-* live process and session resolution, the current owner permission decision when the authority class requires it, and the canonical operation owner policy, the coordinator returns one immutable decision and audit context, owns none of those inputs, and creates no secondary cache or portable credential, missing, expired, revoked, denied, tombstoned, process-mismatched, or account-mismatched inputs deny the operation, and immutable provenance remains an opaque input seam returning typed unavailable until 0P/P admits a producer.
    condition: Whenever a local-app operation decision is coordinated.
    failure: Deny the operation on any missing or mismatched input.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r106
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The Desktop Realm broker admits exact operations
    modality: must
    scope:
      - runtime.protected-session
    statement: RuntimeAccountService.InvokeRealmUnary admits only the exact Desktop source-readiness operations enumerated by the realm broker operations table, namely world list and detail reads, public source detail, PersonaCharacter list, get, and discovery, and WorldCharacter detail with its bound entity and relationships, packet issuance is not a broker operation because RuntimeAgentService acquires it internally for MaterializeRealmSource, each broker row remains Desktop-shell-only and requires the verified protected Desktop control origin, the desktop_account_host role, the host-bound caller envelope, and the current authenticated account, and an unlisted operation or any non-Desktop caller fails with BROKER_OPERATION_NOT_ADMITTED because generic proxy behavior is forbidden.
    condition: Whenever a Realm broker operation is admitted.
    failure: Fail with BROKER_OPERATION_NOT_ADMITTED for unlisted operations or non-Desktop callers.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r107
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Runtime alone touches Realm bases and bearers
    modality: must
    scope:
      - runtime.protected-session
    statement: Runtime alone selects the configured canonical Realm base, holds and refreshes the Realm bearer, injects authorization, validates the row-specific OpenAPI request shape and response-size limit, and rejects credential-bearing response headers or bodies, and no public grant, portable envelope, renderer or app token provider, caller-selected Realm base, direct Realm path, or fallback is admitted.
    condition: Whenever broker requests and responses are validated.
    failure: Reject credential-bearing responses and every non-Runtime Realm path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r108
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The account permission matrix is executable authority
    modality: must
    scope:
      - runtime.protected-session
    statement: The Desktop account projection and control, scoped-binding control, local-app public permission status and request, selected local-app operations, and Realm-broker transport prerequisites are admitted only through their exact protected-transport and owner rows, there is no public permission decision or revoke RPC, no portable envelope, blanket local-app authority, or raw-token projection is admitted, unlisted broker, realtime, and media operation rows remain denied, the account RPC permission matrix table is pinned as the executable authority for per-caller RuntimeAccountService admission, Runtime handlers enforce the matrix before state mutation or token and credential access, InvokeRealmUnary uses broker-consumer admission rather than the account-control helper, Runtime-private refresh is a non-RPC internal capability with no public local-app caller mode, each allow_when row that requires protected_desktop_control_origin or protected_local_app_origin resolves that requirement through the matrix's platform_transport_binding to the corresponding abstract protected transport class and same-OS profile, missing or ambiguous resolution fails generation, and the existing bundled first-party requirement remains outside the protected local transport matrix and is unchanged.
    condition: Whenever per-caller account RPC admission is enforced or generated.
    failure: Deny unlisted rows and fail generation on missing or ambiguous binding resolution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r109
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Caller envelopes never authorize
    modality: must
    scope:
      - runtime.protected-session
    statement: App id, source host, caller enum, manifest, renderer metadata, host self-description, launch id, and portable bearer remain non-authorizing, local app authority comes only from the inherited native channel and its verified live peer, and direct local gRPC and Electron or Tauri renderer envelopes remain deny-all.
    condition: Whenever caller envelopes are evaluated for authority.
    failure: Deny envelope-derived authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r110
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Authority classes resolve in one decision
    modality: must
    scope:
      - runtime.protected-session
    statement: For each local-app operation Runtime first resolves the authority class from P-PERM-015, a base entitlement evaluates the exact principal, local record, process-bound session, current account partition, path and quota, and owner policy but must not require a user permission, a user permission additionally requires an admitted public permission id, owner-issued selector, current owner lifecycle, permission-to-operation mapping, presence when required, and the operation owner's exact resource policy in one decision, app-owned commands and OS rights do not enter this coordinator, and enabling Developer Mode, admitting a project, opening a session, or being first party creates no synthetic permission.
    condition: Whenever local-app operation authority classes are resolved.
    failure: Reject synthetic permissions and decisions missing required conjunctions.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r111
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Coordinator presence and audit are exact
    modality: must
    scope:
      - runtime.protected-session
    statement: Presence follows the local app presence protocol table, only a Runtime-owned OS verifier or fresh NIMI_REAUTH result can satisfy it and caller assertions, renderer prompts, login state, bearer state, and prior sessions do not, the coordinator records local_app_principal_id, the exact immutable or development principal-lineage branch, record and session identifiers and revisions, the permission decision revision only when an admitted user permission applies, account id and generation, process identity, permission id when applicable, and the internal operation and deny reason in the Runtime audit context without logging credentials, and no downstream service may reinterpret or weaken this decision.
    condition: Whenever coordinator presence is satisfied or decisions are audited.
    failure: Reject substitute presence proofs and downstream reinterpretation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r112
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Third-party Agent operations stay unavailable
    modality: must
    scope:
      - runtime.protected-session
    statement: K-AGCORE-006e is not a base entitlement, third-party Agent inventory and conversation operations remain unavailable until agents.interact has a complete admitted selector, lifecycle, SDK and Kit, UI, audit, revoke, and endpoint slice, and no old operation grant or caller-selected Agent id can promote them.
    condition: Whenever third-party Agent operations are requested.
    failure: Return unavailable and reject promotion.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r113
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The canonical config location is service-owned
    modality: must
    scope:
      - runtime.protected-session
    statement: Production Runtime configuration is service-principal-owned state at the OS-profile-specific protected location pinned in the protected-local runtime principal profiles table, its physical path is not a Desktop, SDK, or public CLI interface and is never projected to renderer or app callers, ~/.nimi/runtime/config.json, ~/.nimi/config.json, and any other user-writable file are forbidden production inputs, and this pre-release hardcut imports no retired config or credential material.
    condition: Whenever the production configuration location or its inputs are resolved.
    failure: Reject user-writable inputs and physical-path projection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r114
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The updater dataRootRef read is a bounded exception
    modality: must
    scope:
      - runtime.protected-session
    statement: The non-release development updater has one narrower non-Runtime exception in that before invoking the signed installer it may read only the exact dataRootRef field from the current ~/.nimi/runtime/config.json and promote that value to an explicit installer selection, the Runtime service never reads that file, none of its other fields enter protected configuration, a missing, malformed, relative, volume-root, or inaccessible value fails before build or installation, and this is updater input selection, not production Runtime config authority or a compatibility fallback.
    condition: Whenever the development updater reads the user config file.
    failure: Fail before build or installation on invalid values and reject any other field.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r115
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Source priority is a closed partition
    modality: must
    scope:
      - runtime.protected-session
    statement: Production source authority is the closed partition pinned in the config schema table of signed OS service and release boot security, service-owned immutable and mutable state, Runtime-private secret custody, then spec-governed defaults where the field permits a default, and environment variables, argv, user-writable config, renderer metadata, and app manifests have no production selection priority because they are rejected inputs.
    condition: Whenever configuration sources are prioritized.
    failure: Reject the forbidden inputs entirely.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r116
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Schema versioning rejects unknown fields
    modality: must
    scope:
      - runtime.protected-session
    statement: Service-owned state contains schemaVersion, currently 1, every field belongs to exactly one production authority class, and unknown fields are rejected and never ignored for forward compatibility.
    condition: Whenever service-owned state is parsed.
    failure: Reject unknown fields.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r117
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Provider names are canonical
    modality: must
    scope:
      - runtime.protected-session
    statement: Provider names in configuration use the canonical values of the provider catalog, and aliases and legacy names are rejected.
    condition: Whenever provider names are configured.
    failure: Reject aliases and legacy names.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r118
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Secrets appear only as opaque references
    modality: must
    scope:
      - runtime.protected-session
    statement: Provider records may contain only an opaque credentialRef whose referenced material is created and resolved inside Runtime service-principal custody, and inline apiKey, apiKeyEnv, process-environment lookup, user-session generic keyring or vault storage, renderer projection, and app-provided secrets are forbidden production shapes.
    condition: Whenever provider credentials are configured.
    failure: Reject forbidden credential shapes.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r119
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: State writes are atomic and secret-free
    modality: must
    scope:
      - runtime.protected-session
    statement: Runtime writes service-owned non-secret state with fail-closed atomic replace, owner-only ACLs, symlink and reparse-point refusal, and durability appropriate to the OS profile, and secrets use the protected custody backend defined by K-ACCSVC-007 and the pinned protected-local custody profiles table and are never serialized into the non-secret state document.
    condition: Whenever service-owned state is written.
    failure: Fail closed on unsafe writes and reject secret serialization.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r120
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Config mutation uses typed protected control only
    modality: must
    scope:
      - runtime.protected-session
    statement: Production configuration is mutated only through typed protected control owned by Runtime, Desktop may receive redacted typed status and may request an admitted mutation, public CLI config init, get, and set, arbitrary JSON patching, physical-path access, and whole-document reads are not production surfaces, and any retained command is a separately signed synthetic non-product fixture and cannot provide product evidence.
    condition: Whenever configuration is mutated or read.
    failure: Reject non-production surfaces and product-evidence claims from retained commands.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r121
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Validation failure never partially starts
    modality: must
    scope:
      - runtime.protected-session
    statement: Configuration validation failure fails close and never continues core startup paths with partial success.
    condition: Whenever configuration validation fails.
    failure: Fail close without partial startup.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r122
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Environment bindings are non-product fixtures
    modality: must
    scope:
      - runtime.protected-session
    statement: Provider probe target environment bindings are non-product probe fixtures only, production provider endpoint and credential selection comes from Runtime-owned connector and provider state, and an environment variable can neither create nor override a production provider record.
    condition: Whenever provider endpoints or credentials are selected.
    failure: Reject environment-derived provider records.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r123
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Reload boundaries are explicit and table-owned
    modality: must
    scope:
      - runtime.protected-session
    statement: Hot versus restart effect boundaries for configuration changes are explicitly declared and never implicit, service-owned Runtime configuration follows the per-field restart, hot, or immutable disposition pinned in the config schema table with callers unable to infer reload behavior from a physical document, and Runtime Agent AI Config under K-AGCORE-144 through K-AGCORE-150 is outside this contract's machine config plane, persists via RuntimeAgentService RPC in the runtime store, takes effect hot at next-turn granularity, and does not affect the execution snapshot of in-flight turns.
    condition: Whenever configuration reload behavior is determined.
    failure: Reject implicit effect boundaries and document-inferred reload behavior.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r124
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Credential capture terminates inside Runtime
    modality: must
    scope:
      - runtime.protected-session
    statement: Configuration may carry opaque credential references only, interactive product credential capture terminates at a Runtime-owned protected connector or control operation which stores the credential under the isolated Runtime principal and returns only redacted typed state, Desktop, public CLI, SDK, and app callers must not persist, cache, replay, or re-submit raw credential material after that operation, and there is no inline-memory or user-file success fallback.
    condition: Whenever product credentials are captured or referenced.
    failure: Reject raw credential retention and fallback success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r125
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Materialization proof verification is closed
    modality: must
    scope:
      - runtime.protected-session
    statement: Source materialization proof verification uses the configured Realm issuer and JWKS trust chain plus a closed materialization-purpose signing-key registry, Runtime accepts only detached JWS with alg RS256, a JWK with use sig, and a kid admitted for the materialization purpose, an unknown kid may trigger one controlled JWKS refresh, unknown, removed, revoked, wrong-purpose, wrong-use, or wrong-algorithm keys fail closed, and active and retiring verification keys follow the Realm rotation window while a revoked key is rejected immediately.
    condition: Whenever source materialization proofs are verified.
    failure: Fail closed on non-admitted keys and reject revoked keys immediately.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r126
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Verification truth accepts no caller supply
    modality: must
    scope:
      - runtime.protected-session
    statement: No source-materialization shared verifier secret belongs in Runtime machine config, Desktop, SDK, Kit, apps, packet fields, and provider metadata cannot supply or override issuer, JWKS, key purpose, or proof verification truth, and the materialization-purpose registry is verification policy, not a credential projection or caller-extensible free-form map.
    condition: Whenever verification truth sources are supplied.
    failure: Reject shared secrets and caller-supplied verification truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r127
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Defaults trace to kernel tables
    modality: must
    scope:
      - runtime.protected-session
    statement: Default values have a traceable source in the kernel tables and are never scattered in implementation-layer documents.
    condition: Whenever configuration defaults are defined.
    failure: Reject defaults without a traceable kernel-table source.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r128
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Cross-layer projection declares exact defaults
    modality: must
    scope:
      - runtime.protected-session
    statement: Desktop, CLI, and SDK projections of runtime configuration behavior remain semantically consistent with this contract, config may declare a top-level defaultLocalTextModel overriding the bundled local default text target, a top-level defaultCloudProvider, and a provider-scoped defaultModel, and the machine-default cloud target is formed by defaultCloudProvider plus the provider defaultModel.
    condition: Whenever configuration is projected or default targets are declared.
    failure: Reject semantically inconsistent projections.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r129
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Default alias bindings are the mutation surface
    modality: must
    scope:
      - runtime.protected-session
    statement: Runtime Agent AI Config alias bindings consume admitted default target aliases rather than copying concrete targets into every agent record, the default alias family includes local/default, capability-specific local defaults, local/default-embedding, and cloud/default, changing a default alias target is an admitted app-facing Runtime config mutation surface with explicit scope, audit, and Runtime Agent AI Config readiness recompute, alias-bound agents observe the new target on their next turn while pinned agents are unaffected, and this records the authority only with implementation of the mutation RPC and Agent Center Model UI as a separate follow-up.
    condition: Whenever default alias targets are bound or changed.
    failure: Reject concrete-target copying and unaudited alias mutations.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r130
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Provider default fallback splits by provider kind
    modality: must
    scope:
      - runtime.protected-session
    statement: For a static_source provider a higher-level surface may fall back to the provider catalog default_text_model when the provider does not explicitly override defaultModel, for a dynamic_endpoint provider a higher-level surface must not fall back to the provider catalog default_text_model and must use an explicit provider defaultModel or a UI- or route-provided live-selected model with runtime failing close when both are missing, and nimi run --cloud, provider-only high-level CLI and SDK, and similar surfaces cannot bypass these configuration semantics.
    condition: Whenever default model targets are resolved per provider kind.
    failure: Fail close for dynamic_endpoint providers with no explicit or live-selected model.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r131
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Schema transitions require an admitted plan
    modality: must
    scope:
      - runtime.protected-session
    statement: Future service-owned schema transitions require an admitted release transition plan with exact from_version, to_version, field changes, defaults, anti-rollback rules, and fail-closed conditions, they operate only on state already owned by the isolated Runtime principal, and this pre-release cutover does not import, inspect, back up, or transform user-session or retired configuration.
    condition: Whenever a service-owned schema transition is planned.
    failure: Reject transitions without the admitted plan or beyond principal-owned state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r132
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Transitions execute before listeners open
    modality: must
    scope:
      - runtime.protected-session
    statement: The signed Runtime release performs any admitted service-owned transition before protected listeners open, the transition is deterministic, idempotent, atomic, and anti-rollback anchored, failure leaves no partially admitted state and keeps the service unavailable, and Desktop, CLI, and SDK never execute or select transitions.
    condition: Whenever a service-owned transition executes.
    failure: Keep the service unavailable without partially admitted state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r133
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The dev-kernel checkpoint lineage is separate identity
    modality: must
    scope:
      - runtime.protected-session
    statement: The signed dev_kernel_checkpoint profile is a closed non-release exception, not a production schema transition, its binary identity and durable development state identity are separate, runtimeCandidateId binds the exact current signed build record but never selects the state partition, and on first installation the installer creates a cryptographically random acceptanceRoundId and records the then-current candidate as developmentStateCandidateId, which together with the bounded trial id form the durable development state lineage.
    condition: Whenever the dev-kernel checkpoint lineage is created or interpreted.
    failure: Reject state-partition selection by binary identity and lineage creation outside first installation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r134
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Ordinary updates preserve the exact lineage
    modality: must
    scope:
      - runtime.protected-session
    statement: An ordinary signed Runtime update preserves the exact durable development state lineage, Product Control, Runtime identity, local-app kernel state, durable grants, model registry, audit state, and service-owned mutable config therefore survive a binary candidate rotation instead of being silently replaced by an empty candidate directory, account token custody and durable local-project consent remain in their independently stable protected stores, a new lineage may be created only by an explicit destructive repair or reset operation and never merely by installing a new candidate, restarting Desktop, or rotating the Runtime boot epoch, and malformed or unavailable lineage state fails the update closed because the installer does not guess a new directory.
    condition: Whenever a signed Runtime update rotates the binary candidate.
    failure: Fail the update closed on malformed or unavailable lineage state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r135
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Payload reuse never implies readiness
    modality: must
    scope:
      - runtime.protected-session
    statement: Payload reuse does not imply readiness by file presence, the updated candidate verifies its current catalog hashes, manifests, and activation requirements while unchanged verified payloads are not downloaded again, existing or partially damaged records retain the normal Product Control repair and fail-closed path, and production configuration, HOME and TEMP, renderer state, environment, argv, endpoint selection, and request payloads cannot activate or reset the development lineage.
    condition: Whenever candidate payloads are reused or lineage activation is attempted.
    failure: Reject presence-implied readiness and lineage activation from forbidden inputs.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r136
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Candidate rotation preserves the data-root binding
    modality: must
    scope:
      - runtime.protected-session
    statement: The signed installer preserves an existing non-empty explicit development nimi_data binding when it rotates the binary candidate unless the operator supplies a different explicit binding to that installer invocation, the development updater may obtain that explicit value only from the bounded dataRootRef read described by K-CFG-001, the installer validates and records the exact path while the Runtime service does not read the user file, and a missing, malformed, inaccessible, or reparse-point binding fails the update closed instead of silently falling back to a candidate-specific payload root.
    condition: Whenever candidate rotation handles the development data-root binding.
    failure: Fail the update closed without payload-root fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r137
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The checkpoint Realm binding is installer-owned
    modality: must
    scope:
      - runtime.protected-session
    statement: The dev_kernel_checkpoint profile binds account OAuth, token exchange, JWT issuer, JWKS, and revocation to one exact real Realm development deployment so the checkpoint exercises a controlled production account through Runtime custody, the binding is installer-owned and candidate-bound and user environment, argv, renderer state, or a request cannot select it, its loopback fixture origin is a separate non-authorizing field used only for the signed non-release provider seed, and a shared Realm and provider endpoint field, fixture-issued account token, automatic fixture authorization redirect, alias, or fallback is forbidden.
    condition: Whenever the checkpoint Realm binding is selected or consumed.
    failure: Reject non-installer selection and the forbidden shared or fixture shortcuts.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r138
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The First Run proposal cannot create readiness
    modality: must
    scope:
      - runtime.protected-session
    statement: For First Run acceptance Runtime may additionally project one visible nimi_data proposal, when the signed installer recorded an explicit absolute development data-root binding that candidate-bound protected profile field is the proposal and the Runtime data-plane roots resolve below it, otherwise the proposal is derived from the verified interactive Windows SID's OS profile mapping, the signed trial id, and the build-record-verified Runtime candidate id, the proposal is not a Product Control record field and cannot select the data root or create readiness because explicit confirmation through the normal typed Product Control operation is still required, the protected service cannot derive the binding from HOME, USERPROFILE, TEMP, renderer state, environment, argv, endpoint, or a Runtime request payload, the signed installer must reject a missing, non-absolute, volume-root, reparse-point, or inaccessible explicit binding, the installer may source that exact field from the preceding protected profile when rotating a candidate subject to the same validation, and the development updater may instead pass the canonical user-config dataRootRef as an explicit selection while the installer and Runtime never consume any other user-config field.
    condition: Whenever the First Run nimi_data proposal is projected or the binding is sourced.
    failure: Reject readiness creation by proposal and bindings from forbidden derivations.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r139
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The acceptance profile changes one endpoint only
    modality: must
    scope:
      - runtime.protected-session
    statement: The developer-signed first_party_product_acceptance build profile is a separate closed, non-release, non-promotable exception for installed-product acceptance against the admitted local Realm development deployment, it changes only the Runtime account Realm, OAuth, token, issuer, JWKS, and revocation base from the release-fixed https://realm.nimi.ai to the build-fixed http://localhost:3002, the exact profile identity is compiled into the signed Runtime binary, recorded in its source-bound build record, and must match an explicit signed-installer mode, and environment, argv, mutable service state, renderer input, and arbitrary installer endpoint input cannot select or alter that endpoint.
    condition: Whenever the first-party product acceptance profile is selected or consumed.
    failure: Reject endpoint selection or alteration outside the compiled profile and installer mode.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r140
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The acceptance profile admits no fixture state
    modality: must
    scope:
      - runtime.protected-session
    statement: The first_party_product_acceptance profile does not admit a fixture, seed, provider endpoint, model default, data-root selection, alternate service principal, compatibility path, or dev-kernel checkpoint state, it uses ordinary product configuration and state semantics apart from the exact local Realm endpoint projection, a release production_build continues to use only https://realm.nimi.ai, and a dev_kernel_checkpoint candidate remains the only build that may carry its separately bounded provider fixture and seeded checkpoint identity.
    condition: Whenever build profiles carry endpoints, fixtures, or checkpoint state.
    failure: Reject fixture or checkpoint carriage outside the dev_kernel_checkpoint candidate.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r141
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Backups cannot roll back security authority
    modality: must
    scope:
      - runtime.protected-session
    statement: Automatic backups cannot restore older security-critical generations, executable trust, listener, or custody authority, recovery material is version-bound and service-principal protected, restoration requires the same or newer admitted installer-owned active release, and user files and old generic keyring or vault entries are not recovery inputs.
    condition: Whenever backup or recovery executes.
    failure: Reject restorations that roll back security authority and forbidden recovery inputs.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r142
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Field authority is table-first
    modality: must
    scope:
      - runtime.protected-session
    statement: Production Runtime fields and their authority classes are defined by the pinned config schema table which records type, default, reload semantics of restart, hot, or immutable, source rule, closed field partition, forbidden inputs, and redaction boundary, and adding or modifying a configuration field updates the config schema table first and then synchronizes the related contract documents.
    condition: Whenever configuration fields are added or modified.
    failure: Reject field changes that bypass the table-first order.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r143
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Daemon identity and posture are closed fields
    modality: must
    scope:
      - runtime.protected-session
    statement: Runtime service-owned state may store dataRootRef and derived managed roots for models, dependencies, environments, logs, and audit as Runtime-owned daemon and materialization configuration reconciled from the product control record selected nimi_data, runtimeId is the stable local Runtime daemon identity generated once by the service and immutable for the lifetime of service-owned state, and localService.enabled and localService.mode declare the Runtime local service posture with localService.mode restricted to the closed value desktop-local for the on-device Phase 1 product.
    condition: Whenever daemon identity, managed roots, or service posture are configured.
    failure: Reject mutable runtimeId and posture values outside the closed set.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r144
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Runtime config owns no product-control truth
    modality: must
    scope:
      - runtime.protected-session
    statement: Runtime config does not own first-run product state, install level, account app library, account profile library, permission grants, or app durable data, the product-control service may project selected nimi_data through an exact typed protected operation, conflicts fail closed, and Runtime never reads the user-writable product-control file as configuration truth.
    condition: Whenever product-control state is projected into configuration.
    failure: Fail closed on conflicts and reject user-file configuration truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r145
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The Windows data-root handoff is exact
    modality: must
    scope:
      - runtime.protected-session
    statement: On Windows, before the exact nimi_data mutation is sent, the verified native Desktop host prepares the user-selected data-plane root through the shared Kit OS adapter, preparation preserves the interactive user as the root owner, rejects a reparse-point root, and grants inheritable modify authority only to the exact restricted NT SERVICE\NimiRuntime service SID needed for Runtime-managed children, Runtime still independently validates the absolute path, creates the closed managed-root layout, and owns the service-state write, renderer code may neither name a SID nor mutate an ACL, an environment variable, endpoint, direct daemon, broad principal grant, or test-only service identity cannot satisfy this handoff, and failure to prepare or validate the root leaves dataRootRef empty and first-run blocked.
    condition: Whenever the Windows data-plane root is prepared and handed off.
    failure: Leave dataRootRef empty and first-run blocked on preparation or validation failure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r146
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The Environment surface is read-only derivation
    modality: must
    scope:
      - runtime.protected-session
    statement: The Runtime page Environment surface reads the nimi_data data-plane roots of models, dependencies, environments, logs, and audit as a Runtime-owned read-only data model derived from dataRootRef and managedRoots and does not introduce a second config authority.
    condition: Whenever the Environment surface reads data-plane roots.
    failure: Reject second config authorities.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r147
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Managed installs resolve from the data-plane roots
    modality: must
    scope:
      - runtime.protected-session
    statement: The data-plane roots are the only admitted install location for Runtime local environment materialization, the local environment dependencies table binds each dependency family to one of these root ids through its managed_root field with models for model and companion asset payloads, dependencies for standalone downloaded dependency payloads such as the uv tool and the shared accelerator and CUDA runtime, and environments for Nimi-managed executable environment trees such as native engine packages, the managed Python interpreter, venvs, package sets, and Torch wheels, the engine manager, native engine package installers, and Python dependency materializers resolve their install root from dataRootRef and managedRoots and never use ~/.nimi/engines or any other home-directory root, and when dataRootRef is empty the managed install fails closed into product setup rather than guessing a path.
    condition: Whenever local environment dependencies are installed.
    failure: Fail closed into product setup when dataRootRef is empty and reject home-directory roots.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r148
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Target identity v2 is a hard cut
    modality: must
    scope:
      - runtime.protected-session
    statement: AI RPC request surfaces consume v2 durable target refs or resolved binding inputs, raw model_id, target_model_id, and connector_id plus model_id are not admitted durable target identity, and catalog RPCs may retain provider and catalog model ids as non-identity facts.
    condition: Whenever AI RPC target identity is consumed.
    failure: Reject raw identifiers as durable target identity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r149
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The transport matrix is the sole origin authority
    modality: must
    scope:
      - runtime.protected-session
    statement: The protected-local RPC transport matrix table is pinned as the sole protected transport and origin authority for Desktop account-control, the host-neutral local-app launch, session, and permission surface, immutable-package typed-unavailable operations, and Runtime-private refresh, method presence in proto or the runtime RPC methods registry, a loopback listener, and an authenticated portable session do not grant those roles, OpenDesktopSession retains Desktop account control semantics, third-party apps use only PrepareLocalAppLaunch, native process binding, and request-empty OpenLocalAppSession on the verified local-app connection, and the native host may rotate the resulting short-lived technical session only through request-empty RenewLocalAppSession on that same verified local_app_host connection which is not an SDK or renderer operation and never creates portable authority.
    condition: Whenever protected transport or origin roles are granted.
    failure: Reject role grants outside the pinned matrix.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r150
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The kernel RPC service scope is enumerated
    modality: must
    scope:
      - runtime.protected-session
    statement: The Runtime kernel RPC scope covers the admitted proto services and defined design-first service surfaces, Phase 1 covers AIService as the design name mapping to proto RuntimeAiService, ConnectorService as design-first with proto still migrating, RuntimeLocalService, RuntimeAuthService, RuntimeServiceControlService carrying only the request-empty Runtime self-exit on protected Desktop control with restart completed only after SCM recovery and new-process verification, RuntimeExternalAgentService, and RuntimeAccountService as the local first-party account session and scoped app binding authority whose method set is owned by K-ACCSVC-002 and which does not overlap RuntimeAuthService, Phase 2 covers RuntimeWorkflowService, RuntimeAuditService, RuntimeModelService, RuntimeCognitionService, RuntimeAgentService, and RuntimeAppService, services marked design_only_no_proto_contract in the rpc migration map table remain design surface without an admitted proto contract, and a design-state service remains constrained by K-PROTO-011 before entering implementation-facing proto.
    condition: Whenever the Runtime kernel RPC service scope is interpreted.
    failure: Reject services outside the admitted scope and premature proto admission.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r151
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: AIService boundaries are scenario-shaped
    modality: must
    scope:
      - runtime.protected-session
    statement: The AIService active method inventory, method type, and proto mapping are maintained only by the runtime RPC methods registry and the rpc migration map table while the contract defines only scenario-family RPC semantics and boundaries, multimodal text, image, video, and audio input capability is an input extension of existing scenarios without a new top-level multimodal.generate RPC, the multimodal uplift of TEXT_GENERATE continues to reuse ExecuteScenario and StreamScenario, large-media upload-first ingress is exposed through UploadArtifact for artifact_ref.artifact_id reuse in TEXT_GENERATE and realtime, duplex realtime sessions do not belong to AIService and uniformly use the independent RuntimeAiRealtimeService, and the app-facing runtime.route.describe metadata projection is constrained by K-RPC-015 through K-RPC-021 with no new daemon top-level RPC method added for it in Phase 1.
    condition: Whenever the AIService method surface or scenario boundaries are defined.
    failure: Reject second method inventories and out-of-boundary additions.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r152
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The realtime session surface is independent
    modality: must
    scope:
      - runtime.protected-session
    statement: The RuntimeAiRealtimeService active method inventory, method type, and proto mapping are maintained only by the runtime RPC methods registry and the rpc migration map table, v1 realtime sessions reserve contract only for text and audio bidirectional sessions and do not carry video plus audio to video plus audio, ReadRealtimeEvents is a server-stream with duplex semantics composed through Open plus Append plus Read plus Close, the v1 provider-backed implementation scope is fixed to the llama text plus audio session and other providers fail close when unimplemented instead of masquerading as ordinary AIService scenarios, RuntimeAiRealtimeService is an independent realtime multimodal session surface and not ordinary Runtime Agent voice output, agent custom-voice output follows the scenario-layer audio.synthesize semantics of RuntimeAiService and never treats the realtime session RPC as agent voice output per the boundaries of K-MMPROV-031, K-VOICE-019, and K-AGCORE-133, its RealtimeAudioChunk belongs only to the realtime session event stream and is not a scenario voice stream delta or agent voice stream chunk, RuntimeVoiceService is not a public contract surface per K-VOICE-008 with voice public methods converged into RuntimeAiService, and any independent public service named RuntimeVoiceService is out of bounds.
    condition: Whenever the realtime session surface is defined or consumed.
    failure: Fail close on unimplemented providers and reject voice-service or agent-voice reinterpretation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r153
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Connector credential shapes are fixed
    modality: must
    scope:
      - runtime.protected-session
    statement: The ConnectorService active method inventory, method type, and proto mapping are maintained only by the runtime RPC methods registry and the rpc migration map table while the contract defines connector custody, catalog, overlay, and credential shape boundaries, ConnectorService currently aligns with proto RuntimeConnectorService per the aligned mapping posture in the rpc migration map table, the credential request shape on CreateConnector and UpdateConnector is fixed to api_key as the legacy-compatible field for auth_kind API_KEY, auth_kind as the managed connector credential family discriminator, provider_auth_profile as the OAuth-managed connector provider profile token whose sole truth source is the connector auth profiles table and which must be provider-compatible, and credential_json as the OAuth-managed connector provider-defined sealed payload, credential_json in the current admitted scope is only custodied by runtime as a sealed payload with the RPC surface promising neither a unified refresh schema nor runtime-owned OAuth login and refresh orchestration, and these fields define connector custody and patch semantics only and are not an app-facing inline credential metadata contract.
    condition: Whenever connector credential shapes are defined or consumed.
    failure: Reject shapes outside the fixed field set and metadata-contract reinterpretation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r154
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The external agent surface fails closed when empty
    modality: must
    scope:
      - runtime.protected-session
    statement: RuntimeExternalAgentService is the Runtime-owned app-facing RPC surface for the External Agent gateway, token ledger, action registry, and audit projection, Desktop, Web, Kit, and apps consume it only through SDK typed projection and never maintain parallel gateway, token, action, or audit truth through Tauri, local SQLite, renderer-local registries, or app-local HTTP servers, its active method inventory, method type, and proto mapping are maintained only by the runtime RPC methods registry and the rpc migration map table, and before the Runtime-owned action registry and server are enabled the service fails closed with status returning disabled and EXTERNAL_AGENT_ACTION_REGISTRY_EMPTY, token issuance and revoke rejected with structured Runtime errors, and no host-local tokens, fabricated token mutation success, or fabricated action success.
    condition: Whenever the external agent surface is consumed or the registry is disabled.
    failure: Fail closed with the disabled status and structured rejections.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r155
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The cognition service topology is single-owner
    modality: must
    scope:
      - runtime.protected-session
    statement: RuntimeCognitionService is the only stable runtime-facing RPC surface for the cognition overlap, its active method inventory, method type, and proto mapping are maintained only by the runtime RPC methods registry and the rpc migration map table, it replaces RuntimeMemoryService and RuntimeKnowledgeService as the sole runtime-facing cognition service topology, the public surface exposes only Nimi-owned typed contracts and never provider-native API truth, cognition internal storage, or runtime-private review, bank, and replication truth, the memory embedding runtime intent, inspect, bind, and cutover family is the admitted Runtime-owned host-local typed surface within RuntimeCognitionService with SDK, Kit, Desktop, and apps submitting typed requests or consuming typed projections and never owning a second memory embedding configuration or cutover truth source, Working memory is outside the RuntimeCognitionService method scope, public app-facing paths serve only infra scopes while canonical scopes are consumed by the runtime-owned owner through the runtime-private typed path, Reflect is retired from steady-state public RPC with canonical review still owned by RuntimeAgentService and retained runtime-private memory depth, absorbed memory and knowledge method families preserve fail-close semantics and are not reintroduced adapter-first as a dual-owner public surface, host products needing memory embedding resolved state, canonical bind, rebuild, or cutover commands use admitted RuntimeCognitionService typed methods or Runtime implementation-internal typed paths without creating SDK, Kit, Desktop, Tester, or other-app configuration, binding, or cutover authority, access posture is pinned in the agent-ai-cognition runtime RPC auth posture table, and Runtime-owned internal callers may use runtime-private typed paths only where the service implementation admits them with app-facing public authz never bypassed by SDK, Kit, Desktop, Tester, or other apps.
    condition: Whenever the cognition RPC surface is defined or consumed.
    failure: Reject dual-owner surfaces, retired methods, and authz bypass.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r156
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The agent service authority cut is canonical
    modality: must
    scope:
      - runtime.protected-session
    statement: RuntimeAgentService is the only stable design RPC surface for the runtime-owned live agent substrate, current implementation-facing proto transport aligns directly with RuntimeAgentService and RuntimeAgentCoreService is no longer an admitted transport name with the design-to-proto relation owned by the rpc migration map table, its active method inventory, method type, and proto mapping are maintained only by the runtime RPC methods registry and the rpc migration map table, agent canonical memory write policy is owned by RuntimeAgentService, the app-facing projection of agent canonical memory bank status and bind is owned by RuntimeAgentService and SDK and apps never compose canonical bank mode from memory embedding config, runtime-private inspect state, or raw GetBank, apps may control and consume agents but never own renderer-local agent truth, proactive life scheduling executes through typed HookIntent plus host-owned admission, hook trigger detail, agent memory recall results, and failure, reschedule, and budget-related agent events use typed runtime messages rather than free JSON payloads, the app-facing state mutation contract is a constrained command and patch family rather than arbitrary agent-state blob replacement, account-scoped source, profile, and binding mutation require the canonical durable mutation-event grammar on the runtime spec path without by itself expanding the current public RPC method family, app-facing reactive chat consumption adds no second RuntimeAgentService RPC method family because the admitted transport seam is the reserved runtime.agent app-message target governed by K-APP-008, agent voice native non-final chunk bytes use RuntimeAgentService.SubscribeAgentVoiceStream as the admitted typed data-plane for K-VOICE-019 with presentation projection events carrying only stream identity and transport refs and never embedding raw chunk bytes or minting per-chunk durable artifacts, agent voice playback interruption uses RuntimeAgentService.InterruptAgentVoicePlayback as a voice-stream lifecycle command never collapsed into runtime.agent.turn.interrupt or app-local playback stop, current multi-agent admission is limited to durable delegation lifecycle and attribution visibility without by itself admitting delegated-authority trust semantics, turn and stream terminal-coupling and temporal-autonomy deferral remain part of the canonical RuntimeAgentService authority cut even when they do not add new public RPC methods yet, and access posture is pinned in the agent-ai-cognition runtime RPC auth posture table with app-message access for the reserved runtime.agent chat seam defined separately by K-RPC-004c.
    condition: Whenever the agent service RPC surface is defined or consumed.
    failure: Reject undeclared transport names, renderer-local truth, and free-form payloads.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r157
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The runtime.agent chat access matrix is minimal
    modality: must
    scope:
      - runtime.protected-session
    statement: "The minimal access matrix reserved by RuntimeAppService for the runtime.agent reactive chat seam is fixed: SendAppMessage to to_app_id runtime.agent with a message type in the K-APP-008 admitted ingress family requires runtime.agent.turn.write, SubscribeAppMessages whose from_app_ids include runtime.agent requires runtime.agent.turn.read, and generic cross-app SendAppMessage outside the reserved runtime.agent seam requires runtime.app.send.cross_app."
    condition: Whenever runtime.agent chat seam access is authorized.
    failure: Reject access without the exact capability for each row.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r158
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Naming mapping has one truth source
    modality: must
    scope:
      - runtime.protected-session
    statement: The rpc migration map table is the sole truth source for design-to-proto naming mapping, and the current AI entry alignment with proto uses scenario-protocol naming such as ExecuteScenario and SubmitScenarioJob with no independent Voice service mapping maintained.
    condition: Whenever design and proto names are mapped.
    failure: Reject second mapping sources.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r159
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Forbidden external contract names are enumerated
    modality: must
    scope:
      - runtime.protected-session
    statement: The names GenerateText, StreamGenerateText, SynthesizeSpeech, ListTokenProviderModels, CheckTokenProviderHealth, SubmitMediaJob, GetMediaJob, CancelMediaJob, SubscribeMediaJobEvents, GetMediaResult, SubmitVoiceJob, GetVoiceJob, CancelVoiceJob, SubscribeVoiceJobEvents, StreamGenerate, and SynthesizeSpeechStream may appear only in implementation layers or the migration mapping table and never as external contract names.
    condition: Whenever external contract names are chosen.
    failure: Reject the forbidden names as external contract names.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r160
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: CreateConnector fields are exact
    modality: must
    scope:
      - runtime.protected-session
    statement: CreateConnector does not expose kind in the request body and a successfully created Connector.kind is fixed to REMOTE_MANAGED, the credential shape satisfies exactly one of api_key required and non-empty for auth_kind API_KEY or an omitted auth_kind on the legacy path, or provider_auth_profile plus credential_json required for auth_kind OAUTH_MANAGED, api_key and credential_json never appear together, an empty endpoint receives the provider default injection, an empty label receives the default label, and a successful write sets status ACTIVE with created_at equal to updated_at equal to now.
    condition: Whenever CreateConnector executes.
    failure: Reject requests violating the field contract.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r161
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: UpdateConnector fields are exact
    modality: must
    scope:
      - runtime.protected-session
    statement: UpdateConnector requires at least one mutable field among endpoint, label, api_key, status, auth_kind, provider_auth_profile, and credential_json, status UNSPECIFIED is illegal, explicit empty strings for api_key, credential_json, and label are illegal, switching auth kind requires the fields of the target auth shape with no server-side implicit credential family conversion, and every legal request refreshes updated_at.
    condition: Whenever UpdateConnector executes.
    failure: Reject requests violating the field contract.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r162
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: DeleteConnector compensates durably
    modality: must
    scope:
      - runtime.protected-session
    statement: DeleteConnector cascades credential deletion and executes the DELETE_PENDING compensation flow which is retryable and recoverable at startup.
    condition: Whenever DeleteConnector executes.
    failure: Reject deletion without cascade and compensation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r163
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Remote probing has validation preconditions
    modality: must
    scope:
      - runtime.protected-session
    statement: TestConnector for a remote connector passes owner, status, and credential validation before any outbound call, and ListConnectorModels for a remote connector reads only the active catalog snapshot, never goes outbound, and never carries endpoint probing.
    condition: Whenever remote probe or discovery preconditions are evaluated.
    failure: Reject outbound calls without validation and outbound reads in ListConnectorModels.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r164
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Connector state machines anchor here
    modality: must
    scope:
      - runtime.protected-session
    statement: The connector-related state machines for connector_status and remote_connector_delete_flow in the state transitions table use this rule identity as their source anchor.
    condition: Whenever connector state machines are anchored.
    failure: Reject unanchored connector state machines.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r165
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Connector model reads stay snapshot-fixed
    modality: must
    scope:
      - runtime.protected-session
    statement: The remote read path of ListConnectorModels is fixed to the active catalog snapshot as the data source, force_refresh true is allowed but must be a no-op, results never change because of provider live /models differences, and TestConnector for remote connectors is the only retained non-scenario outbound probe entry whose results never backfill ListConnectorModels.
    condition: Whenever connector model catalogs are read.
    failure: Reject live-difference mutation and probe backfill.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r166
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Catalog browsing exposes merged classified truth
    modality: must
    scope:
      - runtime.protected-session
    statement: ListCatalogProviderModels and GetCatalogModelDetail expose runtime model catalog truth after overlay merge scoped to the caller subject user when identity is present, ListCatalogProviderModels with provider, page_size, and page_token returns provider metadata plus effective model summaries for one provider, GetCatalogModelDetail with provider and model_id returns one effective model detail projection from the resolved provider catalog, provider metadata returned to desktop may include overlay presence, overlay timestamps, effective YAML, default endpoint facts, runtime plane facts, and source classification, and model metadata classifies each model row as builtin, custom, or overridden.
    condition: Whenever catalog browsing surfaces serve models.
    failure: Reject unmerged or unclassified projections.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r167
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Overlay mutation validates before activation
    modality: must
    scope:
      - runtime.protected-session
    statement: UpsertCatalogModelOverlay and DeleteCatalogModelOverlay are the stable structured mutation RPCs for personal catalog models, UpsertCatalogModelOverlay with provider, model, optional voices, voice_workflow_models, and model_workflow_binding validates against the runtime model catalog schema before activation, capability-conditional validation remains fail-close at mutation time including TTS voice_set_id and video video_generation, overlay mutations are user-private unless the runtime is explicitly operating on a shared non-subject custom root, and DeleteCatalogModelOverlay with provider and model_id deletes only the targeted overlay entry and restores the built-in effective model when one exists.
    condition: Whenever catalog overlays are mutated.
    failure: Fail close at mutation time on validation failure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r168
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Advanced YAML editing targets overlay fragments
    modality: must
    scope:
      - runtime.protected-session
    statement: ListModelCatalogProviders, UpsertModelCatalogProvider, and DeleteModelCatalogProvider remain valid as advanced YAML operations, and when used by desktop catalog UX these RPCs target provider overlay fragments rather than full effective provider snapshots.
    condition: Whenever advanced YAML catalog operations are used.
    failure: Reject full-snapshot targeting from desktop catalog UX.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r169
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: ListPresetVoices fields are exact
    modality: must
    scope:
      - runtime.protected-session
    statement: ListPresetVoices returns the provider preset voice list, its request carries required app_id, required subject_user_id, required target_ref as a v2 durable target ref or resolved binding input, optional voice_asset_target_ref as the target voice asset compatibility binding for clone and design scenarios, and optional connector_id as a post-resolve credential custody fact only and not durable model identity, its response carries voices as repeated PresetVoice, model_resolved as the routed model id, and trace_id, each PresetVoice carries preset_voice_id, name, lang as the default language tag, and supported_langs, the result is a bounded small set without pagination and has no page_size or page_token, the request passes key-source resolution under K-KEYSRC-* with connector_id semantics consistent with other AI RPCs, voice sources follow the catalog main path with no namespace-free freeform parameter passthrough bypass, and voice assets for user-cloned and designed voices are not returned by this interface and are managed by GetVoiceAsset and ListVoiceAssets.
    condition: Whenever preset voices are listed.
    failure: Reject pagination, passthrough bypasses, and voice-asset returns.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r170
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: Voice asset lifecycle converges on four methods
    modality: must
    scope:
      - runtime.protected-session
    statement: Voice-related asset lifecycle converges on AIService with the method set GetVoiceAsset, ListVoiceAssets, DeleteVoiceAsset, and ListPresetVoices.
    condition: Whenever voice asset methods are surfaced.
    failure: Reject voice asset lifecycle outside this method set.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r171
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The local environment plan surface is bounded
    modality: must
    scope:
      - runtime.protected-session
    statement: RuntimeLocalService owns app-facing projection and command surfaces for local environment plans downstream of K-LENG-024 through K-LENG-027 without creating a second dependency truth owner, the required logical operations are reading the host capability profile, resolving a local environment plan for a requested local compute pack, capability, model install, model import, or repair request, reading the local environment dependency graph and selected source record projection, confirming dependency materialization when network or heavy setup is required, starting, observing, cancelling, retrying, and repairing Runtime-owned dependency jobs, and projecting activation gate status for native engines and Python pipelines, the concrete transport may use new RPC methods or extend existing RuntimeLocalService local plan and job projection, cloud-only reads and Cloud API setup never resolve or start local compute dependency materialization, plan resolution may inspect Runtime-owned host capability evidence but never triggers download or install, first network materialization requires explicit confirmation or a surrounding model or capability install confirmation that clearly names the covered dependency families, selected source records are Runtime truth with SDK and Desktop receiving bounded projection only, dependency job projection includes enough state to distinguish needs_confirmation, queued, downloading, verifying, installing, ready_system, ready_managed, repair_required, failed, unsupported, and cancelled, no Desktop, SDK, engine, or app-level REST bypass may execute installers, probes, source selection, PATH mutation, or pseudo-ready projection on behalf of this surface, and activation gate projection exposes the logical operation ResolveLocalEnvironmentConsumerActivation whose request, response, audit envelope, and reason-code semantics are owned by the local environment consumer activation contract.
    condition: Whenever local environment plan surfaces are defined or consumed.
    failure: Reject second truth owners, unconfirmed materialization, and bypass execution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r172
    kind: rule
    owner: team.runtime
    lifecycle: active
    title: The materializer projection anchor delegates
    modality: must
    scope:
      - runtime.protected-session
    statement: Detailed RuntimeLocalService materializer projection semantics are owned by K-RPC-025 in the local environment materializers contract, detailed activation-gate projection semantics are owned by the local environment consumer activation contract, and the RPC surface anchor remains stable while delegating read, confirmation, command, job observation, activation-gate, and no-ordinary-user-installer rules to those contracts.
    condition: Whenever materializer or activation-gate projection semantics are located.
    failure: Reject relocation of the delegated semantics onto this anchor.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
