format: nimicoding.authority/v1
units:
  - id: definition.nimi.sdks.realm-consumer.external-authority-plane
    kind: definition
    owner: team.sdks
    lifecycle: active
    title: Realm external authority consumption plane
    meaning: Realm domain authority is external to Nimi and identified as the external Realm authority; this plane owns Nimi's consumer-side boundary over Realm API projections for SDK, Runtime, Desktop, Web, and apps, including the pointer-only realm spec subtree, and it never defines Realm server truth, Realm domain semantics, or Realm product authority.
    relations: []
  - id: definition.nimi.sdks.realm-consumer.generated-core-plane
    kind: definition
    owner: team.sdks
    lifecycle: active
    title: Realm generated core plane
    meaning: The Realm generated core plane owns the two admitted generated Realm projections from the configured Realm OpenAPI input, the public SDK core under the SDK generated directories and the Runtime-private carrier under the runtime generated realm directory, together with the Nimi wire-shape projection for CharacterSourceRefV3, the Packet v3 closure set, the eight packet limits, authenticated first-party challenges, current JWKS, ordered segments, the hash graph, and detached-proof carriers, while the closed Runtime-operation inventory remains owned by the realm-private-operation-carriers table.
    relations: []
  - id: definition.nimi.sdks.realm-consumer.facade-plane
    kind: definition
    owner: team.sdks
    lifecycle: active
    title: Realm consumer facade plane
    meaning: The Realm consumer facade plane owns SDK handwritten typed facade behavior over generated Realm core, covering endpoint and token instance isolation, request transport configuration, typed error projection, retry and refresh orchestration, generated client composition, consumer availability and fail-closed states, current small Realm readiness and source-record reads, and the high-level authenticated Runtime MaterializeRealmSource intent carrying only CharacterSourceRefV3 and requestId.
    relations: []
  - id: definition.nimi.sdks.realm-consumer.world-facade-plane
    kind: definition
    owner: team.sdks
    lifecycle: active
    title: SDK world facade plane
    meaning: The SDK world facade plane owns the app-facing sdk world facade boundary covering the public world-domain family boundary, the world-input projection boundary, the fixture package boundary, the renderer orchestration versus driver boundary, and the world-session composition boundary, without owning Realm canonical truth semantics, Runtime provider execution semantics, renderer-driver implementation semantics, or branch-local simulation semantics.
    relations: []
  - id: definition.nimi.sdks.realm-consumer.world-evolution-projection-plane
    kind: definition
    owner: team.sdks
    lifecycle: active
    title: World Evolution Engine projection plane
    meaning: The World Evolution Engine projection plane owns the SDK typed projection boundary that mirrors only contract-visible Runtime World Evolution Engine shapes for execution events, replay, checkpoint, supervision, effect stages, and commit-request staging, with Runtime remaining the semantic owner of those execution rules.
    relations: []
  - id: definition.nimi.sdks.realm-consumer.world-evolution-consumer-plane
    kind: definition
    owner: team.sdks
    lifecycle: active
    title: World Evolution Engine consumer plane
    meaning: The World Evolution Engine consumer plane owns the downstream app consumer seam that composes SDK projection-visible World Evolution Engine shapes into stable consumer API families, including the selector-read stable method contract, without redefining Runtime execution semantics, SDK projection-visible shape meaning, host bridge concrete APIs, or implementation strategy.
    relations: []
  - id: definition.nimi.sdks.realm-consumer.group-participation-plane
    kind: definition
    owner: team.sdks
    lifecycle: active
    title: Realm group agent participation client plane
    meaning: The Realm group agent participation client plane owns the SDK typed client facade over Realm GROUP evidence, Runtime Agent Participation, and Runtime Room Orchestration, without owning prompt assembly, provider or model routing, memory policy, participation concurrency, same-room queues, or Realm GROUP commit truth.
    relations: []
  - id: rule.nimi.sdks.realm-consumer.r001
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: Realm authority stays external and unmirrored
    modality: must_not
    scope:
      - sdks.realm-consumer
    statement: Nimi specs, SDK docs, Runtime, Desktop, Web, or apps re-declare Realm server or domain rules as local authority, or the realm spec subtree carries anything beyond pointer and navigation files identifying the external Realm authority and routing readers to the SDK consumer authority, including kernel contracts, kernel tables, generated Realm docs, Realm domain guides restating product rules, or delegated projection mirrors.
    condition: Whenever Realm authority is referenced or the realm spec subtree is populated.
    failure: Remove the local re-declaration or mirror; Nimi-owned surfaces may reference Realm only as an external dependency, a generated API input, or a consumer projection boundary.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.external-authority-plane
  - id: rule.nimi.sdks.realm-consumer.r002
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: Generated carriers are the consumer floor
    modality: must
    scope:
      - sdks.realm-consumer
    statement: Stable Realm API consumption starts from a generated Realm carrier sourced from the configured Realm OpenAPI input, public SDK consumption starts from the generated Realm SDK core while Runtime's constructor-injected private RealmMaterializationIssuer starts from the sibling generated Runtime-private carrier because Runtime never imports SDK packages, both projections are emitted by the same SDK generator invocation from the same OpenAPI input, the closed Runtime-operation inventory is owned by the realm-private-operation-carriers table whose rows independently declare runtime_projection and public_sdk_disposition so Runtime generation never implies removal from the public SDK, account-auth and authn operations are generated for Runtime and retained in the public Web SDK while source-materialization packet and JWKS operations are generated for Runtime and forbidden in the public SDK, and Runtime output is split into account-auth, authn, and source-materialization files so no generated carrier becomes a mixed-domain context sink.
    condition: Whenever Realm API carriers are generated or consumed.
    failure: Reject bypasses of generated Realm clients including app-local REST helpers, hand-authored endpoint strings, global OpenAPI singleton mutation, and duplicated response-shape declarations; handwritten SDK facades are admitted only when they wrap generated operations with typed fail-closed behavior and restore no second Realm contract.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.generated-core-plane
  - id: rule.nimi.sdks.realm-consumer.r003
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: Source materialization shapes are generated-only
    modality: must
    scope:
      - sdks.realm-consumer
    statement: Source materialization uses only the generated current Realm Packet v3 and CharacterSourceRefV3 transport shapes, the generated operation families own the authenticated first-party challenge, packet, ordered closure-set segment, component, hash-graph, current-JWKS, and detached-proof shapes, source materialization has no app permission or grant carrier, and SDK and apps never introduce a handwritten materialization DTO, anonymous source payload, fixed audience, raw bundle DTO, or parallel packet decoder.
    condition: Whenever source materialization shapes are authored or consumed.
    failure: Reject handwritten materialization DTOs and parallel packet decoders.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.generated-core-plane
  - id: rule.nimi.sdks.realm-consumer.r004
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: Runtime enforcement is not a second transport
    modality: must
    scope:
      - sdks.realm-consumer
    statement: Runtime account and auth clients and the bounded streaming verifier may own Runtime-private semantic validation state, canonical hashing, cryptographic verification, capacity accounting, and atomic-commit projections as enforcement semantics rather than a second Realm transport contract, they consume generated operation and request and response carriers with generated OpenAPI closure metadata gating every accepted response field family, Runtime never hand-authors a Realm path, request DTO, alternate response field, compatibility decoder, or public packet adapter, and OAuth form requests and JSON requests retain their generated content type so a generator that silently treats a declared request as unknown fails closed.
    condition: Whenever Runtime-private Realm enforcement is implemented or generated content types are resolved.
    failure: Fail closed on unknown declared requests and reject hand-authored Realm transport artifacts.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.generated-core-plane
  - id: rule.nimi.sdks.realm-consumer.r005
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: The SDK owns consumer semantics only
    modality: must_not
    scope:
      - sdks.realm-consumer
    statement: The SDK owns Realm canonical records or lifecycle truth, Realm auth or session issuance semantics, Realm social, chat, economy, or domain invariants, Realm OpenAPI source authority, server compatibility promises outside the generated API input, or source-materialization packet, audience, proof, manifest, component, or world-closure shape semantics, beyond its admitted consumer semantics of endpoint and token instance isolation, request transport configuration, typed error projection, retry and refresh orchestration, generated client composition, consumer availability and fail-closed states, current small Realm readiness and source-record reads, and the high-level authenticated Runtime MaterializeRealmSource intent carrying only CharacterSourceRefV3 and requestId.
    condition: Whenever SDK Realm ownership boundaries are evaluated.
    failure: Reject SDK ownership claims over Realm server truth and materialization shape semantics.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r006
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: Local projections never become Realm truth
    modality: must
    scope:
      - sdks.realm-consumer
    statement: Runtime and Desktop consume Realm projections through SDK-owned typed facades while local Runtime or Desktop state never becomes Realm canonical truth, a local projection that cannot be reconciled with Realm API output fails closed or exposes an explicit unavailable or error projection rather than synthesizing Realm success, Desktop, Kit, and Web submit only CharacterSourceRefV3 and requestId to the high-level authenticated Runtime MaterializeRealmSource operation, Runtime internally resolves the current account, canonical Realm base, bearer, fresh challenge, Packet v3 response, and current JWKS, Realm applies its first-party source visibility and readiness policy directly with no app grant, and no app-facing facade receives or persists packet, proof, segment, or component bytes, chooses an audience, decodes closure truth into app-owned records, or accepts an unknown schema, field, enum, segment kind, limit, or hash branch as local success.
    condition: Whenever Realm projections are consumed by Runtime, Desktop, Kit, or Web.
    failure: Fail closed on unreconciled projections and reject synthesized Realm success.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r007
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: Version drift is handled by regeneration only
    modality: must
    scope:
      - sdks.realm-consumer
    statement: Realm API drift is handled by regenerating the SDK core from the configured Realm OpenAPI input and updating SDK consumer authority and tests, drift is never patched by copying Realm spec text into the realm spec subtree, freezing stale DTOs in handwritten clients, or adding compatibility aliases that hide server contract changes, and an unknown Packet v3 or challenge schema, field, enum, proof family, component or segment kind, limit, hash edge, or closure branch is version drift that fails closed until the configured Realm OpenAPI input is regenerated with handwritten compatibility readers forbidden.
    condition: Whenever Realm API drift is detected or handled.
    failure: Fail closed on unknown shapes and reject compatibility aliases and handwritten readers.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.generated-core-plane
  - id: rule.nimi.sdks.realm-consumer.r008
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: Exactly two generated projections exist
    modality: must
    scope:
      - sdks.realm-consumer
    statement: Realm generated core under the SDK generated directories is sourced from the configured Realm OpenAPI input of the external Realm authority, Nimi admits exactly two generated projections from that input, the public SDK core and the Runtime-private carrier required by the Runtime import boundary, the same generator run emits and drift-checks both projections with no third projection, packet issuance and current-JWKS acquisition are consumed only by Runtime's private RealmMaterializationIssuer according to the realm-private-operation-carriers table, no handwritten core, facade, app, or public Runtime adapter owns a parallel materialization request DTO or transport path, and Runtime-private streaming verification state remains Runtime enforcement semantics gated by generated field closure.
    condition: Whenever generated Realm core projections are produced or extended.
    failure: Reject third projections and parallel materialization DTOs or transport paths.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.generated-core-plane
  - id: rule.nimi.sdks.realm-consumer.r009
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: The facade fails closed and exposes no packets
    modality: must
    scope:
      - sdks.realm-consumer
    statement: A handwritten TypeScript Realm facade over generated Realm core fails closed on malformed operation boundaries, never restores global OpenAPI singleton configuration, may validate, route, retry, and correlate current small Realm reads, never exposes packet issuance, challenge, bearer, grant selection, raw packet, proof, segment, or component bytes, or Packet v3 decoding to SDK, Kit, Desktop, or Web callers because those callers submit only CharacterSourceRefV3 and requestId through the authenticated Runtime MaterializeRealmSource facade with Runtime alone acquiring and verifying the generated Packet v3 transport, generated language manifests prove schema and operation shape convergence without proving that every language exposes or can execute every operation, Runtime-private operations are never projected as public SDK methods, and language behavior claims require an executable conformance path that returns normally or a typed error and never panics, traps, or aborts the process.
    condition: Whenever the Realm facade or language conformance claims are evaluated.
    failure: Fail closed on malformed boundaries and reject packet exposure and panic paths.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r010
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: Local modes admit no generic Realm transport
    modality: must
    scope:
      - sdks.realm-consumer
    statement: Local Runtime app modes admit no generic authenticated Realm transport, any local Realm access uses an exact Runtime-mediated protected operation only after its operation row and caller carrier are independently admitted, all local modes prohibit app, host, or SDK bearer custody, token or refresh providers, session stores, JWT subject decode, MeService.getMe account truth, Realm login routes, and SDK-owned 401 refresh, public token, refresh, and credential-grant families remain removed with their identities reserved, web, cloud adapter, and external-principal modes may retain app-provided token, subject, and Realm route seams only when explicitly fenced and unreachable from local first-party consumers, and local account, login, and refresh-token custody and Realm mediation truth remain owned by the Runtime account service with SDK projection constrained by the client-core runtime projection authority.
    condition: Whenever Realm transport modes are composed or fenced.
    failure: Reject unfenced seams, local bearer custody, and generic authenticated transport.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r011
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: Runtime owns the authenticated data plane
    modality: must
    scope:
      - sdks.realm-consumer
    statement: The SDK owns typed Realm APIs and trusted carriers only while Runtime remains the sole owner of every authenticated Realm data plane including bearer injection, private refresh, unary mediation, realtime connection authority, and media credential exchange, SDK and app inputs never turn an app id, endpoint, token callback, event name, or generated descriptor into authorization or canonical data-plane truth, createRuntimeAccountMediatedRealmTransport stays a reserved typed constructor rather than a generic data-path admission and returns protected-unavailable for every app composition until the exact Runtime operation policy and caller carrier are admitted, when later enabled it sends only typed operation ids on that verified carrier and never accepts or exposes accessToken, refreshToken, authorization headers, Realm base truth, session persistence, refresh callbacks, public grants, or caller-selected origin, installed, developer, and first-party facades never export token wrappers or createRealmWithRuntimeAccountToken, and SDK media helpers remain carrier-only until Runtime admits exact media states, limits, credential custody, and failure behavior.
    condition: Whenever authenticated Realm data-plane composition or the reserved transport constructor is evaluated.
    failure: Return protected-unavailable for unadmitted compositions and reject token custody exposure.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r012
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: Facade instances are isolated
    modality: must
    scope:
      - sdks.realm-consumer
    statement: The Realm SDK entry is an instantiated facade with endpoint, token, and header state isolated per instance, and request engine configuration takes effect only in instance scope without writing global OpenAPI runtime state.
    condition: Whenever a Realm facade instance is constructed or configured.
    failure: Reject shared instance state and global request-engine mutation.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r013
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: Missing endpoint or token fails closed
    modality: must
    scope:
      - sdks.realm-consumer
    statement: A missing endpoint or token fails closed except in the explicit NO_AUTH mode, the NO_AUTH boundary admits only the public decision endpoints AuthService.checkEmail returning the typed CheckEmailEntryRoute of register_with_otp, login_with_otp, or login_with_password plus requestEmailOtp, verifyEmailOtp, and passwordLogin which need no prior token, and every other Realm call with a missing accessToken fails closed.
    condition: Whenever a Realm call runs without full endpoint and token configuration.
    failure: Fail closed outside the admitted NO_AUTH endpoints.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r014
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: Refresh is explicit, single-retry, single-flight
    modality: must
    scope:
      - sdks.realm-consumer
    statement: The auth refresh strategy is explicitly declared with no implicit background refresh state, without a configured refreshToken callback no automatic refresh occurs and a 401 goes directly to the error projection, accessToken supports a function mode carrying caller-managed manual refresh, with a configured refreshToken callback a 401 triggers refresh and a single retry of the original request, concurrent 401 responses merge into a single-flight refresh, and auth failure retries are limited to one observable attempt.
    condition: Whenever Realm auth refresh or 401 handling runs.
    failure: Reject implicit refresh, refresh storms, and unobservable retries.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r015
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: Realm readiness probes fail closed
    modality: must
    scope:
      - sdks.realm-consumer
    statement: A failed Realm ready probe fails closed and throws an error, and callers never substitute event telemetry for the availability judgment or treat the probe failure as a soft telemetry-only signal.
    condition: Whenever Realm readiness is probed.
    failure: Throw on probe failure without telemetry substitution.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r016
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: Auth errors are never disguised as success
    modality: must_not
    scope:
      - sdks.realm-consumer
    statement: 401, 403, 429, or 5xx semantics are disguised as successful responses.
    condition: Whenever Realm error responses are projected.
    failure: Preserve the typed error projection.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r017
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: Realtime details stay blocked authority conflicts
    modality: must
    scope:
      - sdks.realm-consumer
    statement: The realtime protocol, dependency, delivery, replay, and event-vocabulary details recorded by the retired realtime clauses remain blocked authority conflicts that are conflict evidence only and are not independently admitted for implementation until Runtime admits the corresponding realtime authority, Runtime compatibility evidence precedes any replay posture because client caches, outboxes, event shapes, and reconnect success cannot establish replay guarantees, the SDK constrains only authentication, state events, and reconnect boundaries, reconnect strategy implementation may vary but never silently drops already-confirmed delivered events, and the SDK maintains no authoritative realtime event-name enumeration because event names follow the backend protocol.
    condition: Whenever realtime consumption or replay posture is evaluated.
    failure: Reject independent realtime admissions and silent confirmed-event loss.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r018
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: Facade behavior never sources local mirrors
    modality: must
    scope:
      - sdks.realm-consumer
    statement: Realm facade behavior derives from generated Realm core, explicit SDK consumer authority, and runtime or client mode configuration, and the SDK never consults or recreates the realm spec subtree as Realm server authority inside this repository.
    condition: Whenever Realm facade behavior is derived.
    failure: Reject facade behavior sourced from local Realm mirrors.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.external-authority-plane
  - id: rule.nimi.sdks.realm-consumer.r019
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: The world facade family set is fixed
    modality: must
    scope:
      - sdks.realm-consumer
    statement: The sdk world facade is the SDK authority home for the app-facing world-domain facade owning only the public world-domain family boundary, the world-input projection boundary, the fixture package boundary, the renderer orchestration versus driver boundary, and the world-session composition boundary, and the baseline family set is fixed to truth, generate, fixture, render, and session with all five families admitted in coarse-grained form.
    condition: Whenever the world facade surface is defined or extended.
    failure: Reject ownership beyond the five boundaries and families outside the fixed set.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.world-facade-plane
  - id: rule.nimi.sdks.realm-consumer.r020
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: World input and output are projection-shaped
    modality: must
    scope:
      - sdks.realm-consumer
    statement: Provider-bound world-generation requests pass through a world-domain truth-to-world-input projection layer before final provider request shaping, the world facade never exposes provider-native payloads as the first public input shape, local materialized world output is represented publicly as a fixture package rather than raw provider payload, and current-phase conversion semantics may remain intentionally shallow including identity pass-through where needed.
    condition: Whenever world generation input or materialized world output is projected.
    failure: Reject provider-native first input shapes and raw payload exposure.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.world-facade-plane
  - id: rule.nimi.sdks.realm-consumer.r021
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: World render and session boundaries hold
    modality: must
    scope:
      - sdks.realm-consumer
    statement: The world render family owns renderer orchestration consume only and may expose render plan, initial coordinate or camera policy, capability requirements, and fallback guidance while never exposing renderer-driver lifecycle, window or canvas ownership, GPU or runtime handles, or renderer-native config blobs as stable public truth, and the world session family owns world-session composition semantics that may compose activity mode, chat context, agent context, and local session status without transferring ownership of chat, agent, cognition, or renderer truth into the world-domain facade.
    condition: Whenever world render or session surfaces are composed.
    failure: Reject driver exposure and ownership transfer.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.world-facade-plane
  - id: rule.nimi.sdks.realm-consumer.r022
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: World baseline exclusions stay excluded
    modality: must_not
    scope:
      - sdks.realm-consumer
    statement: The first world facade cut includes shared multi-user projection truth, world simulation semantics, provider-native request authoring, renderer-driver APIs, direct Realm mutation surfaces beyond existing authority homes, or cognition or authoring-workbench ownership.
    condition: Whenever world facade scope is extended.
    failure: Reject the excluded surfaces.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.world-facade-plane
  - id: rule.nimi.sdks.realm-consumer.r023
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: WEE projection is a downstream mirror only
    modality: must
    scope:
      - sdks.realm-consumer
    statement: The SDK exposes World Evolution Engine typed projection only as a downstream mirror of the Runtime World Evolution Engine authority, Runtime remains the semantic owner for execution-event, replay, checkpoint, supervision, effect-stage, and commit-request staging semantics, the SDK owns only the typed projection surface, SDK-visible helper type naming, and packaging of normalized contract-visible Runtime shapes, the SDK never widens eventKind, stage, supervision outcome, replay mode, checkpoint meaning, or commit-request authority beyond the Runtime contract, and any semantic change lands in the Runtime authority first with the SDK projecting only the resulting normalized shape.
    condition: Whenever WEE typed projection is defined or evolved.
    failure: Reject SDK-side widening and SDK-first semantic changes.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.world-evolution-projection-plane
  - id: rule.nimi.sdks.realm-consumer.r024
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: The WEE event envelope is closed
    modality: must
    scope:
      - sdks.realm-consumer
    statement: The stable top-level SDK World Evolution Engine event projection is limited to eventId, worldId, appId, sessionId, traceId, tick, timestamp, eventKind, stage, actorRefs, causation, correlation, effectClass, reason, and evidenceRefs, kind-specific detail is projected only as a discriminated extension subordinate to the normalized envelope, and the SDK never promotes schemaId, schemaVersion, scope, runMode, Realm commit authorization results, history-append authorization results, workflow DAG, task, or node identity, workflow output event payloads, route_policy, fallback, or a bare payload struct to unconditional top-level shared-kernel truth.
    condition: Whenever WEE events are projected.
    failure: Reject envelope widening and promoted substrate fields.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.world-evolution-projection-plane
  - id: rule.nimi.sdks.realm-consumer.r025
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: Recovery projections stay Runtime-local mirrors
    modality: must
    scope:
      - sdks.realm-consumer
    statement: SDK replay, checkpoint, and supervision projections are normalized mirrors of contract-visible Runtime shapes limited to replay mode, result, and evidence-reference shapes preserving recorded-replay semantics, checkpoint identifier, reference, and restore-status shapes that remain explicitly Runtime-local, and supervision outcome projection using the closed Runtime-owned set CONTINUE, DEFER, ABORT, and QUARANTINE, the SDK never exposes scheduler internals, queue internals, workflow node progress internals, hidden re-inference controls, route or fallback migration knobs, or checkpoint internals outside contract-visible Runtime results as stable top-level truth, and missing required Runtime shapes, missing required evidence references, or unsupported enum values fail closed without reinterpreting absent evidence as successful replay, restore, or supervision recovery.
    condition: Whenever replay, checkpoint, or supervision surfaces are projected.
    failure: Fail closed on missing shapes and reject internals exposure.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.world-evolution-projection-plane
  - id: rule.nimi.sdks.realm-consumer.r026
    kind: rule
    owner: team.sdks
    lifecycle: active
    title: Commit-request staging is adapter-bound only
    modality: must
    scope:
      - sdks.realm-consumer
    statement: SDK commit-request staging projection is an explicit adapter-bound candidate and result surface whose stable candidate projection includes only the Realm-envelope-compatible fields worldId, appId, sessionId, effectClass, scope, schemaId, schemaVersion, actorRefs, reason, and evidenceRefs, Runtime-local staging references such as sourceEventIds, traceId, tick, causation, correlation, checkpoint references, or supervision references are projected only when Runtime already emits them as explicit contract-visible metadata, and the SDK never exposes commit-request staging as a second write contract, invents a new runMode surface, implies SDK-side commit authorization or automatic history append ownership, or reinterprets adapter-bound candidate creation as canonical Realm mutation success.
    condition: Whenever commit-request staging is projected.
    failure: Reject write-contract exposure and implied mutation success.
    relations:
      - type: applies_to
