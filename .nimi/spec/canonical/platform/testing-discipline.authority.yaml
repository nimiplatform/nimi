format: nimicoding.authority/v1
units:
  - id: definition.nimi.platform.testing-discipline.product-truth-vs-test-evidence
    kind: definition
    owner: team.platform
    lifecycle: active
    title: Product truth and test evidence
    meaning: Product and boundary semantics are product truth owned by admitted product authority, while tests, test names, fixtures, snapshots, inventories, reports, and execution history are evidence that can support but never create that truth.
    relations: []
  - id: definition.nimi.platform.testing-discipline.runtime-behavior-claim
    kind: definition
    owner: team.platform
    lifecycle: active
    title: Runtime behavior claim
    meaning: A runtime behavior claim is an assertion about runtime, state-machine, transport, persistence, user-interface interaction, or failure behavior that is established by calling a production boundary and observing its result rather than by inspecting source text, regex matches, snapshots, or generated bytes.
    relations: []
  - id: definition.nimi.platform.testing-discipline.active-test-obligation
    kind: definition
    owner: team.platform
    lifecycle: active
    title: Active test obligation
    meaning: An active test obligation is current executable evidence that remains either working or removed instead of being retained through quarantine, legacy, delivery-phase, or permanent-exclusion state.
    relations: []
  - id: definition.nimi.platform.testing-discipline.test-execution-verdict
    kind: definition
    owner: team.platform
    lifecycle: active
    title: Test execution verdict
    meaning: A test execution verdict reports pass only for execution that satisfies its required success condition; blocked, skipped, missing, unexecuted, unknown, and failed outcomes are non-passing outcomes.
    relations: []
  - id: definition.nimi.platform.testing-discipline.prerequisite-gated-verdict
    kind: definition
    owner: team.platform
    lifecycle: active
    title: Prerequisite-gated verdict
    meaning: A prerequisite-gated verdict depends on declared execution prerequisites and reports an unavailable required prerequisite as blocked or failed, with typed not-applicable status limited to an explicitly matched platform condition.
    relations: []
  - id: definition.nimi.platform.testing-discipline.semantic-review-verdict
    kind: definition
    owner: team.platform
    lifecycle: active
    title: Semantic review verdict
    meaning: A semantic review verdict is a human judgment of LocalAgent behavior whose review state is one of unreviewed, accepted, or needs_adjustment; objective execution facts and exact privacy leakage may be automated, but semantic observations, reports, scores, and annotations remain non-authoritative.
    relations: []
  - id: rule.nimi.platform.testing-discipline.r001
    kind: rule
    owner: team.platform
    lifecycle: active
    title: Tests never create product truth
    modality: must_not
    scope:
      - platform.testing-discipline
    statement: A test, test name, fixture, snapshot, inventory entry, report, matcher, or green execution history is treated as creating product or boundary truth.
    condition: Whenever test material or test results are interpreted.
    failure: Reject the semantic claim and resolve product truth from admitted product authority.
    relations:
      - type: applies_to
        target: definition.nimi.platform.testing-discipline.product-truth-vs-test-evidence
  - id: rule.nimi.platform.testing-discipline.r002
    kind: rule
    owner: team.platform
    lifecycle: active
    title: Source inspection never proves runtime behavior
    modality: must_not
    scope:
      - platform.testing-discipline
    statement: Source text, regex matching, snapshots, or generated byte comparisons are treated as proof of runtime, state-machine, transport, persistence, user-interface interaction, or failure behavior.
    condition: Whenever runtime behavior is claimed from test evidence.
    failure: Reject the behavior claim until production-boundary execution produces an observable result.
    relations:
      - type: applies_to
        target: definition.nimi.platform.testing-discipline.runtime-behavior-claim
  - id: rule.nimi.platform.testing-discipline.r003
    kind: rule
    owner: team.platform
    lifecycle: active
    title: Runtime claims exercise production boundaries
    modality: must
    scope:
      - platform.testing-discipline
    statement: Every test that claims runtime behavior calls the applicable production boundary and asserts its observable result.
    condition: Whenever a test claims runtime, state-machine, transport, persistence, user-interface interaction, or failure behavior.
    failure: Reject the runtime behavior claim as unproved.
    relations:
      - type: applies_to
        target: definition.nimi.platform.testing-discipline.runtime-behavior-claim
  - id: rule.nimi.platform.testing-discipline.r004
    kind: rule
    owner: team.platform
    lifecycle: active
    title: Snapshot refresh is not a behavior fix
    modality: must_not
    scope:
      - platform.testing-discipline
    statement: Refreshing a stale implementation-detail snapshot is treated as repairing a behavior defect.
    condition: Whenever a behavior test fails because an implementation-detail snapshot is stale.
    failure: Keep the behavior defect open until observable production behavior is corrected and proved.
    relations:
      - type: applies_to
        target: definition.nimi.platform.testing-discipline.runtime-behavior-claim
  - id: rule.nimi.platform.testing-discipline.r005
    kind: rule
    owner: team.platform
    lifecycle: active
    title: Active tests have no quarantine state
    modality: must_not
    scope:
      - platform.testing-discipline
    statement: An active test is retained under legacy, quarantine, candidate, wave, phase, remove-after, or equivalent delivery-state classification.
    condition: Whenever the active test set is changed or evaluated.
    failure: Fix the test or remove it instead of retaining a delivery-state exclusion.
    relations:
      - type: applies_to
        target: definition.nimi.platform.testing-discipline.active-test-obligation
  - id: rule.nimi.platform.testing-discipline.r006
    kind: rule
    owner: team.platform
    lifecycle: active
    title: Broken tests are fixed or removed immediately
    modality: must
    scope:
      - platform.testing-discipline
    statement: A broken test is fixed or deleted in the same change that exposes the breakage and is never preserved through a permanent exclusion ledger.
    condition: Whenever an active test is found to be broken.
    failure: Keep the change failing until the test is fixed or removed.
    relations:
      - type: applies_to
        target: definition.nimi.platform.testing-discipline.active-test-obligation
  - id: rule.nimi.platform.testing-discipline.r007
    kind: rule
    owner: team.platform
    lifecycle: active
    title: Deterministic regression requires real success
    modality: must
    scope:
      - platform.testing-discipline
    statement: A deterministic regression execution returns a real zero exit before it receives a passing verdict.
    condition: Whenever deterministic regression execution is required.
    failure: Report a non-passing verdict for every nonzero or absent execution result.
    relations:
      - type: applies_to
        target: definition.nimi.platform.testing-discipline.test-execution-verdict
  - id: rule.nimi.platform.testing-discipline.r008
    kind: rule
    owner: team.platform
    lifecycle: active
    title: Missing prerequisites never become pass
    modality: must_not
    scope:
      - platform.testing-discipline
    statement: An unavailable required binary, platform, shell, provider, secret, external repository, or other declared prerequisite produces a passing verdict.
    condition: Whenever required execution depends on an unavailable declared prerequisite.
    failure: Report the execution as blocked or failed under its applicable contract.
    relations:
      - type: applies_to
        target: definition.nimi.platform.testing-discipline.prerequisite-gated-verdict
  - id: rule.nimi.platform.testing-discipline.r009
    kind: rule
    owner: team.platform
    lifecycle: active
    title: Platform skips require matched declarations
    modality: must
    scope:
      - platform.testing-discipline
    statement: A platform-specific test emits a typed not-applicable result only when both the test execution and its gate declare the same platform condition.
    condition: Whenever a platform-specific test does not apply to the executing platform.
    failure: Reject silent early return and every untyped or unmatched skip.
    relations:
      - type: applies_to
        target: definition.nimi.platform.testing-discipline.prerequisite-gated-verdict
  - id: rule.nimi.platform.testing-discipline.r010
    kind: rule
    owner: team.platform
    lifecycle: active
    title: Failed prerequisites block dependent passes
    modality: must_not
    scope:
      - platform.testing-discipline
    statement: A failed prerequisite checkpoint produces a passing verdict for any dependent test result.
    condition: Whenever a test result depends on a prerequisite checkpoint.
    failure: Report the dependent result as blocked by the failed prerequisite or failed.
    relations:
      - type: applies_to
        target: definition.nimi.platform.testing-discipline.prerequisite-gated-verdict
  - id: rule.nimi.platform.testing-discipline.r011
    kind: rule
    owner: team.platform
    lifecycle: active
    title: Non-passing outcomes never count as pass
    modality: must_not
    scope:
      - platform.testing-discipline
    statement: A blocked, skipped, missing, unexecuted, unknown, or failed outcome is counted as a passing verdict.
    condition: Whenever test outcomes are reported or aggregated.
    failure: Report the outcome as non-passing without conversion or pseudo-success.
    relations:
      - type: applies_to
        target: definition.nimi.platform.testing-discipline.test-execution-verdict
  - id: rule.nimi.platform.testing-discipline.r012
    kind: rule
    owner: team.platform
    lifecycle: active
    title: LocalAgent semantics remain human review observations
    modality: must
    scope:
      - platform.testing-discipline
    statement: Real LocalAgent conversation reports preserve source, world, relationship, knowledge, transcript, and model context and present identity consistency, world understanding, continuity, unknown handling, privacy boundaries, contradiction resistance, tone, style, and relationship effects only as human-review observations.
    condition: Whenever LocalAgent semantic behavior is evaluated.
    failure: Reject any report that replaces reviewable observations with an automatic semantic verdict.
    relations:
      - type: applies_to
        target: definition.nimi.platform.testing-discipline.semantic-review-verdict
  - id: rule.nimi.platform.testing-discipline.r013
    kind: rule
    owner: team.platform
    lifecycle: active
    title: Automation cannot admit semantic quality
    modality: must_not
    scope:
      - platform.testing-discipline
    statement: A test, matcher, score, evaluator, threshold, application, transcript, or generated report authors personality truth or automatically passes, fails, or accepts LocalAgent semantic quality.
    condition: Whenever automated material evaluates LocalAgent semantics.
    failure: Remove the automatic semantic verdict and retain the material only as non-authoritative human-review input.
    relations:
      - type: applies_to
        target: definition.nimi.platform.testing-discipline.semantic-review-verdict
  - id: rule.nimi.platform.testing-discipline.r014
    kind: rule
    owner: team.platform
    lifecycle: active
    title: Generated semantic review defaults to unreviewed
    modality: must
    scope:
      - platform.testing-discipline
    statement: Every generated LocalAgent report and review dimension initializes review status to unreviewed with empty review notes and uses only unreviewed, accepted, or needs_adjustment as review status.
    condition: Whenever a LocalAgent semantic review record is generated.
    failure: Reject generated accepted or needs_adjustment status, generated non-empty review notes, and status outside the closed set.
    relations:
      - type: applies_to
        target: definition.nimi.platform.testing-discipline.semantic-review-verdict
  - id: rule.nimi.platform.testing-discipline.r015
    kind: rule
    owner: team.platform
    lifecycle: active
    title: Semantic automation cannot change authoritative disposition
    modality: must_not
    scope:
      - platform.testing-discipline
    statement: An automated semantic evaluator or optional artificial-intelligence annotation changes human review status, product truth, model-visible context, or release or admission disposition.
    condition: Whenever semantic automation or an optional artificial-intelligence annotation is produced.
    failure: Preserve the prior human review and authoritative dispositions and mark the automated output non-authoritative.
    relations:
      - type: applies_to
        target: definition.nimi.platform.testing-discipline.semantic-review-verdict
  - id: rule.nimi.platform.testing-discipline.r016
    kind: rule
    owner: team.platform
    lifecycle: active
    title: Behavior observations never masquerade as acceptance
    modality: must_not
    scope:
      - platform.testing-discipline
    statement: A LocalAgent behavior observation receives a semantic pass, fail, skip, blocked, accepted, or completed-as-passed result.
    condition: Whenever a LocalAgent behavior observation is recorded or reported.
    failure: Remove the automatic outcome and retain only a mapped human-review observation with unreviewed status until a human reviews it.
    relations:
      - type: applies_to
        target: definition.nimi.platform.testing-discipline.semantic-review-verdict
