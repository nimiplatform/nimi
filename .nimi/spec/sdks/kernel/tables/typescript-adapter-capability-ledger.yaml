version: 1
table_family: protocol_surface
owner: sdks
protocol_id: sdks_typescript_adapter_capability_ledger
scope:
  target_root: sdks/typescript/adapters
  package_posture: source-root-placeholders-until-public-package-names-are-owner-approved
level_values:
  - L0
  - L1
  - L2
  - L3
  - L4
  - L5
status_values:
  - implemented
  - deferred
  - blocked
capability_support_values:
  - supported
  - partial
  - unsupported
  - not-applicable
capability_mode_values:
  - adapter-mapped
  - framework-owned
  - runtime-owned
  - sdk-feature-owned
  - caller-owned
  - owner-gated
  - governance-only
  - out-of-domain
surfaces:
  - id: vercel-ai
    source_root: sdks/typescript/adapters/vercel-ai
    minimum_capability_level: L2
    implementation_level: L2
    release_target_level: L3
    release_target_status: blocked
    implementation_status: implemented
    manifest: sdks/typescript/adapters/vercel-ai/manifest.ts
    test: sdks/typescript/adapters/vercel-ai/vercel-ai.test.ts
    example: sdks/typescript/adapters/vercel-ai/vercel-ai.example.ts
    unsupported_behavior: throw
    production_core_binding: Maps Vercel LanguageModelV3 generate/stream calls onto NimiAiModel with target-library migration semantics (text, reasoning, function tool definitions, tool choice, tool-call return, streaming tool-input protocol, Vercel framework-owned execute callbacks, Vercel framework-owned multi-step loops, multimodal image/audio/video file input, and text/json-object/json-schema structured output), validated by a conformance suite that drives the real `ai` package (generateText, streamText, generateObject, streamObject, tool, stepCountIs) through the adapter. Adapter-owned NimiTool.execute, provider-defined tools, external execution, response sources, and raw chunks remain fail-closed; provider options project into visible request metadata without independently guaranteeing provider-side honoring.
    release_blocker: L3 cannot be claimed until adapter-owned execute, Runtime-owned approval/external execution, provider-defined tools, and Nimi trace/source mapping land over admitted Runtime-owned surfaces. Framework-owned Vercel execute callbacks and Vercel multi-step orchestration are already target-library supported and must not be counted as L3 blockers.
    capability_claims:
      - capability: model.provider
        support: supported
        mode: adapter-mapped
      - capability: text.generate
        support: supported
        mode: adapter-mapped
      - capability: text.stream
        support: supported
        mode: adapter-mapped
      - capability: runEvents.text
        support: supported
        mode: adapter-mapped
      - capability: runEvents.reasoning
        support: supported
        mode: adapter-mapped
      - capability: runEvents.finish
        support: supported
        mode: adapter-mapped
      - capability: runEvents.error
        support: supported
        mode: adapter-mapped
      - capability: runEvents.toolCallReturn
        support: supported
        mode: adapter-mapped
      - capability: structured.output.requestMapping
        support: supported
        mode: adapter-mapped
      - capability: tools.definitionMapping
        support: supported
        mode: adapter-mapped
      - capability: tools.toolChoiceMapping
        support: supported
        mode: adapter-mapped
      - capability: tools.callerOwnedLoop
        support: supported
        mode: framework-owned
      - capability: tools.execute
        support: supported
        mode: framework-owned
      - capability: tools.adapterExecute
        support: unsupported
        mode: adapter-mapped
      - capability: tools.providerDefined
        support: unsupported
        mode: runtime-owned
      - capability: multiStep
        support: supported
        mode: framework-owned
      - capability: approval
        support: partial
        mode: framework-owned
      - capability: externalExecution
        support: unsupported
        mode: runtime-owned
      - capability: traces
        support: partial
        mode: framework-owned
      - capability: multimodalInput
        support: partial
        mode: adapter-mapped
      - capability: multimodalOutput
        support: partial
        mode: adapter-mapped
      - capability: sources
        support: unsupported
        mode: runtime-owned
      - capability: rawChunks
        support: unsupported
        mode: adapter-mapped
      - capability: providerOptions
        support: partial
        mode: adapter-mapped
      - capability: usageTokenDetails
        support: partial
        mode: adapter-mapped
      - capability: memoryContext
        support: not-applicable
        mode: out-of-domain
      - capability: knowledgeContext
        support: not-applicable
        mode: out-of-domain
      - capability: workflowCheckpoint
        support: not-applicable
        mode: out-of-domain
      - capability: migrationProof
        support: not-applicable
        mode: governance-only
    verification_gates:
      - check:sdk-vnext-adapter-capability-ledger

  - id: openai-compatible
    source_root: sdks/typescript/adapters/openai-compatible
    minimum_capability_level: L2
    implementation_level: L2
    release_target_level: L2
