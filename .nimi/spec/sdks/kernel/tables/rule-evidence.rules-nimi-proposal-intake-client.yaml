table_family: support_registry
registry_id: sdk_rule_evidence_requirement_rules_nimi_proposal_intake_client
owner: sdks
schema_ref: .nimi/contracts/table-family.schema.yaml#support_registry
allowed_fields:
  - rule_id
  - evidence_requirement
  - evidence_refs
  - note
  - na_reason
  - evidence_scope_note
forbidden_state_fields:
  - done
  - covered
  - coverage_status
  - audit_date
  - evidence_report
  - current
  - proposed
  - backlog_status
  - migration_status
  - mapping_status
  - run_id
  - ledger_ref
entries:
  - S-PROP-001
  - S-PROP-002
  - S-PROP-003
  - S-PROP-004
  - S-PROP-005
  - S-PROP-006
  - S-PROP-007
  - S-PROP-008
rules:
  - rule_id: S-PROP-001
    evidence_refs:
      - sdk_kernel_consistency
      - sdk_behavioral_test
    evidence_requirement: required
    note: SDK proposal-intake client is the sole app-facing proposal path and must not expose app-local proposal truth.
  - rule_id: S-PROP-002
    evidence_refs:
      - sdk_kernel_consistency
      - sdk_behavioral_test
    evidence_requirement: required
    note: Logical create/get/transition operations are non-executing and require Platform operation backing.
  - rule_id: S-PROP-003
    evidence_refs:
      - sdk_kernel_consistency
      - sdk_behavioral_test
    evidence_requirement: required
    note: SDK record shape mirrors P-PROP-002 and is validated by proposal-intake tests.
  - rule_id: S-PROP-004
    evidence_refs:
      - sdk_kernel_consistency
      - sdk_behavioral_test
    evidence_requirement: required
    note: Closed proposal kind and state preservation is validated by proposal-intake tests.
  - rule_id: S-PROP-005
    evidence_refs:
      - sdk_kernel_consistency
      - sdk_behavioral_test
    evidence_requirement: required
    note: Missing Platform operation returns typed SDK failure rather than synthetic proposal success.
  - rule_id: S-PROP-006
    evidence_refs:
      - sdk_kernel_consistency
      - sdk_behavioral_test
    evidence_requirement: required
    note: Retired alias and non-execution guards reject forbidden draft and record fields.
  - rule_id: S-PROP-007
    evidence_refs:
      - sdk_kernel_consistency
      - sdk_behavioral_test
    evidence_requirement: required
    note: Source conversation boundary requires anchor and requester refs while forbidding raw transcript storage.
  - rule_id: S-PROP-008
    evidence_refs:
      - sdk_kernel_consistency
      - sdk_behavioral_test
    evidence_requirement: required
    note: App consumer projection boundary is validated by Zhiyu proposal-intake tests and SDK fail-closed behavior.
