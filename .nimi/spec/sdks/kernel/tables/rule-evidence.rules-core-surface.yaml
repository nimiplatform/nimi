    evidence_refs:
      - sdk_kernel_consistency
    note: sdk/world is the stable world-domain subpath inside the single SDK package and must not be misread as runtime RPC parity or K-WEV renaming
    evidence_requirement: required
  - rule_id: S-SURFACE-015
    evidence_refs:
      - sdk_kernel_consistency
    note: SDK developer-experience helpers are admitted only as ergonomics over public surfaces, not platform truth ownership
    evidence_requirement: required
  - rule_id: S-SURFACE-016
    evidence_refs:
      - sdk_kernel_consistency
    note: Client-side orchestration is admitted only as non-authoritative ephemeral coordination or explicit typed requests to authority services
    evidence_requirement: required
  - rule_id: S-SURFACE-017
    evidence_refs:
      - sdk_kernel_consistency
    note: SDK helper outputs that become durable product truth must commit through the owning Runtime, Realm, or Cognition typed operation
    evidence_requirement: required
  - rule_id: S-SURFACE-018
    evidence_refs:
      - sdk_kernel_consistency
    note: External framework adapters may ease migration but must not create OpenAI-compatible runtime endpoints, shadow agent runtimes, or parallel permission/memory/session systems
