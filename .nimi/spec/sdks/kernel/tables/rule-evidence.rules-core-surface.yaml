    evidence_requirement: required
  - rule_id: S-AICONF-004
    evidence_refs:
      - sdk_kernel_consistency
    note: Runtime local profile descriptor bridge boundary is admitted as SDK kernel contract truth; implementation must stay downstream of Runtime readiness/materialization authority.
    evidence_requirement: required
  - rule_id: S-AICONF-005
    evidence_refs:
      - sdk_kernel_consistency
