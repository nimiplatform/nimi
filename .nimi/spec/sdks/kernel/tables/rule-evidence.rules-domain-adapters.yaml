    evidence_requirement: required
  - rule_id: S-REALM-035
    na_reason: Blocked realtime protocol/dependency conflict; SDK is carrier-only and Runtime realtime authority is not admitted here
    evidence_requirement: not_applicable
  - rule_id: S-REALM-036
    na_reason: Blocked replay/delivery conflict; compatibility evidence and Runtime replay authority must precede any guarantee
    evidence_requirement: not_applicable
  - rule_id: S-REALM-037
    na_reason: Blocked event-vocabulary conflict; SDK does not maintain authoritative realtime event truth
    evidence_requirement: not_applicable
  - rule_id: S-REALM-038
    evidence_refs:
      - sdk_behavioral_test
      - sdk_kernel_consistency
    note: Unauthenticated decision routing; checkEmail/requestEmailOtp/verifyEmailOtp/passwordLogin allowed without token
    evidence_requirement: required
  - rule_id: S-REALM-040
    evidence_refs:
      - sdk_kernel_consistency
      - public_raw_token_authority_hardcut_gate
    note: SDK typed Realm API and trusted-carrier owner boundary; Runtime exclusively owns authenticated Realm unary, realtime, media, credential, and private-refresh truth.
    evidence_requirement: required
  - rule_id: S-WORLD-001
    evidence_refs:
      - sdk_kernel_consistency
    note: sdk/world is the SDK kernel authority home for the world-domain facade and must not re-own Realm truth, Runtime execution, renderer-driver, or simulation semantics
    evidence_requirement: required
  - rule_id: S-WORLD-002
    evidence_refs:
      - sdk_kernel_consistency
    note: Baseline family set is closed to truth, generate, fixture, render, and session in coarse-grained form
    evidence_requirement: required
  - rule_id: S-WORLD-003
    evidence_refs:
      - sdk_kernel_consistency
    note: World generation inputs must pass through world-domain projection before provider-bound request shaping; provider-native payloads are not the first public input shape
    evidence_requirement: required
  - rule_id: S-WORLD-004
    evidence_refs:
      - sdk_kernel_consistency
    note: Fixture package is the public local materialization object and remains distinct from raw provider payloads
    evidence_requirement: required
  - rule_id: S-WORLD-005
    evidence_refs:
      - sdk_kernel_consistency
    note: Renderer orchestration consume stays in sdk/world while renderer-driver implementation and native handles remain outside the public facade
    evidence_requirement: required
  - rule_id: S-WORLD-006
    evidence_refs:
      - sdk_kernel_consistency
    note: World session is a composition object and does not transfer chat, agent, cognition, or renderer truth ownership into sdk/world
    evidence_requirement: required
  - rule_id: S-WORLD-007
    evidence_refs:
      - sdk_kernel_consistency
    note: Baseline exclusions keep shared projection truth, simulation semantics, provider-native authoring, renderer-driver APIs, and direct Realm mutation outside the sdk/world cut
    evidence_requirement: required
  - rule_id: S-PKG-001
    evidence_refs:
      - sdk_kernel_consistency
    note: SDK root package metadata is admitted as evidence through platform audit evidence root admission and governed structurally by SDK kernel consistency.
    evidence_requirement: required
  - rule_id: S-PKG-002
    evidence_refs:
      - sdk_kernel_consistency
    note: Root SDK support documents remain projection/support evidence and must not override SDK kernel authority.
    evidence_requirement: required
  - rule_id: S-PKG-003
    evidence_refs:
      - sdk_kernel_consistency
    note: Package release behavior remains aligned to S-GATE, S-SURFACE, and S-BOUNDARY authority.
    evidence_requirement: required
  - rule_id: S-PKG-004
    evidence_refs:
      - sdk_kernel_consistency
    note: Spec-first evidence admission is validated by deterministic spec-governance checks and the platform audit evidence root gate.
    evidence_requirement: required
  - rule_id: S-PKG-005
    evidence_refs:
      - sdk_kernel_consistency
    note: sdks/ family metadata is separate from current sdk/ package metadata and cannot introduce package or release truth before generator/conformance admission.
    evidence_requirement: required
