table_family: support_registry
registry_id: sdks_rule_evidence_catalog
owner: sdks
schema_ref: .nimi/contracts/table-family.schema.yaml#support_registry
allowed_fields:
  - type
  - command
  - path
  - description
  - evidence_type
  - validation_scope
forbidden_state_fields:
  - done
  - covered
  - coverage_status
  - audit_date
  - evidence_report
  - current
  - proposed
  - backlog_status
  - migration_status
  - mapping_status
  - run_id
  - ledger_ref
entries:
  - sdk_behavioral_test
  - sdk_kernel_consistency
  - sdk_lint_gate
  - sdk_test_gate
  - sdk_boundary_gate
  - sdk_realm_consumer_gate
  - sdk_app_realm_boundary_gate
  - sdk_vnext_matrix_gate
  - sdks_typed_core_gate
  - sdk_mod_hardcut_gate
  - sdk_runtime_stable_ai_output_gate
  - sdk_consumer_smoke
  - public_raw_token_authority_hardcut_gate
sdk_behavioral_test:
  type: test_gate
  command: pnpm --filter @nimiplatform/sdk test
  path: sdks/typescript/package.json
  description: vNext TypeScript SDK behavioral unit/integration tests verifying rule semantics.
sdk_kernel_consistency:
  type: static_gate
  command: pnpm check:sdk-spec-kernel-consistency
  path: package.json
  description: Kernel rule integrity, vNext package contract validation, replacement ledger coverage, and generated sdks authority checks.
sdk_lint_gate:
  type: lint_gate
  command: pnpm --filter @nimiplatform/sdk lint
  path: sdks/typescript/package.json
  description: TypeScript compile and ESLint checks for SDK implementation.
sdk_test_gate:
  type: test_gate
  command: pnpm --filter @nimiplatform/sdk test
  path: sdks/typescript/package.json
  description: SDK unit tests pass as a whole. Rules with this ref (without test_files) are indirectly validated by the suite.
sdk_boundary_gate:
  type: static_gate
  command: pnpm check:sdk-vnext-package-contract && pnpm check:sdk-root-entry-contract && pnpm check:no-global-openapi-config
  path: scripts/check-sdk-vnext-package-contract.mjs
  description: Import boundary enforcement and legacy entry point prohibition.
sdk_realm_consumer_gate:
  type: static_gate
  command: pnpm check:sdk-vnext-realm-consumer-smoke
  path: scripts/check-sdk-vnext-realm-consumer-smoke.mjs
  description: Realm public consumer smoke coverage over the vNext generated Realm facade.
sdk_app_realm_boundary_gate:
  type: static_gate
  command: pnpm check:no-app-realm-rest-bypass
  path: scripts/check-no-app-realm-rest-bypass.mjs
  description: App production code Realm access boundary enforcement.
sdk_vnext_matrix_gate:
  type: static_gate
  command: pnpm check:sdk-vnext-matrix
  path: scripts/check-sdk-vnext-matrix.mjs
  description: vNext SDK matrix gate covering package contract, consumer smoke, adapters, migration proofs, and replacement evidence.
sdks_typed_core_gate:
  type: static_gate
  command: pnpm check:sdks-conformance-typed-core
  path: sdks/conformance/run.mjs
  description: Generated Runtime/Realm typed-core conformance across the sdks family.
sdk_runtime_stable_ai_output_gate:
  type: static_gate
  command: pnpm check:runtime-stable-ai-output-typing
  path: scripts/check-runtime-stable-ai-output-typing.mjs
  description: Stable runtime AI product surfaces must consume typed ScenarioOutput and ScenarioStreamDelta contracts without Struct/record reparsing.
sdk_consumer_smoke:
  type: test_gate
  command: pnpm check:sdk-consumer-smoke
  path: scripts/check-sdk-consumer-smoke.mjs
  description: Packaged SDK consumer smoke test proving public exports typecheck in standalone and workspace Nimi app consumers.
public_raw_token_authority_hardcut_gate:
  type: static_gate
  command: pnpm check:public-raw-token-authority-hardcut
  path: scripts/check-public-raw-token-authority.mjs
  description: Cross-domain structural gate rejecting every local SDK account-bearer helper/export and retaining only the pending-removal public RPC tombstone.
