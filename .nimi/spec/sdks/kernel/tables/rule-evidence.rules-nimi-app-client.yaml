    evidence_requirement: required
  - rule_id: S-APP-008
    evidence_refs:
      - sdk_kernel_consistency
    evidence_requirement: required
  - rule_id: S-APP-009
    evidence_refs:
      - sdk_kernel_consistency
    note: Ordinary-visible catalog filtering remains separate from account inventory and distinct local records; it creates no install, storage, principal, or launch truth.
    evidence_requirement: required
  - rule_id: S-APP-010
    evidence_refs:
      - sdk_kernel_consistency
    note: Immutable package mutation is absent from the 0K Nimi App client; catalog descriptors are read-only and readiness returns typed unavailable.
    evidence_requirement: required
  - rule_id: S-APP-011
    evidence_refs:
      - sdk_kernel_consistency
    note: Storage is Runtime principal-keyed; SDK/local-app carrier exposes no absolute root or storage operation and cannot derive app-id paths.
    evidence_requirement: required
  - rule_id: S-APP-012
    evidence_refs:
      - sdk_kernel_consistency
    note: Declared Nimi-API scopes are transparency-only; LOCAL_APP enforcement remains exact Runtime K-GRANT plus owner policy with no trust-tier or manifest effect.
    evidence_requirement: required
  - rule_id: S-APP-013
    evidence_refs:
      - sdk_kernel_consistency
    note: Immutable uninstall and SDK delete-data prompts are not admitted in 0K; tombstoned data remains Runtime-owned delete-only state with no force-delete or filesystem fallback.
    evidence_requirement: required
  - rule_id: S-APP-014
    evidence_refs:
      - sdk_kernel_consistency
    note: File-scope client is not admitted while Runtime K-APP-018 has no file-API method surface; SDK must not expose hidden bridge, REST, or filesystem fallback.
    evidence_requirement: required
  - rule_id: S-APP-015
    evidence_refs:
      - sdk_kernel_consistency
    note: Review-evidence accessor cross-references P-NAPP-025 review decision schema and P-AUDIT-006 review-evidence shape without redefining either. SDK review-evidence accessor tests are required.
    evidence_requirement: required
  - rule_id: S-APP-016
    evidence_refs:
      - sdk_kernel_consistency
      - public_raw_token_authority_hardcut_gate
    note: Generated-app Runtime platform client admits only local-first-party-app and local-app; the third-party branch receives a host-injected typed carrier with zero credential, principal, grant, endpoint, or caller-mode custody.
    evidence_requirement: required
  - rule_id: S-APP-017
    evidence_refs:
      - sdk_kernel_consistency
      - sdk_behavioral_test
    note: SDK preserves Runtime principal-partitioned storage truth, but the 0K LOCAL_APP carrier exposes no GetAppStorage operation or absolute root; storage operations remain typed unavailable pending separate admission.
    evidence_requirement: required
  - rule_id: S-APP-018
    evidence_refs:
      - sdk_kernel_consistency
      - sdk_behavioral_test
    note: SDK package readiness preserves the 0K typed-unavailable boundary and must not promote opaque lineage, attestation, execution-profile, or digest slots into a positive install assertion.
    evidence_requirement: required
  - rule_id: S-APP-019
    evidence_refs:
      - sdk_kernel_consistency
      - sdk_behavioral_test
    note: SDK account inventory preserves catalog visibility and local-record state as separate projections, with no caller-supplied account id or local filesystem fallback.
    evidence_requirement: required
  - rule_id: S-APP-020
    evidence_refs:
      - sdk_kernel_consistency
      - sdk_behavioral_test
    note: SDK unified Apps inventory preserves catalog, account, and distinct Runtime local-record sources; same-app-id principals never merge or become an installed boolean.
    evidence_requirement: required
  - rule_id: S-APP-021
    evidence_refs:
      - sdk_kernel_consistency
      - sdk_behavioral_test
    note: SDK exposes read-only current-carrier local-record/session/grant posture and no adoption, install, import, promotion, repair, workspace scan, or opaque owner identifiers.
    evidence_requirement: required
  - rule_id: S-APP-022
    evidence_refs:
      - sdk_kernel_consistency
      - sdk_behavioral_test
    note: SDK local-app bootstrap accepts only the host-neutral standardShell carrier and exposes exact read-only posture, exact-operation permission request, artifact and RuntimeAgent operations; zero grant and unavailable owners fail closed without generic Runtime forwarding.
    evidence_requirement: required
