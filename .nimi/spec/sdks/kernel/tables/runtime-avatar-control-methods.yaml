proto_boundary_note: >-
  The six runtime-owned methods ride daemon RPCs already admitted in
  proto/runtime/v1/agent_service.proto with runtime handlers and tests. The two
  runtime.avatarConfiguration methods are host-typed logical surfaces over the
  Desktop-owned closed configuration record (semantic_owner
  desktop_control_surface, D-LLM-079): reads and writes go through a
  caller-injected host persistence adapter following the S-AICONF-005 /
  S-RUNTIME-120 host-surface pattern and never become daemon RPC truth, so the
  proto-stub precondition does not apply to them.
