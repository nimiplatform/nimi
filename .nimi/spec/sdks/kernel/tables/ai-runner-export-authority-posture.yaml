version: 1
table_family: support_registry
registry_id: sdk_ai_runner_export_authority_posture
owner: sdks
schema_ref: .nimi/contracts/table-family.schema.yaml#support_registry
allowed_fields:
  - symbol
  - module
  - kind
  - posture
  - authority_ref
  - note
forbidden_state_fields:
  - done
  - covered
  - coverage_status
  - audit_date
  - evidence_report
  - current
  - proposed
  - backlog_status
  - migration_status
  - mapping_status
  - run_id
  - ledger_ref
source_rules:
  - S-SURFACE-015
  - S-SURFACE-016
  - S-BOUNDARY-005
semantics: >-
  Per-export authority posture registry for SDK AI-runner-facing public surfaces.
  Every public export under an enforced coverage root must declare exactly one
  posture. The registry does not create new authority semantics; it makes the
  existing S-SURFACE-015/S-SURFACE-016/S-BOUNDARY-005 distinction mechanically
  checkable so client-side AI runner helpers cannot drift into an unbacked second
  AI runner ontology. Enforced by scripts/check-sdk-ai-runner-export-posture.mjs.
  Mechanical checks verify reference resolvability, not semantic backing:
  whether a cited authority actually defines the projected vocabulary remains
  a review obligation on every new runtime-projection entry.
postures:
  - id: runtime-projection
    semantics: >-
      Projects an admitted Runtime/Realm/Cognition/Platform surface. Must cite
      at least one authority_ref whose target defines the projected vocabulary.
      Must not own canonical truth, infer routing, or synthesize authority
      evidence.
  - id: ephemeral-client-orchestration
    semantics: >-
      Non-authoritative client orchestration per S-SURFACE-016. Process-local
      state only. Output is ephemeral consumer state or an explicit request to
      an authoritative service. Subject to the S-BOUNDARY-006 promotion rule.
  - id: pure-sugar
    semantics: >-
      Stateless developer ergonomics: type utilities, builders, parsers,
      converters, validators. No orchestration loop, no state, no authority.
authority_ref_formats:
  - prefix: 'rule:'
    semantics: >-
      Spec rule ID, pattern rule:<DOMAIN>-<FAMILY>-<NUMBER>; must resolve to a
      rule heading in a kernel contract under .nimi/spec/.
  - prefix: 'group:'
    semantics: Runtime method group id resolvable in runtime-method-groups.yaml.
  - prefix: 'contract:'
    semantics: Spec contract path relative to .nimi/spec/, must exist on disk.
coverage_roots:
  - root: sdks/typescript/core/ai-runner
    entry: index.ts
    status: enforced
