version: 1
table_family: protocol_surface
owner: sdks
protocol_id: sdks_typescript_root_composition_decision_gate
scope:
  package_surface: "@nimiplatform/sdk"
  approval_status: owner-approved
  selected_option: explicit-nimi-client-no-singleton
  verification_gate: check:sdk-vnext-root-composition-decision
required_decision:
  question: Freeze the next-major root composition API for third-party developers and first-party app migration.
  why_owner_decision: Root naming and singleton semantics are hard to change after release; app adaptation cannot be source-rewritten without this decision.
  recommendation: explicit-nimi-client-no-singleton
decision_options:
  - id: explicit-nimi-client-no-singleton
    recommendation: true
    status: selected
    proposed_public_exports:
      - createNimiClient
      - NimiClient
      - NimiClientConfig
    semantics: Explicit app-owned SDK client composition over Runtime, Realm, App, AI, Agent, and feature surfaces.
    why: Best matches third-party developer ergonomics, multi-tenant/multi-runtime use, testability, and the hardcut requirement against legacy singleton state.

  - id: keep-platform-client-singleton
    recommendation: false
    status: rejected
    rejected_reason: Preserves the retired global singleton/platform-client mental model and would turn vNext into a forwarding shim.

  - id: root-reexports-only
    recommendation: false
    status: rejected
    rejected_reason: Does not replace the current root composition capability consumed by apps and examples.
forbidden_retired_exports:
  - createPlatformClient
  - createLocalFirstPartyRuntimePlatformClient
  - getPlatformClient
  - clearPlatformClient
  - unstable_attachPlatformWorldEvolutionSelectorReadProvider
  - createNimiAppRuntimePlatformClient
surfaces:
  - id: root-platform-composition
    package_surface: "@nimiplatform/sdk"
    approval_status: owner-approved
    selected_option: explicit-nimi-client-no-singleton
    recommended_option: explicit-nimi-client-no-singleton
    acceptance_blocker: false
    required_binding: Root composition must be explicit vNext-native client composition and must not restore current platform-client singleton semantics.
    verification_gate: check:sdk-vnext-root-composition-decision
