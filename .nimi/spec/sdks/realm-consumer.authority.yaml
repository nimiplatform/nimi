format: nimicoding.authority/v2
owner: team.sdks
scope: sdks.realm-consumer
units:
  - id: definition.nimi.sdks.realm-consumer.external-authority-plane
    kind: definition
    title: Realm external authority consumption plane
    meaning: Realm is the independent external authority for Account, Auth, Profile, World, PersonaCharacter, WorldCharacter, Character Source, World Source, their access control, and cloud audit, while this Nimi plane owns only consumer semantics for SDK, Runtime, Nimi Home, and authorized Apps.
  - id: definition.nimi.sdks.realm-consumer.first-party-browser-account-plane
    kind: definition
    title: First-party browser account consumer plane
    meaning: The first-party browser account consumer plane is the public typed SDK boundary through which the standalone Nimi Web account surface submits credential interactions to Realm and consumes the Realm-owned ordinary browser session without owning account truth, token custody, or Desktop authorization completion.
  - id: definition.nimi.sdks.realm-consumer.generated-core-plane
    kind: definition
    title: Realm generated core plane
    meaning: The Realm generated core plane owns the two admitted generated Realm projections from the configured Realm OpenAPI input, the public SDK core under the SDK generated directories and the Runtime-private carrier under the runtime generated realm directory, together with the Nimi wire-shape projection for CharacterSourceRefV3, the Packet v3 closure set, the eight packet limits, authenticated first-party challenges, current JWKS, ordered segments, the hash graph, and detached-proof carriers, while the closed Runtime-operation inventory remains owned by the realm-private-operation-carriers table.
  - id: definition.nimi.sdks.realm-consumer.facade-plane
    kind: definition
    title: Realm consumer facade plane
    meaning: The Realm consumer facade plane owns SDK handwritten typed facade behavior over generated Realm core, covering endpoint and token instance isolation, request transport configuration, typed error projection, retry and refresh orchestration, generated client composition, consumer availability and fail-closed states, current small Realm readiness and source-record reads, and the high-level authenticated Runtime MaterializeRealmSource intent carrying only CharacterSourceRefV3 and requestId.
  - id: definition.nimi.sdks.realm-consumer.world-facade-plane
    kind: definition
    title: SDK world facade plane
    meaning: The SDK world facade plane owns the app-facing sdk world facade boundary covering the public world-domain family boundary, the world-input projection boundary, the fixture package boundary, the renderer orchestration versus driver boundary, and the world-session composition boundary, without owning Realm canonical truth semantics, Runtime provider execution semantics, renderer-driver implementation semantics, or branch-local simulation semantics.
  - id: definition.nimi.sdks.realm-consumer.group-participation-plane
    kind: definition
    lifecycle: removed
    title: Deferred Realm group LocalAgent participation client boundary
    reason: Removed because Realm and Nimi hard-cut group LocalAgent participation and the complete group-chat product instead of retaining a deferred client boundary.
  - id: definition.nimi.sdks.realm-consumer.character-profile-projection
    kind: definition
    title: Shared Realm character profile consumer projection
    meaning: The shared Realm character profile consumer projection is the single Nimi interpretation of CharacterProfileCoreDto together with its exactly matching WorldPublicSourceCardDto for both PersonaCharacter and WorldCharacter sources; it preserves common display, narrative, knowledge, interaction, media, and public-source semantics, while source identity and dependency closure remain typed source-reference concerns and WorldCharacter bound-entity or incident relationships remain optional typed augmentations outside the shared profile.
  - id: rule.nimi.sdks.realm-consumer.r001
    kind: rule
    title: Realm authority stays external and unmirrored
    modality: must_not
    statement: Nimi specs, SDKs, Runtime, Nimi Home, or Apps re-declare Realm server rules, canonical records, lifecycle, access control, or cloud audit as Nimi-owned truth instead of stating the independent Realm owner boundary and consumer responsibilities.
    condition: Whenever Realm authority is referenced or consumed.
    failure: Remove the local ownership claim or mirror and preserve Realm as an independent authority consumed through public contracts.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.external-authority-plane
  - id: rule.nimi.sdks.realm-consumer.r002
    kind: rule
    title: Generated carriers are the consumer floor
    modality: must
    statement: Stable Realm API consumption starts from a generated Realm carrier sourced from the configured Realm OpenAPI input, public SDK consumption starts from the generated Realm SDK core while Runtime's constructor-injected private RealmMaterializationIssuer starts from the sibling generated Runtime-private carrier because Runtime never imports SDK packages, both projections are emitted by the same SDK generator invocation from the same OpenAPI input, the closed Runtime-operation inventory is owned by the realm-private-operation-carriers table whose rows independently declare runtime_projection and public_sdk_disposition so Runtime generation never implies removal from the public SDK, account-auth and authn operations are generated for Runtime and retained in the public Web SDK while source-materialization packet and JWKS operations are generated for Runtime and forbidden in the public SDK, and Runtime output is split into account-auth, authn, and source-materialization files so no generated carrier becomes a mixed-domain context sink.
    condition: Whenever Realm API carriers are generated or consumed.
    failure: Reject bypasses of generated Realm clients including app-local REST helpers, hand-authored endpoint strings, global OpenAPI singleton mutation, and duplicated response-shape declarations; handwritten SDK facades are admitted only when they wrap generated operations with typed fail-closed behavior and restore no second Realm contract.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.generated-core-plane
  - id: rule.nimi.sdks.realm-consumer.r003
    kind: rule
    title: Source materialization shapes are generated-only
    modality: must
    statement: Source materialization uses only the generated current Realm Packet v3 and CharacterSourceRefV3 transport shapes, the generated operation families own the authenticated first-party challenge, packet, ordered closure-set segment, component, hash-graph, current-JWKS, and detached-proof shapes, source materialization has no App access or durable authorization carrier, and SDK and apps never introduce a handwritten materialization DTO, anonymous source payload, fixed audience, raw bundle DTO, or parallel packet decoder.
    condition: Whenever source materialization shapes are authored or consumed.
    failure: Reject handwritten materialization DTOs and parallel packet decoders.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.generated-core-plane
  - id: rule.nimi.sdks.realm-consumer.r004
    kind: rule
    title: Runtime enforcement is not a second transport
    modality: must
    statement: Runtime account and auth clients and the bounded streaming verifier may own Runtime-private semantic validation state, canonical hashing, cryptographic verification, capacity accounting, and atomic-commit projections as enforcement semantics rather than a second Realm transport contract, they consume generated operation and request and response carriers with generated OpenAPI closure metadata gating every accepted response field family, Runtime never hand-authors a Realm path, request DTO, alternate response field, compatibility decoder, or public packet adapter, and OAuth form requests and JSON requests retain their generated content type so a generator that silently treats a declared request as unknown fails closed.
    condition: Whenever Runtime-private Realm enforcement is implemented or generated content types are resolved.
    failure: Fail closed on unknown declared requests and reject hand-authored Realm transport artifacts.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.generated-core-plane
  - id: rule.nimi.sdks.realm-consumer.r005
    kind: rule
    title: The SDK owns consumer semantics only
    modality: must_not
    statement: The SDK owns Realm canonical records, Realm Auth or token issuance, Realm Character or World lifecycle, source visibility, access policy, cloud audit, or Runtime LocalAgent materialization truth beyond its public client, typed projection, error, authentication-flow, and transport responsibilities.
    condition: Whenever SDK Realm ownership boundaries are evaluated.
    failure: Reject SDK ownership claims over Realm server truth or Runtime LocalAgent truth.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r006
    kind: rule
    title: Local projections never become Realm truth
    modality: must
    statement: Runtime and Desktop consume Realm projections through SDK-owned typed facades while local Runtime or Desktop state never becomes Realm canonical truth, a local projection that cannot be reconciled with Realm API output fails closed or exposes an explicit unavailable or error projection rather than synthesizing Realm success, Desktop, Kit, and Web submit only CharacterSourceRefV3 and requestId to the high-level authenticated Runtime MaterializeRealmSource operation, Runtime internally resolves the current account, canonical Realm base, bearer, fresh challenge, Packet v3 response, and current JWKS, Realm applies its first-party source visibility and readiness policy directly without an App-specific authorization carrier, and no app-facing facade receives or persists packet, proof, segment, or component bytes, chooses an audience, decodes closure truth into app-owned records, or accepts an unknown schema, field, enum, segment kind, limit, or hash branch as local success.
    condition: Whenever Realm projections are consumed by Runtime, Desktop, Kit, or Web.
    failure: Fail closed on unreconciled projections and reject synthesized Realm success.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r007
    kind: rule
    title: Version drift is handled by regeneration only
    modality: must
    statement: Realm API drift is handled by regenerating the SDK core from the configured Realm OpenAPI input and updating SDK consumer authority and tests, drift is never patched by copying Realm spec text into the realm spec subtree, freezing stale DTOs in handwritten clients, or adding compatibility aliases that hide server contract changes, and an unknown Packet v3 or challenge schema, field, enum, proof family, component or segment kind, limit, hash edge, or closure branch is version drift that fails closed until the configured Realm OpenAPI input is regenerated with handwritten compatibility readers forbidden.
    condition: Whenever Realm API drift is detected or handled.
    failure: Fail closed on unknown shapes and reject compatibility aliases and handwritten readers.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.generated-core-plane
  - id: rule.nimi.sdks.realm-consumer.r008
    kind: rule
    title: Exactly two generated projections exist
    modality: must
    statement: Realm generated core under the SDK generated directories is sourced from the configured Realm OpenAPI input of the external Realm authority, Nimi admits exactly two generated projections from that input, the public SDK core and the Runtime-private carrier required by the Runtime import boundary, the same generator run emits and drift-checks both projections with no third projection, packet issuance and current-JWKS acquisition are consumed only by Runtime's private RealmMaterializationIssuer according to the realm-private-operation-carriers table, no handwritten core, facade, app, or public Runtime adapter owns a parallel materialization request DTO or transport path, and Runtime-private streaming verification state remains Runtime enforcement semantics gated by generated field closure.
    condition: Whenever generated Realm core projections are produced or extended.
    failure: Reject third projections and parallel materialization DTOs or transport paths.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.generated-core-plane
  - id: rule.nimi.sdks.realm-consumer.r009
    kind: rule
    title: The facade fails closed and exposes no packets
    modality: must
    statement: A handwritten TypeScript Realm facade over generated Realm core fails closed on malformed operation boundaries, never restores global OpenAPI singleton configuration, may validate, route, retry, and correlate current small Realm reads, never exposes packet issuance, challenge, bearer, authorization selection, raw packet, proof, segment, or component bytes, or Packet v3 decoding to SDK, Kit, Desktop, or Web callers because those callers submit only CharacterSourceRefV3 and requestId through the authenticated Runtime MaterializeRealmSource facade with Runtime alone acquiring and verifying the generated Packet v3 transport, generated language manifests prove schema and operation shape convergence without proving that every language exposes or can execute every operation, Runtime-private operations are never projected as public SDK methods, and language behavior claims require an executable conformance path that returns normally or a typed error and never panics, traps, or aborts the process.
    condition: Whenever the Realm facade or language conformance claims are evaluated.
    failure: Fail closed on malformed boundaries and reject packet exposure and panic paths.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r010
    kind: rule
    title: Scaffolded and Direct SDK Realm access remain distinct
    modality: must
    statement: An App Tools Scaffolded Desktop-hosted Local App uses the standard SDK through Runtime-mediated Realm access and never receives, reads, stores, or refreshes a Realm JWT or maintains Runtime session proof, while a Direct SDK Consumer outside that hosted path may use the standard Realm Auth flow and is responsible for securely maintaining and refreshing its own Realm token.
    condition: Whenever SDK Realm authentication or token custody is selected for a consumer.
    failure: Reject a user-selectable transport profile, Realm token custody in a Scaffolded Local App, or implicit token custody for a Direct SDK Consumer.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r011
    kind: rule
    title: Runtime mediates the authenticated Realm App data plane
    modality: must
    statement: The SDK owns typed Realm APIs and trusted internal carriers, Runtime owns Realm credential custody, bearer injection, private refresh, protected App ingress mediation, and operation-specific App-facing positive and failure projection, and the Realm owner retains resource and business admission, rules, and execution; a protected App may reach only the Realm operations that the central App Operation Contract maps to realm.data and only while its current Effective App Access Snapshot covers realm.data, each admitted call uses a fixed typed request and returns a complete operation-specific bounded positive result or typed failure, and no App-facing result or error carries a raw Realm response, response header, access token, refresh token, authorization metadata, Realm base truth, session persistence, refresh callback, credential, caller identity, method selector, caller-selected origin, or generic transport; direct and first-party SDK facades do not create a fallback for a protected App call.
    condition: Whenever authenticated Realm data-plane composition for a protected App is evaluated.
    failure: Return protected-unavailable for an unadmitted composition or Realm-owner rejection and reject token custody or raw Realm response exposure.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r012
    kind: rule
    title: Facade instances are isolated
    modality: must
    statement: The Realm SDK entry is an instantiated facade with endpoint, token, and header state isolated per instance, and request engine configuration takes effect only in instance scope without writing global OpenAPI runtime state.
    condition: Whenever a Realm facade instance is constructed or configured.
    failure: Reject shared instance state and global request-engine mutation.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r013
    kind: rule
    title: Missing endpoint or token fails closed
    modality: must
    statement: A missing endpoint or token fails closed except in the explicit NO_AUTH mode, the NO_AUTH boundary admits only the public decision endpoints AuthService.checkEmail returning the typed CheckEmailEntryRoute of register_with_otp, login_with_otp, or login_with_password plus requestEmailOtp, verifyEmailOtp, and passwordLogin which need no prior token, and every other Realm call with a missing accessToken fails closed.
    condition: Whenever a Realm call runs without full endpoint and token configuration.
    failure: Fail closed outside the admitted NO_AUTH endpoints.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r014
    kind: rule
    title: Refresh is explicit, single-retry, single-flight
    modality: must
    statement: The auth refresh strategy is explicitly declared with no implicit background refresh state, without a configured refreshToken callback no automatic refresh occurs and a 401 goes directly to the error projection, accessToken supports a function mode carrying caller-managed manual refresh, with a configured refreshToken callback a 401 triggers refresh and a single retry of the original request, concurrent 401 responses merge into a single-flight refresh, and auth failure retries are limited to one observable attempt.
    condition: Whenever Realm auth refresh or 401 handling runs.
    failure: Reject implicit refresh, refresh storms, and unobservable retries.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r015
    kind: rule
    title: Realm readiness probes fail closed
    modality: must
    statement: A failed Realm ready probe fails closed and throws an error, and callers never substitute event telemetry for the availability judgment or treat the probe failure as a soft telemetry-only signal.
    condition: Whenever Realm readiness is probed.
    failure: Throw on probe failure without telemetry substitution.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r016
    kind: rule
    title: Auth errors are never disguised as success
    modality: must_not
    statement: 401, 403, 429, or 5xx semantics are disguised as successful responses.
    condition: Whenever Realm error responses are projected.
    failure: Preserve the typed error projection.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r017
    kind: rule
    title: Realtime details stay blocked authority conflicts
    modality: must
    statement: The realtime protocol, dependency, delivery, replay, and event-vocabulary details recorded by the retired realtime clauses remain blocked authority conflicts that are conflict evidence only and are not independently admitted for implementation until Runtime admits the corresponding realtime authority, Runtime compatibility evidence precedes any replay posture because client caches, outboxes, event shapes, and reconnect success cannot establish replay guarantees, the SDK constrains only authentication, state events, and reconnect boundaries, reconnect strategy implementation may vary but never silently drops already-confirmed delivered events, and the SDK maintains no authoritative realtime event-name enumeration because event names follow the backend protocol.
    condition: Whenever realtime consumption or replay posture is evaluated.
    failure: Reject independent realtime admissions and silent confirmed-event loss.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.facade-plane
  - id: rule.nimi.sdks.realm-consumer.r018
    kind: rule
    title: Facade behavior never sources local mirrors
    modality: must
    statement: Realm facade behavior derives from generated Realm core, explicit SDK consumer authority, and runtime or client mode configuration, and the SDK never consults or recreates the realm spec subtree as Realm server authority inside this repository.
    condition: Whenever Realm facade behavior is derived.
    failure: Reject facade behavior sourced from local Realm mirrors.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.external-authority-plane
  - id: rule.nimi.sdks.realm-consumer.r019
    kind: rule
    title: The world facade family set is fixed
    modality: must
    statement: The sdk world facade is the SDK authority home for the app-facing world-domain facade owning only the public world-domain family boundary, the world-input projection boundary, the fixture package boundary, the renderer orchestration versus driver boundary, and the world-session composition boundary, and the baseline family set is fixed to truth, generate, fixture, render, and session with all five families admitted in coarse-grained form.
    condition: Whenever the world facade surface is defined or extended.
    failure: Reject ownership beyond the five boundaries and families outside the fixed set.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.world-facade-plane
  - id: rule.nimi.sdks.realm-consumer.r020
    kind: rule
    title: World input and output are projection-shaped
    modality: must
    statement: Provider-bound world-generation requests pass through a world-domain truth-to-world-input projection layer before final provider request shaping, the world facade never exposes provider-native payloads as the first public input shape, local materialized world output is represented publicly as a fixture package rather than raw provider payload, and current-phase conversion semantics may remain intentionally shallow including identity pass-through where needed.
    condition: Whenever world generation input or materialized world output is projected.
    failure: Reject provider-native first input shapes and raw payload exposure.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.world-facade-plane
  - id: rule.nimi.sdks.realm-consumer.r021
    kind: rule
    title: World render and session boundaries hold
    modality: must
    statement: The world render family owns renderer orchestration consume only and may expose render plan, initial coordinate or camera policy, capability requirements, and fallback guidance while never exposing renderer-driver lifecycle, window or canvas ownership, GPU or runtime handles, or renderer-native config blobs as stable public truth, and the world session family owns world-session composition semantics that may compose activity mode, chat context, agent context, and local session status without transferring ownership of chat, agent, cognition, or renderer truth into the world-domain facade.
    condition: Whenever world render or session surfaces are composed.
    failure: Reject driver exposure and ownership transfer.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.world-facade-plane
  - id: rule.nimi.sdks.realm-consumer.r022
    kind: rule
    title: World baseline exclusions stay excluded
    modality: must_not
    statement: The first world facade cut includes shared multi-user projection truth, world simulation semantics, provider-native request authoring, renderer-driver APIs, direct Realm mutation surfaces beyond existing authority homes, or cognition or authoring-workbench ownership.
    condition: Whenever world facade scope is extended.
    failure: Reject the excluded surfaces.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.world-facade-plane
  - id: rule.nimi.sdks.realm-consumer.r044
    kind: rule
    lifecycle: removed
    title: Realm group participation remains deferred
    reason: Removed because Realm and Nimi hard-cut group LocalAgent participation and the complete group-chat product rather than retaining a deferred SDK surface.
  - id: rule.nimi.sdks.realm-consumer.r045
    kind: rule
    title: Character sources share one consumer profile projection
    modality: must
    statement: SDK, Runtime, Nimi Home, and authorized Apps project PersonaCharacter and WorldCharacter sources through the same shared Realm character profile consumer projection; a source-kind branch may select typed source identity, hash domain, and dependency closure, and a WorldCharacter branch may add bound-entity or incident-relationship facts, but no branch may redefine, omit, or reinterpret shared CharacterProfileCoreDto or WorldPublicSourceCardDto semantics.
    condition: Whenever a Nimi consumer materializes, adapts, displays, or compiles a PersonaCharacter or WorldCharacter source.
    failure: Fail closed on a mismatched source reference or public card, and reject a kind-specific profile schema or semantic parser, partial public-card projection followed by raw Core re-parsing, shared-field omission, and legacy CharacterProfileCoreDto roots including personaStyle, contentProfile, placement, or biography.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.character-profile-projection
  - id: rule.nimi.sdks.realm-consumer.r046
    kind: rule
    title: First-party Web auth uses the Realm browser session contract
    modality: must
    statement: The Nimi Web account surface uses generated public Realm auth and account operations with credentialed requests and the fixed browser-session response mode so Realm owns the secure HttpOnly SameSite browser session cookie and current-account confirmation; Web and the SDK keep no raw access or refresh bearer in a URL, localStorage, durable metadata, or parallel session store.
    condition: Whenever first-party Web performs account login, registration, recovery, two-factor, provider, wallet, password, or current-account interaction.
    failure: Reject a token-mode response, handwritten REST bypass, Web-owned session truth, insecure cookie posture, or durable bearer persistence.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.first-party-browser-account-plane
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.generated-core-plane
  - id: rule.nimi.sdks.realm-consumer.r047
    kind: rule
    title: Browser auth never completes Desktop authorization
    modality: must_not
    statement: Web or the public Realm SDK consumes, exchanges, persists, or transfers a Desktop authorization code, PKCE verifier, Runtime refresh token, or Desktop account bearer; an origin-admitted OAuth continuation may navigate the browser to the unchanged Realm authorize transaction only after the Realm-owned browser session is confirmed.
    condition: Whenever Web account authentication continues a Desktop authorization attempt.
    failure: Fail closed on an unadmitted origin or modified transaction and leave code exchange exclusively to RuntimeAccountService.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.first-party-browser-account-plane
