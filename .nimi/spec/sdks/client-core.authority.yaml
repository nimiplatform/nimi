format: nimicoding.authority/v2
owner: team.sdks
scope: sdks.client-core
units:
  - id: definition.nimi.sdks.client-core.public-surface-plane
    kind: definition
    title: SDK public surface plane
    meaning: The SDK public surface plane owns the app-facing published contract of the SDK family, including the fixed TypeScript public subpath set, the Runtime facade method projection governed by the runtime-method-groups table, forbidden legacy interface names, Realm and scope stable export faces, Realm public naming normalization, app Realm access entrypoints, raw escape-hatch naming, named app-facing Realm DTO quality, dynamic envelope allowlisting, stable AI typed-output surfaces, World Evolution Engine facade placement, the developer-experience and non-authoritative orchestration layers, the canonical commit boundary for helpers, integration adapter admission, core family placement, feature and adapter family boundaries, and the Runtime Agent turn and scenario job consumer DX surfaces.
  - id: definition.nimi.sdks.client-core.runtime-client-plane
    kind: definition
    title: SDK runtime client plane
    meaning: The SDK runtime client plane owns the app-facing Runtime client behavior of the SDK, including client construction without implicit global singletons, module projection and the runtime-owned authority split for memory, knowledge, agent, aiConfig, route, and media namespaces, high-level convenience targeting, ready fail-close probing, deferred and blocked service marking, disconnect events, retry backoff baseline, pagination projection, auth and subject context separation, session recovery, connector prevalidation, stable AI typed output projection, World Evolution Engine consumer boundaries, agent presentation and timeline projection boundaries, local consumer trust posture, local account and local-app consumer facades, Desktop-owned login adapters, artifact bytes retrieval, local transfer state projection, and memory observatory and canonical review status projections.
  - id: definition.nimi.sdks.client-core.transport-plane
    kind: definition
    title: SDK transport plane
    meaning: The SDK transport plane owns the declared Runtime transport constructions and their boundaries, including the closed transport enum, metadata and body separation, streaming behavior without implicit reconnect, Realm request-engine instance configuration, SDK-to-Runtime version compatibility, trace and observability limits, stream terminal-frame, timeout, chunk, backpressure, and slow-consumer projections, auth injection boundaries, resume and retry classification, the host-injected local-development carrier projection, and the independent verified-native-host bundled Avatar carrier.
  - id: definition.nimi.sdks.client-core.error-projection-plane
    kind: definition
    title: SDK error projection plane
    meaning: The SDK error projection plane owns the two-layer SDK error model, reason-code fact-source consumption, the SDK local error-code table, transport-level and application-level retryable classification, version and method compatibility errors, non-error terminal reason projection, synthetic reason-code governance, stream cancellation semantics, structured normalization priority, cross-transport projection consistency, the NimiError minimum shape, and scenario job failure detail projection.
  - id: definition.nimi.sdks.client-core.boundary-plane
    kind: definition
    title: SDK boundary plane
    meaning: The SDK boundary plane owns cross-package and cross-layer import boundaries inside the SDK family, the fixed SDK root entry composition surface, the separation between developer ergonomics and authority ownership, the client orchestration promotion rule, and the boundary between Runtime Agent lifecycle chat and ordinary app AI session loops.
  - id: definition.nimi.sdks.client-core.scope-plane
    kind: definition
    title: SDK scope plane
    meaning: The SDK scope plane owns the minimal stable scope client surface, an in-memory catalog with publish, revoke, and query semantics that expresses authorization prerequisite data only, follows the SDK transport contract for subscription rebuild, projects local errors into the controlled sdk-error-codes families, and stays inside SDK package boundaries.
  - id: rule.nimi.sdks.client-core.r001
    kind: rule
    title: SDK subpath imports stay on public export faces
    modality: must
    statement: Every SDK subpath completes cross-domain dependencies only through public export faces, cross-domain private implementation imports are forbidden, the SDK must not cross realm or runtime private boundaries, and this baseline import rule applies to all surfaces and may stack with specialized rules.
    condition: Whenever SDK code imports across subpath or domain boundaries.
    failure: Reject the cross-domain private import.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.boundary-plane
  - id: rule.nimi.sdks.client-core.r002
    kind: rule
    title: Runtime transport and Realm client stay separate
    modality: must_not
    statement: The SDK mixes the Runtime transport and the Realm REST client into a single private entrypoint instead of maintaining an explicit boundary between them.
    condition: Whenever Runtime and Realm client internals are composed.
    failure: Reject the merged private entrypoint.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.boundary-plane
  - id: rule.nimi.sdks.client-core.r003
    kind: rule
    title: The SDK root entry is the vNext composition surface
    modality: must
    statement: The SDK root entry is fixed to the owner-approved vNext composition surface createNimiClient, NimiClient, and NimiClientConfig, and retired platform-client and singleton entries, including global OpenAPI.BASE or OpenAPI.TOKEN assignment, createPlatformClient, createLocalFirstPartyRuntimePlatformClient, getPlatformClient, and clearPlatformClient, must not reappear.
    condition: Whenever the SDK root entry surface is defined or consumed.
    failure: Reject retired entry names and global singleton configuration.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.boundary-plane
  - id: rule.nimi.sdks.client-core.r004
    kind: rule
    title: Ergonomics helpers never own platform truth
    modality: must
    statement: SDK boundary decisions distinguish developer ergonomics from authority ownership, a helper is admitted when it is a typed projection, composition layer, adapter, parser, builder, stream assembler, or explicit test or development harness over admitted public surfaces, the public testing subpath may expose a deterministic in-process harness that derives request, response, stream, abort, and NimiError shapes from the same public SDK types and cannot create a transport, endpoint, credential, principal, account, permission, Runtime or Realm record, Simulator State Engine, or alternate product method contract, and a helper is rejected only when it owns or infers canonical Runtime, Realm, Cognition, or Platform truth, bypasses admitted transport, hides fail-closed states, or creates a second provider, model, session, memory, event, or permission authority, never solely because it performs client-side coordination.
    condition: Whenever SDK helper placement is reviewed.
    failure: Reject helpers that own or infer canonical truth and reject rejections based only on client-side coordination.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.boundary-plane
  - id: rule.nimi.sdks.client-core.r005
    kind: rule
    title: Outgrown client orchestration is promoted to its owner
    modality: must
    statement: Client orchestration is promoted to the owning authority before it becomes product truth when it persists data across process or app-session boundaries, controls provider or model routing or fallback policy, writes or mutates canonical memory, knowledge, agent state, app lifecycle, or Realm domain records, emits events consumers treat as Runtime, Realm, or Cognition audit or lifecycle truth, or requires cross-app, cross-device, permissioned, or account-scoped enforcement, until promoted the helper remains documented as non-authoritative, ephemeral, and caller-owned, a durable result is submitted through an admitted typed Runtime, Realm, or Cognition operation instead of local persistence, and Simulator deterministic presentation state remains non-authoritative and session-ephemeral with cross-app ordering, scenario state, logical time, replay, fixtures, and reset staying Simulator and App contract concerns outside SDK client orchestration.
    condition: Whenever client orchestration outgrows ephemeral consumer coordination.
    failure: Reject unpromoted orchestration as product truth and reject local persistence of durable results.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.boundary-plane
  - id: rule.nimi.sdks.client-core.r006
    kind: rule
    title: Agent lifecycle chat is distinguished from app AI loops
    modality: must
    statement: Runtime Agent lifecycle chat belongs to Runtime when behavior depends on agent lifecycle, identity, state, autonomy, hooks, or presentation posture, the Runtime-owned ConversationAnchor, Runtime Agent memory policy or canonical memory admission, turn planning, action existence, APML or message-action validation, voice or media workflow execution, agent event emission, or the runtime.agent app-message seam or RuntimeAgentService projection truth, ordinary app AI session loops are not Runtime-owned merely because they use an LLM, stream tokens, keep history, call tools, or expose a chat UI, SDK helpers are rejected only when they become a hidden authority and not when they coordinate an ephemeral AI turn, Runtime placement is rejected for ordinary product chat history unless tied to Runtime Agent lifecycle or another explicit Runtime authority domain, SDK may correlate and render the bounded LocalAgentSourceContextStatus and AgentTurnContextSummary projections but must not assemble LocalAgent prompts, attach source, world, memory, or context, or turn either summary back into provider-visible content because Runtime owns that composition, and ordinary Nimi Chat and ordinary app AI loops retain their existing caller and app prompt authority unnarrowed.
    condition: Whenever chat or session-loop placement between SDK, app, and Runtime is reviewed.
    failure: Reject hidden-authority helpers, SDK LocalAgent prompt assembly, and Runtime placement of ordinary product chat history.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.boundary-plane
  - id: rule.nimi.sdks.client-core.r007
    kind: rule
    title: The scope catalog surface is minimal and stable
    modality: must
    statement: The scope subpath minimal stable surface is the in-memory catalog publish, revoke, and query operations.
    condition: Whenever the scope client surface is defined.
    failure: Reject scope surface extensions beyond the minimal catalog operations.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.scope-plane
  - id: rule.nimi.sdks.client-core.r008
    kind: rule
    title: Scope expresses authorization prerequisites only
    modality: must_not
    statement: The scope client defines server-side authorization enforcement rules instead of expressing authorization prerequisite data only.
    condition: Whenever scope semantics are interpreted.
    failure: Reject scope-side authorization enforcement semantics.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.scope-plane
  - id: rule.nimi.sdks.client-core.r009
    kind: rule
    title: Scope subscriptions follow the transport contract
    modality: must
    statement: Scope subscription and rebuild behavior follows the SDK transport contract and never reconnects implicitly.
    condition: Whenever scope subscriptions are interrupted or rebuilt.
    failure: Reject implicit scope reconnection.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.scope-plane
  - id: rule.nimi.sdks.client-core.r010
    kind: rule
    title: Scope local errors use controlled families
    modality: must
    statement: Scope local errors project uniformly into the controlled families of the sdk-error-codes table.
    condition: Whenever scope local errors are produced.
    failure: Reject scope errors outside the controlled families.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.scope-plane
  - id: rule.nimi.sdks.client-core.r011
    kind: rule
    title: Scope stays inside package boundaries
    modality: must_not
    statement: The scope implementation calls runtime or realm private clients across package boundaries.
    condition: Whenever scope implementation dependencies are composed.
    failure: Reject cross-package private client calls.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.scope-plane
  - id: rule.nimi.sdks.client-core.r012
    kind: rule
    title: SDK errors project in two layers
    modality: must
    statement: SDK error projection separates two layers, upstream runtime errors carrying gRPC or HTTP status plus reason_code, and SDK local errors covering parameter validation, environment, and boundary violations.
    condition: Whenever an SDK error is classified.
    failure: Reject error projections that collapse the two layers.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.error-projection-plane
  - id: rule.nimi.sdks.client-core.r013
    kind: rule
    title: Runtime reason codes keep their Runtime fact source
    modality: must
    statement: Runtime-related ReasonCodes take the Runtime-owned reason-codes table as their authoritative fact source, and SDK documentation and code never reassign Runtime ReasonCode values.
    condition: Whenever Runtime ReasonCodes are consumed or documented in the SDK.
    failure: Reject SDK-side reassignment of Runtime ReasonCode values.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.error-projection-plane
  - id: rule.nimi.sdks.client-core.r014
    kind: rule
    title: The sdk-error-codes table is the sole local code source
    modality: must
    statement: The sole fact source for SDK local error codes is the sdk-error-codes table, Simulator control errors remain owned by the platform simulator-error-codes table and are neither SDK local error codes nor Runtime ReasonCodes, and SIMULATOR_-prefixed names must not be added to the sdk-error-codes table, exposed by a production SDK client, or leaked through the host-neutral facade.
    condition: Whenever SDK local error codes are defined or exposed.
    failure: Reject local codes outside the table and reject Simulator code exposure.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.error-projection-plane
  - id: rule.nimi.sdks.client-core.r015
    kind: rule
    title: Transport retryability is closed and reason-code gated
    modality: must
    statement: Retry semantics cooperate with the underlying transport code, only UNAVAILABLE, DEADLINE_EXCEEDED, RESOURCE_EXHAUSTED, and ABORTED may be marked retryable, stream interruption never auto-reconnects, when the ReasonCode is the SDK-synthesized OPERATION_ABORTED the call is not retryable even when the transport code is ABORTED, and ReasonCode-level retryable determination takes priority over transport-code-level determination.
    condition: Whenever transport-level retryability is determined.
    failure: Reject retries outside the closed set and retries of OPERATION_ABORTED.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.error-projection-plane
  - id: rule.nimi.sdks.client-core.r016
    kind: rule
    title: Realm local configuration errors use the SDK_REALM_ family
    modality: must
    statement: Realm SDK local configuration errors, including instance parameter validation and illegal request-engine configuration, use the SDK_REALM_ family with concrete code names owned by the sdk-error-codes table and never re-enumerated in domain documents.
    condition: Whenever Realm SDK local configuration errors are produced.
    failure: Reject Realm local errors outside the SDK_REALM_ family.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.error-projection-plane
  - id: rule.nimi.sdks.client-core.r017
    kind: rule
    title: Compatibility failures surface explicit local codes
    modality: must
    statement: Local errors raised during version negotiation or method availability checks use SDK_RUNTIME_ local error codes, major incompatibility returns an explicit incompatibility code, an unavailable method on the target runtime returns an explicit method-unavailable code, and these compatibility errors are never downgraded to generic network errors or empty success responses.
    condition: Whenever version negotiation or method availability checks fail.
    failure: Reject downgraded generic errors and empty success for compatibility failures.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.error-projection-plane
  - id: rule.nimi.sdks.client-core.r018
    kind: rule
    title: The public retryable ReasonCode set is closed
    modality: must
    statement: The public isRetryableReasonCode function marks application-level retryable ReasonCodes for upper consumers as a complement to transport-level retryability, the Runtime-sourced members are AI_PROVIDER_UNAVAILABLE, AI_PROVIDER_TIMEOUT, AI_PROVIDER_RATE_LIMITED, AI_STREAM_BROKEN, and SESSION_EXPIRED, the SDK-synthesized members are RUNTIME_UNAVAILABLE and RUNTIME_BRIDGE_DAEMON_UNAVAILABLE, the AI_LOCAL_SPEECH_ bundle reason family stays out of the default set because those codes express explicit download gating, preflight block, bundle init failure, or degraded repair truth rather than transient network faults, AI_LOCAL_SPEECH_DOWNLOAD_CONFIRMATION_REQUIRED is never treated as auto-retryable because it requires explicit user action, and runtime retryable metadata may drive UI retry or repair affordances without enlarging the default public set.
    condition: Whenever application-level retryability is classified.
    failure: Reject additions outside the closed set and auto-retry of excluded codes.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.error-projection-plane
  - id: rule.nimi.sdks.client-core.r019
    kind: rule
    title: Internal connection-recovery retry stays private
    modality: must
    statement: Runtime-internal transparent retry in auto connection mode uses an independent retryable set that includes SDK transport error codes such as SDK_RUNTIME_NODE_GRPC_UNARY_FAILED, that set serves internal connection recovery only and is never exposed as public API, and OPERATION_ABORTED is never retried.
    condition: Whenever internal connection-recovery retry runs.
    failure: Reject public exposure of the internal set and any OPERATION_ABORTED retry.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.error-projection-plane
  - id: rule.nimi.sdks.client-core.r020
    kind: rule
    title: Non-error terminal reasons are not thrown
    modality: must
    statement: A Runtime response may carry a reason_code with gRPC OK as a non-error terminal reason, the SDK projects these as response metadata or a finishReason field and never as thrown errors, the non-error terminal set is defined by the terminal_reason_non_error exit shape in the Runtime-owned error-mapping-matrix table and currently covers AI_FINISH_LENGTH and AI_FINISH_CONTENT_FILTER, the test_connector surface projects AI_CONNECTOR_CREDENTIAL_MISSING with the payload_ok_false exit shape and the SDK does not treat it as an exception, the grpc_status_or_payload_ok_false dual exit shape currently applies to AI_LOCAL_MODEL_PROFILE_MISSING and AI_LOCAL_MODEL_UNAVAILABLE on the local_consume_or_probe surface with the SDK handling both exits equivalently, gRPC errors as ordinary error projection and ok-false payloads as non-exceptional results, AI_LOCAL_SPEECH_PREFLIGHT_BLOCKED, AI_LOCAL_SPEECH_DOWNLOAD_CONFIRMATION_REQUIRED, and AI_LOCAL_SPEECH_BUNDLE_DEGRADED are the same dual exit shape across probe and consume paths, and the SDK preserves the original Runtime reasonCode without downgrading these to a generic local model unavailable.
    condition: Whenever a Runtime response carries a terminal reason without a gRPC error.
    failure: Reject thrown-error projection of non-error terminal reasons and reasonCode downgrades.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.error-projection-plane
  - id: rule.nimi.sdks.client-core.r021
    kind: rule
    title: Synthetic ReasonCodes are registered and bounded
    modality: must
    statement: Every SDK-synthesized ReasonCode absent from the Runtime reason-codes table is registered in the SDK_SYNTHETIC_REASON family of the sdk-error-codes table, the current synthetic codes are OPERATION_ABORTED, RUNTIME_UNAVAILABLE, and RUNTIME_BRIDGE_DAEMON_UNAVAILABLE, synthetic codes share the isRetryableReasonCode semantic space with Runtime ReasonCodes, and the Simulator harness maps declared simulated outcomes to the same host-neutral public result or NimiError shape as production without synthesizing a SIMULATOR_ ReasonCode, placing a raw Simulator code in code, reasonCode, message, or details, or expanding the retryable set, while qualification, lifecycle, module, and session-integrity failures remain Simulator Shell errors outside the app-facing SDK facade.
    condition: Whenever a synthetic ReasonCode is created or a simulated outcome is mapped.
    failure: Reject unregistered synthetic codes and Simulator code leakage.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.error-projection-plane
  - id: rule.nimi.sdks.client-core.r022
    kind: rule
    title: ExternalPrincipal auth codes classify exactly
    modality: must
    statement: AUTH_TOKEN_EXPIRED and AUTH_UNSUPPORTED_PROOF_TYPE are non-retryable ExternalPrincipal ReasonCodes excluded from the isRetryableReasonCode set because expired proof requires application-layer reissuance and an unsupported proof_type requires corrected registration parameters, while AUTH_REVOCATION_UNAVAILABLE expresses temporarily undecidable session revocation introspection, enters the retryable set, keeps an unavailable-retryable projection, and is never classified as reauth or token invalid.
    condition: Whenever ExternalPrincipal auth ReasonCodes are projected.
    failure: Reject auto-retry of the non-retryable pair and misclassification of AUTH_REVOCATION_UNAVAILABLE.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.error-projection-plane
  - id: rule.nimi.sdks.client-core.r023
    kind: rule
    title: Stream CANCELLED means intentional server close
    modality: must
    statement: When a long-lived subscription stream closes with gRPC CANCELLED because the daemon enters STOPPING, the SDK emits the runtime.disconnected event and does not auto-reconnect, CANCELLED is not a retryable transport code because the stop is intentional and blind retry keeps failing until the daemon recovers, the application layer resubscribes manually after detecting daemon recovery through its host status path or through the runtime.connected event or a ready retry, and the SDK preserves the semantic distinction that UNAVAILABLE means temporarily unreachable and immediately retryable while CANCELLED means intentionally closed by the server and requires rebuild after recovery.
    condition: Whenever a subscription stream closes with CANCELLED.
    failure: Reject auto-reconnect and retryable classification of CANCELLED.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.error-projection-plane
  - id: rule.nimi.sdks.client-core.r024
    kind: rule
    title: Error normalization follows one fixed priority
    modality: must
    statement: The SDK asNimiError and transport adaptation layers normalize errors by fixed priority, an existing NimiError is preserved unchanged, then a parseable structured object in details or message including embedded JSON is used, then a CODE-prefixed message yields the reasonCode, then transport fallback maps gRPC or HTTP status to a default reasonCode, then the final fallback uses an SDK default code family such as RUNTIME_CALL_FAILED, and normalization never overwrites an upstream reasonCode, actionHint, traceId, or retryable value.
    condition: Whenever an error is normalized.
    failure: Reject normalization that drops structured fields or overwrites upstream values.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.error-projection-plane
  - id: rule.nimi.sdks.client-core.r025
    kind: rule
    title: Transports project equivalent error shapes
    modality: must
    statement: The node-grpc and tauri-ipc transports output equivalent NimiError shapes for the same upstream failure, with consistent reasonCode, actionHint, traceId, and retryable fields, consistent ReasonCode extraction preferring structured payload, then CODE prefix, then status mapping, and no transport degrading to plain string errors while another preserves structured fields.
    condition: Whenever multiple transports project the same upstream failure.
    failure: Reject divergent or degraded per-transport error shapes.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.error-projection-plane
  - id: rule.nimi.sdks.client-core.r026
    kind: rule
    title: NimiError carries the minimum typed shape
    modality: must
    statement: Every NimiError instance carries the required reasonCode string from the Runtime reason-codes table or the SDK synthetic set, a human-readable message string, and a code string defaulting to the reasonCode and optionally carrying a transport-derived code, plus optional actionHint, traceId, retryable, and transport-safe structured details, when the upstream is a terminal ScenarioJob failure the SDK preserves the runtime-projected reason_metadata in details, for the AI_LOCAL_SPEECH_ family the SDK preserves runtime capability, bundle slice, and repair hint metadata so consumers never guess STT, TTS, or workflow slice from free message text, normalization never produces an instance missing required fields, and an injected deterministic harness produces exactly this same minimum shape containing only public SDK, Runtime, or Realm reason semantics with Simulator module, instance, epoch, and operation identifiers and raw SIMULATOR_ errors forbidden in details.
    condition: Whenever a NimiError instance is constructed or normalized.
    failure: Reject instances missing required fields or leaking forbidden identifiers.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.error-projection-plane
  - id: rule.nimi.sdks.client-core.r027
    kind: rule
    title: Scenario job failures keep structured detail
    modality: must
    statement: When polling GetScenarioJob reaches a terminal FAILED, CANCELED, or TIMEOUT state, the SDK preserves the symbolic reasonCode name and restores a stable string name when the transport delivers a numeric enum, uses reasonDetail as the short message without discarding reason_metadata, projects the runtime ScenarioJob reason_metadata verbatim into NimiError details, and never requires consumers to parse reasonDetail free text to recover failure detail.
    condition: Whenever a scenario job reaches a terminal failure state.
    failure: Reject numeric-only codes, dropped reason_metadata, and free-text-only failure detail.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.error-projection-plane
  - id: rule.nimi.sdks.client-core.r028
    kind: rule
    title: The Runtime transport enum is closed and explicit
    modality: must
    statement: The Runtime SDK transport constructions are node-grpc, tauri-ipc, electron-ipc, and the native protected-local-host carrier that is host-injected and never renderer-constructed, the deterministic in-process Simulator harness on the testing subpath is not a Runtime transport, opens no network or native carrier, is excluded from production transport selection, and missing production transport fails closed even when the testing subpath is installed, non-Node Runtime consumers pass an explicit transport, electron-ipc and tauri-ipc generic renderer bridges carry only independently admitted public or binding-only operations and reject protected method ids and authorization-bearing renderer payloads, protected Desktop calls use the host-injected native carrier through which the SDK receives a typed carrier handle and never endpoint, session, process, or trust material and cannot derive or inject origin, third-party app calls use the final host-injected LOCAL_APP carrier while bundled first-party calls retain their separately admitted carrier, production has no NIMI_RUNTIME_ENDPOINT or implicit endpoint discovery for protected calls, a Node loopback default is allowed only for separately signed synthetic non-product fixtures and public or binding-only testing, non-Node surfaces require an explicit ordinary transport or injected native carrier, and a missing method-required carrier fails closed.
    condition: Whenever a Runtime SDK transport is constructed or selected.
    failure: Fail closed on missing carriers and reject transports and payloads outside the closed constructions.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r029
    kind: rule
    title: Metadata and body fields stay separated
    modality: must
    statement: The Runtime SDK keeps metadata and body separation in which connectorId travels in the request body, provider endpoint and key material never enter SDK transport metadata because Runtime resolves connector and credential references inside service-principal custody, an authorization bearer may serve only an explicitly fenced Web or cloud, external-principal, or ordinary public AuthN contract and never establishes protected local origin or invokes the public Grant tombstones, and the idempotency key passes through options.idempotencyKey to the x-nimi-idempotency-key metadata with no header set and no runtime deduplication when absent.
    condition: Whenever request metadata and body fields are populated.
    failure: Reject provider material in metadata and bearer-established protected origin.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r030
    kind: rule
    title: Streams never reconnect implicitly
    modality: must_not
    statement: The SDK implicitly reconnects or resumes a stream after interruption instead of requiring the caller to explicitly rebuild the subscription.
    condition: Whenever a stream is interrupted.
    failure: Reject implicit reconnection and require caller rebuild.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r031
    kind: rule
    title: Realm request engine is instance-configured
    modality: must
    statement: The Realm SDK completes endpoint, token, and header merging through instance-level configuration and never through shared global OpenAPI runtime configuration.
    condition: Whenever Realm request-engine configuration is composed.
    failure: Reject shared global runtime configuration.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r032
    kind: rule
    title: Version compatibility is explicit and decidable
    modality: must
    statement: SDK-to-Runtime version negotiation is explicitly decidable, major incompatibility fails closed without silent partial-availability downgrade, minor and patch differences allow controlled degradation through capability probing or method availability checks, the compatibility result is readable by upper layers and never log-only, version information comes from initial-connection metadata exchange, method availability is statically determined from the runtime-method-groups table without runtime reflection, degradation is limited to marking deferred methods unavailable without changing active method semantics, blocked means a service whose proto dependency is not ready and returns SDK_RUNTIME_METHOD_UNAVAILABLE without version negotiation while deferred means roadmap-phase services whose availability depends on runtime version support, and production Desktop-to-Runtime protected compatibility is proven before SDK traffic by mutual platform-native process and code-signing verification with the exact protected_local_protocol_version plus reciprocal peer release-id admission, typed status returning the verified release id, semver metadata staying advisory for ordinary public transports only, and missing protected compatibility never using best-effort or assumed compatibility.
    condition: Whenever SDK and Runtime versions or method availability are negotiated.
    failure: Fail closed on major incompatibility and missing protected compatibility proof.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r033
    kind: rule
    title: Observability is trace-only and credential-free
    modality: must
    statement: The SDK supports passing call-chain trace identifiers downstream through metadata or headers, observability output never contains plaintext credentials such as API keys or tokens, and observability remains an auxiliary face that never changes request success or failure semantics or retry determination.
    condition: Whenever trace or observability output is produced.
    failure: Reject credential leakage and observability-driven semantic changes.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r034
    kind: rule
    title: Terminal stream frames project completely
    modality: must
    statement: The SDK projects the reason_code and usage of the runtime terminal stream frame to consumers, done true with REASON_CODE_UNSPECIFIED is normal completion, done true with an error reason_code is a business error projected as a stream-level error and never silently dropped, terminal-frame semantics remain owned by the Runtime stream authority, SubscribeScenarioJobEvents does not use done-true semantics and the server closes the stream after the terminal state, in Mode B subscriptions the terminal COMPLETED, FAILED, CANCELED, or TIMEOUT event arrives, the server closes with gRPC OK, the SDK stops reading and projects the terminal event as the final result without treating the OK close as an error, subsequent structured failure detail follows the scenario job failure detail rule, SubscribeWorkflowEvents follows the same projection as a deferred service, ExportAuditEvents and SubscribeAppMessages define no SDK projection while deferred, and the Phase 1 health subscription streams SubscribeRuntimeHealthEvents and SubscribeAIProviderHealthEvents project as runtime.healthEvents and runtime.providerHealthEvents subscription interfaces semantically equivalent to the Desktop IPC bridge consumption path.
    condition: Whenever runtime stream terminal frames or subscription terminal events are consumed.
    failure: Reject silent drops of terminal reason codes and error treatment of OK closes after terminal events.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r035
    kind: rule
    title: Stream timeouts are runtime-enforced
    modality: must
    statement: Streaming RPC timeouts are enforced on the runtime side, the runtime-configured first-packet timeout triggers DEADLINE_EXCEEDED with AI_PROVIDER_TIMEOUT and is not overridable from the SDK side, the total timeout is independently timed and runtime-configurable, the SDK adds no independent client-side stream timeout unless explicitly configured, and AI_PROVIDER_TIMEOUT remains a retryable ReasonCode.
    condition: Whenever streaming timeouts apply.
    failure: Reject SDK-side overrides and implicit client-side stream timeouts.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r036
    kind: rule
    title: Chunks pass through unmodified
    modality: must_not
    statement: The SDK re-splits or merges runtime stream chunks instead of passing through the runtime-owned chunk boundaries unchanged.
    condition: Whenever stream chunks are relayed.
    failure: Reject SDK-side chunk restructuring.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r037
    kind: rule
    title: Auth injection is fenced and non-upgrading
    modality: must
    statement: The auth.accessToken input is available only in explicit Web or cloud or external-principal adapters whose own authority admits it and is unreachable from every local Runtime app or Desktop facade, local protected account, lifecycle, Realm, connector, AI, and service-control calls never inject a bearer and require the native verified carrier and the exact Runtime-derived origin and operation policy, public or binding-only calls cannot be upgraded by a bearer, app id, caller enum, or metadata, removed public token, refresh, and credential-grant methods remain reserved, local-app public permission posture and request uses the protected owner surface and never returns a portable credential or owner decision id, and metadata.extra and renderer IPC reject authorization, provider keys, Realm bases, protected session ids, and origin material rather than silently stripping and continuing.
    condition: Whenever auth material is injected or rejected on a transport.
    failure: Reject bearer upgrades and silently stripped forbidden metadata.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r038
    kind: rule
    title: Backpressure projects as decidable errors
    modality: must
    statement: When stream consumption is too slow the SDK converts the backpressure close into a decidable error, server-side RESOURCE_EXHAUSTED triggered by a slow consumer projects as a NimiError, and the SDK never silently accumulates unbounded buffers, instead passing the pressure to the consumer or aborting the stream when the transport signals backpressure.
    condition: Whenever transport backpressure occurs.
    failure: Reject silent unbounded buffering and undecidable backpressure closes.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r039
    kind: rule
    title: Slow-consumer closes are never fake completions
    modality: must
    statement: A stream close triggered by a slow consumer projects as a stable error shape, the SDK never misreports a backpressure close as normal completion with done true and a normal reason, and the close reason projects as a NimiError whose reasonCode reflects the backpressure root cause.
    condition: Whenever a slow-consumer close is projected.
    failure: Reject normal-completion projection of backpressure closes.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r040
    kind: rule
    title: Resume and retry are classified by stream type
    modality: must
    statement: Automatic retry policy is explicitly classified by stream type, subscription streams recover under explicit caller control with the SDK allowed to emit recovery signals such as runtime.disconnected but never rebuilding subscriptions or replaying consumer state in the background, execution streams leave retry decisions to the caller with no SDK auto-replay, and SDK automatic retry is limited to unary and short-lived read calls while subscription and execution streams are explicitly rebuilt or replayed by upper layers.
    condition: Whenever automatic retry or resume policy is applied to a stream.
    failure: Reject background subscription rebuilds and automatic execution-stream replays.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r041
    kind: rule
    title: The local-development carrier is opaque and narrow
    modality: must
    statement: The SDK local-development transport is host-injected by Kit and never renderer-constructed, exposes only typed bootstrap and status plus admitted business calls, cannot accept or return a Runtime endpoint, project authorization, launch correlation, process binding, session id or proof, Runtime epoch, credential, token, capability fingerprint, or trust-class override, the native host performs request-empty OpenLocalAppSession only after the single-use launch lease is consumed by the exact process bind and the SDK receives neither that bootstrap operation nor its authority inputs, technical-session rotation and controlled host or Runtime restart stay transparent behind the typed transport with the native host alone performing request-empty RenewLocalAppSession on the current verified local_app_host connection unobservable to SDK and renderer, a revoked, expired, project-changed, account-changed, untrusted-host, or unavailable carrier produces a stable typed failure before a business call, session material never enters renderer IPC, application state, telemetry, errors, or retry callbacks, the transport does not widen the Runtime method set beyond public permission posture and request, app-private JSON read, write, and remove, and the agents.interact owner-selected open-conversation, send-turn, subscribe-turn, and conversation-snapshot operations, app-private storage is a base entitlement succeeding for a live principal, session, and account partition without a user permission, every other public permission and Agent inventory, selector construction, voice, artifact, account-control, lifecycle mutation, Realm, broad AI, realtime, media, admin, memory, direct Avatar control, embedded rendering, and generic Runtime forwarding stay absent from the third-party local-app carrier, app-native SQLite, media, settings, routes, and exact product commands remain outside this SDK permission surface, missing operation families remain typed unavailable, and ordinary Electron or Tauri IPC and localhost gRPC cannot claim this transport type.
    condition: Whenever the local-development carrier is injected or consumed.
    failure: Fail closed with typed unavailable results and reject authority material exposure or method-set widening.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r042
    kind: rule
    title: The bundled Avatar carrier is profile-fixed
    modality: must
    statement: The nimi.avatar Electron SDK transport is injected by the verified Avatar native host through the independent avatar_control logical carrier and exposes only the generated bundled_avatar_v1 Runtime profile without requiring a live Desktop process or OpenDesktopSession and without inheriting Desktop account-control, SDK callers use ordinary generated typed clients but cannot select the fixed app id, profile marker, origin role, endpoint, metadata, capability, account, or transport implementation, RegisterApp, OpenSession, GetAccessToken, bearer injection, scoped binding bootstrap, public gRPC fallback, and renderer auth truth are absent, account snapshot and events, the admitted Realm unary, Runtime Agent, voice, and lipsync, generated voice artifact reads, and bounded scenario jobs preserve their normal typed SDK semantics, carrier loss is Runtime unavailable while Realm transport failure alone is Cloud offline, reauthentication, permission, validation, contract, and rate-limit failures retain their owner-specific classifications, and streams close explicitly with the app reopening them after a new verified host connection while the SDK never manufactures replay or durable authority.
    condition: Whenever the bundled Avatar carrier is injected or consumed.
    failure: Reject caller selection of fixed profile facts and manufactured replay or durable authority.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r043
    kind: rule
    title: The TypeScript public subpath set is fixed
    modality: must
    statement: The vNext TypeScript package public subpaths are fixed to the root, runtime, runtime/generated, realm, realm/generated, app, types, contracts, ai, ai-runner, testing, features/conversation, features/knowledge-context, features/memory-context, features/generation, features/workflow, features/evaluation, and features/toolkits entries of the nimiplatform sdk package, the TypeScript package keeps one base SDK package with external framework adapters as independent packages never restored as base adapter subpaths, removed old subpaths including runtime/browser, runtime/agent-identity, world, ai-provider, ai-app, scope, scope/permission, and platform-catalog fail closed instead of forwarding to new internals, and the root entrypoint is the recommended app-level composition surface while subpaths remain explicit low-level escape hatches or dedicated domain entrypoints.
    condition: Whenever the public subpath set is defined or a removed subpath is imported.
    failure: Fail closed on removed subpaths and reject additions outside the fixed set.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r044
    kind: rule
    title: Runtime facade projection follows its fact sources
    modality: must
    statement: The vNext TypeScript app-facing Runtime facade projection groups methods by service with method names aligned to the runtime RPC method registry using design names, the TypeScript facade service list and projected method set are governed by the runtime-method-groups table with each group tracking alignment status and phase independently, that table is not the cross-language core method source and not protected Desktop admission authority, cross-language core method truth comes from Runtime proto plus admitted generator and spec inputs, generated Runtime bindings never use the TypeScript facade table as selective omission authority, the sole protected first-party Desktop operation-set input is the Runtime first-party protected runtime profiles table, SDK codegen joins that registry to RPC method and kind authority and emits closed DesktopMachineProductRuntimeMethods and DesktopAccountProductRuntimeMethods types plus purpose-specific machine and account intent clients, exact public names evolve only through this rule and the generated projection, the method memberships cannot be copied into an SDK table, Desktop production code never imports, returns, stores, casts to, or constructs the full Runtime facade, and a profile-external method is a generation, type, and structural-gate failure rather than a deferred carrier error.
    condition: Whenever the Runtime facade projection or protected Desktop client generation is defined.
    failure: Fail generation on profile-external methods and reject table misuse as omission or admission authority.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r045
    kind: rule
    title: Host injection controls transport and intent
    modality: must
    statement: Host injection supplies transport and selects a generated named intent outside renderer control, SDK and renderer inputs expose no endpoint, carrier, profile, role, principal, app id, account, owner authority, session, boot epoch, token, grant, scope, metadata authority, or arbitrary method id, account-client calls and streams bind the current Runtime account generation and surface typed relogin and retry state after logout, switch, or generation change without silently reopening, first-party product clients stay distinct from third-party app permissions and never project permission or grant UX, and the independent Runtime account and Realm broker remains a separate narrow client outside the machine and account product method groups.
    condition: Whenever host-injected Runtime clients are constructed or account context changes.
    failure: Reject renderer-exposed authority inputs and silent stream reopening.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r046
    kind: rule
    title: Cognition and agent projections keep the authority cut
    modality: must
    statement: The public runtime.memory and runtime.knowledge namespaces project only the runtime-owned memory and knowledge families of RuntimeCognitionService, memory embedding readiness, bind, and cutover methods remain under the runtime.memory namespace as host and runtime typed logical methods backed by retained runtime-private memory depth and are neither a standalone RuntimeMemoryService nor a canonical agent memory direct-write path, the steady-state agent authority surface is RuntimeAgentService with the admitted public projection runtime.agent, reactive agent-chat consumption is carried separately on the reserved runtime.agent app-message seam via the admitted app-messaging transport rather than a parallel reactive-chat RPC subgroup, the app-facing canonical agent control plane and canonical agent memory write path remain unified on that runtime-owned agent projection without drifting back to direct Realm memory mutation or provider-native memory APIs, the SDK may expose typed request builders and projections for the agent canonical memory bank status and bind operations but never synthesizes canonical bank mode or status from embedding form state, runtime-private inspect state, or raw GetBank, the realm subpath no longer carries canonical agent-memory public helpers, the runtime-era app path consumes only runtime.agent, the app-facing route projection surface remains the host-typed logical exception of the route contract and is never a new daemon top-level RPC projection or a catalog, readiness, capability, or fallback policy authority, and Runtime Agent reads and events carry only the Runtime-admitted LocalAgentSourceContextStatus and AgentTurnContextSummary projection families with closed enums and bounded fields and without the private context manifest or a caller context-attachment parameter.
    condition: Whenever cognition, agent, or route projections enter the public SDK surface.
    failure: Reject authority-cut violations, synthesized bank status, and private context exposure.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r047
    kind: rule
    title: Retired interface names stay banned
    modality: must_not
    statement: The SDK public contract layer exposes the retired interface names listTokenProviderModels, checkTokenProviderHealth, or any TokenProvider-prefixed name.
    condition: Whenever public contract names are defined.
    failure: Reject retired interface names.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r048
    kind: rule
    title: Realm and scope keep stable export faces
    modality: must
    statement: The Realm SDK has the instantiated facade as its only entrypoint with no global configuration entry, and the scope SDK keeps the in-memory catalog with publish and revoke semantics as its minimal stable face.
    condition: Whenever Realm or scope export faces are defined.
    failure: Reject global configuration entries and scope face expansion.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r049
    kind: rule
    title: Realm public naming is normalized at codegen
    modality: must
    statement: Realm SDK public symbols including type names, service names, public method names, and property-enum keys use canonical naming and never expose legacy naming such as 2fa-styled names, Me2FaService, SocialV1DefaultVisibilityService, or SocialFourDimensionalAttributesService, protocol wire literals such as the 2fa API paths, the Auth2faVerifyDto schema key, and the needs_2fa enum value may be retained for server contract alignment, and naming normalization completes in the codegen layer without legacy-to-new alias bridging in the public facade.
    condition: Whenever Realm public symbols are generated or exposed.
    failure: Reject legacy public naming and facade-level alias bridging.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r050
    kind: rule
    title: App Realm access uses typed entrypoints only
    modality: must
    statement: Production code in apps accesses Realm only through codegen-generated realm services or explicitly registered typed adapter modules, never directly calling realm raw or unsafeRaw request, passing literal API paths or URLs, or fetching Realm REST directly, and exceptions converge to an explicit allowlist tracked by repository checks.
    condition: Whenever app production code accesses Realm.
    failure: Reject direct raw calls, literal paths, and direct REST access outside the allowlist.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r051
    kind: rule
    title: Raw escape hatches are explicit and unwrapped
    modality: must
    statement: The Realm SDK exposes no realm.raw compatibility alias and admits uncovered low-level scenarios only through explicit realm.unsafeRaw naming, the Runtime SDK exposes no runtime.raw compatibility alias and unifies low-level calls on runtime.call or explicit runtime.unsafeRaw, the public surface keeps no legacy alias as a smooth-migration layer and exposes unnormalized contracts only under unsafe naming, unsafeRaw is the explicit low-level escape hatch itself and is never wrapped by a public domain facade into a stable API, any Realm operation enters Realm OpenAPI codegen or a registered named typed adapter before entering the SDK public domain and is never exposed with unknown request or response shapes and literal API paths, and Realm provides no runtime grant bridge so the SDK never generates, wraps, or falls back to issueRuntimeRealmGrant while the Source Materialization packet remains a Runtime-internal authenticated first-party product operation outside the app-facing Realm facade that accepts no app grant, scope, or accessGrantId.
    condition: Whenever raw escape hatches or ungoverned Realm operations are exposed.
    failure: Reject compatibility aliases, wrapped escape hatches, and grant-bridge restoration.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r052
    kind: rule
    title: App-facing Realm DTOs are named and consumable
    modality: must
    statement: Realm DTOs directly consumed by first-party apps never degrade to anonymous inline objects, empty-record types, or unknown maps, key nested structures such as agent profile DNA, friend list responses, and world or worldview semantic blocks use named schemas, and the generated SDK declarations allow apps to read common nested fields directly without first casting returns to unknown records for manual cleanup.
    condition: Whenever app-facing Realm DTOs are generated.
    failure: Reject anonymous or unknown-map degradation of consumed DTOs.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r053
    kind: rule
    title: The method-groups table is scoped and checked
    modality: must
    statement: The runtime-method-groups table is the structured fact source for the vNext TypeScript app-facing Runtime facade projection only, it follows explicit maintenance in which it lists only the TypeScript app-facing projection set without mechanically equaling the full runtime kernel proto surface, every group declares its corresponding runtime service and method names resolve in the runtime RPC method registry, and the table is not a cross-language core method source, not an omission list for generated Runtime bindings, not protected Desktop admission authority, and not a release waiver for any generated core language, with generated bindings deriving core method truth from Runtime proto plus admitted generator and spec inputs and protected Desktop narrow clients deriving membership only from the Runtime first-party protected runtime profiles table and failing generation when the profile row, RPC kind, intent, owner postcondition, negative-test class, or gate reference is missing or contradictory.
    condition: Whenever the method-groups table is maintained or consumed.
    failure: Fail generation on missing or contradictory profile inputs and reject out-of-scope table authority.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r054
    kind: rule
    title: Unknown-map fields require explicit allowlisting
    modality: must
    statement: Realm codegen unknown-map index-signature fields are never accepted as default dynamic objects, every unknown-map field enters an explicit allowlist with a dynamic boundary classification, an unregistered unknown-map is a contract regression returned to backend OpenAPI naming or first allowlisted with rationale, and the allowlist serves only genuine dynamic envelope, metadata, patch or value, and manifest boundaries while high-frequency app-facing business structures never remain allowlisted long-term.
    condition: Whenever Realm codegen emits unknown-map fields.
    failure: Reject unregistered unknown-map fields as contract regressions.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r055
    kind: rule
    title: Stable AI surfaces never degrade to Struct
    modality: must
    statement: The runtime and ai subpaths, independent adapter packages, and first-party app consumption of the stable AI product surface never downgrade typed runtime protobuf output back to protobuf Struct, unknown records, or patch-up record parsing, stable sync output reads the ScenarioOutput oneof directly, stable async media and stt output reads the typed ScenarioOutput oneof in the scenario artifacts response, stable stream output reads the ScenarioStreamDelta oneof, stable text request configuration reads the typed reasoning field without smuggling reasoning switches through unknown records or metadata shadow fields, stable text stream consumption keeps reasoning and body as independent branches without silent flattening, app-facing runtime convenience, core AI, and adapters expose no product-semantic fallback switch such as fallback allow-or-deny, a stable helper missing typed output, artifact metadata, or mime and result fields errors directly without backfilling a default artifactId, application/octet-stream, audio/wav, or an empty-artifact success path, relay and desktop consumption never recovers semantics through result.object, Struct fields, artifact byte or mime conventions, or unknown records, and genuinely dynamic workflow and internal envelopes, plugin manifests, and transport or error raw payloads may keep dynamic boundaries only when explicitly layered apart from the stable AI product surface.
    condition: Whenever stable AI product surfaces are consumed or generated.
    failure: Fail closed on missing typed fields and reject Struct degradation and fallback switches.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r056
    kind: rule
    title: World Evolution facades are logical surfaces only
    modality: must
    statement: World Evolution Engine typed facade candidates are logical consumer surfaces rather than a new SDK package root or a new Runtime RPC method-group family, app-facing candidate facades land on existing SDK public composition surfaces limited to the observe, selector-read, and request families, shared types may re-export through existing SDK public surfaces when they remain projection-derived and consumer-seam-only, and a new world-evolution-engine stable subpath, recording logical facades in the method-groups table as daemon RPC parity, and treating host-injected facade shape as host concrete API authority are all inadmissible.
    condition: Whenever World Evolution Engine facades are placed.
    failure: Reject new subpaths, RPC-parity records, and host authority claims.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r057
    kind: rule
    title: Selector reads stay on the composition surface
    modality: must
    statement: World Evolution Engine selector-read stable methods stay on existing public composition surfaces, with app-facing selector-read methods on the SDK root composition surface and shared selector, result, rejection, and view type families on existing SDK public surfaces as projection-derived helper types, while a new SDK public subpath, publication through the runtime subpath or Runtime class as daemon convenience, method-groups entries recording selector reads as RPC parity, and any placement implying host concrete API ownership or transport-owned semantics are all forbidden.
    condition: Whenever selector-read methods are published.
    failure: Reject forbidden placements and parity claims.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r058
    kind: rule
    title: World features compose without re-owning homes
    modality: must
    statement: The old world subpath stays outside the vNext public subpath set, world-facing developer workflows are exposed through admitted Realm helpers, root composition, and the features/workflow subpath without a separate world package root, world feature helpers may compose Realm and Runtime-facing surfaces without re-owning their semantic homes, workflow helpers remain feature-level developer ergonomics rather than Runtime RPC parity or a renamed world-evolution-engine publication path, removed world subpath imports fail closed rather than forwarding, and a world feature helper is never treated as provider-native request authority, renderer-driver API publication, or the semantic owner of execution-evidence surfaces.
    condition: Whenever world domain features are placed or interpreted.
    failure: Fail closed on removed subpath imports and reject ownership reinterpretation.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r059
    kind: rule
    title: The DX layer owns ergonomics not truth
    modality: must
    statement: The SDK may own developer ergonomics including typed request builders and response decoders, structured-output parsers and schema validation helpers, stream assemblers preserving typed event branches, app-facing facade composition over admitted Runtime, Realm, and Cognition projection surfaces, protocol adapters such as Vercel AI SDK providers, test transports, and language bridges consuming admitted public surfaces, and developer test harnesses and mocks with explicit non-production status, and these helpers remain mechanically explainable as composition over admitted SDK public surfaces without becoming hidden owners of provider routing, model defaults, permission grants, app lifecycle, memory, session, event, audit, or durable domain truth.
    condition: Whenever developer-experience capabilities are added.
    failure: Reject helpers that become hidden owners of platform truth.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r060
    kind: rule
    title: Client orchestration stays non-canonical
    modality: must
    statement: Client-side orchestration helpers are exposed only with an explicit non-canonical authority posture, allowed orchestration covers ephemeral chat state assembly for the current consumer process, local tool-loop coordination for caller-supplied tools, retry, backoff, and stream aggregation within existing transport contracts, structured output retries or repair prompts whose returned value stays model output rather than committed platform truth, and test-only fake Runtime or Realm transports, and orchestration output is either ephemeral consumer state or an explicit request to an authoritative Runtime, Realm, or Cognition service, never presented as canonical session, memory, agent-event, audit, permission, provider, model, or app lifecycle truth.
    condition: Whenever client-side orchestration is exposed.
    failure: Reject canonical-truth presentation of orchestrated state.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r061
    kind: rule
    title: Helper output commits only through owners
    modality: must
    statement: When an SDK helper produces data a product wants to persist, publish, or use as platform authority, the helper hands the data to the owning service through an admitted typed operation, chat-derived memory goes through the admitted RuntimeAgentService or Cognition memory policy path rather than an SDK-local memory writer, app lifecycle state goes through Runtime app lifecycle projection rather than process reachability or file existence, Realm social or group transcript commits go through Realm-owned typed operations rather than Runtime candidate output or SDK stream text, provider and model selection comes from Runtime route or config projection or explicit caller input rather than an SDK-local routing table, and the SDK may validate, format, preview, or stage candidate data before commit but never silently commits, infers authority from helper success, or treats a successful local parse as an authoritative domain write.
    condition: Whenever helper-produced data approaches durable or authoritative use.
    failure: Reject silent commits and authority inference from helper success.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r062
    kind: rule
    title: Integration adapters translate without emulation
    modality: must
    statement: SDK integration adapters are admitted when they translate an external developer framework into Nimi public surfaces without importing private implementation or changing authority ownership, adapters for Vercel AI SDK, LangChain, Agno, Python, or other ecosystems use public SDK, Runtime, and Realm entrypoints only, surface capability gaps explicitly instead of emulating unsupported Runtime semantics as success, keep framework-owned ephemeral state separate from canonical truth, avoid provider and model hardcoding and provider-native secret custody, preserve typed finish, error, and usage semantics as far as the target framework allows, fail closed when a required semantic cannot be represented, and never become an alternate OpenAI-compatible Runtime endpoint, a shadow agent runtime, or a parallel app permission, memory, or session system.
    condition: Whenever an integration adapter is admitted or evolved.
    failure: Fail closed on unrepresentable semantics and reject emulated success and shadow systems.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r063
    kind: rule
    title: Core family facts are generated not copied
    modality: must
    statement: SDK family work targets the sdks tree with the required family roots generators, conformance, typescript, python, go, and rust, core SDK means Runtime and Realm public interface coverage together for a language so a Runtime-only package, Realm-only package, partial method package, or derivative adapter is not core-ready, the generators root owns generated core facts including Runtime method IDs, method allowlists, unary and stream codec maps, request and response contract maps, Realm operation maps, service registries, model maps and property enums, reason-code tables, and core export manifests, those facts are generated from admitted inputs such as Runtime proto, Realm OpenAPI, and spec tables and never hand-copied from archived old SDK source, the conformance root owns language-neutral core conformance fixtures and expected protocol traces with each language owning only its harness binding and reaching core-ready only when shared conformance passes for Runtime and Realm together, the archived old SDK tree is comparison evidence only with no forwarding packages, restored old subpaths, or compatibility claims through shims or fake success, and external framework adapters stay outside base core readiness unless explicitly admitted by adapter capability manifests while app clients, permission clients, AI config helpers, runtime route helpers, local environment helpers, and feature helpers remain TypeScript-only until the TypeScript implementation is stable.
