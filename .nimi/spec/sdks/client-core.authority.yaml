format: nimicoding.authority/v2
owner: team.sdks
scope: sdks.client-core
units:
  - id: definition.nimi.sdks.client-core.public-surface-plane
    kind: definition
    title: SDK public surface plane
    meaning: The SDK public surface plane provides standard typed access to the independent Realm and Runtime authorities with shared Character, LocalAgent, Conversation, Memory, Knowledge, error, and authorization concepts.
  - id: definition.nimi.sdks.client-core.runtime-client-plane
    kind: definition
    title: SDK Runtime client plane
    meaning: The SDK Runtime client plane projects Runtime-owned LocalAgent, immutable snapshot and lorebook readiness, bounded Cognition adapter and selection status, context capacity, summary availability, recall count, AI, Conversation, operational Memory and Knowledge, media, authorization, and failure semantics without becoming an execution owner, Cognition corpus reader, or second source of truth.
  - id: definition.nimi.sdks.client-core.transport-plane
    kind: definition
    title: SDK consumer access plane
    meaning: The SDK consumer access plane separates Desktop-hosted App Tools scaffolded Apps from direct SDK consumers by authentication, token custody, and protected-App admission while preserving shared owner-domain operation, result, and error semantics without creating a common permission plane.
  - id: definition.nimi.sdks.client-core.error-projection-plane
    kind: definition
    title: SDK error projection plane
    meaning: The SDK error projection plane preserves typed owner failures and explicit unavailable states across supported transports without converting missing authority, connectivity, readiness, or capability into success.
  - id: definition.nimi.sdks.client-core.boundary-plane
    kind: definition
    title: SDK boundary plane
    meaning: The SDK boundary plane owns SDK public composition and package boundaries, keeps developer ergonomics non-authoritative, and prevents SDK code from crossing Realm, Runtime, App, or host private boundaries.
  - id: definition.nimi.sdks.client-core.scope-plane
    kind: definition
    title: SDK language and testing plane
    meaning: TypeScript is the core SDK and reference implementation; Python, Rust, and Go are additional support, and SDK testing helpers remain deterministic consumers of public types rather than alternate transports or product authorities.
  - id: rule.nimi.sdks.client-core.r001
    kind: rule
    title: SDK subpath imports stay on public export faces
    modality: must
    statement: SDK packages complete cross-domain dependencies only through public export faces and never import Realm, Runtime, App, Kit, or host private implementation.
    condition: Whenever SDK code imports across a package or domain boundary.
    failure: Reject the private cross-domain import.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.boundary-plane
  - id: rule.nimi.sdks.client-core.r002
    kind: rule
    title: Realm and Runtime remain independent SDK authorities
    modality: must
    statement: SDK composition keeps Realm public data access and Runtime local execution access distinct and never treats either authority as an implementation detail of the other.
    condition: Whenever Realm and Runtime clients are composed.
    failure: Reject a merged authority or a private bypass between Realm and Runtime.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r003
    kind: rule
    title: Client composition is explicit
    modality: must
    statement: SDK clients use explicit consumer-owned composition and do not rely on a process-global singleton, global token, global endpoint, or hidden mutable default to select Realm, Runtime, App, AI, or LocalAgent behavior.
    condition: Whenever an SDK client is constructed or shared.
    failure: Reject hidden global composition or authority-bearing defaults.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.boundary-plane
  - id: rule.nimi.sdks.client-core.r004
    kind: rule
    title: Ergonomics helpers never own platform truth
    modality: must
    statement: SDK helpers may compose typed public calls, parse projections, assemble streams, and coordinate ephemeral caller behavior, but never own or infer Realm, Runtime, LocalAgent, Conversation, Memory, Knowledge, authorization, provider, route, or product lifecycle truth.
    condition: Whenever an SDK helper is added or consumed.
    failure: Reject a helper that creates a second product owner or hides owner failure.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.boundary-plane
  - id: rule.nimi.sdks.client-core.r005
    kind: rule
    title: Durable product truth returns to its owner
    modality: must
    statement: Any result that becomes durable, account-scoped, cross-App, permissioned, or execution-authoritative is committed through its owning Realm or Runtime operation rather than SDK-local persistence.
    condition: Whenever client-side orchestration produces a durable or authoritative result.
    failure: Reject SDK-local ownership of the result.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.boundary-plane
  - id: rule.nimi.sdks.client-core.r006
    kind: rule
    title: The SDK exposes both Realm and Runtime
    modality: must
    statement: The public SDK exposes typed Realm and Runtime capabilities, including shared Realtime lifecycle and failure control plus separate typed Realm Realtime, LocalAgent Conversation and Agent Realtime media, and provider-independent AI Realtime text and audio APIs, without requiring an App developer to learn private mediation, Neutral Runtime Realtime Core, host transport, Realm credential or socket, provider-native protocol, or Driver mechanics.
    condition: Whenever a public SDK consumer uses Realm or Runtime.
    failure: Reject private-boundary leakage or a product API that requires internal authority material.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r007
    kind: rule
    title: TypeScript is the core SDK
    modality: must
    statement: TypeScript is the core SDK, complete reference implementation, and current product-path priority.
    condition: Whenever SDK language investment or product-path support is prioritized.
    failure: Reject a plan that blocks the TypeScript product path on parity in another language.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.scope-plane
  - id: rule.nimi.sdks.client-core.r008
    kind: rule
    title: Additional languages preserve domain semantics
    modality: must
    statement: Python, Rust, and Go preserve the same Realm, Runtime, Character, LocalAgent, owner-authorization, and typed-error semantics but need not provide the complete TypeScript App, Kit, UI, or host surface in the current phase.
    condition: Whenever an additional language SDK is designed or evaluated.
    failure: Reject domain-semantic drift while allowing explicitly incomplete support.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.scope-plane
  - id: rule.nimi.sdks.client-core.r009
    kind: rule
    title: Scaffolded Local Apps use Runtime mediation
    modality: must
    statement: A Desktop-hosted App Tools scaffolded Local App uses the standard SDK while Runtime mediation derives the current account, App identity, authorization, and protected Realm access from the active host session.
    condition: Whenever a scaffolded Local App accesses Realm or Runtime.
    failure: Fail closed when the mediated session or owner authorization is unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r010
    kind: rule
    title: Scaffolded Local Apps receive no authority material
    modality: must_not
    statement: A scaffolded Local App receives, reads, stores, refreshes, or forwards a Realm JWT, Provider Credential, Runtime session proof, protected endpoint, caller-supplied account identity, or host security material.
    condition: Whenever the scaffolded SDK surface is constructed or used.
    failure: Reject the surface and keep all protected authority inside Runtime and the verified host.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r011
    kind: rule
    title: Direct SDK consumers own their Realm token custody
    modality: must
    statement: An App, script, or small program built directly with the SDK may use the public Realm client after standard Auth and is responsible for secure Realm token storage and refresh under Realm rules.
    condition: Whenever a consumer uses the SDK directly rather than through an App Tools scaffold.
    failure: Reject unauthenticated Realm access or hidden Runtime mediation presented as direct token custody.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r012
    kind: rule
    title: Direct token mode never enters a scaffolded Local App
    modality: must_not
    statement: A Desktop-hosted App Tools scaffolded Local App enables the direct SDK Realm token path or accepts App-supplied Realm tokens, refresh providers, subject providers, or equivalent credential hooks.
    condition: Whenever direct and scaffolded consumer paths are composed.
    failure: Reject the composition and retain Runtime-mediated access.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r013
    kind: rule
    title: Consumer custody is not a product profile choice
    modality: must_not
    statement: SDK or App Tools asks an App developer to choose a direct, mediated, local, or cloud product profile for ordinary capability use; the build context determines custody and transport while domain APIs remain consistent.
    condition: Whenever SDK onboarding or client configuration is presented.
    failure: Remove the product-profile choice and expose the standard SDK surface for that build context.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r014
    kind: rule
    title: LocalAgent access is session derived
    modality: must
    statement: A formal registered App uses the standard SDK to request the canonical agent.local reference listing and supplies only a returned session-scoped opaque agentHandle as the Agent selector with one of the eight canonical Conversation or six Agent Realtime operations; Runtime derives and revalidates the current account, App subject, active LocalAgent, canonical Conversation where applicable, agent.local coverage, exact AppOperationId, and generation, while the SDK projects one closed rich sanitized Conversation turn, text-delta, reasoning-status, action, tool, committed-message, image, artifact, recorded-transcription, final-sidecar, failure, event, and snapshot contract plus one separate transient input-pressure, speech, transcript, outputTrack, audio, health, and terminal contract. Native audio is accepted only on the Agent Realtime media family, and the SDK never accepts raw localAgentId, Agent-private context or tool result, response control, route or resource override, or exposes activity, emotion, Avatar rendering, ordinary Agent voice chunks, presentation internals, Memory, Knowledge, provider or model detail, authorization proof, credential material, generic Runtime, or generic artifact inventory on this path.
    condition: Whenever a formal registered App requests a LocalAgent Conversation or Agent Realtime operation.
    failure: Fail closed when the handle, exact operation, typed input, public variant, or any derived admission or owner input is missing, stale, unknown, caller-authored, cross-account, inactive-Agent, unsupported, or private.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.sdks.client-core.runtime-client-plane
  - id: rule.nimi.sdks.client-core.r016
    kind: rule
    title: Materialization consumes Realm-issued sources
    modality: must
    statement: SDK materialization accepts only a Realm-issued Character Source materialization intent and returns typed Runtime LocalAgent results; the required owning World is supplied only inside the Realm-issued Packet companion closure, and the SDK accepts no optional or independent World Source reference and exposes no private acquisition packet, proof, prompt, or context assembly.
    condition: Whenever an SDK consumer materializes a LocalAgent.
    failure: Reject source-free, caller-authored, Character-only, optional-independent-World, World-only, or private-packet materialization.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.runtime-client-plane
  - id: rule.nimi.sdks.client-core.r017
    kind: rule
    title: Runtime remains LocalAgent execution owner
    modality: must
    statement: SDK transports user intent and projects admitted bounded Runtime results but does not partition source, generate lorebooks or summaries, query or persist Cognition corpus or storage identity, execute LocalAgent turns or private recall, assemble authoritative prompts or context, choose provider routes, persist Conversation, operational Memory or Knowledge truth, or synthesize LocalAgent state, emotion, activity, voice, readiness, or success.
    condition: Whenever an SDK consumer submits or receives a LocalAgent operation.
    failure: Reject SDK-owned execution or synthesized owner truth.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.runtime-client-plane
  - id: rule.nimi.sdks.client-core.r018
    kind: rule
    title: Ordinary App AI loops remain App owned
    modality: must
    statement: An ordinary App AI loop does not become Runtime LocalAgent Conversation merely because it uses an LLM, streams tokens, keeps App history, or calls tools; Runtime ownership applies only when the product explicitly invokes Runtime-owned LocalAgent execution or another admitted Runtime domain.
    condition: Whenever an App chat or AI helper is classified.
    failure: Reject accidental Runtime ownership or a hidden SDK execution owner.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.boundary-plane
  - id: rule.nimi.sdks.client-core.r019
    kind: rule
    title: Protected Local App transport is host injected
    modality: must
    statement: The protected transport for a scaffolded Local App is injected by the verified host, opaque to App and renderer code, and exposes only typed admitted business operations and explicit session posture.
    condition: Whenever a scaffolded Local App SDK client is created.
    failure: Fail closed when the verified carrier is unavailable and reject App-constructed protected transport.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r020
    kind: rule
    title: SDK configuration cannot grant authority
    modality: must_not
    statement: An endpoint, App id, manifest, mode name, environment variable, bearer metadata, generated descriptor, or helper selection establishes protected origin, account identity, App authorization, LocalAgent access, or permission.
    condition: Whenever SDK configuration is interpreted.
    failure: Ignore it as authority input and require the owning Runtime or Realm decision.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r021
    kind: rule
    title: Owner failures remain typed
    modality: must
    statement: SDK preserves owner-specific unavailable, unauthenticated, permission, validation, readiness, connectivity, rate-limit, cancellation, and terminal failure states without merging them into a generic success or local fallback.
    condition: Whenever an SDK operation or stream ends.
    failure: Return the typed failure and preserve owner attribution.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.error-projection-plane
  - id: rule.nimi.sdks.client-core.r022
    kind: rule
    title: Missing capability never becomes pseudo-success
    modality: must_not
    statement: SDK uses fixtures, mocks, cached state, empty projections, silent skips, or synthetic terminal events as successful product behavior when an owner capability, authorization, transport, or result is absent.
    condition: Whenever a product capability is unavailable or unverified.
    failure: Return an explicit typed unavailable or failure result.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.error-projection-plane
  - id: rule.nimi.sdks.client-core.r023
    kind: rule
    title: Deferred capabilities remain absent
    modality: must
    statement: General Workflow, MCP, and World Evolution remain deferred and non-blocking, and the SDK publishes no current namespace, client, feature catalog, or readiness dependency that implies those capabilities are part of the current Runtime core.
    condition: Whenever SDK capabilities or readiness are declared.
    failure: Keep the capability unavailable until a separate product authority admits it.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r024
    kind: rule
    title: Avatar remains a separate projection consumer
    modality: must_not
    statement: SDK exposes a third-party Avatar driver, embedded renderer, raw motion API, or App-owned Avatar execution path; Apps interact with Runtime LocalAgent capabilities and Avatar independently consumes Runtime projection.
    condition: Whenever Avatar-related SDK surface is proposed or consumed.
    failure: Reject direct Avatar control and preserve the independent projection boundary.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.runtime-client-plane
  - id: rule.nimi.sdks.client-core.r025
    kind: rule
    title: Kit stays above the SDK
    modality: must
    statement: Kit may compose demand-driven higher-level integrations over SDK public surfaces but cannot become a second SDK, mandatory App framework, transport authority, authorization owner, or prebuilt public capability catalog.
    condition: Whenever SDK and Kit responsibilities are divided.
    failure: Keep public domain access in SDK and admit Kit composition only for a concrete consumer journey.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.boundary-plane
  - id: rule.nimi.sdks.client-core.r026
    kind: rule
    title: Simulator testing is non-authoritative
    modality: must
    statement: A deterministic SDK testing helper may support Simulator and consumer tests using public SDK types, but it creates no network or protected carrier, Realm or Runtime side effect, account, permission, credential, LocalAgent, or alternate product contract.
    condition: Whenever an SDK testing helper or Simulator adapter is used.
    failure: Reject production selection, authority creation, or product-readiness claims.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.scope-plane
  - id: rule.nimi.sdks.client-core.r027
    kind: rule
    title: LocalAgent selection is explicit and non-global
    modality: must
    statement: Each LocalAgent-scoped SDK operation identifies its target explicitly, while any current, pinned, or recent LocalAgent UI state remains consumer-local and never becomes a platform default or SDK-owned identity.
    condition: Whenever LocalAgent selection is modeled.
    failure: Reject an implicit global LocalAgent or SDK-owned selection truth.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.runtime-client-plane
  - id: rule.nimi.sdks.client-core.r028
    kind: rule
    title: Session recovery cannot restore stale authority
    modality: must
    statement: After process exit, account switch, Runtime restart, authorization revoke, or protected carrier loss, SDK discards stale session state and requires the verified host and Runtime to establish a fresh session and owner decisions before later operations.
    condition: Whenever a local SDK session reconnects or recovers.
    failure: Reject copied credentials, replayed session material, or automatic restoration of prior authority.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
  - id: rule.nimi.sdks.client-core.r029
    kind: rule
    title: Direct and scaffolded consumers share domain semantics
    modality: must
    statement: Direct SDK consumers and scaffolded Local Apps use consistent Realm, Runtime, Character, LocalAgent, Conversation, Memory, Knowledge, operation, result, and typed-error semantics even though authentication, token custody, and protected-App admission differ.
    condition: Whenever the two consumer contexts expose the same product domain.
    failure: Reject a second ontology or behavior profile created only by transport choice.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r030
    kind: rule
    title: Formal Apps share one canonical typed Realtime SDK
    modality: must
    statement: Desktop, Zhiyu, Avatar when it consumes the corresponding projection, and every other formal registered App use the same owner-specific typed Realtime SDK vocabulary and operation semantics; manifest declaration, exact AppOperation and AppAccess admission, OS device permission, and capture, playback, rendering, or Host role may change availability or local responsibility but never create a privileged first-party profile, hidden event union, committed-only degraded duplicate, App-specific protocol, duplicate reducer, generic kind or unknown payload envelope, or direct owner transport.
    condition: Whenever a formal App consumes Realm, LocalAgent, or AI Realtime behavior.
    failure: Reject the privileged, degraded, untyped, duplicated, or direct-transport surface and require the canonical typed owner API.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r031
    kind: rule
    title: Context status remains independently typed and bounded
    modality: must
    statement: An independently admitted SDK context-status surface preserves Runtime immutable snapshot and lorebook readiness, Cognition ready, unconfigured, building, unavailable, failure, or no_hits adapter outcome, Runtime no_result selection outcome, summary status, recall count, current and required capacity, lane budgets, omissions, safe counts, and correlation facts as typed fields without parsing owner error text or creating a distinct Conversation or Agent Realtime protocol.
    condition: Whenever an SDK consumer with the exact context-status admission receives LocalAgent source or turn-context status.
    failure: Reject unknown, contradictory, missing-required, or reconstructable status as typed unavailable and preserve the Runtime owner failure.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.error-projection-plane
      - type: applies_to
        target: definition.nimi.sdks.client-core.runtime-client-plane
  - id: rule.nimi.sdks.client-core.r032
    kind: rule
    title: Apps without context-status admission receive no private source surface
    modality: must_not
    statement: A formal App SDK surface without the exact independent context-status admission exposes raw source, lorebook, Cognition status, corpus, unit, opaque storage identity, context diagnostics, private recall, source repair, source adoption, or a public Cognition deletion operation merely because another admitted consumer can read bounded Runtime status; status admission never creates a privileged, degraded, or duplicate Conversation or Agent Realtime protocol.
    condition: Whenever LocalAgent source or context contracts are mapped to a formal App without the exact context-status admission.
    failure: Keep the consumer on its exact admitted canonical agentHandle, Conversation and Agent Realtime APIs, and terminal reason or message without exposing a private source surface.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.runtime-client-plane
      - type: applies_to
        target: definition.nimi.sdks.client-core.transport-plane
