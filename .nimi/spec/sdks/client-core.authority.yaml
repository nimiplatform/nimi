    modality: must
    statement: The only app-facing source-materialization facade is materializeRealmSource taking a sourceRef and requestId and invoking only the Runtime MaterializeRealmSource operation, sourceRef is the closed CharacterSourceRefV3 union of worldCharacter and personaCharacter, the response contains only an opaque localAgentRef, bounded LocalAgentSourceContextStatus, idempotentReplay, and a typed failure reason, the facade accepts no Realm base URL, bearer, grant, challenge, audience, packet, proof, segment, component, chunk, semantic payload, prompt or context, or caller-selected LocalAgent identity because acquisition and the private transaction remain Runtime-owned, SDK consumers provide an explicit agent id for every localAgent-scoped runtime call with construction-time current-localAgent helpers non-canonical, conversationAnchorId is the only admitted cross-surface continuity scope with no synthesized app-local session ids or cross-anchor reuse of same-localAgent traffic, auth credentials, subject context, localAgent identity, and conversation anchor identity remain separate never-inferred inputs, reconnect and session recovery stay consumer-owned with recovery reads exposed but no silent reconnect, reopen, or downgrade to fixture or mock data, protected agent turn paths request the admitted runtime scopes and fail closed on rejection, the consume projection stays downstream of active runtime authority without importing runtime-private implementation or app-local avatar and Desktop surfaces, source readiness consumers accept only the closed read-only LocalAgentSourceContextStatus with ready state and typed reason, source kind, ref, schema, and hash, snapshot schema, hash, and captured-at, world and materialization-context hashes, and coverage section states and counts, turn context consumers accept only the closed read-only AgentTurnContextSummary with ready state and typed reason, manifest and compiler versions, manifest, content, and prompt hashes, safe refs and hashes, ordered lane ids, status, and counts, budget, use, and truncation summary, transcript, memory, media, and tool counts, and route and catalog digest, unknown schema, enum, state, lane, or reason fails closed without backfilling, reinterpreting, or persisting an offline-success context projection, the SDK rejects raw source, world, core, or closure records, prompt, lane, or transcript text, private memory, packet, proof, or chunks, provider payloads, credentials, tool arguments and results, and free-form maps on these public families, and the SDK may correlate and render the summaries without assembling, overriding, or attaching LocalAgent source or context to an agent turn.
    condition: Whenever local consumer materialization or context projections are consumed.
    failure: Fail closed on unknown values and reject authority inputs, raw records, and context attachment.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.runtime-client-plane
  - id: rule.nimi.sdks.client-core.r091
    kind: rule
    title: Timeline metadata is a thin typed projection
    modality: must
    statement: The SDK exposes PresentationTimeline metadata only as a downstream projection of runtime-owned timeline-bearing agent events, preserves runtime-owned agent id, conversation anchor id, turn id, stream id, timebase, offset, duration, deadline, and interrupt semantics without collapsing them into app-local session or renderer state, fails closed on malformed timing metadata, unknown timeline channel names, invalid negative offsets, or non-monotonic voice and lipsync frame sequences once the concrete runtime schema is admitted, never publishes this branch as a general event broker with wildcard subscription or cancellable before-events, never synthesizes voice timing, lipsync frames, or mouth-open values because those remain runtime, provider, and avatar downstream data with explicit ownership, and may provide ergonomic typed accessors that remain thin projections over runtime event payloads, with retired Event API and PresentationTimeline designs staying evidence only.
    condition: Whenever timeline metadata is projected.
    failure: Fail closed on malformed metadata and reject synthesis and broker publication.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.runtime-client-plane
  - id: rule.nimi.sdks.client-core.r092
    kind: rule
    title: Local account consumption is owner-allocated
    modality: must
    statement: The SDK owns typed Runtime APIs and trusted carriers only, it may validate and transport opaque owner-issued projections, bindings, and failures but never owns or infers account, token, unary, realtime, or media truth, SDK configuration, generated descriptors, helpers, caches, and app-mode discriminators cannot grant privilege, mint credentials, select a canonical Realm endpoint, or replace Runtime refresh and data-plane decisions, the verified Desktop account-UX facade remains the only local account-control consumer with bundled first-party surfaces keeping their admitted projection and third-party apps using one LOCAL_APP facade over the final host-injected protected carrier without caller or session bootstrap fields, local-first-party-app and local-app are the only local app modes and a mode name, app id, manifest, registry row, project path, or loopback connectivity does not authorize, the local-app facade exposes session status, public permission posture and request by product permission id, app-private JSON storage, and only the agents.interact owner-selected open-conversation, send-turn, subscribe-turn, and conversation-snapshot RuntimeAgent operations, while no Artifact, voice, Agent inventory, selector construction, principal substitution, direct Avatar control, embedded rendering, login, logout, switch, account control, presence mutation, scoped or workspace binding control, or generic Realm, Runtime, or RuntimeAgent API appears, session-bound zero-permission, process-replaced, account-changed, Runtime-restarted, and unavailable are distinct session projections with permission posture a separate owner projection never inferred or cached from session state or prior success, shipped Zhiyu and Avatar stay bundled first-party while an isolated Zhiyu integration build is local-app without inherited bundled identity or bindings, the Desktop account-UX facade exposes only methods listed in the protected transport matrix and only when the injected native carrier proves the desktop account host role the SDK never derives, removed public token, refresh, credential-grant, and exact-operation local-app grant wire identities remain reserved with apps only reading and requesting admitted product permission ids and never approving, revoking, or mutating owner decisions, no local mode accepts or exposes access tokens, refresh tokens, authorization-header or subject providers, session stores, JWT hooks, Realm bases, principal, record, grant, or session identifiers, or equivalent credential surfaces, Runtime-mediated operation tables remain exact allowlists with no fallback to direct Realm, MeService, HTTP proxy, direct daemon, SDK-owned refresh, generated descriptor, or a broader Runtime client, missing carrier, required account state, record, session, admitted permission decision or selector, or operation-owner state fails closed with typed unavailable or permission results and never anonymous, fixture, or mock success, Web and cloud adapter and external-principal modes may keep app-provided token and subject inputs only when explicitly fenced on the public surface and unreachable from local first-party consumption, and only the Desktop account-UX facade exposes the presence verification request as a typed thin projection on the verified Desktop carrier with the SDK never implementing the second factor, accepting passwords or secrets, converting login or token state into verified presence, or calling Realm server APIs as the acceptance path, Runtime alone orchestrating any Realm-backed fresh reauthentication fallback, consumers receiving only the Runtime response state, method, and expiry, and non-verified, unavailable, cancelled, or expired responses remaining fail-closed.
    condition: Whenever local account or local-app consumption is exposed.
    failure: Fail closed with typed results and reject privilege grants, credential surfaces, and fallback paths.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.runtime-client-plane
  - id: rule.nimi.sdks.client-core.r093
    kind: rule
    title: Login adapters are Desktop-owned projections
    modality: must
    statement: Local account login, logout, and switch UX is owned solely by Desktop account UX calling Runtime BeginLogin, CompleteLogin, Logout, and SwitchAccount with the desktop shell caller mode, the SDK plays only typed projection in the Desktop-owned composition while third-party local apps, binding-only Avatar, and ordinary first-party app facades never expose these account-control helpers, the facade is constructible only from the injected verified native carrier and the Runtime-derived desktop account host role with no caller enum or bearer construction and none of its request, response, or session material entering renderer IPC, the SDK exposes typed beginLogin, completeLogin, logout, and switchAccount wrappers only on the Desktop account-UX facade forwarding to Runtime without SDK-side token exchange or JWT decoding, removed public refresh stays outside the app-facing facade with refresh completed by the Runtime private helper, the SDK exposes no direct Realm login path in local first-party mode because login goes only through the Runtime Nimi Auth Browser callback proof, the SDK projects the Runtime UX instruction envelope without the PKCE verifier verbatim to kit and Desktop, treats the CompleteLogin proof envelope as opaque bytes without inspecting, parsing, or rewriting token fields, and projects login failure reason codes per the account service authority without merging, rewriting, or anonymous fallback.
    condition: Whenever login adapter surfaces are exposed or consumed.
    failure: Reject non-Desktop exposure, SDK token handling, and reason-code rewriting.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.runtime-client-plane
  - id: rule.nimi.sdks.client-core.r094
    kind: rule
    title: Artifact bytes retrieval is typed and fail-closed
    modality: must
    statement: The SDK exposes a generic artifact bytes retrieval surface orthogonal to the typed media projection system so first-party apps retrieve runtime-emitted audio artifact bytes by audio artifact id for local decode and lipsync consumption with lipsync metadata artifact identity never mixed with playable audio artifact identity, the Runtime class exposes the readonly artifacts module with readBytes taking artifactId and optional expectedMimePrefix and returning bytes, mimeType, sizeBytes, and mimeInferred, the low-level client exposes readArtifactBytes bound to the RuntimeArtifactService.ReadArtifactBytes proto method id, that wire binding is typed projection and not public transport admission so ordinary generated clients, the artifacts module, app session metadata, and direct local gRPC return SDK_RUNTIME_METHOD_UNAVAILABLE without sending a request until the admitted protected local-app carrier, admitted product permission, owner selector and policy, and artifact audience all hold, with the artifacts open permission unadmitted third-party local apps receive typed unavailable, the artifacts module exposes the runtime-owned generated voice cleanup binding cleanupGeneratedVoiceArtifacts bound to RuntimeArtifactService.CleanupGeneratedVoiceArtifacts with no app or Avatar layer file deletion logic, the artifacts namespace is never exposed as a singleton const and only through the Runtime class instantiation path, a mime type not starting with the expected prefix case-insensitively throws ARTIFACT_MIME_MISMATCH without exposing bytes, the surface enforces deny fallback policy with no caller modification, ARTIFACT_INVALID_INPUT, ARTIFACT_NOT_FOUND, ARTIFACT_TOO_LARGE, ARTIFACT_FORBIDDEN, and ARTIFACT_MIME_MISMATCH are stable reason codes passed through fail-closed without empty bytes, default mime, or faked success, voice playback and chunk audio artifacts use the audio prefix and non-audio mime fails closed without handing lipsync metadata or synthetic placeholders to the audio decoder, the client never fills a default mime because missing mime is runtime-marked as inferred, the surface does not replace the job-typed scenario artifacts projection or the voice asset library read because the three use cases coexist orthogonally, expectedMimePrefix accepts only legal RFC-6838 top-level types and music is not a legal top-level type so it is never advertised, readBytes failures never return empty bytes, default mime, or faked success paths, no fallback or retry-on-decode-failure knob is exposed for readBytes, and the mime prefix check is case-insensitive and never exact-match.
    condition: Whenever artifact bytes retrieval is exposed or consumed.
    failure: Fail closed on mime mismatch and unadmitted access and reject fallback knobs and faked success.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.runtime-client-plane
  - id: rule.nimi.sdks.client-core.r095
    kind: rule
    title: Transfer state projects from the state field
    modality: must
    statement: Runtime LocalService owns local transfer lifecycle state and SDK local-runtime transfer parsers are typed projections over that state only, state is the canonical lifecycle field for transfer progress events and session summaries, done and success are terminal flags derived from the runtime-owned state and the SDK never reverse-infers completed, failed, or cancelled from those booleans when state is absent or invalid, the SDK fails closed on missing or unknown transfer state, when runtime provides done or success the SDK verifies consistency with state and projects mismatches as failures rather than progress or completion, and Desktop, Tester, Kit, and other apps may render SDK transfer projections without maintaining a second transfer lifecycle state machine.
    condition: Whenever local transfer state is parsed or projected.
    failure: Fail closed on missing state and reject boolean inference and second state machines.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.runtime-client-plane
  - id: rule.nimi.sdks.client-core.r096
    kind: rule
    title: Memory observatory helpers are read-only
    modality: must
    statement: Memory Observatory helpers are typed read-only projections over admitted RuntimeAgentService memory read envelopes composing the existing canonical memory export helper over GetAgentState and QueryAgentMemory without owning memory truth, memory lifecycle truth, or app-local memory identity, they project canonical agent memory as the canonical-agent-memory authority class preserving runtime-owned agent id, memory id, bank key, canonical class, memory kind, summary, provenance, timestamps, replication outcome, policy reason, and recall score, they expose product-readable state such as ready or empty, record counts, bank counts, lineage, and semantic confidence only when directly available from the admitted export envelope, they represent lifecycle fields absent from the envelope including review state, redaction state, and forget or retire intent as explicit not-projected states, they never infer review, redaction, forget intent, consent or grant state, provider or model facts, or app-local memory identity from metadata, summaries, timestamps, confidence, UI state, or cache, and they never call memory write or mutation paths, the runtime.memory namespace as a canonical agent memory shortcut, provider APIs, app-level REST, Desktop implementation modules, or Runtime private packages.
    condition: Whenever memory observatory helpers are exposed or consumed.
    failure: Reject inferred lifecycle state and any write or shortcut path.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.runtime-client-plane
  - id: rule.nimi.sdks.client-core.r097
    kind: rule
    title: Review status projection stays read-only
    modality: must
    statement: The SDK may expose a typed read-only projection over the agent canonical memory review status read for canonical agent-facing memory banks preserving runtime-owned bank identity, readiness, executor availability, last review follow-up id, checkpoint basis, completion time, next eligibility time, and recoverable review-run id as read projection values, it never infers review readiness, redaction, forget, retire, or per-record lifecycle state from memory records, metadata, summaries, confidence, timestamps, UI state, app cache, or provider and model outputs, it never exposes review execution, redaction, forget, or retire mutation through this projection helper, and when runtime does not project review status SDK and app consumers keep lifecycle fields explicit as unavailable or not-projected without backfilling product copy with synthetic lifecycle values.
    condition: Whenever review status projections are exposed or consumed.
    failure: Reject inferred lifecycle state, mutation exposure, and synthetic backfill.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.runtime-client-plane
  - id: rule.nimi.sdks.client-core.r098
    kind: rule
    title: App-facing surfaces expose no fallback knobs
    modality: must_not
    statement: App-facing SDK surfaces expose fallback knobs for route or provider rescue, because internal runtime fallback may exist only as an observable low-level strategy and must not weaken typed public contracts.
    condition: Always.
    failure: Reject any app-facing fallback knob for route or provider rescue.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.public-surface-plane
  - id: rule.nimi.sdks.client-core.r099
    kind: rule
    title: Retry never rescues contract failures
    modality: must_not
    statement: Retry or auth refresh rescues decode, content-type, schema, or contract failures, because retry and auth refresh are transport and auth mechanisms only.
    condition: Always.
    failure: Reject retry or refresh applied to decode, content-type, schema, or contract failures.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.client-core.error-projection-plane
