format: nimicoding.authority/v2
owner: team.sdks
scope: sdks.feature-clients
units:
  - id: definition.nimi.sdks.feature-clients.ai-adapter-plane
    kind: definition
    title: SDK AI adapter plane
    meaning: The SDK AI adapter plane owns typed CapabilityContract request and Job projection for independent framework adapters and core AI helpers; adapters consume the canonical AIConfig owner and Runtime-persisted exact Job inputs without becoming a CapabilityImplementationDriver, selecting routes or Loadouts, changing selection, owning provider catalogs, reconstructing ResolvedAssembly, or replicating Runtime validation.
  - id: definition.nimi.sdks.feature-clients.ai-config-plane
    kind: definition
    title: SDK AI config plane
    meaning: The SDK AI configuration plane owns one host-neutral typed manager contract for canonical App or account-scoped shared LocalAgent AIConfig get, owner-scoped compare-and-swap overwrite, clear-by-omission, lightweight selected-resource effective projection, and bounded Local Loadout or Cloud Connector and target options; config read, effective projection, candidate options, and mutation are independent failure domains, and the mutation response alone acknowledges commit with the canonical record and revision. The plane also owns portable AIProfile import and validation, non-committing Apply Profile prefill without resource binding, the separate Machine Loadout store resource actions, and immutable Job projections, while owning no per-Agent or App-local shadow configuration, credential, endpoint, resource content, readiness lifecycle, route resolver, fallback, or implementation binding truth.
  - id: definition.nimi.sdks.feature-clients.app-client-plane
    kind: definition
    title: SDK app client plane
    meaning: The SDK app client plane is the sole supported typed consumer surface over a Desktop-verified exact Host connection and fresh Runtime protected App session; it projects access availability, purpose-specific typed methods governed internally by the Runtime-owned Effective App Access Snapshot and central App Operation Contract, bounded App-private storage and App AIConfig operations, the minimal current-user display projection, exact owner-domain results, and typed failures without exposing the snapshot or contract as App data and without owning admission, declaration mapping, account truth, credentials, Host lifecycle, or marketplace truth.
  - id: definition.nimi.sdks.feature-clients.permission-plane
    kind: definition
    lifecycle: removed
    title: SDK permission plane
    reason: Removed because third-party App access derives from declaration and Runtime admission with no public permission catalog, status, request, subscription, grant, revoke, or permission-settings product surface.
  - id: definition.nimi.sdks.feature-clients.proposal-plane
    kind: definition
    title: SDK proposal plane
    meaning: The SDK proposal plane owns the typed consumer surface for Platform conversation-originated proposal intake, covering the sole access path, the logical operation set, record shape and closed enum preservation, fail-closed behavior when Platform operations are missing, retired alias and non-execution guards, source conversation boundaries, and app consumer projection boundaries.
  - id: definition.nimi.sdks.feature-clients.connector-auth-plane
    kind: definition
    title: SDK connector auth acquisition plane
    meaning: The SDK connector auth acquisition plane owns the host typed facade boundary for third-party managed OAuth acquisition and user-explicit bounded connector diagnostics, while Runtime retains sealed credential custody and current-account Connector ownership validation; acquisition or diagnostics never chooses a route, target, provider, model, capability, or ordinary App authorization and never establishes readiness or an execution prerequisite.
  - id: definition.nimi.sdks.feature-clients.local-environment-plane
    kind: definition
    title: SDK local environment plane
    meaning: The SDK local environment plane owns typed downstream installation, ModelAsset integrity, dependency-job, and Runtime-private ExecutionHost diagnostic projections, preserves concrete identities and structured failures, and never projects environment readiness, selected-source authority, route selection, machine selection, binding, or capability admission truth.
  - id: definition.nimi.sdks.feature-clients.route-plane
    kind: definition
    lifecycle: removed
    title: Retired SDK route plane
    reason: Removed because list, resolve, health, warm-candidate, inventory ranking, and route-description APIs formed a second router and public readiness path.
  - id: definition.nimi.sdks.feature-clients.capability-composition-plane
    kind: definition
    title: SDK capability composition plane
    meaning: The SDK capability composition plane projects the route and safe exact resource reference committed by a canonical AIConfig owner and Runtime's atomic Job-submission composition into either a complete persisted Local ResolvedAssembly or exact Cloud effective inputs, together with typed derived admission and immutable Job inputs, without exposing credentials or endpoints, accepting Job-time resource overrides, rereading current owner state, searching, ranking, probing, warming, choosing, or falling back.
    relations:
      - type: supersedes
        target: definition.nimi.sdks.feature-clients.route-plane
  - id: definition.nimi.sdks.feature-clients.delegation-plane
    kind: definition
    title: SDK delegated capability boundary
    meaning: The SDK may expose bounded typed projection for a separately admitted Runtime delegated capability without owning provider, session, approval, credential, firewall, execution, or audit truth; MCP and A2A clients are not current SDK capabilities and registry or type presence never claims availability.
  - id: definition.nimi.sdks.feature-clients.avatar-projection-plane
    kind: definition
    title: SDK Avatar projection plane
    meaning: The SDK Avatar projection plane provides only typed first-party Nimi Home and Avatar integration for Runtime-owned LocalAgent presentation state and Avatar-owned rendering diagnostics, with no Third-party App driver, embedded renderer, raw motion, raw expression, or LocalAgent truth surface.
  - id: definition.nimi.sdks.feature-clients.package-plane
    kind: definition
    title: SDK package plane
    meaning: The SDK package plane owns the smallest TypeScript public source and adapter boundaries required by current admitted Realm, Runtime, Character, LocalAgent, Conversation, Memory, Knowledge, AI, error, and authorization journeys.
  - id: rule.nimi.sdks.feature-clients.r001
    kind: rule
    title: Adapters never own routing decisions
    modality: must
    statement: AI adapters bind to an explicit NimiClient and canonical App AIConfig owner, or to the shared LocalAgent AIConfig through the protected Runtime surface; the AIConfig owner alone commits Local or Cloud route intent, Select Loadout alone sets or explicitly clears the machine relation, and Runtime alone atomically persists complete Job effective inputs including Local ResolvedAssembly before publication. Adapters and callers never default, select, search, rank, probe, reconstruct from current owner state, or fall back among routes, ModelAssets, Loadouts, implementations, providers, grants, or selections and never replicate Runtime request validation.
    condition: Whenever an AI adapter is constructed or routes a request.
    failure: Fail closed on missing committed owner intent and reject independent routing tables, target selection, fallback, and replicated upstream validation.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-adapter-plane
  - id: rule.nimi.sdks.feature-clients.r002
    kind: rule
    title: Job and stream projections keep upstream semantics
    modality: must
    statement: ScenarioJob-related adapter methods keep submit, query, cancel, and subscribe semantics consistent with the Runtime job surface, and streaming done and finish reasons are projected completely to the caller without silently swallowing business terminal states.
    condition: Whenever adapter job methods or stream terminals are projected.
    failure: Reject inconsistent job semantics and silently dropped terminal states.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-adapter-plane
  - id: rule.nimi.sdks.feature-clients.r003
    kind: rule
    title: Catalog and error projection follow their fact sources
    modality: must
    statement: CapabilityImplementation identity, CapabilityImplementationDriver identity, Cloud provider-model target schemas, and standardized-feature support take their canonical Runtime projections as fact sources, and adapter error projection reuses the SDK error projection authority without inferring support from provider or model names or privately extending conflicting semantics.
    condition: Whenever adapters align provider capabilities or project errors.
    failure: Reject private catalogs and conflicting error semantics.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-adapter-plane
  - id: rule.nimi.sdks.feature-clients.r004
    kind: rule
    title: World generate projects as a runtime async capability
    modality: must
    statement: When the runtime admits world generation, adapters project it only as a runtime-owned async capability family, never downgrade it to an image or video alias, never introduce an app-side provider upload, poll, or fetch protocol, and leave provider-specific request shaping, connector secret ownership, and job lifecycle with the runtime authority surfaces.
    condition: Whenever world generation is projected by an adapter.
    failure: Reject alias downgrades and app-side provider protocols.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-adapter-plane
  - id: rule.nimi.sdks.feature-clients.r005
    kind: rule
    title: External framework adapters are protocol adapters only
    modality: must
    statement: Independent adapter packages may host adapters for external AI framework provider contracts including the Vercel AI SDK, the base SDK never restores the ai-provider subpath, such adapters only map framework calls such as text generation, streaming, structured output, and caller-owned tool-loop coordination onto admitted Nimi Runtime and SDK surfaces while preserving the SDK surface and boundary authorities, they never introduce an independent provider or model routing table, keep connector secrets or provider credentials outside Runtime custody, emulate unsupported tool-calling, JSON mode, cache, reasoning, usage, or stream semantics as successful parity, expose a stable OpenAI-compatible Runtime endpoint, or persist framework session, memory, or event state as Nimi canonical truth, capability gaps stay typed and visible to the caller, and framework-specific ergonomics are allowed only while Runtime, Realm, and Cognition authority remains the sole source for durable product state and enforcement.
    condition: Whenever an external framework adapter is admitted or evolved.
    failure: Reject emulated parity, secret custody escapes, and canonical-truth persistence.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-adapter-plane
  - id: rule.nimi.sdks.feature-clients.r006
    kind: rule
    title: Capability manifests answer library usability
    modality: must
    statement: Adapter capability manifests describe target-library capabilities usable through a Nimi adapter, the support field answers whether a caller using the target library can exercise the named library capability through the adapter with the closed values supported, partial, unsupported, and not-applicable, ownership and execution placement are recorded separately in the mode field, a framework-owned capability such as a caller-side tool execute callback or multi-step orchestration is never marked unsupported solely because Nimi Runtime does not own that orchestration, Runtime-owned or adapter-owned gaps remain explicit instead of hiding behind a broader target-library capability claim, and provider-defined tools, provider-executed tool calls and results, provider approval rounds, sources, and raw stream chunks are evaluated as target-library interfaces that may be marked supported when the adapter faithfully maps them to admitted Nimi SDK and Runtime contracts while individual Runtime provider routes still fail closed when they cannot preserve provider-specific semantics.
    condition: Whenever an adapter capability manifest is authored or evaluated.
    failure: Reject ownership-based unsupported markings and hidden gaps.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-adapter-plane
  - id: rule.nimi.sdks.feature-clients.r007
    kind: rule
    title: Durable framework state is classified or declared
    modality: must
    statement: Framework-held state is classified by lifetime, whether it survives beyond the current process or app session, and reconstructibility, whether it can be fully rebuilt from Nimi canonical truth plus caller-supplied input, in-process reconstructible state is orchestration ephemera the framework may hold freely without a manifest claim, state that survives across process or app-session boundaries or cannot be rebuilt from Nimi truth is durable framework state that is either promoted to the owning Runtime, Realm, or Cognition service through an admitted typed operation or declared in the adapter capability manifest as partial with an explicit framework-owned non-canonical gap note, undeclared durable framework state is a contract violation and never a default, adapters never read or write durable framework state into Nimi surfaces or present it as Nimi session, memory, event, or agent-state truth, and context capability admission is gated on this classification so any claim binding framework memory or context to Nimi Cognition owner surfaces first classifies every durable framework state cluster and the admission fails closed while any durable cluster remains unclassified.
    condition: Whenever framework-held state or context capability admission is evaluated.
    failure: Fail closed on unclassified durable state and reject undeclared durable framework state.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-adapter-plane
  - id: rule.nimi.sdks.feature-clients.r008
    kind: rule
    title: AIConfig and machine-local identities remain separate
    modality: must
    statement: The SDK validates separate canonical identities where a revisioned account-scoped AIConfig names its App or shared LocalAgent owner and stores per-CapabilityContract required standardized features, defaults, and exactly one Local Loadout reference or Cloud Connector reference plus CapabilityImplementation and Driver-owned provider-model target. The Machine Loadout store separately holds flat Loadout resources, each with a lifetime-stable Runtime identity, exact CapabilityImplementation, versioned Driver dialect and recipeId, typed options, independent model slots, RecipeCustody references, Model Contract state, provenance, and display metadata; choosing its reference in AIConfig never transfers resource content or mutation authority. Connector resources remain in Runtime custody, and neither AIConfig nor its options accept credential, endpoint, account selector, path, process evidence, readiness, fallback, or deprecated identity fields.
    condition: Whenever AIConfig, Loadout, or selection identities are authored, imported, projected, or persisted.
    failure: Fail closed on cross-owner or forbidden payloads, independent bind, unbind, rebind, reprojection, or Clear mutation, deletion-required deselection, and retired identity fields without compatibility interpretation.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r009
    kind: rule
    title: The AI config operation set is fixed
    modality: must
    statement: The SDK AI surface exposes typed Profile import, list, get, and validate; non-committing Apply Profile prefill without resource binding; host-neutral App and shared LocalAgent AIConfig get, compare-and-swap overwrite, clear-by-omission, effective selected-resource projection, and bounded discriminated listOptions for Local Loadouts, Cloud Connectors, or Connector-specific targets; separate Machine Loadout store list, Prepare, Commit, any retained machine-default Select, and Delete resource actions; and Job submit, get, cancel, and event subscription. Ordinary AIConfig route, Loadout-reference, Connector-reference, model-target selection or clearing commits with one Save and no second permission or confirmation, while resource download, credential replacement, and destructive deletion retain only their own resource-lifecycle confirmation. A successful overwrite response containing the canonical record and revision is the sole commit acknowledgement; later effective, options, or refresh failure never reverses it, and a successful config read retains config and revision even when effective projection is unavailable. The surface exposes no parallel owner, partial overlay, credential, endpoint, generic Connector CRUD through AIConfig, Profile-driven installation or binding, public route resolution, readiness, probe, health, warm, or fallback.
    condition: Whenever the AI configuration and Loadout operation set is defined or consumed.
    failure: Reject parallel surfaces, mixed-owner actions, old mutation handlers, deletion required for deselection, partial overlays, undeclared probes or route resolution, and unavailable-storage success.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r010
    kind: rule
    title: Adjacent live config families stay non-authoritative
    modality: must
    statement: The SDK may expose typed mutation intent, status, and change projection for separately Runtime-owned LocalAgent Memory and Knowledge configuration, but these families never create an AIConfig owner or persist or infer embedding route, machine selection, binding, bank, rebuild, migration, cutover, or readiness truth from host storage, active UI selection, fixtures, or an implicit owner.
    condition: Whenever adjacent live config or memory embedding families are exposed.
    failure: Reject persisted intent, guessed bank owners, and second product semantics.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r011
    kind: rule
    title: The AI config surface exposes no fallback
    modality: must
    statement: The SDK exposes no fallback knob or probe-derived runnable state; Apply and direct overwrite return only committed configuration or a typed error without partial configuration, and request admission is a typed Runtime-derived reason for one exact attempted composition rather than a persisted AIConfig, Loadout, or machine readiness state. Local failure never switches to Cloud, Cloud failure never switches to Local or another provider or Connector, a missing or later-invalid selection remains explicit, and SDK storage never silently degrades into process memory or a test path.
    condition: Whenever AI config operations report results or persistence runs.
    failure: Fail closed without fallback knobs, partial configs, or silent degradation.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r012
    kind: rule
    title: AIConfig owner parameters are canonical and closed
    modality: must
    statement: A protected App AIConfig client accepts no account, App, product, or owner selector and derives its canonical self owner from the current runtime.consume session, while the agent.configure shared client derives the singular account-scoped Runtime LocalAgent subsystem owner without an Agent handle; only a Desktop manager may be constructed for one currently projected canonical App owner. No client accepts an individual LocalAgent, module, feature, route, chat mode, renderer, concatenated key, or consumer-local owner field or falls back to a chat or other consumer default.
    condition: Whenever an AIConfig client or manager establishes its owner context.
    failure: Reject caller-supplied protected-App owner selectors, non-projected Desktop owners, non-canonical owners, per-Agent ownership, and implicit defaults.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r013
    kind: rule
    title: Profile actions do not materialize execution
    modality: must
    statement: SDK Profile import and validation preserve portable AIConfig intent, local implementation-configuration intent, Cloud implementation-target recommendation, standardized features, defaults, provenance, and license while excluding Loadout identity, selection, ModelAsset identity or path, Connector or account identity, secret, Runtime process, and machine-private facts. Apply Profile to AIConfig returns only non-committing editor prefill without merge, owner mutation, resolution, installation, Prepare or Commit Loadout, selection, current-account Connector resolution, probe, prewarm, readiness, or re-apply relation; after the user selects exact current-environment references, only the canonical whole-object compare-and-swap overwrite commits AIConfig, while Profile local implementation intent may separately feed explicit Prepare Loadout followed by Commit Loadout.
    condition: Whenever a Profile is imported, validated, applied, or used as Loadout creation input.
    failure: Reject Runtime or private identity in Profile, Profile Apply as a commit path, guessed resource references, direct or independent Loadout mutation, cross-action side effects, and a materialization descriptor as product authority.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r014
    kind: rule
    title: AI configuration transport follows canonical ownership
    modality: must
    statement: Each protected App with runtime.consume uses a self-owner get, compare-and-swap overwrite, and bounded options client derived from its current session, Desktop manages only currently projected App owners through the same public results, and the account-scoped shared LocalAgent AIConfig uses the equivalent agent.configure clients without an Agent handle; all clients expose only canonical config, opaque revision, lightweight selected-resource effective results, and safe Loadout, Connector, implementation, or target options. Loadout content, Provider Credentials, Connector endpoints, account identity, exact Job inputs, Runtime process state, usage, Quota, Budget, Rate Limit, LocalAgent non-AI configuration, Memory, and Knowledge remain owner projections that the SDK neither persists as shadow configuration nor exposes through private loopback wrappers.
    condition: Whenever AI config transport or change subscriptions are composed.
    failure: Reject per-Agent or host-local shadow configuration, mixed owner persistence, forbidden payloads, unprotected Runtime mutation, and loopback wrappers.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r015
    kind: rule
    lifecycle: removed
    title: First-run evidence refs stay opaque and verified
    reason: Product Control no longer exchanges or persists first-run evidence refs; built-in scope configuration uses ordinary typed profile application and current Runtime binding resolution.
  - id: rule.nimi.sdks.feature-clients.r016
    kind: rule
    title: Profile intent preview is typed and non-committing
    modality: must
    statement: The SDK may expose a non-committing static Profile prefill diff for one canonical AIConfig owner, showing only portable route intent, required standardized features, defaults, Cloud implementation-target recommendation, and provenance without claiming an overwrite result; preview performs no inventory resolution, exact resource selection, requirement binding, installation, Connector resolution, machine preference, feasibility probe, readiness evaluation, mutation, snapshot recording, or reusable commit token, while the later canonical Save independently uses the manager's Runtime-issued opaque owner revision.
    condition: Whenever a profile apply preview is computed or consumed.
    failure: Reject implicit commits, materialized execution data, cross-owner actions, partial diffs, and preview-as-commit authority.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r017
    kind: rule
    title: App launch does not require AI configuration materialization
    modality: must
    statement: App launch and Product Control readiness do not require an AIConfig, Profile Apply, Loadout, ModelAsset, machine preference, probe, health, or capability admission; a default Profile may be shown only as a recommendation and produces non-committing prefill only through an explicit user action, while a missing or non-executable AI route keeps only the affected capability unavailable and never creates a synthesized, empty, placeholder, automatically materialized, or Profile-committed configuration.
    condition: Whenever an App first launches or lacks AI configuration.
    failure: Preserve App launch, reject implicit Profile Apply or configuration creation, and fail the affected capability without fallback or placeholder success.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r018
    kind: rule
    title: Requirement declarations follow the schema table
    modality: must
    statement: The SDK declaration contract names only a canonical App or product owner, or the singular shared LocalAgent subsystem owner, and for each CapabilityContract its required standardized-feature set and defaults; it never creates module, feature, per-Agent, route, chat-mode, renderer, or Runtime activation-consumer AIConfig owners and never contains a Loadout identity, machine selection, implementation binding, ModelAsset, path, selected source, process evidence, readiness, health, scheduler state, connector secret, or optional-feature lifecycle. Kit may consume the declaration for UI trimming without becoming an owner or execution authority.
    condition: Whenever capability requirement declarations are authored or validated.
    failure: Reject parallel owner schemas, optional-feature lifecycle, shadow truth, and forbidden declaration payloads.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r019
    kind: rule
    title: The app client is the sole admitted access path
    modality: must
    statement: The host-injected SDK App client is the only supported App-facing path to Runtime protected App operations; installed, local-import, and developer sources, when each is separately admitted by lifecycle authority and runnable, reuse the owner registration, declaration, verified Host, protected session, and Runtime admission path, while Desktop inventory and marketplace or review projections remain display and tooling concerns that cannot create, enlarge, or replace App access; SDK callers never select account, subject, launch witness, session, snapshot, domain, operation identity, or classification and never bypass through Runtime private APIs, Realm bearer transport, bridge implementation details, local files, or catalog metadata.
    condition: Whenever an App client, Desktop inventory projection, or host-injected carrier is constructed or consumed.
    failure: Reject bypass paths, metadata-derived admission, and caller-selected authority.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registered-app-subject
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r020
    kind: rule
    title: The inventory operation set is fixed and read-only
    modality: must
    statement: The current Desktop tooling SDK may expose only app.list, app.get, and app.status over an explicitly injected read-only Runtime registration projection; those inventory reads are outside the App Operation Contract and cannot admit or launch an App, while app.install, app.update, app.uninstall, app.launch, app.healthRepair, import, promotion, package-job, account-inventory, package-readiness, and lifecycle subscription operations remain absent and local-development launch is Desktop initiated rather than an SDK app-id call.
    condition: Whenever the current app read-projection operation set is defined or consumed.
    failure: Reject ordinary catalog activation, deferred projections, mutation operations, subscriptions, and inferred sources.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r021
    kind: rule
    title: The SDK exposes no launch selector
    modality: must
    statement: Local-development launch and connection binding are performed only by Desktop's verified native Host supervisor, SDK and App code consume only the already injected App client, and the SDK never exposes an app-id, path, scope, package, or Host selector to create or recover a protected App session and never infers launch authority from active chat, renderer state, a default scope, or a manifest; exact supervisor methods, request encoding, service membership, and carrier transport remain implementation details.
    condition: Whenever local-app launch or session creation is approached.
    failure: Reject SDK launch selectors and inferred launch authority.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r022
    kind: rule
    title: The app client owns no installer or marketplace truth
    modality: must_not
    statement: The SDK Nimi App client surface owns installer, package-manager, PATH, source-selector, marketplace, economy, review, kill-switch, Platform catalog or release admission, Runtime registration or protected App access admission, Desktop exact Host launch or process supervision, or GitHub, npm, or source-workspace discovery truth; conflates Platform catalog or release admission with Runtime protected App access admission; attributes Desktop exact Host launch or process supervision to Runtime; or treats sandbox as a Runtime truth.
    condition: Whenever app client ownership boundaries are evaluated.
    failure: Reject ownership, conflation, or attribution claims over installer, marketplace, catalog or release admission, Runtime access admission, Desktop launch or supervision, sandbox, or discovery truth.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r023
    kind: rule
    title: Projection states are typed and fail-closed
    modality: must
    statement: Every current local-development app client logical operation returns typed fail-closed projection state, ready is never inferred from transfer completion, endpoint reachability, process liveness, registry or release metadata, or file existence, and distinct fail-closed reasons are never collapsed through a generic unavailable.
    condition: Whenever app projection states are produced.
    failure: Reject inferred readiness and collapsed reasons.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r024
    kind: rule
    title: The app client reuses the projection families
    modality: must
    statement: The SDK Nimi App client surface reuses the AI config surface and Runtime local environment typed projection paths, expresses a factory AIProfile only as a non-binding recommendation requiring later explicit Apply Profile to AIConfig and expresses Runtime local environment facts consistently through their owner projections, never introduces a second projection family, and never exposes raw Runtime, Realm, or Cognition transport.
    condition: Whenever app client projections are composed.
    failure: Reject second projection families and raw transport exposure.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r025
    kind: rule
    title: The app client exposes no fallback knob
    modality: must
    statement: App client errors return typed errors following the AI config no-fallback pattern, the surface exposes no fallback allow style parameter, never silently degrades to partial install or partial launch, and never hides a Runtime fail-closed state as success.
    condition: Whenever app client errors are returned.
    failure: Reject fallback knobs, partial degradation, and hidden fail-closed states.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r026
    kind: rule
    lifecycle: removed
    title: App subscriptions carry projection events only
    reason: Removed because no current app lifecycle subscription is admitted; ordinary lifecycle and account-inventory event projections are physically absent.
  - id: rule.nimi.sdks.feature-clients.r027
    kind: rule
    title: Future catalog metadata cannot activate current Apps
    modality: must
    statement: Retained generated Platform catalog rows and release descriptors are future-only read-only metadata, current app.list and Desktop Apps consumers never turn them into ordinary visibility or runnable truth, Avatar, bundled first-party, developer-only, workspace, app-local, and source-discovered rows never become ordinary Apps through the SDK, and any future ordinary catalog projection requires separately activated lifecycle authority and a new admitted consumer contract.
    condition: Whenever Platform catalog metadata is generated, exported, or considered by an Apps consumer.
    failure: Reject current ordinary listing, inferred runnable truth, and activation from metadata presence.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r028
    kind: rule
    title: Immutable package mutation is unadmitted
    modality: must
    statement: Verified release descriptors are future-only read-only discovery and review metadata, the SDK cannot download, inspect, unpack, register, install, import, update, promote, rollback, repair, or execute an immutable artifact, those operations and package-readiness placeholders are physically absent from the Nimi App client, and the SDK never performs direct npm install, npx, GitHub clone, source build or run, lifecycle script execution, digest-only admission, or local file scanning as package truth.
    condition: Whenever immutable package operations are approached.
    failure: Reject the operation without a placeholder or direct package execution path.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r029
    kind: rule
    title: Private storage is subject-scoped and rootless
    modality: must
    statement: Runtime private storage uses a Runtime-resolved current-account-plus-Registered-App-Subject logical partition and never AppID, while the SDK exposes no physical layout, absolute root, root accessor, account, subject, registration, partition identifier, operation identifier, or authority selector; its admitted storage surface is exactly the three JSON methods plus storage.assets stat, list, streamed write, immutable-source ranged read, idempotent remove, same-partition move, reveal, and artifact adoption; reveal accepts only a canonical App-relative committed asset path and returns only revealed true while the native Host privately resolves and reveals the validated payload file, and tombstoned data remains delete-only owner state that the SDK cannot inspect or rebind.
    condition: Whenever local-app private storage is accessed or projected.
    failure: Reject physical-layout exposure, root accessors, subject or partition selectors, and tombstone rebinds.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registered-app-subject
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r030
    kind: rule
    title: App declarations determine access eligibility only
    modality: must
    statement: A registered App source carries only admitted App Access Domain declarations; declaration is eligibility input to Runtime's closed domain-to-operation mapping and never a user-mediated access workflow or durable authorization record, unknown domains remain inert for the same declaration generation, and the SDK never exposes or accepts scope, qualifier, internal resource identity, snapshot identity, classification, account, subject, session, AppOperationId, selector fingerprint, durable authorization identifier, marketplace review, or trust metadata as an authority input.
    condition: Whenever an App declaration or effective access projection is authored, validated, or consumed.
    failure: Reject unknown authority carriers, manufactured access, and declaration-derived success outside Runtime admission.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-access-domain
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r031
    kind: rule
    title: Destructive local-app data deletion is unadmitted
    modality: must
    statement: 0K admits no immutable uninstall and no SDK delete-data prompt or action, a Registered App Subject tombstone leaves retained durable data as Runtime-owned delete-only state that reinstall, reauthorization, the same app id, the same project, or SDK inventory composition cannot rebind, and the SDK never exposes app.uninstall, force-delete, a retain-or-delete choice, an absolute data path, a size-derived deletion decision, direct filesystem mutation, or pseudo-success cleanup.
    condition: Whenever local-app data deletion is approached.
    failure: Reject deletion surfaces, rebinds, and pseudo-success cleanup.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r032
    kind: rule
    title: No callable file-API client exists
    modality: must
    statement: The SDK App client exposes no callable raw or general filesystem API; roots, absolute paths, directory handles, modes, arbitrary OS paths, watchers, and caller-selected partitions or operations are absent, while the bounded rootless App-private JSON and exact binary asset methods, including purpose-specific reveal of one committed App-relative asset without any returned path, do not form a general file client and unsupported filesystem access never falls back to hidden Runtime methods, Desktop helpers, Realm calls, generic HTTP, or direct filesystem paths.
    condition: Whenever file-API access is requested from the app client.
    failure: Fail closed on non-admission and reject hidden mappings and legacy projections.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r033
    kind: rule
    lifecycle: removed
    title: The review-evidence accessor is read-only
    reason: Removed because ordinary release review is deferred and no current SDK catalog row, release descriptor, review accessor, generated projection, Desktop Apps projection, or permission placement seam remains.
  - id: rule.nimi.sdks.feature-clients.r034
    kind: rule
    title: Generated-app auth composition is closed
    modality: must
    statement: The generated third-party App branch accepts only the verified host-injected carrier, binds a fresh Runtime protected session to the Runtime-resolved Registered App Subject and Effective App Access Snapshot, and exposes only purpose-specific typed methods whose exact membership comes from the central App Operation Contract, including bounded App-private storage, runtime.consume artifact adoption, and for runtime.consume-covered Apps their own App AIConfig get, compare-and-swap overwrite, clear-by-omission, effective projection, and safe options; it may submit only safe exact Loadout or Connector references and Cloud implementation-target configuration, never an account selector, credential, endpoint, custody payload, generic Connector operation, or Job-time execution override. The branch exposes access available or unavailable independently of App process and tooling state and never accepts or returns account authority, subject, registration, declaration generation, snapshot, AppOperationId, AppAccessDomainId, classification, launch witness, process proof, endpoint, bearer, refresh token, authorization metadata, Runtime caller identity, method selector, user-mediated access API, durable access record, or generic forwarding, and it never uses direct Runtime or Realm fallback, mock success, anonymous identity, first-party self-declaration, or carrier reconstruction.
    condition: Whenever generated-app auth or client composition is constructed.
    failure: Fail closed on absent carriers and reject app-owned tokens, Realm bypasses, and pseudo-success.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registered-app-subject
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r035
    kind: rule
    title: App storage projection is an exact JSON and asset set
    modality: must
    statement: A Local App may use the bounded typed App-private JSON storage operations plus storage.assets stat, bounded list, streamed write, ranged read, idempotent remove, same-partition move, reveal, and adoptArtifact admitted by the central App Operation Contract under the Runtime-derived current account, Registered App Subject, and fresh session without a user-mediated access workflow; write accepts Uint8Array, Blob where available, or an incremental byte source, read returns exactly asset metadata, resolved range, and an incremental body from one committed source, adoption accepts only artifactId, relativePath, and overwrite intent and remains runtime.consume, reveal accepts only relativePath and returns only revealed true after Runtime and the verified native Host revalidate the committed asset and show the exact no-copy payload file in the OS file manager, while SDK receives no root, absolute path, account, subject, registration or partition identifier, quota authority, generic file operation, directory access, caller MIME override for adoption, or authority-bearing selector; Runtime enforces canonical relative paths, independent JSON and asset bounds, filesystem safety, atomic commits, integrity, and idempotent removal according to the owning implementation contract.
    condition: Whenever app-private storage operations are exposed or invoked.
    failure: Reject root and selector inputs and keep non-admitted operations typed unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r036
    kind: rule
    lifecycle: removed
    title: Package readiness is typed unavailable in 0K
    reason: Removed because package readiness is deferred and its accessor, request, response, decoder, placeholder, and bridge projection are physically absent.
  - id: rule.nimi.sdks.feature-clients.r037
    kind: rule
    lifecycle: removed
    title: Account inventory truth is Runtime-resolved
    reason: Removed because account app inventory is deferred and its accessor, request, record schema, parser, decoder, fixture, and alternate file reader are physically absent.
  - id: rule.nimi.sdks.feature-clients.r038
    kind: rule
    title: Inventory entries compose deterministically
    modality: must
    statement: NimiAppClient.list returns current local-development NimiAppInventoryEntry values carrying appId, display metadata, the explicit local-record source, local trust class, local record state, open readiness, next actions, and typed reasonCode and detail, distinct local records remain distinct by their Runtime-issued opaque identity and never merge merely because display appId matches, a source failure emits a typed source-degraded projection and never fabricates a record, and entries expose no catalog, account-inventory, package-readiness, active-job, install-state, release, or package field.
    condition: Whenever the current local-development Apps read projection is composed.
    failure: Reject fabricated or merged records and fields belonging to deferred ordinary lifecycle projections.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r039
    kind: rule
    title: Local records project without identity leakage
    modality: must
    statement: The SDK exposes read-only typed status for the current host-injected App carrier covering source class, registration state, protected-session availability, tooling activity, and typed reason; it omits account authority, subject, lineage, partition, launch, process, session, declaration-generation, snapshot, operation, decision, digest, fingerprint, and attestation identities, and SDK, Desktop, and Apps never scan workspaces or infer registration or access from a manifest, path, app id, file existence, marketplace row, or prior success.
    condition: Whenever local app records are projected.
    failure: Reject identity leakage and inferred records.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r040
    kind: rule
    title: Local-app bootstrap custody is bounded
    modality: must
    statement: The Local App SDK bootstrap accepts only the verified host-injected carrier and exposes typed access availability, purpose-specific typed methods from the central App Operation Contract whose calls Runtime evaluates against its internal Effective App Access Snapshot, and the minimal current-user display projection containing exactly handle, displayName, and nullable avatarUrl under its safe-display constraint; it exposes no account id or generation, subject, authorization decision, credential, Realm JWT, Provider Credential, Runtime proof, endpoint, snapshot, generic method forwarding, or host security material, and App-native data and commands remain App-owned.
    condition: Whenever the local-app bootstrap surface is constructed or consumed.
    failure: Fail closed on missing carriers and reject authority material in input or output.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.current-user-display-projection
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r041
    kind: rule
    title: Desktop Open Intent is a data surface only
    modality: must
    statement: The SDK app subpath exposes NimiDesktopOpenIntent, NimiDesktopOpenEnvelope, parser, and type guard surfaces for the Platform Desktop Open Intent protocol, the SDK is the TypeScript semantic parser owner whose behavior matches the desktop-open-intent golden vectors table, the SDK never exposes an opener or imports Kit, Electron, Tauri, browser globals, OS opener code, Desktop private bridge code, or Runtime private boundaries because apps call Desktop Open Intent through Kit standard shell hosts and not through the SDK, and SDK Desktop Open Intent data never carries auth, session, or token material, provider, model, or connector credential truth, Runtime caller identity, or executable LocalAgent truth.
    condition: Whenever Desktop Open Intent surfaces are exposed or parsed.
    failure: Reject opener exposure and forbidden payloads.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r042
    kind: rule
    lifecycle: removed
    title: Local App voice consumption stays Runtime owned
    reason: Removed because voice operations are not in the current central App Operation Contract and no shadow or conditional third-party App voice surface is admitted.
  - id: rule.nimi.sdks.feature-clients.r043
    kind: rule
    lifecycle: removed
    title: The permission client is the sole public path
    reason: Removed because the product has no third-party App permission client, posture, request, subscription, or grant ledger.
  - id: rule.nimi.sdks.feature-clients.r044
    kind: rule
    lifecycle: removed
    title: The permission operation set is minimal
    reason: Removed because permission status, request, subscribe, revoke, history, and settings operations are not product surfaces.
  - id: rule.nimi.sdks.feature-clients.r045
    kind: rule
    lifecycle: removed
    title: Request input is permission id plus reason
    reason: Removed because App access has no permission request input or user-facing reason carrier.
  - id: rule.nimi.sdks.feature-clients.r046
    kind: rule
    lifecycle: removed
    title: The permission catalog is closed
    reason: Removed because exact App operations are owned by the central App Operation Contract rather than a public permission catalog.
  - id: rule.nimi.sdks.feature-clients.r047
    kind: rule
    lifecycle: removed
    title: Posture is public and never grant lifecycle
    reason: Removed because prompt, pending, granted, denied, revoked, and permission posture are not third-party App product states.
  - id: rule.nimi.sdks.feature-clients.r048
    kind: rule
    lifecycle: removed
    title: No fallback and no parallel ledger
    reason: Removed with the permission plane; no permission or grant ledger exists, and the surviving no-fallback rule is carried by the App client and Runtime admission contract.
  - id: rule.nimi.sdks.feature-clients.r049
    kind: rule
    lifecycle: removed
    title: Public and internal enforcement stay separate
    reason: Removed because declaration domains map directly to the central App Operation Contract and there is no public permission or item-request layer.
  - id: rule.nimi.sdks.feature-clients.r050
    kind: rule
    lifecycle: removed
    title: One-shot and cross-app rows stay reserved
    reason: Removed because future one-shot and cross-App permission rows do not belong in the current App access contract.
  - id: rule.nimi.sdks.feature-clients.r051
    kind: rule
    lifecycle: removed
    title: App-private authority is not permission
    reason: Removed with the permission plane; the surviving App-private storage boundary is owned by the active App client storage rule.
  - id: rule.nimi.sdks.feature-clients.r052
    kind: rule
    lifecycle: removed
    title: Deferred release review never enters permission
    reason: Removed with the permission plane; the active App client path directly states that marketplace and review metadata never create or enlarge Runtime access.
  - id: rule.nimi.sdks.feature-clients.r053
    kind: rule
    title: Proposal intake goes through the SDK only
    modality: must
    statement: Apps that create or read conversation-originated proposal intake records go through the SDK proposal-intake client surface, direct app-level REST calls, local files, renderer storage, private Runtime imports, and app-local proposal stores are not admitted, and the SDK surface exposes no app-local bypass for Zhiyu or any other first-party app.
    condition: Whenever proposal intake records are created or read.
    failure: Reject bypass paths and app-local stores.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.proposal-plane
  - id: rule.nimi.sdks.feature-clients.r054
    kind: rule
    title: Proposal operations never execute
    modality: must
    statement: The SDK proposal-intake client admits the logical operations proposal.create submitting a typed proposal draft to the Platform proposal operation and returning a typed proposal intake record, proposal.get optionally reading a proposal record when the Platform operation is available, and proposal.transition optionally submitting an owner-reviewed state transition when the Platform operation is available, and these operations never install, execute, download, register, grant permission, run code, select provider or model, or promote release state.
    condition: Whenever proposal operations are defined or invoked.
    failure: Reject execution, installation, and grant side effects.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.proposal-plane
  - id: rule.nimi.sdks.feature-clients.r055
    kind: rule
    title: Proposal records mirror Platform authority
    modality: must
    statement: SDK proposal records preserve the Platform field set as typed SDK fields covering proposalId, proposalKind, sourceConversationAnchorId, requesterSubjectRef, ownerDomain, requestedCapabilityRef, riskTier, requiredPermissionRefs, nextReviewStep, state, reasonCode, auditRef, and createdAt, the SDK never collapses owner, risk, permission, next review step, state, or audit fields into a generic text blob, the SDK preserves the closed Platform proposal kind set and the closed Platform state set as typed unions or equivalent enums, and unknown kinds or states are never accepted as opaque strings and fail closed.
    condition: Whenever proposal records are typed or decoded.
    failure: Fail closed on unknown values and reject collapsed fields.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.proposal-plane
  - id: rule.nimi.sdks.feature-clients.r056
    kind: rule
    title: Missing Platform operations fail closed
    modality: must
    statement: When no Platform proposal operation is available, proposal.create, proposal.get, and proposal.transition fail closed with a typed SDK error and never synthesize a durable proposal record, audit reference, or state transition, and the SDK never fabricates a proposalId, auditRef, or accepted-for-admission state to make a UI path appear successful.
    condition: Whenever a Platform proposal operation is unavailable.
    failure: Fail closed with typed errors and reject fabricated records.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.proposal-plane
  - id: rule.nimi.sdks.feature-clients.r057
    kind: rule
    title: Retired aliases and execution fields are rejected
    modality: must
    statement: The SDK rejects drafts and returned records that route a proposal through a retired mod-extension alias family unless the proposal kind is rejected_request or the state is blocked or rejected with a typed reason, rejects drafts and returned records carrying execution, provider or model, install, download, local path, or hidden command fields, and never turns a proposal into executable Runtime, Workflow, app, package, or delegated-tool behavior.
    condition: Whenever proposal drafts or records are validated.
    failure: Reject retired alias routing and executable payloads.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.proposal-plane
  - id: rule.nimi.sdks.feature-clients.r058
    kind: rule
    title: Proposal drafts carry bounded source refs
    modality: must
    statement: The SDK proposal draft requires sourceConversationAnchorId and requesterSubjectRef and may carry a bounded requestedCapabilityRef, raw prompt transcripts, private memory, provider traces, and local app state are not proposal truth, and the SDK never stores conversation bodies or app private state in the proposal record.
    condition: Whenever a proposal draft is composed.
    failure: Reject transcript, memory, and private-state payloads.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.proposal-plane
  - id: rule.nimi.sdks.feature-clients.r059
    kind: rule
    title: Consumers render Platform-returned truth only
    modality: must
    statement: SDK consumers render proposal state from the SDK returned record or typed SDK error, an app may show a draft or capture UI but durable proposal truth remains the Platform-returned record, and apps never persist alternate proposal truth, alternate review state, or hidden success state when the SDK returns a fail-closed error.
    condition: Whenever proposal state is rendered or persisted by consumers.
    failure: Reject alternate truth and hidden success persistence.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.proposal-plane
  - id: rule.nimi.sdks.feature-clients.r060
    kind: rule
    title: The acquisition facade is host-typed and narrow
    modality: must
    statement: The SDK may provide a runtime.connectorAuth.acquireManagedCredential or equivalent host typed facade converging provider browser and device-code flows out of the Desktop renderer, the facade owner is the SDK host typed surface and not a Runtime daemon RPC, Runtime adds no AcquireManagedCredential, BeginProviderOAuth, RefreshManagedCredential, or equivalent connector RPC because the ConnectorService method freeze stays effective, the facade injects host primitives through adapters covering browser open, profile-scoped provider network requests, authorization-code token exchange, cancellable sleep and time sources, and the Runtime connector create and update client, provider network requests carry the profileId and a purpose of device_authorization or device_token with the host failing closed and admitting only the exact endpoints generated for that profile by the acquisition profiles table, one AbortSignal and request identity remain effective through provider requests, polling sleep, token exchange, and the pre-dispatch phase of the final Runtime custody write, the host rechecks that identity immediately before dispatching the final write, that dispatch is the final write commit point after which later cancellation cannot be projected as a canceled acquisition and the host waits for the exact bounded Runtime result, the host cancels and waits for its active pre-dispatch acquisitions and waits for any already-dispatched final write before closing, the SDK never requires the host to expose an arbitrary provider proxy or generic CORS bypass, the SDK never imports Desktop, Tauri, renderer bridges, or provider UI components, and sealed credential payloads returned by host adapters are written only through the existing Runtime CreateConnector and UpdateConnector write path without establishing a second credential persistence path.
    condition: Whenever managed OAuth acquisition is orchestrated.
    failure: Fail closed on non-profile endpoints, an expired or canceled acquisition before final write dispatch, post-dispatch cancellation projected ahead of the exact Runtime result, an acquisition or dispatched final write left active after host shutdown, new connector RPCs, and second persistence paths.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.connector-auth-plane
  - id: rule.nimi.sdks.feature-clients.r061
    kind: rule
    title: Acquisition profile truth lives in one table
    modality: must
    statement: The only SDK-side source of OAuth acquisition constants is the connector-auth-acquisition-profiles table, the table carries only acquisition metadata covering profile_id, provider_auth_profile, issuer, client_id, device_authorization_url, device_token_url, redirect_uri, fallback_verification_url, token_exchange_provider, default_poll_interval_seconds, min_poll_interval_seconds, max_poll_interval_seconds, default_expires_in_seconds, and max_expires_in_seconds, a missing provider interval or expires_in uses its profile default, an admitted provider interval is a positive integer no greater than max_poll_interval_seconds, the effective poll interval is the greater of min_poll_interval_seconds and the admitted provider or default interval, an admitted provider expires_in is a positive integer no greater than max_expires_in_seconds, and the admitted expires_in bounds the cancellable acquisition lifetime through final Runtime custody write dispatch, after that commit point the facade waits for the exact result under the existing bounded Runtime call deadline and does not reclassify it as canceled, the table never carries sealed credential payload schemas, refresh-token semantics, provider execution header derivation, connector status truth, model or catalog truth, or Runtime-owned credential validation truth, and token_exchange_provider serves only host-injected authorization-code exchange adapter routing and is never interpreted as a Runtime execution provider, model or catalog owner, or header derivation truth.
    condition: Whenever acquisition constants are sourced or the profile table is maintained.
    failure: Reject out-of-table constants, out-of-scope table content, provider interval above max_poll_interval_seconds, provider expires_in above max_expires_in_seconds, and any pre-dispatch acquisition continuing beyond its admitted expires_in.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.connector-auth-plane
  - id: rule.nimi.sdks.feature-clients.r062
    kind: rule
    title: Refresh and rotation stay unadmitted
    modality: must
    statement: Admitted managed OAuth acquisition owns no refresh or rotation automation, a refresh token may appear inside a provider-defined sealed credential payload only as opaque material written through Runtime custody, the SDK host facade never silently refreshes, rotates, rewrites, repairs, selects, or binds sealed credential payloads after acquisition completes, and an unusable payload fails a user-explicit bounded Test Connector diagnostic or Cloud execution without creating readiness or changing the AIConfig route or committed Connector reference; re-authentication is manual reacquisition unless a future authority admits a refresh owner.
    condition: Whenever managed credential refresh or rotation is approached.
    failure: Reject silent refresh and rotation and keep unusable payloads fail-closed.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.connector-auth-plane
  - id: rule.nimi.sdks.feature-clients.r063
    kind: rule
    title: Local environment projection mirrors Runtime
    modality: must
    statement: The SDK may expose typed downstream projection for host facts, ModelAsset inventory and content-integrity evidence, install and dependency plans and Jobs, Runtime-private ExecutionHost diagnostics, explicit confirmation, cancellation, retry, and repair, while preserving every concrete asset and resource-occurrence identity. Selected-source remains Runtime-private dependency evidence and none of these projections creates or changes AIConfig route, Loadout, exact binding, Machine Loadout store selection, standardized-feature support, derived admission, or Job execution inputs; recommendation and recovery helpers never infer selection, binding, routing, or automatic recovery from filenames, paths, labels, inventory, process state, or failure text.
    condition: Whenever local environment plans or dependency jobs are projected.
    failure: Reject synthesized identities, non-Runtime targets, and inferred recovery policy.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.local-environment-plane
  - id: rule.nimi.sdks.feature-clients.r064
    kind: rule
    title: Environment diagnostics are never capability readiness
    modality: must
    statement: The SDK never owns or infers capability admission, routing, binding, machine selection, or standardized-feature support from GPU, CUDA, Python, package set, model directory, PATH, engine package, endpoint reachability, transfer completion, directory presence, import success, process health, or script exit; it preserves typed Runtime installation, integrity, dependency, cancellation, unsupported, repair, authorization, and stale-diagnostic reasons without synthesizing ready, never makes Cloud execution depend on Local environment facts, never clears a binding after execution failure, and never instructs ordinary users to mutate system package managers, global Python, PATH, shell profiles, or engine-private directories.
    condition: Whenever local environment readiness or failures are projected.
    failure: Reject synthesized readiness and system-level installation guidance.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.local-environment-plane
  - id: rule.nimi.sdks.feature-clients.r065
    kind: rule
    title: Composition consumes canonical owner identities
    modality: must
    statement: SDK composition consumes one canonical AIConfig owner and CapabilityContract, then at Job submission receives Runtime's atomically persisted complete Local ResolvedAssembly or exact Cloud effective inputs captured from the committed Connector reference, CapabilityImplementation, and Driver target; it never accepts a Loadout or Connector override on a Job request, consumes candidate options as execution input or legacy route bindings, treats raw provider or model ids as a route, exposes a mutable resolved-binding product object, or reconstructs execution from current owner state.
    condition: Whenever the SDK consumes or projects capability composition or Job identity.
    failure: Reject legacy identities, ambient inventory, partial capture, current-state reconstruction, and cross-owner target material.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.capability-composition-plane
  - id: rule.nimi.sdks.feature-clients.r066
    kind: rule
    title: The composition surface has no second router
    modality: must
    statement: Outside the canonical AIConfig manager's bounded discriminated candidate-options query, the SDK exposes no execution route inventory, resolve, check-health, search, rank, warm-candidate, or fallback facade; authorized configuration actions write the canonical owner state, Job submission asks Runtime to deterministically compose that committed state, and bounded description is limited to exact identities, configuration schema, required and supported standardized features, and a typed derived admission reason from that composition.
    condition: Whenever the capability composition facade is defined or consumed.
    failure: Reject a second router, public health or readiness facade, implicit selection, schema invention, and default backfill.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.capability-composition-plane
  - id: rule.nimi.sdks.feature-clients.r067
    kind: rule
    title: Composition descriptions are typed and fail closed
    modality: must
    statement: A composition description is a typed projection of one exact committed CapabilityContract route, required standardized-feature set, safe exact Loadout or Connector reference, effective CapabilityImplementation and Driver target, and current derived admission reason; it is neither a ResolvedAssembly nor a Job input source. Ordinary App projection contains no credential, endpoint, custody payload, account selector, or generic Connector management data, support metadata remains contract scoped, streaming stays CapabilityContract and Job semantics rather than a feature, raw provider payloads and secrets never cross the SDK boundary, and missing or inconsistent identity or feature data fails closed without guessing or fallback.
    condition: Whenever composition descriptions are typed or consumed.
    failure: Fail closed on missing or inconsistent composition data and reject degradation, provider-name inference, readiness, and guessing.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.capability-composition-plane
  - id: rule.nimi.sdks.feature-clients.r068
    kind: rule
    title: Composition is deterministic and non-selecting
    modality: must
    statement: Only at Local Job submission Runtime atomically dereferences the exact Loadout reference committed in AIConfig, revalidates every expected_content_id, and persists a complete ResolvedAssembly; for Cloud it captures the exact Connector reference, implementation, and Driver target committed in AIConfig after Runtime ownership, credential, App access, and policy checks. Queued, running, and resumed Jobs never reread current AIConfig, Loadout, catalog, inventory, machine preference, process state, or private CAS. SDK projection may only type-narrow public facts and never use candidate options as execution input, rank candidates, select a substitute Connector, infer from names or endpoints, probe, prewarm, use first available, change committed owner state, or upgrade UI ordering into execution policy.
    condition: Whenever Job composition or its typed projection runs.
    failure: Reject non-canonical or partial inputs, SDK routing caches, ambient resolution, current-owner rereads, selection, and policy upgrades.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.capability-composition-plane
  - id: rule.nimi.sdks.feature-clients.r069
    kind: rule
    title: Job projections preserve exact captured inputs
    modality: must
    statement: SDK Job projections preserve the exact immutable effective inputs persisted before publication; Local projects one complete ResolvedAssembly containing AIConfig Local route, exact committed Loadout reference, features and defaults, exact CapabilityImplementation, versioned Driver dialect and recipeId, typed options, every model axis's model_asset_id, expected_content_id, reverified path and content identity, RecipeCustody identity, request, load plan, and process identity, while Cloud projects the bounded exact committed Connector reference, implementation, provider-model target, defaults, and request without credential or custody payload. Later Profile, AIConfig, Loadout, machine preference, Connector, catalog, inventory, process, or private CAS changes never rewrite queued, running, or resumed Jobs, and transport mechanics never become configuration authority.
    condition: Whenever Job types or effective inputs are shared, resumed, or projected.
    failure: Reject mutable or partial Job inputs, current-state reconstruction, private interim route APIs, and configuration-surface reuse.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.capability-composition-plane
  - id: rule.nimi.sdks.feature-clients.r070
    kind: rule
    title: Admitted delegated clients remain typed projections only
    modality: must
    statement: The SDK exposes a delegated capability client only after Runtime separately admits the capability, operations, authorization, failure, and owner contract, and the SDK then remains a typed projection and command carrier without credentials, provider-native payloads, MCP or A2A clients, approval policy, firewall verdict ownership, execution truth, or audit truth.
    condition: Whenever a delegated capability client is proposed or exposed.
    failure: Reject unadmitted capability publication, semantic ownership, and protocol-native wire exposure.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.delegation-plane
  - id: rule.nimi.sdks.feature-clients.r075
    kind: rule
    title: No direct delegated-provider bypass or premature support
    modality: must
    statement: The SDK never connects Desktop, Avatar, Apps, Web, or Direct SDK Consumers directly to an unadmitted delegated provider, MCP, or A2A surface, and type, registry, generated code, or documentation presence never claims production support without an admitted Runtime owner contract and real implementation.
    condition: Whenever delegation consumers or support claims are evaluated.
    failure: Reject direct provider connections and unearned support claims.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.delegation-plane
  - id: rule.nimi.sdks.feature-clients.r076
    kind: rule
    title: Avatar integration is first-party and projection-only
    modality: must
    statement: The SDK exposes only typed integration required by Nimi Home and Avatar to consume Runtime LocalAgent presentation output and Avatar rendering diagnostics, owns none of the underlying semantics, and provides no Third-party App direct Avatar control.
    condition: Whenever an Avatar SDK surface is exposed.
    failure: Reject SDK-owned presentation or rendering truth, Third-party direct control, embedded renderer, or raw backend command surface.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.avatar-projection-plane
  - id: rule.nimi.sdks.feature-clients.r077
    kind: rule
    title: Presentation selection follows Runtime truth
    modality: must
    statement: Runtime owns LocalAgent presentation, activity, emotion, and voice truth, Nimi Home may request admitted configuration through the standard authorized Runtime surface, Avatar consumes the resulting projection, and SDK validation never replaces Runtime authorization or becomes an App-local configuration owner.
    condition: Whenever avatar presentation configuration is read or mutated.
    failure: Reject Desktop or App-owned presentation truth, stale overwrite, bypass of Runtime authorization, or direct backend control.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.avatar-projection-plane
  - id: rule.nimi.sdks.feature-clients.r078
    kind: rule
    title: Avatar diagnostics stay first-party projections
    modality: must
    statement: First-party Nimi Home and Avatar diagnostics may carry typed Runtime and Avatar status or evidence projections without exposing raw model, provider, protocol, motion, renderer, or backend command payloads and without reinterpreting rendering evidence as Runtime LocalAgent success.
    condition: Whenever avatar probe, replay, or evidence surfaces are exposed.
    failure: Reject raw payload exposure and evidence reinterpretation.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.avatar-projection-plane
  - id: rule.nimi.sdks.feature-clients.r080
    kind: rule
    title: Avatar projection types admit no escapes
    modality: must
    statement: Avatar projection and diagnostic SDK types use named interfaces, enums, tagged unions, or schema refs and never expose free-form provider, protocol, raw motion, raw renderer, or backend command payloads.
    condition: Whenever Avatar projection SDK types are defined.
    failure: Reject untyped escapes and raw payload types.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.avatar-projection-plane
  - id: rule.nimi.sdks.feature-clients.r081
    kind: rule
    title: Avatar consumers cannot bypass owners
    modality: must_not
    statement: The SDK provides helper APIs that let Desktop, Avatar, apps, or Web bypass Runtime-owned probe, replay, and authorization semantics or Avatar-owned backend resolver execution.
    condition: Whenever avatar control helpers are exposed.
    failure: Reject bypass helpers.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.avatar-projection-plane
  - id: rule.nimi.sdks.feature-clients.r082
    kind: rule
    title: The Avatar package client stays retired
    modality: must
    statement: The SDK Avatar package client surface retired together with the Asset Market withdrawal, the former public surfaces including runtime.avatarPackage.resolveLaunchProjection, decodeAvatarPackageHandoff, RuntimeAvatarPackageHandoff, and RuntimeAvatarPackageBackendKind no longer exist and the former Avatar package client rule block carries no active normative behavior, Avatar launch keeps only the local Avatar asset path of private import plus local materialization with no remote package source, and any proposal reviving the surface requires new authority admission with new rules.
    condition: Whenever Avatar package client surfaces are approached.
    failure: Fail closed on retired surfaces and reject revival without new admission.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.avatar-projection-plane
  - id: rule.nimi.sdks.feature-clients.r083
    kind: rule
    title: Live Avatar association remains owner mediated
    modality: must
    statement: Runtime and Avatar may associate the active first-party Avatar instance with an explicit LocalAgent for projection recovery, Runtime retains conversation continuity and authorization truth, and no Third-party App receives a binding entity or selector API.
    condition: Whenever a live Avatar instance is associated with a LocalAgent.
    failure: Reject inferred continuity, App-owned binding truth, or Third-party binding control.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.avatar-projection-plane
  - id: rule.nimi.sdks.feature-clients.r096
    kind: rule
    title: The sdks family boundary admits no shims
    modality: must
    statement: The sdks tree is the SDK-family workspace boundary whose support documents and package metadata are family evidence only after they exist and are explicitly admitted by the sdks authority, sdks package metadata never introduces public package names, release commands, conformance commands, or export manifests before the corresponding generator and conformance authority is admitted, and no forwarding package or compatibility shim is created to bridge archived old SDK source and the sdks tree.
    condition: Whenever sdks family metadata or bridging is proposed.
    failure: Reject premature metadata and bridging shims.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.package-plane
  - id: rule.nimi.sdks.feature-clients.r097
    kind: rule
    title: TypeScript source roots follow current product demand
    modality: must
    statement: The TypeScript SDK keeps the smallest public source roots required by current Realm, Runtime, Character, LocalAgent, Conversation, Memory, Knowledge, AI consume, error, and authorization journeys, and does not prebuild Workflow, MCP, framework-adapter, toolkit, evaluation, migration-doctor, or ecosystem-completeness directories without a concrete admitted consumer.
    condition: Whenever TypeScript SDK source roots are added or retained.
    failure: Reject speculative catalog expansion and require a current owner and consumer contract.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.package-plane
  - id: rule.nimi.sdks.feature-clients.r099
    kind: rule
    title: The OpenAI adapter is a strict chat bridge
    modality: must
    statement: The OpenAI-compatible adapter v1 is a strict Chat Completions compatible migration bridge only, the supported endpoint shape is chat.completions.create in non-streaming and streaming modes, supported inputs are common chat generation parameters, function-tool definitions, tool_choice, response_format, and the message roles system, developer, user, assistant, and tool, tool semantics return OpenAI-style tool_calls without executing tools inside the adapter, the unsupported surfaces are the responses, completions, and embeddings endpoints, OpenAI built-in tools, file search, web search, code interpreter, stored chat completion CRUD, logprobs, more than one choice, general OpenAI API compatibility, and Runtime REST bypass promises, and unsupported behavior fails closed with SDK_ADAPTER_FEATURE_UNSUPPORTED.
    condition: Whenever the OpenAI-compatible adapter handles requests.
    failure: Fail closed with the unsupported feature code on unsupported surfaces.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.package-plane
  - id: rule.nimi.sdks.feature-clients.r100
    kind: rule
    lifecycle: removed
    title: Local App conversation attachments stay bounded
    reason: Removed because attachment upload, readback, and artifact-reference operations are absent from the current central App Operation Contract.
  - id: rule.nimi.sdks.feature-clients.r101
    kind: rule
    title: Local App text candidate generation is one bounded typed operation
    modality: must
    statement: The host-injected App client exposes the bounded typed runtime.ai.text-candidate.generate method while the central App Operation Contract maps that operation to runtime.consume and Runtime alone admits a call when its internal Effective App Access Snapshot covers runtime.consume; the method accepts only bounded plain-text system and user messages plus temperature, topP, and maxTokens, returns only text, finishReason, and traceId, and never exposes the snapshot, ExecuteScenario, a Runtime client, method names, protobuf bytes, model or provider selection, route or target refs, tools, media, streams, jobs, credentials, account authority, or generic forwarding; Runtime consumes the calling App owner's committed AIConfig without SDK override or fallback.
    condition: Whenever a Local App requests foreground AI-generated candidate text.
    failure: Fail closed before transport on invalid input or absent host carrier and preserve Runtime admission and execution failures without fabricating candidate text.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r102
    kind: rule
    title: Local App scenario consumption is a bounded typed operation family
    modality: must
    statement: The host-injected App client exposes only bounded typed methods for runtime.ai.text-turn.stream, runtime.ai.scenario.execute, runtime.ai.scenario-job.submit, runtime.ai.scenario-job.get, runtime.ai.scenario-job.subscribe, runtime.ai.scenario-job.cancel, runtime.ai.artifact.read, runtime.ai.artifact.upload, runtime.ai.artifact.adopt-to-app-storage, and runtime.ai.voice-assets.list while the central App Operation Contract maps each to runtime.consume and Runtime alone admits a call when its internal Effective App Access Snapshot covers runtime.consume; scenario Job and artifact projections remain current-account-plus-Registered-App-Subject-bound without exposing that owner, getScenarioArtifacts returns metadata without automatically calling runtime.ai.artifact.read or applying the 32-MiB inline ceiling, explicit inline read remains capped, speech-transcribe submit, get, and subscribe map immutable Runtime transcription_text to transcriptionText without reopening artifact bytes, and voice.create submit returns only the Job while subscribe projects Job-only events and the SDK calls get once after a COMPLETED event to project the VoiceAsset and VoiceReference terminal result; each method accepts only its bounded typed input and returns only its operation-specific projection, and the client never exposes the snapshot, ExecuteScenario, SubmitScenarioJob, a Runtime client, method names, protobuf bytes, model or provider selection, route or target refs, allowed-use selectors, tools, credentials, account authority, provider URLs, or generic forwarding.
    condition: Whenever a Local App executes a scenario, submits, observes, or cancels a scenario Job, streams a text turn, reads, uploads, adopts, or references an artifact, or lists voice assets through the SDK.
    failure: Fail closed before transport on invalid input, unsupported upload MIME, oversized inline input, absent host carrier, cross-owner or historical-unbound lookup, or artifact-unavailable adoption and preserve Runtime admission and execution failures without fabricating scenario output, transcription text, pre-terminal voice results, artifact bytes, or custody.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r103
    kind: rule
    title: Runtime Agent voice input remains bounded and typed
    modality: must
    statement: The TypeScript Runtime Agent voice-input facade independently admits at most 6 MiB of inline audio bytes, rejects a larger payload before protected-scope acquisition or Runtime transport with typed AI_AUDIO_INPUT_TOO_LARGE, and preserves typed Runtime cancellation and failure semantics without claiming to measure capture duration from the bytes-only request. The facade never derives cancellation from human-readable error text.
    condition: Whenever a first-party consumer submits recorded voice input through the TypeScript Runtime Agent facade.
    failure: Fail closed before scope acquisition or transport on over-bound inline audio, preserve typed Canceled and non-cancellation failures, and reject message-inferred cancellation or fabricated transcription success.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.package-plane
  - id: rule.nimi.sdks.feature-clients.r104
    kind: rule
    title: Local App PersonaCharacter owner client is exact
    modality: must
    statement: The host-injected App client exposes exactly realm.personaCharacter.listOwned, getOwned, create, replace, and the non-transport toProfileInput helper from the canonical owner PersonaCharacter App contract; listOwned admits optional worldId, writable visibility, afterId, and integer take from one through five hundred, defaults take to fifty, and returns a frozen page with items plus nextAfterId only when the returned item count equals take. The client validates exact closed top-level write inputs, requires baseContentHash for replace, forbids output-only profileHash and profileCoverage in write profiles, keeps stable HTTPS externalRefs display-safe, performs the single complete consumer projection after transport, and exposes only the canonical sanitized failure reasons. It accepts no caller authority carrier for account, ownerAccountId, scope, AppOperationId, AppAccess domain, Realm method, endpoint, header, caller class, session, snapshot, or generic Realm facade; it treats nested profile and extension fields as Realm-owned non-authoritative product content and does not reproduce origin dependency, extension registry, canonicalization, coverage, or hash semantics or reject opaque fields by token, secret, classification, provider, model, route, or JWT-shaped lexical guesses.
    condition: Whenever a Local App lists, reads, creates, or replaces an owner PersonaCharacter through the SDK.
    failure: Fail closed before transport on absent or extra transport methods, invalid top-level input, malformed pagination, output-only profile fields, malformed baseContentHash, unsafe externalRefs, or oversized request and fail closed after transport on missing, extra, malformed, unsafe, owner-bearing, or oversized projection fields without returning raw Realm material or a direct SDK fallback.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.persona-character-owner-app-contract
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.character-profile-projection
