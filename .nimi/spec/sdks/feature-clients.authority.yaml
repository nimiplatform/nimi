format: nimicoding.authority/v2
owner: team.sdks
scope: sdks.feature-clients
units:
  - id: definition.nimi.sdks.feature-clients.ai-adapter-plane
    kind: definition
    title: SDK AI adapter plane
    meaning: The SDK AI adapter plane owns the adapter-facing feature client boundary of the SDK family, covering independent AI adapter packages and core AI helper boundaries, media job and stream finish projection, provider catalog and error projection alignment, world generation projection, external AI framework adapter boundaries, adapter capability manifests, and framework state lifetime and reconstructibility classification.
  - id: definition.nimi.sdks.feature-clients.ai-config-plane
    kind: definition
    title: SDK AI config plane
    meaning: The SDK AI config plane owns the app-facing typed surface over AIProfile, AIConfig, and AISnapshot, covering the fixed logical operation categories, adjacent live config families including memory embedding, the no-fallback posture, AIScopeRef consumption, the runtime-facing descriptor bridge, the host-local transport boundary and subscriptions, first-run evidence consumption, profile apply preview, per-app first-launch initialization, capability requirement declarations, and compact AIConfig ref validation.
  - id: definition.nimi.sdks.feature-clients.app-client-plane
    kind: definition
    title: SDK app client plane
    meaning: The SDK app client plane owns the typed consumer surface over the Platform Nimi App catalog, Runtime local-record projection, and the final host-injected local-app carrier, covering the sole admitted access path, the inventory logical operation set, launch and installer non-ownership, typed projection states, catalog visibility filtering, package and storage boundaries, permission declaration boundaries, review-evidence access, generated-app auth composition, storage partition projection, readiness and inventory accessors, bootstrap custody, Desktop Open Intent data surfaces, and the protected local-app selected voice client.
  - id: definition.nimi.sdks.feature-clients.permission-plane
    kind: definition
    title: SDK permission plane
    meaning: The SDK permission plane owns the sole app-facing typed projection of the Platform product-facing public permission catalog for third-party apps, covering posture reads, user-comprehensible requests, posture subscriptions, the closed catalog, public versus internal enforcement separation, one-shot and cross-app non-admission, app-private authority exclusion, and the separation of review evidence from permission.
  - id: definition.nimi.sdks.feature-clients.proposal-plane
    kind: definition
    title: SDK proposal plane
    meaning: The SDK proposal plane owns the typed consumer surface for Platform conversation-originated proposal intake, covering the sole access path, the logical operation set, record shape and closed enum preservation, fail-closed behavior when Platform operations are missing, retired alias and non-execution guards, source conversation boundaries, and app consumer projection boundaries.
  - id: definition.nimi.sdks.feature-clients.connector-auth-plane
    kind: definition
    title: SDK connector auth acquisition plane
    meaning: The SDK connector auth acquisition plane owns the host typed facade boundary for third-party managed OAuth acquisition, covering the acquisition facade, the acquisition profile table truth, and the refresh and rotation deferral, while Runtime ConnectorService retains sealed credential custody, connector create, update, probe, and consume, and provider-native execution header derivation.
  - id: definition.nimi.sdks.feature-clients.local-environment-plane
    kind: definition
    title: SDK local environment plane
    meaning: The SDK local environment plane owns the typed downstream projection of Runtime local environment plans, covering allowed projection families, dependency-first job control, asset identity preservation, non-ownership of environment readiness and source selection, and fail-closed preservation of Runtime structured failure states.
  - id: definition.nimi.sdks.feature-clients.route-plane
    kind: definition
    title: SDK route plane
    meaning: The SDK route plane owns the app-facing runtime route typed surface, covering the v2 durable target identity hard cut, the route logical operation set, the typed describe result projection and its fail-closed consumption, the selection, resolve, and health host projection boundary, and the runtime client projection boundary.
  - id: definition.nimi.sdks.feature-clients.delegation-plane
    kind: definition
    title: SDK delegated capability boundary
    meaning: The SDK may expose bounded typed projection for a separately admitted Runtime delegated capability without owning provider, session, approval, credential, firewall, execution, or audit truth; MCP and A2A clients are not current SDK capabilities and registry or type presence never claims availability.
  - id: definition.nimi.sdks.feature-clients.avatar-projection-plane
    kind: definition
    title: SDK Avatar projection plane
    meaning: The SDK Avatar projection plane provides only typed first-party Nimi Home and Avatar integration for Runtime-owned LocalAgent presentation state and Avatar-owned rendering diagnostics, with no Third-party App driver, embedded renderer, raw motion, raw expression, or LocalAgent truth surface.
  - id: definition.nimi.sdks.feature-clients.package-plane
    kind: definition
    title: SDK package plane
    meaning: The SDK package plane owns the smallest TypeScript public source and adapter boundaries required by current admitted Realm, Runtime, Character, LocalAgent, Conversation, Memory, Knowledge, AI, error, and authorization journeys.
  - id: rule.nimi.sdks.feature-clients.r001
    kind: rule
    title: Adapters never own routing decisions
    modality: must
    statement: AI adapters are independent adapter packages or core AI helper boundaries and not the removed ai-provider base SDK subpath, adapter factories bind to explicit NimiClient or Runtime-facing surfaces with app identity and Runtime construction constraints remaining governed by the client construction authority, routing and default model selection belongs to the runtime or the caller so adapters never introduce an independent provider routing table, an adapter never defaults to local or cloud when the caller provides no route policy and instead requires an explicit caller route policy or an explicit route policy from a public Runtime projection and fails closed when it is missing, and multimodal request validation including the video mode and role matrix, strong-typed TTS voice references, local image workflows, and artifact metadata checks remains a runtime-side responsibility so the adapter layer only projects public SDK and Runtime method surfaces and error results without replicating upstream request validation.
    condition: Whenever an AI adapter is constructed or routes a request.
    failure: Fail closed on missing route policy and reject independent routing tables and replicated upstream validation.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-adapter-plane
  - id: rule.nimi.sdks.feature-clients.r002
    kind: rule
    title: Job and stream projections keep upstream semantics
    modality: must
    statement: ScenarioJob-related adapter methods keep submit, query, cancel, and subscribe semantics consistent with the Runtime job surface, and streaming done and finish reasons are projected completely to the caller without silently swallowing business terminal states.
    condition: Whenever adapter job methods or stream terminals are projected.
    failure: Reject inconsistent job semantics and silently dropped terminal states.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-adapter-plane
  - id: rule.nimi.sdks.feature-clients.r003
    kind: rule
    title: Catalog and error projection follow their fact sources
    modality: must
    statement: Provider names and capability alignment take the runtime provider catalog table as their fact source, and adapter error projection reuses the SDK error projection authority without privately extending conflicting semantics.
    condition: Whenever adapters align provider capabilities or project errors.
    failure: Reject private catalogs and conflicting error semantics.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-adapter-plane
  - id: rule.nimi.sdks.feature-clients.r004
    kind: rule
    title: World generate projects as a runtime async capability
    modality: must
    statement: When the runtime admits world generation, adapters project it only as a runtime-owned async capability family, never downgrade it to an image or video alias, never introduce an app-side provider upload, poll, or fetch protocol, and leave provider-specific request shaping, connector secret ownership, and job lifecycle with the runtime authority surfaces.
    condition: Whenever world generation is projected by an adapter.
    failure: Reject alias downgrades and app-side provider protocols.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-adapter-plane
  - id: rule.nimi.sdks.feature-clients.r005
    kind: rule
    title: External framework adapters are protocol adapters only
    modality: must
    statement: Independent adapter packages may host adapters for external AI framework provider contracts including the Vercel AI SDK, the base SDK never restores the ai-provider subpath, such adapters only map framework calls such as text generation, streaming, structured output, and caller-owned tool-loop coordination onto admitted Nimi Runtime and SDK surfaces while preserving the SDK surface and boundary authorities, they never introduce an independent provider or model routing table, keep connector secrets or provider credentials outside Runtime custody, emulate unsupported tool-calling, JSON mode, cache, reasoning, usage, or stream semantics as successful parity, expose a stable OpenAI-compatible Runtime endpoint, or persist framework session, memory, or event state as Nimi canonical truth, capability gaps stay typed and visible to the caller, and framework-specific ergonomics are allowed only while Runtime, Realm, and Cognition authority remains the sole source for durable product state and enforcement.
    condition: Whenever an external framework adapter is admitted or evolved.
    failure: Reject emulated parity, secret custody escapes, and canonical-truth persistence.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-adapter-plane
  - id: rule.nimi.sdks.feature-clients.r006
    kind: rule
    title: Capability manifests answer library usability
    modality: must
    statement: Adapter capability manifests describe target-library capabilities usable through a Nimi adapter, the support field answers whether a caller using the target library can exercise the named library capability through the adapter with the closed values supported, partial, unsupported, and not-applicable, ownership and execution placement are recorded separately in the mode field, a framework-owned capability such as a caller-side tool execute callback or multi-step orchestration is never marked unsupported solely because Nimi Runtime does not own that orchestration, Runtime-owned or adapter-owned gaps remain explicit instead of hiding behind a broader target-library capability claim, and provider-defined tools, provider-executed tool calls and results, provider approval rounds, sources, and raw stream chunks are evaluated as target-library interfaces that may be marked supported when the adapter faithfully maps them to admitted Nimi SDK and Runtime contracts while individual Runtime provider routes still fail closed when they cannot preserve provider-specific semantics.
    condition: Whenever an adapter capability manifest is authored or evaluated.
    failure: Reject ownership-based unsupported markings and hidden gaps.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-adapter-plane
  - id: rule.nimi.sdks.feature-clients.r007
    kind: rule
    title: Durable framework state is classified or declared
    modality: must
    statement: Framework-held state is classified by lifetime, whether it survives beyond the current process or app session, and reconstructibility, whether it can be fully rebuilt from Nimi canonical truth plus caller-supplied input, in-process reconstructible state is orchestration ephemera the framework may hold freely without a manifest claim, state that survives across process or app-session boundaries or cannot be rebuilt from Nimi truth is durable framework state that is either promoted to the owning Runtime, Realm, or Cognition service through an admitted typed operation or declared in the adapter capability manifest as partial with an explicit framework-owned non-canonical gap note, undeclared durable framework state is a contract violation and never a default, adapters never read or write durable framework state into Nimi surfaces or present it as Nimi session, memory, event, or agent-state truth, and context capability admission is gated on this classification so any claim binding framework memory or context to Nimi Cognition owner surfaces first classifies every durable framework state cluster and the admission fails closed while any durable cluster remains unclassified.
    condition: Whenever framework-held state or context capability admission is evaluated.
    failure: Fail closed on unclassified durable state and reject undeclared durable framework state.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-adapter-plane
  - id: rule.nimi.sdks.feature-clients.r008
    kind: rule
    title: Durable AIConfig refs use the v2 compact grammar
    modality: must
    statement: SDK AIConfig durable refs use the v2 target grammar of the runtime target identity authority, targetId or profileId, localModelId, goRuntime-prefixed fields, and cloud refs without remoteModelCatalogId are retired as durable target identity, the SDK owns the host-facing validator for compact AIConfig logical refs with the allowed families being profile_slice_ref carrying source profile id, version, and digest plus a profile-local slice_id, local_runtime_target_ref carrying kind local-runtime, version v2, and exactly one of profileBindingId or readinessRef while staying non-path, non-secret, non-evidence, and resolvable only by Runtime prepare and readiness APIs, and cloud_connector_target_ref carrying kind cloud-connector with a non-secret connectorId, required remoteModelCatalogId, required providerModelId, and provider when available, connectorId plus a provider model id without remoteModelCatalogId is not an admitted durable target ref, forbidden payloads include RuntimeRouteBinding, selectedBindings runtime evidence, endpoint URLs, localModelId and goRuntime fields, providerHints, local paths, selected source records, install or materialization records, workflow binding ids, backend Python Torch or CUDA evidence, provider health, scheduler state, raw connector secrets, tokens, API keys, OAuth payloads, and credential JSON, validators fail closed on forbidden payloads for both AIProfile import and AIConfig persistence, and a legacy field name is accepted only when its payload passes the compact-ref validator and otherwise rejected rather than shimmed.
    condition: Whenever durable AIConfig refs are authored, imported, or persisted.
    failure: Fail closed on forbidden payloads and reject retired identity fields.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r009
    kind: rule
    title: The AI config operation set is fixed
    modality: must
    statement: The SDK AI config surface is fixed to typed logical operation categories, the profile catalog operations aiProfile.list, aiProfile.get, and the static schema probe aiProfile.validate, the profile apply operations aiProfile.previewApply computing a non-committing typed before-after AIConfig diff or setup-required no-live-config outcome and aiProfile.apply atomically overwriting the scope AIConfig and returning a typed result with success, failure reason, probe warnings, or setup-required no-live-config outcome where unresolved required slices never produce a live AIConfig write, the config operations aiConfig.get, aiConfig.update as a full materialized write without partial overlay, and aiConfig.listScopes applying to app, module, and feature scopes where consumers never substitute ad hoc settings objects, route override stores, or domain payload fields for the formal surface, the probe operations aiConfig.probe consuming the route health and describe surfaces, aiConfig.probeFeasibility consuming the runtime scheduler Peek aggregate SchedulingJudgement and carrying that typed aggregate state in the probe result, and aiConfig.probeSchedulingTarget consuming the atomic target judgement for submit guards and execution snapshot evidence without returning the scope aggregate judgement, and the snapshot operations aiSnapshot.record through Desktop host authority plus aiSnapshot.get and aiSnapshot.getLatest for canonical app, module, and feature scopes where consumers never define consumer-local AISnapshot schemas or local persistence as a parallel owner, host-store snapshot helpers stay storage mechanics only, production record and read operations use host persistence and fail closed when host storage is unavailable, and process-memory stores are admitted only as explicitly named test or development harnesses.
    condition: Whenever the AI config surface operation set is defined or consumed.
    failure: Reject parallel surfaces, partial overlays, and unavailable-storage success.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r010
    kind: rule
    title: Adjacent live config families stay non-authoritative
    modality: must
    statement: The SDK may expose typed mutation intent, status, readiness, and change projection for Runtime-owned LocalAgent Memory and Knowledge configuration, but never persists or infers Runtime embedding intent, binding, bank, rebuild, migration, or cutover truth from host storage, active UI selection, fixtures, or a default scope.
    condition: Whenever adjacent live config or memory embedding families are exposed.
    failure: Reject persisted intent, guessed bank owners, and second product semantics.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r011
    kind: rule
    title: The AI config surface exposes no fallback
    modality: must
    statement: The SDK AI config surface exposes no fallback knob, apply accepts no fallback allow style parameter, a failed apply returns a typed error without silent downgrade to partial config, probe results are the typed enum available, unavailable, degraded, or unknown and never a generic string reason, the probeFeasibility scheduling judgement when present is a typed AISchedulingJudgement whose state comes from the closed scheduler enum and fixedly expresses the scope aggregate judgement where denied is a hard failure rather than degraded success and unknown is returned only when the runtime lacks evaluation information and never projected as runnable, probeSchedulingTarget scheduling evidence stays typed and strictly corresponds to the requested target without substituting the scope aggregate judgement as an approximation, aiSnapshot.record requires an explicit scopeRef and the recorded snapshot scopeRef matches that canonical scope without implicit fallback to a chat scope when the caller omits it, raw route, scheduler peek, and runtime local profile install and probe surfaces are opaque low-level dependencies that consumers never treat as the product-facing AIConfig or AISnapshot surface, and low-level host store helpers may expose an explicitly named ephemeral store for test and development harnesses only so that when host storage is unavailable and that harness mode is not enabled every AIConfig persistence operation including has, load, save, and listScopeKeys fails closed without fallback terminology or silent degradation into process memory.
    condition: Whenever AI config operations report results or persistence runs.
    failure: Fail closed without fallback knobs, partial configs, or silent degradation.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r012
    kind: rule
    title: Scope parameters are canonical AIScopeRef only
    modality: must
    statement: SDK AI config scope parameters uniformly use the canonical AIScopeRef, the SDK never defines its own scope identity schema, accepts only AIScopeRef values produced by the canonical factory and never arbitrarily concatenated scope keys, never attaches consumer-local fields onto an AIScopeRef, and requires every AIConfig surface call to pass an explicit scopeRef without implicit fallback to a desktop chat scope or any other consumer-default scope when the caller omits it.
    condition: Whenever a scope parameter enters the AI config surface.
    failure: Reject non-canonical scope keys and implicit default scopes.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r013
    kind: rule
    title: Descriptor formation carries no runtime evidence
    modality: must
    statement: The SDK exposes a typed bridge from AIProfile to a runtime-facing descriptor through aiProfile.formRuntimeDescriptor projecting portable AIProfile capability slices and app, module, or feature requirement declarations into a contract-bound descriptor, the legacy resolveLocalDependencies semantics are superseded as an authority boundary so a retained helper name may only form the same descriptor without pre-resolving runtime materialization facts, descriptor formation may include portable profile refs, source profile digest, slice ids, capability ids, execution mode, authored execution backend and model family constraints, a cloud connector non-secret selector, asset and source binding refs, ordered companion occurrence refs, params and editable fields, and requirement ids, descriptor formation never includes RuntimeRouteBinding, selectedBindings runtime evidence, local paths, local asset ids as portable truth, selected source records, install or materialization evidence, workflow binding ids, backend package Python Torch or CUDA evidence, provider health, scheduler state, endpoint values, raw connector secrets, tokens, API keys, or credential payloads, Runtime independently validates, prepares, materializes, and projects readiness from the descriptor so SDK and host request formation is never runtime support truth, selected-source truth, or materialization truth, and the SDK exposes no bare runtime descriptor constructor to apps because apps produce descriptors only through the admitted AIProfile plus requirement declaration bridge path.
    condition: Whenever a runtime-facing descriptor is formed.
    failure: Reject runtime evidence in descriptors and bare descriptor constructors.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r014
    kind: rule
    title: AI config transport is host-local with subscriptions
    modality: must
    statement: App-owned AI configuration intent may use the owning host persistence and typed subscriptions, while Runtime-resolved provider credentials, route, model selection, readiness, usage, Quota, Budget, Rate Limit, LocalAgent AI configuration, Memory, and Knowledge state remain Runtime projections; the SDK never persists Runtime execution evidence or wraps a private loopback endpoint as a product API.
    condition: Whenever AI config transport or change subscriptions are composed.
    failure: Reject daemon CRUD RPCs, forbidden persisted payloads, and loopback wrappers.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r015
    kind: rule
    title: First-run evidence refs stay opaque and verified
    modality: must
    statement: SDK helpers for first-run built-in AIConfig finalization require explicit canonical AIScopeRef values preserving the exact desktop.chat.nimi and desktop.chat.agent identities, returned builtInAiConfigRefs are host or backend issued durable evidence refs that the product-control admission backend verifies through Desktop host AIConfig authority and SDK callers never mint or validate by string shape, the SDK keeps accountDefaultProfileRef, runtimeBaselineRef, and executionEvidenceRef opaque and typed with verification belonging to RuntimeAccountService, RuntimeLocalService, Runtime execution evidence, and product-control admission, a verified Runtime executionEvidenceRef capability proof is consumed only as readiness and admission evidence for first-run built-in finalization without projecting Runtime proof fields into AIConfig selected bindings or any RuntimeRouteBinding-like live config shape, the committed AIConfig is produced by the descriptor and apply projection and contains only admitted compact logical refs and params, the SDK never accepts renderer or localStorage values, app-local caches, route-health probes, file paths, or caller-provided strings as sufficient first-run readiness evidence, never exposes a fallback chat scope or infers the chat scopes from an omitted scope, never derives first-run built-in AIConfig provider, engine, model, or consumer bindings from runtimeBaselineRef activation consumers because binding projection consumes Runtime execution evidence proof, and never copies executionEvidenceRef, runtimeBaselineRef, runtimeConsumerId, route endpoints, local model ids, goRuntime fields, or selected-source evidence into AIProfile or AIConfig.
    condition: Whenever first-run built-in AIConfig finalization is performed.
    failure: Reject minted refs, inferred scopes, and copied evidence fields.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r016
    kind: rule
    title: Profile apply preview is typed and non-committing
    modality: must
    statement: The SDK exposes aiProfile.previewApply computing for a canonical AIScopeRef and catalog profile a typed before-after AIConfig diff plus probe and feasibility warnings, the typed preview result carries at least before as the current scope AIConfig or explicit null on first apply, after as the full materialized target AIConfig under overwrite semantics when required slices are ready and apply-eligible and explicit null for setup-required or no-live-config outcomes, a closed outcome enum of ready_to_apply, setup_required_no_live_config, unsupported_no_live_config, invalid_profile, invalid_requirement, stale_base, and failed, an optional setupProjection returning typed unmet requirement, blocking capability, action ref, and reason-code projection for no-live-config outcomes, a typed before-after diff structure covering capabilities, profileOrigin, and other materialized fields, a baseVersion recording the config version or content hash the before state is based on so the caller can judge preview freshness before commit, and probe and feasibility warnings aligned to the typed probe enums and scheduling judgement shape, previewApply is non-committing so it never writes live AIConfig, never triggers subscribe notifications, never records an AISnapshot, never implicitly commits, and never caches the preview as the authoritative input of a later apply because commit stays an explicit aiProfile.apply call, previewApply exposes no fallback knob, fails closed with a typed error on invalid profile or config schema without partial diffs or truncated after values, keeps warnings typed enums, returns unresolved required slices, missing connector credentials, missing manual associations, and unsupported backend or model families as no-live-config outcomes rather than advisory warnings, requires an explicit canonical AIScopeRef without implicit chat-scope fallback, and live AIConfig changes between preview and commit expire the baseVersion so apply resolves through scope-level compare-and-swap protection and the SDK never uses an expired preview after value to bypass commit-side version validation.
    condition: Whenever a profile apply preview is computed or consumed.
    failure: Reject implicit commits, partial diffs, and expired-preview bypasses.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r017
    kind: rule
    title: First-launch app AIConfig initialization is fixed
    modality: must
    statement: A Nimi App app-scope AIConfig is initialized on first launch only, an SDK helper for this finalization requires an explicit canonical app-shaped AIScopeRef and never infers it, on first launch with no existing AIConfig the helper initializes from the app recommended profile declared by the registry row ai_profile_selection_ref only when that reference is declared, resolves to an admitted factory AIProfile, and its manifest requirements validate as satisfied, when the recommended profile is undeclared, unresolvable, or unsatisfied the helper initializes from the Account Default Profile, initialization goes through the typed aiProfile.apply overwrite path producing a full materialized AIConfig and never a partial overlay, when neither a satisfied recommended profile nor a resolvable Account Default Profile is available the helper fails closed with a typed error and never launches with a synthesized, empty, or placeholder AIConfig, when the app scope already has an AIConfig the helper treats initialization as complete and returns the existing config unchanged, when the app finds materialized requirements unmet the helper returns a typed setup or repair plan without silently mutating the profile, the app scope AIConfig, or factory profile templates to force a pass, unsatisfiable required requirements return a typed setup-required no-live-config projection preserving any existing valid AIConfig unchanged while dependent app AI surfaces open unavailable or setup-required rather than with a synthesized placeholder config, the helper never overwrites, merges into, resets, or mutates an existing per-app AIConfig on any later launch even when the Account Default Profile or registry selection ref changes, exposes no fallback knob, never downgrades a fail-closed result to a partial config or projects initialization failure as launch success, never accepts renderer or localStorage values, app-local caches, caller-provided strings, route-health probes, or file paths as substitutes for resolved profile evidence, and initialization is never performed by the runtime install path because install handles package readiness only and never mutates AIConfig.
    condition: Whenever per-app first-launch AIConfig initialization runs.
    failure: Fail closed without placeholder configs and reject re-initialization and fallback knobs.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r018
    kind: rule
    title: Requirement declarations follow the schema table
    modality: must
    statement: The SDK owns the typed declaration contract for app, module, and feature AI capability requirements distinct from Runtime local environment activation consumers, the field-level schema owner is the ai-config-capability-requirements table with the rule owning only semantics, authority split, and fail-closed behavior and any prose field overview staying non-normative and subordinate to that table, the SDK validates requirement declarations before previewApply, apply, and first-launch initialization, declarations conform to the table and schema evolution amends the table rather than duplicating fields, Kit may consume the declaration for trimming UI and editable controls without owning readiness, materialization, execution backend, model family, source selection, or setup state, the Runtime activation consumer id is only a downstream readiness and materialization consumer never conflated with the requirement owner or used as an AIScopeRef, required slices with unresolved readiness produce setup-required no-live-config while optional slices with unresolved readiness are omitted from live AIConfig and projected as optional unavailable, SDK, Kit, Desktop, and apps never replace the declaration with a flat enabled-capability list, a runtimeReady boolean, app-local manifest shadow truth, or the Runtime activation consumer table, and declarations never contain local paths, selected source records, materialization evidence, route bindings, provider health, scheduler state, or connector secrets.
    condition: Whenever capability requirement declarations are authored or validated.
    failure: Reject parallel schemas, shadow truth, and forbidden declaration payloads.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.ai-config-plane
  - id: rule.nimi.sdks.feature-clients.r019
    kind: rule
    title: The app client is the sole admitted access path
    modality: must
    statement: The SDK Nimi App client surface is the only admitted typed path for apps, developers, and the Desktop hosted shell to consume the verified catalog, account inventory, Runtime local-record status, and the host-injected local-app carrier, and apps, developers, and shells never bypass the SDK to read or write the Platform nimi-app-registry table directly, call Runtime app registration private RPCs directly, privately implement installer, package-manager, or source-selector logic, or select principal, launch, account, grant, or session through an app id, path, manifest, renderer metadata, or SDK argument.
    condition: Whenever app catalog, inventory, record, or carrier data is consumed.
    failure: Reject bypass paths and caller-side authority selection.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r020
    kind: rule
    title: The inventory operation set is fixed and read-only
    modality: must
    statement: The 0K SDK exposes the inventory logical operations app.list returning the unified Apps inventory visible to the current user composed from the Platform ordinary catalog source, the Runtime authenticated account inventory source, and the Runtime local-record source with sources preserved and never inferred from each other, app.get returning a single app inventory entry with source, state, and action projection, app.status returning app health and repair projection state, and app.subscribe subscribing to app lifecycle events as a host-local event stream, while the 0K Nimi App client exposes no app.install, app.update, app.uninstall, app.launch, app.healthRepair, import, promotion, or package job mutation, immutable readiness returns only typed unavailable through the package readiness accessor, and local-development launch is native-host initiated and never an SDK app-id call.
    condition: Whenever the app inventory operation set is defined or consumed.
    failure: Reject mutation operations and inferred sources.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r021
    kind: rule
    title: The SDK exposes no launch selector
    modality: must
    statement: Local-development launch is executed only by the verified native local_app_control supervisor performing PrepareLocalAppLaunch, process bind, and request-empty session open, SDK and app code only consume the already injected carrier, and the SDK never exposes an app-id, path, scope, package, or host selector to create or recover a local-app session and never infers launch authority from active chat, renderer state, a default scope, or a manifest.
    condition: Whenever local-app launch or session creation is approached.
    failure: Reject SDK launch selectors and inferred launch authority.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r022
    kind: rule
    title: The app client owns no installer or marketplace truth
    modality: must_not
    statement: The SDK Nimi App client surface owns installer, package-manager, PATH, or source-selector logic, marketplace, economy, review, or kill-switch truth, Nimi App admission decisions belonging to the Platform admission authority, runtime registration, sandbox, or process supervision truth belonging to Runtime, or GitHub, npm, or source workspace discovery truth.
    condition: Whenever app client ownership boundaries are evaluated.
    failure: Reject ownership claims over installer, marketplace, admission, supervision, or discovery truth.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r023
    kind: rule
    title: Projection states are typed and fail-closed
    modality: must
    statement: Every app client logical operation returns typed projection state aligned with the Platform health and repair fail-closed semantics, ready is never inferred from transfer completion, endpoint reachability, process liveness, or file existence, and multiple fail-closed reasons are never collapsed through a generic unavailable.
    condition: Whenever app projection states are produced.
    failure: Reject inferred readiness and collapsed reasons.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r024
    kind: rule
    title: The app client reuses the projection families
    modality: must
    statement: The SDK Nimi App client surface reuses the AI config surface and runtime local environment typed projection paths, expresses factory AIProfile selection and runtime local environment bindings consistently through those projections, never introduces a second projection family, and never exposes raw runtime, realm, or cognition transport.
    condition: Whenever app client projections are composed.
    failure: Reject second projection families and raw transport exposure.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r025
    kind: rule
    title: The app client exposes no fallback knob
    modality: must
    statement: App client errors return typed errors following the AI config no-fallback pattern, the surface exposes no fallback allow style parameter, never silently degrades to partial install or partial launch, and never hides a Runtime fail-closed state as success.
    condition: Whenever app client errors are returned.
    failure: Reject fallback knobs, partial degradation, and hidden fail-closed states.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r026
    kind: rule
    title: App subscriptions carry projection events only
    modality: must
    statement: app.subscribe carries only catalog, account, and local-record projection events such as source degraded, record active, dormant, or removed, and session or grant posture changed typed events, and the subscription never carries audit, permission, or spend events because the permission fabric and Realm audit own audit truth.
    condition: Whenever app subscription events are emitted.
    failure: Reject audit, permission, and spend events on the app subscription.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r027
    kind: rule
    title: Catalog sources project ordinary-visible rows only
    modality: must
    statement: The app.list catalog source and Desktop Apps consumers project only catalog-sourced apps whose registry row resolves as ordinary visible with admission_status admitted, ordinary_visibility ordinary-visible, an admitted package kind, a resolving release descriptor, and resolving trust, runtime, permission, and storage policy refs, Avatar never appears from the catalog source for ordinary Apps even when an internal registry row exists for bundled package and update coordination, the SDK never exposes unadmitted workspace apps, app-local spec rows, Avatar hidden-internal rows, or source-discovered packages as catalog Apps, and account inventory and local-record sources are admitted separately and never relabeled as ordinary catalog truth.
    condition: Whenever catalog-sourced apps are projected.
    failure: Reject non-ordinary rows, hidden rows, and relabeled sources.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r028
    kind: rule
    title: Immutable package mutation is unadmitted
    modality: must
    statement: Verified release descriptors are read-only discovery and review input in 0K, the SDK may project catalog metadata but cannot download, inspect, unpack, register, install, import, update, promote, rollback, repair, or execute an immutable artifact, those operations are absent from the Nimi App client with Runtime package readiness mapping to typed unavailable, and the SDK never performs direct npm install, npx, GitHub clone, source build or run, lifecycle script execution, digest-only admission, or local file scanning as package truth.
    condition: Whenever immutable package operations are approached.
    failure: Return typed unavailable and reject direct package execution paths.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r029
    kind: rule
    title: Private storage is principal-keyed and rootless
    modality: must
    statement: Runtime private storage is partitioned by the inherited local_app_principal_id and never by app id, the local-app SDK carrier exposes no absolute root or root accessor, its only admitted storage surface is the exact JSON operation set of the app storage partition projection with all other storage and file operations remaining typed unavailable, the SDK never constructs or returns nimi-data apps app-id paths, accepts a principal selector, inspects Runtime config, or infers storage from filesystem existence, and tombstoned data is delete-only owner state that the SDK cannot rebind.
    condition: Whenever local-app private storage is accessed or projected.
    failure: Reject root accessors, principal selectors, and tombstone rebinds.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r030
    kind: rule
    title: Manifest permissions declare eligibility only
    modality: must
    statement: The developer-authored manifest may carry only a permissions list of id and reason entries using admitted rows from the Platform public permission catalog, the verified registry projects the same list as permission_requirements and release descriptors may reference the reviewed list through permissions_ref, declaration is request eligibility and review transparency and never authority, the runtime app client exposes no legacy scope or qualifier carriers and never derives live permission posture from a manifest or descriptor, live status and requests use only the host-injected permissions.status by permission id and permissions.request with permission id and reason surface, current posture comes from the row's single decision owner and an app declaration, trust tier, review result, app id, or prior success cannot manufacture granted, the SDK rejects unknown, reserved, or non-admitted permission ids before a positive request and never exposes AIScopeRef, scopeFamily, scopeName, qualifier, internal operationId or resourceRef, selector fingerprints, or owner grant identifiers, and base entitlements and app-owned authority are forbidden from manifest permission declarations and remain usable without a permission request.
    condition: Whenever manifest permission declarations or live posture are consumed.
    failure: Reject manufactured grants, legacy carriers, and internal identity exposure.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r031
    kind: rule
    title: Destructive local-app data deletion is unadmitted
    modality: must
    statement: 0K admits no immutable uninstall and no SDK delete-data prompt or action, a local-app principal tombstone leaves retained durable data as Runtime-owned delete-only state that reinstall, reauthorization, the same app id, the same project, or SDK inventory composition cannot rebind, the SDK never exposes app.uninstall, force-delete, a retain-or-delete choice, an absolute data path, a size-derived deletion decision, direct filesystem mutation, or pseudo-success cleanup, and a future deletion surface requires its own Runtime owner operation, fresh presence, impact preview, principal-bound target, and positive and negative evidence without reshaping the 0K principal and record seam.
    condition: Whenever local-app data deletion is approached.
    failure: Reject deletion surfaces, rebinds, and pseudo-success cleanup.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r032
    kind: rule
    title: No callable file-API client exists
    modality: must
    statement: The SDK Nimi App client surface admits no callable file-API client in the current public SDK, the consumer-side operations file.read, file.write, file.list, file.delete, and file.move are explicitly non-admitted and never exposed as active SDK APIs, the former app-local-drafts, file.read.scoped, and file.write.scoped permission vocabulary is retired, no generic Runtime-mediated file API is admitted, the three exact JSON storage operations are not a file client because they accept no bytes, directory, move, raw delete, mode, range, root, or absolute-path input, the SDK never maps retired file-scope grants to hidden Runtime methods, Desktop bridge helpers, Realm REST calls, generic HTTP proxy calls, or direct filesystem paths, missing file client support is a fail-closed non-admission state and never a fallback to another transport, the SDK exposes no legacy file-scope declaration or grant projection, and future external-file access can be admitted only through the files.open and files.save one-shot picker rows and their owner-issued handles.
    condition: Whenever file-API access is requested from the app client.
    failure: Fail closed on non-admission and reject hidden mappings and legacy projections.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r033
    kind: rule
    title: The review-evidence accessor is read-only
    modality: must
    statement: The SDK Nimi App client surface admits a typed read-only accessor over the admitted release descriptor review block exposing the platform-owned typed fields decision as the closed enum approved, revision-requested, rejected, or kill-switched, adjudicator_kind as the closed enum human or nimi-automated-gate, adjudicator_ref as a string reference to a reviewer policy or human reviewer identifier, and decided_at as the terminal-decision timestamp owned by the review record, the accessor returns the descriptor terminal review-decision record as admitted and serves the Apps first-level review status display and Desktop hosted shell admission-trail UX, the accessor is admitted in the app client surface and not in the permission client because the review-decision record is an admission-evidence accessor over the admitted release descriptor and not a permission grant lifecycle accessor, the accessor never drives policy so it never gates app launch, install, or grant requests and never alters app.list ordinary-visibility filtering or Apps-surface visibility decisions because launch, admission, and grant lifecycle keep their own authorities, the rule never redefines the platform decision schema, extends the decision or adjudicator enums, or introduces a parallel review record differing from the admitted descriptor review block, collapsing any two of the four typed fields into one accessor field is a forbidden parallel-truth projection, and the accessor never exposes the three upstream audit-evidence references audit_evidence_ref, ai_audit_model_ref, and scanner_results_ref under this rule because upstream evidence-record consumer surfaces are out of scope and not part of the first-level Apps display.
    condition: Whenever the review-evidence accessor is exposed or consumed.
    failure: Reject policy driving, schema redefinition, field collapsing, and upstream evidence exposure.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r034
    kind: rule
    title: Generated-app auth composition is closed
    modality: must
    statement: The SDK admits the root createNimiClient composition path for generated Nimi app auth and client construction, the local-app branch returns only the bounded local-app surface and admits exactly the public names createNimiClient, NimiClientConfig, NimiClientLocalAppConfig, NimiLocalAppClient, NimiLocalAppStandardShell, NimiAppAuthMode, NimiAppAuthProjection, NimiAppAuthUnavailable, and NimiAppLocalSessionProjection, NimiAppAuthMode is the closed mode set local-first-party-app and local-app, local-first-party-app is available only to the retained bundled first-party composition and cannot be selected by a third-party app, project, manifest, fixture, or mode string or inferred from Desktop launch with shipped Zhiyu and Avatar remaining bundled and an isolated Zhiyu integration build using local-app instead, local-app maps only to the Runtime LOCAL_APP caller where the SDK receives a host-injected typed standard-shell carrier and projects session status, public permission posture and request, and app-private JSON storage while never receiving principal, record, or permission-decision identifiers, launch material, process proof, endpoint, bearer, or authorization metadata, a valid session projects as session-bound independently of every permission so base entitlements may work while protected permissions remain unavailable, NimiAppAuthProjection distinguishes session-bound, action-required, revoked, project-changed, process-replaced, account-changed, Runtime-restarted, and unavailable states with permission posture exposed only through the separate product permission client and never changing session state, NimiAppAuthUnavailable is the typed fail-closed branch for an absent carrier, failed principal or record resolution, unavailable custody, or an unavailable operation owner, no mode accepts app-owned access tokens, refresh tokens, session stores, subject providers, direct Realm login credentials, refresh-token providers, raw JWTs, decoded subject fields, or any app-controlled token custody as input, generated third-party and developer auth never calls the Realm auth login or refresh routes, SDK Realm login routes, or direct Realm token exchange as app auth truth, later-admitted Realm data access comes through an exact Runtime-owned protected operation with no mode holding a short-lived token exception, and local-app never uses mock auth, disabled gates, anonymous subject fallback, fixture-mode success, direct daemon access, or first-party self-declaration and never becomes local-first-party-app by setting a mode string, app id, app instance id, workspace profile, package metadata, or Desktop launch metadata.
    condition: Whenever generated-app auth or client composition is constructed.
    failure: Fail closed on absent carriers and reject app-owned tokens, Realm bypasses, and pseudo-success.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r035
    kind: rule
    title: App storage projection is an exact JSON set
    modality: must
    statement: A Local App may use bounded typed App-private JSON storage as a base entitlement under the current Runtime-derived principal, session, and account partition, while SDK receives no storage root, absolute path, principal identifier, quota authority, generic file operation, binary storage, directory access, or authority-bearing selector; Runtime enforces canonical relative paths, resource bounds, filesystem safety, atomic writes, and idempotent removal according to the owning implementation contract.
    condition: Whenever app-private storage operations are exposed or invoked.
    failure: Reject root and selector inputs and keep non-admitted operations typed unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r036
    kind: rule
    title: Package readiness is typed unavailable in 0K
    modality: must
    statement: The SDK exposes typed app package readiness access backed by Runtime GetAppPackageReadiness, in 0K immutable package, install, update, and promotion readiness returns typed unavailable while opaque lineage, attestation, revision, execution-profile, and digest slots stay inside Runtime, the SDK never exposes those opaque internal refs as a positive package assertion, never scans Runtime-owned install-evidence files, never infers package readiness from file existence, and never treats Desktop or Kit bridge evidence as canonical package truth, and SDK orchestration here stays non-authoritative by submitting explicit typed requests to Runtime and mapping the Runtime projection without hiding fail-closed states.
    condition: Whenever app package readiness is accessed.
    failure: Reject positive package assertions and evidence scanning.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r037
    kind: rule
    title: Account inventory truth is Runtime-resolved
    modality: must
    statement: The SDK exposes typed access, request builders, response parsers, and decoders for Runtime GetAccountAppInventory, the Runtime request carries no app-supplied or renderer-supplied account id because Runtime resolves the authenticated account binding and validates the projection, account visibility and local record state remain separate with the 0K local states not-present, local-record-active, local-record-dormant, and removed and immutable package install state unavailable until 0P or P, an account verified row without local materialization remains a valid catalog row, and the SDK never reads the account apps inventory JSON file, infers account directories, or converts absent or corrupt inventory state into success while SDK helpers may preserve the explicit exists-false response and parse present records because Runtime owns account app-inventory validation, writes, and fail-closed reason codes.
    condition: Whenever account app inventory is accessed or parsed.
    failure: Reject caller-supplied account ids and success conversion of absent state.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r038
    kind: rule
    title: Inventory entries compose deterministically
    modality: must
    statement: NimiAppClient.list returns NimiAppInventoryEntry values each carrying the appId and display metadata, the optional catalog, account, and local sources, and closed trustTier, installState, openReadiness, activeJobs, nextActions, and typed reasonCode and detail fields, catalog and account composition is deterministic by appId while distinct local records are deterministic by their Runtime-issued opaque record reference and never merge merely because their display appId matches, a source failure emits a typed source-degraded projection and never fabricates entries from another source while valid entries from other sources may remain visible only with the source-degraded reason preserved, and the SDK never collapses account entitlement, local records, and ordinary catalog admission into a single installed or ready boolean and never infers account visibility from install evidence or a local record from file existence.
    condition: Whenever the unified apps inventory is composed.
    failure: Reject fabricated entries, merged records, and collapsed booleans.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r039
    kind: rule
    title: Local records project without identity leakage
    modality: must
    statement: The SDK exposes read-only typed status for the current host-injected local-app carrier covering trust class, record state, session state, public permission posture, and typed reason, the projection omits local_app_principal_id, lineage, SID partition, launch, process, and session identifiers, permission-decision identifiers and revisions, digests, and provenance-attestation refs, the SDK exposes no workspace-adoption, install, import, promote, or repair accessor in 0K, immutable positive package materialization remains typed unavailable until 0P or P, and SDK, Desktop, and apps never scan workspaces or infer a record from a manifest, path, app id, or file existence.
    condition: Whenever local app records are projected.
    failure: Reject identity leakage and inferred records.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r040
    kind: rule
    title: Local-app bootstrap custody is bounded
    modality: must
    statement: The Local App SDK bootstrap accepts only the verified host-injected shell integration and exposes typed session posture, product permission posture and request, App-private storage, and admitted business operations; it exposes no account, principal, authorization decision, credential, Realm JWT, Provider Credential, Runtime proof, endpoint, generic method forwarding, or host security material, and App-native data and product commands remain App-owned.
    condition: Whenever the local-app bootstrap surface is constructed or consumed.
    failure: Fail closed on missing carriers and reject authority material in input or output.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r041
    kind: rule
    title: Desktop Open Intent is a data surface only
    modality: must
    statement: The SDK app subpath exposes NimiDesktopOpenIntent, NimiDesktopOpenEnvelope, parser, and type guard surfaces for the Platform Desktop Open Intent protocol, the SDK is the TypeScript semantic parser owner whose behavior matches the desktop-open-intent golden vectors table, the SDK never exposes an opener or imports Kit, Electron, Tauri, browser globals, OS opener code, Desktop private bridge code, or Runtime private boundaries because apps call Desktop Open Intent through Kit standard shell hosts and not through the SDK, and SDK Desktop Open Intent data never carries auth, session, or token material, provider, model, or connector credential truth, Runtime caller identity, or executable LocalAgent truth.
    condition: Whenever Desktop Open Intent surfaces are exposed or parsed.
    failure: Reject opener exposure and forbidden payloads.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r042
    kind: rule
    title: Local App voice consumption stays Runtime owned
    modality: must
    statement: When separately admitted for a Local App, voice input or output is a typed Runtime LocalAgent projection preserving LocalAgent and Conversation continuity; SDK and Kit never select provider, model, route, fallback, prompt, identity, credential, or Avatar control, never create durable voice truth, and fail closed when authorization, readiness, correlation, or Runtime stream truth is unavailable.
    condition: Whenever the local-app selected voice client is exposed or invoked.
    failure: Fail closed with the typed error envelope and reject forbidden fields and constructed calls.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.app-client-plane
  - id: rule.nimi.sdks.feature-clients.r043
    kind: rule
    title: The permission client is the sole public path
    modality: must
    statement: When a public permission slice is completely admitted, the SDK permission client is the only public path for an app to query its own posture, initiate a user-comprehensible request, and subscribe to its own posture changes, the transport is injected by Kit or the native host and derives app, account, principal, and OS-user identity from the protected carrier, and apps never directly call Realm grant REST, Runtime private grant RPCs, or Cognition private endpoints and never read or write the grant ledger through bridge implementation details.
    condition: Whenever public permission posture is queried, requested, or subscribed.
    failure: Reject direct grant paths and bridge ledger access.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.permission-plane
  - id: rule.nimi.sdks.feature-clients.r044
    kind: rule
    title: The permission operation set is minimal
    modality: must
    statement: The SDK permission logical surface is fixed to permission.status returning one public posture of the calling app for a public id, permission.request initiating one public permission request with permission id and reason where an owner-owned picker takes over when a selector is needed, and permission.subscribe subscribing to posture changes of the calling app for that id, the ordinary app surface exposes no scope-wide list, get by grant id, revoke by grant id, grant history, raw lifecycle, or other-app rows, user revocation and audit management belong to Desktop Settings, and a future app-initiated release is admitted only as an independent public semantic operation without reusing raw grant ids.
    condition: Whenever the permission client surface is defined or consumed.
    failure: Reject grant lifecycle operations and raw grant id reuse.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.permission-plane
  - id: rule.nimi.sdks.feature-clients.r045
    kind: rule
    title: Request input is permission id plus reason
    modality: must
    statement: Permission request input is exactly a permissionId plus a reason where the reason is a bounded user-facing explanation and never authority, app, account, principal, session, and OS-user anchors derive from the protected carrier, selectors and selector digests derive from the catalog-designated owner picker, and public SDK inputs, types, and exports never contain AIScopeRef, scopeFamily, scopeName, qualifier, operationId, resourceRef, grantId, raw account, principal, or session identity, tokens, or credentials.
    condition: Whenever a permission request is composed.
    failure: Reject authority-bearing inputs and forbidden identity fields.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.permission-plane
  - id: rule.nimi.sdks.feature-clients.r046
    kind: rule
    title: The permission catalog is closed
    modality: must
    statement: PermissionID contains only stable product ids admitted by the Platform public permission authority, reserved or future ids remain typed unavailable, and the current LocalAgent interaction permission allows only owner-selected LocalAgent Conversation operations without account-wide LocalAgent inventory, caller-built selectors, principal substitution, direct Avatar control, embedded rendering, or authority over App launch, private storage, host commands, or App-owned UI.
    condition: Whenever permission ids are validated for status or request.
    failure: Fail closed before transport on reserved or unadmitted ids.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.permission-plane
  - id: rule.nimi.sdks.feature-clients.r047
    kind: rule
    title: Posture is public and never grant lifecycle
    modality: must
    statement: The app-facing posture closed set is prompt, pending, granted, denied, and unavailable returning at least permissionId, posture, and canRequest, the SDK fails closed when the transport returns unknown values, mismatched ids, positive posture for reserved ids, or missing fields, the owner lifecycle values expired, revoked, and superseded plus revision, fingerprint, and transition history never become ordinary app API, and the SDK never projects a missing record, transport error, or reserved id as granted.
    condition: Whenever permission posture is projected.
    failure: Fail closed on unknown or mismatched values and reject granted fabrication.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.permission-plane
  - id: rule.nimi.sdks.feature-clients.r048
    kind: rule
    title: No fallback and no parallel ledger
    modality: must
    statement: Permission failures return typed actionable errors, and the SDK never provides a fallback allow parameter, a default scope, an implicit current app, a client-side optimistic grant, an offline allow, a merged Realm and Runtime double ledger, or a treatment of publish or review trust as permission.
    condition: Always.
    failure: Reject fallback grants and parallel ledgers.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.permission-plane
  - id: rule.nimi.sdks.feature-clients.r049
    kind: rule
    title: Public and internal enforcement stay separate
    modality: must
    statement: One public permission may be mapped by its owner to multiple exact operations, resource checks, quotas, budgets, rates, presence, and audit events with those mappings remaining in the owner backend, and the SDK and renderer see only the public id, reason, public posture, and owner-hosted picker flow and never request item by item per method, anchor, turn, stream, or app-private file.
    condition: Whenever permission enforcement mappings are consumed.
    failure: Reject internal mapping exposure and per-item requests.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.permission-plane
  - id: rule.nimi.sdks.feature-clients.r050
    kind: rule
    title: One-shot and cross-app rows stay reserved
    modality: must
    statement: The files.open, files.save, artifacts.open, and shared_resources.open rows are currently reserved one-shot rows, and until the owner picker, non-forgeable handle, consume semantics, and audit are atomically admitted the SDK exposes no callable file or cross-app shortcut, target app id, path, or generic durable grant.
    condition: Whenever one-shot or cross-app permission rows are approached.
    failure: Reject shortcuts and durable grants before atomic admission.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.permission-plane
  - id: rule.nimi.sdks.feature-clients.r051
    kind: rule
    title: App-private authority is not permission
    modality: must
    statement: Nimi-mediated private JSON storage is the app.private_storage base entitlement, app-built SQLite, media, settings, cache, routes, and exact native commands are app_owned_authority, ordinary filesystem, network, process, and device authority is an os_right, none of the three enters PermissionID, manifest permission requests, the grant ledger, or user approval UI, and SDK storage and host-command helpers still depend on the live protected carrier, opaque principal and account partition, and path, quota, symlink, origin, and payload checks because not being a user permission does not mean having no security boundary.
    condition: Whenever app-private authority classes are classified or consumed.
    failure: Reject permission-catalog entry of excluded classes and unchecked helper access.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.permission-plane
  - id: rule.nimi.sdks.feature-clients.r052
    kind: rule
    title: Review evidence never enters permission
    modality: must
    statement: The release review and attestation accessor belongs to the app client admission-evidence surface and never appears in permission posture, permission requests, subscriptions, or owner grant lifecycle, the review decisions approved, revision-requested, rejected, and kill-switched and the public permission posture and lifecycle vocabularies are mutually exclusive, and a review result never seeds or enlarges a grant.
    condition: Whenever review evidence meets permission surfaces.
    failure: Reject review-driven grants and vocabulary mixing.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.permission-plane
  - id: rule.nimi.sdks.feature-clients.r053
    kind: rule
    title: Proposal intake goes through the SDK only
    modality: must
    statement: Apps that create or read conversation-originated proposal intake records go through the SDK proposal-intake client surface, direct app-level REST calls, local files, renderer storage, private Runtime imports, and app-local proposal stores are not admitted, and the SDK surface exposes no app-local bypass for Zhiyu or any other first-party app.
    condition: Whenever proposal intake records are created or read.
    failure: Reject bypass paths and app-local stores.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.proposal-plane
  - id: rule.nimi.sdks.feature-clients.r054
    kind: rule
    title: Proposal operations never execute
    modality: must
    statement: The SDK proposal-intake client admits the logical operations proposal.create submitting a typed proposal draft to the Platform proposal operation and returning a typed proposal intake record, proposal.get optionally reading a proposal record when the Platform operation is available, and proposal.transition optionally submitting an owner-reviewed state transition when the Platform operation is available, and these operations never install, execute, download, register, grant permission, run code, select provider or model, or promote release state.
    condition: Whenever proposal operations are defined or invoked.
    failure: Reject execution, installation, and grant side effects.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.proposal-plane
  - id: rule.nimi.sdks.feature-clients.r055
    kind: rule
    title: Proposal records mirror Platform authority
    modality: must
    statement: SDK proposal records preserve the Platform field set as typed SDK fields covering proposalId, proposalKind, sourceConversationAnchorId, requesterSubjectRef, ownerDomain, requestedCapabilityRef, riskTier, requiredPermissionRefs, nextReviewStep, state, reasonCode, auditRef, and createdAt, the SDK never collapses owner, risk, permission, next review step, state, or audit fields into a generic text blob, the SDK preserves the closed Platform proposal kind set and the closed Platform state set as typed unions or equivalent enums, and unknown kinds or states are never accepted as opaque strings and fail closed.
    condition: Whenever proposal records are typed or decoded.
    failure: Fail closed on unknown values and reject collapsed fields.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.proposal-plane
  - id: rule.nimi.sdks.feature-clients.r056
    kind: rule
    title: Missing Platform operations fail closed
    modality: must
    statement: When no Platform proposal operation is available, proposal.create, proposal.get, and proposal.transition fail closed with a typed SDK error and never synthesize a durable proposal record, audit reference, or state transition, and the SDK never fabricates a proposalId, auditRef, or accepted-for-admission state to make a UI path appear successful.
    condition: Whenever a Platform proposal operation is unavailable.
    failure: Fail closed with typed errors and reject fabricated records.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.proposal-plane
  - id: rule.nimi.sdks.feature-clients.r057
    kind: rule
    title: Retired aliases and execution fields are rejected
    modality: must
    statement: The SDK rejects drafts and returned records that route a proposal through a retired mod-extension alias family unless the proposal kind is rejected_request or the state is blocked or rejected with a typed reason, rejects drafts and returned records carrying execution, provider or model, install, download, local path, or hidden command fields, and never turns a proposal into executable Runtime, Workflow, app, package, or delegated-tool behavior.
    condition: Whenever proposal drafts or records are validated.
    failure: Reject retired alias routing and executable payloads.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.proposal-plane
  - id: rule.nimi.sdks.feature-clients.r058
    kind: rule
    title: Proposal drafts carry bounded source refs
    modality: must
    statement: The SDK proposal draft requires sourceConversationAnchorId and requesterSubjectRef and may carry a bounded requestedCapabilityRef, raw prompt transcripts, private memory, provider traces, and local app state are not proposal truth, and the SDK never stores conversation bodies or app private state in the proposal record.
    condition: Whenever a proposal draft is composed.
    failure: Reject transcript, memory, and private-state payloads.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.proposal-plane
  - id: rule.nimi.sdks.feature-clients.r059
    kind: rule
    title: Consumers render Platform-returned truth only
    modality: must
    statement: SDK consumers render proposal state from the SDK returned record or typed SDK error, an app may show a draft or capture UI but durable proposal truth remains the Platform-returned record, and apps never persist alternate proposal truth, alternate review state, or hidden success state when the SDK returns a fail-closed error.
    condition: Whenever proposal state is rendered or persisted by consumers.
    failure: Reject alternate truth and hidden success persistence.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.proposal-plane
  - id: rule.nimi.sdks.feature-clients.r060
    kind: rule
    title: The acquisition facade is host-typed and narrow
    modality: must
    statement: The SDK may provide a runtime.connectorAuth.acquireManagedCredential or equivalent host typed facade converging provider browser and device-code flows out of the Desktop renderer, the facade owner is the SDK host typed surface and not a Runtime daemon RPC, Runtime adds no AcquireManagedCredential, BeginProviderOAuth, RefreshManagedCredential, or equivalent connector RPC because the ConnectorService method freeze stays effective, the facade injects host primitives through adapters covering browser open, profile-scoped provider network requests, authorization-code token exchange, sleep and time sources, and the Runtime connector create and update client, provider network requests carry the profileId and a purpose of device_authorization or device_token with the host failing closed and admitting only the exact endpoints generated for that profile by the acquisition profiles table, the SDK never requires the host to expose an arbitrary provider proxy or generic CORS bypass, the SDK never imports Desktop, Tauri, renderer bridges, or provider UI components, and sealed credential payloads returned by host adapters are written only through the existing Runtime CreateConnector and UpdateConnector write path without establishing a second credential persistence path.
    condition: Whenever managed OAuth acquisition is orchestrated.
    failure: Fail closed on non-profile endpoints and reject new connector RPCs and second persistence paths.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.connector-auth-plane
  - id: rule.nimi.sdks.feature-clients.r061
    kind: rule
    title: Acquisition profile truth lives in one table
    modality: must
    statement: The only SDK-side source of OAuth acquisition constants is the connector-auth-acquisition-profiles table, the table carries only acquisition metadata covering profile_id, provider_auth_profile, issuer, client_id, device_authorization_url, device_token_url, redirect_uri, fallback_verification_url, token_exchange_provider, default_poll_interval_seconds, min_poll_interval_seconds, and default_expires_in_seconds, the table never carries sealed credential payload schemas, refresh-token semantics, provider execution header derivation, connector status truth, model or catalog truth, or Runtime-owned credential validation truth, and token_exchange_provider serves only host-injected authorization-code exchange adapter routing and is never interpreted as a Runtime execution provider, model or catalog owner, or header derivation truth.
    condition: Whenever acquisition constants are sourced or the profile table is maintained.
    failure: Reject out-of-table constants and out-of-scope table content.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.connector-auth-plane
  - id: rule.nimi.sdks.feature-clients.r062
    kind: rule
    title: Refresh and rotation stay unadmitted
    modality: must
    statement: Admitted managed OAuth acquisition owns no refresh or rotation automation, a refresh token may appear inside a provider-defined sealed credential payload only as opaque material written through the existing Runtime connector create and update path, the SDK host facade never silently refreshes, rotates, rewrites, or repairs sealed credential payloads after acquisition completes, Runtime consume and probe continue failing closed on unusable managed payloads, and re-authentication is manual reacquisition unless a future spec redesign explicitly admits a refresh and rotation owner, storage semantics, audit events, and failure behavior.
    condition: Whenever managed credential refresh or rotation is approached.
    failure: Reject silent refresh and rotation and keep unusable payloads fail-closed.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.connector-auth-plane
  - id: rule.nimi.sdks.feature-clients.r063
    kind: rule
    title: Local environment projection mirrors Runtime
    modality: must
    statement: The SDK may expose typed projection for Runtime local environment plans only as a downstream mirror of the Runtime local environment authority, the allowed projection families are host capability profile projection, local compute pack projection, local environment plan projection, dependency graph and dependency job projection, materializer family and status projection, source manifest and verification evidence summaries bounded to diagnostics, selected source record reference and diagnostics projection, confirmation, cancel, retry, and repair commands routed to Runtime, and activation gate status for native engine and Python pipeline consumers, dependency job control is dependency-first so startLocalEnvironmentDependencyJob requires a Runtime-resolved dependency environment and explicit confirmation, model asset and companion asset projections preserve Runtime asset-specific identity fields without replacing concrete asset_id, local_asset_id, companion_asset_id, or parent_asset_id truth with pack-level placeholders, SDK and app helpers never synthesize asset_id from local_asset_id and keep asset_id as the semantic installable asset identity and local_asset_id as the lifecycle handle with lookup or dedupe helpers keeping the two namespaces typed rather than normalizing both through one asset-id canonicalizer, cancelLocalEnvironmentDependencyJob targets only Runtime job ids, retryLocalEnvironmentDependencyJob targets terminal retryable Runtime job ids and preserves Runtime structured failure when retry is refused, repairLocalEnvironmentDependency targets Runtime dependency environments without becoming SDK-side installer, package-manager, PATH, or source-selection logic, and dependency job recovery helpers may filter Runtime-projected recovery_disposition values but never parse failure_detail or dependency-family names to infer auto-recovery policy.
    condition: Whenever local environment plans or dependency jobs are projected.
    failure: Reject synthesized identities, non-Runtime targets, and inferred recovery policy.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.local-environment-plane
  - id: rule.nimi.sdks.feature-clients.r064
    kind: rule
    title: Environment readiness is never SDK-owned
    modality: must
    statement: The SDK never owns or infers GPU, CUDA, Python, uv, Torch, package set, model directory, PATH, or engine package readiness, dependency source selection, selected source record creation or invalidation, installer, script, package manager, PATH mutation, or repair execution, app-level REST bypasses around RuntimeLocalService, materializer source manifests or verification evidence outside Runtime, or readiness from endpoint reachability, transfer completion, package directory presence, import success, PATH precedence, or script exit, the SDK preserves Runtime structured failure, cancellation, unsupported, repair-required, auth, and stale-projection reasons and never synthesizes ready from missing, unconfirmed, cancelled, failed, unsupported, corrupt, incompatible, stale, or repair-required Runtime state, cloud-only SDK provider, connector, account, and route projection paths never depend on local environment readiness, missing uv, Python runtime, venv, package set, Torch wheel, native engine package, model asset, or companion asset is projected as Runtime local environment setup, confirmation, failed, unsupported, cancelled, or repair state, and SDK public errors and helper text never instruct ordinary users to install these dependencies through system package managers, global Python, user PATH, machine PATH, shell profiles, or engine-private directories.
    condition: Whenever local environment readiness or failures are projected.
    failure: Reject synthesized readiness and system-level installation guidance.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.local-environment-plane
  - id: rule.nimi.sdks.feature-clients.r065
    kind: rule
    title: Route APIs consume v2 target identity
    modality: must
    statement: Runtime route APIs consume v2 durable target refs, return inventory projection for options, and expose resolved execution binding for execution and describe truth, and legacy route bindings, localModelId, and raw provider or model ids are never used as durable target identity.
    condition: Whenever route APIs consume or return target identity.
    failure: Reject legacy bindings and raw ids as durable identity.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.route-plane
  - id: rule.nimi.sdks.feature-clients.r066
    kind: rule
    title: The route surface is four logical operations
    modality: must
    statement: The SDK app-facing route facade exposes exactly the logical operations runtime.route.listOptions, runtime.route.resolve, runtime.route.checkHealth, and runtime.route.describe, the Phase 1 stable authority home of describe is the host typed surface, describe is not defined as a direct daemon convenience method and the Runtime class is not required to carry a describe matching a daemon top-level RPC one to one, describe types and value domains inherit directly from the runtime route describe RPC authority without inventing a second route metadata schema in the SDK, and when the Phase 1 host typed surface carries describe through the ExecuteScenario route describe probe it only decodes the Runtime-written route-describe-result response metadata and performs typed result validation while SDK and Desktop never convert missing metadata into defaults or locally infer metadata from a route binding.
    condition: Whenever the route facade surface is defined or describe is carried.
    failure: Reject second schemas, daemon parity claims, and default backfill.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.route-plane
  - id: rule.nimi.sdks.feature-clients.r067
    kind: rule
    title: Describe results are typed and fail closed
    modality: must
    statement: The stable typed RuntimeRouteDescribeResult keeps the public fields capability, metadataVersion, resolvedBindingRef, metadataKind, and metadata, metadata is a discriminated union whose Phase 1 variants inherit the complete runtime route metadata family covering TextGenerateRouteMetadata, SpeechSynthesizeRouteMetadata, SpeechTranscribeRouteMetadata, VoiceWorkflowVoiceCloneRouteMetadata, and VoiceWorkflowVoiceDesignRouteMetadata, fields and value domains stay isomorphic to the runtime authority so traceModeSupport is only none, hide, or separate, supportedTimingModes contains only none, word, or char, and workflowType is only voice_clone or voice_design, results never degrade to Struct, unknown records, provider raw payloads, or free string maps, stable describe consumption fails closed on a missing metadataKind, any missing required typed field, enum values outside the specified domain, or inconsistency among capability, metadataKind, and resolvedBindingRef, and on failure the SDK errors directly without falling back to resolve plus checkHealth as metadata success, guessing thinking support, input support, or workflow metadata from provider or model names or local and cloud assumptions, or exposing a product-facing fallback knob for fail-open.
    condition: Whenever describe results are typed or consumed.
    failure: Fail closed on missing or inconsistent metadata and reject degradation and guessing.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.route-plane
  - id: rule.nimi.sdks.feature-clients.r068
    kind: rule
    title: Route projection derives from Runtime facts only
    modality: must
    statement: The Phase 1 app-facing stable home of listOptions, resolve, and checkHealth is the SDK host typed surface performing only deterministic projection of Runtime facts and never becoming a new catalog, readiness, provider or model capability, fallback policy, or default route policy authority, the allowed projection work is type narrowing, field normalization, and fail-closed validation over Runtime-projected local asset, provider catalog, connector catalog, and capability records, model-root normalization on existing typed binding intents or Runtime-projected local asset records, local route engine label derivation only when Runtime provides engine, provider, or capability evidence and never from raw Desktop provider, model, or endpoint guessing, warm candidate selection based on Runtime local catalog and readiness projection used only for warm-on-demand orchestration of the same resolved local asset and never replacing the resolve binding truth, and assembling app-facing resolved binding projection with all resolved identity, health, readiness, and capability truth traceable to Runtime projection input, and the forbidden paths are generating execution route truth from Desktop runtimeFields, endpoint strings, provider labels, model labels, local or cloud heuristics, or connector default model backfill, maintaining provider or model catalogs, local engine catalogs, readiness caches, fallback matrices, or first-available default bindings in the SDK as stable truth, upgrading listOptions option ordering or UI convenience selection into execution fallback policy, and interpreting checkHealth success as metadata success because metadata stays on the describe fail-closed boundary.
    condition: Whenever route selection, resolve, or health projection runs.
    failure: Reject non-Runtime-derived truth, SDK caches, and policy upgrades.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.route-plane
  - id: rule.nimi.sdks.feature-clients.r069
    kind: rule
    title: Route types share without transport promises
    modality: must
    statement: The runtime subpath may share the typed describe result types and host facade interface in Phase 1 but never wraps them into a public promise that a new daemon top-level RPC already exists, the runtime client surface introduces no transport assumptions conflicting with the route transport authority, before the runtime transport authority is finalized the app-facing success path for route metadata is the host typed surface and the SDK never invents a private interim API, and the route facade may be reused by host and runtime memory binding resolution paths as a legality and health dependency while runtime.route itself is never a memory embedding editable config surface or a canonical bank bind and cutover command surface.
    condition: Whenever route types are shared or reused.
    failure: Reject RPC-existence promises, private interim APIs, and config-surface reuse.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.route-plane
  - id: rule.nimi.sdks.feature-clients.r070
    kind: rule
    title: Admitted delegated clients remain typed projections only
    modality: must
    statement: The SDK exposes a delegated capability client only after Runtime separately admits the capability, operations, authorization, failure, and owner contract, and the SDK then remains a typed projection and command carrier without credentials, provider-native payloads, MCP or A2A clients, approval policy, firewall verdict ownership, execution truth, or audit truth.
    condition: Whenever a delegated capability client is proposed or exposed.
    failure: Reject unadmitted capability publication, semantic ownership, and protocol-native wire exposure.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.delegation-plane
  - id: rule.nimi.sdks.feature-clients.r075
    kind: rule
    title: No direct delegated-provider bypass or premature support
    modality: must
    statement: The SDK never connects Desktop, Avatar, Apps, Web, or Direct SDK Consumers directly to an unadmitted delegated provider, MCP, or A2A surface, and type, registry, generated code, or documentation presence never claims production support without an admitted Runtime owner contract and real implementation.
    condition: Whenever delegation consumers or support claims are evaluated.
    failure: Reject direct provider connections and unearned support claims.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.delegation-plane
  - id: rule.nimi.sdks.feature-clients.r076
    kind: rule
    title: Avatar integration is first-party and projection-only
    modality: must
    statement: The SDK exposes only typed integration required by Nimi Home and Avatar to consume Runtime LocalAgent presentation output and Avatar rendering diagnostics, owns none of the underlying semantics, and provides no Third-party App direct Avatar control.
    condition: Whenever an Avatar SDK surface is exposed.
    failure: Reject SDK-owned presentation or rendering truth, Third-party direct control, embedded renderer, or raw backend command surface.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.avatar-projection-plane
  - id: rule.nimi.sdks.feature-clients.r077
    kind: rule
    title: Presentation selection follows Runtime truth
    modality: must
    statement: Runtime owns LocalAgent presentation, activity, emotion, and voice truth, Nimi Home may request admitted configuration through the standard authorized Runtime surface, Avatar consumes the resulting projection, and SDK validation never replaces Runtime authorization or becomes an App-local configuration owner.
    condition: Whenever avatar presentation configuration is read or mutated.
    failure: Reject Desktop or App-owned presentation truth, stale overwrite, bypass of Runtime authorization, or direct backend control.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.avatar-projection-plane
  - id: rule.nimi.sdks.feature-clients.r078
    kind: rule
    title: Avatar diagnostics stay first-party projections
    modality: must
    statement: First-party Nimi Home and Avatar diagnostics may carry typed Runtime and Avatar status or evidence projections without exposing raw model, provider, protocol, motion, renderer, or backend command payloads and without reinterpreting rendering evidence as Runtime LocalAgent success.
    condition: Whenever avatar probe, replay, or evidence surfaces are exposed.
    failure: Reject raw payload exposure and evidence reinterpretation.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.avatar-projection-plane
  - id: rule.nimi.sdks.feature-clients.r080
    kind: rule
    title: Avatar projection types admit no escapes
    modality: must
    statement: Avatar projection and diagnostic SDK types use named interfaces, enums, tagged unions, or schema refs and never expose free-form provider, protocol, raw motion, raw renderer, or backend command payloads.
    condition: Whenever Avatar projection SDK types are defined.
    failure: Reject untyped escapes and raw payload types.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.avatar-projection-plane
  - id: rule.nimi.sdks.feature-clients.r081
    kind: rule
    title: Avatar consumers cannot bypass owners
    modality: must_not
    statement: The SDK provides helper APIs that let Desktop, Avatar, apps, or Web bypass Runtime-owned probe, replay, and authorization semantics or Avatar-owned backend resolver execution.
    condition: Whenever avatar control helpers are exposed.
    failure: Reject bypass helpers.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.avatar-projection-plane
  - id: rule.nimi.sdks.feature-clients.r082
    kind: rule
    title: The Avatar package client stays retired
    modality: must
    statement: The SDK Avatar package client surface retired together with the Asset Market withdrawal, the former public surfaces including runtime.avatarPackage.resolveLaunchProjection, decodeAvatarPackageHandoff, RuntimeAvatarPackageHandoff, and RuntimeAvatarPackageBackendKind no longer exist and the former Avatar package client rule block carries no active normative behavior, Avatar launch keeps only the local Avatar asset path of private import plus local materialization with no remote package source, and any proposal reviving the surface requires new authority admission with new rules.
    condition: Whenever Avatar package client surfaces are approached.
    failure: Fail closed on retired surfaces and reject revival without new admission.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.avatar-projection-plane
  - id: rule.nimi.sdks.feature-clients.r083
    kind: rule
    title: Live Avatar association remains owner mediated
    modality: must
    statement: Runtime and Avatar may associate the active first-party Avatar instance with an explicit LocalAgent for projection recovery, Runtime retains conversation continuity and authorization truth, and no Third-party App receives a binding entity or selector API.
    condition: Whenever a live Avatar instance is associated with a LocalAgent.
    failure: Reject inferred continuity, App-owned binding truth, or Third-party binding control.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.avatar-projection-plane
  - id: rule.nimi.sdks.feature-clients.r096
    kind: rule
    title: The sdks family boundary admits no shims
    modality: must
    statement: The sdks tree is the SDK-family workspace boundary whose support documents and package metadata are family evidence only after they exist and are explicitly admitted by the sdks authority, sdks package metadata never introduces public package names, release commands, conformance commands, or export manifests before the corresponding generator and conformance authority is admitted, and no forwarding package or compatibility shim is created to bridge archived old SDK source and the sdks tree.
    condition: Whenever sdks family metadata or bridging is proposed.
    failure: Reject premature metadata and bridging shims.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.package-plane
  - id: rule.nimi.sdks.feature-clients.r097
    kind: rule
    title: TypeScript source roots follow current product demand
    modality: must
    statement: The TypeScript SDK keeps the smallest public source roots required by current Realm, Runtime, Character, LocalAgent, Conversation, Memory, Knowledge, AI consume, error, and authorization journeys, and does not prebuild Workflow, MCP, framework-adapter, toolkit, evaluation, migration-doctor, or ecosystem-completeness directories without a concrete admitted consumer.
    condition: Whenever TypeScript SDK source roots are added or retained.
    failure: Reject speculative catalog expansion and require a current owner and consumer contract.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.package-plane
  - id: rule.nimi.sdks.feature-clients.r099
    kind: rule
    title: The OpenAI adapter is a strict chat bridge
    modality: must
    statement: The OpenAI-compatible adapter v1 is a strict Chat Completions compatible migration bridge only, the supported endpoint shape is chat.completions.create in non-streaming and streaming modes, supported inputs are common chat generation parameters, function-tool definitions, tool_choice, response_format, and the message roles system, developer, user, assistant, and tool, tool semantics return OpenAI-style tool_calls without executing tools inside the adapter, the unsupported surfaces are the responses, completions, and embeddings endpoints, OpenAI built-in tools, file search, web search, code interpreter, stored chat completion CRUD, logprobs, more than one choice, general OpenAI API compatibility, and Runtime REST bypass promises, and unsupported behavior fails closed with SDK_ADAPTER_FEATURE_UNSUPPORTED.
    condition: Whenever the OpenAI-compatible adapter handles requests.
    failure: Fail closed with the unsupported feature code on unsupported surfaces.
    relations:
      - type: applies_to
        target: definition.nimi.sdks.feature-clients.package-plane
