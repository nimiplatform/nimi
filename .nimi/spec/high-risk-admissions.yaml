admissions:
  - admission_id: multi-agent-room-orchestration-authority
    disposition: complete
    admitted_at: "2026-05-12T15:45:17Z"
    manager_review_owner: nimicoding-manager
    summary: >-
      Multi-Agent Room Orchestration Authority admitted as the Runtime-owned
      horizontal authority for same-room/session orchestration across Realm
      Group, Scenario Sandbox, OASIS/world, External Entry,
      Avatar/Companion, and canonical chat adjacency. Runtime owns
      orchestration admission, participant ordering, trigger arbitration,
      fairness, queueing, cancellation, timeout policy, token budget
      arbitration, status projection, external admission posture, and
      commit-race handoff policy. Domain owners retain transcript, domain
      commit, protocol, product, and UI truth; orchestration does not directly
      commit Realm GROUP, Scenario, OASIS/world, canonical chat, or external
      domain truth. This admission extends the closed Runtime Agent
      Participation Authority without reopening K-AGCORE-073, K-AGCORE-086, or
      participation profile/axis registry truth.
  - admission_id: runtime-agent-participation-authority
    disposition: complete
    admitted_at: "2026-05-02T04:56:01Z"
    manager_review_owner: nimicoding-manager
    summary: >-
      Runtime Agent Participation Authority admitted as Runtime-owned agent
      execution semantics across canonical chat, Realm group, OASIS/world,
      A2A/MCP external entry, future Scenario Sandbox, Avatar/debug, and other
      non-canonical contexts. Runtime owns prompt assembly policy, AI
      consume/provider routing, output candidates, audit/replay, and promotion
      gate posture; domains retain transcript/product truth. Realm GROUP
      remains substrate and Realm-authenticated commit authority, with Runtime
      returning non-committal group reply candidates. Pending Group Chat
      app-local execution semantics are superseded as steady-state authority,
      Scenario Sandbox remains future consumer only, A2A/MCP protocol payloads
      remain non-semantic gateway input, and non-canonical memory/cognition or
      canonical-chat writes remain fail-closed without explicit promotion.
  - admission_id: desktop-avatar-configuration-debug-workbench
    disposition: complete
    admitted_at: "2026-05-01T12:08:38Z"
    manager_review_owner: nimicoding-manager
    summary: >-
      Desktop Avatar configuration debug workbench authority redesign admitted
      as a hard-cut product control surface: Desktop may own Agent Chat Settings
      Avatar configuration, launch controls, debug workbench views, remediation
      UX, and local control-record persistence only; Runtime retains typed
      runtime.agent.* projection, avatar probe/replay/audit/authorization
      semantics; SDK remains typed client only; Avatar remains backend resolver,
      capability/profile evidence, carrier diagnostics, and typed debug-session
      consumer. Desktop configuration records are not launch payload, package
      descriptor truth, carrier truth, backend truth, or binding truth, and the
      admitted Avatar launch payload remains agent_id plus optional
      avatar_instance_id and optional non-authoritative launch_source.
  - admission_id: runtime-delegated-agent-capability-gateway
    disposition: complete
    admitted_at: "2026-05-01T10:23:36Z"
    manager_review_owner: nimicoding-manager
    summary: >-
      Runtime delegated agent capability gateway authority redesign admitted as
      Runtime-owned control plane work: Runtime retains final cognition,
      approval, credential, firewall, projection, action, and audit authority;
      MCP is admitted only as a quarantined adapter source, A2A remains a
      future seam, and Desktop/Avatar/apps remain typed consumers or
      control surfaces without delegated semantic ownership.
admission_rules:
  - explicit_manager_owned_decision_required_before_canonical_high_risk_admission
  - mechanically_valid_admission_identity_required_before_canonical_high_risk_admission
  - canonical_high_risk_admission_requires_explicit_write_to_tracked_truth
semantic_constraints:
  - canonical_admission_records_must_not_promote_operational_runtime_state
  - canonical_admission_records_must_use_one_record_per_admission_id
  - canonical_admission_records_must_use_iso_8601_utc_admitted_at
