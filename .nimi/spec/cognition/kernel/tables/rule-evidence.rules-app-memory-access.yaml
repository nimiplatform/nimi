table_family: support_registry
registry_id: cognition_rule_evidence_app_memory_access
owner: cognition
schema_ref: .nimi/contracts/table-family.schema.yaml#support_registry
allowed_fields:
  - rule_id
  - evidence_requirement
  - evidence_refs
  - note
  - evidence_scope_note
forbidden_state_fields:
  - done
  - covered
  - coverage_status
  - audit_date
  - evidence_report
  - current
  - proposed
  - backlog_status
  - migration_status
  - mapping_status
  - run_id
  - ledger_ref
entries:
  - C-APMEM-001
  - C-APMEM-002
  - C-APMEM-003
  - C-APMEM-004
  - C-APMEM-005
  - C-APMEM-006
  - C-APMEM-007
  - C-APMEM-008
  - C-APMEM-009
rules:
  - rule_id: C-APMEM-001
    evidence_requirement: required
    evidence_refs: [cognition_kernel_consistency, local_agent_product_contract]
    note: Cognition remains the memory, knowledge, and skill policy owner while Runtime supplies an immutable caller decision.
  - rule_id: C-APMEM-002
    evidence_requirement: required
    evidence_refs: [cognition_kernel_consistency, local_agent_product_contract]
    note: The admitted app-memory policy vocabulary is closed and cannot be replaced by an open app-controlled string.
  - rule_id: C-APMEM-003
    evidence_requirement: required
    evidence_refs: [cognition_kernel_consistency, local_agent_product_core]
    note: Chat-derived projection binds the Runtime-derived caller subject and ConversationAnchor; app_id remains display metadata only.
  - rule_id: C-APMEM-004
    evidence_requirement: required
    evidence_refs: [cognition_kernel_consistency, local_agent_product_core]
    note: Missing, ambiguous, orphaned, expired, or revoked policy state fails closed with no cache fallback.
  - rule_id: C-APMEM-005
    evidence_requirement: required
    evidence_refs: [cognition_kernel_consistency, local_agent_product_contract]
    note: Memory writes remain session, persona, and audit bound under Cognition policy.
  - rule_id: C-APMEM-006
    evidence_requirement: required
    evidence_refs: [cognition_kernel_consistency, local_agent_product_contract]
    note: Knowledge writes remain explicit and cannot arise from implicit prompt-context insertion.
  - rule_id: C-APMEM-007
    evidence_requirement: required
    evidence_refs: [cognition_kernel_consistency, local_agent_product_contract]
    note: Skill execution remains bounded to declared capability, persona, and canonical AI scope.
  - rule_id: C-APMEM-008
    evidence_requirement: required
    evidence_refs: [cognition_kernel_consistency, local_agent_product_core]
    note: Agent Chat cannot pre-cache or pre-project cross-session memory without an active admitted Cognition policy.
  - rule_id: C-APMEM-009
    evidence_requirement: required
    evidence_refs: [cognition_kernel_consistency, local_agent_product_contract, local_agent_product_core]
    note: A local_app_principal_id is only caller, access-control, and audit subject; RuntimeAgent/Cognition retain agent, persona, conversation, memory, and knowledge ownership.
