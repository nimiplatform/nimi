table_family: support_registry
registry_id: cognition_rule_evidence_catalog
owner: cognition
schema_ref: .nimi/contracts/table-family.schema.yaml#support_registry
allowed_fields:
  - type
  - command
  - path
  - description
  - validation_scope
forbidden_state_fields:
  - done
  - covered
  - coverage_status
  - audit_date
  - evidence_report
  - current
  - proposed
  - backlog_status
  - migration_status
  - mapping_status
  - run_id
  - ledger_ref
entries:
  - cognition_kernel_consistency
  - local_agent_product_contract
  - local_agent_product_core
cognition_kernel_consistency:
  type: static_gate
  command: pnpm exec nimicoding validate-spec-governance --profile nimi --scope cognition-consistency
  path: scripts/check-cognition-spec-kernel-consistency.mjs
  description: Validates Cognition kernel rules, machine tables, and the app-memory rule-evidence registry without owning current coverage state.
  validation_scope: cognition_authority
local_agent_product_contract:
  type: static_behavior_gate
  command: pnpm test:local-agent-product-contract
  path: tests/local-agent-product
  description: Validates the shared LocalAgent product contract, carrier vocabulary, privacy boundary, and owner-level mode declarations.
  validation_scope: local_app_runtime_agent_contract
local_agent_product_core:
  type: live_journey_gate
  command: pnpm test:e2e:local-agent-product:core
  path: tests/local-agent-product
  description: Exercises the real fixed-service LocalAgent journey and is required for the selected local-app RuntimeAgent/Cognition operation seam.
  validation_scope: local_app_runtime_agent_live
