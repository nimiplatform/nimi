format: nimicoding.authority/v2
owner: team.cognition
scope: cognition.runtime-bridge
units:
  - id: definition.nimi.cognition.runtime-bridge.domain
    kind: definition
    title: Cognition-to-Runtime adapter boundary
    meaning: Cognition remains an independent authority and exposes an explicit typed Bridge through which it owns LocalAgent non-lorebook source corpus validation, persistence, embedding, indexing, retrieval, generation lifecycle, and exact-scope deletion without acquiring Runtime LocalAgent identity, immutable snapshot custody, always-on lorebook, Conversation, operational Memory or Knowledge, account, authorization, context planning, provider execution, lifecycle orchestration, or final result truth.
  - id: definition.nimi.cognition.runtime-bridge.upgrade-floor
    kind: definition
    title: Cognition overlap boundary
    meaning: Future overlapping standalone Cognition capabilities may be used only when they preserve or strengthen Runtime-required failure, isolation, privacy, and lifecycle outcomes without replacing the Runtime product owner.
  - id: definition.nimi.cognition.runtime-bridge.knowledge-scope-registry
    kind: definition
    title: Cognition Knowledge adapter scope
    meaning: Cognition adapter scope identifies only the internal request context needed to serve an authorized Runtime operation and is not a product registry, authorization source, or LocalAgent binding.
  - id: definition.nimi.cognition.runtime-bridge.local-agent-source-scope
    kind: definition
    title: Cognition opaque per-Agent source scope
    meaning: Cognition LocalAgent source scope is an opaque per-Agent identity supplied under Runtime authorization and combined with one immutable materialization snapshot identity for source corpus, generation, query, hit, rebuild, and deletion isolation; it is not a Knowledge bank owner selector, product registry, authorization source, raw LocalAgentRef, or reusable bearer.
  - id: definition.nimi.cognition.runtime-bridge.knowledge-authorizer
    kind: definition
    title: Cognition authorization adapter
    meaning: Cognition consumes a typed Runtime authorization decision and never owns account, App, LocalAgent, workspace, Realm membership, or permission truth.
  - id: definition.nimi.cognition.runtime-bridge.embedding-resolution
    kind: definition
    title: Cognition execution adapter
    meaning: Through the public Bridge, Cognition may consume only an already admitted exact Job context and its typed request-time derived-admission or Job failure, while any future standalone non-Runtime Cognition configuration remains separate Cognition truth; Cognition owns no reusable readiness, route, selection, resolution, probe, override, or substitution.
  - id: definition.nimi.cognition.runtime-bridge.source-corpus
    kind: definition
    title: Cognition LocalAgent source corpus
    meaning: A Cognition LocalAgent source corpus is the bounded set of typed non-lorebook source units and explicit omissions accepted from one Runtime materialization partition for one opaque per-Agent scope and immutable snapshot identity; it is derived state rather than Realm canonical source, Runtime snapshot, lorebook, Conversation, Memory, or Knowledge truth.
  - id: definition.nimi.cognition.runtime-bridge.source-generation
    kind: definition
    title: Cognition source generation
    meaning: A Cognition source generation is the scope-and-snapshot-bound ingestion, embedding, index, readiness, query, and candidate-hit lifecycle for one LocalAgent source corpus, with lexical and entity signals only auxiliary to formally admitted embedding readiness.
  - id: definition.nimi.cognition.runtime-bridge.adapter-outcome
    kind: definition
    title: Cognition source adapter outcome
    meaning: Cognition source adapter outcome preserves unconfigured, building, unavailable, failure, ready with candidates, or ready no_hits, where no_hits means only that a successful ready query returned no candidates and Runtime-owned no_result remains a later context-selection outcome.
  - id: rule.nimi.cognition.runtime-bridge.r001
    kind: rule
    title: Cognition and Runtime owners remain independent
    modality: must
    statement: Cognition remains the independent owner of the admitted source corpus and any future standalone product state and capabilities, while Runtime owns LocalAgent identity, immutable snapshot custody, always-on lorebook, operational Memory and Knowledge, Conversation, account mediation, authorization, context planning, lifecycle, provider execution, and final commit continuity.
    condition: Whenever an overlapping Runtime and Cognition capability is interpreted.
    failure: Reject silent ownership transfer in either direction.
    relations:
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.domain
  - id: rule.nimi.cognition.runtime-bridge.r002
    kind: rule
    title: Runtime consumption is adapter only
    modality: must
    statement: Runtime may call the typed public Cognition Bridge for admitted work, but every Runtime product result remains a Runtime projection with Runtime authorization, lifecycle, retention, failure, and audit semantics.
    condition: Whenever Runtime consumes a Cognition capability.
    failure: Fail closed when the adapter is unavailable or cannot preserve Runtime semantics.
    relations:
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.domain
  - id: rule.nimi.cognition.runtime-bridge.r003
    kind: rule
    title: Cognition does not republish Runtime truth
    modality: must_not
    statement: Cognition exposes Runtime LocalAgent Memory, Knowledge, Conversation, account, App authorization, lifecycle, AI route, provider, credential, or execution truth as Cognition-owned public state.
    condition: Whenever Cognition projects adapter results.
    failure: Return results only to the owning Runtime adapter boundary.
    relations:
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.domain
  - id: rule.nimi.cognition.runtime-bridge.r004
    kind: rule
    title: Runtime does not absorb standalone Cognition
    modality: must_not
    statement: Runtime claims ownership of future standalone Cognition product state, configuration, or non-Runtime data merely because the public Bridge exists.
    condition: Whenever Runtime integrates Cognition.
    failure: Keep future standalone Cognition truth independent.
    relations:
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.upgrade-floor
  - id: rule.nimi.cognition.runtime-bridge.r005
    kind: rule
    title: Authorization stays with Runtime and Realm owners
    modality: must
    statement: Runtime supplies the already evaluated account, App, LocalAgent, scope, and operation authorization context required by the adapter, while Cognition never infers authorization from caller fields, stored content, workspace names, or prior success.
    condition: Whenever Cognition serves a Runtime request.
    failure: Deny the adapter operation when the typed authorization decision is absent or stale.
    relations:
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.knowledge-authorizer
  - id: rule.nimi.cognition.runtime-bridge.r006
    kind: rule
    title: Adapter context is minimal and non-authoritative
    modality: must
    statement: Cognition receives only the bounded content, operation context, and opaque owner references needed for the admitted internal task, with no Realm JWT, Provider Credential, account bearer, App permission decision, or LocalAgent product binding.
    condition: Whenever Runtime prepares a Cognition adapter request.
    failure: Reject over-broad or authority-bearing context.
    relations:
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.knowledge-scope-registry
  - id: rule.nimi.cognition.runtime-bridge.r007
    kind: rule
    title: Cognition consumes canonical capability composition
    modality: must
    statement: The canonical App or shared LocalAgent AIConfig owner commits each CapabilityContract route and, for Cloud, its exact Connector reference plus implementation and target; at Job submission Runtime atomically dereferences the current machine-selected Loadout for Local into a complete persisted ResolvedAssembly or captures the committed Cloud references after ownership, credential, App access, and policy checks together with Quota, Budget, and Rate Limit inputs. Cognition consumes only those immutable Job inputs and cannot select, resolve, probe, reread current owner or machine-selection state, override, or substitute defaults or resources.
    condition: Whenever a Cognition adapter requires AI or embedding resources for Runtime work.
    failure: Fail closed with the typed selection, derived-admission, or Job failure when exact captured inputs are unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.embedding-resolution
  - id: rule.nimi.cognition.runtime-bridge.r008
    kind: rule
    title: Standalone configuration stays separate
    modality: must_not
    statement: Future standalone Cognition configuration or execution defaults are imported as Runtime LocalAgent Memory, Knowledge, Conversation, or execution truth.
    condition: Whenever a future standalone Cognition path and the Runtime Bridge coexist.
    failure: Keep future standalone and current Runtime truth separate.
    relations:
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.embedding-resolution
  - id: rule.nimi.cognition.runtime-bridge.r009
    kind: rule
    title: Adapter failure is explicit
    modality: must
    statement: Cognition timeout, unsupported capability, unavailable resource, validation failure, authorization failure, snapshot or scope mismatch, or internal failure returns its typed adapter outcome to Runtime without cached, empty, fixture, synthetic, no_hits, or no_result success.
    condition: Whenever a Cognition adapter cannot complete.
    failure: Preserve the typed failure for Runtime owner handling.
    relations:
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.upgrade-floor
  - id: rule.nimi.cognition.runtime-bridge.r010
    kind: rule
    title: Cognition completeness is non-blocking
    modality: must
    statement: Cognition source generation unconfigured, building, unavailable, or failure does not block an otherwise valid LocalAgent, and Runtime may continue with zero optional source candidates while preserving the exact adapter outcome; Cognition never selects or substitutes another provider, model, route, snapshot, or cached generation to manufacture readiness.
    condition: Whenever Cognition roadmap state is evaluated as a current product prerequisite.
    failure: Remove the prerequisite and keep unavailable Cognition-specific capability explicit.
    relations:
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.domain
  - id: rule.nimi.cognition.runtime-bridge.r011
    kind: rule
    title: Knowledge bank listing resolves one owner
    modality: must
    statement: ListKnowledgeBanks accepts an empty filter set as the caller-authorized App-private owner default or one fully specified owner selector with a matching single scope; duplicate or multiple owner selectors, mixed scopes or owners, and an explicit kind-only selector are invalid and never broaden a query.
    condition: Whenever Runtime prepares or Cognition serves a ListKnowledgeBanks request.
    failure: Return InvalidArgument before authorization or listing and emit no empty, partial, or broadened success.
    relations:
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.knowledge-authorizer
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.knowledge-scope-registry
  - id: rule.nimi.cognition.runtime-bridge.r012
    kind: rule
    title: Source ingestion accepts only the Runtime partition envelope
    modality: must
    statement: Cognition validates and ingests only a typed Runtime envelope containing the opaque per-Agent scope, immutable snapshot identity, stable unit ids, categories, bounded text, typed source paths or refs, entity or relation refs, provenance, and complete indexed-or-omitted coverage from one Runtime materialization partition and never parses or repartitions the raw snapshot.
    condition: Whenever a LocalAgent source corpus is created or rebuilt.
    failure: Reject missing, duplicate, malformed, over-broad, incomplete, cross-scope, or cross-snapshot envelopes before changing a source generation.
    relations:
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.local-agent-source-scope
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.source-corpus
  - id: rule.nimi.cognition.runtime-bridge.r013
    kind: rule
    title: Source generation readiness is embedding gated
    modality: must
    statement: A source generation becomes ready only after complete envelope validation, required-unit ingestion, formally admitted text.embed execution, exact-dimension finite embeddings, complete index build, and scope plus snapshot identity agreement; lexical or entity signals remain auxiliary and cannot independently produce ready state or product hits.
    condition: Whenever Cognition builds, restores, or reports source generation readiness.
    failure: Preserve typed unconfigured, building, unavailable, or failure and return no optional candidates when any readiness condition is absent or invalid.
    relations:
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.embedding-resolution
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.source-generation
  - id: rule.nimi.cognition.runtime-bridge.r014
    kind: rule
    title: Source queries and hits are scope and snapshot bound
    modality: must
    statement: Every source corpus, generation, query, candidate hit, rebuild, and deletion simultaneously matches the authorized opaque per-Agent scope and immutable snapshot identity, and equal semantic snapshot hashes or source template ids never authorize mutable generation sharing or cross-Agent hits.
    condition: Whenever Cognition stores, restores, queries, returns, rebuilds, or deletes LocalAgent source state.
    failure: Reject the operation with a typed validation or authorization failure and return no candidate from another scope, snapshot, or Realm-current source.
    relations:
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.local-agent-source-scope
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.source-corpus
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.source-generation
  - id: rule.nimi.cognition.runtime-bridge.r015
    kind: rule
    title: Adapter no_hits is successful zero candidates only
    modality: must
    statement: Cognition returns no_hits only when a ready authorized query completes successfully with zero candidates; unconfigured, building, unavailable, timeout, validation, authorization, snapshot mismatch, scope mismatch, or internal failure retains its typed adapter outcome, while successful candidates later rejected by Runtime guard or budget remain a Runtime no_result decision and do not rewrite the Bridge outcome.
    condition: Whenever Cognition completes or fails a LocalAgent source query.
    failure: Reject an empty or synthetic success and preserve the actual typed adapter outcome for Runtime handling.
    relations:
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.adapter-outcome
  - id: rule.nimi.cognition.runtime-bridge.r016
    kind: rule
    title: Source rebuild uses the same typed snapshot projection
    modality: must
    statement: A missing, corrupt, or unready source generation is rebuilt only from the same typed envelope replayed by Runtime's singular projector for the target LocalAgent immutable snapshot and opaque scope, without Cognition reading the snapshot, rereading Realm, copying another Agent, or requesting a full-source prompt path.
    condition: Whenever a LocalAgent source generation is repaired or rebuilt.
    failure: Keep the generation non-ready with the typed outcome and return zero optional candidates until a valid envelope completes.
    relations:
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.source-corpus
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.source-generation
  - id: rule.nimi.cognition.runtime-bridge.r017
    kind: rule
    title: Source scope deletion is exact and idempotent
    modality: must
    statement: Cognition commits deleted or already_absent only after the exact opaque per-Agent scope and snapshot-bound source corpus, embeddings, index generations, and related derived source state are absent, never exposes this delete as an App operation, and never mutates Realm source, Runtime Conversation, another Agent scope, or Runtime lifecycle truth.
    condition: Whenever Runtime requests Cognition source-scope deletion as part of LocalAgent termination.
    failure: Return typed unavailable or failure without a success claim when exact deletion cannot commit, and preserve idempotent retry for the same scope and snapshot.
    relations:
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.local-agent-source-scope
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.source-corpus
