contract_id: GROUP-AGENT-PARTICIPATION-CONTRACT-001
domain: chat
status: ACTIVE
version: 2026-05-15
table_family: product_catalog
catalog_id: realm_group_agent_participation_contract
entries:
  - human_spec
  - openapi
  - prisma
  - services
  - GroupAgentSlot
  - GroupAgentTrigger
  - RealmGroupMessageCandidate
  - realm_owner
  - runtime_owner
  - required_operations
  - secondary_operations
  - no_desktop_web_prompt_assembly
  - no_provider_model_selection_in_realm
  - no_realm_ai_execution_owner
