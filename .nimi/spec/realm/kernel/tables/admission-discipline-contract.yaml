contract_id: ADMISSION-DISCIPLINE-CONTRACT-001
domain: admission-discipline
status: ACTIVE
version: 2026-06-11
table_family: product_catalog
catalog_id: realm_admission_discipline_contract
entries:
  - human_spec
  - R-ADMIT-001
  - R-ADMIT-002
  - core_layer_families
  - protocol_family_admission
owner: '@team'
sources:
  human_spec: ../admission-discipline-contract.md
rule_id_prefix: R-ADMIT-
rules:
  - rule_id: R-ADMIT-001
    level: must
    title: protocol-family-admission-requires-multi-party-semantics
    statement: "A capability is admissible into a Realm protocol family only when its semantic substance is inherently multi-party, cross-device, or cross-account; implementation convenience, login-rate or engagement objectives, and cloud-side operational preference are not admissible justifications, and a capability whose semantics are satisfiable runtime-locally must remain runtime- or app-local truth."
  - rule_id: R-ADMIT-002
    level: must
    title: core-layer-permanently-minimal-protocols-opt-in
    statement: "The Realm core layer is permanently limited to identity, authentication, account, and permission-grant authority (R-OAUTH and R-PERM families); every other Realm capability family is an opt-in protocol family whose obligations bind only declared consumers, and core admission requires demonstrating identity or grant semantics are unsatisfiable without the capability."
core_layer_families:
  - R-OAUTH
  - R-PERM
protocol_family_admission:
  inadmissible_justifications:
    - implementation_convenience
    - login_rate_or_engagement_objectives
    - cloud_side_operational_preference
  required_demonstration: inherently_multi_party_cross_device_or_cross_account_semantics
