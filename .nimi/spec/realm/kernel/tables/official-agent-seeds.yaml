version: 1
table_family: product_catalog
owner: realm
catalog_id: realm_official_agent_seeds
entries:
  - archivist
  - official guide seeds are RealmAgent truth, not Desktop fixtures
  - auto AgentFriend provisioning must be idempotent and traceable to seed rows
  - official guide quota exception is explicit and not reusable for ordinary agents

seed_schema:
  owner: realm_official_agent_seeds
  fields:
    - realm_agent_id
    - display_name
    - handle
    - provenance
    - system_world_ref
    - role
    - seed_status
    - auto_provision
    - quota_policy
    - first_message_floor
    - source_rule
  enums:
    seed_status:
      - active
      - retired
    quota_policy:
      - ordinary
      - official_guide_exception

seeds:
  - realm_agent_id: official.archivist
    display_name: Archivist
    handle: "@archivist.nimi"
    provenance: nimi-official-guide
    system_world_ref: system-world.oasis-main
    role: product-guide-librarian
    seed_status: active
    auto_provision:
      agent_friend: true
      local_agent: true
      account_registration: true
      existing_account_repair: true
    quota_policy: official_guide_exception
    first_message_floor: |
      Welcome to Nimi. I am Archivist, your guide to this world.
      I can help you set up Runtime, understand profiles, find Worlds and Agents,
      and turn a RealmAgent into your LocalAgent companion.
      What would you like to do first?
    source_rule: R-SOC-007
