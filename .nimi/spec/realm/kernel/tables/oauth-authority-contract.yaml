owner: '@team'
sources:
  human_spec: ../oauth-authority-contract.md
  openapi:
    - realm-backend://api-nimi.yaml
  prisma: realm-backend://prisma/schema.prisma
  services:
    - realm-backend://apps/api/src/modules/auth/auth.controller.ts
    - realm-backend://libs/infra/auth/src/oauth-authority.service.ts
rule_id_prefix: R-OAUTH-
rules:
  - rule_id: R-OAUTH-001
    level: must
    title: realm-is-oauth-authorization-server
    statement: "Realm is the OAuth 2.0 authorization server for native/public clients in nimi-realm; PKCE-protected authorization code flow is the sole admitted method on this contract's endpoints."
  - rule_id: R-OAUTH-002
    level: must
    title: endpoint-set-closed
    statement: "Admitted OAuth endpoints are exactly GET /api/auth/oauth/authorize and POST /api/auth/oauth/token; implicit, client_credentials, password, device_code, and URN-namespaced grants are forbidden."
  - rule_id: R-OAUTH-003
    level: must
    title: pkce-s256-only
    statement: "code_challenge_method must equal S256; plain and any other value fail-close invalid_request; missing code_challenge or code_challenge_method on /authorize fails-close."
  - rule_id: R-OAUTH-004
    level: must
    title: authorization-code-single-shot
    statement: "Authorization codes are single-shot with TTL <= 60 seconds, persisted in atomically-consumable storage (single SQL UPDATE returning row, or atomic key-value claim-and-delete); expired or already-consumed codes fail-close invalid_grant at /token."
  - rule_id: R-OAUTH-005
    level: must
    title: redirect-uri-loopback-exact-match
    statement: "redirect_uri must be http scheme, host 127.0.0.1 or localhost, any port 1..65535, path exactly /oauth/callback; authorize-time and token-time redirect_uri must byte-for-byte match; any other shape or mismatch fails-close."
  - rule_id: R-OAUTH-006
    level: must
    title: code-binds-to-client-redirect-pkce
    statement: "Authorization code is bound at issuance to client_id, redirect_uri, code_challenge, and code_challenge_method; all four must match at /token exchange or fail-close invalid_grant; binding is immutable for code lifetime."
  - rule_id: R-OAUTH-007
    level: must
    title: closed-client-set-no-secret
    statement: "Admitted client_id set is closed and governed by tables/oauth-authority-contract.yaml#oauth_clients; no client_secret accepted on either endpoint; PKCE is the sole security boundary; ad-hoc client provisioning is forbidden."
  - rule_id: R-OAUTH-008
    level: must
    title: sensitive-material-redaction
    statement: "Authorization codes, code_verifier, access_token, and refresh_token must never appear in logs, audit payloads, error response bodies, exception messages, telemetry attributes, or any persisted observability surface; at-rest authorization codes use HMAC-SHA256 keyed by realm secret; raw codes must not survive past the issuing HTTP response."
  - rule_id: R-OAUTH-009
    level: must
    title: token-response-shape
    statement: "/token success response is JSON {access_token, refresh_token, token_type='Bearer', expires_in, account_id, display_name, realm_environment_id}; refresh_token issued only after all PKCE/binding/lifecycle/replay checks pass; field names are normative and consumed by runtime."
  - rule_id: R-OAUTH-010
    level: must
    title: forbidden-grant-types
    statement: "Grant types other than authorization_code on /token (refresh_token, client_credentials, password, device_code, URN-namespaced, or any other value) fail-close unsupported_grant_type."
  - rule_id: R-OAUTH-011
    level: must
    title: authorize-requires-session
    statement: "/authorize requires authenticated realm session cookie; unauthenticated request 302 redirects to NIMI_WEB_URL /login with oauth_next set to the absolute API authorize URL built from NIMI_REALM_URL and the original request URL; web login must validate oauth_next against an OAuth-only realm/API-origin allowlist, then navigate back to the API authorize URL after login; web login must not parse codes, receive tokens, exchange tokens, or relay tokens; state is mandatory and passed verbatim."
  - rule_id: R-OAUTH-012
    level: must
    title: replay-defense-atomic-claim-first
    statement: "Token endpoint must atomically claim code consumption before any other validation; order is (1) atomic claim, (2) client_id binding, (3) redirect_uri exact match, (4) PKCE S256 equality, (5) mint; failure at step 1 returns invalid_grant with no further detail; failure at 2/3/4 leaves code consumed and not retryable; consumption claim must never be undone."
entities:
  - name: OauthAuthorizationCode
    prisma_model: OauthAuthorizationCode
    required_fields:
      - id
      - codeHash
      - clientId
      - redirectUri
      - codeChallenge
      - codeChallengeMethod
      - accountId
      - issuedAt
      - expiresAt
      - consumedAt
      - state
    json_fields: []
oauth_clients:
  - client_id: nimi-desktop
    name: Nimi Desktop Shell
    type: public_native
    pkce_required: true
    pkce_methods: [S256]
    redirect_uri_patterns:
      - "http://127.0.0.1:*/oauth/callback"
      - "http://localhost:*/oauth/callback"
    code_ttl_seconds: 60
    code_consumption: single_shot_atomic
api_surface:
  required_operations:
    - GET /api/auth/oauth/authorize
    - POST /api/auth/oauth/token
  secondary_operations: []
