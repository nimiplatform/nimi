table_family: support_registry
registry_id: realm_rule_evidence_profiles
owner: realm
schema_ref: .nimi/contracts/table-family.schema.yaml#support_registry
allowed_fields:
  - openapi
  - prisma_models
  - service_files
  - test_files
forbidden_state_fields:
  - done
  - covered
  - coverage_status
  - audit_date
  - evidence_report
  - current
  - proposed
  - backlog_status
  - authority_relocation_status
  - mapping_status
  - run_id
  - ledger_ref
entries:
  - truth
  - projection
  - world_state
  - world_history
  - chat
  - feed
  - attachment
  - binding
  - social
  - economy
  - resource
  - asset
  - bundle
  - transit
  - oauth_authority
  - permission_grant
