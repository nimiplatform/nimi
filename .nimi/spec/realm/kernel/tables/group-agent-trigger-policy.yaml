version: 1
source_rule: R-CHAT-010
runtime_consumer_rule: K-AGCORE-119
room_orchestration_rule: K-AGCORE-123
closed_registry: true
runtime_profile: realm_group_agent
triggers:
  - trigger_id: mention
    posture: admitted
    description: A visible Realm GROUP message explicitly mentions an active agent slot.
    required_realm_evidence:
      - group_thread_ref
      - membership_snapshot_ref
      - active_agent_slot_ref
      - trigger_message_ref
      - actor_member_ref
      - read_cursor_ref
    runtime_admission: required
    room_orchestration_admission: required
    candidate_output: REALM_GROUP_MESSAGE_CANDIDATE
  - trigger_id: explicit_user_action
    posture: admitted
    description: A user with group authority invokes an agent reply control for an active agent slot.
    required_realm_evidence:
      - group_thread_ref
      - membership_snapshot_ref
      - active_agent_slot_ref
      - action_event_ref
      - actor_member_ref
      - read_cursor_ref
    runtime_admission: required
    room_orchestration_admission: required
    candidate_output: REALM_GROUP_MESSAGE_CANDIDATE
  - trigger_id: admitted_automation
    posture: admitted_with_policy_evidence
    description: An admitted automation policy creates a group reply trigger for an active agent slot.
    required_realm_evidence:
      - group_thread_ref
      - membership_snapshot_ref
      - active_agent_slot_ref
      - automation_policy_ref
      - trigger_event_ref
      - read_cursor_ref
    runtime_admission: required
    room_orchestration_admission: required
    candidate_output: REALM_GROUP_MESSAGE_CANDIDATE
  - trigger_id: product_disabled
    posture: forbidden
    description: Product or group settings disable agent participation for the group or slot.
    required_realm_evidence:
      - group_thread_ref
      - disabled_slot_or_group_setting_ref
    runtime_admission: forbidden
    room_orchestration_admission: forbidden
    candidate_output: forbidden
governance:
  open_trigger_values_allowed: false
  raw_prompt_payload: forbidden
  provider_model_selection: forbidden
  group_local_scheduler: forbidden
  app_local_reply_queue: forbidden
  runtime_direct_group_commit: forbidden
  memory_write_default_from_realm: forbidden
  group_limited_capability_enum: forbidden
