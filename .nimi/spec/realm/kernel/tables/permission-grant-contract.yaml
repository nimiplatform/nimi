rule_id_prefix: R-PERM-
rules:
  - rule_id: R-PERM-001
    level: must
    title: realm-owns-app-permission-grant-lifecycle
    statement: "Realm owns account-scoped app permission grant lifecycle truth for ecosystem apps; SDK, Desktop, Runtime, and apps may consume Realm projections or bridge tokens but must not own canonical lifecycle truth or define parallel grant state."
  - rule_id: R-PERM-002
    level: must
    title: grant-state-closed-set
    statement: "Grant state is the closed set PENDING, GRANTED, DENIED, EXPIRED, REVOKED, SUPERSEDED; unknown states fail closed; only current GRANTED records authorize grant-dependent operations, and every other state is non-authorizing."
  - rule_id: R-PERM-003
    level: must
    title: authenticated-account-is-subject-authority
    statement: "Actor and subject identity come from authenticated Realm account context; app/client-provided subject identifiers are request hints only; cross-subject issue, revoke, and list operations fail closed unless a separate admitted Realm administrative authority governs that surface."
  - rule_id: R-PERM-004
    level: must
    title: grant-record-canonical-shape-no-secrets
    statement: "Canonical grant records carry grantId, subjectAccountId, appId, scopeFamily, scopeName, qualifier, state, reason, requestedAt/requestedByAccountId, grantedAt/grantedByAccountId, deniedAt/deniedByAccountId, revokedAt/revokedByAccountId, expiredAt, supersededAt/supersededByAccountId, supersededByGrantId, expiresAt, and version; records and projections must not carry raw credentials, bearer tokens, HMAC token bytes, OAuth tokens, provider secrets, or app-local secret material."
  - rule_id: R-PERM-005
    level: must
    title: mutation-explicit-idempotent-auditable
    statement: "Grant mutation is explicit, idempotent, versioned, and auditable; request, grant, deny, expire, revoke, and supersede mutations identify target grant or deterministic idempotency identity, authenticated actor, lifecycle action, reason, and expected version or equivalent concurrency guard; repeated admitted mutations may return the existing canonical result while conflicting intent fails closed."
  - rule_id: R-PERM-006
    level: must
    title: validation-reads-canonical-record-fail-closed
    statement: "Grant validation reads the canonical Realm grant record and current version; missing grants, unsupported scope family, unsupported scope name, expired, revoked, denied, pending, superseded, and version-mismatched grants fail closed and must not degrade to app-local allowlists, stateless bridge tokens, default grants, or partial success."
  - rule_id: R-PERM-007
    level: must
    title: typed-projection-consumer-boundary
    statement: "Realm may expose a typed permission-grant projection for Runtime, Desktop, and SDK consumption; projection is a consumer contract over canonical Realm grant truth, contains no raw credentials or secret material, and does not transfer lifecycle ownership to Runtime, Desktop, SDK, or apps; Runtime owns local spend/session/audit semantics only."
  - rule_id: R-PERM-008
    level: must
    title: stateless-runtime-bridge-is-partial
    statement: "The existing /api/runtime/realm-grants/issue stateless HMAC token bridge remains a partial runtime bridge that may mint short-lived typed bridge material for an authenticated subject but is not canonical permission grant lifecycle, does not persist grant state, and must not be confused with Realm-owned app permission grant truth; OASIS/world/app interconnect remains future motivation, not public multi-world readiness."
  - rule_id: R-PERM-009
    level: must
    title: first-party-seed-grants-are-realm-grant-seeds-only
    statement: "Public Platform first-party seed grants are Realm grant seed inputs only for admitted first-party app ids; the current admitted seed app is nimi.avatar with the exact scope set declared in tables/permission-grant-contract.yaml, and Realm must materialize, project, and validate those seed scopes through the canonical app permission grant lifecycle while any scope outside the admitted seed set fails closed and the seed set must not become an app-local allowlist, runtime-local default grant, ordinary Apps visibility expansion, or app self-admission path."
entities:
  - name: AppPermissionGrant
    prisma_model: AppPermissionGrant
    required_fields:
      - grantId
      - subjectAccountId
      - appId
      - scopeFamily
      - scopeName
      - qualifier
      - state
      - reason
      - requestedAt
      - requestedByAccountId
      - grantedAt
      - grantedByAccountId
      - deniedAt
      - deniedByAccountId
      - revokedAt
      - revokedByAccountId
      - expiredAt
      - supersededAt
      - supersededByAccountId
      - supersededByGrantId
      - expiresAt
      - version
    json_fields: []
  - name: PermissionGrantProjection
    prisma_model: null
    required_fields:
      - grantId
      - subjectAccountId
      - appId
      - scopeFamily
      - scopeName
      - qualifier
      - state
      - expiresAt
      - version
    json_fields: []
grant_states:
  closed_set:
    - PENDING
    - GRANTED
    - DENIED
    - EXPIRED
    - REVOKED
    - SUPERSEDED
  authorizing_state: GRANTED
  non_authorizing_states:
    - PENDING
    - DENIED
    - EXPIRED
    - REVOKED
    - SUPERSEDED
grant_record:
  subject_authority: authenticated_realm_account
  app_subject_authority: request_hint_only
  forbidden_material:
    - raw_credentials
    - bearer_tokens
    - hmac_token_bytes
    - oauth_tokens
    - provider_secrets
    - app_local_secret_material
first_party_seed_grants:
  source_authority_ref: public-nimi:.nimi/spec/platform/kernel/tables/nimi-app-registry.yaml
  seed_rows:
    - appId: nimi.avatar
      admission_status: admitted
      ordinary_visibility: hidden-internal
      scopes:
        - scopeFamily: account
          scopeName: account.session.read
        - scopeFamily: agent
          scopeName: agent.identity.project
        - scopeFamily: memory
          scopeName: memory.read.bounded
          qualifier: persona-scoped
        - scopeFamily: memory
          scopeName: memory.write.admitted
          qualifier: session-scoped
        - scopeFamily: ai_spend
          scopeName: ai.spend.meter
        - scopeFamily: file_device
          scopeName: device.use.scoped
        - scopeFamily: file_device
          scopeName: file.read.scoped
        - scopeFamily: ai_profile
          scopeName: ai_profile.selection.consume
  lifecycle_binding: canonical_app_permission_grant
  non_authority_effects:
    - ordinary_apps_visibility
    - app_self_admission
    - app_local_allowlist
    - runtime_local_default_grant
lifecycle_operations:
  required_mutations:
    - request
    - grant
    - deny
    - expire
    - revoke
    - supersede
  mutation_posture:
    - explicit
    - idempotent
    - auditable
    - version_guarded
runtime_bridge_boundary:
  existing_route: POST /api/runtime/realm-grants/issue
  status: partial_stateless_bridge
  canonical_lifecycle_truth: false
  may_project_to:
    - Runtime
    - Desktop
    - SDK
api_surface:
  required_operations:
    - request app permission grant
    - grant app permission grant
    - deny app permission grant
    - expire app permission grant
    - revoke app permission grant
    - supersede app permission grant
    - list own app permission grants
    - project typed app permission grant
  secondary_operations:
    - POST /api/runtime/realm-grants/issue
