rule_id_prefix: R-CHAT-
rules:
  - rule_id: R-CHAT-001
    level: must
    title: chat-is-realm-domain
    statement: "Realm owns Chat as a realm domain and provides the canonical thread, message, read-state, sync, membership, group lifecycle, and agent-slot metadata surface."
  - rule_id: R-CHAT-002
    level: must
    title: direct-and-group-substrate-in-v1
    statement: "Realm Chat v1 admits DIRECT and GROUP as canonical chat substrates; GROUP threads may contain human participants and agent slots/authors, while AI execution, prompt assembly, model routing, session orchestration, and turn execution stay outside Realm Chat. CHANNEL and any unsupported chat shape must fail-close."
  - rule_id: R-CHAT-003
    level: must
    title: social-gates-chat-but-does-not-own-it
    statement: "Social gates human participant admission and preconditions, but canonical chat threads, messages, read state, and sync cursor semantics belong to Chat."
  - rule_id: R-CHAT-004
    level: must
    title: agent-chat-runtime-stays-outside
    statement: "Human-agent chat, agent-agent chat, model routing, prompt assembly, session orchestration, and turn execution runtime stay outside Realm Chat v1, and group membership does not transfer those responsibilities into Realm."
  - rule_id: R-CHAT-005
    level: must
    title: canonical-chat-attachment-envelope
    statement: "Realm Chat canonicalizes non-text attachments as MessageType ATTACHMENT with payload.attachment generic envelope and does not expose assetId-only or resourceId-only attachment payload contracts."
  - rule_id: R-CHAT-006
    level: must
    title: chat-owns-group-lifecycle-and-admin-authority
    statement: "Realm Chat owns GROUP lifecycle transitions, roster management, membership roles, and agent-slot metadata; Social only gates human admission preconditions and does not own group lifecycle or agent-slot state."
  - rule_id: R-CHAT-007
    level: must
    title: group-agent-authorship-must-validate-slot-binding
    statement: "Agent-authored group posts and messages must validate thread owner and slot binding before commit, read visibility, or sync fanout, and spoofed agent authorship must fail-close."
  - rule_id: R-CHAT-008
    level: must
    title: realm-group-agent-participation-consumes-runtime
    statement: "Realm Group Agent Participation is a Realm GROUP product surface and Runtime Agent Participation consumer; Realm owns group product truth while Runtime owns execution, policy verdicts, candidates, audit/replay, and same-room orchestration."
  - rule_id: R-CHAT-009
    level: must
    title: realm-owns-group-agent-slot-lifecycle
    statement: "Realm owns the GROUP agent slot lifecycle and visibility metadata, but slot state must not imply Runtime prompt, provider/model, memory, capability, concurrency, queue, or execution ownership."
  - rule_id: R-CHAT-010
    level: must
    title: group-agent-triggers-are-closed
    statement: "Realm Group agent triggers are closed to mention, explicit user action, admitted automation, or product-disabled posture, and admitted triggers must carry Realm evidence before Runtime participation admission."
  - rule_id: R-CHAT-011
    level: must
    title: runtime-candidate-realm-commit-handoff
    statement: "Runtime may return only REALM_GROUP_MESSAGE_CANDIDATE output; Realm must authenticate candidate lineage, target chat, target agent slot, author authority, evidence hash, runtime trace reference, idempotency, moderation/refusal posture, and audit record before canonical GROUP message commit."
  - rule_id: R-CHAT-012
    level: must
    title: group-agent-candidate-commit-operation
    statement: "The only admitted Realm commit-handoff operation for group agent candidates is POST /api/human/group-chats/{chatId}/agent-message-candidate-commits with CommitRealmGroupMessageCandidateInputDto; historical POST /api/human/group-chats/{chatId}/agent-messages and SendGroupAgentMessageInputDto are not compatibility aliases and must be removed."
  - rule_id: R-CHAT-013
    level: must
    title: group-agent-commit-forbidden-fields
    statement: "Realm Group candidate commit requests must not accept raw text, payload, prompt, systemPrompt, provider, model, messageId, senderId, or caller-owned agentAccountId as commit authority; canonical messageId may appear only after Realm validation and storage succeed."
  - rule_id: R-CHAT-014
    level: must
    title: sdk-desktop-preserve-candidate-commit-split
    statement: "SDK and Desktop consumers must preserve split Runtime candidate and Realm commit facades; collapsed generate-and-commit helpers, Desktop direct REST, Runtime internal imports, sendGroupMessage substitution, runtime.agent.turn.request substitution, renderer-local committed truth, and synthetic candidate/message success are forbidden."
  - rule_id: R-CHAT-015
    level: must
    title: group-candidate-typed-payload-commit-boundary
    statement: "Realm Group candidate commit may carry only typed REALM_GROUP_MESSAGE_CANDIDATE output fields derived from the local Runtime candidate evidence read: candidate ids/refs, evidenceHash, runtimeTraceRef, output/audit/policy refs, timestamps, commitDisposition, and either validated TEXT body plus bodyHash or validated refusal code/reason plus refusalHash; Realm validates authenticated user authority, group membership, active realmGroupAgentSlotId, localAgentRef, agent participant projection, candidate kind, trigger, idempotency, expiry, canonical payload hash, body/refusal hash, and moderation/refusal posture before storage; Realm must not require Runtime authorship proof, Runtime attestation, Realm-side Runtime verifier, evidence escrow, or Realm direct Runtime access for this group chat commit path, and commit requests must still not carry raw prompt text, raw provider output, provider/model selection, untyped payload, caller-owned messageId, caller-owned senderId, or caller-owned agent identity as commit authority."
  - rule_id: R-CHAT-016
    level: must
    title: realm-agent-slot-id-is-durable-binding-identity
    statement: "realmGroupAgentSlotId is the durable Realm identity for a local Agent participation binding inside a specific GROUP thread, distinct from the Realm Agent source identity and human membership identity; executable local Agent reference is localAgentRef = local-agent:${ownerUserId}:${realmAgentId}, and commit must validate the same active realmGroupAgentSlotId, target chatId, and localAgentRef because realmAgentId alone is not a valid executable local Agent or group slot reference."
  - rule_id: R-CHAT-017
    level: must
    title: realm-agent-and-local-agent-identity-split
    statement: "Realm Agent source identity and executable local Agent identity are distinct: realmAgentId identifies the Realm Agent source entity for Realm truth, Realm projection, world relationships, social visibility, and friendship relationships, while localAgentRef = local-agent:${ownerUserId}:${realmAgentId} identifies the owner-scoped executable local fork; local execution, direct Human-Agent local chat, local memory, local projection, avatar binding, Agent Center resources, Runtime Agent records, SDK/IPC conversation anchors, and group Runtime candidate handoff must not be keyed or authorized by bare realmAgentId or agentId."
  - rule_id: R-CHAT-018
    level: must
    title: human-agent-direct-chat-is-local-fork-route
    statement: "Human-Agent DIRECT chat is admitted only as a Private Desktop local-chat product route after Realm friendship/admission checks; it must create or reuse the owner-scoped local Agent fork identified by localAgentRef = local-agent:${ownerUserId}:${realmAgentId} and persist local thread identity by localAgentRef, while Realm DIRECT cloud transcript truth remains Human-Human only and Desktop, SDK, Runtime, and local stores must not convert Human-Agent local chat into Realm cloud DIRECT transcript truth or use realmAgentId alone as the local thread key."
  - rule_id: R-CHAT-019
    level: must
    title: local-agent-execution-consumers-require-identity-tuple
    statement: "All consumers of local Agent execution identity must carry ownerUserId, realmAgentId, and localAgentRef; realmAgentId may be stored only as source metadata and must not be sufficient authority for execution, memory, projection, avatar, Agent Center package/config, or conversation-anchor selection, and missing or mismatched tuple fields must fail-close without legacy aliases, dual read/write compatibility, synthetic success, or renderer-local shadow truth."
  - rule_id: R-CHAT-020
    level: must
    title: local-agent-fork-cardinality-is-single-per-owner-source-agent
    statement: "V1 admits exactly one canonical local Agent execution fork for a given ownerUserId plus realmAgentId pair, addressed by localAgentRef = local-agent:${ownerUserId}:${realmAgentId}; any product need for multiple simultaneous local forks of the same Realm Agent for one owner or for an opaque persisted localAgentId distinct from that deterministic localAgentRef requires a new admitted authority decision before implementation, and until then implementation must hard-cut to deterministic localAgentRef identity and fail closed on ambiguous fork cardinality."
