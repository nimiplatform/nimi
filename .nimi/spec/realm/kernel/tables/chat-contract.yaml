contract_id: CHAT-CONTRACT-001
domain: chat
status: ACTIVE
version: 2026-05-13
owner: '@team'
sources:
  human_spec: ../chat-contract.md
  openapi:
    - nimi-backend/api-nimi.yaml
  prisma: nimi-backend/prisma/schema.prisma
  services:
    - nimi-backend/libs/domains/chat/src/domains/chat.service.ts
    - nimi-backend/libs/domains/chat/src/domains/group-chat.service.ts
    - nimi-backend/apps/api/src/modules/group-chat/group-chat.controller.ts
rule_id_prefix: R-CHAT-
rules:
  - rule_id: R-CHAT-001
    level: must
    title: chat-is-realm-domain
    statement: "Realm owns Chat as a realm domain and provides the canonical thread, message, read-state, sync, membership, group lifecycle, and agent-slot metadata surface."
  - rule_id: R-CHAT-002
    level: must
    title: direct-and-group-substrate-in-v1
    statement: "Realm Chat v1 admits DIRECT and GROUP as canonical chat substrates; GROUP threads may contain human participants and agent slots/authors, while AI execution, prompt assembly, model routing, session orchestration, and turn execution stay outside Realm Chat. CHANNEL and any unsupported chat shape must fail-close."
  - rule_id: R-CHAT-003
    level: must
    title: social-gates-chat-but-does-not-own-it
    statement: "Social gates human participant admission and preconditions, but canonical chat threads, messages, read state, and sync cursor semantics belong to Chat."
  - rule_id: R-CHAT-004
    level: must
    title: agent-chat-runtime-stays-outside
    statement: "Human-agent chat, agent-agent chat, model routing, prompt assembly, session orchestration, and turn execution runtime stay outside Realm Chat v1, and group membership does not transfer those responsibilities into Realm."
  - rule_id: R-CHAT-005
    level: must
    title: canonical-chat-attachment-envelope
    statement: "Realm Chat canonicalizes non-text attachments as MessageType ATTACHMENT with payload.attachment generic envelope and does not expose assetId-only or resourceId-only attachment payload contracts."
  - rule_id: R-CHAT-006
    level: must
    title: chat-owns-group-lifecycle-and-admin-authority
    statement: "Realm Chat owns GROUP lifecycle transitions, roster management, membership roles, and agent-slot metadata; Social only gates human admission preconditions and does not own group lifecycle or agent-slot state."
  - rule_id: R-CHAT-007
    level: must
    title: group-agent-authorship-must-validate-slot-binding
    statement: "Agent-authored group posts and messages must validate thread owner and slot binding before commit, read visibility, or sync fanout, and spoofed agent authorship must fail-close."
  - rule_id: R-CHAT-008
    level: must
    title: realm-group-agent-participation-consumes-runtime
    statement: "Realm Group Agent Participation is a Realm GROUP product surface and Runtime Agent Participation consumer; Realm owns group product truth while Runtime owns execution, policy verdicts, candidates, audit/replay, and same-room orchestration."
  - rule_id: R-CHAT-009
    level: must
    title: realm-owns-group-agent-slot-lifecycle
    statement: "Realm owns the GROUP agent slot lifecycle and visibility metadata, but slot state must not imply Runtime prompt, provider/model, memory, capability, concurrency, queue, or execution ownership."
  - rule_id: R-CHAT-010
    level: must
    title: group-agent-triggers-are-closed
    statement: "Realm Group agent triggers are closed to mention, explicit user action, admitted automation, or product-disabled posture, and admitted triggers must carry Realm evidence before Runtime participation admission."
  - rule_id: R-CHAT-011
    level: must
    title: runtime-candidate-realm-commit-handoff
    statement: "Runtime may return only REALM_GROUP_MESSAGE_CANDIDATE output; Realm must authenticate candidate lineage, target chat, target agent slot, author authority, evidence hash, runtime trace reference, idempotency, moderation/refusal posture, and audit record before canonical GROUP message commit."
  - rule_id: R-CHAT-012
    level: must
    title: group-agent-candidate-commit-operation
    statement: "The only admitted Realm commit-handoff operation for group agent candidates is POST /api/human/group-chats/{chatId}/agent-message-candidate-commits with CommitRealmGroupMessageCandidateInputDto; historical POST /api/human/group-chats/{chatId}/agent-messages and SendGroupAgentMessageInputDto are not compatibility aliases and must be removed."
  - rule_id: R-CHAT-013
    level: must
    title: group-agent-commit-forbidden-fields
    statement: "Realm Group candidate commit requests must not accept raw text, payload, prompt, systemPrompt, provider, model, messageId, senderId, or caller-owned agentAccountId as commit authority; canonical messageId may appear only after Realm validation and storage succeed."
  - rule_id: R-CHAT-014
    level: must
    title: sdk-desktop-preserve-candidate-commit-split
    statement: "SDK and Desktop consumers must preserve split Runtime candidate and Realm commit facades; collapsed generate-and-commit helpers, Desktop direct REST, Runtime internal imports, sendGroupMessage substitution, runtime.agent.turn.request substitution, renderer-local committed truth, and synthetic candidate/message success are forbidden."
  - rule_id: R-CHAT-015
    level: must
    title: candidate-evidence-verifier-is-required
    statement: "Realm Group candidate commit must consume candidate content only through a Runtime-owned candidate evidence reference verified by a Realm-side verifier that returns an immutable RealmGroupMessageCandidateSnapshot matching evidenceHash; missing verifier, missing snapshot, hash mismatch, expired snapshot, thread mismatch, slot mismatch, trigger mismatch, or non-REALM_GROUP_MESSAGE_CANDIDATE output must fail closed before storage."
  - rule_id: R-CHAT-016
    level: must
    title: realm-agent-slot-id-is-durable-binding-identity
    statement: "realmGroupAgentSlotId is the durable Realm identity for a local Agent participation binding inside a specific GROUP thread, distinct from the Realm Agent source identity and human membership identity; executable local Agent reference is localAgentRef = ownerUserId + realmAgentId, and commit must validate the same active realmGroupAgentSlotId, target chatId, and localAgentRef because realmAgentId alone is not a valid executable local Agent or group slot reference."
entities:
  - name: ChatThread
    prisma_model: Chat
    required_fields: [id, type, accountIdL, accountIdH, createdAt, updatedAt]
    json_fields: []
  - name: ChatMessage
    prisma_model: Message
    required_fields: [id, chatId, senderId, type, createdAt]
    json_fields: [payload, interaction, diagnostics]
  - name: GroupChatThread
    prisma_model: Chat
    required_fields: [id, type, title, creatorId, createdAt, updatedAt]
    json_fields: []
  - name: GroupParticipant
    prisma_model: ChatParticipant
    required_fields: [chatId, accountId, role, joinedAt]
    json_fields: []
  - name: GroupMessage
    prisma_model: Message
    required_fields: [id, chatId, senderId, type, createdAt]
    json_fields: [payload, interaction, diagnostics]
  - name: RealmGroupAgentSlot
    prisma_model: RealmGroupAgentSlot
    required_fields: [id, chatId, ownerUserId, realmAgentId, state, createdAt]
    json_fields: [display, audit]
  - name: RealmGroupMessageCandidateSnapshot
    prisma_model: RuntimeEvidence
    required_fields: [candidateId, candidateKind, realmGroupThreadId, realmGroupAgentSlotId, ownerUserId, realmAgentId, localAgentRef, evidenceHash, runtimeTraceRef, expiresAt]
    json_fields: [body, refusal, lineage]
group_authority:
  lifecycle_owner: Chat
  admission_admin_owner: Chat
  human_admission_gate: Social
  anti_spoof_rule: Agent-authored group posts and messages must validate thread owner/slot binding before commit, read visibility, or sync fanout.
  candidate_commit_handoff_owner: Chat
  runtime_candidate_owner: Runtime
  candidate_evidence_verifier_owner: Runtime evidence, Realm verification
  agent_slot_identity_owner: Chat
  historical_agent_messages_posture: remove_not_alias
api_surface:
  required_operations:
    - GET /api/human/chats
    - POST /api/human/chats
    - GET /api/human/chats/{chatId}
    - GET /api/human/chats/{chatId}/messages
    - GET /api/human/chats/{chatId}/sync
    - POST /api/human/chats/{chatId}/messages
    - PATCH /api/human/chats/{chatId}/messages/{messageId}
    - POST /api/human/chats/{chatId}/messages/{messageId}/recall
    - POST /api/human/chats/{chatId}/read
    - GET /api/human/group-chats
    - POST /api/human/group-chats
    - GET /api/human/group-chats/{chatId}
    - PATCH /api/human/group-chats/{chatId}
    - GET /api/human/group-chats/{chatId}/messages
    - POST /api/human/group-chats/{chatId}/messages
    - POST /api/human/group-chats/{chatId}/agent-message-candidate-commits
    - PATCH /api/human/group-chats/{chatId}/messages/{messageId}
    - POST /api/human/group-chats/{chatId}/messages/{messageId}/recall
    - POST /api/human/group-chats/{chatId}/read
    - GET /api/human/group-chats/{chatId}/sync
    - POST /api/human/group-chats/{chatId}/participants
    - DELETE /api/human/group-chats/{chatId}/participants/{accountId}
    - PATCH /api/human/group-chats/{chatId}/participants/{accountId}
    - POST /api/human/group-chats/{chatId}/agents
    - DELETE /api/human/group-chats/{chatId}/agents/{agentAccountId}
  secondary_operations: []
service_evidence_notes:
  - "Human chat surface is handled by nimi-backend/apps/api/src/modules/chat/chat.controller.ts; group chat surface is handled by nimi-backend/apps/api/src/modules/group-chat/group-chat.controller.ts and nimi-backend/libs/domains/chat/src/domains/group-chat.service.ts."
dto_evidence:
  - GroupChatViewDto
  - GroupParticipantDto
  - GroupMessageAuthorDto
  - GroupMessageViewDto
  - ListGroupChatsResultDto
  - ListGroupMessagesResultDto
  - CreateGroupInputDto
  - UpdateGroupInputDto
  - AddGroupParticipantInputDto
  - AddGroupAgentInputDto
  - CommitRealmGroupMessageCandidateInputDto
  - RealmGroupMessageCandidateCommitResultDto
  - RealmGroupMessageCandidateSnapshotDto
  - RealmGroupAgentSlotDto
  - UpdateParticipantRoleInputDto
  - ChatSyncResultDto
test_evidence_notes:
  - "Group lifecycle/admin, roster changes, and agent-auth anti-spoof are covered by nimi-backend/libs/domains/chat/src/domains/group-chat.service.spec.ts, with broader chat coverage in chat.controller.spec.ts and social integration tests."
  - "Wave-1 must replace historical direct group agent message commit with candidate commit-handoff tests that validate candidate lineage, evidence hash, runtime trace ref, idempotency, moderation/refusal, audit, and no raw text fallback."
