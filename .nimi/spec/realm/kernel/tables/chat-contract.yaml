    required_fields: [id, chatId, senderId, type, createdAt]
    json_fields: [payload, interaction, diagnostics]
  - name: GroupChatThread
    prisma_model: Chat
    required_fields: [id, type, title, creatorId, createdAt, updatedAt]
    json_fields: []
  - name: GroupParticipant
    prisma_model: ChatParticipant
    required_fields: [chatId, accountId, role, joinedAt]
    json_fields: []
  - name: GroupMessage
    prisma_model: Message
    required_fields: [id, chatId, senderId, type, createdAt]
    json_fields: [payload, interaction, diagnostics]
  - name: RealmGroupAgentSlot
    prisma_model: RealmGroupAgentSlot
    required_fields: [id, chatId, ownerUserId, realmAgentId, localAgentRef, state, createdAt]
    json_fields: [display, audit]
  - name: RealmGroupMessageCandidateCommitPayload
    prisma_model: CommitRealmGroupMessageCandidateInputDto
    required_fields: [candidateId, candidateKind, candidateEvidenceRef, evidenceHash, runtimeTraceRef, expectedRealmGroupAgentSlotId, expectedLocalAgentRef, triggerRef, outputCandidateRef, auditLineageRef, policyVerdictRef, createdAt, expiresAt, commitDisposition, idempotencyKey]
    json_fields: [body, refusal]
