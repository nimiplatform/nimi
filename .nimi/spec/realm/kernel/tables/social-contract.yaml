contract_id: SOCIAL-CONTRACT-001
domain: social
status: ACTIVE
version: 2026-03-23
table_family: product_catalog
catalog_id: realm_social_contract
entries:
  - human_spec
  - openapi
  - prisma
  - services
  - R-SOC-001
  - R-SOC-002
  - R-SOC-003
  - R-SOC-004
  - R-SOC-005
  - R-SOC-006
  - R-SOC-007
  - R-SOC-008
  - R-SOC-009
  - Friendship
  - SocialPrecondition
  - required_operations
  - secondary_operations
owner: '@team'
sources:
  human_spec: ../social-contract.md
  openapi:
    - nimi-backend/api-nimi.yaml
  prisma: nimi-backend/prisma/schema.prisma
  services:
    - nimi-backend/libs/domains/relationship/src/friendship.service.ts
    - nimi-backend/libs/domains/user/src/domains/user.service.ts
rule_id_prefix: R-SOC-
rules:
  - rule_id: R-SOC-001
    level: must
    title: friendship-graph-is-canonical
    statement: "Friendship is the canonical admission graph for realm-level social relationships."
  - rule_id: R-SOC-002
    level: must
    title: ordered-pair-uniqueness
    statement: "Friendship uses an ordered pair uniqueness model so the same pair cannot produce duplicate canonical rows."
  - rule_id: R-SOC-003
    level: must
    title: social-defines-admission-not-execution
    statement: "Social defines relationship and admission facts and does not define agent-chat runtime, model routing, or turn execution."
  - rule_id: R-SOC-004
    level: must
    title: social-gates-human-chat-agent-chat-stays-outside
    statement: "Social may gate human chat via preconditions, but canonical chat surface lives in Realm Chat and agent chat runtime stays outside Realm."
  - rule_id: R-SOC-005
    level: must
    title: official-guide-agentfriend-quota-exception
    statement: "Official guide AgentFriend relationships admitted by R-SOC official seed rows do not count against ordinary AgentFriend quota only when quota_policy=official_guide_exception; the exception must not generalize to ordinary RealmAgents."
  - rule_id: R-SOC-006
    level: must
    title: official-realmagent-seed-authority
    statement: "Realm owns official RealmAgent seed truth; Desktop, Runtime, SDK, and app-local fixtures must not create fake official guides without a Realm official seed."
  - rule_id: R-SOC-007
    level: must
    title: archivist-seed-admitted
    statement: "Archivist / @archivist.nimi is an admitted official RealmAgent seed with official Nimi guide provenance and OASIS/system main World association."
  - rule_id: R-SOC-008
    level: must
    title: official-relationship-provisioning-source
    statement: "Realm owns the official relationship source fact that new registered accounts receive an AgentFriend relationship to admitted official guide seeds when auto_provision.agent_friend=true."
  - rule_id: R-SOC-009
    level: must
    title: official-guide-quota-exception
    statement: "Official guide AgentFriend relationships declared with quota_policy=official_guide_exception do not count against ordinary AgentFriend quota and must remain an explicit exception."
entities:
  - name: Friendship
    prisma_model: Friendship
    required_fields: [id, accountIdL, accountIdH, kind, status]
    json_fields: []
  - name: SocialPrecondition
    prisma_model: Friendship
    required_fields: [kind, status]
    json_fields: []
api_surface:
  required_operations:
    - GET /api/human/accounts/{id}/friends
    - POST /api/human/accounts/{id}/friends
    - DELETE /api/human/accounts/{id}/friends
    - GET /api/human/me/friends
    - GET /api/human/me/friends/list
    - GET /api/human/me/friends/pending
  secondary_operations:
    - GET /api/human/accounts/{id}/mutual-friends
    - GET /api/human/accounts/{id}/mutual-friends/count
