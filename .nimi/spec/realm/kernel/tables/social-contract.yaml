rules:
  - rule_id: R-SOC-001
    level: must
    title: friendship-graph-is-canonical
    statement: "Friendship is the canonical admission graph for realm-level social relationships."
  - rule_id: R-SOC-002
    level: must
    title: ordered-pair-uniqueness
    statement: "Friendship uses an ordered pair uniqueness model so the same pair cannot produce duplicate canonical rows."
  - rule_id: R-SOC-003
    level: must
    title: social-defines-admission-not-execution
    statement: "Social defines relationship and admission facts and does not define agent-chat runtime, model routing, or turn execution."
  - rule_id: R-SOC-004
    level: must
    title: social-gates-human-chat-agent-chat-stays-outside
    statement: "Social may gate human chat via preconditions, but canonical chat surface lives in Realm Chat and agent chat runtime stays outside Realm."
  - rule_id: R-SOC-005
    level: must
    title: nimi-guide-agentfriend-is-ordinary
    statement: "Nimi-authored guide agents use the same Realm social mechanics as any ordinary RealmAgent. Their AgentFriend relationships are ordinary Friendship rows and do not create privileged Agent classes, special social schema, hidden quota exceptions, or authority-bearing official-agent status."
  - rule_id: R-SOC-006
    level: must
    title: owner-agent-list-and-quota-share-master-owned-scope
    statement: "Owner-agent listing and owner-agent quota share the MASTER_OWNED scope. For every user u, count(listMyRealmAgents(u)) === owner-agent limit count(u). Both sides are defined as AgentProfile rows where creatorId = u and ownershipType = MASTER_OWNED. WORLD_OWNED RealmAgents and world-created NPC RealmAgents are excluded from both list and quota; they must not consume the owner-agent slot budget on the create / adopt path while being absent from /api/me/agents."
  - rule_id: R-SOC-007
    level: must
    title: agentfriend-removal-localagent-deletion-linkage
    statement: "AgentFriend removal and LocalAgent deletion are one server-authoritative canonical linkage. Removing an AgentFriend Friendship row must delete its one-to-one LocalAgent projection and neither side may survive the other. The backend Realm social admission path owns the linkage trigger and the renderer must not own it. Removal executes as one fail-closed ordered unit that validates the agent-variant Friendship and resolves the owner and RealmAgent pair, deletes the canonical Friendship row, then issues runtime TerminateAgent deletion for the deterministic localAgentRef. The linkage is idempotent so repeated removal, retry after transport failure, or removal of an AgentFriend with no materialized LocalAgent converges to the same dangling-free end state. A failed LocalAgent deletion fails closed as a typed error or a durable retried termination intent and must not be reported as renderer-synthesized success. Removal must not leave a half-applied orphan LocalAgent or dangling AgentFriend, and must not mutate the corresponding RealmAgent canonical truth."
  - rule_id: R-SOC-008
    level: must
    title: localagent-termination-intent-and-courier-mechanism
    statement: "The R-SOC-007 companion mechanism rule defining the LocalAgentTerminationIntent record, its lifecycle, the viewer-scoped list/ack API, and the desktop reconciliation courier. An agent-variant AgentFriend removal must persist exactly one durable LocalAgentTerminationIntent as the server-owned representation of the pending LocalAgent deletion, carrying the owner user, RealmAgent account, deterministic localAgentRef, removed-Friendship provenance, status, substrate-failure attempt counter, last error, backoff availability time, and acknowledgement metadata; the record is unique per localAgentRef so a repeated removal converges onto the same record. The lifecycle is the typed set OPEN, ACKED, FAILED, where ACKED is terminal success including the K-AGCORE-141 absent-ref typed no-op and FAILED is a reopenable needs-attention state that must not be silently dropped. The intent record must be written in the same database transaction as the canonical Friendship row deletion so both commit or both roll back. The backend must expose a viewer-scoped list/ack API that returns only the caller's own intents and applies acknowledgement as a backend-owned idempotent state transition; only typed runtime substrate failures charge the attempt counter toward the maximum ten attempts while transport and offline failures never charge an attempt or move a record toward FAILED. The desktop reconciliation courier is pure transport that pulls open intents, delivers runtime TerminateAgent, and reports a typed outcome; it owns no decision, is stateless with no desktop-local intent queue, is idempotent against the K-AGCORE-141 no-op, must not synthesize success, and must not drive renderer-local linkage state. The backend table is the sole durable store and a long-offline device converges when it next comes online."
  - rule_id: R-SOC-009
    level: must
    title: agentfriend-creation-localagent-establishment-linkage
    statement: "AgentFriend creation and LocalAgent establishment are one server-authoritative canonical linkage, the creation counterpart to R-SOC-007. Committing an agent-variant Friendship row, whether through a direct add or the acceptance of a received agent friend request, must deterministically establish the one-to-one LocalAgent projection; the AgentFriend creation is not complete until that projection exists or its durable provision intent is persisted. The creation linkage trigger is backend / Realm social admission owned and the renderer must not own it. Creation executes as one fail-closed ordered unit that commits the agent-variant Friendship and resolves the owner and RealmAgent pair, persists exactly one durable LocalAgentProvisionIntent for the deterministic localAgentRef in the same database transaction, then has the device courier deliver runtime InitializeAgent. The LocalAgentProvisionIntent carries the owner user, RealmAgent account, deterministic localAgentRef, created-Friendship provenance, status, substrate-failure attempt counter, last error, backoff availability time, and acknowledgement metadata, is unique per localAgentRef so a repeated creation converges onto the same record, and must never coexist live with a LocalAgentTerminationIntent for the same localAgentRef because re-add supersedes a non-terminal termination intent and removal supersedes a non-terminal provision intent. The lifecycle is the typed set OPEN, ACKED, FAILED, where ACKED is terminal success including the K-AGCORE-139 already-exists idempotent no-op and FAILED is a reopenable needs-attention state that must not be silently dropped. The intent record must be written in the same database transaction as the canonical Friendship row creation so both commit or both roll back. The backend must expose a viewer-scoped list/ack API that returns only the caller's own intents and applies acknowledgement as a backend-owned idempotent state transition; only typed runtime substrate failures charge the attempt counter toward the maximum ten attempts while transport and offline failures never charge an attempt or move a record toward FAILED. The desktop reconciliation courier is pure transport that pulls open intents, delivers runtime InitializeAgent, and reports a typed outcome; it owns no decision, is stateless with no desktop-local intent queue, is idempotent against the K-AGCORE-139 no-op, must not synthesize success, and must not drive renderer-local linkage state. The backend table is the sole durable store and a long-offline or cross-device device converges when its courier next processes the server-owned open intent. The linkage is idempotent so repeated creation, retry after transport failure, or acceptance for an already-established LocalAgent converges to exactly one LocalAgent and one AgentFriend. Creation must not leave a half-applied state, must not be projected as renderer-synthesized success, must not be satisfied by a renderer-owned two-call create-then-ensure sequence, and must not mutate the corresponding RealmAgent canonical truth."
