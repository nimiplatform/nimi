rules:
  - rule_id: R-TRUTH-001
    domain: truth
    level: must
    title: realm-truth-scope
    statement: Realm canonical truth is limited to creator-governed world truth and agent truth; runtime story output is not truth by default.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-TRUTH-002
    domain: truth
    level: must
    title: world-rule-canonical
    statement: World truth is anchored by WorldRule entries and WorldRelease snapshots; Worldview is computed projection only.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-TRUTH-003
    domain: truth
    level: must
    title: agent-rule-canonical
    statement: Agent truth is anchored by AgentRule entries bound to world scope; agent truth defines identity and durable behavioral boundaries only.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-TRUTH-004
    domain: truth
    level: must
    title: creator-only-truth-write
    statement: Truth writes are reserved for creator/control-plane authority and cannot be produced by runtime story execution.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-TRUTH-005
    domain: truth
    level: must
    title: truth-write-audited
    statement: Truth changes are explicit, versioned, transactional, and auditable; projection updates cannot masquerade as truth writes.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-TRUTH-006
    domain: truth
    level: must
    title: truth-app-independent
    statement: Realm truth remains app-independent and cannot be owned by a single app, renderer, or model route.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-TRUTH-007
    domain: truth
    level: must
    title: oasis-is-system-main-world
    statement: OASIS is the unique system main world in Realm truth, cannot be creator-owned, and cannot be replaced by creator convention.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-TRUTH-008
    domain: truth
    level: must
    title: oasis-read-surface-formal
    statement: GET /api/world/oasis is a formal Realm truth read surface for the system main world and not a legacy browse shortcut.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-TRUTH-009
    domain: truth
    level: must
    title: public-projection-aggregates-not-truth
    statement: Public read surfaces (e.g. detail-with-agents) may expose computed aggregates derived from truth (activeRuleCount, agentRuleSummary byLayer) but must not expose AgentRule content; aggregates are projection, not truth writes.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-TRUTH-010
    domain: truth
    level: must
    title: world-scenes-public-read-surface
    statement: GET /api/world/by-id/{id}/scenes is a public read surface exposing Scene identity (id, name, description, activeEntities) for a world; it does not modify truth state.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-TRUTH-011
    domain: truth
    level: must
    title: official-package-publish-is-unique
    statement: Official Realm content publish must converge on one package-native publish contract; world-drafts may remain minimal candidates but are not a parallel canonical truth-write contract for official content.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-TRUTH-012
    domain: truth
    level: must
    title: official-publish-governance-provenance-required
    statement: Official package publish requires explicit governance provenance including official owner, editorial operator, reviewer, publisher, source provenance, and review verdict; missing required governance identity or verdict must fail-close.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-TRUTH-013
    domain: truth
    level: must
    title: official-publish-atomic-world-agent-release
    statement: Official package publish must atomically write world truth, agent truth, projection inputs, and WorldRelease; world-published/agent-pending or release-less success states are invalid.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-TRUTH-014
    domain: truth
    level: must
    title: release-governance-and-rollback-anchor
    statement: WorldRelease is the sole official truth release governance anchor; each official publish must bind package version, publish provenance, checksum/diff metadata, and rollback lineage to an explicit release identity.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-TRUTH-015
    domain: truth
    level: must
    title: canonical-truth-package-is-formal-ingress
    statement: CanonicalTruthPackage is the formal upstream truth-ingress object for official content publish; it must separate canonical truth units, derivation or inheritance inputs, projection inputs, and governance or release metadata, and must not center lorebook text, prompt payloads, or card views.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-TRUTH-016
    domain: truth
    level: must
    title: inheritance-link-is-formal-world-agent-edge
    statement: InheritanceLink is the formal world-truth-to-agent-truth edge; WORLD_INHERITED and worldRuleRef may materialize it, but they do not replace the full inheritance semantics.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-TRUTH-017
    domain: truth
    level: must
    title: all-agent-entry-paths-share-derivation-line
    statement: Official package publish, creator create-agent, and future import surfaces must pass through the same truth derivation line and fail-close if they cannot produce governed truth writes, inheritance materialization or derivation basis, and projection inputs.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-TRUTH-018
    domain: truth
    level: must
    title: observation-markup-protocol-is-sole-formal-authoring-wire-contract
    statement: Formal Forge extract-observations and refine-observations must converge on one ObservationMarkupProtocol mainline; strict single-object JSON payloads and provider- or stage-specific parallel wire contracts are not formal authority.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-TRUTH-019
    domain: truth
    level: must
    title: observation-commit-ledger-admits-validated-closed-units-only
    statement: ObservationCommitLedger may admit only closed and validated observation units; truncated envelopes, unclosed units, or provider-returned but unvalidated content are not committed authoring truth evidence.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-TRUTH-020
    domain: truth
    level: must
    title: continuation-plan-is-runtime-owned
    statement: ObservationContinuationPlan semantics are owned by the runtime or authoring kernel, not by the model; models may declare remaining categories or stop reason but may not define opaque cursor semantics or override frozen sequence discipline.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-TRUTH-021
    domain: truth
    level: must
    title: raw-attempt-committed-units-and-final-batch-must-stay-distinct
    statement: Official publish, workspace continuation, and governed Forge commit surfaces must distinguish raw attempt artifacts, committed observation units, and the final consolidated extraction batch; raw provider output, partial attempt residue, or incomplete continuation state cannot be treated as canonical truth ingress or successful publish evidence.
    source: .nimi/spec/realm/kernel/truth-contract.md
  - rule_id: R-PROJ-001
    domain: projection
    level: must
    title: projection-derived-not-truth
    statement: Projection is derived from canonical truth and explicit allowed state visibility; projection output is not truth by default and cannot masquerade as a truth write.
    source: .nimi/spec/realm/kernel/projection-contract.md
  - rule_id: R-PROJ-002
    domain: projection
    level: must
    title: projection-consumes-explicit-inputs
    statement: Authoritative projection consumes explicit projection inputs anchored to truth, permitted state visibility, and governing release/truth anchors; consumers must not reconstruct canonical inputs from lorebook text, browse summaries, or app-local caches.
    source: .nimi/spec/realm/kernel/projection-contract.md
  - rule_id: R-PROJ-003
    domain: projection
    level: must
    title: projection-request-explicit-and-replayable
    statement: Authoritative projection requests must explicitly identify world scope, agent scope, consumer surface, governing release/truth anchor, and constrained context envelope.
    source: .nimi/spec/realm/kernel/projection-contract.md
  - rule_id: R-PROJ-004
    domain: projection
    level: must
    title: projection-deterministic-for-identical-inputs
    statement: For identical inputs, consumer surface, release/truth anchor, and constrained context envelope, authoritative projection must be deterministic and checksumable.
    source: .nimi/spec/realm/kernel/projection-contract.md
  - rule_id: R-PROJ-005
    domain: projection
    level: must
    title: consumers-must-not-bypass-projection
    statement: Runtime and app consumers must not bypass authoritative projection by directly assembling truth text into prompt payloads; PromptTrace may consume projection output but does not replace the projection contract.
    source: .nimi/spec/realm/kernel/projection-contract.md
  - rule_id: R-PROJ-006
    domain: projection
    level: must
    title: compat-surfaces-are-projection-only
    statement: Worldview, lorebooks, public browse aggregates, and future card-shaped exports are projection surfaces only and must not become the canonical semantic source.
    source: .nimi/spec/realm/kernel/projection-contract.md
  - rule_id: R-PROJ-007
    domain: projection
    level: must
    title: projection-results-require-trace
    statement: Authoritative projection must produce traceable results that identify selected inputs, suppressed inputs, governing release/truth anchor, and resolution outcomes.
    source: .nimi/spec/realm/kernel/projection-contract.md
  - rule_id: R-PROJ-008
    domain: projection
    level: must
    title: realm-projection-contract-owns-seam-until-runtime-mounted
    statement: Until a dedicated runtime-mounted projection spec is admitted, Realm projection authority owns the semantic contract for ProjectionInput, ProjectionRequest, ProjectionResult, and ProjectionTraceRequirement; downstream runtime or app implementations must not fork or narrow these semantics ad hoc.
    source: .nimi/spec/realm/kernel/projection-contract.md
  - rule_id: R-WSTATE-001
    domain: world-state
    level: must
    title: shared-present-only
    statement: World State expresses durable shared present only and excludes story runtime or prompt context.
    source: .nimi/spec/realm/kernel/world-state-contract.md
  - rule_id: R-WSTATE-002
    domain: world-state
    level: must
    title: explicit-commit-envelope
    statement: State mutation uses an explicit commit envelope with worldId, appId, sessionId, effectClass, scope, schemaId, schemaVersion, actorRefs, reason, and evidenceRefs.
    source: .nimi/spec/realm/kernel/world-state-contract.md
  - rule_id: R-WSTATE-003
    domain: world-state
    level: must
    title: durable-scope-only
    statement: World State scope is limited to WORLD, ENTITY, or RELATION durable scopes.
    source: .nimi/spec/realm/kernel/world-state-contract.md
  - rule_id: R-WSTATE-004
    domain: world-state
    level: must
    title: fixed-effect-classes
    statement: effectClass is fixed to NONE, STATE_ONLY, or STATE_AND_HISTORY.
    source: .nimi/spec/realm/kernel/world-state-contract.md
  - rule_id: R-WSTATE-005
    domain: world-state
    level: must
    title: fail-close-state-write
    statement: State writes require explicit app authorization through an appId/schemaId/schemaVersion/effectClass to runMode matrix and fail-close schema validation.
    source: .nimi/spec/realm/kernel/world-state-contract.md
  - rule_id: R-WSTATE-006
    domain: world-state
    level: must
    title: single-state-commit-model
    statement: Creator tooling and authorized apps use the same explicit state commit model; hidden legacy write paths are forbidden.
    source: .nimi/spec/realm/kernel/world-state-contract.md
  - rule_id: R-WHIST-001
    domain: world-history
    level: must
    title: canonical-happened-facts
    statement: World History stores canonical happened facts only, never arbitrary story traces.
    source: .nimi/spec/realm/kernel/world-history-contract.md
  - rule_id: R-WHIST-002
    domain: world-history
    level: must
    title: explicit-history-append
    statement: History append is explicit; story-stop persistence cannot auto-convert runtime output into world history.
    source: .nimi/spec/realm/kernel/world-history-contract.md
  - rule_id: R-WHIST-003
    domain: world-history
    level: must
    title: typed-history-provenance
    statement: Each history event carries typed provenance including appId, sessionId, actorRefs, reason, and evidenceRefs.
    source: .nimi/spec/realm/kernel/world-history-contract.md
  - rule_id: R-WHIST-004
    domain: world-history
    level: must
    title: no-shared-history-for-non-canon-runs
    statement: Replay and private continuity app runs must not append shared world history; only CANON_MUTATION matrix entries may do so.
    source: .nimi/spec/realm/kernel/world-history-contract.md
  - rule_id: R-WHIST-005
    domain: world-history
    level: must
    title: append-only-history
    statement: World History is append-only; correction uses superseding or invalidation records instead of silent deletion.
    source: .nimi/spec/realm/kernel/world-history-contract.md
  - rule_id: R-WHIST-006
    domain: world-history
    level: must
    title: archive-not-history
    statement: App-owned narrative archives must not be represented as Realm canonical world history.
    source: .nimi/spec/realm/kernel/world-history-contract.md
  - rule_id: R-CHAT-001
    domain: chat
    level: must
    title: chat-is-realm-domain
    statement: Realm owns Chat as a realm domain and provides the canonical thread, message, read-state, sync, membership, group lifecycle, and agent-slot metadata surface.
    source: .nimi/spec/realm/kernel/chat-contract.md
  - rule_id: R-CHAT-002
    domain: chat
    level: must
    title: direct-and-group-substrate-in-v1
    statement: Realm Chat v1 admits DIRECT and GROUP as canonical chat substrates; GROUP threads may contain human participants and agent slots/authors, while AI execution, prompt assembly, model routing, session orchestration, and turn execution stay outside Realm Chat. CHANNEL and any unsupported chat shape must fail-close.
    source: .nimi/spec/realm/kernel/chat-contract.md
  - rule_id: R-CHAT-003
    domain: chat
    level: must
    title: social-gates-chat-but-does-not-own-it
    statement: Social gates human participant admission and preconditions, but canonical chat threads, messages, read state, and sync cursor semantics belong to Chat.
    source: .nimi/spec/realm/kernel/chat-contract.md
  - rule_id: R-CHAT-004
    domain: chat
    level: must
    title: agent-chat-runtime-stays-outside
    statement: Human-agent chat, agent-agent chat, model routing, prompt assembly, session orchestration, and turn execution runtime stay outside Realm Chat v1, and group membership does not transfer those responsibilities into Realm.
    source: .nimi/spec/realm/kernel/chat-contract.md
  - rule_id: R-CHAT-005
    domain: chat
    level: must
    title: canonical-chat-attachment-envelope
    statement: Realm Chat canonicalizes non-text attachments as MessageType ATTACHMENT with payload.attachment generic envelope and does not expose assetId-only or resourceId-only attachment payload contracts.
    source: .nimi/spec/realm/kernel/chat-contract.md
  - rule_id: R-CHAT-006
    domain: chat
    level: must
    title: chat-owns-group-lifecycle-and-admin-authority
    statement: Realm Chat owns GROUP lifecycle transitions, roster management, membership roles, and agent-slot metadata; Social only gates human admission preconditions and does not own group lifecycle or agent-slot state.
    source: .nimi/spec/realm/kernel/chat-contract.md
  - rule_id: R-CHAT-007
    domain: chat
    level: must
    title: group-agent-authorship-must-validate-slot-binding
    statement: Agent-authored group posts and messages must validate thread owner and slot binding before commit, read visibility, or sync fanout, and spoofed agent authorship must fail-close.
    source: .nimi/spec/realm/kernel/chat-contract.md
  - rule_id: R-CHAT-008
    domain: chat
    level: must
    title: realm-group-agent-participation-consumes-runtime
    statement: Realm Group Agent Participation is a Realm GROUP product surface and Runtime Agent Participation consumer; Realm owns group product truth while Runtime owns execution, policy verdicts, candidates, audit/replay, and same-room orchestration.
    source: .nimi/spec/realm/kernel/chat-contract.md
  - rule_id: R-CHAT-009
    domain: chat
    level: must
    title: realm-owns-group-agent-slot-lifecycle
    statement: Realm owns the GROUP agent slot lifecycle and visibility metadata, but slot state must not imply Runtime prompt, provider/model, memory, capability, concurrency, queue, or execution ownership.
    source: .nimi/spec/realm/kernel/chat-contract.md
  - rule_id: R-CHAT-010
    domain: chat
    level: must
    title: group-agent-triggers-are-closed
    statement: Realm Group agent triggers are closed to mention, explicit user action, admitted automation, or product-disabled posture, and admitted triggers must carry Realm evidence before Runtime participation admission.
    source: .nimi/spec/realm/kernel/chat-contract.md
  - rule_id: R-CHAT-011
    domain: chat
    level: must
    title: runtime-candidate-realm-commit-handoff
    statement: Runtime may return only REALM_GROUP_MESSAGE_CANDIDATE output; Realm must authenticate candidate lineage, target chat, target agent slot, author authority, evidence hash, runtime trace reference, idempotency, moderation/refusal posture, and audit record before canonical GROUP message commit.
    source: .nimi/spec/realm/kernel/chat-contract.md
  - rule_id: R-CHAT-012
    domain: chat
    level: must
    title: group-agent-candidate-commit-operation
    statement: The only admitted Realm commit-handoff operation for group agent candidates is POST /api/human/group-chats/{chatId}/agent-message-candidate-commits with CommitRealmGroupMessageCandidateInputDto; historical POST /api/human/group-chats/{chatId}/agent-messages and SendGroupAgentMessageInputDto are not compatibility aliases and must be removed.
    source: .nimi/spec/realm/kernel/chat-contract.md
  - rule_id: R-CHAT-013
    domain: chat
    level: must
    title: group-agent-commit-forbidden-fields
    statement: Realm Group candidate commit requests must not accept raw text, payload, prompt, systemPrompt, provider, model, messageId, senderId, or caller-owned agentAccountId as commit authority; canonical messageId may appear only after Realm validation and storage succeed.
    source: .nimi/spec/realm/kernel/chat-contract.md
  - rule_id: R-CHAT-014
    domain: chat
    level: must
    title: sdk-desktop-preserve-candidate-commit-split
    statement: SDK and Desktop consumers must preserve split Runtime candidate and Realm commit facades; collapsed generate-and-commit helpers, Desktop direct REST, Runtime internal imports, sendGroupMessage substitution, runtime.agent.turn.request substitution, renderer-local committed truth, and synthetic candidate/message success are forbidden.
    source: .nimi/spec/realm/kernel/chat-contract.md
  - rule_id: R-CHAT-015
    domain: chat
    level: must
    title: group-candidate-typed-payload-commit-boundary
    statement: "Realm Group candidate commit may carry only typed REALM_GROUP_MESSAGE_CANDIDATE output fields derived from the local Runtime candidate evidence read: candidate ids/refs, evidenceHash, runtimeTraceRef, output/audit/policy refs, timestamps, commitDisposition, and either validated TEXT body plus bodyHash or validated refusal code/reason plus refusalHash; Realm validates authenticated user authority, group membership, active realmGroupAgentSlotId, localAgentRef, agent participant projection, candidate kind, trigger, idempotency, expiry, canonical payload hash, body/refusal hash, and moderation/refusal posture before storage; Realm must not require Runtime authorship proof, Runtime attestation, Realm-side Runtime verifier, evidence escrow, or Realm direct Runtime access for this group chat commit path, and commit requests must still not carry raw prompt text, raw provider output, provider/model selection, untyped payload, caller-owned messageId, caller-owned senderId, or caller-owned agent identity as commit authority."
    source: .nimi/spec/realm/kernel/chat-contract.md
  - rule_id: R-CHAT-016
    domain: chat
    level: must
    title: realm-agent-slot-id-is-durable-binding-identity
    statement: realmGroupAgentSlotId is the durable Realm identity for a local Agent participation binding inside a specific GROUP thread, distinct from the Realm Agent source identity and human membership identity; executable local Agent reference is localAgentRef = local-agent:${ownerUserId}:${realmAgentId}, and commit must validate the same active realmGroupAgentSlotId, target chatId, and localAgentRef because realmAgentId alone is not a valid executable local Agent or group slot reference.
    source: .nimi/spec/realm/kernel/chat-contract.md
  - rule_id: R-CHAT-017
    domain: chat
    level: must
    title: realm-agent-and-local-agent-identity-split
    statement: "Realm Agent source identity and executable local Agent identity are distinct: realmAgentId identifies the Realm Agent source entity for Realm truth, Realm projection, world relationships, social visibility, and friendship relationships, while localAgentRef = local-agent:${ownerUserId}:${realmAgentId} identifies the owner-scoped executable local fork; local execution, direct Human-Agent local chat, local memory, local projection, avatar binding, Agent Center resources, Runtime Agent records, SDK/IPC conversation anchors, and group Runtime candidate handoff must not be keyed or authorized by bare realmAgentId or agentId."
    source: .nimi/spec/realm/kernel/chat-contract.md
  - rule_id: R-CHAT-018
    domain: chat
    level: must
    title: human-agent-direct-chat-is-local-fork-route
    statement: Human-Agent DIRECT chat is admitted only as a Private Desktop local-chat product route after Realm friendship/admission checks; it must create or reuse the owner-scoped local Agent fork identified by localAgentRef = local-agent:${ownerUserId}:${realmAgentId} and persist local thread identity by localAgentRef, while Realm DIRECT cloud transcript truth remains Human-Human only and Desktop, SDK, Runtime, and local stores must not convert Human-Agent local chat into Realm cloud DIRECT transcript truth or use realmAgentId alone as the local thread key.
    source: .nimi/spec/realm/kernel/chat-contract.md
  - rule_id: R-CHAT-019
    domain: chat
    level: must
    title: local-agent-execution-consumers-require-identity-tuple
    statement: All consumers of local Agent execution identity must carry ownerUserId, realmAgentId, and localAgentRef; realmAgentId may be stored only as source metadata and must not be sufficient authority for execution, memory, projection, avatar, Agent Center package/config, or conversation-anchor selection, and missing or mismatched tuple fields must fail-close without legacy aliases, dual read/write compatibility, synthetic success, or renderer-local shadow truth.
    source: .nimi/spec/realm/kernel/chat-contract.md
  - rule_id: R-CHAT-020
    domain: chat
    level: must
    title: local-agent-fork-cardinality-is-single-per-owner-source-agent
    statement: V1 admits exactly one canonical local Agent execution fork for a given ownerUserId plus realmAgentId pair, addressed by localAgentRef = local-agent:${ownerUserId}:${realmAgentId}; any product need for multiple simultaneous local forks of the same Realm Agent for one owner or for an opaque persisted localAgentId distinct from that deterministic localAgentRef requires a new admitted authority decision before implementation, and until then implementation must hard-cut to deterministic localAgentRef identity and fail closed on ambiguous fork cardinality.
    source: .nimi/spec/realm/kernel/chat-contract.md
  - rule_id: R-SOC-001
    domain: social
    level: must
    title: friendship-graph-is-canonical
    statement: Friendship is the canonical admission graph for realm-level social relationships.
    source: .nimi/spec/realm/kernel/social-contract.md
  - rule_id: R-SOC-002
    domain: social
    level: must
    title: ordered-pair-uniqueness
    statement: Friendship uses an ordered pair uniqueness model so the same pair cannot produce duplicate canonical rows.
    source: .nimi/spec/realm/kernel/social-contract.md
  - rule_id: R-SOC-003
    domain: social
    level: must
    title: social-defines-admission-not-execution
    statement: Social defines relationship and admission facts and does not define agent-chat runtime, model routing, or turn execution.
    source: .nimi/spec/realm/kernel/social-contract.md
  - rule_id: R-SOC-004
    domain: social
    level: must
    title: social-gates-human-chat-agent-chat-stays-outside
    statement: Social may gate human chat via preconditions, but canonical chat surface lives in Realm Chat and agent chat runtime stays outside Realm.
    source: .nimi/spec/realm/kernel/social-contract.md
  - rule_id: R-SOC-005
    domain: social
    level: must
    title: nimi-guide-agentfriend-is-ordinary
    statement: Nimi-authored guide agents use the same Realm social mechanics as any ordinary RealmAgent. Their AgentFriend relationships are ordinary Friendship rows and do not create privileged Agent classes, special social schema, hidden quota exceptions, or authority-bearing official-agent status.
    source: .nimi/spec/realm/kernel/social-contract.md
  - rule_id: R-SOC-006
    domain: social
    level: must
    title: nimi-guide-agentfriend-provisioning-validates-realm-payload
    statement: New-user initialization may seed a Nimi guide AgentFriend relationship only through ordinary Realm social admission. Before creating or repairing that relationship, the backend path must validate the guide Agent account, required RealmAgent identity, and required AgentProfile / Realm payload needed for the ordinary relationship. Missing or invalid payloads fail closed as typed provisioning or repair states. Guide AgentFriend provisioning must not create a privileged official-agent class, social schema fork, quota bypass, server-bot bypass, Runtime local-only agent, Desktop fixture, or prompt/docs authority shortcut.
    source: .nimi/spec/realm/kernel/social-contract.md
  - rule_id: R-SOC-007
    domain: social
    level: must
    title: agentfriend-removal-localagent-deletion-linkage
    statement: AgentFriend removal and LocalAgent deletion are one server-authoritative canonical linkage. Removing an AgentFriend Friendship row must delete its one-to-one LocalAgent projection and neither side may survive the other. The backend Realm social admission path owns the linkage trigger and the renderer must not own it. Removal executes as one fail-closed ordered unit that validates the agent-variant Friendship and resolves the owner and RealmAgent pair, deletes the canonical Friendship row, then issues runtime TerminateAgent deletion for the deterministic localAgentRef. The linkage is idempotent so repeated removal, retry after transport failure, or removal of an AgentFriend with no materialized LocalAgent converges to the same dangling-free end state. A failed LocalAgent deletion fails closed as a typed error or a durable retried termination intent and must not be reported as renderer-synthesized success. Removal must not leave a half-applied orphan LocalAgent or dangling AgentFriend, and must not mutate the corresponding RealmAgent canonical truth.
    source: .nimi/spec/realm/kernel/social-contract.md
  - rule_id: R-SOC-008
    domain: social
    level: must
    title: localagent-termination-intent-and-courier-mechanism
    statement: The R-SOC-007 companion mechanism rule defining the LocalAgentTerminationIntent record, its lifecycle, the viewer-scoped list/ack API, and the desktop reconciliation courier. An agent-variant AgentFriend removal must persist exactly one durable LocalAgentTerminationIntent as the server-owned representation of the pending LocalAgent deletion, carrying the owner user, RealmAgent account, deterministic localAgentRef, removed-Friendship provenance, status, substrate-failure attempt counter, last error, backoff availability time, and acknowledgement metadata; the record is unique per localAgentRef so a repeated removal converges onto the same record. The lifecycle is the typed set OPEN, ACKED, FAILED, where ACKED is terminal success including the K-AGCORE-141 absent-ref typed no-op and FAILED is a reopenable needs-attention state that must not be silently dropped. The intent record must be written in the same database transaction as the canonical Friendship row deletion so both commit or both roll back. The backend must expose a viewer-scoped list/ack API that returns only the caller's own intents and applies acknowledgement as a backend-owned idempotent state transition; only typed runtime substrate failures charge the attempt counter toward the maximum ten attempts while transport and offline failures never charge an attempt or move a record toward FAILED. The desktop reconciliation courier is pure transport that pulls open intents, delivers runtime TerminateAgent, and reports a typed outcome; it owns no decision, is stateless with no desktop-local intent queue, is idempotent against the K-AGCORE-141 no-op, must not synthesize success, and must not drive renderer-local linkage state. The backend table is the sole durable store and a long-offline device converges when it next comes online.
    source: .nimi/spec/realm/kernel/social-contract.md
  - rule_id: R-SOC-009
    domain: social
    level: must
    title: agentfriend-creation-localagent-establishment-linkage
    statement: AgentFriend creation and LocalAgent establishment are one server-authoritative canonical linkage, the creation counterpart to R-SOC-007. Committing an agent-variant Friendship row, whether through a direct add or the acceptance of a received agent friend request, must deterministically establish the one-to-one LocalAgent projection; the AgentFriend creation is not complete until that projection exists or its durable provision intent is persisted. The creation linkage trigger is backend / Realm social admission owned and the renderer must not own it. Creation executes as one fail-closed ordered unit that commits the agent-variant Friendship and resolves the owner and RealmAgent pair, persists exactly one durable LocalAgentProvisionIntent for the deterministic localAgentRef in the same database transaction, then has the device courier deliver runtime InitializeAgent. The LocalAgentProvisionIntent carries the owner user, RealmAgent account, deterministic localAgentRef, created-Friendship provenance, status, substrate-failure attempt counter, last error, backoff availability time, and acknowledgement metadata, is unique per localAgentRef so a repeated creation converges onto the same record, and must never coexist live with a LocalAgentTerminationIntent for the same localAgentRef because re-add supersedes a non-terminal termination intent and removal supersedes a non-terminal provision intent. The lifecycle is the typed set OPEN, ACKED, FAILED, where ACKED is terminal success including the K-AGCORE-139 already-exists idempotent no-op and FAILED is a reopenable needs-attention state that must not be silently dropped. The intent record must be written in the same database transaction as the canonical Friendship row creation so both commit or both roll back. The backend must expose a viewer-scoped list/ack API that returns only the caller's own intents and applies acknowledgement as a backend-owned idempotent state transition; only typed runtime substrate failures charge the attempt counter toward the maximum ten attempts while transport and offline failures never charge an attempt or move a record toward FAILED. The desktop reconciliation courier is pure transport that pulls open intents, delivers runtime InitializeAgent, and reports a typed outcome; it owns no decision, is stateless with no desktop-local intent queue, is idempotent against the K-AGCORE-139 no-op, must not synthesize success, and must not drive renderer-local linkage state. The backend table is the sole durable store and a long-offline or cross-device device converges when its courier next processes the server-owned open intent. The linkage is idempotent so repeated creation, retry after transport failure, or acceptance for an already-established LocalAgent converges to exactly one LocalAgent and one AgentFriend. Creation must not leave a half-applied state, must not be projected as renderer-synthesized success, must not be satisfied by a renderer-owned two-call create-then-ensure sequence, and must not mutate the corresponding RealmAgent canonical truth.
    source: .nimi/spec/realm/kernel/social-contract.md
  - rule_id: R-ECON-001
    domain: economy
    level: must
    title: creator-world-economy-is-auditable
    statement: World creator economy and access economics remain auditable, explicit, and separate from narrative runtime.
    source: .nimi/spec/realm/kernel/economy-contract.md
  - rule_id: R-ECON-002
    domain: economy
    level: must
    title: compute-not-billed-as-realm-truth
    statement: AI compute route cost is not modeled as Realm core truth or hidden world mutation.
    source: .nimi/spec/realm/kernel/economy-contract.md
  - rule_id: R-ECON-003
    domain: economy
    level: must
    title: revenue-share-is-explicit
    statement: Revenue and settlement logic use explicit event types, explicit distribution rules, and append-only accounting.
    source: .nimi/spec/realm/kernel/economy-contract.md
  - rule_id: R-ECON-004
    domain: economy
    level: must
    title: no-hidden-cross-domain-economics
    statement: Apps cannot hide economic state changes inside narrative history or memory commits.
    source: .nimi/spec/realm/kernel/economy-contract.md
  - rule_id: R-ATTACH-001
    domain: attachment
    level: must
    title: generic-target-envelope
    statement: Realm Attachment is a first-class cross-surface envelope with stable targetType plus targetId identity and is not equivalent to Resource, OwnableAsset, or Bundle.
    source: .nimi/spec/realm/kernel/attachment-contract.md
  - rule_id: R-ATTACH-002
    domain: attachment
    level: must
    title: fixed-active-target-set
    statement: Active attachment targets are fixed to RESOURCE, ASSET, and BUNDLE; write surfaces persist target references only and read surfaces may resolve display metadata without introducing attachment-level owner or viewer policy.
    source: .nimi/spec/realm/kernel/attachment-contract.md
  - rule_id: R-ATTACH-003
    domain: attachment
    level: must
    title: post-and-chat-canonical-persistence
    statement: Post attachments persist as ordered PostAttachment relations and chat non-text attachment messages persist as MessageType ATTACHMENT with payload.attachment envelope.
    source: .nimi/spec/realm/kernel/attachment-contract.md
  - rule_id: R-ATTACH-004
    domain: attachment
    level: must
    title: resolved-read-model-does-not-change-target-identity
    statement: Resolved attachment read models may expose displayKind, URLs, thumbnails, duration, title, subtitle, and nested preview attachments for card targets; surface readability authorizes preview resolution, and stable APIs must not collapse back to resourceId-only or assetId-only attachment contracts.
    source: .nimi/spec/realm/kernel/attachment-contract.md
  - rule_id: R-ASSET-101
    domain: asset
    level: must
    title: independently-ownable-formal-object-model
    statement: Realm OwnableAsset objects are independently ownable formal objects with stable identity, owner, authorship, lineage, lifecycle, and binding policy semantics.
    source: .nimi/spec/realm/kernel/asset-contract.md
  - rule_id: R-ASSET-102
    domain: asset
    level: must
    title: ownable-asset-not-resource-or-core-archive
    statement: OwnableAsset is distinct from Resource, truth, history, and memory; raw content carriers and app-private archives must not masquerade as ownable realm assets.
    source: .nimi/spec/realm/kernel/asset-contract.md
  - rule_id: R-ASSET-103
    domain: asset
    level: must
    title: explicit-idempotent-ownable-asset-mutation
    statement: OwnableAsset mutations are explicit, idempotent, and auditable; create, update, clone, and lifecycle transitions are first-class state changes.
    source: .nimi/spec/realm/kernel/asset-contract.md
  - rule_id: R-ASSET-104
    domain: asset
    level: must
    title: ownable-asset-consumption-boundary-safe
    statement: Formal asset use is expressed only through Binding kind USE with objectType ASSET, while bundle membership or app usage must not usurp asset ownership, lifecycle, policy, or lineage truth.
    source: .nimi/spec/realm/kernel/asset-contract.md
  - rule_id: R-ASSET-105
    domain: asset
    level: must
    title: explicit-preview-truth-does-not-change-ownership-truth
    statement: OwnableAsset.resourceRefs defines composition only and must reference real, undeleted, attachable Resource objects that the current actor is allowed to reference; OwnableAsset.previewResourceId, when present, must reference one member of resourceRefs, surfaces must not infer preview from resourceRefs ordering, and preview exposure through attachment read models does not change ownership, authorship, acquisition, lifecycle, or policy truth.
    source: .nimi/spec/realm/kernel/asset-contract.md
  - rule_id: R-RSRC-001
    domain: resource
    level: must
    title: typed-content-carrier-model
    statement: Realm Resource objects are typed content carriers with stable identity, storage, delivery, status, and controller semantics, not independent ownership semantics.
    source: .nimi/spec/realm/kernel/resource-contract.md
  - rule_id: R-RSRC-002
    domain: resource
    level: must
    title: fixed-active-resource-type-set
    statement: Active Resource types are fixed to IMAGE, VIDEO, AUDIO, and TEXT; VOICE remains outside the active hard-cut model.
    source: .nimi/spec/realm/kernel/resource-contract.md
  - rule_id: R-RSRC-003
    domain: resource
    level: must
    title: explicit-idempotent-resource-lifecycle
    statement: Resource lifecycle mutation is explicit, idempotent, and auditable; prepare upload, finalize, update, and delete are lifecycle transitions.
    source: .nimi/spec/realm/kernel/resource-contract.md
  - rule_id: R-RSRC-004
    domain: resource
    level: must
    title: resource-attachment-and-binding-boundary
    statement: Resource objects may participate in attachment or binding relations without promoting them into OwnableAsset by default, but Binding kind PRESENTATION with objectType RESOURCE is the only active formal resource-binding shape in Realm.
    source: .nimi/spec/realm/kernel/resource-contract.md
  - rule_id: R-RSRC-005
    domain: resource
    level: must
    title: delivery-access-does-not-grant-viewer-auth
    statement: Resource deliveryAccess defines delivery strategy such as public versus signed URL resolution only; viewer authorization is enforced by the reading surface or controller and must not be inferred from deliveryAccess alone.
    source: .nimi/spec/realm/kernel/resource-contract.md
  - rule_id: R-RSRC-006
    domain: resource
    level: must
    title: upload-preparation-defaults-to-signed
    statement: Public resource upload preparation defaults to SIGNED delivery unless the caller explicitly requests PUBLIC; this default applies to direct upload and inline text creation surfaces for managed realm resources.
    source: .nimi/spec/realm/kernel/resource-contract.md
  - rule_id: R-BIND-001
    domain: binding
    level: must
    title: binding-is-only-durable-object-to-host-relation
    statement: Realm Binding is the only formal durable relation used to attach Realm objects to Realm hosts for presentation, use, or import semantics; Attachment remains a display envelope only.
    source: .nimi/spec/realm/kernel/binding-contract.md
  - rule_id: R-BIND-002
    domain: binding
    level: must
    title: fixed-active-binding-object-and-host-types
    statement: Active binding object types are RESOURCE, ASSET, and BUNDLE; active binding host types are WORLD, AGENT, SCENE, WORLD_EVENT, and WORLDVIEW; WORKSPACE is outside the active backend binding model until a host contract exists.
    source: .nimi/spec/realm/kernel/binding-contract.md
  - rule_id: R-BIND-003
    domain: binding
    level: must
    title: allow-matrix-fail-close
    statement: Binding legality is fail-close and matrix-governed; only declared bindingKind, objectType, hostType, and bindingPoint combinations are valid, and all undeclared combinations must be rejected.
    source: .nimi/spec/realm/kernel/binding-contract.md
  - rule_id: R-BIND-004
    domain: binding
    level: must
    title: typed-conditions-and-import-version-pin
    statement: PRESENTATION bindings may carry flat string-map conditions and explicit binding points; USE and IMPORT bindings must not carry conditions; IMPORT bindings must pin the imported bundle version and do not imply member USE bindings.
    source: .nimi/spec/realm/kernel/binding-contract.md
  - rule_id: R-BIND-005
    domain: binding
    level: must
    title: explicit-idempotent-world-scoped-binding-writes
    statement: Binding writes are explicit, idempotent, and auditable; every binding resolves to a world scope, records the creating actor, and uses the same logical uniqueness key for validation, persistence, and upsert behavior.
    source: .nimi/spec/realm/kernel/binding-contract.md
  - rule_id: R-BNDL-001
    domain: bundle
    level: must
    title: bundle-composition-and-import-unit
    statement: Realm Bundle objects are formal composition units with stable identity, owner, member ordering, cover asset, metadata, lifecycle, and import semantics.
    source: .nimi/spec/realm/kernel/bundle-contract.md
  - rule_id: R-BNDL-002
    domain: bundle
    level: must
    title: bundle-members-ownable-asset-only
    statement: Bundle members must be OwnableAsset references only and raw Resource objects must not appear as direct bundle members.
    source: .nimi/spec/realm/kernel/bundle-contract.md
  - rule_id: R-BNDL-003
    domain: bundle
    level: must
    title: explicit-idempotent-bundle-lifecycle
    statement: Bundle mutation is explicit, idempotent, and auditable; draft editing, publish, archive, and import are first-class lifecycle or event transitions.
    source: .nimi/spec/realm/kernel/bundle-contract.md
  - rule_id: R-BNDL-004
    domain: bundle
    level: must
    title: bundle-preview-chain-and-runtime-binding-boundary
    statement: Bundle attachment preview resolves through Bundle.coverAssetId to OwnableAsset.previewResourceId to nested Attachment.preview; if the cover asset has no explicit preview resource then bundle read models remain CARD without inferred preview, and Binding kind IMPORT with objectType BUNDLE does not imply member Binding kind USE with objectType ASSET.
    source: .nimi/spec/realm/kernel/bundle-contract.md
  - rule_id: R-TRANSIT-001
    domain: transit
    level: must
    title: transit-is-continuity-protocol
    statement: Transit is a continuity protocol for cross-world movement and not a narrative engine.
    source: .nimi/spec/realm/kernel/transit-contract.md
  - rule_id: R-TRANSIT-002
    domain: transit
    level: must
    title: preserve-identity-continuity
    statement: Transit preserves identity continuity while allowing world-context change and cannot mutate truth by side effect.
    source: .nimi/spec/realm/kernel/transit-contract.md
  - rule_id: R-TRANSIT-003
    domain: transit
    level: must
    title: explicit-state-machine
    statement: Transit state changes are explicit, state-machine governed, and auditable.
    source: .nimi/spec/realm/kernel/transit-contract.md
  - rule_id: R-TRANSIT-004
    domain: transit
    level: must
    title: runtime-checkpoints-stay-outside
    statement: Transit may hand off durable state and memory references but app-local runtime checkpoints stay outside Realm.
    source: .nimi/spec/realm/kernel/transit-contract.md
  - rule_id: R-TRANSIT-005
    domain: transit
    level: must
    title: oasis-is-return-anchor
    statement: OASIS is the default return point and transit hub; creator-world continuity transfer uses OASIS as the system anchor.
    source: .nimi/spec/realm/kernel/transit-contract.md
  - rule_id: R-TRANSIT-006
    domain: transit
    level: must
    title: creator-worlds-no-direct-transit
    statement: Creator worlds must not transit directly to other creator worlds; transit stays single-hop via OASIS and cannot introduce scene quota or scene runtime.
    source: .nimi/spec/realm/kernel/transit-contract.md
  - rule_id: R-OAUTH-001
    domain: oauth-authority
    level: must
    title: realm-is-oauth-authorization-server
    statement: Realm is the OAuth 2.0 authorization server for native/public clients in nimi-realm; PKCE-protected authorization code flow is the sole admitted method on this contract's endpoints.
    source: .nimi/spec/realm/kernel/oauth-authority-contract.md
  - rule_id: R-OAUTH-002
    domain: oauth-authority
    level: must
    title: endpoint-set-closed
    statement: Admitted OAuth endpoints are exactly GET /api/auth/oauth/authorize and POST /api/auth/oauth/token; implicit, client_credentials, password, device_code, and URN-namespaced grants are forbidden.
    source: .nimi/spec/realm/kernel/oauth-authority-contract.md
  - rule_id: R-OAUTH-003
    domain: oauth-authority
    level: must
    title: pkce-s256-only
    statement: code_challenge_method must equal S256; plain and any other value fail-close invalid_request; missing code_challenge or code_challenge_method on /authorize fails-close.
    source: .nimi/spec/realm/kernel/oauth-authority-contract.md
  - rule_id: R-OAUTH-004
    domain: oauth-authority
    level: must
    title: authorization-code-single-shot
    statement: Authorization codes are single-shot with TTL <= 60 seconds, persisted in atomically-consumable storage (single SQL UPDATE returning row, or atomic key-value claim-and-delete); expired or already-consumed codes fail-close invalid_grant at /token.
    source: .nimi/spec/realm/kernel/oauth-authority-contract.md
  - rule_id: R-OAUTH-005
    domain: oauth-authority
    level: must
    title: redirect-uri-loopback-exact-match
    statement: redirect_uri must be http scheme, host 127.0.0.1 or localhost, any port 1..65535, path exactly /oauth/callback; authorize-time and token-time redirect_uri must byte-for-byte match; any other shape or mismatch fails-close.
    source: .nimi/spec/realm/kernel/oauth-authority-contract.md
  - rule_id: R-OAUTH-006
    domain: oauth-authority
    level: must
    title: code-binds-to-client-redirect-pkce
    statement: Authorization code is bound at issuance to client_id, redirect_uri, code_challenge, and code_challenge_method; all four must match at /token exchange or fail-close invalid_grant; binding is immutable for code lifetime.
    source: .nimi/spec/realm/kernel/oauth-authority-contract.md
  - rule_id: R-OAUTH-007
    domain: oauth-authority
    level: must
    title: closed-client-set-no-secret
    statement: Admitted client_id set is closed and governed by tables/oauth-authority-contract.yaml#oauth_clients; no client_secret accepted on either endpoint; PKCE is the sole security boundary; ad-hoc client provisioning is forbidden.
    source: .nimi/spec/realm/kernel/oauth-authority-contract.md
  - rule_id: R-OAUTH-008
    domain: oauth-authority
    level: must
    title: sensitive-material-redaction
    statement: Authorization codes, code_verifier, access_token, and refresh_token must never appear in logs, audit payloads, error response bodies, exception messages, telemetry attributes, or any persisted observability surface; at-rest authorization codes use HMAC-SHA256 keyed by realm secret; raw codes must not survive past the issuing HTTP response.
    source: .nimi/spec/realm/kernel/oauth-authority-contract.md
  - rule_id: R-OAUTH-009
    domain: oauth-authority
    level: must
    title: token-response-shape
    statement: /token success response is JSON {access_token, refresh_token, token_type='Bearer', expires_in, account_id, display_name, realm_environment_id}; refresh_token issued only after all PKCE/binding/lifecycle/replay checks pass; field names are normative and consumed by runtime.
    source: .nimi/spec/realm/kernel/oauth-authority-contract.md
  - rule_id: R-OAUTH-010
    domain: oauth-authority
    level: must
    title: forbidden-grant-types
    statement: Grant types other than authorization_code on /token (refresh_token, client_credentials, password, device_code, URN-namespaced, or any other value) fail-close unsupported_grant_type.
    source: .nimi/spec/realm/kernel/oauth-authority-contract.md
  - rule_id: R-OAUTH-011
    domain: oauth-authority
    level: must
    title: authorize-requires-session
    statement: /authorize requires authenticated realm session cookie; unauthenticated request 302 redirects to NIMI_WEB_URL /login with oauth_next set to the absolute API authorize URL built from NIMI_REALM_URL and the original request URL; web login must validate oauth_next against an OAuth-only realm/API-origin allowlist, then navigate back to the API authorize URL after login; web login must not parse codes, receive tokens, exchange tokens, or relay tokens; state is mandatory and passed verbatim.
    source: .nimi/spec/realm/kernel/oauth-authority-contract.md
  - rule_id: R-OAUTH-012
    domain: oauth-authority
    level: must
    title: replay-defense-atomic-claim-first
    statement: Token endpoint must atomically claim code consumption before any other validation; order is (1) atomic claim, (2) client_id binding, (3) redirect_uri exact match, (4) PKCE S256 equality, (5) mint; failure at step 1 returns invalid_grant with no further detail; failure at 2/3/4 leaves code consumed and not retryable; consumption claim must never be undone.
    source: .nimi/spec/realm/kernel/oauth-authority-contract.md
  - rule_id: R-FEED-001
    domain: feed
    level: must
    title: realm-owns-post-and-feed-domain
    statement: Realm owns the Post / Feed domain; Post is the canonical world-attached, author-attributed public-activity publishing primitive, and Feed is the read-only viewer-scoped projection over Post truth and must not be a parallel truth store.
    source: .nimi/spec/realm/kernel/feed-contract.md
  - rule_id: R-FEED-002
    domain: feed
    level: must
    title: post-entity-canonical-shape
    statement: A Post is anchored by Post truth with required canonical fields id, authorId, worldId, visibility, createdAt and optional caption, tags, contentRating, moderationStatus, updatedAt; each Post belongs to exactly one World, the Post id is an app-enforced ULID, and Realm feed-projection must not define a parallel public-activity entity outside Post.
    source: .nimi/spec/realm/kernel/feed-contract.md
  - rule_id: R-FEED-003
    domain: feed
    level: must
    title: post-attachment-canonical-envelope
    statement: Post attachments use the canonical attachment envelope keyed by targetType plus targetId referencing a READY RESOURCE or readable ASSET or BUNDLE; Realm feed must not hard-cut attachments to assetId-only or resourceId-only payloads or synthesize attachment URL/MIME/placeholder, and a non-READY or unreadable target must fail-close.
    source: .nimi/spec/realm/kernel/feed-contract.md
  - rule_id: R-FEED-004
    domain: feed
    level: must
    title: post-visibility-is-closed-enum
    statement: Post visibility is the closed enum PUBLIC, FRIENDS, PRIVATE and is a per-Post truth field that determines which viewers' feed projections it can enter, distinct from the feed scope itself; any unknown visibility value must fail-close and must not degrade to PUBLIC.
    source: .nimi/spec/realm/kernel/feed-contract.md
  - rule_id: R-FEED-005
    domain: feed
    level: must
    title: feed-has-three-canonical-scopes
    statement: "Realm Feed is a viewer-scoped projection with exactly three canonical scopes: personal (Posts authored by the viewer, including PRIVATE), friends (Posts authored by the viewer's ACTIVE human friends with visibility in PUBLIC or FRIENDS), and agent_activity (public-activity Posts authored by RealmAgents with visibility PUBLIC); each scope filters the same Post truth by createdAt descending with cursor pagination and must not own a parallel Post entity."
    source: .nimi/spec/realm/kernel/feed-contract.md
  - rule_id: R-FEED-006
    domain: feed
    level: must
    title: feed-query-is-cursor-paginated-typed-projection
    statement: Realm Feed query is a cursor-paginated read returning the FeedResponseDto shape (items of PostDto plus page meta cursor/nextCursor/limit); PostDto must carry the author projection, resolved attachments, visibility, contentRating, moderationStatus, and viewer-scoped likedByCurrentUser, and the query must resolve an effective worldId before projecting and fail-close when no World resolves rather than silently falling back to an arbitrary World.
    source: .nimi/spec/realm/kernel/feed-contract.md
  - rule_id: R-FEED-007
    domain: feed
    level: must
    title: agent-activity-scope-is-realmagent-authored-only
    statement: The agent_activity scope projects only public-activity Posts authored by RealmAgents, determined by the author account's RealmAgent role truth and not by feed-layer labelling; LocalAgent private activity, memory, cognition, and local session artifacts are not Realm feed content and must not enter any feed scope.
    source: .nimi/spec/realm/kernel/feed-contract.md
  - rule_id: R-FEED-008
    domain: feed
    level: must
    title: create-post-is-sole-publish-admission
    statement: Create Post is the sole Post truth-write admission entry; it attributes the post to the authenticated account as authorId, accepts canonical attachment envelope references plus optional caption and tags, resolves worldId server-side from author context and visibility from author settings, and must pass Realm content moderation before the Post becomes feed-eligible; Create Post must not accept caller-owned id, authorId, worldId, contentRating, moderationStatus, or likeCount as write authority, and canonical id may appear only after Realm validation and storage succeed.
    source: .nimi/spec/realm/kernel/feed-contract.md
  - rule_id: R-FEED-009
    domain: feed
    level: must
    title: post-attachment-and-moderation-fail-closed
    statement: Create Post attachment targets must be fail-close validated (RESOURCE must be READY and caller-manageable, ASSET and BUNDLE must be undeleted and caller-owned); a missing, non-READY, or unauthorized attachment target must fail-close the whole Create Post without silently dropping the attachment, synthesizing a placeholder, or projecting generic success on partial failure, and a moderation-blocked (EXPLICIT) publish must fail-close as a typed rejection.
    source: .nimi/spec/realm/kernel/feed-contract.md
  - rule_id: R-FEED-010
    domain: feed
    level: must
    title: feed-does-not-own-ai-execution
    statement: Realm Feed projection does not own AI execution, prompt assembly, model routing, turn execution, or LocalAgent session truth; Create Post and feed reads are Realm social content operations and must not carry prompt text, provider/model selection, AIScopeRef, or runtime turn payload, and how RealmAgent public activity content is generated stays outside this contract while this contract only fixes how that content, once canonical Post truth, enters the agent_activity feed scope.
    source: .nimi/spec/realm/kernel/feed-contract.md
