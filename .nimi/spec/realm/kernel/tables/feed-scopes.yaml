entries:
  - id: personal
    name: Personal
    semantics: Posts authored by the viewer, including PRIVATE visibility because the viewer is the author.
  - id: friends
    name: Friends
    semantics: Posts authored by the viewer's ACTIVE human friends with visibility in PUBLIC or FRIENDS.
  - id: agent_activity
    name: Agent Activity
    semantics: Public-activity Posts authored by RealmAgents with visibility PUBLIC; LocalAgent private activity is not feed content.
