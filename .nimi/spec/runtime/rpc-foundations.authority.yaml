      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.metadata-registry
  - id: rule.nimi.runtime.rpc-foundations.r156
    kind: rule
    title: Global audit record wire types are exact
    modality: must
    statement: AuditEventRecord uses exactly audit_id:string as a unique ULID, request_id:string, app_id:string, subject_user_id:string, domain:string, operation:string, reason_code:ReasonCode, trace_id:string, timestamp:Timestamp, payload:Struct, caller_kind:CallerKind, caller_id:string, surface_id:string, principal_id:string, principal_type:string, external_principal_type:string, capability:string, token_id:string, parent_token_id:string, consent_id:string, consent_version:string, policy_version:string, resource_selector_hash:string, and scope_catalog_version:string.
    condition: Whenever Runtime defines, persists, lists, or exports a global audit record.
    failure: Reject a global audit record whose field type, audit identity shape, or wire schema differs from the admitted schema.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r157
    kind: rule
    title: Audit export chunk wire types are exact
    modality: must
    statement: AuditExportChunk uses exactly export_id:string, sequence:uint64, chunk:bytes, eof:bool, and mime_type:string.
    condition: Whenever ExportAuditEvents emits a chunk.
    failure: Terminate the export with a typed failure rather than emit a chunk with a missing, substituted, or differently typed field.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r158
    kind: rule
    title: Usage record wire types and windows are exact
    modality: must
    statement: UsageStatRecord uses exactly app_id:string, subject_user_id:string, caller_kind:CallerKind, caller_id:string, capability:string, model_id:string, window:UsageWindow, bucket_start:Timestamp, request_count:int64, success_count:int64, error_count:int64, input_tokens:int64, output_tokens:int64, compute_ms:int64, and queue_wait_ms:int64; UsageWindow MINUTE means minute aggregation, HOUR means hour aggregation, and DAY means day aggregation.
    condition: Whenever Runtime stores, aggregates, or returns usage statistics.
    failure: Reject a usage record with a missing or differently typed field or a window with a different aggregation meaning.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r159
    kind: rule
    title: Runtime and provider health wire types are exact
    modality: must
    statement: GetRuntimeHealthResponse and RuntimeHealthEvent excluding sequence use exactly status:RuntimeHealthStatus, reason:string, queue_depth:int32, active_workflows:int32, active_inference_jobs:int32, cpu_milli:int64, memory_bytes:int64, vram_bytes:int64, and sampled_at:Timestamp; AIProviderHealthSnapshot uses exactly provider_name:string, state:string, reason:string, consecutive_failures:int32, last_changed_at:Timestamp, last_checked_at:Timestamp, and repeated AIProviderSubHealth records with the same non-nesting field structure.
    condition: Whenever Runtime returns or emits a Runtime or AI Provider health record.
    failure: Reject a health record whose field type, repeated shape, or nesting differs from the admitted schema.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r160
    kind: rule
    title: Authentication audit fields have one exact domain scope
    modality: must
    statement: principal_id, principal_type, token_id, parent_token_id, consent_id, consent_version, policy_version, and scope_catalog_version have values only on runtime.auth or runtime.grant audit events and remain empty outside those domains.
    condition: Whenever Runtime populates authentication or permission identity fields in an audit event.
    failure: Reject an audit write that populates any listed field outside its admitted domains.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r161
    kind: rule
    title: Audit service membership does not widen other consumers
    modality: must_not
    statement: RuntimeAuditService membership for ListUsageStats, GetRuntimeHealth, ListAIProviderHealth, SubscribeAIProviderHealthEvents, or SubscribeRuntimeHealthEvents widens that method's separately admitted fields, callers, transport, or SDK and Desktop consumption posture.
    condition: Whenever an audit service method is registered, projected, or consumed.
    failure: Preserve each method's separately admitted consumption contract and reject the widened projection or carrier.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r162
    kind: rule
    title: Desktop audit projection transport values and read audit are exact
    modality: must
    statement: Public TCP, ordinary gRPC, portable credentials, renderer-selected origin, local-app transports, and generic method-id or bytes proxying cannot authorize ListDesktopAuditEvents; every nonempty textual filter is an exact bounded identifier, from_time and to_time are valid timestamps with from_time no later than to_time, Runtime records successful and rejected projection reads in canonical audit storage without copying request filters or returned event payloads, and Desktop presents the returned trace_id as selectable text without changing it.
    condition: Whenever ListDesktopAuditEvents authorizes, validates, records, or presents a Desktop audit read.
    failure: Fail closed on an excluded carrier, unbounded identifier, invalid timestamp relation, missing read audit, copied filter or event content, or changed or nonselectable trace identity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.pagination-plane
  - id: rule.nimi.runtime.rpc-foundations.r163
    kind: rule
    title: Local app failure action classes are exact
    modality: must
    statement: Local-app principal, record, and provenance failures require Desktop owner action and are not silently retried by the app; lease replay, process mismatch, session revocation, and account change require a new owner-approved launch or session and never reuse the old carrier; grant required, revoked, or superseded returns denied permission while a still-valid identity session may remain; and Developer Mode disabled, approval-required, and risk-disclosure failures require explicit Desktop interaction and never background-approve or autostart.
    condition: Whenever Runtime or Desktop handles a LOCAL_APP failure action.
    failure: Reject silent app retry, old-carrier reuse, unnecessary valid-session destruction, background approval, or automatic startup.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.reason-code-registry
  - id: rule.nimi.runtime.rpc-foundations.r164
    kind: rule
    title: Local model and audit List RPC matrices are exact
    modality: must
    statement: ListLocalAssets orders kind ascending then asset_id ascending and filters status_filter, kind_filter, engine_filter, and category_filter; ListVerifiedAssets orders kind ascending then asset_id ascending and filters kind_filter, engine_filter, and category_filter; ListLocalServices orders service_id ascending and filters status_filter; ListNodeCatalog orders node_type ascending then node_id ascending and filters type_filter; ListLocalAudits orders timestamp descending and filters app_id, subject_user_id, and time_range; ListLocalTransfers orders created_at descending then install_session_id ascending and filters session_kind, state, model_id, and artifact_id; ListAuditEvents orders timestamp descending and filters app_id, subject_user_id, domain, reason_code, caller_kind, caller_id, and time_range; ListDesktopAuditEvents orders timestamp descending then audit_id descending and uses only its bounded filters; ListUsageStats orders bucket_start descending and filters app_id, subject_user_id, caller_kind, caller_id, capability, and model_id; ListAIProviderHealth is unpaginated, orders provider_name ascending, and has no filters; and ListModels orders model_id ascending and filters status_filter.
    condition: Whenever Runtime executes one of these List RPCs.
    failure: Reject an omitted required ordering key, changed direction, undeclared filter, or pagination on ListAIProviderHealth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.pagination-plane
  - id: rule.nimi.runtime.rpc-foundations.r165
    kind: rule
    title: Cognition memory agent and catalog List RPC matrices are exact
    modality: must
    statement: ListKnowledgeBanks orders scope ascending then bank_id ascending and filters scope_filter, app_id, and workspace_id; ListPages orders updated_at descending then page_id ascending and requires bank_id while filtering entity_type and slug_prefix; SearchHybrid orders score descending then page_id ascending and requires bank_id and query while filtering entity_type; ListLinks orders updated_at descending then link_id ascending and requires bank_id and from_page_id while filtering link_type; ListBacklinks orders updated_at descending then link_id ascending and requires bank_id and to_page_id while filtering link_type; TraverseGraph orders depth ascending then page_id ascending and requires bank_id and root_page_id while filtering link_type and max_depth; ListBanks orders scope ascending then bank_id ascending and filters scope_filter, app_id, workspace_id, agent_id, and world_id; ListAgents orders created_at descending then agent_id ascending and filters lifecycle_status and autonomy_enabled; ListAgentConversationSummaries orders updated_at descending then conversation_anchor_id ascending and requires agent_id while filtering status_filter; ListPendingHooks orders scheduled_for ascending then intent_id ascending and requires agent_id while filtering trigger_family_filter, trigger_detail_filter, and admission_state_filter; and SearchCatalogModels orders verified descending then title ascending and requires query while filtering category_filter and engine_filter.
    condition: Whenever Runtime executes one of these cognition, memory, agent, or catalog List RPCs.
    failure: Reject an omitted required filter, changed ordering key or direction, or filter outside the admitted matrix.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.pagination-plane
  - id: rule.nimi.runtime.rpc-foundations.r166
    kind: rule
    title: Phase 1 route metadata kinds and scalar types are closed
    modality: must
    statement: Phase 1 metadataKind is exactly text.generate, image.generate, audio.synthesize, audio.transcribe, voice_workflow.voice_clone, or voice_workflow.voice_design, and an unlisted capability cannot acquire stable metadata through a free object, provider raw payload, or Desktop-local derivation; text.generate supportsThinking, supportsImageInput, supportsAudioInput, supportsVideoInput, and supportsArtifactRefInput are boolean; image.generate supportedResponseFormats is string[], maxImagesPerRequest is number, and supportsNegativePrompt, supportsReferenceImages, supportsMask, supportsSeed, supportsSize, supportsAspectRatio, supportsQuality, and supportsStyle are boolean.
    condition: Whenever Runtime constructs or validates a Phase 1 describe result for text or image generation.
    failure: Reject an unlisted metadata kind, free-form metadata, or any listed field with a different scalar or container type.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.route-description-plane
  - id: rule.nimi.runtime.rpc-foundations.r167
    kind: rule
    title: Voice and audio route metadata types are exact
    modality: must
    statement: voice_workflow.voice_clone uses workflowType literal voice_clone, requiresTargetSynthesisBinding:boolean, textPromptMode from unsupported, optional, or required, supportsLanguageHints:boolean, supportsPreferredName:boolean, referenceAudioUriInput:boolean, referenceAudioBytesInput:boolean, and allowedReferenceAudioMimeTypes:string[]; voice_workflow.voice_design uses workflowType literal voice_design, requiresTargetSynthesisBinding:boolean, instructionTextMode and previewTextMode from unsupported, optional, or required, supportsLanguage:boolean, and supportsPreferredName:boolean; audio.synthesize uses supportedAudioFormats:string[], supportedTimingModes as an array drawn only from none, word, and char, supportsLanguage:boolean, and supportsEmotion:boolean; and audio.transcribe uses tiers:string[], supportedResponseFormats:string[], supportsLanguage:boolean, supportsPrompt:boolean, supportsTimestamps:boolean, and supportsDiarization:boolean.
    condition: Whenever Runtime constructs or validates a voice workflow, synthesis, or transcription describe result.
    failure: Reject a wrong literal, scalar type, container type, or member outside an admitted closed mode.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.route-description-plane
  - id: rule.nimi.runtime.rpc-foundations.r168
    kind: rule
    title: Specialized subscription stream semantics are preserved
    modality: must
    statement: SubscribeAgentVoiceStream treats nonfinal chunks only as transient transport and derives final replay authority from exactly one durable audio artifact; SubscribeRuntimeAgentAIConfigReadiness sends an initial snapshot when connected and then emits config or readiness changes; and a mode D client or server may close the stream, with clients detecting server closure through gRPC status or runtime.disconnected before deciding whether to reconstruct.
    condition: Whenever either specialized subscription is established, emits, replays, or closes.
    failure: Reject transient chunks as replay authority, a readiness subscription without its initial snapshot, or a closure path hidden from the consumer.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r169
    kind: rule
    title: Durable target references exclude runtime and display evidence
    modality: must_not
    statement: A durable Runtime target reference contains runtime proof, resolved endpoint paths, selected-source evidence, execution metadata, or display-only fields.
    condition: Whenever local or cloud execution intent is minted, persisted, parsed, or migrated.
    failure: Reject the reference instead of stripping the forbidden evidence or treating it as durable identity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.target-identity-plane
  - id: rule.nimi.runtime.rpc-foundations.r170
    kind: rule
    title: Target classification scan and dispositions are closed
    modality: must
    statement: The G0 and G12 target classification inventory uses rg -n "\b(model_id|target_model_id|connector_id|LOCAL_MODEL|targetId|profileId|localModelId|goRuntimeLocalModelId)\b" .nimi/spec --glob "!**/generated/**" --glob "!**/gen/**"; every hit is classified as exactly must_migrate, allowed_non_identity_fact, retired_history, or unrelated_domain; every allowed_non_identity_fact names the guard that prevents durable target-reference minting; and every must_migrate remains owned by this hard cut unless an explicit downstream owner is named.
    condition: Whenever the Runtime Target v2 G0 or G12 classification inventory is produced or reviewed.
    failure: Fail the target-identity gate on an unclassified hit, unknown classification, missing nonidentity guard, or unowned migration row.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.target-identity-plane
  - id: rule.nimi.runtime.rpc-foundations.r171
    kind: rule
    title: Sensitive audit key matching uses substrings
    modality: must
    statement: Sensitive audit key detection performs case-insensitive substring matching for api_key, credential, secret, authorization, token, and password patterns while preserving only the admitted structural token identifier exemptions.
    condition: Whenever the audit write layer evaluates a payload or metadata key for redaction.
    failure: Reject the audit write when case-sensitive or exact-name-only matching would leave an admitted sensitive pattern unredacted.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r172
    kind: rule
    title: AI audit client identity requires a declared instance
    modality: must
    statement: AI execution audit client_id equals app_instance_id only when application registration declares an instance identifier and remains empty when no instance identifier was declared.
    condition: Whenever Runtime populates client_id on an AI execution audit event.
    failure: Reject a synthesized, mismatched, or undeclared client instance identity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r173
    kind: rule
    title: Simulated stream metadata retains downgrade audit meaning
    modality: must
    statement: ScenarioStreamCompleted.stream_simulated remains compatibility metadata for text and speech downgrade auditing while voice_output_mode remains the positive primary proof of native or simulated speech output.
    condition: Whenever Runtime completes or audits a text or speech generation stream with simulated-stream compatibility metadata.
    failure: Reject loss of downgrade audit meaning or use of stream_simulated=false alone as proof of native realtime output.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
