    statement: Metadata requirements are exactly x-nimi-access-token-secret=>allowed[]/required[loopback runtime entrypoint token-authenticated call]; x-nimi-session-id=>allowed[]/required[loopback runtime entrypoint session-authenticated app call]; x-nimi-session-token=>allowed[]/required[loopback runtime entrypoint session-authenticated app call]; x-nimi-trace-id=>allowed[]/required[L0 correlation envelope (correlated under K-AUDIT-020)].
