format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.rpc-foundations
units:
  - id: definition.nimi.runtime.rpc-foundations.audit-plane
    kind: definition
    title: Runtime audit plane
    meaning: The Runtime audit plane owns common audit fields, bounded stores, redaction, usage and health records, export, correlation, participation lineage, and the protected Desktop audit projection.
  - id: definition.nimi.runtime.rpc-foundations.error-plane
    kind: definition
    title: Runtime structured error plane
    meaning: The Runtime structured error plane combines gRPC status with stable Runtime reason codes, safe metadata, exact exceptional mappings, and fail-closed disclosure boundaries.
  - id: definition.nimi.runtime.rpc-foundations.pagination-plane
    kind: definition
    title: Runtime pagination and filtering plane
    meaning: The Runtime pagination and filtering plane owns cursor integrity, page limits, stable ordering, filter semantics, and the method-specific List RPC matrix.
  - id: definition.nimi.runtime.rpc-foundations.route-description-plane
    kind: definition
    title: Runtime route description plane
    meaning: The Runtime route description plane owns typed metadata for resolved capability routes while keeping option listing, resolution, health, description, and execution authority separate.
  - id: definition.nimi.runtime.rpc-foundations.streaming-plane
    kind: definition
    title: Runtime streaming plane
    meaning: The Runtime streaming plane classifies every server stream by close protocol and owns establishment, framing, terminal, timeout, shutdown, backpressure, and replay boundaries.
  - id: definition.nimi.runtime.rpc-foundations.target-identity-plane
    kind: definition
    title: Runtime target identity plane
    meaning: The Runtime target identity plane separates durable local and cloud intent from inventory facts, credential custody, runtime proof, and resolved execution bindings.
  - id: definition.nimi.runtime.rpc-foundations.reason-code-registry
    kind: definition
    title: Runtime reason-code registry
    meaning: The Runtime reason-code registry is the closed name, numeric value, and family assignment consumed by generated protocol, SDK, audit, and deterministic verification surfaces.
  - id: definition.nimi.runtime.rpc-foundations.activation-gate-registry
    kind: definition
    title: Runtime activation-gate registry
    meaning: The Runtime activation-gate registry is the closed owner, state, and audit projection for local dependency, source, profile, resolver, host, and workflow readiness failures.
  - id: definition.nimi.runtime.rpc-foundations.metadata-registry
    kind: definition
    title: Runtime metadata registry
    meaning: The Runtime metadata registry is the closed set of admitted gRPC metadata keys and their exact value and requirement conditions.
  - id: rule.nimi.runtime.rpc-foundations.r001
    kind: rule
    title: Every audit event has the common floor
    modality: must
    statement: Every Runtime audit event contains trace_id, app_id, domain, operation, reason_code, and timestamp.
    condition: Whenever any AI execution, authentication, permission, lifecycle, knowledge, local, or global audit path records an event.
    failure: Reject or fail the auditable operation rather than persist an event missing any common-floor field.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r002
    kind: rule
    title: Audit success and failure coverage is complete
    modality: must
    statement: Management and consume RPCs record success and failure, baseline knowledge writes cover knowledge.bank.create, knowledge.bank.delete, knowledge.page.put, knowledge.page.delete, knowledge.link.add, and knowledge.link.remove, and durable hybrid-readiness state changes remain audited even though SearchHybrid itself adds no read-audit baseline.
    condition: Whenever an admitted management, consume, knowledge-write, or hybrid-readiness transition completes or fails.
    failure: Treat a missing required success, failure, or readiness event as an audit contract violation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r003
    kind: rule
    title: Request and trace identity share one baseline ULID
    modality: must
    statement: The current Runtime baseline uses one ULID for both request_id and trace_id while preserving the fields for future fan-out separation.
    condition: Whenever an AI execution path creates request and trace identity.
    failure: Reject divergent or non-ULID baseline identities instead of silently breaking correlation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r004
    kind: rule
    title: Application identity carriers are fixed
    modality: must
    statement: AI consume and ScenarioJob query carry app_id in the request body, while Connector management carries application identity only in x-nimi-app-id metadata.
    condition: Whenever Runtime accepts application identity for these RPC families.
    failure: Reject a missing, conflicting, or misplaced application identity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.metadata-registry
  - id: rule.nimi.runtime.rpc-foundations.r005
    kind: rule
    title: Audit retention and redaction are mandatory
    modality: must
    statement: Audit storage uses configurable finite retention, redacts credentials, tokens, secrets, authorization input, and other sensitive fields, and never records reconstructable plaintext credential fragments; diagnostics may retain only irreversible digests or bounded masks.
    condition: Whenever Runtime stores or exports audit data.
    failure: Stop the audit write or export when finite retention or required redaction cannot be enforced.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r006
    kind: rule
    title: Global audit records have one field schema
    modality: must
    statement: AuditEventRecord contains audit_id, optional request_id, required app_id, optional subject_user_id, required domain, required operation, required reason_code, required trace_id, required timestamp, optional payload, caller_kind, caller_id, surface_id, principal_id, principal_type, external_principal_type, capability, token_id, parent_token_id, consent_id, consent_version, policy_version, resource_selector_hash, and scope_catalog_version, with proto field numbers preserving wire order.
    condition: Whenever Runtime persists or returns a global audit record.
    failure: Reject a record that omits a required field, introduces an undeclared stable field, or changes admitted wire identity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r007
    kind: rule
    title: Global audit storage is bounded and queryable
    modality: must
    statement: The global audit ring holds 20000 events by default, accepts auditRingBufferSize configuration, evicts oldest events by FIFO, and ListAuditEvents paginates with filters for app_id, subject_user_id, domain, reason_code, caller_kind, caller_id, and time_range.
    condition: Whenever Runtime stores or lists global audit events.
    failure: Reject unbounded retention, non-FIFO overflow, or an undeclared audit filter.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.pagination-plane
  - id: rule.nimi.runtime.rpc-foundations.r008
    kind: rule
    title: Usage storage is bounded and dimensioned
    modality: must
    statement: The usage ring holds 50000 samples by default, accepts usageStatsBufferSize configuration, evicts by FIFO, aggregates app_id by subject_user_id by caller_kind by caller_id by capability by model_id, and ListUsageStats paginates and filters on those dimensions.
    condition: Whenever Runtime stores or lists usage samples.
    failure: Reject unbounded usage retention, non-FIFO overflow, or a query dimension outside the admitted set.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.pagination-plane
  - id: rule.nimi.runtime.rpc-foundations.r009
    kind: rule
    title: Audit export has one chunk protocol
    modality: must
    statement: ExportAuditEvents server-streams AuditExportChunk with export_id, zero-based increasing sequence, chunk bytes, eof, and mime_type; requests may select format, deflate compression, and time range, and the server closes with gRPC OK after eof=true.
    condition: Whenever Runtime exports audit events.
    failure: Terminate with a typed stream failure rather than omit ordering, emit data after eof, or report success without the eof close protocol.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r010
    kind: rule
    title: Usage records have one schema
    modality: must
    statement: UsageStatRecord contains app_id, subject_user_id, caller_kind, caller_id, capability, model_id, window, bucket_start, request_count, success_count, error_count, input_tokens, output_tokens, compute_ms, and queue_wait_ms.
    condition: Whenever Runtime stores or returns usage statistics.
    failure: Reject usage data that cannot be represented by the admitted fields.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r011
    kind: rule
    title: Usage windows are closed
    modality: must
    statement: UsageWindow is exactly MINUTE, HOUR, or DAY.
    condition: Whenever Runtime aggregates or returns a usage window.
    failure: Reject an unknown window instead of coercing it to an admitted duration.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r012
    kind: rule
    title: Runtime health snapshots have one schema
    modality: must
    statement: GetRuntimeHealthResponse and RuntimeHealthEvent excluding sequence contain status, reason, queue_depth, active_workflows, active_inference_jobs, cpu_milli, memory_bytes, vram_bytes, and sampled_at.
    condition: Whenever Runtime returns or emits a health snapshot.
    failure: Reject a health snapshot missing an admitted field rather than synthesize health.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r013
    kind: rule
    title: Runtime audit service methods and consumer posture are closed
    modality: must
    statement: RuntimeAuditService is exactly ListAuditEvents, ListDesktopAuditEvents, ExportAuditEvents, ListUsageStats, GetRuntimeHealth, ListAIProviderHealth, SubscribeAIProviderHealthEvents, and SubscribeRuntimeHealthEvents; raw ListAuditEvents and ExportAuditEvents are not Desktop protected consumers or renderer, SDK, Kit, or public TCP fallbacks, and only ListDesktopAuditEvents uses the protected Desktop projection.
    condition: Whenever Runtime registers or a consumer invokes an audit service method.
    failure: Reject undeclared methods and every attempt to substitute a raw audit method for the protected Desktop projection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r014
    kind: rule
    title: Provider health snapshots have one schema
    modality: must
    statement: AIProviderHealthSnapshot contains provider_name, state, reason, consecutive_failures, last_changed_at, last_checked_at, and repeated non-nesting AIProviderSubHealth records of the same field shape.
    condition: Whenever Runtime returns provider health.
    failure: Reject malformed, recursively nested, or field-incomplete provider health data.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r015
    kind: rule
    title: Local and global audit stores remain independent
    modality: must
    statement: LocalService audit uses local-state.json, a 5000-event FIFO limit, localAuditCapacity, and ListLocalAudits, while RuntimeAuditService global audit uses the separate default 20000-event auditRingBufferSize ring and ListAuditEvents or ExportAuditEvents; Phase 1 performs no copy, merge, or cross-store aggregation.
    condition: Whenever Runtime stores or queries local or global audit events.
    failure: Reject writes, queries, or configuration that conflate the two stores.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r016
    kind: rule
    title: Audit field models retain their scopes
    modality: must
    statement: The common six-field floor applies to all audit paths, AI execution adds request_id, user_id, optional client_id, optional connector_id, provider, model, request_source, usage, and failure grpc_code, global storage uses AuditEventRecord with AI extensions in payload, and local storage uses LocalAuditEvent; authentication and permission identity fields have values only in runtime.auth or runtime.grant.
    condition: Whenever Runtime selects an audit field model.
    failure: Reject a model that omits its floor, leaks domain-only fields, or substitutes one store schema for another.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r017
    kind: rule
    title: Sensitive audit keys use deterministic masks
    modality: must
    statement: Audit ingress matches key names case-insensitively for api_key, credential, secret, authorization, token except token_id, parent_token_id, page_token, and next_page_token, and password; values of length at least eight retain first four plus three asterisks plus last four, shorter values become three asterisks, and redaction occurs only at the audit write layer.
    condition: Whenever payload or metadata is written to audit storage.
    failure: Reject the write when the central redactor cannot apply the exact mask or an upstream pre-redaction is treated as sufficient.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r018
    kind: rule
    title: AI execution audit extensions are fixed
    modality: must
    statement: ExecuteScenario, StreamScenario, ScenarioJob, and equivalent AI execution events add request_id, user_id, optional client_id equal to app_instance_id, connector_id when applicable, provider, model, request_source, usage, and grpc_code on failure to the common audit floor; non-AI domains do not require those extensions.
    condition: Whenever Runtime audits AI execution.
    failure: Reject missing required AI execution context or the forced population of AI-only fields in unrelated domains.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r019
    kind: rule
    title: Cross-layer correlation keys are fixed
    modality: must
    statement: Cross-layer Runtime, SDK, and Desktop diagnosis uses trace_id first, then request_id when present, app_id, domain, and a timestamp window, and never treats message text or UI-local time alone as sufficient correlation.
    condition: Whenever a cross-layer audit or support query is constructed.
    failure: Reject a query posture that cannot preserve the admitted structured correlation keys.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r020
    kind: rule
    title: Trace identity propagates unchanged
    modality: must
    statement: Runtime includes trace_id in every audit floor, SDK and Desktop preserve it in logs and errors, and Desktop IPC, SDK runtime client, and Runtime gRPC remain queryable by the same trace_id.
    condition: Whenever a call crosses Runtime, SDK, or Desktop boundaries.
    failure: Treat trace rewriting or loss as a correlation failure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r021
    kind: rule
    title: Audit queries stay structured and redacted
    modality: must
    statement: Audit query surfaces expose trace_id, request_id, app_id, domain, reason_code, and timestamp as structured fields, keep credential, proof, and token plaintext redacted, and prioritize a copyable trace_id in Desktop and operations views.
    condition: Whenever audit evidence is queried or displayed.
    failure: Reject raw-log-only querying or a result that exposes protected material.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r022
    kind: rule
    title: Participation cannot create a side audit store
    modality: must_not
    statement: Runtime Agent Participation creates a participation-specific audit or replay store, bypasses the common floor or global record semantics, or treats delegated gateway references as a second replay authority.
    condition: Whenever participation execution or replay evidence is recorded.
    failure: Use typed payload extensions and reconstruct replay from Runtime audit lineage, including delegated evidence references only as lineage.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r023
    kind: rule
    title: Audit metadata maps to exact record fields
    modality: must
    statement: x-nimi-caller-kind maps to caller_kind, x-nimi-caller-id to caller_id, x-nimi-surface-id to surface_id, and x-nimi-access-token-id to token_id; x-nimi-trace-id remains the protocol correlation envelope rather than a newly introduced audit-context key.
    condition: Whenever Runtime accepts audit-context metadata.
    failure: Reject an unknown mapping or any attempt to remap trace authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.metadata-registry
  - id: rule.nimi.runtime.rpc-foundations.r024
    kind: rule
    title: Desktop audit projection is bounded and protected
    modality: must
    statement: ListDesktopAuditEvents is available only on desktop_control for the verified Nimi Desktop process; its request admits exact filters trace_id, request_id, app_id, domain, operation, reason_code, caller_kind, required from_time and to_time spanning at most seven days, page_size, and page_token, defaults page_size zero to 50, rejects above 100, binds tokens to the complete filter set, returns only events and next_page_token, and projects each event to audit_id, request_id, app_id, domain, operation, reason_code, trace_id, timestamp, and caller_kind from canonical global storage before transport.
    condition: Whenever Desktop reads Runtime audit events.
    failure: Fail closed on an unauthorized carrier, forbidden filter or field, invalid range or token, missing canonical storage, synthetic substitute, or UI-side redaction substitute, and audit projection reads without copying filters or returned payloads.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.pagination-plane
  - id: rule.nimi.runtime.rpc-foundations.r025
    kind: rule
    title: Runtime errors have two orthogonal layers
    modality: must
    statement: Every Runtime failure uses a gRPC code for failure stage and a ReasonCode for business cause, without requiring one-to-one mapping.
    condition: Whenever Runtime returns a typed failure.
    failure: Reject a projection that collapses either layer into free text.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.reason-code-registry
  - id: rule.nimi.runtime.rpc-foundations.r026
    kind: rule
    title: Reason-code semantics have one authority
    modality: must
    statement: Runtime reason-code names, values, families, use conditions, and failure meanings are owned by this canonical authority, while config/runtime-reason-codes.yaml and its config fragments are machine projections only and cannot create or widen product semantics.
    condition: Whenever a reason code is defined, generated, checked, or consumed.
    failure: Reject a code absent from canonical authority or a config row interpreted as independent product authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.reason-code-registry
  - id: rule.nimi.runtime.rpc-foundations.r027
    kind: rule
    title: Unary and streaming errors use exact carriers
    modality: must
    statement: Unary failures carry ReasonCode in google.rpc.ErrorInfo within Status.details, generation streams use unary status before establishment and prefer terminal reason_code after establishment, and state-event streams use fatal gRPC status rather than terminal-frame semantics.
    condition: Whenever Runtime transports a failure.
    failure: Reject a carrier that loses the stable reason or invents terminal semantics for a state-event stream.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r028
    kind: rule
    title: Connector error mappings are exact
    modality: must
    statement: Owner mismatch or unauthenticated remote access returns NOT_FOUND with AI_CONNECTOR_NOT_FOUND, a disabled connector returns FAILED_PRECONDITION with AI_CONNECTOR_DISABLED, missing consume or list-model credentials return FAILED_PRECONDITION with AI_CONNECTOR_CREDENTIAL_MISSING, and TestConnector returns OK with ok=false and AI_CONNECTOR_CREDENTIAL_MISSING.
    condition: Whenever the listed connector condition occurs.
    failure: Return the exact mapping rather than exposing existence, collapsing the cause, or reporting success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.reason-code-registry
  - id: rule.nimi.runtime.rpc-foundations.r029
    kind: rule
    title: Remote model listing normalizes provider failures
    modality: must
    statement: ListConnectorModels for a remote connector maps provider 401, 429, 5xx, and timeout failures to UNAVAILABLE with AI_PROVIDER_UNAVAILABLE.
    condition: Whenever remote provider model listing fails upstream.
    failure: Reject an upstream-specific or untyped public mapping.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.reason-code-registry
  - id: rule.nimi.runtime.rpc-foundations.r030
    kind: rule
    title: Error mapping coverage is complete
    modality: must
    statement: The Runtime error mapping matrix covers consume, connector, and media entry classes, at least one constrained scenario for every ReasonCode, and each scenario gRPC code plus status-error or ok=false exit semantics.
    condition: Whenever the mapping matrix is generated or verified.
    failure: Fail the mapping gate when an admitted code, entry class, gRPC code, or exit semantic is absent.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.reason-code-registry
  - id: rule.nimi.runtime.rpc-foundations.r031
    kind: rule
    title: Media idempotency conflict has one exit
    modality: must
    statement: SubmitScenarioJob idempotency conflict from x-nimi-idempotency-key returns ALREADY_EXISTS with AI_MEDIA_IDEMPOTENCY_CONFLICT, while an absent key performs no deduplication.
    condition: Whenever media job submission evaluates idempotency.
    failure: Reject silent downgrade to provider or internal error and never invent deduplication without the key.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.metadata-registry
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.reason-code-registry
  - id: rule.nimi.runtime.rpc-foundations.r032
    kind: rule
    title: Missing local management targets use plain not found
    modality: must
    statement: Local model management RPCs including StartLocalAsset, StopLocalAsset, and RemoveLocalAsset return NOT_FOUND without a specific reason code when local_model_id does not exist; AI_LOCAL_* codes remain consume and probe semantics.
    condition: Whenever a local management target is absent.
    failure: Reject reuse of consume or probe reason families for the management not-found result.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
  - id: rule.nimi.runtime.rpc-foundations.r033
    kind: rule
    title: User-reachable failures are structurally stable
    modality: must
    statement: Grant, connector, and AI failures expose reasonCode, actionHint, traceId, and retryable; ErrorInfo.Reason carries reasonCode, ErrorInfo.Metadata carries action_hint and when available trace_id and retryable, bridge or SDK status-message JSON never replaces ErrorInfo, and ScenarioJob failures project safe metadata to reason_metadata.
    condition: Whenever a user-reachable synchronous or asynchronous failure is returned.
    failure: Reject free-text-only failure, missing stable fields, or loss of safe metadata during job polling.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
  - id: rule.nimi.runtime.rpc-foundations.r034
    kind: rule
    title: Internal error text cannot drive clients
    modality: must_not
    statement: Provider SDK text, raw storage errors, or other internal implementation details are exposed as the user decision basis or the only client branch signal.
    condition: Whenever Runtime maps a grant, connector, or AI failure.
    failure: Map to a stable reasonCode, keep details server-side under traceId, and return the typed public shape.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
  - id: rule.nimi.runtime.rpc-foundations.r035
    kind: rule
    title: Local speech bundle reasons remain distinct
    modality: must
    statement: Local Speech gating and repair uses exactly AI_LOCAL_SPEECH_PREFLIGHT_BLOCKED, AI_LOCAL_SPEECH_DOWNLOAD_CONFIRMATION_REQUIRED, AI_LOCAL_SPEECH_ENV_INIT_FAILED, AI_LOCAL_SPEECH_HOST_INIT_FAILED, AI_LOCAL_SPEECH_CAPABILITY_DOWNLOAD_FAILED, and AI_LOCAL_SPEECH_BUNDLE_DEGRADED; confirmation required is fail-closed rather than background retry, preflight does not impersonate init failure, env, host, and capability failures remain distinct, degraded never appears healthy, capability and slice detail stays structured metadata, and Desktop LOCAL_AI_SPEECH aliases remain diagnostic only.
    condition: Whenever Runtime, SDK, or Desktop represents Local Speech bundle failure.
    failure: Reject silent bootstrap, collapsed reasons, false health, or a Desktop alias promoted to canonical truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.reason-code-registry
  - id: rule.nimi.runtime.rpc-foundations.r036
    kind: rule
    title: Local app failures use closed safe reasons
    modality: must
    statement: Local-app principal, record, permission, launch, and session failures use the LOCAL_APP_* family and expose only stable reason, action hint, retryability, and trace id; they hide internal ids, lineage, SID partition, process proof, attestation refs, endpoint, bearer, and native verification detail, require Desktop action for principal, record, provenance, Developer Mode, approval, and risk failures, require a new owner-approved launch for replay, process mismatch, revocation, or account change, preserve identity session on permission denial when valid, and never treat operation unavailable as proxy fallback.
    condition: Whenever Runtime returns a local-app kernel failure.
    failure: Reject leaked authority detail, silent retry or approval, old-carrier reuse, or generic proxy fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.reason-code-registry
  - id: rule.nimi.runtime.rpc-foundations.r037
    kind: rule
    title: Connector pagination cannot mint local target identity
    modality: must_not
    statement: Connector pagination exposes retired local connector ordering or turns model, audit, or list fields into durable target references.
    condition: Whenever connector or model pagination projects target-related fields.
    failure: Keep local assets and profiles under RuntimeLocalService and reject durable identity inferred from list facts.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.pagination-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.target-identity-plane
  - id: rule.nimi.runtime.rpc-foundations.r038
    kind: rule
    title: Connector pagination limits are fixed
    modality: must
    statement: ListConnectors and ListConnectorModels default page_size to 50, cap it at 200, and clamp values above 200.
    condition: Whenever either Connector List RPC paginates.
    failure: Reject a different default, maximum, or overflow behavior.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.pagination-plane
  - id: rule.nimi.runtime.rpc-foundations.r039
    kind: rule
    title: Page tokens bind cursor and filters
    modality: must
    statement: A page_token is opaque, contains at least a sort breakpoint and filter digest, and returns INVALID_ARGUMENT with PAGE_TOKEN_INVALID when malformed, structurally invalid, or bound to different filters; base64url JSON of cursor and SHA-256 filter JSON is an implementation recommendation rather than a cryptographic-signature requirement.
    condition: Whenever a paginated RPC accepts a non-empty page token.
    failure: Reject the token without resetting to the first page or changing filters.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.pagination-plane
  - id: rule.nimi.runtime.rpc-foundations.r040
    kind: rule
    title: Connector ordering is stable
    modality: must
    statement: ListConnectors orders active remote credential connectors by created_at descending then connector_id ascending, RuntimeLocalService separately owns local asset and profile ordering, and ListConnectorModels orders model_id ascending.
    condition: Whenever connector or connector-model records are listed.
    failure: Reject unstable, local-connector-first, or undeclared ordering.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.pagination-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.target-identity-plane
  - id: rule.nimi.runtime.rpc-foundations.r041
    kind: rule
    title: Connector filters normalize exactly once
    modality: must
    statement: kind_filter and status_filter silently ignore UNSPECIFIED, provider_filter trims and ignores empty values after ConnectorService entry normalization, performs no second normalization, and no matches returns an empty list without error.
    condition: Whenever Connector List filters are evaluated.
    failure: Reject duplicate normalization or a no-match error.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.pagination-plane
  - id: rule.nimi.runtime.rpc-foundations.r042
    kind: rule
    title: Generic pagination defaults are fixed
    modality: must
    statement: Unless explicitly overridden, every paginated List RPC defaults page_size to 50, caps and clamps at 200, treats page_size zero as default, treats absent or empty page_token as the first page, and returns next_page_token with empty string meaning no next page.
    condition: Whenever an admitted List RPC paginates without a narrower rule.
    failure: Reject a response missing next_page_token or a different default, cap, clamp, or first-page behavior.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.pagination-plane
  - id: rule.nimi.runtime.rpc-foundations.r043
    kind: rule
    title: List RPC pagination matrix is closed
    modality: must
    statement: "Pagination and ordering are: ListConnectors paginated by connector ordering and connector filters; ListConnectorModels paginated by model_id; ListLocalAssets and ListVerifiedAssets by kind then asset_id with their admitted local filters; ListLocalServices by service_id; ListNodeCatalog by node_type then node_id; ListLocalAudits by timestamp descending; ListLocalTransfers by created_at descending then install_session_id; ListAuditEvents by timestamp descending; ListDesktopAuditEvents by timestamp then audit_id descending under its bounded override; ListUsageStats by bucket_start descending; ListAIProviderHealth unpaginated by provider_name; ListModels paginated by model_id; ListKnowledgeBanks by scope then bank_id; ListPages and SearchHybrid and ListLinks and ListBacklinks and TraverseGraph by their required bank, page, query, link, and depth filters with declared updated_at, score, or depth ordering; ListBanks by scope then bank_id; ListAgents by created_at descending then agent_id; ListAgentConversationSummaries by updated_at descending then conversation_anchor_id; ListPendingHooks by scheduled_for then intent_id; SearchCatalogModels by verified descending then title, with only the filters admitted by the former matrix."
    condition: Whenever Runtime defines or executes one of the listed List RPCs.
    failure: Reject pagination on ListAIProviderHealth, missing required filters, or ordering and filters outside the closed matrix.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.pagination-plane
  - id: rule.nimi.runtime.rpc-foundations.r044
    kind: rule
    title: Route description has one Runtime owner
    modality: must
    statement: runtime.route.describe produces app-facing typed metadata for one resolved canonical capability route, Runtime alone owns that metadata, and the result describes capability policy, input, reasoning, and workflow semantics without health success, fallback, or Desktop cache truth.
    condition: Whenever a resolved route is described.
    failure: Reject provider probing, consumer-generated metadata, health synthesis, or fallback decisions in describe.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.route-description-plane
  - id: rule.nimi.runtime.rpc-foundations.r045
    kind: rule
    title: Route operations keep separate responsibilities
    modality: must
    statement: runtime.route.listOptions returns only selectable options, runtime.route.resolve returns only a resolved binding, runtime.route.checkHealth returns only binding health and capability-scoped readiness, and runtime.route.describe returns only typed route metadata; audio.synthesize and audio.transcribe health remain independently proven even on one speech engine, and plain-speech health never proves voice workflow readiness.
    condition: Whenever route listing, resolution, health, or description runs.
    failure: Fail closed when one operation fills another operation’s truth or independent capability proof is absent.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.route-description-plane
  - id: rule.nimi.runtime.rpc-foundations.r046
    kind: rule
    title: Route description envelope and text metadata are typed
    modality: must
    statement: A Phase 1 describe result contains canonical capability, metadataVersion v1, Runtime-produced resolvedBindingRef, matching metadataKind, and matching typed metadata; text.generate requires supportsThinking, traceModeSupport exactly none, hide, or separate, supportsImageInput, supportsAudioInput, supportsVideoInput, and supportsArtifactRefInput.
    condition: Whenever describe returns text.generate or its common envelope.
    failure: Reject a noncanonical capability, heuristic binding, mismatched discriminator, missing field, or invalid type.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.route-description-plane
  - id: rule.nimi.runtime.rpc-foundations.r047
    kind: rule
    title: Image route metadata is closed
    modality: must
    statement: image.generate metadata requires supportedResponseFormats, maxImagesPerRequest, supportsNegativePrompt, supportsReferenceImages, supportsMask, supportsSeed, supportsSize, supportsAspectRatio, supportsQuality, and supportsStyle, may include defaultResponseFormat, providerExtensionNamespace, and providerExtensionSchemaVersion, describes only canonical ImageGenerateScenarioSpec request capability, exposes no raw provider allowlist or transport override, and creates no second image execution plane outside SubmitScenarioJob and artifact output.
    condition: Whenever describe returns image.generate metadata.
    failure: Reject missing typed fields, raw adapter schema, transport override, or alternate image execution control.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.route-description-plane
  - id: rule.nimi.runtime.rpc-foundations.r048
    kind: rule
    title: Voice workflow route metadata is closed
    modality: must
    statement: voice_workflow.voice_clone requires workflowType voice_clone, requiresTargetSynthesisBinding, textPromptMode exactly unsupported, optional, or required, supportsLanguageHints, supportsPreferredName, referenceAudioUriInput, referenceAudioBytesInput, and allowedReferenceAudioMimeTypes; voice_workflow.voice_design requires workflowType voice_design, requiresTargetSynthesisBinding, instructionTextMode and previewTextMode from the same closed modes, supportsLanguage, and supportsPreferredName; both may expose only providerExtensionNamespace and providerExtensionSchemaVersion as optional extension identity.
    condition: Whenever describe returns voice workflow metadata.
    failure: Reject missing workflow fields, a wrong discriminator, concrete extension keys, transport overrides, or runtime-private schema.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.route-description-plane
  - id: rule.nimi.runtime.rpc-foundations.r049
    kind: rule
    title: Plain audio route metadata is closed
    modality: must
    statement: audio.synthesize requires supportedAudioFormats, supportedTimingModes drawn from none, word, and char, supportsLanguage, and supportsEmotion, and may include defaultAudioFormat, voiceRenderHints, providerExtensionNamespace, and providerExtensionSchemaVersion; audio.transcribe requires tiers, supportedResponseFormats, supportsLanguage, supportsPrompt, supportsTimestamps, and supportsDiarization, and may include maxSpeakerCount and extension namespace and version.
    condition: Whenever describe returns audio synthesis or transcription metadata.
    failure: Reject missing fields, undeclared timing modes, or free-form provider payload.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.route-description-plane
  - id: rule.nimi.runtime.rpc-foundations.r050
    kind: rule
    title: Route metadata derives one way from Runtime truth
    modality: must
    statement: Text multimodal and artifact support derives from Runtime preflight and artifact modality truth, reasoning derives from typed reasoning capability truth, image derives from source-authored image_request_options and resolved image catalog truth plus verified private local support class, voice workflows derive from source-authored workflow request_options, workflow binding and local speech truth, synthesis derives from source-authored voice.request_options and resolved synthesis catalog truth, and transcription derives from source-authored transcription and resolved transcription catalog truth.
    condition: Whenever Runtime produces route metadata.
    failure: Fail closed rather than infer metadata from provider name, input_contract_ref naming, consumer cache, adapter heuristic, or local versus cloud assumptions.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.route-description-plane
  - id: rule.nimi.runtime.rpc-foundations.r051
    kind: rule
    title: Route description fails closed on incomplete truth
    modality: must
    statement: Describe rejects noncanonical capability, absent or non-Runtime resolvedBindingRef, metadataKind mismatch, missing or invalid typed fields, inability to derive the minimum metadata set, unresolved workflow compatibility, and metadata available only through naming or hardcoded allowlists.
    condition: Whenever describe input or derivation is incomplete or inconsistent.
    failure: Return a typed failure without fabricated false defaults or substitution of audio.synthesize metadata for voice workflow metadata.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.route-description-plane
  - id: rule.nimi.runtime.rpc-foundations.r052
    kind: rule
    title: Route description cannot add a daemon RPC
    modality: must_not
    statement: Phase 1 adds DescribeRoute, GetRouteMetadata, or an equivalent top-level daemon RPC, or interprets host, SDK, or private adapter projection asymmetry as a second metadata authority.
    condition: Whenever route description transport is exposed.
    failure: Keep describe a logical operation and one-way typed projection over Runtime truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.route-description-plane
  - id: rule.nimi.runtime.rpc-foundations.r053
    kind: rule
    title: Voice workflow capabilities stay independent
    modality: must
    statement: voice_workflow.voice_clone and voice_workflow.voice_design each retain independent selection, workflow-model resolution, target-synthesis compatibility when required, workflow health, and workflow metadata; no plain audio or shared speech-host success substitutes, and local workflow success is family-scoped to the currently admitted qwen3_tts baseline while voxcpm, omnivoice, and every unadmitted family fail closed.
    condition: Whenever a voice workflow is selected, resolved, health-checked, or described.
    failure: Reject inherited audio.synthesize bindings, metadata, or generic local workflow success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.route-description-plane
  - id: rule.nimi.runtime.rpc-foundations.r054
    kind: rule
    title: Voice assets own the public lifecycle
    modality: must
    statement: GetVoiceAsset, ListVoiceAssets, and DeleteVoiceAsset operate Runtime-managed VoiceAsset truth; provider_voice_ref remains internal, privileged, or debug only, ordinary profile and SDK binding accepts only preset_voice_id or voice_asset_id, runtime_authoritative_delete succeeds on Runtime deletion, best_effort_provider_delete may clean provider state after local deletion, and stronger unadmitted deletion semantics fail closed.
    condition: Whenever a public voice asset is read, listed, bound, or deleted.
    failure: Reject a naked provider handle as public identity or an ambiguous acknowledgement as stronger deletion success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.route-description-plane
  - id: rule.nimi.runtime.rpc-foundations.r055
    kind: rule
    title: Workflow family validation cannot imply transcription
    modality: must
    statement: A workflow-capable speech family’s plain TTS or workflow success never proves audio.transcribe; STT requires its own family binding, health, execution truth, and acceptance sentinel before a complete tts, stt, voice_design, and voice_clone chain is admitted.
    condition: Whenever app-facing workflow or speech acceptance is evaluated.
    failure: Reject whole-chain success when independent STT evidence is absent.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.route-description-plane
  - id: rule.nimi.runtime.rpc-foundations.r056
    kind: rule
    title: Every server stream has one close mode
    modality: must
    statement: Mode A uses done=true for StreamScenario text and speech, mode B emits a terminal event then gRPC OK for SubscribeScenarioJobEvents, SubscribeWorkflowEvents, and SubscribeAgentVoiceStream, mode C emits eof=true then gRPC OK for ExportAuditEvents, and mode D has no terminal frame for SubscribeRuntimeHealthEvents, SubscribeAIProviderHealthEvents, SubscribeAccountSessionEvents, SubscribeMemoryEvents, SubscribeAgentEvents, SubscribeRuntimeAgentAIConfigReadiness, SubscribeAppMessages, WatchAppInstallJobEvents, ReadRealtimeEvents, WatchLocalTransfers, and grpc.health.v1.Health/Watch.
    condition: Whenever Runtime registers or consumes a server-streaming RPC.
    failure: Reject an unclassified stream or a close signal from another mode.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r057
    kind: rule
    title: Generation stream establishment follows validation
    modality: must
    statement: For text and speech StreamScenario, key-source evaluation steps one through nine complete before establishment, step ten begins routed inference, pre-establishment failures use gRPC error, and post-establishment business or upstream failures prefer a done=true terminal event with reason_code.
    condition: Whenever StreamScenario validates and establishes a generation stream.
    failure: Reject early establishment or a failure carrier from the wrong phase.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r058
    kind: rule
    title: Text stream frames are constrained
    modality: must
    statement: A nonterminal text event has nonempty text_delta, a done=true terminal frame carries usage with minus one token values when upstream usage is absent, and the terminal frame may include a final text_delta.
    condition: Whenever text StreamScenario emits an event.
    failure: Reject an empty nonterminal delta or terminal frame without usage.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r059
    kind: rule
    title: Speech stream output truth is explicit
    modality: must
    statement: Speech StreamScenario uses ScenarioStreamDelta.artifact with nonempty audio MIME chunks rather than realtime audio_chunk, completion carries finish_reason without artifact delta, failure carries reason_code, ScenarioStreamStarted declares voice_output_mode native_stream or simulated_stream from the closed voice output modes, native_stream delivers playable delta before full synthesis completion, completion-time slicing is simulated_stream, and stream_simulated remains compatibility metadata rather than primary proof.
    condition: Whenever speech StreamScenario emits started, delta, completed, or failed events.
    failure: Reject an undeclared output mode, empty or non-audio delta, missing failure reason, realtime-field substitution, or simulated output represented as native.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r060
    kind: rule
    title: State streams close after terminal snapshots
    modality: must
    statement: SubscribeScenarioJobEvents and SubscribeWorkflowEvents use no done flag, close gRPC OK after steady-state terminal events, may repeat nonterminal event_type with newest snapshots replacing older snapshots, and may be preempted with CANCELLED during daemon STOPPING without guaranteed terminal delivery.
    condition: Whenever a state-event stream emits or closes.
    failure: Reject assumptions of strictly monotonic event types or fabricated terminal state during shutdown.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r061
    kind: rule
    title: AI chunks use a minimum framing unit
    modality: must
    statement: Streaming AI output buffers until at least 32 bytes are available and flushes every remaining byte at the terminal boundary.
    condition: Whenever Runtime frames AI output chunks.
    failure: Reject subminimum nonterminal framing or loss of terminal remainder.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r062
    kind: rule
    title: First-byte and total timeouts are independent
    modality: must
    statement: Streaming RPCs default first nonempty chunk timeout to 60 seconds and total close timeout to 120 seconds, do not reset total timeout after first byte, and first-byte timeout returns DEADLINE_EXCEEDED with AI_PROVIDER_TIMEOUT.
    condition: Whenever a streaming RPC waits for first output or completion.
    failure: Terminate with the typed timeout rather than reset, merge, or silently extend either budget.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r063
    kind: rule
    title: Close mode classification is normative
    modality: must
    statement: Modes A, B, C, and D retain their exact signal and RPC membership, every new server stream declares one mode, and SDK consumers implement the close semantics of that mode.
    condition: Whenever a stream surface or SDK consumer is added or changed.
    failure: Fail admission for missing, conflicting, or consumer-ignored close classification.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r064
    kind: rule
    title: Audit export stops at eof
    modality: must
    statement: ExportAuditEvents marks the last block eof=true, closes gRPC OK immediately afterward, and clients stop reading after eof.
    condition: Whenever an audit export reaches its last block.
    failure: Reject data after eof or normal close without eof.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r065
    kind: rule
    title: Long subscriptions close only by cancellation conditions
    modality: must
    statement: Mode D has no business terminal signal, closes with CANCELLED when daemon STOPPING or the observed resource becomes unavailable, and leaves client reconstruction policy to SDK or Desktop; daemon STOPPING may also preempt modes A, B, and C with CANCELLED and then emits no fabricated terminal, failure, or eof frame.
    condition: Whenever Runtime closes a long subscription or preempts an active stream during shutdown.
    failure: Reject a success-like terminal frame that masks cancellation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r066
    kind: rule
    title: Streaming layers share explicit backpressure budgets
    modality: must
    statement: Runtime declares per-stream server queue depth and flush granularity, SDK converts slow consumers to deterministic cancel, pause, or failure instead of unbounded memory, and Desktop drops reconstructable intermediates before terminal, error, or audit events.
    condition: Whenever Runtime, SDK, or Desktop buffers stream events.
    failure: End or shed work within budget rather than grow an unbounded queue or block nonreconstructable events.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r067
    kind: rule
    title: Slow consumers receive deterministic failure
    modality: must
    statement: Queue overflow ends the stream with RESOURCE_EXHAUSTED or CANCELLED, prioritizes terminal or failure states over reconstructable deltas, SDK projects a stable close error, and Desktop never reports model completion.
    condition: Whenever a consumer exceeds the stream backpressure budget.
    failure: Reject silent hanging, loss of terminal priority, or false completion.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r068
    kind: rule
    title: Retry follows stream replay safety
    modality: must
    statement: Subscription and safely replayable read streams may reconstruct after backpressure, non-idempotent execution streams never auto-replay, execution retry requires caller decision, and Desktop displays interruption with trace_id.
    condition: Whenever a stream closes from backpressure or transport interruption.
    failure: Reject automatic non-idempotent replay or a UI state that hides interruption.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r069
    kind: rule
    title: Runtime target identity is the durable execution layer
    modality: must
    statement: AIConfig, AIProfile execution, workflow AI nodes, memory embedding, route APIs, and AI execution use Runtime Target v2 instead of raw model_id, target_model_id, localModelId, goRuntimeLocalModelId, targetId or profileId, or connector_id plus model_id; connector identity is credential custody and local identity belongs to asset and profile readiness.
    condition: Whenever durable Runtime execution intent is stored or resolved.
    failure: Reject every retired durable identity shape.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.target-identity-plane
  - id: rule.nimi.runtime.rpc-foundations.r070
    kind: rule
    title: Durable target grammars are discriminated and proof free
    modality: must
    statement: A local durable ref is kind local-runtime, version v2, and exactly one nonempty profile_binding_id or readiness_ref, forbidding targetId, profileId, localAssetId, assetId, filename, path, digest, localModelId, goRuntimeLocalModelId, and model_id; a cloud durable ref is kind cloud, version v2, connector_id, remote_model_catalog_id, provider_model_id, and provider, with connector custody and provider model facts insufficient alone.
    condition: Whenever a durable local or cloud target ref is created or parsed.
    failure: Reject empty, ambiguous, proof-bearing, display-bearing, path-bearing, or retired refs.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.target-identity-plane
  - id: rule.nimi.runtime.rpc-foundations.r071
    kind: rule
    title: Remote model catalog identity binds a snapshot
    modality: must
    statement: ConnectorService mints remote_model_catalog_id from connector id, connector snapshot id, endpoint profile id, inventory snapshot id, provider, provider model id, and capability; provider, endpoint, auth kind, provider auth profile, credential revision, provider catalog version, and model, capability, or availability changes invalidate ids, display-only changes do not, stale ids return AI_REMOTE_MODEL_CATALOG_STALE, and missing ids return AI_REMOTE_MODEL_CATALOG_ID_REQUIRED.
    condition: Whenever Runtime mints or validates a remote model catalog target.
    failure: Reject stale or missing identity without inference or reminting from provider facts.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.reason-code-registry
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.target-identity-plane
  - id: rule.nimi.runtime.rpc-foundations.r072
    kind: rule
    title: Durable intent inventory and resolution are distinct
    modality: must
    statement: Durable refs contain persisted intent, RuntimeTargetInventoryProjection contains capability and target items with target_ref, display, readiness, and compatibility, and resolved execution binding is typed, carries route_metadata_ref, and appears on execute, stream, and describe surfaces; inventory is never persisted as execution truth.
    condition: Whenever Runtime projects or resolves target information.
    failure: Reject shape conflation or persistence of inventory and runtime proof as durable intent.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.route-description-plane
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.target-identity-plane
  - id: rule.nimi.runtime.rpc-foundations.r073
    kind: rule
    title: Every local file import mints a new asset
    modality: must
    statement: Each user file import creates a new installed local_asset_id even when filename, bytes, digest, or asset_id, engine, and kind match; asset_id remains verified catalog or template metadata and display name remains editable nonidentity.
    condition: Whenever Runtime imports a user local asset.
    failure: Reject deduplication that reuses an installed identity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.target-identity-plane
  - id: rule.nimi.runtime.rpc-foundations.r074
    kind: rule
    title: Local connector identity cannot return
    modality: must_not
    statement: LOCAL_MODEL, CONNECTOR_KIND_LOCAL_MODEL, LocalConnectorCategory, Connector.local_category, or retired numeric local connector records project as active connector vocabulary or durable target refs.
    condition: Whenever connector records or vocabulary are read, migrated, or exposed.
    failure: Quarantine retired records and route local identity through Runtime local assets and profiles.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.target-identity-plane
  - id: rule.nimi.runtime.rpc-foundations.r075
    kind: rule
    title: Memory embedding uses Target v2
    modality: must
    statement: Cloud memory embedding persists connector_id, remote_model_catalog_id, provider_model_id, and provider, local memory embedding persists the local discriminant, and provider, model, and profile facts appear only after resolution rather than as durable identity.
    condition: Whenever a memory embedding target is persisted or resolved.
    failure: Return AI_MEMORY_EMBEDDING_TARGET_REF_INVALID for a malformed or retired durable binding.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.reason-code-registry
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.target-identity-plane
  - id: rule.nimi.runtime.rpc-foundations.r076
    kind: rule
    title: Workflow voice and RPC execution use Target v2
    modality: must
    statement: AI workflow nodes, voice workflow nodes, and admitted AI RPC requests consume v2 durable refs or resolved binding inputs, while residual model_id or target_model_id is allowed only for audit, provider execution, catalog, model service, or voice asset compatibility under a guard that prevents durable minting.
    condition: Whenever workflow, voice, or RPC execution handles a target field.
    failure: Reject raw fields used to create or persist durable identity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.target-identity-plane
  - id: rule.nimi.runtime.rpc-foundations.r077
    kind: rule
    title: Component compatibility precedes local execution
    modality: must
    statement: Compatibility is validated before warm, health, generate, StartLocalAsset, lease or acquire, and resident load; unknown compatibility returns AI_LOCAL_COMPONENT_COMPATIBILITY_UNKNOWN and known incompatibility returns AI_LOCAL_COMPONENT_INCOMPATIBLE without collapsing to slot-missing or generic local-model-unavailable.
    condition: Whenever Runtime prepares a local component operation.
    failure: Return the exact compatibility reason before execution.
    relations:
