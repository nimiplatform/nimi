format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.rpc-foundations
units:
  - id: definition.nimi.runtime.rpc-foundations.audit-plane
    kind: definition
    title: Runtime audit plane
    meaning: The Runtime audit plane records owner-relevant security, authorization, execution, lifecycle, resource, and failure facts with correlation and redaction without treating evidence production as product success.
  - id: definition.nimi.runtime.rpc-foundations.error-plane
    kind: definition
    title: Runtime structured error plane
    meaning: The Runtime structured error plane exposes stable typed owner failures and safe metadata while preserving fail-closed disclosure and never converting missing authority or capability into success.
  - id: definition.nimi.runtime.rpc-foundations.pagination-plane
    kind: definition
    title: Runtime pagination plane
    meaning: The Runtime pagination plane provides bounded deterministic listing with opaque owner-issued continuation state and typed validation.
  - id: definition.nimi.runtime.rpc-foundations.route-description-plane
    kind: definition
    lifecycle: removed
    title: Retired Runtime route description plane
    reason: Removed because public model, readiness, health, probe, and fallback route descriptions are not capability execution authority.
  - id: definition.nimi.runtime.rpc-foundations.capability-composition-plane
    kind: definition
    title: Runtime capability composition plane
    meaning: The Runtime capability composition plane deterministically dereferences a committed AIConfig route through the current Machine Local AI Configuration selection or the committed Cloud CapabilityImplementation target plus the internally resolved current-account Connector, checks standardized features, ownership, credentials, App Capability access, policy, and derived admission, and captures exact Job inputs without App-supplied Connector identity, searching, ranking, probing, warming, or choosing a substitute.
    relations:
      - type: supersedes
        target: definition.nimi.runtime.rpc-foundations.route-description-plane
  - id: definition.nimi.runtime.rpc-foundations.streaming-plane
    kind: definition
    title: Runtime streaming plane
    meaning: The Runtime streaming plane owns typed establishment, ordered data, cancellation, terminal state, bounded buffering, and stale-session closure for Runtime streams.
  - id: definition.nimi.runtime.rpc-foundations.target-identity-plane
    kind: definition
    title: Runtime target identity plane
    meaning: The Runtime target identity plane separates durable AIConfig route and Cloud target intent, Runtime-private current-account Connector custody resolution, Machine Local AI Configuration selection, Local Capability Configuration identity and binding, derived admission, and exact immutable Job execution inputs.
  - id: rule.nimi.runtime.rpc-foundations.r001
    kind: rule
    title: Audit follows owner actions
    modality: must
    statement: Security-relevant authentication, authorization, credential, lifecycle, execution, resource, and protected host actions record an owner-attributed result with correlation and time.
    condition: Whenever an auditable Runtime action succeeds or fails.
    failure: Reject unaudited sensitive mutation and do not replace the owner action with evidence-only success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r002
    kind: rule
    title: Audit reveals no authority material
    modality: must_not
    statement: Audit, trace, health, usage, or diagnostic projection contains credentials, bearer material, session proof, protected process proof, raw private content, provider secrets, or enough data to replay authority.
    condition: Whenever Runtime records or exports diagnostic facts.
    failure: Redact or reject the record while preserving a useful owner reason.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r003
    kind: rule
    title: Audit stores are bounded
    modality: must
    statement: Runtime audit and diagnostic storage applies owner-approved retention, access control, and resource bounds and never becomes an unbounded evidence-completeness system.
    condition: Whenever audit or diagnostic records are retained or queried.
    failure: Enforce the bound and preserve the product operation's truthful result.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r004
    kind: rule
    title: Errors preserve owner category
    modality: must
    statement: Runtime returns typed categories for unauthenticated, permission denied, unavailable, validation, conflict, readiness, rate limit, resource exhaustion, cancellation, timeout, and internal failure with stable owner-attributed reasons.
    condition: Whenever a Runtime operation cannot complete successfully.
    failure: Return a typed failure rather than generic or successful output.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
  - id: rule.nimi.runtime.rpc-foundations.r005
    kind: rule
    title: Error metadata is safe and bounded
    modality: must_not
    statement: Runtime error output includes credentials, tokens, protected paths, raw provider payloads, private prompts, account secrets, process proof, internal stack data, or unbounded free-form metadata.
    condition: Whenever Runtime projects an error to SDK, App, host, or user-facing consumer.
    failure: Return the stable safe reason and bounded recovery metadata only.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
  - id: rule.nimi.runtime.rpc-foundations.r006
    kind: rule
    title: Unknown input fails closed
    modality: must
    statement: Unknown operation, enum, version, identity, cursor, projection, capability, or reason input produces a typed validation or unsupported failure and is never reinterpreted as a default success path.
    condition: Whenever Runtime receives an unknown contract value.
    failure: Reject the input before owner mutation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
  - id: rule.nimi.runtime.rpc-foundations.r007
    kind: rule
    title: Pagination is deterministic and bounded
    modality: must
    statement: List operations use a stable owner-defined ordering, bounded page size, explicit filters, and opaque continuation state that cannot be forged into broader access.
    condition: Whenever Runtime exposes a paginated list.
    failure: Reject invalid continuation or filters and never return an unbounded or nondeterministic page.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.pagination-plane
  - id: rule.nimi.runtime.rpc-foundations.r008
    kind: rule
    title: Pagination preserves authorization
    modality: must
    statement: Every page and continuation request re-evaluates the current authenticated session, App authorization, account scope, and operation owner policy rather than inheriting authority from the cursor.
    condition: Whenever a list continues after the first page.
    failure: Reject stale or unauthorized continuation without leaking existence.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.pagination-plane
  - id: rule.nimi.runtime.rpc-foundations.r009
    kind: rule
    title: Capability composition descriptions are bounded
    modality: must
    statement: Runtime may describe the committed AIConfig route intent, the exact selected Local Capability Configuration or Cloud CapabilityImplementation target, supported and required standardized features, and the current derived admission reason without exposing current-account Connector identity, Provider Credentials, raw provider payloads, public readiness, probe, warm, resident, health, ranking, or fallback facts to an ordinary App.
    condition: Whenever an authorized consumer inspects effective capability composition.
    failure: Return the typed derived admission reason when the committed composition cannot execute and never search for another target.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.capability-composition-plane
  - id: rule.nimi.runtime.rpc-foundations.r010
    kind: rule
    title: Consumers respect route and machine-selection owners
    modality: must_not
    statement: SDK, Kit, Desktop, Avatar, or an App guesses a provider, model, Local or Cloud route, Local Capability Configuration selection, fallback, CapabilityContract, standardized feature, Quota, Budget, Rate Limit, or admission from names, cached state, inventory, health, or partial metadata; an authorized owner may instead commit an explicit AIConfig route selection or Machine Local AI Configuration selection through its canonical action.
    condition: Whenever a consumer presents, changes, or executes AI intent.
    failure: Use the canonical owner action or committed composition and report the typed failure without inference.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.capability-composition-plane
  - id: rule.nimi.runtime.rpc-foundations.r011
    kind: rule
    title: Streams establish before data
    modality: must
    statement: A Runtime stream reports successful establishment only after current authentication, authorization, exact target access, standardized-feature and configuration checks, and operation admission succeed.
    condition: Whenever a Runtime stream is opened.
    failure: End with the typed owner failure before emitting successful data.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r012
    kind: rule
    title: Streams preserve ordering and terminal truth
    modality: must
    statement: Runtime owns event ordering, correlation, cancellation, and terminal state, and consumers do not reorder, fabricate, or infer successful completion from connection close or partial data.
    condition: Whenever stream data or terminal state is produced or consumed.
    failure: Preserve the typed terminal failure or unavailable state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r013
    kind: rule
    title: Streams close on stale authority
    modality: must
    statement: Process replacement, protected connection loss, account switch, logout, Runtime restart, owner-authorization loss, target-access loss, or owner cancellation closes affected streams before later data is accepted.
    condition: Whenever a stream's authority dependency changes.
    failure: Close the stream with typed cancellation, unauthenticated, permission, or unavailable state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r014
    kind: rule
    title: Streams apply resource bounds
    modality: must
    statement: Runtime streams bound message size, buffering, subscriber lag, rate, lifetime, and replay according to the owning operation and report resource or slow-consumer failure explicitly.
    condition: Whenever a stream produces or buffers data.
    failure: Apply backpressure or close with a typed resource failure rather than consume unbounded resources.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r015
    kind: rule
    title: Durable route and target intent is secret free
    modality: must
    statement: AIConfig stores Local or Cloud route intent and, for Cloud, only the intended CapabilityImplementation and provider-model target selected through Nimi-owned configuration; Runtime resolution supplies the exact current-account Connector custody reference, while none carries secret material, bearer or session proof, Local Capability Configuration identity, LocalAsset binding, machine selection, process state, public readiness, or a mutable Job binding in ordinary configuration.
    condition: Whenever Runtime stores or transports durable AI route or Cloud target intent.
    failure: Reject secret or Local execution material and keep each fact with its canonical owner.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.target-identity-plane
  - id: rule.nimi.runtime.rpc-foundations.r016
    kind: rule
    title: Job submission captures deterministic composition
    modality: must
    statement: At Job submission Runtime reads the committed AIConfig route and exact current machine selection for Local or committed Cloud CapabilityImplementation target plus the internally resolved current-account Connector for Cloud, checks exact Driver configuration, ownership, credential configuration, App Capability access, policy, bindings, standardized features, authorization, Quota, Budget, and Rate Limit, and captures those effective inputs with the request so later configuration or selection changes cannot rewrite the running Job.
    condition: Whenever Runtime turns committed capability intent into a Job.
    failure: Fail closed with the typed admission reason when any exact required fact is missing or invalid and never probe, re-resolve ambient inventory, switch provider, or fall back.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.target-identity-plane
  - id: rule.nimi.runtime.rpc-foundations.r017
    kind: rule
    title: Contract version mismatch is explicit
    modality: must
    statement: Runtime and SDK reject unsupported contract versions or shapes with a typed compatibility failure and never silently reinterpret them through legacy, partial, or guessed semantics.
    condition: Whenever a request, response, event, or target version is incompatible.
    failure: Return typed unsupported or upgrade-required state before mutation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
  - id: rule.nimi.runtime.rpc-foundations.r018
    kind: rule
    title: Protocol mechanics are not cross-layer product authority
    modality: must_not
    statement: A concrete Runtime method membership list, service grouping, field inventory, framing length, transport name, operating-system primitive, or language-specific generated surface defines Nimi product ontology or owner boundaries.
    condition: Whenever Runtime protocol semantics are promoted into product authority.
    failure: Keep the typed product outcome and owner boundary in authority and leave mechanics to the owning contract and implementation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
  - id: rule.nimi.runtime.rpc-foundations.r019
    kind: rule
    title: Deferred services do not enter readiness
    modality: must
    statement: General Workflow, MCP, and World Evolution have no current Runtime core method family, activation gate, reason family, or readiness prerequisite and remain deferred and non-blocking.
    condition: Whenever Runtime protocol or readiness capabilities are declared.
    failure: Keep the capability unavailable until a separate product authority admits it.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
  - id: rule.nimi.runtime.rpc-foundations.r020
    kind: rule
    title: Fixtures never produce protocol success
    modality: must_not
    statement: A mock response, fixture stream, empty page, silent skip, schema presence, generated type, or checker result is reported as successful Runtime product behavior without the owning operation executing.
    condition: Whenever Runtime protocol acceptance is reported.
    failure: Report only the exercised behavior and classify unrun connectivity as not verified.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
