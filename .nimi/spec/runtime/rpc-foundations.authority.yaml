format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.rpc-foundations
units:
  - id: rule.nimi.runtime.rpc-foundations.home-cloud-connection-observation
    kind: rule
    title: Home cloud history and estimates use captured connection and owner attempt outcomes
    modality: must
    statement: Actual Cloud execution attempts capture their exact admitted safe Connector reference at the existing dispatch boundary. Their owning execution path records succeeded, failed or cancelled with only a safe reason code; missing terminal observation remains unknown, and usage presence, a generic RPC result, parent work or transport close never substitutes for an attempt outcome. Realtime records owner-identified response or generation rounds, never session setup or audio fragments. ListDesktopAICloudHistory and Connector-filtered GetDesktopAIUsageSummary require the protected Desktop account purpose with derived current account, read only the existing bounded device accounting owner for at most seven days, and return only safe identities, model and capability labels, timing, outcome, reason, measured usage and estimates with coverage. History has bounded stable pagination and permits a captured deleted-Connector reference without restoring custody. Missing historical attribution remains explicit, never inferred from current configuration or provider/model; rename or recreate never changes prior attribution, repeated events never double count, and late usage retains the attempt's start interval and terminal outcome. Reads never execute AI, poll providers, change configuration or expose content, endpoints, credentials or private payloads.
    condition: Whenever Cloud attempt facts are captured, queried or presented by Home.
    failure: Reject unauthorized purpose, account selection, invalid bounds or cursors; retain typed unknown and coverage gaps instead of fabricated zero, success, exact billing or cross-connection attribution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.home-ai-observation
  - id: definition.nimi.runtime.rpc-foundations.audit-plane
    kind: definition
    title: Runtime audit plane
    meaning: The Runtime audit plane records owner-relevant security, authorization, execution, lifecycle, resource, and failure facts with correlation and redaction without treating evidence production as product success.
  - id: definition.nimi.runtime.rpc-foundations.error-plane
    kind: definition
    title: Runtime structured error plane
    meaning: The Runtime structured error plane exposes stable typed owner failures and safe metadata while preserving fail-closed disclosure and never converting missing authority or capability into success.
  - id: definition.nimi.runtime.rpc-foundations.pagination-plane
    kind: definition
    title: Runtime pagination plane
    meaning: The Runtime pagination plane provides bounded deterministic listing with opaque owner-issued continuation state and typed validation.
  - id: definition.nimi.runtime.rpc-foundations.route-description-plane
    kind: definition
    lifecycle: removed
    title: Retired Runtime route description plane
    reason: Removed because public model, readiness, health, probe, and fallback route descriptions are not capability execution authority.
  - id: definition.nimi.runtime.rpc-foundations.capability-composition-plane
    kind: definition
    title: Runtime capability composition plane
    meaning: The Runtime capability composition plane checks the committed AIConfig route and standardized features together with the current machine-selected Loadout for Local or the exact committed Connector reference plus Cloud CapabilityImplementation target for Cloud, ownership, credentials, App Capability access, policy, and derived admission, then either at Job submission atomically dereferences and captures the selected Local Loadout identity into a complete persisted ResolvedAssembly or captures the committed Cloud references, or before successful realtime.interact Open atomically captures the same exact Local or Cloud execution inputs into bounded session-generation-scoped ephemeral state; queued, running, and resumed Jobs and active Realtime sessions use only their respective captured effective inputs without request-time overrides, machine-selection or current-owner rereads, searching, ranking, probing, warming, re-selection, or substitution.
    relations:
      - type: supersedes
        target: definition.nimi.runtime.rpc-foundations.route-description-plane
  - id: definition.nimi.runtime.rpc-foundations.streaming-plane
    kind: definition
    title: Runtime streaming plane
    meaning: The Runtime streaming plane is the Neutral Runtime Realtime Core foundation and owns only typed session and channel establishment, Runtime-issued realtime session and channel identity plus closed adapter kind, the opening, ready, degraded, reconnecting, closed, and failed lifecycle, ordered delivery mechanics, sequence and correlation, cancellation, terminal state, bounded transient buffering, backpressure, stale-generation closure, safe health, reconnect hooks, protected local delivery, shutdown cleanup, and independent concurrent channel and track isolation while consuming authenticated account, App, session, admission, and owner context without becoming their canonical owner or interpreting owner data.
  - id: definition.nimi.runtime.rpc-foundations.target-identity-plane
    kind: definition
    title: Runtime target identity plane
    meaning: The Runtime target identity plane separates durable AIConfig route and exact Cloud Connector references, Runtime-private Connector custody content, Machine Loadout store resource content and current per-CapabilityContract Local selection, derived admission, and exact immutable Job effective inputs including the submission-time selected Loadout identity and Local ResolvedAssembly.
  - id: rule.nimi.runtime.rpc-foundations.r001
    kind: rule
    title: Audit follows owner actions
    modality: must
    statement: Security-relevant authentication, authorization, credential, lifecycle, execution, resource, and protected host actions record an owner-attributed result with correlation and time, never more than one success result per action; a sensitive mutation committed in the Runtime persistence store records its result in the same transaction, and a sensitive mutation committed elsewhere records its result with that commit before the owner reports success.
    condition: Whenever an auditable Runtime action succeeds or fails.
    failure: Reject a sensitive mutation whose result cannot be recorded before its effect commits with AUDIT_RECORD_UNAVAILABLE and do not replace the owner action with evidence-only success; when only the record fails after the effect committed, report the committed effect truthfully and surface the unrecorded result as the typed owner diagnostic AUDIT_RESULT_UNRECORDED without changing the committed effect or inviting replay.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r002
    kind: rule
    title: Audit reveals no authority material
    modality: must_not
    statement: Audit, trace, health, usage, or diagnostic projection contains credentials, bearer material, session proof, protected process proof, raw private content, provider secrets, or enough data to replay authority.
    condition: Whenever Runtime records or exports diagnostic facts.
    failure: Redact or reject the record while preserving a useful owner reason.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r003
    kind: rule
    title: Audit stores are bounded
    modality: must
    statement: Runtime audit and diagnostic storage applies owner-approved retention, access control, and resource bounds and never becomes an unbounded evidence-completeness system; the audit plane persists redacted records in the Runtime persistence store under a record-count bound and an encoded-size bound with oldest-first eviction, and identical refusals within a bounded window share one record that counts them.
    condition: Whenever audit or diagnostic records are retained or queried.
    failure: Enforce the bound and preserve the product operation's truthful result.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.audit-plane
  - id: rule.nimi.runtime.rpc-foundations.r004
    kind: rule
    title: Errors preserve owner category
    modality: must
    statement: Runtime returns typed categories for unauthenticated, permission denied, unavailable, validation, conflict, readiness, rate limit, resource exhaustion, cancellation, timeout, and internal failure with stable owner-attributed reasons.
    condition: Whenever a Runtime operation cannot complete successfully.
    failure: Return a typed failure rather than generic or successful output.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
  - id: rule.nimi.runtime.rpc-foundations.r005
    kind: rule
    title: Error metadata is safe and bounded
    modality: must_not
    statement: Runtime error output includes credentials, tokens, protected paths, raw provider payloads, private prompts, account secrets, process proof, internal stack data, or unbounded free-form metadata.
    condition: Whenever Runtime projects an error to SDK, App, host, or user-facing consumer.
    failure: Return the stable safe reason and bounded recovery metadata only.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
  - id: rule.nimi.runtime.rpc-foundations.r006
    kind: rule
    title: Unknown input fails closed
    modality: must
    statement: Unknown operation, enum, version, identity, cursor, projection, capability, or reason input produces a typed validation or unsupported failure and is never reinterpreted as a default success path.
    condition: Whenever Runtime receives an unknown contract value.
    failure: Reject the input before owner mutation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
  - id: rule.nimi.runtime.rpc-foundations.r007
    kind: rule
    title: Pagination is deterministic and bounded
    modality: must
    statement: List operations use a stable owner-defined ordering, bounded page size, explicit filters, and opaque continuation state that cannot be forged into broader access.
    condition: Whenever Runtime exposes a paginated list.
    failure: Reject invalid continuation or filters and never return an unbounded or nondeterministic page.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.pagination-plane
  - id: rule.nimi.runtime.rpc-foundations.r008
    kind: rule
    title: Pagination preserves authorization
    modality: must
    statement: Every page and continuation request re-evaluates the current authenticated session, App authorization, account scope, and operation owner policy rather than inheriting authority from the cursor.
    condition: Whenever a list continues after the first page.
    failure: Reject stale or unauthorized continuation without leaking existence.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.pagination-plane
  - id: rule.nimi.runtime.rpc-foundations.r009
    kind: rule
    title: Capability composition descriptions are bounded
    modality: must
    statement: Runtime may describe the committed AIConfig route intent, current machine-selected Loadout facts for Local or its safe exact Connector reference and Cloud CapabilityImplementation target for Cloud, supported and required standardized features, and the current derived admission reason without exposing Provider Credentials, Connector custody content, endpoints, raw provider payloads, public readiness, probe, warm, resident, health, ranking, or fallback facts to an ordinary App.
    condition: Whenever an authorized consumer inspects effective capability composition.
    failure: Return the typed derived admission reason when the committed composition cannot execute and never search for another target.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.capability-composition-plane
  - id: rule.nimi.runtime.rpc-foundations.r010
    kind: rule
    title: Consumers respect AIConfig route and resource owners
    modality: must_not
    statement: SDK, Kit, Desktop, Avatar, or an App guesses a provider, model, Local or Cloud route, Loadout or Connector reference, fallback, CapabilityContract, standardized feature, Quota, Budget, Rate Limit, or admission from names, cached state, unselected inventory, health, or partial metadata; an authorized AIConfig owner may instead commit an explicit route and exact Cloud resource references, while Select Loadout alone sets or clears the current machine selection without a seventh Clear action, copying it into AIConfig, or rewriting captured Job or Realtime-session truth.
    condition: Whenever a consumer presents, changes, or executes AI intent.
    failure: Use the canonical owner action or captured composition and report the typed failure without inference, deletion-required deselection, or current-state reconstruction.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.capability-composition-plane
  - id: rule.nimi.runtime.rpc-foundations.r011
    kind: rule
    title: Streams establish before data
    modality: must
    statement: A Runtime stream reports successful establishment only after canonical protected ingress has produced a fresh exact operation admission when the caller is an App and the typed owner service has separately completed its current capability, route, target, resource, authorization, configuration, and business checks; the Neutral Runtime Realtime Core binds those results and their account, App, session, protected-connection, and generation context without owning, reclassifying, or bypassing either decision.
    condition: Whenever a Runtime stream is opened.
    failure: End with the typed owner failure before emitting successful data.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: definition.nimi.runtime.rpc-foundations.home-ai-observation
    kind: definition
    title: Account-scoped Home AI observation
    meaning: Runtime owns a bounded read-only projection of actual AI execution and durable device AI attempt accounting for the current authenticated Home account, separate from generic RPC diagnostics, App business workflow, provider billing and private ExecutionHost residency. It carries safe actual source, parent, capability, model, provider, route, timing, observation, usage and coverage facts without private content or executable authority.
  - id: rule.nimi.runtime.rpc-foundations.home-ai-observation-access
    kind: rule
    title: Home AI reads require the protected account purpose
    modality: must
    statement: GetDesktopAIActivitySnapshot, SubscribeDesktopAIActivity and GetDesktopAIUsageSummary belong only to the protected Desktop account product purpose. Runtime derives the current account from its protected principal and rechecks that purpose in the owner handler, accepts no caller account selector, and rejects ordinary public, anonymous, machine-only or App-purpose access. The SDK and transport preserve this exact boundary and no read initiates AI, Provider polling, Job recovery or business mutation.
    condition: Whenever Home AI observation is requested.
    failure: Return the owning unauthenticated, forbidden or unavailable result without an alternate transport, empty success or cross-account disclosure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.home-ai-observation
  - id: rule.nimi.runtime.rpc-foundations.home-ai-execution
    kind: rule
    title: Current execution comes from actual owners
    modality: must
    statement: Actual execution owners publish safe attempt identity, accepted parent identity when available, captured source and account, capability, actual adopted model and provider, local or cloud or unknown route, start and observation time and truthful execution state. A parent work groups its child attempts once; unknown parent association is shown as unassociated execution and never supports an exact combined work total. Simulated Agent life frames do not count as actual work, but real life planning and other admitted background inference count as actual AI. Configured, installed and resident models or completed activity messages never stand in for current execution. Snapshot generation and revision fence stale data; subscriptions emit an initial complete replacement snapshot and coalesce slow delivery to the latest snapshot.
    condition: Whenever current AI execution is retained, counted or projected.
    failure: Preserve missing association, source coverage, truncation and observation uncertainty without fabricating a current model, work total, provider state or resumed execution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.home-ai-observation
  - id: rule.nimi.runtime.rpc-foundations.home-ai-accounting
    kind: rule
    title: AI attempts are accounted at execution owner boundaries
    modality: must
    statement: Runtime records an actual local-engine or remote-AI execution attempt at its owner admission and dispatch boundary, captures its authenticated account and immutable start attribution, and counts real retries independently while excluding rejected admission, health and audit reads, generic RPCs, Job observation and artifact reads. Agent background inference is included; Realtime counts owner-identified model response or generation rounds rather than session setup or audio fragments. Owner cumulative usage carries a monotonic revision; each accepted revision updates the existing attempt and aggregate by its delta in one persistence transaction, ignoring equal or old revisions and never regressing terminal state or holding a database transaction across AI I/O. Late usage remains attributed to the original start interval and never creates a second attempt.
    condition: Whenever actual AI execution or a usage revision is recorded.
    failure: Preserve the AI owner's real outcome, report accounting uncertainty when recording fails, and never replay AI, infer zero cost or relabel generic RPC Usage as product AI accounting.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.home-ai-observation
  - id: rule.nimi.runtime.rpc-foundations.home-ai-retention
    kind: rule
    title: AI observation and accounting remain bounded
    modality: must
    statement: Runtime retains ordinary minute aggregates for seven days and accepts usage revisions until seven days after the owning attempt terminal; linked aggregates and deduplication share the latest relevant revision deadline, while nonterminal attempts retain their original owner lifecycle. Aggregate and attempt rows each have a 100000-row bound and together a 64 MiB encoded-payload bound, an attempt projection has a 4 KiB bound, active memory has a 1024-attempt bound, generation and coverage-gap history each have a 1024-entry bound, activity snapshots default to fifty and admit at most one hundred entries, usage groups admit at most two hundred without truncating totals, and subscription buffering holds one replacement snapshot. Retention precedes capacity eviction and protects current-day necessary data where possible; forced eviction atomically advances a conservative source acceptance boundary against immutable attempt start or creation order and marks coverage partial, never permitting an old revision to recreate an evicted attempt. These bounds describe retained payload rather than the whole database file and indexes.
    condition: Whenever Home AI observation or accounting retains, revises, evicts or returns data.
    failure: Bound resource use, preserve explicit incomplete coverage and reject expired revisions without silently clearing real history, blocking independent AI success or creating an unbounded event or proof store.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.home-ai-observation
  - id: rule.nimi.runtime.rpc-foundations.home-ai-coverage
    kind: rule
    title: Usage completeness survives missing writers and failed persistence
    modality: must
    statement: Source coverage and past-time coverage are independent facts for protected Home and App AI, admitted direct Runtime AI, LocalAgent foreground, actual Agent background inference and supported Realtime work. Missing writers or observers cannot establish global complete zero. Runtime uses its own persistence generation and clean-end facts to retain accounting uncertainty. Current healthy generation completeness is evaluated at an owner-consistent durable read point with prior accepted writes flushed, while an ended or recovered generation lacking clean completion and unknown gaps between proven intervals remain partial. Failure to persist the generation or coverage makes accounting unavailable or partial; only a successfully flushed end with no write gap is clean, and a later restart or heartbeat cannot erase the gap. Newly enabled accounting never reconstructs unrecorded history; pending quantities and pricing completeness remain separate from attempt-count coverage.
    condition: Whenever Home AI coverage is recorded, recovered or presented.
    failure: Return bounded coverage reasons and the proven observation interval without pretending an unwritable or absent record is complete, filling unknown history or replaying execution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.home-ai-observation
  - id: rule.nimi.runtime.rpc-foundations.home-ai-usage-summary
    kind: rule
    title: Device AI usage uses a consistent half-open interval
    modality: must
    statement: Home AI usage reads accept a valid half-open UTC interval no longer than seven days, derive account scope from the protected principal, and return totals and bounded groups from one consistent owner read rather than client pagination sums. Time coverage is evaluated only through the earlier of the requested end and read time. The user local calendar determines day boundaries, including offset and daylight changes; late completion updates the immutable start interval. Safe captured route, provider, model, capability, unit and currency determine estimates; missing price, actual billing quantity or usage is unpriced or pending rather than zero, token-to-character or inference-time-to-media-duration guesses are forbidden, and currencies remain separate. Every amount is identified as an estimate rather than a provider bill.
    condition: Whenever Home queries or displays current-account device AI usage.
    failure: Reject invalid ranges and preserve source, time, quantity, route and pricing uncertainty without cross-account aggregation, boundary double counting or fabricated charges.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.home-ai-observation
  - id: rule.nimi.runtime.rpc-foundations.r012
    kind: rule
    title: Streams preserve ordering and terminal truth
    modality: must
    statement: Runtime owns event ordering, correlation, cancellation, and terminal state, and consumers do not reorder, fabricate, or infer successful completion from connection close or partial data.
    condition: Whenever stream data or terminal state is produced or consumed.
    failure: Preserve the typed terminal failure or unavailable state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r013
    kind: rule
    title: Streams close on stale authority
    modality: must
    statement: Process replacement, protected connection loss, account switch, logout, Runtime restart, owner-authorization loss, target-access loss, or owner cancellation closes affected streams before later data is accepted.
    condition: Whenever a stream's authority dependency changes.
    failure: Close the stream with typed cancellation, unauthenticated, permission, or unavailable state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r014
    kind: rule
    title: Streams apply resource bounds
    modality: must
    statement: Runtime streams bound message and frame size, per-channel and per-track buffering, subscriber lag, rate, retry, lifetime, and owner-defined replay exposure, isolate each independent session, channel, subscriber, and track from unrelated work, apply explicit backpressure, and report resource or slow-consumer failure; the Neutral Runtime Realtime Core creates no durable spool, generic replay, generic checkpoint, or global queue.
    condition: Whenever a stream produces or buffers data.
    failure: Apply backpressure or close with a typed resource failure rather than consume unbounded resources.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r015
    kind: rule
    title: Durable route and Cloud resource intent is secret free
    modality: must
    statement: AIConfig stores a route-only Local marker or a Cloud route with one safe current-account Connector reference plus the intended Cloud CapabilityImplementation and provider-model target; it carries no secret material, bearer or session proof, Local Loadout or ModelAsset identity, machine selection, Loadout content, ModelAsset binding, Connector custody content, endpoint, account selector, process state, public readiness, or mutable Job binding.
    condition: Whenever Runtime stores or transports durable AI route or Cloud target intent.
    failure: Reject a Local resource reference, a Cloud route without its required exact references, secret or embedded resource material, and keep each resource fact with its canonical owner.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.target-identity-plane
  - id: rule.nimi.runtime.rpc-foundations.r016
    kind: rule
    title: Job submission captures deterministic composition
    modality: must
    statement: At Job submission Runtime reads the committed AIConfig route and, for Local, the current machine-selected Loadout for the same CapabilityContract, validates the selected Loadout's CapabilityImplementation, versioned Driver dialect and recipeId, typed options, every model_asset_id and expected_content_id, RecipeCustody, content bytes, ownership, standardized features, authorization, Quota, Budget, Rate Limit, request, load plan, and process identity, and atomically persists its exact identity and the complete ResolvedAssembly before publication; for Cloud it validates and captures the exact committed Connector reference, CapabilityImplementation target, credential, access, policy, defaults, and request. Queued, running, and resumed Jobs use only those persisted effective inputs and never reread current AIConfig, Loadout, catalog, inventory, machine selection, process state, or private CAS.
    condition: Whenever Runtime turns committed capability intent into a Job.
    failure: Fail closed with the typed admission reason when any exact required fact is missing, invalid, or only partially persisted and never probe, reread, re-resolve ambient inventory, switch provider, or fall back.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.target-identity-plane
  - id: rule.nimi.runtime.rpc-foundations.r017
    kind: rule
    title: Contract version mismatch is explicit
    modality: must
    statement: Runtime and SDK reject unsupported contract versions or shapes with a typed compatibility failure and never silently reinterpret them through legacy, partial, or guessed semantics.
    condition: Whenever a request, response, event, or target version is incompatible.
    failure: Return typed unsupported or upgrade-required state before mutation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
  - id: rule.nimi.runtime.rpc-foundations.r018
    kind: rule
    title: Protocol mechanics are not cross-layer product authority
    modality: must_not
    statement: A concrete Runtime method membership list, service grouping, field inventory, framing length, transport name, operating-system primitive, or language-specific generated surface defines Nimi product ontology or owner boundaries.
    condition: Whenever Runtime protocol semantics are promoted into product authority.
    failure: Keep the typed product outcome and owner boundary in authority and leave mechanics to the owning contract and implementation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
  - id: rule.nimi.runtime.rpc-foundations.r019
    kind: rule
    title: Deferred services and integration adapters do not enter core readiness
    modality: must
    statement: General Workflow and World Evolution have no current Runtime core method family, activation gate, reason family or readiness prerequisite and remain deferred. MCP may implement a selected Integration adapter under the Integration owner after exact public-carrier admission and real implementation; it introduces no raw MCP core method family or ordinary Runtime readiness dependency.
    condition: Whenever Runtime protocol or readiness capabilities are declared.
    failure: Keep an unadmitted or unimplemented service or adapter unavailable without blocking ordinary Runtime readiness or inferring protocol support.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
  - id: rule.nimi.runtime.rpc-foundations.r020
    kind: rule
    title: Fixtures never produce protocol success
    modality: must_not
    statement: A mock response, fixture stream, empty page, silent skip, schema presence, generated type, or checker result is reported as successful Runtime product behavior without the owning operation executing.
    condition: Whenever Runtime protocol acceptance is reported.
    failure: Report only the exercised behavior and classify unrun connectivity as not verified.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.error-plane
  - id: rule.nimi.runtime.rpc-foundations.r021
    kind: rule
    title: Realtime Core carries typed owner data without owning semantics
    modality: must_not
    statement: The Neutral Runtime Realtime Core defines or interprets Realm event vocabulary, Realm cursor or recovery truth, LocalAgent identity, Conversation, turn, action, tool, Memory, transcript, AI response policy, App role or game state, participant membership, respondent selection, business barge-in outcome, or persistence policy, or exposes an openRealtime kind-string operation, any or unknown event payload, generic event bus, or owner-independent data union; each owner adapter supplies its own closed typed data protocol while shared Core metadata remains limited to lifecycle, status, terminal reason, safe health, backpressure, cancellation, and close.
    condition: Whenever a realtime owner protocol is attached to or projected through the Core.
    failure: Reject the untyped or ownership-transferring contract and require the exact typed owner adapter without a compatibility envelope.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r022
    kind: rule
    title: Realtime Core state is bounded and non-durable
    modality: must_not
    statement: The Neutral Runtime Realtime Core durably persists Realm event payloads, Chat messages, Agent turns, Conversations, transcripts, microphone or output audio, App group state, tool results, or generic owner checkpoints, interprets, indexes, or content-logs owner messages or frames, or retains owner content after delivery, cancellation, close, failure, or terminal cleanup; during one current generation it may carry only bounded opaque typed owner messages, frames, or bytes in memory for the exact channel or track delivery and backpressure path, and after terminal cleanup residual state is limited to bounded generation, lifecycle, queue occupancy, safe sequence or correlation, retry state, resource handles, and terminal reason while any adapter cursor or owner persistence remains governed by that adapter or product authority.
    condition: Whenever realtime data is buffered, recovered, closed, failed, or cleaned up.
    failure: Reject durable Core storage or residual content and release the affected channel resources with a typed terminal result.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r023
    kind: rule
    title: Realtime recovery semantics stay with each owner adapter
    modality: must
    statement: The Neutral Runtime Realtime Core offers only a bounded reconnect hook and generation-fenced lifecycle transition; Realm defines cursor, replay, gap, and snapshot recovery, LocalAgent Conversation streams recover from the Agent-owned committed snapshot without durable event replay, and AI Realtime sessions are session-ephemeral and close on Runtime or Driver loss unless a later exact authority admits another behavior.
    condition: Whenever a realtime connection, session, channel, or subscription is interrupted or reopened.
    failure: Apply the exact owner recovery contract or close with the typed terminal reason without inventing replay, restoring stale authority, or silently polling.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
  - id: rule.nimi.runtime.rpc-foundations.r024
    kind: rule
    title: Realtime diagnostics and cleanup are safe
    modality: must
    statement: Realtime health and diagnostics expose only Runtime-issued safe correlation, lifecycle, bounded resource pressure, reconnect state, and redacted typed failure, and cancellation, protected-connection loss, stale generation, Runtime shutdown, or restart generation-fences late data, closes affected channels, and releases every remote connection, local stream, audio device, Driver session, queue, and track owned by that execution without blocking unrelated channels.
    condition: Whenever realtime state is observed or a resource-owning session terminates.
    failure: Redact sensitive content, reject late-generation data, and complete bounded cleanup before reporting the terminal state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.streaming-plane
