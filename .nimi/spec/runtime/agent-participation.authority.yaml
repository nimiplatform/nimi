format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.agent-participation
units:
  - id: definition.nimi.runtime.agent-participation.conversation-anchor-plane
    kind: definition
    title: Runtime LocalAgent conversation continuity plane
    meaning: Runtime owns cross-surface LocalAgent Conversation continuity through committed conversation anchors and snapshots; anchors distinguish independent conversations for one LocalAgent and never make an App, Desktop, Avatar, or projection cache the continuity owner.
  - id: definition.nimi.runtime.agent-participation.hook-intent-plane
    kind: definition
    title: Optional Runtime continuation boundary
    meaning: Deferred or proactive continuation is an optional Runtime-owned LocalAgent capability, not a general Workflow authority and not a prerequisite for ordinary LocalAgent Conversation, Memory, Knowledge, voice, or readiness.
  - id: definition.nimi.runtime.agent-participation.output-wire-plane
    kind: definition
    title: Runtime-private model output interpretation plane
    meaning: Runtime owns interpretation and validation of model output before it becomes committed Conversation, LocalAgent state, voice, or typed projection truth; model-native or parser-native payloads are never public App truth.
  - id: definition.nimi.runtime.agent-participation.presentation-profile-plane
    kind: definition
    title: Runtime LocalAgent presentation configuration plane
    meaning: Runtime owns durable LocalAgent presentation selections including the current official asset and default voice references plus validation-before-replace, revisioned atomic commit, persistence, and explicit restore-previous semantics needed by authorized projections, while Avatar owns visual rendering and backend-local state and no presentation profile becomes a LocalAgent or Avatar owner.
  - id: definition.nimi.runtime.agent-participation.presentation-stream-plane
    kind: definition
    title: Runtime LocalAgent presentation stream plane
    meaning: Runtime owns transient LocalAgent turn, state, activity, emotion, voice, interruption, and presentation projection truth; consumers own only their UI, playback, rendering, and ephemeral cache.
  - id: definition.nimi.runtime.agent-participation.avatar-debug-projection-plane
    kind: definition
    title: Optional Runtime Avatar diagnostics projection plane
    meaning: Runtime may project bounded, authorized Avatar diagnostic status without transferring LocalAgent, Avatar backend, package, credential, or provider truth, and the diagnostics path never blocks ordinary product readiness.
  - id: definition.nimi.runtime.agent-participation.participation-plane
    kind: definition
    title: Deferred advanced participation boundary
    meaning: Multi-participant rooms, Realm group participation, scenario or World participation, external-agent entry, MCP-backed participation, and their orchestration or promotion models are outside the current Runtime core and remain isolated future capability boundaries.
  - id: definition.nimi.runtime.agent-participation.ai-config-plane
    kind: definition
    title: Runtime LocalAgent AI configuration plane
    meaning: Runtime owns LocalAgent AI route intents, dedicated typed model-settings projection, readiness, Token, Quota, Budget, metering, and resource admission used by LocalAgent execution; Apps may observe bounded status but never fabricate NimiAIConfig or own or bypass those decisions.
  - id: definition.nimi.runtime.agent-participation.autonomy-configuration-plane
    kind: definition
    title: Runtime LocalAgent autonomy configuration plane
    meaning: Runtime owns LocalAgent autonomy configuration as one independently revisioned state with atomic compare-and-swap mutation semantics.
  - id: definition.nimi.runtime.agent-participation.app-consume-plane
    kind: definition
    title: Runtime LocalAgent App consume plane
    meaning: Authorized Apps consume explicit LocalAgent operations and projections through the standard Runtime SDK seam using session-derived identity and authorization without receiving Runtime proof, Realm JWT, Provider Credentials, or a product binding entity.
  - id: definition.nimi.runtime.agent-participation.companion-wake-voice-plane
    kind: definition
    title: Runtime LocalAgent wake and voice plane
    meaning: Runtime owns admitted microphone, wake, transcription, accepted turn, response selection, voice generation, playback and interruption truth, while Avatar owns only visible rendering, local playback, and backend-local lipsync from Runtime-projected artifacts.
  - id: definition.nimi.runtime.agent-participation.avatar-event-provenance-plane
    kind: definition
    title: Runtime LocalAgent event provenance plane
    meaning: Runtime owns the provenance of LocalAgent events consumed by Avatar and other projections, and no consumer, fixture, backend, provider, Desktop surface, or App may synthesize Runtime success or LocalAgent truth.
  - id: definition.nimi.runtime.agent-participation.embodiment-input-plane
    kind: definition
    title: Runtime LocalAgent embodiment input plane
    meaning: Runtime supplies typed LocalAgent state and presentation input to Avatar while Avatar owns shell-local interaction and renderer execution; neither side writes its local state back as the other's truth.
  - id: definition.nimi.runtime.agent-participation.source-context-projection-plane
    kind: definition
    title: Runtime LocalAgent source and turn context projection plane
    meaning: Runtime owns bounded read-only LocalAgent source readiness and turn-context status projections that expose safe status and correlation facts without exposing reconstructable source, prompt, Conversation, Memory, Knowledge, proof, provider, or tool material.
  - id: rule.nimi.runtime.agent-participation.r001
    kind: rule
    title: LocalAgent Conversation continuity is Runtime-owned
    modality: must
    statement: Runtime Agent Service owns every LocalAgent Conversation anchor, committed turn, snapshot, recovery, attachment, and interruption decision, and multiple conversations or LocalAgents never collapse into an implicit global session.
    condition: Whenever a LocalAgent conversation is opened, continued, recovered, or projected across surfaces.
    failure: Reject App-owned continuity, local transcript recovery, or implicit global attachment.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.conversation-anchor-plane
  - id: rule.nimi.runtime.agent-participation.r004
    kind: rule
    title: No platform default LocalAgent
    modality: must_not
    statement: Runtime, Desktop, Avatar, Home, or an App infers a platform-level current or default LocalAgent, or treats LocalAgent identity alone as conversation continuity.
    condition: Whenever a surface selects a LocalAgent or attaches to a Conversation.
    failure: Require an explicit authorized localAgentId and an explicit Runtime conversation selection or creation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.conversation-anchor-plane
  - id: rule.nimi.runtime.agent-participation.r005
    kind: rule
    title: Conversation open and recovery are explicit
    modality: must
    statement: A caller supplies an explicit authorized localAgentId and explicit conversation intent, while Runtime creates or resolves committed continuity and returns only typed snapshots and projections.
    condition: Whenever a LocalAgent Conversation is opened or recovered.
    failure: Reject shadow anchors, App-local history as recovery truth, and an unauthorized LocalAgent target.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.conversation-anchor-plane
  - id: rule.nimi.runtime.agent-participation.r007
    kind: rule
    title: Avatar continuity remains a LocalAgent projection
    modality: must
    statement: Avatar may attach a visible instance to an explicitly authorized Runtime LocalAgent Conversation for recovery and presentation, but Avatar instance identity, launch state, renderer state, and same-LocalAgent selection never create or prove Runtime continuity.
    condition: Whenever Avatar renders or recovers a LocalAgent conversation.
    failure: Fail closed on missing or mismatched Runtime identity and continuity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.conversation-anchor-plane
  - id: rule.nimi.runtime.agent-participation.r008
    kind: rule
    title: Deferred continuation is optional and non-blocking
    modality: must
    statement: Any deferred or proactive continuation remains Runtime-owned, explicit, interruptible, default-off, and separate from general Workflow, and its absence never blocks ordinary LocalAgent operation.
    condition: Whenever deferred continuation is configured, proposed, or unavailable.
    failure: Reject App-owned scheduling, hidden timers, mock execution, and readiness dependency on the optional path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.hook-intent-plane
  - id: rule.nimi.runtime.agent-participation.r012
    kind: rule
    title: Model output becomes product truth only through Runtime
    modality: must
    statement: Runtime validates and interprets model output before committing LocalAgent Conversation, state, activity, voice, or projection truth, and Apps never consume raw parser or provider payloads as durable product state.
    condition: Whenever model output is produced or projected.
    failure: Reject malformed output, raw payload consumption, and consumer-authored success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.output-wire-plane
  - id: rule.nimi.runtime.agent-participation.r020
    kind: rule
    title: Persistent presentation inputs are Runtime-owned
    modality: must
    statement: Runtime owns durable LocalAgent presentation selections and the default voice reference needed for authorized projections, while voice generation and artifacts remain Runtime-owned execution outputs and current emotion, activity, renderer motion, camera, physics, lipsync, and window state remain transient Runtime projection or Avatar-local rendering facts according to their owners.
    condition: Whenever durable LocalAgent presentation configuration or default voice is read or changed.
    failure: Reject App-local durable truth, an AI-config-owned default voice, renderer state promoted into Runtime truth, or presentation ownership transferred to Avatar.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.presentation-profile-plane
  - id: rule.nimi.runtime.agent-participation.r028
    kind: rule
    title: Presentation consumers remain projection-only
    modality: must
    statement: Nimi Home, Desktop, Avatar, Zhiyu, SDK consumers, and Third-party Apps consume presentation configuration only as authorized Runtime LocalAgent projection and never use it to execute a LocalAgent or write Conversation, Memory, Knowledge, state, or voice truth.
    condition: Whenever a consumer reads or adapts LocalAgent presentation configuration.
    failure: Reject consumer-owned LocalAgent truth or full-blob writeback from UI state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.presentation-profile-plane
  - id: rule.nimi.runtime.agent-participation.r031
    kind: rule
    title: Transient LocalAgent projection truth is Runtime-owned
    modality: must
    statement: Runtime owns committed LocalAgent turn, state, activity, emotion, voice, interruption, and presentation timing truth, while Avatar and other Apps own only rendering, playback, interaction, and ephemeral UI state.
    condition: Whenever LocalAgent output or state is projected.
    failure: Reject a consumer-authored semantic event, direct renderer control as Runtime truth, or a fabricated successful projection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.presentation-stream-plane
  - id: rule.nimi.runtime.agent-participation.r035
    kind: rule
    title: Projection access is session-derived
    modality: must
    statement: Runtime admits a consumer projection using the current account, current App identity, current authorization, explicit localAgentId, and requested operation from the active session; an App-declared scope, proof, selector object, or reusable relationship reference never grants access.
    condition: Whenever a consumer subscribes to or reads LocalAgent projections.
    failure: Reject missing or caller-controlled authorization and return no projection data.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.presentation-stream-plane
  - id: rule.nimi.runtime.agent-participation.r039
    kind: rule
    title: Projection namespaces preserve their owner boundary
    modality: must
    statement: Runtime Agent Service method and event namespaces identify Runtime-owned service and projection surfaces only; they are not a public event bus, consumer execution surface, or authority for Apps to emit Runtime truth.
    condition: Whenever a Runtime Agent Service namespace is emitted, consumed, or documented.
    failure: Reject broad wildcard ownership, consumer execution, or App-authored Runtime events.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.presentation-stream-plane
  - id: rule.nimi.runtime.agent-participation.r041
    kind: rule
    title: LocalAgent voice output is Runtime policy
    modality: must
    statement: Runtime decides whether an authorized LocalAgent target receives text-only or playable voice output using the current route, policy, Budget, and readiness, while consumers own only permitted playback controls and rendering.
    condition: Whenever LocalAgent voice output is selected or projected.
    failure: Keep output text-only or unavailable rather than calling a provider from an App or fabricating playable audio.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.presentation-stream-plane
  - id: rule.nimi.runtime.agent-participation.r044
    kind: rule
    title: Avatar diagnostics are optional owner projections
    modality: must
    statement: Runtime may project authorized Avatar probe status and Avatar may return bounded backend evidence, but diagnostics never transfer LocalAgent, provider, package, backend, or presentation authority and never block ordinary LocalAgent or Avatar readiness.
    condition: Whenever an Avatar diagnostic probe is requested or displayed.
    failure: Reject raw backend payloads, credentials, fabricated pass status, and readiness dependence on diagnostics.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.avatar-debug-projection-plane
  - id: rule.nimi.runtime.agent-participation.r049
    kind: rule
    title: Advanced participation remains deferred and non-core
    modality: must
    statement: Multi-participant rooms, Realm group participation, scenario or World participation, external-agent entry, MCP-backed participation, and their profile, axis, matrix, orchestration, promotion, queue, or commit models do not define Runtime core architecture and do not block Local AI, LocalAgent, Conversation, Memory, Knowledge, voice, or ordinary readiness.
    condition: Whenever an advanced participation capability is proposed, referenced, or unavailable.
    failure: Keep the capability isolated and unavailable rather than creating a core dependency or inferring an active product contract.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.participation-plane
  - id: rule.nimi.runtime.agent-participation.r082
    kind: rule
    title: LocalAgent AI configuration is Runtime-owned
    modality: must
    statement: Runtime owns the admitted AI route, readiness, Token, Quota, Budget, metering, and resource admission for each LocalAgent and never accepts App-owned provider credentials, hidden provider calls, or caller-declared route truth.
    condition: Whenever LocalAgent AI configuration is selected or consumed.
    failure: Reject unavailable or unauthorized routes and expose a bounded typed status.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.ai-config-plane
  - id: rule.nimi.runtime.agent-participation.r087
    kind: rule
    title: AI readiness is a bounded projection
    modality: must
    statement: Consumers may observe typed ready, blocked, unavailable, or failed LocalAgent AI status without receiving Provider Credentials, route internals, proof material, or authority to select an unadmitted provider or model.
    condition: Whenever LocalAgent AI readiness is displayed.
    failure: Reject sensitive or authoritative route material and never report ready without Runtime evidence.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.ai-config-plane
  - id: rule.nimi.runtime.agent-participation.r088
    kind: rule
    title: LocalAgent turn admission uses Runtime AI policy
    modality: must
    statement: Runtime admits a LocalAgent turn only after resolving the current authorized LocalAgent, AI route, readiness, Quota, and Budget from Runtime truth.
    condition: Whenever a LocalAgent turn is admitted.
    failure: Return a typed blocked or unavailable outcome without fallback provider execution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.ai-config-plane
  - id: rule.nimi.runtime.agent-participation.r093
    kind: rule
    title: Apps use the standard LocalAgent consume seam
    modality: must
    statement: Apps submit typed user intent and consume bounded LocalAgent Conversation, state, voice, and presentation projections only through the standard SDK and Runtime operations, never through raw local IPC, provider APIs, parser events, or App-local orchestration.
    condition: Whenever an App interacts with a LocalAgent.
    failure: Reject a bypass and keep the operation unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.app-consume-plane
  - id: rule.nimi.runtime.agent-participation.r095
    kind: rule
    title: Scaffolded App LocalAgent access is transparent and bounded
    modality: must
    statement: A Desktop-hosted scaffolded App supplies an explicit localAgentId and typed operation while Runtime derives account, App identity, authorization, and ownership or access from the active session; the App receives no Realm JWT, Provider Credential, Runtime proof, or account-wide LocalAgent inventory.
    condition: Whenever a scaffolded Third-party Local App invokes or subscribes to a LocalAgent capability.
    failure: Reject caller-controlled authorization, missing access, or broader inventory disclosure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.app-consume-plane
  - id: rule.nimi.runtime.agent-participation.r150
    kind: rule
    title: LocalAgent transcription and voice truth is Runtime-owned
    modality: must
    statement: Runtime owns admitted microphone processing, local STT, accepted text intent, LocalAgent response selection, local TTS route, voice artifact, playback state, and interruption truth, while optional wake behavior remains separately admitted and non-blocking.
    condition: Whenever LocalAgent voice input or output is available or requested.
    failure: Fail closed as unavailable without App-local capture truth, direct provider calls, hidden listening, or simulated success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.companion-wake-voice-plane
  - id: rule.nimi.runtime.agent-participation.r152
    kind: rule
    title: Avatar consumes Runtime voice projection only
    modality: must
    statement: Avatar plays and renders only authorized Runtime-projected LocalAgent voice artifacts and timing for the active LocalAgent Conversation, never calls speech synthesis directly, owns durable voice truth, or exposes raw motion or driver control to an App.
    condition: Whenever Avatar renders LocalAgent speech or lipsync.
    failure: Keep presentation silent or unavailable rather than synthesize or fabricate voice state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.companion-wake-voice-plane
  - id: rule.nimi.runtime.agent-participation.r153
    kind: rule
    title: Audio privacy and lipsync ownership remain visible
    modality: must
    statement: Active capture and playback state is visibly projected, Runtime owns audio and timing truth, and Avatar may derive backend-local lipsync only from authorized playable audio without writing renderer parameters back as Runtime state.
    condition: Whenever microphone, playback, or lipsync state is rendered.
    failure: Reject hidden capture, fake speaking, fake lipsync, and ownership inversion.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.companion-wake-voice-plane
  - id: rule.nimi.runtime.agent-participation.r158
    kind: rule
    title: Runtime LocalAgent event provenance cannot be synthesized
    modality: must
    statement: Runtime is the only producer of LocalAgent turn, state, presentation, voice, continuity, and diagnostic projection truth, and Avatar, Desktop, Apps, fixtures, providers, and renderer backends never create or imply Runtime success.
    condition: Whenever a LocalAgent projection causes visible behavior.
    failure: Reject unknown or synthetic provenance and show typed unavailable state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.avatar-event-provenance-plane
  - id: rule.nimi.runtime.agent-participation.r159
    kind: rule
    title: Embodiment input is a bounded LocalAgent projection
    modality: must
    statement: Avatar embodiment consumes only typed Runtime LocalAgent state, activity, emotion, voice, continuity, and presentation input plus Avatar-owned shell interaction context, with no raw provider, parser, motion-driver, or open extension payload as product truth.
    condition: Whenever Avatar embodiment input is assembled.
    failure: Reject undeclared input or raw payloads and render no synthetic cue.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.embodiment-input-plane
  - id: rule.nimi.runtime.agent-participation.r160
    kind: rule
    title: Embodiment ownership stays separated
    modality: must
    statement: Runtime LocalAgent semantic input retains Runtime provenance, Avatar shell and renderer state remains Avatar-local, launch identifiers remain targeting input until Runtime validates access, and neither Avatar nor a Third-party App writes local state back as LocalAgent truth.
    condition: Whenever embodiment inputs are combined or rendered.
    failure: Fail closed on missing, mismatched, or local-only provenance.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.embodiment-input-plane
  - id: rule.nimi.runtime.agent-participation.r163
    kind: rule
    title: LocalAgent source and turn status is bounded
    modality: must
    statement: Runtime and SDK may project typed LocalAgent source readiness and turn-context ready, blocked, truncated, or failed status with safe reason, budget, count, and correlation facts only.
    condition: Whenever LocalAgent source or turn-context status crosses the Runtime boundary.
    failure: Reject unknown, contradictory, or over-broad status as unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.source-context-projection-plane
  - id: rule.nimi.runtime.agent-participation.r164
    kind: rule
    title: LocalAgent context projection is not reconstructable
    modality: must_not
    statement: A LocalAgent source or turn-context projection exposes raw source, World context, prompt, Conversation text, private Memory or Knowledge, proof material, Provider Credentials, tool payloads, or fields that let a consumer reconstruct or override Runtime context composition.
    condition: Whenever LocalAgent source or turn-context status is projected or consumed.
    failure: Reject the projection or attachment without emitting ready state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.source-context-projection-plane
  - id: rule.nimi.runtime.agent-participation.r165
    kind: rule
    title: Recorded voice transcription uses Runtime LocalAgent AI policy
    modality: must
    statement: Explicit recorded voice input is transcribed through the Runtime-selected local STT route under current authorization, Quota, Budget, and readiness before text intent reaches a LocalAgent Conversation.
    condition: Whenever recorded voice input is submitted to a LocalAgent.
    failure: Return typed unavailable or failed state without App-local provider calls or fabricated transcript.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.ai-config-plane
  - id: rule.nimi.runtime.agent-participation.r166
    kind: rule
    title: Presentation validation and atomic replacement are Runtime-owned
    modality: must
    statement: Runtime validates protected-Shell-imported asset material for type, size, structure, dependencies, integrity, backend compatibility, current authorization, and expected presentation revision before replacement, then performs official asset import, presentation-profile update, and revision advance as one atomic commit; failed validation or a stale revision changes nothing, no pre-commit candidate or preview-persistence concept exists at product level, and internal temporary storage remains an implementation detail that never enters the contract.
    condition: Whenever a LocalAgent presentation replacement is validated or committed.
    failure: Reject client-owned validation or compatibility, raw local paths, stale revision, partial import or profile update, product-level candidate or preview state, or a commit outside Runtime.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.presentation-profile-plane
  - id: rule.nimi.runtime.agent-participation.r167
    kind: rule
    title: Render evidence and post-save failure do not rewrite Runtime truth
    modality: must_not
    statement: Runtime accepts client-asserted visible-pixel, renderer-success, or render-failure evidence as presentation commit authority, a validation substitute, or a security input, or automatically rolls back a committed replacement because rendering later fails.
    condition: Whenever Runtime validates or commits a LocalAgent presentation selection or a renderer reports a post-save result.
    failure: Ignore client render evidence as authority, retain a committed replacement after later render failure, surface that failure as a typed render failure distinct from save failure, and admit recovery only through an explicit restore-previous operation that creates a new revisioned commit.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.presentation-profile-plane
  - id: rule.nimi.runtime.agent-participation.r168
    kind: rule
    title: Autonomy mutation is atomic and revisioned
    modality: must
    statement: Runtime reads LocalAgent autonomy with its independent revision and applies each typed autonomy intent as one atomic compare-and-swap mutation that returns a revised projection or typed conflict.
    condition: Whenever LocalAgent autonomy configuration is read or changed.
    failure: Reject a missing or stale expected revision, partial write, or Kit-side multi-RPC mutation sequence.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.autonomy-configuration-plane
  - id: rule.nimi.runtime.agent-participation.r169
    kind: rule
    title: Model settings v1 projection is closed and typed
    modality: must
    statement: Runtime and SDK project model settings v1 as a dedicated typed projection containing dynamic capabilities from the canonical capability catalog, provider and model route intents, readiness, and audio.transcribe configuration, and every AIScopeRef resolves through the canonical factory or registry; typed per-capability parameters and AI Profile flows remain unavailable until typed Runtime and SDK schema and real backends are admitted.
    condition: Whenever LocalAgent model settings are projected or mutated.
    failure: Reject a fabricated NimiAIConfig value, hand-enumerated capability set, caller-fabricated AIScopeRef, unsupported parameter or AI Profile flow, or stub success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.ai-config-plane
