format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.agent-participation
units:
  - id: definition.nimi.runtime.agent-participation.conversation-anchor-plane
    kind: definition
    title: Runtime LocalAgent conversation continuity plane
    meaning: Runtime owns cross-surface LocalAgent Conversation continuity as exactly one durable Runtime-owned conversation transcript per LocalAgent; the conversation anchor is only the Runtime-issued continuity token for that single conversation, every authorized surface attaches as a projection and consumer of the same transcript, and no App identity, Desktop, Avatar, caller principal, or projection cache partitions continuity or becomes its owner.
  - id: definition.nimi.runtime.agent-participation.hook-intent-plane
    kind: definition
    title: Optional Runtime continuation boundary
    meaning: Deferred or proactive continuation is an optional Runtime-owned LocalAgent capability, not a general Workflow authority and not a prerequisite for ordinary LocalAgent Conversation, Memory, Knowledge, voice, or readiness.
  - id: definition.nimi.runtime.agent-participation.output-wire-plane
    kind: definition
    title: Runtime-private model output interpretation plane
    meaning: Runtime owns interpretation and validation of model output before it becomes committed Conversation, LocalAgent state, voice, or typed projection truth; model-native or parser-native payloads are never public App truth.
  - id: definition.nimi.runtime.agent-participation.presentation-profile-plane
    kind: definition
    title: Runtime LocalAgent presentation configuration plane
    meaning: Runtime owns durable LocalAgent presentation selections including the current official asset and default voice references plus validation-before-replace, revisioned atomic commit, persistence, and explicit restore-previous semantics needed by authorized projections, while Avatar owns visual rendering and backend-local state and no presentation profile becomes a LocalAgent or Avatar owner.
  - id: definition.nimi.runtime.agent-participation.presentation-stream-plane
    kind: definition
    title: Runtime LocalAgent presentation stream plane
    meaning: Runtime owns transient LocalAgent turn, state, activity, emotion, voice, interruption, and presentation projection truth; consumers own only their UI, playback, rendering, and ephemeral cache.
  - id: definition.nimi.runtime.agent-participation.avatar-debug-projection-plane
    kind: definition
    title: Optional Runtime Avatar diagnostics projection plane
    meaning: Runtime may project bounded, authorized Avatar diagnostic status without transferring LocalAgent, Avatar backend, package, credential, or provider truth, and the diagnostics path never blocks ordinary product readiness.
  - id: definition.nimi.runtime.agent-participation.participation-plane
    kind: definition
    title: Deferred advanced participation boundary
    meaning: Multi-participant rooms, Realm group participation, scenario or World participation, external-agent entry, MCP-backed participation, and their orchestration or promotion models are outside the current Runtime core and remain isolated future capability boundaries.
  - id: definition.nimi.runtime.agent-participation.ai-config-plane
    kind: definition
    title: Runtime shared LocalAgent AI configuration plane
    meaning: Runtime owns exactly one revisioned canonical AIConfig for the LocalAgent subsystem inside each authenticated account namespace and all Runtime LocalAgents in that account share it; the shared manager also projects one fixed LocalAgent capability-role participation policy independently of configured intent and effective resource state, the shared owner stores route-only Local intent or exact Cloud Connector and target intent while the Machine Loadout store owns current Local resource selection, and individual LocalAgents retain independent personality, appearance, behavior, Memory, Conversation, and presentation state but never own an AIConfig, participation override, route override, resource content, credential, endpoint, or capability readiness lifecycle.
  - id: definition.nimi.runtime.agent-participation.autonomy-configuration-plane
    kind: definition
    title: Runtime LocalAgent autonomy configuration plane
    meaning: Runtime owns LocalAgent autonomy configuration as one independently revisioned state with atomic compare-and-swap mutation semantics.
  - id: definition.nimi.runtime.agent-participation.app-consume-plane
    kind: definition
    title: Runtime protected Third-party Local App consume plane
    meaning: A protected Third-party Local App consumes only the canonical App Operation Contract agent.local subset—the bounded current-account active-Agent reference listing plus eight Conversation operations—through the standard Runtime SDK seam; Runtime returns a session-scoped opaque agentHandle for later calls and may project bounded typed text and image messages, image-action lifecycle and artifacts, recorded-voice transcription text, and terminal final-voice artifact sidecars, while never exposing raw localAgentId, activity, emotion, Avatar rendering, native voice chunks, Memory, Knowledge, Runtime proof, Realm JWT, Provider Credentials, provider or model detail, or a product binding entity.
  - id: definition.nimi.runtime.agent-participation.public-conversation-projection-plane
    kind: definition
    title: Runtime protected LocalAgent Conversation projection plane
    meaning: Runtime owns the closed protected LocalAgent Conversation projection of stable turns, role-typed messages and content parts, image actions, final voice sidecars, canonical failures, ordered events, bounded snapshots, and cross-restart convergence; Desktop first-party surfaces may use a different selector or transport while sharing the same Conversation semantics, and no consumer owns a second transcript, identity, event history, reducer truth, or execution proof.
  - id: definition.nimi.runtime.agent-participation.conversation-artifact-access-plane
    kind: definition
    title: Runtime Conversation artifact access plane
    meaning: Runtime owns purpose-bound LocalAgent attachment upload and Conversation artifact read over the single artifact store, including candidate custody, adoption, trusted metadata, Conversation membership, current access revalidation, bounded inline bytes, and typed rejection; an artifact id is never a bearer, inventory capability, App-storage owner transfer, or alternate media store.
  - id: definition.nimi.runtime.agent-participation.local-agent-capability-participation-plane
    kind: definition
    title: Runtime LocalAgent CapabilityContract participation plane
    meaning: Runtime owns one ordered role mapping from canonical CapabilityContracts into LocalAgent behavior and projects that policy independently of configured AIConfig intent, effective resource state, request-time admission, exact App operation coverage, and host controls; the mapping is neither a second capability catalog nor a readiness lifecycle.
  - id: definition.nimi.runtime.agent-participation.companion-wake-voice-plane
    kind: definition
    title: Runtime LocalAgent wake and voice plane
    meaning: Runtime owns admitted microphone, wake, transcription, accepted turn, response selection, voice generation, terminal voice artifact or failure, and first-party managed playback and interruption truth; protected agent.local consumers receive only final voice sidecars and own ephemeral local artifact playback without creating Runtime playback truth, while Avatar owns visible rendering, local playback, and backend-local lipsync from Runtime-projected artifacts.
  - id: definition.nimi.runtime.agent-participation.avatar-event-provenance-plane
    kind: definition
    title: Runtime LocalAgent event provenance plane
    meaning: Runtime owns the provenance of LocalAgent events consumed by Avatar and other projections, and no consumer, fixture, backend, provider, Desktop surface, or App may synthesize Runtime success or LocalAgent truth.
  - id: definition.nimi.runtime.agent-participation.embodiment-input-plane
    kind: definition
    title: Runtime LocalAgent embodiment input plane
    meaning: Runtime supplies typed LocalAgent state and presentation input to Avatar while Avatar owns shell-local interaction and renderer execution; neither side writes its local state back as the other's truth.
  - id: definition.nimi.runtime.agent-participation.source-context-projection-plane
    kind: definition
    title: Runtime LocalAgent source and turn context projection plane
    meaning: Runtime owns bounded read-only LocalAgent source readiness and turn-context status projections that expose safe status and correlation facts without exposing reconstructable source, prompt, Conversation, Memory, Knowledge, proof, provider, or tool material.
  - id: rule.nimi.runtime.agent-participation.r001
    kind: rule
    title: LocalAgent Conversation continuity is Runtime-owned
    modality: must
    statement: Runtime Agent Service owns the single conversation transcript of each LocalAgent with every anchor, committed turn, snapshot, recovery, attachment, and interruption decision, and distinct LocalAgents never share one transcript while one LocalAgent never has parallel Runtime conversation histories.
    condition: Whenever a LocalAgent conversation is opened, continued, recovered, or projected across surfaces.
    failure: Reject App-owned continuity, local transcript recovery, parallel per-surface conversation histories, and implicit cross-LocalAgent attachment.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.conversation-anchor-plane
  - id: rule.nimi.runtime.agent-participation.r004
    kind: rule
    title: No platform default LocalAgent
    modality: must_not
    statement: Runtime, Desktop, Avatar, Home, or an App infers a platform-level current or default LocalAgent, or accepts raw localAgentId from a protected Third-party Local App.
    condition: Whenever a surface selects a LocalAgent or attaches to its conversation.
    failure: Require the caller class's explicit authorized selector—raw localAgentId only for a separately admitted first-party or internal consumer, and a current session-scoped agentHandle for a protected Third-party Local App.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.conversation-anchor-plane
  - id: rule.nimi.runtime.agent-participation.r005
    kind: rule
    title: Conversation open and recovery are explicit and convergent
    modality: must
    statement: A separately admitted first-party or internal caller supplies an explicit authorized localAgentId, while a protected Third-party Local App supplies only a current session-scoped opaque agentHandle returned by the canonical reference-list operation; Runtime resolves that LocalAgent's single conversation by creating it on first open and returning the same committed continuity to every later authorized caller, and callers never select, partition, or duplicate conversation identity by App, principal, surface, or disposition.
    condition: Whenever a LocalAgent Conversation is opened or recovered.
    failure: Reject shadow or parallel transcripts, caller-selected conversation partitioning, App-local history as recovery truth, and an unauthorized LocalAgent target.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.conversation-anchor-plane
  - id: rule.nimi.runtime.agent-participation.r007
    kind: rule
    title: Avatar continuity remains a LocalAgent projection
    modality: must
    statement: Avatar may attach a visible instance to an explicitly authorized Runtime LocalAgent Conversation for recovery and presentation, but Avatar instance identity, launch state, renderer state, and same-LocalAgent selection never create or prove Runtime continuity.
    condition: Whenever Avatar renders or recovers a LocalAgent conversation.
    failure: Fail closed on missing or mismatched Runtime identity and continuity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.conversation-anchor-plane
  - id: rule.nimi.runtime.agent-participation.r008
    kind: rule
    title: Deferred continuation is optional and non-blocking
    modality: must
    statement: Any deferred or proactive continuation remains Runtime-owned, explicit, interruptible, default-off, and separate from general Workflow, and its absence never blocks ordinary LocalAgent operation.
    condition: Whenever deferred continuation is configured, proposed, or unavailable.
    failure: Reject App-owned scheduling, hidden timers, mock execution, and readiness dependency on the optional path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.hook-intent-plane
  - id: rule.nimi.runtime.agent-participation.r012
    kind: rule
    title: Model output becomes product truth only through Runtime
    modality: must
    statement: Runtime validates and interprets model output before committing LocalAgent Conversation, state, activity, voice, or projection truth, and Apps never consume raw parser or provider payloads as durable product state.
    condition: Whenever model output is produced or projected.
    failure: Reject malformed output, raw payload consumption, and consumer-authored success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.output-wire-plane
  - id: rule.nimi.runtime.agent-participation.r020
    kind: rule
    title: Persistent presentation inputs are Runtime-owned
    modality: must
    statement: Runtime owns durable LocalAgent presentation selections and the default voice reference needed for authorized projections, while voice generation and artifacts remain Runtime-owned execution outputs and current emotion, activity, renderer motion, camera, physics, lipsync, and window state remain transient Runtime projection or Avatar-local rendering facts according to their owners.
    condition: Whenever durable LocalAgent presentation configuration or default voice is read or changed.
    failure: Reject App-local durable truth, an AI-config-owned default voice, renderer state promoted into Runtime truth, or presentation ownership transferred to Avatar.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.presentation-profile-plane
  - id: rule.nimi.runtime.agent-participation.r028
    kind: rule
    title: Presentation consumers remain projection-only
    modality: must
    statement: Nimi Home, Desktop, Avatar, Zhiyu, and separately admitted first-party or internal SDK consumers consume presentation configuration only as authorized Runtime LocalAgent projection and never use it to execute a LocalAgent or write Conversation, Memory, Knowledge, state, or voice truth; the canonical App Operation Contract provides no presentation-configuration operation to a protected Third-party Local App.
    condition: Whenever a consumer reads or adapts LocalAgent presentation configuration.
    failure: Reject consumer-owned LocalAgent truth or full-blob writeback from UI state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.presentation-profile-plane
  - id: rule.nimi.runtime.agent-participation.r031
    kind: rule
    title: Transient LocalAgent projection truth is Runtime-owned
    modality: must
    statement: Runtime owns committed LocalAgent turn, state, activity, emotion, voice, interruption, and presentation timing truth, while Avatar and other Apps own only rendering, playback, interaction, and ephemeral UI state.
    condition: Whenever LocalAgent output or state is projected.
    failure: Reject a consumer-authored semantic event, direct renderer control as Runtime truth, or a fabricated successful projection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.presentation-stream-plane
  - id: rule.nimi.runtime.agent-participation.r035
    kind: rule
    title: Projection access is session-derived
    modality: must
    statement: Runtime admits a rich LocalAgent projection for a separately admitted first-party or internal consumer using its current account, current authorization, explicit localAgentId, and requested operation; a protected Third-party Local App receives only operation-specific typed results from the canonical agent.local subset after Runtime resolves and revalidates its current session-scoped agentHandle, and an App-declared scope, proof, caller-authored selector, or reusable relationship reference never grants access.
    condition: Whenever a consumer subscribes to or reads LocalAgent projections.
    failure: Reject missing or caller-controlled authorization and return no projection data.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.presentation-stream-plane
  - id: rule.nimi.runtime.agent-participation.r039
    kind: rule
    title: Projection namespaces preserve their owner boundary
    modality: must
    statement: Runtime Agent Service method and event namespaces identify Runtime-owned service and projection surfaces only; they are not a public event bus, consumer execution surface, or authority for Apps to emit Runtime truth.
    condition: Whenever a Runtime Agent Service namespace is emitted, consumed, or documented.
    failure: Reject broad wildcard ownership, consumer execution, or App-authored Runtime events.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.presentation-stream-plane
  - id: rule.nimi.runtime.agent-participation.r041
    kind: rule
    title: LocalAgent voice output is Runtime policy
    modality: must
    statement: Runtime decides whether an authorized LocalAgent target receives text-only or playable voice output using the current route, policy, Budget, and readiness, while consumers own only permitted playback controls and rendering.
    condition: Whenever LocalAgent voice output is selected or projected.
    failure: Keep output text-only or unavailable rather than calling a provider from an App or fabricating playable audio.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.presentation-stream-plane
  - id: rule.nimi.runtime.agent-participation.r044
    kind: rule
    title: Avatar diagnostics are optional owner projections
    modality: must
    statement: Runtime may project authorized Avatar probe status and Avatar may return bounded backend evidence, but diagnostics never transfer LocalAgent, provider, package, backend, or presentation authority and never block ordinary LocalAgent or Avatar readiness.
    condition: Whenever an Avatar diagnostic probe is requested or displayed.
    failure: Reject raw backend payloads, credentials, fabricated pass status, and readiness dependence on diagnostics.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.avatar-debug-projection-plane
  - id: rule.nimi.runtime.agent-participation.r049
    kind: rule
    title: Advanced participation remains deferred and non-core
    modality: must
    statement: Multi-participant rooms, Realm group participation, scenario or World participation, external-agent entry, MCP-backed participation, and their profile, axis, matrix, orchestration, promotion, queue, or commit models do not define Runtime core architecture and do not block Local AI, LocalAgent, Conversation, Memory, Knowledge, voice, or ordinary readiness.
    condition: Whenever an advanced participation capability is proposed, referenced, or unavailable.
    failure: Keep the capability isolated and unavailable rather than creating a core dependency or inferring an active product contract.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.participation-plane
  - id: rule.nimi.runtime.agent-participation.r082
    kind: rule
    title: LocalAgent subsystem AIConfig is singular and shared
    modality: must
    statement: Runtime persists exactly one revisioned canonical AIConfig for the LocalAgent subsystem inside each authenticated account namespace and every LocalAgent in that account consumes the same committed configuration; its Local route is route-only and composes with the current machine-selected Loadout for each future interactive, deferred, or proactive LocalAgent Job for that CapabilityContract, while its Cloud route names one exact current-account Connector reference, implementation, and target, without a second per-Agent permission or confirmation. A LocalAgent identity, Agent Center record, Conversation, feature, module, route, chat mode, renderer, or App never creates a second AIConfig, per-Agent override, credential, endpoint, hidden provider call, or execution truth, and no request switches route or selects a substitute resource implicitly.
    condition: Whenever LocalAgent AI configuration is read, changed, or consumed.
    failure: Reject per-Agent AIConfig, per-Agent model overrides, hidden shared Cloud impact, implicit Local-to-Cloud switching, parallel model-settings truth, partial overlays, and caller-declared execution truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.ai-config-plane
  - id: rule.nimi.runtime.agent-participation.r087
    kind: rule
    title: LocalAgent admission is derived and request scoped
    modality: must
    statement: Runtime may project a typed request admission reason derived from the shared LocalAgent AIConfig, the current machine-selected Loadout for Local or committed exact Connector, implementation, and target references for Cloud, standardized feature subset, lightweight effective selected-resource state, credential, policy, Quota, and Budget without persisting or exposing a LocalAgent AI readiness, probe, warm, resident, credential, endpoint, or health truth.
    condition: Whenever a LocalAgent request is checked or its inability to execute is displayed.
    failure: Return the typed derived reason without credentials, route internals, persistent readiness, fallback, or fabricated success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.ai-config-plane
  - id: rule.nimi.runtime.agent-participation.r088
    kind: rule
    title: LocalAgent turn admission uses Runtime AI policy
    modality: must
    statement: Runtime admits a LocalAgent turn only after reading the current authorized LocalAgent and account-scoped shared LocalAgent AIConfig, resolving the current machine-selected Loadout for the committed Local CapabilityContract or capturing the admitted account, exact Connector reference, Cloud CapabilityImplementation, and target for Cloud, then checking required standardized features, resource state, ownership, credential, policy, Quota, and Budget and atomically persisting the exact effective inputs in the Job; later AIConfig or machine selection changes never redirect that Job.
    condition: Whenever a LocalAgent turn is admitted.
    failure: Return a typed blocked or unavailable outcome without fallback provider execution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.ai-config-plane
  - id: rule.nimi.runtime.agent-participation.r093
    kind: rule
    title: Protected Apps use the canonical multimodal LocalAgent consume seam
    modality: must
    statement: A protected Third-party Local App submits typed user intent and consumes only the canonical App Operation Contract agent.local reference-list operation and its eight Conversation operations through the standard SDK and Runtime seam; the bounded public projection may contain typed text and image messages, image-action lifecycle and artifacts, recorded-voice transcription text, and terminal final-voice artifact sidecars, but never activity, emotion, Avatar rendering, native voice chunks, presentation internals, Memory, Knowledge, raw local IPC, provider APIs, parser payloads, execution proof, or App-local orchestration.
    condition: Whenever a protected Third-party Local App interacts with a LocalAgent.
    failure: Reject a bypass, private or unknown projection variant, operation outside the canonical nine-row agent.local family, or consumer-authored truth and keep the operation unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.app-consume-plane
  - id: rule.nimi.runtime.agent-participation.r095
    kind: rule
    title: Scaffolded App LocalAgent access is transparent and bounded
    modality: must
    statement: A Desktop-hosted scaffolded Third-party Local App may request the canonical bounded reference catalog for all current-account active LocalAgents and receives a session-scoped opaque agentHandle for each entry; every later canonical Conversation operation supplies only that handle while Runtime derives and revalidates the current account, App subject, active LocalAgent, agent.local coverage, and exact AppOperationId, and the App receives no raw localAgentId, Realm JWT, Provider Credential, Runtime proof, configuration, or broader inventory truth.
    condition: Whenever a scaffolded Third-party Local App invokes one canonical agent.local operation.
    failure: Reject missing, stale, caller-authored, cross-account, inactive-Agent, unsupported-operation, or caller-controlled authorization access and expose no broader LocalAgent truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.app-consume-plane
  - id: rule.nimi.runtime.agent-participation.r150
    kind: rule
    title: LocalAgent transcription and voice truth is Runtime-owned
    modality: must
    statement: Runtime owns admitted microphone processing, accepted text intent, LocalAgent response selection, voice artifact and terminal synthesis truth, and any first-party managed playback and interruption truth, while the one shared LocalAgent AIConfig owns each audio.transcribe and audio.synthesize Local-or-Cloud route and at Job submission Runtime atomically dereferences the current machine-selected Loadout for Local into a complete persisted ResolvedAssembly or captures its exact committed Connector reference, Cloud implementation, and Driver target; a protected agent.local consumer receives no native chunks or Runtime playback controls and may locally play, pause, or stop only the final artifact as ephemeral UI state, the companion voice plane neither chooses a route nor owns a model axis, queued or running Jobs never reread current AIConfig or machine selection, and optional wake behavior remains separately admitted and non-blocking.
    condition: Whenever LocalAgent voice input or output is available or requested.
    failure: Fail closed as unavailable without App-local capture truth, direct provider calls, current-state reconstruction, hidden listening, or simulated success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.companion-wake-voice-plane
  - id: rule.nimi.runtime.agent-participation.r152
    kind: rule
    title: Avatar consumes Runtime voice projection only
    modality: must
    statement: Avatar plays and renders only authorized Runtime-projected LocalAgent voice artifacts and timing for the active LocalAgent Conversation, never calls speech synthesis directly, owns durable voice truth, or exposes raw motion or driver control to an App.
    condition: Whenever Avatar renders LocalAgent speech or lipsync.
    failure: Keep presentation silent or unavailable rather than synthesize or fabricate voice state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.companion-wake-voice-plane
  - id: rule.nimi.runtime.agent-participation.r153
    kind: rule
    title: Audio privacy and lipsync ownership remain visible
    modality: must
    statement: Active capture and playback state is visibly projected, Runtime owns audio and timing truth, and Avatar may derive backend-local lipsync only from authorized playable audio without writing renderer parameters back as Runtime state.
    condition: Whenever microphone, playback, or lipsync state is rendered.
    failure: Reject hidden capture, fake speaking, fake lipsync, and ownership inversion.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.companion-wake-voice-plane
  - id: rule.nimi.runtime.agent-participation.r158
    kind: rule
    title: Runtime LocalAgent event provenance cannot be synthesized
    modality: must
    statement: Runtime is the only producer of LocalAgent turn, state, presentation, voice, continuity, and diagnostic projection truth, and Avatar, Desktop, Apps, fixtures, providers, and renderer backends never create or imply Runtime success.
    condition: Whenever a LocalAgent projection causes visible behavior.
    failure: Reject unknown or synthetic provenance and show typed unavailable state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.avatar-event-provenance-plane
  - id: rule.nimi.runtime.agent-participation.r159
    kind: rule
    title: Embodiment input is a bounded LocalAgent projection
    modality: must
    statement: Avatar embodiment consumes only typed Runtime LocalAgent state, activity, emotion, voice, continuity, and presentation input plus Avatar-owned shell interaction context, with no raw provider, parser, motion-driver, or open extension payload as product truth.
    condition: Whenever Avatar embodiment input is assembled.
    failure: Reject undeclared input or raw payloads and render no synthetic cue.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.embodiment-input-plane
  - id: rule.nimi.runtime.agent-participation.r160
    kind: rule
    title: Embodiment ownership stays separated
    modality: must
    statement: Runtime LocalAgent semantic input retains Runtime provenance, Avatar shell and renderer state remains Avatar-local, launch identifiers remain targeting input until Runtime validates access, and neither Avatar nor a Third-party App writes local state back as LocalAgent truth.
    condition: Whenever embodiment inputs are combined or rendered.
    failure: Fail closed on missing, mismatched, or local-only provenance.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.embodiment-input-plane
  - id: rule.nimi.runtime.agent-participation.r163
    kind: rule
    title: LocalAgent source and turn status is bounded
    modality: must
    statement: Runtime and SDK may project typed LocalAgent source readiness and turn-context ready, blocked, truncated, or failed status with safe reason, budget, count, and correlation facts only.
    condition: Whenever LocalAgent source or turn-context status crosses the Runtime boundary.
    failure: Reject unknown, contradictory, or over-broad status as unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.source-context-projection-plane
  - id: rule.nimi.runtime.agent-participation.r164
    kind: rule
    title: LocalAgent context projection is not reconstructable
    modality: must_not
    statement: A LocalAgent source or turn-context projection exposes raw source, World context, prompt, Conversation text, private Memory or Knowledge, proof material, Provider Credentials, tool payloads, or fields that let a consumer reconstruct or override Runtime context composition.
    condition: Whenever LocalAgent source or turn-context status is projected or consumed.
    failure: Reject the projection or attachment without emitting ready state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.source-context-projection-plane
  - id: rule.nimi.runtime.agent-participation.r165
    kind: rule
    title: Recorded voice transcription uses Runtime LocalAgent AI policy
    modality: must
    statement: Explicit recorded voice input is transcribed through the route committed in the shared LocalAgent AIConfig before text intent reaches a LocalAgent Conversation; when that intent is Local, Runtime dereferences the current machine-selected Loadout for audio.transcribe and missing or unready Local execution fails closed without automatic selection or Cloud fallback; an explicitly committed Cloud intent instead uses its exact Connector reference, implementation, and Driver target under current authorization, Quota, and Budget, and Runtime never searches for or chooses a substitute route or resource. Runtime independently admits at most 6 MiB of inline audio bytes and rejects a larger payload before authorization or execution with typed AI_AUDIO_INPUT_TOO_LARGE; the bytes-only Runtime request neither measures nor claims capture duration.
    condition: Whenever recorded voice input is submitted to a LocalAgent.
    failure: Reject an over-bound payload before authorization or execution with typed AI_AUDIO_INPUT_TOO_LARGE; otherwise return typed unavailable or failed state without App-local provider calls or fabricated transcript.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.ai-config-plane
  - id: rule.nimi.runtime.agent-participation.r166
    kind: rule
    title: Presentation validation and atomic replacement are Runtime-owned
    modality: must
    statement: Runtime validates protected-Shell-imported asset material for type, size, structure, dependencies, integrity, backend compatibility, current authorization, and expected presentation revision before replacement, then performs official asset import, presentation-profile update, and revision advance as one atomic commit; failed validation or a stale revision changes nothing, no pre-commit candidate or preview-persistence concept exists at product level, and internal temporary storage remains an implementation detail that never enters the contract.
    condition: Whenever a LocalAgent presentation replacement is validated or committed.
    failure: Reject client-owned validation or compatibility, raw local paths, stale revision, partial import or profile update, product-level candidate or preview state, or a commit outside Runtime.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.presentation-profile-plane
  - id: rule.nimi.runtime.agent-participation.r167
    kind: rule
    title: Render evidence and post-save failure do not rewrite Runtime truth
    modality: must_not
    statement: Runtime accepts client-asserted visible-pixel, renderer-success, or render-failure evidence as presentation commit authority, a validation substitute, or a security input, or automatically rolls back a committed replacement because rendering later fails.
    condition: Whenever Runtime validates or commits a LocalAgent presentation selection or a renderer reports a post-save result.
    failure: Ignore client render evidence as authority, retain a committed replacement after later render failure, surface that failure as a typed render failure distinct from save failure, and admit recovery only through an explicit restore-previous operation that creates a new revisioned commit.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.presentation-profile-plane
  - id: rule.nimi.runtime.agent-participation.r168
    kind: rule
    title: Autonomy mutation is atomic and revisioned
    modality: must
    statement: Runtime reads LocalAgent autonomy with its independent revision and applies each typed autonomy intent as one atomic compare-and-swap mutation that returns a revised projection or typed conflict.
    condition: Whenever LocalAgent autonomy configuration is read or changed.
    failure: Reject a missing or stale expected revision, partial write, or Kit-side multi-RPC mutation sequence.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.autonomy-configuration-plane
  - id: rule.nimi.runtime.agent-participation.r169
    kind: rule
    title: LocalAgent AI configuration uses canonical AIConfig
    modality: must
    statement: Runtime and SDK project the account-scoped shared LocalAgent AIConfig as a revisioned whole-object per-CapabilityContract route-only Local or exact Cloud route intent with required standardized features and defaults, while Cloud additionally contains Connector reference, CapabilityImplementation, and provider-model target; any covered App or Desktop uses the same canonical get, compare-and-swap overwrite, clear-by-omission, lightweight current effective selected-resource projection, and bounded discriminated options clients, while the AIConfig contains no Local Loadout or ModelAsset identity, machine selection, credential, endpoint, account selector, Loadout content, ModelAsset binding, workflow, node environment, process state, per-Agent field, readiness, fallback, merge, or history. Apply Profile remains portable, returns only non-committing prefill, and does not install, prepare, bind, select environment resources, or write the shared owner.
    condition: Whenever LocalAgent AIConfig is projected, customized, previewed, applied, or consumed for execution.
    failure: Reject per-Agent or route-only shadow truth, local execution material in AIConfig, caller-fabricated owner identity, untyped parameters, live Profile binding, partial write, fallback, or stub success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.ai-config-plane
  - id: definition.nimi.runtime.agent-participation.user-attachment-plane
    kind: definition
    title: Runtime user attachment intake plane
    meaning: Runtime owns user-submitted attachment intake for LocalAgent Conversation as one authorized upload-and-reference plane; the caller uploads bounded image material to a Runtime-owned artifact store that records owner metadata, a turn references that artifact only by id, Runtime alone validates authenticity, ownership, size, and type, persists the attachment with the owning conversation transcript, and projects it for authorized rendering; the artifact id is never a credential, and no surface passes attachment bytes or attachment truth through App-local storage.
  - id: rule.nimi.runtime.agent-participation.r170
    kind: rule
    title: Attachment upload authenticity and bounds are Runtime-validated
    modality: must
    statement: Runtime validates LocalAgent attachment upload before admission by requiring no more than 4 MiB of raw bytes, one declared image mime from image/png, image/jpeg, image/webp, or image/gif, signature agreement with that mime, and an optional display name no longer than 255 UTF-8 bytes; Runtime validates and stores the display name once, and the artifact store remains the only source of trusted attachment mime, size, display name, and media kind.
    condition: Whenever a caller uploads attachment material for a LocalAgent Conversation.
    failure: Reject oversize, non-admitted type, corrupt, or signature-mismatched material with a typed failure and store nothing.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.user-attachment-plane
  - id: rule.nimi.runtime.agent-participation.r171
    kind: rule
    title: Attachment reference and read follow the custody transition
    modality: must
    statement: An uploaded attachment candidate carries Runtime-owned account, App subject, Agent, Conversation anchor, expiry, and artifact metadata; before commit only the current uploader owner with the exact upload or turn-send operation and matching Agent and anchor may reference it, while after the first successful user-message commit any independently current authorized App with the exact Conversation artifact-read operation and the same account, Agent, anchor, and committed transcript membership may read it without requiring uploader-App equality, and the artifact id alone never authorizes reference or read.
    condition: Whenever an attachment artifact is uploaded, referenced by a turn, or read back for rendering.
    failure: Reject pre-commit owner mismatch, expired or adopted reuse, missing exact operation, stale handle or session, cross-account, cross-Agent, cross-anchor, non-member, or bearer-style access with a canonical typed reason and expose no generic artifact inventory.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.user-attachment-plane
  - id: rule.nimi.runtime.agent-participation.r172
    kind: rule
    title: A turn carries at most one referenced attachment
    modality: must
    statement: A LocalAgent Conversation turn carries exactly the restricted canonical input-part subset—zero or one non-empty text part of at most 64 KiB UTF-8 plus zero or one Runtime image artifact reference, with at least one part—and Runtime admits the attachment into turn context composition only through the standard turn admission path; caller-supplied raw bytes, mime, media kind, display name, owner, or storage truth are never turn input.
    condition: Whenever a user submits a turn carrying an attachment.
    failure: Reject duplicate or empty text, excess attachments, missing text and attachment, raw bytes, caller-authored artifact metadata, unknown part kinds, or a bypass reference with a canonical typed reason before execution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.user-attachment-plane
  - id: rule.nimi.runtime.agent-participation.r173
    kind: rule
    title: Attachment messages persist and project as media
    modality: must
    statement: A committed user attachment message is durably persisted with one Runtime-issued message id and owning turn id and projected with its image media kind, artifact reference, trusted mime, and upload-time display name for authorized rendering; the same identity and parts appear in live message-committed events and durable snapshots, so the user's own attachment remains visible after renderer or Runtime restart.
    condition: Whenever a turn carrying an attachment is committed or projected.
    failure: Never silently drop or text-flatten an attachment message; project a typed unavailable state instead.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.conversation-anchor-plane
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.user-attachment-plane
  - id: rule.nimi.runtime.agent-participation.r174
    kind: rule
    title: Image-input feature mismatch fails without losing the attachment
    modality: must
    statement: When the shared LocalAgent AIConfig requires input.image for text.generate and the effective CapabilityImplementation does not declare that contract-scoped standardized feature, Runtime commits exactly the user attachment message, commits no primary assistant message, and terminalizes the turn with the canonical feature-mismatch reason, never dropping the attachment, creating synthetic assistant failure text, pretending the image was consumed, or changing the route, Loadout, Connector, implementation, or target.
    condition: Whenever an effective text.generate implementation without input.image receives an attachment turn.
    failure: Preserve the committed user attachment and failed turn in live and snapshot projection with no synthetic assistant message or success artifact.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.user-attachment-plane
  - id: rule.nimi.runtime.agent-participation.r175
    kind: rule
    title: Protected Conversation turn and message projection is closed
    modality: must
    statement: Runtime projects each admitted protected Conversation turn with one stable Runtime-issued turn id and immutable role-typed messages; a successful user turn commits exactly one user message and one primary assistant message containing exactly one non-empty text part, each completed image action adds exactly one assistant image message containing exactly one artifact reference and no text, live events publish the user message before the primary assistant message, committed text uses message-committed only with no public text-delta, and live and snapshot projections use the same ids and parts. The send request id is caller-local correlation excluded from durable Turn, event, and snapshot truth, lost response may remain indeterminate and never authorizes automatic resend, and Runtime admits at most one active turn per Agent across Apps and Conversation anchors.
    condition: Whenever a protected LocalAgent turn is accepted, committed, projected, retried after caller transport loss, or attempted while the Agent is active.
    failure: Reject malformed or contradictory message shapes, App-synthesized identity, public text-delta, request-id persistence, automatic resend, or a second active turn with a canonical typed reason and never queue, join across Apps, supersede, or implicitly interrupt.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.conversation-anchor-plane
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.public-conversation-projection-plane
  - id: rule.nimi.runtime.agent-participation.r176
    kind: rule
    title: Conversation events and snapshots converge without an event log
    modality: must
    statement: Runtime allocates one monotonic unsigned 64-bit Conversation sequence before protected filtering, so private sidebands may create legal public gaps; every public event carries its canonical decimal sequence, each bounded snapshot atomically carries state and throughSequence, consumers subscribe and buffer before hydration and apply only later events through stable-identity monotonic reducers, and explicit retryable overflow requires replacement subscription before a fresh snapshot while access denial or non-retryable closure stops recovery. The 200-message and 1-MiB text limits bound retained terminal history, the single active or recoverable turn closure remains complete beyond that history bound, terminal history truncates only whole turns with all message, action, and voice children, and Runtime restart preserves committed truth while terminalizing a non-terminal turn as interrupted and coupled non-terminal actions as failed. Runtime persists only the sequence counter and snapshot truth, never an event log, resume cursor, checksum, receipt, or replay service.
    condition: Whenever protected Conversation events are subscribed, a snapshot is read, history is truncated, a subscription overflows, a renderer refreshes, or Runtime restarts.
    failure: Reject sequence rollback or reuse, provisional or fabricated sequence, stale-event rollback, orphan or duplicate child state, partial-turn truncation, blind retry loops, phantom running work, or reconstruction from App cache.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.conversation-anchor-plane
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.public-conversation-projection-plane
  - id: rule.nimi.runtime.agent-participation.r177
    kind: rule
    title: Image action lifecycle commits one artifact projection
    modality: must
    statement: The only admitted public LocalAgent action in this cut is image.generate with one Runtime-issued action id, owning turn id, canonical CapabilityContract id, and the closed planned, started, completed, or failed lifecycle; planned, started, and failed carry no projection message or artifact, completed carries exactly one artifact id and one same-turn assistant image projection message whose sole artifact reference equals that id, and Runtime atomically commits artifact membership, projection message, and durable completed action before publishing message-committed, artifact-ready, and action-completed in that order. On normal completion, Runtime publishes the parent turn terminal only after every coupled image action is completed or failed; external turn terminalization first terminalizes every unfinished coupled action and no later action message, artifact, or success may be published. A failed action persists one canonical failure without artifact, accepted interruption terminalizes unfinished action work and rejects late success, and optional action failure does not rewrite an otherwise successful primary text turn; action-progress, multi-artifact result, music.generate, video.generate, voice.create, world.generate, provider detail, model detail, route detail, and generic scenario execution are absent.
    condition: Whenever Runtime plans, executes, commits, fails, interrupts, publishes, or recovers a LocalAgent image action.
    failure: Reject an unknown action capability or state, progress event, multiple artifacts, missing or cross-turn projection message, ready-before-commit event, contradictory terminal, late overwrite, private execution payload, or consumer-authored action success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.output-wire-plane
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.public-conversation-projection-plane
  - id: rule.nimi.runtime.agent-participation.r178
    kind: rule
    title: Conversation artifact read is membership-bound and bounded
    modality: must
    statement: runtime.agent.conversation.artifact.read accepts only the current opaque Agent handle, Conversation anchor, and artifact id, revalidates the current session and exact operation, and returns artifact id, bytes, store-owned mime, and byte length only when the same account, Agent, and anchor owns either a committed user or action transcript member or a committed Runtime-generated final-voice sidecar; committed membership permits an independently authorized current App to read without uploader-App equality, inline read is capped at 32 MiB, an existing oversized member fails with the canonical too-large reason, and newly generated action or voice output exceeding that bound fails output validation before ready projection. Artifact-ready or voice-ready publishes only after membership commit and immediate purpose-bound readability, and no call exposes generic artifact inventory, App-storage access, caller-authored metadata, or bearer semantics.
    condition: Whenever a protected App reads, projects, or marks ready a Conversation attachment, action artifact, or final voice artifact.
    failure: Reject stale or unauthorized access, non-member, cross-account, cross-Agent, cross-anchor, uncommitted, missing, oversized, unreadable, or metadata-mismatched artifacts with a canonical typed reason and publish no ready state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.conversation-artifact-access-plane
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.public-conversation-projection-plane
  - id: rule.nimi.runtime.agent-participation.r179
    kind: rule
    title: Attachment candidates expire and adopt exactly once
    modality: must
    statement: runtime.agent.conversation.attachment.upload creates an uncommitted candidate bound to the current account, App subject, Agent, and Conversation anchor with Runtime-issued artifact id and expiresAt exactly one hour after upload; before expiry a failed or canceled pre-commit send may reference the same unadopted candidate with a new send request id, the first successful user-message commit atomically adopts it into exactly one turn and removes candidate expiry semantics, and an adopted, expired, different-owner, or later-turn reference requires a new upload. Upload has no public idempotency key, response loss may create another bounded candidate whose own expiry remains authoritative, and physical reclamation follows existing artifact-store retention without a public deletion-time promise, sweeper, inventory, quota, rate-limit, ledger, or migration subsystem.
    condition: Whenever a LocalAgent attachment candidate is uploaded, referenced, adopted, retried, expired, or reclaimed.
    failure: Reject use at or after expiry, second adoption, owner or anchor mismatch, later-turn reuse, or fabricated expiry and preserve committed artifacts independently of candidate cleanup.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.conversation-artifact-access-plane
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.user-attachment-plane
  - id: rule.nimi.runtime.agent-participation.r180
    kind: rule
    title: Protected recorded voice transcription returns text only
    modality: must
    statement: runtime.agent.conversation.voice.transcribe accepts only the current opaque Agent handle, Conversation anchor, caller-local request id, normalized audio mime satisfying the existing audio/* grammar, and no more than 6 MiB of recorded bytes, applies the audio.transcribe route from the shared LocalAgent AIConfig through the existing Runtime Job owner, and returns only trimmed non-empty valid UTF-8 text of at most 64 KiB. Scenario Job id, trace id, route, Loadout, Connector, provider, model, credential, endpoint, and execution proof remain private; the host stops capture no later than five minutes and owns OS permission while Runtime claims only the byte bound, capture cancel submits nothing, transcription cancellation cancels the current wait or Job under its owner, and stale handle, anchor, or consumer generation suppresses late turn submission without creating another cancellation or replay protocol.
    condition: Whenever a protected App submits explicit recorded voice for LocalAgent transcription.
    failure: Reject invalid identity, mime, bytes, size, configuration, feature, admission, policy, Quota, Budget, cancellation, transport, execution, empty, invalid, or oversized output with the canonical Runtime reason and never truncate, fabricate text, or submit a late turn.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.ai-config-plane
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.app-consume-plane
  - id: rule.nimi.runtime.agent-participation.r181
    kind: rule
    title: Protected final voice is a terminal presentation sidecar
    modality: must
    statement: A protected agent.local Conversation receives no native audio chunks and at most one immutable final voice sidecar for the primary assistant text message; when synthesis starts Runtime reaches ready with exactly one immediately readable artifact or failed with one canonical reason and no artifact before normal turn completion, while policy that does not start synthesis leaves voice absent. External interruption, session termination, or Runtime restart abandons unpublished synthesis as absent and rejects late output, an already published terminal sidecar remains unchanged, voice never enters message content parts or action messages, and protected play, pause, stop, and progress are consumer-local ephemeral state that calls no Runtime interruption operation and does not change Conversation truth; Desktop and other first-party managed voice playback and interruption remain under their separate existing owner contracts.
    condition: Whenever final voice is synthesized, projected, read, played locally, interrupted, failed, or recovered for a protected Conversation.
    failure: Reject native-chunk exposure, multiple or reopened sidecars, voice on a non-primary message, ready without readable artifact, failed with artifact, late publication, provider detail, App-local synthesis success, or protected playback reported as Runtime interruption truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.companion-wake-voice-plane
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.public-conversation-projection-plane
  - id: rule.nimi.runtime.agent-participation.r182
    kind: rule
    title: LocalAgent CapabilityContract participation is one exact five-row mapping
    modality: must
    statement: Runtime owns and projects in stable order exactly text.generate as conversation.primary, text.embed as memory.embedding, audio.transcribe as conversation.input.voice, audio.synthesize as conversation.output.voice, and image.generate as conversation.action.image; text.embed is internal Memory or Knowledge support rather than a direct action, and voice.create, music.generate, video.generate, world.generate, vision.locate, unknown capabilities, and capability-role cross-pairs are absent. This participation policy is independent of configured AIConfig intents, catalog metadata, effective resource state, request-time admission, App operation coverage, and host picker, capture, or playback adapters and creates no second capability identity, permission, route, readiness, or availability catalog.
    condition: Whenever Runtime declares, projects, configures, admits, or renders CapabilityContract participation for LocalAgent.
    failure: Reject a missing, duplicate, reordered, deferred, unknown, cross-paired, configured-only, catalog-derived, readiness-bearing, or consumer-authored participation row.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.ai-config-plane
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.local-agent-capability-participation-plane
  - id: rule.nimi.runtime.agent-participation.r183
    kind: rule
    title: Shared AIConfig manager projects participation independently
    modality: must
    statement: One Runtime projector supplies the same ordered five LocalAgent participation rows in first-party GetSharedLocalAgentAIConfigResponse and OverwriteSharedLocalAgentAIConfigResponse and in protected LocalAppSharedLocalAgentAIConfigProjection used by Get and Overwrite, while ListOptions responses carry no participation; canonical absent config, clear, overwrite success or conflict, and unavailable effective selection preserve the same participation rows and never create five configured intents. Participation adds no operation, RPC, AIConfig owner, revision, overwrite, options, exact resource selection, effective-selection field, manager, editor, or generic App AIConfig field, and configured intent mutation never changes or recomputes participation.
    condition: Whenever the shared LocalAgent AIConfig manager reads, overwrites, clears, conflicts, lists options, or projects participation through first-party or protected SDK surfaces.
    failure: Reject divergent first-party and protected rows, participation in options, configured-intent derivation, loss on absent config or clear, generic App AIConfig pollution, parallel manager state, or mutation of the fixed participation policy.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.ai-config-plane
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.local-agent-capability-participation-plane
  - id: rule.nimi.runtime.agent-participation.r184
    kind: rule
    title: Protected Conversation failures preserve canonical Runtime reasons
    modality: must
    statement: Protected Conversation operation, turn, action, voice, artifact, and subscription failures use the canonical Runtime ReasonCode as their only programmatic discriminator with optional bounded display text that consumers never parse; user, session, supersede, or Runtime-restart termination uses the interrupted turn terminal, while timeout, policy, configuration, feature, Quota, Budget, Runtime-observed downstream transport, execution, and output failure uses failed. App-to-SDK or RPC response loss, subscription closure, and caller cancellation are caller-local and never rewrite Runtime turn truth, and a caller changes an accepted turn only through runtime.agent.conversation.turn.interrupt; unknown public content, action, voice, event, or terminal variants fail typed instead of being discarded or converted to success.
    condition: Whenever a protected Conversation call, stream, turn, action, artifact, or voice path fails, closes, is canceled, or receives an unknown projection.
    failure: Reject a LocalAgent-only failure taxonomy, human-text classification, caller-local transport promoted to durable failure, dual terminal, silent unknown variant, fabricated retryability, or pseudo-success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.app-consume-plane
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.public-conversation-projection-plane
