format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.protected-session
units:
  - id: definition.nimi.runtime.protected-session.protected-local-session-plane
    kind: definition
    title: Runtime protected local session plane
    meaning: The Runtime protected local session plane admits a native local connection only when the platform peer facts bind the connected peer to Desktop's current exact Host launch, then derives the current App subject, account context, declaration generations, Effective App Access Snapshot, and requested operation without trusting localhost, caller fields, renderer metadata, portable bearers, or a same-user security claim.
  - id: definition.nimi.runtime.protected-session.account-session-plane
    kind: definition
    title: Runtime account session plane
    meaning: The Runtime account session plane consumes Account Service current-account truth, holds the session-derived account context and protected App-path credential custody, exposes only the Account-owned minimal current-user display projection, and mediates typed Realm access for Desktop-hosted Local Apps without transferring account ownership or credential material.
  - id: definition.nimi.runtime.protected-session.config-plane
    kind: definition
    title: Protected host and service plane
    meaning: The protected host and service plane owns the boundary between the independently admitted production or deployment Runtime topology and the D2 local-development per-user non-elevated Runtime slice plus the replaceable Nimi Home Host Contract; production service identity, storage, update, and process topology do not become D2 prerequisites, D2 platform adapters remain thin implementation, and D2 claims no OS sandbox, binary or mutable-project integrity, or resistance to same-user file, memory, injection, debugging, or handle attacks.
  - id: definition.nimi.runtime.protected-session.rpc-plane
    kind: definition
    title: Protected Runtime operation plane
    meaning: The protected Runtime operation plane admits only canonical stable App operations after verifying the exact Desktop-launched Host peer and process, a fresh protected session bound to the registered subject and current source generation, declaration generation, and account context generation, exact AppOperationId classification, and the classified Base-row invariants or AppAccess-domain snapshot coverage; successful admission permits only dispatch and never implies operation success, because the owner service independently applies its resource and business policy and returns an owner-specific typed result, while concrete RPC membership, framing, transport names, platform calls, and handler composition remain implementation details.
  - id: rule.nimi.runtime.protected-session.r001
    kind: rule
    title: Runtime owns protected session truth
    modality: must
    statement: Runtime is the sole owner of protected local session truth, App identity resolution, Effective App Access Snapshot derivation, and protected App operation admission, while Account Service and each operation owner retain their own account, resource, and business truth; the snapshot remains Runtime-private, and SDK, Kit, Nimi Home, Desktop, Avatar, and Apps receive only operation-specific typed projections and never restate those facts.
    condition: Whenever protected local session authority is interpreted.
    failure: Reject consumer-owned session, account, App, or authorization truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r002
    kind: rule
    title: Localhost is not trusted
    modality: must_not
    statement: A loopback address, local user, App id, caller enum, manifest, source-host string, renderer metadata, request field, or portable bearer proves protected origin.
    condition: Whenever a protected caller is admitted.
    failure: Fail closed unless the platform admits the native peer and Runtime derives the current App, account, and owner authorization.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r003
    kind: rule
    title: Production Runtime protected custody is service isolated
    modality: must
    statement: A production or deployment Runtime may run under its admitted isolated service identity with service-owned credential custody, configuration, and data unavailable through ordinary supported App and renderer surfaces; this topology and its stronger OS boundary are not prerequisites or trust facts for the D2 local-development per-user journey.
    condition: Whenever the production or deployment Runtime topology loads protected state or opens protected access.
    failure: Keep production protected features unavailable when the admitted production service or custody boundary is unavailable without blocking the separate D2 local-development topology.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r004
    kind: rule
    title: Windows and macOS D2 share one required product boundary
    modality: must
    statement: Windows and macOS D2 local development both implement the same per-user non-elevated protected-App product semantics through thin platform-native peer, IPC, and process adapters, while Linux remains deferred and non-blocking; this D2 rule neither retires nor constrains independently admitted production or deployment topology.
    condition: Whenever the D2 protected-local product boundary is interpreted.
    failure: Reject a platform-specific App access ontology or production privileged-service topology used as a D2 prerequisite; platform support evidence remains implementation acceptance rather than product authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r005
    kind: rule
    title: Native mechanisms do not change product semantics
    modality: must
    statement: Each supported operating system may use different peer identity, transport, custody, installation, and process-control primitives, but those primitives do not alter SDK, Kit, App, Nimi Home, LocalAgent, declaration-domain, snapshot, or operation semantics.
    condition: Whenever a platform-specific protected-local implementation is selected.
    failure: Reject a platform-specific product ontology or public API.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r006
    kind: rule
    title: Production deployment owns Runtime service lifecycle
    modality: must
    statement: Production deployment and update authority owns any production Runtime service identity, installation, replacement, and uninstall, while the current Home host may request typed service status or restart through the protected production boundary; none of those service mechanics is a prerequisite, trust fact, or alternate access path for the D2 local-development per-user Runtime slice.
    condition: Whenever production Runtime installation, update, restart, or service status is requested.
    failure: Reject App or renderer production service control, Desktop ownership of production service identity, and production topology used to block D2 local-development acceptance.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r007
    kind: rule
    title: Service control reports platform lifecycle truth
    modality: must
    statement: D2 local-development Runtime process control reports only the current platform's observed per-user process availability or the exact operation failure and never reports product readiness, protected-session success, App access, or owner-operation success from launch, process presence, or a command acknowledgement; production service lifecycle uses its separately owned projection.
    condition: Whenever D2 per-user Runtime start, restart, repair, or status is projected.
    failure: Return the observed lifecycle state or exact failure rather than synthesize product success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r008
    kind: rule
    title: Desktop is a replaceable Home host
    modality: must
    statement: Desktop is the current implementation of the replaceable Nimi Home Host Contract and receives no immutable authority over Realm, Runtime, LocalAgent, App access, credentials, installation, or process truth merely because it is first party.
    condition: Whenever Desktop or another Home host requests protected capability.
    failure: Reject Desktop-identity privilege and require the verified host role and operation owner decision.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r009
    kind: rule
    title: Renderer code receives no protected authority
    modality: must_not
    statement: Renderer code receives or constructs protected endpoints, native peer handles, service identity or secrets, Realm JWT, Provider Credential, account principal, authorization decision, service-control authority, or generic Runtime forwarding.
    condition: Whenever a host exposes protected functionality to UI code.
    failure: Keep authority in the verified native host and expose only typed bounded results.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r010
    kind: rule
    title: Runtime owns App-path credentials
    modality: must
    statement: Runtime alone holds and refreshes Realm App-path tokens, Provider Credentials, connector credentials, and protected AI secrets used by scaffolded Desktop-hosted Local Apps.
    condition: Whenever a scaffolded Local App accesses Realm, AI, or a credentialed provider capability.
    failure: Reject credential projection, App-side refresh, or provider-secret custody.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r011
    kind: rule
    title: Scaffolded Realm access is mediated
    modality: must
    statement: A Desktop-hosted App uses the standard typed SDK and Runtime-mediated Realm path for each admitted Realm operation; Runtime invokes the Realm owner with internal credential custody and returns only that operation's complete owner-defined sanitized result, never a raw Realm response, generic caller-selected forwarding result, Realm JWT, refresh token, native peer material, or internal admission state.
    condition: Whenever a Desktop-hosted App requests an admitted Realm operation.
    failure: Fail only that operation closed when the current account, App session, classified Base invariants or AppAccess-domain coverage, Realm owner policy, or sanitized projection is unavailable, with no direct Realm or Runtime fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r012
    kind: rule
    title: Direct SDK token custody stays outside Local Apps
    modality: must
    statement: A direct SDK App, script, or small program may obtain and maintain its Realm token through standard Auth, but that direct token path is not admitted inside a Desktop-hosted App Tools scaffolded Local App.
    condition: Whenever direct SDK and scaffolded access paths are composed.
    failure: Reject direct token inputs in the scaffolded Local App path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r013
    kind: rule
    title: Caller identity is Runtime derived
    modality: must
    statement: Runtime derives the current account context, App subject, protected session, source generation, declaration generation, Effective App Access Snapshot, declaration-domain coverage, AppOperationId, operation classification, and trusted Host relation for the native-admitted connection; an App cannot declare or override any of those facts through a request.
    condition: Whenever Runtime authorizes a protected App operation.
    failure: Reject caller-supplied identity or authorization as non-authoritative.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r014
    kind: rule
    title: LocalAgent access uses current session decisions
    modality: must
    statement: A Local App LocalAgent operation uses the active session-derived account, App subject, Effective App Access Snapshot, exact requested operation, and a Runtime-issued session-scoped opaque Agent handle; the handle is a non-secret selector rather than a grant, bearer, durable identity, or owner decision, and Runtime resolves and revalidates the current-account active LocalAgent before every execution.
    condition: Whenever a Local App requests a LocalAgent operation.
    failure: Fail closed when any session-derived input or ownership decision is missing.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r016
    kind: rule
    title: Stale access is revoked
    modality: must
    statement: Process exit, caller replacement, protected connection loss, account switch, logout, Runtime restart, App removal, source-generation change, declaration-generation change, or verified Host-relation loss invalidates the affected session, Effective App Access Snapshot, Agent handles, calls, and streams before later use; account or declaration changes alone do not terminate the still-running exact Host, delete registration, rotate its stable subject, or create durable security posture.
    condition: Whenever a protected session or snapshot dependency changes.
    failure: Reject stale calls and close stale streams without cached fallback while keeping unrelated Host and product availability truthful.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r017
    kind: rule
    title: Reconnection does not restore prior authority
    modality: must
    statement: Reconnection or rebinding repeats current exact Host peer admission and derives a fresh session, Effective App Access Snapshot, Agent handles, and owner decisions; the same still-verified Host may bind again after account or declaration changes without relaunch, while a changed executable, entrypoint, another security-relevant launch input, or process fact, Developer Mode off, explicit stop, or ended supervision requires a new verified launch.
    condition: Whenever a caller reconnects after invalidation.
    failure: Reject restored authority based only on previous success or cached session state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r018
    kind: rule
    title: Protected operations are owner bounded
    modality: must
    statement: Native peer admission is necessary but not sufficient for a protected operation; Runtime classifies the exact AppOperationId through the canonical contract, enforces either the classified Base-row invariants or AppAccess-domain coverage from the current Runtime-private snapshot, and then requires the owning service to admit current target ownership, access, and business policy.
    condition: Whenever Runtime dispatches a protected operation.
    failure: Return the typed access or owner failure before owner mutation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r019
    kind: rule
    title: No fixed RPC membership is product authority
    modality: must_not
    statement: Cross-layer product authority is defined by a concrete RPC membership list, transport class name, framing length, caller enum, operating-system object, or language-specific method matrix; the canonical stable AppOperationId and declaration-domain union remain product contract rather than transport detail.
    condition: Whenever protected App product semantics or implementation membership is documented.
    failure: Use the canonical App operation contract for product identity and leave RPC, transport, and handler membership to implementation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r020
    kind: rule
    title: Missing protected access fails closed
    modality: must
    statement: Unavailable peer verification, account context, App subject, Runtime-private snapshot, required classified Base invariant or AppAccess-domain coverage, credential custody, owner policy, or Host capability makes the affected protected operation unavailable with no public TCP, direct Realm, direct Runtime, shared token, anonymous, fixture, renderer, or mock-success fallback; it does not by itself stop unrelated App, Host, Runtime, authoring, diagnostic, or support functionality.
    condition: Whenever a protected prerequisite is missing.
    failure: Return the typed failure without executing the operation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r021
    kind: rule
    title: Security audit follows real owner actions
    modality: must
    statement: Authentication, account transition, authorization decision, credential access, sensitive host operation, service-control request, revocation, and rejected protected access produce owner-appropriate audit without secrets or portable authority material.
    condition: Whenever a security-relevant protected action occurs.
    failure: Reject secret-bearing audit and do not replace owner behavior with evidence-only success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r022
    kind: rule
    title: Protected configuration stays service owned
    modality: must
    statement: Production Runtime protected configuration and secrets use the admitted service-owned storage boundary, while D2 local development keeps configuration and custody within its per-user non-elevated Runtime boundary without fixing a physical path, store, or platform mechanism and with no same-user file or memory resistance claim; each owner keeps atomic validated updates and fail-closed loading for its admitted configuration, and Apps and renderers receive typed projections rather than raw paths or secret values.
    condition: Whenever protected Runtime configuration is read or changed.
    failure: Reject unsupported or malformed configuration, partial updates, raw-path disclosure, and secret projection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r023
    kind: rule
    title: Avatar is an independent first-party projection
    modality: must
    statement: Avatar may use its own native-admitted first-party host connection to consume Runtime-authorized LocalAgent state, voice, and presentation projections without a live Desktop process, Desktop account-control privilege, Realm JWT, Provider Credential, or caller-supplied account truth.
    condition: Whenever Avatar opens protected Runtime access.
    failure: Reject Desktop identity inheritance, independent account truth, or direct LocalAgent execution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r024
    kind: rule
    title: Ordinary product support remains reachable
    modality: must
    statement: A typed request-time capability admission block, Job failure, or protected product capability failure does not hide Nimi Home, support, diagnostic, configuration, model acquisition, and repair surfaces required to recover it; no aggregate Local AI readiness state gates ordinary entry.
    condition: Whenever an owner-specific protected capability is unavailable or fails.
    failure: Keep recovery surfaces available with truthful typed state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r025
    kind: rule
    title: Tests cannot substitute for protected product acceptance
    modality: must_not
    statement: A same-user fixture, mock transport, unit test, file-presence check, prose match, or evidence record is claimed as successful protected product behavior or security readiness.
    condition: Whenever protected-local acceptance is reported.
    failure: Report only the behavior actually exercised and keep unrun product connectivity unverified.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r026
    kind: rule
    title: D2 local-development Runtime is per-user and non-elevated
    modality: must
    statement: The Windows and macOS D2 local-development journey runs Runtime for the current OS user without elevation, LocalSystem, service SID, root, sudo, system account, LaunchDaemon, or another privileged machine-wide identity, and supported App protection relies on the exact Desktop Host launch relation plus Runtime admission rather than an OS sandbox; this rule does not retire or redefine separately owned production deployment topology.
    condition: Whenever the D2 local-development Runtime process and local endpoint are launched or connected.
    failure: Keep D2 protected App access unavailable when the per-user endpoint or exact Host relation cannot be established and do not substitute the production service topology as a D2 prerequisite.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r027
    kind: rule
    title: D2 per-user Runtime lifecycle uses thin platform adapters
    modality: must
    statement: An independent current-user source-development supervisor owns D2 local-development per-user Runtime launch and process observation through bounded platform-native lifecycle adapters; Desktop remains a protected local IPC consumer and owns Desktop-supervised Host and App launch admission, Runtime and Desktop continue to use bounded local IPC and peer-identity adapters, and the supervisor owns no App access, registration, declaration, session, owner execution, or authorization state and does not redefine the separate production service topology.
    condition: Whenever Windows or macOS implements the D2 local-development Runtime lifecycle or protected local IPC.
    failure: Reject Desktop-owned D2 Runtime lifecycle, a platform-specific D2 security architecture, production-service prerequisite, supervisor-owned App, session, or owner-operation authority, or adapter-owned App authorization state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r028
    kind: rule
    title: Runtime owns each Desktop account authorization attempt
    modality: must
    statement: RuntimeAccountService creates and owns each Desktop account authorization attempt, including the canonical Realm authorize URL, PKCE verifier and S256 challenge, state, nonce, exact loopback callback URI, creation and expiry bounds, and one-time consumption state; Desktop receives only the authorize URL and opaque attempt projection and never constructs or repairs an authorize URL.
    condition: Whenever Desktop begins a Nimi account login, reauthentication, or switch-account journey.
    failure: Reject an attempt not created by RuntimeAccountService, a caller-supplied verifier, state, nonce, callback URI, or authorize URL, and any fallback to a direct Web login route.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r029
    kind: rule
    title: Runtime exclusively completes Desktop account authorization
    modality: must
    statement: RuntimeAccountService alone validates the exact pending attempt, callback URI, state, nonce, expiry, and unused status, consumes the attempt once, exchanges the authorization code with Realm, validates the resulting account identity, and places access and refresh material in local Runtime custody before publishing a minimal account projection.
    condition: Whenever the Desktop loopback callback carries an authorization result.
    failure: Fail closed on missing, expired, replayed, consumed, state-mismatched, nonce-mismatched, callback-mismatched, token-bearing, or otherwise owner-invalid completion without changing the authenticated projection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r030
    kind: rule
    title: Account truth and browser carriage remain separated
    modality: must
    statement: Realm remains the independent owner of user identity and the authorization decision, Web owns only the user-facing credential interaction, Desktop owns only typed browser launch and loopback callback carriage plus account projection intent, and RuntimeAccountService owns the local authorization transaction, code exchange, refresh, restart recovery, and token custody without transferring bearer material to Web or Desktop.
    condition: Whenever a Nimi account browser authorization crosses Realm, Web, Desktop, and Runtime.
    failure: Reject Web-owned or Desktop-owned account truth, Web or Desktop code exchange, renderer token access, or a second SDK session truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r031
    kind: rule
    title: Account transition invalidation is fail closed
    modality: must
    statement: Logout, account switch, unrecoverable refresh failure, expired authorization, or invalid callback atomically invalidates the affected Runtime account custody and dependent local account projection before any replacement is admitted, restart recovery validates owner-held custody before republishing it, and switch-account causes the next Runtime-owned authorization attempt to require fresh account selection.
    condition: Whenever Runtime restores, expires, logs out, switches, or replaces a local account session.
    failure: Keep the account unauthenticated or unavailable and reject stale projection reuse, replay, silent recovery, or switch without a fresh owner-issued attempt.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
