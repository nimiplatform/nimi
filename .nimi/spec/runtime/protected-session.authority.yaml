format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.protected-session
units:
  - id: definition.nimi.runtime.protected-session.protected-local-session-plane
    kind: definition
    title: Runtime protected local session plane
    meaning: The Runtime protected local session plane establishes a verified local caller, live process, App, account, and session for protected operations without trusting localhost, caller fields, renderer metadata, portable bearers, or implementation-specific transport names.
  - id: definition.nimi.runtime.protected-session.account-session-plane
    kind: definition
    title: Runtime account session plane
    meaning: The Runtime account session plane owns the current local Runtime account projection, Realm App-path token custody, Provider Credential custody, session-derived App authorization, revocation, and Runtime-mediated Realm access for Desktop-hosted Local Apps.
  - id: definition.nimi.runtime.protected-session.config-plane
    kind: definition
    title: Protected host and service plane
    meaning: The protected host and service plane owns trusted installation, Runtime service identity, sensitive OS operations, service control, protected configuration and data-root access, while Nimi Home capabilities belong to a replaceable Home Host Contract rather than Desktop identity.
  - id: definition.nimi.runtime.protected-session.rpc-plane
    kind: definition
    title: Protected Runtime operation plane
    meaning: The protected Runtime operation plane exposes typed owner operations only after the verified session and operation owner admit them; concrete transport, method membership, framing, and operating-system mechanisms remain implementation details.
  - id: rule.nimi.runtime.protected-session.r001
    kind: rule
    title: Runtime owns protected session truth
    modality: must
    statement: Runtime is the sole owner of protected local session truth, current account projection, App identity resolution, and operation authorization; SDK, Kit, Nimi Home, Desktop, Avatar, and Apps consume typed projections and never restate those facts.
    condition: Whenever protected local session authority is interpreted.
    failure: Reject consumer-owned session, account, App, or authorization truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r002
    kind: rule
    title: Localhost is not trusted
    modality: must_not
    statement: A loopback address, local user, App id, caller enum, manifest, source-host string, renderer metadata, request field, or portable bearer proves protected origin.
    condition: Whenever a protected caller is admitted.
    failure: Fail closed unless Runtime verifies the protected connection, live caller, App, session, and owner authorization.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r003
    kind: rule
    title: Runtime protected custody is isolated
    modality: must
    statement: Production Runtime runs under an isolated non-interactive service identity with protected memory, credential custody, configuration, and data unavailable to ordinary interactive users, renderers, and Apps.
    condition: Whenever production Runtime loads protected state or opens protected access.
    failure: Fail closed before loading credentials or accepting protected operations when isolation is unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r004
    kind: rule
    title: Platform order is explicit
    modality: must
    statement: Windows is the current product-closure platform, macOS follows with the same public product semantics through independently suitable native security, and Linux remains deferred and non-blocking.
    condition: Whenever platform readiness or protected-local support is planned.
    failure: Reject Linux or complete macOS implementation as a prerequisite for the current Windows closure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r005
    kind: rule
    title: Native mechanisms do not change product semantics
    modality: must
    statement: Each supported operating system may use different native identity, transport, custody, installation, and service-control mechanisms, but those mechanisms do not alter SDK, Kit, App, Nimi Home, LocalAgent, or permission semantics.
    condition: Whenever a platform-specific protected-local implementation is selected.
    failure: Reject a platform-specific product ontology or public API.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r006
    kind: rule
    title: Trusted installation owns Runtime service lifecycle
    modality: must
    statement: Trusted installation and update authority owns Runtime service identity, installation, replacement, and uninstall; the current Home host may request typed status or restart through the protected host boundary but does not select the Runtime executable, directly own the service, or couple Runtime lifetime to Desktop lifetime.
    condition: Whenever Runtime installation, update, restart, or service status is requested.
    failure: Reject App or renderer service control and Desktop ownership of Runtime lifetime.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r007
    kind: rule
    title: Service-control success requires observed state
    modality: must
    statement: A service-control acknowledgement is not product success; the Home host projects success only after observing the requested Runtime state through a fresh verified protected session.
    condition: Whenever service start, restart, repair, or status is projected.
    failure: Keep the operation pending or failed rather than synthesize success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r008
    kind: rule
    title: Desktop is a replaceable Home host
    modality: must
    statement: Desktop is the current implementation of the replaceable Nimi Home Host Contract and receives no immutable authority over Realm, Runtime, LocalAgent, App, permission, credential, installation, or service truth merely because it is first party.
    condition: Whenever Desktop or another Home host requests protected capability.
    failure: Reject Desktop-identity privilege and require the verified host role and operation owner decision.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r009
    kind: rule
    title: Renderer code receives no protected authority
    modality: must_not
    statement: Renderer code receives or constructs protected endpoints, service identity, process proof, session proof, Realm JWT, Provider Credential, account principal, authorization decision, service-control authority, or generic Runtime forwarding.
    condition: Whenever a host exposes protected functionality to UI code.
    failure: Keep authority in the verified native host and expose only typed bounded results.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r010
    kind: rule
    title: Runtime owns App-path credentials
    modality: must
    statement: Runtime alone holds and refreshes Realm App-path tokens, Provider Credentials, connector credentials, and protected AI secrets used by scaffolded Desktop-hosted Local Apps.
    condition: Whenever a scaffolded Local App accesses Realm, AI, or a credentialed provider capability.
    failure: Reject credential projection, App-side refresh, or provider-secret custody.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r011
    kind: rule
    title: Scaffolded Realm access is mediated
    modality: must
    statement: A Desktop-hosted App Tools scaffolded Local App uses the standard SDK and Runtime-mediated Realm access without receiving, reading, storing, or refreshing a Realm JWT or maintaining a Runtime session proof.
    condition: Whenever a scaffolded Local App requests Realm data.
    failure: Fail closed when the current Runtime account, App session, authorization, or Realm access is unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r012
    kind: rule
    title: Direct SDK token custody stays outside Local Apps
    modality: must
    statement: A direct SDK App, script, or small program may obtain and maintain its Realm token through standard Auth, but that direct token path is not admitted inside a Desktop-hosted App Tools scaffolded Local App.
    condition: Whenever direct SDK and scaffolded access paths are composed.
    failure: Reject direct token inputs in the scaffolded Local App path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r013
    kind: rule
    title: Caller identity is session derived
    modality: must
    statement: Runtime derives the current account, App identity, and authorization state from the active verified session; an App cannot declare accountId, subject, App privilege, grant, permission state, or trusted host identity through an ordinary request.
    condition: Whenever Runtime authorizes a protected App operation.
    failure: Reject caller-supplied identity or authorization as non-authoritative.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r014
    kind: rule
    title: LocalAgent access uses current session decisions
    modality: must
    statement: A Local App LocalAgent operation uses the active session-derived account, App identity and authorization, explicit localAgentId, and requested operation, and Runtime verifies account ownership or access before execution.
    condition: Whenever a Local App requests a LocalAgent operation.
    failure: Fail closed when any session-derived input or ownership decision is missing.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r016
    kind: rule
    title: Stale access is revoked
    modality: must
    statement: Process exit, caller replacement, protected connection loss, account switch, logout, Runtime restart, App removal, permission revoke, authorization expiry, or trust loss invalidates old protected access before a later operation or event is accepted.
    condition: Whenever a protected session dependency changes.
    failure: Reject stale calls and close stale streams without anonymous or cached fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r017
    kind: rule
    title: Fresh sessions do not restore prior authority
    modality: must
    statement: Reconnection establishes a fresh verified session and re-evaluates current owner authorization; it never copies, revives, or infers prior account, App, permission, LocalAgent, or operation authority.
    condition: Whenever a caller reconnects after invalidation.
    failure: Reject restored authority based only on previous success or cached session state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r018
    kind: rule
    title: Protected operations are owner bounded
    modality: must
    statement: A verified session is necessary but not sufficient for a protected operation; the current App authorization, target ownership or access, and owning product policy must also admit the operation.
    condition: Whenever Runtime dispatches a protected operation.
    failure: Return typed unavailable or permission failure before owner mutation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r019
    kind: rule
    title: No fixed RPC membership is product authority
    modality: must_not
    statement: Cross-layer product authority is defined by a concrete RPC membership list, transport class name, framing length, caller enum, operating-system object, or language-specific method matrix.
    condition: Whenever protected product semantics are documented.
    failure: Keep the product security outcome here and leave implementation membership to the owning Runtime contract and code.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r020
    kind: rule
    title: Missing protected access fails closed
    modality: must
    statement: Unavailable verification, account state, App identity, authorization, credential custody, owner policy, or protected host capability yields a typed unavailable or permission failure with no public TCP, direct Realm, shared token, anonymous, fixture, renderer, or mock-success fallback.
    condition: Whenever a protected prerequisite is missing.
    failure: Return the typed failure without executing the operation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.rpc-plane
  - id: rule.nimi.runtime.protected-session.r021
    kind: rule
    title: Security audit follows real owner actions
    modality: must
    statement: Authentication, account transition, authorization decision, credential access, sensitive host operation, service-control request, revocation, and rejected protected access produce owner-appropriate audit without secrets or portable authority material.
    condition: Whenever a security-relevant protected action occurs.
    failure: Reject secret-bearing audit and do not replace owner behavior with evidence-only success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.account-session-plane
  - id: rule.nimi.runtime.protected-session.r022
    kind: rule
    title: Protected configuration stays service owned
    modality: must
    statement: Runtime protected configuration and secrets use service-owned storage, least-privilege access, atomic validated updates, and fail-closed loading; Apps and renderers receive typed projections rather than raw paths or secret values.
    condition: Whenever protected Runtime configuration is read or changed.
    failure: Reject user-writable production truth, partial updates, raw-path disclosure, and secret projection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r023
    kind: rule
    title: Avatar is an independent first-party projection
    modality: must
    statement: Avatar may use its own verified first-party host session to consume Runtime-authorized LocalAgent state, voice, and presentation projections without a live Desktop process, Desktop account-control privilege, Realm JWT, Provider Credential, or caller-supplied account truth.
    condition: Whenever Avatar opens protected Runtime access.
    failure: Reject Desktop identity inheritance, independent account truth, or direct LocalAgent execution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
  - id: rule.nimi.runtime.protected-session.r024
    kind: rule
    title: Ordinary product support remains reachable
    modality: must
    statement: A failure in Local AI readiness or a protected product capability does not hide the Nimi Home support, diagnostic, configuration, model acquisition, and repair surfaces required to recover it.
    condition: Whenever product readiness is incomplete.
    failure: Keep recovery surfaces available with truthful typed state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.config-plane
  - id: rule.nimi.runtime.protected-session.r025
    kind: rule
    title: Tests cannot substitute for protected product acceptance
    modality: must_not
    statement: A same-user fixture, mock transport, unit test, file-presence check, prose match, or evidence record is claimed as successful protected product behavior or security readiness.
    condition: Whenever protected-local acceptance is reported.
    failure: Report only the behavior actually exercised and keep unrun product connectivity unverified.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.protected-session.protected-local-session-plane
