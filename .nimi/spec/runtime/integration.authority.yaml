format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.integration
units:
  - id: definition.nimi.runtime.integration.call-plane
    kind: definition
    title: Integration invocation
    meaning: Runtime owns the common discovery, permission evaluation, dispatch, cancellation and bounded invocation facts for operations supplied by external services, selected executors or Nimi Apps. Ordinary Apps can call without a LocalAgent, Conversation or public business-task entity; operation-level asynchronous execution does not transfer the consumer App goal, plan, waiting or recovery to Runtime. Integration and Integration Operation name service or App operations, whereas AI Capability and CapabilityContract retain their existing model-inference semantics; an integration operation is neither an AI CapabilityContract nor a new AppOperationId, and a model function Tool is only an optional way to expose an operation to an Agent.
  - id: definition.nimi.runtime.integration.connection-plane
    kind: definition
    title: Shared connection and standing integration permission
    meaning: A connection identifies one selected external account and its declared execution and credential-custody location. A standing integration permission is Runtime-owned resource policy binding the current Nimi account, actual consumer Registered App Subject, integration operations and selected connection or provider target; it is separate from declaration-derived protected-session admission and supplies no portable credential.
  - id: definition.nimi.runtime.integration.provider-plane
    kind: definition
    title: Integration operation provider
    meaning: A provider exposes described operations, bounded input and output schemas and actual handlers or configured executors. Nimi App providers retain their object validation and business state and derive identity and handler lifetime from their protected Host session; a Skill explains use but creates no handler, account, permission or execution by itself.
  - id: definition.nimi.runtime.integration.native-configuration
    kind: definition
    title: Closed non-secret connection configuration
    meaning: "IntegrationConnectionConfig contains exactly one adapter-matching entry: mcp with endpoint, telegram with an empty object, weixin with an empty object, feishu with setupMode manual and appId for an existing domestic self-built bot, or setupMode create without an appId to begin official QR application registration; a completed created connection records its verified appId in manual mode, qqOfficial with appId for official QQ outbound WebSocket and API v2, or onebotV11 with listener and selfId for authenticated reverse WebSocket. App IDs and self IDs are lossless nonempty strings bounded to 256 bytes; OneBot listener is an explicitly selected IP and port 1–65535, defaulting to loopback; a non-loopback deployment remains authenticated with the configured token and exact self identity, and is never exposed or installed implicitly. Platform credentials are write-only secret in trusted management requests, never part of config or target projections. The old unstructured connection endpoint request field is removed, with no alternate interpretation or migration path."
  - id: definition.nimi.runtime.integration.native-operation-contract
    kind: definition
    title: Native messaging descriptors and bounded business values
    meaning: "Each of weixin, feishu, qq-official and onebot-v11 declares its own prefixed messages.send, messages.reply, updates.read and media.fetch; feishu additionally declares messages.update. Descriptors alone do not enable an unimplemented adapter. Send accepts one conversation with kind and lossless id, one body and optional opaque contextRef; conversation kinds are private for Weixin, chat/user for Feishu, c2c/group for QQ official and private/group for OneBot. Reply accepts one opaque replyRef and one body. Text body has kind text and text bounded to 32768 characters; image body has kind image and the caller-owned managed asset metadata; The first-batch file input shape has kind file with asset and fileName bounded to 255 characters; configured descriptors and execution must admit only the verified platform, recipient and selected protocol-end combinations. An unimplemented or unverified combination remains unavailable, never evidence that the entire platform does not support files. Feishu send/reply also admit a card body with bounded cardJson for initial creation; update accepts one messageId and a text or card body. Actual narrower platform constraints reject before dispatch, and undeclared protocol-end extensions or compound messages are unavailable; no arbitrary action is admitted. Send/reply/update output has confirmation provider-accepted or message-created and a string messageId, empty only if the confirmed provider response supplies no native ID; it does not claim recipient delivery. Updates input uses optional cursor/waitMs and optional conversations. Omitted conversations and an empty array select all new messages of the currently permitted target and share the same cursor filter binding; a nonempty array contains 1–64 unique conversation filter keys of kind:id, each at most 512 characters. Filters are reader views, not ACLs, and never grant another target, account or operation. Output contains cursor, at most 32 events and coverageGap empty/restart/reconnect. Event fields are eventId, conversation(kind,id), messageId, senderId, segments, replyRef, platformTime and receivedAt; missing native identifiers/times remain empty, segments preserve text with optional origin whose sole value platform-transcription identifies provider-supplied transcription without rewriting its text, mention(id,displayName) or image/file/audio/video(mediaRef,fileName,mediaType,sizeBytes), at most 64 segments. Events may contain at most 64 one-level references with messageId, title (1024 characters), text (32768 characters), optional relation parent/root denoting a provider-supplied reply relationship, optional platform-transcription origin, mediaKind empty/image/file/audio/video, fileName, contentStatus text-provided/media-provided/media-metadata-only/not-provided/unsupported, optional media containing at most 64 image/file/audio/video objects belonging to that reference with kind, mediaRef, fileName, mediaType and sizeBytes, and optional partialText(start,end,startIndex,endIndex,quoteMD5); partial text strings are bounded to 32768 characters, indices to nonnegative safe integers and quoteMD5 to 128 characters. Only media source material actually supplied in the current official event may acquire a fresh independent opaque mediaRef; this does not require a known original messageId. A reference media object has either a nonempty mediaRef or an empty mediaRef with unavailableReason source-not-provided/source-rejected; source acceptance is not a download or integrity confirmation, and a later expired or rejected download fails honestly. Missing reference IDs or content remain empty and are presented as unavailable; nested reference material is not followed, reference IDs and their media never inherit the current message replyRef or mediaRef, and no historic lookup or host cache is implied. Current-message media segments and all first-level reference media together contain at most 64 media objects and 64 private media sources; private source material per event remains bounded to 64 KiB in addition to the complete public event bound. The complete encoded event remains bounded to 64 KiB. No token, arbitrary URL, decryption key or private context escapes. Media fetch accepts mediaRef and relativePath, produces asset(relativePath,sha256,mediaType,sizeBytes,createdAt,modifiedAt) and integrity protocol-authenticated, transport-and-local-digest or decrypted-unverified according to actual provenance. Outbound asset metadata is relativePath, sha256 with sha256: plus 64 lowercase hex digits, mediaType and sizeBytes; all media obeys the 32-MiB ceiling and actual narrower platform bounds. Retry policy is none; cancellation support requests a stop without promising rollback."
  - id: rule.nimi.runtime.integration.admission
    kind: rule
    title: Shared calls preserve protected admission and independent resource permission
    modality: must
    statement: "Every App request first passes current protected ingress, exact operation classification and declaration coverage, then the integration owner applies the policy for that operation: discovery checks descriptor visibility; connection and permission configuration checks the user-authorized management scope; provider registration checks the current provider subject and exact Host; invocation checks the current account, consumer subject, standing integration permission, selected target and executor availability. For native messaging write invocations, each external request phase repeats current Account/session, target generation, permission and cancellation admission under the actual owner fences before dispatch; network IO remains outside those short fences. Discovery and first-time configuration do not require an already granted invocation permission or a running provider handler. Installing a source, discovering its descriptor, declaring AppAccess or loading a Skill alone grants no connection use; a consumer cannot approve itself."
    condition: Whenever an App discovers, configures or invokes an integration.
    failure: Reject missing, stale, foreign or self-asserted authority before dispatch without manufacturing a session or grant.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.integration.call-plane
      - type: applies_to
        target: definition.nimi.runtime.integration.connection-plane
  - id: rule.nimi.runtime.integration.public-carrier
    kind: rule
    title: Dynamic provider operations use a fixed protected carrier
    modality: must
    statement: The integration contract admits dynamic provider operation descriptions and schema-validated parameters through fixed typed protected public carriers; new provider business operations do not become new Runtime core business types. Exact carrier AppOperationIds and declaration coverage must enter the canonical App Operation Contract before public enablement; until then the new path is unavailable, never an arbitrary endpoint, raw owner RPC, legacy Conversation work or generic protected forwarding fallback. The semantic contract alone does not claim an implemented or released API.
    condition: Whenever an integration public surface is introduced or extended.
    failure: Keep an unmapped carrier unavailable and reject descriptor-based widening of protected ingress.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.runtime.integration.call-plane
  - id: rule.nimi.runtime.integration.standing-permission
    kind: rule
    title: One user choice permits ordinary continued use
    modality: must
    statement: A user may allow one or several actual App subjects to use selected operations and targets once; ordinary permitted reads, writes and background calls use that standing permission without per-invocation confirmation. Users can inspect and revoke it, revoking one consumer neither deletes a shared connection nor stops another permitted consumer, and compatible updates retain permission while changed account, credential custodian, execution location or newly widened operation scope requires the corresponding explicit user choice. Technical reconnect revalidates the same resource permission rather than issuing a new consent prompt.
    condition: Whenever integration permission is created, evaluated, updated or revoked.
    failure: Reject an out-of-scope new call, silent permission widening or consumer-side approval, and preserve unrelated consumers.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.integration.call-plane
      - type: applies_to
        target: definition.nimi.runtime.integration.connection-plane
  - id: rule.nimi.runtime.integration.custody
    kind: rule
    title: Consumers use connection references rather than account credentials
    modality: must
    statement: Runtime or the explicitly selected trusted executor retains raw external credentials; consumer configuration, standard results and logs expose only bounded connection references, account display facts and authorized business results. An invocation binds its selected connection and executor before dispatch and later defaults cannot redirect it. Nimi App providers reuse current account, subject and Host admission without a simulated external login. Managed-channel permission and audit do not claim an OS sandbox or oversight of App access outside that channel.
    condition: Whenever a connection is selected, dispatched or represented to a consumer.
    failure: Reject raw credential passthrough, silent connection substitution and unsupported whole-machine security claims.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.integration.connection-plane
      - type: applies_to
        target: definition.nimi.runtime.integration.provider-plane
  - id: rule.nimi.runtime.integration.description
    kind: rule
    title: Operation descriptions preserve actual provider semantics
    modality: must
    statement: An operation declares its purpose, bounded input and output schemas, effect, errors and supported cancellation or asynchronous-result behavior; supported safe retry or outcome query is stated per operation from the actual provider contract. Runtime validates current descriptions and does not infer permission, compatibility, retry safety or successful execution from a tool name, Skill, protocol extension or registry entry.
    condition: Whenever an operation is registered, discovered, invoked or updated.
    failure: Reject invalid or stale operation contracts and report unsupported behavior rather than inventing it.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.integration.call-plane
      - type: applies_to
        target: definition.nimi.runtime.integration.provider-plane
  - id: rule.nimi.runtime.integration.call-facts
    kind: rule
    title: One invocation owner records actual dispatch and outcome
    modality: must
    statement: Runtime preserves one bounded invocation record with actual consumer, provider, selected target, operation, dispatch and outcome correlation; a write is not dispatched unless its minimum call fact can be saved, and a query may report an explicit logging gap. Rejected-before-dispatch, accepted, completed, failed, canceled and outcome-unconfirmed remain distinguishable; credentials and full private bodies are excluded from ordinary logs, retention is finite and described, and a missing or expired record never proves that an effect did not occur.
    condition: Whenever a shared invocation is dispatched, recorded or queried.
    failure: Reject an unrecordable write before dispatch and return honest failure or uncertainty instead of fabricated completion.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.integration.call-plane
  - id: rule.nimi.runtime.integration.uncertain-effect
    kind: rule
    title: Unknown effects do not authorize blind resend
    modality: must
    statement: An uncertain external write uses only a provider-supported outcome query or genuinely safe same-operation retry; otherwise the caller receives unconfirmed and may stop for manual handling. Neither a repeated model suggestion nor similar parameters proves the prior call failed or defines business deduplication. An App choosing cross-run recovery preserves a queryable association before possible dispatch and checks the original invocation; missing correlation or cleaned records remain uncertain and do not require platform business recovery.
    condition: Whenever a write result is uncertain or an App elects to recover work.
    failure: Do not blindly resend an uncertain effect or claim exactly-once execution unsupported by the provider.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.integration.call-plane
  - id: rule.nimi.runtime.integration.provider-lifetime
    kind: rule
    title: App handlers exist only under their current protected Host
    modality: must
    statement: An App registers only operations it chooses to expose under its current protected account, subject and exact Host session; handler validity is distinct from discoverable description retention. The provider validates its own objects and performs the operation. Provider stop or session invalidation removes execution availability and fails or marks affected in-flight calls unconfirmed; Runtime neither launches the provider, reads its private database in its place nor returns a stale result as a new success.
    condition: Whenever an App-provided integration is registered, called or loses its executor.
    failure: Return typed unavailable, failure or uncertainty and reject stale or foreign handler results.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.integration.call-plane
      - type: applies_to
        target: definition.nimi.runtime.integration.provider-plane
  - id: rule.nimi.runtime.integration.call-cancellation
    kind: rule
    title: Cancellation is scoped to the particular invocation
    modality: must
    statement: A cancellation or expired consumer scope prevents new not-yet-admitted actions for that request without stopping the provider or other consumers. For an actually selected nested provider operation, Runtime-derived source and single-call cancellation context follow its associated downstream admission; the provider standing permission alone cannot restart canceled associated actions. Effects already admitted and impossible to retract keep their actual result, and late completion never advances a stopped consumer business task.
    condition: Whenever a call is canceled or a selected provider handler performs nested operations.
    failure: Reject new associated actions after cancellation or scope invalidation and avoid canceling unrelated work.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.integration.call-plane
      - type: applies_to
        target: definition.nimi.runtime.integration.provider-plane
  - id: rule.nimi.runtime.integration.inbound
    kind: rule
    title: Shared inbound reception has an explicit owner and finite support
    modality: must
    statement: A selected connector or executor owns upstream reception and any destructive acknowledgment cursor, then exposes its declared finite delivery or query behavior to authorized consumers; independent current-object queries may be used when the upstream supports them. Apps do not independently advance the same destructive upstream cursor. The integration states its consumer limit, no-consumer receive and acknowledgment policy, buffer retention and loss behavior; one invalid consumer cannot block remaining valid consumers, and upstream retention never implies indefinite recovery. Stopped, revoked or stale scopes receive no business-triggering events; reception neither starts an App nor resumes its tasks.
    condition: Whenever a shared operation needs external replies or events.
    failure: Reject conflicting cursor ownership, undeclared delivery guarantees and stale-consumer dispatch, and expose expiration or loss honestly.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.integration.call-plane
      - type: applies_to
        target: definition.nimi.runtime.integration.connection-plane
  - id: rule.nimi.runtime.integration.adapter-boundary
    kind: rule
    title: Existing protocols are adapters rather than workflow authority
    modality: must
    statement: Implementations may reuse suitable maintained protocol SDKs and provider clients, including an MCP adapter under the integration owner, while preserving the Nimi call, permission, custody and result contract. Authentication to an intermediary and to its downstream business account remain distinct. Protocol tasks represent only the supported individual operation; they never become Nimi-owned App goals. Optional adapters do not become ordinary LocalAgent readiness dependencies or imply admission of A2A or a universal workflow engine.
    condition: Whenever an external protocol or executor is integrated.
    failure: Return unsupported for an absent or incompatible adapter instead of private consumer bypass, invented support or workflow takeover.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.integration.call-plane
      - type: applies_to
        target: definition.nimi.runtime.integration.provider-plane
  - id: rule.nimi.runtime.integration.fixed-operations
    kind: rule
    title: Exact integration carrier and management boundary
    modality: must
    statement: RuntimeIntegrationService exposes runtime.integration.catalog.list, connection.list, call.invoke, call.get, call.list and call.cancel under integration.consume, provider.register, provider.unregister, provider.poll and provider.complete under integration.provide, and management.get, connection.put, connection.remove, permission.set and connection.setup.start/get/submit/cancel under integration.manage, where each abbreviated suffix has the runtime.integration prefix. Consumer calls use a Runtime-issued target reference and the current operation name and schema; a provider registers its bounded descriptor and polls and completes only its exact session calls. Management additionally requires the Runtime-derived built-in nimi.desktop formal App decision and a live verified Desktop connection attached by protected Desktop ingress after the desktop_account_product_v1 profile and DesktopSessionManager checks; request fields, a same-name App, self-declared integration.manage and ordinary LocalApp transport cannot construct this context or approve themselves. SDK and Kit expose the typed integration namespace without generic owner forwarding.
    condition: Whenever the Integration API is implemented or consumed.
    failure: Deny unmapped operations, cross-subject or stale calls, untrusted management and malformed schema input before effect dispatch.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.runtime.integration.call-plane
      - type: applies_to
        target: definition.nimi.runtime.integration.connection-plane
      - type: applies_to
        target: definition.nimi.runtime.integration.provider-plane
  - id: rule.nimi.runtime.integration.initial-adapters
    kind: rule
    title: Selected MCP and Telegram adapter behavior
    modality: must
    statement: The initial external integration adapters use the official Go MCP client for explicitly configured Streamable HTTP endpoints and a Telegram Bot API adapter for sendMessage and bounded updates.read. Runtime retains credential custody and owns the Telegram getUpdates offset; admitted readers have independent finite cursors over a shared connection buffer retained for at most twenty-four hours and one thousand updates. A live reader exists only for the bounded updates.read invocation, for at most twenty-five seconds; completion, single-call cancellation, consumer permission revocation or actual session invalidation ends that reader. With no live admitted readers the receiver stops new reception and does not advance upstream acknowledgment; a missing or expired cursor reports loss, one stopped reader does not block another, and getUpdates or its destructive offset is never directly exposed as a consumer operation. A Telegram webhook conflict fails visibly without deleting the webhook, sendMessage with an indeterminate outcome is unconfirmed and is not automatically retried, and MCP tool annotations do not grant permission or establish safe retry. The first App provider exposes a bounded Go result-version read with no nested operations.
    condition: Whenever one of the initial selected adapters is configured or invoked.
    failure: Report absent account or executor, protocol mismatch, conflicting receiver, expired cursor or unconfirmed effect accurately without a simulated result or workflow takeover.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.integration.call-plane
      - type: applies_to
        target: definition.nimi.runtime.integration.connection-plane
      - type: applies_to
        target: definition.nimi.runtime.integration.provider-plane
  - id: rule.nimi.runtime.integration.final-publication
    kind: rule
    title: External read publication and resource revocation share one commit boundary
    modality: must
    statement: External read completion and managed inbound media publication serialize with single-call cancellation, target removal, credential generation changes and consumer resource permission revocation at the Integration owner. Immediately before committing the result or publishing a prepared asset, Runtime revalidates the exact live protected scope, current account, actual consumer subject, captured target identity and generation, and operation permission inside that boundary. Current account generation is fenced by the Account owner mutation lock during final publication, without relying on asynchronous session-watcher invalidation. A stop that wins prevents publishing new private bodies or media references through call.get and prevents a candidate from becoming a listable or readable asset; a successful commit that wins retains its actual completed fact. If an asset has actually been published but terminal recording fails, its owned asset attribution remains available with an unconfirmed fact; recording failure never rewrites that publication as an asset-free cancellation. Network work, decryption and large copying occur before the short commit boundary. Writes already admitted to the provider retain their real effect classification instead of being represented as an effect-free cancellation.
    condition: Whenever an external operation publishes a read result or commits inbound media to the invoking App asset partition.
    failure: Discard stopped read results, clean unpublished candidates and report cancellation or uncertainty honestly without late body or asset exposure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
      - type: applies_to
        target: definition.nimi.runtime.integration.call-plane
      - type: applies_to
        target: definition.nimi.runtime.integration.connection-plane
  - id: rule.nimi.runtime.integration.effect-outcome
    kind: rule
    title: Adapter outcomes distinguish rejected and unknown effects
    modality: must
    statement: Adapter execution returns an explicit effect outcome distinguishing not-dispatched, provider-rejected, provider-confirmed and effect-unknown. A confirmed and recorded operation completes at only the provider-supported confirmation level; a definite rejection fails even after transport dispatch; a possibly effective write with lost or unrecordable results is unconfirmed and is never automatically resent. HTTP success, a locally generated request identifier, OneBot echo or async acknowledgment alone does not confirm a requested write, supply a native message ID, or prove recipient delivery. One invocation produces at most one native message and rejects unsupported compound input before dispatch without splitting, content changes, recipient changes or hidden retries.
    condition: Whenever an external adapter executes an operation or maps its result to call facts.
    failure: Reject unsupported input and retain unknown effects without fabricated receipts or completed results.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.integration.call-plane
      - type: applies_to
        target: definition.nimi.runtime.integration.provider-plane
  - id: rule.nimi.runtime.integration.native-messaging
    kind: rule
    title: Four native messaging adapters retain independent identities and bounded reception
    modality: must
    statement: The admitted native messaging adapter IDs are weixin for personal iLink private chats, feishu for domestic Feishu self-built bots, qq-official for official QQ C2C and permitted groups using outbound WebSocket and API v2, and onebot-v11 for an explicitly selected OneBot v11 implementation using authenticated reverse WebSocket. Their protocol identities and capabilities remain independent; QQ official and OneBot never substitute for one another. Feishu incoming p2p and group conversations retain kind chat and the actual chat_id, while senderId retains the sender open_id; explicit kind user selects an open_id for deliberate outbound sending and is never a fallback or alias for an incoming chat. Within retained feed bounds Feishu deduplicates by message_id; public eventId remains the actual header.event_id of the first retained delivery, and duplicate delivery neither advances the reader position nor replaces existing reply or media refs. Runtime owns one receiver per actual upstream identity across current Nimi accounts and rejects duplicate reception without exposing another account. Shared normalized feeds retain at most twenty-four hours, one thousand events and 64 MiB, with events bounded to 64 KiB and read pages to thirty-two events and 900 KiB encoded; each reader lasts at most twenty-five seconds and has an account, target, generation and filter bound opaque cursor. An explicit updates.read without conversation filters receives new messages from this currently permitted connection; omitted and empty conversations have the same binding, while changing to or between nonempty filters rejects the old cursor. Reception never implies a send or resumes old business work. Zero valid readers stop new reception and destructive acknowledgment. Buffer expiry, overflow and restart or reconnect coverage gaps are explicit and never establish offline replay or exactly-once delivery. Official SDK or protocol implementations remain Runtime dependencies rather than required AstrBot or OpenClaw hosts; absent implementations remain unavailable.
    condition: Whenever a native messaging connection or shared receiver is configured, discovered or consumed.
    failure: Reject identity conflicts, foreign or expired cursors, unsupported combinations and resource excess without silently dropping content or manufacturing platform support.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.integration.call-plane
      - type: applies_to
        target: definition.nimi.runtime.integration.connection-plane
  - id: rule.nimi.runtime.integration.connection-setup
    kind: rule
    title: Trusted Home owns bounded setup and verified same-identity refresh
    modality: must
    statement: The fixed runtime.integration.connection.setup.start, setup.get, setup.submit and setup.cancel operations require integration.manage and the same verified built-in Desktop ingress as connection.put. A setup session is bound to current account, actual Home subject, exact protected Host session and Runtime generation, selected adapter and optional target, expires after at most ten minutes, and exposes only bounded status, expiry, QR or verification link and sanitized account facts to Home. Canceled, expired or invalidated setup cannot commit a late connection or credential. Credential material remains Runtime-owned, New Weixin connection QR requests carry an empty local_token_list and read no existing credential. Only an explicit refresh of one selected existing Weixin target in the current Nimi account may capture and send that exact target bot token as a single-element local_token_list to the fixed official QR endpoint; it never enumerates or reads another target or account credential and never falls back to an empty list for re-pairing. Capture, request publication and final result remain bound to the setup account, actual Home subject, exact protected session and Runtime generation, and the selected target identity, configuration, credential generation and credential bytes must remain unchanged from capture through final admission, and domestic Feishu registration selects the official PersonalAgent archetype with preset explicitly false, exactly the app-identity tenant scopes im:message:send_as_bot, im:message.p2p_msg:readonly, im:message.group_at_msg:readonly, im:resource and im:message:readonly, and only the tenant event im.message.receive_v1, with no user scopes or user events. It requests neither the historical im:message.history:readonly scope nor the broader im:message scope. Platform-specific configuration is a bounded closed structured value rather than credentials or listener settings encoded in endpoint. Verified refresh of the same upstream identity and execution location preserves target and existing exact permissions while incrementing credential generation and draining old requests; a changed identity or execution location requires a new target and fresh user permission. Personal Weixin setup starts without a caller-provided display name; an omitted or blank Weixin displayName is admitted throughout SDK, Kit and Runtime and does not substitute for verified credentials. For a new Weixin connection with an omitted or blank displayName, successful setup persists a bounded nonempty default display from an actually supplied and validated official nickname or otherwise the confirmed bot-account identifier. An explicit local display or remark is not upstream identity; a nameless same-identity refresh preserves the current stored display. Other adapters retain their existing required names, including Feishu bot creation. Successful setup creates no consumer grant and technical reconnect resumes no business task. Setup uses the closed statuses awaiting-input, awaiting-confirmation, awaiting-new-target, verifying, completed, already-bound, failed, canceled and expired. Starting or submitting an unimplemented adapter returns typed unavailable, never a usable placeholder. Confirmed same-bot setup refresh increments generation even when credential bytes are unchanged; a compatible metadata-only connection.put does not imply credential refresh. A confirmed different bot always requires a new target even when the scanning user is the same. A valid different-bot candidate from an explicit Weixin refresh is held only in Runtime memory for the remaining lifetime of the same setup and projected as awaiting-new-target, with bounded sanitized candidate account facts, no QR or verification link and no success or error masquerading as confirmation. It creates or updates no target, credential or permission before a fresh explicit Home decision. The closed create-new-target action on setup.submit is mutually exclusive with secret and verificationCode and is admitted only for this waiting state; other states, unknown actions and mixed inputs fail closed. That action commits the verified candidate as one new target only after rechecking the original account, actual Home subject, exact protected session, Runtime generation, expiry and cancellation, and the captured original target identity, configuration, generation and credential bytes under final admission. Original target, credential, generation, permissions, history and business tasks remain unchanged, the new target inherits no consumer permission, and successful Home selection clears old App and operation selections. Cancellation, expiry, account or Host invalidation, Runtime restart, changed or removed original target, source-identity conflict or failed commit cannot activate a late candidate or leave a half-available connection. Repeated or concurrent confirmation creates at most one target. A failed historical setup is never revived or reused. Missing or different scanner facts never establish the old bot identity or permission continuity; only the same explicit new-target confirmation and fresh permission path may accept the candidate. The official binded_redirect response is admitted only for an explicitly selected single-token Weixin refresh after rechecking the complete setup and captured target under the final admission fence, and yields the distinct terminal already-bound status with the original target and sanitized account label. This status means the original connection is already bound and no update is needed; it writes no credential, target or permission, increments no generation, drains no request and resumes no business task. The same response without a selected target and captured valid token is rejected and never reported as completed or credential refresh. Setup management exposes setupId, adapter, targetRef, status, expiresAt, qrCodeUrl, verificationUrl, accountLabel and errorCode only.
    condition: Whenever Home starts, observes, submits, cancels or commits an external account setup or credential refresh.
    failure: Reject foreign, stale or unsupported setup, invalid configuration and identity substitution without creating a half-available connection or leaking credentials.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.runtime.integration.connection-plane
  - id: rule.nimi.runtime.integration.media-handoff
    kind: rule
    title: Messaging media uses current App-owned managed assets
    modality: must
    statement: Outbound messaging media names only relativePath, sha256, mediaType and sizeBytes in the invoking App managed asset partition; Runtime derives the owner from the protected scope, verifies metadata and pins one immutable source before asynchronous dispatch. Inbound events expose finite account, connection, generation and source-bound opaque mediaRef values with safe metadata and no remote credentials, URLs or keys. First-level reference media retains its reference ownership and receives an independent mediaRef only from actual event-supplied source material; media refs authorize fetching media, never replying or selecting the current message context, and reply/context refs never authorize media fetch. Explicit media.fetch checks the caller current source and operation permission, downloads and validates at most the smaller of the platform limit and 32 MiB and publishes a new non-overwriting asset in that caller partition through the final publication guard. Two authorized consumers may save separate copies of one source but cannot read another App asset. Filename, MIME and signature checks, bounded redirects, allowed protocol destinations, ciphertext and plaintext limits and exact integrity provenance remain adapter obligations; AES decryption and a local digest do not establish unavailable protocol authentication.
    condition: Whenever an Integration invocation reads outbound assets or retrieves inbound media.
    failure: Reject foreign assets or references, changed bytes, arbitrary filesystem paths or URLs, invalid media and stopped publication, leaving no new committed partial asset.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
      - type: applies_to
        target: definition.nimi.runtime.integration.call-plane
  - id: rule.nimi.runtime.integration.feishu-inbound-bounds
    kind: rule
    title: Feishu WebSocket limits precede allocation and task creation
    modality: must
    statement: Domestic Feishu reuses the selected official API and registration SDK with a Runtime-owned bounded WebSocket protocol receiver. Before provider-controlled allocation, fragment insertion or task creation, each connection enforces a 1-MiB frame limit, an 8-MiB and sixty-four-fragment assembled-message limit, at most eight assemblies with thirty-second fragment inactivity expiry, and at most thirty-two queued plus running handlers. A successful acknowledgment follows committed normalized buffer insertion; fragment expiry visibly fails the connection or reports a gap, and excess or interrupted processing exposes loss or connection failure without assuming upstream redelivery. The unbounded SDK ws.Client receive entry is not used and installed dependencies or module caches are not patched.
    condition: Whenever Feishu WebSocket input is read, assembled, dispatched or acknowledged.
    failure: Bound or stop processing before excess allocation and report coverage gaps without callback-only limiting or false receipt claims.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.integration.connection-plane
  - id: rule.nimi.runtime.integration.qq-onebot-protocol
    kind: rule
    title: QQ official and OneBot retain bounded independent protocol sessions
    modality: must
    statement: QQ official uses the authenticated application identity, official outbound gateway HELLO, IDENTIFY with group and C2C intents, heartbeat acknowledgment, committed sequence and optional in-memory RESUME on a new explicit reader; invalid sessions discard resume state and no technical reconnect restores an old business invocation. Current QQ send admission requires a current source context for the exact conversation and connection generation; absent context rejects active pushing without asserting permanent platform-wide unavailability. C2C contexts expire sixty minutes and group contexts five minutes after actual source time; missing source time never receives a local or reconnect-based extension. Five reply slots and distinct msg_seq values are shared by all consumers of the original message. Confirmed or uncertain dispatched writes retain their slot and never reuse a sequence; a definite rejection or effect-free stop releases only the slot. Its API v2 upload and message writes are single attempts, with each later external phase newly admitted and source and upload expiry checked before upload and final send; a missing or ambiguous native message receipt remains unconfirmed. OneBot v11 uses only the explicitly configured listener, nonempty bearer authentication, exact numeric self_id and declared API, Event or Universal roles, followed by actual get_login_info and get_version_info verification. Loopback permits plain WebSocket; a non-loopback listener requires actual transport protection before use. Duplicate roles and Universal versus split-role conflicts are refused. A physical socket owns at most thirty-two pending actions, with unique generation-bound echo values; missing, wrong or old echo never confirms another request, disconnect never replays it, and status and retcode are interpreted together. Only ok with retcode zero and the required actual receipt confirms a write; async or an inconsistent result remains unconfirmed. Protocol socket input is bounded to 1 MiB before decoding; OneBot image output uses at most 4 MiB of owned bytes inside bounded protocol encoding, and QQ inline uploads at most 20 MiB. Runtime reserves at most four encoders and 128 MiB for their complete byte and serialization envelope before buffering, and at most eight active OneBot listeners before binding, each admitting at most eight TCP connections before HTTP task creation. A listener or API-only transport serves current admitted setup, reader or write work; with no admitted work its sockets and listener close. API transport needed by a write does not authorize normalized event reception, buffering or acknowledgment without a valid reader. A new explicit operation can open a fresh verified transport, with coverage gaps exposed. OneBot file extensions are admitted only after verifying the selected implementation and version; protocol-end local paths are never Runtime filesystem paths, and no generic file relay, arbitrary action or public base64 value is introduced.
    condition: Whenever QQ official or OneBot setup, socket traffic, media encoding or message outcomes are processed.
    failure: Reject unauthenticated identity, role conflicts, unprotected remote listeners, excess resources and unverifiable file combinations; retain unknown outcomes without fabricated receipts or automatic retries.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.integration.call-plane
      - type: applies_to
        target: definition.nimi.runtime.integration.connection-plane
      - type: applies_to
        target: definition.nimi.runtime.integration.native-operation-contract
