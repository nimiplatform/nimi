format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.local-compute
units:
  - id: definition.nimi.runtime.local-compute.device-profile-plane
    kind: definition
    title: Runtime device profile plane
    meaning: The Runtime device profile plane owns LocalDeviceProfile collection and freshness, GPU, NPU, Python, disk, and port probing semantics, recommendation and installation warnings, and Runtime-private ExecutionHost admission facts without becoming AIConfig route, machine selection, standardized-feature support, or capability readiness authority.
  - id: definition.nimi.runtime.local-compute.asset-storage-manifest-plane
    kind: definition
    title: Runtime local asset storage manifest plane
    meaning: The Runtime local asset storage manifest plane owns the managed models root layout, the unified asset manifest entry and intake schema, manifest validation and import path truth, and the local artifact format policy.
  - id: definition.nimi.runtime.local-compute.catalog-recommendation-plane
    kind: definition
    title: Runtime local catalog recommendation plane
    meaning: The Runtime local catalog recommendation plane owns non-binding catalog search ordering, recommendation payloads, format-aware variant descriptors, media and LLM fit evidence, community catalog access, and local download planning without selecting a Local Capability Configuration, CapabilityImplementation, Driver, binding, route, or standardized-feature support.
  - id: definition.nimi.runtime.local-compute.category-capability-plane
    kind: definition
    title: Runtime local category capability plane
    meaning: The Runtime local category capability plane owns concrete verified LocalAsset inventory, local install and import semantics, verified content projection, install-plan diagnostics, and private Service and Node execution projections without owning Local Capability Configuration, machine selection, Driver selection, route, feature support, or capability admission.
  - id: definition.nimi.runtime.local-compute.local-engine-plane
    kind: definition
    title: Runtime local engine plane
    meaning: The Runtime local engine plane owns Runtime-private ExecutionHost taxonomy, runtime modes, attached endpoint constraints, supervised process state, data-plane materialization roots for engine packages and dependency-profile capsules, and bootstrap download custody; public product configuration names the CapabilityImplementationDriver and dialect rather than choosing this Host taxonomy.
  - id: definition.nimi.runtime.local-compute.engine-protocol-health-plane
    kind: definition
    title: Runtime-private engine protocol and supervision plane
    meaning: The Runtime-private engine protocol and supervision plane owns exact pre-start ExecutionHost endpoint materialization, llama and sidecar protocol baselines, internal process reachability and recovery probes, attached-engine credential custody, engine HTTP failure mapping, and stream downgrade simulation; endpoint materialization may use private deterministic configuration or controlled allocation but promises no product-level fixed default port, and its process, endpoint, probe, warm, resident, and health facts never become product readiness, AIConfig route, machine selection, Local Capability Configuration validity, standardized-feature support, or fallback authority.
  - id: rule.nimi.runtime.local-compute.r001
    kind: rule
    title: Device profile structure is fixed
    modality: must
    statement: LocalDeviceProfile carries os, arch, total_ram_bytes, available_ram_bytes, gpu, python, npu, disk_free_bytes, and ports, the gpu profile carries available, vendor, model, memory_model limited to discrete, unified, or unknown, plus optional total_vram_bytes and available_vram_bytes that stay empty when not reliably probed, and CollectDeviceProfile returns the complete current device snapshot.
    condition: Whenever a device profile is collected or returned.
    failure: Reject profiles missing required fields or carrying fabricated hardware values.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.device-profile-plane
  - id: rule.nimi.runtime.local-compute.r002
    kind: rule
    title: GPU detection order is fixed
    modality: must
    statement: GPU detection tries the NVIDIA command-line probe first and on success reports vendor nvidia with memory_model discrete and VRAM values from the probe, otherwise an Apple silicon unified-memory host reports vendor apple with memory_model unified, a best-effort chip model from an OS probe, and VRAM values that may reuse host RAM metrics, and any other outcome reports available false with memory_model unknown and empty VRAM values.
    condition: Whenever Runtime detects GPU hardware for the device profile.
    failure: Reject GPU results outside the declared detection order or with guessed vendor or memory values.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.device-profile-plane
  - id: rule.nimi.runtime.local-compute.r003
    kind: rule
    title: Unprobeable acceleration is low confidence
    modality: must
    statement: When the host cannot reliably report VRAM or unified-memory figures CollectDeviceProfile still succeeds with the affected values left empty, consumers treat the result as a low-confidence hardware profile rather than defaulting to zero, and accelerator vendors without an implemented probe report unavailable instead of inferred capacity.
    condition: Whenever hardware capacity cannot be reliably probed.
    failure: Reject errors, zero defaults, or fabricated capacity for unprobeable hardware.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.device-profile-plane
  - id: rule.nimi.runtime.local-compute.r004
    kind: rule
    title: NPU detection is environment driven
    modality: must
    statement: NPU detection reads only the NIMI_NPU_AVAILABLE, NIMI_NPU_READY, NIMI_NPU_VENDOR, and NIMI_NPU_RUNTIME environment variables with ready honored only while available is true, performs no OS-level NPU hardware probing, and reports available false and ready false when the variables are absent.
    condition: Whenever Runtime detects NPU state for the device profile.
    failure: Reject OS-probe-derived or defaulted NPU availability.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.device-profile-plane
  - id: rule.nimi.runtime.local-compute.r005
    kind: rule
    title: Python and diagnostic port probing are bounded
    modality: must
    statement: Python detection tries python3 then python version parsing and reports available false when both fail, while diagnostic port availability is judged only for an explicit bounded Runtime-private candidate set by a loopback TCP bind attempt released immediately on success; no default engine port list is promised, and the probe never materializes, selects, infers, or publishes an ExecutionHost endpoint.
    condition: Whenever Python runtime or port availability is probed.
    failure: Reject availability conclusions not backed by the declared probe.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.device-profile-plane
  - id: rule.nimi.runtime.local-compute.r006
    kind: rule
    title: Compatibility warnings never block install
    modality: must
    statement: Install plan resolution derives WARN_GPU_REQUIRED, WARN_PYTHON_REQUIRED, and WARN_NPU_REQUIRED warnings from engine-name traits against GPU, Python, and NPU availability, emits them only in the install plan descriptor warnings, and never blocks installation on a warning alone.
    condition: Whenever hardware-engine compatibility is evaluated for an install plan.
    failure: Reject silent warning loss or installs blocked by warnings alone.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.device-profile-plane
  - id: rule.nimi.runtime.local-compute.r007
    kind: rule
    title: Device profile truth is fresh and single
    modality: must
    statement: The device profile is collected live without a persistent cache at CollectDeviceProfile, when an explicit local install or recommendation action requests current host facts, and at request-time Runtime-private ExecutionHost admission when current compatibility matters, recommendation and install diagnostics share the same LocalDeviceProfile truth without a second product hardware truth, and profile import, Apply Profile to AIConfig, AIConfig route selection, Local Capability Configuration save, and machine local configuration selection neither collect a device profile nor treat probe success as configuration or selection truth.
    condition: Whenever a consumer needs current device hardware truth.
    failure: Reject stale cached profiles, parallel product hardware truth, and probes coupled to profile, configuration, route, or selection actions.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.device-profile-plane
  - id: rule.nimi.runtime.local-compute.r008
    kind: rule
    title: Asset storage layout is fixed
    modality: must
    statement: The Runtime managed models root contains the objects, sources, recipes, resolved, and cache subtrees, the resolved tree holds one directory per local asset whose asset.manifest.json is the single canonical bundle entry for every asset kind, original filenames and nested directory structures are preserved rather than content-addressed renames, legacy manifest names are rejected as public import or install entries, and bare-file intake never treats the resolved tree as orphan or unregistered candidates.
    condition: Whenever local asset storage is laid out, imported, or scanned.
    failure: Reject undeclared layouts, legacy manifest entries, and orphan classification of resolved assets.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.asset-storage-manifest-plane
  - id: rule.nimi.runtime.local-compute.r009
    kind: rule
    title: Manifest intake schema is unified
    modality: must
    statement: Stable public LocalAsset intake accepts only verified concrete-content manifests whose top-level stable identity fields are asset_id and kind, whose artifact facts may include logical_model_id and artifact_roles for provenance and display, and whose manifest never owns preferred or fallback engine choice, CapabilityImplementationDriver selection, standardized-feature support, Local Capability Configuration, binding, machine selection, route, residency, or readiness.
    condition: Whenever a local asset manifest is authored, imported, or emitted on a stable surface.
    failure: Fail closed on legacy manifest names, shapes, aliases, unverified identity, or execution-selection truth in the manifest.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.asset-storage-manifest-plane
  - id: rule.nimi.runtime.local-compute.r010
    kind: rule
    title: Manifest validation and import path truth fail closed
    modality: must
    statement: Manifest validation requires non-empty schema_version, engine, entry, files, license, source repo and revision, and hashes, the entry must exist in files, every hash key must reference an existing file with a non-empty value, runnable capability entries must be valid tokens under the capability vocabulary mapping, file paths reject absolute forms and parent traversal with backslashes normalized to forward slashes, an imported manifest's source repo must be the manifest's own file URL with resolved file truth derived only from the manifest parent directory plus entry, and any local-import source repo fails closed without slug, symlink, copy, or fallback-directory repair.
    condition: Whenever a local asset manifest is validated or an imported asset path is resolved.
    failure: Reject the manifest or import instead of repairing paths or identity heuristically.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.asset-storage-manifest-plane
  - id: rule.nimi.runtime.local-compute.r011
    kind: rule
    title: Format policy stays open with fixed entry selection
    modality: must
    statement: Local assets support both GGUF and SafeTensors artifacts without locking a single format, and llama engine entry selection prefers a gguf file, then model.safetensors, then any safetensors file.
    condition: Whenever local artifact formats are admitted or a llama entry is selected.
    failure: Reject single-format lockdown or entry selection outside the declared priority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.asset-storage-manifest-plane
  - id: rule.nimi.runtime.local-compute.r012
    kind: rule
    title: Local assets use the three-layer abstraction
    modality: must
    statement: A LocalAssetRecord identifies one concrete verified content record and its integrity, source, kind, family, artifact roles, install evidence, and bounded provenance or display metadata; Service and Node are Runtime-private ExecutionHost projections that are never persisted as capability configuration, Driver, binding, feature support, machine selection, route, readiness, or execution authority, and passive assets share install, remove, and transfer mechanics without becoming directly schedulable.
    condition: Whenever local asset, service, or node abstractions are stored or projected.
    failure: Reject an abstract or unverified LocalAsset, persisted Node truth, passive direct scheduling, or any asset or service field used as product selection or routing authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
  - id: rule.nimi.runtime.local-compute.r013
    kind: rule
    title: Service binding is one-to-one with bounded switching
    modality: must
    statement: One local model binds at most one Service, node catalogs are generated live from installed services at query time, a request-routed single-worker switch may rebind the sole resident supervised llama worker to an explicitly targeted model without relaxing the one-to-one constraint, and bounded multi-worker residency stays unadmitted until a dedicated cutover fixes service topology, engine truth, residency budget, and eviction semantics.
    condition: Whenever local model-to-service bindings or worker residency changes.
    failure: Reject one-to-many bindings and default multi-worker residency before the cutover.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
  - id: rule.nimi.runtime.local-compute.r014
    kind: rule
    title: Install registers and persists one identity
    modality: must
    statement: InstallVerifiedAsset, InstallModelFromPlan, and ImportLocalAsset register one concrete verified LocalAsset identity with integrity, kind, source, family, artifact roles, host requirements, and Runtime-private install metadata, mint a unique local installed-record handle, never synthesize passive public identity from a path or handle, and never create or update a Local Capability Configuration, exact binding, machine selection, Driver choice, route, supported-feature claim, warm state, or fallback engine list.
    condition: Whenever a local asset is installed or imported.
    failure: Reject installs missing verified identity, duplicate-identity reuse for file imports, or any install operation that silently becomes configuration, binding, selection, or routing success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
  - id: rule.nimi.runtime.local-compute.r015
    kind: rule
    title: Verified descriptors project catalog truth
    modality: must
    statement: Every LocalVerifiedAssetDescriptor field derives from the local provider catalog row and its local-plane block with asset_id taken from the variant identity, logical_model_id from the row model identity, kind and capabilities from row truth in canonical tokens, install facts from the install block, and files, hashes, and total size from the selected variant, Runtime keeps no in-process hardcoded verified metadata, and a projection missing integrity hashes fails closed without placeholder descriptors.
    condition: Whenever verified local asset metadata is projected or listed.
    failure: Fail closed on missing integrity material and delete parallel hardcoded verified truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
  - id: rule.nimi.runtime.local-compute.r016
    kind: rule
    title: Install plans gate every install path
    modality: must
    statement: ResolveModelInstallPlan collects the device profile, evaluates hardware-engine compatibility warnings, judges install availability as true only for attached mode with an explicit valid endpoint or supervised mode with a reachable engine binary and otherwise false with a reason code, fills engine-specific provider hints, and returns the plan descriptor, InstallModelFromPlan consumes only that descriptor shape and fails closed when install availability is false, no Desktop, Web, or Kit surface executes catalog or manual install outside this gate, and the verified catalog projection plus the Hugging Face community catalog remain the only catalog sources without forming a second verified catalog.
    condition: Whenever a local install plan is resolved or consumed.
    failure: Reject bypassed installs and plans with fabricated availability.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
  - id: rule.nimi.runtime.local-compute.r017
    kind: rule
    title: Custom assets require an invoke profile
    modality: must
    statement: A custom-declared local model missing its local_invoke_profile_id is marked unavailable and execution returns FAILED_PRECONDITION with AI_LOCAL_MODEL_PROFILE_MISSING.
    condition: Whenever a custom local model is projected or invoked without an invoke profile.
    failure: Return the exact typed failure instead of guessing request format or parameters.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
  - id: rule.nimi.runtime.local-compute.r018
    kind: rule
    title: Local unavailability mapping is exact
    modality: must
    statement: When no usable local model exists a probe path returns ok false with AI_LOCAL_MODEL_UNAVAILABLE, an execution path returns FAILED_PRECONDITION with AI_LOCAL_MODEL_UNAVAILABLE, and service lifecycle and probe paths use the service sibling codes AI_LOCAL_SERVICE_UNAVAILABLE, AI_LOCAL_SERVICE_ALREADY_INSTALLED, and AI_LOCAL_SERVICE_INVALID_TRANSITION.
    condition: Whenever local model or service unavailability is reported.
    failure: Return the exact typed mapping without generic or silent outcomes.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
  - id: rule.nimi.runtime.local-compute.r019
    kind: rule
    title: Speech bundle projection is layered and explicitly materialized
    modality: must
    statement: The ordinary-user local speech bundle is a product projection over Runtime-owned speech asset and service truth that keeps environment bootstrap, capability download, and persistent Host materialization as internal layers of one explicit setup or repair operation rather than independent install objects. Only a user-invoked setup, download, or repair action may begin network- or storage-heavy materialization after explicit confirmation; AIConfig route selection, Select Local Capability Configuration, route attempts, Job admission, page load, and passive probing never bootstrap an environment, download a capability, initialize a persistent Host, or accept confirmation on the user's behalf. Existing verified environments, caches, and materialized slices may be reused unless repair or removal demands otherwise, setup materializes only the explicitly requested capability without prefetching every speech slice, and an admitted Job may start an already-materialized private ExecutionHost on demand without creating product readiness, binding, machine-selection, or route truth.
    condition: Whenever the ordinary-user local speech bundle is projected, explicitly set up, downloaded, repaired, or used by a Job.
    failure: Fail closed awaiting an explicit setup or repair action and confirmation instead of coupling materialization to route, selection, admission, execution, page load, or probing or creating a second install owner.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
  - id: rule.nimi.runtime.local-compute.r020
    kind: rule
    title: Catalog search ordering is fixed
    modality: must
    statement: SearchCatalogModels orders verified rows before unverified rows and sorts case-insensitively by ascending title within each group, and neither recommendation metadata nor the recommendation feed surface rewrites this ordering.
    condition: Whenever catalog search results are ordered or presented.
    failure: Reject reordered results and recommendation-driven ordering rewrites.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r021
    kind: rule
    title: Recommendation payload is uniform and subordinate
    modality: must
    statement: SearchCatalogModels, ListCatalogVariants, and ResolveModelInstallPlan may attach one optional recommendation payload whose tier expresses main-model fit rather than end-to-end workflow readiness, whose host_support_class is limited to supported_supervised, attached_only, and unsupported, and whose confidence is limited to high, medium, and low, and the payload never overrides install availability, engine runtime mode, or existing warning and reason-code semantics.
    condition: Whenever a catalog surface returns recommendation metadata.
    failure: Reject undeclared payload values and recommendation overrides of install truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r022
    kind: rule
    title: Variant descriptors are format aware
    modality: must
    statement: A catalog variant descriptor carries filename, entry, files, and format plus optional size, sha256, and recommendation fields, GGUF variants support precise entry-level recommendation, and SafeTensors variants may carry only conservative repo-level or artifact-level recommendation exposed with low confidence.
    condition: Whenever catalog variants are listed or described.
    failure: Reject GGUF-only descriptor shapes and overconfident coarse recommendations.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r023
    kind: rule
    title: Media fit evaluation is bounded and honest
    modality: must
    statement: Media fit applies only to image and video main models without judging complete workflows, estimates memory from main artifact size, device profile RAM, VRAM, or unified memory, and engine-specific conservative overhead, counts hard prerequisites in estimates and notes without deciding the main tier, fixes the image baseline at 1024x1024 text-to-image and the video baseline at 720p four-second sixteen-fps text-to-video without audio, maps estimates within seventy, eighty-five, and one hundred percent of the host budget to recommended, runnable, and tight with beyond-budget as not_recommended, and lowers confidence with reasons on incomplete metadata or device profile instead of silently reporting high confidence.
    condition: Whenever media fit recommendation is computed.
    failure: Reject workflow-scope claims, undeclared baselines, and silent high-confidence fallbacks.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r024
    kind: rule
    title: LLM fit reuses shared truth and exposes inference
    modality: must
    statement: LLM fit maps the shared LocalDeviceProfile into a non-binding recommendation evaluator without a second hardware truth, may present conservative parameter, context, quantization, and confidence inferences with provenance, and may return an explicitly ordered recommendation set for user choice but never a fallback list, automatic binding, Local Capability Configuration, machine selection, supported-feature claim, or execution route.
    condition: Whenever LLM fit recommendation is computed.
    failure: Reject parallel hardware truth, hidden inference-derived confidence, or recommendation output consumed as binding, selection, routing, or fallback authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r025
    kind: rule
    title: Recommendation feed stays a bounded read surface
    modality: must
    statement: A capability-scoped recommendation feed may exist beside the catalog surface only when its candidate pools output install-bridge-ready entry metadata, RuntimeLocalService owns model index caches, installed-state projection, device-profile fit evaluation, and the final tier, host support, and confidence ordering with Desktop consuming SDK projections for rendering only, worker and index layers never become host-fit, readiness, or install action truth, and feed items reuse the same recommendation payload semantics without a second recommendation contract.
    condition: Whenever a recommendation feed surface is served or consumed.
    failure: Reject feed-owned fit truth, second recommendation contracts, and worker-owned readiness.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r026
    kind: rule
    title: Hugging Face access is direct and normalized
    modality: must
    statement: Hugging Face is the sole community catalog source accessed through direct REST calls without hf-hub or Hugging Face hub SDK dependencies, repo identifiers in hf scheme, full URL, or bare org slash model form normalize internally to org slash model, artifact downloads construct resolve URLs from repo, revision, and file path on the huggingface.co host, and community search uses the models REST API with search, pipeline tag, and library filters under a twenty-second timeout and a result limit between one and eighty.
    condition: Whenever Runtime searches or downloads from the Hugging Face catalog.
    failure: Reject undeclared SDK dependencies, unnormalized repo identity, and out-of-bounds search parameters.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r027
    kind: rule
    title: HF capability inference fails closed
    modality: must
    statement: Hugging Face capability inference maps text-generation and text2text-generation to chat, text-to-image to image, text-to-video to video, text-to-speech and text-to-audio to tts, automatic-speech-recognition to stt, and feature-extraction and sentence-similarity to embedding, and a row whose pipeline tag and tags match nothing is treated as missing capability evidence that never defaults to chat and never enters installable or executable catalog projections.
    condition: Whenever community model capabilities are inferred from catalog metadata.
    failure: Fail closed on unmatched rows instead of defaulting capabilities.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r028
    kind: rule
    title: HF source recommendations split portable and runtime truth
    modality: must
    statement: An AIProfile local implementation configuration intent may carry one portable Hugging Face source recommendation with repo identity, repo type, revision, file, directory, or manifest entries, access-policy metadata, format and variant hints, and optional expected integrity, but the recommendation is neither a LocalAsset binding nor proof that content exists; Runtime exclusively owns auth-token custody, gated access, terms approval, selected-source records, observed integrity, transfer state, and access-denied evidence, none of which persists in AIProfile or AIConfig; Import Profile and Apply Profile to AIConfig never download, resolve, verify, bind, or prepare that source, and only a separate user-explicit asset intake or Add or Update Local Capability Configuration flow may consume the recommendation while preserving unresolved slots; declared expected integrity is a hard verification requirement when content is admitted, while its absence remains risk context only, and manual import association never implies provenance verification without Runtime verification success.
    condition: Whenever a Hugging Face source recommendation is declared, displayed, or consumed.
    failure: Fail closed on custody violations, recommendation-as-binding, implicit preparation, and implied provenance.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r029
    kind: rule
    title: Download sessions are resumable and explicit
    modality: must
    statement: Local downloads resume with HTTP range requests skipping completed byte ranges, retry with exponential backoff capped at eight attempts stepping from three hundred milliseconds through one, five, fifteen, thirty, sixty, one hundred twenty, and one hundred eighty seconds, move through queued, running, paused, failed, completed, and cancelled states driven only by explicit control commands without UI pseudo-pause, convert residual running or queued sessions to paused with an interruption reason after process restart requiring manual resume, verify per-file SHA-256 with an optional prefix and return AI_LOCAL_DOWNLOAD_HASH_MISMATCH on mismatch, and stage files under a per-asset staging directory committed by atomic rename with rollback on failure.
    condition: Whenever a local asset download session runs.
    failure: Reject implicit state transitions, automatic post-restart resumption, and unverified commits.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r030
    kind: rule
    title: Download progress and failure classes are typed
    modality: must
    statement: Download progress events carry install session identity, phase, received and total bytes, speed, eta, message, state, optional reason code and retryability, and done plus success flags, network, timeout, and disk failures mark the session failed and retryable while preserving partial staging for resume, hash mismatches mark it failed and non-retryable while clearing staging and forbidding resume, and cancellation marks it cancelled while clearing staging.
    condition: Whenever download progress or failure is reported.
    failure: Reject untyped progress, resumable hash failures, and retained staging after cancel.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r031
    kind: rule
    title: Family heuristics stay bounded and companion gated
    modality: must
    statement: Family inference may supply bounded catalog provenance or display tags, but CapabilityContract and standardized-feature support come only from the selected CapabilityImplementation declaration validated by its Driver; a text-only llama implementation projects no mmproj slot, while an implementation declaring text.generate input.image support deterministically projects one required independently bound mmproj companion slot.
    condition: Whenever Runtime enriches catalog display or a llama Driver projects requirements and supported features.
    failure: Reject model-name, filename, catalog, or family inference as support truth and fail closed on a missing required mmproj binding.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r032
    kind: rule
    title: Engine taxonomy is closed
    modality: must
    statement: The public local engines are exactly llama for text generation, text embedding, and image and audio understanding, media for image generation and editing plus video generation, speech for the local speech family line, and sidecar for the external music sidecar, the canonical local engine catalog table is the single engine value-domain source with consuming code generated from or mechanically checked against it, retired engine identities are neither engines nor execution truth sources, the internal diffusers driver stays a runtime-internal media backend never exposed as a public engine target, and backend_class stays orthogonal to the public engine without becoming a public routing knob or provider alias.
    condition: Whenever engine identities or backend classes are declared, consumed, or projected.
    failure: Reject undeclared engines, retired identities, and public exposure of internal backends.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.local-engine-plane
  - id: rule.nimi.runtime.local-compute.r033
    kind: rule
    title: Engine runtime modes are two
    modality: must
    statement: Local engine runtime mode admits exactly ATTACHED_ENDPOINT and SUPERVISED, sidecar admits only ATTACHED_ENDPOINT, and llama, media, and speech admit both modes.
    condition: Whenever an engine runtime mode is declared or resolved.
    failure: Reject undeclared modes and supervised sidecar operation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.local-engine-plane
  - id: rule.nimi.runtime.local-compute.r034
    kind: rule
    title: Attached endpoints are explicit and proven
    modality: must
    statement: An attached-endpoint engine requires an explicitly admitted exact private endpoint with no silently restored loopback default, Runtime never starts, stops, or restarts the external process, the attached endpoint must expose its engine's canonical API surface, and attached Host topology never chooses or outranks a Local Capability Configuration, binding, machine selection, AIConfig route, or model; Runtime fails closed when the exact Job composition cannot use that Host.
    condition: Whenever an attached-endpoint engine is configured or consumed.
    failure: Fail closed on missing endpoints, unproven execution capability, and Host topology projected as route, model, binding, or machine-selection authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.local-engine-plane
  - id: rule.nimi.runtime.local-compute.r035
    kind: rule
    title: Supervised processes are managed with bounded recovery
    modality: must
    statement: A supervised engine is forked, monitored, and reclaimed by Runtime, shuts down with a graceful termination signal escalated to kill after timeout, restarts with exponential backoff from a two-second base with jitter for at most five attempts before marking UNHEALTHY, and a stale recorded pid is terminated only when Runtime proves it still belongs to the current supervised engine binary while unprovable identity limits cleanup to tracking files.
    condition: Whenever a supervised engine process is started, restarted, or reclaimed.
    failure: Reject unbounded restarts and termination of unverified processes.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.local-engine-plane
  - id: rule.nimi.runtime.local-compute.r036
    kind: rule
    title: Supervised materialization root is data-plane bound
    modality: must
    statement: Managed engine binaries land only under the data-plane environments root in per-engine per-version directories, immutable Python dependency-profile capsules land only under that root in content-addressed profile directories, shared package-cache payloads remain under a Runtime-owned data-plane dependency root, registries and profile promotion are atomic, home-directory roots never serve as parallel materialization truth, and missing data root configuration fails materialization closed without a home fallback.
    condition: Whenever a managed engine binary or environment is materialized.
    failure: Fail closed without home-directory fallback or a second root truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.local-engine-plane
  - id: rule.nimi.runtime.local-compute.r037
    kind: rule
    title: Bootstrap downloads have a closed redirect policy
    modality: must
    statement: Supervised engine bootstrap downloads follow only https-to-https redirects, allow same-host redirects, allow github.com release assets to redirect only to the explicit GitHub release-chain hosts github.com, objects.githubusercontent.com, and release-assets.githubusercontent.com, fail closed on every other redirect, and llama supervised bootstrap uses the official ggml-org llama.cpp release pack landing the llama-server binary.
    condition: Whenever a supervised engine bootstrap artifact is downloaded.
    failure: Fail closed on undeclared redirect targets or unofficial bootstrap sources.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.local-engine-plane
  - id: rule.nimi.runtime.local-compute.r038
    kind: rule
    title: ExecutionHost endpoints are exact and Runtime private
    modality: must
    statement: Before a local ExecutionHost starts, Runtime materializes one exact private endpoint through private deterministic Host configuration or controlled allocation and captures it as Host input; authority promises no product-level fixed default port, neighboring-port search, caller or ambient inference, environment default, catalog routing identity, or endpoint-bearing AIConfig, Profile, Driver target, Local Capability Configuration, binding, or selection. An attached-endpoint Host requires an exact Runtime-admitted endpoint and fails closed with AI_LOCAL_ENDPOINT_REQUIRED when absent, an unsupported local image Host fails with AI_LOCAL_MODEL_UNAVAILABLE rather than demanding an endpoint, and no Job executes before its Host has yielded the exact endpoint.
    condition: Whenever a local ExecutionHost endpoint is materialized, bound, or validated.
    failure: Fail closed with the exact typed reason on missing, conflicting, externally supplied, or unmaterialized Host input without exposing a public port identity or alternate routing path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.engine-protocol-health-plane
  - id: rule.nimi.runtime.local-compute.r039
    kind: rule
    title: llama and sidecar protocol baselines are fixed
    modality: must
    statement: The llama Driver serves the canonical chat completions, embeddings, and model-listing HTTP dialect and carries only its declared contract support, the sidecar Driver serves the canonical music-generation HTTP dialect and stays outside scheduled Runtime-private Host probing with attached execution failing closed only on a real music Job, backend names passed to the managed llama Host admit only llama-cpp, whisper-ggml, and stablediffusion-ggml without arbitrary passthrough, and no user-facing surface directly exposes workflow assembly, companion-model composition, or pipeline DAGs.
    condition: Whenever llama or sidecar protocol surfaces are dispatched or projected.
    failure: Reject undeclared endpoints, capability bleed, arbitrary backend passthrough, and user-facing DAG exposure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.engine-protocol-health-plane
  - id: rule.nimi.runtime.local-compute.r040
    kind: rule
    title: llama supervision remains Runtime-private
    modality: must_not
    statement: Llama process reachability, endpoint probes, warmup, residency, model listing, bootstrap state, or previous execution success is exposed as Local Capability Configuration readiness, machine selection truth, supported-feature truth, route availability, or a prerequisite for saving, applying, binding, or selecting configuration.
    condition: Whenever llama process supervision or product capability state is projected.
    failure: Keep supervision evidence private to ExecutionHost and derive only request-time admission or Job failure from exact committed configuration.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.engine-protocol-health-plane
  - id: rule.nimi.runtime.local-compute.r041
    kind: rule
    title: Private Host recovery probing is persistent and decaying
    modality: must
    statement: A supervised ExecutionHost process in its Runtime-private unhealthy supervision state is reprobed at an eight-second interval, returns to its private active state after three consecutive probe successes, retries without a maximum count until explicit Host stop or removal, decays the interval to sixty seconds after seven hundred twenty consecutive failures and to five minutes after twenty-four cumulative hours, resets to eight seconds on any success, and resets the consecutive-success count on any failure; these states and probes never mutate AIConfig, Local Capability Configuration, exact bindings, machine selection, or completed and running Jobs and never project product readiness.
    condition: Whenever Runtime-private supervised Host recovery probing runs.
    failure: Reject abandoned recovery, undeclared intervals, success counting across failures, and product projection of private supervision state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.engine-protocol-health-plane
  - id: rule.nimi.runtime.local-compute.r042
    kind: rule
    title: Speech admission is derived from exact composition
    modality: must
    statement: A local speech request deterministically composes its committed AIConfig Local route, required standardized features and defaults with the currently selected Local Capability Configuration, whose exact CapabilityImplementation and Driver project the required slots and whose exact verified-content bindings satisfy those slots; Runtime derives request-time admission from interpretability, configuration completeness, feature-subset satisfaction, exact bindings, and current private ExecutionHost constraints, missing slices or placeholder execution support fail closed with a typed admission reason without starting downloads, probing, changing route, changing machine selection, or projecting readiness, and speech temporary files keep a bounded lifecycle while reference audio, transcription text, and voice-design prompts never enter long-term retention through generic logging.
    condition: Whenever a local speech request is composed or admitted.
    failure: Fail closed on incomplete exact composition without readiness projection, implicit setup, or fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.engine-protocol-health-plane
  - id: rule.nimi.runtime.local-compute.r043
    kind: rule
    title: Attached engine credentials use custody references
    modality: must
    statement: An attached engine endpoint requiring a credential stores only an opaque credential reference resolved inside Runtime service-principal custody, inline API keys, environment-variable key fields, request injection, and user-session vaults are forbidden, local supervised engines normally require no API key with any upstream requirement satisfied only from Runtime-owned custody, and a credential-free engine is never treated as unconfigured for lacking a credential reference.
    condition: Whenever local engine credentials are stored or resolved.
    failure: Reject inline credential material and unconfigured classification of credential-free engines.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.engine-protocol-health-plane
  - id: rule.nimi.runtime.local-compute.r044
    kind: rule
    title: Engine HTTP failures map to fixed gRPC codes
    modality: must
    statement: Local engine HTTP responses map 400 to INVALID_ARGUMENT, 401 and 403 to PERMISSION_DENIED, 404 to NOT_FOUND, 408 to DEADLINE_EXCEEDED, 429 to UNAVAILABLE, 500 to INTERNAL, and 502, 503, and 504 to UNAVAILABLE, with unlisted 4xx as INVALID_ARGUMENT and unlisted 5xx as UNAVAILABLE.
    condition: Whenever a local engine HTTP failure is mapped to a gRPC status.
    failure: Reject mappings outside the fixed table.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.engine-protocol-health-plane
  - id: rule.nimi.runtime.local-compute.r045
    kind: rule
    title: Stream downgrade is detected and simulated honestly
    modality: must
    statement: A streaming request answered with HTTP 404, 405, or 501, a non-event-stream content type, or an error body indicating unsupported streaming is treated as no native streaming support, the downgrade re-executes without streaming and emits the full response in twenty-four-character slices with a shorter final slice, terminal metadata marks stream_simulated true with the stream-fallback audit tag, simulated events still satisfy canonical stream event semantics, a speech synthesis downgrade also projects voice_output_mode simulated_stream, and simulated output never satisfies native realtime acceptance.
    condition: Whenever an engine cannot serve a requested stream natively.
    failure: Reject silent downgrade, unmarked simulation, and simulated output claiming native realtime.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.engine-protocol-health-plane
  - id: definition.nimi.runtime.local-compute.accelerator-dependency-plane
    kind: definition
    title: Runtime accelerator dependency plane
    meaning: The Runtime accelerator dependency plane owns shared accelerator dependency readiness for supervised local execution, including CUDA user-space runtime source policy, accelerator profile and dependency projection boundaries, dependency resolver states, selected source records, dependency job and repair semantics, and supervised process environment constraints.
  - id: definition.nimi.runtime.local-compute.topology-resolver-plane
    kind: definition
    title: Runtime local topology resolver plane
    meaning: The Runtime local topology resolver plane owns canonical topology resolution for local assets, including matrix resolver matching and conflict semantics, topology and product state filtering, admission gates, image topology classification, canonical media supervised selection arbitration, media supervised modes, the internal media lifecycle, and local error attribution.
  - id: definition.nimi.runtime.local-compute.runtime-environment-plane
    kind: definition
    title: Runtime local engine runtime environment plane
    meaning: The Runtime local engine runtime environment plane owns typed llama engine configuration, supervised llama residency truth, text-model selectability relaxation, managed image backend package admission, native-binary image execution, managed Python dependency-profile identity, exact lock and shared package-cache semantics, immutable profile promotion and isolated worker execution, the daemon core readiness boundary against local bootstrap work, and the local environment setup plan authority.
  - id: definition.nimi.runtime.local-compute.speech-engine-plane
    kind: definition
    title: Runtime local speech engine plane
    meaning: The Runtime local speech engine plane owns admitted speech Driver and ExecutionHost compatibility, concrete Qwen3 speech implementation and install-offer facts, separate speech execution and consumer lines, dependency-profile resolution for those lines, and private supervised materialization; it owns no default STT or TTS model lane, binding, Local Capability Configuration, machine selection, AIConfig route, or execution target.
  - id: definition.nimi.runtime.local-compute.consumer-activation-plane
    kind: definition
    title: Runtime-private local dependency activation plane
    meaning: The Runtime-private local dependency activation plane owns dependency verification requests and responses for internal execution consumers, dependency environment and Python dependency-profile key derivation, profile-consumption verification projections, private activation-state mapping, process-local environment deltas, reason ownership, consumer and pack registry lockstep, and selected-source evidence without making profile consumption a new selected-source owner; it is neither an AIConfig owner nor a CapabilityContract, Local Capability Configuration, machine selection, product readiness, route, feature-support, or first-run authority.
  - id: definition.nimi.runtime.local-compute.environment-materializer-plane
    kind: definition
    title: Runtime local environment materializer plane
    meaning: The Runtime local environment materializer plane owns the admitted materializer families, materializer job execution and verification, the materializer projection and command surface, download progress projection, and install-level plan resolution for local environment dependencies.
  - id: definition.nimi.runtime.local-compute.profile-application-plane
    kind: definition
    lifecycle: removed
    title: Retired Runtime local Profile application plane
    reason: Removed because Profile Apply no longer resolves, installs, binds, selects, probes, warms, bootstraps, or rolls back local execution state.
  - id: definition.nimi.runtime.local-compute.machine-local-configuration-plane
    kind: definition
    title: Runtime Machine Local AI Configuration plane
    meaning: The Runtime Machine Local AI Configuration plane persists the unique machine aggregate, Local Capability Configuration records, normalized requirement projections, exact or unresolved bindings, and explicit per-contract selection, while local assets, dependency activation, process supervision, and Jobs remain separate owners.
    relations:
      - type: supersedes
        target: definition.nimi.runtime.local-compute.profile-application-plane
  - id: rule.nimi.runtime.local-compute.r046
    kind: rule
    title: Accelerator dependency readiness is Runtime owned
    modality: must
    statement: Runtime owns shared accelerator dependency readiness for supervised local execution, CUDA user-space runtime readiness is never owned by image assets, engines, package installers, Desktop, or SDK, ordinary users are never required to install CUDA Toolkit, configure CUDA_PATH or CUDA_HOME, or place nvcc on PATH before an admitted Windows NVIDIA local execution path, accelerator profile and dependency tables stay accelerator-specific projections of canonical local environment authority preserving distinct failed, unsupported, repair_required, and cancelled semantics without becoming parallel consumer authority, image topology tables may reference dependency and consumer ids without owning CUDA source selection, installation, repair, or selected source records, and Desktop, SDK, and app code only project runtime dependency truth without probing, installing, or inferring CUDA readiness.
    condition: Whenever accelerator dependency readiness is owned, projected, or consumed.
    failure: Reject consumer-side probing, parallel accelerator authority, and ordinary-user toolkit installation requirements.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.accelerator-dependency-plane
  - id: rule.nimi.runtime.local-compute.r047
    kind: rule
    title: Windows NVIDIA CUDA source policy is system first
    modality: must
    statement: Windows NVIDIA CUDA source selection tries a compatible system CUDA user-space runtime proven from canonicalized allowlisted evidence, then a previously verified runtime-managed CUDA dependency under the Runtime dependency root, then a declared managed dependency package after explicit user confirmation for first network materialization, system source proof is positive across source identity, canonical root, required DLL and file set, version metadata or binary version, driver compatibility, and selected source record creation, PATH serves only as a hint and never selects a source by DLL precedence alone, and model directories, import directories, and arbitrary user-selected directories are rejected as CUDA DLL sources.
    condition: Whenever a Windows NVIDIA CUDA user-space runtime source is resolved.
    failure: Fail closed without a verified source instead of accepting unproven or precedence-derived sources.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.accelerator-dependency-plane
  - id: rule.nimi.runtime.local-compute.r048
    kind: rule
    title: Managed accelerator sources require complete proof
    modality: must
    statement: Managed accelerator source proof includes the declared package source, archive hash verification, staged extraction, required artifact set verification, version and driver compatibility where available, atomic promotion, repair metadata, and a selected source record created before any consumer activation.
    condition: Whenever a managed accelerator dependency is materialized or promoted.
    failure: Reject activation on any missing proof element instead of promoting a partially verified source.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.accelerator-dependency-plane
  - id: rule.nimi.runtime.local-compute.r049
    kind: rule
    title: Dependency resolver states are closed and fail closed
    modality: must
    statement: Dependency resolver state admits exactly unknown, ready_system, ready_managed, materializable_requires_confirmation, queued, downloading, verifying, installing, repair_required, failed, unsupported, and cancelled projected through stable install, health, and audit detail, materializable_requires_confirmation may appear as installable or review-needed setup but never becomes ACTIVE or health success, activation and ready health for accelerator-backed consumers require ready_system or ready_managed, and failed, cancelled, and repair_required project as fail-closed dependency setup or repair detail rather than topology unsupported or pseudo-success.
    condition: Whenever accelerator dependency state is resolved or projected.
    failure: Reject undeclared states and ready projections without a ready state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.accelerator-dependency-plane
  - id: rule.nimi.runtime.local-compute.r050
    kind: rule
    title: Selected source records are single and shared
    modality: must
    statement: Exactly one active selected-source record exists per Runtime dependency environment as private verification evidence, all consumers of that same environment reference it without independently resolving another source, Python dependency-profile consumption evidence references the canonical source records and never creates consumer-scoped selected-source ownership, and neither a source record nor profile-consumption projection becomes Local Capability Configuration identity, exact binding identity, machine selection, CapabilityImplementationDriver choice, route, feature support, admission, or Job input except through the owning configuration's separately committed exact binding.
    condition: Whenever selected source records are created, referenced, or invalidated.
    failure: Reject duplicate active records, independent re-resolution, fallback state, or promotion of selected-source evidence into product configuration or routing truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.accelerator-dependency-plane
  - id: rule.nimi.runtime.local-compute.r051
    kind: rule
    title: Dependency jobs are explicit with repair locks
    modality: must
    statement: Dependency setup is idempotent for the same dependency environment while a job is active with duplicate consumer requests attaching to the same active job id, cancellation is explicit and stops before promotion, repair locks exclude activation using the corrupt dependency until Runtime verification restores a ready state, repair never collapses into unsupported or ready without verification, and automatic reinstall is forbidden unless the current confirmation policy admits it for that repair case.
    condition: Whenever accelerator dependency jobs run, cancel, or repair.
    failure: Reject implicit cancellation, activation through repair locks, and unadmitted automatic reinstalls.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.accelerator-dependency-plane
  - id: rule.nimi.runtime.local-compute.r052
    kind: rule
    title: Dependency environment mutation is process local
    modality: must
    statement: Runtime may prepend a selected dependency directory only to the supervised engine child process PATH, never mutates machine PATH, user PATH, shell profiles, system CUDA configuration, global Python, or package-manager global state, canonicalizes dependency paths before use, and records selected source and verification detail in runtime-private audit and health detail.
    condition: Whenever a supervised engine process environment is prepared.
    failure: Reject persistent host environment mutation and uncanonicalized dependency paths.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.accelerator-dependency-plane
  - id: rule.nimi.runtime.local-compute.r053
    kind: rule
    title: Canonical topology resolution is unique and ordered
    modality: must
    statement: Given an explicitly committed CapabilityImplementation, Driver dialect, portable configuration, and exact LocalAsset bindings, Runtime validates at most one compatible internal image topology using host, asset family, artifact format, and Driver registry facts; this validation never chooses the implementation, Driver, configuration, binding, route, or machine selection, and ambiguity fails closed.
    condition: Whenever an explicitly selected local image configuration is admitted for execution.
    failure: Reject ambiguous, unsupported, or unadmitted compatibility without searching, ranking, substituting, or changing committed configuration.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.topology-resolver-plane
  - id: rule.nimi.runtime.local-compute.r054
    kind: rule
    title: Topology and product states filter resolution
    modality: must
    statement: Removed internal topology entries never participate, deprecated entries may be inspected only by one-time repair tooling, supported entries may inform explicit installation recommendation and Driver compatibility validation, and proposed or unsupported entries fail closed without becoming default, route, selection, fallback, readiness, or health truth.
    condition: Whenever an internal topology entry is considered for recommendation, repair, or exact Driver validation.
    failure: Reject removed, deprecated-default, proposed-success, unsupported-success, or any implicit product selection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.topology-resolver-plane
  - id: rule.nimi.runtime.local-compute.r055
    kind: rule
    title: Resolver inputs are layered and authored constraints validated
    modality: must
    statement: Internal topology validation consumes the explicitly committed CapabilityImplementation and Driver dialect plus Driver-owned portable configuration, host facts, verified LocalAsset manifests, exact bindings, bundle completeness, and projected requirement slots; preferred engine, asset family, filename, model lineage, dependency family, path, catalog order, or legacy backend hints never select or overwrite implementation, Driver, binding, or machine selection.
    condition: Whenever exact Driver compatibility inputs are evaluated.
    failure: Reject hint-driven selection, substitute authoring fields, non-canonical input, missing proof, or inferred overwrite.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.topology-resolver-plane
  - id: rule.nimi.runtime.local-compute.r056
    kind: rule
    title: Resolver output is complete
    modality: must
    statement: Internal topology validation output carries only bounded compatibility and Runtime-private ExecutionHost detail traceable to the committed implementation and Driver; it does not publish a resolved route, selected model, product readiness, supported-feature claim, or reusable binding.
    condition: Whenever internal topology validation succeeds or returns recognized fail-closed detail.
    failure: Reject incomplete diagnostics or output consumed as public configuration, selection, or execution truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.topology-resolver-plane
  - id: rule.nimi.runtime.local-compute.r057
    kind: rule
    title: Admission gates bind only proposed topologies
    modality: must
    statement: An internal experimental topology gate applies only to an explicitly chosen CapabilityImplementation and Driver during compatibility validation, comes only from canonical registration, and never creates a selectable Local Capability Configuration, supported standardized feature, route, fallback, or product readiness fact; stable use requires the implementation registry entry itself to be admitted.
    condition: Whenever an internal experimental topology gate is declared or evaluated.
    failure: Reject an unregistered gate, stable use of an experimental entry, or a gate token treated as product selection or readiness.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.topology-resolver-plane
  - id: rule.nimi.runtime.local-compute.r058
    kind: rule
    title: Image topology classification is fixed
    modality: must
    statement: For an explicitly chosen image CapabilityImplementation and Driver, verified artifact format and bundle evidence classify only Driver compatibility and requirement projection, artifact roles remain bundle-internal facts, and an unsupported classification fails closed without selecting another implementation, Host mode, route, or binding.
    condition: Whenever an image Driver classifies exact bound artifact shape.
    failure: Fail closed on unknown or unsupported shape without attached-endpoint, implementation, provider, or route fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.topology-resolver-plane
  - id: rule.nimi.runtime.local-compute.r059
    kind: rule
    lifecycle: removed
    title: Retired media supervised automatic selection
    reason: Removed because media uses the explicit Machine Local AI Configuration selection relation and never re-arbitrates after removal, health change, repair, or import.
  - id: rule.nimi.runtime.local-compute.r060
    kind: rule
    title: Media supervised modes share one HTTP surface
    modality: must
    statement: The media ExecutionHost may privately distinguish native proxy and Python pipeline supervised modes behind one canonical Host protocol, but the exact committed CapabilityImplementationDriver maps execution to that Host and no Host mode, environment variable, endpoint, catalog row, or process state selects the implementation, local configuration, machine relation, or route.
    condition: Whenever a media Driver invokes a supervised Host mode or its private protocol.
    failure: Reject undeclared modes, protocol divergence, Host-owned product selection, and legacy control-plane fabrication.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.topology-resolver-plane
  - id: rule.nimi.runtime.local-compute.r061
    kind: rule
    title: Internal media lifecycle is a closed ladder
    modality: must
    statement: Local media process, materialization, control-plane, execution-plane, degradation, repair, and residency states remain Runtime-private ExecutionHost or dependency facts, persist no product active selection, and project no public capability readiness, Local Capability Configuration state, supported-feature truth, machine selection, or route availability.
    condition: Whenever the internal local media lifecycle transitions, persists, or projects diagnostics.
    failure: Reject a private lifecycle fact promoted to product configuration, selection, admission, or readiness authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.topology-resolver-plane
  - id: rule.nimi.runtime.local-compute.r062
    kind: rule
    title: Dual-plane Host preparation is private and bounded
    modality: must
    statement: Media Job execution proceeds only after its selected Driver privately prepares the required control and execution Host planes within bounded startup budgets; incomplete or over-budget preparation fails only that Job unless the Driver classifies a persistent hard blocker, and never changes binding, machine selection, route, configuration, or public readiness.
    condition: Whenever a selected local media Job prepares Host planes or startup budgets elapse.
    failure: Fail the Job closed on incomplete preparation, terminate over-budget work, and preserve committed configuration.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.topology-resolver-plane
  - id: rule.nimi.runtime.local-compute.r063
    kind: rule
    title: Local error attribution is prioritized and typed
    modality: must
    statement: Local failure attribution preserves one stable primary typed reason and bounded secondary Driver or Host detail; missing exact required bindings and incompatible committed configuration fail admission, ordinary bootstrap, load, health, or execution failures terminate only the affected Job, only a Driver-classified persistent hard blocker may update derived admission, and no failure clears a binding, changes selection, triggers ambient re-resolution, or invokes fallback.
    condition: Whenever local admission, Driver, Host, or Job failures are attributed or mapped.
    failure: Reject an untyped or multi-primary error, configuration mutation from ordinary execution failure, ambient repair, or fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.topology-resolver-plane
  - id: rule.nimi.runtime.local-compute.r064
    kind: rule
    title: Llama engine config parameter space is typed and closed
    modality: must
    statement: The llama CapabilityImplementationDriver dialect owns typed portable execution options such as context size, cache quantization, flash attention, and GPU-layer policy and maps validated values to invocation, while mmproj is never a portable path option and instead comes only from the exact independently projected and bound companion requirement slot; unknown or invalid dialect fields fail interpretation closed.
    condition: Whenever llama Driver configuration is interpreted or mapped to invocation.
    failure: Fail interpretation closed on unknown or invalid values, path-bearing portable bindings, missing required mmproj, or ambiguous companion binding.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.runtime-environment-plane
  - id: rule.nimi.runtime.local-compute.r065
    kind: rule
    lifecycle: removed
    title: Retired public supervised llama residency state
    reason: Removed because residency, loading, switching, and warm failure are Runtime-private ExecutionHost facts and no longer project product readiness or routability.
  - id: rule.nimi.runtime.local-compute.r066
    kind: rule
    title: Local selection and Job preparation are distinct
    modality: must
    statement: A Local Capability Configuration may be selected only when its exact Driver can interpret it and all required exact bindings are configured, without process start, warm, resident load, endpoint probe, or execution proof; each later Job prepares the selected Driver and Host on demand, and preparation failure does not invalidate the selection or configuration.
    condition: Whenever machine selection or on-demand Local Job preparation is evaluated.
    failure: Reject an uninterpretable or unresolved selection, selection-time probe or warm, and any Job preparation result written back as configuration readiness or automatic re-selection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.runtime-environment-plane
  - id: rule.nimi.runtime.local-compute.r067
    kind: rule
    title: Managed image backend packages have one canonical source
    modality: must
    statement: The managed image backend package registry is the single normative source for runtime-owned image backend package materialization, package refs are never inferred from ad hoc code branches or engine command-line backend installers, a host tuple may carry multiple package source entries while exactly one supported entry stays canonical for default resolution on that tuple, proposed package entries are runtime-private experimental sources selected only by an explicit runtime-private selector and never auto-selected, implicitly promoted, or used as hidden fallback when the canonical source is unavailable or slow, current admission supports the darwin arm64 Apple stablediffusion-ggml tuple through the canonical LocalAI-derived OCI payload with the official direct archive staying runtime-private experimental, supports the windows amd64 NVIDIA stablediffusion-ggml tuple through the runtime-owned direct archive package and wrapper launch path with CUDA resolved as a shared accelerator dependency before activation or health success, and keeps the linux amd64 NVIDIA tuple unsupported until a published runtime-owned package exists, and a topology recognized in the supervised backend matrix with unsupported package admission fails closed without silently promoting the host tuple.
    condition: Whenever a managed image backend package source is resolved or admitted.
    failure: Fail closed on unadmitted tuples instead of inferring, promoting, or falling back to experimental sources.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.runtime-environment-plane
  - id: rule.nimi.runtime.local-compute.r068
    kind: rule
    title: Native-binary image execution is direct
    modality: must
    statement: Canonical native-binary image execution uses the managed image backend gRPC contract directly through LoadModel, GenerateImage, and Free behind the Runtime-private ExecutionHost, Apps consume only canonical image CapabilityContract requests, typed admission, Job state, and artifact projections through the Nimi app-facing surface, backend control and ExecutionHost health remain Runtime-private and never establish capability readiness, native-binary success never depends on proxy import support, and llama model import is never part of the canonical native-binary image path on any supported host tuple.
    condition: Whenever native-binary image execution or its control surface is dispatched.
    failure: Reject proxy-import dependencies, llama import participation, App-facing Host control or health, and every public capability-readiness projection in the canonical path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.runtime-environment-plane
  - id: rule.nimi.runtime.local-compute.r069
    kind: rule
    title: Python dependency profiles are exact and immutable
    modality: must
    statement: Runtime uses its precisely pinned managed uv tool as the sole Python materialization pipeline without a PATH-selected tool or second bootstrap implementation, fixes managed Python at version 3.12, and materializes immutable consumer-independent dependency-profile capsules rather than a venv per model or one mutable global site-packages environment. A profile fingerprint includes the exact Python version and ABI, OS and architecture, host-derived accelerator plane, Torch version, CUDA ABI, complete transitive exact dependency-lock digest, wheel identity, package-index and package-source identities, and Driver protocol and version, while model id, dependency consumer, host-profile id, user folder name, and import path are never profile-key material; equal fingerprints reuse one profile, any incompatible or changed factor creates a new isolated profile, and Runtime never guesses or dynamically merges dependency sets. All profiles use one Runtime-owned content-addressed package cache, uv performs only exact frozen synchronization and cache linking from declared lock inputs with same-volume hardlinks on Windows and clone or copy-on-write linking on macOS and Linux, and Nimi retains source, lock, probe, verification, and promotion ownership. Creation stages an isolated profile, verifies its declared imports and accelerator execution, and atomically promotes it; a promoted profile is never mutated, upgrade creates a new fingerprint and root, and each worker executes with that profile's Python in an independent process without startup-time resolution or synchronization. Budgets fix Python runtime creation at one hundred twenty seconds, dependency materialization at six hundred seconds, and pipeline warmup at three hundred seconds; retry applies only to transient initial network transfer failures, offline materialization is admitted only when every locked artifact is already in the managed cache, and ABI incompatibility, lock or cache incompleteness, missing wheels, source mismatch, or import failure always fails closed.
    condition: Whenever a managed Python dependency profile is created, verified, reused, upgraded, or cleaned.
    failure: Reject PATH or parallel bootstrap paths, consumer-keyed or mutable environments, incomplete profile identity, dynamic dependency merging, unpinned or undeclared sources, post-promotion mutation, in-process workers, retry of non-transient failures, and offline success without every locked artifact.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.runtime-environment-plane
  - id: rule.nimi.runtime.local-compute.r070
    kind: rule
    title: Daemon service lifecycle excludes capability feasibility
    modality: must
    statement: Daemon STARTING covers only bounded core initialization of parsed and validated config, opened stores, serving gRPC and admitted HTTP listeners, and constructed core services; local engine downloads, accelerator dependency materialization, Python environment creation, dependency install, model loading, minimal execution, provider connection tests, and repair Jobs never hold STARTING open and produce only their exact Runtime-private supervision, dependency, LocalAsset, explicit diagnostic, derived-admission, or Job outcomes. A provider or capability probe never runs periodically or drives daemon READY or DEGRADED, while an exact supervised Host process bootstrap failure may remain bounded private service-operational degradation without becoming capability readiness; a missing model, connector, Driver, capability, or local environment never makes RuntimeLocalService, RuntimeAuditService, configuration, status, Product Control, or ordinary Home unavailable.
    condition: Whenever daemon service lifecycle overlaps local execution, dependency, asset, or provider work.
    failure: Reject a service lifecycle gated or degraded by catalog, model, provider, or probed capability feasibility, a reusable provider-health state, private Host supervision projected as capability readiness, STARTING held open by background work, or core surfaces hidden by local or Cloud execution failure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.runtime-environment-plane
  - id: rule.nimi.runtime.local-compute.r071
    kind: rule
    title: Local environment setup unit is the plan
    modality: must
    statement: Runtime owns local environment setup truth whose unit is a Runtime local environment plan rather than a model row, engine installer, Desktop workflow, package-manager command, developer script, or provider health probe, plans resolve the requested compute pack or capability, installed and imported assets, host-derived platform and accelerator facts, consumer requirements, dependency source policy, exact dependency-profile fingerprint, and current selected source records into dependency state, profile reuse or isolation, confirmation requirements, activation gates, repair requirements, and product-safe Desktop projection without making model, consumer, or host-profile identity an environment owner. Managed dependency families cover the CUDA runtime, native engine packages, uv, managed Python, venv, package sets, Torch wheels, model assets, and companion assets rather than CUDA alone, a Python package set that transitively installs Torch never substitutes for the exact host-appropriate Torch-wheel dependency or its verified accelerator execution, system sources require positive canonicalized proof and managed sources live under Runtime-owned roots, and cloud API setup, account and session, provider connector configuration, and Runtime core status never require local engines, Python, Torch, CUDA, models, or accelerator dependency materialization.
    condition: Whenever local environment setup is planned or cloud-only usage is evaluated.
    failure: Reject setup truth outside plans, package-set-derived pseudo-readiness for Torch execution, and local dependency requirements imposed on cloud-only usage.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.runtime-environment-plane
  - id: rule.nimi.runtime.local-compute.r072
    kind: rule
    title: Speech catalog offers preserve concrete family roles
    modality: must
    statement: The local speech catalog may expose concrete Qwen3 install offers where qwen3_asr keeps the existing qwen-asr-package Driver for its exact package-native Qwen3-ASR bundle separate from a Transformers-native Driver and managed Python package set for exact Qwen3-ASR-0.6B-hf and Qwen3-ASR-1.7B-hf folder bundles, exposes 0.6B-hf as the visible recommended Transformers-native option and 1.7B-hf as an explicit higher-resource option, and requires explicit Driver and model selection with no fallback, migration, or cross-Driver bundle admission; qwen3_tts distinguishes Qwen3-TTS-12Hz-0.6B-CustomVoice for plain synthesis, Qwen3-TTS-12Hz-0.6B-Base for clone workflow, and Qwen3-TTS-12Hz-1.7B-VoiceDesign for design workflow; these source, role, format, compatibility, and user-visible recommendation facts never establish a default lane, binding, Local Capability Configuration, machine selection, or execution route, and voice clone or design promotes to executable truth only after its real capability slice is admitted and explicitly configured and selected.
    condition: Whenever concrete local speech families, offers, roles, or workflow admission are projected.
    failure: Reject a catalog or engine default, implicit binding or selection, collapsed role, or workflow promotion before explicit admission.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.speech-engine-plane
  - id: rule.nimi.runtime.local-compute.r073
    kind: rule
    title: Speech execution lines resolve dependency profiles independently
    modality: must
    statement: Admitted local Qwen3 speech implementations retain separate execution and consumer lines where each qwen3_tts synthesis or workflow implementation and each qwen3_asr implementation declares its own exact Driver requirements, while dependency-profile reuse is determined only by equality of the complete canonical fingerprint, so identical fingerprints may reuse one immutable profile and incompatible fingerprints resolve to isolated profiles without dynamic co-installation, dependency merging, cross-Driver admission, or environment-owned selection. Qwen3-ASR-1.7B remains only a separately visible candidate never auto-materialized or selected by environment topology.
    condition: Whenever local speech environments are materialized for an admitted exact implementation.
    failure: Reject assumed family co-installation, consumer- or model-keyed profiles, dynamic dependency merging, cross-Driver admission, environment-owned binding or selection, and automatic materialization of a recommendation candidate.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.speech-engine-plane
  - id: rule.nimi.runtime.local-compute.r074
    kind: rule
    title: Admitted local speech Host materialization is capability scoped
    modality: must
    statement: When an admitted selected Local Capability Configuration requires a supervised speech ExecutionHost, Runtime may present its setup as one bundle-shaped surface while keeping environment, bootstrap, and Host details private; materialization stays lazy for the exact requested capability so transcription materializes only the exact dependencies and Host Driver declared by its admitted qwen3_asr implementation, with the qwen-asr-package and Transformers-native implementations remaining separate and neither probing, falling back to, migrating, or substituting the other's model bundle, Driver, or declared dependency requirements, while equality of their complete dependency-profile fingerprints may reuse the same immutable capsule without cross-Driver model admission. Plain synthesis materializes only its admitted qwen3_tts implementation including its exact host-appropriate Torch and torchaudio requirements, requires verified CUDA execution before activating that implementation on an admitted NVIDIA host, and carries the admitted request through bounded Driver execution without a shorter private transport deadline or fixed short generation ceiling preempting the owning Local speech Job, and future admitted voice workflows materialize only their own implementation requirements. Supervised or attached Host topology never chooses a Local Capability Configuration, model, binding, route, or default lane and does not outrank another exact admitted Host composition.
    condition: Whenever an admitted selected local speech composition materializes its ExecutionHost.
    failure: Reject generic-row projection, Host-topology-owned route or selection, cross-capability prefetch, package-set-only Torch readiness, unverified NVIDIA execution, and silent long-synthesis truncation caused only by a private Host or Driver deadline or fixed short generation ceiling.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.speech-engine-plane
  - id: rule.nimi.runtime.local-compute.r075
    kind: rule
    title: Dependency activation is consumer keyed and Runtime private
    modality: must
    statement: Local dependency activation is consumer-keyed and Runtime-private, where the consumer id names an internal execution dependency consumer rather than an app, module, feature requirement owner, AIConfig owner, LocalAgent, UI consumer, CapabilityImplementation, or Local Capability Configuration; a pack id may accompany a request only as private projection context after exact Job composition identifies its dependency families and never performs route, implementation, binding, or machine-selection arbitration; consumers never select sources, create selected-source records, run installers, repair dependencies, mutate PATH or global Python or package-manager state, or project product readiness, and they consume only dependency-verification responses and selected-source evidence through explicit Runtime-private mapping metadata.
    condition: Whenever a local environment activation consumer is declared, requested, or mapped.
    failure: Reject consumer-created setup truth, product readiness projection, and consumer identity reuse as configuration, route, or selection identity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.consumer-activation-plane
  - id: rule.nimi.runtime.local-compute.r076
    kind: rule
    title: Activation request identity vocabulary is fixed
    modality: must
    statement: An activation request carries the consumer id, an optional projection pack id, the host profile id, platform tuple, and runtime data root, the asset id for the model asset family, and the companion asset id, companion kind, and parent asset id for the companion family, the asset id is the semantic installable identity taken from the catalog local-plane variant identity for verified assets and from the manifest asset id for explicit imports, the local asset id stays a Runtime installed-record handle usable by lifecycle calls and as a lookup hint that Runtime resolves to the asset id before writing dependency identity or selected-source truth, a model id is a catalog or route selector that never substitutes for the asset id in dependency identity, the selected source record id stays a Runtime-private proof pointer projectable for diagnostics and audit without becoming reusable model binding identity, and local asset ids, UI row ids, transfer ids, consumer ids, engine-private paths, and route-local handles stay projection only.
    condition: Whenever an activation request or dependency identity is composed.
    failure: Reject projection handles or catalog selectors written as dependency identity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.consumer-activation-plane
  - id: rule.nimi.runtime.local-compute.r077
    kind: rule
    title: Environment and Python profile keys derive from canonical inputs
    modality: must
    statement: Runtime derives one dependency environment key per required dependency family from canonical dependency authority where the CUDA accelerator runtime keys on dependency id, host profile id, platform tuple, and runtime data root, the native llama engine package keys on engine id, package variant, platform tuple, and data root, the native stablediffusion-ggml engine package adds the backend family, the uv tool keys on its precisely pinned managed version, platform tuple, and data root, the Python runtime keys on exact Python version and ABI, platform tuple, and data root, the canonical Torch selected source keys on Torch version, host-derived accelerator plane, CUDA ABI, wheel, package-index and package-source identities, platform tuple, and data root, the model asset keys on asset id, model family, and data root, and the companion asset keys on asset id, parent asset id, companion kind, and data root. The venv, Python package-set, Torch, source, and Driver inputs compose one Python dependency-profile digest from exact Python version and ABI, OS and architecture, host-derived accelerator plane, Torch version, CUDA ABI, complete transitive exact dependency-lock digest, wheel identity, package-index and package-source identities, and Driver protocol and version; the profile environment key pairs that digest with the Runtime data root and excludes model id, asset id, consumer id, host-profile id, user folder name, import path, engine id, backend family, selected-source record id, and route-local handles. Equal profile digests reuse the same immutable capsule, consumer membership and consumer-specific verification are projected only through the activation gate as profile-consumption evidence, and no Python dependency family admits consumer-scoped selected-source ownership.
    condition: Whenever a dependency environment key is derived or persisted.
    failure: Reject keys composed from undeclared fields or projection handles.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.consumer-activation-plane
  - id: rule.nimi.runtime.local-compute.r078
    kind: rule
    title: Private activation response and verification condition are fixed
    modality: must
    statement: Runtime owns the internal logical operation ResolveLocalEnvironmentConsumerActivation whose response carries the consumer id and projection pack id, private activation state, ordered blocking dependencies, dependency entries with family, dependency id, environment key, required flag, selected-source record id, source kind, canonical root, dependency state, reason code, bounded diagnostic detail, process-local environment deltas, and audit metadata including host profile and platform tuple; its internal ready state is valid only when every required dependency is ready_system or ready_managed, every referenced selected-source record passes repair, compatibility, and verification checks, and every required consumer- or model-specific Python dependency-profile consumption projection references the exact promoted immutable profile and passes its fingerprint, lock, source, Driver, import, and accelerator compatibility checks. Neither the operation nor its state is exposed as product capability readiness, route, selection, binding, or feature support.
    condition: Whenever consumer activation is resolved or its response composed.
    failure: Reject incomplete responses, internally ready states with unverified dependencies, and product projection of the private activation result.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.consumer-activation-plane
  - id: rule.nimi.runtime.local-compute.r079
    kind: rule
    title: Private activation state mapping is prioritized
    modality: must
    statement: Runtime-private dependency activation state resolves in the priority order of unsupported, then repair_required, then failed, then cancelled, then setup_in_progress, then setup_required, then ready; queued, downloading, verifying, and installing dependency states map to setup_in_progress, unknown and needs_confirmation map to setup_required, non-ready states never map to active, degraded-ready, best-effort-ready, endpoint-ready, or import-ready, and no activation state is projected as product readiness or used to choose a route, implementation, binding, or machine selection.
    condition: Whenever dependency states map to an activation state.
    failure: Reject out-of-priority mappings and ready-like projections of non-ready states.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.consumer-activation-plane
  - id: rule.nimi.runtime.local-compute.r080
    kind: rule
    title: Activation deltas are process local only
    modality: must
    statement: Activation deltas are process-local and consumable only after selected-source and dependency-profile consumption verification succeeds, the admitted deltas are the child-process PATH prepend for selected CUDA runtime artifacts, executable path and canonical root references for native engine packages, the precisely pinned uv tool, exact promoted profile root and Python interpreter, read-only source references for Python pipelines, and selected model and companion asset paths. A Python worker starts as an independent process from that promoted profile without resolving, synchronizing, installing, or rewriting it, and deltas are never readiness proof and never write user PATH, machine PATH, shell profiles, system CUDA, global Python, package-manager global state, or engine-private persistent setup state.
    condition: Whenever activation environment deltas are produced or consumed.
    failure: Reject unverified delta consumption, persistent mutation, and readiness inferred from deltas.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.consumer-activation-plane
  - id: rule.nimi.runtime.local-compute.r081
    kind: rule
    title: Activation reasons have declared owners
    modality: must
    statement: Private activation reason codes live in the canonical activation-gate reason registry with each code declaring ownership by a dependency family, selected-source record state, dependency-profile consumption projection, or host-capability projection and implementations never inventing unregistered codes; vulkan_runtime_unavailable and metal_runtime_unavailable are host-capability projection reasons that admit no Vulkan or Metal dependency materializers and create no selected-source records, and speech Driver import and execution compatibility belongs to dependency-profile consumption verification grounded in the canonical Python package-set and Torch source records, with speech consumers using python_package_set_missing rather than a separate engine-local speech Driver installer or consumer-scoped Torch source.
    condition: Whenever activation reason codes are declared, emitted, or consumed.
    failure: Reject unregistered reason codes and materializers implied from projection reasons.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.consumer-activation-plane
  - id: rule.nimi.runtime.local-compute.r082
    kind: rule
    title: Consumer and pack registries stay lockstep
    modality: must
    statement: Consumer requirement authority, local compute pack consumer references, and the activation contract stay in lockstep with no orphaned consumer ids in either direction, pack-level optional dependency families are Desktop and setup projection only and never weaken consumer-level required dependency evaluation once a specific consumer is selected, and cloud-only usage issues no local consumer activation request and resolves no local environment dependencies.
    condition: Whenever consumer requirements, pack references, or cloud-only posture are evaluated.
    failure: Reject orphaned consumer ids and pack-level weakening of required evaluation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.consumer-activation-plane
  - id: rule.nimi.runtime.local-compute.r083
    kind: rule
    title: Private dependency verification never derives from side effects
    modality: must_not
    statement: Runtime treats a private dependency as verified from file existence, directory presence, endpoint reachability, transfer completion, package directory presence, PATH precedence, import success, import directory contents, script exit, process liveness, warmup success, or previous health success without a selected-source record whose content, source, compatibility, and repair evidence all pass the declared dependency checks, or treats a dependency-profile import, Driver, or accelerator probe as creating or replacing selected-source truth rather than only verifying that profile's consumption compatibility.
    condition: Whenever Runtime-private dependency verification evidence is evaluated.
    failure: Fail closed without a verified selected-source record and never project the result as product readiness.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.consumer-activation-plane
  - id: rule.nimi.runtime.local-compute.r084
    kind: rule
    lifecycle: removed
    title: Retired first-run Local AI baseline evidence
    reason: Removed because Local dependency activation and selected-source evidence no longer participate in Product Control ready_for_use.
  - id: rule.nimi.runtime.local-compute.r085
    kind: rule
    title: Materializers are the only materialization path
    modality: must
    statement: Runtime materializers are the only admitted product path for materializing local environment dependency families, the admitted families are exactly the CUDA accelerator runtime, native llama engine package, native stablediffusion-ggml engine package, uv tool, Python runtime, venv, Python package set, Torch wheel, model asset, and companion asset families. A Python dependency profile is the immutable composite materialization of the existing Python runtime, venv, Python package-set, Torch, declared source, and Driver inputs rather than a new dependency family, selected-source owner, or authority plane; existing family materializers promote only their own verified selected-source records, and RuntimeLocalService coordinates staged profile composition from those exact inputs, performs profile-consumption verification, and atomically promotes the profile without creating, replacing, or transferring selected-source ownership. Every materializer is a RuntimeLocalService-owned job executor consuming a resolved dependency environment, source policy, source manifest, confirmation disposition, and current selected source record that stages artifacts under Runtime-owned roots, verifies family-specific evidence, and promotes a selected source record only after verification succeeds, and materializers are never Desktop workflows, engine-local installers, developer scripts, package-manager commands, PATH helpers, transfer records, endpoint probes, or model rows.
    condition: Whenever a local environment dependency family is materialized or a Python dependency profile is composed, verified, or promoted.
    failure: Reject materialization outside the admitted families or Runtime materializer executors, and reject dependency profiles treated as a new selected-source family or owner.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.environment-materializer-plane
  - id: rule.nimi.runtime.local-compute.r086
    kind: rule
    title: Passive surfaces never start heavy materialization
    modality: must
    statement: ExecutionHost startup, Python pipeline startup, request-time capability composition, explicit connector diagnostics, passive import review, SDK reads, Desktop page load, and background maintenance never perform first heavy or network materialization and never resolve, synchronize, install into, or rewrite a promoted dependency profile; missing uv, Python runtime, dependency profile, venv, package set, Torch wheel, native engine package, model asset, or companion asset produces only the applicable Runtime-private dependency state or typed request-time admission reason without mutating configuration, bindings, route, or machine selection. Ordinary users are never instructed to install these dependencies through a system package manager, global Python environment, user PATH, machine PATH, shell profile, or engine-private directory, and visible terminal or external package-manager flows exist only as diagnostic export and never as dependency-state truth.
    condition: Whenever a passive surface encounters missing local dependencies.
    failure: Reject silent heavy materialization and ordinary-user manual installation instructions.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.environment-materializer-plane
  - id: rule.nimi.runtime.local-compute.r087
    kind: rule
    title: Import-derived records are model families only
    modality: must
    statement: Explicit local imports may produce selected source records only for the model asset and companion asset families, imported paths never become Python, uv, CUDA, DLL, package-manager, Torch, or native engine package roots, and native stablediffusion-ggml source candidates link to the managed image backend package registry while selected source record promotion stays owned by the local environment materializer without inference from engine startup branches, command-line backend installers, or ad hoc code paths.
    condition: Whenever imports or package registries interact with selected source records.
    failure: Reject import-derived non-model records and promotion outside the materializer.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.environment-materializer-plane
  - id: rule.nimi.runtime.local-compute.r088
    kind: rule
    title: Materializer projection preserves non-ready states
    modality: must
    statement: RuntimeLocalService owns the app-facing materializer projection and command surface that reads the materializer registry for dependency families, resolves source candidates and source manifests from Runtime authority, projects current selected source summaries with bounded diagnostics, projects one capability-scoped confirmation payload covering every required dependency family, known or unknown aggregate size, storage categories, source owners, and the no-system-mutation policy before the first network or storage-heavy materialization, starts persistent materializer jobs for the complete confirmed dependency DAG without requiring an ordinary user to confirm its internal families separately, observes, cancels, retries, and repairs those jobs by dependency environment and Runtime job id, and projects activation gate failures without probing or installing dependencies, the dependency detail projection preserves the non-ready distinction among needs_confirmation, queued, downloading, verifying, installing, repair_required, failed, unsupported, and cancelled, and product-facing setup-required or confirmation text stays a projection of needs_confirmation never a ready state.
    condition: Whenever the materializer projection or command surface is served.
    failure: Reject per-family confirmation as the ordinary-user installation workflow, incomplete confirmed dependency DAG submission, collapsed non-ready states, and confirmation text treated as readiness.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.environment-materializer-plane
  - id: rule.nimi.runtime.local-compute.r089
    kind: rule
    title: Terminal jobs carry typed dispositions
    modality: must
    statement: Terminal dependency jobs project typed reason code and recovery disposition fields in addition to bounded diagnostic detail, failure detail stays human and debug context that SDK, Desktop, tester, and app consumers never parse to decide retry, auto-recovery, repair, or setup-state transitions, Runtime owns the classification of interrupted, manual-retry, repair-required, unsupported, and not-retryable outcomes, and local transfer records appear only as progress or diagnostic detail never targeting materializer commands, creating selected source records, or projecting readiness.
    condition: Whenever a dependency job terminates or transfer detail is projected.
    failure: Reject untyped terminals, consumer-parsed failure text, and transfer-driven readiness.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.environment-materializer-plane
  - id: rule.nimi.runtime.local-compute.r090
    kind: rule
    title: Download progress projection is bounded and honest
    modality: must
    statement: The dependency job projection carries bytes received as fetched on-disk bytes including any resumed prefix, bytes total as the known final size or zero when unknown, percent as an integer zero through one hundred projected only when the total is known with unknown totals rendering an indeterminate affordance rather than a fabricated percentage, speed in bytes per second computed only from positive observed bytes over positive elapsed time and otherwise absent, and ETA seconds projected only when total, speed, and remaining bytes are all positive and otherwise absent, the fields are meaningful only while a job actively transfers in downloading or verifying and project zero or absent for every other state without back-filling, carry-over, or fabrication, consumers gate percentage, rate, and ETA display on the transferring states and treat zero rate or ETA as not yet known rather than stalled, and the progress projection is an additive non-breaking detail that never changes job lifecycle, selected-source promotion, activation, or readiness semantics with bytes never promoting, selecting, or substituting for verification evidence.
    condition: Whenever dependency job download progress is projected or rendered.
    failure: Reject fabricated progress values and progress-derived readiness or selection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.environment-materializer-plane
  - id: rule.nimi.runtime.local-compute.r091
    kind: rule
    title: Install-level plan resolution is deterministic
    modality: must
    statement: Local environment plan resolution accepts an optional install level of minimal or recommended where a set install level without an explicit asset id resolves the pack model asset and companion asset dependencies internally through the deterministic curated-preset resolver from the preset plus host posture, an explicit asset id always wins and an unset install level preserves explicit-identity behavior, a compute pack may host multiple preset model slots so install-level resolution emits one model asset dependency per resolved hosted-slot capability each carrying its resolver-filled asset id and one companion dependency per resolved companion of those slots without key collisions because model asset keys derive from the asset id, the pack to hosted-capability relation is explicit Runtime authority mapping the local text pack to text generation, the local speech pack to transcription plus synthesis, and the local native image pack to image generation and is never keyed on consumer scope, and a resolver fail-close leaves the dependency in unsupported state carrying the typed resolver reason code and a non-empty stable pack default dependency id never projected as a ready or startable dependency.
    condition: Whenever install-level plan resolution runs or its dependencies are emitted.
    failure: Reject nondeterministic slot resolution, consumer-scope keying, and startable unresolved dependencies.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.environment-materializer-plane
  - id: rule.nimi.runtime.local-compute.r092
    kind: rule
    lifecycle: removed
    title: Retired Profile execution declaration resolver
    reason: Removed because Profile Apply never resolves required, optional, alternative, preferred, or fallback local execution entries.
  - id: rule.nimi.runtime.local-compute.r093
    kind: rule
    lifecycle: removed
    title: Retired Profile-driven local asset installation
    reason: Removed because Profile Apply never installs assets or produces Service, Node, binding, or local execution-plan truth.
  - id: rule.nimi.runtime.local-compute.r094
    kind: rule
    lifecycle: removed
    title: Retired four-stage Profile Apply pipeline
    reason: Removed because preflight, installation, bootstrap, health, and readiness are not part of Apply Profile to AIConfig.
  - id: rule.nimi.runtime.local-compute.r095
    kind: rule
    lifecycle: removed
    title: Retired Profile Apply rollback pipeline
    reason: Removed because Apply Profile to AIConfig has no installation or process side effects requiring a product rollback lifecycle.
  - id: rule.nimi.runtime.local-compute.r096
    kind: rule
    title: Local state persists atomically with bounded audit
    modality: must
    statement: Runtime persists the unique Machine Local AI Configuration and its Local Capability Configuration records atomically, may use a private compare-and-swap token only to prevent lost writes, stores no product revision or history, and persists LocalAsset inventory and ExecutionHost process records under their separate owners rather than duplicating binding or machine selection truth.
    condition: Whenever machine local configuration, LocalAsset inventory, or Runtime-private Host state changes or reloads.
    failure: Reject non-atomic writes, lost-write acceptance, product revision semantics, or duplicated configuration, binding, selection, asset, or process truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.machine-local-configuration-plane
  - id: rule.nimi.runtime.local-compute.r097
    kind: rule
    title: CapabilityImplementationDriver lookup is exact
    modality: must
    statement: Runtime loads the exact CapabilityImplementationDriver and dialect identity committed in a Local Capability Configuration, validates that it owns the named CapabilityImplementation and contracts, and never resolves a Driver from asset kind, provider, engine, node, model name, prefix, endpoint, capability-only table, wildcard, catalog order, or process availability.
    condition: Whenever a Local Capability Configuration is interpreted, admitted, or executed.
    failure: Fail interpretability or Job admission closed when the exact Driver is absent or incompatible without selecting another Driver or Host.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.machine-local-configuration-plane
      - type: supersedes
        target: rule.nimi.runtime.local-compute.r099
  - id: rule.nimi.runtime.local-compute.r098
    kind: rule
    title: Policy gates are explicit and typed
    modality: must
    statement: Driver compatibility and policy checks return a typed derived admission reason for the exact selected Local Capability Configuration and request, never create Node availability, readiness, routing, machine selection, supported-feature, or fallback truth, and remain traceable to the declaring Driver or policy owner.
    condition: Whenever a local Driver compatibility or policy gate is evaluated, projected, or audited.
    failure: Reject an unowned reason, gated request projected as admitted, or a gate that mutates committed configuration.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.machine-local-configuration-plane
  - id: rule.nimi.runtime.local-compute.r099
    kind: rule
    lifecycle: removed
    title: Retired active-service Node routing catalog
    reason: Removed because process health, live Node catalogs, provider hints, probes, and rank ordering no longer select local execution or establish capability availability.
  - id: rule.nimi.runtime.local-compute.r100
    kind: rule
    title: Local execution uses exact selected configuration and bindings
    modality: must
    statement: Local Job composition dereferences only the current explicit machine selection to one Local Capability Configuration and captures that record's exact CapabilityImplementation, Driver dialect and configuration, and exact required bindings; profile-binding, readiness, model prefix, filename, path, selected-source, catalog, Node, Service, resident model, or engine order never becomes routing truth, and missing, ambiguous, invalid, or failed inputs never trigger rebinding or any implementation, engine, model, configuration, provider, or Cloud fallback.
    condition: Whenever Local execution identity and exact inputs are composed.
    failure: Fail admission or the Job closed, preserve committed configuration and bindings, and reject prefix-derived truth, inventory search, ambient reassociation, or fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.machine-local-configuration-plane
  - id: rule.nimi.runtime.local-compute.r101
    kind: rule
    lifecycle: removed
    title: Retired occurrence rule that deferred ordering and bundle authority
    reason: Replaced by the media vertical slice occurrence rule that admits ordered occurrences and sharded-bundle identity.
  - id: rule.nimi.runtime.local-compute.r102
    kind: rule
    title: Driver-owned portable configuration excludes bindings and paths
    modality: must
    statement: Driver-owned portable configuration in a Local Capability Configuration may contain only fields defined by the exact dialect and never a LocalAsset id or path, exact binding, machine selection, process identity, endpoint, secret, or fallback list; Driver invocation combines validated portable configuration with separately captured exact bindings and request inputs without per-execution Profile override truth.
    condition: Whenever Driver-owned portable configuration is authored, updated, interpreted, or invoked.
    failure: Fail interpretation closed on unknown or protected fields instead of applying, ignoring, migrating, or inferring them.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.machine-local-configuration-plane
  - id: rule.nimi.runtime.local-compute.r103
    kind: rule
    title: Asset kind registry is closed and proto aligned
    modality: must
    statement: The local asset kind registry admits the current concrete-content kinds, with runnable chat mapping to the single text.generate CapabilityContract, image to image.generate, video to video.generate, tts to audio.synthesize, stt to audio.transcribe, and embedding to text.embed; passive kinds carry no CapabilityContract and are never directly scheduled, invoked, or interpreted as strict or substitutable requirement policy.
    condition: Whenever a local asset kind is declared, persisted, or mapped to a capability token.
    failure: Reject undeclared asset kinds, runnable kinds without their declared capability token, and scheduled or invoked passive kinds.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
  - id: rule.nimi.runtime.local-compute.r104
    kind: rule
    title: CapabilityContract to asset-kind mapping is exact and order independent
    modality: must
    statement: Exact CapabilityContract-to-LocalAsset-kind mapping uses text.generate to chat, text.embed to embedding, image.generate and image.edit to image, video.generate to video, audio.synthesize and admitted voice workflow contracts to tts, audio.transcribe to stt, and admitted music contracts to auxiliary; standardized features never create asset-kind mappings, first-match resolution is forbidden, and retired subtype or legacy aliases are accepted only by one-time non-product tooling outside Runtime and public contracts.
    condition: Whenever a CapabilityContract is validated against a LocalAsset kind.
    failure: Reject an unknown, ambiguous, order-dependent, feature-as-contract, subtype, or legacy alias mapping.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
  - id: rule.nimi.runtime.local-compute.r105
    kind: rule
    title: Explicit machine selection supersedes media arbitration
    modality: must
    statement: Runtime establishes or replaces the selected Local Capability Configuration relation only through the explicit machine-level Select Local Capability Configuration action, and explicit Delete of the selected record may clear it without replacement; Runtime retains the relation and every committed exact binding identity when a bound LocalAsset later becomes missing or damaged and never clears, rebinds, or re-arbitrates after import, install, removal, asset loss, health change, repair, process restart, or execution failure. Only explicit bind, unbind, rebind, requirement reprojection, or Update changes a binding, and when such an action or a later Driver or hard blocker leaves the selected record unresolved or blocked, the selection relation remains until explicit Select or Delete.
    condition: Whenever machine local selection is written or reevaluated.
    failure: Reject automatic takeover, ranking, replacement, clearing, or fallback and preserve the current relation with a typed derived admission reason.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.machine-local-configuration-plane
      - type: supersedes
        target: rule.nimi.runtime.local-compute.r059
  - id: rule.nimi.runtime.local-compute.r106
    kind: rule
    title: Residency is private ExecutionHost state
    modality: must_not
    statement: Runtime projects model residency, loading, switching, warm pool, lease, process health, or latest load failure as product readiness, Local Capability Configuration state, machine selection, route, binding, supported feature, or execution success.
    condition: Whenever ExecutionHost residency or supervision state changes or is observed.
    failure: Keep the fact Runtime-private and expose only the affected typed Job failure or Driver-classified persistent admission blocker.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.local-engine-plane
      - type: supersedes
        target: rule.nimi.runtime.local-compute.r065
  - id: rule.nimi.runtime.local-compute.r107
    kind: rule
    title: Machine local configuration actions replace Profile Apply stages
    modality: must
    statement: Runtime exposes separate atomic add or update, explicit requirement reprojection and exact bind, unbind, or rebind, select, and delete operations for Local Capability Configuration; Runtime generates a stable record identity that is neither revision nor history, may reuse an existing record only for exact portable-content equivalence, and requires an explicit user choice between Update existing and Add new when content associated with the same provenance changes. Before Select, an execution-relevant Update of the selected record, or Delete of the selected record commits, the operation displays the effect on all future matching Local App and LocalAgent execution and requires user-observed explicit confirmation, while presentation-only Update and Delete of an unselected record do not; none performs Profile Apply, automatic installation, process bootstrap, health probing, warming, provider connection testing, AIConfig mutation, or aggregate cross-action commit.
    condition: Whenever Machine Local AI Configuration is mutated.
    failure: Reject provenance-derived identity, silent overwrite, impact display treated as confirmation, a required mutation committed without explicit confirmation, a staged Apply pipeline, hidden side effect, partial success, cross-owner transaction, or readiness result.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.machine-local-configuration-plane
      - type: supersedes
        target: rule.nimi.runtime.local-compute.r094
  - id: rule.nimi.runtime.local-compute.r108
    kind: rule
    title: Ordered occurrences and sharded bundles are exact Driver-declared truth
    modality: must
    statement: Local Capability Configuration requirement projection creates a distinct required slot for every independently selected, downloaded, bound, or replaced resource occurrence and commits each exact binding or unresolved slot in that Local configuration rather than AIConfig; a Driver may project a role-scoped ordered occurrence sequence whose declared ordinal is exact configuration truth carried with only requirement identity, role, ordinal, and display label as public presentation and never inferred from filename, path, catalog order, or binding time; one LocalAsset may satisfy multiple occurrences with one exact binding per occurrence; a sharded multi-file resource forms one occurrence whose verified content identity is the canonical digest over its ordered per-entry digests and whose entries are never independent slots; an upstream optional file creates no slot unless the exact CapabilityImplementation and Driver declare it required, missing required occurrences fail admission without clearing other valid bindings or poisoning shared LocalAssets, and Runtime still admits no generic optional-requirement state machine or legacy slot-map interpretation.
    condition: Whenever a Driver projects, resolves, validates, or invokes local resource occurrences.
    failure: Preserve unresolved state and fail closed on a missing, ambiguous, skipped, defaulted, invented-optional, inferred-order, split-bundle, or legacy-normalized occurrence.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.machine-local-configuration-plane
      - type: supersedes
        target: rule.nimi.runtime.local-compute.r101
  - id: rule.nimi.runtime.local-compute.r109
    kind: rule
    title: Heavy media jobs hold one serial execution lease and report artifacts exactly
    modality: must
    statement: Heavy local media execution holds a single Runtime-private execution lease per engine instance and runs jobs serially in submission order per capability while queued jobs remain observable pending and cancellation is honored both queued and running; a media job may materialize multiple artifacts, each committed and addressable when produced, and its terminal outcome explicitly enumerates the produced artifacts together with the typed failure when generation ends early, never projecting partial production as success; lease occupancy and queue position stay Runtime-private and never become readiness, preference, routing, or selection truth.
    condition: Whenever a heavy local media job is queued, executed, canceled, or completed.
    failure: Reject parallel lease acquisition, silent queue reordering, dropped produced artifacts, partial output reported as success, or lease state projected as product truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.local-engine-plane
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
