format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.local-compute
units:
  - id: definition.nimi.runtime.local-compute.device-profile-plane
    kind: definition
    title: Runtime device profile plane
    meaning: The Runtime device profile plane owns LocalDeviceProfile collection and freshness, GPU, NPU, Python, disk, and port probing semantics, recommendation and installation warnings, and Runtime-private ExecutionHost admission facts without becoming AIConfig route, machine selection, standardized-feature support, or capability readiness authority.
  - id: definition.nimi.runtime.local-compute.asset-storage-manifest-plane
    kind: definition
    title: Runtime ModelAsset storage and manifest plane
    meaning: The Runtime ModelAsset storage and manifest plane owns the resolved and quarantine layout, per-import ModelAsset records, immutable content identity, file integrity, bounded content fingerprints, provenance, import safety, and manifest validation without interpreting capability, engine, Driver, recipe, slot, or execution semantics.
  - id: definition.nimi.runtime.local-compute.catalog-recommendation-plane
    kind: definition
    title: Runtime local catalog recommendation plane
    meaning: The Runtime local catalog recommendation plane owns non-binding catalog search ordering, recommendation payloads, format-aware variant descriptors, media and LLM fit evidence, community catalog access, and local download planning without selecting a Loadout, CapabilityImplementation, Driver, binding, route, or standardized-feature support.
  - id: definition.nimi.runtime.local-compute.category-capability-plane
    kind: definition
    title: Runtime ModelAsset inventory plane
    meaning: The Runtime ModelAsset inventory plane owns concrete per-import ModelAsset records, immutable content identity, local catalog installation and unclassified import semantics, verified content projection, duplicate-content hints, and private Service and Node execution projections without owning capability, engine, Driver, recipe, Loadout, binding, machine selection, route, feature support, or admission.
  - id: definition.nimi.runtime.local-compute.local-engine-plane
    kind: definition
    title: Runtime local engine plane
    meaning: The Runtime local engine plane owns Runtime-private ExecutionHost taxonomy, runtime modes, attached endpoint constraints, supervised process state, data-plane materialization roots for engine packages and dependency-profile capsules, and bootstrap download custody; public product configuration names the CapabilityImplementationDriver and dialect rather than choosing this Host taxonomy.
  - id: definition.nimi.runtime.local-compute.engine-protocol-health-plane
    kind: definition
    title: Runtime-private engine protocol and supervision plane
    meaning: The Runtime-private engine protocol and supervision plane owns exact pre-start ExecutionHost endpoint materialization, llama and sidecar protocol baselines, internal process reachability and recovery probes, attached-engine credential custody, engine HTTP failure mapping, and stream downgrade simulation; endpoint materialization may use private deterministic configuration or controlled allocation but promises no product-level fixed default port, and its process, endpoint, probe, warm, resident, and health facts never become product readiness, AIConfig route, machine selection, Loadout validity, standardized-feature support, or fallback authority.
  - id: rule.nimi.runtime.local-compute.r001
    kind: rule
    title: Device profile structure is fixed
    modality: must
    statement: LocalDeviceProfile carries os, arch, total_ram_bytes, available_ram_bytes, gpu, python, npu, disk_free_bytes, and ports, the gpu profile carries available, vendor, model, memory_model limited to discrete, unified, or unknown, plus optional total_vram_bytes and available_vram_bytes that stay empty when not reliably probed, and CollectDeviceProfile returns the complete current device snapshot.
    condition: Whenever a device profile is collected or returned.
    failure: Reject profiles missing required fields or carrying fabricated hardware values.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.device-profile-plane
  - id: rule.nimi.runtime.local-compute.r002
    kind: rule
    title: GPU detection order is fixed
    modality: must
    statement: GPU detection tries the NVIDIA command-line probe first and on success reports vendor nvidia with memory_model discrete and VRAM values from the probe, otherwise an Apple silicon unified-memory host reports vendor apple with memory_model unified, a best-effort chip model from an OS probe, and VRAM values that may reuse host RAM metrics, and any other outcome reports available false with memory_model unknown and empty VRAM values.
    condition: Whenever Runtime detects GPU hardware for the device profile.
    failure: Reject GPU results outside the declared detection order or with guessed vendor or memory values.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.device-profile-plane
  - id: rule.nimi.runtime.local-compute.r003
    kind: rule
    title: Unprobeable acceleration is low confidence
    modality: must
    statement: When the host cannot reliably report VRAM or unified-memory figures CollectDeviceProfile still succeeds with the affected values left empty, consumers treat the result as a low-confidence hardware profile rather than defaulting to zero, and accelerator vendors without an implemented probe report unavailable instead of inferred capacity.
    condition: Whenever hardware capacity cannot be reliably probed.
    failure: Reject errors, zero defaults, or fabricated capacity for unprobeable hardware.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.device-profile-plane
  - id: rule.nimi.runtime.local-compute.r004
    kind: rule
    title: NPU detection is environment driven
    modality: must
    statement: NPU detection reads only the NIMI_NPU_AVAILABLE, NIMI_NPU_READY, NIMI_NPU_VENDOR, and NIMI_NPU_RUNTIME environment variables with ready honored only while available is true, performs no OS-level NPU hardware probing, and reports available false and ready false when the variables are absent.
    condition: Whenever Runtime detects NPU state for the device profile.
    failure: Reject OS-probe-derived or defaulted NPU availability.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.device-profile-plane
  - id: rule.nimi.runtime.local-compute.r005
    kind: rule
    title: Python and diagnostic port probing are bounded
    modality: must
    statement: Python detection tries python3 then python version parsing and reports available false when both fail, while diagnostic port availability is judged only for an explicit bounded Runtime-private candidate set by a loopback TCP bind attempt released immediately on success; no default engine port list is promised, and the probe never materializes, selects, infers, or publishes an ExecutionHost endpoint.
    condition: Whenever Python runtime or port availability is probed.
    failure: Reject availability conclusions not backed by the declared probe.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.device-profile-plane
  - id: rule.nimi.runtime.local-compute.r006
    kind: rule
    title: Host recommendation warnings never block ModelAsset acquisition
    modality: must
    statement: Catalog install-plan resolution may derive WARN_GPU_REQUIRED, WARN_PYTHON_REQUIRED, and WARN_NPU_REQUIRED as non-binding recommendation warnings only from catalog-declared host requirements and current device facts, emits them only in the install-plan descriptor, and never treats a warning, engine, Driver, recipe compatibility, or host feasibility as ModelAsset content admission.
    condition: Whenever host recommendation evidence is evaluated for a catalog ModelAsset install plan.
    failure: Reject silent warning loss, engine-derived ModelAsset identity, or acquisition blocked by a recommendation warning alone.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.device-profile-plane
  - id: rule.nimi.runtime.local-compute.r007
    kind: rule
    title: Device profile truth is fresh and single
    modality: must
    statement: The device profile is collected live without a persistent cache at CollectDeviceProfile, when an explicit local install or recommendation action requests current host facts, and at request-time Runtime-private ExecutionHost admission when current compatibility matters, recommendation and install diagnostics share the same LocalDeviceProfile truth without a second product hardware truth, and profile import, Apply Profile to AIConfig, AIConfig route selection, Loadout save, and machine loadout state selection neither collect a device profile nor treat probe success as configuration or selection truth.
    condition: Whenever a consumer needs current device hardware truth.
    failure: Reject stale cached profiles, parallel product hardware truth, and probes coupled to profile, configuration, route, or selection actions.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.device-profile-plane
  - id: rule.nimi.runtime.local-compute.r008
    kind: rule
    title: ModelAsset storage layout is fixed
    modality: must
    statement: The Runtime managed models root contains exactly the resolved and quarantine subtrees, resolved holds one directory per committed ModelAsset instance with its canonical manifest and original nested payload names, quarantine holds failed intake and isolated snapshots, and no objects, sources, recipes, cache, model-resource store, or other model subtree is created; RecipeCustody and engine or dependency materialization remain under their separately owned Runtime data-plane roots.
    condition: Whenever ModelAsset storage is laid out, imported, installed, recovered, or scanned.
    failure: Reject an undeclared model subtree, model content outside resolved or quarantine, recipe or custody ownership in the models root, and orphan classification of a valid resolved manifest.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.asset-storage-manifest-plane
  - id: rule.nimi.runtime.local-compute.r009
    kind: rule
    title: ModelAsset manifest contains content facts only
    modality: must
    statement: A committed ModelAsset manifest contains one Runtime-generated per-import model_asset_id, immutable content_id, entry, ordered files with per-file digests, aggregate size, content_verified identity fact, optional catalog_verified fact, bounded raw content fingerprints, provenance, display metadata, and import safety facts; it contains no kind, CapabilityContract, standardized feature, engine, CapabilityImplementation, Driver, dialect, recipe, companion, slot, Loadout, binding, selection, route, residency, readiness, or execution option, and derived display labels remain non-authoritative and may be unclassified.
    condition: Whenever a ModelAsset manifest is authored, imported, installed, emitted, or repaired.
    failure: Fail closed on missing identity or integrity facts and reject every interpretation or execution-selection fact in the manifest.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.asset-storage-manifest-plane
  - id: rule.nimi.runtime.local-compute.r010
    kind: rule
    title: ModelAsset validation and import path truth fail closed
    modality: must
    statement: Manifest validation requires non-empty schema_version, model_asset_id, content_id, entry, files, and per-file hashes, requires entry and every hash key to name a normalized payload file, rejects absolute paths, parent traversal, links escaping staging, and executable treatment of imported code, recomputes the ordered content identity before commit, derives resolved paths only from the manifest parent and normalized payload names, and never rejects structurally safe content because a fingerprint is absent or because kind, capability, engine, Driver, recipe, catalog digest, or Model Contract interpretation is unknown; any interpretation occurs only in the exact Driver dialect during Loadout preparation and commit.
    condition: Whenever a ModelAsset manifest is validated or imported payload paths are resolved.
    failure: Quarantine failed intake without committed residue and reject path repair, catalog-digest admission, guessed identity, or import-layer model interpretation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.asset-storage-manifest-plane
  - id: rule.nimi.runtime.local-compute.r011
    kind: rule
    title: ModelAsset format policy is open
    modality: must
    statement: A ModelAsset payload may contain one or many files in GGUF, SafeTensors, or another safely stored format, preserves the distribution entry and nested names, and admits an unclassified payload without engine-specific entry selection or format-derived capability admission.
    condition: Whenever ModelAsset payload format or entry facts are admitted.
    failure: Reject single-format lockdown, engine-specific import interpretation, or capability truth inferred from format.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.asset-storage-manifest-plane
  - id: rule.nimi.runtime.local-compute.r012
    kind: rule
    title: ModelAsset is content custody only
    modality: must
    statement: A ModelAssetRecord identifies one per-import distribution instance containing one to many files, immutable content identity, integrity, bounded content fingerprints, provenance, install or import evidence, and display metadata; it owns no capability, kind, family, engine, Driver, recipe, companion, slot, execution option, readiness, or promotion-on-reference semantics, while Service and Node remain Runtime-private ExecutionHost projections and never become ModelAsset, Loadout, binding, selection, route, or execution authority.
    condition: Whenever ModelAsset, Service, or Node abstractions are stored or projected.
    failure: Reject an abstract or unverified ModelAsset, content interpretation stored as asset truth, persisted Node routing truth, or any asset or service field used as selection or routing authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
  - id: rule.nimi.runtime.local-compute.r013
    kind: rule
    title: Runtime process identity derives from captured assembly
    modality: must
    statement: A supervised process is created or reused only from the Job-captured ResolvedAssembly and exact Driver load plan, a single-worker llama process may switch only to another explicitly captured assembly under its bounded lease policy, ModelAsset identity alone never binds a Service or process, and process residency remains Runtime-private rather than inventory, Loadout, selection, or route truth.
    condition: Whenever a local process is materialized, reused, switched, or released.
    failure: Reject ModelAsset-to-Service binding, process identity derived from one main model alone, ambient switching, and residency projected as product truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
  - id: rule.nimi.runtime.local-compute.r014
    kind: rule
    title: Every acquisition mints one ModelAsset instance
    modality: must
    statement: Catalog installation and ImportModelAsset each mint a unique Runtime-generated model_asset_id for one per-import ModelAsset instance, compute and persist its immutable content_id and complete file integrity, retain bounded provenance, fingerprints, trust facts, and install metadata, and never create or update a Loadout, binding, selection, Driver, recipe, route, feature claim, readiness, or engine fact; multiple ModelAsset instances with the same content_id are legal and produce a non-blocking duplicate-content hint rather than identity reuse.
    condition: Whenever model content is installed or imported.
    failure: Reject acquisition missing verified content identity, reuse of an existing per-import identity, forced content deduplication, or any acquisition promoted to configuration or execution success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
  - id: rule.nimi.runtime.local-compute.r015
    kind: rule
    title: Catalog install descriptors project catalog truth
    modality: must
    statement: Every catalog install descriptor derives its offer, files, per-file hashes, total size, host recommendation inputs, non-binding content reference, and provenance from the local provider catalog recipe and slot metadata, Runtime keeps no in-process hardcoded verified offer metadata, and a catalog offer missing complete integrity hashes fails closed without becoming an installed ModelAsset or placeholder descriptor; a successful install mints a separate per-import ModelAsset identity.
    condition: Whenever catalog ModelAsset offers are projected or listed.
    failure: Fail closed on missing transfer-integrity material, parallel hardcoded catalog truth, or conflation of a catalog offer with an installed ModelAsset instance.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
  - id: rule.nimi.runtime.local-compute.r016
    kind: rule
    title: Server-held install plans gate catalog installation only
    modality: must
    statement: ResolveModelInstallPlan resolves only a user-explicit catalog ModelAsset acquisition, captures exact catalog source, file hashes, size, provenance, non-binding host warnings, owner and session, and stores the complete plan server-side behind an opaque plan_id with bounded TTL, single use, owner-session scope, and daemon-restart invalidation; InstallModelFromPlan accepts only plan_id, revalidates the held plan and per-file integrity, and atomically commits one ModelAsset, while ImportModelAsset remains a separate safe intake path that never requires or accepts a catalog install plan.
    condition: Whenever a catalog ModelAsset install plan is resolved or consumed.
    failure: Reject expired, replayed, foreign-owner, foreign-session, restart-stale, caller-reconstructed, hash-mismatched, or non-catalog plans without partial commit, and reject install-plan gating of manual import.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
  - id: rule.nimi.runtime.local-compute.r017
    kind: rule
    lifecycle: removed
    title: Retired custom invoke-profile requirement
    reason: Removed because custom ModelAssets are unclassified content and become executable only through an explicit Loadout whose exact versioned Driver dialect, recipeId, Model Contract, options, and bindings validate them; no custom invoke-profile mechanism remains.
  - id: rule.nimi.runtime.local-compute.r018
    kind: rule
    title: Local unavailability mapping is exact
    modality: must
    statement: When no usable local model exists a probe path returns ok false with AI_LOCAL_MODEL_UNAVAILABLE, an execution path returns FAILED_PRECONDITION with AI_LOCAL_MODEL_UNAVAILABLE, and service lifecycle and probe paths use the service sibling codes AI_LOCAL_SERVICE_UNAVAILABLE, AI_LOCAL_SERVICE_ALREADY_INSTALLED, and AI_LOCAL_SERVICE_INVALID_TRANSITION.
    condition: Whenever local model or service unavailability is reported.
    failure: Return the exact typed mapping without generic or silent outcomes.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
  - id: rule.nimi.runtime.local-compute.r019
    kind: rule
    title: Speech bundle projection is layered and explicitly materialized
    modality: must
    statement: The ordinary-user local speech bundle is a product projection over Runtime-owned speech asset and service truth that keeps environment bootstrap, capability download, and persistent Host materialization as internal layers of one explicit setup or repair operation rather than independent install objects. Only a user-invoked setup, download, or repair action may begin network- or storage-heavy materialization after explicit confirmation; AIConfig route selection, Select Loadout, route attempts, Job admission, page load, and passive probing never bootstrap an environment, download a capability, initialize a persistent Host, or accept confirmation on the user's behalf. Existing verified environments, caches, and materialized slices may be reused unless repair or removal demands otherwise, setup materializes only the explicitly requested capability without prefetching every speech slice, and an admitted Job may start an already-materialized private ExecutionHost on demand without creating product readiness, binding, machine-selection, or route truth.
    condition: Whenever the ordinary-user local speech bundle is projected, explicitly set up, downloaded, repaired, or used by a Job.
    failure: Fail closed awaiting an explicit setup or repair action and confirmation instead of coupling materialization to route, selection, admission, execution, page load, or probing or creating a second install owner.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
  - id: rule.nimi.runtime.local-compute.r020
    kind: rule
    title: Catalog search ordering is fixed
    modality: must
    statement: SearchCatalogModels orders verified rows before unverified rows and sorts case-insensitively by ascending title within each group, and neither recommendation metadata nor the recommendation feed surface rewrites this ordering.
    condition: Whenever catalog search results are ordered or presented.
    failure: Reject reordered results and recommendation-driven ordering rewrites.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r021
    kind: rule
    title: Recommendation payload is uniform and subordinate
    modality: must
    statement: SearchCatalogModels, ListCatalogVariants, and ResolveModelInstallPlan may attach one optional recommendation payload whose tier expresses main-model fit rather than end-to-end workflow readiness, whose host_support_class is limited to supported_supervised, attached_only, and unsupported, and whose confidence is limited to high, medium, and low, and the payload never overrides install availability, engine runtime mode, or existing warning and reason-code semantics.
    condition: Whenever a catalog surface returns recommendation metadata.
    failure: Reject undeclared payload values and recommendation overrides of install truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r022
    kind: rule
    title: Variant descriptors are format aware
    modality: must
    statement: A catalog variant descriptor carries filename, entry, files, and format plus optional size, sha256, and recommendation fields, GGUF variants support precise entry-level recommendation, and SafeTensors variants may carry only conservative repo-level or artifact-level recommendation exposed with low confidence.
    condition: Whenever catalog variants are listed or described.
    failure: Reject GGUF-only descriptor shapes and overconfident coarse recommendations.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r023
    kind: rule
    title: Media fit evaluation is bounded and honest
    modality: must
    statement: Media fit applies only to image and video main models without judging complete workflows, estimates memory from main artifact size, device profile RAM, VRAM, or unified memory, and engine-specific conservative overhead, counts hard prerequisites in estimates and notes without deciding the main tier, fixes the image baseline at 1024x1024 text-to-image and the video baseline at 720p four-second sixteen-fps text-to-video without audio, maps estimates within seventy, eighty-five, and one hundred percent of the host budget to recommended, runnable, and tight with beyond-budget as not_recommended, and lowers confidence with reasons on incomplete metadata or device profile instead of silently reporting high confidence.
    condition: Whenever media fit recommendation is computed.
    failure: Reject workflow-scope claims, undeclared baselines, and silent high-confidence fallbacks.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r024
    kind: rule
    title: LLM fit reuses shared truth and exposes inference
    modality: must
    statement: LLM fit maps the shared LocalDeviceProfile into a non-binding recommendation evaluator without a second hardware truth, may present conservative parameter, context, quantization, and confidence inferences with provenance, and may return an explicitly ordered recommendation set for user choice but never a fallback list, automatic binding, Loadout, machine selection, supported-feature claim, or execution route.
    condition: Whenever LLM fit recommendation is computed.
    failure: Reject parallel hardware truth, hidden inference-derived confidence, or recommendation output consumed as binding, selection, routing, or fallback authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r025
    kind: rule
    title: Recommendation feed stays a bounded read surface
    modality: must
    statement: A capability-scoped recommendation feed may exist beside the catalog surface only when its candidate pools output install-bridge-ready entry metadata, RuntimeLocalService owns model index caches, installed-state projection, device-profile fit evaluation, and the final tier, host support, and confidence ordering with Desktop consuming SDK projections for rendering only, worker and index layers never become host-fit, readiness, or install action truth, and feed items reuse the same recommendation payload semantics without a second recommendation contract.
    condition: Whenever a recommendation feed surface is served or consumed.
    failure: Reject feed-owned fit truth, second recommendation contracts, and worker-owned readiness.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r026
    kind: rule
    title: Hugging Face access is direct and normalized
    modality: must
    statement: Hugging Face is the sole community catalog source accessed through direct REST calls without hf-hub or Hugging Face hub SDK dependencies, repo identifiers in hf scheme, full URL, or bare org slash model form normalize internally to org slash model, artifact downloads construct resolve URLs from repo, revision, and file path on the huggingface.co host, and community search uses the models REST API with search, pipeline tag, and library filters under a twenty-second timeout and a result limit between one and eighty.
    condition: Whenever Runtime searches or downloads from the Hugging Face catalog.
    failure: Reject undeclared SDK dependencies, unnormalized repo identity, and out-of-bounds search parameters.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r027
    kind: rule
    title: HF capability inference fails closed
    modality: must
    statement: Hugging Face capability inference maps text-generation and text2text-generation to chat, text-to-image to image, text-to-video to video, text-to-speech and text-to-audio to tts, automatic-speech-recognition to stt, and feature-extraction and sentence-similarity to embedding, and a row whose pipeline tag and tags match nothing is treated as missing capability evidence that never defaults to chat and never enters installable or executable catalog projections.
    condition: Whenever community model capabilities are inferred from catalog metadata.
    failure: Fail closed on unmatched rows instead of defaulting capabilities.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r028
    kind: rule
    title: HF source recommendations split portable and runtime truth
    modality: must
    statement: An AIProfile local implementation intent may carry one portable multi-axis Loadout intent containing recipeId, execution options, and for each Driver slot a content identity, declared expected integrity, and optional Hugging Face source recommendation containing repo identity, revision, one relative file, and an optional size hint; every recommendation is neither a ModelAsset binding nor proof that content exists. Runtime exclusively owns auth-token custody, gated access, terms approval, observed integrity, transfer state, canonical catalog manifests, and access-denied evidence, none of which persists in AIProfile or AIConfig. Import Profile and Apply Profile never download, resolve, verify, bind, or prepare a source; only a separate user-explicit ModelAsset intake may acquire it. A multi-file source is automatically acquirable only when Runtime's canonical catalog resolves its content identity to a complete verified manifest; otherwise later Prepare and Commit Loadout actions preserve that axis as unresolved content-only intent. Declared expected integrity is hard verification for catalog acquisition, while manual import computes its own identity and never gains provenance verification from association alone.
    condition: Whenever a Hugging Face source recommendation is declared, displayed, or consumed.
    failure: Fail closed on custody violations, recommendation-as-binding, implicit preparation, and implied provenance.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r029
    kind: rule
    title: Download sessions are resumable and explicit
    modality: must
    statement: Local downloads resume with HTTP range requests skipping completed byte ranges, retry with exponential backoff capped at eight attempts stepping from three hundred milliseconds through one, five, fifteen, thirty, sixty, one hundred twenty, and one hundred eighty seconds, move through queued, running, paused, failed, completed, and cancelled states driven only by explicit control commands without UI pseudo-pause, convert residual running or queued sessions to paused with an interruption reason after process restart requiring manual resume, verify per-file SHA-256 with an optional prefix and return AI_LOCAL_DOWNLOAD_HASH_MISMATCH on mismatch, and stage files under a per-asset staging directory committed by atomic rename with rollback on failure.
    condition: Whenever a model asset download session runs.
    failure: Reject implicit state transitions, automatic post-restart resumption, and unverified commits.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r030
    kind: rule
    title: Download progress and failure classes are typed
    modality: must
    statement: Download progress events carry install session identity, phase, received and total bytes, speed, eta, message, state, optional reason code and retryability, and done plus success flags, network, timeout, and disk failures mark the session failed and retryable while preserving partial staging for resume, hash mismatches mark it failed and non-retryable while clearing staging and forbidding resume, and cancellation marks it cancelled while clearing staging.
    condition: Whenever download progress or failure is reported.
    failure: Reject untyped progress, resumable hash failures, and retained staging after cancel.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r031
    kind: rule
    title: Fingerprint labels stay bounded and Driver slots stay exact
    modality: must
    statement: ModelAsset fingerprints may supply bounded display tags only, while CapabilityContract and standardized-feature support come from the exact CapabilityImplementation validated by its versioned Driver dialect; a text-only llama recipeId projects no mmproj slot, and a dialect declaring text.generate input.image projects one required independently bound mmproj model slot validated by its recipe-specific Model Contract without parent, companion, family, filename, or catalog-content authority.
    condition: Whenever Runtime derives ModelAsset display labels or a llama Driver projects model slots and features.
    failure: Reject model name, filename, catalog, label, or family inference as support or binding truth and fail closed on a missing or incompatible required mmproj slot.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.catalog-recommendation-plane
  - id: rule.nimi.runtime.local-compute.r032
    kind: rule
    title: Engine taxonomy is closed
    modality: must
    statement: The public local engines are exactly llama for text generation, text embedding, and image and audio understanding, media for image generation and editing plus video generation, speech for the local speech family line, and sidecar for the external music sidecar, the canonical local engine catalog table is the single engine value-domain source with consuming code generated from or mechanically checked against it, retired engine identities are neither engines nor execution truth sources, the internal diffusers driver stays a runtime-internal media backend never exposed as a public engine target, and backend_class stays orthogonal to the public engine without becoming a public routing knob or provider alias.
    condition: Whenever engine identities or backend classes are declared, consumed, or projected.
    failure: Reject undeclared engines, retired identities, and public exposure of internal backends.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.local-engine-plane
  - id: rule.nimi.runtime.local-compute.r033
    kind: rule
    title: Engine runtime modes are two
    modality: must
    statement: Local engine runtime mode admits exactly ATTACHED_ENDPOINT and SUPERVISED, sidecar admits only ATTACHED_ENDPOINT, and llama, media, and speech admit both modes.
    condition: Whenever an engine runtime mode is declared or resolved.
    failure: Reject undeclared modes and supervised sidecar operation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.local-engine-plane
  - id: rule.nimi.runtime.local-compute.r034
    kind: rule
    title: Attached endpoints are explicit and proven
    modality: must
    statement: An attached-endpoint engine requires an explicitly admitted exact private endpoint with no silently restored loopback default, Runtime never starts, stops, or restarts the external process, the attached endpoint must expose its engine's canonical API surface, and attached Host topology never chooses or outranks a Loadout, binding, machine selection, AIConfig route, or model; Runtime fails closed when the exact Job composition cannot use that Host.
    condition: Whenever an attached-endpoint engine is configured or consumed.
    failure: Fail closed on missing endpoints, unproven execution capability, and Host topology projected as route, model, binding, or machine-selection authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.local-engine-plane
  - id: rule.nimi.runtime.local-compute.r035
    kind: rule
    title: Supervised processes are managed with bounded recovery
    modality: must
    statement: A supervised engine is forked, monitored, and reclaimed by Runtime, shuts down with a graceful termination signal escalated to kill after timeout, restarts with exponential backoff from a two-second base with jitter for at most five attempts before marking UNHEALTHY, and a stale recorded pid is terminated only when Runtime proves it still belongs to the current supervised engine binary while unprovable identity limits cleanup to tracking files.
    condition: Whenever a supervised engine process is started, restarted, or reclaimed.
    failure: Reject unbounded restarts and termination of unverified processes.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.local-engine-plane
  - id: rule.nimi.runtime.local-compute.r036
    kind: rule
    title: Supervised materialization root is data-plane bound
    modality: must
    statement: Managed engine binaries land only under the data-plane environments root in per-engine per-version directories, immutable Python dependency-profile capsules land only under that root in content-addressed profile directories, shared package-cache payloads remain under a Runtime-owned data-plane dependency root, registries and profile promotion are atomic, home-directory roots never serve as parallel materialization truth, and missing data root configuration fails materialization closed without a home fallback.
    condition: Whenever a managed engine binary or environment is materialized.
    failure: Fail closed without home-directory fallback or a second root truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.local-engine-plane
  - id: rule.nimi.runtime.local-compute.r037
    kind: rule
    title: Bootstrap downloads have a closed redirect policy
    modality: must
    statement: Supervised engine bootstrap downloads follow only https-to-https redirects, allow same-host redirects, allow github.com release assets to redirect only to the explicit GitHub release-chain hosts github.com, objects.githubusercontent.com, and release-assets.githubusercontent.com, fail closed on every other redirect, and llama supervised bootstrap uses the official ggml-org llama.cpp release pack landing the llama-server binary.
    condition: Whenever a supervised engine bootstrap artifact is downloaded.
    failure: Fail closed on undeclared redirect targets or unofficial bootstrap sources.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.local-engine-plane
  - id: rule.nimi.runtime.local-compute.r038
    kind: rule
    title: ExecutionHost endpoints are exact and Runtime private
    modality: must
    statement: Before a local ExecutionHost starts, Runtime materializes one exact private endpoint through private deterministic Host configuration or controlled allocation and captures it as Host input; authority promises no product-level fixed default port, neighboring-port search, caller or ambient inference, environment default, catalog routing identity, or endpoint-bearing AIConfig, Profile, Driver target, Loadout, binding, or selection. An attached-endpoint Host requires an exact Runtime-admitted endpoint and fails closed with AI_LOCAL_ENDPOINT_REQUIRED when absent, an unsupported local image Host fails with AI_LOCAL_MODEL_UNAVAILABLE rather than demanding an endpoint, and no Job executes before its Host has yielded the exact endpoint.
    condition: Whenever a local ExecutionHost endpoint is materialized, bound, or validated.
    failure: Fail closed with the exact typed reason on missing, conflicting, externally supplied, or unmaterialized Host input without exposing a public port identity or alternate routing path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.engine-protocol-health-plane
  - id: rule.nimi.runtime.local-compute.r039
    kind: rule
    title: llama and sidecar protocol baselines are fixed
    modality: must
    statement: The llama Driver serves the canonical chat completions, embeddings, and model-listing HTTP dialect and carries only its declared contract support, the sidecar Driver serves the canonical music-generation HTTP dialect and stays outside scheduled Runtime-private Host probing with attached execution failing closed only on a real music Job, backend names passed to the managed llama Host admit only llama-cpp, whisper-ggml, and stablediffusion-ggml without arbitrary passthrough, and no user-facing surface directly exposes workflow assembly, companion-model composition, or pipeline DAGs.
    condition: Whenever llama or sidecar protocol surfaces are dispatched or projected.
    failure: Reject undeclared endpoints, capability bleed, arbitrary backend passthrough, and user-facing DAG exposure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.engine-protocol-health-plane
  - id: rule.nimi.runtime.local-compute.r040
    kind: rule
    title: llama supervision remains Runtime-private
    modality: must_not
    statement: Llama process reachability, endpoint probes, warmup, residency, model listing, bootstrap state, or previous execution success is exposed as Loadout readiness, machine selection truth, supported-feature truth, route availability, or a prerequisite for saving, applying, binding, or selecting configuration.
    condition: Whenever llama process supervision or product capability state is projected.
    failure: Keep supervision evidence private to ExecutionHost and derive only request-time admission or Job failure from exact committed configuration.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.engine-protocol-health-plane
  - id: rule.nimi.runtime.local-compute.r041
    kind: rule
    title: Private Host recovery probing is persistent and decaying
    modality: must
    statement: A supervised ExecutionHost process in its Runtime-private unhealthy supervision state is reprobed at an eight-second interval, returns to its private active state after three consecutive probe successes, retries without a maximum count until explicit Host stop or removal, decays the interval to sixty seconds after seven hundred twenty consecutive failures and to five minutes after twenty-four cumulative hours, resets to eight seconds on any success, and resets the consecutive-success count on any failure; these states and probes never mutate AIConfig, Loadout, exact bindings, machine selection, or completed and running Jobs and never project product readiness.
    condition: Whenever Runtime-private supervised Host recovery probing runs.
    failure: Reject abandoned recovery, undeclared intervals, success counting across failures, and product projection of private supervision state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.engine-protocol-health-plane
  - id: rule.nimi.runtime.local-compute.r042
    kind: rule
    title: Speech admission is derived from exact composition
    modality: must
    statement: A local speech request uses its committed AIConfig Local route, required standardized features and defaults together with the current machine-selected Loadout for that CapabilityContract only to derive pre-submission admission from Driver interpretability, complete model axes, Model Contracts, feature-subset satisfaction, RecipeCustody, and current private ExecutionHost constraints; at Job submission Runtime revalidates the exact content bytes and atomically persists the selected Loadout identity and complete ResolvedAssembly before publication. Missing slices or placeholder execution support fail closed with a typed admission reason without downloading, probing, changing route or machine selection, or projecting readiness; queued, running, and resumed speech Jobs never reread current AIConfig, Loadout, catalog, inventory, machine selection, process state, or private CAS, and temporary speech files keep a bounded lifecycle while reference audio, transcription text, and voice-creation text descriptions never enter long-term retention through generic logging.
    condition: Whenever a local speech request is composed or admitted.
    failure: Fail closed on incomplete exact composition without readiness projection, implicit setup, or fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.engine-protocol-health-plane
  - id: rule.nimi.runtime.local-compute.r043
    kind: rule
    title: Attached engine credentials use custody references
    modality: must
    statement: An attached engine endpoint requiring a credential stores only an opaque credential reference resolved inside Runtime service-principal custody, inline API keys, environment-variable key fields, request injection, and user-session vaults are forbidden, local supervised engines normally require no API key with any upstream requirement satisfied only from Runtime-owned custody, and a credential-free engine is never treated as unconfigured for lacking a credential reference.
    condition: Whenever local engine credentials are stored or resolved.
    failure: Reject inline credential material and unconfigured classification of credential-free engines.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.engine-protocol-health-plane
  - id: rule.nimi.runtime.local-compute.r044
    kind: rule
    title: Engine HTTP failures map to fixed gRPC codes
    modality: must
    statement: Local engine HTTP responses map 400 to INVALID_ARGUMENT, 401 and 403 to PERMISSION_DENIED, 404 to NOT_FOUND, 408 to DEADLINE_EXCEEDED, 429 to UNAVAILABLE, 500 to INTERNAL, and 502, 503, and 504 to UNAVAILABLE, with unlisted 4xx as INVALID_ARGUMENT and unlisted 5xx as UNAVAILABLE.
    condition: Whenever a local engine HTTP failure is mapped to a gRPC status.
    failure: Reject mappings outside the fixed table.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.engine-protocol-health-plane
  - id: rule.nimi.runtime.local-compute.r045
    kind: rule
    title: Stream downgrade is detected and simulated honestly
    modality: must
    statement: A streaming request answered with HTTP 404, 405, or 501, a non-event-stream content type, or an error body indicating unsupported streaming is treated as no native streaming support, the downgrade re-executes without streaming and emits the full response in twenty-four-character slices with a shorter final slice, terminal metadata marks stream_simulated true with the stream-fallback audit tag, simulated events still satisfy canonical stream event semantics, a speech synthesis downgrade also projects voice_output_mode simulated_stream, and simulated output never satisfies native realtime acceptance.
    condition: Whenever an engine cannot serve a requested stream natively.
    failure: Reject silent downgrade, unmarked simulation, and simulated output claiming native realtime.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.engine-protocol-health-plane
  - id: definition.nimi.runtime.local-compute.accelerator-dependency-plane
    kind: definition
    title: Runtime accelerator dependency plane
    meaning: The Runtime accelerator dependency plane owns shared accelerator dependency readiness for supervised local execution, including CUDA user-space runtime source policy, accelerator profile and dependency projection boundaries, dependency resolver states, selected source records, dependency job and repair semantics, and supervised process environment constraints.
  - id: definition.nimi.runtime.local-compute.topology-resolver-plane
    kind: definition
    title: Runtime local topology validation plane
    meaning: The Runtime local topology validation plane owns exact Driver and ExecutionHost compatibility validation for a committed Loadout and Job-captured ResolvedAssembly, including matrix matching, typed conflicts, private media modes, lifecycle, and error attribution without interpreting ModelAsset inventory or selecting implementation, slots, bindings, route, or fallback.
  - id: definition.nimi.runtime.local-compute.runtime-environment-plane
    kind: definition
    title: Runtime local engine runtime environment plane
    meaning: The Runtime local engine runtime environment plane owns typed llama engine configuration, supervised llama residency truth, text-model selectability relaxation, managed image backend package admission, native-binary image execution, managed Python dependency-profile identity, exact lock and shared package-cache semantics, immutable profile promotion and isolated worker execution, the daemon core readiness boundary against local bootstrap work, and the local environment setup plan authority.
  - id: definition.nimi.runtime.local-compute.speech-engine-plane
    kind: definition
    title: Runtime local speech engine plane
    meaning: The Runtime local speech engine plane owns implementation-neutral admitted speech and voice.create Driver and ExecutionHost compatibility, concrete implementation and install-offer facts including Qwen3 speech and the release-0.6.1 audio.cpp TTS and ASR families, separate execution and consumer lines, dependency-profile resolution for those lines, bounded reference-voice custody, and private supervised materialization; it owns no CapabilityContract identity, default STT or TTS model lane, binding, Loadout, machine selection, AIConfig route, or execution target.
  - id: definition.nimi.runtime.local-compute.consumer-activation-plane
    kind: definition
    title: Runtime-private local dependency activation plane
    meaning: The Runtime-private local dependency activation plane owns dependency verification requests and responses for internal execution consumers, dependency environment and Python dependency-profile key derivation, profile-consumption verification projections, private activation-state mapping, process-local environment deltas, reason ownership, consumer and pack registry lockstep, and selected-source evidence without making profile consumption a new selected-source owner; it is neither an AIConfig owner nor a CapabilityContract, Loadout, machine selection, product readiness, route, feature-support, or first-run authority.
  - id: definition.nimi.runtime.local-compute.environment-materializer-plane
    kind: definition
    title: Runtime local environment materializer plane
    meaning: The Runtime local environment materializer plane owns the admitted materializer families, materializer job execution and verification, the materializer projection and command surface, download progress projection, and install-level plan resolution for local environment dependencies.
  - id: definition.nimi.runtime.local-compute.profile-application-plane
    kind: definition
    lifecycle: removed
    title: Retired Runtime local Profile application plane
    reason: Removed because Profile Apply no longer resolves, installs, binds, selects, probes, warms, bootstraps, or rolls back local execution state.
  - id: definition.nimi.runtime.local-compute.machine-local-configuration-plane
    kind: definition
    title: Runtime Loadout plane
    meaning: The Runtime Loadout plane persists the unique machine Loadout store and stable Loadout resources containing exact recipeId and Driver dialect, typed options, independently projected model slots with exact ModelAsset and expected content identities or unresolved state, RecipeCustody references, validation facts, and at most one current selected Loadout per CapabilityContract; App and shared LocalAgent AIConfig Local branches remain route-only, Runtime reads the current matching selection only for effective projection and new Job admission, and ModelAsset inventory, catalog recipes, dependency activation, process supervision, ResolvedAssembly, and Jobs remain separate owners.
    relations:
      - type: supersedes
        target: definition.nimi.runtime.local-compute.profile-application-plane
  - id: rule.nimi.runtime.local-compute.r046
    kind: rule
    title: Accelerator dependency readiness is Runtime owned
    modality: must
    statement: Runtime owns shared accelerator dependency readiness for supervised local execution, CUDA user-space runtime readiness is never owned by image assets, engines, package installers, Desktop, or SDK, ordinary users are never required to install CUDA Toolkit, configure CUDA_PATH or CUDA_HOME, or place nvcc on PATH before an admitted Windows NVIDIA local execution path, accelerator profile and dependency tables stay accelerator-specific projections of canonical local environment authority preserving distinct failed, unsupported, repair_required, and cancelled semantics without becoming parallel consumer authority, image topology tables may reference dependency and consumer ids without owning CUDA source selection, installation, repair, or selected source records, and Desktop, SDK, and app code only project runtime dependency truth without probing, installing, or inferring CUDA readiness.
    condition: Whenever accelerator dependency readiness is owned, projected, or consumed.
    failure: Reject consumer-side probing, parallel accelerator authority, and ordinary-user toolkit installation requirements.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.accelerator-dependency-plane
  - id: rule.nimi.runtime.local-compute.r047
    kind: rule
    title: Windows NVIDIA CUDA source policy is system first
    modality: must
    statement: Windows NVIDIA CUDA source selection tries a compatible system CUDA user-space runtime proven from canonicalized allowlisted evidence, then a previously verified runtime-managed CUDA dependency under the Runtime dependency root, then a declared managed dependency package after explicit user confirmation for first network materialization, system source proof is positive across source identity, canonical root, required DLL and file set, version metadata or binary version, driver compatibility, and selected source record creation, PATH serves only as a hint and never selects a source by DLL precedence alone, and model directories, import directories, and arbitrary user-selected directories are rejected as CUDA DLL sources.
    condition: Whenever a Windows NVIDIA CUDA user-space runtime source is resolved.
    failure: Fail closed without a verified source instead of accepting unproven or precedence-derived sources.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.accelerator-dependency-plane
  - id: rule.nimi.runtime.local-compute.r048
    kind: rule
    title: Managed accelerator sources require complete proof
    modality: must
    statement: Managed accelerator source proof includes the declared package source, archive hash verification, staged extraction, required artifact set verification, version and driver compatibility where available, atomic promotion, repair metadata, and a selected source record created before any consumer activation.
    condition: Whenever a managed accelerator dependency is materialized or promoted.
    failure: Reject activation on any missing proof element instead of promoting a partially verified source.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.accelerator-dependency-plane
  - id: rule.nimi.runtime.local-compute.r049
    kind: rule
    title: Dependency resolver states are closed and fail closed
    modality: must
    statement: Dependency resolver state admits exactly unknown, ready_system, ready_managed, materializable_requires_confirmation, queued, downloading, verifying, installing, repair_required, failed, unsupported, and cancelled projected through stable install, health, and audit detail, materializable_requires_confirmation may appear as installable or review-needed setup but never becomes ACTIVE or health success, activation and ready health for accelerator-backed consumers require ready_system or ready_managed, and failed, cancelled, and repair_required project as fail-closed dependency setup or repair detail rather than topology unsupported or pseudo-success.
    condition: Whenever accelerator dependency state is resolved or projected.
    failure: Reject undeclared states and ready projections without a ready state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.accelerator-dependency-plane
  - id: rule.nimi.runtime.local-compute.r050
    kind: rule
    title: Selected source records are single and shared
    modality: must
    statement: Exactly one active selected-source record exists per Runtime dependency environment as private verification evidence, all consumers of that same environment reference it without independently resolving another source, and Python dependency-profile consumption evidence references the canonical source records without creating consumer-scoped ownership. Neither record becomes a Loadout, ModelAsset axis, selection, CapabilityImplementationDriver choice, route, feature support, admission, or direct Job input; only a non-model RecipeCustody reference explicitly proposed by Prepare Loadout and persisted by Commit Loadout may enter the Loadout, and a Job receives that identity only inside its submission-captured ResolvedAssembly.
    condition: Whenever selected source records are created, referenced, or invalidated.
    failure: Reject duplicate active records, independent re-resolution, fallback state, or promotion of selected-source evidence into product configuration or routing truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.accelerator-dependency-plane
  - id: rule.nimi.runtime.local-compute.r051
    kind: rule
    title: Dependency jobs are explicit with repair locks
    modality: must
    statement: Dependency setup is idempotent for the same dependency environment while a job is active with duplicate consumer requests attaching to the same active job id, cancellation is explicit and stops before promotion, repair locks exclude activation using the corrupt dependency until Runtime verification restores a ready state, repair never collapses into unsupported or ready without verification, and automatic reinstall is forbidden unless the current confirmation policy admits it for that repair case.
    condition: Whenever accelerator dependency jobs run, cancel, or repair.
    failure: Reject implicit cancellation, activation through repair locks, and unadmitted automatic reinstalls.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.accelerator-dependency-plane
  - id: rule.nimi.runtime.local-compute.r052
    kind: rule
    title: Dependency environment mutation is process local
    modality: must
    statement: Runtime may prepend a selected dependency directory only to the supervised engine child process PATH, never mutates machine PATH, user PATH, shell profiles, system CUDA configuration, global Python, or package-manager global state, canonicalizes dependency paths before use, and records selected source and verification detail in runtime-private audit and health detail.
    condition: Whenever a supervised engine process environment is prepared.
    failure: Reject persistent host environment mutation and uncanonicalized dependency paths.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.accelerator-dependency-plane
  - id: rule.nimi.runtime.local-compute.r053
    kind: rule
    title: Canonical topology validation is unique and ordered
    modality: must
    statement: Given an explicitly committed Loadout, exact versioned Driver dialect and recipeId, typed options, Driver-projected slots, Model Contract results, Job-captured ModelAsset content identities, and host facts, Runtime validates at most one compatible private topology; this validation never derives semantics from ModelAsset labels or catalog state, chooses implementation, Driver, slot topology, binding, route, or selection, and ambiguity fails closed.
    condition: Whenever an explicitly selected local Loadout is admitted for execution.
    failure: Reject ambiguous, unsupported, unadmitted, catalog-reinterpreted, or label-derived compatibility without searching, ranking, substituting, or changing the committed Loadout.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.topology-resolver-plane
  - id: rule.nimi.runtime.local-compute.r054
    kind: rule
    title: Topology and product states filter resolution
    modality: must
    statement: Removed internal topology entries never participate, deprecated entries may be inspected only by one-time repair tooling, supported entries may inform explicit installation recommendation and Driver compatibility validation, and proposed or unsupported entries fail closed without becoming default, route, selection, fallback, readiness, or health truth.
    condition: Whenever an internal topology entry is considered for recommendation, repair, or exact Driver validation.
    failure: Reject removed, deprecated-default, proposed-success, unsupported-success, or any implicit product selection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.topology-resolver-plane
  - id: rule.nimi.runtime.local-compute.r055
    kind: rule
    title: Topology inputs are layered and exact
    modality: must
    statement: Internal topology validation consumes only the committed CapabilityImplementation, exact versioned Driver dialect and recipeId, typed options, host facts, Driver-projected slots, Model Contract evidence, and Job-captured ResolvedAssembly; ModelAsset labels or fingerprints outside a Driver Model Contract, preferred engine, filename, model lineage, dependency family, mutable path, catalog order, or legacy backend hints never select or overwrite implementation, Driver, slot, binding, or selection.
    condition: Whenever exact Driver and Host compatibility inputs are evaluated.
    failure: Reject hint-driven selection, live catalog reinterpretation, non-canonical input, missing captured proof, or inferred overwrite.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.topology-resolver-plane
  - id: rule.nimi.runtime.local-compute.r056
    kind: rule
    title: Resolver output is complete
    modality: must
    statement: Internal topology validation output carries only bounded compatibility and Runtime-private ExecutionHost detail traceable to the committed implementation and Driver; it does not publish a resolved route, selected model, product readiness, supported-feature claim, or reusable binding.
    condition: Whenever internal topology validation succeeds or returns recognized fail-closed detail.
    failure: Reject incomplete diagnostics or output consumed as public configuration, selection, or execution truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.topology-resolver-plane
  - id: rule.nimi.runtime.local-compute.r057
    kind: rule
    title: Admission gates bind only proposed topologies
    modality: must
    statement: An internal experimental topology gate applies only to an explicitly chosen CapabilityImplementation and Driver during compatibility validation, comes only from canonical registration, and never creates a selectable Loadout, supported standardized feature, route, fallback, or product readiness fact; stable use requires the implementation registry entry itself to be admitted.
    condition: Whenever an internal experimental topology gate is declared or evaluated.
    failure: Reject an unregistered gate, stable use of an experimental entry, or a gate token treated as product selection or readiness.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.topology-resolver-plane
  - id: rule.nimi.runtime.local-compute.r058
    kind: rule
    title: Image topology classification is fixed
    modality: must
    statement: For an explicitly chosen image CapabilityImplementation and Driver, verified artifact format and bundle evidence classify only Driver compatibility and requirement projection, artifact roles remain bundle-internal facts, and an unsupported classification fails closed without selecting another implementation, Host mode, route, or binding.
    condition: Whenever an image Driver classifies exact bound artifact shape.
    failure: Fail closed on unknown or unsupported shape without attached-endpoint, implementation, provider, or route fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.topology-resolver-plane
  - id: rule.nimi.runtime.local-compute.r059
    kind: rule
    lifecycle: removed
    title: Retired media supervised automatic selection
    reason: Removed because media uses the explicit Machine Local AI Configuration selection relation and never re-arbitrates after removal, health change, repair, or import.
  - id: rule.nimi.runtime.local-compute.r060
    kind: rule
    title: Media supervised modes share one HTTP surface
    modality: must
    statement: The media ExecutionHost may privately distinguish native proxy and Python pipeline supervised modes behind one canonical Host protocol, but the exact committed CapabilityImplementationDriver maps execution to that Host and no Host mode, environment variable, endpoint, catalog row, or process state selects the implementation, Loadout, machine relation, or route.
    condition: Whenever a media Driver invokes a supervised Host mode or its private protocol.
    failure: Reject undeclared modes, protocol divergence, Host-owned product selection, and legacy control-plane fabrication.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.topology-resolver-plane
  - id: rule.nimi.runtime.local-compute.r061
    kind: rule
    title: Internal media lifecycle is a closed ladder
    modality: must
    statement: Local media process, materialization, control-plane, execution-plane, degradation, repair, and residency states remain Runtime-private ExecutionHost or dependency facts, persist no product active selection, and project no public capability readiness, Loadout state, supported-feature truth, machine selection, or route availability.
    condition: Whenever the internal local media lifecycle transitions, persists, or projects diagnostics.
    failure: Reject a private lifecycle fact promoted to product configuration, selection, admission, or readiness authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.topology-resolver-plane
  - id: rule.nimi.runtime.local-compute.r062
    kind: rule
    title: Dual-plane Host preparation is private and bounded
    modality: must
    statement: Media Job execution proceeds only after its selected Driver privately prepares the required control and execution Host planes within bounded startup budgets; incomplete or over-budget preparation fails only that Job unless the Driver classifies a persistent hard blocker, and never changes binding, machine selection, route, configuration, or public readiness.
    condition: Whenever a selected local media Job prepares Host planes or startup budgets elapse.
    failure: Fail the Job closed on incomplete preparation, terminate over-budget work, and preserve committed configuration.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.topology-resolver-plane
  - id: rule.nimi.runtime.local-compute.r063
    kind: rule
    title: Local error attribution is prioritized and typed
    modality: must
    statement: Local failure attribution preserves one stable primary typed reason and bounded secondary Driver or Host detail; missing exact required bindings and incompatible committed configuration fail admission, ordinary bootstrap, load, health, or execution failures terminate only the affected Job, only a Driver-classified persistent hard blocker may update derived admission, and no failure clears a binding, changes selection, triggers ambient re-resolution, or invokes fallback.
    condition: Whenever local admission, Driver, Host, or Job failures are attributed or mapped.
    failure: Reject an untyped or multi-primary error, configuration mutation from ordinary execution failure, ambient repair, or fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.topology-resolver-plane
  - id: rule.nimi.runtime.local-compute.r064
    kind: rule
    title: Llama engine config parameter space is typed and closed
    modality: must
    statement: The llama CapabilityImplementationDriver dialect owns typed portable execution options such as context size, cache quantization, flash attention, and GPU-layer policy and maps validated values to invocation, while mmproj is never a portable path option or parent-coupled companion and instead comes only from an exact independently projected model slot binding; unknown or invalid dialect fields fail interpretation closed.
    condition: Whenever llama Driver configuration is interpreted or mapped to invocation.
    failure: Fail interpretation closed on unknown or invalid values, path-bearing portable bindings, a missing required mmproj model slot, or an ambiguous binding.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.runtime-environment-plane
  - id: rule.nimi.runtime.local-compute.r065
    kind: rule
    lifecycle: removed
    title: Retired public supervised llama residency state
    reason: Removed because residency, loading, switching, and warm failure are Runtime-private ExecutionHost facts and no longer project product readiness or routability.
  - id: rule.nimi.runtime.local-compute.r066
    kind: rule
    title: Local selection and Job preparation are distinct
    modality: must
    statement: A Loadout may be selected only when its exact versioned Driver dialect and recipeId are interpretable, every required model axis is bound as model_asset_id plus expected_content_id, every Model Contract passes, and required RecipeCustody is present, without process start, warm, resident load, endpoint probe, or execution proof; each later Job revalidates bytes and atomically persists its complete ResolvedAssembly before preparing the captured Driver and Host on demand, and preparation failure does not invalidate or rewrite the selection or Loadout.
    condition: Whenever machine selection or on-demand Local Job preparation is evaluated.
    failure: Reject an uninterpretable or unresolved selection, selection-time probe or warm, and any Job preparation result written back as configuration readiness or automatic re-selection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.runtime-environment-plane
  - id: rule.nimi.runtime.local-compute.r067
    kind: rule
    title: Managed image backend packages have one canonical source
    modality: must
    statement: The managed image backend package registry is the single normative source for runtime-owned image backend package materialization, package refs are never inferred from ad hoc code branches or engine command-line backend installers, a host tuple may carry multiple package source entries while exactly one supported entry stays canonical for default resolution on that tuple, proposed package entries are runtime-private experimental sources selected only by an explicit runtime-private selector and never auto-selected, implicitly promoted, or used as hidden fallback when the canonical source is unavailable or slow, current admission supports the darwin arm64 Apple stablediffusion-ggml tuple through the canonical LocalAI-derived OCI payload with the official direct archive staying runtime-private experimental, supports the windows amd64 NVIDIA stablediffusion-ggml tuple through the runtime-owned direct archive package and wrapper launch path with CUDA resolved as a shared accelerator dependency before activation or health success, and keeps the linux amd64 NVIDIA tuple unsupported until a published runtime-owned package exists, and a topology recognized in the supervised backend matrix with unsupported package admission fails closed without silently promoting the host tuple.
    condition: Whenever a managed image backend package source is resolved or admitted.
    failure: Fail closed on unadmitted tuples instead of inferring, promoting, or falling back to experimental sources.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.runtime-environment-plane
  - id: rule.nimi.runtime.local-compute.r068
    kind: rule
    title: Native-binary image execution is direct
    modality: must
    statement: Canonical native-binary image execution uses the managed image backend gRPC contract directly through LoadModel, GenerateImage, and Free behind the Runtime-private ExecutionHost, Apps consume only canonical image CapabilityContract requests, typed admission, Job state, and artifact projections through the Nimi app-facing surface, backend control and ExecutionHost health remain Runtime-private and never establish capability readiness, native-binary success never depends on proxy import support, and llama model import is never part of the canonical native-binary image path on any supported host tuple.
    condition: Whenever native-binary image execution or its control surface is dispatched.
    failure: Reject proxy-import dependencies, llama import participation, App-facing Host control or health, and every public capability-readiness projection in the canonical path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.runtime-environment-plane
  - id: rule.nimi.runtime.local-compute.r069
    kind: rule
    title: Python dependency profiles are exact and immutable
    modality: must
    statement: Runtime uses its precisely pinned managed uv tool as the sole Python materialization pipeline without a PATH-selected tool or second bootstrap implementation, fixes managed Python at version 3.12, and materializes immutable consumer-independent dependency-profile capsules rather than a venv per model or one mutable global site-packages environment. A profile fingerprint includes the exact Python version and ABI, OS and architecture, host-derived accelerator plane, Torch version, CUDA ABI, complete transitive exact dependency-lock digest, wheel identity, package-index and package-source identities, and Driver protocol and version, while model id, dependency consumer, host-profile id, user folder name, and import path are never profile-key material; equal fingerprints reuse one profile, any incompatible or changed factor creates a new isolated profile, and Runtime never guesses or dynamically merges dependency sets. All profiles use one Runtime-owned content-addressed package cache, uv performs only exact frozen synchronization and cache linking from declared lock inputs with same-volume hardlinks on Windows and clone or copy-on-write linking on macOS and Linux, and Nimi retains source, lock, probe, verification, and promotion ownership. Creation stages an isolated profile, verifies its declared imports and accelerator execution, and atomically promotes it; a promoted profile is never mutated, upgrade creates a new fingerprint and root, and each worker executes with that profile's Python in an independent process without startup-time resolution or synchronization. Budgets fix Python runtime creation at one hundred twenty seconds, dependency materialization at six hundred seconds, and pipeline warmup at three hundred seconds; retry applies only to transient initial network transfer failures, offline materialization is admitted only when every locked artifact is already in the managed cache, and ABI incompatibility, lock or cache incompleteness, missing wheels, source mismatch, or import failure always fails closed.
    condition: Whenever a managed Python dependency profile is created, verified, reused, upgraded, or cleaned.
    failure: Reject PATH or parallel bootstrap paths, consumer-keyed or mutable environments, incomplete profile identity, dynamic dependency merging, unpinned or undeclared sources, post-promotion mutation, in-process workers, retry of non-transient failures, and offline success without every locked artifact.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.runtime-environment-plane
  - id: rule.nimi.runtime.local-compute.r070
    kind: rule
    title: Daemon service lifecycle excludes capability and local-state feasibility
    modality: must
    statement: Daemon STARTING covers only bounded core initialization, opened or explicitly isolated stores, serving admitted listeners, and constructed core services; record-level or document-level ModelAsset and Loadout state isolation, local engine downloads, dependency materialization, model loading, provider diagnostics, and repair Jobs never hold STARTING open and produce only exact typed isolation, supervision, dependency, ModelAsset, derived-admission, or Job outcomes. Provider or capability probes never drive daemon READY or DEGRADED, and missing or isolated model state, Loadout state, Connector, Driver, capability, or local environment never makes RuntimeLocalService, RuntimeAuditService, status, Product Control, or ordinary Home unavailable.
    condition: Whenever daemon lifecycle overlaps local state, execution, dependency, ModelAsset, or provider work.
    failure: Reject silent state clearing, service startup blocked by an isolatable local-state failure, capability-feasibility gating, reusable provider-health state, private Host supervision projected as readiness, or core surfaces hidden by Local or Cloud execution failure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.runtime-environment-plane
  - id: rule.nimi.runtime.local-compute.r071
    kind: rule
    title: Local environment setup unit is the plan
    modality: must
    statement: Runtime owns local environment setup truth whose unit is a Runtime local environment plan rather than a model row, Loadout, engine installer, Desktop workflow, package-manager command, developer script, or provider-health probe; plans resolve only Runtime-owned engine packages, CUDA, uv, managed Python, venv, package sets, Torch wheels, RecipeCustody, and other non-model dependencies from exact source policy and host facts into typed dependency state, confirmation, activation, and repair. ModelAsset acquisition remains a separate explicit catalog install or ImportModelAsset operation, every formerly companion model is an ordinary independent ModelAsset, and cloud-only use never requires local dependency materialization.
    condition: Whenever local environment setup is planned or cloud-only usage is evaluated.
    failure: Reject model auto-download through environment planning, a parent-coupled companion family, setup truth outside plans, package-set pseudo-readiness, or local dependencies imposed on cloud-only usage.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.runtime-environment-plane
  - id: rule.nimi.runtime.local-compute.r072
    kind: rule
    title: Speech catalog offers preserve concrete family roles
    modality: must
    statement: The local speech catalog may expose concrete Qwen3 install offers where qwen3_asr keeps the existing qwen-asr-package Driver for its exact package-native Qwen3-ASR bundle separate from a Transformers-native Driver and managed Python package set for exact Qwen3-ASR-0.6B-hf and Qwen3-ASR-1.7B-hf folder bundles, exposes 0.6B-hf as the visible recommended Transformers-native option and 1.7B-hf as an explicit higher-resource option, and requires explicit Driver and model selection with no fallback, migration, or cross-Driver bundle admission; qwen3_tts distinguishes Qwen3-TTS-12Hz-0.6B-CustomVoice for plain synthesis, Qwen3-TTS-12Hz-0.6B-Base for reference-audio voice creation, and Qwen3-TTS-12Hz-1.7B-VoiceDesign for text-description voice creation. The release-0.6.1 audio.cpp surface admits twenty-four concrete TTS-capable implementations including the TTS routes owned by MiniMax-H3 and Vevo2, eleven concrete offline core-text ASR implementations, and the twenty reference-audio voice.create implementations required by those TTS dialects as separate exact catalog rows and Driver identities with immutable recommended GGUF file evidence; MioTTS alone declares an independent MioCodec ModelAsset slot, Inflect v2 alone declares the eSpeak-ng native-library dependency, and the ASR dialects admit supported RIFF/WAVE input and text output while timestamps, diarization, speaker count, and streaming remain outside this slice. These source, role, format, compatibility, and user-visible recommendation facts never establish a default lane, binding, Loadout, machine selection, or execution route, and voice creation promotes to executable truth only after its real capability slice is admitted and explicitly configured and selected.
    condition: Whenever concrete local speech families, offers, roles, or voice-creation admission are projected.
    failure: Reject a catalog or engine default, implicit binding or selection, collapsed role, or voice-creation promotion before explicit admission.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.speech-engine-plane
  - id: rule.nimi.runtime.local-compute.r073
    kind: rule
    title: Speech execution lines resolve dependency profiles independently
    modality: must
    statement: Every admitted local speech or voice.create CapabilityImplementation retains its own execution and consumer line and declares exact Driver, asset, source-feature, and dependency requirements, while dependency-profile reuse is determined only by equality of the complete canonical fingerprint, so identical fingerprints may reuse one immutable profile and incompatible fingerprints resolve to isolated profiles without dynamic co-installation, dependency merging, cross-Driver admission, or environment-owned selection; the concrete qwen3_tts synthesis and voice.create implementations, each qwen3_asr implementation, and every release-0.6.1 audio.cpp TTS, ASR, and reference-voice implementation follow this same boundary, with physical audio.cpp package and CUDA selected-source reuse never collapsing their public identities or Model Contracts, and Qwen3-ASR-1.7B remains only a separately visible candidate never auto-materialized or selected by environment topology.
    condition: Whenever local speech environments are materialized for an admitted exact implementation.
    failure: Reject assumed family co-installation, consumer- or model-keyed profiles, dynamic dependency merging, cross-Driver admission, environment-owned binding or selection, and automatic materialization of a recommendation candidate.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.speech-engine-plane
  - id: rule.nimi.runtime.local-compute.r074
    kind: rule
    title: Admitted local speech Host materialization is capability scoped
    modality: must
    statement: When an admitted machine-selected Loadout for a committed Local route requires a supervised speech ExecutionHost, Runtime may present its setup as one bundle-shaped surface while keeping environment, bootstrap, and Host details private; materialization stays lazy for the exact requested capability so transcription materializes only the exact dependencies and Host Driver declared by its admitted qwen3_asr implementation, with the qwen-asr-package and Transformers-native implementations remaining separate and neither probing, falling back to, migrating, or substituting the other's model bundle, Driver, or declared dependency requirements, while equality of their complete dependency-profile fingerprints may reuse the same immutable capsule without cross-Driver model admission. Plain synthesis materializes only its admitted qwen3_tts implementation including its exact host-appropriate Torch and torchaudio requirements, requires verified CUDA execution before activating that implementation on an admitted NVIDIA host, and carries the admitted request through bounded Driver execution without a shorter private transport deadline or fixed short generation ceiling preempting the owning Local speech Job. Each audio.cpp speech implementation materializes only the release-0.6.1 native package, CUDA13 selected source, exact family ModelAsset occurrences, and any dialect-specific dependency it declares; only the Inflect v2 synthesis consumer materializes the pinned eSpeak-ng native-library payload, and no audio.cpp Host or model tag selects another family, task, Loadout, binding, or fallback. Local voice.create materializes only the exact Job-admitted implementation, requires the request source feature to be declared by that implementation, and invokes it through the implementation-neutral voice.create Driver and Host contract without source-based selection or fallback; audio.cpp reference-voice creation captures a supported WAV and optional required transcript into an opaque Runtime-owned session-ephemeral handle, replays idempotently from the Job-captured assembly, and deletes its private files with the VoiceAsset, while the Qwen3-TTS Base and VoiceDesign implementations remain concrete participants in the same contract rather than owners of it. Supervised or attached Host topology never chooses a Loadout, model, binding, route, or default lane and does not outrank another exact admitted Host composition.
    condition: Whenever an admitted machine-selected local speech composition materializes its ExecutionHost.
    failure: Reject generic-row projection, Host-topology-owned route or selection, cross-capability prefetch, package-set-only Torch readiness, unverified NVIDIA execution, and silent long-synthesis truncation caused only by a private Host or Driver deadline or fixed short generation ceiling.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.speech-engine-plane
  - id: rule.nimi.runtime.local-compute.r075
    kind: rule
    title: Dependency activation is consumer keyed and Runtime private
    modality: must
    statement: Local dependency activation is consumer-keyed and Runtime-private, where the consumer id names an internal execution dependency consumer rather than an app, module, feature requirement owner, AIConfig owner, LocalAgent, UI consumer, CapabilityImplementation, or Loadout; a pack id may accompany a request only as private projection context after exact Job composition identifies its dependency families and never performs route, implementation, binding, or machine-selection arbitration; consumers never select sources, create selected-source records, run installers, repair dependencies, mutate PATH or global Python or package-manager state, or project product readiness, and they consume only dependency-verification responses and selected-source evidence through explicit Runtime-private mapping metadata.
    condition: Whenever a local environment activation consumer is declared, requested, or mapped.
    failure: Reject consumer-created setup truth, product readiness projection, and consumer identity reuse as configuration, route, or selection identity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.consumer-activation-plane
  - id: rule.nimi.runtime.local-compute.r076
    kind: rule
    title: Activation request identity vocabulary is fixed
    modality: must
    statement: An activation request carries the internal consumer id, optional projection pack id, host profile id, platform tuple, runtime data root, exact non-model dependency identities, and any RecipeCustody source and hash selected by the committed Loadout; ModelAsset slot paths and content identities enter only through the Job-captured ResolvedAssembly and never become dependency selected-source identity, while catalog offer ids, recipe metadata, Loadout ids, UI rows, transfer ids, consumer ids, engine-private paths, and route-local handles never substitute for dependency identity.
    condition: Whenever an activation request or dependency identity is composed.
    failure: Reject ModelAsset ownership in the dependency store, parent or companion identity, projection handles, or catalog selectors written as dependency identity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.consumer-activation-plane
  - id: rule.nimi.runtime.local-compute.r077
    kind: rule
    title: Environment and Python profile keys derive from canonical inputs
    modality: must
    statement: Runtime derives each dependency environment key only from the owning non-model dependency authority where CUDA keys on dependency, host, platform, and data root; native engine packages on exact package, backend, platform, and data root; uv and Python on pinned versions and ABI; Torch on exact accelerator, ABI, wheel, index, source, platform, and data root; and RecipeCustody on recipe identity, pinned non-model source, digest, and data root. Python profile identity composes exact Python, platform, accelerator, Torch, lock, source, and Driver protocol inputs and excludes ModelAsset, model slot, Loadout, consumer, mutable path, catalog offer, and selected-source record ids; equal profile digests reuse one immutable capsule without consumer-scoped selected-source ownership.
    condition: Whenever a dependency environment or Python profile key is derived or persisted.
    failure: Reject ModelAsset- or companion-keyed dependency environments, undeclared key fields, mutable paths, or projection handles.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.consumer-activation-plane
  - id: rule.nimi.runtime.local-compute.r078
    kind: rule
    title: Private activation response and verification condition are fixed
    modality: must
    statement: Runtime owns the internal logical operation ResolveLocalEnvironmentConsumerActivation whose response carries the consumer id and projection pack id, private activation state, ordered blocking dependencies, dependency entries with family, dependency id, environment key, required flag, selected-source record id, source kind, canonical root, dependency state, reason code, bounded diagnostic detail, process-local environment deltas, and audit metadata including host profile and platform tuple; its internal ready state is valid only when every required dependency is ready_system or ready_managed, every referenced selected-source record passes repair, compatibility, and verification checks, and every required consumer- or model-specific Python dependency-profile consumption projection references the exact promoted immutable profile and passes its fingerprint, lock, source, Driver, import, and accelerator compatibility checks. Neither the operation nor its state is exposed as product capability readiness, route, selection, binding, or feature support.
    condition: Whenever consumer activation is resolved or its response composed.
    failure: Reject incomplete responses, internally ready states with unverified dependencies, and product projection of the private activation result.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.consumer-activation-plane
  - id: rule.nimi.runtime.local-compute.r079
    kind: rule
    title: Private activation state mapping is prioritized
    modality: must
    statement: Runtime-private dependency activation state resolves in the priority order of unsupported, then repair_required, then failed, then cancelled, then setup_in_progress, then setup_required, then ready; queued, downloading, verifying, and installing dependency states map to setup_in_progress, unknown and needs_confirmation map to setup_required, non-ready states never map to active, degraded-ready, best-effort-ready, endpoint-ready, or import-ready, and no activation state is projected as product readiness or used to choose a route, implementation, binding, or machine selection.
    condition: Whenever dependency states map to an activation state.
    failure: Reject out-of-priority mappings and ready-like projections of non-ready states.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.consumer-activation-plane
  - id: rule.nimi.runtime.local-compute.r080
    kind: rule
    title: Activation deltas are process local only
    modality: must
    statement: Activation deltas are process-local and consumable only after selected-source, dependency-profile, and RecipeCustody verification succeeds; admitted deltas are child-process PATH additions for selected CUDA artifacts, exact engine package roots, pinned uv, the promoted Python profile and interpreter, read-only pipeline and custody references, and the Job-captured ModelAsset paths from ResolvedAssembly. A worker starts independently without resolving, downloading, synchronizing, installing, or rewriting models or dependencies, and deltas never become readiness or mutate user PATH, machine PATH, shell profiles, system CUDA, global Python, package-manager state, or engine-private persistent setup.
    condition: Whenever activation environment deltas are produced or consumed.
    failure: Reject unverified or non-captured ModelAsset paths, Loadout-time download, persistent mutation, and readiness inferred from deltas.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.consumer-activation-plane
  - id: rule.nimi.runtime.local-compute.r081
    kind: rule
    title: Activation reasons have declared owners
    modality: must
    statement: Private activation reason codes live in the canonical activation-gate reason registry with each code declaring ownership by a dependency family, selected-source record state, dependency-profile consumption projection, or host-capability projection and implementations never inventing unregistered codes; vulkan_runtime_unavailable and metal_runtime_unavailable are host-capability projection reasons that admit no Vulkan or Metal dependency materializers and create no selected-source records, and speech Driver import and execution compatibility belongs to dependency-profile consumption verification grounded in the canonical Python package-set and Torch source records, with speech consumers using python_package_set_missing rather than a separate engine-local speech Driver installer or consumer-scoped Torch source.
    condition: Whenever activation reason codes are declared, emitted, or consumed.
    failure: Reject unregistered reason codes and materializers implied from projection reasons.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.consumer-activation-plane
  - id: rule.nimi.runtime.local-compute.r082
    kind: rule
    title: Consumer and pack registries stay lockstep
    modality: must
    statement: Consumer requirement authority, local compute pack consumer references, and the activation contract stay in lockstep with no orphaned consumer ids in either direction, pack-level optional dependency families are Desktop and setup projection only and never weaken consumer-level required dependency evaluation once a specific consumer is selected, and cloud-only usage issues no local consumer activation request and resolves no local environment dependencies.
    condition: Whenever consumer requirements, pack references, or cloud-only posture are evaluated.
    failure: Reject orphaned consumer ids and pack-level weakening of required evaluation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.consumer-activation-plane
  - id: rule.nimi.runtime.local-compute.r083
    kind: rule
    title: Private dependency verification never derives from side effects
    modality: must_not
    statement: Runtime treats a private dependency as verified from file existence, directory presence, endpoint reachability, transfer completion, package directory presence, PATH precedence, import success, import directory contents, script exit, process liveness, warmup success, or previous health success without a selected-source record whose content, source, compatibility, and repair evidence all pass the declared dependency checks, or treats a dependency-profile import, Driver, or accelerator probe as creating or replacing selected-source truth rather than only verifying that profile's consumption compatibility.
    condition: Whenever Runtime-private dependency verification evidence is evaluated.
    failure: Fail closed without a verified selected-source record and never project the result as product readiness.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.consumer-activation-plane
  - id: rule.nimi.runtime.local-compute.r084
    kind: rule
    lifecycle: removed
    title: Retired first-run Local AI baseline evidence
    reason: Removed because Local dependency activation and selected-source evidence no longer participate in Product Control ready_for_use.
  - id: rule.nimi.runtime.local-compute.r085
    kind: rule
    title: Materializers are the only dependency and custody materialization path
    modality: must
    statement: Runtime materializers are the only admitted product path for the CUDA accelerator runtime, native llama engine package, native stablediffusion-ggml engine package, native audio.cpp engine package, pinned eSpeak-ng native library, uv tool, Python runtime, venv, Python package set, Torch wheel, and RecipeCustody families; a Python dependency profile remains an immutable composition of existing families rather than a new selected-source owner. A ModelAsset is acquired only by explicit catalog install or ImportModelAsset, every model formerly described as a companion is another ordinary ModelAsset acquisition, and no Loadout action invokes either acquisition. Each materializer remains a RuntimeLocalService job executor that stages, verifies, and atomically promotes only its own selected-source evidence under Runtime-owned roots and is never a Desktop workflow, engine-local installer, script, package-manager command, PATH helper, transfer record, endpoint probe, or model row.
    condition: Whenever a local dependency or RecipeCustody family is materialized or a Python profile is composed, verified, or promoted.
    failure: Reject materialization outside admitted Runtime executors, ModelAsset or companion ownership in a dependency family, Loadout-triggered download, or a dependency profile treated as a new selected-source family.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.environment-materializer-plane
  - id: rule.nimi.runtime.local-compute.r086
    kind: rule
    title: Passive surfaces and Loadout commits never start heavy materialization
    modality: must
    statement: Prepare Loadout, Commit Loadout, Select Loadout, ExecutionHost or Python startup, request composition, connector diagnostics, import review, SDK reads, Desktop page load, and background maintenance never download a ModelAsset or begin first heavy or network dependency materialization and never resolve, synchronize, install into, or rewrite a promoted dependency profile; missing ModelAssets, RecipeCustody, uv, Python, profiles, package sets, Torch, or engine packages produce only typed unresolved, dependency, admission, or Job outcomes without mutating Loadout, bindings, route, or selection. Ordinary users are never directed to system package managers, global Python, PATH, shell profiles, or engine-private directories as dependency truth.
    condition: Whenever a passive surface or Loadout action encounters missing model or dependency content.
    failure: Reject silent download or materialization, implicit confirmation, configuration mutation, and ordinary-user manual installation instructions.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.environment-materializer-plane
  - id: rule.nimi.runtime.local-compute.r087
    kind: rule
    title: Imports produce only ModelAsset records
    modality: must
    statement: ImportModelAsset produces only a ModelAsset record and payload under resolved, never a dependency selected-source record, RecipeCustody entry, Python, uv, CUDA, DLL, package-manager, Torch, or native engine package root; user-imported code is registered as non-executable payload, while RecipeCustody and managed backend sources come only from their pinned Runtime authority and materializer.
    condition: Whenever ModelAsset import or a package registry interacts with local source records.
    failure: Reject import-derived dependency or custody records, executable treatment of imported code, and selected-source promotion outside its materializer.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.environment-materializer-plane
  - id: rule.nimi.runtime.local-compute.r088
    kind: rule
    title: Materializer projection preserves confirmation and non-ready states
    modality: must
    statement: RuntimeLocalService owns the app-facing materializer projection and command surface for non-model dependencies and RecipeCustody, resolves exact source manifests, projects bounded selected-source diagnostics, presents one capability-scoped confirmation payload covering the complete dependency DAG, aggregate size, storage categories, source owners, and no-system-mutation policy before first heavy materialization, and owns persistent observe, cancel, retry, and repair operations. The projection preserves needs_confirmation, queued, downloading, verifying, installing, repair_required, failed, unsupported, and cancelled, never treats setup text as readiness, and lists any recommended ModelAsset acquisitions separately as explicit catalog install actions rather than confirmed dependency children.
    condition: Whenever the materializer projection or command surface is served.
    failure: Reject hidden ModelAsset download, incomplete confirmed dependency submission, collapsed non-ready states, per-internal-family ordinary-user confirmation, or confirmation text treated as readiness.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.environment-materializer-plane
  - id: rule.nimi.runtime.local-compute.r089
    kind: rule
    title: Terminal jobs carry typed dispositions
    modality: must
    statement: Terminal dependency jobs project typed reason code and recovery disposition fields in addition to bounded diagnostic detail, failure detail stays human and debug context that SDK, Desktop, Nimi Lab, and app consumers never parse to decide retry, auto-recovery, repair, or setup-state transitions, Runtime owns the classification of interrupted, manual-retry, repair-required, unsupported, and not-retryable outcomes, and local transfer records appear only as progress or diagnostic detail never targeting materializer commands, creating selected source records, or projecting readiness.
    condition: Whenever a dependency job terminates or transfer detail is projected.
    failure: Reject untyped terminals, consumer-parsed failure text, and transfer-driven readiness.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.environment-materializer-plane
  - id: rule.nimi.runtime.local-compute.r090
    kind: rule
    title: Download progress projection is bounded and honest
    modality: must
    statement: The dependency job projection carries bytes received as fetched on-disk bytes including any resumed prefix, bytes total as the known final size or zero when unknown, percent as an integer zero through one hundred projected only when the total is known with unknown totals rendering an indeterminate affordance rather than a fabricated percentage, speed in bytes per second computed only from positive observed bytes over positive elapsed time and otherwise absent, and ETA seconds projected only when total, speed, and remaining bytes are all positive and otherwise absent, the fields are meaningful only while a job actively transfers in downloading or verifying and project zero or absent for every other state without back-filling, carry-over, or fabrication, consumers gate percentage, rate, and ETA display on the transferring states and treat zero rate or ETA as not yet known rather than stalled, and the progress projection is an additive non-breaking detail that never changes job lifecycle, selected-source promotion, activation, or readiness semantics with bytes never promoting, selecting, or substituting for verification evidence.
    condition: Whenever dependency job download progress is projected or rendered.
    failure: Reject fabricated progress values and progress-derived readiness or selection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.environment-materializer-plane
  - id: rule.nimi.runtime.local-compute.r091
    kind: rule
    title: Install-level planning keeps models explicit
    modality: must
    statement: Local environment plan resolution may deterministically derive the non-model dependency DAG and a separate ordered recommendation list containing one visible ModelAsset catalog offer per Driver-declared recipe slot from the same catalog version and captured host posture; every recommended model item remains an independent user acquisition with its own install plan and confirmation, no parent or companion identity or group compatibility guarantee is created, no ModelAsset becomes a dependency child or starts automatically, and unresolved recommendation or dependency outcomes remain typed and non-startable.
    condition: Whenever install-level or recipe recommendation planning emits dependencies or model offers.
    failure: Reject hidden or grouped model download, parent-coupled companion identity, nondeterministic slot recommendation, consumer-scope keying, and startable unresolved entries.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.environment-materializer-plane
  - id: rule.nimi.runtime.local-compute.r092
    kind: rule
    lifecycle: removed
    title: Retired Profile execution declaration resolver
    reason: Removed because Profile Apply never resolves required, optional, alternative, preferred, or fallback local execution entries.
  - id: rule.nimi.runtime.local-compute.r093
    kind: rule
    lifecycle: removed
    title: Retired Profile-driven local asset installation
    reason: Removed because Profile Apply never installs assets or produces Service, Node, binding, or local execution-plan truth.
  - id: rule.nimi.runtime.local-compute.r094
    kind: rule
    lifecycle: removed
    title: Retired four-stage Profile Apply pipeline
    reason: Removed because preflight, installation, bootstrap, health, and readiness are not part of Apply Profile to AIConfig.
  - id: rule.nimi.runtime.local-compute.r095
    kind: rule
    lifecycle: removed
    title: Retired Profile Apply rollback pipeline
    reason: Removed because Apply Profile to AIConfig has no installation or process side effects requiring a product rollback lifecycle.
  - id: rule.nimi.runtime.local-compute.r096
    kind: rule
    title: Loadout state persists atomically with a private CAS token
    modality: must
    statement: Runtime persists the unique machine Loadout store and current Loadout records atomically, may hold exactly one current Runtime-private compare-and-swap token only to prevent lost writes across Prepare and Commit, exposes that token to no caller, public Loadout, Job effective input, ResolvedAssembly, or process identity, retains no old token, rollback, product revision, or history, and persists ModelAsset inventory, catalog recipes, RecipeCustody, and ExecutionHost records under separate owners.
    condition: Whenever Loadout state, ModelAsset inventory, custody, or Runtime-private Host state changes or reloads.
    failure: Reject non-atomic writes, lost-write acceptance, public or execution-visible CAS, rollback or revision semantics, and duplicated Loadout, binding, selection, ModelAsset, custody, or process truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.machine-local-configuration-plane
  - id: rule.nimi.runtime.local-compute.r097
    kind: rule
    title: Driver dialect and recipeId semantics are exact and stable
    modality: must
    statement: Runtime loads the exact CapabilityImplementationDriver dialect and recipeId committed in a Loadout, validates that the dialect owns the implementation, contracts, slot topology, fixed request mapping, loader facts, and load-affecting defaults for that recipeId, and never rereads catalog recipes at admission or execution or resolves semantics from ModelAsset labels, provider, engine, node, prefix, endpoint, wildcard, catalog order, or process availability; any semantic change requires a new dialect identity or version rather than reinterpretation under an existing identity.
    condition: Whenever a Loadout is prepared, committed, interpreted, admitted, or executed.
    failure: Fail interpretability or Job admission closed when the exact dialect or recipeId implementation is absent or incompatible, without catalog reinterpretation, migration, alternate Driver, or Host substitution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.machine-local-configuration-plane
      - type: supersedes
        target: rule.nimi.runtime.local-compute.r099
  - id: rule.nimi.runtime.local-compute.r098
    kind: rule
    title: Policy gates are explicit and typed
    modality: must
    statement: Driver compatibility and policy checks return a typed derived admission reason for the exact current machine-selected Loadout composed with the committed Local route and request, never create Node availability, readiness, routing, another machine selection, supported-feature, or fallback truth, and remain traceable to the declaring Driver or policy owner.
    condition: Whenever a local Driver compatibility or policy gate is evaluated, projected, or audited.
    failure: Reject an unowned reason, gated request projected as admitted, or a gate that mutates committed configuration.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.machine-local-configuration-plane
  - id: rule.nimi.runtime.local-compute.r099
    kind: rule
    lifecycle: removed
    title: Retired active-service Node routing catalog
    reason: Removed because process health, live Node catalogs, provider hints, probes, and rank ordering no longer select local execution or establish capability availability.
  - id: rule.nimi.runtime.local-compute.r100
    kind: rule
    title: Local Job submission captures one complete ResolvedAssembly
    modality: must
    statement: Local Job submission atomically reads only the current machine-selected Loadout for the admitted AIConfig Local route's CapabilityContract, validates that Loadout's CapabilityContract, exact CapabilityImplementation, versioned Driver dialect and recipeId, options, supported features, Model Contract results, every model_asset_id and expected_content_id, and RecipeCustody reference, rehashes every bound payload, resolves each slot to an immutable absolute path and content identity, derives the typed load plan and process identity, and persists the exact selected Loadout identity and complete ResolvedAssembly with the Job before publication; queued and running Jobs never reread current AIConfig, Loadout, inventory, catalog, machine selection, paths, process state, or private CAS to rewrite captured inputs.
    condition: Whenever Local Job identity and exact effective inputs are composed or resumed.
    failure: Reject Job publication on a missing, changed, ambiguous, invalid, unpersisted, or partially captured input, fail later byte drift against captured identity, preserve committed owners, and never rebind, search, reinterpret, or fall back.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.machine-local-configuration-plane
  - id: rule.nimi.runtime.local-compute.r101
    kind: rule
    lifecycle: removed
    title: Retired occurrence rule that deferred ordering and bundle authority
    reason: Replaced by the media vertical slice occurrence rule that admits ordered occurrences and sharded-bundle identity.
  - id: rule.nimi.runtime.local-compute.r102
    kind: rule
    title: Driver-owned portable configuration excludes bindings and paths
    modality: must
    statement: The Driver-owned typed-options slice of a Loadout may contain only fields defined by the exact versioned dialect and never a ModelAsset id or path, model-axis binding, selection, process identity, endpoint, secret, or fallback list; the Loadout aggregate stores model_asset_id plus expected_content_id only in its separately typed model axes, and Driver invocation consumes only the options, model axes, RecipeCustody, request, load plan, and process identity already captured in the Job's complete ResolvedAssembly without per-execution Profile override or current-owner reread.
    condition: Whenever Driver-owned portable configuration is authored, updated, interpreted, or invoked.
    failure: Fail interpretation closed on unknown or protected fields instead of applying, ignoring, migrating, or inferring them.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.machine-local-configuration-plane
  - id: rule.nimi.runtime.local-compute.r103
    kind: rule
    title: ModelAsset probe labels are derived and non-authoritative
    modality: must
    statement: Runtime may derive bounded display labels such as gguf, safetensors, directory, unclassified, or recipe-specific probe tags from cached raw fingerprints, but no closed ModelAsset kind registry exists and no label declares capability, runnable or passive status, engine, Driver, recipe, slot eligibility, binding, selection, or execution semantics.
    condition: Whenever a ModelAsset fingerprint or display label is derived, persisted, or projected.
    failure: Reject a label used as admission or execution authority, a required classification for safe import, or a legacy kind promoted to public semantics.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
  - id: rule.nimi.runtime.local-compute.r104
    kind: rule
    title: Capability admission never maps from ModelAsset labels
    modality: must_not
    statement: A CapabilityContract, standardized feature, CapabilityImplementation, Driver, recipeId, slot, or execution route is inferred or selected from a ModelAsset label, fingerprint, filename, format, model lineage, import source, catalog match, or inventory order; only the exact Loadout Driver dialect projects slots and its recipe-specific Model Contract may consume bounded fingerprints to reject or admit an explicitly chosen ModelAsset.
    condition: Whenever a ModelAsset is considered for a Loadout slot or capability execution.
    failure: Reject label-to-capability mapping, first-match resolution, legacy kind aliases, import-layer interpretation, and any route or binding inferred from content presentation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.category-capability-plane
  - id: rule.nimi.runtime.local-compute.r105
    kind: rule
    title: Explicit Loadout selection supersedes media arbitration
    modality: must
    statement: The current machine-selected Loadout is changed only through Select Loadout and remains the unique Local resource selection for every future Job whose canonical App or shared LocalAgent AIConfig commits Local for the same CapabilityContract; Select preserves every Loadout, ModelAsset, AIConfig, revision, and captured Job and chooses no replacement. A missing, removed, changed, or damaged bound ModelAsset, unavailable Driver, Model Contract failure, dependency failure, process restart, or Job failure preserves the Loadout, model axes, and every route-only Local intent while effective projection and execution fail typed without fallback.
    condition: Whenever the current machine selection is set, explicitly cleared, or reevaluated after its target becomes blocked, or whenever a selected Loadout changes effective state.
    failure: Reject per-owner Local pinning, copying selection into AIConfig, automatic takeover, ranking, replacement, AIConfig clearing, ambient repair, or fallback and preserve each canonical owner record unless that owner explicitly overwrites its route intent.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.machine-local-configuration-plane
      - type: supersedes
        target: rule.nimi.runtime.local-compute.r059
  - id: rule.nimi.runtime.local-compute.r106
    kind: rule
    title: Residency is private ExecutionHost state
    modality: must_not
    statement: Runtime projects model residency, loading, switching, warm pool, lease, process health, or latest load failure as product readiness, Loadout state, machine selection, route, binding, supported feature, or execution success.
    condition: Whenever ExecutionHost residency or supervision state changes or is observed.
    failure: Keep the fact Runtime-private and expose only the affected typed Job failure or Driver-classified persistent admission blocker.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.local-engine-plane
      - type: supersedes
        target: rule.nimi.runtime.local-compute.r065
  - id: rule.nimi.runtime.local-compute.r107
    kind: rule
    title: Loadout mutation uses one Prepare and Commit channel
    modality: must
    statement: Runtime exposes Prepare Loadout, Commit Loadout, Select Loadout, and Delete Loadout as the only Loadout resource actions; Prepare resolves the exact Driver dialect and recipeId, projects slots, may prefill a unique installed ModelAsset matching a non-binding catalog recommendation, evaluates each chosen model through the recipe-specific Model Contract, reports unresolved slots without downloading, captures owner, session, current private CAS token, and proposed state server-side, and returns an opaque prepare_id with bounded TTL, single use, owner-session scope, and restart invalidation. Commit accepts only prepare_id and revalidates CAS, assets, expected content identities, and contracts before atomically creating or replacing one Loadout; UpdateLoadout is only a Prepare-plus-Commit wrapper, and no bind, unbind, rebind, reprojection, or independent Clear handler remains. Ordinary AIConfig Local route Save introduces no second confirmation or permission flow, while Select set or clear, execution-relevant Commit over the selected Loadout, Delete of the selected Loadout, resource download, and other destructive resource-lifecycle actions consume only their exact required impact confirmation; no action mutates another AIConfig owner, downloads implicitly, or reports aggregate readiness.
    condition: Whenever a Loadout is prepared, committed, selected, explicitly deselected, or deleted.
    failure: Reject caller-carried plan content, stale CAS, expired, replayed, foreign, or restart-stale prepare_id, independent binding or Clear mutation, deletion required for deselection, provenance-derived overwrite, silent recommendation acceptance, missing confirmation, hidden download, cross-owner transaction, or partial success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.machine-local-configuration-plane
      - type: supersedes
        target: rule.nimi.runtime.local-compute.r094
  - id: rule.nimi.runtime.local-compute.r108
    kind: rule
    title: Ordered model occurrences and sharded ModelAssets are exact Driver truth
    modality: must
    statement: A versioned Driver dialect projects one distinct model slot for every occurrence independently selected, downloaded, bound, or replaced, and a Loadout commits each slot as unresolved or as model_asset_id plus expected_content_id; every model slot is a user axis, catalog content references are recommendation-only, one ModelAsset may satisfy multiple slots with an explicit binding per slot, and no parent or companion identity couples them. A role-scoped ordered occurrence sequence retains its declared ordinal, while one multi-file ModelAsset remains one occurrence whose immutable content_id is the canonical digest over ordered per-entry digests and whose files are never split into slots; upstream optionality creates no slot unless the exact dialect declares it, no generic optional state or catalog STRICT content pin governs ModelAsset axes, and no legacy slot-map lifecycle exists.
    condition: Whenever a Driver projects, resolves, validates, commits, or invokes local model occurrences.
    failure: Preserve unresolved state and fail closed on missing, ambiguous, skipped, defaulted, parent-inherited, inferred-order, split-bundle, legacy-normalized occurrences, or model-slot admission derived from a catalog STRICT content pin; committed model_asset_id plus expected_content_id and byte revalidation remain mandatory.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.machine-local-configuration-plane
      - type: supersedes
        target: rule.nimi.runtime.local-compute.r101
  - id: rule.nimi.runtime.local-compute.r109
    kind: rule
    title: Heavy media jobs hold one serial execution lease and report artifacts exactly
    modality: must
    statement: Heavy local media execution holds a single Runtime-private execution lease per engine instance and runs jobs serially in submission order per capability while queued jobs remain observable pending and cancellation is honored both queued and running; a media job may materialize multiple artifacts, each committed and addressable when produced, and its terminal outcome explicitly enumerates the produced artifacts together with the typed failure when generation ends early, never projecting partial production as success; lease occupancy and queue position stay Runtime-private and never become readiness, preference, routing, or selection truth.
    condition: Whenever a heavy local media job is queued, executed, canceled, or completed.
    failure: Reject parallel lease acquisition, silent queue reordering, dropped produced artifacts, partial output reported as success, or lease state projected as product truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.local-engine-plane
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.local-compute.r110
    kind: rule
    title: VoxCPM managed backend selection is Runtime private
    modality: must
    statement: The voxcpm audio.synthesize implementation is owned by its Runtime-managed CapabilityImplementationDriver dialect, Runtime-owned Driver bundle, speech Host, and one speech.voxcpm.python dependency consumer line; Runtime selects the standard Python backend only for admitted windows/amd64 CPU or CUDA profiles and MLX only for admitted darwin/arm64, materializes the matching exact-lock managed Python profile whose pinned wheels together with the Runtime-owned Driver bundle supply the complete execution loader chain, validates the explicitly bound ModelAsset only through the voxcpm recipe Model Contract over its content fingerprints and payload, and dispatches the Job-captured ResolvedAssembly through the private speech ExecutionHost. The current voxcpm recipe declares an empty RecipeCustody set; model-payload code files are registered as content and never executed, no execution copy is materialized from the payload, and a future recipe revision that requires an externally pinned loader must declare an explicit RecipeCustody pin and raise the recipe revision together with any affected dialect identity. Unsupported hosts, missing or stale profiles, missing declared custody, Model Contract failure, absent Driver, unavailable acceleration, or execution failure fail closed without import-layer family checks, fallback, backend or ModelAsset substitution, Qwen substitution, or user-payload code execution.
    condition: Whenever a selected VoxCPM Loadout plans dependencies or materializes and executes its private speech Host.
    failure: Reject public backend selection, ModelAsset-family authority, mismatched or unverified profile, declared custody, or content, unsupported host composition, ambient Python, imported-code execution, payload-sourced loader execution, and every silent backend or model switch.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.voxcpm-family
      - type: applies_to
        target: definition.nimi.runtime.local-compute.speech-engine-plane
  - id: rule.nimi.runtime.local-compute.r111
    kind: rule
    title: Local state isolation is record scoped then document scoped
    modality: must
    statement: When a ModelAsset inventory or Loadout document is syntactically parseable and one locatable record has an invalid payload or schema, Runtime preserves every valid record, copies the exact invalid record and bounded source context to quarantine, emits a typed record-isolation diagnostic, and starts normally; when the whole document is invalid JSON, truncated, or otherwise not structurally parseable, Runtime preserves a complete raw snapshot in quarantine, starts from an empty state for that document, emits a prominent typed document-isolation diagnostic, and never silently clears or rewrites the source before the snapshot is durable.
    condition: Whenever persisted ModelAsset inventory or Loadout state is opened, parsed, validated, or recovered.
    failure: Reject daemon blockage by isolatable state, one bad record discarding valid siblings, partial salvage of an unparseable document presented as truth, silent empty state, missing quarantine evidence, or an untyped diagnostic.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.local-compute.asset-storage-manifest-plane
      - type: applies_to
        target: definition.nimi.runtime.local-compute.machine-local-configuration-plane
