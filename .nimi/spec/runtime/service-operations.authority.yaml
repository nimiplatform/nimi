format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.service-operations
units:
  - id: definition.nimi.runtime.service-operations.local-service-plane
    kind: definition
    title: Runtime local service operations plane
    meaning: The Runtime local service operations plane owns concrete per-import ModelAsset inventory, content identity and integrity, explicit catalog installation, unclassified import, transfer, removal, quarantine and storage reconciliation, non-model dependency Jobs, and Runtime-private ExecutionHost operations without owning AIConfig route, Machine Loadout store actions, Loadout model axes, public capability readiness, probe, warm, residency, or fallback truth.
  - id: definition.nimi.runtime.service-operations.artifact-plane
    kind: definition
    title: Runtime artifact operations plane
    meaning: The Runtime artifact operations plane owns opaque artifact identity, immutable committed byte custody and metadata, current-account-plus-Registered-App-Subject Local App audience, shared typed-consumer authorization, bounded inline retrieval, internal streamed open and copy, App asset adoption, generated voice retention, and bounded cleanup.
  - id: definition.nimi.runtime.service-operations.scenario-job-plane
    kind: definition
    title: Runtime scenario job operations plane
    meaning: The Runtime scenario Job plane owns one admitted execution across Local, remote synchronous and native asynchronous implementations, immutable effective inputs, private dispatch intent and receipt, bounded execution and reconciliation, complete typed or owned result validation and atomic publication, progress, observation, cancellation and bounded retention. App business orchestration, observation cadence, project adoption and recovery remain App-owned. Captured targets never change; current authorization is distinct from captured input, private custody references contain no raw credentials, observation detach never cancels admitted work, and restart never creates or replays a generation.
  - id: definition.nimi.runtime.service-operations.scenario-registry
    kind: definition
    title: Runtime scenario registry
    meaning: The Runtime scenario registry is the closed discriminator, canonical modality, execution-mode, and profile-field contract for Runtime AI scenarios.
  - id: definition.nimi.runtime.service-operations.lifecycle-registry
    kind: definition
    title: Runtime service lifecycle registry
    meaning: The Runtime service lifecycle registry is the closed state and transition contract for connector custody and authorization, remote deletion, Jobs, transfers, and explicitly Runtime-private ExecutionHost or supervised-process state; verified ModelAsset content, machine selection, derived admission, Job execution, and process residency remain orthogonal and no public local-model readiness lifecycle exists.
  - id: definition.nimi.runtime.service-operations.daemon-plane
    kind: definition
    title: Runtime daemon operations plane
    meaning: The Runtime daemon operations plane owns protected process state, health, listener admission, request processing, scheduling, timeouts, configuration, shutdown, restart invalidation, operational health projection, and lifecycle-safe startup replay or bounded drain of the Runtime-owned per-binding Cognition Memory outbox while owner-specific retry, idempotency, canonical Memory, and readiness remain with their exact owners and no generic event platform is created.
  - id: definition.nimi.runtime.service-operations.cli-plane
    kind: definition
    title: Runtime CLI operations plane
    meaning: The Runtime CLI operations plane owns foreground Runtime process control plus background process or service control only on a build with an admitted background manager or production service controller, daemon-manager process or service status and a sanitized public reachability classification only through that admitted topology, bounded public diagnostics, version output, and separately governed Advanced or Admin operations, while an unavailable topology fails closed and protected Runtime health, ModelAsset, Machine Loadout, Connector custody, and Runtime-private ExecutionHost product operations remain reachable only through Desktop's verified protected product surface and owned by their canonical Runtime services; the CLI excludes app-author tooling, high-level generation, AIConfig ownership, route or target selection, defaults, fallback authority, and every protected Desktop product projection or mutation.
  - id: rule.nimi.runtime.service-operations.r001
    kind: rule
    title: RuntimeLocalService is the sole local control plane
    modality: must
    statement: RuntimeLocalService is the only stable RPC owner for ModelAsset inventory and integrity, explicit catalog install planning and acquisition, unclassified file or directory import, removal with Loadout-reference impact enumeration and force confirmation, quarantine diagnostics and recovery, transfer, non-model dependency Jobs, Runtime-private ExecutionHost operations, Product Control operations, and storage cutover, while canonical Machine Loadout store actions remain separately owned and Desktop, SDK, Apps, and hosts maintain no second writable asset, Loadout, selection, process, or Job truth.
    condition: Whenever a local Runtime resource is listed, observed, materialized, controlled, or reconciled.
    failure: Reject any operation or projection that creates a second local control plane or writable local-model truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r002
    kind: rule
    title: Local listing and explicit integrity diagnostics remain separate
    modality: must
    statement: ListModelAssets returns only concrete verified-content inventory and performs no endpoint probe, bootstrap, warm, recovery, binding, selection, admission, or status normalization; an explicit user-requested ModelAsset diagnostic may verify content and installation only and never probes an engine or changes configuration, selection, routing, admission, or Job truth.
    condition: Whenever ModelAssets are listed or explicitly diagnosed.
    failure: Fail the diagnostic closed and reject list-driven probing, warming, recovery, selection, routing, or status mutation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r003
    kind: rule
    title: ExecutionHost start warm and health stay Runtime private
    modality: must
    statement: Runtime-private ExecutionHost supervision may start, warm, pool, lease, monitor, recover, or stop a concrete process as an implementation detail, including on demand for an exact Job, but never exposes a public Start or Warm ModelAsset action, persists capability readiness, changes AIConfig or machine selection, clears a binding, or lets Desktop, SDK, or App polling drive process state; ordinary preparation or execution failure ends only the Job unless the Driver classifies a persistent hard blocker.
    condition: Whenever local process preparation, residency, or health supervision runs.
    failure: Keep Host state private, return the typed Job or hard-blocker result, and reject consumer-owned lifecycle truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r004
    kind: rule
    title: Local catalog intake dependency and audit families stay Runtime owned
    modality: must
    statement: RuntimeLocalService owns verified catalog reads, non-binding per-slot install recommendations, explicit ModelAsset intake and recovery, transfers, per-import ModelAsset inventory, private services and nodes, selected-source dependency evidence, environment dependency Jobs, and local audit operations; Profile application, Prepare or Commit Loadout, Select Loadout, capability admission, and routing are absent from this control plane, and no bundle or parent-coupled companion model identity exists.
    condition: Whenever a local ModelAsset, dependency, or audit operation executes.
    failure: Reject a consumer-side substitute, hidden model acquisition, bundle or companion identity, or a result not derived from Runtime-owned records.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r005
    kind: rule
    title: Managed engine lifecycle has one truth
    modality: must
    statement: RuntimeLocalService owns Runtime-private managed ExecutionHost process lifecycle and supervision evidence, which is not Loadout identity, machine selection, derived admission, or product readiness, and Desktop, SDK, and Apps do not maintain or project a second process truth.
    condition: Whenever a managed local engine is started, stopped, observed, or projected.
    failure: Reject any engine operation based on consumer-owned process truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r006
    kind: rule
    title: Product control remains a Runtime state machine
    modality: must
    statement: RuntimeLocalService owns validation, reconciliation, data-root materialization, and the canonical login, config, data-root, repair, blocked, and ready_for_use Product Control facts; AIConfig, Profile, ModelAsset installation, device scan, Machine Loadout store, local or Cloud admission, connector diagnostics, and ExecutionHost state are never Product Control readiness inputs, while the Home host provides only the canonical record bridge and bounded OS helpers.
    condition: Whenever ordinary first-run setup reads, reconciles, or mutates product control.
    failure: Reject a Desktop, SDK, app, or host write that bypasses the Runtime Product Control state machine, every alternate record, and every protected-state selection or override of dataRoot.path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r007
    kind: rule
    title: First-run reconciliation derives state on protected transport
    modality: must
    statement: Production first-run reconciliation runs only through the protected Home Host Contract; Runtime authenticates the current host context, evaluates only canonical Product Control prerequisites, records relevant Product Control failures, and atomically commits ready_for_use only from that closure while AI setup and execution admission remain independent and non-blocking; every unsupported or unauthorized protected operation fails closed.
    condition: Whenever production first-run or product-control reconciliation is invoked.
    failure: Fail closed on consumer-supplied state or reason, an unverified host context, an invalid current session, portable credentials, renderer-supplied authority, or an unsupported protected operation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r008
    kind: rule
    title: Accelerator dependencies require Runtime resolution and confirmation
    modality: must
    statement: Runtime resolves shared accelerator installation dependencies from the exact requested Runtime-private ExecutionHost or explicit install action and returns needs_confirmation before first network materialization, starting install or repair only after explicit user confirmation; completion never creates a Loadout, binding, machine selection, capability admission, or readiness fact.
    condition: Whenever a supervised local engine requires a managed accelerator dependency.
    failure: Reject Desktop probing, implicit consent, or dependency materialization before confirmation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r009
    kind: rule
    title: Dependency Jobs have closed state and private phase semantics
    modality: must
    statement: A Runtime dependency Job uses QUEUED, RUNNING, COMPLETED, FAILED, or CANCELED plus private downloading, verifying, or installing detail, records typed install and repair outcomes and Runtime-private selected-source evidence, requires no Desktop, SDK, App, or visible-terminal installer, and deduplicates setup per dependency and environment; its completion, source, and phase never become public capability health, readiness, binding, selection, or routing truth.
    condition: Whenever a managed dependency setup, repair, status, or duplicate request is processed.
    failure: Reject unknown public job states, consumer-executed installation, duplicate active jobs, or independently re-resolved source records.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r010
    kind: rule
    title: Dependency job control targets only Runtime identities
    modality: must
    statement: StartLocalEnvironmentDependencyJob, CancelLocalEnvironmentDependencyJob, RetryLocalEnvironmentDependencyJob, and RepairLocalEnvironmentDependency target Runtime dependency environments and Runtime job ids, while transfer detail remains diagnostic and cannot replace selected source record or dependency job truth.
    condition: Whenever a dependency job is started, canceled, retried, repaired, or projected.
    failure: Reject Desktop rows, engine installers, shell scripts, transfer ids, or progress detail as the dependency authority target.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r011
    kind: rule
    title: Dependency plans exclude ModelAsset ownership
    modality: must
    statement: ResolveLocalEnvironmentPlan and ResolveLocalEnvironmentActivationGate use only exact non-model dependency and RecipeCustody identities; ModelAsset acquisition remains a separate explicit catalog install or import, every model formerly described as a companion is an ordinary independent ModelAsset, and Job-captured model paths and content identities enter activation only through ResolvedAssembly rather than model.asset, model.companion-asset, parent_asset_id, or companion_asset_id dependency families.
    condition: Whenever local environment planning or activation resolves model or non-model inputs.
    failure: Reject ModelAsset selected-source ownership, parent-coupled companion identity, hidden model download, or a projection placeholder promoted to dependency truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r012
    kind: rule
    title: Local state storage roles are disjoint
    modality: must
    statement: Runtime keeps one protected local AI state for assets, transfers, dependency assets, setup jobs, cutover evidence, and health projection; its data-root reference and managed roots derive only from the canonical product-control selection, Runtime configuration records validation evidence but cannot reconcile to a different root, and the Nimi data directory is storage rather than private Runtime state truth.
    condition: Whenever Runtime or a host resolves local AI storage.
    failure: Reject a second Product Control or state file, a non-derived root, a retired-state fallback, a silent dual read or write, payload existence treated as state truth, and canonical-to-protected disagreement without explicit repair.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r013
    kind: rule
    title: Data-root changes require an explicit reconciliation plan
    modality: must
    statement: A user-requested Nimi data-directory change through the normal Product Control UI and protected owner operation produces a Runtime reconciliation plan covering effective protected state, the canonical selection, derived references and managed roots, detected retired inputs, affected assets, conflicts, and required user confirmation before local AI state is assumed usable; disagreement caused only by damaged or stale protected derived state enters repair and never changes the canonical selection.
    condition: Whenever an admitted Product Control operation changes the Nimi data directory or Runtime derived storage state disagrees with the canonical product-control record.
    failure: Keep materialization unavailable until the complete plan or repair succeeds, preserve canonical dataRoot.path as the only selection authority, and reject protected-state override, fallback, or another path prompt.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r014
    kind: rule
    title: Local state cutover is explicit idempotent and fail closed
    modality: must
    statement: Retired Desktop state is only an explicit cutover input and cutover is idempotent; not_required means Runtime state and roots agree, required_confirmation means a retired input or path mismatch awaits consent, planned means an accepted plan has not started, running means validation, copy, or rewrite is active, succeeded means cutover completed and retired input left active use, failed means active truth stayed unchanged with cutover_failed or repair_required detail, and cancelled means user cancellation occurred before mutation.
    condition: Whenever Runtime detects or executes a local-state path cutover.
    failure: Reject live fallback, secondary reads, dual writes, state mutation after failure, or an undeclared cutover state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r015
    kind: rule
    title: Verified content selection admission and Host preparation are orthogonal
    modality: must
    statement: A Runtime ModelAsset record proves concrete content custody only, and Select Loadout either sets one eligible current machine selection or explicitly clears it; clearing preserves every Loadout and ModelAsset, changes no AIConfig or captured Job, and chooses no replacement. Derived admission evaluates only the committed Local route together with the current matching machine selection, Runtime-private ExecutionHost preparation occurs only after complete Job inputs are captured, installed but unselected content never implies admission, selection changes never trigger probe or prewarm, and Host failure never clears axes, AIConfig, or automatically reselects.
    condition: Whenever local installation, dependency state, current machine selection, Local-route admission, or first execution is projected.
    failure: Reject filesystem-only readiness, fabricated installation, deletion required for selection clearing, any machine selection copied into AIConfig or reconstructed after Job publication, or Desktop-maintained lifecycle truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r016
    kind: rule
    title: Complete external artifact bytes have one bounded authorized read surface
    modality: must
    statement: RuntimeArtifactService exposes ReadArtifactBytes as the single external complete-body artifact read by artifact_id and only within the 32-MiB inline policy when the current protected caller matches the durable artifact audience; metadata-only Job projection, Runtime-internal streamed custody and adoption, Base asset streaming, and the voice asset library remain distinct typed surfaces and do not widen that complete-body operation.
    condition: Whenever an event consumer retrieves a Runtime artifact by id.
    failure: Reject the read when protected caller or durable audience does not match and never substitute a job or voice-library projection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r017
    kind: rule
    title: Artifact identity is opaque stable flat and non-authorizing
    modality: must
    statement: artifact_id is a Runtime-owned opaque string stable for the artifact lifetime, flat without a required job or scenario prefix, unique only within one Runtime instance, and scoped by consumers to their authoritative Runtime client; possession, guessing, observation, replay, or cross-app use grants no authority.
    condition: Whenever an artifact id is emitted, stored, compared, or presented for retrieval.
    failure: Reject format inference, cross-Runtime lookup, hierarchical authority, or id possession as authorization proof.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r018
    kind: rule
    title: Runtime owns artifact creation reference and idempotent reads
    modality: must
    statement: A TTS provider, scenario job, realtime session, local voice engine, cache, streaming TTS path, or user upload creates an artifact body as exactly bounded existing bytes, a context-aware incremental stream, or a Runtime-issued already-committed custody reference; Runtime owns an accepted stream's single close or abort, applies bounded accounting, cancellation and backpressure, validates any reference against committed owner, size, digest, MIME, typed-operation eligibility, integrity, expiry, and availability, events or Job metadata reference only committed custody, and repeated reads return identical bytes while the artifact remains stored.
    condition: Whenever Runtime accepts, materializes, emits, attaches, copies, or rereads an artifact body.
    failure: Reject a provider- or caller-selected reference, a fourth handoff form, uncommitted or mismatched custody, an oversize or cancelled stream, or a reread that changes content for the same id; remove only an owned uncommitted candidate, preserve a pre-existing committed reference on attach failure, and apply bounded cleanup to a newly committed unreferenced artifact.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r019
    kind: rule
    title: Referenced artifacts exist before emit and generated voice is durable
    modality: must
    statement: Runtime commits the complete bounded bytes or accepted incremental stream together with immutable artifact metadata before any event, Job result, adoption source, or committed-custody reference advertises the artifact id; provider URLs and response streams are ingress only and never durable truth, and generated agent voice artifacts remain on the user's local disk until explicit cleanup or a later admitted quota policy while other TTL, garbage collection, and quota choices remain Runtime implementation details.
    condition: Whenever Runtime emits or attaches an artifact reference, accepts provider media, or applies artifact retention.
    failure: Abort the reference and record a fatal emitter violation when custody did not commit, remove an uncommitted candidate on failure or cancellation, never emit a provider URL as durable truth, and reject implicit deletion of durable generated voice.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r020
    kind: rule
    title: Externally readable artifacts have complete durable audience metadata
    modality: must
    statement: Every artifact made readable through an admitted surface binds the owner-defined audience, producer metadata, current account where applicable, observed size, content integrity, MIME, expiry, and typed-operation eligibility needed by that surface; a Local App artifact audience is exactly the Runtime-derived current AccountID plus Registered App Subject, AppID may remain immutable producer or catalog metadata but is non-authorizing, and the canonical Third-party App contract admits bounded runtime.ai.artifact.read, bounded runtime.ai.artifact.upload, runtime.ai.artifact.adopt-to-app-storage, and typed artifact-reference scenario input without admitting generic artifact write, audience mutation, attachment, media inventory, Host-digest, payload-digest, discovery, or a caller-visible allowed-use selector or policy engine.
    condition: Whenever an artifact record is proposed for Local App or other external readability or consumption.
    failure: Keep the record internal and deny retrieval or consumption when the complete owner audience or exact Runtime-selected typed-operation eligibility is absent; never infer the Registered App Subject from AppID or disclose internal owner or policy fields.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r021
    kind: rule
    title: Artifact content MIME integrity and audience are immutable
    modality: must
    statement: After artifact id creation its bytes, MIME, observed size, content hash, and audience never change; Local App audience contains immutable current AccountID plus Registered App Subject, AppID is non-authorizing producer or catalog metadata, and exact requested use is selected internally by the typed consumer operation and checked with its MIME, size, integrity, expiry, and availability constraints rather than stored or accepted as a caller-visible policy selector, except that the generated-voice producer may atomically enrich otherwise identical absent metadata to complete GeneratedVoiceArtifactMetadata before the referencing event without replacing content or audience.
    condition: Whenever Runtime updates or reads an existing artifact record.
    failure: Reject mutation, external access to an unbound historical record, or enrichment after the referencing event.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r022
    kind: rule
    title: Playable Conversation voice artifact ids resolve only to audio
    modality: must
    statement: A canonical Conversation voice_artifact_available audio_artifact_id resolves through the typed Conversation artifact reader or Runtime-internal ReadArtifactBytes to bytes whose MIME starts with audio/, while a voice_timing_terminal event may omit playable audio only when it carries a terminal reason.
    condition: Whenever Runtime emits a canonical Conversation voice artifact or a consumer resolves its audio artifact.
    failure: Reject non-audio bytes, a missing playable artifact on voice_artifact_available, or a terminal omission without reason.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r023
    kind: rule
    title: Audio identity cannot be overwritten by metadata or fallback
    modality: must_not
    statement: Runtime stores lipsync, timing, debug, or synthetic placeholder content under a playable audio artifact id, overwrites provider audio identity with generated lipsync identity, or emits a playable voice request or pseudo-audio artifact for text-only fallback or unavailable TTS.
    condition: Whenever audio, lipsync, timing, debug, or fallback artifacts are emitted.
    failure: Keep separate artifact ids with their own MIME types or return the typed unavailable or fallback result without a playable voice request.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r024
    kind: rule
    title: Generated voice metadata and cleanup are bounded
    modality: must
    statement: A generated assistant voice artifact preserves Runtime-issued LocalAgent, Conversation, turn, message, voice, route, media, integrity, creation, and retention relations, and scoped cleanup removes matching durable audio and voice metadata without mutating committed text or Conversation history.
    condition: Whenever generated assistant voice is stored or cleaned up.
    failure: Reject storage with incomplete metadata and reject cleanup that changes text or conversation history.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r025
    kind: rule
    title: ReadArtifactBytes wire shape is fixed
    modality: must
    statement: ReadArtifactBytesRequest requires artifact_id, and ReadArtifactBytesResponse requires full bytes, RFC 6838 mime_type, and int64 size_bytes plus optional mime_inferred defaulting false; Runtime uses application/octet-stream and mime_inferred true only when upstream MIME is absent.
    condition: Whenever Runtime accepts or returns ReadArtifactBytes.
    failure: Return ARTIFACT_INVALID_INPUT or reject the response when a required field, complete body, valid MIME, size, or inference marker is missing.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r026
    kind: rule
    title: Generated voice cleanup stays bounded
    modality: must
    statement: Generated voice cleanup requires an explicit Runtime-issued LocalAgent or Conversation scope, is idempotent when no artifact matches, and deletes only matching generated voice retention records rather than scenario media, uploads, text, or Conversation history.
    condition: Whenever generated voice cleanup runs.
    failure: Reject an empty scope or any deletion outside the matching generated voice retention class.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r027
    kind: rule
    title: Artifact reason codes and meanings are closed
    modality: must
    statement: Artifact failures use ARTIFACT_INVALID_INPUT value 600 for request validation, ARTIFACT_NOT_FOUND value 601 for absent, collected, never-created, or cross-Runtime ids outside a Local App non-disclosure path, ARTIFACT_TOO_LARGE value 602 above the 32-MiB inline limit, ARTIFACT_FORBIDDEN value 603 for absent, foreign-owner, subject-unbound, revoked, expired, or otherwise mismatched Local App read and artifact-reference lookup so those causes are publicly indistinguishable, and ARTIFACT_MIME_MISMATCH value 604 only for an SDK expected-MIME-prefix mismatch; runtime.ai.artifact.adopt-to-app-storage instead returns APP_STORAGE_ARTIFACT_UNAVAILABLE for missing, foreign-owner, subject-unbound, expired, or corrupt sources and never mutates the target for those causes.
    condition: Whenever Runtime or SDK classifies an artifact read, artifact-reference lookup, adoption, or validation failure.
    failure: Reject an unknown value, changed meaning, server emission of the SDK-only MIME mismatch reason, a Local App existence oracle, or an adoption error that distinguishes the collapsed unavailable causes.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r028
    kind: rule
    title: Artifact failures use structured carriers
    modality: must
    statement: Runtime artifact handlers carry ARTIFACT reasons in ErrorInfo through grpcerr.WithReasonCode rather than status-message text, and the SDK raises ARTIFACT_MIME_MISMATCH after a case-insensitive expected_mime_prefix check on the received MIME.
    condition: Whenever an artifact handler or SDK expected-MIME check fails.
    failure: Reject free-text-only classification, an absent stable reason, or server-side MIME mismatch classification.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r029
    kind: rule
    title: Inline artifact retrieval has a hard size ceiling
    modality: must
    statement: Artifact reads return a complete inline body only at or below 32 MiB and reject larger stored artifacts without truncation; metadata-only Job projection, Runtime-internal streamed custody and adoption, and Base App asset streaming may operate above 32 MiB and do not convert ReadArtifactBytes into generic chunked artifact retrieval.
    condition: Whenever Runtime evaluates an artifact for inline retrieval or distinguishes it from metadata or streamed custody.
    failure: Return ARTIFACT_TOO_LARGE rather than truncate, stream, or partially succeed on the inline operation, without applying that ceiling to metadata, adoption, or asset streaming.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r030
    kind: rule
    title: Consumers cannot assume artifact read caching
    modality: must_not
    statement: A consumer assumes repeated ReadArtifactBytes calls are cheap or required to be cached by Runtime.
    condition: Whenever a consumer handles canonical Conversation voice_artifact_available or another event artifact.
    failure: Read once, decode or consume the bytes, drop the local reference when done, and reread only after that local buffer is discarded.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r031
    kind: rule
    title: Artifact reads revalidate live caller and durable audience
    modality: must
    statement: Before Local App artifact read, artifact adoption, or artifact-reference scenario input Runtime routes lookup through one shared authorizer that revalidates the protected session current AccountID plus Registered App Subject, the Runtime-selected exact typed consumer operation, MIME, size, integrity, expiry, and availability; AppID never authorizes, historical records without the subject fail closed without migration, and direct local gRPC, wrong owner, expired records, and guessed ids gain no fallback.
    condition: Whenever a Local App artifact consumer or ReadArtifactBytes authorizes lookup.
    failure: Return ARTIFACT_FORBIDDEN for absent, foreign-owner, or subject-unbound Local App read and artifact-ref lookup without exposing existence or mismatch, return the broader APP_STORAGE_ARTIFACT_UNAVAILABLE collapse for adoption, and deny every caller-selected allowed-use or owner field.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r032
    kind: rule
    lifecycle: removed
    title: Retired Third-party App artifact permission and selector
    reason: Removed because generic artifact reads are absent from the canonical Third-party App operation contract and no permission, selector, or hidden compatibility path remains.
  - id: rule.nimi.runtime.service-operations.r033
    kind: rule
    title: Artifact retrieval is a hard cut with distinct typed surfaces
    modality: must
    statement: Pre-audience artifacts inherit no readability from id, local-user ownership, or historical anonymous behavior, while getScenarioArtifacts and getVoiceAsset retain only their separate job-result and voice-library contracts.
    condition: Whenever an existing artifact or typed media surface is evaluated for retrieval.
    failure: Deny legacy readability and reject substitution among generic artifact, scenario artifact, and voice asset surfaces.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r034
    kind: rule
    title: Artifact storage and SDK projection preserve integrity
    modality: must
    statement: Externally readable records persist observed size, SHA-256, MIME, and complete audience, bounded bytes and accepted streams are hashed during custody commit, committed references are revalidated before metadata attachment, disk opens and adoption copies recheck observed size and hash while holding one immutable readable source through completion, emitters commit before reference, handlers use structured reasons, and the SDK exposes the class-member Runtime.artifacts.readBytes rather than a singleton export.
    condition: Whenever artifact bytes cross storage, event, handler, or SDK boundaries.
    failure: Fail closed on integrity mismatch, incomplete audience, emit-before-store, unstructured failure, or an alternate SDK surface.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r035
    kind: rule
    title: Unadmitted generic artifact operations remain unavailable
    modality: must_not
    statement: Runtime exposes cross-device or cross-account artifact sharing, delegated audiences, generic external chunked retrieval, generic describeArtifact metadata, generic by-tag or by-source discovery, upload-by-id replacement semantics, adoption other than runtime.ai.artifact.adopt-to-app-storage into the same current-account-plus-Registered-App-Subject Base asset partition, or artifact behavior that deprecates lipsync_frame_batch without separate authority; internal streamed custody and the exact adoption operation do not create generic artifact discovery or sharing.
    condition: Whenever the generic artifact API is extended.
    failure: Reject the operation until a future canonical authority explicitly admits it.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r036
    kind: rule
    title: Scenario Jobs expose one submission observation and cancellation contract
    modality: must
    statement: SubmitScenarioJob atomically persists complete immutable effective inputs and dispatch intent before publishing only a Job. GetScenarioJob authorizes the current caller, observes the original execution and may admit one bounded Runtime-private reconciliation of that execution, including result acquisition, validation and atomic publication; it never creates, replays or selects another target. Local and remote synchronous workers continue independently of Get. Submission identity lookup is owner-scoped and read-only; its caller subsequently uses Get on the original Job. SubscribeScenarioJobEvents projects Job snapshots and GetScenarioArtifacts remains the formal artifact and ScenarioOutput reader. For voice.create, only a successful terminal Get returns the atomically published VoiceAsset and VoiceReference; for vision.locate, only that Get returns the typed result atomically persisted once in the same Job record with COMPLETED, an empty locations list differs from an absent result, and no JSON artifact or separate result store is created. Every contract retains its required typed, resource and multiple-artifact success set; COMPLETED requires the whole validated result. The same CapabilityContract and ASYNC_JOB form on common supported input use the same Submit, Get, result-read and Cancel program across implementations, without public protocol phases or required refresh or acquisition actions. Captured input is never rebuilt from current AIConfig, Loadout, catalog or Connector selection; current authorization is revalidated separately. A pure typed result may commit its complete result and COMPLETED in one atomic Job mutation without a mandatory separate durable full-Job candidate. Multi-body acquisition, remote synchronous original results and external VoiceAsset workflows retain the private intermediate ownership their actual result owners require; deleting a capacity mechanism must not delete valid committed results or still-useful candidates before their applicable purpose and retention end.
    condition: Whenever a ScenarioJob is submitted, recovered after restart, queried, canceled, subscribed, or read for artifacts.
    failure: Reject partial capture, duplicate creation during observation or restart, changed targets, public execution phases, backend-dependent App control, premature or partial completion, or a missing or improperly projected operation-specific success result.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.r037
    kind: rule
    title: Scenario job states and terminal semantics are closed
    modality: must
    statement: ScenarioJob starts at SUBMITTED awaiting scheduling, QUEUED awaits execution resources, RUNNING executes, COMPLETED is terminal success, FAILED is terminal failure, CANCELED is terminal cancellation, and TIMEOUT is terminal timeout; these seven states are exact, remain orthogonal to configuration, binding, selection and derived admission, never write back to them, and the event stream may close normally only after a terminal state.
    condition: Whenever Runtime creates, transitions, persists, emits, or returns a ScenarioJob.
    failure: Reject an unknown state, wrong terminal flag, non-SUBMITTED initial state, or normal close before terminal.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.lifecycle-registry
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.r038
    kind: rule
    title: Scenario job transition graph is closed
    modality: must
    statement: ScenarioJob transitions remain exactly SUBMITTED to QUEUED on queue acceptance, RUNNING on dispatch, FAILED on definitive pre-run failure or non-resumable restart interruption, CANCELED on explicit local Cancel winning publication or an authenticated original provider-task cancellation, or TIMEOUT on an actually terminated bounded Host resource instance or an authenticated original provider-task expiration; QUEUED has the same dispatch and terminal exits, and RUNNING exits to COMPLETED only with the whole validated contract result or to those same truthful failure, cancellation and timeout outcomes. A lost native create acknowledgement remains nonterminal with submission UNKNOWN absent a separate definitive execution failure; no possible dispatch is automatically repeated. A non-resumable remote synchronous Host resource termination may be TIMEOUT with submission UNKNOWN and its local resource cause without claiming external stop. Provider cancellation carries AI_PROVIDER_TASK_CANCELED and confirmed stop without inventing an App Cancel; provider task expiration carries AI_PROVIDER_TASK_EXPIRED, never the local resource cause. A query, RPC, acquisition or result-commit failure with an original receipt or trustworthy candidate still available is an operation error or response-local observation issue, not proof of permanent result loss or provider termination; one expired URL is not task expiration, and proven permanent result loss is FAILED with AI_RESULT_UNAVAILABLE. Job age never manufactures terminal state or rejects late success. Terminal status has no exit; the existing writer determines one publication winner, and a later provider fact cannot replace an already won terminal or its timestamp. If an explicit Cancel publication gate cannot be durably saved, reject that entire Cancel operation, preserve the last trustworthy snapshot, publish no FAILED or CANCELED event for that write failure and allow the original work to continue or complete; the caller may later Get or Cancel the same Job. An unsuccessful terminal write likewise returns an operation error or the last trustworthy facts, never a fabricated committed terminal. True authority withdrawal and actual Host resource termination independently stop unauthorized or exhausted work even when their state write fails; they do not inherit the continue-execution semantics of a rejected voluntary Cancel.
    condition: Whenever a ScenarioJob status changes.
    failure: Reject the transition and preserve the last valid status.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.lifecycle-registry
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.r040
    kind: rule
    title: Scenario jobs capture exact secret-free effective inputs
    modality: must
    statement: Before publication SubmitScenarioJob atomically captures and persists for Local the AIConfig Local route, exact current machine-selected Loadout identity, implementation-supported, configured, and request-admitted features, exact CapabilityImplementation, versioned Driver dialect and recipeId, typed options, every present model axis's model_asset_id, expected_content_id, reverified absolute path and content identity, RecipeCustody identity, request, resolved Text Behavior mapping when used, load plan, and process identity as one complete ResolvedAssembly, or for Cloud the exact committed Connector reference, CapabilityImplementation, Driver-owned provider-model target, defaults, and request; raw credentials and bearer material are never persisted, minimum secret material is obtained only from the captured Connector in ephemeral execution context and zeroed, and queued, running, or restart-recovered Jobs never reconstruct or rewrite captured input from current owner configuration or machine selection or redispatch after restart. Input capture never freezes authorization; current account, registration, App access and policy checks are separate, and each new remote reconciliation validates the current original Connector before opening only the exact captured private custody reference without current-secret fallback. Input immutability prohibits changing the captured execution target or content while it remains executable; it does not require permanent retention of Memory-derived content. Authorized lifecycle disposal may remove that payload while preserving non-content Job facts and a non-executable disposed state under the Memory-derived payload contract.
    condition: Whenever a ScenarioJob is created, recovered after restart, accessed, or reaches terminal state.
    failure: Reject partial persisted input, target reconstruction, credentials in durable Job state, missing exact custody or execution based solely on a captured authorization snapshot.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.memory-derived-payload
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.r041
    kind: rule
    title: Connector or custody deletion cannot orphan submitted jobs
    modality: must
    statement: Deleting, disabling or changing the original Connector blocks future submissions and remote actions that require new admission, but never erases or reconstructs submitted Job identity, receipt, observation, local Cancel, complete results or artifact audience. BeginOutbound and the Connector mutation share the Connector owner guard; a mutation first rejects the new outbound action before dispatch, while a BeginOutbound first may finish that exact already admitted finite IO and commit its lawful result under still-current account, registration, App access and policy authority. Connector mutation alone does not revoke that in-flight work or pretend the provider rejected execution. Every later query, transfer body or stop call must obtain new current original-Connector admission and exact captured custody, without current-secret or target fallback. Before first dispatch, a definitive local admission rejection may close FAILED with its exact local admission reason and NOT_DISPATCHED, without claiming provider failure; later Get reconciliation admission denial is a response-local observation issue, not provider failure or user cancellation. True account, registration, App access or policy withdrawal still fences new actions and unauthorized publication. Metadata-based Get and local Cancel remain available to the authorized Job owner, and complete artifacts follow their independent recorded audience.
    condition: Whenever a Connector or custody record changes while a Job remains observable or executing.
    failure: Reject new outbound actions after Connector mutation, Connector-state changes treated as provider failure or implicit Cancel, old captured records used as new admission, deletion of original Job facts, or denial of owner control and completed artifact access solely because the Connector changed.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.r042
    kind: rule
    title: Terminal job failures have stable and structured layers
    modality: must
    statement: A terminal failed ScenarioJob carries stable short reason_code and reason_detail for polling and lists plus safe machine-readable reason_metadata for SDK, Desktop, and App error projection; when failure is interruption its reason_code is AI_EXECUTION_INTERRUPTED and it additionally carries the typed interruption cause and resubmit disposition outside free text; a restart interrupted execution proven not dispatched or definitely interrupted Local execution may expose caller-may-resubmit, while a remote synchronous dispatch whose external outcome is unknown exposes outcome-uncertain and never implies safe retry, and this execution fact never becomes persisted capability readiness, selection, binding, or configuration state.
    condition: Whenever a ScenarioJob reaches a failed terminal outcome.
    failure: Reject free-text-only failure, an interrupted failure missing its typed cause or resubmit disposition, or a failed terminal snapshot missing either stable summary or safe structured detail.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.r043
    kind: rule
    title: Job reason metadata is safe state-consistent and nonsticky
    modality: must
    statement: reason_metadata contains only transport-safe machine-readable values, never credentials, headers, tokens, raw sensitive provider payload, ModelAsset paths, or private process proof, may include an approved provider, Driver, or ExecutionHost message for the exact failure, is absent from CANCELED and COMPLETED, and appears consistently in SubscribeScenarioJobEvents and GetScenarioJob snapshots; the canonical interruption cause and resubmit disposition use their dedicated typed fields and are never reconstructed from reason_metadata or detail text.
    condition: Whenever Runtime stores or projects ScenarioJob failure metadata.
    failure: Remove unsafe or stale metadata and fail the projection when query and event snapshots disagree.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.r044
    kind: rule
    title: Scenario job progress uses bounded factual fields
    modality: must
    statement: ScenarioJob progress uses progress_percent from 0 through 100 and, when a backend provides discrete progress, progress_current_step with progress_total_steps, all as snapshot fields without adding a ScenarioJob status.
    condition: Whenever a backend supplies trustworthy running-job progress.
    failure: Reject an out-of-range value, incomplete discrete-step pair, or a new lifecycle state used only for progress.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.r045
    kind: rule
    title: Running progress cannot be fabricated or diverge
    modality: must_not
    statement: Runtime or a consumer estimates ScenarioJob progress from elapsed time or UI heuristics, or exposes different current progress through GetScenarioJob and SubscribeScenarioJobEvents.
    condition: Whenever a job remains RUNNING or a backend provides no trustworthy progress.
    failure: Return status with absent or zero progress when unknown, permit repeated RUNNING events, and let consumers replace old snapshots with the latest consistent snapshot.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.r046
    kind: rule
    title: Scenario discriminators modalities and execution modes are closed
    modality: must
    statement: The scenario registry is exactly TEXT_GENERATE as text with SYNC and STREAM, TEXT_EMBED as embedding with SYNC, TEXT_DECIDE as text with SYNC, TEXT_ANNOTATE as text with ASYNC_JOB, IMAGE_GENERATE as image with ASYNC_JOB, VIDEO_GENERATE as video with ASYNC_JOB, SPEECH_SYNTHESIZE as tts with STREAM and ASYNC_JOB, SPEECH_TRANSCRIBE as stt with ASYNC_JOB, VOICE_CREATE as tts with ASYNC_JOB, MUSIC_GENERATE and MUSIC_TRANSCRIBE and AUDIO_VOICE_CONVERT and AUDIO_SEPARATE as music with ASYNC_JOB, WORLD_GENERATE as world with ASYNC_JOB, VISION_LOCATE as vision with ASYNC_JOB, IMAGE_FACE_SWAP as image with ASYNC_JOB, and VIDEO_FACE_SWAP as video with ASYNC_JOB; the video.face_swap Session form is not a ScenarioJob STREAM alias.
    condition: Whenever Runtime declares, lists, validates, or dispatches a scenario type.
    failure: Reject an unknown discriminator, mismatched modality, or execution mode outside the exact scenario row.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-registry
  - id: rule.nimi.runtime.service-operations.r047
    kind: rule
    title: Scenario profile fields are fixed
    modality: must
    statement: Every ScenarioProfile requires scenario_type and supported_execution_modes and may include only the optional human-readable description field from the admitted profile-field surface.
    condition: Whenever Runtime returns or consumes a ScenarioProfile.
    failure: Reject a profile missing a required field or containing an undeclared stable profile field.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-registry
  - id: rule.nimi.runtime.service-operations.r048
    kind: rule
    title: Connector status and deletion transitions are closed
    modality: must
    statement: Connector status transitions only ACTIVE to DISABLED and DISABLED to ACTIVE through UpdateConnector, while remote deletion transitions PRESENT to DELETE_PENDING, permits DELETE_PENDING self-retry or startup rescan, and reaches DELETED only after credential cleanup and registry deletion.
    condition: Whenever a connector status changes or remote connector deletion executes.
    failure: Reject an undeclared transition, direct PRESENT-to-DELETED removal, or DELETED before credential cleanup.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.lifecycle-registry
  - id: rule.nimi.runtime.service-operations.r049
    kind: rule
    title: Local content and execution states remain orthogonal
    modality: must
    statement: ModelAsset verified-content and install state, Loadout interpretability and requirement resolution, Machine Loadout store selection, derived admission, Job execution, and Runtime-private ExecutionHost residency or process health are independent facts; no INSTALLED, ACTIVE, UNHEALTHY, LocalWarmState, ready, resident, or warm product lifecycle collapses them, and ordinary load or generation failure changes only the Job unless the Driver classifies a persistent hard blocker.
    condition: Whenever Runtime stores or interprets local content, configuration, selection, admission, Job, or process state.
    failure: Reject a combined readiness lifecycle, process-derived selection, binding deletion, or execution-derived configuration mutation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.lifecycle-registry
  - id: rule.nimi.runtime.service-operations.r050
    kind: rule
    title: Local service lifecycle expresses process truth only
    modality: must
    statement: Runtime may maintain a private supervised ExecutionHost process lifecycle for spawn, handshake, monitoring, restart, stop, and cleanup, but this state is never projected as CapabilityContract readiness, Loadout validity, machine selection, binding, derived admission, or a reason to reroute; process failure is recorded only as private supervision evidence and the exact affected Job result unless a Driver declares a persistent hard blocker.
    condition: Whenever Runtime changes or interprets local service lifecycle.
    failure: Reject an undeclared edge or a service state inferred solely from one model's residency.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.lifecycle-registry
  - id: rule.nimi.runtime.service-operations.r051
    kind: rule
    title: Model transfer status transitions are closed
    modality: must
    statement: One ModelAsset acquisition instance transitions only through queued, transferring, verifying, installed, failed, canceled, retrying, and removed content states, catalog acquisition hard-verifies every declared file hash before installed, manual import computes every digest before commit, and none of these states implies Loadout compatibility, selection, admission, readiness, or Job success.
    condition: Whenever Runtime changes ModelAsset transfer, import, install, retry, cancel, or removal state.
    failure: Reject an undeclared transition, partial or hash-mismatched installed state, and any content state promoted to configuration or execution truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.lifecycle-registry
  - id: rule.nimi.runtime.service-operations.r052
    kind: rule
    title: Daemon health states and initial state are fixed
    modality: must
    statement: Runtime daemon health is exactly STOPPED value 1, STARTING value 2, READY value 3, DEGRADED value 4, or STOPPING value 5, with initial state STOPPED and READY meaning requests may be accepted while DEGRADED means partial functionality is unavailable.
    condition: Whenever Runtime initializes, changes, or projects daemon health.
    failure: Reject an unknown value, wrong initial state, or false READY projection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r053
    kind: rule
    title: Protected state validation precedes protected listeners
    modality: must
    statement: Before any protected local endpoint accepts traffic, Runtime validates the configuration, custody, and endpoint ownership required by its current admitted topology and invalidates every prior-process exact-launch correlation, process binding, session, Effective App Access Snapshot, Agent handle, and stream; production uses its admitted service boundary while D2 local development uses its per-user non-elevated boundary, with the concrete restart marker and platform primitive remaining implementation and neither topology becoming the other's prerequisite.
    condition: Whenever a production or D2 local-development Runtime process boots.
    failure: Keep protected App access unavailable on invalid required state, endpoint ownership failure, or a missing topology-specific platform primitive without public-TCP, portable-session, or cross-topology fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r054
    kind: rule
    title: Production Runtime starts only from admitted service identity
    modality: must
    statement: A production or deployment Runtime validates its admitted service principal, signed service definition, current platform code identity, and service-owned immutable configuration and custody before opening production protected access, and Desktop production start or restart uses only the typed service-control gateway; these facts are not D2 local-development trust facts or prerequisites.
    condition: Whenever the production or deployment Runtime service starts or restarts.
    failure: Reject production protected access outside the admitted service identity without blocking or upgrading the separately admitted D2 per-user local-development topology.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r055
    kind: rule
    title: Production daemon startup preserves operational truth
    modality: must
    statement: Production or deployment Runtime startup establishes its admitted service topology and endpoint, loads and validates its supported configuration and custody inputs including durable LocalAgent Memory binding, outbox, delivery frontier, and terminating-fence state, invalidates prior-process ephemeral access, opens only admitted listeners, starts configured private supervised services, begins admitted event-triggered outbox drain and startup replay under current lifecycle service authorization, projects matching operational health, and starts admitted resource sampling; optional Memory replay readiness never blocks ordinary Runtime readiness, daemon status remains process-operational truth and proves no App access, owner operation, Memory readiness, or AI capability, and these production mechanics are not D2 requirements.
    condition: Whenever a production or deployment Runtime daemon starts.
    failure: Stop before the dependent stage or mark the daemon operationally DEGRADED where explicitly admitted rather than reorder stages or fabricate service health or capability admission.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r056
    kind: rule
    title: Supervised Host startup stays private and failure-evidenced
    modality: must
    statement: Runtime creates the private ExecutionHost manager when supervised operation is enabled, starts a llama, media, speech, or Runtime-private Vision Host only from an admitted Job or explicit Runtime-owned lifecycle using its exact captured package and dependency inputs, retains the materialized endpoint only inside the typed private Host handle after handshake, never writes it to process-global environment or public configuration, and records bounded startup failure evidence while daemon operation may become DEGRADED; this lifecycle never changes AIConfig, Loadout, machine selection, binding, or public capability readiness or fabricates provider-unhealthy product truth.
    condition: Whenever Runtime creates a supervised ExecutionHost manager or starts a supervised Host.
    failure: Reject ambient endpoint injection, eager Host startup without exact admitted inputs, public capability-health projection, configuration mutation, or unaudited process startup failure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r057
    kind: rule
    title: Graceful shutdown has one bounded sequence
    modality: must
    statement: Shutdown changes daemon operational status to STOPPING with matching gRPC health, freezes one daemon-owned deadline, rejects new Memory delivery, Commit, Recall, and Memory AI Job work, cancels active RPCs and streams, allows a short drain of already accepted work without deleting an unreceived durable outbox payload or fabricating Cognition custody, stops supervised ExecutionHosts and resource sampling, closes HTTP with the configured default ten-second timeout, calls gRPC GracefulStop and then ForceStop at the same deadline, and finally changes status to STOPPED; no provider probe lifecycle exists to stop.
    condition: Whenever Runtime receives shutdown.
    failure: Force bounded process exit at the deadline and never remain indefinitely in STOPPING.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r058
    kind: rule
    title: Forced shutdown is controlled and observable
    modality: must
    statement: If gRPC does not drain naturally but ForceStop completes process exit within the frozen deadline, shutdown is controlled completion with forced=true lifecycle audit and diagnostics rather than silent or fabricated graceful success, and lifecycle interception permits only read-only methods during STOPPING.
    condition: Whenever graceful shutdown reaches its deadline or a request arrives during STOPPING.
    failure: Record the forced path, reject non-read-only work, and fail shutdown if bounded process exit itself does not complete.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r059
    kind: rule
    title: STOPPING preempts active subsystems without fabricated terminals
    modality: must
    statement: STOPPING rejects new Runtime Job, Memory delivery, Commit, and Recall work as unavailable, preserves every unreceived durable Memory outbox entry, delivery frontier, terminating fence, bounded owner operation state, completed Job and artifact record, canonical AIConfig, Loadout, selection, and ModelAsset, terminates private supervised ExecutionHosts within bounded shutdown policy, and invalidates in-memory sessions on process exit. When STOPPING belongs to a Runtime restart, it terminates in-flight synchronous and streaming scenarios with AI_EXECUTION_INTERRUPTED and their existing typed restart disposition, closes only nonterminal SUBMITTED, QUEUED or RUNNING Jobs proven not dispatched as interrupted with NOT_DISPATCHED and caller-may-resubmit, closes non-resumable Local and remote synchronous Job work with accurate interruption and submission uncertainty, and preserves durable original native receipt or uncertain dispatch facts under r072 without automatic create, query or fabricated completion; no late item is emitted. A final stop applies the same truthful execution attribution without assuming the external task stopped, and only explicit local Cancel or authenticated provider-task cancellation produces CANCELED with its accurate source cause. Already CANCELED, FAILED, TIMEOUT or COMPLETED records retain their stored terminal status, cause, stop facts, terminal timestamp and fixed retention during shutdown and restart; ending in-flight scopes or cleanup does not turn a previously canceled not-dispatched Job into FAILED.
    condition: Whenever daemon shutdown affects active child state machines.
    failure: Interrupt the active child path typed and reject automatic resume, fabricated completion, late items, new work, lingering subscription, lost completed custody, or an engine left beyond its timeout.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r060
    kind: rule
    title: Protected origin is derived before request interpretation
    modality: must
    statement: On protected Third-party App ingress Runtime derives immutable origin before interpreting caller authority fields and binds the connected peer only to Desktop's current exact Host launch and process relation; the proof establishes no binary integrity, mutable-project integrity, OS sandbox, machine identity, complete process attestation, same-user resistance, or long-lived authorization lineage, and public TCP remains explicitly non-protected.
    condition: Whenever a protected Third-party App request enters Runtime.
    failure: Reject transport or role mismatch before parsing authority-bearing request material.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r061
    kind: rule
    title: Protected App request semantics use one order
    modality: must
    statement: Protected Third-party App operations derive the verified exact Host peer, validate the fresh session and Runtime-private snapshot, classify the exact AppOperationId through the canonical contract, enforce the classified Base invariants or AppAccess-domain snapshot coverage, dispatch to the owning service, and project the owner-defined typed result in that semantic order; interceptor count, names, composition, framing, and language-specific registration remain implementation details.
    condition: Whenever Runtime handles a protected Third-party App operation.
    failure: Reject the affected operation before owner execution when an ordered prerequisite is absent and never replace the failure with global Runtime unavailability or a fallback path.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r062
    kind: rule
    title: Interceptor responsibilities remain separated
    modality: must
    statement: Protected-origin consumes only the bounded platform peer and Desktop launch facts, lifecycle and activity tracking do not replace App operation admission, owner authorization remains with the owning service, and credential scrubbing or scanning may remove sensitive material before projection or audit only as defense in depth rather than as identity proof, admission proof, or typed-result correctness proof.
    condition: Whenever Runtime processes a request through the interceptor chain.
    failure: Reject metadata-derived protected origin, duplicated admission authority, scanner-dependent success, and raw credential propagation into App-facing results or audit.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r063
    kind: rule
    title: Protocol metadata values have a hard bound
    modality: must
    statement: Protocol-envelope metadata remains within the owning transport's bounded header and field budgets and rejects oversized metadata before dispatch.
    condition: Whenever the protocol interceptor parses envelope metadata.
    failure: Return PROTOCOL_ENVELOPE_INVALID before handler execution for any oversized field.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r064
    kind: rule
    title: Protected App admission precedes owner idempotency
    modality: must
    statement: Every protected Third-party App operation revalidates the current exact Host peer, fresh session, Runtime-private snapshot, exact AppOperationId classification, required Base invariants or AppAccess-domain coverage, and current owner policy before any prior result may be reused; only the exact operation owner may define request-bound idempotency or deduplication after that admission, and no generic pre-admission cache or AppID-plus-key replay can return an earlier success.
    condition: Whenever Runtime processes a protected Third-party App operation that may be retried or deduplicated.
    failure: Reject cached success before current admission, cross-subject or cross-operation reuse, and idempotency that bypasses current owner policy.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r065
    kind: rule
    title: AI scheduling uses ordered global and app limits
    modality: must
    statement: AI execution acquires a configurable global semaphore defaulting to 8 before a configurable per-app semaphore defaulting to 2, releases in reverse order, maps empty AppID to _default, and marks AcquireResult.Starved true after the configurable default 30-second wait threshold.
    condition: Whenever an AI execution path acquires scheduler capacity.
    failure: Reject execution that bypasses either limit or violates acquisition order, and expose starvation rather than silently waiting beyond the threshold.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r066
    kind: rule
    title: Job lifetime and finite technical budgets are independent
    modality: must
    statement: ASYNC_JOB has no explicit or default business deadline, durable business timer, age-based cancellation or late-result rejection. Every ASYNC_JOB Submit admits legacy timeout_ms only when absent or zero and rejects every nonzero value including negative values with AI_MEDIA_OPTION_UNSUPPORTED before route selection, capture, Job publication or dispatch, uniformly across Local, remote synchronous and native asynchronous implementations. The shared ScenarioRequestHead retains timeout_ms for SYNC and STREAM technical calls, whose existing defaults remain 30 seconds for TEXT_GENERATE, 20 seconds for TEXT_EMBED, 60 seconds to stream first byte and 120 seconds total for text stream, and 45 seconds for speech stream with their existing admitted override bounds. The protected Job tag 9 remains solely a deprecated rejection slot, never a Job control; public handwritten Job timeout options are removed and old option keys rejected. Separate call controls bound one observation or submission RPC, never call Cancel or rewrite Job input. Runtime independently bounds actual queue capacity, model-loading or compute resources, HTTP calls and finite result work, releases slots between external pending checks, and attributes real resource termination separately from uncertain external execution. Historical timeout input is not converted into a deadline or replayed. App business timers may explicitly call Cancel but Runtime never persists or catches them up after App closure or sleep.
    condition: Whenever Runtime admits an AI request or bounds an execution, transport or observation resource.
    failure: Reject a nonzero ASYNC_JOB timeout before resource resolution, a Job age or query timeout used as execution terminal proof, an unbounded physical work instance, or removal or reinterpretation of existing SYNC and STREAM call controls.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r067
    kind: rule
    title: Production configuration has disjoint boot and mutable classes
    modality: must
    statement: Production service principal, service definition, listener identity, active release, Realm account endpoints, custody root, and production or test posture come only from signed service and release projections and are Runtime-immutable, while admitted Connector custody metadata and Runtime-private Local or Remote ExecutionHost operational configuration live in service-principal-owned state and change only through typed protected Desktop control after authorization and closed-schema validation; this production configuration stores no App declaration, Effective App Access Snapshot, AIConfig route, provider-model target choice, Loadout identity, binding, or machine selection and is not a D2 local-development prerequisite.
    condition: Whenever production Runtime loads, reads, or changes configuration.
    failure: Reject mutation of boot security fields and any mutable product change lacking protected authorization or schema admission.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r068
    kind: rule
    title: Production configuration rejects alternate authority
    modality: must
    statement: Production ignores and rejects NIMI_RUNTIME variables, argv-selected endpoints, user-writable files, user-home Runtime config, App or renderer metadata, unknown fields, and pre-release legacy import; addresses and timeouts validate, physical paths stay hidden, reads return only redacted typed projection, and these production service configuration constraints are not prerequisites or trust facts for the D2 per-user local-development slice.
    condition: Whenever production Runtime parses or projects configuration.
    failure: Fail configuration closed on an alternate source, unknown field, invalid address, nonpositive timeout, path disclosure, or attempted legacy import.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r069
    kind: rule
    title: Protected configuration mutation has two results
    modality: must
    statement: Typed protected config mutation returns CONFIG_RESTART_REQUIRED when any admitted Runtime-private Connector-custody or ExecutionHost operational field in providers.* or engines.llama.* changes and CONFIG_APPLIED for only hot changes or no material change; these namespaces never carry an AIConfig route, provider-model target choice, default model or provider, local binding, or machine selection, engines.localai.*, engines.nexa.*, engines.nimi_media.*, and the retired engines.media.* are rejected, and Desktop may request typed restart but never stop or select binary or config paths.
    condition: Whenever Desktop requests a Runtime configuration mutation.
    failure: Reject an unknown result, wrong restart classification, retired engine field, direct stop, document write, or path selection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r070
    kind: rule
    title: Admitted HTTP health endpoints have fixed semantics
    modality: must
    statement: On a separately admitted HTTP listener GET /livez returns 200 for process life, GET /readyz and GET /healthz return 200 only in READY and otherwise 503, and GET /v1/runtime/health returns the same full JSON health fields as GetRuntimeHealthResponse.
    condition: Whenever an admitted Runtime HTTP health listener is active.
    failure: Reject another method or status mapping and never use these endpoint definitions to manufacture an ordinary production public listener.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r071
    kind: rule
    title: Runtime version metadata is stable per process
    modality: must
    statement: Every gRPC response header carries semver x-nimi-runtime-version fixed at daemon startup for the process, node-grpc SDK consumers cache it from the first successful RPC for compatibility, missing metadata follows SDK best-effort compatibility, and Desktop obtains semantically equivalent daemonVersion through runtime_bridge_status.
    condition: Whenever Runtime responds over gRPC or a consumer determines daemon compatibility.
    failure: Reject a changing or non-semver process version and preserve the transport-specific missing-version behavior without inventing a value.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r072
    kind: rule
    title: Restart preserves durable stores but invalidates ephemeral authority
    modality: must
    statement: A normal Runtime restart in either admitted topology preserves Registered App Subjects and records, audit, canonical AIConfig, ModelAssets, Loadouts, machine selections, admitted Runtime-owned LocalAgent Conversation and record stores, Agent-scoped Memory enabled state, opaque bank bindings, unreceived per-binding outbox entries, contiguous delivery frontiers, terminating fences, completed ScenarioJobs and artifacts, and bounded Runtime AI Job custody, invalidates every prior-process exact-launch correlation, process binding, session, Effective App Access Snapshot, Agent handle, challenge, and stream before a protected listener becomes ready, and replays only persisted eligible outbox work under current lifecycle service authorization without scanning Conversation, reconstructing Memory, or catching up a disabled period. Only recovered nonterminal Jobs of any implementation whose status remains SUBMITTED, QUEUED or RUNNING and whose durable writer facts prove they never crossed the dispatch gate and have no permitted resumption close before serving as FAILED with AI_EXECUTION_INTERRUPTED, Runtime-restart cause, submission NOT_DISPATCHED and CALLER_MAY_RESUBMIT, with no create; resources whose purpose ended are released through active-use-safe cleanup. Possible dispatch is never inferred to be not dispatched. A still nonterminal SUBMITTED, QUEUED or RUNNING Job whose in-flight Local or remote synchronous execution has no exact supported resumption mechanism reaches FAILED with AI_EXECUTION_INTERRUPTED and accurate Runtime-restart cause before being served; uncertain external dispatch carries outcome-uncertain disposition and never implies safe retry. A dispatched native Job with durable original receipt preserves that receipt, target, action binding and bounded custody and remains queryable through the same Get under fresh authorization; acknowledgement lost after possible dispatch remains submission-uncertain. Restart never automatically creates, redispatches or polls a generation, manufactures COMPLETED or converts historical timeout into a new deadline. The concrete restart marker remains implementation; old permits and ephemeral scopes are invalid and no durable App permission or authorization record exists. Restart also preserves and resumes pending owner-authorized Memory payload disposal, retains metadata-only disposed Jobs without reconstructing their content, and never presents pending disposal as completed local cleanup. Startup never reinterprets an already CANCELED, FAILED, TIMEOUT or COMPLETED Job under this nonterminal recovery rule and preserves its stored status, cause, stop facts, terminal timestamp and fixed retention; scope invalidation and bounded resource cleanup do not rewrite or renew those terminal facts.
    condition: Whenever Runtime restarts in either admitted topology.
    failure: Deny old ephemeral authority, generation replay, fabricated success or safe-retry claims for uncertain dispatch; preserve original receipt and target facts and require fresh admission for any later bounded reconciliation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
      - type: applies_to
        target: definition.nimi.runtime.service-operations.memory-derived-payload
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.r073
    kind: rule
    title: Restart integrity failures make protected access unavailable
    modality: must
    statement: Invalid topology-specific Runtime state, account or session mismatch, current data-root mismatch, Memory binding, outbox, frontier, terminating-fence, or AI Job custody mismatch, or other custody failure makes the affected protected App access or Memory operation typed unavailable or invalid without reconstructing parallel truth, fabricating ready or received, stopping unrelated ordinary LocalAgent turns, process, support, diagnostic, authoring, or owner functionality, or substituting the other topology as fallback.
    condition: Whenever Runtime validates protected state during restart.
    failure: Fail closed without direct-daemon, environment-selected-root, portable-session, app-id lookup, or old-process-channel recovery.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r074
    kind: rule
    title: Runtime public operational command set is bounded
    modality: must
    statement: The Runtime public operational CLI provides foreground process control, a stable background command grammar whose execution is limited to the current build's admitted background manager or production service controller, daemon-manager status and a sanitized public health classification through that admitted topology, doctor, version, and separately governed Advanced or Admin namespaces; an unavailable background topology fails closed, and the CLI opens or depends on no ordinary production Runtime RPC or HTTP listener, calls no protected Runtime health method, and exposes no model or provider namespace, detailed Runtime health snapshot, ModelAsset inventory, import, install, transfer, or removal, Machine Loadout operation, Connector custody or test, Runtime-private ExecutionHost detail, high-level generation, route, target, default, AIConfig, or machine-selection mutation.
    condition: Whenever the public Runtime CLI command surface is built or displayed.
    failure: Reject a missing required foreground operation, background pseudo-success or fallback on a build without its admitted topology, any protected product projection or mutation, and any command that creates generation or configuration authority outside the canonical owners.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r075
    kind: rule
    title: Top-level usage separates operational domains
    modality: must
    statement: Top-level nimi usage groups commands under Quick Start, Runtime Operations, Advanced or Admin, and an external Author tooling pointer so each retained public responsibility is explicit; it advertises no Asset Management, Model, Provider, Connector Custody, protected ExecutionHost diagnostic, generation, default route, or default provider experience.
    condition: Whenever nimi renders top-level help.
    failure: Reject help output missing a retained public group or advertising a protected product, retired generation, or routing path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r076
    kind: rule
    lifecycle: removed
    title: Retired Runtime CLI generation targeting
    reason: Removed because Runtime CLI is not an AIConfig owner and nimi run no longer exists as a high-level text-generation or request-scoped route, provider, or model selector.
  - id: rule.nimi.runtime.service-operations.r077
    kind: rule
    lifecycle: removed
    title: Retired Runtime CLI generation grammar
    reason: Removed with nimi run; --local, --cloud, --provider, and --model carry no generation route, target, default, product authority, alias, or compatibility interpretation.
  - id: rule.nimi.runtime.service-operations.r078
    kind: rule
    title: Daemon-down CLI failures are actionable and redacted
    modality: must
    statement: When the daemon is unreachable, a retained daemon-dependent operational command fails closed with one executable next-step hint and exposes no raw gRPC or dial detail on the public surface; the diagnostic neither queries a protected product surface nor creates a route or continues into generation.
    condition: Whenever a retained CLI operation cannot reach Runtime.
    failure: Return a non-success exit with the bounded hint rather than raw transport detail or pseudo-success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r079
    kind: rule
    lifecycle: removed
    title: Retired generation-triggered model installation
    reason: Removed because a generation command no longer resolves a model, starts installation, or continues execution, and ModelAsset product operations are absent from Runtime CLI and remain on Desktop's verified protected surface.
  - id: rule.nimi.runtime.service-operations.r080
    kind: rule
    lifecycle: removed
    title: Retired high-level model and provider route grammar
    reason: Removed because Runtime CLI has no model or provider namespace and protected ModelAsset and Connector product operations remain on Desktop's verified protected surface rather than acting as generation route or target selectors.
  - id: rule.nimi.runtime.service-operations.r081
    kind: rule
    title: Connector custody stays outside Runtime CLI
    modality: must_not
    statement: The Runtime CLI exposes a provider or Connector namespace, Connector custody record or mutation, Test Connector diagnostic, credential carrier, provider-model target, default provider or model, Machine Loadout store relation, or generation request; Connector product operations remain exclusively on Desktop's verified protected surface and with their canonical Runtime owners.
    condition: Whenever the Runtime CLI surface is built, displayed, or invoked.
    failure: Reject the command before protected transport or owner execution without exposing Connector existence, credentials, custody, diagnostics, selection, routing, or generation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r082
    kind: rule
    title: Doctor reports the minimum operational context
    modality: must
    statement: nimi doctor reports binary version, the admitted daemon manager's process or protected-service state, a sanitized reachable, unreachable, service-running, or stopped health classification, and optional SDK detection in the current working directory, or returns a bounded diagnostic failure when the current build has no admitted background topology, without opening or depending on an ordinary production Runtime listener, calling a protected Runtime health method, or querying or exposing a detailed Runtime health reason, ModelAsset inventory, Machine Loadout state, Connector custody, Runtime-private ExecutionHost supervision, credentials, or a production Runtime private physical configuration path; only when an explicit nonproduction portable config was supplied may doctor report that path, labeled as the nonproduction portable config entry, and no diagnostic field becomes capability readiness, binding, route, selection, or execution feasibility.
    condition: Whenever nimi doctor runs.
    failure: Return a diagnostic failure when daemon-manager state cannot be determined, and reject an ordinary production listener dependency, protected health or product lookup, unsanitized health reason, default private-path discovery, private-path exposure, or a portable path reported without its nonproduction label.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r083
    kind: rule
    title: App author tooling stays outside Runtime CLI
    modality: must_not
    statement: The nimi Runtime CLI owns app scaffolding, templates, build profiles, dev, author doctor, update, pack, publish, admission, generated auth helpers, or scaffold audit semantics.
    condition: Whenever an app-author command or template capability is proposed for nimi.
    failure: Direct authors to the Platform-governed pnpm dlx @nimiplatform/app-tools nimi-app create, doctor, or update family without importing its authority into Runtime.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r084
    kind: rule
    title: Version command returns installation diagnostics
    modality: must
    statement: nimi version outputs the nimi version, Go version, and operating system and architecture without discovering, inferring, or exposing a production Runtime private physical configuration path; only when an explicit nonproduction portable config was supplied may version additionally report that path, labeled as the nonproduction portable config entry.
    condition: Whenever nimi version runs.
    failure: Return a command failure when the complete version diagnostic cannot be produced, and reject default private-path discovery, private-path exposure, or a portable path reported without its nonproduction label.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r085
    kind: rule
    title: Serve is foreground only
    modality: must
    statement: nimi serve is the canonical foreground Runtime command, remains attached, and writes logs directly without implicit daemonization.
    condition: Whenever the non-product foreground Runtime command runs.
    failure: Reject implicit backgrounding or detached success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r086
    kind: rule
    title: Background Runtime commands and meanings are stable
    modality: must
    statement: Background management provides the stable nimi start, stop, status, logs, and health grammar, where an admitted background manager or production service controller owns execution, status reports its process or protected-service state plus its reachability classification, and health renders the same manager-owned facts as a bounded diagnostic; a build without an admitted background topology returns a bounded unsupported failure without spawning a fallback process or claiming service state, and neither status nor health queries or exposes the protected detailed Runtime health view.
    condition: Whenever the background Runtime CLI surface is built or invoked.
    failure: Reject a missing command, fallback or pseudo-success on an unavailable topology, a protected health lookup, an unsanitized private reason, or a status or health result presented as detailed Runtime health.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r087
    kind: rule
    title: Background start waits for reachable health
    modality: must
    statement: nimi start returns success only after the child process starts and the Runtime health probe is reachable, with DEGRADED accepted as reachable success.
    condition: Whenever nimi start launches a background Runtime.
    failure: Return failure before reachability is proven and never report process creation alone as success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r088
    kind: rule
    title: Status combines process life and Runtime reachability
    modality: must
    statement: nimi status checks both process liveness and Runtime reachability rather than only state files and uses distinct exit codes for stopped and live-but-probe-failed outcomes.
    condition: Whenever nimi status evaluates a background Runtime.
    failure: Reject state-file-only success or an exit code that conflates stopped with probe failure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r089
    kind: rule
    title: Stale daemon state yields to live process truth
    modality: must
    statement: Background daemon pid, daemon metadata, and lock state are cleaned fail closed when stale, and live process truth takes precedence whenever stored state disagrees.
    condition: Whenever background CLI reads or reconciles daemon state files.
    failure: Remove stale state and reject any action or status based on a contradictory file.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r090
    kind: rule
    title: D2 local-development Runtime is per-user and non-elevated
    modality: must
    statement: The Windows and macOS D2 local-development Runtime runs for the current OS user without elevation, LocalSystem, service SID, root, sudo, system account, LaunchDaemon, or another machine-wide privileged identity and uses only thin native local-endpoint, peer-identity, and process-observation adapters; D2 App security comes from Desktop's exact Host launch relation and Runtime operation admission, not an OS sandbox, same-user attack resistance, or the separately owned production service topology.
    condition: Whenever D2 local-development Runtime topology or protected local IPC is launched or evaluated.
    failure: Keep D2 protected App access unavailable when the required per-user local endpoint or exact Host peer relation cannot be established and do not substitute the production service topology as a D2 prerequisite.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r091
    kind: rule
    title: Runtime Memory outbox lifecycle preserves owner custody
    modality: must
    statement: Runtime creates a Memory outbox entry only in the same owner transaction as its eligible committed LocalAgent event, drains and retries it only through the exact opaque Agent binding under current lifecycle authorization, advances only the highest contiguous delivery frontier after Cognition received custody, preserves unreceived or gap-blocked entries across shutdown and restart, and releases confirmed payload without turning the outbox, daemon, public subscription, Conversation scan, or Runtime Job store into canonical Memory, a second event log, generic scheduler, or query source.
    condition: Whenever Runtime creates, drains, retries, shuts down, restarts, compacts, or diagnoses committed-event Memory delivery.
    failure: Preserve the durable entry and frontier on missing custody or a gap, return typed failure or unavailable, and never fabricate received, terminal, ready, admitted, skipped, or migrated state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-delivery-plane
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r092
    kind: rule
    title: Refused stored data keeps a bounded maintenance surface
    modality: must
    statement: When a Runtime owner's read-only startup classification finds that Runtime-owned stored data in the selected data root is in a format or state this Runtime refuses to open, a production or D2 Runtime makes that classification before any owner opens, reconciles, converts, or repairs the root, constructs no ordinary owner, keeps the local-app transport closed, and serves on the already verified Desktop transport only its typed service mode with the owner reason, the canonical Product Control record and selected-root reads, the Product Control maintenance replacement, the Desktop session open its topology requires, and the typed restart request, while every other protected operation returns the same typed refusal; session, transport-refusal, and replacement results are recorded in a bounded maintenance audit plane under the Runtime service state root, never in a data root; an unclassified startup failure keeps the existing fail-closed stop and is never reported with this reason.
    condition: Whenever production or D2 Runtime startup evaluates the stored data in its selected data root.
    failure: Reject reading beyond the owner classification, converting, repairing, migrating, cleaning, or deleting the refused root, ordinary readiness or App access in maintenance, an extra repair service, and misattribution of an unclassified failure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: definition.nimi.runtime.service-operations.memory-derived-payload
    kind: definition
    title: Runtime-owned content copies for Cognition Memory work
    meaning: Memory-derived execution payload is Nimi-controlled content copied solely to perform admitted Cognition Memory work, including copied event or canonical Memory text, composed requests or prompts, returned vectors or other content results, and temporary or recovery copies. Runtime owns its Job-side custody and private association with the authorized opaque Memory binding, operation and lifecycle; Cognition owns the Memory target and canonical effect. This payload is distinct from non-content Job facts, Cognition-owned admitted canonical Memory and active retrieval indexes, original committed Conversation and Realm source, and the independently governed Source Cognition corpus, and creates no additional public operation, selector or Memory store. Normal execution-copy disposal does not remove the active Memory or index that received a valid result; their own authorized lifecycle governs removal.
  - id: rule.nimi.runtime.service-operations.memory-derived-payload-lifecycle
    kind: rule
    title: Memory execution copies follow consumption and Memory deletion
    modality: must
    statement: Runtime retains Memory-derived execution content only while an admitted execution or genuine owner recovery still requires it. Once a result is consumed, a result or execution is abandoned, or a terminal failure or cancellation leaves no legal recovery use, Runtime durably disposes the copied inputs, composed requests or prompts, output content and owner-controlled temporary or recovery copies through its existing Job custody owner; retryable disposal keeps an explicit bounded pending obligation and never becomes a second execution or indefinite result cache. An authorized targeted Memory forget or deletion, delete-all, LocalAgent termination or admitted account deletion covers the matching execution copies regardless of generic Job retention; Runtime first blocks new use and replay and stops or isolates affected execution so late work cannot restore content or effect, then completes each required local disposal before acknowledging cleanup. Private owner linkage selects only the affected binding, operation, lifecycle and content provenance; discarding an indivisible affected batch may remove its execution copy but never unrelated canonical Memory, another Agent bank, original Conversation or Realm source. Minimal non-content Job identity, immutable outcome, timestamps, usage, bounded reason codes and necessary nonrecoverable idempotency or deletion lineage may remain for their owner purpose, but diagnostics, errors or attachments never retain a recoverable content substitute. Disposed Job records remain observable as metadata and cannot execute, replay or rebuild their removed payload from live owner state. These are application-level guarantees over Nimi-managed copies, not remote-provider or offline-device physical-erasure claims.
    condition: Whenever admitted Cognition Memory work creates, persists, consumes, abandons, recovers, deletes or prunes Runtime-owned execution content.
    failure: Preserve an established deletion fence, or keep only the affected execution copy non-reusable when ordinary consumption or abandonment requires disposal, and return the exact pending or failed cleanup result while a required local owner cannot dispose its payload without blocking unrelated Memory activity. Reject early deletion completion, content hidden in retained metadata, generic TTL used instead of required disposal, stale-effect revival, current-state reconstruction or cleanup of another owner's canonical data.
    relations:
      - type: applies_to
        target: definition.nimi.cognition.memory.lifecycle-plane
      - type: applies_to
        target: definition.nimi.cognition.runtime-bridge.memory-ai-port-plane
      - type: applies_to
        target: definition.nimi.runtime.service-operations.memory-derived-payload
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.scenario-job-retention
    kind: rule
    title: Terminal ScenarioJob retention is bounded per delivery class
    modality: must
    statement: Ordinary terminal ScenarioJobs and action bindings are publicly available for at most 30 minutes from their fixed terminal timestamp, with at most 1024 terminal SYNC or STREAM records and separately 1024 terminal ASYNC_JOB records, oldest first within each class; Get never renews retention. Exact retained-media recovery remains a separate owner policy and does not extend other Jobs merely because they carry an action identity. Nonterminal count and captured-byte admission rejects new work before external creation rather than evicting unresolved work or inventing a timeout. A canceled Job may retain exact custody within its fixed public window solely for authorized bounded stop verification; confirmed stop or definite non-dispatch permits earlier custody release once active-use has exited. Nonterminal receipt and exact sealed custody remain Job-owned across finite work exits; complete staged required bodies remain Job-owned until complete result publication or a definitive end of their purpose, with no repeat download solely because a Get ended. Public expiry or count eviction denies new observations even if finite work still holds a private active-use reference. The existing writer retains only the required private owner, dispatch, late-receipt and cleanup association until that already admitted bounded work exits, never revives the Job, reopens publication, or extends public availability. Before deleting custody or body references it durably records cleanup obligations; failed cleanup remains private and retryable, not reported as completed. Expired captured content is removed from all store copies within one minute while running or before startup serves requests except content required by independently authorized in-flight use or pending Memory-derived payload disposal.
    condition: Whenever Runtime creates, transitions, prunes, persists, or reloads terminal ScenarioJob records.
    failure: Reject cross-class eviction, eviction of unresolved work, new Get after fixed public expiry, custody destruction before active-use exit, lost late-receipt ownership, revived or published canceled work, or cleanup failure reported as successful removal.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.scenario-job-isolation-evidence
    kind: rule
    title: Isolated ScenarioJob evidence is minimal and expires
    modality: must
    statement: When restart validation isolates ScenarioJob store rows, Runtime copies only the isolated rows into quarantine evidence and keeps healthy sibling rows only in the live store, while a store document that cannot be read as a whole is preserved whole. Every quarantine copy expires 30 minutes after its isolation, the same period as terminal ScenarioJob retention, and Runtime deletes expired copies and interrupted temporary store writes at startup and within one minute while it runs; authorized Memory-derived payload disposal still scrubs matching copies before expiry.
    condition: Whenever Runtime isolates ScenarioJob durable state, sweeps its quarantine, or disposes Memory-derived payload.
    failure: Reject copying healthy rows into quarantine, keeping a quarantine copy or interrupted temporary write past its expiry, or serving isolated rows as Jobs; a failed deletion stays pending and is retried.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.memory-derived-payload
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.scenario-job-incremental-persistence
    kind: rule
    title: ScenarioJob persistence follows the changed Job
    modality: must
    statement: Each ScenarioJob store mutation validates and durably appends only the Jobs, idempotency bindings, and credential-custody obligations it changed as one atomic record before its result is published, so per-mutation persistence cost follows the changed Job rather than the retained set. Runtime rewrites the store from live state when appended history outgrows the live state, when removed captured inputs must leave durable storage, and at startup. Reload applies appended records in order and may discard an unterminated final append under the append acknowledgement contract. A terminated unreadable mutation or other inconsistent content is corruption and is isolated rather than silently rolling back acknowledged dispatch, cancellation or terminal facts. Lost or uninspectable state never proves non-dispatch or absence of an action owner.
    condition: Whenever Runtime persists, rewrites, or reloads the ScenarioJob store.
    failure: Reject publication before the append is durable, per-mutation revalidation or rewrite of unchanged Jobs outside a store rewrite, a partially applied multi-row mutation, or silent acceptance of corrupt acknowledged state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.scenario-job-observation
    kind: rule
    title: Job observation projects only common execution facts
    modality: must
    statement: The public Job submission_outcome enum is UNSPECIFIED, NOT_DISPATCHED, UNKNOWN, ACCEPTED or REJECTED, and stop_outcome is UNSPECIFIED, NOT_DISPATCHED, CONFIRMED or UNCONFIRMED, representing common facts without protocol phases. For new ASYNC_JOB records the closed status and submission combinations are SUBMITTED or QUEUED with NOT_DISPATCHED, RUNNING with UNKNOWN or ACCEPTED, COMPLETED with ACCEPTED, FAILED with NOT_DISPATCHED, UNKNOWN, ACCEPTED or REJECTED, TIMEOUT with NOT_DISPATCHED, UNKNOWN or ACCEPTED only with actual Host resource termination or proved provider-task expiration, and CANCELED with NOT_DISPATCHED, UNKNOWN, ACCEPTED or REJECTED. Every new non-CANCELED ASYNC_JOB record has absent or UNSPECIFIED stop, meaning not applicable. New CANCELED with NOT_DISPATCHED has stop NOT_DISPATCHED; with UNKNOWN it has stop UNCONFIRMED; with ACCEPTED it has stop CONFIRMED only on real stop proof and otherwise UNCONFIRMED; with REJECTED it has stop CONFIRMED only when the rejection proves no execution can remain, otherwise UNCONFIRMED. Confirmed provider-task cancellation requires CANCELED, ACCEPTED, CONFIRMED and AI_PROVIDER_TASK_CANCELED; proved provider-task expiration requires TIMEOUT, ACCEPTED, absent stop and AI_PROVIDER_TASK_EXPIRED. A real non-resumable RS resource timeout with unknown external effect requires TIMEOUT, UNKNOWN, absent stop and AI_EXECUTION_RESOURCE_LIMIT_EXCEEDED and never implies stopped billing or safe retry. A restart proven before dispatch requires FAILED, NOT_DISPATCHED, absent stop, AI_EXECUTION_INTERRUPTED and CALLER_MAY_RESUBMIT; interrupted possible dispatch with unknown external effect uses FAILED, UNKNOWN and OUTCOME_UNCERTAIN. Historical missing submission facts remain unknown for any status, and missing historical CANCELED stop facts remain unknown rather than proof of stop; no missing value permits replay. A Get observation_issue contains only typed reason and observation timestamp outside the Job, never changes execution terminal status or labels stale facts fresh, and may accompany the last trusted snapshot only after current basic caller and owner admission; denied basic admission returns a non-disclosing error with no snapshot or provider IO. Full terminal Get fields and formal result readers remain intact; illegal combinations and unknown integer enum values fail closed.
    condition: Whenever Job outcomes or observation responses are projected through Runtime, protected native, SDK or Kit carriers.
    failure: Reject public private-protocol facts, a stale snapshot labeled fresh, unconfirmed stop labeled confirmed, lost response-level typed results or inferred safe retry.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.scenario-job-execution-scope
    kind: rule
    title: Finite Job execution is independent of observation and guarded by current authority
    modality: must
    statement: Each admitted Local or remote synchronous execution and each Get-triggered finite reconciliation has a Runtime-owned work permit for the exact account, Registered App Subject, registration and declaration generations, admitted capability and policy, frozen target and boot. RPC completion, observation detach, technical session rotation or ordinary transport loss ends observation and old-session ingress, not admitted finite work. True account, registration, App access or policy withdrawal invalidates the permit and fences new outbound actions and unauthorized publication; SessionInvalidated alone is not that withdrawal and detached context alone is not authority. Connector admission is independently linearized per r041, so a Connector mutation first blocks a new BeginOutbound but does not revoke an IO that already won its guard. One Job writer grants one versioned finite claim and pins inputs, custody and candidates while doing no provider or body-transfer IO under its mutex; receipt persists before recovery is promised, and commit rechecks true authority, claim and publication gate with the complete validated result. Expired lease cancels its work and awaits actual Host exit before a replacement claim. A work exit releases only work-local slot, ephemeral credential and borrowed use references; it never releases the nonterminal Job-owned original receipt or sealed custody needed for later Get, nor complete staged bodies still needed for the multi-output result. Such Job-owned resources survive successive create, pending queries and body acquisitions until their purpose ends through complete publication, definitive failure, confirmed cancellation or authorized disposal; canceled uncertain-stop custody has its fixed public retention window. Public eviction denies new Get without destroying already admitted active-use or late-receipt ownership; no late fact revives or publishes the Job. Physical deletion follows durable cleanup obligation and actual last-use exit, without public retention extension. No permanent native pending poller or inference slot exists, and without a new Get no later native polling round starts after finite work exits.
    condition: Whenever Runtime starts, reconciles, cancels, commits, revokes or releases an admitted Job work instance.
    failure: Reject RPC-linked cancellation of admitted work, stale or durable App permission, unsafe parallel claims, missing current authority checks, late unauthorized result publication or early reference release.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.scenario-job-admission
    kind: rule
    title: Job storage capacity belongs to the existing Job writer
    modality: must
    statement: The existing ScenarioJob writer bounds new task admission, current serialized records and owner and machine resource use, while scheduler and ExecutionHost owners bound concurrency, queues, input and output sizes, finite work and actual process exit. Necessary Job identity, complete captured inputs and dispatch intent are saved before a new generation or creation may start; inability to save that state rejects the action before dispatch. Admission does not promise all future result metadata, a whole-row fallback, a complete required-body set or future control writes through physical prepayment, and does not require producers to write a common extent or file protocol. New-task count limits do not consume another task slot for an existing Job query, Cancel or release; those operations remain subject to bounded control writes and actual storage availability and may fail explicitly without evicting unresolved work or creating another control ledger. Ordinary bounded staging, native file outputs and temporary-file replacement are permitted under their existing owners, path validation, input and output contracts, supervised process limits and confirmed last-use cleanup. A physical copy is a separate resource; a borrowed immutable source is not another body, and partial or complete candidates stay private until the complete validated result wins publication. Existing result owners retain only the intermediate association and integrity facts needed for their supported acquisition, multi-body or external-resource workflows, and reuse still-available original material after a transient error without generating again. Journal history, replacement writes and cleanup backlog remain bounded by the existing writer, without a guarantee that future writes always have reserved space. Exact retained-media reservations, limits and lifetimes remain independent policy constraints and are not generalized to all Jobs or removed with the universal prepayment mechanism. Logical capacity or storage failures return accurate operation errors; owner-authorized local Cancel does not require an enabled Connector, true authority withdrawal still fences execution and publication, and no action identity, candidate or failed cleanup grants replay or renewable public availability.
    condition: Whenever a ScenarioJob is admitted, controlled, publishes results or releases resources.
    failure: Reject new generation without saved necessary identity and dispatch intent, unbounded record or resource growth, new-task limits used to deny all existing-Job control, pseudo-terminal success after a failed write, premature result publication, lost cleanup ownership or broadened retention guarantees.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
