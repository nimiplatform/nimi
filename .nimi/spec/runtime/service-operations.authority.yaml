format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.service-operations
units:
  - id: definition.nimi.runtime.service-operations.local-service-plane
    kind: definition
    title: Runtime local service operations plane
    meaning: The Runtime local service operations plane owns concrete LocalAsset inventory, integrity, installation, transfer, dependency Jobs, storage reconciliation, and Runtime-private ExecutionHost and supervised-process operations without owning AIConfig route, Machine Local AI Configuration selection, Local Capability Configuration binding, public capability readiness, probe, warm, residency, or fallback truth.
  - id: definition.nimi.runtime.service-operations.artifact-plane
    kind: definition
    title: Runtime artifact operations plane
    meaning: The Runtime artifact operations plane owns opaque artifact identity, immutable bytes and metadata, durable audience, authorized inline retrieval, generated voice retention, and bounded cleanup.
  - id: definition.nimi.runtime.service-operations.scenario-job-plane
    kind: definition
    title: Runtime scenario job operations plane
    meaning: The Runtime scenario job operations plane owns asynchronous Job creation, immutable effective-input snapshots, execution state, progress, events, cancellation, artifacts, and terminal failure projection; it persists grant and custody references but never raw credentials, and current configuration changes never rewrite a Job.
  - id: definition.nimi.runtime.service-operations.scenario-registry
    kind: definition
    title: Runtime scenario registry
    meaning: The Runtime scenario registry is the closed discriminator, canonical modality, execution-mode, and profile-field contract for Runtime AI scenarios.
  - id: definition.nimi.runtime.service-operations.lifecycle-registry
    kind: definition
    title: Runtime service lifecycle registry
    meaning: The Runtime service lifecycle registry is the closed state and transition contract for connector custody and authorization, remote deletion, Jobs, transfers, and explicitly Runtime-private ExecutionHost or supervised-process state; verified LocalAsset content, machine selection, derived admission, Job execution, and process residency remain orthogonal and no public local-model readiness lifecycle exists.
  - id: definition.nimi.runtime.service-operations.daemon-plane
    kind: definition
    title: Runtime daemon operations plane
    meaning: The Runtime daemon operations plane owns protected process state, health, listener admission, request processing, scheduling, timeouts, configuration, shutdown, restart invalidation, and operational health projection while owner-specific retry or idempotency remains with the exact operation owner.
  - id: definition.nimi.runtime.service-operations.cli-plane
    kind: definition
    title: Runtime CLI operations plane
    meaning: The Runtime CLI operations plane owns bounded Runtime service operations, LocalAsset inventory, import and transfer, Connector custody projection, explicit diagnostics, and foreground or background process control while excluding app-author tooling and all high-level generation, AIConfig ownership, route or target selection, Machine Local AI Configuration selection, default provider or model, and fallback authority.
  - id: rule.nimi.runtime.service-operations.r001
    kind: rule
    title: RuntimeLocalService is the sole local control plane
    modality: must
    statement: RuntimeLocalService is the only stable RPC owner for LocalAsset inventory and integrity, audit, import, install, download, orphan adoption, scaffolding, transfer, dependency Jobs, Runtime-private ExecutionHost operations, Product Control operations, and storage cutover, while canonical Machine Local AI Configuration actions remain separately owned and Desktop, SDK, Apps, and hosts maintain no second writable asset, configuration, selection, process, or Job truth.
    condition: Whenever a local Runtime resource is listed, observed, materialized, controlled, or reconciled.
    failure: Reject any operation or projection that creates a second local control plane or writable local-model truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r002
    kind: rule
    title: Local listing and explicit integrity diagnostics remain separate
    modality: must
    statement: ListLocalAssets returns only concrete verified-content inventory and performs no endpoint probe, bootstrap, warm, recovery, binding, selection, admission, or status normalization; an explicit user-requested LocalAsset diagnostic may verify content and installation only and never probes an engine or changes configuration, selection, routing, admission, or Job truth.
    condition: Whenever LocalAssets are listed or explicitly diagnosed.
    failure: Fail the diagnostic closed and reject list-driven probing, warming, recovery, selection, routing, or status mutation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r003
    kind: rule
    title: ExecutionHost start warm and health stay Runtime private
    modality: must
    statement: Runtime-private ExecutionHost supervision may start, warm, pool, lease, monitor, recover, or stop a concrete process as an implementation detail, including on demand for an exact Job, but never exposes a public Start or Warm LocalAsset action, persists capability readiness, changes AIConfig or machine selection, clears a binding, or lets Desktop, SDK, or App polling drive process state; ordinary preparation or execution failure ends only the Job unless the Driver classifies a persistent hard blocker.
    condition: Whenever local process preparation, residency, or health supervision runs.
    failure: Keep Host state private, return the typed Job or hard-blocker result, and reject consumer-owned lifecycle truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r004
    kind: rule
    title: Local catalog intake dependency and audit families stay Runtime owned
    modality: must
    statement: RuntimeLocalService owns verified catalog reads, non-binding install recommendation, unregistered asset scan and adoption, bundle intake, transfers, LocalAsset inventory, private services and nodes, selected-source dependency evidence, environment dependency Jobs, and local audit operations; Profile application, binding resolution, Machine Local AI Configuration selection, capability admission, and routing are absent from this control plane.
    condition: Whenever a Tier 2 or Tier 3 local operation executes.
    failure: Reject a consumer-side substitute or a result not derived from Runtime-owned records.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r005
    kind: rule
    title: Managed engine lifecycle has one truth
    modality: must
    statement: RuntimeLocalService owns Runtime-private managed ExecutionHost process lifecycle and supervision evidence, which is not Local Capability Configuration identity, machine selection, derived admission, or product readiness, and Desktop, SDK, and Apps do not maintain or project a second process truth.
    condition: Whenever a managed local engine is started, stopped, observed, or projected.
    failure: Reject any engine operation based on consumer-owned process truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r006
    kind: rule
    title: Product control remains a Runtime state machine
    modality: must
    statement: RuntimeLocalService owns validation, reconciliation, data-root materialization, and the canonical login, config, data-root, repair, blocked, and ready_for_use Product Control facts; AIConfig, Profile, LocalAsset installation, device scan, Machine Local AI Configuration, local or Cloud admission, connector diagnostics, and ExecutionHost state are never Product Control readiness inputs, while the Home host provides only the canonical record bridge and bounded OS helpers.
    condition: Whenever ordinary first-run setup reads, reconciles, or mutates product control.
    failure: Reject a Desktop, SDK, app, or host write that bypasses the Runtime Product Control state machine, every alternate record, and every protected-state selection or override of dataRoot.path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r007
    kind: rule
    title: First-run reconciliation derives state on protected transport
    modality: must
    statement: Production first-run reconciliation runs only through the protected Home Host Contract; Runtime authenticates the current host context, evaluates only canonical Product Control prerequisites, records relevant Product Control failures, and atomically commits ready_for_use only from that closure while AI setup and execution admission remain independent and non-blocking; every unsupported or unauthorized protected operation fails closed.
    condition: Whenever production first-run or product-control reconciliation is invoked.
    failure: Fail closed on consumer-supplied state or reason, an unverified host context, an invalid current session, portable credentials, renderer-supplied authority, or an unsupported protected operation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r008
    kind: rule
    title: Accelerator dependencies require Runtime resolution and confirmation
    modality: must
    statement: Runtime resolves shared accelerator installation dependencies from the exact requested Runtime-private ExecutionHost or explicit install action and returns needs_confirmation before first network materialization, starting install or repair only after explicit user confirmation; completion never creates a Local Capability Configuration, binding, machine selection, capability admission, or readiness fact.
    condition: Whenever a supervised local engine requires a managed accelerator dependency.
    failure: Reject Desktop probing, implicit consent, or dependency materialization before confirmation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r009
    kind: rule
    title: Dependency Jobs have closed state and private phase semantics
    modality: must
    statement: A Runtime dependency Job uses QUEUED, RUNNING, COMPLETED, FAILED, or CANCELED plus private downloading, verifying, or installing detail, records typed install and repair outcomes and Runtime-private selected-source evidence, requires no Desktop, SDK, App, or visible-terminal installer, and deduplicates setup per dependency and environment; its completion, source, and phase never become public capability health, readiness, binding, selection, or routing truth.
    condition: Whenever a managed dependency setup, repair, status, or duplicate request is processed.
    failure: Reject unknown public job states, consumer-executed installation, duplicate active jobs, or independently re-resolved source records.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r010
    kind: rule
    title: Dependency job control targets only Runtime identities
    modality: must
    statement: StartLocalEnvironmentDependencyJob, CancelLocalEnvironmentDependencyJob, RetryLocalEnvironmentDependencyJob, and RepairLocalEnvironmentDependency target Runtime dependency environments and Runtime job ids, while transfer detail remains diagnostic and cannot replace selected source record or dependency job truth.
    condition: Whenever a dependency job is started, canceled, retried, repaired, or projected.
    failure: Reject Desktop rows, engine installers, shell scripts, transfer ids, or progress detail as the dependency authority target.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r011
    kind: rule
    title: Dependency plans require concrete asset identities
    modality: must
    statement: ResolveLocalEnvironmentPlan and ResolveLocalEnvironmentActivationGate use asset_id or local_asset_id for a primary model payload, companion_asset_id for a companion payload, and parent_asset_id for a caller-known parent binding in model.asset and model.companion-asset families.
    condition: Whenever local environment planning or activation resolves model payloads.
    failure: Fail closed on a missing required identity or a pack placeholder such as a model-asset or companion-asset name instead of promoting it to a selected source record.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r012
    kind: rule
    title: Local state storage roles are disjoint
    modality: must
    statement: Runtime keeps one protected local AI state for assets, transfers, dependency assets, setup jobs, cutover evidence, and health projection; its data-root reference and managed roots derive only from the canonical product-control selection, Runtime configuration records validation evidence but cannot reconcile to a different root, and the Nimi data directory is storage rather than private Runtime state truth.
    condition: Whenever Runtime or a host resolves local AI storage.
    failure: Reject a second Product Control or state file, a non-derived root, a retired-state fallback, a silent dual read or write, payload existence treated as state truth, and canonical-to-protected disagreement without explicit repair.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r013
    kind: rule
    title: Data-root changes require an explicit reconciliation plan
    modality: must
    statement: A user-requested Nimi data-directory change through the normal Product Control UI and protected owner operation produces a Runtime reconciliation plan covering effective protected state, the canonical selection, derived references and managed roots, detected retired inputs, affected assets, conflicts, and required user confirmation before local AI state is assumed usable; disagreement caused only by damaged or stale protected derived state enters repair and never changes the canonical selection.
    condition: Whenever an admitted Product Control operation changes the Nimi data directory or Runtime derived storage state disagrees with the canonical product-control record.
    failure: Keep materialization unavailable until the complete plan or repair succeeds, preserve canonical dataRoot.path as the only selection authority, and reject protected-state override, fallback, or another path prompt.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r014
    kind: rule
    title: Local state cutover is explicit idempotent and fail closed
    modality: must
    statement: Retired Desktop state is only an explicit cutover input and cutover is idempotent; not_required means Runtime state and roots agree, required_confirmation means a retired input or path mismatch awaits consent, planned means an accepted plan has not started, running means validation, copy, or rewrite is active, succeeded means cutover completed and retired input left active use, failed means active truth stayed unchanged with cutover_failed or repair_required detail, and cancelled means user cancellation occurred before mutation.
    condition: Whenever Runtime detects or executes a local-state path cutover.
    failure: Reject live fallback, secondary reads, dual writes, state mutation after failure, or an undeclared cutover state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r015
    kind: rule
    title: Verified content selection admission and Host preparation are orthogonal
    modality: must
    statement: A Runtime LocalAsset record proves concrete verified content only, an explicit Machine Local AI Configuration relation selects one saved Local Capability Configuration only when it is interpretable and configured, derived admission evaluates the exact selected configuration for a request, and Runtime-private ExecutionHost preparation may occur after Job submission; installed content never implies selection or admission, selection never triggers probe or prewarm, and Host failure never clears binding or automatically reselects.
    condition: Whenever local installation, dependency readiness, selection, or first execution is projected.
    failure: Reject filesystem-only readiness, fabricated installation, or a requirement for Desktop-maintained lifecycle truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.local-service-plane
  - id: rule.nimi.runtime.service-operations.r016
    kind: rule
    title: Generic artifact bytes have one authorized read surface
    modality: must
    statement: RuntimeArtifactService exposes ReadArtifactBytes for full bytes by artifact_id only when the current protected caller matches the durable artifact audience, independently of getScenarioArtifacts job projection and the voice asset library.
    condition: Whenever an event consumer retrieves a Runtime artifact by id.
    failure: Reject the read when protected caller or durable audience does not match and never substitute a job or voice-library projection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r017
    kind: rule
    title: Artifact identity is opaque stable flat and non-authorizing
    modality: must
    statement: artifact_id is a Runtime-owned opaque string stable for the artifact lifetime, flat without a required job or scenario prefix, unique only within one Runtime instance, and scoped by consumers to their authoritative Runtime client; possession, guessing, observation, replay, or cross-app use grants no authority.
    condition: Whenever an artifact id is emitted, stored, compared, or presented for retrieval.
    failure: Reject format inference, cross-Runtime lookup, hierarchical authority, or id possession as authorization proof.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r018
    kind: rule
    title: Runtime owns artifact creation reference and idempotent reads
    modality: must
    statement: A TTS provider, scenario job, realtime session, local voice engine, cache, streaming TTS path, or user upload creates an artifact when bytes materialize, events reference its id, and repeated reads return identical bytes while the artifact remains stored.
    condition: Whenever Runtime materializes, emits, or rereads an artifact.
    failure: Reject a reference to unmaterialized bytes or a reread that changes content for the same id.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r019
    kind: rule
    title: Referenced artifacts exist before emit and generated voice is durable
    modality: must
    statement: Store.Put of artifact id, bytes, and MIME completes before an event references the id, and generated agent voice artifacts remain on the user's local disk until explicit cleanup or a later admitted quota policy while other TTL, garbage collection, and quota choices remain Runtime implementation details.
    condition: Whenever Runtime emits an artifact reference or applies artifact retention.
    failure: Abort the reference and record a fatal emitter violation when storage did not complete, and reject implicit deletion of durable generated voice.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r020
    kind: rule
    title: Externally readable artifacts have complete durable audience metadata
    modality: must
    statement: Every artifact made readable through a separately admitted non-Third-party surface binds only the owner-defined audience, producer, current account context where applicable, allowed use, observed size, content integrity, and expiry needed by that surface; the canonical Third-party App operation contract currently admits no generic artifact read, write, audience, attachment, media, Host-digest, payload-digest, or artifact-inventory operation.
    condition: Whenever an artifact record is proposed for external readability.
    failure: Keep the record internal and deny Third-party App retrieval or any separately admitted retrieval whose required owner audience is absent.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r021
    kind: rule
    title: Artifact content MIME integrity and audience are immutable
    modality: must
    statement: After artifact id creation its bytes, MIME, observed size, content hash, and audience never change, except that the generated-voice producer may atomically enrich otherwise identical absent metadata to complete GeneratedVoiceArtifactMetadata before the referencing event without replacing content or audience.
    condition: Whenever Runtime updates or reads an existing artifact record.
    failure: Reject mutation, external access to an unbound historical record, or enrichment after the referencing event.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r022
    kind: rule
    title: Playable voice artifact ids resolve only to audio
    modality: must
    statement: A nonterminal voice_playback_requested audio_artifact_id resolves through ReadArtifactBytes to bytes whose MIME starts with audio/, while terminal failed, interrupted, or canceled events may omit playable audio only when they carry a reason.
    condition: Whenever Runtime emits a voice playback request or a consumer resolves its audio artifact.
    failure: Reject non-audio bytes, a missing playable artifact on a playback request, or a terminal omission without reason.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r023
    kind: rule
    title: Audio identity cannot be overwritten by metadata or fallback
    modality: must_not
    statement: Runtime stores lipsync, timing, debug, or synthetic placeholder content under a playable audio artifact id, overwrites provider audio identity with generated lipsync identity, or emits a playable voice request or pseudo-audio artifact for text-only fallback or unavailable TTS.
    condition: Whenever audio, lipsync, timing, debug, or fallback artifacts are emitted.
    failure: Keep separate artifact ids with their own MIME types or return the typed unavailable or fallback result without a playable voice request.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r024
    kind: rule
    title: Generated voice metadata and cleanup are bounded
    modality: must
    statement: A generated assistant voice artifact preserves Runtime-issued LocalAgent, Conversation, turn, message, voice, route, media, integrity, creation, and retention relations, and scoped cleanup removes matching durable audio and voice metadata without mutating committed text or Conversation history.
    condition: Whenever generated assistant voice is stored or cleaned up.
    failure: Reject storage with incomplete metadata and reject cleanup that changes text or conversation history.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r025
    kind: rule
    title: ReadArtifactBytes wire shape is fixed
    modality: must
    statement: ReadArtifactBytesRequest requires artifact_id, and ReadArtifactBytesResponse requires full bytes, RFC 6838 mime_type, and int64 size_bytes plus optional mime_inferred defaulting false; Runtime uses application/octet-stream and mime_inferred true only when upstream MIME is absent.
    condition: Whenever Runtime accepts or returns ReadArtifactBytes.
    failure: Return ARTIFACT_INVALID_INPUT or reject the response when a required field, complete body, valid MIME, size, or inference marker is missing.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r026
    kind: rule
    title: Generated voice cleanup stays bounded
    modality: must
    statement: Generated voice cleanup requires an explicit Runtime-issued LocalAgent or Conversation scope, is idempotent when no artifact matches, and deletes only matching generated voice retention records rather than scenario media, uploads, text, or Conversation history.
    condition: Whenever generated voice cleanup runs.
    failure: Reject an empty scope or any deletion outside the matching generated voice retention class.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r027
    kind: rule
    title: Artifact reason codes and meanings are closed
    modality: must
    statement: Artifact failures use ARTIFACT_INVALID_INPUT value 600 for request validation, ARTIFACT_NOT_FOUND value 601 for absent, collected, never-created, or cross-Runtime ids, ARTIFACT_TOO_LARGE value 602 above the inline limit, ARTIFACT_FORBIDDEN value 603 for absent, revoked, expired, or mismatched protected caller or audience, and ARTIFACT_MIME_MISMATCH value 604 only for an SDK expected-MIME-prefix mismatch.
    condition: Whenever Runtime or SDK classifies an artifact read or validation failure.
    failure: Reject an unknown value, changed meaning, or server emission of the SDK-only MIME mismatch reason.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r028
    kind: rule
    title: Artifact failures use structured carriers
    modality: must
    statement: Runtime artifact handlers carry ARTIFACT reasons in ErrorInfo through grpcerr.WithReasonCode rather than status-message text, and the SDK raises ARTIFACT_MIME_MISMATCH after a case-insensitive expected_mime_prefix check on the received MIME.
    condition: Whenever an artifact handler or SDK expected-MIME check fails.
    failure: Reject free-text-only classification, an absent stable reason, or server-side MIME mismatch classification.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r029
    kind: rule
    title: Inline artifact retrieval has a hard size ceiling
    modality: must
    statement: Artifact reads return a complete body only within the owner-defined bounded-read policy, reject larger stored artifacts without truncation, and keep generic chunked artifact retrieval unavailable until separately admitted.
    condition: Whenever Runtime evaluates an artifact for inline retrieval.
    failure: Return ARTIFACT_TOO_LARGE rather than truncate, stream, or partially succeed.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r030
    kind: rule
    title: Consumers cannot assume artifact read caching
    modality: must_not
    statement: A consumer assumes repeated ReadArtifactBytes calls are cheap or required to be cached by Runtime.
    condition: Whenever a consumer handles voice_playback_requested or another event artifact.
    failure: Read once, decode or consume the bytes, drop the local reference when done, and reread only after that local buffer is discarded.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r031
    kind: rule
    title: Artifact reads revalidate live caller and durable audience
    modality: must
    statement: Before an artifact lookup on a separately admitted non-Third-party surface Runtime revalidates the current caller and owner-defined durable audience, allowed use, and expiry; the canonical Third-party App operation contract maps no artifact read operation, and unbound history, direct local gRPC, wrong audience, expired records, and guessed ids fail closed.
    condition: Whenever ReadArtifactBytes authorizes a read.
    failure: Return ARTIFACT_FORBIDDEN without exposing whether the id exists or which audience field mismatched.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r032
    kind: rule
    lifecycle: removed
    title: Retired Third-party App artifact permission and selector
    reason: Removed because generic artifact reads are absent from the canonical Third-party App operation contract and no permission, selector, or hidden compatibility path remains.
  - id: rule.nimi.runtime.service-operations.r033
    kind: rule
    title: Artifact retrieval is a hard cut with distinct typed surfaces
    modality: must
    statement: Pre-audience artifacts inherit no readability from id, local-user ownership, or historical anonymous behavior, while getScenarioArtifacts and getVoiceAsset retain only their separate job-result and voice-library contracts.
    condition: Whenever an existing artifact or typed media surface is evaluated for retrieval.
    failure: Deny legacy readability and reject substitution among generic artifact, scenario artifact, and voice asset surfaces.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r034
    kind: rule
    title: Artifact storage and SDK projection preserve integrity
    modality: must
    statement: Externally readable records persist observed size, SHA-256, and complete audience, disk reads recheck size and hash, emitters store before emit, handlers use structured reasons, and the SDK exposes the class-member Runtime.artifacts.readBytes rather than a singleton export.
    condition: Whenever artifact bytes cross storage, event, handler, or SDK boundaries.
    failure: Fail closed on integrity mismatch, incomplete audience, emit-before-store, unstructured failure, or an alternate SDK surface.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r035
    kind: rule
    title: Unadmitted generic artifact operations remain unavailable
    modality: must_not
    statement: Runtime exposes cross-device or cross-account artifact sharing, delegated audiences, generic chunked retrieval, generic describeArtifact metadata, generic by-tag or by-source discovery, upload-by-id replacement semantics, or artifact behavior that deprecates lipsync_frame_batch without separate authority.
    condition: Whenever the generic artifact API is extended.
    failure: Reject the operation until a future canonical authority explicitly admits it.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.artifact-plane
  - id: rule.nimi.runtime.service-operations.r036
    kind: rule
    title: Scenario job methods and metadata path are fixed
    modality: must
    statement: SubmitScenarioJob creates a Job with exact effective inputs, GetScenarioJob queries stored metadata, CancelScenarioJob controls it, SubscribeScenarioJobEvents observes it, and GetScenarioArtifacts returns its results; every query and control operation uses the immutable Job record rather than current AIConfig, Machine Local AI Configuration, Local Capability Configuration, ConnectorGrant, custody, inventory, or process state.
    condition: Whenever a ScenarioJob is submitted, queried, canceled, subscribed, or read for artifacts.
    failure: Reject an undeclared method role or a query or control path that depends on current connector state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.r037
    kind: rule
    title: Scenario job states and terminal semantics are closed
    modality: must
    statement: ScenarioJob starts at SUBMITTED awaiting scheduling, QUEUED awaits execution resources, RUNNING executes, COMPLETED is terminal success, FAILED is terminal failure, CANCELED is terminal cancellation, and TIMEOUT is terminal timeout; these seven states are exact, remain orthogonal to configuration, binding, selection and derived admission, never write back to them, and the event stream may close normally only after a terminal state.
    condition: Whenever Runtime creates, transitions, persists, emits, or returns a ScenarioJob.
    failure: Reject an unknown state, wrong terminal flag, non-SUBMITTED initial state, or normal close before terminal.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.lifecycle-registry
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.r038
    kind: rule
    title: Scenario job transition graph is closed
    modality: must
    statement: ScenarioJob transitions are exactly SUBMITTED to QUEUED on queue acceptance, RUNNING when the exact CapabilityImplementationDriver and ExecutionHost begin execution, FAILED on a pre-run terminal error, CANCELED on user cancel, or TIMEOUT on timeout; QUEUED to RUNNING on exact execution start, FAILED on pre-run terminal error, CANCELED on user cancel, or TIMEOUT on timeout; and RUNNING to COMPLETED on success, FAILED on Driver, ExecutionHost, provider, or Runtime failure, CANCELED on user cancel, or TIMEOUT on timeout, with no terminal-state exit, route fallback, configuration mutation, binding clear, or readiness update.
    condition: Whenever a ScenarioJob status changes.
    failure: Reject the transition and preserve the last valid status.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.lifecycle-registry
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.r040
    kind: rule
    title: Scenario jobs capture exact secret-free effective inputs
    modality: must
    statement: SubmitScenarioJob captures for Local the AIConfig Local route, required features and defaults, current selected Local Capability Configuration, exact CapabilityImplementation, Driver configuration, exact bindings and request, or for Cloud the exact CapabilityImplementation, Driver-owned provider-model target, ConnectorGrant identity, defaults and request; raw credentials and bearer material are never persisted, minimum secret material is obtained from custody only in ephemeral execution context and zeroed after use, and later configuration changes never rewrite the snapshot.
    condition: Whenever a ScenarioJob is created, accessed, or reaches terminal state.
    failure: Reject creation without complete effective inputs and reject persisted raw secret material or current-state reconstruction.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.r041
    kind: rule
    title: Grant or custody deletion cannot orphan submitted jobs
    modality: must
    statement: Deleting or revoking a ConnectorGrant or its custody record affects future submissions but never erases or rewrites submitted-Job metadata, observability, cancellation, completed results, or artifacts; a running remote Job fails only when the actual execution is rejected for authorization, and artifact access follows its own recorded audience rather than a current connector or grant lookup.
    condition: Whenever a ConnectorGrant or custody record changes while a Job remains observable or executing.
    failure: Preserve metadata-based Job control and return an actual typed authorization failure rather than reconstructing state from current custody.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.r042
    kind: rule
    title: Terminal job failures have stable and structured layers
    modality: must
    statement: A terminal failed ScenarioJob carries stable short reason_code and reason_detail for polling and lists plus safe machine-readable reason_metadata for SDK, Desktop, and App error projection, and this execution fact never becomes persisted capability readiness, selection, binding, or configuration state.
    condition: Whenever a ScenarioJob reaches a failed terminal outcome.
    failure: Reject free-text-only failure or a failed terminal snapshot missing either stable summary or safe structured detail.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.r043
    kind: rule
    title: Job reason metadata is safe state-consistent and nonsticky
    modality: must
    statement: reason_metadata contains only transport-safe machine-readable values, never credentials, headers, tokens, raw sensitive provider payload, LocalAsset paths, or private process proof, may include an approved provider, Driver, or ExecutionHost message for the exact failure, is absent from CANCELED and COMPLETED, and appears consistently in SubscribeScenarioJobEvents and GetScenarioJob snapshots.
    condition: Whenever Runtime stores or projects ScenarioJob failure metadata.
    failure: Remove unsafe or stale metadata and fail the projection when query and event snapshots disagree.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.r044
    kind: rule
    title: Scenario job progress uses bounded factual fields
    modality: must
    statement: ScenarioJob progress uses progress_percent from 0 through 100 and, when a backend provides discrete progress, progress_current_step with progress_total_steps, all as snapshot fields without adding a ScenarioJob status.
    condition: Whenever a backend supplies trustworthy running-job progress.
    failure: Reject an out-of-range value, incomplete discrete-step pair, or a new lifecycle state used only for progress.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.r045
    kind: rule
    title: Running progress cannot be fabricated or diverge
    modality: must_not
    statement: Runtime or a consumer estimates ScenarioJob progress from elapsed time or UI heuristics, or exposes different current progress through GetScenarioJob and SubscribeScenarioJobEvents.
    condition: Whenever a job remains RUNNING or a backend provides no trustworthy progress.
    failure: Return status with absent or zero progress when unknown, permit repeated RUNNING events, and let consumers replace old snapshots with the latest consistent snapshot.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-job-plane
  - id: rule.nimi.runtime.service-operations.r046
    kind: rule
    title: Scenario discriminators modalities and execution modes are closed
    modality: must
    statement: The scenario registry is exactly TEXT_GENERATE as text with SYNC and STREAM, TEXT_EMBED as embedding with SYNC, IMAGE_GENERATE as image with ASYNC_JOB, VIDEO_GENERATE as video with ASYNC_JOB, SPEECH_SYNTHESIZE as tts with STREAM and ASYNC_JOB, SPEECH_TRANSCRIBE as stt with ASYNC_JOB, VOICE_CLONE and VOICE_DESIGN as voice with ASYNC_JOB, MUSIC_GENERATE as music with ASYNC_JOB, and WORLD_GENERATE as world with ASYNC_JOB.
    condition: Whenever Runtime declares, lists, validates, or dispatches a scenario type.
    failure: Reject an unknown discriminator, mismatched modality, or execution mode outside the exact scenario row.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-registry
  - id: rule.nimi.runtime.service-operations.r047
    kind: rule
    title: Scenario profile fields are fixed
    modality: must
    statement: Every ScenarioProfile requires scenario_type and supported_execution_modes and may include only the optional human-readable description field from the admitted profile-field surface.
    condition: Whenever Runtime returns or consumes a ScenarioProfile.
    failure: Reject a profile missing a required field or containing an undeclared stable profile field.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.scenario-registry
  - id: rule.nimi.runtime.service-operations.r048
    kind: rule
    title: Connector status and deletion transitions are closed
    modality: must
    statement: Connector status transitions only ACTIVE to DISABLED and DISABLED to ACTIVE through UpdateConnector, while remote deletion transitions PRESENT to DELETE_PENDING, permits DELETE_PENDING self-retry or startup rescan, and reaches DELETED only after credential cleanup and registry deletion.
    condition: Whenever a connector status changes or remote connector deletion executes.
    failure: Reject an undeclared transition, direct PRESENT-to-DELETED removal, or DELETED before credential cleanup.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.lifecycle-registry
  - id: rule.nimi.runtime.service-operations.r049
    kind: rule
    title: Local content and execution states remain orthogonal
    modality: must
    statement: LocalAsset verified-content and install state, Local Capability Configuration interpretability and requirement resolution, Machine Local AI Configuration selection, derived admission, Job execution, and Runtime-private ExecutionHost residency or process health are independent facts; no INSTALLED, ACTIVE, UNHEALTHY, LocalWarmState, ready, resident, or warm product lifecycle collapses them, and ordinary load or generation failure changes only the Job unless the Driver classifies a persistent hard blocker.
    condition: Whenever Runtime stores or interprets local content, configuration, selection, admission, Job, or process state.
    failure: Reject a combined readiness lifecycle, process-derived selection, binding deletion, or execution-derived configuration mutation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.lifecycle-registry
  - id: rule.nimi.runtime.service-operations.r050
    kind: rule
    title: Local service lifecycle expresses process truth only
    modality: must
    statement: Runtime may maintain a private supervised ExecutionHost process lifecycle for spawn, handshake, monitoring, restart, stop, and cleanup, but this state is never projected as CapabilityContract readiness, Local Capability Configuration validity, machine selection, binding, derived admission, or a reason to reroute; process failure is recorded only as private supervision evidence and the exact affected Job result unless a Driver declares a persistent hard blocker.
    condition: Whenever Runtime changes or interprets local service lifecycle.
    failure: Reject an undeclared edge or a service state inferred solely from one model's residency.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.lifecycle-registry
  - id: rule.nimi.runtime.service-operations.r051
    kind: rule
    title: Model transfer status transitions are closed
    modality: must
    statement: Model status transitions only INSTALLED to PULLING for update, PULLING to INSTALLED on success or FAILED on error, FAILED to PULLING on retry, and INSTALLED or FAILED to REMOVED on removal.
    condition: Whenever Runtime changes model pull or removal status.
    failure: Reject the transition and preserve the last valid model status.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.lifecycle-registry
  - id: rule.nimi.runtime.service-operations.r052
    kind: rule
    title: Daemon health states and initial state are fixed
    modality: must
    statement: Runtime daemon health is exactly STOPPED value 1, STARTING value 2, READY value 3, DEGRADED value 4, or STOPPING value 5, with initial state STOPPED and READY meaning requests may be accepted while DEGRADED means partial functionality is unavailable.
    condition: Whenever Runtime initializes, changes, or projects daemon health.
    failure: Reject an unknown value, wrong initial state, or false READY projection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r053
    kind: rule
    title: Protected state validation precedes protected listeners
    modality: must
    statement: Before any protected local endpoint accepts traffic, Runtime validates the configuration, custody, and endpoint ownership required by its current admitted topology and invalidates every prior-process exact-launch correlation, process binding, session, Effective App Access Snapshot, Agent handle, and stream; production uses its admitted service boundary while D2 local development uses its per-user non-elevated boundary, with the concrete restart marker and platform primitive remaining implementation and neither topology becoming the other's prerequisite.
    condition: Whenever a production or D2 local-development Runtime process boots.
    failure: Keep protected App access unavailable on invalid required state, endpoint ownership failure, or a missing topology-specific platform primitive without public-TCP, portable-session, or cross-topology fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r054
    kind: rule
    title: Production Runtime starts only from admitted service identity
    modality: must
    statement: A production or deployment Runtime validates its admitted service principal, signed service definition, current platform code identity, and service-owned immutable configuration and custody before opening production protected access, and Desktop production start or restart uses only the typed service-control gateway; these facts are not D2 local-development trust facts or prerequisites.
    condition: Whenever the production or deployment Runtime service starts or restarts.
    failure: Reject production protected access outside the admitted service identity without blocking or upgrading the separately admitted D2 per-user local-development topology.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r055
    kind: rule
    title: Production daemon startup preserves operational truth
    modality: must
    statement: Production or deployment Runtime startup establishes its admitted service topology and endpoint, loads and validates its supported configuration and custody inputs, invalidates prior-process ephemeral access, opens only admitted listeners, starts configured private supervised services, projects matching operational health, and starts admitted resource sampling; daemon status remains process-operational truth and proves no App access, owner operation, or AI capability, and these production mechanics are not D2 requirements.
    condition: Whenever a production or deployment Runtime daemon starts.
    failure: Stop before the dependent stage or mark the daemon operationally DEGRADED where explicitly admitted rather than reorder stages or fabricate service health or capability admission.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r056
    kind: rule
    title: Supervised engine startup failures degrade with evidence
    modality: must
    statement: When supervised mode is enabled Runtime creates the private ExecutionHost manager, starts configured enabled hosts, injects endpoint environment only after the private process handshake, and on startup failure records bounded bootstrap evidence and may mark daemon service operation DEGRADED; it never changes AIConfig, Local Capability Configuration, machine selection, binding, or public capability readiness and never fabricates provider-unhealthy product truth.
    condition: Whenever a configured supervised engine starts during daemon boot.
    failure: Reject a public capability-health projection, configuration mutation, or unaudited process startup failure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r057
    kind: rule
    title: Graceful shutdown has one bounded sequence
    modality: must
    statement: Shutdown changes daemon operational status to STOPPING with matching gRPC health, freezes one daemon-owned deadline, cancels active RPCs and streams, allows a short drain, stops supervised ExecutionHosts and resource sampling, closes HTTP with the configured default ten-second timeout, calls gRPC GracefulStop and then ForceStop at the same deadline, and finally changes status to STOPPED; no provider probe lifecycle exists to stop.
    condition: Whenever Runtime receives shutdown.
    failure: Force bounded process exit at the deadline and never remain indefinitely in STOPPING.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r058
    kind: rule
    title: Forced shutdown is controlled and observable
    modality: must
    statement: If gRPC does not drain naturally but ForceStop completes process exit within the frozen deadline, shutdown is controlled completion with forced=true lifecycle audit and diagnostics rather than silent or fabricated graceful success, and lifecycle interception permits only read-only methods during STOPPING.
    condition: Whenever graceful shutdown reaches its deadline or a request arrives during STOPPING.
    failure: Record the forced path, reject non-read-only work, and fail shutdown if bounded process exit itself does not complete.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r059
    kind: rule
    title: STOPPING preempts active subsystems without fabricated terminals
    modality: must
    statement: STOPPING rejects new Runtime Job work as unavailable, may close established Jobs and long-lived streams with typed cancellation without fabricated completion, terminates private supervised ExecutionHosts within bounded shutdown policy, and invalidates in-memory sessions on process exit without changing committed AIConfig, Local Capability Configurations, machine selection, bindings, or completed Job records.
    condition: Whenever daemon shutdown affects active child state machines.
    failure: Cancel or terminate the child path and reject any fabricated terminal frame, new work, lingering subscription, or engine left beyond its timeout.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r060
    kind: rule
    title: Protected origin is derived before request interpretation
    modality: must
    statement: On protected Third-party App ingress Runtime derives immutable origin before interpreting caller authority fields and binds the connected peer only to Desktop's current exact Host launch and process relation; the proof establishes no binary integrity, mutable-project integrity, OS sandbox, machine identity, complete process attestation, same-user resistance, or long-lived authorization lineage, and public TCP remains explicitly non-protected.
    condition: Whenever a protected Third-party App request enters Runtime.
    failure: Reject transport or role mismatch before parsing authority-bearing request material.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r061
    kind: rule
    title: Protected App request semantics use one order
    modality: must
    statement: Protected Third-party App operations derive the verified exact Host peer, validate the fresh session and Runtime-private snapshot, classify the exact AppOperationId through the canonical contract, enforce the classified Base invariants or AppAccess-domain snapshot coverage, dispatch to the owning service, and project the owner-defined typed result in that semantic order; interceptor count, names, composition, framing, and language-specific registration remain implementation details.
    condition: Whenever Runtime handles a protected Third-party App operation.
    failure: Reject the affected operation before owner execution when an ordered prerequisite is absent and never replace the failure with global Runtime unavailability or a fallback path.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r062
    kind: rule
    title: Interceptor responsibilities remain separated
    modality: must
    statement: Protected-origin consumes only the bounded platform peer and Desktop launch facts, lifecycle and activity tracking do not replace App operation admission, owner authorization remains with the owning service, and credential scrubbing or scanning may remove sensitive material before projection or audit only as defense in depth rather than as identity proof, admission proof, or typed-result correctness proof.
    condition: Whenever Runtime processes a request through the interceptor chain.
    failure: Reject metadata-derived protected origin, duplicated admission authority, scanner-dependent success, and raw credential propagation into App-facing results or audit.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r063
    kind: rule
    title: Protocol metadata values have a hard bound
    modality: must
    statement: Protocol-envelope metadata remains within the owning transport's bounded header and field budgets and rejects oversized metadata before dispatch.
    condition: Whenever the protocol interceptor parses envelope metadata.
    failure: Return PROTOCOL_ENVELOPE_INVALID before handler execution for any oversized field.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r064
    kind: rule
    title: Protected App admission precedes owner idempotency
    modality: must
    statement: Every protected Third-party App operation revalidates the current exact Host peer, fresh session, Runtime-private snapshot, exact AppOperationId classification, required Base invariants or AppAccess-domain coverage, and current owner policy before any prior result may be reused; only the exact operation owner may define request-bound idempotency or deduplication after that admission, and no generic pre-admission cache or AppID-plus-key replay can return an earlier success.
    condition: Whenever Runtime processes a protected Third-party App operation that may be retried or deduplicated.
    failure: Reject cached success before current admission, cross-subject or cross-operation reuse, and idempotency that bypasses current owner policy.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r065
    kind: rule
    title: AI scheduling uses ordered global and app limits
    modality: must
    statement: AI execution acquires a configurable global semaphore defaulting to 8 before a configurable per-app semaphore defaulting to 2, releases in reverse order, maps empty AppID to _default, and marks AcquireResult.Starved true after the configurable default 30-second wait threshold.
    condition: Whenever an AI execution path acquires scheduler capacity.
    failure: Reject execution that bypasses either limit or violates acquisition order, and expose starvation rather than silently waiting beyond the threshold.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r066
    kind: rule
    title: AI timeout defaults and request override are closed
    modality: must
    statement: Default timeouts are 30 seconds for ExecuteScenario TEXT_GENERATE, 60 seconds to first byte and 120 seconds total for StreamScenario, 20 seconds for ExecuteScenario TEXT_EMBED, 120 seconds for image jobs, 300 seconds for video jobs, 45 seconds for StreamScenario SPEECH_SYNTHESIZE, and 90 seconds for speech-transcription jobs; timeout_ms may override only within the server maximum.
    condition: Whenever Runtime establishes an AI operation deadline.
    failure: Apply the admitted default or reject an override above the server maximum rather than run without a bound.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r067
    kind: rule
    title: Production configuration has disjoint boot and mutable classes
    modality: must
    statement: Production service principal, service definition, listener identity, active release, Realm account endpoints, custody root, and production or test posture come only from signed service and release projections and are Runtime-immutable, while admitted Connector custody metadata and Runtime-private Local or Remote ExecutionHost operational configuration live in service-principal-owned state and change only through typed protected Desktop control after authorization and closed-schema validation; this production configuration stores no App declaration, Effective App Access Snapshot, AIConfig route, provider-model target choice, Local Capability Configuration identity, binding, or machine selection and is not a D2 local-development prerequisite.
    condition: Whenever production Runtime loads, reads, or changes configuration.
    failure: Reject mutation of boot security fields and any mutable product change lacking protected authorization or schema admission.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r068
    kind: rule
    title: Production configuration rejects alternate authority
    modality: must
    statement: Production ignores and rejects NIMI_RUNTIME variables, argv-selected endpoints, user-writable files, user-home Runtime config, App or renderer metadata, unknown fields, and pre-release legacy import; addresses and timeouts validate, physical paths stay hidden, reads return only redacted typed projection, and these production service configuration constraints are not prerequisites or trust facts for the D2 per-user local-development slice.
    condition: Whenever production Runtime parses or projects configuration.
    failure: Fail configuration closed on an alternate source, unknown field, invalid address, nonpositive timeout, path disclosure, or attempted legacy import.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r069
    kind: rule
    title: Protected configuration mutation has two results
    modality: must
    statement: Typed protected config mutation returns CONFIG_RESTART_REQUIRED when any admitted Runtime-private Connector-custody or ExecutionHost operational field in providers.*, engines.llama.*, or engines.media.* changes and CONFIG_APPLIED for only hot changes or no material change; these namespaces never carry an AIConfig route, provider-model target choice, default model or provider, local binding, or machine selection, engines.localai.*, engines.nexa.*, and engines.nimi_media.* are rejected, and Desktop may request typed restart but never stop or select binary or config paths.
    condition: Whenever Desktop requests a Runtime configuration mutation.
    failure: Reject an unknown result, wrong restart classification, retired engine field, direct stop, document write, or path selection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r070
    kind: rule
    title: Admitted HTTP health endpoints have fixed semantics
    modality: must
    statement: On a separately admitted HTTP listener GET /livez returns 200 for process life, GET /readyz and GET /healthz return 200 only in READY and otherwise 503, and GET /v1/runtime/health returns the same full JSON health fields as GetRuntimeHealthResponse.
    condition: Whenever an admitted Runtime HTTP health listener is active.
    failure: Reject another method or status mapping and never use these endpoint definitions to manufacture an ordinary production public listener.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r071
    kind: rule
    title: Runtime version metadata is stable per process
    modality: must
    statement: Every gRPC response header carries semver x-nimi-runtime-version fixed at daemon startup for the process, node-grpc SDK consumers cache it from the first successful RPC for compatibility, missing metadata follows SDK best-effort compatibility, and Desktop obtains semantically equivalent daemonVersion through runtime_bridge_status.
    condition: Whenever Runtime responds over gRPC or a consumer determines daemon compatibility.
    failure: Reject a changing or non-semver process version and preserve the transport-specific missing-version behavior without inventing a value.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r072
    kind: rule
    title: Restart preserves durable stores but invalidates ephemeral authority
    modality: must
    statement: A normal Runtime restart in either admitted topology preserves Registered App Subjects and records, audit, canonical AIConfig, and admitted Runtime-owned LocalAgent Conversation and record stores and invalidates every prior-process exact-launch correlation, process binding, session, Effective App Access Snapshot, Agent handle, challenge, and stream before a protected listener becomes ready; the concrete restart marker remains implementation and no durable App permission or authorization record exists.
    condition: Whenever Runtime restarts in either admitted topology.
    failure: Deny reuse of every pre-restart ephemeral carrier while preserving admitted owner-owned durable truth and allowing a still-valid exact Host to follow the fresh launch or bind path required by current process facts.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r073
    kind: rule
    title: Restart integrity failures make protected access unavailable
    modality: must
    statement: Invalid topology-specific Runtime state, account or session mismatch, current data-root mismatch, or custody failure makes the affected protected App access unavailable without stopping unrelated process, support, diagnostic, authoring, or owner functionality or substituting the other topology as fallback.
    condition: Whenever Runtime validates protected state during restart.
    failure: Fail closed without direct-daemon, environment-selected-root, portable-session, app-id lookup, or old-process-channel recovery.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
  - id: rule.nimi.runtime.service-operations.r074
    kind: rule
    title: Runtime public operational command set is bounded
    modality: must
    statement: The Runtime public operational CLI provides serve, doctor, version, model, and provider, where model is limited to LocalAsset inventory, import, pull, and transfer operations and provider is limited to Connector custody projection and user-explicit bounded diagnostics; it provides no high-level generation command or route, target, default model, default provider, AIConfig, or machine-selection mutation.
    condition: Whenever the public Runtime CLI command surface is built or displayed.
    failure: Reject a missing required operational command or any command that creates generation or configuration authority outside the canonical owners.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r075
    kind: rule
    title: Top-level usage separates operational domains
    modality: must
    statement: Top-level nimi usage groups commands under Runtime Operations, Asset Management, Connector Custody and Diagnostics, and Advanced or Admin so each retained operational responsibility is explicit and no generation, default route, or default provider experience is implied.
    condition: Whenever nimi renders top-level help.
    failure: Reject help output missing a required operational group or implying a retired generation or routing path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r076
    kind: rule
    lifecycle: removed
    title: Retired Runtime CLI generation targeting
    reason: Removed because Runtime CLI is not an AIConfig owner and nimi run no longer exists as a high-level text-generation or request-scoped route, provider, or model selector.
  - id: rule.nimi.runtime.service-operations.r077
    kind: rule
    lifecycle: removed
    title: Retired Runtime CLI generation grammar
    reason: Removed with nimi run; --local, --cloud, --provider, and --model carry no generation route, target, default, product authority, alias, or compatibility interpretation.
  - id: rule.nimi.runtime.service-operations.r078
    kind: rule
    title: Daemon-down CLI failures are actionable and redacted
    modality: must
    statement: When the daemon is unreachable, an operational command or user-explicit bounded provider test fails closed with one executable next-step hint and exposes no raw gRPC or dial detail on the public surface; the diagnostic neither creates a route nor continues into generation.
    condition: Whenever a retained CLI operation cannot reach Runtime.
    failure: Return a non-success exit with the bounded hint rather than raw transport detail or pseudo-success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r079
    kind: rule
    lifecycle: removed
    title: Retired generation-triggered model installation
    reason: Removed because a generation command no longer resolves a model, starts installation, or continues execution; retained LocalAsset pull and import are separate explicit operations.
  - id: rule.nimi.runtime.service-operations.r080
    kind: rule
    lifecycle: removed
    title: Retired high-level model and provider route grammar
    reason: Removed because model inventory and Connector operations are operational namespaces and never generation route or target selectors.
  - id: rule.nimi.runtime.service-operations.r081
    kind: rule
    title: Connector CLI operations never select execution
    modality: must
    statement: The provider namespace may list Connector custody records, invoke already admitted explicit custody create or remove operations, and run a user-explicit bounded Test Connector diagnostic, but it never creates or selects an AIConfig route, provider-model target, ConnectorGrant binding, default provider or model, Machine Local AI Configuration relation, or generation request; custody and diagnostic outcomes remain with their canonical Runtime owners and never continue into execution.
    condition: Whenever a user invokes a retained provider or Connector operation.
    failure: Reject one-shot provider routing, a machine default, implicit account or grant selection, secret escape from Runtime custody, diagnostic-as-readiness, or any continuation into generation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r082
    kind: rule
    title: Doctor reports the minimum operational context
    modality: must
    statement: nimi doctor reports binary version, daemon operational health, Runtime-private local ExecutionHost supervision detail, Connector custody status, installed LocalAssets, and optional SDK detection in the current working directory without discovering, inferring, or exposing a production Runtime private physical configuration path; only when an explicit nonproduction portable config was supplied may doctor report that path, labeled as the nonproduction portable config entry, and no diagnostic field becomes capability readiness, binding, route, selection, or execution feasibility.
    condition: Whenever nimi doctor runs.
    failure: Return a diagnostic failure when required operational context cannot be determined, and reject default private-path discovery, private-path exposure, or a portable path reported without its nonproduction label.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r083
    kind: rule
    title: App author tooling stays outside Runtime CLI
    modality: must_not
    statement: The nimi Runtime CLI owns app scaffolding, templates, build profiles, dev, author doctor, update, pack, publish, admission, generated auth helpers, or scaffold audit semantics.
    condition: Whenever an app-author command or template capability is proposed for nimi.
    failure: Direct authors to the Platform-governed pnpm dlx @nimiplatform/app-tools nimi-app create, doctor, or update family without importing its authority into Runtime.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r084
    kind: rule
    title: Version command returns installation diagnostics
    modality: must
    statement: nimi version outputs the nimi version, Go version, and operating system and architecture without discovering, inferring, or exposing a production Runtime private physical configuration path; only when an explicit nonproduction portable config was supplied may version additionally report that path, labeled as the nonproduction portable config entry.
    condition: Whenever nimi version runs.
    failure: Return a command failure when the complete version diagnostic cannot be produced, and reject default private-path discovery, private-path exposure, or a portable path reported without its nonproduction label.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r085
    kind: rule
    title: Serve is foreground only
    modality: must
    statement: nimi serve is the canonical foreground Runtime command, remains attached, and writes logs directly without implicit daemonization.
    condition: Whenever the non-product foreground Runtime command runs.
    failure: Reject implicit backgrounding or detached success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r086
    kind: rule
    title: Background Runtime commands and meanings are stable
    modality: must
    statement: Background management provides nimi start, stop, status, and logs, where status reports process or instance state and health remains the detailed Runtime health view.
    condition: Whenever the background Runtime CLI surface is built or invoked.
    failure: Reject a missing command or a status result presented as the detailed health view.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r087
    kind: rule
    title: Background start waits for reachable health
    modality: must
    statement: nimi start returns success only after the child process starts and the Runtime health probe is reachable, with DEGRADED accepted as reachable success.
    condition: Whenever nimi start launches a background Runtime.
    failure: Return failure before reachability is proven and never report process creation alone as success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r088
    kind: rule
    title: Status combines process life and Runtime reachability
    modality: must
    statement: nimi status checks both process liveness and Runtime reachability rather than only state files and uses distinct exit codes for stopped and live-but-probe-failed outcomes.
    condition: Whenever nimi status evaluates a background Runtime.
    failure: Reject state-file-only success or an exit code that conflates stopped with probe failure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r089
    kind: rule
    title: Stale daemon state yields to live process truth
    modality: must
    statement: Background daemon pid, daemon metadata, and lock state are cleaned fail closed when stale, and live process truth takes precedence whenever stored state disagrees.
    condition: Whenever background CLI reads or reconciles daemon state files.
    failure: Remove stale state and reject any action or status based on a contradictory file.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.cli-plane
  - id: rule.nimi.runtime.service-operations.r090
    kind: rule
    title: D2 local-development Runtime is per-user and non-elevated
    modality: must
    statement: The Windows and macOS D2 local-development Runtime runs for the current OS user without elevation, LocalSystem, service SID, root, sudo, system account, LaunchDaemon, or another machine-wide privileged identity and uses only thin native local-endpoint, peer-identity, and process-observation adapters; D2 App security comes from Desktop's exact Host launch relation and Runtime operation admission, not an OS sandbox, same-user attack resistance, or the separately owned production service topology.
    condition: Whenever D2 local-development Runtime topology or protected local IPC is launched or evaluated.
    failure: Keep D2 protected App access unavailable when the required per-user local endpoint or exact Host peer relation cannot be established and do not substitute the production service topology as a D2 prerequisite.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.service-operations.daemon-plane
