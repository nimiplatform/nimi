format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.app-surface
units:
  - id: definition.nimi.runtime.app-surface.app-lifecycle-plane
    kind: definition
    title: Runtime app lifecycle plane
    meaning: The Runtime app lifecycle plane currently owns only the Desktop-hosted local-development lifecycle over PC-local development principals and records, protected local-app launch preparation and process binding, the Runtime-mediated file API non-admission boundary, and the protected local-app control protocol; ordinary install, update, repair, inventory, package-readiness, and public-distribution lifecycle behavior is deferred and physically absent from the current wire, SDK, and Runtime.
  - id: definition.nimi.runtime.app-surface.app-messaging-plane
    kind: definition
    title: Runtime app messaging plane
    meaning: The Runtime app messaging plane owns the current RuntimeAppService method set, app-to-app message send and subscribe semantics, protected local-app JSON storage, protected local-development launch and process binding, the app message event vocabulary, the messaging security baseline, the single admitted runtime-owned messaging path, cross-domain consumption contracts, delivery, retention, and backpressure semantics, the reserved runtime.agent reactive chat target, the companion multi-app interaction boundary, and the Avatar runtime boundary.
  - id: definition.nimi.runtime.app-surface.app-projection-plane
    kind: definition
    title: Runtime app projection plane
    meaning: The Runtime app projection plane owns current app-private storage truth, protected local-app JSON storage operations, and the retired local adoption boundary; ordinary app health, response-state, support next-action, package-readiness, and account app-inventory projections are deferred and physically absent.
  - id: definition.nimi.runtime.app-surface.local-app-principal-record-plane
    kind: definition
    title: Runtime local-app principal and record plane
    meaning: The Runtime local-app principal and record plane owns the PC-local development LocalAppPrincipal and LocalAppRecord lifecycle seam, including the local OS-user partition, the stable local security principal, the development lifecycle record, and owner separation with immutable per-operation resolution; no ordinary package principal or package record seam is admitted in the current product.
  - id: definition.nimi.runtime.app-surface.auth-service-plane
    kind: definition
    title: Runtime auth service plane
    meaning: The Runtime auth service plane owns authenticated Runtime session lifecycle and process-bound Local App identity, derives current account and App identity inside Runtime, validates any separately admitted external principal, revokes stale access, and never turns registration, a manifest, or caller-supplied identity into product authority.
  - id: rule.nimi.runtime.app-surface.r001
    kind: rule
    title: K-APP ownership boundary is fixed
    modality: must
    statement: Runtime K-APP owns the current PC-local development principal and record lifecycle and does not own Platform package format, ordinary package distribution, K-GRANT grant state, K-PLOCAL process and session facts, account custody, or operation-domain policy.
    condition: Whenever app lifecycle authority ownership is interpreted.
    failure: Reject lifecycle semantics owned outside Runtime K-APP and K-APP claims over the excluded authorities.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r002
    kind: rule
    title: Lifecycle mutations require the protected control carrier
    modality: must
    statement: All admitted K-APP development lifecycle mutations require Runtime-derived local_app_control on the current protected Desktop connection, and public TCP, app id, caller enum, renderer metadata, request confirmation, endpoint, environment, or portable bearer is denied before target parsing.
    condition: Whenever a lifecycle mutation request arrives.
    failure: Deny the request before target parsing.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r003
    kind: rule
    title: Ordinary package admission is deferred and physically absent
    modality: must
    statement: Ordinary package install and import are deferred, their RPCs, messages, enums, generated clients, SDK facades, Runtime handlers, placeholder errors, and restoration inputs are physically absent, and no catalog download, local adoption, source directory, unsigned package path, ignored field, compatibility decoder, or alternate method may create an ordinary package principal or runnable record; any future admission requires new canonical authority and a new wire design without reusing the removed placeholder contract.
    condition: Whenever ordinary package install or import is requested, shaped, generated, or restored.
    failure: Reject the request or restoration attempt without creating principals or records and without reintroducing a placeholder surface.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r004
    kind: rule
    title: Ordinary lifecycle job projections are deferred
    modality: must
    statement: Ordinary install, update, repair, and uninstall job projections are deferred and physically absent from the current wire, SDK, Runtime, config, tests, and generated surfaces; no placeholder job, dormant stream, synthetic failure, or reserved SDK wrapper represents future behavior.
    condition: Whenever an ordinary lifecycle job projection is proposed or restored.
    failure: Reject the projection until new canonical authority admits its complete behavior.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r005
    kind: rule
    title: Ordinary lifecycle event streams are deferred
    modality: must
    statement: Ordinary install, update, repair, and uninstall lifecycle event streams are deferred and physically absent from the current wire, SDK, Runtime, config, tests, and generated surfaces, and no unavailable-event placeholder or synthetic terminal failure is admitted.
    condition: Whenever an ordinary lifecycle event stream is proposed or restored.
    failure: Reject the event stream until new canonical authority admits its complete behavior.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r006
    kind: rule
    title: Development revoke and tombstone lifecycle is transactional
    modality: must
    statement: Revoking a development authorization transactionally revokes its leases and sessions and permanently tombstones the principal, retained durable data remains keyed to the tombstone and is delete-only after fresh presence, re-authorization allocates a new non-reused principal and inherits no permission decision, storage, app-scoped audience, session, or audit subject, and ordinary remove and uninstall are deferred and physically absent rather than represented by unavailable placeholders.
    condition: Whenever a development authorization is revoked.
    failure: Reject non-transactional removal, tombstone reuse, and inherited authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r007
    kind: rule
    title: Ordinary update and promotion are deferred
    modality: must
    statement: Ordinary update and imported-to-verified promotion are deferred, and their RPCs, messages, generated clients, SDK facades, Runtime handlers, tests, and configuration restoration inputs are physically absent; no current principal or record contract reserves their future semantics, and future admission requires new canonical authority.
    condition: Whenever ordinary update or promotion is requested, shaped, generated, or restored.
    failure: Reject the request or restoration attempt without a placeholder, compatibility path, or inferred future contract.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r008
    kind: rule
    title: Ordinary repair and reinstall are deferred
    modality: must
    statement: Ordinary repair and reinstall are deferred, and their RPCs, messages, generated clients, SDK facades, Runtime handlers, tests, and configuration restoration inputs are physically absent; development recovery uses supervised rebuild and restart plus a new K-PLOCAL lease and session and never aliases an ordinary repair or reinstall operation.
    condition: Whenever ordinary repair, reinstall, or development recovery is requested or restored.
    failure: Reject ordinary repair or reinstall without a placeholder or side effect and keep development recovery on the supervised path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r009
    kind: rule
    title: PrepareLocalAppLaunch is the sole launch preparation RPC
    modality: must
    statement: PrepareLocalAppLaunch is the sole local-app launch preparation RPC, it is callable only by Runtime-derived local_app_control and selects one active record by opaque local_app_record_id, Runtime resolves the OS-user anchor, principal, provenance revision, release-or-project generation, capability fingerprint, execution profile, host and payload digest slots, current account, and boot epoch, and success creates one short-lived K-PLOCAL launch lease and returns only an opaque host-private local_app_bootstrap plus expiry without launching a raw executable, creating a session or grant, or returning principal, account, or provenance details.
    condition: Whenever local-app launch preparation is requested.
    failure: Reject launch preparation outside this RPC and responses exceeding the bootstrap-plus-expiry shape.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r010
    kind: rule
    title: The positive launch profile is supervised local development
    modality: must
    statement: BindLocalAppProcess and request-empty OpenLocalAppSession complete the protected process and session path under K-PLOCAL-008, the only positive current profile is an approved supervised local_development record, ordinary package execution profiles are deferred and physically absent, and a shortcut invokes the verified Nimi or Desktop launcher with a record selector and never points to app code.
    condition: Whenever the protected launch path completes or a shortcut is created.
    failure: Reject non-supervised positive profiles, active immutable profiles, and shortcuts pointing at app code.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r011
    kind: rule
    title: No generic local-app file API is admitted
    modality: must
    statement: No generic local-app file API is admitted by 0K, principal-keyed private storage exists as an owner seam that apps cannot convert into raw filesystem or path authority, any future typed file operation must resolve the current principal and grant and must not expose another principal's root, and the exact JSON storage operations are not a generic file API because they do not admit raw bytes, roots, absolute paths, directory listing, range reads, move, mode, or arbitrary delete and therefore do not weaken this prohibition.
    condition: Whenever local-app file or storage access is designed or requested.
    failure: Reject generic file APIs and conversions of private storage into path authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r012
    kind: rule
    title: Protected control mutations are one transaction
    modality: must
    statement: Development mutations consume the live protected Desktop connection, local_app_control, current OS-user anchor, account, and boot epoch, exact target generation, and any presence challenge required by the Nimi-owned operation being requested in one service-owned transaction, the zero-permission local-project run decision is completed by the foreground verified Desktop confirmation UX itself and must not add a second Windows Hello, OS credential, or Realm reauthentication challenge, and returned evaluation and bootstrap ids are correlation only.
    condition: Whenever a protected development mutation executes.
    failure: Reject mutations outside the service-owned transaction and added second challenges.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r013
    kind: rule
    title: The local-app control role does not generalize
    modality: must
    statement: The local_app_control logical role covers current local-development UX coordination, future permission UX, protected launch, and development supervision, it does not expose deferred ordinary lifecycle operations, does not generalize OpenDesktopSession account control, and creates no portable controller credential; a future controller requires a separate transport and identity admission while consuming the same logical role.
    condition: Whenever the local-app control role is consumed or extended.
    failure: Reject account-control generalization and portable controller credentials.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r014
    kind: rule
    title: Developer Mode is the sole positive lifecycle
    modality: must
    statement: Production Developer Mode is the sole positive local-development lifecycle, enabling the global mode grants nothing, project evaluation resolves the declared App and executable identity without creating authority, the foreground verified host records each run or project decision, and manifest capability declarations are only request eligibility; the resulting isolated Local App receives no account, Runtime, Realm, LocalAgent, or permission authority until the current Runtime session and admitted product authorization allow an operation.
    condition: Whenever local development is enabled, evaluated, or decided.
    failure: Reject authority creation outside the decide path and manifest-derived grants.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r015
    kind: rule
    title: Development supervision rotates technical state only
    modality: must
    statement: Every supervised host process uses PrepareLocalAppLaunch, a new process bind, and a new common local-app session, controlled HMR, rebuild, restart, and Runtime restart may preserve the durable authorization while rotating technical state, mode off, account switch or logout, supervisor end, and Runtime replacement revoke live leases, process bindings, and sessions without expiring an unchanged allow_project consent, explicit revoke, copied or changed project, capability expansion, shell, entry, or origin mismatch, or uncontrolled output invalidates that consent and requires fresh approval, preserved consent never auto-runs a host, when a run_once supervisor run reaches any terminal condition Runtime tombstones that principal and marks its record removed with another run requiring a fresh decision and a new non-reused principal and record, and an allow_project consent does not transfer across account switch because its live carrier is revoked and it remains bound to the original account, while returning to that account may reuse the unchanged consent without a new project decision or credential challenge while still creating new technical carriers.
    condition: Whenever supervised development hosts run or development consent state changes.
    failure: Reject consent transfer, auto-run, and technical-state reuse beyond the declared preservation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r016
    kind: rule
    title: Development principals get no elevated account material
    modality: must
    statement: The development principal may use a controlled production account only through the common K-GRANT, K-ACCSVC, and owner-operation envelope, and it receives no credential, portable proof, stronger permission, or persistent Nimi-managed autostart.
    condition: Whenever a development principal touches a production account.
    failure: Reject credential issuance, portable proof, elevated permission, and managed autostart.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r017
    kind: rule
    title: The RuntimeAppService method set is fixed
    modality: must
    statement: The current RuntimeAppService method set is fixed to SendAppMessage and SubscribeAppMessages for app-to-app messaging, GetAppStorage for trusted host-side app-private storage-root projection, ReadLocalAppStorageJson, WriteLocalAppStorageJson, and RemoveLocalAppStorageJson for process-bound local-app private JSON storage, PrepareLocalAppLaunch for the single-use protected local-development launch lease, and BindLocalAppProcess for binding the exact native process to that lease; ordinary lifecycle intent, install, uninstall, account inventory, package readiness, job, update, repair, reinstall, and public-distribution methods are deferred and physically absent, and messaging, storage, and launch methods remain semantically independent.
    condition: Whenever the RuntimeAppService method surface is defined or consumed.
    failure: Reject undeclared methods and cross-carried semantics.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-messaging-plane
  - id: rule.nimi.runtime.app-surface.r018
    kind: rule
    title: App messaging is typed and session authorized
    modality: must
    statement: Runtime app messaging carries an explicit sender, recipient, message type, payload, and typed result, while Runtime derives the current account, App identity, and authorization from the active session; caller-supplied subject or relationship fields never create authority.
    condition: Whenever an app-to-app message is sent.
    failure: Reject malformed or unauthorized messages without synthesizing delivery.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-messaging-plane
  - id: rule.nimi.runtime.app-surface.r019
    kind: rule
    title: App message subscriptions preserve owner truth
    modality: must
    statement: App message subscriptions expose typed Runtime-owned delivery state and preserve explicit sender, recipient, ordering, failure, and trace relations without allowing a subscriber to infer account, App, LocalAgent, or Conversation authority from message traffic.
    condition: Whenever app messages are subscribed or events are emitted.
    failure: Reject malformed or unauthorized subscriptions and events.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-messaging-plane
  - id: rule.nimi.runtime.app-surface.r020
    kind: rule
    title: The app message event type enum is closed
    modality: must
    statement: AppMessageEventType admits only RECEIVED for a received message, ACKED for a confirmed message, and FAILED for delivery failure.
    condition: Whenever an app message event type is emitted.
    failure: Reject undeclared event types.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-messaging-plane
  - id: rule.nimi.runtime.app-surface.r021
    kind: rule
    title: App message senders derive from authenticated connections
    modality: must
    statement: SendAppMessage derives the sending principal from the current authenticated connection, ordinary and external callers use their separately admitted sessions, LOCAL_APP uses only the host-injected local_app_session, Runtime derives from_app_id from the principal record and rejects inconsistent self-reported requests, LOCAL_APP holds no token, bearer, or portable credential, and unauthenticated or mismatched requests return UNAUTHENTICATED, preventing arbitrary processes from impersonating registered apps and keeping local-app principal and session authority unleaked.
    condition: Whenever an app message sender identity is established.
    failure: Return UNAUTHENTICATED for unauthenticated or mismatched requests.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-messaging-plane
  - id: rule.nimi.runtime.app-surface.r022
    kind: rule
    title: App message payloads are bounded
    modality: must
    statement: A serialized app-message payload Struct never exceeds 64 KB, and an oversized payload returns INVALID_ARGUMENT with APP_MESSAGE_PAYLOAD_TOO_LARGE so a single message cannot exhaust Runtime memory.
    condition: Whenever an app message payload is validated.
    failure: Return INVALID_ARGUMENT with APP_MESSAGE_PAYLOAD_TOO_LARGE.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-messaging-plane
  - id: rule.nimi.runtime.app-surface.r023
    kind: rule
    title: App message sending is rate limited per principal
    modality: must
    statement: Ordinary callers are rate limited per authenticated sender identity and LOCAL_APP is rate limited per local_os_user_anchor plus local_app_principal_id at 100 messages per second over a sliding window, app ID remains a routing label that cannot merge the budgets of two principals, and exceeding the limit returns RESOURCE_EXHAUSTED with APP_MESSAGE_RATE_LIMITED, preventing message storms, DoS, and same-app-id principal budget crosstalk.
    condition: Whenever app message send rates are evaluated.
    failure: Return RESOURCE_EXHAUSTED with APP_MESSAGE_RATE_LIMITED.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-messaging-plane
  - id: rule.nimi.runtime.app-surface.r024
    kind: rule
    title: Message loops trip a pair circuit breaker
    modality: must
    statement: Runtime detects A-to-B-to-A loops so that twenty direction switches within one second on the same unordered app pair automatically break that pair's subsequent messages for sixty seconds returning FAILED_PRECONDITION with APP_MESSAGE_LOOP_DETECTED, multiple same-direction streaming or presentation projections after a single request form only one direction switch and are never miscounted as a loop by projection count, and both apps may keep messaging other apps during the breaker window, preventing infinite ping-pong loops while preserving legitimate one-to-many streaming projection.
    condition: Whenever app pair message direction switching is evaluated.
    failure: Return FAILED_PRECONDITION with APP_MESSAGE_LOOP_DETECTED for the tripped pair only.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-messaging-plane
  - id: rule.nimi.runtime.app-surface.r025
    kind: rule
    title: No Desktop-local alternate message bus exists
    modality: must_not
    statement: The Desktop renderer creates a parallel local message bus replacing the runtime auth, rate-limit, loop-detection, durable event ordering, or audit posture of RuntimeAppService.SendAppMessage, which is the only admitted runtime-owned app-to-app messaging product path.
    condition: Whenever Desktop app-to-app messaging is designed or implemented.
    failure: Reject the parallel bus and route messaging through the runtime-owned path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-messaging-plane
  - id: rule.nimi.runtime.app-surface.r026
    kind: rule
    title: Cross-domain messaging consumption stays aligned
    modality: must
    statement: SDK method projection keeps the SendAppMessage and SubscribeAppMessages gRPC-to-SDK parameter mapping and error projection aligned with the runtime public surface, and Desktop has no default K-APP UI consumption right so direct Desktop use of the K-APP path for cross-process or audit scenarios requires a corresponding Desktop UI spec first, with the existing SDK projection of the K-APP gRPC path never making it the Desktop shell's default UI messaging surface.
    condition: Whenever SDK or Desktop consumes the app messaging surface.
    failure: Reject drifted SDK projection and specless Desktop UI consumption.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-messaging-plane
  - id: rule.nimi.runtime.app-surface.r027
    kind: rule
    title: App message delivery is process-local live delivery
    modality: must
    statement: Admitted delivery semantics for SendAppMessage and SubscribeAppMessages are process-local live delivery in which Runtime does not persist app-message events, does not replay events to subscribers not connected at publication, sequence is monotonic only within one Runtime process lifetime and resets after restart, a non-empty SubscribeAppMessagesRequest.cursor fails closed with INVALID_ARGUMENT and PROTOCOL_ENVELOPE_INVALID because replay and durable resume are not admitted on this surface, a subscriber stream owns a bounded relay buffer of 32 events and three consecutive drops observed by the relay for a too-slow consumer close that subscriber with RESOURCE_EXHAUSTED, SendAppMessage success is never interpreted as durable delivery to that subscriber, and the bus is suitable for live app-to-app notifications and the reserved runtime.agent reactive consume seam while never serving as a durable inbox, durable event log, cross-restart replay stream, audit log, or product message-history authority whose durable records must be committed through their owning Runtime, Realm, Cognition, or app surface.
    condition: Whenever app message delivery, retention, or backpressure is handled.
    failure: Fail closed on cursors, close slow subscribers, and reject durability claims.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-messaging-plane
  - id: rule.nimi.runtime.app-surface.r028
    kind: rule
    title: The runtime.agent target admits closed families
    modality: must
    statement: runtime.agent is the reserved runtime-owned app target for the RuntimeAgentService app-facing reactive chat consume seam and is not a generic app-bus target with only admitted message families transported, admitted ingress families are exactly runtime.agent.turn.request and runtime.agent.turn.interrupt, admitted projection families are exactly runtime.agent.turn.accepted, runtime.agent.turn.started, runtime.agent.turn.reasoning_delta, runtime.agent.turn.text_delta, runtime.agent.turn.structured, runtime.agent.turn.message_committed, runtime.agent.turn.post_turn, runtime.agent.turn.completed, runtime.agent.turn.failed, runtime.agent.turn.interrupted, and runtime.agent.turn.interrupt_ack, public chat session snapshot is a query surface through RuntimeAgentService.GetPublicChatSessionSnapshot and is not admitted as RuntimeAppService request and reply traffic, semantic ownership of these families remains on RuntimeAgentService even when the transport owner is RuntimeAppService, first-party consumers may use SendAppMessage and SubscribeAppMessages against runtime.agent for this seam without reinterpreting that transport path as proof of a generic cross-app chat bus, and runtime.agent.* RPC projection remains separate covering lifecycle, state, memory, admin, and read rather than reactive chat transport.
    condition: Whenever the reserved runtime.agent app target is used or extended.
    failure: Reject unadmitted families, snapshot request-reply traffic, and generic-bus reinterpretation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-messaging-plane
  - id: rule.nimi.runtime.app-surface.r029
    kind: rule
    title: LocalAgent access has one session-derived authorization seam
    modality: must
    statement: A Desktop-hosted Local App reaches LocalAgent Conversation only through standard typed SDK calls to Runtime Agent Service after Runtime derives the current account, App identity, product authorization, explicit localAgentId, and requested operation from the active session; app messaging, caller-supplied subject, App id, or a relationship token cannot create a second authorization path.
    condition: Whenever a Local App requests a LocalAgent operation.
    failure: Fail closed when session-derived account, App identity, authorization, LocalAgent access, or operation admission is unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-messaging-plane
  - id: rule.nimi.runtime.app-surface.r030
    kind: rule
    title: Multi-app projection remains non-owning
    modality: must
    statement: Multi-app interaction uses explicit Runtime-owned messages and LocalAgent projections without creating a platform event broker or App-owned Conversation truth; Runtime preserves LocalAgent and Conversation continuity, each App owns only its presentation semantics, Avatar consumes its independent projection, and no third-party App gains a direct Avatar driver or embedded renderer.
    condition: Whenever companion multi-app interaction is designed or transported.
    failure: Fail closed on malformed or unauthorized traffic and reject any App-owned LocalAgent, Conversation, or Avatar-control truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-messaging-plane
  - id: rule.nimi.runtime.app-surface.r031
    kind: rule
    title: The Avatar runtime boundary is fixed
    modality: must
    statement: Default Avatar is an independent first-party LocalAgent projection consumer that uses normal Runtime and SDK authorization without inheriting Desktop account control, receiving Realm or provider credentials, or accepting caller-supplied account or authorization truth; Runtime validates the selected localAgentId and emits message, state, emotion, activity, voice, and presentation truth, while Avatar owns only visual and playback presentation.
    condition: Whenever Avatar consumes Runtime App or LocalAgent surfaces.
    failure: Reject caller-supplied identity or authorization, direct LocalAgent execution, App-owned Conversation truth, and direct third-party Avatar control.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-messaging-plane
  - id: rule.nimi.runtime.app-surface.r032
    kind: rule
    lifecycle: removed
    title: AppHealth reports eight typed dimensions
    reason: Removed because ordinary AppHealth projection is deferred and physically absent from the current wire, Runtime, SDK, and host surfaces.
  - id: rule.nimi.runtime.app-surface.r033
    kind: rule
    lifecycle: removed
    title: Overall state derivation is a closed table
    reason: Removed with the deferred ordinary AppHealth projection; no current derivation table or placeholder state remains.
  - id: rule.nimi.runtime.app-surface.r034
    kind: rule
    lifecycle: removed
    title: Dimensions and overall states never conflate
    reason: Removed with the deferred ordinary AppHealth projection; its dimension and overall-state contract is not reserved.
  - id: rule.nimi.runtime.app-surface.r035
    kind: rule
    lifecycle: removed
    title: AppResponseState fields are exactly five
    reason: Removed because ordinary AppResponseState projection is deferred and physically absent rather than reserved as a current contract.
  - id: rule.nimi.runtime.app-surface.r036
    kind: rule
    lifecycle: removed
    title: Response-state sources are typed and closed
    reason: Removed with the deferred ordinary AppResponseState projection; no current response-state input contract remains.
  - id: rule.nimi.runtime.app-surface.r037
    kind: rule
    lifecycle: removed
    title: The support next-action enum is exactly ten tokens
    reason: Removed because ordinary lifecycle support next-actions are deferred and their token vocabulary is not reserved.
  - id: rule.nimi.runtime.app-surface.r038
    kind: rule
    lifecycle: removed
    title: Next-action tokens are non-executable projections
    reason: Removed with the non-admitted support next-action vocabulary; current Runtime exposes neither the projection nor executable ordinary lifecycle actions.
  - id: rule.nimi.runtime.app-surface.r039
    kind: rule
    lifecycle: removed
    title: The state-to-action mapping table is closed
    reason: Removed with the deferred ordinary AppHealth, AppResponseState, and support next-action projections; no mapping table remains current.
  - id: rule.nimi.runtime.app-surface.r040
    kind: rule
    title: App storage roots are principal-scoped Runtime truth
    modality: must
    statement: App-private storage is Runtime-owned principal-scoped truth, a local-app session resolves its opaque development principal internally with the request accepting no app_id or principal override, Runtime derives the roots <nimi_data>/apps/<local-app-principal-id>/data, <nimi_data>/apps/<local-app-principal-id>/cache, and <nimi_data>/apps/<local-app-principal-id>/tmp, no immutable release root or future package slot is reserved in the current contract, an active development principal may receive data, cache, and tmp roots, same-app-id principals remain isolated, and tombstoned data is not rebound to a new authorization and is delete-only after fresh presence.
    condition: Whenever app storage roots are derived or resolved.
    failure: Reject caller-supplied principals, cross-principal roots, and tombstone rebinding.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
  - id: rule.nimi.runtime.app-surface.r041
    kind: rule
    title: No alternate storage authority exists
    modality: must
    statement: Third-party apps, renderers, and SDK clients never receive the canonical product-control record, raw data-root selection, protected Runtime configuration, or an alternate storage locator; trusted product and verification owners resolve Product Control only through the shared resolver, app storage remains available only through Runtime typed APIs and principal-scoped roots, and invalid canonical or derived storage state fails closed with a typed state and reason; physical path validation remains Runtime implementation.
    condition: Whenever storage authority is resolved or storage prerequisites fail.
    failure: Fail closed with typed storage state and reason, reject alternate authorities and raw-root disclosure, and route canonical-to-derived root disagreement to repair.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
  - id: rule.nimi.runtime.app-surface.r042
    kind: rule
    title: Local-app JSON storage methods are exactly three
    modality: must
    statement: RuntimeAppService owns exactly the three local-app storage methods ReadLocalAppStorageJson, WriteLocalAppStorageJson, and RemoveLocalAppStorageJson, admitted only on local_app_host after the current process-bound session, principal, and account partition are revalidated, they form the app.private_storage base entitlement creating no permission decision, user prompt, selector, or grant row, and the request carries only relative_path plus one JSON value for write and carries no app id, principal id, account id, root, absolute path, quota, permission id, decision id, credential, endpoint, or method selector.
    condition: Whenever local-app JSON storage operations are admitted.
    failure: Reject operations off local_app_host and requests carrying excluded fields.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
  - id: rule.nimi.runtime.app-surface.r043
    kind: rule
    title: JSON storage paths and quotas are enforced
    modality: must
    statement: Runtime resolves App-private JSON storage only from the current session-derived Local App principal and account partition, accepts canonical relative JSON paths, enforces owner-defined document and partition resource bounds plus filesystem safety, writes atomically, and treats removal of an absent record as idempotent.
    condition: Whenever a local-app JSON storage path or write is validated.
    failure: Reject invalid paths, oversize documents, and quota violations.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
  - id: rule.nimi.runtime.app-surface.r044
    kind: rule
    title: JSON storage responses disclose no paths
    modality: must
    statement: Read and write responses contain only the JSON value, size_bytes, and canonical reason code, remove contains only removed and the reason code, no response, error detail, audit projection, log, Kit or SDK projection, or renderer payload may contain a root or absolute path, and Runtime emits APP_STORAGE_PATH_INVALID, APP_STORAGE_ENTRY_NOT_FOUND, APP_STORAGE_QUOTA_EXCEEDED, or APP_STORAGE_UNAVAILABLE as applicable and never falls back to GetAppStorage, public TCP, Node filesystem access, app-id partitioning, or a generic file API.
    condition: Whenever local-app JSON storage responds or fails.
    failure: Reject path disclosure and any fallback path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
  - id: rule.nimi.runtime.app-surface.r045
    kind: rule
    title: Package readiness is deferred and physically absent
    modality: must
    statement: Package readiness is deferred and GetAppPackageReadiness, its request and response messages, readiness enums and projections, generated clients, SDK facade, Runtime handler, tests, and configuration inputs are physically absent; Runtime, Desktop, Kit, SDK, templates, and apps never scan package directories, active pointers, install evidence, or file existence as package truth, and any future package readiness requires new canonical authority and a new wire design.
    condition: Whenever app package readiness is queried, shaped, generated, or restored.
    failure: Reject the request or restoration attempt without a typed-unavailable placeholder or positive readiness claim.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
  - id: rule.nimi.runtime.app-surface.r046
    kind: rule
    title: Account app inventory is deferred and physically absent
    modality: must
    statement: Account app inventory and ordinary visibility-versus-materialization projection are deferred, and GetAccountAppInventory, its record and row messages and enums, generated clients, SDK decoders and facade, Runtime store and handler, tests, and configuration inputs are physically absent; current local-development records never create account entitlement or verified distribution truth.
    condition: Whenever account app inventory is projected, mutated, generated, or restored.
    failure: Reject the projection or restoration attempt without creating entitlement truth or a placeholder inventory.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
  - id: rule.nimi.runtime.app-surface.r047
    kind: rule
    title: Deferred inventory has no alternate read path
    modality: must
    statement: With account app inventory deferred, Runtime, Desktop, SDK, Kit, templates, and apps expose no inventory file reader, parser, decoder, store, mutation path, fixture, or alternate projection, never read <dataRoot>/accounts/<account-id>/apps/inventory.json as product truth, and never derive account eligibility from current local-development records.
    condition: Whenever deferred account app inventory is read, generated, or restored.
    failure: Reject alternate inventory authority and restoration of the removed projection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
  - id: rule.nimi.runtime.app-surface.r048
    kind: rule
    title: The local adoption family stays retired
    modality: must
    statement: The predecessor local-adoption family is retired and removed from Proto, generated clients, Runtime handlers and stores, SDK and Kit exports, Desktop UX, tests, and inventory states in the atomic public wire epoch with no active success behavior and no alias, mutable source enters through Developer Mode and creates a fresh isolated development principal and record only after Runtime presence and approval, ordinary package bytes and lifecycle surfaces are deferred and physically absent, and package-manager roots, workspace and source scanning, app-local manifests, app id, file presence, process liveness, and inventory-like records cannot create runnable truth.
    condition: Whenever local adoption or runnable truth creation is attempted.
    failure: Reject retired-family revival and runnable truth outside the admitted paths.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
  - id: rule.nimi.runtime.app-surface.r049
    kind: rule
    title: The principal-record seam owns only its stores
    modality: must
    statement: The local-app principal and record contract owns only the PC-local LocalAppPrincipal and LocalAppRecord lifecycle seam, while protected launch, process, and session facts remain K-PLOCAL authority, future Runtime-owned permission decisions follow K-GRANT authority, account and credential custody remains K-ACCSVC authority, and operation and resource semantics remain with their existing owners.
    condition: Whenever principal-record ownership boundaries are interpreted.
    failure: Reject seam claims over launch, grant, custody, or operation authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.local-app-principal-record-plane
  - id: rule.nimi.runtime.app-surface.r050
    kind: rule
    title: The OS-user anchor derives from one source
    modality: must
    statement: Every principal and record is partitioned by one Runtime-derived local_os_user_anchor obtained from the verified current OS account scope; the anchor is never accepted from a request, environment variable, project, package, Desktop, SDK, or app, and platform-specific derivation mechanisms remain protected-local implementation rather than cross-layer product semantics.
    condition: Whenever the local OS-user anchor is derived.
    failure: Reject caller-supplied, unverifiable, stale, or cross-account anchors.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.local-app-principal-record-plane
  - id: rule.nimi.runtime.app-surface.r051
    kind: rule
    title: One active anchor partitions one data root
    modality: must
    statement: One Runtime data root admits exactly one active local OS account scope; a different account scope fails closed before principal, record, private storage, permission, autostart, launch, session, or audit state can be read or mutated, an account switch invalidates prior access, and this single-PC partition creates no device enrollment, cross-PC recovery, or cloud truth.
    condition: Whenever anchor identity is checked against the Runtime data root.
    failure: Fail closed before any partitioned state is read or mutated.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.local-app-principal-record-plane
  - id: rule.nimi.runtime.app-surface.r052
    kind: rule
    title: The principal id is the security subject
    modality: must
    statement: Runtime allocates a random non-reused opaque local_app_principal_id for each admission instance, and that identifier rather than app_id or provenance is the security subject for app-private storage, app-scoped audience and access, grants, sessions, and audit.
    condition: Whenever a local-app security subject is established.
    failure: Reject app_id- or provenance-based subjects and reused principal ids.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.local-app-principal-record-plane
  - id: rule.nimi.runtime.app-surface.r053
    kind: rule
    title: Development principals have one owner anchor
    modality: must
    statement: A current development principal carries exactly one Runtime-owned development_authorization_id together with canonical project-root file identity and the declared app_id; ordinary immutable lineage and package anchors are deferred and physically absent from the current principal schema.
    condition: Whenever a principal-kind anchor is created or populated.
    failure: Reject principals with zero or multiple kind anchors and unfrozen field reshaping.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.local-app-principal-record-plane
  - id: rule.nimi.runtime.app-surface.r054
    kind: rule
    title: Development principals die on revoke
    modality: must
    statement: Project-authorization revoke tombstones the development principal permanently, any re-authorization including the same project or app id allocates a new principal and inherits no permission decision, storage, audience, session, or audit identity, retained tombstoned data is delete-only after fresh presence with rebind and migration not admitted, app_id remains a display and routing identifier, and ordinary update, uninstall, reinstall, promotion, signer, and immutable-lineage behavior is deferred and physically absent.
    condition: Whenever development principal lifecycle transitions or app-id collisions occur.
    failure: Reject tombstone revival, inherited identity, and app-id-based principal merging.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.local-app-principal-record-plane
  - id: rule.nimi.runtime.app-surface.r055
    kind: rule
    title: The lifecycle record binds one principal
    modality: must
    statement: The current LocalAppRecord binds one development principal to current project provenance and lifecycle and contains only the local_development trust class, project generation, active capability fingerprint, opaque execution_profile_ref, host executable digest, payload-root digest, and lifecycle state required by supervised local development, and it contains no ordinary verified or imported trust class, package attestation, install state, grant boolean, permission result, account owner, session proof, or operation-policy decision.
    condition: Whenever a lifecycle record is created or read.
    failure: Reject records missing the closed shape or embedding excluded authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.local-app-principal-record-plane
  - id: rule.nimi.runtime.app-surface.r056
    kind: rule
    title: The ordinary package seam is not admitted
    modality: must
    statement: Ordinary package install, update, promotion, repair, reinstall, and public distribution are deferred, no package seam or frozen future package fields exist in the current principal and record schema, and no wire, generated client, Runtime handler, SDK facade, config input, fixture, compatibility loader, or dormant implementation may reserve or repopulate them; future admission requires new canonical authority and must not reinterpret development provenance.
    condition: Whenever an ordinary package seam or provenance class is proposed, populated, generated, or restored.
    failure: Reject restoration, compatibility paths, and reinterpretation of development provenance.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.local-app-principal-record-plane
  - id: rule.nimi.runtime.app-surface.r057
    kind: rule
    title: Owner stores stay separate behind a resolver
    modality: must
    statement: The principal store and lifecycle-record store are separate from the account-grant store and protected launch and session store, and a resolver may join them into an immutable per-operation context but cannot mutate another owner's store or cache an authorization result.
    condition: Whenever owner stores are joined for an operation.
    failure: Reject cross-owner mutation and cached authorization results.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.local-app-principal-record-plane
  - id: rule.nimi.runtime.app-surface.r058
    kind: rule
    title: Private preparation cannot become a second store
    modality: must
    statement: Private preparation is permitted before public cutover only when unreachable from production, unregistered as a public RPC or export, and not an active second store, and dual read, dual write, app-id positive fallback, and record-embedded grant state are forbidden.
    condition: Whenever pre-cutover preparation exists.
    failure: Reject reachable preparation, dual paths, and embedded grant state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.local-app-principal-record-plane
  - id: rule.nimi.runtime.app-surface.r059
    kind: rule
    title: Account-scoped data keys are fixed
    modality: must
    statement: Account-scoped App-private data remains partitioned from machine-local App identity, while canonical LocalAgent, Conversation, transcript, presentation, Memory, and Knowledge truth remains with Runtime owners and is never repartitioned or owned by the App principal.
    condition: Whenever account-scoped app data or canonical identity is keyed.
    failure: Reject alternate keying and app-principal ownership of canonical identity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.local-app-principal-record-plane
  - id: rule.nimi.runtime.app-surface.r078
    kind: rule
    title: RuntimeAuthService responsibility is fixed
    modality: must
    statement: RuntimeAuthService owns authenticated Runtime session lifecycle and the common process-bound Local App identity session, while protected operation decisions remain Runtime-private and require the verified origin, current session-derived identity and authorization, and the operation owner's policy.
    condition: Whenever RuntimeAuthService responsibility is interpreted.
    failure: Reject grant-family revival and non-private protected operation decisions.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r079
    kind: rule
    title: RuntimeAuthService does not own account custody
    modality: must
    statement: RuntimeAuthService is not responsible for local machine account session, login lifecycle, custody, refresh, logout, user switch, or daemon restart recovery because those authorities are owned by RuntimeAccountService, and protected-local origin, Desktop process verification, and control-session authority are owned by K-PLOCAL with the auth service only consuming its immutable origin context.
    condition: Whenever auth service scope meets account or protected-local authority.
    failure: Reject auth-service ownership claims over account or origin authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r080
    kind: rule
    title: The RuntimeAuthService method set is fixed
    modality: must
    statement: The RuntimeAuthService method set is fixed to RegisterApp, OpenSession, RefreshSession, RevokeSession, RegisterExternalPrincipal, OpenExternalPrincipalSession, RevokeExternalPrincipalSession, OpenDesktopSession on desktop_control only, request-empty OpenLocalAppSession only for a local_app_bootstrap connection already bound to launch lease, process, and record, and request-empty RenewLocalAppSession only for the current exact local_app_host and local_app_session.
    condition: Whenever the RuntimeAuthService method surface is defined or consumed.
    failure: Reject undeclared methods and out-of-carrier protected session calls.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r081
    kind: rule
    title: Protected session opens are request-empty
    modality: must
    statement: Both protected session-open requests are empty, OpenDesktopSession keeps Desktop account-control semantics while OpenLocalAppSession is the single third-party app session path, neither accepts app id, caller class, source host, principal, trust, lease, process, account, grant, or portable proof override and neither returns a portable authorization bearer, and RenewLocalAppSession is not another open path because it atomically replaces only the current Runtime-private short-lived technical session on the same verified host connection after complete revalidation, never changes origin role, reconsumes a lease, or repeats durable consent, and returns only the same sanitized session posture projection.
    condition: Whenever a protected session is opened or renewed.
    failure: Reject non-empty requests, overrides, portable bearers, and renew-as-open.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r082
    kind: rule
    title: App registration grants no product authority
    modality: must
    statement: App registration validates the declared App identity and mode, but registration, a manifest, source-host metadata, or an ordinary session creates no account, Realm, Runtime, LocalAgent, AI, Artifact, media, lifecycle, or launch authority; each operation still requires current session-derived identity and owner authorization.
    condition: Whenever an app registers or opens an ordinary session.
    failure: Reject empty app ids, unknown enum passthrough, and authority production.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r083
    kind: rule
    title: Session TTLs are server-bounded
    modality: must
    statement: ttl_seconds must fall inside the server-configured interval from sessionTtlMinSeconds to sessionTtlMaxSeconds defaulting to 60 through 86400 seconds and configurable through daemon configuration, out-of-interval values fail closed with INVALID_ARGUMENT, RefreshSession applies only to a still-valid session_id, and these TTL bounds apply only to non-privileged binding and external-principal sessions whose renewal never upgrades origin role or creates portable protected privilege.
    condition: Whenever a session TTL is requested or refreshed.
    failure: Fail closed with INVALID_ARGUMENT on out-of-interval TTLs.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r084
    kind: rule
    title: Revocation is idempotent and silent
    modality: must
    statement: RevokeSession and RevokeExternalPrincipalSession are idempotent, and repeated revocation returns OK without leaking whether the session ever existed.
    condition: Whenever a session revocation repeats.
    failure: Reject non-idempotent revocation and existence leakage.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r085
    kind: rule
    title: External principal proof maps to typed errors
    modality: must
    statement: RegisterExternalPrincipal validates the consistency of proof_type and signature_key_id, and OpenExternalPrincipalSession proof validation failures map uniformly to UNAUTHENTICATED with AUTH_TOKEN_INVALID.
    condition: Whenever an external principal registers or opens a session.
    failure: Return UNAUTHENTICATED with AUTH_TOKEN_INVALID on proof failure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r086
    kind: rule
    title: All auth methods write audit
    modality: must
    statement: Every RuntimeAuthService method writes audit for success and failure following the minimal audit field authority and retaining app_id, session_id, and external_principal_id where applicable.
    condition: Whenever a RuntimeAuthService method completes.
    failure: Reject unaudited completions.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r087
    kind: rule
    title: Issued tokens satisfy AuthN verifiability
    modality: must
    statement: Tokens generated or renewed by RuntimeAuthService satisfy the AuthN required-claims validation constraints and the AuthN algorithm and header constraints for verifiability.
    condition: Whenever RuntimeAuthService generates or renews a token.
    failure: Reject tokens failing AuthN verifiability constraints.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r088
    kind: rule
    title: AppMode is a ceiling not authorization
    modality: must
    statement: AppMode is not an authorization source but only the static upper bound of a future separately admitted non-binding session, all BINDING_ONLY registrations and sessions have empty effective domains and empty effective scopes unaffected by LITE, CORE_ONLY, FULL, manifest, project-local flags, or grant rows, mode and manifest validation never upgrades protected origin, caller role, transport class, account posture, or token custody, ordinary OpenSession has no broker, AI, artifact, realtime, media, lifecycle, or local-app launch authority, and the mode table remains a ceiling rather than blanket effective rights in which LITE allows at most realm, CORE_ONLY allows at most runtime, and FULL allows at most both domain classes with each still requiring independent session, origin, and grant admission and none equaling granted permission.
    condition: Whenever AppMode or manifest state is evaluated for authority.
    failure: Reject mode-derived authority and ceiling-derived upgrades.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r089
    kind: rule
    title: Local-app sessions promote one connection
    modality: must
    statement: Local-app sessions are created only by request-empty OpenLocalAppSession on a verified local_app_bootstrap connection already bound to the current lease, process, principal, and record, success atomically promotes that same connection to local_app_host, and its short-lived technical session may be renewed only by request-empty RenewLocalAppSession on that same verified local_app_host connection and current session.
    condition: Whenever a local-app session is created or renewed.
    failure: Reject creation or renewal outside the verified bound connection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r090
    kind: rule
    title: The auth evaluation order is fixed
    modality: must
    statement: Evaluation first resolves BINDING_ONLY whose effective set is directly empty, then verifies protected origin and the independently admitted session, then applies the AppMode ceiling, and finally applies the base-entitlement boundary per authority class or the current owner decision, selector, and operation-owner policy of an admitted public permission, domain ceiling violations return APP_MODE_DOMAIN_FORBIDDEN and scope ceiling violations return APP_MODE_SCOPE_FORBIDDEN only after non-binding session, protected origin, and the concrete operation or grant have been independently admitted by their canonical owners, and any failed precondition fails closed without reverse upgrade through later ceilings or grants.
    condition: Whenever auth evaluation ordering runs.
    failure: Fail closed on failed preconditions without reverse upgrade.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r091
    kind: rule
    title: Manifest world-relation combinations validate
    modality: must
    statement: AppModeManifest declares mode and world_relation, the WorldRelation enum admits NONE for no world association, RENDER for render permission, and EXTENSION for extension permission, illegal combinations return APP_MODE_MANIFEST_INVALID, and LITE mode does not allow world_relation EXTENSION because extension requires runtime capability.
    condition: Whenever a mode manifest combination is validated.
    failure: Return APP_MODE_MANIFEST_INVALID on illegal combinations.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r092
    kind: rule
    title: TTL resolution has fixed defaults
    modality: must
    statement: The default session TTL is 3600 seconds, a client-requested ttl_seconds must fall within the server-configured interval, the lower bound sessionTtlMinSeconds defaults to 60 seconds and the upper bound sessionTtlMaxSeconds defaults to 86400 seconds with both set through the daemon configuration file or environment variables, and a missing ttl_seconds uses the default value.
    condition: Whenever a session TTL is resolved.
    failure: Reject TTLs outside the configured interval.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r093
    kind: rule
    title: Stale App sessions cannot restore authority
    modality: must
    statement: Reconnect or refresh cannot restore prior product authority by itself, separately admitted external principals never become the local account or protected process origin, and all App and external-principal sessions become invalid after Runtime restart so clients must establish a fresh authenticated session and authorization state.
    condition: Whenever app or external-principal sessions are stored or restored.
    failure: Reject privilege restoration and cross-restart session revival.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r094
    kind: rule
    title: Account custody split stays with the account service
    modality: must
    statement: Local machine account sessions owned by RuntimeAccountService use daemon-owned secure Runtime custody selected only by the protected-local platform implementation, with callers, Desktop, and apps never owning durable account token custody; daemon restart attempts recovery from secure custody yielding authenticated on success, unavailable when custody is unavailable, expired on expiry, and reauth_required on inconsistency; and the OpenSession and OpenExternalPrincipalSession paths are never a local machine account truth entry with caller-supplied subject_user_id never used for the local first-party account.
    condition: Whenever account session custody or restart recovery runs.
    failure: Reject caller custody, a runtime-selected or portable custody fallback, non-custody recovery, and account truth entry through app sessions.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r095
    kind: rule
    title: Restart recovery differs per consumer
    modality: must
    statement: Desktop does not use OpenSession because its token comes from the Realm Backend so daemon restart requires re-running RegisterApp per the Desktop bootstrap contract while the Realm token is unaffected and Desktop re-executes the bootstrap sequence after detecting runtime.disconnected, external agents and independent SDK consumers use the auth session paths so restart invalidates their sessions and all authenticated RPCs return UNAUTHENTICATED until the application layer re-runs RegisterExternalPrincipal plus OpenExternalPrincipalSession or re-opens sessions, the SDK runtime.disconnected event detects disconnection without distinguishing network failure from restart-invalidated sessions because both recover by rebuilding the connection and the session, and SDK consumers should unconditionally reconnect and re-open sessions in the disconnected handler without distinguishing the cause and retry with backoff on failure.
    condition: Whenever consumers recover from daemon restart.
    failure: Reject recovery flows that bypass re-registration or re-open paths.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r096
    kind: rule
    title: External proof is JWT-only with a reserved slot
    modality: must
    statement: The proof_type supported by RegisterExternalPrincipal and OpenExternalPrincipalSession is JWT in Phase 1 verified through JWT signature verification, exp expiry checking, and iss issuer matching, and the proto enum freeze admits only EXTERNAL_PROOF_TYPE_JWT as the usable ExternalProofType value while the historical value slot 2 must stay reserved and is never reused.
    condition: Whenever an external proof type is declared or the proto enum evolves.
    failure: Reject non-JWT proof types and reuse of the reserved slot 2.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r097
    kind: rule
    title: JWT proof validation constraints are exact
    modality: must
    statement: signature_key_id must point to a public key registered through the RegisterExternalPrincipal signature_key_id association, the signature algorithm accepts only the RS256 currently declared by the generated Realm JWKS contract consistent with the AuthN algorithm constraints, the proof JWT must contain iat participating in temporal validation, nbf when present participates in validation with the AuthN ±60s skew, the maximum proof JWT lifetime is fixed at 24h so exp minus iat is at most 24h with overruns failing closed, expired tokens map uniformly to UNAUTHENTICATED with AUTH_TOKEN_EXPIRED, issuer mismatches map uniformly to UNAUTHENTICATED with AUTH_TOKEN_INVALID, and unsupported proof types return INVALID_ARGUMENT with AUTH_UNSUPPORTED_PROOF_TYPE.
    condition: Whenever an external principal JWT proof is validated.
    failure: Fail closed with the mapped typed statuses.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r098
    kind: rule
    title: Developer registration stays physically absent
    modality: must
    statement: The predecessor RegisterAppRequest.developer_registration gate is retired and physically absent from the public wire, field number 7 and the field name developer_registration are both reserved and cannot be reused, no ignored field, alias, compatibility decoder, or alternate request intent may preserve the predecessor shape, and RegisterApp cannot create a local principal, project authorization, account caller, grant, launch lease, or local-app session.
    condition: Whenever the RegisterApp wire shape or its capabilities evolve.
    failure: Reject predecessor shape revival and RegisterApp authority creation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r099
    kind: rule
    title: Local development has no compatibility entry
    modality: must
    statement: Local development enters only through Runtime-owned Developer Mode project authorization, K-APP principal and record creation, K-PLOCAL protected launch, and the common request-empty local-app session, auth.developerRegistration and its environment, CLI, and config projections, request intent, RegisterApp, app id, manifest, ordinary app session, metadata, and temporary bearers do not exist as compatibility paths, unknown predecessor config keys fail schema validation, and the service never decodes or special-cases predecessor wire payloads.
    condition: Whenever local development entry paths are evaluated.
    failure: Fail schema validation and reject compatibility decoding.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
