format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.app-surface
units:
  - id: definition.nimi.runtime.app-surface.app-lifecycle-plane
    kind: definition
    title: Runtime app lifecycle plane
    meaning: The Runtime app lifecycle plane owns the common per-user package job, committed installed release and readiness projection, canonical registration record, declaration generations, stable Registered App Subject, and protected-session seam used by verified, user-imported, and development Apps; Desktop owns source selection, exact Host launch, focus, stop, restart, and process supervision, Runtime protected ingress owns post-launch peer, current-account, session, snapshot, and operation-admission binding, Platform owns catalog and release admission, and package format and review remain outside App access semantics.
  - id: definition.nimi.runtime.app-surface.app-messaging-plane
    kind: definition
    title: Runtime internal Agent carrier plane
    meaning: The Runtime internal Agent carrier plane owns only the fixed first-party Runtime Agent ingress and projection subtypes needed by Runtime-owned Agent execution and Avatar projection; no generic Third-party App message send, subscription, bus, SDK mapping, cross-App routing, or durable messaging product surface is admitted.
  - id: definition.nimi.runtime.app-surface.app-projection-plane
    kind: definition
    title: Runtime app projection plane
    meaning: The Runtime app projection plane owns current App-private JSON and binary asset storage truth, protected exact local-app storage operations, Runtime-custody artifact adoption, package jobs and readiness, and the local inventory projection that keeps Platform catalog identity, committed local package state, Desktop Host state, Runtime registration, and current access availability distinct.
  - id: definition.nimi.runtime.app-surface.local-app-principal-record-plane
    kind: definition
    lifecycle: removed
    title: Retired Runtime local-app principal and record plane
    reason: Removed because Registered App Subject is the sole current App security-subject term and physical record or storage identity remains Runtime implementation without a principal alias.
  - id: definition.nimi.runtime.app-surface.registered-app-subject-record-plane
    kind: definition
    title: Runtime Registered App Subject and record plane
    meaning: The Runtime Registered App Subject and record plane owns one per-user registered App subject and record seam shared by installed, local-import, and development sources, including source class, source generation, declaration generation, stable non-reused opaque subject, security-relevant Host launch facts, lifecycle state, and immutable per-operation resolution without permission or marketplace state; physical record and storage layout remains Runtime implementation.
    relations:
      - type: supersedes
        target: definition.nimi.runtime.app-surface.local-app-principal-record-plane
  - id: definition.nimi.runtime.app-surface.auth-service-plane
    kind: definition
    title: Runtime auth service plane
    meaning: The Runtime auth service plane owns authenticated Runtime session lifecycle and process-bound Local App identity, derives the current account context and Effective App Access Snapshot from the verified Host, registered subject, source generation, and declaration generation, validates any separately admitted external principal, and never accepts caller-supplied identity, snapshot, operation, domain, or classification truth.
  - id: rule.nimi.runtime.app-surface.r001
    kind: rule
    title: K-APP ownership boundary is fixed
    modality: must
    statement: Runtime K-APP owns the common installed, local-import, and development registered-subject and record lifecycle and does not own Platform package format or distribution, protected process and session facts, account custody, the canonical App operation contract, or owner-domain business policy.
    condition: Whenever app lifecycle authority ownership is interpreted.
    failure: Reject lifecycle semantics owned outside Runtime K-APP and K-APP claims over the excluded authorities.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r002
    kind: rule
    title: Lifecycle mutations require the protected control carrier
    modality: must
    statement: All admitted K-APP development lifecycle mutations require the current protected Desktop control connection, and public TCP, app id, caller enum, renderer metadata, request confirmation, endpoint, environment, or portable bearer is denied before target parsing.
    condition: Whenever a lifecycle mutation request arrives.
    failure: Deny the request before target parsing.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r003
    kind: rule
    lifecycle: removed
    title: Retired ordinary package principal non-admission
    reason: Removed because installed and local-import Apps now use the same Runtime registration, declaration, verified launch, and protected-session model as development Apps while installer and distribution details remain separately owned.
  - id: rule.nimi.runtime.app-surface.r004
    kind: rule
    title: Ordinary lifecycle jobs are current Runtime truth
    modality: must
    statement: Runtime exposes one typed install, update, repair, or uninstall job per active App package mutation through the current wire and SDK, persists its exact observed phase and progress, keeps local_development outside package jobs, and never emits a placeholder, dormant stream, synthetic terminal result, or success before atomic commit.
    condition: Whenever an ordinary package lifecycle mutation starts, changes, completes, fails, or is canceled.
    failure: Reject an invalid or concurrent mutation and return the exact current or terminal job without synthetic progress or success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r005
    kind: rule
    title: Ordinary lifecycle events project committed job transitions
    modality: must
    statement: Runtime lifecycle event streams emit monotonically ordered snapshots only for observed install, update, repair, and uninstall job transitions, include the current job and committed inventory projection needed to reconcile after a missed event, and emit no unavailable-event placeholder, synthetic terminal failure, or renderer-authored state.
    condition: Whenever a lifecycle subscriber observes or resumes package job changes.
    failure: Reject an unordered, incomplete, synthetic, or renderer-authored event and require a fresh Runtime projection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r006
    kind: rule
    title: Development removal and tombstone lifecycle is transactional
    modality: must
    statement: Explicit removal of a development registration transactionally invalidates its live launch correlations, process bindings, sessions, Effective App Access Snapshots, Agent handles, and streams and permanently tombstones the subject; account, declaration-generation, and Runtime changes invalidate only affected ephemeral access and never implicitly delete registration or rotate the stable subject, while a source-generation change re-evaluates exact Host launch inputs and requires a new verified launch only when the executable, entrypoint, another security-relevant launch input, or the process fact changed.
    condition: Whenever a development registration is explicitly removed or a session, declaration, Runtime, or source fact changes.
    failure: Reject non-transactional explicit removal, tombstone reuse, implicit registration deletion, and stale ephemeral access.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r007
    kind: rule
    title: Ordinary update atomically selects a new release
    modality: must
    statement: A verified update resolves one newer approved descriptor while a user_imported update requires one newly and explicitly selected immutable artifact, both run through validation and staging before one atomic active-release and source-generation commit, and neither silently promotes user_imported to verified nor mutates the Registered App Subject, declaration, session, snapshot, or App access truth.
    condition: Whenever an ordinary update is requested or committed.
    failure: Reject an ineligible, unvalidated, non-atomic, or source-class-changing update and preserve the prior installed release.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r008
    kind: rule
    title: Ordinary repair and reinstall preserve source truth
    modality: must
    statement: Ordinary repair verifies the committed immutable release and reacquires or rereads only missing or corrupt managed package bytes before atomic recommit, reinstall uses the exact verified descriptor or a newly explicit user_imported artifact, and development recovery remains supervised rebuild and restart with a fresh verified launch and session rather than a package repair alias.
    condition: Whenever ordinary repair, reinstall, or development recovery is requested.
    failure: Reject a source-less, unvalidated, cross-source, or non-atomic repair or reinstall, preserve the prior release on failure, and keep development recovery on the supervised path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r009
    kind: rule
    title: Runtime consumes one exact Desktop launch witness after launch
    modality: must
    statement: After Desktop launches one exact Host, Runtime protected ingress consumes one fresh host-private launch witness from the current protected Desktop control connection and binds it to one active Registered App Subject, the current source and declaration generations, the declared security-relevant Host launch inputs, and that exact Host process; the witness creates no App session or operation authority, attests neither binary nor mutable project integrity, and returns no subject, account, credential, or declaration authority material.
    condition: Whenever post-launch Local App peer binding is attempted.
    failure: Reject missing, alternate, stale, portable, or mismatched launch witnesses and any witness result carrying authority material.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r010
    kind: rule
    title: App source classes share one protected launch path
    modality: must
    statement: When separately admitted by their lifecycle owner, installed, local-import, and development records use the same Desktop-verified exact Host launch, fresh protected Local App session, declaration interpretation, and Runtime admission path, with only source registration and lifecycle provenance differing; installer, distribution, update, and marketplace facts do not alter App access semantics.
    condition: Whenever an App from any admitted source class completes protected launch and session binding.
    failure: Reject a source-specific access path, direct Runtime fallback, or marketplace-derived authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r011
    kind: rule
    title: Managed assets do not admit a generic local-app filesystem
    modality: must
    statement: No raw-root, absolute-path, directory, mode, arbitrary OS-file, or generic local-app filesystem API is admitted; current-account-plus-Registered-App-Subject private storage is an owner seam that Apps cannot convert into physical layout or path authority, each typed Base operation resolves both owner components and its exact AppOperationId at protected ingress, and only the three JSON methods plus asset stat, bounded list, streamed write, immutable-source ranged read, idempotent remove, and same-partition move are admitted without exposing another owner's root or a caller-selected identity, operation, or transport.
    condition: Whenever local-app file or storage access is designed or requested.
    failure: Reject generic file APIs and conversions of private storage into path authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r012
    kind: rule
    title: Canonical registration mutations are one Runtime transaction
    modality: must
    statement: Development registration mutations consume the live protected Desktop control connection, the Runtime-verified current local OS-user logical scope, and Desktop-evaluated source and declaration input in one Runtime K-APP-owned canonical record transaction that owns the Registered App Subject and current source and declaration generations; Desktop workflow and launch intent create no App access, consent, permission flow, or reusable authority state, while any returned evaluation or launch identifier remains correlation only.
    condition: Whenever a protected development mutation executes.
    failure: Reject registration mutations outside the Runtime-owned canonical record transaction, caller-authored generation truth, and added second challenges.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r013
    kind: rule
    title: Protected Desktop control does not generalize
    modality: must
    statement: Protected Desktop control covers local-development UX coordination, verified launch, and development supervision, does not own App access decisions, does not expose separately owned installer or distribution operations, does not generalize account control, and creates no portable controller credential.
    condition: Whenever protected Desktop control is consumed or extended.
    failure: Reject account-control generalization and portable controller credentials.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r014
    kind: rule
    title: Developer Mode governs only the development source lifecycle
    modality: must
    statement: Developer Mode enables only development-source registration, evaluation, launch, and supervision, grants no App operation by itself, and has no effect on installed or local-import access semantics; declaration domains become effective only through the current verified Host session and Runtime-derived Effective App Access Snapshot.
    condition: Whenever local development is enabled, evaluated, or decided.
    failure: Reject App access derived from Developer Mode, project evaluation, or launch intent instead of the current verified session and declaration-derived snapshot.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r015
    kind: rule
    title: Development supervision rotates technical state only
    modality: must
    statement: Every supervised development Host uses a fresh exact-launch correlation, process binding, Local App session, Effective App Access Snapshot, and Agent handles; account, declaration-generation, or Runtime changes invalidate only affected ephemeral access and allow the same exact Host to bind fresh, while a source-generation change re-evaluates launch inputs and Developer Mode off, explicit stop, ended supervision, or a changed executable, entrypoint, another security-relevant launch input, or process fact requires a new verified launch.
    condition: Whenever a supervised development Host runs or a session, declaration, Runtime, source, or launch fact changes.
    failure: Reject stale technical carriers, implicit Host termination for access-only changes, and relaunch bypass after an actual Host fact changes.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r016
    kind: rule
    title: Development subjects get no elevated account material
    modality: must
    statement: A development registered subject may use the current account only through the common protected session, Effective App Access Snapshot, and owner-operation path and receives no credential, portable proof, elevated access, or persistent Nimi-managed autostart.
    condition: Whenever a development Registered App Subject touches a production account.
    failure: Reject credential issuance, portable proof, elevated permission, and managed autostart.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
  - id: rule.nimi.runtime.app-surface.r017
    kind: rule
    title: The Third-party App surface is purpose specific
    modality: must
    statement: The Third-party App-facing surface exposes only canonical purpose-specific typed operations after protected Runtime admission, while trusted host control owns launch preparation and exact Host process binding; generic messaging, generic streams, cross-App routing, account inventory, package readiness, lifecycle jobs, update, repair, reinstall, and public-distribution behavior are not App-callable and have no Third-party SDK mapping.
    condition: Whenever the Third-party App-facing surface is defined or consumed.
    failure: Reject behavior outside the canonical App operation contract, generic forwarding, and cross-carried semantics.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
  - id: rule.nimi.runtime.app-surface.r018
    kind: rule
    lifecycle: removed
    title: Retired generic App message send
    reason: Removed because generic Third-party App-to-App messaging is outside the canonical App operation contract and no generic send surface remains.
  - id: rule.nimi.runtime.app-surface.r019
    kind: rule
    lifecycle: removed
    title: Retired generic App message subscription
    reason: Removed because generic Third-party App subscriptions and delivery-state projection are outside the canonical App operation contract.
  - id: rule.nimi.runtime.app-surface.r020
    kind: rule
    lifecycle: removed
    title: Retired generic App message event enum
    reason: Removed with the generic App message surface.
  - id: rule.nimi.runtime.app-surface.r021
    kind: rule
    lifecycle: removed
    title: Retired generic App message sender identity
    reason: Removed with SendAppMessage; protected App identity is now used only for operations in the canonical App operation contract.
  - id: rule.nimi.runtime.app-surface.r022
    kind: rule
    lifecycle: removed
    title: Retired generic App message payload bound
    reason: Removed with the generic App message payload contract; each supported operation owns its own typed bounds.
  - id: rule.nimi.runtime.app-surface.r023
    kind: rule
    lifecycle: removed
    title: Retired generic App message rate limit
    reason: Removed with generic App message sending; owner operations retain their own resource bounds.
  - id: rule.nimi.runtime.app-surface.r024
    kind: rule
    lifecycle: removed
    title: Retired App-pair message circuit breaker
    reason: Removed with the generic cross-App message bus.
  - id: rule.nimi.runtime.app-surface.r025
    kind: rule
    lifecycle: removed
    title: Retired generic message-bus exclusivity
    reason: Removed because no generic Runtime or Desktop App-to-App message bus is admitted.
  - id: rule.nimi.runtime.app-surface.r026
    kind: rule
    lifecycle: removed
    title: Retired generic messaging SDK projection
    reason: Removed because SendAppMessage and SubscribeAppMessages have no Third-party SDK mapping.
  - id: rule.nimi.runtime.app-surface.r027
    kind: rule
    lifecycle: removed
    title: Retired generic App message delivery contract
    reason: Removed with the generic send and subscribe surface; supported typed streams use their owner-specific delivery contract.
  - id: rule.nimi.runtime.app-surface.r028
    kind: rule
    title: Internal Runtime Agent carrier admits fixed subtypes
    modality: must
    statement: Runtime may transport only the internal first-party ingress subtypes runtime.agent.turn.request and runtime.agent.turn.interrupt and projection subtypes runtime.agent.turn.accepted, runtime.agent.turn.started, runtime.agent.turn.reasoning_delta, runtime.agent.turn.text_delta, runtime.agent.turn.structured, runtime.agent.turn.message_committed, runtime.agent.turn.post_turn, runtime.agent.turn.completed, runtime.agent.turn.failed, runtime.agent.turn.interrupted, and runtime.agent.turn.interrupt_ack through a private process-local carrier; that carrier is not a Third-party App-facing generic messaging surface, is absent from Third-party SDK and declaration mapping, creates no generic sender or recipient routing, and leaves snapshot queries and semantic ownership with the Runtime Agent owner.
    condition: Whenever the private Runtime Agent carrier is built, consumed, or extended.
    failure: Reject Third-party access, generic routing, unadmitted subtypes, durable-bus semantics, and snapshot request-reply traffic on the carrier.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-messaging-plane
  - id: rule.nimi.runtime.app-surface.r029
    kind: rule
    title: LocalAgent access has one session-derived authorization seam
    modality: must
    statement: A Desktop-hosted Local App reaches LocalAgent Conversation only through canonical typed Runtime Agent Service operations after Runtime derives the current account, App subject, Effective App Access Snapshot, exact AppOperationId, and a session-scoped opaque Agent handle from the active session; the handle is a non-secret selector rather than a grant, bearer, durable identity, or reusable relationship, and internal Agent transport cannot create a second admission path.
    condition: Whenever a Local App requests a LocalAgent operation.
    failure: Fail the affected operation closed when the current account, App subject, snapshot, Agent-handle resolution, exact operation admission, or owner policy is unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-messaging-plane
  - id: rule.nimi.runtime.app-surface.r030
    kind: rule
    lifecycle: removed
    title: Retired companion multi-App message projection
    reason: Removed because generic multi-App messaging and projection are outside the canonical Third-party App operation contract.
  - id: rule.nimi.runtime.app-surface.r031
    kind: rule
    title: The Avatar runtime boundary is fixed
    modality: must
    statement: Default Avatar is an independent first-party LocalAgent projection consumer that uses normal Runtime and SDK authorization without inheriting Desktop account control, receiving Realm or provider credentials, or accepting caller-supplied account or authorization truth; Runtime validates the selected localAgentId and emits message, state, emotion, activity, voice, and presentation truth, while Avatar owns only visual and playback presentation.
    condition: Whenever Avatar consumes Runtime App or LocalAgent surfaces.
    failure: Reject caller-supplied identity or authorization, direct LocalAgent execution, App-owned Conversation truth, and direct third-party Avatar control.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-messaging-plane
  - id: rule.nimi.runtime.app-surface.r032
    kind: rule
    lifecycle: removed
    title: AppHealth reports eight typed dimensions
    reason: Removed because ordinary AppHealth projection is deferred and physically absent from the current wire, Runtime, SDK, and host surfaces.
  - id: rule.nimi.runtime.app-surface.r033
    kind: rule
    lifecycle: removed
    title: Overall state derivation is a closed table
    reason: Removed with the deferred ordinary AppHealth projection; no current derivation table or placeholder state remains.
  - id: rule.nimi.runtime.app-surface.r034
    kind: rule
    lifecycle: removed
    title: Dimensions and overall states never conflate
    reason: Removed with the deferred ordinary AppHealth projection; its dimension and overall-state contract is not reserved.
  - id: rule.nimi.runtime.app-surface.r035
    kind: rule
    lifecycle: removed
    title: AppResponseState fields are exactly five
    reason: Removed because ordinary AppResponseState projection is deferred and physically absent rather than reserved as a current contract.
  - id: rule.nimi.runtime.app-surface.r036
    kind: rule
    lifecycle: removed
    title: Response-state sources are typed and closed
    reason: Removed with the deferred ordinary AppResponseState projection; no current response-state input contract remains.
  - id: rule.nimi.runtime.app-surface.r037
    kind: rule
    lifecycle: removed
    title: The support next-action enum is exactly ten tokens
    reason: Removed because ordinary lifecycle support next-actions are deferred and their token vocabulary is not reserved.
  - id: rule.nimi.runtime.app-surface.r038
    kind: rule
    lifecycle: removed
    title: Next-action tokens are non-executable projections
    reason: Removed with the non-admitted support next-action vocabulary; current Runtime exposes neither the projection nor executable ordinary lifecycle actions.
  - id: rule.nimi.runtime.app-surface.r039
    kind: rule
    lifecycle: removed
    title: The state-to-action mapping table is closed
    reason: Removed with the deferred ordinary AppHealth, AppResponseState, and support next-action projections; no mapping table remains current.
  - id: rule.nimi.runtime.app-surface.r040
    kind: rule
    title: App storage partitions are Registered-App-Subject-scoped Runtime truth
    modality: must
    statement: App-private storage is Runtime-owned current-account-plus-Registered-App-Subject truth, a Local App protected session resolves both opaque owner components internally with the request accepting no account, app_id, subject, registration, partition, or root override, Runtime derives collision-proof JSON, asset, candidate, and internal physical namespaces for trusted host use, account switch selects a different partition and switching back restores the prior partition, installed, local-import, and development subjects use the same semantics, same-app-id registrations remain isolated, tombstoned data is never rebound, and historical subject-only JSON data is unavailable through the product path rather than migrated or reused.
    condition: Whenever app storage roots are derived or resolved.
    failure: Reject caller-supplied subjects, cross-subject partitions, and tombstone rebinding.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
  - id: rule.nimi.runtime.app-surface.r041
    kind: rule
    title: No alternate storage authority exists
    modality: must
    statement: Third-party apps, renderers, and SDK clients never receive the canonical product-control record, raw data-root selection, protected Runtime configuration, or an alternate storage locator; trusted product and verification owners resolve Product Control only through the shared resolver, app storage remains available only through Runtime typed APIs and Registered-App-Subject-scoped logical partitions, and invalid canonical or derived storage state fails closed with a typed state and reason; physical path selection and validation remain Runtime implementation.
    condition: Whenever storage authority is resolved or storage prerequisites fail.
    failure: Fail closed with typed storage state and reason, reject alternate authorities and raw-root disclosure, and route canonical-to-derived root disagreement to repair.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
  - id: rule.nimi.runtime.app-surface.r042
    kind: rule
    title: Local-app managed storage operations are exact
    modality: must
    statement: The canonical App operation contract admits exactly runtime.app-storage.json.read, runtime.app-storage.json.write, and runtime.app-storage.json.remove for App-private JSON plus runtime.app-storage.asset.stat, runtime.app-storage.asset.list, runtime.app-storage.asset.write, runtime.app-storage.asset.read, runtime.app-storage.asset.remove, and runtime.app-storage.asset.move for App-private binary assets; Runtime revalidates the current exact Host-bound session, current AccountID, Registered App Subject, Runtime-private snapshot context, exact Base classification, and Base-row invariants, while purpose-specific typed requests accept only canonical relative paths or bounded list and range inputs, JSON values, streamed asset chunks, optional descriptive media type, and explicit overwrite intent and accept no app id, subject id, account id, registration, partition, root, absolute path, quota, permission id, decision id, credential, endpoint, or caller-selected operation or method.
    condition: Whenever local-app JSON storage operations are admitted.
    failure: Reject operations outside the current exact Host-bound session and requests carrying excluded fields.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
  - id: rule.nimi.runtime.app-surface.r043
    kind: rule
    title: Managed storage paths, streams, commits, and quotas are enforced
    modality: must
    statement: Runtime resolves App-private storage only from the protected-session current AccountID plus Registered App Subject; JSON retains its 256-KiB document and 16-MiB committed-partition quota, while assets use collision-proof case- and Unicode-stable keys, a 1024-byte UTF-8 path bound, at most 32 components of at most 255 UTF-8 bytes each, chunks of at most 1 MiB, list pages defaulting to 100 and capped at 500, at most 16 active asset streams per owner, an 8-GiB object limit, a 64-GiB and 100000-object committed asset partition limit, and a 1-GiB minimum-free-space reserve; JSON quota counts committed JSON only, asset quota counts committed assets only, and candidates or internal metadata count toward neither public quota; writes and same-partition moves serialize affected paths and publish at one atomic commit point, final asset byte and object admission occurs under one short owner lock, failed or cancelled candidates leave the prior target unchanged and uncharged, committed records are durable quota truth reconciled before the next mutation after startup or ambiguous publish, list is deterministic but not snapshot-isolated, and each read holds one immutable committed source through EOF or cancellation.
    condition: Whenever a local-app managed storage path, stream, list, mutation, quota, or startup reconciliation is evaluated.
    failure: Reject invalid paths or prefixes, malformed media types, out-of-order or oversized chunks, invalid ranges or cursors, object, partition, concurrency, or free-space violations, corrupt committed records, symlink or reparse traversal, and any commit that would oversubscribe owner quota; never publish a partial target or splice versions into an open read.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
  - id: rule.nimi.runtime.app-surface.r044
    kind: rule
    title: Managed storage responses disclose no physical paths or owner facts
    modality: must
    statement: JSON read and write responses contain only the JSON value, size_bytes, and canonical reason code and JSON remove contains only removed and the reason code; asset stat and list expose only canonical relative path, optional media type, safe observed byte size, lowercase sha256 digest, and creation and modification timestamps, asset read adds only the resolved range and incremental body from the opened committed source, asset remove returns only removed, and move returns only the committed target record; Runtime uses typed invalid-path, not-found, already-exists, quota-exceeded, object-too-large, invalid-range, invalid-cursor, integrity-failure, storage-unavailable, and canceled results, while artifact adoption uses APP_STORAGE_ARTIFACT_UNAVAILABLE for missing, foreign, subject-unbound, expired, or corrupt sources without distinguishing existence or mutating the target; no response, error detail, audit projection, log, Kit or SDK projection, or renderer payload may contain a root, absolute path, account, subject, provider URL, endpoint, credential, or proof, and Runtime never falls back to GetAppStorage, public TCP, Node filesystem access, app-id partitioning, or a generic file API.
    condition: Whenever local-app managed storage responds or fails.
    failure: Reject path disclosure and any fallback path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
  - id: rule.nimi.runtime.app-surface.r045
    kind: rule
    title: Package readiness comes from committed lifecycle truth
    modality: must
    statement: GetAppPackageReadiness and its SDK projection resolve only from Runtime-owned committed active release, install evidence, current package job, and validated local record state, keep not-installed, in-progress, installed, failed, repair-required, and not-applicable distinct, and never infer positive readiness by scanning package directories, file existence, endpoint reachability, process liveness, or transfer completion.
    condition: Whenever app package readiness is queried or changed.
    failure: Return the exact non-positive state when committed evidence is absent or invalid and reject scanned or inferred readiness.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
  - id: rule.nimi.runtime.app-surface.r046
    kind: rule
    title: Account App inventory preserves owner projections
    modality: must
    statement: GetAccountAppInventory and its SDK projection return the current account's committed verified and user_imported local records plus local_development registration rows while preserving catalog identity, source class, package state, installed version, update state, current lifecycle job, Runtime registration, Desktop Host state, and current access availability as distinct owner fields; local_development never creates entitlement or verified distribution truth.
    condition: Whenever account App inventory is projected or changed.
    failure: Reject a merged, source-erasing, entitlement-inferred, renderer-authored, or incomplete inventory row.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
  - id: rule.nimi.runtime.app-surface.r047
    kind: rule
    title: App inventory has one Runtime and SDK read path
    modality: must
    statement: Runtime is the sole local inventory and package-job truth owner, Desktop and Apps consume it only through the generated SDK projection, no renderer, Kit, template, or App reads or mutates an inventory file, package directory, active pointer, or install evidence directly, and account eligibility is never derived from local-development records.
    condition: Whenever App inventory or package lifecycle state is read, generated, or mutated.
    failure: Reject an alternate reader, writer, decoder, store, fixture authority, or eligibility inference.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
  - id: rule.nimi.runtime.app-surface.r048
    kind: rule
    title: The local adoption family stays retired
    modality: must
    statement: The predecessor local-adoption family remains retired with no alias or compatibility decoder; a current local-import source enters only through the common explicit registration, declaration, registered-subject, verified Desktop launch, and protected-session path, while workspace scanning, app id, file presence, process liveness, and inventory-like records cannot create runnable or access truth.
    condition: Whenever local adoption or runnable truth creation is attempted.
    failure: Reject retired-family revival and runnable truth outside the admitted paths.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-projection-plane
  - id: rule.nimi.runtime.app-surface.r049
    kind: rule
    title: The Registered App Subject record seam owns only its stores
    modality: must
    statement: The local-app subject and record contract owns only the per-user registered-subject and lifecycle-record seam, while protected launch, process, session, and Effective App Access Snapshot facts remain Runtime protected-session authority, account and credential custody remains Account Service authority, the canonical App operation contract remains Platform truth, and operation and resource semantics remain with their existing owners.
    condition: Whenever Registered App Subject record ownership boundaries are interpreted.
    failure: Reject seam claims over launch, grant, custody, or operation authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.registered-app-subject-record-plane
  - id: rule.nimi.runtime.app-surface.r050
    kind: rule
    title: Registration uses one verified per-user logical scope
    modality: must
    statement: Every Registered App Subject and lifecycle record is partitioned by one Runtime-verified current local OS-user logical scope; that scope is never accepted from a request, environment variable, project, package, Desktop, SDK, or App, and platform-specific derivation mechanisms remain protected-local implementation rather than cross-layer product semantics.
    condition: Whenever the per-user registration scope is resolved.
    failure: Reject caller-supplied, unverifiable, stale, or cross-user registration scope.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.registered-app-subject-record-plane
  - id: rule.nimi.runtime.app-surface.r051
    kind: rule
    title: One active OS-user scope partitions Runtime App state
    modality: must
    statement: Runtime admits exactly one active local OS-user scope for each per-user logical Registered App Subject and record boundary; a different scope fails closed before subject, record, private storage, launch, session, snapshot, or audit state can be read or mutated, an account switch invalidates prior account-bound ephemeral access without deleting registration, and this logical partition creates no device enrollment, cross-PC recovery, cloud truth, or product-authoritative physical path.
    condition: Whenever the OS-user anchor is checked against Runtime-owned App state.
    failure: Fail closed before any partitioned state is read or mutated.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.registered-app-subject-record-plane
  - id: rule.nimi.runtime.app-surface.r052
    kind: rule
    title: Runtime allocates the Registered App Subject
    modality: must
    statement: Runtime allocates one random non-reused opaque Registered App Subject for each registration, and that subject rather than app_id, provenance, a caller field, or a physical storage key is the stable security subject for private storage, App-scoped audience, sessions, Effective App Access Snapshots, and audit.
    condition: Whenever a local-app security subject is established.
    failure: Reject app_id- or provenance-based subjects, caller-selected subjects, and subject reuse.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.registered-app-subject-record-plane
  - id: rule.nimi.runtime.app-surface.r053
    kind: rule
    title: Registered App subjects have one source anchor
    modality: must
    statement: A registered App subject has exactly one installed, local-import, or development source anchor plus its stable declared app_id, source generation, and declaration generation; source-specific installer, import, project, signature, and distribution details remain with their lifecycle owner and do not change App access semantics.
    condition: Whenever a registered App subject source anchor is created or updated.
    failure: Reject zero or multiple source anchors, caller-authored generations, and source-specific access semantics.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.registered-app-subject-record-plane
  - id: rule.nimi.runtime.app-surface.r054
    kind: rule
    title: Development subjects die on explicit removal
    modality: must
    statement: Explicit development-registration removal tombstones the registered subject permanently, later registration including the same project or app id allocates a new subject and inherits no storage, audience, session, snapshot, Agent handle, or audit identity, while account, declaration-generation, and Runtime changes only invalidate affected ephemeral access and never imply removal; a source-generation change re-evaluates exact Host launch inputs and requires relaunch only when the executable, entrypoint, another security-relevant launch input, or the process fact changed, and app_id remains a display and routing identifier.
    condition: Whenever development registration lifecycle, session, declaration, Runtime, source, launch inputs, or app-id collisions change.
    failure: Reject tombstone revival, inherited identity, and app-id-based subject merging.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.registered-app-subject-record-plane
  - id: rule.nimi.runtime.app-surface.r055
    kind: rule
    title: The semantic lifecycle record seam binds one Registered App Subject
    modality: must
    statement: The Runtime-owned semantic lifecycle record seam binds one Registered App Subject to the current source and declaration generations and only the lifecycle and security-relevant Host launch facts needed to support Desktop launch and protected-session resolution, while physical type, field shape, serialization, and storage layout remain implementation; it contains no mutable-project integrity claim, binary attestation, payload fingerprint, account owner, credential, permission result, durable App access decision, session proof, Effective App Access Snapshot, Agent handle, or operation-owner policy.
    condition: Whenever a lifecycle record is created or read.
    failure: Reject lifecycle-record use when a required semantic relation cannot be resolved, excluded authority is embedded, or the record is treated as direct App access admission.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.registered-app-subject-record-plane
  - id: rule.nimi.runtime.app-surface.r056
    kind: rule
    lifecycle: removed
    title: Retired ordinary package subject non-admission
    reason: Removed because installed and local-import Apps now receive registered subjects through the common Runtime seam without moving installer, update, distribution, or marketplace semantics into App access.
  - id: rule.nimi.runtime.app-surface.r057
    kind: rule
    title: Owner stores stay separate behind a resolver
    modality: must
    statement: The durable Registered App Subject and lifecycle-record stores remain separate from ephemeral exact-launch correlation, process binding, session, Effective App Access Snapshot, and Agent-handle state, and a per-operation resolver may join current facts into an immutable context but cannot mutate another owner's store, persist a permission decision, or cache owner authorization.
    condition: Whenever owner stores are joined for an operation.
    failure: Reject cross-owner mutation and cached authorization results.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.registered-app-subject-record-plane
  - id: rule.nimi.runtime.app-surface.r058
    kind: rule
    title: Private preparation cannot become a second store
    modality: must
    statement: Private preparation is permitted before public cutover only when unreachable from production, unregistered as a public RPC or export, and not an active second store, while dual read, dual write, app-id positive fallback, record-embedded App access state, and permission state are forbidden.
    condition: Whenever pre-cutover preparation exists.
    failure: Reject reachable preparation, dual paths, and embedded grant state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.registered-app-subject-record-plane
  - id: rule.nimi.runtime.app-surface.r059
    kind: rule
    title: Account-scoped data keys are fixed
    modality: must
    statement: Account-scoped App-private JSON and asset data is keyed only by the Runtime-derived current AccountID within the stable Registered App Subject and remains partitioned from machine-local App identity; account switch selects another partition, switching back restores the prior partition, explicit Nimi data reset may remove it, and canonical LocalAgent, Conversation, transcript, presentation, Memory, and Knowledge truth remains with Runtime owners and is never repartitioned or owned by the Registered App Subject.
    condition: Whenever account-scoped app data or canonical identity is keyed.
    failure: Reject alternate keying and Registered-App-Subject ownership of canonical identity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.registered-app-subject-record-plane
  - id: rule.nimi.runtime.app-surface.r078
    kind: rule
    title: RuntimeAuthService responsibility is fixed
    modality: must
    statement: RuntimeAuthService owns authenticated Runtime session lifecycle and the common process-bound Local App identity session, while protected App operation admission remains Runtime-private and requires the verified exact Host origin, current session-derived App subject, fresh Runtime-private snapshot, exact AppOperationId classification, and the classified Base invariants or AppAccess-domain coverage before dispatch; after successful admission, the operation owner separately applies current resource and business policy and returns an owner-specific typed result, and admission success never implies owner success.
    condition: Whenever RuntimeAuthService responsibility is interpreted.
    failure: Reject permission or grant-family revival, deny before dispatch when any required Runtime admission input is missing or stale, and preserve owner rejection as an owner-specific typed failure rather than access success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r079
    kind: rule
    title: RuntimeAuthService does not own account custody
    modality: must
    statement: RuntimeAuthService is not responsible for local machine account session, login lifecycle, custody, refresh, logout, user switch, or daemon restart recovery because those authorities are owned by RuntimeAccountService, and protected-local origin, Desktop process verification, and control-session authority are owned by K-PLOCAL with the auth service only consuming its immutable origin context.
    condition: Whenever auth service scope meets account or protected-local authority.
    failure: Reject auth-service ownership claims over account or origin authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r080
    kind: rule
    title: Session families preserve their owner boundaries
    modality: must
    statement: Desktop account-control, Local App, ordinary authenticated, and separately admitted external-principal session families retain their existing owners and cannot confer origin or authority on one another; a Local App session exists only on the current exact Host connection after current launch correlation, process binding, Registered App Subject, and record validation, and concrete service or method membership remains implementation detail.
    condition: Whenever Runtime session responsibilities are defined or consumed.
    failure: Reject cross-family authority, Local App session creation outside the verified bound connection, and transport membership used as product authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r081
    kind: rule
    title: Protected session requests carry no caller authority
    modality: must
    statement: A protected Desktop or Local App session request accepts no app id, caller class, source host, subject, trust, launch correlation, process, account, snapshot, domain, operation, classification, or portable proof override and returns no portable authorization bearer; Local App renewal atomically replaces only the current short-lived session and Effective App Access Snapshot on the same verified exact Host connection after complete revalidation and does not repeat launch or create durable consent.
    condition: Whenever a protected session is opened or renewed.
    failure: Reject caller authority fields, portable bearers, and renewal used as a new launch or origin path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r082
    kind: rule
    title: App registration and declaration create no operation authority
    modality: must
    statement: Registration and declaration mutation establish only the stable Registered App Subject and current source and declaration generations and create neither a session, an Effective App Access Snapshot, nor operation authority; after Desktop verified launch, only a fresh exact Host session lets Runtime protected ingress derive the Runtime-private snapshot, and every protected operation still requires exact AppOperationId classification and the classified Base invariants or AppAccess-domain coverage before dispatch, followed by the operation owner's separate resource and business decision without a user grant or marketplace fact.
    condition: Whenever an App registers, updates its declaration, or opens a protected session.
    failure: Reject treating registration or declaration as admission, missing or stale generations, caller-authored snapshot facts, and operation execution without current Runtime admission and the owner's separate decision.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r083
    kind: rule
    title: Local App session lifetime is Runtime selected
    modality: must
    statement: Runtime selects a short-lived Local App technical session lifetime that the App cannot request, extend, or turn into durable authority; renewal requires a still-current session and complete current exact Host, account, generation, snapshot, and owner-independent admission revalidation and never upgrades origin or creates portable protected privilege.
    condition: Whenever a Local App technical session lifetime is established or renewed.
    failure: Reject caller-selected lifetime, stale-session renewal, origin upgrade, and durable or portable privilege.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r084
    kind: rule
    title: Revocation is idempotent and silent
    modality: must
    statement: RevokeSession and RevokeExternalPrincipalSession are idempotent, and repeated revocation returns OK without leaking whether the session ever existed.
    condition: Whenever a session revocation repeats.
    failure: Reject non-idempotent revocation and existence leakage.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r085
    kind: rule
    title: External principal proof maps to typed errors
    modality: must
    statement: RegisterExternalPrincipal validates the consistency of proof_type and signature_key_id, and OpenExternalPrincipalSession proof validation failures map uniformly to UNAUTHENTICATED with AUTH_TOKEN_INVALID.
    condition: Whenever an external principal registers or opens a session.
    failure: Return UNAUTHENTICATED with AUTH_TOKEN_INVALID on proof failure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r086
    kind: rule
    title: All auth methods write audit
    modality: must
    statement: Every RuntimeAuthService method writes audit for success and failure following the minimal audit field authority and retaining app_id, session_id, and external_principal_id where applicable.
    condition: Whenever a RuntimeAuthService method completes.
    failure: Reject unaudited completions.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r087
    kind: rule
    title: Issued tokens satisfy AuthN verifiability
    modality: must
    statement: Tokens generated or renewed by RuntimeAuthService satisfy the AuthN required-claims validation constraints and the AuthN algorithm and header constraints for verifiability.
    condition: Whenever RuntimeAuthService generates or renews a token.
    failure: Reject tokens failing AuthN verifiability constraints.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r088
    kind: rule
    lifecycle: removed
    title: Retired AppMode and grant ceiling
    reason: Removed because current Third-party App access derives from declaration domains and the canonical App operation contract without LITE, CORE_ONLY, FULL, scope ceilings, or grant admission.
  - id: rule.nimi.runtime.app-surface.r089
    kind: rule
    title: Local App sessions stay bound to the exact connection
    modality: must
    statement: A Local App session is created only on the verified connection already correlated with Desktop's current exact Host launch and bound to the current process, Registered App Subject, and record; the resulting short-lived technical session stays on that same connection and may be renewed only there after complete current revalidation.
    condition: Whenever a local-app session is created or renewed.
    failure: Reject creation or renewal outside the verified bound connection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r090
    kind: rule
    lifecycle: removed
    title: Retired AppMode and permission evaluation order
    reason: Removed because Runtime now evaluates verified exact Host origin, fresh protected session, declaration-derived snapshot coverage, and owner policy without a mode ceiling or permission decision.
  - id: rule.nimi.runtime.app-surface.r091
    kind: rule
    title: World relation is separate from App access
    modality: must
    statement: Any declared World relation is Realm or product relationship metadata owned outside Runtime App access and cannot create, widen, classify, or substitute for declaration-domain coverage, an AppOperationId, an Effective App Access Snapshot, or Realm owner business authorization.
    condition: Whenever Runtime encounters World relation metadata while deriving or enforcing App access.
    failure: Ignore it for App access derivation and reject any operation that depends on treating it as authorization.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r092
    kind: rule
    title: Non-App session expiry remains server bounded
    modality: must
    statement: A separately admitted ordinary or external-principal session may request a duration only within the owning server policy, uses the owner-defined duration when no request is supplied, and never upgrades its origin or becomes portable protected privilege; exact numeric bounds and configuration carriers remain owner implementation and configuration rather than App-access product authority.
    condition: Whenever a non-App session expiry is resolved.
    failure: Reject a duration outside current server policy and any expiry rule that upgrades origin.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r093
    kind: rule
    title: Stale App sessions cannot restore authority
    modality: must
    statement: Reconnect or refresh cannot restore a prior Effective App Access Snapshot by itself, separately admitted external principals never become the local account or verified Host origin, and all App and external-principal sessions become invalid after Runtime restart so clients must establish a fresh authenticated session and current snapshot or authorization state.
    condition: Whenever app or external-principal sessions are stored or restored.
    failure: Reject privilege restoration and cross-restart session revival.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r094
    kind: rule
    title: Account custody split stays with the account service
    modality: must
    statement: RuntimeAccountService owns local machine account sessions, per-user custody, and restart recovery, with callers, Desktop, and Apps never receiving durable account token custody; the physical custody path and platform mechanism remain implementation, recovery yields only current Account-owner truth without claiming resistance to same-user memory or file attacks, and ordinary or external-principal sessions never create local machine account truth from caller-supplied identity.
    condition: Whenever account session custody or restart recovery runs.
    failure: Reject caller custody, portable custody fallback, non-owner recovery truth, and account truth entry through App or external-principal sessions.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r095
    kind: rule
    title: Restart recovery differs per consumer
    modality: must
    statement: Runtime restart invalidates Desktop, Local App, and external-principal technical sessions, Effective App Access Snapshots, Agent handles, and streams but preserves current registered App subjects and records; Desktop and Local Apps rebuild the connection and bind fresh sessions against current launch, account, source-generation, and declaration-generation facts, while separately admitted external consumers re-open their own sessions without gaining local account or protected Host origin.
    condition: Whenever consumers recover from daemon restart.
    failure: Reject recovery flows that reuse stale carriers or bypass fresh connection, exact Host binding, session open, and current snapshot derivation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r096
    kind: rule
    title: External proof is JWT-only with a reserved slot
    modality: must
    statement: The proof_type supported by RegisterExternalPrincipal and OpenExternalPrincipalSession is JWT in Phase 1 verified through JWT signature verification, exp expiry checking, and iss issuer matching, and the proto enum freeze admits only EXTERNAL_PROOF_TYPE_JWT as the usable ExternalProofType value while the historical value slot 2 must stay reserved and is never reused.
    condition: Whenever an external proof type is declared or the proto enum evolves.
    failure: Reject non-JWT proof types and reuse of the reserved slot 2.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r097
    kind: rule
    title: JWT proof validation constraints are exact
    modality: must
    statement: signature_key_id must point to a public key registered through the RegisterExternalPrincipal signature_key_id association, the signature algorithm accepts only the RS256 currently declared by the generated Realm JWKS contract consistent with the AuthN algorithm constraints, the proof JWT must contain iat participating in temporal validation, nbf when present participates in validation with the AuthN ±60s skew, the maximum proof JWT lifetime is fixed at 24h so exp minus iat is at most 24h with overruns failing closed, expired tokens map uniformly to UNAUTHENTICATED with AUTH_TOKEN_EXPIRED, issuer mismatches map uniformly to UNAUTHENTICATED with AUTH_TOKEN_INVALID, and unsupported proof types return INVALID_ARGUMENT with AUTH_UNSUPPORTED_PROOF_TYPE.
    condition: Whenever an external principal JWT proof is validated.
    failure: Fail closed with the mapped typed statuses.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r098
    kind: rule
    title: Developer registration stays physically absent
    modality: must
    statement: The predecessor developer-registration request gate is retired and physically absent from every supported interface, no ignored field, alias, compatibility decoder, or alternate request intent may preserve its semantics, and ordinary App registration cannot by itself create a development project decision, account caller, verified launch correlation, Local App session, Effective App Access Snapshot, or operation success; concrete field reservation remains protocol implementation rather than App-access product authority.
    condition: Whenever App registration shape or capabilities evolve.
    failure: Reject predecessor semantics revival and registration-only authority creation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r099
    kind: rule
    title: Local development has no compatibility entry
    modality: must
    statement: Local development enters only through the Desktop-owned Developer Mode workflow and source and declaration evaluation, the Runtime K-APP-owned canonical registration record, Registered App Subject, and source and declaration generations, Desktop-owned exact Host launch and process supervision, and a fresh protected Runtime App session; predecessor registration flags, environment, CLI, configuration, registration alone, app id, declaration alone, ordinary App session, metadata, and temporary bearers do not exist as compatibility access paths, and predecessor shapes are not decoded.
    condition: Whenever local development entry paths are evaluated.
    failure: Fail schema validation and reject compatibility decoding.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
  - id: rule.nimi.runtime.app-surface.r100
    kind: rule
    title: Installed local-import and development Apps share one access seam
    modality: must
    statement: Installed, local-import, and development Apps, when separately admitted and made runnable by their owning lifecycle entry, create or update a Registered App Subject, source generation, and declaration generation and then use the same verified Desktop exact Host launch, fresh protected session, Effective App Access Snapshot derivation, canonical App operation contract, and owner-execution path; source-specific installer, import, update, distribution, and marketplace behavior remains outside this seam.
    condition: Whenever a separately admitted App source becomes runnable or requests protected Nimi access.
    failure: Reject source-specific access semantics, direct Runtime or Realm fallback, and installer or marketplace facts used as operation authority.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-lifecycle-plane
      - type: applies_to
        target: definition.nimi.runtime.app-surface.auth-service-plane
      - type: applies_to
        target: definition.nimi.runtime.app-surface.registered-app-subject-record-plane
      - type: supersedes
        target: rule.nimi.runtime.app-surface.r003
