format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.remote-access
units:
  - id: rule.nimi.runtime.remote-access.direct-transport
    kind: rule
    title: Direct data channels preserve the existing typed Runtime operations
    modality: must
    statement: The first direct carrier uses one ordered reliable WebRTC DataChannel named nimi-runtime-v1 with protocol nimi-runtime-protobuf-v1. Operator-supplied candidate discovery contains only STUN or STUNS host-and-port URIs without credentials; TURN URLs and relay candidates are rejected, and an unreachable direct path reports unavailable. Runtime proto owns the request, response, stream, error and cancellation frame. Each frame contains at most 16 KiB of payload, one assembled message permits at most 32 MiB of content plus the existing 1 MiB envelope allowance, and a peer has at most sixteen active calls; request fragments are contiguous and use strictly increasing nonzero uint32 request ids so repeated requests cannot dispatch again. Method identity is classified by Runtime; frames carry no caller Account, App, role, native profile, credentials or permission. Timeout, trace and idempotency-key fields are bounded non-authorizing call controls. The existing typed SDK idempotency metadata is preserved without adding a generic replay cache or automatic resubmission.
    condition: When an approved current source exchanges Runtime data with its primary PC.
    failure: Reject invalid, oversized, replayed, unclassified or unauthorized frames before dispatch, preserve actual owner errors, and close expired or disconnected peers without a relay, transparent stream recovery, synthetic native proof or fake AI result.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.remote-access.source-plane
  - id: definition.nimi.runtime.remote-access.source-plane
    kind: definition
    title: Confirmed remote source and direct peer
    meaning: A remote App source uses the existing Runtime canonical registration, stable Registered App Subject, declaration and source generations under source class remote. Its Registry identity and revision are source facts, not package bytes, native process facts or Account permissions. The Account and primary-binding-specific source access relation remains separate from canonical registration. A direct peer is Runtime-private verified connection state bound to the current Realm user context and primary generation; it is not a caller-supplied App principal or a portable protected credential.
  - id: rule.nimi.runtime.remote-access.source-admission
    kind: rule
    title: Remote sources reuse registration and operation admission
    modality: must
    statement: Home first enables remote access and confirms a new source with its Registry App identity, origin and declared capability range. Persisted confirmation is scoped to Account, primary binding and application/source revision, never browser or device; source pause and resume preserve data, while a material source revision change requires confirmation. Registration facts and source confirmation commit atomically in the existing registration owner store. Persistent management changes use the existing audit commit boundary and distinguish committed effects from an unrecorded audit result. Runtime registers that exact verified source in its existing registration owner with no fake path, executable, package or native PID, preserves its stable subject and generation rules, and derives the existing AppAccess snapshot and exact AppOperation mapping for ordinary App calls. Unknown declaration names stay inert until a new source or declaration generation. Configuration remains Account by canonical App ID, so explicitly registered Web/native clients of one App use the same AIConfig owner. Registry official_manager qualification is distinct from App declaration and requires current primary ownership, confirmed source and a verified management session for each connection. Client context loss or source pause prevents new access and closes affected live streams; already accepted durable jobs retain the existing Job owner's execution and observation rules. Data, credentials and business workflows are not migrated or synchronized by this access relation. Remote App storage and LocalAgent operations revalidate the same private peer through the common ingress entry and retain the existing Account and canonical-registration final publication gates, with peer closure replacing only the native technical-session fence. Agent handles remain peer scoped; reconnect obtains fresh handles and never replays old business calls.
    condition: When a remote source is confirmed, paused, resumed or admitted to a Runtime operation.
    failure: Reject unconfirmed, paused, changed, unregistered or self-asserted source, account, role or connection before owner dispatch; never invent local process evidence, grant domains from a role or source name, silently reopen another host's record, or create a separate generic authorization engine.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.remote-access.source-plane
  - id: rule.nimi.runtime.remote-access.primary-control
    kind: rule
    title: Private host control is account bound and time limited
    modality: must
    statement: The opted-in Runtime binds its current authenticated Account generation and Realm primary identity to the privately held host key. Registration, signed Redis-only heartbeat, conditional signaling sync and exact answer use generated Realm carriers. Heartbeat tracks recent contact and a signaling revision without refreshing Account credentials or extending peer rights. Runtime only applies sync for the current control session and keeps one sync in flight. Pending work or active peers trigger bounded authorization checks. Each peer deadline derives from its validated context and the Realm authorization time, at most sixty seconds from the monotonic request start. An omitted context, changed binding, expired authorization or local Account invalidation ends the affected connection. Source confirmation, AppAccess, owner execution and no business replay remain in force.
    condition: When the Runtime maintains or consumes its opted-in primary control connection.
    failure: Reject missing key custody, stale account or binding, invalid proof, excessive expiry or malformed owner projection without publishing an active or AI-ready state; no native process identity or user approval is synthesized.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.remote-access.primary-host
  - id: definition.nimi.runtime.remote-access.primary-host
    kind: definition
    title: Runtime primary host identity
    meaning: Runtime owns its private Ed25519 host identity in the verified service secret store, scoped to the current Realm environment and Account, and consumes Realm's unique primary binding without creating a second account binding truth. A pending proposed identity is separate from the established identity until Realm confirms its exact identity and public key; neither read nor preparation is remote App admission or AI execution.
  - id: rule.nimi.runtime.remote-access.primary-host-control
    kind: rule
    title: Home prepares primary binding without receiving the private key
    modality: must
    statement: GetPrimaryRuntimeState and PreparePrimaryRuntime require the current verified Desktop account product context and the matching live Runtime Account generation. These Home operations use only generated Realm getMyPrimaryRuntime and prepareMyPrimaryRuntime carriers, derives Account and Realm identity from owner custody, and signs Realm's canonical primary-host proof with a stored private key. Prepare accepts only bind or reinitialize, an expected binding generation and a bounded display name; it rechecks the current Realm generation, retains an established host identity while a replacement is pending, persists a proposed key before sending the proof and returns only the official Realm-issued intent id, confirmation URL and expiry. The user confirms through the official account website; the Runtime derived login does not assert fresh user presence. Reads project actual binding facts and never a running, ready or connected AI state. Keys never enter renderer, SDK projection, URL, logs or ordinary App calls. Missing native custody or Realm owner fails closed.
    condition: When the Home requests primary Runtime status or a binding preparation.
    failure: Reject a public or App caller, stale Account generation, source key mismatch, changed binding generation, malformed owner response or missing custody before reporting success; never synthesize a Realm binding or silently replace a key.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.remote-access.primary-host
  - id: rule.nimi.runtime.remote-access.operation-carrier
    kind: rule
    title: Remote operations preserve owner admission and supported subsets
    modality: must
    statement: Remote AI media inputs use inline content or App-owned artifact references; raw typed media URL/URI inputs are unavailable in this first carrier and never delegate arbitrary PC or private-network reads. Business JSON and prompt text remain content. Unary, server-stream and the incremental App asset-write client-stream operation use the existing protobuf requests and owner handlers, AppAccess classification, resource policy and Job state; the app.activity carrier admits publication, listing, change subscription, read markers, online-only open and source-open subscription/completion through the original account-scoped owner. A remote participant never gains a Desktop launch target, and source navigation requires an already-online handler with no replay across loss. The same carrier admits only the existing fixed WorldCore creator operations (eligibility, world list/get/create/replace, character list/get/create/replace, entity list/get/create and relationship list/get) and the five owner PersonaCharacter operations through the existing Runtime Account Realm broker and exact AppOperation classification under realm.data; caller credentials, caller identity and Realm base selection remain rejected by the owner, and no general Realm method, account management or publication lifecycle is added. World creation still requires the independently enforced Realm account authorization; unsupported carrier operations remain unavailable rather than creating a permanent Web permission class.
    condition: When an admitted remote App invokes an existing Runtime operation.
    failure: Reject unsupported carrier operations, raw media URL/URI inputs or unauthorized resources before dispatch; preserve the existing owner decision without a new permission class or business proxy.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.remote-access.source-plane
  - id: rule.nimi.runtime.remote-access.asset-write-stream
    kind: rule
    title: Remote asset input uses bounded credits and explicit termination
    modality: must
    statement: App asset writes use CLIENT_STREAM_OPEN for the first existing method request, CLIENT_STREAM_DATA for subsequent requests, and an explicit CLIENT_STREAM_END for input EOF. Each encoded input message is bounded to the existing 1 MiB asset chunk plus an 8 KiB protobuf allowance and uses the same 16 KiB transport fragments; Runtime grants at most four input-message credits, replenished as the owner receives messages, so neither side accumulates a whole file. The first method message is authorized before the owner requests body input. Only the existing asset-write RPC admits this carrier shape. Total file size, path, media metadata, quotas and atomic final commit remain with the original storage owner. Cancel, source loss, timeout or disconnect supplies an error rather than EOF and cannot publish a partial file. Early owner rejection stops input production and preserves the actual error; credits authorize buffering only, never permission or request replay. New calls retain strictly increasing ids while upload messages may coexist with other calls. There is no upload resumption, bidirectional business RPC or automatic resubmission. The aggregate RemoteClientStreamRequest envelope is not an admitted input carrier.
    condition: When a remote App streams an asset-write request.
    failure: Reject invalid stream shape or exhausted input credit, preserve early owner errors, and prevent cancellation, source loss or disconnect from committing a partial asset.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.remote-access.source-plane
  - id: rule.nimi.runtime.remote-access.connection-lifetime
    kind: rule
    title: Remote connection loss ends live calls without replay
    modality: must
    statement: A disconnected stream ends and a lost response never causes automatic business resubmission. Local source pause, user-context loss, expired authorization or host shutdown closes the peer and its live calls; closing a remote client never stops the host.
    condition: When an established remote connection or its authorization ends.
    failure: Close affected live calls and preserve the existing durable Job rules without replay, transparent stream continuation or stopping the host from a client disconnect.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.remote-access.source-plane
