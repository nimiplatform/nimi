format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.agent-life
units:
  - id: definition.nimi.runtime.agent-life.frame-timeline
    kind: definition
    title: Bounded LocalAgent life timeline
    meaning: "Runtime owns one revisioned bounded life state per LocalAgent: immutable established history, at most one current simulated or actual interaction frame, tentative future frames and stable self-intentions across segments. Life timestamps and durations use elapsed real time on the Runtime clock. Interaction is life, independent of one model turn. Accepted identity, timing and progress are distinct from qualified explanations. Simulated life never establishes external effects."
  - id: definition.nimi.runtime.agent-life.life-context
    kind: definition
    title: Purpose-specific compressed life context
    meaning: Runtime compiles minimum accepted activity state and bounded optional explanations for later life and Conversation inference, retaining the latest settled frame and next tentative frame between active intervals. Private life planning uses one leading system envelope preserving typed source and trust boundaries and a final Runtime planning instruction, without a fabricated user input lane or Conversation record. Its synchronous text.generate wire request uses strict JSON Schema for a JSON object with the current planning bounds. A separate contact-only judgment uses JSON Object mode. The exact configured behavior must be admitted; an unsupported contract is unavailable without a target switch or parser repair. Explanations retain the actual source read set through compression; Conversation input selection and Cognition Memory lifecycle are different controls and neither grants a second Memory owner.
  - id: definition.nimi.runtime.agent-life.utopia
    kind: definition
    title: Effective LocalAgent Utopia
    meaning: Utopia is the single active simulation habitat setting owned by Runtime for the current account and active data root. It validates and persists a bounded self-describing HabitatSpecV1 with a canonical content digest, activation identity, account IANA timezone, theme enum, mandatory always-open private personal quarter carrying at least one unconditional all-day solo fallback activity, conditional public places, daypart-and-parameter-gated activities, bounded parameters, and dual-slot time-bounded preset and custom ambient events, resolving a built-in default seaside-island habitat on lawful absence without writing on read. It separates UI-only display prose from model-visible closed enums and bounded short labels that remain untrusted data regardless of punctuation or length, expresses fictional scenery independently of the original Realm World and real clock, and leaves foreground interaction frames unlocated.
  - id: definition.nimi.runtime.agent-life.public-activity
    kind: definition
    title: Account-scoped public life
    meaning: Public life is simulated public-place occupancy and bounded decisions visible within the same account's Utopia to eligible opted-in LocalAgents and to the current account through an authorized observation surface. Runtime assigns public occupancy only from accepted simulated activity in open public places, never aggregating per-Agent private personal quarters into public occupancy or co-presence, and projects only validated habitat activity labels or fixed neutral placeholders without exposing private frame titles. Current co-presence is derived from eligible participants actually occupying the same open public place in a single snapshot and creates no separate history or model call.
  - id: definition.nimi.runtime.agent-life.shared-arrangement
    kind: definition
    title: Shared life arrangement and established facts
    meaning: One Runtime-owned record connects two eligible LocalAgents to a supported shared_invite habitat activity, its open public place, activation identity, frozen creation-time habitat, place and activity display labels, offered time window within the activity's configured duration bounds, response deadline, accepted agreement and any actual simulated participation. Individual timelines may refer to the shared record and resolve its frozen display labels. Invitation, independent response, established participation, same-habitat invalidation or interruption, and cross-habitat relocation outcomes (relocated before start and relocated_partial after settling established overlap) are distinct facts; none establishes an external meeting, delivery or Conversation.
  - id: definition.nimi.runtime.agent-life.proactive-intent
    kind: definition
    title: Source-qualified proactive expression
    meaning: Runtime distinguishes optional ordinary-reply initiative, finite extra Conversation continuation and autonomous contact judgment from solitary life simulation. They reuse the same execution and budget owners; self-intentions are mutable Agent directions, not user tasks or fulfillment commitments.
  - id: rule.nimi.runtime.agent-life.timeline
    kind: rule
    title: Accepted frames advance without repeated inference
    modality: must
    statement: Runtime advances accepted simulated frames without inference only when their time, source, intention and prior progress remain valid. Actual admitted conversation, supported voice participation and bounded App work occupy the present; first admission settles only the established part of the old current frame and interrupts its remaining interval. During interaction no autonomous frame promotes or settles. Preserve unrelated future identities, content, ordering and valid intentions; overlapping or missed frames did not occur and cannot supply progress to later segments of the same intention. A turn terminal does not close interaction. After a bounded 120-second real-time silence opportunity, recheck current activity, generation and participation under the same owner; in-flight output and known media execution prevent false silence. Deterministic review resumes or waits for valid future coverage with zero new planning calls. New chat text alone does not force replanning. First enable starts now; disabled and known-interaction intervals never become simulated backlog. Disabling simulation does not disable ordinary replies, same-turn self-intentions or independently permitted contact. Personal life planning, catch-up, advancement and actual participation use Runtime real time and preserve established time boundaries across clock rollback. Valid source World time is provenance and setting only, including a static mode or an authored ratio or pause.
    condition: Whenever Runtime starts, advances, pauses or recovers LocalAgent life.
    failure: Reject overlapping current frames, backward settlement, fabricated pre-enable history or external effects, and consumer-authored timeline progression.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-life.frame-timeline
  - id: rule.nimi.runtime.agent-life.utopia-settings
    kind: rule
    title: Resolve one default habitat and atomically reconcile environment or relocation changes
    modality: must
    statement: Runtime resolves the built-in default seaside-island HabitatSpecV1 on lawful absence without writing on read, and upgrades legacy preset rows deterministically on read without corrupting existing timelines. Activating a validated HabitatSpecV1, restoring the default habitat, atomically applying parameter and bounded ambient-event tuning, updating the account IANA timezone, changing public participation, or setting an Agent's solitude is a compare-and-swap against one effective account settings revision. Effective habitat switches mint a fresh activation identity, freeze bounded historical display labels, mark unstarted old-habitat invitations and agreements relocated, atomically settle established overlap of active joint participation as relocated_partial, and record bounded per-Agent relocation awareness from the actual included input, consumed atomically with a committed frame or assistant turn only when its captured activation still matches; failed, canceled or stale turns never consume a newer relocation. Same-habitat parameter changes closing a place or making an activity ineligible invalidate unstarted arrangements and interrupt affected active simulated frames while settling established elapsed time. Solitude excludes every public-place activity, including solo activities, and interrupts existing public-place simulated frames without affecting foreground interaction. Account timezone changes revalidate unstarted agreements at their scheduled start, and actual shared start rechecks the current daypart; elapsed-window misses remain distinct from environment invalidation. Ambient events take effect immediately within bounded durations, expire logically on read without idle write locks, and clean up physically on state writes. Background results and generated contact delivery retain the actual selected event identities and expiry times, evaluate time after owner-lock acquisition, and recheck expiry inside the serialized write transaction after any writer wait; stale effects roll back atomically while actual usage remains accounted exactly once. Appearance and view filters have no effect on life, and resolution failure remains distinct from lawful absence.
    condition: Whenever the current Utopia is resolved, changed or used to admit a dependent result.
    failure: Reject missing scope, malformed or deadlocked HabitatSpecV1 inputs, stale writes and ineligible effects without partial tuning mutation, substituting an arbitrary location, or creating a fallback configuration.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-life.frame-timeline
      - type: applies_to
        target: definition.nimi.runtime.agent-life.utopia
  - id: rule.nimi.runtime.agent-life.public-decision
    kind: rule
    title: Make bounded public decisions reachable in the existing Runtime scan
    modality: must
    statement: Public participation is off until explicitly enabled for the account and excludes individual LocalAgents marked solitary, ineligible or with autonomous life disabled. Ending eligibility removes public occupancy and invalidates affected pending and future effects. Within the normal life scan Runtime separately considers bounded deterministically truncated eligible public options and valid pending invitations. Use the existing per-Agent minimum attempt interval, background budget, configured text.generate route and single execution occupancy with normal cancellation, actual release and foreground precedence. Give an eligible pending response one opportunity ahead of personal replenishment even with an active personal frame, sufficient future coverage or a later personal check time. The accepted personal timeline continues to advance. Only already committed eligible public facts, closed enums, short untrusted habitat labels and current parameter facts, typed options and expressly allowed public source display summaries enter public inference. Runtime may use private availability internally to omit unusable options without disclosing the underlying plan. Do not use habitat display prose, private plans, text, Recall, raw lorebook, summaries, explanations or App work output as public material. App reads and public record delivery do not request immediate inference.
    condition: Whenever Runtime considers, executes or commits a public life choice or projects public occupancy.
    failure: Reject unauthorized or stale inputs and results, preserve existing personal life, and represent lack of admission or an expired invitation truthfully.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-life.public-activity
      - type: applies_to
        target: definition.nimi.runtime.agent-life.utopia
  - id: rule.nimi.runtime.agent-life.shared-activity
    kind: rule
    title: Commit an invitation, independent acceptance and actual participation separately
    modality: must
    statement: Runtime gives the initiating Agent a choice among authorized partners, a currently open shared_invite habitat activity within its configured duration bounds, and available future windows. Issuing an invitation freezes the habitat activation identity and display labels and commits its fact without holding the proposed window. The recipient alone can commit one independent response to that valid invitation. A response that was dispatched with unknown outcome is not replayed. The answer deadline precedes the activity's start, with at least one ordinary eligible opportunity possible under current minimum interval and scan cadence when offered. The scheduled end is at most 24 real hours after issue. Acceptance atomically checks the current identity, account, root, execution generation, Utopia activation and open conditions, authorization, time and each Agent's available window, then stores the shared arrangement and both timeline references. At most one pending invitation or accepted ongoing arrangement can involve each Agent at a time. At a scan inside the window, Runtime verifies both partners and starts both at one actual confirmation time. Only established overlap is settled. Missed or unconfirmed offline time does not establish joint participation. Revalidate future agreements on recovery and preserve confirmed facts and relocation terminal distinctions. Start, interruption, relocation closure and settlement advance through owner commits without another model call or a synthetic user turn.
    condition: Whenever a directed shared-life invitation or arrangement is accepted, advanced, interrupted, relocated or recovered.
    failure: Decline, expiry, same-habitat invalidation or interruption, cross-habitat relocation outcomes, and a missed arrangement remain distinct from completed activity; reject partial or duplicated writes and late results.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-life.frame-timeline
      - type: applies_to
        target: definition.nimi.runtime.agent-life.public-activity
      - type: applies_to
        target: definition.nimi.runtime.agent-life.shared-arrangement
  - id: rule.nimi.runtime.agent-life.shared-fact-retention
    kind: rule
    title: Bound direct shared records and preserve committed Conversation
    modality: must
    statement: Runtime gives participants only the directed facts they may know and the current authorized account observation surface only bounded shared records with frozen creation-time display labels. Retain at most the twelve most recent closed shared records for the account and at most 24 real hours after closure. Expiry or removal ends direct reads and dependent pending operations. Conversation drafts from currently readable facts remain local UI state until explicit user submission and only then enter the ordinary Conversation. Committed Conversation follows existing history, summary, life input, Memory and Forget rules. Shared activity adds no direct long-term Memory delivery and no automatic import or removal of Conversation turns.
    condition: Whenever a shared record is read, retained, removed or transcribed into a conversation draft.
    failure: Withhold expired or unauthorized direct facts, reject pending effects using invalid references, and preserve the existing lifecycle of committed turns.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-life.shared-arrangement
  - id: rule.nimi.runtime.agent-life.catch-up
    kind: rule
    title: Missing time is filled once within known bounds
    modality: must
    statement: Runtime may fill at most one bounded still-open unknown interval using material known then and still eligible now, fenced below by the active habitat's activation timestamp and any ambient event's start timestamp so newly activated habitats or scenery events are never backdated into earlier offline time. It preserves established facts, known interaction and accepted coverage, excludes pre-enable and disabled intervals, and never treats missed future plans as occurrence evidence. Relative retrospective positions map inside the assigned interval; successful settlement closes omitted ordinary time without per-tick debt. Occurrence, first-known and record times remain distinct and simulated experience remains inferred. Recovery restores known boundaries without reviving execution locks or inventing continuous participation across an unknown offline tail. Valid future coverage may leave one admitted life judgment for bounded retrospective continuity; important already-established experience delivery does not wait for optional catch-up.
    condition: Whenever execution resumes after a gap or an inference proposes retrospective frames.
    failure: Reject proposals outside the Runtime-assigned interval, duplicated coverage, invented delivery or tool results, or disabled-period backlog.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-life.frame-timeline
  - id: rule.nimi.runtime.agent-life.replacement
    kind: rule
    title: Changes replace only eligible future activity
    modality: must
    statement: A private FutureFrameUpdater proposes future and self-intention changes using a qualified snapshot; it owns no loop, public API, current or history writes. The timeline owner validates the actual read set and relevant current permissions, maps future positions from the real commit-time available present and accepts atomically. Preserve unrelated valid future frames and stable intention references; reject jumps across unestablished prior progress. Interaction fences conflicting in-flight simulation while retained valid future remains usable. A merely appended N+1 input does not invalidate unchanged reads and is not consumed by a result based on N. Only actual completion or accepted abandonment ends an intention. Intent changes and directly affected unoccurred future update in one commit, before dependent confirmation. Established history cannot be rewritten or expired arrangements shifted wholesale.
    condition: Whenever a qualified life proposal, same-turn self-intention or actual participation changes the timeline.
    failure: Reject stale results, rewritten past, lost activity references, unauthorized controls and success assertions before the owner commit.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-life.frame-timeline
  - id: rule.nimi.runtime.agent-life.context
    kind: rule
    title: Context selection does not revoke accepted life and isolates habitat prose
    modality: must
    statement: The shared compiler selects by ordinary Conversation, life or contact purpose while physically excluding habitat and ambient-event display prose from all model-facing prompts. Conversation and autonomous contact judgment retain safe current life, resolved shared-activity labels, bounded current Utopia habitat posture using closed enums, current parameter labels and selected option labels, short untrusted display labels, and accepted self-intentions; independent App work receives zero Utopia injection. Private life planning retains required Character, World, accepted activity, unfinished intentions, and pruned currently open Utopia places, eligible daypart-checked activities and active scenery short tags under UTF-8 sub-budgets of 2048 bytes for private planning and 1536 bytes for Conversation/contact posture, preserving required current parameter facts and a legal fallback activity; multi-segment future proposals crossing into ineligible dayparts commit valid prefix segments and truncate invalid trailing segments, and every located proposal must satisfy its activity duration bounds at the owner commit. Any consumed chat follows current selection, while Memory eligibility follows its independent owner, and frames referencing custom ambient scenery emit no external Cognition memory assertions; this source mark is captured from the actual model input before execution and preserved on retrospective and unlocated frames, derived explanations and activity identities, including continuations and self-intention changes, rather than recomputed from commit-time scenery. Later inference consuming those derived pieces carries the mark through event expiry and restart; optional text omitted by the compiler contributes no source mark, and pruning all such pieces permits unrelated clean work without a permanent Agent-wide taint. This restriction concerns simulated Life assertions and does not replace the independent policy for committed Conversation memory. Short-label lexical validation does not certify noun semantics or prompt-injection resistance; all creator labels and parameter text remain explicitly untrusted inside Runtime-owned context boundaries, never granting instruction, identity, tool or Memory authority. Actual model-content robustness remains separate from deterministic input and effect validation. Selection alone never revokes established activity or increments LifeState. Accepted own intention identities and names are Agent-owned state; reading a Memory does not by itself taint those names. Source-dependent unoccurred frame proposals and explanations remain qualified without rewriting independent established names into anonymous placeholders. Memory correction, Forget, disable and deletion invalidate actual reads, uncommitted effects and derived explanations under existing lifecycle ordering; independent established experience remains distinct. Compression retains bounded read sets and drops old derived text with its references rather than laundering it. No Recall or AI I/O occurs under commit locks. Background admission estimates the final entire compiled input, schema and adapter overhead plus the unchanged positive output cap, recalculating after optional pruning. A window too small for any legal call reports insufficiency without futile retries.
    condition: Whenever Runtime compiles, compresses, commits or invalidates life-related input.
    failure: Reject stale-source effects, hidden excluded chat material, discarded life caused only by input selection, derived Memory duplication, direct Cognition storage reads or new parallel Memory truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-life.life-context
  - id: rule.nimi.runtime.agent-life.proactive-execution
    kind: rule
    title: Proactive success requires a real Conversation commit
    modality: must
    statement: Extra follow-up and new contact judgment share one default-off contact switch, quiet hours, bounded attempt frequency and one background budget, independently of simulation enablement and life planning cooldown. With valid expression intent, at most one extra continuation is sent without a new user response; self-output, delivery, new plans or changed reasons never reset that chain. Normal replies and same-turn intention-result continuation need no contact permission. One bounded contact-only generation produces either the actual public message or no-send, without simulation or future effects. A produced message reuses the canonical Conversation commit without a second generation to rephrase an intention; its already charged generation cost is not charged again for delivery. No-send charges actual usage and consumes only considered contact positions, without a message, send count or interaction refresh. Budget exhaustion blocks new generation rather than discarding an already generated message; contact permission, source validity and cancellation remain commit conditions. Disable retires pending contact intentions and considered-position backlog and fences in-flight contact effects; disabled periods accrue no contact debt and re-enable starts at current known positions. New opportunities may use eligible old Memory without replaying old sends. Life and contact share bounded coordination but never consume each other’s pending positions. First authorized expression ensures the same unique Conversation without fake credentials or a synthetic user message. Only canonical message commit establishes sent. Background work yields to foreground only after real execution release; failure, cancellation and no-send retain actual costs.
    condition: Whenever Runtime admits, executes, commits or recovers a proactive expression.
    failure: Reject source confusion, duplicate sends, anchor prerequisites imposed by Apps, fabricated success, stale policy commits, fake resource release or cancellation of unrelated foreground or App work.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-life.proactive-intent
  - id: rule.nimi.runtime.agent-life.self-intention
    kind: rule
    title: Optional self-intentions commit before dependent confirmation
    modality: must
    statement: "Ordinary text or supported Realtime generation may optionally propose one narrow Agent self-intention: a bounded self-owned direction or a change to an existing intention, with no user task, recipient, schedule, tool, configuration or fulfillment fields. Ordinary valid replies remain usable without a suggestion or optional structured capability and with an invalid suggestion; no mandatory classifier, extraction or explanation call is added. Independent public content, private suggestion and dependent confirmation are separate. The same Runtime owner atomically persists intention, directly affected unoccurred future and a minimal result bound to original InputTurnID before projecting or speaking dependent confirmation. Invalid, stale or pre-commit canceled proposals have no effect and no success confirmation; post-commit reply interruption preserves the result. Recovery reads the original result and regeneration only restates it, never replays mutation. Current OpenAI and DashScope Agent Realtime audio and typed text use the fixed private native suggestion/result seam; suggestion-only response retains the original user turn and permits at most one result continuation, with no second suggestion. Ordinary media stays streaming even when a native suggestion also appears in the response. Invalid suggestions and duplicate or late calls cannot mutate state, but do not fail an otherwise usable conversation or inject validation messages. Each actual response usage is accounted. Ordinary text or audio is never parsed as private state or semantically certified against state; model wording does not establish a persistent effect. No whole-reply buffering, additional checking model or keyword-based speech policing is introduced."
    condition: Whenever a normal LocalAgent interaction offers or presents a persistent self-intention.
    failure: Reject unauthorized or stale state changes, replayed mutations and arbitrary tool control; omit an unaccepted conditional confirmation while preserving ordinary content and the live conversation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-life.frame-timeline
