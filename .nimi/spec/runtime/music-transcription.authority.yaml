format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.ai-provider
units:
  - id: definition.nimi.runtime.ai-provider.music-transcription
    kind: definition
    title: Music transcription is an estimate of an existing recording
    meaning: music.transcribe estimates symbolic musical structure from an owned canonical audio source or its explicit half-open frame range. It is distinct from lyric or speech recognition, new music composition, deterministic ABC or MIDI conversion, and faithful singing synthesis. Its estimated scores and timeline never replace the original audio or assert acoustically verified melody, harmony or singer identity.
  - id: rule.nimi.runtime.ai-provider.music-transcription
    kind: rule
    title: Music transcription has bounded typed inputs and complete owned outputs
    modality: must
    statement: MUSIC_TRANSCRIBE uses music.transcribe and MODAL_MUSIC with ASYNC_JOB through the existing protected ScenarioJob operation family. Input contains exactly sourceAudio as an owned canonical MusicAudioInput, a nonempty duplicate-free requestedFormats set drawn from abc, midi and timeline, and a nonempty duplicate-free requestedParts set drawn from vocal-melody, lead-sheet, full-arrangement and note-events. The note-events part estimates possibly polyphonic note onsets, exclusive ends and MIDI pitches in the selected source interval without promising human voice, instrument, harmony or arrangement roles; the meanings of the other three parts are unchanged. Runtime authorizes and captures the immutable audio, source frame facts, requested range, selected exact Driver and complete ResolvedAssembly before publication; no prompt, lyrics, model, path, tokenizer option or output conversion is accepted as a substitute. Exact Driver profiles admit only implemented combinations, with canonical audio bounded to 600 seconds and 512 MiB, and missing input-capability projection means unknown. Success atomically commits every requested score format and part, plus the requested timeline, and returns their references with transcribed-estimate origin, original source artifact identity and AudioInfo, the analyzed input frame range and explicit completeness of unknown, complete or truncated from real engine evidence. A processed input window or last event timestamp never establishes complete transcription; missing evidence remains unknown. ABC is at most 1 MiB, MIDI and timeline each at most 16 MiB, and unsupported requested output fails rather than silently converting or omitting it. The original audio is unchanged; outputs contain no generated audio or invented confidence, lyrics, voice identity or expressive-control claim.
    condition: Whenever Runtime, SDK, Kit or a protected App admits, executes or projects music.transcribe.
    failure: Reject unowned or noncanonical input, invalid ranges or closed-set fields, unsupported format and part combinations, malformed output, missing requested artifacts or invalid captured state; publish no partial success or pseudo-transcription.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.capability-contract
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.canonical-audio
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.music-transcription
  - id: rule.nimi.runtime.ai-provider.music-transcription-timeline
    kind: rule
    title: Estimated music timelines use source frames and normalized musical events
    modality: must
    statement: A requested music timeline is one application/vnd.nimi.music-timeline+json artifact using schema version 1, original source artifact identity, measured source AudioInfo and analyzed half-open input range, with at most 100000 ordered events on that source frame timeline. Event kinds are note, beat, chord, key and section. Notes contain integer MIDI pitch, nonnegative track index and start and exclusive end frames; beat markers contain source frame and a reported position in eighth notes from the downbeat with meter only when observed; chord and key labels use bounded normalized musical notation and section labels use bounded text decoded by the exact Driver. The Driver translates actual model timestamps and symbolic vocabulary, applies the captured source-range offset once, bounds events to the analyzed source interval and validates finite timing, legal pitches and field-specific shapes. Native tokenizer ids, duration bins, provider payloads, local paths, free-form metadata and fabricated velocity or confidence are excluded. Deterministic note-time rounding is a frame projection of an estimate, not a sample-preserving audio edit.
    condition: When a music transcription requests or consumes a timeline artifact.
    failure: Reject unversioned or oversized timelines, unknown fields or event kinds, invalid source facts, nonmonotonic or out-of-range times, incomplete note spans and undeclared native vocabulary instead of forwarding raw model JSON.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.canonical-audio
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.music-transcription
  - id: definition.nimi.runtime.ai-provider.music-note-events
    kind: definition
    title: Note events estimate pitches and spans without musical roles
    meaning: A note-events transcription estimates possibly overlapping note pitches and time spans from an existing owned audio interval without claiming vocal melody, instrument identity, voice separation, harmony or complete arrangement. Its MIDI and source-frame timeline are two serializations of the same estimated note sequence, not deterministic transcription of a supplied symbolic score.
  - id: rule.nimi.runtime.ai-provider.music-note-events-output
    kind: rule
    title: Note-event MIDI and timelines preserve the same estimated spans
    modality: must
    statement: A note-events Driver may admit midi, timeline or their combination and rejects other parts or ABC before Job publication when not implemented. Both requested outputs derive from the same validated native note sequence. A timeline uses the original source sample-frame basis and adds the captured input-range start exactly once. A MIDI uses times relative to the beginning of the captured input interval, so MIDI seconds plus that interval start correspond to the timeline estimates within the declared deterministic encoding resolution. The admitted Basic Pitch MIDI dialect is complete single-track SMF format 0 with an explicit SMPTE time division of 25 frames per second and 40 ticks per frame, bounded variable-length deltas, paired note-on and note-off events and one terminal end-of-track; the fixed note-on velocity 64 and channel allocation are serialization conventions and are not observed loudness, tempo, instrument or voice evidence. It emits no program, tempo, lyric or expressive controller claim. Publication validates the complete MIDI structure, bounds, termination and note pairing rather than only its header. The note-only timeline contains no invented beat, chord, key, velocity or confidence. Empty real predictions may be serialized without fabricating notes, while an empty prediction alone never verifies useful transcription. Missing completeness evidence remains unknown and all requested artifacts commit atomically under the existing transcription owner.
    condition: Whenever music.transcribe admits or publishes note-events results.
    failure: Reject unsupported part and format combinations, invalid or unpaired MIDI events, missing termination, unsafe timing or spans, mismatched note sequences or source offsets, fabricated musical roles or partial successful output.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.canonical-audio
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.music-note-events
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.music-transcription
  - id: rule.nimi.runtime.ai-provider.basic-pitch-onnx-note-events
    kind: rule
    title: Basic Pitch uses one exact CPU ONNX note-transcription profile
    modality: must
    statement: The Basic Pitch v0.4.0 Driver admits Windows amd64, Runtime-managed Python 3.12.13 and ONNX Runtime CPU only, with the reviewed official spotify/basic-pitch commit 9991303bba609a3b93089d13ec80d1d495083596 ONNX and retained Apache 2.0 license and NOTICE. The versioned Driver owns exact ModelAsset file facts and model signature, fixed preprocessing and note decoding defaults, and the immutable Python profile and Driver bundle identity. It validates finite float32 tensors, the 43844-sample mono input and the native 172-frame note/onset/contour outputs, preserves the reviewed 22050 Hz resampling, overlap, padding removal and native note-time correction, and returns only note-events midi and timeline estimates from the captured canonical source/range. It neither imports the upstream distribution's TensorFlow dependency nor selects TensorFlow, CoreML, TFLite, GPU or a different model after failure. Runtime captures the real Python package/profile and model bindings, revalidates the same assembly for execution or recovery, and cancels its owned process without publishing late or partial results. The existing SheetSage Driver and its existing supported combinations retain their own exact substrate and semantics.
    condition: Whenever the exact Basic Pitch local Driver is prepared, selected, executed or projected.
    failure: Fail closed on different model or profile identity, unsupported platform or accelerator, wrong or external-data model signature, invalid tensors, automatic backend substitution, fake audio.cpp custody or incomplete requested outputs.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.music-note-events
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.music-transcription
