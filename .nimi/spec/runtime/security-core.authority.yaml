format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.security-core
units:
  - id: definition.nimi.runtime.security-core.token-validation-plane
    kind: definition
    title: Runtime token validation plane
    meaning: The Runtime token validation plane parses Realm bearer input, validates JWT headers, claims, time bounds, JWKS signatures, session revocation, and cross-service claim alignment, and projects only the minimum authenticated identity context.
  - id: definition.nimi.runtime.security-core.ownership-authorization-plane
    kind: definition
    title: Runtime ownership authorization plane
    meaning: The Runtime ownership authorization plane validates canonical App or shared LocalAgent AIConfig ownership, the current machine-selected Loadout for a committed Local route, exact committed Cloud Connector references, Machine Loadout store actions including Select set or explicit clear, machine-owned Loadout and ModelAsset access, current-account Connector ownership and status, App Capability access, applicable policy, and immutable Job effective-input ownership only after authentication, preserves information hiding and fixed evaluation order, and never invents a route, alternate resource, or target.
  - id: definition.nimi.runtime.security-core.endpoint-security-plane
    kind: definition
    title: Runtime endpoint security plane
    meaning: The Runtime endpoint security plane validates every remote endpoint materialized from exact Runtime-private ExecutionHost configuration at execution time, consumes the exact admitted Connector reference only for ownership and request-scoped credential custody, rejects unsafe address classes after DNS resolution, and pins validated dial targets without accepting Driver, Connector, caller, AIConfig, Catalog, or environment endpoint authority or changing TLS or HTTP authority.
  - id: definition.nimi.runtime.security-core.grant-service-plane
    kind: definition
    lifecycle: removed
    title: Retired Runtime permission decision plane
    reason: Removed because Third-party App access is derived from the current declaration and protected session without per-capability grants, user decisions, requests, revocation, or a durable permission lifecycle.
  - id: definition.nimi.runtime.security-core.key-routing-plane
    kind: definition
    lifecycle: removed
    title: Retired Runtime key source and routing plane
    reason: Removed because security and connector custody do not select Local, Cloud, provider, model, or capability routes and inline, configured, anonymous, and connector-driven routing paths are retired.
  - id: definition.nimi.runtime.security-core.connector-grant-plane
    kind: definition
    lifecycle: removed
    title: Retired Runtime ConnectorGrant plane
    reason: Removed because Runtime admits only current-account Connector ownership, credential validity, App Capability access, and applicable policy for Cloud execution; any future delegated credential authority requires new authority and a new subject model without compatibility with this retired plane.
  - id: rule.nimi.runtime.security-core.r001
    kind: rule
    title: Authorization metadata has one bearer shape
    modality: must
    statement: Runtime reads authentication only from the normalized gRPC authorization metadata key, accepts only Bearer followed by one JWT, and treats an absent authorization value as anonymous without error.
    condition: Whenever a Runtime request enters bearer authentication.
    failure: Reject any unsupported authentication carrier or bearer shape instead of deriving authenticated identity from it.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r002
    kind: rule
    title: Malformed authorization never downgrades to anonymous
    modality: must_not
    statement: A present but malformed authorization value is treated as anonymous or allowed to continue without UNAUTHENTICATED and AUTH_TOKEN_INVALID.
    condition: Whenever authorization metadata is present but is not a valid bearer input.
    failure: Return UNAUTHENTICATED with AUTH_TOKEN_INVALID before authorization evaluation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r003
    kind: rule
    title: Realm JWT claims are closed and time checked
    modality: must
    statement: Realm JWT validation requires iss, aud, sub, exp, and iat and applies temporal validation to nbf whenever nbf is present.
    condition: Whenever Runtime validates a Realm JWT.
    failure: Return UNAUTHENTICATED with AUTH_TOKEN_INVALID when a required claim is absent or a temporal claim is invalid.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r004
    kind: rule
    title: JWT algorithm and key shape follow generated Realm JWKS
    modality: must
    statement: Runtime accepts only RS256 and key shapes currently declared by the generated Realm JWKS contract and maintains no parallel transport DTO or independently widened algorithm set.
    condition: Whenever Runtime selects a JWT verification algorithm or key.
    failure: Return UNAUTHENTICATED with AUTH_TOKEN_INVALID for every undeclared algorithm or key shape.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r005
    kind: rule
    title: Unsigned and keyless JWT headers are denied
    modality: must_not
    statement: Runtime accepts alg none or a JWT header without kid.
    condition: Whenever Runtime parses a JWT header.
    failure: Return UNAUTHENTICATED with AUTH_TOKEN_INVALID before signature verification proceeds.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r006
    kind: rule
    title: JWKS lookup refreshes once on cache or key miss
    modality: must
    statement: Runtime uses the cached JWKS snapshot first and performs one refresh on cache miss or kid miss.
    condition: Whenever JWT verification cannot resolve the requested kid from the current cache.
    failure: Return UNAUTHENTICATED rather than retrying without bound or downgrading to anonymous.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r007
    kind: rule
    title: JWKS stale fallback is short and key specific
    modality: must
    statement: A failed JWKS refresh may use the most recent successful snapshot only within a short TTL and only when that snapshot already contains the requested kid.
    condition: Whenever a JWKS refresh fails after a previously successful fetch.
    failure: Return UNAUTHENTICATED when the fallback window expired or the requested kid is absent.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r008
    kind: rule
    title: JWKS has one configured secure source
    modality: must
    statement: auth.jwt.jwksUrl is the only Runtime verification-key source, publicKeyPath is excluded from the verification chain, and jwksUrl uses https except that http is allowed for localhost, 127.0.0.0/8, or ::1.
    condition: Whenever Runtime configures or fetches JWT verification keys.
    failure: Disable the bearer JWT path when the source or transport violates the fixed JWKS boundary.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r009
    kind: rule
    title: JWT temporal skew is fixed
    modality: must
    statement: Runtime applies a fixed plus or minus 60 second skew window to exp and nbf and gives no soft tolerance outside that window.
    condition: Whenever Runtime evaluates JWT expiration or not-before time.
    failure: Return UNAUTHENTICATED with AUTH_TOKEN_INVALID when the token lies outside the fixed window.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r010
    kind: rule
    title: Signed sessions still require revocation validation
    modality: must
    statement: After successful JWT signature validation Runtime requires sid and queries the configured session revocation endpoint whenever the session domain is available.
    condition: Whenever a bearer JWT passes signature and claim validation.
    failure: Return SESSION_EXPIRED for a revoked or expired session and do not treat signature validity as session validity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r011
    kind: rule
    title: Bearer restart configuration is atomic
    modality: must
    statement: auth.jwt.revocationUrl, auth.jwt.issuer, auth.jwt.audience, and auth.jwt.jwksUrl form one restart configuration group and the bearer JWT path is enabled only when every member is present.
    condition: Whenever Runtime starts or restarts bearer authentication.
    failure: Disable the bearer JWT path instead of operating with a partial configuration group.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r012
    kind: rule
    title: Revocation introspection request has one wire shape
    modality: must
    statement: Runtime posts JSON to auth.jwt.revocationUrl with session_id, subject_user_id, issuer, audience, issued_at, and expires_at.
    condition: Whenever Runtime introspects a bearer session.
    failure: Treat inability to construct or send the exact request as AUTH_REVOCATION_UNAVAILABLE.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r013
    kind: rule
    title: Revocation introspection response is closed
    modality: must
    statement: Runtime accepts only a 200 application/json revocation response containing boolean active, boolean revoked, and optional RFC3339 expires_at, and treats revoked true or active false as revoked.
    condition: Whenever Runtime receives a revocation introspection response.
    failure: Return SESSION_EXPIRED for a determined revocation and reject every malformed response as temporarily unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r014
    kind: rule
    title: Indeterminate revocation fails unavailable
    modality: must
    statement: Network errors, non-2xx responses, wrong content type, and invalid revocation payloads return UNAVAILABLE with AUTH_REVOCATION_UNAVAILABLE and a retryable projection.
    condition: Whenever revocation state cannot be determined from the exact introspection contract.
    failure: Return the typed unavailable result and never downgrade the request to anonymous or active.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r015
    kind: rule
    title: Authentication failures use the closed reason taxonomy
    modality: must
    statement: Bearer format, signature, header, and claim failures return UNAUTHENTICATED with AUTH_TOKEN_INVALID, session revocation or expiration returns SESSION_EXPIRED, indeterminate revocation returns AUTH_REVOCATION_UNAVAILABLE, and ExternalPrincipal proof expiration or unsupported proof type may use AUTH_TOKEN_EXPIRED or AUTH_UNSUPPORTED_PROOF_TYPE respectively.
    condition: Whenever Runtime emits an authentication failure.
    failure: Reject the request with the applicable typed code instead of an ad hoc, anonymous, or success result.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r016
    kind: rule
    title: Authenticated context is minimal and parsed once
    modality: must
    statement: Successful authentication projects only subject_user_id from sub, issuer, audience, and optional session_id, and downstream authorization consumes that projection without reimplementing JWT parsing.
    condition: Whenever authenticated identity is passed to downstream Runtime authorization.
    failure: Reject duplicate token parsing or identity projection beyond the admitted minimum.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r017
    kind: rule
    title: Realm and Runtime claims configuration must align
    modality: must
    statement: Realm-issued iss equals auth.jwt.issuer, Realm-issued aud contains auth.jwt.audience, and Runtime obtains Realm verification keys only through auth.jwt.jwksUrl.
    condition: Whenever Realm tokens are issued for Runtime consumption.
    failure: Return UNAUTHENTICATED with AUTH_TOKEN_INVALID for every issuer or audience mismatch.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r018
    kind: rule
    title: JWT posture never establishes protected origin
    modality: must_not
    statement: A valid JWT or ordinary request-body authorization is interpreted as protected local origin for an RPC whose closed posture requires a separately verified carrier and role.
    condition: Whenever a Runtime operation requires independently verified protected origin.
    failure: Deny the RPC until its independently required protected origin is verified.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r019
    kind: rule
    title: Loadouts and ModelAssets do not use Connector custody ownership
    modality: must_not
    statement: A Loadout, current Machine Loadout store selection, ModelAsset, Driver configuration, ResolvedAssembly, or Local Job is treated as a Connector custody kind or ownership path instead of using the canonical machine, Loadout, asset, and Job owner policy; after the required machine-wide impact confirmation, Select Loadout authorization covers either one eligible selection target or an explicit empty selection without creating a separate Clear authority or execution binding.
    condition: Whenever Runtime authorizes a Local Loadout action or execution.
    failure: Reject Connector-derived Local ownership, deletion required for deselection, and any owner path outside the exact machine-owned action, ModelAsset axes, captured assembly, and request.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r020
    kind: rule
    title: Cloud Connector and Local machine authorization stay distinct
    modality: must
    statement: Cloud Job submission validates and captures the exact Connector reference committed by the canonical AIConfig owner together with current-account ownership, status, credential configuration, App Capability access, and applicable policy under the authenticated subject, while Local Job submission validates the canonical machine and request owner, reads the current machine-selected Loadout for the committed Local CapabilityContract, validates every model_asset_id and expected_content_id and RecipeCustody, and atomically persists the selected Loadout identity and ResolvedAssembly; an absent or invalid Connector reference or machine selection yields the typed configuration or resource failure, an invalid identity never enables inline Cloud execution or changes AIConfig route, and any denied path fails without fallback.
    condition: Whenever Runtime authorizes and captures Local or Cloud Job inputs.
    failure: Return the typed authentication, selection, or authorization failure and deny inputs outside the exact owner partition without switching routes or publishing a partial Job.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r021
    kind: rule
    title: Anonymous machine connectors are API key system records
    modality: must
    statement: A machine-global system custody record may use API_KEY with owner type SYSTEM and owner_id machine, but its existence never creates or selects an AIConfig binding, Cloud route, provider, model, or capability and anonymous callers receive no implicit execution authority from it.
    condition: Whenever an anonymous caller creates or uses a machine-global connector.
    failure: Deny every anonymous machine connector with another auth kind or owner mapping.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r022
    kind: rule
    title: Remote connector ownership is information hidden
    modality: must
    statement: A missing remote connector, an owner mismatch, and anonymous access to a user-owned remote connector all return NOT_FOUND.
    condition: Whenever Runtime cannot expose a remote connector under caller ownership policy.
    failure: Return NOT_FOUND without distinguishing existence, ownership, or user-owned status.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r023
    kind: rule
    title: Connector owner mapping is fixed
    modality: must
    statement: Authenticated remote custody records map to REALM_USER, machine-global API_KEY custody records map to SYSTEM with owner_id machine, OAUTH_MANAGED custody records map to REALM_USER, and Cloud execution relies on exact REALM_USER ownership without a second authorization; Loadouts and ModelAssets remain under their machine and RuntimeLocalService owners and Profile carries no custody identity.
    condition: Whenever Runtime assigns or validates connector and target ownership.
    failure: Return NOT_FOUND or deny creation for every incompatible owner, auth-kind, or target-owner mapping.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r024
    kind: rule
    title: Connector creation follows caller identity
    modality: must
    statement: Create permits a valid JWT to create a user-owned remote connector and permits a caller without JWT to create only a machine-global API_KEY remote connector.
    condition: Whenever ConnectorService creates a connector.
    failure: Deny creation that does not match the authenticated-user or anonymous-machine branch.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r025
    kind: rule
    title: Connector mutation preserves owner and auth kind
    modality: must
    statement: Update and Delete require a valid JWT for user-owned remote connectors, while anonymous or authenticated callers may manage an owner_id machine connector only when its auth kind is API_KEY.
    condition: Whenever ConnectorService updates or deletes a connector.
    failure: Hide or deny the connector when caller identity, owner, or auth kind does not satisfy the mutation branch.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r026
    kind: rule
    title: Connector reads expose only caller-visible records
    modality: must
    statement: Get and List expose only caller-visible custody records, ListConnectorModels returns a bounded provider inventory snapshot without binding or routing, and Test Connector runs only as an explicit user-requested bounded diagnostic; user-owned records remain hidden from anonymous callers, every non-user-owned OAUTH_MANAGED record is NOT_FOUND, and no read or diagnostic creates readiness state, selection, or execution prerequisite.
    condition: Whenever ConnectorService reads, tests, or lists connectors or connector models.
    failure: Return NOT_FOUND for an invalid ownership and auth-kind combination without exposing the record.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r027
    kind: rule
    title: Connector custody authorization order is fixed
    modality: must
    statement: After authentication and committed AIConfig Cloud-route validation, Runtime validates the exact committed current-account Connector reference, evaluates Connector owner and status, App Capability access and applicable policy, then minimum request-scoped credential material, Driver-owned target and endpoint security, Remote ExecutionHost dispatch, and audit in that order; the Connector never chooses the route or target.
    condition: Whenever Cloud execution resolves Connector custody.
    failure: Stop at the first failed check, preserve information hiding, and do not reorder evaluation or switch route, target, provider, or Connector.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r028
    kind: rule
    title: ScenarioJob ownership is captured at creation
    modality: must
    statement: ScenarioJob creation stores owner_id as jwt.sub for a valid JWT and anonymous otherwise, and GetScenarioJob, CancelScenarioJob, SubscribeScenarioJobEvents, and GetScenarioArtifacts authorize against that stored job owner independently of connector existence.
    condition: Whenever Runtime creates or accesses a ScenarioJob.
    failure: Deny job access on owner mismatch without depending on current connector state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r029
    kind: rule
    title: Authentication completes before authorization
    modality: must
    statement: Runtime enters owner, status, and credential authorization only after authentication succeeds.
    condition: Whenever a request carries authentication material.
    failure: Return the authentication failure without running authorization checks or exposing authorization state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r030
    kind: rule
    title: Ordinary identity cannot upgrade protected origin
    modality: must_not
    statement: Ordinary authn, a request-body app identifier, or an ownership match upgrades a call to a separately protected local origin.
    condition: Whenever a Runtime RPC requires protected transport or origin posture.
    failure: Deny the operation until the required carrier and origin role are independently verified.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r031
    kind: rule
    title: Runtime-private Host endpoints require validation
    modality: must
    statement: Runtime applies endpoint security validation to the exact remote endpoint materialized from Runtime-private Remote ExecutionHost configuration for the committed Driver, the exact Job-captured Connector reference contributes only ownership and request-scoped credential custody, and product execution accepts no Driver-, Connector-, caller-, AIConfig-, Catalog-, or environment-supplied endpoint or secret path.
    condition: Whenever Runtime prepares a remote ExecutionHost request.
    failure: Reject the request before network dispatch when the exact Host-materialized endpoint is unsafe or unvalidated or when any other source supplies the endpoint.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
  - id: rule.nimi.runtime.security-core.r032
    kind: rule
    title: Remote endpoints default to HTTPS
    modality: must
    statement: Runtime permits https endpoints by default and permits http only when allow_loopback_provider_endpoint is true and the target is localhost, 127.0.0.0/8, or ::1.
    condition: Whenever Runtime validates an endpoint scheme and loopback posture.
    failure: Reject non-HTTPS endpoints that do not satisfy every loopback exception condition.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
  - id: rule.nimi.runtime.security-core.r033
    kind: rule
    title: Unsafe address classes stay denied after DNS
    modality: must
    statement: Runtime unconditionally rejects 169.254.0.0/16, 169.254.169.254, fe80::/10, and fc00::/7, conditionally rejects localhost, 127.0.0.0/8, and ::1 when loopback is disabled, and reapplies those checks to every DNS result.
    condition: Whenever Runtime validates a literal or resolved provider address.
    failure: Reject the endpoint if any selected dial address belongs to a prohibited class.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
  - id: rule.nimi.runtime.security-core.r034
    kind: rule
    title: Validated DNS results are pinned without authority rewrite
    modality: must
    statement: Runtime dials only validated pinned IPs, preserves the original hostname for TLS ServerName and HTTP Host, and permits connection-level failover among all validated safe IPs returned for that hostname.
    condition: Whenever Runtime dispatches to a DNS-resolved remote endpoint.
    failure: Reject unpinned dialing, authority rewriting, or failover to an address that was not validated.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
  - id: rule.nimi.runtime.security-core.r035
    kind: rule
    title: Endpoint validation occurs at execution time
    modality: must
    statement: Runtime repeats endpoint and resolved-address validation immediately before every actual outbound request rather than relying only on create-time or update-time validation.
    condition: Whenever Runtime is about to open an outbound provider connection.
    failure: Stop network dispatch when current validation does not pass.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
  - id: rule.nimi.runtime.security-core.r036
    kind: rule
    title: Private endpoint allowlists are unavailable
    modality: must_not
    statement: Runtime uses a CIDR or host private-network allowlist to bypass the Phase 1 endpoint baseline.
    condition: Whenever endpoint policy evaluates a private or otherwise prohibited address.
    failure: Reject the address under the fixed baseline without an allowlist override.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
  - id: rule.nimi.runtime.security-core.r037
    kind: rule
    title: Public portable grant credentials stay removed
    modality: must_not
    statement: Runtime protocol, generated clients, SDK exports, service registration, persistence, or a renamed surface recreates a portable generic credential-grant family, portable tokens, bearers, scope lists, resource fingerprints, delegation chains, App-selected endpoints, or reusable App authority; an Effective App Access Snapshot is instead Runtime-derived and session-bound, and Connector custody remains Runtime-private.
    condition: Whenever Third-party App access or a public grant surface is defined or shipped.
    failure: Remove the portable authority surface and reject every operation that depends on it.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
  - id: rule.nimi.runtime.security-core.r038
    kind: rule
    lifecycle: removed
    title: Retired App permission posture surface
    reason: Removed because Third-party Apps receive declaration-derived access rather than permission status, request, approval, revoke, or decision surfaces.
  - id: rule.nimi.runtime.security-core.r039
    kind: rule
    lifecycle: removed
    title: Retired local-app permission authority classes
    reason: Removed because App access uses the closed App operation contract, declaration coverage, and owner policy without a parallel permission-class taxonomy.
  - id: rule.nimi.runtime.security-core.r040
    kind: rule
    lifecycle: removed
    title: Retired durable App permission decision rows
    reason: Removed because the current product admits no per-capability permission decision, grant, request, revoke, or persistence lifecycle.
  - id: rule.nimi.runtime.security-core.r041
    kind: rule
    lifecycle: removed
    title: Retired permission truth synthesis prohibition
    reason: Removed with permission truth; App access now derives directly from verified launch, current registration and declaration generations, protected session facts, and exact owner policy.
  - id: rule.nimi.runtime.security-core.r042
    kind: rule
    lifecycle: removed
    title: Retired public permission catalog identity
    reason: Removed because the stable App operation contract and declaration domains replace the permission catalog and no approval or permission-request identity remains.
  - id: rule.nimi.runtime.security-core.r043
    kind: rule
    title: Generic operation and resource grant engines are forbidden
    modality: must_not
    statement: Runtime persists or evaluates a generic capability scope plus resource scope grant, an App PermissionGrant, or an owner-independent policy engine for Third-party App access.
    condition: Whenever Runtime derives or enforces an Effective App Access Snapshot or protected App operation.
    failure: Reject the generic grant and use the canonical operation classification, the classified Base invariants or declaration-derived AppAccess-domain snapshot coverage, and the operation owner's policy.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
  - id: rule.nimi.runtime.security-core.r044
    kind: rule
    lifecycle: removed
    title: Retired atomic permission admission slice
    reason: Removed because App access has no permission admission workflow, decision UI, revoke path, positive-evidence gate, or permission-specific SDK projection.
  - id: rule.nimi.runtime.security-core.r045
    kind: rule
    lifecycle: removed
    title: Retired initial public permission operation set
    reason: Removed because the canonical App operation contract now owns the declaration-derived operation union without agents.interact, agents.configure, ai.text.generate, or any permission lifecycle.
  - id: rule.nimi.runtime.security-core.r046
    kind: rule
    lifecycle: removed
    title: Retired durable permission owner-selector identity
    reason: Removed because an Effective App Access Snapshot is derived from current session and declaration facts and contains no durable permission identity or owner-selector grant.
  - id: rule.nimi.runtime.security-core.r047
    kind: rule
    lifecycle: removed
    title: Retired revocable App permission decision lifecycle
    reason: Removed because current App access has no durable grant, explicit user decision evidence, revision, revoke, or permission audit lifecycle.
  - id: rule.nimi.runtime.security-core.r048
    kind: rule
    title: Cloud target and Local selection identities are separate
    modality: must
    statement: AIConfig Local intent is route-only and AIConfig Cloud intent names one exact current-account Connector reference, CapabilityImplementation, and Driver-owned provider-model target; the Machine Loadout store separately owns one current selected Loadout per CapabilityContract without embedding that selection, Loadout content, ModelAsset identity, account selector, credential, custody payload, endpoint, path, process evidence, readiness, or fallback in AIConfig. Runtime composes the committed Local route with only the current matching machine selection and captures exact effective inputs at Job admission, while raw provider-model labels, legacy compact targets, unselected inventory, catalog order, or ambient Connector selections never substitute for those owner facts.
    condition: Whenever Runtime composes an AI execution target.
    failure: Reject every retired or cross-owner target shape rather than converting, inferring, or falling back.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r049
    kind: rule
    title: Committed AIConfig is the only route source
    modality: must
    statement: AI execution uses only the Local or Cloud route committed in the canonical owner AIConfig; Cloud additionally uses only its committed exact Connector, implementation, and target, while Local uses only the current machine-selected Loadout for the same CapabilityContract at new Job admission. No managed Connector default, inline metadata, unselected inventory, process health, missing-field heuristic, scan, or ranking changes the route or chooses an alternate resource; Cloud requires the committed Connector to belong to the Job admitted account and remain usable under existing credential and policy checks, and Local requires the current selection to resolve one valid effective assembly.
    condition: Whenever Runtime composes route and authorization inputs.
    failure: Reject missing or inconsistent committed inputs and never invent credentials, route intent, or a substitute path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r050
    kind: rule
    title: Managed Connector authentication stays in custody
    modality: must
    statement: An admitted protected App may submit only a safe current-account Connector reference as canonical AIConfig intent and may list bounded safe Connector and target options, while ordinary AI consumption requests never carry Connector selectors and no App request carries credential material, OAuth payload, endpoint, headers, custody reference, or account identity; OAuth payloads remain provider-defined sealed secrets constrained by the admitted provider_auth_profile set, every OAUTH_MANAGED custody record is user-owned, and changing Connector credential custody never changes the committed Connector, CapabilityImplementation, or Driver target identity.
    condition: Whenever Runtime loads or validates a managed connector credential.
    failure: Return NOT_FOUND for machine-owned or system-owned OAUTH_MANAGED records and deny undeclared auth profiles.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r051
    kind: rule
    lifecycle: removed
    title: Retired inline credential execution path
    reason: Removed because Cloud execution resolves one exact current-account Connector from committed AIConfig intent and no caller-inline secret or temporary product bypass is admitted.
  - id: rule.nimi.runtime.security-core.r052
    kind: rule
    lifecycle: removed
    title: Retired managed-versus-inline credential truth table
    reason: Removed with the inline execution path; ordinary requests accept neither inline credential nor inline endpoint fields.
  - id: rule.nimi.runtime.security-core.r053
    kind: rule
    lifecycle: removed
    title: Retired key-source metadata execution path
    reason: Removed because Cloud execution context derives from the canonical AIConfig owner, exact implementation target, Runtime-resolved current-account Connector and Driver, never raw key-source, provider, endpoint, or API-key headers.
  - id: rule.nimi.runtime.security-core.r054
    kind: rule
    title: AI consume evaluation sequence is closed
    modality: must
    statement: Runtime evaluates request normalization, authentication, canonical AIConfig owner, App Capability access, committed CapabilityContract route, and applicable policy, then for Local the current machine-selected Loadout, versioned Driver dialect and recipeId, model axes, RecipeCustody, byte revalidation, and authorization, or for Cloud the committed exact Connector reference, CapabilityImplementation target, current-account Connector owner and status, custody, and minimum credential; Runtime next atomically persists the selected Loadout identity and complete Local ResolvedAssembly or Cloud effective inputs and publishes the Job, then performs endpoint security, exact Driver, Local or Remote ExecutionHost dispatch, and audit from those captured inputs only.
    condition: Whenever Runtime handles AI consume or resumes a Job.
    failure: Stop at the first failed stage, publish no partial Job, and do not bypass, reorder, defer a security check beyond execution, or reread current owner state after capture.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r055
    kind: rule
    title: Managed OAuth consume never mutates custody
    modality: must_not
    statement: AI execution implicitly refreshes, replaces, or rewrites an OAUTH_MANAGED custody payload or the admitted current-account Connector; custody resolution returns more than the minimum request-scoped token or headers, stores that material in Profile, AIConfig, Driver configuration, ordinary workflow, or Job, or hides provider authentication rejection behind fallback or success.
    condition: Whenever AI consume resolves or uses an OAUTH_MANAGED credential.
    failure: Return the applicable typed failure without mutating the sealed payload.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r056
    kind: rule
    title: Cloud Connector and Local machine execution require exact subjects
    modality: must
    statement: Cloud execution requires an authenticated subject owning the exact Connector referenced by committed AIConfig and allowed by App Capability access and applicable policy, with usable custody configuration, while Local execution requires the canonical machine and request owner authorized for the current machine-selected Loadout composed with the committed Local route and for its ModelAssets; neither branch admits inline metadata, and an invalid bearer never downgrades to anonymous Local execution or changes the committed route.
    condition: Whenever Runtime validates AI consume caller identity.
    failure: Reject a missing remote subject and return UNAUTHENTICATED with AUTH_TOKEN_INVALID for an invalid bearer instead of anonymous-local fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r057
    kind: rule
    title: AIConfig intent and effective resource admission are independently valid
    modality: must
    statement: A protected App with runtime.consume coverage may get and compare-and-swap overwrite only its current account-scoped App AIConfig with a route-only Local marker or an exact Connector reference plus CapabilityImplementation and Driver-owned provider-model target, Desktop may perform the same mutation only for a currently projected App owner, and a protected App with agent.configure may perform the equivalent mutation only for the account-scoped shared LocalAgent owner. Runtime derives account and owner before reading any record, validates Local capability, feature, default, and route shape without requiring a current machine selection, validates every new or changed Cloud reference for current visibility and compatibility, permits a canonical-equal unchanged stale Cloud entry to remain while another capability changes, revalidates any edited stale Cloud entry, and returns the current record only for an admitted owner's revision conflict; a foreign Cloud reference already present in stored configuration is an invariant violation rather than a later-missing product state.
    condition: Whenever Runtime authenticates, validates, reads, overwrites, lists options for, resolves, or executes an App or shared LocalAgent AIConfig.
    failure: Reject a missing declaration coverage, caller-supplied owner or account, non-projected Desktop target, stale revision, any Local Loadout identity in AIConfig, new or changed foreign, invisible, or incompatible Connector, implementation, or target, a stored foreign-Connector invariant violation, credential or endpoint input, generic Connector management, access denial, or policy denial without returning another owner's config, changing a canonical-equal unchanged stale Cloud entry, requiring a current Local selection to save Local intent, creating a grant workflow, or fabricating success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r058
    kind: rule
    title: Missing Cloud configuration fails without implicit Connector substitution
    modality: must
    statement: A committed Cloud AIConfig remains canonical intent when its exact Connector or target later becomes missing, blocked, or unusable, each read retains the committed config and projects a bounded effective failure for that entry, and execution returns the exact existing configuration, credential, access, or policy reason before transport work; the user may explicitly replace or clear the intent through the canonical compare-and-swap owner operation, but no failure selects another Connector, target, provider, model, or Local route.
    condition: Whenever a committed Cloud intent is read or a Job lacks an exact allowed execution path.
    failure: Preserve the owner record, return the exact typed effective or execution failure, and reject fallback, hidden repair, implicit Connector resolution, a second permission flow, or fabricated readiness.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r059
    kind: rule
    lifecycle: removed
    title: Retired inline provider destination
    reason: Removed because provider endpoints are CapabilityImplementationDriver configuration validated at execution and never caller-inline destination authority.
  - id: rule.nimi.runtime.security-core.r060
    kind: rule
    title: Connector ownership never routes capability
    modality: must
    statement: The exact current-account Connector referenced by committed AIConfig supplies ownership and custody only; the committed Cloud CapabilityImplementation owns capability semantics, its Driver owns provider protocol and target configuration, and the Remote ExecutionHost owns transport and remote Job lifecycle, so a Connector, provider row, or account never selects or reroutes the capability.
    condition: Whenever Connector ownership authorizes Cloud execution.
    failure: Reject unknown or unauthorized Connector use and never derive implementation or target from custody.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r061
    kind: rule
    lifecycle: removed
    title: Retired inline provider routing
    reason: Removed because Cloud execution requires committed AIConfig implementation-target intent and one exact Runtime-resolved current-account Connector.
  - id: rule.nimi.runtime.security-core.r062
    kind: rule
    title: Selected execution routes never fall back
    modality: must_not
    statement: Runtime automatically switches Local to Cloud, Cloud to Local, one Loadout to another, one CapabilityImplementation or provider-model target to another, or one Connector to another after admission or execution failure.
    condition: Whenever a selected route fails.
    failure: Return the exact selected composition failure without trying another route, configuration, implementation, provider, target, Connector, credential, or ExecutionHost.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r063
    kind: rule
    title: Local and Cloud Job inputs are closed
    modality: must
    statement: Before publication a Local Job atomically captures and persists the admitted account and owner context, committed AIConfig Local route identity, exact current machine-selected Loadout identity, features and defaults, CapabilityImplementation, versioned Driver dialect and recipeId, typed options, every model axis's model_asset_id, expected_content_id, reverified path and content identity, RecipeCustody identity, request, load plan, and process identity as one complete ResolvedAssembly, while a Cloud Job captures the admitted account namespace, committed route identity, exact Connector reference, CapabilityImplementation, Driver-owned provider-model target, defaults, and request. Queued, running, and resumed Jobs never reread current AIConfig, Loadout, catalog, inventory, machine selection, or process state to change captured identity; Cloud dispatch uses the captured Connector reference and existing custody lifecycle without switching Connector, and neither branch uses a legacy target tuple, raw ModelAsset, credential, endpoint, or provider label as Job identity.
    condition: Whenever Runtime validates, captures, or resumes execution identity.
    failure: Reject missing, partially persisted, stale, incompatible, unknown, retired, or live-read inputs without minting identity from inventory, custody, provider facts, or current owner state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r064
    kind: rule
    title: Memory embedding reuses canonical route and Connector security
    modality: must
    statement: Memory embedding uses its canonical AIConfig route and at Job submission atomically dereferences the exact current machine-selected Loadout for Local into a complete persisted ResolvedAssembly or captures the exact committed Connector reference and Cloud CapabilityImplementation target, with no inline credentials or endpoints; queued, running, and resumed embedding Jobs never reread current AIConfig, Loadout, machine selection, catalog, inventory, process, or private CAS. Its separate bank owner retains bank binding, rebuild, migration, and cutover truth without a special connector router, per-consumer Connector picker, or readiness lifecycle.
    condition: Whenever Runtime resolves and captures Memory embedding execution.
    failure: Reject absent selection, invalid, owner-mismatched, status-invalid, credential-invalid, endpoint-invalid, shortcut, partial, or current-state-reconstructed inputs.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r065
    kind: rule
    title: AIProfile carries no account authorization binding
    modality: must
    statement: AIProfile remains portable and carries only CapabilityImplementation and provider-model recommendation with features, defaults, and provenance, never a Loadout reference, Connector reference, account identity, custody reference, endpoint, secret, or live binding; canonical AIConfig may instead carry route-only Local intent or one current-account Cloud Connector reference plus implementation and Driver-owned target chosen explicitly for its exact owner, while still excluding Local Loadout identity, machine selection, credential, endpoint, account selector, custody payload, and resource content.
    condition: Whenever AIProfile expresses portable intent or AIConfig selects Cloud resource intent.
    failure: Reject account-bound, secret-bearing, custody-bound, or implicitly selected Profile content.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r066
    kind: rule
    title: Retired target identities cannot carry new semantics
    modality: must_not
    statement: Raw model_id, target_model_id, localModelId, goRuntimeLocalModelId, targetId or profileId, compact local target, connector_id plus model_id, deprecated field, or renamed compatibility object is admitted as durable identity for AIConfig, Loadout, machine selection, or Job, while provider-model values remain Driver target configuration and custody identity remains distinct from the target.
    condition: Whenever a caller, profile, or persisted record supplies a durable Runtime target.
    failure: Reject the retired identity without conversion and require the exact canonical owner object.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r082
    kind: rule
    lifecycle: removed
    title: Retired local-app authority class meanings
    reason: Removed with the permission-class taxonomy; Runtime now evaluates exact App operation coverage and owner policy without base_entitlement, user_permission, or one_shot_consent classes.
  - id: rule.nimi.runtime.security-core.r083
    kind: rule
    title: App permission storage stays absent
    modality: must
    statement: Runtime maintains no App PermissionGrant, per-capability decision, approve, request, revoke, JIT prompt, permission settings, permission ledger, or positive permission mutation; current access is represented only by a fresh Effective App Access Snapshot derived from registration, declaration, protected session, and owner facts.
    condition: Whenever Third-party App access state or persistence is designed or evaluated.
    failure: Reject the permission store or workflow and derive a fresh snapshot instead.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
  - id: rule.nimi.runtime.security-core.r084
    kind: rule
    title: Route implementation and custody identities stay distinct
    modality: must
    statement: AIConfig route intent, CapabilityImplementation semantics, CapabilityImplementationDriver protocol and target configuration, current-account Connector ownership, credential custody, and Local or Remote ExecutionHost transport are distinct identities; no inline credential escape hatch, local connector probe facade, provider runtime-plane label, or custody preference is interpreted as Local or Cloud route, target, selection, admission, or fallback.
    condition: Whenever Runtime or a consumer classifies route, implementation, Driver, Connector ownership, custody, or Host.
    failure: Reject execution that conflates any identity or derives route or target from custody or provider taxonomy.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r085
    kind: rule
    title: Connector credentials enter only request execution context
    modality: must
    statement: Runtime resolves the exact Job-captured current-account Connector reference to its custody content only after ownership, status, credential configuration, App Capability access, and applicable policy validation, obtains the minimum protocol authentication material only for the request-scoped execution context, lets the exact CapabilityImplementationDriver consume it while the Remote ExecutionHost transports the request, never persists secret material in Profile, AIConfig, Driver configuration, ordinary workflow, or Job, and prevents downstream modules from reading credential storage directly.
    condition: Whenever Runtime prepares Cloud execution.
    failure: Stop execution when exact credential material cannot be injected through the request context or any downstream module attempts direct storage access.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r086
    kind: rule
    title: Third-party App access is declaration derived
    modality: must
    statement: Runtime derives each Effective App Access Snapshot from the current registered App subject, source generation, declaration generation, protected session, and account context with only the supported declared AppAccess domains; Runtime separately consumes the canonical App operation contract to classify each stable callable operation as Base or map it to one AppAccess domain, without user grants, approval, request, revoke, JIT, permission settings, or marketplace review semantics.
    condition: Whenever a protected Third-party App session is opened, rebound, or evaluated.
    failure: Keep Nimi access unavailable when any required current fact is missing or inconsistent and never create a permission workflow or fallback.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: supersedes
        target: rule.nimi.runtime.security-core.r038
  - id: rule.nimi.runtime.security-core.r087
    kind: rule
    title: Runtime consumes one canonical App operation contract
    modality: must
    statement: Runtime consumes the canonical App operation contract as the sole stable declaration-domain and AppOperationId mapping and maintains no second permission catalog, hand-maintained authorization union, generated authority ledger, or caller-selectable generic forwarding surface.
    condition: Whenever a Third-party App declaration is translated or a protected App operation is dispatched.
    failure: Reject unknown, unsupported, unmapped, or duplicate operation identity before owner execution.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: supersedes
        target: rule.nimi.runtime.security-core.r045
  - id: rule.nimi.runtime.security-core.r088
    kind: rule
    title: Effective App access facts are Runtime derived
    modality: must
    statement: Runtime derives the App subject, account context, protected session, source generation, declaration generation, Effective App Access Snapshot, declaration-domain coverage, AppOperationId, and operation classification from the verified connection and canonical contract; the snapshot and its identity remain Runtime-private, SDK and Host receive neither its contents nor a snapshot identifier, and the App cannot submit or override any authority fact.
    condition: Whenever Runtime admits a protected Third-party App call or stream.
    failure: Reject caller-authored authority facts and fail closed when the current Runtime-private snapshot or the required classified Base or AppAccess admission fact is absent or stale.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: supersedes
        target: rule.nimi.runtime.security-core.r046
  - id: rule.nimi.runtime.security-core.r089
    kind: rule
    title: Runtime protected App ingress is the sole admission owner
    modality: must
    statement: Every supported Third-party App operation follows current session and Runtime-private snapshot validation, exact canonical AppOperationId classification, Base-row invariants or AppAccess-domain snapshot coverage according to that classification, operation-owner execution, and an App-facing typed result through Runtime protected ingress; SDK, Host, renderer, direct Realm, direct Runtime, public TCP, or generic internal forwarding cannot bypass or replace that admission or receive the snapshot.
    condition: Whenever a supported Third-party App operation is attempted.
    failure: Return the typed operation failure before owner mutation and provide no direct or compatibility fallback.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: supersedes
        target: rule.nimi.runtime.security-core.r044
  - id: rule.nimi.runtime.security-core.r090
    kind: rule
    title: App operation results expose no portable authority material
    modality: must_not
    statement: A supported App operation result, error, event, SDK projection, Host projection, environment, argv, renderer payload, log, generic forwarding response, or raw Realm response exposes Realm tokens, refresh tokens, Provider Credentials, connector credentials, session proof, or equivalent portable authority material.
    condition: Whenever Runtime returns or projects a Third-party App operation outcome.
    failure: Stop the projection and return the operation's typed failure without treating a credential scanner as the admission or correctness owner.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
  - id: rule.nimi.runtime.security-core.r091
    kind: rule
    title: Unknown declaration domains remain inert
    modality: must
    statement: An unknown or currently unsupported declaration domain contributes no Effective App Access Snapshot coverage for its current declaration generation, and later Runtime support does not activate that declaration until the App supplies a new declaration generation that explicitly includes the supported domain.
    condition: Whenever Runtime encounters an unknown declaration domain or gains support for a previously unknown domain.
    failure: Keep the domain inert and reject every operation that would depend on implicit reinterpretation or automatic activation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: supersedes
        target: rule.nimi.runtime.security-core.r042
