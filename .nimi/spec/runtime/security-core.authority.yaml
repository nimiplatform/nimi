format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.security-core
units:
  - id: definition.nimi.runtime.security-core.token-validation-plane
    kind: definition
    title: Runtime token validation plane
    meaning: The Runtime token validation plane parses Realm bearer input, validates JWT headers, claims, time bounds, JWKS signatures, session revocation, and cross-service claim alignment, and projects only the minimum authenticated identity context.
  - id: definition.nimi.runtime.security-core.ownership-authorization-plane
    kind: definition
    title: Runtime ownership authorization plane
    meaning: The Runtime ownership authorization plane validates canonical App or shared LocalAgent AIConfig ownership, machine-owned Local Capability Configuration and LocalAsset access, selected ConnectorGrant owner and status, and Job ownership only after authentication, preserves information hiding and fixed evaluation order, and never selects a route or target.
  - id: definition.nimi.runtime.security-core.endpoint-security-plane
    kind: definition
    title: Runtime endpoint security plane
    meaning: The Runtime endpoint security plane validates every remote endpoint materialized from exact Runtime-private ExecutionHost configuration at execution time, consumes the selected ConnectorGrant only for authorization and request-scoped credential custody, rejects unsafe address classes after DNS resolution, and pins validated dial targets without accepting Driver, Grant, caller, AIConfig, Catalog, or environment endpoint authority or changing TLS or HTTP authority.
  - id: definition.nimi.runtime.security-core.grant-service-plane
    kind: definition
    title: Runtime permission decision plane
    meaning: The Runtime permission decision plane is the owner-internal lifecycle boundary for atomically admitted public App user permissions; it is a different authority class from ConnectorGrant, which binds an AIConfig Cloud target to account authorization and credential custody, and neither identity may substitute for or be inferred from the other.
  - id: definition.nimi.runtime.security-core.key-routing-plane
    kind: definition
    lifecycle: removed
    title: Retired Runtime key source and routing plane
    reason: Removed because security and connector custody do not select Local, Cloud, provider, model, or capability routes and inline, configured, anonymous, and connector-driven routing paths are retired.
  - id: definition.nimi.runtime.security-core.connector-grant-plane
    kind: definition
    title: Runtime ConnectorGrant authorization and custody plane
    meaning: The Runtime ConnectorGrant authorization and custody plane validates an explicitly selected non-portable account authorization binding, resolves its referenced sealed credential custody into minimum request-scoped material, and audits use without owning CapabilityContract, CapabilityImplementation, Driver target, AIConfig route, machine selection, or secret persistence in ordinary configuration.
    relations:
      - type: supersedes
        target: definition.nimi.runtime.security-core.key-routing-plane
  - id: rule.nimi.runtime.security-core.r001
    kind: rule
    title: Authorization metadata has one bearer shape
    modality: must
    statement: Runtime reads authentication only from the normalized gRPC authorization metadata key, accepts only Bearer followed by one JWT, and treats an absent authorization value as anonymous without error.
    condition: Whenever a Runtime request enters bearer authentication.
    failure: Reject any unsupported authentication carrier or bearer shape instead of deriving authenticated identity from it.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r002
    kind: rule
    title: Malformed authorization never downgrades to anonymous
    modality: must_not
    statement: A present but malformed authorization value is treated as anonymous or allowed to continue without UNAUTHENTICATED and AUTH_TOKEN_INVALID.
    condition: Whenever authorization metadata is present but is not a valid bearer input.
    failure: Return UNAUTHENTICATED with AUTH_TOKEN_INVALID before authorization evaluation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r003
    kind: rule
    title: Realm JWT claims are closed and time checked
    modality: must
    statement: Realm JWT validation requires iss, aud, sub, exp, and iat and applies temporal validation to nbf whenever nbf is present.
    condition: Whenever Runtime validates a Realm JWT.
    failure: Return UNAUTHENTICATED with AUTH_TOKEN_INVALID when a required claim is absent or a temporal claim is invalid.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r004
    kind: rule
    title: JWT algorithm and key shape follow generated Realm JWKS
    modality: must
    statement: Runtime accepts only RS256 and key shapes currently declared by the generated Realm JWKS contract and maintains no parallel transport DTO or independently widened algorithm set.
    condition: Whenever Runtime selects a JWT verification algorithm or key.
    failure: Return UNAUTHENTICATED with AUTH_TOKEN_INVALID for every undeclared algorithm or key shape.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r005
    kind: rule
    title: Unsigned and keyless JWT headers are denied
    modality: must_not
    statement: Runtime accepts alg none or a JWT header without kid.
    condition: Whenever Runtime parses a JWT header.
    failure: Return UNAUTHENTICATED with AUTH_TOKEN_INVALID before signature verification proceeds.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r006
    kind: rule
    title: JWKS lookup refreshes once on cache or key miss
    modality: must
    statement: Runtime uses the cached JWKS snapshot first and performs one refresh on cache miss or kid miss.
    condition: Whenever JWT verification cannot resolve the requested kid from the current cache.
    failure: Return UNAUTHENTICATED rather than retrying without bound or downgrading to anonymous.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r007
    kind: rule
    title: JWKS stale fallback is short and key specific
    modality: must
    statement: A failed JWKS refresh may use the most recent successful snapshot only within a short TTL and only when that snapshot already contains the requested kid.
    condition: Whenever a JWKS refresh fails after a previously successful fetch.
    failure: Return UNAUTHENTICATED when the fallback window expired or the requested kid is absent.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r008
    kind: rule
    title: JWKS has one configured secure source
    modality: must
    statement: auth.jwt.jwksUrl is the only Runtime verification-key source, publicKeyPath is excluded from the verification chain, and jwksUrl uses https except that http is allowed for localhost, 127.0.0.0/8, or ::1.
    condition: Whenever Runtime configures or fetches JWT verification keys.
    failure: Disable the bearer JWT path when the source or transport violates the fixed JWKS boundary.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r009
    kind: rule
    title: JWT temporal skew is fixed
    modality: must
    statement: Runtime applies a fixed plus or minus 60 second skew window to exp and nbf and gives no soft tolerance outside that window.
    condition: Whenever Runtime evaluates JWT expiration or not-before time.
    failure: Return UNAUTHENTICATED with AUTH_TOKEN_INVALID when the token lies outside the fixed window.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r010
    kind: rule
    title: Signed sessions still require revocation validation
    modality: must
    statement: After successful JWT signature validation Runtime requires sid and queries the configured session revocation endpoint whenever the session domain is available.
    condition: Whenever a bearer JWT passes signature and claim validation.
    failure: Return SESSION_EXPIRED for a revoked or expired session and do not treat signature validity as session validity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r011
    kind: rule
    title: Bearer restart configuration is atomic
    modality: must
    statement: auth.jwt.revocationUrl, auth.jwt.issuer, auth.jwt.audience, and auth.jwt.jwksUrl form one restart configuration group and the bearer JWT path is enabled only when every member is present.
    condition: Whenever Runtime starts or restarts bearer authentication.
    failure: Disable the bearer JWT path instead of operating with a partial configuration group.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r012
    kind: rule
    title: Revocation introspection request has one wire shape
    modality: must
    statement: Runtime posts JSON to auth.jwt.revocationUrl with session_id, subject_user_id, issuer, audience, issued_at, and expires_at.
    condition: Whenever Runtime introspects a bearer session.
    failure: Treat inability to construct or send the exact request as AUTH_REVOCATION_UNAVAILABLE.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r013
    kind: rule
    title: Revocation introspection response is closed
    modality: must
    statement: Runtime accepts only a 200 application/json revocation response containing boolean active, boolean revoked, and optional RFC3339 expires_at, and treats revoked true or active false as revoked.
    condition: Whenever Runtime receives a revocation introspection response.
    failure: Return SESSION_EXPIRED for a determined revocation and reject every malformed response as temporarily unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r014
    kind: rule
    title: Indeterminate revocation fails unavailable
    modality: must
    statement: Network errors, non-2xx responses, wrong content type, and invalid revocation payloads return UNAVAILABLE with AUTH_REVOCATION_UNAVAILABLE and a retryable projection.
    condition: Whenever revocation state cannot be determined from the exact introspection contract.
    failure: Return the typed unavailable result and never downgrade the request to anonymous or active.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r015
    kind: rule
    title: Authentication failures use the closed reason taxonomy
    modality: must
    statement: Bearer format, signature, header, and claim failures return UNAUTHENTICATED with AUTH_TOKEN_INVALID, session revocation or expiration returns SESSION_EXPIRED, indeterminate revocation returns AUTH_REVOCATION_UNAVAILABLE, and ExternalPrincipal proof expiration or unsupported proof type may use AUTH_TOKEN_EXPIRED or AUTH_UNSUPPORTED_PROOF_TYPE respectively.
    condition: Whenever Runtime emits an authentication failure.
    failure: Reject the request with the applicable typed code instead of an ad hoc, anonymous, or success result.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r016
    kind: rule
    title: Authenticated context is minimal and parsed once
    modality: must
    statement: Successful authentication projects only subject_user_id from sub, issuer, audience, and optional session_id, and downstream authorization consumes that projection without reimplementing JWT parsing.
    condition: Whenever authenticated identity is passed to downstream Runtime authorization.
    failure: Reject duplicate token parsing or identity projection beyond the admitted minimum.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r017
    kind: rule
    title: Realm and Runtime claims configuration must align
    modality: must
    statement: Realm-issued iss equals auth.jwt.issuer, Realm-issued aud contains auth.jwt.audience, and Runtime obtains Realm verification keys only through auth.jwt.jwksUrl.
    condition: Whenever Realm tokens are issued for Runtime consumption.
    failure: Return UNAUTHENTICATED with AUTH_TOKEN_INVALID for every issuer or audience mismatch.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r018
    kind: rule
    title: JWT posture never establishes protected origin
    modality: must_not
    statement: A valid JWT or ordinary request-body authorization is interpreted as protected local origin for an RPC whose closed posture requires a separately verified carrier and role.
    condition: Whenever a Runtime operation requires independently verified protected origin.
    failure: Deny the RPC until its independently required protected origin is verified.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r019
    kind: rule
    title: Local configurations and assets are not ConnectorGrant targets
    modality: must_not
    statement: A Local Capability Configuration, Machine Local AI Configuration selection, LocalAsset, Driver configuration, or Local Job is treated as a ConnectorGrant kind or ownership path instead of using the canonical machine, configuration, asset, and Job owner policy.
    condition: Whenever Runtime authorizes Local capability configuration or execution.
    failure: Reject grant-derived Local ownership and validate the exact machine-owned configuration, bindings, and request.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r020
    kind: rule
    title: Cloud grant and Local machine authorization stay distinct
    modality: must
    statement: Cloud execution validates the selected ConnectorGrant owner, status, and referenced custody under the authenticated subject, while Local execution validates the canonical machine owner and exact selected Local Capability Configuration and LocalAsset access; an absent or invalid identity never enables inline Cloud execution or changes the committed AIConfig route, and any denied path fails without fallback.
    condition: Whenever Runtime authorizes Local or Cloud execution inputs.
    failure: Return the typed authentication or authorization failure and deny targets outside the exact owner partition without switching routes.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r021
    kind: rule
    title: Anonymous machine connectors are API key system records
    modality: must
    statement: A machine-global system custody record may use API_KEY with owner type SYSTEM and owner_id machine, but its existence never creates or selects a ConnectorGrant, AIConfig binding, Cloud route, provider, model, or capability and anonymous callers receive no implicit execution authority from it.
    condition: Whenever an anonymous caller creates or uses a machine-global connector.
    failure: Deny every anonymous machine connector with another auth kind or owner mapping.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r022
    kind: rule
    title: Remote connector ownership is information hidden
    modality: must
    statement: A missing remote connector, an owner mismatch, and anonymous access to a user-owned remote connector all return NOT_FOUND.
    condition: Whenever Runtime cannot expose a remote connector under caller ownership policy.
    failure: Return NOT_FOUND without distinguishing existence, ownership, or user-owned status.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r023
    kind: rule
    title: Connector owner mapping is fixed
    modality: must
    statement: Authenticated remote custody records map to REALM_USER, machine-global API_KEY custody records map to SYSTEM with owner_id machine, OAUTH_MANAGED custody records map to REALM_USER, and a ConnectorGrant separately binds one authorized account to one custody record; Local Capability Configurations and LocalAssets remain under their machine and RuntimeLocalService owners and Profile carries neither grant nor custody identity.
    condition: Whenever Runtime assigns or validates connector and target ownership.
    failure: Return NOT_FOUND or deny creation for every incompatible owner, auth-kind, or target-owner mapping.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r024
    kind: rule
    title: Connector creation follows caller identity
    modality: must
    statement: Create permits a valid JWT to create a user-owned remote connector and permits a caller without JWT to create only a machine-global API_KEY remote connector.
    condition: Whenever ConnectorService creates a connector.
    failure: Deny creation that does not match the authenticated-user or anonymous-machine branch.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r025
    kind: rule
    title: Connector mutation preserves owner and auth kind
    modality: must
    statement: Update and Delete require a valid JWT for user-owned remote connectors, while anonymous or authenticated callers may manage an owner_id machine connector only when its auth kind is API_KEY.
    condition: Whenever ConnectorService updates or deletes a connector.
    failure: Hide or deny the connector when caller identity, owner, or auth kind does not satisfy the mutation branch.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r026
    kind: rule
    title: Connector reads expose only caller-visible records
    modality: must
    statement: Get and List expose only caller-visible custody records, ListConnectorModels returns a bounded provider inventory snapshot without binding or routing, and Test Connector runs only as an explicit user-requested bounded diagnostic; user-owned records remain hidden from anonymous callers, every non-user-owned OAUTH_MANAGED record is NOT_FOUND, and no read or diagnostic creates a ConnectorGrant, readiness state, selection, or execution prerequisite.
    condition: Whenever ConnectorService reads, tests, or lists connectors or connector models.
    failure: Return NOT_FOUND for an invalid ownership and auth-kind combination without exposing the record.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r027
    kind: rule
    title: ConnectorGrant authorization order is fixed
    modality: must
    statement: After authentication and committed AIConfig Cloud-route validation, Runtime evaluates the selected ConnectorGrant owner, then grant status, then referenced custody owner and status, then minimum request-scoped credential material, then Driver-owned target and endpoint security, Remote ExecutionHost dispatch, and audit in that order; the grant never chooses the route or target.
    condition: Whenever Cloud execution uses a ConnectorGrant.
    failure: Stop at the first failed check, preserve information hiding, and do not reorder evaluation or switch route, target, provider, or grant.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.connector-grant-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r028
    kind: rule
    title: ScenarioJob ownership is captured at creation
    modality: must
    statement: ScenarioJob creation stores owner_id as jwt.sub for a valid JWT and anonymous otherwise, and GetScenarioJob, CancelScenarioJob, SubscribeScenarioJobEvents, and GetScenarioArtifacts authorize against that stored job owner independently of connector existence.
    condition: Whenever Runtime creates or accesses a ScenarioJob.
    failure: Deny job access on owner mismatch without depending on current connector state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r029
    kind: rule
    title: Authentication completes before authorization
    modality: must
    statement: Runtime enters owner, status, and credential authorization only after authentication succeeds.
    condition: Whenever a request carries authentication material.
    failure: Return the authentication failure without running authorization checks or exposing authorization state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r030
    kind: rule
    title: Ordinary identity cannot upgrade protected origin
    modality: must_not
    statement: Ordinary authn, a request-body app identifier, or an ownership match upgrades a call to a separately protected local origin.
    condition: Whenever a Runtime RPC requires protected transport or origin posture.
    failure: Deny the operation until the required carrier and origin role are independently verified.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r031
    kind: rule
    title: Runtime-private Host endpoints require validation
    modality: must
    statement: Runtime applies endpoint security validation to the exact remote endpoint materialized from Runtime-private Remote ExecutionHost configuration for the committed Driver, the selected ConnectorGrant contributes only authorization and request-scoped credential custody, and product execution accepts no Driver-, Grant-, caller-, AIConfig-, Catalog-, or environment-supplied endpoint or secret path.
    condition: Whenever Runtime prepares a remote ExecutionHost request.
    failure: Reject the request before network dispatch when the exact Host-materialized endpoint is unsafe or unvalidated or when any other source supplies the endpoint.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
  - id: rule.nimi.runtime.security-core.r032
    kind: rule
    title: Remote endpoints default to HTTPS
    modality: must
    statement: Runtime permits https endpoints by default and permits http only when allow_loopback_provider_endpoint is true and the target is localhost, 127.0.0.0/8, or ::1.
    condition: Whenever Runtime validates an endpoint scheme and loopback posture.
    failure: Reject non-HTTPS endpoints that do not satisfy every loopback exception condition.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
  - id: rule.nimi.runtime.security-core.r033
    kind: rule
    title: Unsafe address classes stay denied after DNS
    modality: must
    statement: Runtime unconditionally rejects 169.254.0.0/16, 169.254.169.254, fe80::/10, and fc00::/7, conditionally rejects localhost, 127.0.0.0/8, and ::1 when loopback is disabled, and reapplies those checks to every DNS result.
    condition: Whenever Runtime validates a literal or resolved provider address.
    failure: Reject the endpoint if any selected dial address belongs to a prohibited class.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
  - id: rule.nimi.runtime.security-core.r034
    kind: rule
    title: Validated DNS results are pinned without authority rewrite
    modality: must
    statement: Runtime dials only validated pinned IPs, preserves the original hostname for TLS ServerName and HTTP Host, and permits connection-level failover among all validated safe IPs returned for that hostname.
    condition: Whenever Runtime dispatches to a DNS-resolved remote endpoint.
    failure: Reject unpinned dialing, authority rewriting, or failover to an address that was not validated.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
  - id: rule.nimi.runtime.security-core.r035
    kind: rule
    title: Endpoint validation occurs at execution time
    modality: must
    statement: Runtime repeats endpoint and resolved-address validation immediately before every actual outbound request rather than relying only on create-time or update-time validation.
    condition: Whenever Runtime is about to open an outbound provider connection.
    failure: Stop network dispatch when current validation does not pass.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
  - id: rule.nimi.runtime.security-core.r036
    kind: rule
    title: Private endpoint allowlists are unavailable
    modality: must_not
    statement: Runtime uses a CIDR or host private-network allowlist to bypass the Phase 1 endpoint baseline.
    condition: Whenever endpoint policy evaluates a private or otherwise prohibited address.
    failure: Reject the address under the fixed baseline without an allowlist override.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
  - id: rule.nimi.runtime.security-core.r037
    kind: rule
    title: Public portable grant credentials stay removed
    modality: must_not
    statement: Runtime protocol, generated clients, SDK exports, service registration, persistence, or a renamed surface recreates the former portable generic credential-grant family, its reserved wire identities, portable tokens, bearers, scope lists, resource fingerprints, operation identifiers, delegation chains, or App-selected endpoints; the admitted ConnectorGrant is instead a non-portable account authorization binding with no secret or generic operation-resource delegation semantics.
    condition: Whenever a public grant or permission surface is defined or shipped.
    failure: Remove the portable credential surface and reject every operation that depends on it.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r038
    kind: rule
    title: Apps receive permission posture but no decision authority
    modality: must
    statement: The app-facing permission surface exposes only product-level status and request while approval, decision, revoke, minting, truth, and endpoint enforcement remain with Runtime or the canonical remote owner and Desktop is at most a future decision UI.
    condition: Whenever an app, SDK, Desktop, or Runtime surface handles a public permission.
    failure: Deny app-carried or Desktop-owned authority and keep enforcement with the canonical owner.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r039
    kind: rule
    title: Every local-app action has one authority class
    modality: must
    statement: Runtime classifies each local-app action as exactly one of base_entitlement, user_permission, one_shot_consent, app_owned_authority, or os_right.
    condition: Whenever Runtime authorizes a local-app action.
    failure: Return typed unavailable or deny when the action lacks one exact authority class.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r040
    kind: rule
    title: Only user permissions create durable decision rows
    modality: must
    statement: Only user_permission may use an owner-internal durable decision lifecycle, while base entitlements, app-owned authority, one-shot handles, and OS rights create no Runtime permission row.
    condition: Whenever Runtime considers permission persistence.
    failure: Reject persistence for every non-user-permission authority class.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r041
    kind: rule
    title: Non-permission product state cannot synthesize permission truth
    modality: must_not
    statement: Launch approval, publisher review, Developer Mode, login, session existence, product-route availability, AI routing, or metering creates or substitutes for permission truth.
    condition: Whenever Runtime derives public permission status or enforcement.
    failure: Return unavailable or deny until a current canonical owner decision exists.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r042
    kind: rule
    title: Public permission identity comes only from the Platform catalog
    modality: must
    statement: Public permission ids come only from the Platform Nimi app permission catalog, while internal operation and resource identities remain owner implementation details excluded from manifests, permission requests, ordinary SDK or Kit surfaces, approval UI, and app-readable diagnostics.
    condition: Whenever a permission or internal enforcement identity crosses a public surface.
    failure: Reject unknown public ids and remove internal operation or resource identities from the public projection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r043
    kind: rule
    title: Generic operation and resource grant engines are forbidden
    modality: must_not
    statement: Runtime persists or evaluates a generic capability_scope plus resource_scope grant.
    condition: Whenever Runtime models a public permission or protected endpoint decision.
    failure: Reject the generic grant and use the exact admitted owner permission or another exact authority class.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r044
    kind: rule
    title: Permission admission is atomic
    modality: must
    statement: A public permission becomes admitted only when decision owner, selector, lifecycle, endpoint mapping, audit, revoke, SDK and Kit projection, product UI, and positive evidence arrive atomically; a catalog row alone grants nothing.
    condition: Whenever a public permission is proposed or evaluated for admission.
    failure: Return typed unavailable for status and request and deny every mapped operation until the complete slice is admitted.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r045
    kind: rule
    title: Current public permission admission is bounded
    modality: must
    statement: The currently admitted third-party permissions keep agents.interact bounded to its closed Conversation operation family over opaque LocalAgent handles and agents.configure bounded to its admitted non-AI per-Agent autonomy and presentation settings plus, only when explicitly authorized as a shared-subsystem action, read, atomic overwrite, or Apply Profile for the one shared LocalAgent AIConfig without AIConfig revision or readiness; ai.text.generate is bounded to one synchronous foreground plain-text candidate-generation family over an owner-granted App-and-account scope with no resource selector or Agent-handle materialization, and permission only authorizes the call while Runtime consumes that App owner's committed AIConfig route. An Agent handle never creates per-Agent AIConfig, model override, route option, inventory selector, Machine Local AI Configuration action, Local Capability Configuration action, ConnectorGrant selection, or raw Agent, endpoint, credential, LocalAsset, catalog, Profile, source, Job, or media-resource disclosure. Runtime owns every durable revocable permission-decision lifecycle and endpoint enforcement, pre-grant and zero-permission sessions enumerate neither LocalAgents nor AI configuration choices and cannot generate a text candidate, and the declared history, projection, event, delegation-read, Avatar-handoff, derived-image, voice, background-AI, and delegation-decision extensions remain unavailable until each complete atomic slice is admitted.
    condition: Whenever a third-party public permission, decision, selector, or protected operation is evaluated.
    failure: Admit agents.interact and agents.configure only as complete permission slices and ai.text.generate only as the single-operation foreground plain-text slice, reject per-Agent or machine-local AI authority, disclose none of the prohibited raw identifiers, and return permission-id-preserving typed unavailable for incomplete, denied, expired, revoked, mismatched, cross-account, foreign-Conversation, inactive-turn, or out-of-subset access.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r046
    kind: rule
    title: Runtime-owned permission identity is owner-bound
    modality: must
    statement: Every Runtime-owned public permission lifecycle binds local_os_user_anchor, account_id, local_app_principal_id, permission_id, and owner_selector_digest; the canonical owner may issue an account scope covering all current and future LocalAgents, Runtime dynamically materializes that scope into opaque handle projections, ai.text.generate uses the App-and-account owner selector digest directly without Agent-handle materialization and never uses the permission selector as Local-or-Cloud route authority, dependent permissions evaluate only their intersection with effective agents.interact and become ineffective when it is revoked, and every admitted shared LocalAgent AIConfig action resolves the singular subsystem owner rather than an Agent handle. Permissioned Local Apps never treat display metadata as authorization or receive raw route endpoint, Provider Credential, ConnectorGrant custody material, LocalAsset identity, machine configuration, catalog, Profile, source, Job, or inventory fields.
    condition: Whenever a Runtime-owned public permission is atomically admitted.
    failure: Deny creation, use, or configuration projection when any owner binding, current-account filter, or effective interact dependency is missing, mismatched, revoked, stale, or App-authored, and expose no per-Agent AIConfig, machine-selection, raw identity, endpoint, credential, custody, source, Profile, Job, media-resource, or inventory field.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r047
    kind: rule
    title: Permission decisions are fresh revocable and audited
    modality: must
    statement: Every admitted permission lifecycle has monotonic revision, explicit user decision evidence, account and principal isolation, revoke semantics, fresh reads at every protected endpoint, and complete audit, and fails closed on account switch, principal tombstone, or owner-policy change without accepting app_id, publisher tier, provenance, catalog presence, or session validity as a substitute.
    condition: Whenever an admitted public permission is stored, read, enforced, or revoked.
    failure: Deny the protected operation when current owner decision evidence is absent, stale, transferred, or substituted.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r048
    kind: rule
    title: Cloud target grant and Local selection identities are separate
    modality: must
    statement: AIConfig Cloud intent names one CapabilityImplementation and Driver-owned provider-model target plus an explicitly selected ConnectorGrant, while the grant references account authorization and credential custody only; AIConfig Local intent names no target and Runtime dereferences the machine-selected Local Capability Configuration at Job submission. Connector, raw provider-model, legacy compact target, path, selected-source, and LocalAsset identities never substitute for these owners.
    condition: Whenever Runtime composes an AI execution target.
    failure: Reject every retired or cross-owner target shape rather than converting, inferring, or falling back.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.connector-grant-plane
  - id: rule.nimi.runtime.security-core.r049
    kind: rule
    title: Committed AIConfig is the only route source
    modality: must
    statement: AI execution uses only the Local or Cloud route committed in the canonical owner AIConfig; no managed connector, inline metadata, configured default, anonymous-local path, inventory, process health, or missing-field heuristic selects or changes that route, and Cloud execution requires the committed implementation target plus selected ConnectorGrant while Local execution requires the committed machine selection.
    condition: Whenever Runtime composes route and authorization inputs.
    failure: Reject missing or inconsistent committed inputs and never invent credentials, route intent, or a substitute path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.connector-grant-plane
  - id: rule.nimi.runtime.security-core.r050
    kind: rule
    title: ConnectorGrant authentication stays in custody
    modality: must
    statement: ConnectorGrant stores no secret and references one admitted API_KEY or OAUTH_MANAGED custody record, callers submit only the committed grant identity for execution, OAuth payloads remain provider-defined sealed secrets constrained by the admitted provider_auth_profile set, and every OAUTH_MANAGED custody record is user-owned; replacing an account normally replaces only the grant without changing the CapabilityImplementation or Driver target.
    condition: Whenever Runtime loads or validates a managed connector credential.
    failure: Return NOT_FOUND for machine-owned or system-owned OAUTH_MANAGED records and deny undeclared auth profiles.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.connector-grant-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r051
    kind: rule
    lifecycle: removed
    title: Retired inline credential execution path
    reason: Removed because all Cloud product execution requires an explicitly selected ConnectorGrant and no caller-inline secret or temporary product bypass is admitted.
  - id: rule.nimi.runtime.security-core.r052
    kind: rule
    lifecycle: removed
    title: Retired managed-versus-inline credential truth table
    reason: Removed with the inline execution path; ordinary requests accept neither inline credential nor inline endpoint fields.
  - id: rule.nimi.runtime.security-core.r053
    kind: rule
    lifecycle: removed
    title: Retired key-source metadata execution path
    reason: Removed because Cloud execution context derives from the canonical AIConfig owner, exact implementation target, selected ConnectorGrant and Driver, never raw key-source, provider, endpoint, or API-key headers.
  - id: rule.nimi.runtime.security-core.r054
    kind: rule
    title: AI consume evaluation sequence is closed
    modality: must
    statement: Runtime evaluates request normalization, authentication, canonical AIConfig owner and committed CapabilityContract route, then for Local the machine selection, exact Local Capability Configuration, Driver configuration, bindings and authorization, or for Cloud the exact CapabilityImplementation target, ConnectorGrant owner and status, referenced custody and minimum credential, endpoint security, then the CapabilityImplementationDriver, Local or Remote ExecutionHost dispatch, Job snapshot and audit in that order.
    condition: Whenever Runtime handles AI consume.
    failure: Stop at the first failed stage and do not bypass, reorder, or defer a security check beyond execution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.connector-grant-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r055
    kind: rule
    title: Managed OAuth consume never mutates custody
    modality: must_not
    statement: AI execution implicitly refreshes, replaces, or rewrites an OAUTH_MANAGED custody payload or selected ConnectorGrant; grant resolution returns more than the minimum request-scoped token or headers, stores that material in Profile, AIConfig, Driver configuration, ordinary workflow, or Job, or hides provider authentication rejection behind fallback or success.
    condition: Whenever AI consume resolves or uses an OAUTH_MANAGED credential.
    failure: Return the applicable typed failure without mutating the sealed payload.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.connector-grant-plane
  - id: rule.nimi.runtime.security-core.r056
    kind: rule
    title: Cloud grant and Local machine execution require exact subjects
    modality: must
    statement: Cloud execution requires an authenticated subject authorized for the selected ConnectorGrant and custody record, while Local execution requires the canonical machine and request owner authorized for the selected Local Capability Configuration and exact LocalAssets; neither branch admits inline metadata, and an invalid bearer never downgrades to anonymous Local execution or changes the committed route.
    condition: Whenever Runtime validates AI consume caller identity.
    failure: Reject a missing remote subject and return UNAUTHENTICATED with AUTH_TOKEN_INVALID for an invalid bearer instead of anonymous-local fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.connector-grant-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r057
    kind: rule
    title: Cloud intent and ConnectorGrant binding are independently valid
    modality: must
    statement: AIConfig may save a valid Cloud CapabilityImplementation and Driver-owned provider-model target intent without a ConnectorGrant, but execution requires exactly one explicit valid grant and accepts no inline provider, endpoint, or credential fields; absence or invalidity of the grant never invalidates the saved Cloud intent, changes the route, or selects another account or provider.
    condition: Whenever Runtime validates Cloud configuration or execution authorization.
    failure: Save valid target intent independently, and at execution return selection-required or the typed grant failure without automatic correction.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.connector-grant-plane
  - id: rule.nimi.runtime.security-core.r058
    kind: rule
    title: Missing ConnectorGrant fails execution as selection required
    modality: must
    statement: A Cloud AIConfig without a selected ConnectorGrant remains valid saved intent, and an execution attempt returns the typed selection-required admission reason before credential or transport work; no missing connector or inline-credential error is used to force a different route or make configuration invalid.
    condition: Whenever Cloud Job submission lacks a selected ConnectorGrant.
    failure: Return selection-required without selecting another grant, provider, model, Local route, or fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.connector-grant-plane
  - id: rule.nimi.runtime.security-core.r059
    kind: rule
    lifecycle: removed
    title: Retired inline provider destination
    reason: Removed because provider endpoints are CapabilityImplementationDriver configuration validated at execution and never caller-inline destination authority.
  - id: rule.nimi.runtime.security-core.r060
    kind: rule
    title: ConnectorGrant authorizes but never routes capability
    modality: must
    statement: A selected ConnectorGrant authorizes use of one account and custody record only; the committed Cloud CapabilityImplementation owns capability semantics, its Driver owns provider protocol and target configuration, and the Remote ExecutionHost owns transport and remote Job lifecycle, so a grant, connector, provider row, or account never selects or reroutes the capability.
    condition: Whenever a ConnectorGrant authorizes Cloud execution.
    failure: Reject unknown or unauthorized grant use and never derive implementation or target from custody.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.connector-grant-plane
  - id: rule.nimi.runtime.security-core.r061
    kind: rule
    lifecycle: removed
    title: Retired inline provider routing
    reason: Removed because Cloud execution requires committed AIConfig implementation-target intent and an explicit ConnectorGrant.
  - id: rule.nimi.runtime.security-core.r062
    kind: rule
    title: Selected execution routes never fall back
    modality: must_not
    statement: Runtime automatically switches Local to Cloud, Cloud to Local, one Local Capability Configuration to another, one CapabilityImplementation or provider-model target to another, or one ConnectorGrant to another after admission or execution failure.
    condition: Whenever a selected route fails.
    failure: Return the exact selected composition failure without trying another route, configuration, implementation, provider, target, grant, credential, or ExecutionHost.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.connector-grant-plane
  - id: rule.nimi.runtime.security-core.r063
    kind: rule
    title: Local and Cloud Job inputs are closed
    modality: must
    statement: A Local Job captures the committed AIConfig Local route, features and defaults, current selected Local Capability Configuration, exact CapabilityImplementation, Driver configuration, exact bindings and request, while a Cloud Job captures the exact CapabilityImplementation, Driver-owned provider-model target, selected ConnectorGrant, defaults and request; neither uses a legacy unified target tuple, current-state pointer, raw LocalAsset, connector identity, path, or provider label as the Job target.
    condition: Whenever Runtime validates or captures execution identity.
    failure: Reject missing, stale, incompatible, unknown, or retired inputs without minting identity from inventory, custody, or provider facts.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.connector-grant-plane
  - id: rule.nimi.runtime.security-core.r064
    kind: rule
    title: Memory embedding reuses canonical route and grant security
    modality: must
    statement: Memory embedding uses its canonical AIConfig route, for Local the machine-selected exact Local Capability Configuration and bindings, or for Cloud the exact CapabilityImplementation target and explicitly selected ConnectorGrant, and persists no inline credentials or endpoints; its separate bank owner retains bank binding, rebuild, migration, and cutover truth without a special connector router or readiness lifecycle.
    condition: Whenever Runtime resolves Desktop-host-owned cloud memory embedding configuration.
    failure: Reject local, invalid, owner-mismatched, status-invalid, credential-invalid, endpoint-invalid, or shortcut connector bindings.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.connector-grant-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r065
    kind: rule
    title: AIProfile carries no account authorization binding
    modality: must
    statement: AIProfile may carry only a Cloud CapabilityImplementation and Driver-owned provider-model target recommendation with features, defaults and portable provenance; it carries no connectorId, ConnectorGrant, account identity, custody reference, endpoint authority, secret, or live binding, while AIConfig gains a ConnectorGrant only through a separate explicit user selection.
    condition: Whenever AIProfile expresses Cloud intent or AIConfig selects Cloud authorization.
    failure: Reject account-bound, secret-bearing, custody-bound, or implicitly selected Profile content.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.connector-grant-plane
  - id: rule.nimi.runtime.security-core.r066
    kind: rule
    title: Retired target identities cannot carry new semantics
    modality: must_not
    statement: Raw model_id, target_model_id, localModelId, goRuntimeLocalModelId, targetId or profileId, compact local target, connector_id plus model_id, deprecated field, or renamed compatibility object is admitted as durable identity for AIConfig, Local Capability Configuration, machine selection, ConnectorGrant, or Job, while provider-model values remain Driver target configuration and custody identity remains distinct from the grant.
    condition: Whenever a caller, profile, or persisted record supplies a durable Runtime target.
    failure: Reject the retired identity without conversion and require the exact canonical owner object.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.connector-grant-plane
  - id: rule.nimi.runtime.security-core.r082
    kind: rule
    title: Local-app authority classes keep exact meanings
    modality: must
    statement: base_entitlement means the caller principal's bounded Nimi-private partition, user_permission means durable access through one admitted public permission id, one_shot_consent means one owner-selected resource represented by a bounded non-forgeable handle, app_owned_authority means the app host's own SQLite, media, settings, cache, routes, and product commands, and os_right means authority actually granted to the native process by the operating system.
    condition: Whenever Runtime classifies a local-app action.
    failure: Deny the action when its claimed authority does not match the exact selected class meaning.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r083
    kind: rule
    title: Pre-admission permission storage stays absent
    modality: must
    statement: The pre-admission permission schema retains store_identity absent_pre_admission and positive mutation absent, and neither value changes through a standalone schema, persistence, or CRUD change outside the full atomic permission admission slice.
    condition: Until a Runtime-owned public permission is atomically admitted.
    failure: Reject any permission store or mutation path introduced independently of the complete admission slice.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r084
    kind: rule
    title: Route implementation grant and custody identities stay distinct
    modality: must
    statement: AIConfig route intent, CapabilityImplementation semantics, CapabilityImplementationDriver protocol and target configuration, ConnectorGrant account authorization, credential custody, and Local or Remote ExecutionHost transport are distinct identities; no inline credential escape hatch, local connector probe facade, provider runtime-plane label, or custody preference is interpreted as Local or Cloud route, target, selection, admission, or fallback.
    condition: Whenever Runtime or a consumer classifies route, implementation, Driver, grant, custody, or Host.
    failure: Reject execution that conflates any identity or derives route or target from custody or provider taxonomy.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.connector-grant-plane
  - id: rule.nimi.runtime.security-core.r085
    kind: rule
    title: Grant credentials enter only request execution context
    modality: must
    statement: Runtime resolves a selected ConnectorGrant to its custody reference only after grant owner and status validation, obtains the minimum protocol authentication material only for the request-scoped execution context, lets the exact CapabilityImplementationDriver consume it while the Remote ExecutionHost transports the request, never persists it in Profile, AIConfig, Driver configuration, ordinary workflow, or Job, and prevents downstream modules from reading credential storage directly.
    condition: Whenever Runtime prepares Cloud execution.
    failure: Stop execution when exact grant material cannot be injected through the request context or any downstream module attempts direct storage access.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.connector-grant-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
