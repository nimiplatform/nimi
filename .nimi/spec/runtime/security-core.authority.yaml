format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.security-core
units:
  - id: definition.nimi.runtime.security-core.token-validation-plane
    kind: definition
    title: Runtime token validation plane
    meaning: The Runtime token validation plane parses Realm bearer input, validates JWT headers, claims, time bounds, JWKS signatures, session revocation, and cross-service claim alignment, and projects only the minimum authenticated identity context.
  - id: definition.nimi.runtime.security-core.ownership-authorization-plane
    kind: definition
    title: Runtime ownership authorization plane
    meaning: The Runtime ownership authorization plane applies authenticated, anonymous, connector, local target, and ScenarioJob ownership policy only after authentication and preserves information hiding and fixed evaluation order.
  - id: definition.nimi.runtime.security-core.endpoint-security-plane
    kind: definition
    title: Runtime endpoint security plane
    meaning: The Runtime endpoint security plane validates every managed or inline remote endpoint at execution time, rejects unsafe address classes after DNS resolution, and pins validated dial targets without changing the original TLS or HTTP authority.
  - id: definition.nimi.runtime.security-core.grant-service-plane
    kind: definition
    title: Runtime permission decision plane
    meaning: The Runtime permission decision plane is the owner-internal lifecycle boundary for atomically admitted public user permissions after removal of the former portable credential-grant family and separation of all non-permission authority classes.
  - id: definition.nimi.runtime.security-core.key-routing-plane
    kind: definition
    title: Runtime key source and routing plane
    meaning: The Runtime key source and routing plane selects mutually exclusive managed connector, inline remote, configured, or anonymous local execution paths through fixed identity, credential, endpoint, target, routing, and audit checks without path fallback.
  - id: rule.nimi.runtime.security-core.r001
    kind: rule
    title: Authorization metadata has one bearer shape
    modality: must
    statement: Runtime reads authentication only from the normalized gRPC authorization metadata key, accepts only Bearer followed by one JWT, and treats an absent authorization value as anonymous without error.
    condition: Whenever a Runtime request enters bearer authentication.
    failure: Reject any unsupported authentication carrier or bearer shape instead of deriving authenticated identity from it.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r002
    kind: rule
    title: Malformed authorization never downgrades to anonymous
    modality: must_not
    statement: A present but malformed authorization value is treated as anonymous or allowed to continue without UNAUTHENTICATED and AUTH_TOKEN_INVALID.
    condition: Whenever authorization metadata is present but is not a valid bearer input.
    failure: Return UNAUTHENTICATED with AUTH_TOKEN_INVALID before authorization evaluation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r003
    kind: rule
    title: Realm JWT claims are closed and time checked
    modality: must
    statement: Realm JWT validation requires iss, aud, sub, exp, and iat and applies temporal validation to nbf whenever nbf is present.
    condition: Whenever Runtime validates a Realm JWT.
    failure: Return UNAUTHENTICATED with AUTH_TOKEN_INVALID when a required claim is absent or a temporal claim is invalid.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r004
    kind: rule
    title: JWT algorithm and key shape follow generated Realm JWKS
    modality: must
    statement: Runtime accepts only RS256 and key shapes currently declared by the generated Realm JWKS contract and maintains no parallel transport DTO or independently widened algorithm set.
    condition: Whenever Runtime selects a JWT verification algorithm or key.
    failure: Return UNAUTHENTICATED with AUTH_TOKEN_INVALID for every undeclared algorithm or key shape.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r005
    kind: rule
    title: Unsigned and keyless JWT headers are denied
    modality: must_not
    statement: Runtime accepts alg none or a JWT header without kid.
    condition: Whenever Runtime parses a JWT header.
    failure: Return UNAUTHENTICATED with AUTH_TOKEN_INVALID before signature verification proceeds.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r006
    kind: rule
    title: JWKS lookup refreshes once on cache or key miss
    modality: must
    statement: Runtime uses the cached JWKS snapshot first and performs one refresh on cache miss or kid miss.
    condition: Whenever JWT verification cannot resolve the requested kid from the current cache.
    failure: Return UNAUTHENTICATED rather than retrying without bound or downgrading to anonymous.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r007
    kind: rule
    title: JWKS stale fallback is short and key specific
    modality: must
    statement: A failed JWKS refresh may use the most recent successful snapshot only within a short TTL and only when that snapshot already contains the requested kid.
    condition: Whenever a JWKS refresh fails after a previously successful fetch.
    failure: Return UNAUTHENTICATED when the fallback window expired or the requested kid is absent.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r008
    kind: rule
    title: JWKS has one configured secure source
    modality: must
    statement: auth.jwt.jwksUrl is the only Runtime verification-key source, publicKeyPath is excluded from the verification chain, and jwksUrl uses https except that http is allowed for localhost, 127.0.0.0/8, or ::1.
    condition: Whenever Runtime configures or fetches JWT verification keys.
    failure: Disable the bearer JWT path when the source or transport violates the fixed JWKS boundary.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r009
    kind: rule
    title: JWT temporal skew is fixed
    modality: must
    statement: Runtime applies a fixed plus or minus 60 second skew window to exp and nbf and gives no soft tolerance outside that window.
    condition: Whenever Runtime evaluates JWT expiration or not-before time.
    failure: Return UNAUTHENTICATED with AUTH_TOKEN_INVALID when the token lies outside the fixed window.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r010
    kind: rule
    title: Signed sessions still require revocation validation
    modality: must
    statement: After successful JWT signature validation Runtime requires sid and queries the configured session revocation endpoint whenever the session domain is available.
    condition: Whenever a bearer JWT passes signature and claim validation.
    failure: Return SESSION_EXPIRED for a revoked or expired session and do not treat signature validity as session validity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r011
    kind: rule
    title: Bearer restart configuration is atomic
    modality: must
    statement: auth.jwt.revocationUrl, auth.jwt.issuer, auth.jwt.audience, and auth.jwt.jwksUrl form one restart configuration group and the bearer JWT path is enabled only when every member is present.
    condition: Whenever Runtime starts or restarts bearer authentication.
    failure: Disable the bearer JWT path instead of operating with a partial configuration group.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r012
    kind: rule
    title: Revocation introspection request has one wire shape
    modality: must
    statement: Runtime posts JSON to auth.jwt.revocationUrl with session_id, subject_user_id, issuer, audience, issued_at, and expires_at.
    condition: Whenever Runtime introspects a bearer session.
    failure: Treat inability to construct or send the exact request as AUTH_REVOCATION_UNAVAILABLE.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r013
    kind: rule
    title: Revocation introspection response is closed
    modality: must
    statement: Runtime accepts only a 200 application/json revocation response containing boolean active, boolean revoked, and optional RFC3339 expires_at, and treats revoked true or active false as revoked.
    condition: Whenever Runtime receives a revocation introspection response.
    failure: Return SESSION_EXPIRED for a determined revocation and reject every malformed response as temporarily unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r014
    kind: rule
    title: Indeterminate revocation fails unavailable
    modality: must
    statement: Network errors, non-2xx responses, wrong content type, and invalid revocation payloads return UNAVAILABLE with AUTH_REVOCATION_UNAVAILABLE and a retryable projection.
    condition: Whenever revocation state cannot be determined from the exact introspection contract.
    failure: Return the typed unavailable result and never downgrade the request to anonymous or active.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r015
    kind: rule
    title: Authentication failures use the closed reason taxonomy
    modality: must
    statement: Bearer format, signature, header, and claim failures return UNAUTHENTICATED with AUTH_TOKEN_INVALID, session revocation or expiration returns SESSION_EXPIRED, indeterminate revocation returns AUTH_REVOCATION_UNAVAILABLE, and ExternalPrincipal proof expiration or unsupported proof type may use AUTH_TOKEN_EXPIRED or AUTH_UNSUPPORTED_PROOF_TYPE respectively.
    condition: Whenever Runtime emits an authentication failure.
    failure: Reject the request with the applicable typed code instead of an ad hoc, anonymous, or success result.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r016
    kind: rule
    title: Authenticated context is minimal and parsed once
    modality: must
    statement: Successful authentication projects only subject_user_id from sub, issuer, audience, and optional session_id, and downstream authorization consumes that projection without reimplementing JWT parsing.
    condition: Whenever authenticated identity is passed to downstream Runtime authorization.
    failure: Reject duplicate token parsing or identity projection beyond the admitted minimum.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r017
    kind: rule
    title: Realm and Runtime claims configuration must align
    modality: must
    statement: Realm-issued iss equals auth.jwt.issuer, Realm-issued aud contains auth.jwt.audience, and Runtime obtains Realm verification keys only through auth.jwt.jwksUrl.
    condition: Whenever Realm tokens are issued for Runtime consumption.
    failure: Return UNAUTHENTICATED with AUTH_TOKEN_INVALID for every issuer or audience mismatch.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r018
    kind: rule
    title: JWT posture never establishes protected origin
    modality: must_not
    statement: A valid JWT or ordinary request-body authorization is interpreted as protected local origin for an RPC whose closed posture requires a separately verified carrier and role.
    condition: Whenever a Runtime operation requires independently verified protected origin.
    failure: Deny the RPC until its independently required protected origin is verified.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r019
    kind: rule
    title: Local models are not connector ownership targets
    modality: must_not
    statement: LOCAL_MODEL is treated as an active connector kind or connector ownership path instead of deriving local model authorization from Runtime local asset and profile ownership.
    condition: Whenever Runtime authorizes a local model target.
    failure: Reject connector-derived local ownership and resolve the target through Runtime local asset and profile authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r020
    kind: rule
    title: Authenticated and anonymous target access stays distinct
    modality: must
    statement: A valid Realm JWT may access caller-owned local asset or profile refs and sub-owned REMOTE_MANAGED connectors, while an absent JWT may access machine-local asset or profile refs, system-owned remote connectors, and inline execution; a present invalid bearer is denied as unauthenticated.
    condition: Whenever Runtime selects authenticated or anonymous ownership policy.
    failure: Return UNAUTHENTICATED for an invalid bearer and deny targets outside the applicable identity partition.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r021
    kind: rule
    title: Anonymous machine connectors are API key system records
    modality: must
    statement: An anonymous machine-global REMOTE_MANAGED connector uses auth_kind API_KEY, owner type SYSTEM, and owner_id machine.
    condition: Whenever an anonymous caller creates or uses a machine-global connector.
    failure: Deny every anonymous machine connector with another auth kind or owner mapping.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r022
    kind: rule
    title: Remote connector ownership is information hidden
    modality: must
    statement: A missing remote connector, an owner mismatch, and anonymous access to a user-owned remote connector all return NOT_FOUND.
    condition: Whenever Runtime cannot expose a remote connector under caller ownership policy.
    failure: Return NOT_FOUND without distinguishing existence, ownership, or user-owned status.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r023
    kind: rule
    title: Connector owner mapping is fixed
    modality: must
    statement: Authenticated REMOTE_MANAGED connectors map to REALM_USER, anonymous machine-global API_KEY connectors map to SYSTEM with owner_id machine, OAUTH_MANAGED connectors always map to REALM_USER, and local asset or profile refs remain under RuntimeLocalService ownership.
    condition: Whenever Runtime assigns or validates connector and target ownership.
    failure: Return NOT_FOUND or deny creation for every incompatible owner, auth-kind, or target-owner mapping.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r024
    kind: rule
    title: Connector creation follows caller identity
    modality: must
    statement: Create permits a valid JWT to create a user-owned remote connector and permits a caller without JWT to create only a machine-global API_KEY remote connector.
    condition: Whenever ConnectorService creates a connector.
    failure: Deny creation that does not match the authenticated-user or anonymous-machine branch.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r025
    kind: rule
    title: Connector mutation preserves owner and auth kind
    modality: must
    statement: Update and Delete require a valid JWT for user-owned remote connectors, while anonymous or authenticated callers may manage an owner_id machine connector only when its auth kind is API_KEY.
    condition: Whenever ConnectorService updates or deletes a connector.
    failure: Hide or deny the connector when caller identity, owner, or auth kind does not satisfy the mutation branch.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r026
    kind: rule
    title: Connector reads expose only caller-visible records
    modality: must
    statement: Get, List, Test, and ListConnectorModels may run without JWT, hide user-owned remote connectors from anonymous callers, keep system-owned remote connectors visible, and treat every non-user-owned OAUTH_MANAGED record as NOT_FOUND.
    condition: Whenever ConnectorService reads, tests, or lists connectors or connector models.
    failure: Return NOT_FOUND for an invalid ownership and auth-kind combination without exposing the record.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r027
    kind: rule
    title: AI connector authorization order is fixed
    modality: must
    statement: After JWT validation the connector_id path evaluates owner, then status, then credential in that order before endpoint, target, route, and audit processing.
    condition: Whenever AI consume uses a managed connector.
    failure: Stop at the first failed check and do not reorder evaluation in a way that leaks ownership or connector state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r028
    kind: rule
    title: ScenarioJob ownership is captured at creation
    modality: must
    statement: ScenarioJob creation stores owner_id as jwt.sub for a valid JWT and anonymous otherwise, and GetScenarioJob, CancelScenarioJob, SubscribeScenarioJobEvents, and GetScenarioArtifacts authorize against that stored job owner independently of connector existence.
    condition: Whenever Runtime creates or accesses a ScenarioJob.
    failure: Deny job access on owner mismatch without depending on current connector state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r029
    kind: rule
    title: Authentication completes before authorization
    modality: must
    statement: Runtime enters owner, status, and credential authorization only after authentication succeeds.
    condition: Whenever a request carries authentication material.
    failure: Return the authentication failure without running authorization checks or exposing authorization state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r030
    kind: rule
    title: Ordinary identity cannot upgrade protected origin
    modality: must_not
    statement: Ordinary authn, a request-body app identifier, or an ownership match upgrades a call to a separately protected local origin.
    condition: Whenever a Runtime RPC requires protected transport or origin posture.
    failure: Deny the operation until the required carrier and origin role are independently verified.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r031
    kind: rule
    title: Managed and inline endpoints share validation
    modality: must
    statement: Runtime applies endpoint security validation to every REMOTE_MANAGED connector endpoint and every inline x-nimi-provider-endpoint.
    condition: Whenever Runtime prepares a remote provider request.
    failure: Reject the request before network dispatch when either endpoint source is unvalidated.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
  - id: rule.nimi.runtime.security-core.r032
    kind: rule
    title: Remote endpoints default to HTTPS
    modality: must
    statement: Runtime permits https endpoints by default and permits http only when allow_loopback_provider_endpoint is true and the target is localhost, 127.0.0.0/8, or ::1.
    condition: Whenever Runtime validates an endpoint scheme and loopback posture.
    failure: Reject non-HTTPS endpoints that do not satisfy every loopback exception condition.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
  - id: rule.nimi.runtime.security-core.r033
    kind: rule
    title: Unsafe address classes stay denied after DNS
    modality: must
    statement: Runtime unconditionally rejects 169.254.0.0/16, 169.254.169.254, fe80::/10, and fc00::/7, conditionally rejects localhost, 127.0.0.0/8, and ::1 when loopback is disabled, and reapplies those checks to every DNS result.
    condition: Whenever Runtime validates a literal or resolved provider address.
    failure: Reject the endpoint if any selected dial address belongs to a prohibited class.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
  - id: rule.nimi.runtime.security-core.r034
    kind: rule
    title: Validated DNS results are pinned without authority rewrite
    modality: must
    statement: Runtime dials only validated pinned IPs, preserves the original hostname for TLS ServerName and HTTP Host, and permits connection-level failover among all validated safe IPs returned for that hostname.
    condition: Whenever Runtime dispatches to a DNS-resolved remote endpoint.
    failure: Reject unpinned dialing, authority rewriting, or failover to an address that was not validated.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
  - id: rule.nimi.runtime.security-core.r035
    kind: rule
    title: Endpoint validation occurs at execution time
    modality: must
    statement: Runtime repeats endpoint and resolved-address validation immediately before every actual outbound request rather than relying only on create-time or update-time validation.
    condition: Whenever Runtime is about to open an outbound provider connection.
    failure: Stop network dispatch when current validation does not pass.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
  - id: rule.nimi.runtime.security-core.r036
    kind: rule
    title: Private endpoint allowlists are unavailable
    modality: must_not
    statement: Runtime uses a CIDR or host private-network allowlist to bypass the Phase 1 endpoint baseline.
    condition: Whenever endpoint policy evaluates a private or otherwise prohibited address.
    failure: Reject the address under the fixed baseline without an allowlist override.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
  - id: rule.nimi.runtime.security-core.r037
    kind: rule
    title: Public portable grant credentials stay removed
    modality: must_not
    statement: Runtime proto, generated clients, SDK exports, service registration, persistence, or a renamed surface recreates the former public credential-grant family, its reserved wire identities, tokens, bearers, scope lists, resource fingerprints, operation identifiers, delegation chains, or app-selected endpoints.
    condition: Whenever a public grant or permission surface is defined or shipped.
    failure: Remove the portable credential surface and reject every operation that depends on it.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r038
    kind: rule
    title: Apps receive permission posture but no decision authority
    modality: must
    statement: The app-facing permission surface exposes only product-level status and request while approval, decision, revoke, minting, truth, and endpoint enforcement remain with Runtime or the canonical remote owner and Desktop is at most a future decision UI.
    condition: Whenever an app, SDK, Desktop, or Runtime surface handles a public permission.
    failure: Deny app-carried or Desktop-owned authority and keep enforcement with the canonical owner.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r039
    kind: rule
    title: Every local-app action has one authority class
    modality: must
    statement: Runtime classifies each local-app action as exactly one of base_entitlement, user_permission, one_shot_consent, app_owned_authority, or os_right.
    condition: Whenever Runtime authorizes a local-app action.
    failure: Return typed unavailable or deny when the action lacks one exact authority class.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r040
    kind: rule
    title: Only user permissions create durable decision rows
    modality: must
    statement: Only user_permission may use an owner-internal durable decision lifecycle, while base entitlements, app-owned authority, one-shot handles, and OS rights create no Runtime permission row.
    condition: Whenever Runtime considers permission persistence.
    failure: Reject persistence for every non-user-permission authority class.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r041
    kind: rule
    title: Non-permission product state cannot synthesize permission truth
    modality: must_not
    statement: Launch approval, publisher review, Developer Mode, login, session existence, product-route availability, AI routing, or metering creates or substitutes for permission truth.
    condition: Whenever Runtime derives public permission status or enforcement.
    failure: Return unavailable or deny until a current canonical owner decision exists.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r042
    kind: rule
    title: Public permission identity comes only from the Platform catalog
    modality: must
    statement: Public permission ids come only from the Platform Nimi app permission catalog, while internal operation and resource identities remain owner implementation details excluded from manifests, permission requests, ordinary SDK or Kit surfaces, approval UI, and app-readable diagnostics.
    condition: Whenever a permission or internal enforcement identity crosses a public surface.
    failure: Reject unknown public ids and remove internal operation or resource identities from the public projection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r043
    kind: rule
    title: Generic operation and resource grant engines are forbidden
    modality: must_not
    statement: Runtime persists or evaluates a generic capability_scope plus resource_scope grant.
    condition: Whenever Runtime models a public permission or protected endpoint decision.
    failure: Reject the generic grant and use the exact admitted owner permission or another exact authority class.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r044
    kind: rule
    title: Permission admission is atomic
    modality: must
    statement: A public permission becomes admitted only when decision owner, selector, lifecycle, endpoint mapping, audit, revoke, SDK and Kit projection, product UI, and positive evidence arrive atomically; a catalog row alone grants nothing.
    condition: Whenever a public permission is proposed or evaluated for admission.
    failure: Return typed unavailable for status and request and deny every mapped operation until the complete slice is admitted.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r045
    kind: rule
    title: Current public permission admission is bounded
    modality: must
    statement: The currently admitted third-party LocalAgent permissions are agents.interact for only the open-conversation, send-turn, turn-interrupt, subscribe-turn, and conversation-snapshot families over an owner-granted account scope dynamically materialized as opaque handles carrying a display name and nullable stable public HTTPS avatar display URL, plus agents.configure for only its closed seven-operation family over the effective same-account agents.interact scope, with bounded capability-scoped route options available only inside configuration-snapshot after current-account, current agents.configure grant, effective agents.interact grant, current Runtime inventory, capability, and selectable-availability filtering and with no raw Agent identity, endpoint, credential, local asset, connector, catalog, snapshot, profile, source, or media-resource identifier disclosure; the avatar URL is resolved only by Runtime from the exact current Agent source version, contains no raw source or profile reference, and remains display-only metadata that never establishes authorization, ownership, or source freshness; turn-interrupt remains bounded to an active turn in a Conversation opened by that app principal through its handle, Runtime owns both durable revocable decision lifecycles and endpoint enforcement, pre-grant and zero-permission sessions cannot enumerate LocalAgents, route options, or build selectors, and the declared history, projection, event, delegation-read, Avatar-handoff, derived-image, voice, and delegation-decision extensions remain unavailable until each complete atomic slice is admitted.
    condition: Whenever a third-party public permission, decision, selector, or protected operation is evaluated.
    failure: Admit only the complete agents.interact five-operation slice with its bounded opaque-handle display metadata and agents.configure seven-operation slice, keep route options inside configuration-snapshot, omit every route option failing the required filters, omit any avatar URL that is not a stable public HTTPS display resource for the exact current Agent source version, disclose none of the prohibited raw identifiers, and return permission-id-preserving typed unavailable for every incomplete extension or denied, expired, revoked, mismatched, cross-account, foreign-conversation, inactive-turn, stale-inventory, or out-of-subset access.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r046
    kind: rule
    title: Runtime-owned permission identity is owner-bound
    modality: must
    statement: Every Runtime-owned public permission lifecycle binds local_os_user_anchor, account_id, local_app_principal_id, permission_id, and owner_selector_digest; the canonical owner may issue an account scope covering all current and future LocalAgents, Runtime dynamically materializes that scope into opaque handle projections carrying only the display name and optional stable public HTTPS avatar display URL alongside the handle, dependent agents.configure, agents.voice, and agents.delegate permissions evaluate only their intersection with the effective agents.interact scope and become ineffective immediately when interact is revoked, Runtime derives configuration-snapshot route options only after resolving the caller, account, current grants, and opaque Agent handle internally, permissioned Local Apps never treat projected display metadata as authorization, ownership, or source-freshness truth, and permissioned Local Apps neither supply nor receive ownerUserId, runtimeSourceRef, localAgentRef, subjectUserId, an Agent selector, raw route endpoint, Provider Credential or custody material, local asset id, connector id, catalog, snapshot, profile, source reference, media-resource reference, or another raw identity or inventory field.
    condition: Whenever a Runtime-owned public permission is atomically admitted.
    failure: Deny creation, use, or route-option projection when any binding, current-account filter, caller-visible inventory filter, or effective interact dependency is missing, mismatched, revoked, stale, or app-authored, omit invalid or non-public avatar display resources, and expose no raw identity, endpoint, credential, custody, source, profile, media-resource, or inventory field.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r047
    kind: rule
    title: Permission decisions are fresh revocable and audited
    modality: must
    statement: Every admitted permission lifecycle has monotonic revision, explicit user decision evidence, account and principal isolation, revoke semantics, fresh reads at every protected endpoint, and complete audit, and fails closed on account switch, principal tombstone, or owner-policy change without accepting app_id, publisher tier, provenance, catalog presence, or session validity as a substitute.
    condition: Whenever an admitted public permission is stored, read, enforced, or revoked.
    failure: Deny the protected operation when current owner decision evidence is absent, stale, transferred, or substituted.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r048
    kind: rule
    title: Durable target identity follows Runtime Target v2
    modality: must
    statement: connector_id remains managed credential custody only, remote cloud execution resolves through remote_model_catalog_id, local execution resolves through the v2 local durable discriminant, and older model_id or connector_id plus model_id shapes are not durable target identity.
    condition: Whenever Runtime resolves an AI execution target.
    failure: Reject every retired durable target shape rather than converting or inferring it.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
  - id: rule.nimi.runtime.security-core.r049
    kind: rule
    title: Key source has mutually exclusive explicit paths
    modality: must
    statement: AI consume uses either a managed remote connector_id path or an inline remote metadata path, while a request with neither continues only to Runtime-configured or anonymous-local routing evaluation and local connectors never enter AI consume execution.
    condition: Whenever Runtime selects an AI key source.
    failure: Reject ambiguous or unsupported paths and do not invent credentials or a local connector execution path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
  - id: rule.nimi.runtime.security-core.r050
    kind: rule
    title: Managed connector authentication stays in custody
    modality: must
    statement: Managed remote connectors admit API_KEY or OAUTH_MANAGED, callers submit only connector_id, OAuth payloads remain provider-defined sealed secrets constrained by the admitted provider_auth_profile set, and every OAUTH_MANAGED connector is user-owned.
    condition: Whenever Runtime loads or validates a managed connector credential.
    failure: Return NOT_FOUND for machine-owned or system-owned OAUTH_MANAGED records and deny undeclared auth profiles.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r051
    kind: rule
    title: Inline credentials remain a caller-owned escape hatch
    modality: must
    statement: Inline remote credentials are limited to separately admitted development, direct external SDK consumer, and temporary call scenarios, Desktop always uses managed connectors without renderer access to raw API keys, and Runtime guarantees audit redaction without projecting inline credentials to consumers.
    condition: Whenever inline metadata is offered or projected.
    failure: Reject inline credentials from Desktop-managed product paths and redact them from audit output.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
  - id: rule.nimi.runtime.security-core.r052
    kind: rule
    title: Managed and inline credentials cannot coexist
    modality: must_not
    statement: connector_id appears together with any inline credential field.
    condition: Whenever Runtime parses AI request body and metadata.
    failure: Return AI_REQUEST_CREDENTIAL_CONFLICT before connector or provider execution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
  - id: rule.nimi.runtime.security-core.r053
    kind: rule
    title: Key source metadata and app identity are fixed
    modality: must
    statement: Inline and managed metadata uses only x-nimi-key-source, x-nimi-provider-type, x-nimi-provider-endpoint, and x-nimi-provider-api-key, management RPC app_id is required only as x-nimi-app-id, and AI consume app_id is required in the request body.
    condition: Whenever Runtime parses key-source metadata or app identity for management and consume RPCs.
    failure: Reject missing required app identity and unsupported or misplaced authority inputs.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
  - id: rule.nimi.runtime.security-core.r054
    kind: rule
    title: AI consume evaluation sequence is closed
    modality: must
    statement: Runtime evaluates body and metadata normalization, optional JWT, non-empty app_id, key-source mutual exclusion, connector load, owner and status and credential, remote endpoint, inline endpoint, target or remote catalog, and route execution plus audit in that order.
    condition: Whenever Runtime handles AI consume.
    failure: Stop at the first failed stage and do not bypass, reorder, or defer a security check beyond execution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r055
    kind: rule
    title: Managed OAuth consume never mutates custody
    modality: must_not
    statement: AI consume implicitly refreshes, replaces, or rewrites an OAUTH_MANAGED payload; credential resolution returns more than the minimum execution token or headers, maps missing execution material to anything other than AI_CONNECTOR_CREDENTIAL_MISSING, or maps provider authentication rejection to anything other than AI_PROVIDER_AUTH_FAILED.
    condition: Whenever AI consume resolves or uses an OAUTH_MANAGED credential.
    failure: Return the applicable typed failure without mutating the sealed payload.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
  - id: rule.nimi.runtime.security-core.r056
    kind: rule
    title: Remote consume requires subject identity
    modality: must
    statement: subject_user_id is required for CLOUD routing, every managed remote connector, and every inline remote path, and may be empty only for explicit LOCAL routing with no connector, no inline metadata, and no Authorization header.
    condition: Whenever Runtime validates AI consume caller identity.
    failure: Reject a missing remote subject and return UNAUTHENTICATED with AUTH_TOKEN_INVALID for an invalid bearer instead of anonymous-local fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.token-validation-plane
  - id: rule.nimi.runtime.security-core.r057
    kind: rule
    title: Managed and inline field truth is fail closed
    modality: must
    statement: Managed or implicit-connector routing requires a non-empty connector_id and forbids all inline provider fields, while inline routing forbids connector_id and requires every provider field declared for that provider, with no automatic correction to another route.
    condition: Whenever Runtime validates the key-source field combination.
    failure: Reject every truth-table violation before credential or route resolution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
  - id: rule.nimi.runtime.security-core.r058
    kind: rule
    title: Missing key-source fields have exact errors
    modality: must
    statement: Explicit managed routing without connector_id returns INVALID_ARGUMENT with AI_CONNECTOR_ID_REQUIRED and missing required inline credential fields return INVALID_ARGUMENT with AI_REQUEST_CREDENTIAL_MISSING.
    condition: Whenever key-source validation finds a required field absent or empty.
    failure: Return the exact typed error without selecting a different key source.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
  - id: rule.nimi.runtime.security-core.r059
    kind: rule
    title: Providers that require endpoint reject implicit inline destinations
    modality: must
    statement: Inline providers declared to require an explicit endpoint require non-empty x-nimi-provider-endpoint.
    condition: Whenever inline routing selects a provider with explicit endpoint requirement.
    failure: Return INVALID_ARGUMENT with AI_REQUEST_CREDENTIAL_MISSING when the endpoint is absent or empty.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
  - id: rule.nimi.runtime.security-core.r060
    kind: rule
    title: Managed routing admits only remote capability rows
    modality: must
    statement: Managed routing loads connector_id, rejects retired raw local connector kind 1 with FAILED_PRECONDITION and AI_LOCAL_CONNECTOR_RETIRED, requires provider runtime_plane remote, and dispatches through nimillm according to the provider capability row.
    condition: Whenever connector_id selects managed execution.
    failure: Reject local, unknown, or non-remote connector routing before provider execution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
  - id: rule.nimi.runtime.security-core.r061
    kind: rule
    title: Inline routing admits only declared remote providers
    modality: must
    statement: Inline routing requires a provider capability row with runtime_plane remote and inline_supported true and dispatches through nimillm.
    condition: Whenever x-nimi-key-source selects inline execution.
    failure: Reject local-plane, unsupported-inline, or unknown providers before execution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
  - id: rule.nimi.runtime.security-core.r062
    kind: rule
    title: Selected execution routes never fall back
    modality: must_not
    statement: Runtime automatically switches from a selected managed, inline, cloud, or local execution path to another path after execution failure.
    condition: Whenever a selected route fails.
    failure: Return the selected route failure without trying another credential or execution path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
  - id: rule.nimi.runtime.security-core.r063
    kind: rule
    title: Remote and local target refs are closed
    modality: must
    statement: Remote managed execution requires connector_id, remote_model_catalog_id, provider_model_id, and provider, returning AI_REMOTE_MODEL_CATALOG_ID_REQUIRED for a missing catalog id and AI_REMOTE_MODEL_CATALOG_STALE for a stale or snapshot-mismatched id, while local execution requires the v2 local discriminant and rejects raw local asset ids, provider model ids, and retired compact target/profile pairs under the Runtime target reason taxonomy.
    condition: Whenever Runtime validates execution target identity.
    failure: Reject missing, stale, incompatible, unknown, or retired target refs without minting durable identity from provider facts.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
  - id: rule.nimi.runtime.security-core.r064
    kind: rule
    title: Cloud memory embedding reuses managed connector security
    modality: must
    statement: Cloud memory embedding binding contains connector_id, remote_model_catalog_id, provider_model_id, and provider, persists no inline credentials or endpoints, and reuses managed owner, status, credential, and endpoint checks without owning resolved profile, readiness, or bank cutover truth.
    condition: Whenever Runtime resolves Desktop-host-owned cloud memory embedding configuration.
    failure: Reject local, invalid, owner-mismatched, status-invalid, credential-invalid, endpoint-invalid, or shortcut connector bindings.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.endpoint-security-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
  - id: rule.nimi.runtime.security-core.r065
    kind: rule
    title: AIProfile cloud refs carry routing identity only
    modality: must
    statement: An AIProfile cloud connector target ref carries only connector_id, remote_model_catalog_id, provider_model_id, provider, any needed capability discriminator, and profile or requirement trace ref, and Runtime resolves it through managed owner, status, and credential checks without inline metadata, inline endpoints, provider secrets, or app-local connector stores.
    condition: Whenever AIProfile or AIConfig selects a cloud connector slice.
    failure: Reject secret-bearing, app-local, unresolved, or unmanaged target refs.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
  - id: rule.nimi.runtime.security-core.r066
    kind: rule
    title: Runtime Target v2 supersedes retired durable names
    modality: must_not
    statement: Raw model_id, target_model_id, localModelId, goRuntimeLocalModelId, targetId/profileId, or connector_id plus model_id is admitted as durable target identity, while provider model ids remain provider facts and connector_id remains credential custody only.
    condition: Whenever a caller, profile, or persisted record supplies a durable Runtime target.
    failure: Reject the retired identity and require the remote catalog tuple or v2 local discriminant.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
  - id: rule.nimi.runtime.security-core.r082
    kind: rule
    title: Local-app authority classes keep exact meanings
    modality: must
    statement: base_entitlement means the caller principal's bounded Nimi-private partition, user_permission means durable access through one admitted public permission id, one_shot_consent means one owner-selected resource represented by a bounded non-forgeable handle, app_owned_authority means the app host's own SQLite, media, settings, cache, routes, and product commands, and os_right means authority actually granted to the native process by the operating system.
    condition: Whenever Runtime classifies a local-app action.
    failure: Deny the action when its claimed authority does not match the exact selected class meaning.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r083
    kind: rule
    title: Pre-admission permission storage stays absent
    modality: must
    statement: The pre-admission permission schema retains store_identity absent_pre_admission and positive mutation absent, and neither value changes through a standalone schema, persistence, or CRUD change outside the full atomic permission admission slice.
    condition: Until a Runtime-owned public permission is atomically admitted.
    failure: Reject any permission store or mutation path introduced independently of the complete admission slice.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.grant-service-plane
  - id: rule.nimi.runtime.security-core.r084
    kind: rule
    title: Key-source and route taxonomies stay distinct
    modality: must
    statement: Managed connector custody is the preferred remote key-source path, inline credentials remain an escape hatch, local connectors remain only a Phase 1 local category and probe facade, and provider runtime_plane local or remote is not interpreted as route_policy LOCAL or CLOUD.
    condition: Whenever Runtime or a consumer classifies a connector, key source, provider capability, or route policy.
    failure: Reject execution that conflates custody, connector category, capability plane, or route policy.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
  - id: rule.nimi.runtime.security-core.r085
    kind: rule
    title: Managed credentials enter only request execution context
    modality: must
    statement: ConnectorService decrypts a managed credential only during owner, status, and credential evaluation and injects the provider_type, endpoint, and credential tuple into request-scoped execution context, while downstream execution modules obtain it only from that context and never read CredentialStore directly.
    condition: Whenever Runtime prepares managed remote execution.
    failure: Stop execution when credential material cannot be injected through the request context or a downstream module attempts direct storage access.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.security-core.key-routing-plane
      - type: applies_to
        target: definition.nimi.runtime.security-core.ownership-authorization-plane
