format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.ai-provider
units:
  - id: rule.nimi.runtime.ai-provider.dashscope-speech-endpoint-materialization
    kind: rule
    title: DashScope speech endpoints follow the captured protocol and region
    modality: must
    statement: For an already admitted DashScope non-realtime Qwen or Qwen3 TTS audio.synthesize target, the Remote ExecutionHost deterministically materializes the native Qwen-TTS endpoint before dispatch from the immutable captured Connector and target. An official HTTPS workspace hostname with one ws-prefixed workspace label in cn-beijing maps to dashscope.aliyuncs.com, and the corresponding ap-southeast-1 hostname maps to dashscope-intl.aliyuncs.com; only the default HTTPS port is admitted for this mapping, and userinfo, query or fragment never triggers it. The materialized Qwen-TTS inference request retains the exact captured workspace as X-DashScope-WorkSpace, without replacing it with the credential default or sending this scope header to artifact downloads. This is same-provider same-region protocol composition, not a retry or fallback, and does not change the captured Connector, model, credential, public AIConfig or target admission. Qwen Audio 3.0 and CosyVoice synthesis, audio transcription, voice creation and voice lifecycle operations retain their captured endpoint; other capabilities, realtime protocols, custom endpoints, proxies, plan domains and unmapped regions are not rewritten. The actual destination remains subject to Runtime endpoint validation and pinned transport before any credential-bearing request.
    condition: Whenever a DashScope speech request is materialized for remote execution from an official workspace Connector.
    failure: Fail the exact request on policy, transport or provider failure without alternate-host retries, region changes, model substitution, App bypasses or guessed workspace identities.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.remote-execution-host-plane
