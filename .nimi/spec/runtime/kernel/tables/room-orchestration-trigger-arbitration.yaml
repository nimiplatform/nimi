version: 1
table_family: product_catalog
owner: runtime
catalog_id: runtime_room_orchestration_trigger_arbitration
entries:
  - canonical_user_turn
  - domain_script_or_step
  - external_protocol_signal
  - avatar_presentation_event
  - source_rule
  - owner
  - policy
  - stable_sort_keys
  - app_local_reordering
  - starvation_detection
  - domain_fairness_policy
  - missing_trigger_evidence
  - conflicting_trigger_evidence
  - unknown_trigger_class
  - external_signal_without_gateway_verdict
source_rule: K-AGCORE-111
trigger_classes:
  - id: canonical_user_turn
    source_rule: K-AGCORE-111
    priority: 10
    allowed_rows:
      - canonical_chat_adjacency
      - realm_group
      - avatar_companion_presentation_room
    trigger_evidence: Runtime conversation anchor, canonical turn, or Realm group message refs.
    ordering_policy: runtime_deterministic_queue
    domain_scheduler_authority: forbidden
  - id: domain_script_or_step
    source_rule: K-AGCORE-111
    priority: 20
    allowed_rows:
      - scenario_sandbox
      - oasis_world
    trigger_evidence: Scenario step refs or OASIS/world event refs.
    ordering_policy: runtime_deterministic_queue
    domain_scheduler_authority: forbidden
  - id: external_protocol_signal
    source_rule: K-AGCORE-114
    priority: 30
    allowed_rows:
      - external_entry_inside_room
      - realm_group
      - scenario_sandbox
      - oasis_world
      - avatar_companion_presentation_room
      - canonical_chat_adjacency
    trigger_evidence: Runtime gateway verdict plus protocol signal reference.
    ordering_policy: runtime_deterministic_queue_after_gateway_verdict
    protocol_readiness_as_admission: forbidden
  - id: avatar_presentation_event
    source_rule: K-AGCORE-111
    priority: 40
    allowed_rows:
      - avatar_companion_presentation_room
    trigger_evidence: Runtime presentation event or avatar instance projection refs.
    ordering_policy: runtime_deterministic_queue
    avatar_scheduler_authority: forbidden
turn_ordering:
  source_rule: K-AGCORE-111
  owner: K-AGCORE
  policy: runtime_deterministic_queue
  stable_sort_keys:
    - priority
    - room_id
    - admitted_at
    - participant_ref
    - trigger_ref
  app_local_reordering: forbidden
fairness:
  source_rule: K-AGCORE-111
  owner: K-AGCORE
  policy: per_room_round_robin_with_runtime_priority_escape
  starvation_detection:
    basis: queued_age_and_participant_progress
    owner: K-AGCORE
    missing_progress_policy: escalate_or_refuse
  domain_fairness_policy: forbidden
refusal:
  source_rule: K-AGCORE-117
  missing_trigger_evidence: fail_closed
  conflicting_trigger_evidence: runtime_refusal_until_resolved
  unknown_trigger_class: fail_closed
  external_signal_without_gateway_verdict: fail_closed
