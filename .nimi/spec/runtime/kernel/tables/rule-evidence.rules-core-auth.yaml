      - runtime_go_test
      - sdk_runtime_test
      - desktop_boundary_test
      - protected_local_authority_gate
    evidence_requirement: required
    note: LOCAL_APP authority comes only from inherited native-channel and verified live peer context; every self-asserted envelope and portable replay field remains denied.
    evidence_scope_note: Runtime/SDK/Kit tests must prove native origin and ordinary gRPC/renderer denial.
    test_files:
      - runtime/internal/services/account/realm_unary_test.go
      - runtime/internal/protectedlocal/local_app_launch_registry_test.go
      - kit/shell/electron/test/electron-runtime-account-auth.test.ts
      - scripts/check-local-app-owner-boundary.mjs
  - rule_id: K-ACCSVC-026
    evidence_refs: [runtime_kernel_consistency, runtime_go_test, protected_local_authority_gate]
    evidence_requirement: required
    note: Per-operation coordinator joins current principal/record/session/account/grant/presence and domain owner policy without owning or caching their truth.
    test_files:
      - scripts/check-protected-local-authority.mjs
  - rule_id: K-PLOCAL-001
    evidence_refs:
      - runtime_kernel_consistency
      - protected_local_authority_gate
    evidence_requirement: required
    note: Protected-local roles derive only from the fixed service and verified native connection; anonymous, public TCP, and request-selected role elevation fail closed.
    test_files:
      - scripts/check-protected-local-authority.test.mjs
      - scripts/testdata/protected-local-authority/negative-fixtures.json
  - rule_id: K-PLOCAL-002
    evidence_refs: [runtime_kernel_consistency, protected_local_authority_gate]
    evidence_requirement: required
    note: Final transport vocabulary is desktop_control, local_app_bootstrap, and local_app_host with immutable Runtime-derived origin context.
  - rule_id: K-PLOCAL-003
    evidence_refs: [runtime_kernel_consistency, protected_local_authority_gate]
    evidence_requirement: required
    note: Mutual endpoint authentication is mandatory and requires platform-native live evidence in addition to static authority validation.
  - rule_id: K-PLOCAL-004
    evidence_refs: [runtime_kernel_consistency, protected_local_authority_gate]
    evidence_requirement: required
    note: Process tuple, creation marker, same-open-object identity, liveness, and login-session checks are required for positive live evidence.
  - rule_id: K-PLOCAL-005
    evidence_refs: [runtime_kernel_consistency, protected_local_authority_gate]
    evidence_requirement: required
    note: Same-open-file executable verification and the Platform trust-set boundary require signer-positive and mismatch-negative live evidence.
  - rule_id: K-PLOCAL-006
    evidence_refs: [runtime_kernel_consistency, protected_local_authority_gate]
    evidence_requirement: required
    note: Desktop control-session authority remains Desktop-specific and requires exact proto, Runtime, Desktop, and carrier evidence.
  - rule_id: K-PLOCAL-007
    evidence_refs: [runtime_kernel_consistency, protected_local_authority_gate]
    evidence_requirement: required
    note: Transactional lifecycle, boot epoch, and limited durable-anchor authority require platform-native evidence for each admitted OS.
  - rule_id: K-PLOCAL-008
    evidence_refs: [runtime_kernel_consistency, protected_local_authority_gate]
    evidence_requirement: required
    note: Windows admits a process-bound single-use local-app launch lease and atomic Runtime-owned request-empty session; macOS/Linux remain fail closed pending independent authority.
  - rule_id: K-PLOCAL-009
    evidence_refs: [runtime_kernel_consistency, protected_local_authority_gate]
    evidence_requirement: required
    note: Windows-only mutable-project authorization and short process/supervisor/account/epoch-bound technical sessions require Runtime, Desktop, Kit, app-tools, and live-shell evidence.
    test_files:
