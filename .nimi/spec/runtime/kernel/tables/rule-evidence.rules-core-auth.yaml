      - protected_local_authority_gate
      - public_raw_token_authority_hardcut_gate
    evidence_requirement: required
    note: The matrix admits Desktop account control and exact LOCAL_APP grant status/request/control postures without portable credentials.
    evidence_scope_note: Protected-local structure and positive/negative owner tests must prove caller separation and per-operation enforcement.
    test_files:
      - runtime/internal/services/account/service_test.go
      - runtime/internal/services/account/realm_unary_test.go
      - scripts/check-local-app-owner-boundary.mjs
      - scripts/check-public-raw-token-authority.mjs
