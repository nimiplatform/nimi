    evidence_scope_note: Protected-local structure plus Runtime/SDK/Kit/Desktop and LocalAgent journey evidence are required for checkpoint closeout.
    test_files:
      - runtime/internal/services/account/service_test.go
      - sdks/typescript/runtime/app-session.test.ts
      - kit/shell/electron/test/electron-runtime-account-auth.test.ts
