version: 4
table_family: protocol_surface
owner: runtime
protocol_id: runtime_account_rpc_permission_matrix
source_rule: K-ACCSVC-024
surfaces:
  - BeginLogin
  - CompleteLogin
  - GetAccountSessionStatus
  - InvokeRealmUnary
  - IssueScopedAppBinding
  - IssueWorkspaceBinding
  - Logout
  - RequestPresenceVerification
  - RevokeScopedAppBinding
  - RevokeWorkspaceBinding
  - SubscribeAccountSessionEvents
  - SwitchAccount
  - GetLocalAppPermissionStatus
  - RequestLocalAppPermission
description: >-
  Per-caller RuntimeAccountService admission. Requirements are conjunctive.
  Protected origin and operation policy are always required; a caller enum,
  app id, bearer, session identifier, renderer payload or prior success cannot
  satisfy them. Runtime-private refresh is not an RPC posture.
protected_transport_authority_ref: protected-local-rpc-transport-matrix.yaml
protected_transport_profile_ref: protected-local-os-profiles.yaml#same-os
platform_transport_binding:
  binding_name: verified_platform_transport
  transport_matrix_ref: protected-local-rpc-transport-matrix.yaml#verified_platform_transport
  profile_resolution: same_os
  protected_origin_bindings:
    protected_desktop_control_origin:
      transport_class: desktop_control
      binding: verified_platform_transport
      carrier_role: desktop_control
    protected_local_app_origin:
      transport_class: local_app_host
      binding: verified_platform_transport
      carrier_role: local_app_host
  coverage:
    caller_methods: every_allow_when_method_with_a_resolved_protected_origin_requirement
    broker_consumer_admission: every_row_with_a_resolved_protected_origin_requirement
    missing_or_ambiguous_binding: fail_generation
  preserved_non_matrix_requirement:
    requirement: protected_bundled_origin
    disposition: existing_bundled_first_party_authority_unchanged
    protected_local_transport_matrix_membership: excluded
decision_schema:
  fields: [caller_class, runtime_caller_mode, methods, source_rule]
  method_decisions: [allow, deny, allow_when]
callers:
  - caller_class: desktop_account_and_local_app_control
    runtime_caller_mode: ACCOUNT_CALLER_MODE_DESKTOP_SHELL
    methods:
      GetAccountSessionStatus: { decision: allow_when, requirements: [protected_desktop_control_origin, desktop_account_host_origin, host_bound_desktop_caller_envelope] }
      SubscribeAccountSessionEvents: { decision: allow_when, requirements: [protected_desktop_control_origin, desktop_account_host_origin, host_bound_desktop_caller_envelope] }
      BeginLogin: { decision: allow_when, requirements: [protected_desktop_control_origin, desktop_account_host_origin, host_bound_desktop_caller_envelope] }
      CompleteLogin: { decision: allow_when, requirements: [protected_desktop_control_origin, desktop_account_host_origin, host_bound_desktop_caller_envelope, matching_login_attempt] }
      RequestPresenceVerification: { decision: allow_when, requirements: [protected_desktop_control_origin, desktop_account_host_origin, host_bound_desktop_caller_envelope] }
      Logout: { decision: allow_when, requirements: [protected_desktop_control_origin, desktop_account_host_origin, host_bound_desktop_caller_envelope] }
      SwitchAccount: { decision: allow_when, requirements: [protected_desktop_control_origin, desktop_account_host_origin, host_bound_desktop_caller_envelope] }
      InvokeRealmUnary: { decision: allow_when, requirements: [protected_desktop_control_origin, desktop_account_host_origin, host_bound_desktop_caller_envelope, current_authenticated_account, exact_desktop_source_readiness_broker_operation] }
      IssueScopedAppBinding: { decision: allow_when, requirements: [protected_desktop_control_origin, desktop_account_host_origin, host_bound_desktop_caller_envelope, binding_relation_match] }
      RevokeScopedAppBinding: { decision: allow_when, requirements: [protected_desktop_control_origin, desktop_account_host_origin, host_bound_desktop_caller_envelope, binding_relation_match] }
      IssueWorkspaceBinding: { decision: deny, reason: workspace_binding_not_desktop_account_ux }
      RevokeWorkspaceBinding: { decision: deny, reason: workspace_binding_not_desktop_account_ux }
      GetLocalAppPermissionStatus: { decision: deny, reason: local_app_child_projection_only }
      RequestLocalAppPermission: { decision: deny, reason: local_app_child_request_only }
    source_rule: K-ACCSVC-024

  - caller_class: local_first_party_app
    runtime_caller_mode: ACCOUNT_CALLER_MODE_LOCAL_FIRST_PARTY_APP
    methods:
      GetAccountSessionStatus: { decision: allow_when, requirements: [protected_bundled_origin, bundled_first_party_policy] }
      SubscribeAccountSessionEvents: { decision: allow_when, requirements: [protected_bundled_origin, bundled_first_party_policy] }
      BeginLogin: { decision: deny, reason: desktop_account_ux_only }
      CompleteLogin: { decision: deny, reason: desktop_account_ux_only }
      RequestPresenceVerification: { decision: deny, reason: desktop_presence_ux_only }
      Logout: { decision: deny, reason: desktop_account_ux_only }
      SwitchAccount: { decision: deny, reason: desktop_account_ux_only }
      InvokeRealmUnary: { decision: deny, reason: no_bundled_realm_operation_admitted }
      IssueScopedAppBinding: { decision: deny, reason: binding_owner_issues }
      RevokeScopedAppBinding: { decision: deny, reason: binding_owner_revokes }
      IssueWorkspaceBinding: { decision: deny, reason: workspace_binding_not_app_surface }
      RevokeWorkspaceBinding: { decision: deny, reason: workspace_binding_not_app_surface }
      GetLocalAppPermissionStatus: { decision: deny, reason: bundled_first_party_not_local_app_principal }
      RequestLocalAppPermission: { decision: deny, reason: bundled_first_party_not_local_app_principal }
    source_rule: K-ACCSVC-024

  - caller_class: local_app
    runtime_caller_mode: ACCOUNT_CALLER_MODE_LOCAL_APP
    methods:
      GetAccountSessionStatus: { decision: deny, reason: redacted_posture_uses_local_app_projection }
      SubscribeAccountSessionEvents: { decision: deny, reason: redacted_posture_uses_local_app_projection }
      BeginLogin: { decision: deny, reason: desktop_account_ux_only }
      CompleteLogin: { decision: deny, reason: desktop_account_ux_only }
      RequestPresenceVerification: { decision: deny, reason: desktop_presence_ux_only }
      Logout: { decision: deny, reason: desktop_account_ux_only }
      SwitchAccount: { decision: deny, reason: desktop_account_ux_only }
      InvokeRealmUnary: { decision: deny, reason: no_local_app_realm_operation_admitted }
      IssueScopedAppBinding: { decision: deny, reason: local_app_uses_process_bound_session }
      RevokeScopedAppBinding: { decision: deny, reason: local_app_uses_process_bound_session }
      IssueWorkspaceBinding: { decision: deny, reason: workspace_binding_not_local_app_surface }
      RevokeWorkspaceBinding: { decision: deny, reason: workspace_binding_not_local_app_surface }
      GetLocalAppPermissionStatus: { decision: allow_when, requirements: [protected_local_app_origin, current_process_bound_session, current_principal_and_record, canonical_public_permission_id] }
      RequestLocalAppPermission: { decision: allow_when, requirements: [protected_local_app_origin, current_process_bound_session, current_principal_and_record, admitted_public_permission_id, canonical_user_facing_reason] }
    source_rule: K-ACCSVC-024

  - caller_class: binding_only_avatar
    runtime_caller_mode: ACCOUNT_CALLER_MODE_DESKTOP_LAUNCHED_AVATAR
    decision: deny_all
    reason: avatar_binding_policy_is_separate
    source_rule: K-ACCSVC-024

  - caller_class: unspecified_or_nonlocal
    runtime_caller_modes:
      - ACCOUNT_CALLER_MODE_UNSPECIFIED
      - ACCOUNT_CALLER_MODE_WEB_CLOUD
      - ACCOUNT_CALLER_MODE_EXTERNAL_PRINCIPAL
    decision: deny_all
    source_rule: K-ACCSVC-024
internal_capabilities:
  - caller_class: runtime_internal_refresh
    rpc_exposed: false
    methods:
      RefreshAccountMaterial: { decision: allow, requirements: [runtime_private_call_site] }
    consumers: [InvokeRealmUnary, proactive_refresh_scheduler, custody_recovery]
    source_rule: K-ACCSVC-024
