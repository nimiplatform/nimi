version: 1

# Canonical local environment consumer requirement declarations.
# Consumers declare requirements; Runtime resolves plans and source records.

consumers:
  - consumer_id: llama.cpp.cpu
    consumer_kind: native_engine_package_variant
    engine: llama
    pack_refs:
      - local-text
    dependency_families:
      - native-engine-package.llama
      - model.asset
    activation_gate:
      required_states:
        - ready_system
        - ready_managed
      fail_closed_reasons:
        - engine_package_missing
        - model_asset_missing
        - selected_source_record_missing

  - consumer_id: llama.cpp.cuda
    consumer_kind: native_engine_package_variant
    engine: llama
    pack_refs:
      - local-text
      - local-gpu-support
    dependency_families:
      - native-engine-package.llama
      - accelerator.cuda.runtime
      - model.asset
    version_constraints:
      cuda_major: 12
      package_abi: package_declared
    activation_gate:
      required_states:
        - ready_system
        - ready_managed
      fail_closed_reasons:
        - engine_package_missing
        - accelerator_runtime_missing
        - accelerator_runtime_unconfirmed
        - model_asset_missing
        - selected_source_record_missing

  - consumer_id: llama.cpp.vulkan
    consumer_kind: native_engine_package_variant
