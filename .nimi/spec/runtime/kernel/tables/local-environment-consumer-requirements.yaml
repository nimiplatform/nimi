rules:
  - consumer declarations are table truth; engine-local installers must not add hidden dependencies
  - Python pipelines must prove uv, Python runtime, venv, package-set, and Torch or driver packages independently
  - native image activation must not require Python unless a Python pipeline consumer is selected
  - cloud-only usage has no consumer row in this table and must not resolve local compute dependencies
