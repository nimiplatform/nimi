version: 5
table_family: protocol_surface
owner: runtime
protocol_id: runtime_protected_local_lifecycle_operation_protocol
surfaces:
  - PrepareAppLifecycleIntent
  - GetAppLifecycleIntentStatus
  - InstallApp
  - UninstallApp
  - GetAppPackageReadiness
  - GetAppInstallJob
  - ListAppInstallJobs
  - WatchAppInstallJobEvents
  - UpdateApp
  - HealthRepairApp
  - PrepareLocalAppLaunch
  - BindLocalAppProcess
description: >-
  Opaque immutable-package seam plus the admitted local-app launch lease and
  process bind. No local adoption, production import/install/update/promotion,
  or OpenApp positive path is admitted in 0K.
authority_refs: [K-PLOCAL-006, K-PLOCAL-007, K-PLOCAL-008, K-APP-011, K-APP-017, K-APP-026]
platform_admission:
  launch_session_profile_ref: protected-local-launch-session-profiles.yaml#same-os
  windows: admitted_fixed_service_child_carrier
  linux: requirements_only_fail_closed_pending_native_admission
  macos: requirements_only_fail_closed_pending_native_admission
  macos_local_development: local_development_non_product_admitted
  immutable_package_positive: typed_unavailable_until_0p_or_p
  unadmitted_platform_disposition: fail_closed
  localhost_or_same_user_fallback: forbidden
package_seam:
  operations:
    - PrepareAppLifecycleIntent
    - GetAppLifecycleIntentStatus
    - InstallApp
    - UninstallApp
    - GetAppPackageReadiness
    - GetAppInstallJob
    - ListAppInstallJobs
    - WatchAppInstallJobEvents
    - UpdateApp
    - HealthRepairApp
  positive_disposition: typed_unavailable
  opaque_fields:
    - immutable_lineage_id
    - provenance_attestation_refs
    - provenance_revision
    - execution_profile_ref
    - host_executable_digest
    - payload_root_digest
  fields_authorize: false
  producer_admission: deferred_to_0p_or_p
local_app_launch:
  platform_profile_ref: protected-local-launch-session-profiles.yaml#same-os
  prepare_rpc: PrepareLocalAppLaunch
  bind_rpc: BindLocalAppProcess
  security_authority: live_local_app_control_origin
  required_bindings:
    - local_os_user_anchor
    - local_app_principal_id
    - local_app_record_id
    - provenance_revision
    - install_or_project_generation
    - account_id
    - account_generation
    - runtime_boot_epoch
    - trust_class
    - execution_profile_ref
    - host_kind
    - entrypoint
    - host_executable_digest
    - payload_root_digest
    - expected_child_process
  principal_lineage_binding:
    immutable: [immutable_lineage_id]
    development: [development_authorization_id, canonical_project_file_id, declared_app_id]
    exactly_one_branch_required: true
  request_may_select_principal: false
  request_may_select_account: false
  single_use_lease: true
  side_effect_before_lease_commit: forbidden
  bind_requires_exact_live_process_and_executable: true
  renderer_projection: forbidden
  portable_lease_or_session: forbidden
replay_and_revocation:
  lease_replay: deny
  process_mismatch: deny
  principal_or_record_revision_change: invalidate
  promotion_revision_change: invalidate
  account_generation_change: invalidate
  runtime_boot_epoch_change: invalidate
  desktop_supervisor_exit: invalidate_for_local_development
  process_replacement: new_lease_bind_and_session
non_product_local_development:
  profile_id: macos_local_development_v1
  platform_profile_ref: protected-local-launch-session-profiles.yaml#macos-local-development
  admission: local_development_non_product_admitted
  product_admission_promotion: forbidden
  exact_service_label: ai.nimi.runtime.dev
  exact_runtime_path: /Library/Application Support/Nimi/RuntimeDev/active/bin/nimi-runtime
  exact_desktop_path: /Applications/Nimi Dev.app/Contents/MacOS/Nimi Dev
  exact_local_host_path: /Applications/Nimi Dev.app/Contents/Frameworks/Nimi Local App Host Dev.app/Contents/MacOS/Nimi Local App Host Dev
  install_update_owner: explicit_root_owned_development_installer_transaction
  candidate_activation: only_after_complete_role_record_signature_code_identity_vnode_digest_and_launchd_profile_verification
  rollback: one_last_known_good_generation_without_release_generation_rebinding
  persistent_state_survives_update: true
  reset_requires_explicit_confirmation: true
  uninstall_requires_explicit_confirmation_and_preserves_local_CA: true
  production_paths_endpoints_custody_or_Realm: forbidden
forbidden_surfaces:
  - workspace_scan_as_local_record
  - app_id_as_positive_local_identity
  - generic_open_without_prepare_and_bind
  - raw_executable_launch
  - renderer_selected_endpoint
  - app_id_positive_fallback
