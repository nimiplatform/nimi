version: 1
table_family: protocol_surface
owner: runtime
protocol_id: runtime_protected_local_lifecycle_intent_protocol
surfaces: [PrepareAppLifecycleIntent, GetAppLifecycleIntentStatus, InstallApp, UninstallApp, UpdateApp, HealthRepairApp, AdoptLocalApp, RemoveLocalAppAdoption, OpenApp]
description: Closed prepare, display, consume, status, replay, and lost-response contract for Desktop-owned app lifecycle intent.
authority_refs: [K-PLOCAL-006, K-PLOCAL-007, K-APP-026]
rpc_vocabulary:
  prepare: PrepareAppLifecycleIntent
  status: GetAppLifecycleIntentStatus
action_enum: [INSTALL, UNINSTALL, UPDATE, HEALTH_REPAIR, ADOPT_LOCAL_APP, REMOVE_LOCAL_APP_ADOPTION, OPEN_APP]
status_enum: [PREPARED, CONSUMED, SIDE_EFFECT_STARTED, SUCCEEDED, FAILED, CANCELLED, EXPIRED]
canonicalization:
  format: RFC8785_JSON
  unicode: NFC
  digest: SHA-256
  localized_text_in_digest: forbidden
prepare_request:
  fields: [action, app_id, expected_release_ref, expected_artifact_digest, expected_adoption_generation, destructive_options]
  caller_selected_path_is_authority: false
  runtime_resolves_current_target_before_projection: true
prepare_response:
  fields: [intent_id, canonical_impact, canonical_impact_digest, deadline, reason_code]
  intent_id_authorizes: false
  secret_or_portable_proof_present: false
canonical_impact_schema:
  fields:
    - schema_version
    - action
    - app_id
    - account_generation
    - release_ref
    - artifact_digest
    - adoption_generation
    - destructive_options
    - impact_flags
    - display_contract_version
mutation_consumption:
  request_fields: [lifecycle_intent_id, displayed_impact_digest]
  same_protected_desktop_session_required: true
  same_process_tuple_required: true
  same_account_generation_required: true
  same_boot_epoch_required: true
  confirmed_boolean_authorizes: false
  consume_and_durable_intent_commit: atomic_anchored
  side_effect_before_anchor_advance: forbidden
status_query:
  request_fields: [intent_id]
  response_fields: [intent_id, status, non_authorizing_job_id, canonical_result, reason_code, retryability]
  intent_id_authorizes_mutation: false
  terminal_reconciliation_after_reconnect: same_verified_os_principal_account_and_target_only
renderer_projection:
  allowed_fields: [intent_id, canonical_impact, canonical_impact_digest, deadline, status, canonical_result, reason_code, retryability]
  renderer_receives_authorizing_material: false
  forbidden_fields: [process_tuple, boot_epoch, account_generation_raw, ledger_anchor, credential, portable_proof]
replacement_and_replay:
  outstanding_per_session_action_app: 1
  replacement_cancels_old_atomically: true
  consumed_or_replaced_replay: deny
  expired_replay: deny
action_schema:
  fields: [action, consuming_rpc, target_fields, destructive, source_rule]
actions:
  - action: INSTALL
    consuming_rpc: InstallApp
    target_fields: [app_id, expected_release_ref, expected_artifact_digest]
    destructive: true
    source_rule: K-APP-026
  - action: UNINSTALL
    consuming_rpc: UninstallApp
    target_fields: [app_id, expected_release_ref, expected_artifact_digest]
    destructive: true
    source_rule: K-APP-026
  - action: UPDATE
    consuming_rpc: UpdateApp
    target_fields: [app_id, expected_release_ref, expected_artifact_digest]
    destructive: true
    source_rule: K-APP-026
  - action: HEALTH_REPAIR
    consuming_rpc: HealthRepairApp
    target_fields: [app_id, expected_release_ref, expected_artifact_digest]
    destructive: true
    source_rule: K-APP-026
  - action: ADOPT_LOCAL_APP
    consuming_rpc: AdoptLocalApp
    target_fields: [app_id, expected_artifact_digest, expected_adoption_generation]
    destructive: true
    source_rule: K-APP-026
  - action: REMOVE_LOCAL_APP_ADOPTION
    consuming_rpc: RemoveLocalAppAdoption
    target_fields: [app_id, expected_adoption_generation]
    destructive: true
    source_rule: K-APP-026
  - action: OPEN_APP
    consuming_rpc: OpenApp
    target_fields: [app_id, expected_release_ref, expected_artifact_digest]
    destructive: false
    source_rule: K-APP-026
