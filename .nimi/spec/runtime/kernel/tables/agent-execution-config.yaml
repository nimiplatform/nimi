version: 1
table_family: product_record_schema
owner: runtime
record_id: runtime_agent_execution_config
path: .nimi/spec/runtime/kernel/tables/agent-execution-config.yaml
source_rule: K-AGCORE-144
schema_version: 1
required_top_level_fields:
  - revision
  - bindings
  - updated_at
  - updated_by_app_id
allowed_top_level_fields:
  - revision
  - bindings
  - updated_at
  - updated_by_app_id
forbidden_top_level_fields:
  - RuntimeRouteBinding
  - selectedBindings
  - resolved_binding_evidence
  - readiness_state
  - provider_health
  - credential_payload
  - api_key
  - subject_user_id
binding_schema:
  required_fields:
    - capability
    - model_id
    - route_policy
  optional_fields:
    - connector_id
    - target_ref
  target_ref_contract: K-RTARGET v2 durable target ref only
admitted_capabilities:
  text.generate:
    required: true
    seeded_default: local/default
    source_rule: K-AGCORE-150
  image.generate:
    required: false
    seeded_default: null
    source_rule: K-AGCORE-148
readiness_states:
  - ready
  - not_configured
  - unavailable
readiness_reason_codes:
  - route_unhealthy
  - connector_missing
  - model_missing
  - target_missing
  - probe_failed
action_failed_reason_codes:
  - image_binding_missing
  - image_route_unhealthy
  - image_execution_failed
turn_action_availability_states:
  - available
  - not_configured
  - unavailable
scopes:
  read: runtime.agent.execution_config.read
  write: runtime.agent.execution_config.write
event_families:
  - runtime.agent.execution_config.changed
  - runtime.agent.execution_config.readiness_changed
invariants:
  - exactly_one_committed_config_per_runtime_instance
  - revision_monotonic_increment_by_one_per_mutation
  - mutation_requires_expected_revision_match
  - text_generate_binding_required_after_seed
  - readiness_is_projection_not_execution_gate
  - request_carried_turn_bindings_not_admitted
  - no_app_local_shadow_copy_of_binding_truth
