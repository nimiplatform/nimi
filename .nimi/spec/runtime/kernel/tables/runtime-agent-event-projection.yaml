version: 1
table_family: protocol_surface
owner: runtime
protocol_id: runtime_runtime_agent_event_projection
surfaces:
  - source_rule
  - required_fields
  - extra_fields_by_event
  - timeline
  - optional_origin_fields
  - PostureProjection
  - stable_projection_payload_schema_truth
  - breaking_change_requires
  - runtime.agent.turn.accepted
  - runtime.agent.turn.started
  - runtime.agent.turn.reasoning_delta
  - runtime.agent.turn.text_delta
  - runtime.agent.turn.structured
  - runtime.agent.turn.message_committed
  - runtime.agent.turn.action_planned
  - runtime.agent.turn.action_started
  - runtime.agent.turn.artifact_ready
  - runtime.agent.turn.action_completed
  - runtime.agent.turn.action_failed
  - runtime.agent.turn.post_turn
  - runtime.agent.turn.completed
  - runtime.agent.turn.failed
  - runtime.agent.turn.interrupted
  - runtime.agent.turn.interrupt_ack
  - runtime.agent.avatar_debug.probe_requested
  - runtime.agent.avatar_debug.probe_result
  - runtime.agent.avatar_debug.replay_linked
  - runtime.agent.presentation.activity_requested
  - runtime.agent.presentation.motion_requested
  - runtime.agent.presentation.expression_requested
  - runtime.agent.presentation.pose_requested
  - runtime.agent.presentation.pose_cleared
  - runtime.agent.presentation.lookat_requested
  - runtime.agent.presentation.voice_playback_requested
  - runtime.agent.presentation.voice_stream_chunk_available
  - runtime.agent.presentation.lipsync_frame_batch
  - runtime.agent.state.status_text_changed
  - runtime.agent.state.execution_state_changed
  - runtime.agent.state.emotion_changed
  - runtime.agent.state.posture_changed
  - runtime.agent.hook.intent_proposed
  - runtime.agent.hook.pending
  - runtime.agent.hook.rejected
  - runtime.agent.hook.running
  - runtime.agent.hook.completed
  - runtime.agent.hook.failed
  - runtime.agent.hook.canceled
  - runtime.agent.hook.rescheduled

turn_envelope:
  source_rule: K-AGCORE-037
  required_fields:
    - agent_id
    - conversation_anchor_id
    - turn_id
    - stream_id
    - timeline
  extra_fields_by_event:
    runtime.agent.turn.message_committed:
      - message_id
  timeline:
    source_rule: K-AGCORE-051
    required_fields:
      - turn_id
      - stream_id
      - channel
      - offset_ms
      - sequence
      - started_at_wall
      - observed_at_wall
      - timebase_owner
      - projection_rule_id
      - clock_basis
      - provider_neutral
      - app_local_authority
    channel_enum:
      - text
      - voice
      - avatar
      - state
      - lipsync
    fixed_values:
      timebase_owner: runtime
      projection_rule_id: K-AGCORE-051
      clock_basis: monotonic_with_wall_anchor
      provider_neutral: true
      app_local_authority: false

presentation_envelope:
  source_rule: K-AGCORE-037
  required_fields:
    - agent_id
    - conversation_anchor_id
    - turn_id
    - stream_id

session_envelope:
  source_rule: K-AGCORE-037
  required_fields:
    - agent_id
    - conversation_anchor_id

state_envelope:
  source_rule: K-AGCORE-037
  required_fields:
    - agent_id
  optional_origin_fields:
    - conversation_anchor_id
    - originating_turn_id
    - originating_stream_id

hook_envelope:
  source_rule: K-AGCORE-042
  required_fields:
    - agent_id
  optional_origin_fields:
    - conversation_anchor_id
    - originating_turn_id
    - originating_stream_id

schema_aliases:
  PostureProjection:
    source_rule: K-AGCORE-037
    equals: runtime.agent.state.posture_changed.detail.current_posture

avatar_debug_envelope:
  source_rule: K-AGCORE-058
  required_fields:
    - probe_id
    - agent_id
    - probe_kind
    - observed_at
  optional_origin_fields:
    - conversation_anchor_id
    - turn_id
    - stream_id
    - avatar_instance_id
    - scoped_binding

governance:
  source_rule: K-AGCORE-037
  stable_projection_payload_schema_truth: true
  breaking_change_requires:
    - pnpm exec nimicoding validate-spec-governance --profile nimi --scope runtime-consistency
    - pnpm exec nimicoding generate-spec-derived-docs --profile nimi --scope runtime --check

turn_events:
  - event: runtime.agent.turn.accepted
    source_rule: K-AGCORE-032
    detail:
      request_id: string
  - event: runtime.agent.turn.started
    source_rule: K-AGCORE-037
    detail:
      track: enum(chat|life)
  - event: runtime.agent.turn.reasoning_delta
    source_rule: K-AGCORE-032
    detail:
      text: string
  - event: runtime.agent.turn.text_delta
    source_rule: K-AGCORE-037
    detail:
      text: string
  - event: runtime.agent.turn.structured
    source_rule: K-AGCORE-032
    detail:
      kind: string
      payload: struct
  - event: runtime.agent.turn.message_committed
    source_rule: K-AGCORE-037
    detail:
      message_id: string
      text: string
  - event: runtime.agent.turn.action_planned
    source_rule: K-AGCORE-037
    detail:
      action_id: string
      modality: enum(image)
      operation: enum(image.generate)
      projection_message_id: string
  - event: runtime.agent.turn.action_started
    source_rule: K-AGCORE-037
    detail:
      action_id: string
      modality: enum(image)
      operation: enum(image.generate)
      projection_message_id: string
  - event: runtime.agent.turn.artifact_ready
    source_rule: K-AGCORE-037
    detail:
      action_id: string
      projection_message_id: string
      artifact_id: string
      mime_type: string
    notes:
      - artifact bytes remain owned by RuntimeArtifactService.ReadArtifactBytes.
  - event: runtime.agent.turn.action_completed
    source_rule: K-AGCORE-037
    detail:
      action_id: string
      modality: enum(image)
      operation: enum(image.generate)
      projection_message_id: string
      artifact_id: string
      mime_type: string
      job_id: string
  - event: runtime.agent.turn.action_failed
    source_rule: K-AGCORE-037
    detail:
      action_id: string
      modality: enum(image)
      operation: enum(image.generate)
      projection_message_id: string
      reason_code: string
      message: string_optional
  - event: runtime.agent.turn.post_turn
    source_rule: K-AGCORE-032
    detail:
      action: struct_optional
      hook_intent: struct_optional
    notes:
      - hook_intent is turn-close indication only; canonical hook lifecycle
        truth remains on runtime.agent.hook.*
  - event: runtime.agent.turn.completed
    source_rule: K-AGCORE-037
    detail:
      terminal_reason: string_optional
  - event: runtime.agent.turn.failed
    source_rule: K-AGCORE-037
    detail:
      reason_code: string
      message: string_optional
  - event: runtime.agent.turn.interrupted
    source_rule: K-AGCORE-037
    detail:
      reason: string
  - event: runtime.agent.turn.interrupt_ack
    source_rule: K-AGCORE-032
    detail:
      interrupted_turn_id: string

avatar_debug_events:
  - event: runtime.agent.avatar_debug.probe_requested
    source_rule: K-AGCORE-058
    detail:
      probe_id: string
      probe_kind: enum(package_validation|launch_readiness|backend_load|capability_profile|route_support_matrix|generated_motion|emotion_expression|speech_lipsync|window_hit_region)
      requested_by: enum(desktop_debug_workbench|runtime_policy)
      replay_requested: boolean
    notes:
      - Probe requests are Runtime-owned debug projection events, not public
        APML syntax and not Avatar-owned semantic event names.
      - Probe requests may include a scoped_binding attachment so the Avatar
        carrier can submit evidence-backed results through Runtime without
        reconstructing binding authority locally.
      - Payload must not include package descriptors, package paths, backend
        commands, raw provider output, or auth material.
  - event: runtime.agent.avatar_debug.probe_result
    source_rule: K-AGCORE-058
    detail:
      probe_id: string
      probe_kind: enum(package_validation|launch_readiness|backend_load|capability_profile|route_support_matrix|generated_motion|emotion_expression|speech_lipsync|window_hit_region)
      status: enum(passed|failed|unsupported|blocked|invalid)
      reason_code: string
      evidence_refs: string_array
    notes:
      - Passed status requires concrete Runtime or Avatar evidence refs.
      - Avatar backend evidence may be submitted through Runtime's typed submit
        path, but Runtime owns the accepted public result envelope and replay
        semantics.
  - event: runtime.agent.avatar_debug.replay_linked
    source_rule: K-AGCORE-058
    detail:
      probe_id: string
      replay_ref: string
      redaction_state: enum(redacted|visible|forbidden)
      visibility: enum(desktop_debug_workbench|sdk_diagnostics|runtime_audit_only)
    notes:
      - Replay refs are Runtime-owned. Desktop and SDK may display them but
        must not reconstruct replay from local state.

presentation_events:
  - event: runtime.agent.presentation.activity_requested
    source_rule: K-AGCORE-049
    detail:
      activity_name: string
      category: enum(emotion|interaction|state)
      intensity: enum(weak|moderate|strong)_optional
      source: string
    notes:
      - Avatar may map admitted activity_name values to Avatar-owned backend
        route ids downstream of this projection.
      - Backend route ids and mapping confidence labels are not runtime
        activity ids, public APML tags, or runtime-owned payload fields.
  - event: runtime.agent.presentation.motion_requested
    source_rule: K-AGCORE-037
    detail:
      motion_id: string
      priority: string_optional
      expected_duration_ms: int_optional
    notes:
      - This is a typed runtime presentation projection family, not public
        APML direct <motion> syntax.
      - Avatar must not reinterpret motion_id as an Avatar backend route id
        unless an Avatar mapping table explicitly maps a typed runtime
        projection into that route.
  - event: runtime.agent.presentation.expression_requested
    source_rule: K-AGCORE-037
    detail:
      expression_id: string
      expected_duration_ms: int_optional
    notes:
      - This is a typed runtime presentation projection family, not public
        APML direct <expression> syntax.
  - event: runtime.agent.presentation.pose_requested
    source_rule: K-AGCORE-037
    detail:
      pose_id: string
      expected_duration_ms: int_optional
    notes:
      - This is a typed runtime presentation projection family, not public
        APML direct <pose> syntax.
  - event: runtime.agent.presentation.pose_cleared
    source_rule: K-AGCORE-037
    detail:
      previous_pose_id: string_optional
    notes:
      - This is a typed runtime presentation projection family, not public
        APML direct <clear-pose> syntax.
  - event: runtime.agent.presentation.lookat_requested
    source_rule: K-AGCORE-037
    detail:
      target_kind: string
      x: number_optional
      y: number_optional
      z: number_optional
    notes:
      - This is a typed runtime presentation projection family, not public
        APML direct <lookat> syntax.
  - event: runtime.agent.presentation.voice_playback_requested
    source_rule: K-AGCORE-051
    timeline_channel: voice
    detail:
      audio_artifact_id: string
      audio_mime_type: string
      message_id: string
      playback_state: enum(requested|started|completed|interrupted|canceled|failed)
      duration_ms: int_optional
      deadline_offset_ms: int_optional
      reason: string_optional
      playback_target: enum(avatar_autoplay|desktop_manual|replay)_optional
      final_artifact: bool_optional
    notes:
      - audio_artifact_id is runtime-owned artifact identity; provider/model
        timing metadata is not timeline authority.
      - timeline must use turn_envelope.timeline fixed values and channel=voice.
      - requested/started/completed states that ask a consumer to play audio must
        reference a playable audio/* artifact; text-only fallback must not emit a
        pseudo playable request.
      - playback_target records Runtime-owned target policy, not app-owned route
        selection.
  - event: runtime.agent.presentation.voice_stream_chunk_available
    source_rule: K-AGCORE-133
    timeline_channel: voice
    detail:
      audio_artifact_id: string
      audio_mime_type: string
      message_id: string
      chunk_sequence: positive_int
      final_chunk: bool
      duration_ms: int_optional
      reason: string_optional
      playback_target: enum(avatar_autoplay|desktop_manual|replay)_optional
    notes:
      - chunk_sequence must be monotonic within the turn_id/stream_id voice
        stream.
      - audio_artifact_id must reference playable audio bytes for this chunk and
        must not be reused for lipsync metadata.
      - raw audio bytes are not embedded in this event; consumers read bytes
        through Runtime artifact or an admitted SDK streaming surface.
  - event: runtime.agent.presentation.lipsync_frame_batch
    source_rule: K-AGCORE-051
    timeline_channel: lipsync
    detail:
      audio_artifact_id: string
      frames:
        frame_sequence: positive_int
        offset_ms: non_negative_int
        duration_ms: positive_int
        mouth_open_y: number_0_to_1
        audio_level: number_0_to_1
    notes:
      - frame_sequence and offset_ms must be monotonic within the batch.
      - timeline must use turn_envelope.timeline fixed values and channel=lipsync.

state_events:
  - event: runtime.agent.state.status_text_changed
    source_rule: K-AGCORE-037
    detail:
      current_status_text: string
      previous_status_text: string_optional
  - event: runtime.agent.state.execution_state_changed
    source_rule: K-AGCORE-037
    detail:
      current_execution_state: string
      previous_execution_state: string_optional
  - event: runtime.agent.state.emotion_changed
    source_rule: K-AGCORE-038
    detail:
      current_emotion: string
      previous_emotion: string_optional
      source: string
  - event: runtime.agent.state.posture_changed
    source_rule: K-AGCORE-037
    detail:
      current_posture:
        action_family: string
        interrupt_mode: string
      previous_posture:
        action_family: string
        interrupt_mode: string
        optional: true

hook_events:
  - event: runtime.agent.hook.intent_proposed
    source_rule: K-AGCORE-042
    detail:
      intent_id: string
      trigger_family: string
      trigger_detail: struct
      effect: string
      admission_state: string
  - event: runtime.agent.hook.pending
    source_rule: K-AGCORE-042
    detail:
      intent_id: string
      trigger_family: string
      trigger_detail: struct
      effect: string
      admission_state: string
  - event: runtime.agent.hook.rejected
    source_rule: K-AGCORE-042
    detail:
      intent_id: string
      trigger_family: string
      trigger_detail: struct
      effect: string
      admission_state: string
      reason_code: string_optional
  - event: runtime.agent.hook.running
    source_rule: K-AGCORE-042
    detail:
      intent_id: string
      trigger_family: string
      trigger_detail: struct
      effect: string
      admission_state: string
  - event: runtime.agent.hook.completed
    source_rule: K-AGCORE-042
    detail:
      intent_id: string
      trigger_family: string
      trigger_detail: struct
      effect: string
      admission_state: string
  - event: runtime.agent.hook.failed
    source_rule: K-AGCORE-042
    detail:
      intent_id: string
      trigger_family: string
      trigger_detail: struct
      effect: string
      admission_state: string
      reason_code: string_optional
  - event: runtime.agent.hook.canceled
    source_rule: K-AGCORE-042
    detail:
      intent_id: string
      trigger_family: string
      trigger_detail: struct
      effect: string
      admission_state: string
      reason: string_optional
  - event: runtime.agent.hook.rescheduled
    source_rule: K-AGCORE-042
    detail:
      intent_id: string
      trigger_family: string
      trigger_detail: struct
      effect: string
      admission_state: string
