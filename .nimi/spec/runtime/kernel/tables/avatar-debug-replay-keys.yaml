version: 1
table_family: closed_enum
enum_id: runtime_avatar_debug_replay_keys
values:
  - probe_id
  - request_event_id
  - result_event_id
  - authorization_verdict_id
  - projection_lineage_id
  - avatar_backend_evidence_ref
  - redaction_state
  - replay_visibility
  - redacted
  - visible
  - forbidden
