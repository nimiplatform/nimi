version: 1
table_family: closed_enum
owner: runtime
enum_id: runtime_metadata_keys
values:
  - x-nimi-key-source
  - x-nimi-protocol-version
  - x-nimi-participant-protocol-version
  - x-nimi-participant-id
  - x-nimi-domain
  - x-nimi-provider-type
  - x-nimi-provider-endpoint
  - x-nimi-provider-api-key
  - x-nimi-app-id
  - x-nimi-app-instance-id
  - x-nimi-client-id
  - x-nimi-idempotency-key
  - x-nimi-presence-browser-launcher
  - authorization
  - x-nimi-runtime-version
  - x-nimi-caller-kind
  - x-nimi-caller-id
  - x-nimi-surface-id
  - x-nimi-access-token-id
  - x-nimi-access-token-secret
  - x-nimi-session-id
  - x-nimi-session-token
  - x-nimi-trace-id
keys:
  - key: x-nimi-key-source
    allowed_values: [inline, managed]
    required_when: inline routing or explicit managed override (managed requires connector_id)
    source_rule: K-KEYSRC-003
  - key: x-nimi-protocol-version
    required_when: runtime entrypoint protocol context propagation
    source_rule: K-AUDIT-023
  - key: x-nimi-participant-protocol-version
    required_when: runtime entrypoint participant protocol context propagation
    source_rule: K-AUDIT-023
  - key: x-nimi-participant-id
    required_when: runtime entrypoint participant context propagation
    source_rule: K-AUDIT-023
  - key: x-nimi-domain
    required_when: runtime entrypoint domain context propagation
    source_rule: K-AUDIT-023
  - key: x-nimi-provider-type
    required_when: inline
    source_rule: K-KEYSRC-003
  - key: x-nimi-provider-endpoint
    required_when: inline provider has no default endpoint
    source_rule: K-KEYSRC-003
  - key: x-nimi-provider-api-key
    required_when: inline
    source_rule: K-KEYSRC-003
  - key: x-nimi-app-id
    required_when: ConnectorService RPC
    source_rule: K-KEYSRC-003
  - key: x-nimi-app-instance-id
    required_when: Runtime-authenticated local first-party calls that must resolve app-instance-scoped authority
    source_rule: K-KNOW-008
  - key: x-nimi-client-id
    required_when: optional audit context
    source_rule: K-KEYSRC-003
  - key: x-nimi-idempotency-key
    required_when: optional dedup context
    source_rule: K-DAEMON-006
  - key: x-nimi-presence-browser-launcher
    required_when: request-scoped protected Desktop control fallback on fixed-service Windows
    source_rule: K-ACCSVC-021
  - key: authorization
    required_when: authenticated runtime call (optional for anonymous)
    source_rule: K-AUTHN-001
  - key: x-nimi-runtime-version
    required_when: always (response header metadata)
    source_rule: K-DAEMON-011
  - key: x-nimi-caller-kind
    required_when: audit context propagation
    source_rule: K-AUDIT-023
  - key: x-nimi-caller-id
    required_when: audit context propagation
    source_rule: K-AUDIT-023
  - key: x-nimi-surface-id
    required_when: audit context propagation
    source_rule: K-AUDIT-023
  - key: x-nimi-access-token-id
    required_when: audit context propagation
    source_rule: K-AUDIT-023
  - key: x-nimi-access-token-secret
    required_when: loopback runtime entrypoint token-authenticated call
    source_rule: K-AUTHN-001
  - key: x-nimi-session-id
    required_when: loopback runtime entrypoint session-authenticated app call
    source_rule: K-AUTHN-001
  - key: x-nimi-session-token
    required_when: loopback runtime entrypoint session-authenticated app call
    source_rule: K-AUTHN-001
  - key: x-nimi-trace-id
    required_when: L0 correlation envelope (correlated under K-AUDIT-020)
    source_rule: P-PROTO-011
