version: 1
source_rule: K-AGCORE-063
axes:
  - id: transcript_owner
    source_rule: K-AGCORE-064
    values:
      - RUNTIME
      - REALM
      - SCENARIO_MODULE
      - OASIS_WORLD_DOMAIN
      - EXTERNAL_DOMAIN
      - EPHEMERAL
  - id: identity_source
    source_rule: K-AGCORE-065
    values:
      - USER_OWNED_NIMI_AGENT
      - EXTERNAL_A2A_AGENT
      - MCP_BACKED_AI_CAPABILITY
      - SANDBOX_PROJECTION
      - NPC_WORLD_ACTOR
  - id: execution_owner
    source_rule: K-AGCORE-066
    values:
      - RUNTIME
      - EXTERNAL_RUNTIME_VIA_ADMITTED_GATEWAY
      - NOT_ADMITTED
  - id: memory_read_scope
    source_rule: K-AGCORE-067
    values:
      - CANONICAL_OWNER_POLICY
      - DYADIC_PRIVATE_ALLOWED
      - DYADIC_PRIVATE_EXCLUDED
      - PUBLIC_SHARED_ONLY
      - DOMAIN_SHARED_ONLY
      - NO_MEMORY_READ
  - id: memory_write_default
    source_rule: K-AGCORE-068
    values:
      - CANONICAL_WRITE_ALLOWED
      - WRITE_NONE
      - PROMOTION_GATED
  - id: capability_scope
    source_rule: K-AGCORE-069
    values:
      - CANONICAL_AGENT_SCOPE
      - PROFILE_LIMITED
      - DOMAIN_LIMITED
      - DIAGNOSTIC_READ_ONLY
      - EXTERNAL_GATEWAY_LIMITED
      - NONE
  - id: input_trust
    source_rule: K-AGCORE-070
    values:
      - TRUSTED_USER
      - UNTRUSTED_MULTI_PARTY_TRANSCRIPT
      - SANDBOX_SCRIPT
      - EXTERNAL_A2A_PAYLOAD
      - TOOL_PROVIDER_PAYLOAD
      - WORLD_CONTEXT
      - DIAGNOSTIC_INPUT
  - id: output_destination
    source_rule: K-AGCORE-071
    values:
      - CANONICAL_CHAT
      - REALM_GROUP_MESSAGE_CANDIDATE
      - SCENARIO_TURN_CANDIDATE
      - WORLD_EVENT_CANDIDATE
      - EXTERNAL_REPLY_CANDIDATE
      - DIAGNOSTIC_CANDIDATE
      - EPHEMERAL
  - id: promotion_posture
    source_rule: K-AGCORE-072
    values:
      - NOT_ALLOWED
      - EXPLICIT_CANDIDATE
      - EXPLICIT_COMMIT_FLOW
      - EXISTING_CANONICAL_POLICY
  - id: execution_concurrency
    source_rule: K-AGCORE-073
    values:
      - CANONICAL_CHAT_BUDGET
      - PER_AGENT_PARTICIPATION_QUEUE
      - PROFILE_ISOLATED_BUDGET
      - DOMAIN_TRIGGER_QUEUE
      - REJECT_WHILE_ACTIVE
      - GATEWAY_BUDGET_QUEUE
      - LOW_PRIORITY_CANCELABLE
governance:
  open_string_axis_values_allowed: false
  broadening_requires_reopen: wave-1-participation-axis-authority-model
