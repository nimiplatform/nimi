version: 1
table_family: product_catalog
owner: runtime
catalog_id: runtime_agent_participation_output_destinations
entries:
  - CANONICAL_CHAT
  - REALM_GROUP_MESSAGE_CANDIDATE
  - SCENARIO_TURN_CANDIDATE
  - WORLD_EVENT_CANDIDATE
  - EXTERNAL_REPLY_CANDIDATE
  - DIAGNOSTIC_CANDIDATE
  - EPHEMERAL
  - source_rule
  - fields
  - direct_domain_commit_from_runtime_participation
source_rule: K-AGCORE-071
destinations:
  - id: CANONICAL_CHAT
    source_rule: K-AGCORE-075
    commit_owner: K-AGCORE
    commit_posture: existing_canonical_policy
  - id: REALM_GROUP_MESSAGE_CANDIDATE
    source_rule: K-AGCORE-076
    commit_owner: R-CHAT
    commit_posture: realm_authenticated_commit
  - id: SCENARIO_TURN_CANDIDATE
    source_rule: K-AGCORE-077
    commit_owner: future_scenario_authority
    commit_posture: future_consumer_only
  - id: WORLD_EVENT_CANDIDATE
    source_rule: K-AGCORE-078
    commit_owner: future_oasis_world_authority
    commit_posture: future_consumer_only
  - id: EXTERNAL_REPLY_CANDIDATE
    source_rule: K-AGCORE-079
    commit_owner: owning_domain_or_external_path
    commit_posture: gateway_verdict_required
  - id: DIAGNOSTIC_CANDIDATE
    source_rule: K-AGCORE-080
    commit_owner: diagnostic_surface
    commit_posture: read_only_or_ephemeral
  - id: EPHEMERAL
    source_rule: K-AGCORE-071
    commit_owner: none
    commit_posture: no_durable_commit
candidate_required_fields:
  source_rule: K-AGCORE-082
  fields:
    - participation_id
    - profile_kind
    - identity_source
    - participant_ref
    - trigger_ref
    - context_block_refs
    - output_destination
    - candidate_ref
    - policy_verdict_ref
    - memory_read_verdict
    - memory_write_verdict
    - capability_scope_verdict
    - audit_id
    - created_at
governance:
  direct_domain_commit_from_runtime_participation: forbidden
