  - { method_id: /nimi.runtime.v1.RuntimeDevelopmentService/EndLocalDevelopmentRun, operation_class: local_development_run_end, allowed_transport_classes: [desktop_control], required_origin_roles: [local_app_control], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-009 }

  # These are the exact unary Runtime methods consumed by the verified Nimi
  # Desktop shell for runtime inventory, health, usage, scheduling, and the
  # route-description probe. They remain bound to the live Desktop control
  # session. This is not a generic method-id/bytes proxy, admits no stream, and
  # does not change handler-level request, capability, grant, or account checks.
  - { method_id: /nimi.runtime.v1.RuntimeLocalService/ListLocalAssets, operation_class: desktop_runtime_inventory, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeLocalService/ListNodeCatalog, operation_class: desktop_runtime_inventory, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
