  - { method_id: /nimi.runtime.v1.RuntimeDevelopmentService/DecideLocalDevelopmentProject, operation_class: local_development_control, allowed_transport_classes: [desktop_control], required_origin_roles: [local_app_control], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-009 }
