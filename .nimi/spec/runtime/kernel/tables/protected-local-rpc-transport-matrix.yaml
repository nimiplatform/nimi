  - { method_id: /nimi.runtime.v1.RuntimeAgentService/ListAgents, operation_class: desktop_runtime_inventory, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }

  # The fixed production service exposes no ordinary public listener. These
  # are the exact existing Desktop first-run/product-control methods carried
  # on the verified Desktop connection after OpenDesktopSession. This is not
  # a generic RuntimeLocalService proxy and does not admit package/import,
  # arbitrary asset/model lifecycle, transfer, engine, or method-id/bytes
  # access. The four dependency-job control methods below are the bounded
  # Runtime-owned first-run materialization surface defined by K-RPC-004.
  - { method_id: /nimi.runtime.v1.RuntimeLocalService/CollectDeviceProfile, operation_class: desktop_product_control, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-RPC-004 }
  - { method_id: /nimi.runtime.v1.RuntimeLocalService/ResolveLocalEnvironmentPlan, operation_class: desktop_product_control, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-RPC-004 }
  - { method_id: /nimi.runtime.v1.RuntimeLocalService/ListLocalEnvironmentDependencyJobs, operation_class: desktop_product_control, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-RPC-004 }
