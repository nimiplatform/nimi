version: 10
table_family: protocol_surface
owner: runtime
protocol_id: runtime_protected_local_rpc_transport_matrix
surfaces:
  - RuntimeAuthService
  - RuntimeServiceControlService
  - RuntimeAccountService
  - RuntimeAuditService
  - RuntimeAppService
  - RuntimeArtifactService
  - RuntimeAgentService
  - RuntimeDevelopmentService
  - RuntimeLocalService
description: >-
  Closed verified-platform-transport and verified-origin admission for Desktop
  control and the common third-party local-app kernel. Physical carriers are
  selected only by same-OS profiles. Immutable package/install/update/promotion
  remains typed unavailable; local_development is the only 0K positive
  third-party trust class.
authority_refs:
  - K-PLOCAL-001
  - K-PLOCAL-002
  - K-PLOCAL-006
  - K-PLOCAL-007
  - K-PLOCAL-008
  - K-PLOCAL-009
  - K-APP-017
  - K-ACCSVC-026
  - K-GRANT-014
  - K-AGCORE-032
  - K-AGCORE-052
  - K-AGCORE-053
  - K-AUDIT-024
  - K-APP-032
  - K-VOICE-021
transport_classes: [public_tcp, desktop_control, local_app_bootstrap, local_app_host]
verified_platform_transport:
  binding_name: verified_platform_transport
  profile_key: os
  custody_profile_ref: protected-local-custody-profiles.yaml#same-os
  service_principal_profile_ref: protected-local-runtime-principal-profiles.yaml#same-os
  transport_profile_ref: protected-local-os-profiles.yaml#same-os
  executable_trust_profile_ref: .nimi/spec/platform/kernel/tables/protected-local-executable-trust-sets.yaml#same-os
  launch_session_profile_ref: protected-local-launch-session-profiles.yaml#same-os
  cross_platform_profile_mix: forbidden
transport_class_bindings:
  public_tcp:
    binding: public_tcp_binding_only
    verified_platform_transport_profile: not_applicable
  desktop_control:
    binding: verified_platform_transport
    carrier_role: desktop_control
    profile_bundle_ref: verified_platform_transport
  local_app_bootstrap:
    binding: verified_platform_transport
    carrier_role: local_app_bootstrap
    profile_bundle_ref: verified_platform_transport
  local_app_host:
    binding: verified_platform_transport
    carrier_role: local_app_host
    profile_bundle_ref: verified_platform_transport
method_platform_binding:
  coverage: every_methods_row
  selector_field: allowed_transport_classes
  resolver: transport_class_bindings
  protected_binding_description: verified_platform_transport
  profile_resolution: same_os
  missing_or_ambiguous_binding: fail_generation
platform_admission:
  windows: admitted_fixed_service_and_process_verification
  macos: fail_closed_pending_native_admission
  linux: fail_closed_pending_native_admission
  forbidden_fallbacks:
    - localhost_grpc
    - same_user_daemon
    - direct_tauri_dev
    - manual_electron
    - argv
    - env
    - temp_file
    - renderer_ipc
    - portable_bearer
    - raw_executable_self_auth
g5_supervisor_profile_consistency:
  structure_status: reserved_without_current_assertion_behavior_change
  profile_key: os
  profile_components:
    - custody_profile_ref
    - service_principal_profile_ref
    - transport_profile_ref
    - executable_trust_profile_ref
    - launch_session_profile_ref
  current_assertion:
    os: windows
    command: pnpm check:local-development-supervisor-parity
    implementation_bindings: [desktop_electron_supervisor, desktop_tauri_supervisor]
    behavior: unchanged_exact_dual_supervisor_cross_assertion
  per_platform:
    - os: windows
      admission: current_assertion_active
      implementation_bindings: [desktop_electron_supervisor, desktop_tauri_supervisor]
      assertion_activation: current
    - os: linux
      admission: requirements_only_fail_closed_pending_native_admission
      implementation_bindings: []
      assertion_activation: pending_complete_native_profile_and_implementation_admission
    - os: macos
      admission: requirements_only_fail_closed_pending_native_admission
      implementation_bindings: []
      assertion_activation: pending_complete_native_profile_and_implementation_admission
  consistency_rules:
    every_implementation_resolves_one_same_os_profile_bundle: required
    single_sided_implementation: reject
    cross_platform_profile_substitution: forbidden
    missing_profile_component: reject
trust_classes:
  admitted_positive: [local_development]
  opaque_typed_unavailable: [verified, user_imported]
  bundled_excluded: true
origin_roles:
  - binding_only
  - verified_desktop_process
  - desktop_account_host
  - local_app_control
  - local_app_process
  - local_app_session
operation_classes:
  - binding_bootstrap
  - desktop_session_bootstrap
  - local_app_session_bootstrap
  - runtime_service_control
  - desktop_account_projection
  - desktop_account_control
  - desktop_binding_control
  - local_app_public_permission_projection
  - local_app_public_permission_request
  - realm_broker_transport
  - local_app_launch_preparation
  - local_app_process_binding
  - local_development_control
  - local_development_run_end
  - desktop_product_control
  - desktop_runtime_audit_projection
  - local_app_json_storage
  - blocked_pending_separate_authority
matrix_schema:
  fields:
    - method_id
    - operation_class
    - allowed_transport_classes
    - required_origin_roles
    - required_origin_roles_by_transport
    - request_may_select_role
    - portable_session_allowed
    - public_tcp_disposition
    - broker_operation_policy_ref
    - generic_proxy
    - source_rule
public_tcp_privileged_disposition: deny
request_role_selection: forbidden
portable_privileged_session: forbidden
desktop_session_requirement:
  bootstrap_exemption: /nimi.runtime.v1.RuntimeAuthService/OpenDesktopSession
  all_other_desktop_control_methods: live_boot_scoped_desktop_session_required
  correlation_or_metadata_rebind: forbidden
open_desktop_session_wire:
  request:
    message: OpenDesktopSessionRequest
    fields: []
    request_metadata_authority_inputs: []
    unknown_field_disposition: reject
  response:
    message: OpenDesktopSessionResponse
    fields:
      - { name: desktop_session_id, type: bytes, exact_length: 32, authority: correlation_only_non_portable }
      - { name: runtime_boot_epoch, type: bytes, exact_length: 32, authority: stale_projection_rejection_only }
  renderer_projection: forbidden
  app_projection: forbidden
  connection_binding: exact_verified_desktop_control_connection
  session_reuse_or_rebind: forbidden
  source_rule: K-PLOCAL-006
open_local_app_session_wire:
  request:
    message: OpenLocalAppSessionRequest
    fields: []
    request_metadata_authority_inputs: []
    unknown_field_disposition: reject
  response:
    message: OpenLocalAppSessionResponse
    projection_fields: [state, trust_class, account_generation, runtime_boot_epoch, reason_code]
    forbidden_fields:
      - local_app_principal_id
      - immutable_lineage_id
      - local_record_id
      - permission_id
      - permission_state
      - permission_decision_id
      - session_id
      - session_proof
      - launch_lease
      - process_proof
      - endpoint
      - token
      - credential
  connection_binding: exact_bound_local_app_process_and_current_launch_lease
  atomic_transition: launch_lease_consume_and_private_local_app_session_insert
  renderer_projection: typed_session_and_permission_posture_only
  ordinary_grpc_disposition: deny
  source_rule: K-PLOCAL-008
methods:
  - { method_id: /nimi.runtime.v1.RuntimeServiceControlService/RequestRuntimeRestart, operation_class: runtime_service_control, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-003 }
  - { method_id: /nimi.runtime.v1.RuntimeAuthService/RegisterApp, operation_class: binding_bootstrap, allowed_transport_classes: [public_tcp], required_origin_roles: [binding_only], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: binding_only, source_rule: K-PLOCAL-001 }
  - { method_id: /nimi.runtime.v1.RuntimeAuthService/OpenSession, operation_class: binding_bootstrap, allowed_transport_classes: [public_tcp], required_origin_roles: [binding_only], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: binding_only, source_rule: K-PLOCAL-001 }
  - { method_id: /nimi.runtime.v1.RuntimeAuthService/OpenDesktopSession, operation_class: desktop_session_bootstrap, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAuthService/OpenLocalAppSession, operation_class: local_app_session_bootstrap, allowed_transport_classes: [local_app_bootstrap], required_origin_roles: [local_app_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-008 }

  - { method_id: /nimi.runtime.v1.RuntimeAccountService/GetAccountSessionStatus, operation_class: desktop_account_projection, allowed_transport_classes: [desktop_control], required_origin_roles: [desktop_account_host], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/SubscribeAccountSessionEvents, operation_class: desktop_account_projection, allowed_transport_classes: [desktop_control], required_origin_roles: [desktop_account_host], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/BeginLogin, operation_class: desktop_account_control, allowed_transport_classes: [desktop_control], required_origin_roles: [desktop_account_host], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/CompleteLogin, operation_class: desktop_account_control, allowed_transport_classes: [desktop_control], required_origin_roles: [desktop_account_host], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/RequestPresenceVerification, operation_class: desktop_account_control, allowed_transport_classes: [desktop_control], required_origin_roles: [desktop_account_host], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/Logout, operation_class: desktop_account_control, allowed_transport_classes: [desktop_control], required_origin_roles: [desktop_account_host], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/SwitchAccount, operation_class: desktop_account_control, allowed_transport_classes: [desktop_control], required_origin_roles: [desktop_account_host], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - method_id: /nimi.runtime.v1.RuntimeAccountService/InvokeRealmUnary
    operation_class: realm_broker_transport
    allowed_transport_classes: [desktop_control]
    required_origin_roles: [desktop_account_host]
    request_may_select_role: false
    portable_session_allowed: false
    public_tcp_disposition: deny
    broker_operation_policy_ref: runtime_realm_broker_operations
    generic_proxy: forbidden
    source_rule: K-ACCSVC-023
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/IssueScopedAppBinding, operation_class: desktop_binding_control, allowed_transport_classes: [desktop_control], required_origin_roles: [desktop_account_host], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-ACCSVC-024 }
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/RevokeScopedAppBinding, operation_class: desktop_binding_control, allowed_transport_classes: [desktop_control], required_origin_roles: [desktop_account_host], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-ACCSVC-024 }
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/GetLocalAppPermissionStatus, operation_class: local_app_public_permission_projection, allowed_transport_classes: [local_app_host], required_origin_roles: [local_app_session], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, generic_proxy: forbidden, source_rule: P-PERM-007 }
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/RequestLocalAppPermission, operation_class: local_app_public_permission_request, allowed_transport_classes: [local_app_host], required_origin_roles: [local_app_session], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, generic_proxy: forbidden, source_rule: P-PERM-007 }

  - { method_id: /nimi.runtime.v1.RuntimeAppService/PrepareLocalAppLaunch, operation_class: local_app_launch_preparation, allowed_transport_classes: [desktop_control], required_origin_roles: [local_app_control], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-APP-017 }
  - { method_id: /nimi.runtime.v1.RuntimeAppService/BindLocalAppProcess, operation_class: local_app_process_binding, allowed_transport_classes: [desktop_control], required_origin_roles: [local_app_control], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-008 }

  - { method_id: /nimi.runtime.v1.RuntimeDevelopmentService/GetDeveloperModeStatus, operation_class: local_development_control, allowed_transport_classes: [desktop_control], required_origin_roles: [local_app_control], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-009 }
  - { method_id: /nimi.runtime.v1.RuntimeDevelopmentService/GetLocalDevelopmentAuthoritySummary, operation_class: local_development_bounded_diagnostic_projection, allowed_transport_classes: [desktop_control], required_origin_roles: [local_app_control], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, generic_proxy: forbidden, source_rule: K-PLOCAL-009 }
  - { method_id: /nimi.runtime.v1.RuntimeDevelopmentService/SetDeveloperMode, operation_class: local_development_control, allowed_transport_classes: [desktop_control], required_origin_roles: [local_app_control], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-009 }
  - { method_id: /nimi.runtime.v1.RuntimeDevelopmentService/EvaluateLocalDevelopmentProject, operation_class: local_development_control, allowed_transport_classes: [desktop_control], required_origin_roles: [local_app_control], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-009 }
  - { method_id: /nimi.runtime.v1.RuntimeDevelopmentService/DecideLocalDevelopmentProject, operation_class: local_development_control, allowed_transport_classes: [desktop_control], required_origin_roles: [local_app_control], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-009 }
  - { method_id: /nimi.runtime.v1.RuntimeDevelopmentService/ListLocalDevelopmentAuthorizations, operation_class: local_development_control, allowed_transport_classes: [desktop_control], required_origin_roles: [local_app_control], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-009 }
  - { method_id: /nimi.runtime.v1.RuntimeDevelopmentService/ReactivateLocalDevelopmentProject, operation_class: local_development_control, allowed_transport_classes: [desktop_control], required_origin_roles: [local_app_control], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-009 }
  - { method_id: /nimi.runtime.v1.RuntimeDevelopmentService/RevokeLocalDevelopmentAuthorization, operation_class: local_development_control, allowed_transport_classes: [desktop_control], required_origin_roles: [local_app_control], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-009 }
  - { method_id: /nimi.runtime.v1.RuntimeDevelopmentService/EndLocalDevelopmentRun, operation_class: local_development_run_end, allowed_transport_classes: [desktop_control], required_origin_roles: [local_app_control], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-009 }

  # These are the exact unary Runtime methods consumed by the verified Nimi
  # Desktop shell for runtime inventory, health, usage, scheduling, and the
  # route-description probe. They remain bound to the live Desktop control
  # session. This is not a generic method-id/bytes proxy, admits no stream, and
  # does not change handler-level request, capability, permission, or account checks.
  - { method_id: /nimi.runtime.v1.RuntimeLocalService/ListLocalAssets, operation_class: desktop_runtime_inventory, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeLocalService/ListNodeCatalog, operation_class: desktop_runtime_inventory, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeLocalService/CheckLocalAssetHealth, operation_class: desktop_runtime_health, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeConnectorService/ListConnectors, operation_class: desktop_runtime_inventory, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAuditService/GetRuntimeHealth, operation_class: desktop_runtime_health, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAuditService/ListAIProviderHealth, operation_class: desktop_runtime_health, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAuditService/ListDesktopAuditEvents, operation_class: desktop_runtime_audit_projection, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, generic_proxy: forbidden, source_rule: K-AUDIT-024 }
  - { method_id: /nimi.runtime.v1.RuntimeAuditService/ListUsageStats, operation_class: desktop_runtime_usage, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAiService/PeekScheduling, operation_class: desktop_runtime_scheduling, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAiService/ExecuteScenario, operation_class: desktop_runtime_route_description, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAgentService/ListAgents, operation_class: desktop_runtime_inventory, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }

  # The fixed production service exposes no ordinary public listener. These
  # are the exact existing Desktop first-run/product-control methods carried
  # on the verified Desktop connection after OpenDesktopSession. This is not
  # a generic RuntimeLocalService proxy and does not admit package/import,
  # arbitrary asset/model lifecycle, transfer, engine, or method-id/bytes
  # access. The four dependency-job control methods below are the bounded
  # Runtime-owned first-run materialization surface defined by K-RPC-004.
  - { method_id: /nimi.runtime.v1.RuntimeLocalService/CollectDeviceProfile, operation_class: desktop_product_control, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-RPC-004 }
  - { method_id: /nimi.runtime.v1.RuntimeLocalService/ResolveLocalEnvironmentPlan, operation_class: desktop_product_control, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-RPC-004 }
  - { method_id: /nimi.runtime.v1.RuntimeLocalService/ListLocalEnvironmentDependencyJobs, operation_class: desktop_product_control, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-RPC-004 }
