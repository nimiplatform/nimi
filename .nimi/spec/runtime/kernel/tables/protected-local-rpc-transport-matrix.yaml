  - { method_id: /nimi.runtime.v1.RuntimeLocalService/CancelLocalEnvironmentDependencyJob, operation_class: desktop_product_control, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-RPC-004 }
  - { method_id: /nimi.runtime.v1.RuntimeLocalService/RetryLocalEnvironmentDependencyJob, operation_class: desktop_product_control, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-RPC-004 }
  - { method_id: /nimi.runtime.v1.RuntimeLocalService/RepairLocalEnvironmentDependency, operation_class: desktop_product_control, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-RPC-004 }
  - { method_id: /nimi.runtime.v1.RuntimeLocalService/ResolveRuntimeBaselineReadiness, operation_class: desktop_product_control, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-RPC-004 }
  - { method_id: /nimi.runtime.v1.RuntimeLocalService/MintRuntimeBaselineReadiness, operation_class: desktop_product_control, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-RPC-004 }
  - { method_id: /nimi.runtime.v1.RuntimeLocalService/ResolveFirstRunExecutionEvidence, operation_class: desktop_product_control, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-RPC-004 }
  - { method_id: /nimi.runtime.v1.RuntimeLocalService/MintFirstRunExecutionEvidence, operation_class: desktop_product_control, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-RPC-004 }
  - { method_id: /nimi.runtime.v1.RuntimeLocalService/GetProductControlRecord, operation_class: desktop_product_control, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-RPC-004 }
