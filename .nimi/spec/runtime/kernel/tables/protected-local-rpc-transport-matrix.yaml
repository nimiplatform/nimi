version: 6
table_family: protocol_surface
owner: runtime
protocol_id: runtime_protected_local_rpc_transport_matrix
surfaces:
  - RuntimeAuthService
  - RuntimeServiceControlService
  - RuntimeAccountService
  - RuntimeAppService
  - RuntimeArtifactService
  - RuntimeAgentService
  - RuntimeDevelopmentService
  - RuntimeLocalService
description: >-
  Closed transport and verified-origin admission for Desktop control and the
  common third-party local-app kernel. Immutable package/install/update/
  promotion remains typed unavailable; local_development is the only 0K
  positive third-party trust class.
authority_refs:
  - K-PLOCAL-001
  - K-PLOCAL-002
  - K-PLOCAL-006
  - K-PLOCAL-007
  - K-PLOCAL-008
  - K-PLOCAL-009
  - K-APP-017
  - K-ACCSVC-026
  - K-GRANT-014
  - K-AGCORE-032
  - K-AGCORE-052
  - K-AGCORE-053
transport_classes: [public_tcp, desktop_control, local_app_bootstrap, local_app_host]
platform_admission:
  windows: admitted_fixed_service_and_process_verification
  macos: fail_closed_pending_native_admission
  linux: fail_closed_pending_native_admission
  forbidden_fallbacks:
    - localhost_grpc
    - same_user_daemon
    - direct_tauri_dev
    - manual_electron
    - argv
    - env
    - temp_file
    - renderer_ipc
    - portable_bearer
    - raw_executable_self_auth
trust_classes:
  admitted_positive: [local_development]
  opaque_typed_unavailable: [verified, user_imported]
  bundled_excluded: true
origin_roles:
  - binding_only
  - verified_desktop_process
  - desktop_account_host
  - local_app_control
  - local_app_process
  - local_app_session
operation_classes:
  - binding_bootstrap
  - desktop_session_bootstrap
  - local_app_session_bootstrap
  - runtime_service_control
  - desktop_account_projection
  - desktop_account_control
  - desktop_binding_control
  - local_app_grant_projection
  - local_app_grant_request
  - local_app_grant_control
  - realm_broker_transport
  - local_app_launch_preparation
  - local_app_process_binding
  - local_development_control
  - local_development_run_end
  - desktop_product_control
  - local_app_artifact_read
  - local_app_agent_conversation
  - blocked_pending_separate_authority
matrix_schema:
  fields:
    - method_id
    - operation_class
    - allowed_transport_classes
    - required_origin_roles
    - required_origin_roles_by_transport
    - request_may_select_role
    - portable_session_allowed
    - public_tcp_disposition
    - source_rule
public_tcp_privileged_disposition: deny
request_role_selection: forbidden
portable_privileged_session: forbidden
desktop_session_requirement:
  bootstrap_exemption: /nimi.runtime.v1.RuntimeAuthService/OpenDesktopSession
  all_other_desktop_control_methods: live_boot_scoped_desktop_session_required
  correlation_or_metadata_rebind: forbidden
open_desktop_session_wire:
  request:
    message: OpenDesktopSessionRequest
    fields: []
    request_metadata_authority_inputs: []
    unknown_field_disposition: reject
  response:
    message: OpenDesktopSessionResponse
    fields:
      - { name: desktop_session_id, type: bytes, exact_length: 32, authority: correlation_only_non_portable }
      - { name: runtime_boot_epoch, type: bytes, exact_length: 32, authority: stale_projection_rejection_only }
  renderer_projection: forbidden
  app_projection: forbidden
  connection_binding: exact_verified_desktop_control_connection
  session_reuse_or_rebind: forbidden
  source_rule: K-PLOCAL-006
open_local_app_session_wire:
  request:
    message: OpenLocalAppSessionRequest
    fields: []
    request_metadata_authority_inputs: []
    unknown_field_disposition: reject
  response:
    message: OpenLocalAppSessionResponse
    projection_fields: [state, trust_class, account_generation, runtime_boot_epoch, reason_code]
    forbidden_fields:
      - local_app_principal_id
      - immutable_lineage_id
      - local_record_id
      - grant_id
      - grant_revision
      - session_id
      - session_proof
      - launch_lease
      - process_proof
      - endpoint
      - token
      - credential
  connection_binding: exact_bound_local_app_process_and_current_launch_lease
  atomic_transition: launch_lease_consume_and_private_local_app_session_insert
  renderer_projection: typed_session_and_permission_posture_only
  ordinary_grpc_disposition: deny
  source_rule: K-PLOCAL-008
methods:
  - { method_id: /nimi.runtime.v1.RuntimeServiceControlService/RequestRuntimeRestart, operation_class: runtime_service_control, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-003 }
  - { method_id: /nimi.runtime.v1.RuntimeAuthService/RegisterApp, operation_class: binding_bootstrap, allowed_transport_classes: [public_tcp], required_origin_roles: [binding_only], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: binding_only, source_rule: K-PLOCAL-001 }
  - { method_id: /nimi.runtime.v1.RuntimeAuthService/OpenSession, operation_class: binding_bootstrap, allowed_transport_classes: [public_tcp], required_origin_roles: [binding_only], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: binding_only, source_rule: K-PLOCAL-001 }
  - { method_id: /nimi.runtime.v1.RuntimeAuthService/OpenDesktopSession, operation_class: desktop_session_bootstrap, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAuthService/OpenLocalAppSession, operation_class: local_app_session_bootstrap, allowed_transport_classes: [local_app_bootstrap], required_origin_roles: [local_app_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-008 }

  - { method_id: /nimi.runtime.v1.RuntimeAccountService/GetAccountSessionStatus, operation_class: desktop_account_projection, allowed_transport_classes: [desktop_control], required_origin_roles: [desktop_account_host], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/SubscribeAccountSessionEvents, operation_class: desktop_account_projection, allowed_transport_classes: [desktop_control], required_origin_roles: [desktop_account_host], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/BeginLogin, operation_class: desktop_account_control, allowed_transport_classes: [desktop_control], required_origin_roles: [desktop_account_host], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/CompleteLogin, operation_class: desktop_account_control, allowed_transport_classes: [desktop_control], required_origin_roles: [desktop_account_host], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/RequestPresenceVerification, operation_class: desktop_account_control, allowed_transport_classes: [desktop_control], required_origin_roles: [desktop_account_host], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/Logout, operation_class: desktop_account_control, allowed_transport_classes: [desktop_control], required_origin_roles: [desktop_account_host], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/SwitchAccount, operation_class: desktop_account_control, allowed_transport_classes: [desktop_control], required_origin_roles: [desktop_account_host], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/InvokeRealmUnary, operation_class: realm_broker_transport, allowed_transport_classes: [desktop_control], required_origin_roles: [desktop_account_host], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-ACCSVC-023 }
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/IssueScopedAppBinding, operation_class: desktop_binding_control, allowed_transport_classes: [desktop_control], required_origin_roles: [desktop_account_host], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-ACCSVC-024 }
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/RevokeScopedAppBinding, operation_class: desktop_binding_control, allowed_transport_classes: [desktop_control], required_origin_roles: [desktop_account_host], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-ACCSVC-024 }
  - method_id: /nimi.runtime.v1.RuntimeAccountService/GetLocalAppGrantStatus
    operation_class: local_app_grant_projection
    allowed_transport_classes: [desktop_control, local_app_host]
    required_origin_roles_by_transport:
      desktop_control: [local_app_control]
      local_app_host: [local_app_session]
    request_may_select_role: false
    portable_session_allowed: false
    public_tcp_disposition: deny
    source_rule: K-GRANT-014
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/RequestLocalAppGrant, operation_class: local_app_grant_request, allowed_transport_classes: [local_app_host], required_origin_roles: [local_app_session], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-GRANT-014 }
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/DecideLocalAppGrant, operation_class: local_app_grant_control, allowed_transport_classes: [desktop_control], required_origin_roles: [local_app_control], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-GRANT-014 }
  - { method_id: /nimi.runtime.v1.RuntimeAccountService/RevokeLocalAppGrant, operation_class: local_app_grant_control, allowed_transport_classes: [desktop_control], required_origin_roles: [local_app_control], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-GRANT-014 }

  - { method_id: /nimi.runtime.v1.RuntimeAppService/PrepareLocalAppLaunch, operation_class: local_app_launch_preparation, allowed_transport_classes: [desktop_control], required_origin_roles: [local_app_control], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-APP-017 }
  - { method_id: /nimi.runtime.v1.RuntimeAppService/BindLocalAppProcess, operation_class: local_app_process_binding, allowed_transport_classes: [desktop_control], required_origin_roles: [local_app_control], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-008 }

  - { method_id: /nimi.runtime.v1.RuntimeDevelopmentService/GetDeveloperModeStatus, operation_class: local_development_control, allowed_transport_classes: [desktop_control], required_origin_roles: [local_app_control], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-009 }
  - { method_id: /nimi.runtime.v1.RuntimeDevelopmentService/SetDeveloperMode, operation_class: local_development_control, allowed_transport_classes: [desktop_control], required_origin_roles: [local_app_control], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-009 }
