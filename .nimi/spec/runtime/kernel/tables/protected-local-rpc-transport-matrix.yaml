  - { method_id: /nimi.runtime.v1.RuntimeConnectorService/ListConnectors, operation_class: desktop_runtime_inventory, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAuditService/GetRuntimeHealth, operation_class: desktop_runtime_health, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAuditService/ListAIProviderHealth, operation_class: desktop_runtime_health, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
  - { method_id: /nimi.runtime.v1.RuntimeAuditService/ListUsageStats, operation_class: desktop_runtime_usage, allowed_transport_classes: [desktop_control], required_origin_roles: [verified_desktop_process], request_may_select_role: false, portable_session_allowed: false, public_tcp_disposition: deny, source_rule: K-PLOCAL-006 }
