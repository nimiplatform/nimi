version: 4
table_family: protocol_surface
owner: runtime
protocol_id: runtime_protected_local_rpc_transport_matrix
surfaces:
  - RuntimeAuthService
  - RuntimeAccountService
  - RuntimeGrantService
  - RuntimeAppService
  - RuntimeArtifactService
  - RuntimeDevelopmentService
description: Closed transport and verified-origin admission for A.0 Desktop control, A.1 Windows installed launch/session methods, A.3 artifact reads, and A.5 mutable local-development authorization and technical sessions.
authority_refs:
  - K-PLOCAL-001
  - K-PLOCAL-002
  - K-PLOCAL-006
  - K-PLOCAL-007
  - K-AGCORE-053
  - K-PLOCAL-009
transport_classes:
  - public_tcp
  - desktop_control
  - launch_bootstrap
  - installed_host
reserved_not_admitted_in_a0: [launch_bootstrap, installed_host]
a1_platform_admission:
  windows: admitted
  macos: fail_closed_pending_native_admission
  linux: fail_closed_pending_native_admission
  forbidden_fallbacks: [localhost_grpc, same_user_daemon, argv, env, temp_file, renderer_ipc, portable_bearer]
a5_local_development_admission:
  windows:
    authority_status: admitted
    implementation_status: pending_live_e2e
    closeout_status: blocked
  macos:
    authority_status: pending_independent_admission
    implementation_status: fail_closed_not_implemented
    closeout_status: blocked
  linux:
    authority_status: pending_independent_admission
    implementation_status: fail_closed_not_implemented
    closeout_status: blocked
  trust_class: local-development-installed-admission
  production_release_conversion: forbidden
  forbidden_fallbacks: [localhost_grpc, same_user_daemon, direct_tauri_dev, manual_electron, renderer_ipc, portable_bearer]
installed_host_carrier:
  physical_transport_shared_by: [production_installed, local_development]
  trust_classes_mutually_exclusive: true
  process_roles_mutually_exclusive: true
  session_handles_mutually_exclusive: true
  operation_authorization_revalidated_per_call: true
  cross_class_conversion: forbidden
origin_roles:
  - binding_only
  - verified_desktop_process
  - desktop_account_host
  - desktop_lifecycle_host
  - verified_installed_process
  - installed_host_session
  - verified_local_development_process
  - local_development_host_session
operation_classes:
  - binding_bootstrap
  - desktop_session_bootstrap
  - desktop_account_projection
  - desktop_account_control
  - desktop_binding_control
  - realm_broker_transport
  - desktop_lifecycle_ux_projection
  - desktop_lifecycle_mutation
  - installed_session_bootstrap
  - installed_launch_process_binding
  - installed_artifact_read
  - local_development_evaluation
  - local_development_decision
  - local_development_authorization_management
  - local_development_launch_preparation
  - local_development_process_binding
  - local_development_session_bootstrap
  - local_development_session_status
  - local_development_run_end
  - blocked_pending_separate_authority
  - ordinary_projection
matrix_schema:
  fields:
    - method_id
    - operation_class
    - allowed_transport_classes
    - required_origin_roles
    - request_may_select_role
    - portable_session_allowed
    - public_tcp_disposition
    - lifecycle_challenge_required
    - source_rule
legacy_lifecycle_challenge_field:
  authority_status: transitional_schema_name
  false_semantics: no_prepare_projection_required
  true_semantics: lifecycle_operation_binding_and_transaction_required_not_anchored_challenge
  removal_owner: proto_and_generator_migration
public_tcp_privileged_disposition: deny
request_role_selection: forbidden
portable_privileged_session: forbidden
authority_admitted_pending_proto_projection: []
open_desktop_session_wire:
  request:
    message: OpenDesktopSessionRequest
    fields: []
    request_metadata_authority_inputs: []
    unknown_field_disposition: reject
  response:
    message: OpenDesktopSessionResponse
    fields:
      - name: desktop_session_id
        type: bytes
        exact_length: 32
        authority: correlation_only_non_portable
      - name: runtime_boot_epoch
        type: bytes
        exact_length: 32
        authority: stale_projection_rejection_only
  renderer_projection: forbidden
  app_projection: forbidden
  connection_binding: exact_verified_desktop_control_connection
  session_reuse_or_rebind: forbidden
  source_rule: K-PLOCAL-006
open_installed_session_wire:
  request:
    message: OpenDesktopLaunchedAppSessionRequest
    fields: []
    request_metadata_authority_inputs: []
    unknown_field_disposition: reject
  response:
    message: OpenDesktopLaunchedAppSessionResponse
    authority_fields: [installed_session_id, installed_session_proof, expires_at]
    projection_fields: [app_id, release_digest, account_generation, runtime_boot_epoch]
  connection_binding: exact_verified_launch_bootstrap_connection
  atomic_transition: launch_ticket_consume_and_installed_session_insert
  renderer_projection: forbidden
  ordinary_grpc_disposition: deny
  source_rule: K-PLOCAL-008
open_local_development_session_wire:
  request:
    message: OpenLocalDevelopmentAppSessionRequest
    fields: []
    request_metadata_authority_inputs: []
    unknown_field_disposition: reject
  response:
    message: OpenLocalDevelopmentAppSessionResponse
    authority_fields: []
    projection_fields: [state, app_id, bootstrap_artifact_id, expires_at, account_generation, runtime_boot_epoch, reason_code]
    forbidden_fields: [session_id, session_proof, launch_ticket, token, credential]
  connection_binding: installed_host_carrier_exact_verified_desktop_supervised_local_development_process
  atomic_transition: development_launch_consume_and_private_session_insert
  renderer_projection: typed_status_and_bootstrap_artifact_selector_only
  ordinary_grpc_disposition: deny
  source_rule: K-PLOCAL-009
