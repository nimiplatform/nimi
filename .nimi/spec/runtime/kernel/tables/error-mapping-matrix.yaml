mappings:
  # General sentinel codes
  - reason_code: REASON_CODE_UNSPECIFIED
    grpc_code: OK
    surface: success_or_default
    exit_shape: grpc_status
    source_rule: K-ERR-001
  - reason_code: ACTION_EXECUTED
    grpc_code: OK
    surface: success_confirmation
    exit_shape: grpc_status
    source_rule: K-ERR-001
  - reason_code: PROTOCOL_ENVELOPE_INVALID
    grpc_code: INVALID_ARGUMENT
    surface: protocol_envelope_validation
    exit_shape: grpc_status
    source_rule: K-ERR-003
  - reason_code: PROTOCOL_DOMAIN_FIELD_CONFLICT
    grpc_code: INVALID_ARGUMENT
    surface: protocol_envelope_validation
    exit_shape: grpc_status
    source_rule: K-ERR-003
  - reason_code: CAPABILITY_CATALOG_MISMATCH
    grpc_code: FAILED_PRECONDITION
    surface: scope_catalog_validation
    exit_shape: grpc_status
    source_rule: K-ERR-006
  - reason_code: APP_NOT_REGISTERED
    grpc_code: UNAUTHENTICATED
    surface: app_session_validation
    exit_shape: grpc_status
    source_rule: K-AUTHSVC-003
  - reason_code: EXTERNAL_PRINCIPAL_NOT_REGISTERED
    grpc_code: UNAUTHENTICATED
    surface: external_principal_session_validation
    exit_shape: grpc_status
    source_rule: K-AUTHSVC-006
  - reason_code: PRINCIPAL_UNAUTHORIZED
    grpc_code: PERMISSION_DENIED
    surface: authz_gate
    exit_shape: grpc_status
    source_rule: K-AUTH-001
  # App authorization legacy (100-117)
  - reason_code: APP_AUTHORIZATION_DENIED
    grpc_code: PERMISSION_DENIED
    surface: app_authorization_gate
    exit_shape: grpc_status
    source_rule: K-GRANT-003
  - reason_code: APP_GRANT_INVALID
    grpc_code: INVALID_ARGUMENT
    surface: grant_validation
    exit_shape: grpc_status
    source_rule: K-GRANT-004
  - reason_code: APP_TOKEN_EXPIRED
    grpc_code: UNAUTHENTICATED
    surface: app_session_validation
    exit_shape: grpc_status
    source_rule: K-AUTHSVC-004
  - reason_code: APP_TOKEN_REVOKED
    grpc_code: UNAUTHENTICATED
    surface: app_session_validation
    exit_shape: grpc_status
    source_rule: K-AUTHSVC-005
  - reason_code: APP_SCOPE_CATALOG_UNPUBLISHED
