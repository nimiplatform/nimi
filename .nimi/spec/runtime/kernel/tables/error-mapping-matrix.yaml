    grpc_code: UNAUTHENTICATED
    surface: authn_session_check
    exit_shape: grpc_status
    source_rule: K-AUTHN-006
  - reason_code: AUTH_TOKEN_INVALID
    grpc_code: UNAUTHENTICATED
    surface: authn_all
    exit_shape: grpc_status
    source_rule: K-AUTHN-007
