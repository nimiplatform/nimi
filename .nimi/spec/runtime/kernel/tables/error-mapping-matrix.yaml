    grpc_code: INVALID_ARGUMENT
    surface: external_principal_registration
    exit_shape: grpc_status
    source_rule: K-AUTHSVC-013
  - reason_code: AI_CONNECTOR_NOT_FOUND
    grpc_code: NOT_FOUND
    surface: consume_remote_or_hidden_connector
    exit_shape: grpc_status
    source_rule: K-ERR-004
  - reason_code: AI_CONNECTOR_DISABLED
    grpc_code: FAILED_PRECONDITION
    surface: consume_or_connector_probe
    exit_shape: grpc_status
    source_rule: K-ERR-004
  - reason_code: AI_CONNECTOR_CREDENTIAL_MISSING
    grpc_code: FAILED_PRECONDITION
    surface: consume_or_list_models
    exit_shape: grpc_status
    source_rule: K-ERR-004
    note: "consume/list 路径：凭据缺失作为前置条件失败返回"
  - reason_code: AI_CONNECTOR_INVALID
    grpc_code: INVALID_ARGUMENT
    surface: connector_manage_input_validation
    exit_shape: grpc_status
    source_rule: K-ERR-006
    note: "connector_manage 路径：非法 provider、endpoint、字段组合等输入校验失败统一映射到该 reason_code"
  - reason_code: AI_CONNECTOR_INVALID
    grpc_code: INVALID_ARGUMENT
    surface: consume_local_connector_managed_path
    exit_shape: grpc_status
    source_rule: K-KEYSRC-009
    note: "同一 reason_code 的另一消费面：consume 入口在 local connector managed path 校验失败时复用 AI_CONNECTOR_INVALID"
  - reason_code: AI_CONNECTOR_IMMUTABLE
    grpc_code: FAILED_PRECONDITION
    surface: connector_manage_immutable_field_update
    exit_shape: grpc_status
    source_rule: K-ERR-006
