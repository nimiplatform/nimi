    exit_shape: grpc_status
    source_rule: K-GRANT-008
  - reason_code: APP_DELEGATION_FORBIDDEN
    grpc_code: PERMISSION_DENIED
    surface: delegation_gate
    exit_shape: grpc_status
    source_rule: K-GRANT-005
  - reason_code: APP_DELEGATION_DEPTH_EXCEEDED
    grpc_code: FAILED_PRECONDITION
    surface: delegation_depth_guard
    exit_shape: grpc_status
    source_rule: K-GRANT-005
  - reason_code: APP_RESOURCE_SELECTOR_INVALID
    grpc_code: INVALID_ARGUMENT
    surface: resource_selector_validation
    exit_shape: grpc_status
    source_rule: K-GRANT-003
  - reason_code: APP_RESOURCE_OUT_OF_SCOPE
    grpc_code: PERMISSION_DENIED
    surface: resource_scope_gate
    exit_shape: grpc_status
    source_rule: K-GRANT-005
  - reason_code: APP_CONSENT_MISSING
    grpc_code: FAILED_PRECONDITION
    surface: consent_validation
    exit_shape: grpc_status
    source_rule: K-GRANT-003
  - reason_code: APP_CONSENT_INVALID
    grpc_code: INVALID_ARGUMENT
    surface: consent_validation
    exit_shape: grpc_status
    source_rule: K-GRANT-003
  - reason_code: EXTERNAL_PRINCIPAL_PROOF_MISSING
