table_family: owner_matrix
owner: runtime
matrix_id: runtime_error_mapping_matrix
rows:
  - WF_DAG_INVALID
  - WF_NODE_CONFIG_MISMATCH
  - WF_TIMEOUT
  - WF_TASK_NOT_FOUND
  - GRANT_TOKEN_CHAIN_ROOT_NOT_FOUND
  - GRANT_TOKEN_CHAIN_ROOT_REQUIRED
  - PAGE_TOKEN_INVALID
  - KNOWLEDGE_BANK_ALREADY_EXISTS
  - KNOWLEDGE_BANK_NOT_FOUND
  - KNOWLEDGE_BANK_SCOPE_INVALID
  - KNOWLEDGE_BANK_ACCESS_DENIED
  - KNOWLEDGE_PAGE_NOT_FOUND
  - KNOWLEDGE_PAGE_SLUG_CONFLICT
  - KNOWLEDGE_PAGE_ACCESS_DENIED
  - KNOWLEDGE_HYBRID_SEARCH_UNAVAILABLE
  - KNOWLEDGE_EMBEDDING_PROFILE_UNAVAILABLE
  - KNOWLEDGE_VECTOR_INDEX_NOT_READY
  - KNOWLEDGE_INDEX_REFRESH_IN_PROGRESS
  - KNOWLEDGE_LINK_NOT_FOUND
  - KNOWLEDGE_LINK_ALREADY_EXISTS
  - KNOWLEDGE_LINK_INVALID
  - KNOWLEDGE_GRAPH_DEPTH_INVALID
  - KNOWLEDGE_INGEST_TASK_NOT_FOUND
mappings:
  - reason_code: WF_DAG_INVALID
    grpc_code: INVALID_ARGUMENT
    surface: workflow_submit
    exit_shape: grpc_status
    source_rule: K-WF-010
  - reason_code: WF_NODE_CONFIG_MISMATCH
    grpc_code: INVALID_ARGUMENT
    surface: workflow_submit
    exit_shape: grpc_status
    source_rule: K-WF-002
  - reason_code: WF_TIMEOUT
    grpc_code: DEADLINE_EXCEEDED
    surface: workflow_execute
    exit_shape: grpc_status
    source_rule: K-WF-003
  - reason_code: WF_TASK_NOT_FOUND
    grpc_code: NOT_FOUND
    surface: workflow_query
    exit_shape: grpc_status
    source_rule: K-WF-003
  - reason_code: GRANT_TOKEN_CHAIN_ROOT_NOT_FOUND
    grpc_code: NOT_FOUND
    surface: grant_list_token_chain
    exit_shape: grpc_status
    source_rule: K-GRANT-013
  - reason_code: GRANT_TOKEN_CHAIN_ROOT_REQUIRED
    grpc_code: INVALID_ARGUMENT
    surface: grant_list_token_chain
    exit_shape: grpc_status
    source_rule: K-GRANT-013
  - reason_code: PAGE_TOKEN_INVALID
    grpc_code: INVALID_ARGUMENT
    surface: list_rpc_page_token_validation
    exit_shape: grpc_status
    source_rule: K-PAGE-002
  - reason_code: KNOWLEDGE_BANK_ALREADY_EXISTS
    grpc_code: ALREADY_EXISTS
    surface: create_knowledge_bank_duplicate_typed_owner
    exit_shape: grpc_status
    source_rule: K-KNOW-005
  - reason_code: KNOWLEDGE_BANK_NOT_FOUND
    grpc_code: NOT_FOUND
    surface: get_or_delete_knowledge_bank_missing
    exit_shape: grpc_status
    source_rule: K-KNOW-005
  - reason_code: KNOWLEDGE_BANK_SCOPE_INVALID
    grpc_code: INVALID_ARGUMENT
    surface: create_knowledge_bank_non_wave1_scope
    exit_shape: grpc_status
    source_rule: K-KNOW-005
  - reason_code: KNOWLEDGE_BANK_ACCESS_DENIED
    grpc_code: PERMISSION_DENIED
    surface: bank_scoped_knowledge_access_denied
    exit_shape: grpc_status
    source_rule: K-KNOW-005
  - reason_code: KNOWLEDGE_PAGE_NOT_FOUND
    grpc_code: NOT_FOUND
    surface: get_or_delete_knowledge_page_missing
    exit_shape: grpc_status
    source_rule: K-KNOW-005
  - reason_code: KNOWLEDGE_PAGE_SLUG_CONFLICT
    grpc_code: ALREADY_EXISTS
    surface: put_knowledge_page_duplicate_slug_within_bank
    exit_shape: grpc_status
    source_rule: K-KNOW-005
  - reason_code: KNOWLEDGE_PAGE_ACCESS_DENIED
    grpc_code: PERMISSION_DENIED
    surface: page_scoped_knowledge_access_denied
    exit_shape: grpc_status
    source_rule: K-KNOW-005
  - reason_code: KNOWLEDGE_HYBRID_SEARCH_UNAVAILABLE
    grpc_code: FAILED_PRECONDITION
    surface: search_hybrid_capability_unavailable
    exit_shape: grpc_status
    source_rule: K-KNOW-005
  - reason_code: KNOWLEDGE_EMBEDDING_PROFILE_UNAVAILABLE
    grpc_code: FAILED_PRECONDITION
    surface: search_hybrid_embedding_profile_unavailable
    exit_shape: grpc_status
    source_rule: K-KNOW-005
  - reason_code: KNOWLEDGE_VECTOR_INDEX_NOT_READY
    grpc_code: FAILED_PRECONDITION
    surface: search_hybrid_vector_index_not_ready
    exit_shape: grpc_status
    source_rule: K-KNOW-005
  - reason_code: KNOWLEDGE_INDEX_REFRESH_IN_PROGRESS
    grpc_code: UNAVAILABLE
    surface: search_hybrid_index_refresh_in_progress
    exit_shape: grpc_status
    source_rule: K-KNOW-005
  - reason_code: KNOWLEDGE_LINK_NOT_FOUND
    grpc_code: NOT_FOUND
    surface: remove_or_list_knowledge_link_missing
    exit_shape: grpc_status
    source_rule: K-KNOW-005
  - reason_code: KNOWLEDGE_LINK_ALREADY_EXISTS
    grpc_code: ALREADY_EXISTS
    surface: add_knowledge_link_duplicate_same_bank_relation
    exit_shape: grpc_status
    source_rule: K-KNOW-005
  - reason_code: KNOWLEDGE_LINK_INVALID
    grpc_code: INVALID_ARGUMENT
    surface: add_knowledge_link_invalid_same_bank_relation
    exit_shape: grpc_status
    source_rule: K-KNOW-005
  - reason_code: KNOWLEDGE_GRAPH_DEPTH_INVALID
    grpc_code: INVALID_ARGUMENT
    surface: traverse_knowledge_graph_invalid_depth
    exit_shape: grpc_status
    source_rule: K-KNOW-005
  - reason_code: KNOWLEDGE_INGEST_TASK_NOT_FOUND
    grpc_code: NOT_FOUND
    surface: get_knowledge_ingest_task_missing
    exit_shape: grpc_status
    source_rule: K-KNOW-005
