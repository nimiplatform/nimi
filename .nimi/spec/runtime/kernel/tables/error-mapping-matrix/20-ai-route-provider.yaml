mappings:
  - reason_code: AI_MODEL_NOT_READY
    grpc_code: FAILED_PRECONDITION
    surface: model_health_check
    exit_shape: grpc_status
    source_rule: K-ERR-006
  - reason_code: AI_ROUTE_UNSUPPORTED
    grpc_code: FAILED_PRECONDITION
    surface: consume_route_resolution
    exit_shape: grpc_status
    source_rule: K-ERR-006
  - reason_code: AI_ROUTE_FALLBACK_DENIED
    grpc_code: FAILED_PRECONDITION
    surface: consume_route_fallback
    exit_shape: grpc_status
    source_rule: K-ERR-006
  - reason_code: AI_CONTENT_FILTER_BLOCKED
    grpc_code: PERMISSION_DENIED
    surface: provider_content_filter
    exit_shape: grpc_status
    source_rule: K-ERR-010
  - reason_code: AI_REQUEST_CREDENTIAL_REQUIRED
    grpc_code: FAILED_PRECONDITION
    surface: consume_credential_resolution
    exit_shape: grpc_status
    source_rule: K-KEYSRC-007
  - reason_code: AI_REQUEST_CREDENTIAL_SCOPE_FORBIDDEN
    grpc_code: PERMISSION_DENIED
    surface: consume_credential_scope_gate
    exit_shape: grpc_status
    source_rule: K-GRANT-005
  - reason_code: SESSION_EXPIRED
    grpc_code: UNAUTHENTICATED
    surface: authn_session_check
    exit_shape: grpc_status
    source_rule: K-AUTHN-006
  - reason_code: AUTH_TOKEN_INVALID
    grpc_code: UNAUTHENTICATED
    surface: authn_all
    exit_shape: grpc_status
    source_rule: K-AUTHN-007
  - reason_code: AUTH_TOKEN_EXPIRED
    grpc_code: UNAUTHENTICATED
    surface: external_principal_proof_expired
    exit_shape: grpc_status
    source_rule: K-AUTHSVC-013
  - reason_code: AUTH_UNSUPPORTED_PROOF_TYPE
    grpc_code: INVALID_ARGUMENT
    surface: external_principal_registration
    exit_shape: grpc_status
    source_rule: K-AUTHSVC-013
  - reason_code: AUTH_REVOCATION_UNAVAILABLE
    grpc_code: UNAVAILABLE
    surface: authn_revocation_introspection
    exit_shape: grpc_status
    source_rule: K-AUTHN-006
  - reason_code: AI_CONNECTOR_NOT_FOUND
    grpc_code: NOT_FOUND
    surface: consume_remote_or_hidden_connector
    exit_shape: grpc_status
    source_rule: K-ERR-004
  - reason_code: AI_CONNECTOR_DISABLED
    grpc_code: FAILED_PRECONDITION
    surface: consume_or_connector_probe
    exit_shape: grpc_status
    source_rule: K-ERR-004
  - reason_code: AI_CONNECTOR_CREDENTIAL_MISSING
    grpc_code: FAILED_PRECONDITION
    surface: consume_or_list_models
    exit_shape: grpc_status
    source_rule: K-ERR-004
    note: consume/list 路径：凭据缺失作为前置条件失败返回
  - reason_code: AI_CONNECTOR_INVALID
    grpc_code: INVALID_ARGUMENT
    surface: connector_manage_input_validation
    exit_shape: grpc_status
    source_rule: K-ERR-006
    note: connector_manage 路径：非法 provider、endpoint、字段组合等输入校验失败统一映射到该 reason_code
  - reason_code: AI_CONNECTOR_INVALID
    grpc_code: INVALID_ARGUMENT
    surface: consume_local_connector_managed_path
    exit_shape: grpc_status
    source_rule: K-KEYSRC-009
    note: 同一 reason_code 的另一消费面：consume 入口在 local connector managed path 校验失败时复用 AI_CONNECTOR_INVALID
  - reason_code: AI_CONNECTOR_IMMUTABLE
    grpc_code: FAILED_PRECONDITION
    surface: connector_manage_immutable_field_update
    exit_shape: grpc_status
    source_rule: K-ERR-006
  - reason_code: AI_CONNECTOR_LIMIT_EXCEEDED
    grpc_code: RESOURCE_EXHAUSTED
    surface: create_connector_limit_guard
    exit_shape: grpc_status
    source_rule: K-ERR-006
  - reason_code: AI_LOCAL_CONNECTOR_RETIRED
    grpc_code: FAILED_PRECONDITION
    surface: connector_local_retired
    exit_shape: grpc_status
    source_rule: K-RTARGET-006
  - reason_code: AI_CONNECTOR_CREDENTIAL_MISSING
    grpc_code: OK
    surface: test_connector
    exit_shape: payload_ok_false
    source_rule: K-ERR-004
    note: test_connector 路径：凭据缺失作为测试结果返回（ok=false），非 gRPC 错误
  - reason_code: AI_REQUEST_CREDENTIAL_CONFLICT
    grpc_code: INVALID_ARGUMENT
    surface: consume_entry
    exit_shape: grpc_status
    source_rule: K-KEYSRC-002
  - reason_code: AI_REQUEST_CREDENTIAL_MISSING
    grpc_code: INVALID_ARGUMENT
    surface: consume_entry
    exit_shape: grpc_status
    source_rule: K-KEYSRC-007
