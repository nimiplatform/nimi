    grpc_code: INVALID_ARGUMENT
    surface: consume_inline_credential_validation
    exit_shape: grpc_status
    source_rule: K-ERR-006
  - reason_code: AI_CONNECTOR_ID_REQUIRED
    grpc_code: INVALID_ARGUMENT
    surface: consume_entry
    exit_shape: grpc_status
    source_rule: K-KEYSRC-007
  - reason_code: AI_APP_ID_REQUIRED
    grpc_code: INVALID_ARGUMENT
    surface: consume_or_connector_manage
    exit_shape: grpc_status
    source_rule: K-KEYSRC-005
  - reason_code: AI_APP_ID_CONFLICT
    grpc_code: INVALID_ARGUMENT
    surface: app_id_metadata_body_conflict
    exit_shape: grpc_status
    source_rule: K-KEYSRC-005
  - reason_code: AI_MODEL_ID_REQUIRED
    grpc_code: INVALID_ARGUMENT
    surface: consume_entry
    exit_shape: grpc_status
    source_rule: K-KEYSRC-004
  - reason_code: AI_MODEL_NOT_FOUND
    grpc_code: NOT_FOUND
    surface: model_resolve
    exit_shape: grpc_status
    source_rule: K-ERR-006
  - reason_code: AI_MODALITY_NOT_SUPPORTED
    grpc_code: FAILED_PRECONDITION
    surface: model_modality_capability_mismatch
    exit_shape: grpc_status
    source_rule: K-ERR-006
  - reason_code: AI_PROVIDER_ENDPOINT_FORBIDDEN
    grpc_code: FAILED_PRECONDITION
    surface: consume_endpoint_validation
    exit_shape: grpc_status
    source_rule: K-SEC-001
  - reason_code: AI_PROVIDER_UNAVAILABLE
    grpc_code: UNAVAILABLE
    surface: list_connector_models_remote
    exit_shape: grpc_status
    source_rule: K-ERR-005
  - reason_code: AI_PROVIDER_INTERNAL
    grpc_code: INTERNAL
    surface: provider_upstream_internal_failure
    exit_shape: grpc_status
    source_rule: K-ERR-006
  - reason_code: AI_PROVIDER_RATE_LIMITED
    grpc_code: RESOURCE_EXHAUSTED
    surface: provider_upstream_rate_limit
    exit_shape: grpc_status
    source_rule: K-ERR-006
  - reason_code: AI_PROVIDER_TIMEOUT
    grpc_code: DEADLINE_EXCEEDED
    surface: stream_first_chunk_timeout
    exit_shape: grpc_status
    source_rule: K-STREAM-007
  - reason_code: AI_INPUT_INVALID
    grpc_code: INVALID_ARGUMENT
    surface: consume_or_media_input_validation
    exit_shape: grpc_status
    source_rule: K-ERR-006
  - reason_code: AI_OUTPUT_INVALID
    grpc_code: INTERNAL
    surface: provider_output_decode
    exit_shape: grpc_status
    source_rule: K-ERR-006
  - reason_code: AI_STREAM_BROKEN
    grpc_code: UNAVAILABLE
    surface: stream_mid_flight_disconnect
