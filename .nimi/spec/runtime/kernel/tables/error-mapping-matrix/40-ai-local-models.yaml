    grpc_code: FAILED_PRECONDITION
    surface: local_consume_or_probe
    exit_shape: grpc_status_or_payload_ok_false
    source_rule: K-LOCAL-003
  - reason_code: AI_LOCAL_MODEL_UNAVAILABLE
    grpc_code: FAILED_PRECONDITION
    surface: local_consume_or_probe
    exit_shape: grpc_status_or_payload_ok_false
    source_rule: K-LOCAL-006
  - reason_code: AI_LOCAL_MODEL_ALREADY_INSTALLED
    grpc_code: ALREADY_EXISTS
    surface: install_local_model_duplicate
    exit_shape: grpc_status
    source_rule: K-LOCAL-009
  - reason_code: AI_LOCAL_ASSET_ALREADY_INSTALLED
    grpc_code: ALREADY_EXISTS
    surface: install_local_model_duplicate
    exit_shape: grpc_status
    source_rule: K-LOCAL-009
  - reason_code: AI_LOCAL_SERVICE_UNAVAILABLE
    grpc_code: FAILED_PRECONDITION
