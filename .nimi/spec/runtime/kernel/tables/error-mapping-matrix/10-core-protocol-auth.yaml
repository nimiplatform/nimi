table_family: owner_matrix
owner: runtime
matrix_id: runtime_error_mapping_matrix
rows:
  - REASON_CODE_UNSPECIFIED
  - ACTION_EXECUTED
  - PROTOCOL_ENVELOPE_INVALID
  - PROTOCOL_DOMAIN_FIELD_CONFLICT
  - CAPABILITY_CATALOG_MISMATCH
  - APP_NOT_REGISTERED
  - EXTERNAL_PRINCIPAL_NOT_REGISTERED
  - PRINCIPAL_UNAUTHORIZED
  - APP_TOKEN_EXPIRED
  - APP_TOKEN_REVOKED
  - EXTERNAL_PRINCIPAL_PROOF_MISSING
  - EXTERNAL_PRINCIPAL_PROOF_INVALID
  - APP_MODE_WORLD_RELATION_FORBIDDEN
  - LOCAL_APP_PRINCIPAL_REQUIRED
  - LOCAL_APP_RECORD_NOT_FOUND
  - LOCAL_APP_RECORD_TOMBSTONED
  - LOCAL_APP_PROVENANCE_UNAVAILABLE
  - LOCAL_APP_LAUNCH_LEASE_REQUIRED
  - LOCAL_APP_LAUNCH_LEASE_MISMATCH
  - LOCAL_APP_LAUNCH_LEASE_REPLAY
  - LOCAL_APP_PROCESS_MISMATCH
  - LOCAL_APP_SESSION_REVOKED
  - LOCAL_APP_GRANT_REQUIRED
  - LOCAL_APP_GRANT_REVOKED
  - LOCAL_APP_GRANT_SUPERSEDED
  - LOCAL_APP_ACCOUNT_CHANGED
  - LOCAL_APP_OPERATION_UNAVAILABLE
  - LOCAL_APP_PRESENCE_REQUIRED
  - LOCAL_APP_PRESENCE_EXPIRED
  - LOCAL_APP_DEVELOPER_MODE_DISABLED
  - LOCAL_APP_REMEMBERED_PROJECT_DORMANT
  - LOCAL_APP_RISK_DISCLOSURE_REQUIRED
mappings:
  - reason_code: REASON_CODE_UNSPECIFIED
    grpc_code: OK
    surface: success_or_default
    exit_shape: grpc_status
    source_rule: K-ERR-001
  - reason_code: ACTION_EXECUTED
    grpc_code: OK
    surface: success_confirmation
    exit_shape: grpc_status
    source_rule: K-ERR-001
  - reason_code: PROTOCOL_ENVELOPE_INVALID
    grpc_code: INVALID_ARGUMENT
    surface: protocol_envelope_validation
    exit_shape: grpc_status
    source_rule: K-ERR-003
  - reason_code: PROTOCOL_DOMAIN_FIELD_CONFLICT
    grpc_code: INVALID_ARGUMENT
    surface: protocol_envelope_validation
    exit_shape: grpc_status
    source_rule: K-ERR-003
  - reason_code: CAPABILITY_CATALOG_MISMATCH
    grpc_code: FAILED_PRECONDITION
    surface: scope_catalog_validation
    exit_shape: grpc_status
    source_rule: K-ERR-006
  - reason_code: APP_NOT_REGISTERED
    grpc_code: UNAUTHENTICATED
    surface: app_session_validation
    exit_shape: grpc_status
    source_rule: K-AUTHSVC-003
  - reason_code: EXTERNAL_PRINCIPAL_NOT_REGISTERED
    grpc_code: UNAUTHENTICATED
    surface: external_principal_session_validation
    exit_shape: grpc_status
    source_rule: K-AUTHSVC-006
  - reason_code: PRINCIPAL_UNAUTHORIZED
    grpc_code: PERMISSION_DENIED
    surface: authz_gate
    exit_shape: grpc_status
    source_rule: K-AUTH-001
  - reason_code: APP_TOKEN_EXPIRED
    grpc_code: UNAUTHENTICATED
    surface: app_session_validation
    exit_shape: grpc_status
    source_rule: K-AUTHSVC-004
  - reason_code: APP_TOKEN_REVOKED
    grpc_code: UNAUTHENTICATED
    surface: app_session_validation
    exit_shape: grpc_status
    source_rule: K-AUTHSVC-005
  - reason_code: EXTERNAL_PRINCIPAL_PROOF_MISSING
    grpc_code: INVALID_ARGUMENT
    surface: external_principal_proof_validation
    exit_shape: grpc_status
    source_rule: K-AUTHSVC-006
  - reason_code: EXTERNAL_PRINCIPAL_PROOF_INVALID
    grpc_code: UNAUTHENTICATED
    surface: external_principal_proof_validation
    exit_shape: grpc_status
    source_rule: K-AUTHSVC-006
  - reason_code: APP_MODE_WORLD_RELATION_FORBIDDEN
    grpc_code: PERMISSION_DENIED
    surface: app_mode_gate
    exit_shape: grpc_status
    source_rule: K-AUTHSVC-010
  - reason_code: PROTECTED_LOCAL_TRANSPORT_UNSUPPORTED
    grpc_code: FAILED_PRECONDITION
    surface: protected_local_handshake
    exit_shape: grpc_status_with_sanitized_detail
    source_rule: K-PLOCAL-003
  - reason_code: PROTECTED_LOCAL_ENDPOINT_OWNERSHIP_FAILED
    grpc_code: UNAVAILABLE
    surface: protected_local_endpoint_startup
    exit_shape: grpc_status_with_sanitized_detail
    source_rule: K-PLOCAL-003
  - reason_code: PROTECTED_LOCAL_SERVER_VERIFICATION_FAILED
    grpc_code: PERMISSION_DENIED
    surface: protected_local_handshake
    exit_shape: grpc_status_with_sanitized_detail
    source_rule: K-PLOCAL-003
  - reason_code: DESKTOP_CONTROL_TRANSPORT_REQUIRED
    grpc_code: PERMISSION_DENIED
    surface: protected_rpc_transport_gate
    exit_shape: grpc_status_with_sanitized_detail
    source_rule: K-PLOCAL-006
  - reason_code: DESKTOP_PROCESS_VERIFICATION_UNAVAILABLE
    grpc_code: FAILED_PRECONDITION
    surface: protected_process_verification
    exit_shape: grpc_status_with_sanitized_detail
    source_rule: K-PLOCAL-004
  - reason_code: DESKTOP_EXECUTABLE_TRUST_FAILED
    grpc_code: PERMISSION_DENIED
    surface: protected_executable_verification
    exit_shape: grpc_status_with_sanitized_detail
    source_rule: K-PLOCAL-005
  - reason_code: DESKTOP_TEST_TRUST_FORBIDDEN
    grpc_code: PERMISSION_DENIED
    surface: protected_executable_verification
    exit_shape: grpc_status_with_sanitized_detail
    source_rule: K-PLOCAL-005
  - reason_code: PROTECTED_ORIGIN_ROLE_MISMATCH
    grpc_code: PERMISSION_DENIED
    surface: protected_rpc_origin_gate
    exit_shape: grpc_status_with_sanitized_detail
    source_rule: K-PLOCAL-002
  - reason_code: LIFECYCLE_CHALLENGE_REQUIRED
    grpc_code: FAILED_PRECONDITION
    surface: protected_lifecycle_intent_gate
    exit_shape: grpc_status_with_sanitized_detail
    source_rule: K-PLOCAL-007
  - reason_code: LIFECYCLE_CHALLENGE_MISMATCH
    grpc_code: PERMISSION_DENIED
    surface: protected_lifecycle_intent_gate
    exit_shape: grpc_status_with_sanitized_detail
    source_rule: K-PLOCAL-007
  - reason_code: LIFECYCLE_CHALLENGE_REPLAY
    grpc_code: PERMISSION_DENIED
    surface: protected_lifecycle_intent_gate
    exit_shape: grpc_status_with_sanitized_detail
    source_rule: K-PLOCAL-007
  - reason_code: PROTECTED_LOCAL_LEDGER_UNAVAILABLE
    grpc_code: UNAVAILABLE
    surface: protected_security_ledger
    exit_shape: grpc_status_with_sanitized_detail
    source_rule: K-PLOCAL-007
  - reason_code: PROTECTED_LOCAL_LEDGER_ROLLBACK_DETECTED
    grpc_code: UNAVAILABLE
    surface: protected_security_ledger
    exit_shape: grpc_status_with_sanitized_detail
    source_rule: K-PLOCAL-007
  - reason_code: PROTECTED_LOCAL_BOOT_EPOCH_MISMATCH
    grpc_code: PERMISSION_DENIED
    surface: protected_rpc_origin_gate
    exit_shape: grpc_status_with_sanitized_detail
    source_rule: K-PLOCAL-007
  - reason_code: PROTECTED_LOCAL_RUNTIME_PRINCIPAL_REQUIRED
    grpc_code: FAILED_PRECONDITION
    surface: protected_runtime_principal_gate
    exit_shape: grpc_status_with_sanitized_detail
    source_rule: K-PLOCAL-001
  - reason_code: PROTECTED_LOCAL_CUSTODY_BOUNDARY_UNAVAILABLE
    grpc_code: UNAVAILABLE
    surface: protected_runtime_principal_gate
    exit_shape: grpc_status_with_sanitized_detail
    source_rule: K-PLOCAL-007
  - reason_code: PROTECTED_LOCAL_PRODUCTION_CONFIG_OVERRIDE_FORBIDDEN
    grpc_code: PERMISSION_DENIED
    surface: protected_runtime_principal_gate
    exit_shape: grpc_status_with_sanitized_detail
    source_rule: K-PLOCAL-003
  - reason_code: RUNTIME_EXECUTABLE_TRUST_RECORD_INVALID
    grpc_code: PERMISSION_DENIED
    surface: protected_executable_verification
    exit_shape: grpc_status_with_sanitized_detail
    source_rule: K-PLOCAL-005
  - { reason_code: LOCAL_APP_PRINCIPAL_REQUIRED, grpc_code: PERMISSION_DENIED, surface: local_app_principal_resolution, exit_shape: grpc_status_with_sanitized_detail, source_rule: K-ERR-012 }
  - { reason_code: LOCAL_APP_RECORD_NOT_FOUND, grpc_code: NOT_FOUND, surface: local_app_record_resolution, exit_shape: grpc_status_with_sanitized_detail, source_rule: K-ERR-012 }
  - { reason_code: LOCAL_APP_RECORD_TOMBSTONED, grpc_code: PERMISSION_DENIED, surface: local_app_record_resolution, exit_shape: grpc_status_with_sanitized_detail, source_rule: K-ERR-012 }
  - { reason_code: LOCAL_APP_PROVENANCE_UNAVAILABLE, grpc_code: FAILED_PRECONDITION, surface: local_app_provenance_resolution, exit_shape: grpc_status_with_sanitized_detail, source_rule: K-ERR-012 }
  - { reason_code: LOCAL_APP_LAUNCH_LEASE_REQUIRED, grpc_code: FAILED_PRECONDITION, surface: local_app_launch, exit_shape: grpc_status_with_sanitized_detail, source_rule: K-ERR-012 }
  - { reason_code: LOCAL_APP_LAUNCH_LEASE_MISMATCH, grpc_code: PERMISSION_DENIED, surface: local_app_launch, exit_shape: grpc_status_with_sanitized_detail, source_rule: K-ERR-012 }
  - { reason_code: LOCAL_APP_LAUNCH_LEASE_REPLAY, grpc_code: PERMISSION_DENIED, surface: local_app_launch, exit_shape: grpc_status_with_sanitized_detail, source_rule: K-ERR-012 }
  - { reason_code: LOCAL_APP_PROCESS_MISMATCH, grpc_code: PERMISSION_DENIED, surface: local_app_process_binding, exit_shape: grpc_status_with_sanitized_detail, source_rule: K-ERR-012 }
  - { reason_code: LOCAL_APP_SESSION_REVOKED, grpc_code: UNAUTHENTICATED, surface: local_app_session, exit_shape: grpc_status_with_sanitized_detail, source_rule: K-ERR-012 }
  - { reason_code: LOCAL_APP_GRANT_REQUIRED, grpc_code: PERMISSION_DENIED, surface: local_app_operation_grant, exit_shape: grpc_status_with_sanitized_detail, source_rule: K-ERR-012 }
  - { reason_code: LOCAL_APP_GRANT_REVOKED, grpc_code: PERMISSION_DENIED, surface: local_app_operation_grant, exit_shape: grpc_status_with_sanitized_detail, source_rule: K-ERR-012 }
  - { reason_code: LOCAL_APP_GRANT_SUPERSEDED, grpc_code: PERMISSION_DENIED, surface: local_app_operation_grant, exit_shape: grpc_status_with_sanitized_detail, source_rule: K-ERR-012 }
  - { reason_code: LOCAL_APP_ACCOUNT_CHANGED, grpc_code: UNAUTHENTICATED, surface: local_app_account_partition, exit_shape: grpc_status_with_sanitized_detail, source_rule: K-ERR-012 }
  - { reason_code: LOCAL_APP_OPERATION_UNAVAILABLE, grpc_code: UNIMPLEMENTED, surface: local_app_operation_owner, exit_shape: grpc_status_with_sanitized_detail, source_rule: K-ERR-012 }
  - { reason_code: LOCAL_APP_PRESENCE_REQUIRED, grpc_code: FAILED_PRECONDITION, surface: local_app_presence, exit_shape: grpc_status_with_sanitized_detail, source_rule: K-ERR-012 }
  - { reason_code: LOCAL_APP_PRESENCE_EXPIRED, grpc_code: PERMISSION_DENIED, surface: local_app_presence, exit_shape: grpc_status_with_sanitized_detail, source_rule: K-ERR-012 }
  - { reason_code: LOCAL_APP_DEVELOPER_MODE_DISABLED, grpc_code: FAILED_PRECONDITION, surface: local_app_developer_mode, exit_shape: grpc_status_with_sanitized_detail, source_rule: K-ERR-012 }
  - { reason_code: LOCAL_APP_REMEMBERED_PROJECT_DORMANT, grpc_code: FAILED_PRECONDITION, surface: local_app_development_record, exit_shape: grpc_status_with_sanitized_detail, source_rule: K-ERR-012 }
  - { reason_code: LOCAL_APP_RISK_DISCLOSURE_REQUIRED, grpc_code: FAILED_PRECONDITION, surface: local_app_development_approval, exit_shape: grpc_status_with_sanitized_detail, source_rule: K-ERR-012 }
  - reason_code: LIFECYCLE_INTENT_REQUIRED
    grpc_code: FAILED_PRECONDITION
    surface: protected_lifecycle_intent_gate
    exit_shape: grpc_status_with_sanitized_detail
    source_rule: K-APP-026
  - reason_code: LIFECYCLE_INTENT_MISMATCH
    grpc_code: PERMISSION_DENIED
