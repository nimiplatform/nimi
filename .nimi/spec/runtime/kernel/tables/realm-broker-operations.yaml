version: 1
table_family: protocol_surface
owner: runtime
protocol_id: runtime_realm_broker_operations
source_rule: K-ACCSVC-023
description: >
  Sole operation-admission authority for RuntimeAccountService.InvokeRealmUnary.
  SDK Realm descriptors and Platform app permission rows are validated inputs;
  neither can independently admit an operation. YAML merge templates are
  authoring-only and every resolved operation row contains the full policy.

operation_schema:
  required_fields:
    - operation_id
    - http_method
    - path_template
    - request_schema_ref
    - response_schema_ref
    - allowed_sdk_app_modes
    - allowed_runtime_caller_modes
    - required_app_capabilities
    - required_runtime_scopes
    - realm_base_policy
    - response_max_bytes
    - credential_response_policy
    - source_rule
  credential_response_policy_values:
    - forbidden

policy_templates:
  first_party_read: &first_party_read
    allowed_sdk_app_modes: [first-party-local-app]
    allowed_runtime_caller_modes:
      - ACCOUNT_CALLER_MODE_DESKTOP_SHELL
      - ACCOUNT_CALLER_MODE_LOCAL_FIRST_PARTY_APP
    required_runtime_scopes: [account.session.read]
    realm_base_policy: runtime-configured-canonical-exact
    response_max_bytes: 1048576
    credential_response_policy: forbidden
    source_rule: K-ACCSVC-023
  first_party_write: &first_party_write
    allowed_sdk_app_modes: [first-party-local-app]
    allowed_runtime_caller_modes:
      - ACCOUNT_CALLER_MODE_DESKTOP_SHELL
      - ACCOUNT_CALLER_MODE_LOCAL_FIRST_PARTY_APP
    required_runtime_scopes: [account.session.read]
    realm_base_policy: runtime-configured-canonical-exact
    response_max_bytes: 524288
    credential_response_policy: forbidden
    source_rule: K-ACCSVC-023
  public_world_read: &public_world_read
    allowed_sdk_app_modes: [first-party-local-app, developer-registered-local-app, third-party-nimi-app]
    allowed_runtime_caller_modes:
      - ACCOUNT_CALLER_MODE_DESKTOP_SHELL
      - ACCOUNT_CALLER_MODE_LOCAL_FIRST_PARTY_APP
      - ACCOUNT_CALLER_MODE_LOCAL_DEVELOPER_APP
      - ACCOUNT_CALLER_MODE_DESKTOP_LAUNCHED_NIMI_APP
    required_app_capabilities:
      any_of:
        - { scope_name: data.scope.read, qualifier: realm.worlds.read-probe }
        - { scope_name: realm.worlds.read }
        - { runtime_scope: realm.worlds.read }
    required_runtime_scopes: [account.session.read]
    realm_base_policy: runtime-configured-canonical-exact
    response_max_bytes: 1048576
    credential_response_policy: forbidden
    source_rule: K-ACCSVC-023
  desktop_private_read: &desktop_private_read
    allowed_sdk_app_modes: [first-party-local-app]
    allowed_runtime_caller_modes: [ACCOUNT_CALLER_MODE_DESKTOP_SHELL]
    required_runtime_scopes: [account.session.read]
    realm_base_policy: runtime-configured-canonical-exact
    response_max_bytes: 1048576
    credential_response_policy: forbidden
    source_rule: K-ACCSVC-023

