version: 2
table_family: protocol_surface
owner: runtime
protocol_id: runtime_local_app_user_presence_protocol
source_rule: K-ACCSVC-026
outcome_enum: [none, user_decision_presence, operation_presence, bounded_lease]
challenge: &runtime_local_app_presence_challenge_surface
  owner: runtime_account_service
  required_bindings:
    - protected_control_session
    - local_os_user_anchor
    - account_id
    - account_generation
    - local_app_principal_id
    - local_app_record_id
    - provenance_revision
    - release_or_project_generation
    - action
    - resource_impact_digest
    - policy_revision
    - nonce
    - issued_at
    - expires_at
  request_supplied_authority: forbidden
  consume: atomic_with_state_change
  replay: denied
  cancellation: denied_without_state_change
  expiry: denied_without_state_change
  invalidated_by:
    - account_switch_or_logout
    - control_disconnect
    - principal_or_record_change
    - provenance_or_generation_change
    - policy_revision_change
assignments: &runtime_local_app_presence_assignment_surfaces
  developer_project_first_authorization: user_decision_presence
  remembered_project_reactivation: user_decision_presence
  development_capability_expansion: user_decision_presence
  base_entitlement_operation: none
  ordinary_admitted_user_permission_operation: none
  domain_high_impact_operation: owner_supplied_operation_presence_or_bounded_lease
  immutable_import_or_capability_expansion: reserved_for_0p
constraints:
  - presence_never_creates_a_permission_decision_by_itself
  - permission_decision_requires_canonical_owner_atomic_consumption
  - account_login_state_alone_is_not_presence
  - trust_class_alone_never_requires_repeated_operation_presence
  - app_owned_authority_never_uses_nimi_presence
surfaces:
  challenge: *runtime_local_app_presence_challenge_surface
  assignments: *runtime_local_app_presence_assignment_surfaces
