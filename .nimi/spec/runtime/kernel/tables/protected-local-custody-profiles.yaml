version: 11
table_family: protocol_surface
owner: runtime
protocol_id: runtime_protected_local_custody_profiles
surfaces: [account_tokens, connector_provider_secrets, durable_anchor_keys, authenticated_realm_credentials]
entries: [windows, linux, macos]
description: >-
  Platform-neutral Runtime custody semantics plus closed OS profiles for the
  protected store, key binding, durable anchor, and fail-closed disposition.
authority_refs: [K-ACCSVC-007, K-PLOCAL-001, K-PLOCAL-007, K-CFG-005, K-CFG-006]
neutral_contract:
  authority_owner: runtime_account_service
  execution_boundary: isolated_os_service_principal
  material_visibility: runtime_private_service_call_chain_only
  durable_material_projection: forbidden
  atomic_refresh_rotation: commit_new_material_before_discarding_old_material
  replay_disposition: revoke_local_chain_and_require_reauthentication_or_mark_unavailable
  audit_secret_values: forbidden
  unavailable_disposition: authenticated_operations_fail_closed
  fallback_custody: forbidden
protected_credential_domains: [account_tokens, connector_provider_secrets, durable_anchor_keys, authenticated_realm_credentials]
production_user_session_generic_keyring_allowed: false
interactive_app_state_enumeration: forbidden
retired_user_keyring_import: forbidden_hardcut_requires_fresh_login_and_connector_credential_reentry
automatic_backup_restore: forbidden
durable_anchor_scope: [installer_owned_active_release_generation, credential_custody_generation, explicitly_admitted_revocation_floor]
forbidden_production_custody:
  - interactive_user_generic_keyring
  - credential_manager_or_user_vault
  - login_keychain
  - secret_service_or_libsecret_session_store
  - desktop_secure_store
  - app_owned_vault
  - in_memory_durable_account_truth
platform_admission:
  closeout_unit: os_platform
  windows: admitted_fixed_service_custody
  linux: requirements_only_fail_closed_pending_native_admission
  macos: requirements_only_fail_closed_pending_native_admission
  macos_local_development: local_development_non_product_admitted
  unadmitted_platform_disposition: fail_closed
  cross_platform_parity_required_before_first_platform_positive_chain: false
profile_schema:
  fields:
    - os
    - admission
    - service_principal_profile_ref
    - primary_custody
    - protector_or_key_source
    - cryptographic_scope
    - forbidden_protectors
    - protected_state_binding
    - transaction_store_and_durable_anchor
    - unavailable_disposition
    - source_rule
profiles:
  - os: windows
    admission: admitted_fixed_service_custody
    service_principal_profile_ref: protected-local-runtime-principal-profiles.yaml#same-os
    primary_custody: >-
      fixed non-interactive LocalSystem token user (`S-1-5-18`); restricted
      `NT SERVICE\NimiRuntime` service SID; DPAPI-NG `LOCAL=user` protector;
      service-SID-only state ACL; process DACL grants the service SID full
      authority, denies interactive sensitive rights, and permits only
      read-only Runtime peer verification
    protector_or_key_source: dpapi_ng_local_user_fixed_local_system_host
    cryptographic_scope: local_system_token_user_sid_S-1-5-18
    forbidden_protectors:
      - dpapi_ng_sid_descriptor_requires_active_directory_principal_and_fails_on_workgroup_machines
      - dpapi_ng_local_machine_descriptor_widens_decryption_to_machine
    protected_state_binding: exact_restricted_service_sid_only
    transaction_store_and_durable_anchor: service_sid_acl_transaction_db_plus_dpapi_ng_anchor_only_for_admitted_nonrollbackable_generation
    unavailable_disposition: >-
      host token, protector, ACL, active-logon query authority, or service
      principal mismatch marks custody unavailable and authenticated calls fail closed
    source_rule: K-ACCSVC-007
  - os: linux
    admission: requirements_only_fail_closed_pending_native_admission
    service_principal_profile_ref: protected-local-runtime-principal-profiles.yaml#same-os
    primary_custody: >-
      dedicated non-login Runtime system UID; 0600 encrypted store; root-loaded
      system credential key
    protector_or_key_source: dedicated_uid_0600_encrypted_store_with_root_loaded_system_credential_key
    cryptographic_scope: dedicated_runtime_system_uid_and_root_loaded_system_credential_key
    forbidden_protectors: [interactive_user_session_keyring, app_or_desktop_owned_key]
    protected_state_binding: dedicated_runtime_system_uid_only
    transaction_store_and_durable_anchor: dedicated_uid_transaction_db_plus_root_loaded_anchor_only_for_admitted_nonrollbackable_generation
    unavailable_disposition: >-
      dedicated UID, key, or protected state unavailable marks custody unavailable
    source_rule: K-ACCSVC-007
  - os: macos
    admission: requirements_only_fail_closed_pending_native_admission
    service_principal_profile_ref: protected-local-runtime-principal-profiles.yaml#same-os
    primary_custody: >-
      dedicated _nimiruntime launchd system-daemon principal; non-synchronizing
      System Keychain items whose ACL contains only the exact Runtime trusted
      application/code requirement
    protector_or_key_source: system_keychain_generic_password_items_with_runtime_only_SecAccess_ACL_and_no_Desktop_access_group
    cryptographic_scope: exact_runtime_designated_requirement_team_id_and_dedicated__nimiruntime_principal
    forbidden_protectors: [login_keychain, synchronizable_keychain, shared_Desktop_access_group, app_or_desktop_owned_keychain_item, renderer_or_app_storage]
    protected_state_binding: dedicated__nimiruntime_uid_plus_exact_runtime_designated_requirement_and_release_lineage
    transaction_store_and_durable_anchor: >-
      signed_installer_invokes_exact_installed_Runtime_binary_as_real_root_in_no_input_provision_mode_before_service_registration;
      provisioner_and_daemon_share_exclusive__nimiruntime_owned_0600_regular_runtime.lock;
      all_absent_is_the_only_fresh_state_and_all_present_plus_valid_is_the_only_existing_state;
      partial_busy_replaced_or_unknown_state_fails_closed_without_implicit_reset;
      dedicated__nimiruntime_transaction_db_plus_Runtime_only_System_Keychain_anchor_and_32_byte_record_MAC_key_include_append_only_per_executable_role_release_generation_high_water;
      boot_epoch_is_ledger_committed_per_process_start_and_never_durable_session_authority
    unavailable_disposition: >-
      missing/locked/restored ACL-mismatched Keychain item, code identity,
      dedicated principal, or release-lineage mismatch marks custody unavailable
      before any protected listener opens
    source_rule: K-ACCSVC-007
