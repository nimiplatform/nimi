version: 1
table_family: product_record_schema
owner: runtime
record_id: runtime_agent_ai_config
path: .nimi/spec/runtime/kernel/tables/runtime-agent-ai-config.yaml
source_rule: K-AGCORE-144
schema_version: 1
required_top_level_fields:
  - agent_instance_id
  - revision
  - intents
  - updated_at
  - updated_by_app_id
allowed_top_level_fields:
  - agent_instance_id
  - revision
  - intents
  - updated_at
  - updated_by_app_id
forbidden_top_level_fields:
  - RuntimeRouteBinding
  - selectedBindings
  - resolved_binding_evidence
  - readiness_state
  - provider_health
  - credential_payload
  - api_key
  - subject_user_id
  - resolved_embedding_dimension
  - memory_bank_status
  - memory_rebuild_state
  - memory_cutover_state
  - voice_stream_state
  - voice_artifact_materialization_state
  - avatar_lipsync_state
  - avatar_render_state
  - runtime_activity_state
intent_schema:
  required_fields:
    - capability
    - binding
    - route_policy
  optional_fields:
    - connector_id
    - target_ref
    - voice_reference_ref
    - image_policy_ref
  target_ref_contract: K-RTARGET v2 durable target ref only
  binding_union:
    variants:
      - alias
      - pinned_target_ref
    alias_values:
      - local/default
      - local/default-embedding
      - cloud/default
      - local/text.generate.default
      - local/image.generate.default
      - local/audio.synthesize.default
      - local/audio.transcribe.default
      - local/voice_workflow.voice_clone.default
      - local/voice_workflow.voice_design.default
    pinned_target_ref_contract: K-RTARGET v2 durable target ref only
    ui_projection:
      fixed_checkbox: alias_false_pinned_true
      persisted_field: none
      non_pinnable_in_agent_center_product_ui:
        - local_route
        - text.embed
    implementation_status: spec_recorded_for_follow_up_package
admitted_capabilities:
  text.generate:
    required: true
    seeded_default: local/default
    source_rule: K-AGCORE-150
    consume_paths:
      - chat_turn
      - life_track
      - canonical_review
      - chat_sidecar
      - companion_participation
      - future_agent_work
  text.embed:
    required: true
    seeded_default: local/default-embedding
    source_rule: K-MEM-004a
    keying: one_committed_intent_per_runtime_local_agent_instance
    consume_paths:
      - runtime_memory
      - runtime_cognition
      - activity_query
      - knowledge_retrieval
      - future_agent_work
  image.generate:
    required: false
    seeded_default: null
    source_rule: K-AGCORE-148
  audio.synthesize:
    required: false
    seeded_default: null
    source_rule: K-VOICE-018
  audio.transcribe:
    required: false
    seeded_default: null
    source_rule: K-VOICE-018
    consume_paths:
      - zhiyu_voice_capture
      - future_agent_work
  voice_workflow.voice_clone:
    required: false
    seeded_default: null
    source_rule: K-VOICE-018
  voice_workflow.voice_design:
    required: false
    seeded_default: null
    source_rule: K-VOICE-018
reserved_capability_namespaces:
  agent.work.*:
    admission: future_runtime_agent_service_redesign_required
readiness_states:
  - ready
  - not_configured
  - unavailable
readiness_reason_codes:
  - route_unhealthy
  - connector_missing
  - model_missing
  - target_missing
  - probe_failed
  - embedding_profile_unavailable
  - voice_reference_missing
  - voice_workflow_unavailable
  - image_route_unavailable
action_failed_reason_codes:
  - image_binding_missing
  - image_route_unhealthy
  - image_execution_failed
  - voice_binding_missing
  - voice_route_unhealthy
  - voice_execution_failed
  - embedding_binding_missing
  - embedding_route_unhealthy
  - embedding_execution_failed
scopes:
  read: runtime.agent.ai_config.read
  write: runtime.agent.ai_config.write
event_families:
  - runtime.agent.ai_config.changed
  - runtime.agent.ai_config.readiness_changed
invariants:
  - exactly_one_committed_config_per_runtime_local_agent_instance
  - revision_monotonic_increment_by_one_per_mutation
  - mutation_requires_expected_revision_match
  - text_generate_binding_required_after_seed
  - text_embed_binding_required_after_seed
  - readiness_is_projection_not_execution_gate
  - readiness_recomputes_on_default_alias_target_change
  - alias_bound_turn_snapshot_records_alias_resolved_target_and_config_revision
  - pinned_binding_unaffected_by_default_alias_target_change
  - request_carried_turn_bindings_not_admitted
  - no_app_local_shadow_copy_of_ai_consume_truth
  - no_cognition_owned_embedding_binding_truth
  - no_desktop_or_zhiyu_owned_voice_generation_truth
  - no_derived_runtime_state_inside_config
