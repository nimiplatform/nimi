version: 1
table_family: protocol_surface
owner: runtime
protocol_id: runtime_protected_local_os_profiles
surfaces: [windows, linux, macos]
entries: [windows, linux, macos]
description: Closed OS primitive profiles for mutually authenticated protected-local process origins.
authority_refs: [K-PLOCAL-003, K-PLOCAL-004, K-PLOCAL-005]
platform_admission:
  closeout_unit: os_platform
  independent_admission_allowed: true
  unadmitted_platform_disposition: fail_closed
  forbidden_fallbacks: [localhost_grpc, same_user_daemon, compile_only_carrier_success]
windows_restricted_service_bootstrap:
  active_identity_source: WTSGetActiveConsoleSessionId_and_WTSSessionInfo
  user_token_preopen: forbidden
  endpoint_acl_subject: active_account_sid_connect_only
  account_partition: user_sid_terminal_session_id_wts_logon_time
  active_session_revalidation: connection_liveness_revoked_on_wts_account_session_or_logon_time_change
  post_connect_identity: GetNamedPipeClientProcessId_then_process_token_logon_sid_AuthenticationId_LsaGetLogonSessionData_before_NetConn
  post_connect_executable: same_open_hfile_native_trust
  mismatch_disposition: reject_close_and_reopen
  exact_logon_correlation:
    fields: [account_sid, terminal_session_id, wts_logon_time, token_logon_sid, token_authentication_id, lsa_logon_time, interactive_logon_type, active_console]
    allowed_logon_types: [interactive, remote_interactive, cached_interactive, cached_remote_interactive]
    lsa_lookup_key: token_statistics_authentication_id_exact
    time_rule: lsa_logon_time_positive_and_not_after_wts_session_logon_time
    enumeration_or_first_candidate_selection: forbidden
profile_schema:
  fields:
    - os
    - endpoint_kind
    - endpoint_ownership
    - client_peer_verification
    - server_peer_verification
    - process_marker
    - liveness_monitor
    - post_bind_exec_control
    - client_executable_verification
    - server_executable_verification
    - runtime_principal_profile_ref
    - source_rule
profiles:
  - os: windows
    endpoint_kind: named_pipe
    endpoint_ownership: first_pipe_instance_service_owned_dacl_connect_only_active_account_sid_remote_clients_rejected
    client_peer_verification: GetNamedPipeClientProcessId_token_logon_sid_AuthenticationId_exact_LSA_record_active_WTS_session_and_same_file_executable_trust_before_NetConn
    server_peer_verification: GetNamedPipeServerProcessId_SCM_service_binding_exact_service_token_read_only_process_DACL_and_same_file_runtime_trust_before_protocol_bytes
    process_marker: process_creation_time
    liveness_monitor: retained_process_handle_synchronize_and_query_limited_information
    post_bind_exec_control: windows_has_no_in_place_exec_and_all_inherited_handles_are_explicitly_noninheritable
    client_executable_verification: same_open_hfile_volume_serial_file_id_win_verify_trust_installer_signer_policy
    server_executable_verification: same_open_hfile_volume_serial_file_id_win_verify_trust_installer_signer_policy_and_service_sid
    runtime_principal_profile_ref: windows
    source_rule: K-PLOCAL-003
  - os: linux
    endpoint_kind: filesystem_unix_domain_socket
    endpoint_ownership: runtime_service_owned_directory_socket_acl_no_abstract_namespace_or_symlink
    client_peer_verification: SO_PEERCRED_uid_pid_and_login_session
    server_peer_verification: SO_PEERCRED_dedicated_runtime_uid_pidfd_and_same_file_runtime_trust
    process_marker: proc_starttime_bound_to_pidfd
    liveness_monitor: pidfd_required_no_pid_polling_fallback
    post_bind_exec_control: signed_static_control_carrier_seccomp_denies_execve_execveat_and_channel_is_cloexec
    client_executable_verification: opened_proc_pid_exe_fd_device_inode_platform_package_signing_identity
    server_executable_verification: opened_proc_pid_exe_fd_device_inode_platform_package_signing_identity
    runtime_principal_profile_ref: linux
    source_rule: K-PLOCAL-003
  - os: macos
    endpoint_kind: privileged_xpc_service
    endpoint_ownership: launchdaemon_privileged_xpc_mach_service
    client_peer_verification: xpc_audit_token_euid_audit_session_and_client_dynamic_code_identity
    server_peer_verification: xpc_audit_token_launchdaemon_principal_and_runtime_dynamic_code_identity
    process_marker: audit_token_pidversion
    liveness_monitor: EVFILT_PROC_NOTE_EXIT_NOTE_EXEC
    post_bind_exec_control: EVFILT_PROC_NOTE_EXEC_immediate_revocation
    client_executable_verification: running_process_dynamic_SecCode_designated_requirement_team_id_cdhash
    server_executable_verification: running_runtime_dynamic_SecCode_designated_requirement_team_id_cdhash
    runtime_principal_profile_ref: macos
    source_rule: K-PLOCAL-003
handshake_binding:
  fields:
    - protocol_version
    - transport_class
    - client_process_tuple
    - server_process_tuple
    - runtime_boot_epoch
    - endpoint_instance_id
    - transcript_nonce
  credential_before_mutual_verification: forbidden
  source_rule: K-PLOCAL-003
