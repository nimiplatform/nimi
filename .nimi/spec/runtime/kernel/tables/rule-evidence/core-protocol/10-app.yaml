  - rule_id: K-APP-029
    evidence_refs: [runtime_kernel_consistency, protected_local_authority_gate]
    evidence_requirement: required
    note: Random non-reused principal and opaque lineage replace app-id security identity; tombstones never reactivate or inherit.
    test_files: [scripts/check-protected-local-authority.mjs]
  - rule_id: K-APP-030
    evidence_refs: [runtime_kernel_consistency, protected_local_authority_gate]
    evidence_requirement: required
    note: LocalAppRecord freezes provenance revision, execution-profile/digest slots, promotion invalidation and no embedded grant; immutable positive mapping remains unavailable.
    test_files: [scripts/check-protected-local-authority.mjs]
  - rule_id: K-APP-031
    evidence_refs: [runtime_kernel_consistency, protected_local_authority_gate]
    evidence_requirement: required
    note: Principal/record, grant and launch/session stores remain separate and the resolver creates no parallel cache or app-id fallback.
    test_files: [scripts/check-protected-local-authority.mjs]
  - rule_id: K-APP-032
    evidence_refs: [runtime_kernel_consistency, runtime_go_test, protected_local_authority_gate]
    evidence_requirement: required
    note: Protected local-app JSON storage resolves only the current principal partition and requires an exact operation/resource grant, canonical relative path, document/quota enforcement, redacted responses, and no public or filesystem fallback.
    test_files: [scripts/check-protected-local-authority.mjs]
