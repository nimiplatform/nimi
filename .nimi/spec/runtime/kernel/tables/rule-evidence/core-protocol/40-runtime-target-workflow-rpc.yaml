      - runtime_go_test
      - sdk_runtime_test
      - desktop_boundary_test
      - runtime_proto_linkage
    note: Workflow, voice, and AI RPC target inputs must not mint durable identity from raw model or connector fields.
    evidence_requirement: required
  - rule_id: K-RTARGET-009
    evidence_refs:
      - runtime_kernel_consistency
      - runtime_go_test
    note: Component compatibility is a shared fail-closed gate before warm, health, generate, start, lease, and resident load.
    evidence_requirement: required
  - rule_id: K-RTARGET-010
    evidence_refs:
      - runtime_kernel_consistency
      - runtime_proto_linkage
    note: New Runtime reason codes must be admitted in reason-code tables, proto, generated clients, and error mappings before use.
    evidence_requirement: required
  - rule_id: K-RTARGET-011
    evidence_refs:
