      - sdk_runtime_test
      - desktop_boundary_test
      - runtime_proto_linkage
    note: Runtime Target Identity v2 scope must be enforced across Runtime, SDK, and Desktop AIConfig/route consumers.
    evidence_requirement: required
  - rule_id: K-RTARGET-002
    evidence_refs:
      - runtime_kernel_consistency
      - runtime_go_test
      - sdk_runtime_test
      - desktop_boundary_test
    note: Durable target ref grammar is validated at Runtime resolver and SDK/Desktop AIConfig boundaries.
    evidence_requirement: required
  - rule_id: K-RTARGET-003
    evidence_refs:
      - runtime_kernel_consistency
      - runtime_go_test
      - runtime_proto_linkage
    note: Remote model catalog identity and stale resolution are Runtime-owned connector/model resolver facts.
    evidence_requirement: required
  - rule_id: K-RTARGET-004
    evidence_refs:
      - runtime_kernel_consistency
      - runtime_go_test
      - sdk_runtime_test
      - desktop_boundary_test
      - runtime_proto_linkage
    note: Durable refs, inventory projection, and resolved execution binding must stay typed and separate.
    evidence_requirement: required
  - rule_id: K-RTARGET-005
    evidence_refs:
      - runtime_kernel_consistency
      - runtime_go_test
    note: User file import identity must mint separate installed local asset instances.
    evidence_requirement: required
  - rule_id: K-RTARGET-006
    evidence_refs:
      - runtime_kernel_consistency
      - runtime_go_test
      - runtime_proto_linkage
    note: Local connector retirement requires proto, store, RPC, and projection hard-cut coverage.
    evidence_requirement: required
  - rule_id: K-RTARGET-007
    evidence_refs:
      - runtime_kernel_consistency
      - runtime_go_test
      - sdk_runtime_test
      - runtime_proto_linkage
    note: Memory embedding target refs must use the same v2 durable identity grammar.
    evidence_requirement: required
  - rule_id: K-RTARGET-008
    evidence_refs:
