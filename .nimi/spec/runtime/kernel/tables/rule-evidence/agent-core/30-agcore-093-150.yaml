  - rule_id: K-AGCORE-139
    evidence_refs:
      - runtime_kernel_consistency
    test_files:
      - scripts/check-local-agent-full-chain-hardcut.mjs
    note: MaterializeRealmSource accepts only CharacterSourceRefV3 plus request intent; Runtime exclusively owns authenticated first-party Packet/JWKS acquisition, private challenge/closure-set transaction, Packet v3 verification, atomic SnapshotV2/LocalAgent commit, replay, cleanup, and no-rebase/write-back boundaries. No app grant participates.
    evidence_requirement: required
  - rule_id: K-AGCORE-140
    evidence_refs:
      - runtime_kernel_consistency
    test_files:
      - scripts/check-local-agent-full-chain-hardcut.mjs
    note: LocalAgent identity, behavior, greeting, and knowledge derive from strict proof-covered typed source fields; packet systemPromptBase, equivalent raw prompt, runtime-hardcoded guide truth, and privileged guide mechanics are forbidden.
    evidence_requirement: required
  - rule_id: K-AGCORE-141
    evidence_refs:
      - runtime_kernel_consistency
    test_files:
      - scripts/check-local-agent-full-chain-hardcut.mjs
    note: TerminateAgent atomically hard-deletes LocalAgent, snapshot, provenance membership, conversation/transcript, state, hooks, events, and scoped memory; restart, replay, or a later materialization cannot resurrect the deleted identity.
    evidence_requirement: required
  - rule_id: K-AGCORE-142
    evidence_refs:
      - runtime_kernel_consistency
    test_files:
      - scripts/check-local-agent-full-chain-hardcut.mjs
    note: Runtime's typed source compiler exclusively attaches source lanes each turn; source knowledge, including guide documentation, is proof-covered typed data with stable refs/hashes and cannot be consumer-attached context, prompt/policy/tool authority, a Runtime catalog, or memory truth.
    evidence_requirement: required
  - rule_id: K-AGCORE-143
    evidence_refs:
      - runtime_kernel_consistency
      - runtime_go_test
      - sdk_runtime_test
      - desktop_boundary_test
    note: Proactive interruptibility is a bounded Runtime-owned projection for Zhiyu PP6; runtime, SDK, and consuming app evidence must prove default-off mode, quiet_hours, frequency_cap, permission suppression, delivery/suppression events, audit refs, and explicit notification.not_admitted behavior without app-local scheduler truth.
    evidence_requirement: required
  - rule_id: K-AGCORE-144
    evidence_refs:
      - runtime_kernel_consistency
      - runtime_go_test
      - sdk_runtime_test
    note: One committed Runtime Agent AI Config per Runtime Local Agent instance; apps read/write only through the admitted RuntimeAgentService RPC surface with runtime.agent.ai_config scopes; no app-local, cognition-local, or per-turn AI consume binding authoring once K-AGCORE-147 applies.
    evidence_requirement: required
  - rule_id: K-AGCORE-145
    evidence_refs:
      - runtime_kernel_consistency
      - runtime_go_test
    note: Runtime Agent AI Config carries an agent_instance_id and monotonic revision with expected_revision optimistic concurrency, persists in the runtime store across daemon restart, emits observable change events for every mutation, and writes mutation evidence to the audit trail.
    evidence_requirement: required
  - rule_id: K-AGCORE-146
    evidence_refs:
      - runtime_kernel_consistency
      - runtime_go_test
      - sdk_runtime_test
    note: Per-capability readiness projection is exactly ready, not_configured, or unavailable with typed reason codes, recomputes at daemon start plus config mutation plus health change, carries config_revision and probe timestamps, and never substitutes for prepare/readiness or execution-time fail-closed enforcement.
    evidence_requirement: required
  - rule_id: K-AGCORE-147
    evidence_refs:
      - runtime_kernel_consistency
      - runtime_go_test
      - sdk_runtime_test
    note: Turn admission resolves AI consume bindings from Runtime Agent AI Config only; request-carried execution_bindings/runtimeFields/app AIConfig/provider-model payloads are rejected typed; the execution snapshot stamps config_revision and resolved bindings; anchor-sticky binding truth is retired; Life Track, canonical review, sidecar, and companion executors consume the same config text.generate binding.
    evidence_requirement: required
  - rule_id: K-AGCORE-148
    evidence_refs:
      - runtime_kernel_consistency
      - runtime_go_test
    note: Model-facing action availability derives from Runtime Agent AI Config presence plus readiness as a tri-state; the APML output contract states the matching truth for not_configured versus unavailable; planned actions on non-available capabilities fail as typed action_failed reasons from the runtime-agent-ai-config table.
    evidence_requirement: required
  - rule_id: K-AGCORE-149
    evidence_refs:
      - runtime_kernel_consistency
      - runtime_go_test
      - sdk_runtime_test
    note: Config and readiness changes reach apps through a dedicated domain-scoped subscription seam with initial snapshot plus revisioned change events; agent-scoped AgentEvent envelopes are not widened and no secret or runtime-private descriptor evidence leaks.
    evidence_requirement: required
  - rule_id: K-AGCORE-150
    evidence_refs:
      - runtime_kernel_consistency
      - runtime_go_test
    note: First service start with no committed record seeds text.generate to the runtime-owned local default alias as a normal committed mutation with revision one, audit record, and change event; the seed never overwrites an existing config and a missing row after seeding fails closed with no turn-time silent fallback.
    evidence_requirement: required
