rules:
  - rule_id: K-AGCORE-151
    evidence_requirement: required
    evidence_refs:
      - runtime_kernel_consistency
    test_files:
      - scripts/check-local-agent-full-chain-hardcut.mjs
    note: Runtime-private acquisition and closure-set transaction publishes and verifies all eight limits, current RS256/JWKS and the complete hash graph; public callers supply no packet bytes, while idempotency, conflict, atomic rollback, terminal cleanup, and restart recovery retain one terminal result.
  - rule_id: K-AGCORE-152
    evidence_requirement: required
    evidence_refs:
      - runtime_kernel_consistency
    test_files:
      - scripts/check-local-agent-full-chain-hardcut.mjs
    note: LocalAgentSourceSnapshotV2 is the only active strict immutable 1:1 agent record, with CharacterSourceRefV3, complete typed source/world/dependency closure, coverage, safe provenance and domain-separated semantic hash; no raw transport, proof, credential, or private context material is retained.
  - rule_id: K-AGCORE-153
    evidence_requirement: required
    evidence_refs:
      - runtime_kernel_consistency
    test_files:
      - scripts/check-local-agent-full-chain-hardcut.mjs
    note: One provenance key may index multiple immutable agent/snapshot records, while restart validates exact stored state, Realm offline does not block captured chat, revisions never rebase old state, and rematerialization creates new agent/conversation/memory scope.
  - rule_id: K-AGCORE-154
    evidence_requirement: required
    evidence_refs:
      - runtime_kernel_consistency
    test_files:
      - scripts/check-local-agent-full-chain-hardcut.mjs
    note: AgentTurnContextManifestV1 records typed ids, refs, hashes, route/catalog budget, ordered safe lane summaries, capability/transcript counts and acyclic domain-separated content, provider-prompt, and manifest-instance hashes without raw prompt text.
  - rule_id: K-AGCORE-155
    evidence_requirement: required
    evidence_refs:
      - runtime_kernel_consistency
    test_files:
      - scripts/check-local-agent-full-chain-hardcut.mjs
    note: Runtime's typed compiler owns the exact eleven-lane order and trust boundaries; source text cannot mutate roles, policy, tool/APML authority, and caller context/system/developer/execution/manifest injection fails before provider invocation.
  - rule_id: K-AGCORE-156
    evidence_requirement: required
    evidence_refs:
      - runtime_kernel_consistency
    test_files:
      - scripts/check-local-agent-full-chain-hardcut.mjs
    note: Runtime committed transcript is the only history, canonical memory is a distinct scoped lane, restart and account/agent/anchor isolation are deterministic, catalog capacity is authoritative, whole-item truncation order is fixed, and mandatory overflow produces context_capacity_exceeded with zero provider calls.
  - rule_id: K-AGCORE-157
    evidence_requirement: required
    evidence_refs:
      - runtime_kernel_consistency
    test_files:
      - scripts/check-local-agent-full-chain-hardcut.mjs
    note: Runtime alone creates provider roles and tool/media admission; Runtime-private APML is mandatory, malformed or unknown output fails before commit with no repair/wrapper stripping/JSON fallback/app re-acceptance, and turn context hashes remain fixed.
  - rule_id: K-AGCORE-158
    evidence_requirement: required
    evidence_refs:
      - runtime_kernel_consistency
    test_files:
      - scripts/check-local-agent-full-chain-hardcut.mjs
    note: Public output is limited to bounded typed LocalAgentSourceContextStatus and AgentTurnContextSummary fields; raw source/world/prompt/lane/transcript/private-memory/proof/provider/credential/tool payloads and free-form maps are forbidden.
  - rule_id: K-AGCORE-159
    evidence_requirement: required
    evidence_refs:
      - runtime_kernel_consistency
    test_files:
      - scripts/check-local-agent-full-chain-hardcut.mjs
    note: Runtime alone executes live conversation-report turns through one AI Config/catalog route per baseline run; every turn records complete provider/model/revision-or-fingerprint identity, while app/test direct provider calls, constants, bindings, and silent within-run route drift are forbidden.
  - rule_id: K-AGCORE-160
    evidence_requirement: required
    evidence_refs:
      - runtime_kernel_consistency
    test_files:
      - scripts/check-local-agent-full-chain-hardcut.mjs
    note: Conversation-report capture retains bounded Runtime context/state plus committed transcript correlation, never raw system/private inputs; it performs no provider retry or product-state mutation, and no captured observation or optional annotation becomes semantic/personality truth.
