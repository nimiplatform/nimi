version: 1

# Canonical host capability profile authority.
# The profile is Runtime-owned evidence for plan resolution. It is not an
# installation trigger and does not make cloud-only usage pay local setup cost.

profile_schema:
  owner: runtime_host_capability_resolver
  staleness_policy: bounded_staleness_with_explicit_refresh_state
  install_trigger: forbidden
  fields:
    - profile_id
    - platform_tuple
    - accelerator_devices
    - accelerator_planes
    - driver_evidence
    - vram_evidence
    - system_dependency_evidence
    - refresh_state
    - last_verified_at
  refresh_states:
    - unknown
    - probing
    - ready
    - degraded
    - unsupported

profiles:
  - profile_id: windows-amd64-nvidia-cuda
    platform_tuple:
      os: windows
      arch: amd64
    accelerator_vendor: nvidia
    accelerator_planes:
      - cuda
    evidence_sources:
      - nvidia_driver_api
      - windows_registry_allowlisted_cuda_roots
      - allowlisted_program_files_roots
      - path_hint_after_canonical_verification
    system_dependency_evidence:
      - accelerator.cuda.runtime
    forbidden_evidence:
      - unverified_path_precedence_only
      - model_directory
      - import_directory
      - arbitrary_user_selected_directory

  - profile_id: windows-amd64-cpu
    platform_tuple:
      os: windows
      arch: amd64
    accelerator_vendor: none
    accelerator_planes:
      - cpu
    evidence_sources:
      - platform_probe
    system_dependency_evidence: []
    forbidden_evidence: []

  - profile_id: darwin-arm64-metal
    platform_tuple:
      os: darwin
      arch: arm64
    accelerator_vendor: apple
    accelerator_planes:
      - metal
      - cpu
    evidence_sources:
      - platform_probe
      - metal_device_probe
    system_dependency_evidence: []
    forbidden_evidence: []

profile_rules:
  - profile refresh may update evidence but must not start dependency download or install
  - a degraded or unsupported profile must project plan constraints explicitly
  - Runtime must preserve cloud-only readiness even when profile probing fails
  - Desktop, SDK, mods, and engines may consume profile projection only
