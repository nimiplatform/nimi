version: 1
table_family: product_catalog
owner: runtime
catalog_id: runtime_host_accelerator_profiles
entries:
  - profiles_1
  - profiles_2

# Canonical host accelerator profile authority.
# Runtime owns probe, refresh, evidence, and state. Desktop, SDK, model
# import, engine package selection, and provider health may consume this table
# only through runtime-owned projection; they must not create a second GPU/CUDA
# truth source.

profiles:
  - profile_id: windows-amd64-nvidia-cuda
    host_os: windows
    host_arch: amd64
    accelerator_vendor: nvidia
    accelerator_planes:
      - cuda
      - cpu
    probe_owner: runtime_host_accelerator_profile_resolver
    evidence_sources:
      - nvidia_driver_api
      - nvidia_smi
      - windows_gpu_inventory
      - runtime_managed_dependency_metadata
    required_evidence:
      gpu_driver_visible: true
      device_visible: true
      driver_version_present: true
    driver_version_field: normalized_nvidia_driver_version
    device_fields:
      - device_id
      - name
      - compute_capability
      - dedicated_vram_bytes
      - driver_binding
    multi_gpu_policy:
      selection: runtime_selects_best_suitable_device
      unsuitable_device_handling: degrade_with_reason
      aggregation: no_implicit_vram_aggregation
    staleness_ttl_seconds: 300
    refresh_triggers:
      - runtime_startup
      - explicit_user_refresh
      - device_inventory_change
      - dependency_repair_completed
      - selected_source_record_invalidated
    states:
      - unknown
      - probing
      - ready
      - degraded
      - unsupported
    degraded_reasons:
      - driver_missing
      - driver_version_unparseable
      - partial_device_visibility
      - stale_evidence
      - unsupported_compute_capability
      - insufficient_vram
    audit_fields:
      - evidence_timestamp
      - evidence_source
      - selected_device_id
      - rejected_device_ids
      - reason_code

  - profile_id: darwin-arm64-apple-metal
    host_os: darwin
    host_arch: arm64
    accelerator_vendor: apple
    accelerator_planes:
      - metal
      - cpu
    probe_owner: runtime_host_accelerator_profile_resolver
    evidence_sources:
      - darwin_system_profiler
      - runtime_host_inventory
    required_evidence:
      device_visible: true
    driver_version_field: os_build_version
    device_fields:
      - device_id
      - name
      - unified_memory_bytes
    multi_gpu_policy:
      selection: runtime_selects_system_primary_device
      unsuitable_device_handling: degrade_with_reason
      aggregation: system_unified_memory_only
    staleness_ttl_seconds: 300
    refresh_triggers:
      - runtime_startup
      - explicit_user_refresh
    states:
      - unknown
      - probing
      - ready
      - degraded
      - unsupported
    degraded_reasons:
      - partial_device_visibility
      - stale_evidence
      - insufficient_memory
    audit_fields:
      - evidence_timestamp
      - evidence_source
      - selected_device_id
      - reason_code
