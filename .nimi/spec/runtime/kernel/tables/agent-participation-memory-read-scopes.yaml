version: 1
source_rule: K-AGCORE-067
memory_read_scopes:
  - id: CANONICAL_OWNER_POLICY
    source_rule: K-AGCORE-075
    dyadic_private_read: governed_by_canonical_policy
    allowed_profiles:
      - canonical_agent_chat
  - id: DYADIC_PRIVATE_ALLOWED
    source_rule: K-AGCORE-067
    dyadic_private_read: allowed_only_by_explicit_future_authority
    allowed_profiles: []
  - id: DYADIC_PRIVATE_EXCLUDED
    source_rule: K-AGCORE-076
    dyadic_private_read: forbidden
    allowed_profiles:
      - realm_group_agent
  - id: PUBLIC_SHARED_ONLY
    source_rule: K-AGCORE-067
    dyadic_private_read: forbidden
    allowed_profiles:
      - realm_group_agent
  - id: DOMAIN_SHARED_ONLY
    source_rule: K-AGCORE-077
    dyadic_private_read: forbidden
    allowed_profiles:
      - scenario_sandbox
      - oasis_world_participation
  - id: NO_MEMORY_READ
    source_rule: K-AGCORE-079
    dyadic_private_read: forbidden
    allowed_profiles:
      - external_agent_entry
      - debug_or_probe
governance:
  non_canonical_private_canonical_memory_read_default: forbidden
  broadening_requires_explicit_authority: true
