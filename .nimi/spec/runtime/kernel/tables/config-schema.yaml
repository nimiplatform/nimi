version: 1
table_family: protocol_surface
owner: runtime
protocol_id: runtime_config_schema
surfaces:
  - schemaVersion
  - runtimeId
  - localService.enabled
  - localService.mode
  - grpcAddr
  - httpAddr
  - shutdownTimeoutSeconds
  - localStatePath
  - aiHealthIntervalSeconds
  - aiHttpTimeoutSeconds
  - globalConcurrencyLimit
  - perAppConcurrencyLimit
  - idempotencyCapacity
  - maxDelegationDepth
  - auditRingBufferSize
  - usageStatsBufferSize
  - localAuditCapacity
  - dataRootRef
  - managedRoots.models
  - managedRoots.dependencies
  - managedRoots.environments
  - managedRoots.logs
  - managedRoots.audit
  - sessionTtlMinSeconds
  - sessionTtlMaxSeconds
  - auth.jwt.issuer
  - auth.jwt.audience
  - auth.jwt.jwksUrl
  - auth.jwt.revocationUrl
  - auth.developerRegistration.enabled
  - sourceMaterializationPacketHmacSecret
  - providers
  - engines.llama.enabled
  - engines.llama.version
  - engines.llama.port
  - engines.media.enabled
  - engines.media.version
  - engines.media.port
  - engines.speech.enabled
  - engines.speech.version
  - engines.speech.port
  - engines.sidecar.enabled
  - engines.sidecar.version
  - engines.sidecar.port
  - defaultLocalTextModel
  - defaultCloudProvider
  - logLevel
  - modelCatalogCustomDir
  - appRegistryPath
  - allowLoopbackProviderEndpoint
  - scheduling.diskDenialThresholdBytes
  - scheduling.slowdownRamThresholdBytes
  - scheduling.slowdownVramThresholdBytes
  - scheduling.slowdownDiskThresholdBytes
  - scheduling.preemptionOccupancyPercent
  - fields
  - constraints
  - restart
  - hot
  - immutable
# Phase 1 配置文件 schema (~/.nimi/runtime/config.json) 权威字段清单
# Source rule: K-CFG-017, K-DAEMON-009
fields:
  - key: schemaVersion
    type: int
    default: "1"
    reload: immutable
    description: 配置版本号
    source_rule: K-DAEMON-009

  - key: runtimeId
    type: string
    default: ""
    reload: immutable
    description: Stable local Runtime daemon identity; generated once at config init and never reassigned for the lifetime of the config file
    source_rule: K-CFG-018

  - key: localService.enabled
    type: bool
    default: "true"
    reload: restart
    description: Whether the Runtime daemon runs the local AI service plane; false leaves the daemon control-only with local materialization disabled
    source_rule: K-CFG-018

  - key: localService.mode
    type: string
    default: "desktop-local"
    reload: restart
    description: Runtime local service posture; desktop-local means the daemon is the on-device local AI service for this machine
    source_rule: K-CFG-018

  - key: grpcAddr
    type: string
    default: "127.0.0.1:46371"
    reload: restart
    description: gRPC 监听地址
    source_rule: K-DAEMON-009

  - key: httpAddr
    type: string
    default: "127.0.0.1:46372"
    reload: restart
    description: HTTP 监听地址
    source_rule: K-DAEMON-009

  - key: shutdownTimeoutSeconds
    type: int
    default: "10"
    reload: restart
    description: 优雅停机超时（秒）
    source_rule: K-DAEMON-003

  - key: localStatePath
    type: string
    default: "~/.nimi/runtime/local-state.json"
    reload: restart
    description: 本地状态持久化路径
    source_rule: K-LOCAL-016
    authority_note: Runtime-owned local AI state path; the single active state truth for local assets, transfers, dependency setup jobs, cutover evidence, and health projection. Retired Desktop-local state files are cutover inputs only, never fallback truth.

  - key: dataRootRef
    type: string
    default: ""
    reload: restart
    description: User-selected nimi_data root reconciled from ~/.nimi/nimi.json; empty means local materialization and app install fail closed until product setup records a root
    source_rule: K-CFG-018

  - key: managedRoots.models
    type: string
    default: "<dataRootRef>/models"
    reload: restart
    description: Runtime-managed local model payload root derived from selected nimi_data
    source_rule: K-CFG-018

  - key: managedRoots.dependencies
    type: string
    default: "<dataRootRef>/dependencies"
    reload: restart
    description: Runtime-managed dependency payload root derived from selected nimi_data
    source_rule: K-CFG-018

  - key: managedRoots.environments
    type: string
    default: "<dataRootRef>/environments"
    reload: restart
    description: Runtime-managed executable environment root derived from selected nimi_data
    source_rule: K-CFG-018

  - key: managedRoots.logs
    type: string
    default: "<dataRootRef>/logs"
    reload: restart
    description: Runtime/product operational log root derived from selected nimi_data
    source_rule: K-CFG-018

  - key: managedRoots.audit
    type: string
    default: "<dataRootRef>/audit"
    reload: restart
    description: Runtime audit projection root derived from selected nimi_data
    source_rule: K-CFG-018

  - key: appRegistryPath
    type: string
    default: "~/.nimi/apps/registry.json"
    reload: restart
    description: Platform Nimi App registry 的本地投影文件路径；缺失/不可解析时 Platform-governed Nimi App 注册/启动 fail-closed
    source_rule: K-CFG-017
    authority_note: Runtime consumes this file read-only as the explicit daemon projection source for Platform app admission. Runtime must not hardcode .nimi/spec/** as the source and must not own registry truth.

  - key: aiHealthIntervalSeconds
    type: int
    default: "8"
    reload: hot
    description: AI Provider 探活间隔（秒）
    source_rule: K-PROV-003

  - key: aiHttpTimeoutSeconds
    type: int
    default: "30"
    reload: hot
    description: AI Provider HTTP 超时（秒）
    source_rule: K-PROV-003

  - key: globalConcurrencyLimit
    type: int
    default: "8"
    reload: hot
    description: AI 全局并发上限
    source_rule: K-DAEMON-007

  - key: perAppConcurrencyLimit
    type: int
    default: "2"
    reload: hot
    description: AI 单 App 并发上限
    source_rule: K-DAEMON-007

  - key: idempotencyCapacity
    type: int
    default: "10000"
    reload: hot
    description: 幂等性存储容量上限
    source_rule: K-DAEMON-006

  - key: maxDelegationDepth
    type: int
    default: "3"
    reload: hot
    description: 委托链最大深度
    source_rule: K-GRANT-005

  - key: auditRingBufferSize
    type: int
    default: "20000"
    reload: hot
    description: 审计事件环形缓冲上限
    source_rule: K-AUDIT-007

  - key: usageStatsBufferSize
    type: int
    default: "50000"
    reload: hot
    description: 使用量样本环形缓冲上限
    source_rule: K-AUDIT-008

  - key: localAuditCapacity
    type: int
    default: "5000"
    reload: hot
    description: Local 审计事件存储上限
    source_rule: K-LOCAL-016

  - key: sessionTtlMinSeconds
    type: int
    default: "60"
    reload: hot
    description: Session TTL 下限（秒）
    source_rule: K-AUTHSVC-004

  - key: sessionTtlMaxSeconds
    type: int
    default: "86400"
    reload: hot
    description: Session TTL 上限（秒）
    source_rule: K-AUTHSVC-004

  - key: auth.jwt.issuer
    type: string
    default: ""
    reload: restart
    description: JWT iss 校验目标；与 audience / jwksUrl / revocationUrl 缺一不可，空值=拒绝所有 bearer token
    source_rule: K-AUTHN-009

  - key: auth.jwt.audience
    type: string
    default: ""
    reload: restart
    description: JWT aud 校验目标；与 issuer / jwksUrl / revocationUrl 缺一不可，空值=拒绝所有 bearer token
    source_rule: K-AUTHN-009

  - key: auth.jwt.jwksUrl
    type: string
    default: ""
    reload: restart
    description: JWT 公钥来源 JWKS 地址；非 loopback host 必须使用 https，且与 issuer / audience / revocationUrl 同时配置
    source_rule: K-AUTHN-004

  - key: auth.jwt.revocationUrl
    type: string
    default: ""
    reload: restart
    description: JWT 会话撤销内省地址；非 loopback host 必须使用 https，且与 issuer / audience / jwksUrl 同时配置
    source_rule: K-AUTHN-006

  - key: auth.developerRegistration.enabled
    type: bool
    default: "false"
    reload: restart
    description: 本地开发者注册门（K-AUTHSVC-014）；为 true 时 RegisterApp 才放行带 developer_registration 标记的未准入本地 app，默认 false fail-close。由 Desktop「本地 app 测试」开关经配置同步写入
    source_rule: K-AUTHSVC-014

  - key: sourceMaterializationPacketHmacSecret
    type: string
    default: ""
    reload: restart
    description: Runtime-owned verifier secret for Realm-issued source materialization packet HMAC proofs; empty means source materialization rejects fail-closed
    source_rule: K-CFG-011
    authority_note: Desktop and SDK callers must not read, derive, or transmit this secret as product payload; RuntimeAgent consumes the resolved Runtime config value only.

  - key: providers
    type: map
    default: "{}"
    reload: restart
    description: AI Provider 路由表（key=provider name）
    source_rule: K-DAEMON-009

  - key: engines.llama.enabled
    type: bool
    default: "false"
    reload: restart
    description: 启用 llama 引擎 SUPERVISED 模式
    source_rule: K-LENG-004

  - key: engines.llama.version
    type: string
    default: "b8645"
    reload: restart
    description: llama 受管引擎版本
    source_rule: K-LENG-004

  - key: engines.llama.port
    type: int
    default: "1234"
    reload: restart
    description: llama 监听端口
    source_rule: K-LENG-004

  - key: engines.media.enabled
    type: bool
    default: "false"
    reload: restart
    description: 启用 media 引擎 SUPERVISED 模式
    source_rule: K-LENG-004

  - key: engines.media.version
    type: string
    default: "0.1.0"
    reload: restart
    description: media 受管引擎版本
    source_rule: K-LENG-004

  - key: engines.media.port
    type: int
    default: "8321"
    reload: restart
    description: media 监听端口
    source_rule: K-LENG-004

  - key: engines.speech.enabled
    type: bool
    default: "false"
    reload: restart
    description: 启用 speech 引擎 SUPERVISED 模式
    source_rule: K-LENG-004

  - key: engines.speech.version
    type: string
    default: ""
    reload: restart
    description: speech 受管引擎版本
    source_rule: K-LENG-004

  - key: engines.speech.port
    type: int
    default: "8330"
    reload: restart
    description: speech 监听端口
    source_rule: K-LENG-004

  - key: engines.sidecar.enabled
    type: bool
    default: "false"
    reload: restart
    description: 启用 sidecar 引擎（ATTACHED_ENDPOINT 模式）
    source_rule: K-LENG-002

  - key: engines.sidecar.version
    type: string
    default: ""
    reload: restart
    description: sidecar 引擎版本
    source_rule: K-LENG-002

  - key: engines.sidecar.port
    type: int
    default: "0"
    reload: restart
    description: sidecar 监听端口
    source_rule: K-LENG-002

  - key: defaultLocalTextModel
    type: string
    default: ""
    reload: hot
    description: 默认本地文本模型 ID 覆盖
    source_rule: K-CFG-013

  - key: defaultCloudProvider
    type: string
    default: ""
    reload: hot
    description: 默认云端 provider
    source_rule: K-CFG-013

  - key: logLevel
    type: string
    default: "info"
    reload: hot
    description: 日志级别（debug/info/warn/error）
    source_rule: K-CFG-017

  - key: modelCatalogCustomDir
    type: string
    default: "~/.nimi/runtime/model-catalog/providers"
    reload: restart
    description: 本地自定义 provider 目录路径
    source_rule: K-MCAT-005

  - key: allowLoopbackProviderEndpoint
    type: bool
    default: "false"
    reload: restart
    description: 是否允许 loopback 地址的 HTTP provider endpoint
    source_rule: K-SEC-002

  # === Scheduling risk thresholds (K-SCHED-004, K-SCHED-005) ===

  - key: scheduling.diskDenialThresholdBytes
    type: int
    default: "524288000"
    reload: hot
    description: 磁盘可用空间低于此值触发 scheduling denied（字节）
    source_rule: K-SCHED-004

  - key: scheduling.slowdownRamThresholdBytes
    type: int
    default: "2147483648"
    reload: hot
    description: 可用 RAM 低于此值触发 slowdown_risk（字节，默认 2 GB）
    source_rule: K-SCHED-005

  - key: scheduling.slowdownVramThresholdBytes
    type: int
    default: "1073741824"
    reload: hot
    description: 可用 VRAM 低于此值触发 slowdown_risk（字节，默认 1 GB）
    source_rule: K-SCHED-005

  - key: scheduling.slowdownDiskThresholdBytes
    type: int
    default: "2147483648"
    reload: hot
    description: 磁盘可用空间低于此值触发 slowdown_risk（字节，默认 2 GB；高于 denial 阈值）
    source_rule: K-SCHED-005

  - key: scheduling.preemptionOccupancyPercent
    type: int
    default: "75"
    reload: hot
    description: 全局 slot 占用率超过此百分比触发 preemption_risk（0-100）
    source_rule: K-SCHED-005

# providers 值结构
provider_value_schema:
  fields:
    - key: baseUrl
      type: string
      required: false
    - key: apiKey
      type: string
      required: false
    - key: apiKeyEnv
      type: string
      required: false
    - key: defaultModel
      type: string
      required: false
  constraints:
    - apiKey 与 apiKeyEnv 互斥；二者同时设置时写入校验必须拒绝并返回 CONFIG_SECRET_POLICY_VIOLATION
    - source_rule: K-CFG-005

# localService 值约束
local_service_schema:
  fields:
    - key: enabled
      type: bool
      required: true
    - key: mode
      type: string
      required: true
  constraints:
    - localService.mode 仅允许 closed value "desktop-local"；其他值写入校验必须拒绝并返回 CONFIG_SCHEMA_INVALID
    - source_rule: K-CFG-018

# reload 列语义
reload_semantics:
  restart: 变更后需要 daemon 重启才生效（涉及网络绑定、进程模型等启动时固化的资源）
  hot: 变更后无需重启，下次使用时即刻生效
  immutable: 不可变更（schemaVersion）

# JWT 验签配置约束
jwt_constraint: 仅支持 auth.jwt.jwksUrl，不支持 auth.jwt.publicKeyPath
