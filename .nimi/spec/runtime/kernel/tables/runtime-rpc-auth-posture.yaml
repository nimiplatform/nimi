id: nimicoding.runtime-rpc-auth-posture.v1
kind: runtime-rpc-auth-posture
version: 1
generated: false
posture_enum:
  - value: anonymous_read
    meaning: >-
      Handler does not require authenticated identity for any branch. No
      subject_user_id lookup. No owner-scoped filter that diverges by identity.
      No write side-effect bound to a Realm subject. SDK MUST NOT inject
      Authorization bearer for these methods.
  - value: authenticated_required
    meaning: >-
      Handler requires authenticated identity for any documented branch.
      Writes, owner-bound reads where authenticated identity is required for
      the call to succeed at all. SDK MUST carry Authorization (Realm JWT) or
      an equivalent admitted credential per K-AUTHN-006.
  - value: mixed
    meaning: >-
      Handler diverges by JWT presence per K-AUTH-002 / K-AUTH-003 /
      K-AUTH-004 / K-AUTH-006 (e.g., information-hiding patterns where an
      owner-scoped read hides non-owner records when JWT absent but still
      succeeds; or job-owner semantics where JWT-bound owner differs from
      anonymous owner). Both authenticated and anonymous calls are permitted;
      behavior diverges at the handler.
posture_decision_doctrine: |
  For each RPC, classify by reading the current handler under
  nimi/runtime/internal/services/** plus the rules in
  nimi/.nimi/spec/runtime/kernel/authz-ownership.md K-AUTH-001..007:

  - If the handler does not require an authenticated identity for any branch
    (no subject_user_id lookup, no owner-scoped filter that diverges by
    identity, no write side-effect bound to a Realm subject), the posture is
    `anonymous_read`.
  - If the handler requires an authenticated identity for any documented
    branch (write, owner-bound read where authenticated identity is required
    for the call to succeed at all), the posture is `authenticated_required`.
  - If the handler diverges by JWT presence per K-AUTH-002 / K-AUTH-003, the
    posture is `mixed`. The rationale field on a `mixed` entry MUST cite the
    specific divergence rule.

  This doctrine is the worker's classification rule. The doctrine is stored
  verbatim as the `posture_decision_doctrine` field at the top of the
  delivered table file so the table is self-contained and downstream
  consumers (Wave 2 SDK, Wave 4 runtime tests) read the same doctrine the
  worker used.

  If a handler genuinely does not match any of the three values, the worker
  STOPS and overflows the packet; a fourth posture would require a kernel
  rule change, which is out of Wave 0 scope.
