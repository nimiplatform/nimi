version: 1
source_rule: K-AGCORE-095
domain_future_seams:
  - id: OASIS_WORLD_PARTICIPATION
    source_rule: K-AGCORE-096
    participation_profile: oasis_world_participation
    transcript_owner: OASIS_WORLD_DOMAIN
    identity_source: NPC_WORLD_ACTOR
    execution_owner: RUNTIME
    authority_references:
      - contract: .nimi/spec/runtime/kernel/world-evolution-engine-contract.md
        owner_rule_range: K-WEV-001..016
        posture: runtime_local_world_execution_evidence_only
      - contract: .nimi/spec/realm/kernel/transit-contract.md
        posture: realm_world_transit_truth_reference_only
      - contract: .nimi/spec/realm/kernel/truth-contract.md
        posture: realm_world_truth_reference_only
    required_context_blocks:
      - world_context_ref
      - world_event_ref
      - visible_world_state_projection
      - recent_world_transcript_or_event_projection
      - participant_projection
    admitted_context_shape:
      world_context_ref: typed_reference_only
      world_event_ref: typed_reference_only
      visible_world_state_projection: typed_projection_only
      recent_world_transcript_or_event_projection: typed_projection_only
      participant_projection: typed_projection_only
    forbidden_context_shape:
      raw_world_prompt_blob: forbidden
      raw_world_state_payload: forbidden
      raw_game_script_as_prompt: forbidden
      gaussian_scene_blob_as_prompt: forbidden
      app_local_world_agent_execution: forbidden
    memory_read_scope: DOMAIN_SHARED_ONLY
    memory_write_default: WRITE_NONE
    capability_scope: DOMAIN_LIMITED
    output_destination: WORLD_EVENT_CANDIDATE
    promotion_posture: EXPLICIT_CANDIDATE
    commit_owner: domain_world_authority
    runtime_direct_commit: forbidden
    product_ontology_implementation: forbidden_in_this_wave
  - id: SCENARIO_SANDBOX
    source_rule: K-AGCORE-097
    participation_profile: scenario_sandbox
    transcript_owner: SCENARIO_MODULE
    identity_source: SANDBOX_PROJECTION
    execution_owner: RUNTIME
    product_domain_posture: pending_future_product_domain
    authority_references:
      - contract: .nimi/spec/runtime/kernel/scenario-job-lifecycle.md
        owner_rule_range: K-JOB-001..008
        posture: scenario_job_reference_only
    required_context_blocks:
      - scenario_package_ref
      - scenario_run_ref
      - scenario_branch_ref
      - visible_scene_state
      - recent_sandbox_transcript_projection
    admitted_context_shape:
      scenario_package_ref: typed_reference_only
      scenario_run_ref: typed_reference_only
      scenario_branch_ref: typed_reference_only
      visible_scene_state: typed_projection_only
      recent_sandbox_transcript_projection: typed_projection_only
    forbidden_context_shape:
      raw_scenario_prompt_blob: forbidden
      custom_prompt_public_api: forbidden
      raw_scenario_package_payload: forbidden
      raw_replay_branch_payload: forbidden
      app_local_scenario_agent_execution: forbidden
    memory_read_scope: DOMAIN_SHARED_ONLY
    memory_write_default: WRITE_NONE
    capability_scope: DOMAIN_LIMITED
    output_destination: SCENARIO_TURN_CANDIDATE
    promotion_posture: EXPLICIT_CANDIDATE
    commit_owner: future_scenario_authority
    runtime_direct_commit: forbidden
    product_ontology_implementation: forbidden_in_this_wave
shared_invariants:
  source_rule: K-AGCORE-098
  runtime_participation_role: execution_semantics_only
  domain_truth_redefinition: forbidden
  domain_transcript_commit: domain_owned
  memory_cognition_write_before_promotion: forbidden
  canonical_chat_write_before_promotion: forbidden
  domain_context_open_payload: forbidden
  app_local_agent_execution: forbidden
future_implementation_gates:
  source_rule: K-AGCORE-099
  oasis_world_product_implementation_requires_separate_admission: true
  scenario_sandbox_product_implementation_requires_separate_admission: true
  scenario_job_execution_in_participation_wave: forbidden
  sdk_proto_app_surface_in_wave_6: forbidden
  promotion_implementation_in_wave_6: forbidden
negative_gates:
  source_rule: K-AGCORE-100
  raw_world_prompt_blob: forbidden
  raw_scenario_prompt_blob: forbidden
  runtime_world_truth_commit: forbidden
  runtime_scenario_transcript_commit: forbidden
  app_local_world_agent_execution: forbidden
  app_local_scenario_agent_execution: forbidden
  fake_world_or_scenario_success: forbidden
