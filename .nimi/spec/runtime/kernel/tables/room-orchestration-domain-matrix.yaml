version: 1
source_rule: K-AGCORE-110
closed_matrix: true
axis_model: .nimi/spec/runtime/kernel/tables/room-orchestration-axis-model.yaml
columns:
  - room_session_owner
  - participant_set_source
  - trigger_arbitration
  - turn_ordering
  - fairness_starvation_policy
  - budget_owner
  - queue_status_projection
  - cancellation_timeout_owner
  - external_participant_admission
  - commit_race_handoff
rows:
  - id: realm_group
    source_rule: K-AGCORE-110
    cells:
      room_session_owner:
        owner: K-AGCORE
        allowed_evidence_source: Realm GROUP thread and membership refs.
        forbidden_parallel_truth: Realm-owned room scheduler or app-local queue.
        handoff_refusal_posture: Runtime admits room orchestration only.
      participant_set_source:
        owner: K-AGCORE
        allowed_evidence_source: Realm-authenticated group member and agent slot evidence.
        forbidden_parallel_truth: Open participant strings from Desktop, Web, SDK, or mods.
        handoff_refusal_posture: Missing Realm evidence fails closed.
      trigger_arbitration:
        owner: K-AGCORE
        allowed_evidence_source: Realm group message or explicit agent mention trigger refs.
        forbidden_parallel_truth: Realm-local trigger scheduler.
        handoff_refusal_posture: Runtime arbitrates before execution.
      turn_ordering:
        owner: K-AGCORE
        allowed_evidence_source: Runtime queue entry refs derived from Realm trigger evidence.
        forbidden_parallel_truth: Group chat queues replies locally.
        handoff_refusal_posture: Runtime order is required before candidate generation.
      fairness_starvation_policy:
        owner: K-AGCORE
        allowed_evidence_source: Runtime fairness ledger and participant queue age.
        forbidden_parallel_truth: Realm fairness policy.
        handoff_refusal_posture: Starved entries are escalated or refused by Runtime.
      budget_owner:
        owner: K-AGCORE
        allowed_evidence_source: Runtime agent budget and room budget refs.
        forbidden_parallel_truth: Realm, Desktop, or Web budget owner.
        handoff_refusal_posture: Budget exhaustion returns Runtime refusal.
      queue_status_projection:
        owner: K-AGCORE
        allowed_evidence_source: runtime.agent.* projection events.
        forbidden_parallel_truth: runtime.orchestration.* public status namespace.
        handoff_refusal_posture: Apps consume projection only.
      cancellation_timeout_owner:
        owner: K-AGCORE
        allowed_evidence_source: Runtime cancellation token and timeout policy refs.
        forbidden_parallel_truth: Realm-local cancellation authority.
        handoff_refusal_posture: Runtime cancellation or timeout terminates candidate work.
      external_participant_admission:
        owner: K-AGCORE
        allowed_evidence_source: NOT_EXTERNAL unless an external row is composed.
        forbidden_parallel_truth: Protocol-ready participant enters Realm group directly.
        handoff_refusal_posture: External entry requires gateway verdict.
      commit_race_handoff:
        owner: K-AGCORE
        allowed_evidence_source: Runtime output candidate and Realm commit target refs.
        forbidden_parallel_truth: Runtime direct Realm GROUP message commit.
        handoff_refusal_posture: Realm owns authenticated commit.
  - id: scenario_sandbox
    source_rule: K-AGCORE-110
    cells:
      room_session_owner:
        owner: K-AGCORE
        allowed_evidence_source: Scenario run, branch, or sandbox context refs.
        forbidden_parallel_truth: Scenario-owned room scheduler.
        handoff_refusal_posture: Runtime admits orchestration only.
      participant_set_source:
        owner: K-AGCORE
        allowed_evidence_source: Scenario participant projection evidence.
        forbidden_parallel_truth: Scenario prompt-local participant strings.
        handoff_refusal_posture: Missing projection evidence fails closed.
      trigger_arbitration:
        owner: K-AGCORE
        allowed_evidence_source: Scenario step, script, or user trigger refs.
        forbidden_parallel_truth: Scenario-specific arbitration policy.
        handoff_refusal_posture: Runtime arbitrates before execution.
      turn_ordering:
        owner: K-AGCORE
        allowed_evidence_source: Runtime queue entry refs.
        forbidden_parallel_truth: Scenario owns agent turn order.
        handoff_refusal_posture: Runtime turn order is required.
      fairness_starvation_policy:
        owner: K-AGCORE
        allowed_evidence_source: Runtime fairness ledger.
        forbidden_parallel_truth: Scenario fairness policy.
        handoff_refusal_posture: Runtime escalates or refuses starvation.
      budget_owner:
        owner: K-AGCORE
        allowed_evidence_source: Runtime room and agent budget refs.
        forbidden_parallel_truth: Scenario budget policy.
        handoff_refusal_posture: Budget exhaustion returns Runtime refusal.
      queue_status_projection:
        owner: K-AGCORE
        allowed_evidence_source: runtime.agent.* projection events.
        forbidden_parallel_truth: Scenario status truth for Runtime queue state.
        handoff_refusal_posture: Scenario may display projection only.
      cancellation_timeout_owner:
        owner: K-AGCORE
        allowed_evidence_source: Runtime cancellation and timeout refs.
        forbidden_parallel_truth: Scenario-owned execution cancellation.
        handoff_refusal_posture: Runtime cancellation or timeout terminates work.
      external_participant_admission:
        owner: K-AGCORE
        allowed_evidence_source: Gateway verdict refs when external participant is present.
        forbidden_parallel_truth: Scenario admits protocol participant directly.
        handoff_refusal_posture: Missing gateway verdict fails closed.
      commit_race_handoff:
        owner: K-AGCORE
        allowed_evidence_source: Runtime scenario turn candidate and target scenario refs.
        forbidden_parallel_truth: Runtime direct Scenario transcript or replay commit.
        handoff_refusal_posture: Scenario owns domain commit.
  - id: oasis_world
    source_rule: K-AGCORE-110
    cells:
      room_session_owner:
        owner: K-AGCORE
        allowed_evidence_source: OASIS/world context, actor, and event refs.
        forbidden_parallel_truth: World-engine-owned room scheduler.
        handoff_refusal_posture: Runtime admits orchestration only.
      participant_set_source:
        owner: K-AGCORE
        allowed_evidence_source: World actor and projected agent evidence.
        forbidden_parallel_truth: World prompt-local participant strings.
        handoff_refusal_posture: Missing world evidence fails closed.
      trigger_arbitration:
        owner: K-AGCORE
        allowed_evidence_source: World event or user action trigger refs.
        forbidden_parallel_truth: World engine owns trigger arbitration.
        handoff_refusal_posture: Runtime arbitrates before execution.
      turn_ordering:
        owner: K-AGCORE
        allowed_evidence_source: Runtime queue entry refs.
        forbidden_parallel_truth: World engine owns agent turn order.
        handoff_refusal_posture: Runtime turn order is required.
      fairness_starvation_policy:
        owner: K-AGCORE
        allowed_evidence_source: Runtime fairness ledger.
        forbidden_parallel_truth: OASIS/world fairness policy.
        handoff_refusal_posture: Runtime escalates or refuses starvation.
      budget_owner:
        owner: K-AGCORE
        allowed_evidence_source: Runtime room and agent budget refs.
        forbidden_parallel_truth: OASIS/world budget policy.
        handoff_refusal_posture: Budget exhaustion returns Runtime refusal.
      queue_status_projection:
        owner: K-AGCORE
        allowed_evidence_source: runtime.agent.* projection events.
        forbidden_parallel_truth: OASIS/world status truth for Runtime queue state.
        handoff_refusal_posture: World may display projection only.
      cancellation_timeout_owner:
        owner: K-AGCORE
        allowed_evidence_source: Runtime cancellation and timeout refs.
        forbidden_parallel_truth: OASIS/world-owned execution cancellation.
        handoff_refusal_posture: Runtime cancellation or timeout terminates work.
      external_participant_admission:
        owner: K-AGCORE
        allowed_evidence_source: Gateway verdict refs when external participant is present.
        forbidden_parallel_truth: World admits protocol participant directly.
        handoff_refusal_posture: Missing gateway verdict fails closed.
      commit_race_handoff:
        owner: K-AGCORE
        allowed_evidence_source: Runtime world event candidate and target world refs.
        forbidden_parallel_truth: Runtime direct world state or event-log commit.
        handoff_refusal_posture: OASIS/world owns domain commit.
  - id: avatar_companion_presentation_room
    source_rule: K-AGCORE-110
    cells:
      room_session_owner:
        owner: K-AGCORE
        allowed_evidence_source: Runtime agent presentation and avatar instance refs.
        forbidden_parallel_truth: Avatar-owned room scheduler.
        handoff_refusal_posture: Runtime admits orchestration only.
      participant_set_source:
        owner: K-AGCORE
        allowed_evidence_source: Runtime presentation profile and companion binding evidence.
        forbidden_parallel_truth: Avatar-local participant truth.
        handoff_refusal_posture: Missing Runtime evidence fails closed.
      trigger_arbitration:
        owner: K-AGCORE
        allowed_evidence_source: Presentation event, user input, or Runtime turn refs.
        forbidden_parallel_truth: Avatar trigger arbitration policy.
        handoff_refusal_posture: Runtime arbitrates before execution.
      turn_ordering:
        owner: K-AGCORE
        allowed_evidence_source: Runtime queue entry refs.
        forbidden_parallel_truth: Avatar-owned turn order.
        handoff_refusal_posture: Runtime turn order is required.
      fairness_starvation_policy:
        owner: K-AGCORE
        allowed_evidence_source: Runtime fairness ledger.
        forbidden_parallel_truth: Avatar fairness policy.
        handoff_refusal_posture: Runtime escalates or refuses starvation.
      budget_owner:
        owner: K-AGCORE
        allowed_evidence_source: Runtime room and agent budget refs.
        forbidden_parallel_truth: Avatar or Desktop budget owner.
        handoff_refusal_posture: Budget exhaustion returns Runtime refusal.
      queue_status_projection:
        owner: K-AGCORE
        allowed_evidence_source: runtime.agent.* projection events.
        forbidden_parallel_truth: Avatar semantic status truth for Runtime queue state.
        handoff_refusal_posture: Avatar may render projection only.
      cancellation_timeout_owner:
        owner: K-AGCORE
        allowed_evidence_source: Runtime cancellation and timeout refs.
        forbidden_parallel_truth: Avatar-owned execution cancellation.
        handoff_refusal_posture: Runtime cancellation or timeout terminates work.
      external_participant_admission:
        owner: K-AGCORE
        allowed_evidence_source: Gateway verdict refs when external participant is present.
        forbidden_parallel_truth: Avatar admits protocol participant directly.
        handoff_refusal_posture: Missing gateway verdict fails closed.
      commit_race_handoff:
        owner: K-AGCORE
        allowed_evidence_source: Runtime presentation candidate refs.
        forbidden_parallel_truth: Avatar commits Runtime transcript or domain truth.
        handoff_refusal_posture: Presentation projection only; no domain commit.
  - id: external_entry_inside_room
    source_rule: K-AGCORE-110
    cells:
      room_session_owner:
        owner: K-AGCORE
        allowed_evidence_source: Runtime room ref plus external gateway admission evidence.
        forbidden_parallel_truth: External protocol owns room scheduler.
        handoff_refusal_posture: Runtime admits orchestration only.
      participant_set_source:
        owner: K-AGCORE
        allowed_evidence_source: Gateway identity, credential custody, and participant refs.
        forbidden_parallel_truth: Raw MCP/A2A identity as room participant truth.
        handoff_refusal_posture: Missing gateway identity fails closed.
      trigger_arbitration:
        owner: K-AGCORE
        allowed_evidence_source: Protocol signal after gateway verdict.
        forbidden_parallel_truth: Protocol readiness triggers action directly.
        handoff_refusal_posture: Runtime arbitrates before execution.
      turn_ordering:
        owner: K-AGCORE
        allowed_evidence_source: Runtime queue entry refs.
        forbidden_parallel_truth: External runtime owns same-room turn order.
        handoff_refusal_posture: Runtime turn order is required.
      fairness_starvation_policy:
        owner: K-AGCORE
        allowed_evidence_source: Runtime fairness ledger and gateway limits.
        forbidden_parallel_truth: External provider fairness policy.
        handoff_refusal_posture: Runtime escalates or refuses starvation.
      budget_owner:
        owner: K-AGCORE
        allowed_evidence_source: Runtime gateway budget and room budget refs.
        forbidden_parallel_truth: External provider budget as Nimi room budget.
        handoff_refusal_posture: Budget exhaustion returns Runtime refusal.
      queue_status_projection:
        owner: K-AGCORE
        allowed_evidence_source: runtime.agent.* projection events.
        forbidden_parallel_truth: Protocol status as Runtime queue truth.
        handoff_refusal_posture: Protocol status remains gateway evidence only.
      cancellation_timeout_owner:
        owner: K-AGCORE
        allowed_evidence_source: Runtime cancellation, timeout, and gateway refs.
        forbidden_parallel_truth: External-only cancellation authority.
        handoff_refusal_posture: Runtime cancellation or timeout terminates admission/work.
      external_participant_admission:
        owner: K-AGCORE
        allowed_evidence_source: Runtime gateway verdict, firewall posture, credential custody, consent, and audit refs.
        forbidden_parallel_truth: MCP/A2A direct room entry.
        handoff_refusal_posture: Missing verdict fails closed.
      commit_race_handoff:
        owner: K-AGCORE
        allowed_evidence_source: Runtime external reply candidate and target domain refs.
        forbidden_parallel_truth: Runtime direct external-domain commit or protocol self-commit as Nimi truth.
        handoff_refusal_posture: Target domain/protocol owner handles commit outside Runtime truth.
  - id: canonical_chat_adjacency
    source_rule: K-AGCORE-110
    cells:
      room_session_owner:
        owner: K-AGCORE
        allowed_evidence_source: Runtime conversation anchor and canonical turn refs.
        forbidden_parallel_truth: Room orchestration replaces canonical chat owner.
        handoff_refusal_posture: Runtime admits adjacency only.
      participant_set_source:
        owner: K-AGCORE
        allowed_evidence_source: Runtime agent identity and conversation anchor evidence.
        forbidden_parallel_truth: App-local participant strings.
        handoff_refusal_posture: Missing Runtime anchor fails closed.
      trigger_arbitration:
        owner: K-AGCORE
        allowed_evidence_source: Canonical user or agent turn refs.
        forbidden_parallel_truth: App-local canonical trigger arbitration.
        handoff_refusal_posture: Runtime arbitrates before execution.
      turn_ordering:
        owner: K-AGCORE
        allowed_evidence_source: Runtime queue entry refs.
        forbidden_parallel_truth: App-local same-room turn order.
        handoff_refusal_posture: Runtime turn order is required.
      fairness_starvation_policy:
        owner: K-AGCORE
        allowed_evidence_source: Runtime fairness ledger.
        forbidden_parallel_truth: App fairness policy.
        handoff_refusal_posture: Runtime escalates or refuses starvation.
      budget_owner:
        owner: K-AGCORE
        allowed_evidence_source: Runtime canonical budget and room budget refs.
        forbidden_parallel_truth: App or UI budget owner.
        handoff_refusal_posture: Budget exhaustion returns Runtime refusal.
      queue_status_projection:
        owner: K-AGCORE
        allowed_evidence_source: runtime.agent.* projection events.
        forbidden_parallel_truth: runtime.orchestration.* public status namespace.
        handoff_refusal_posture: Apps consume projection only.
      cancellation_timeout_owner:
        owner: K-AGCORE
        allowed_evidence_source: Runtime cancellation and timeout refs.
        forbidden_parallel_truth: App-owned execution cancellation.
        handoff_refusal_posture: Runtime cancellation or timeout terminates work.
      external_participant_admission:
        owner: K-AGCORE
        allowed_evidence_source: Gateway verdict refs when external participant is present.
        forbidden_parallel_truth: External protocol enters canonical chat directly.
        handoff_refusal_posture: Missing gateway verdict fails closed.
      commit_race_handoff:
        owner: K-AGCORE
        allowed_evidence_source: Runtime canonical candidate and owner-authorized canonical handling refs.
        forbidden_parallel_truth: Room orchestration appends canonical chat history directly.
        handoff_refusal_posture: Canonical chat authority owns commit.
governance:
  source_rule: K-AGCORE-118
  required_cells_deferred: forbidden
  wave_2_first_definition: forbidden
  domain_private_scheduler: forbidden
  direct_domain_commit: forbidden
