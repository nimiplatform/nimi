table_family: support_registry
registry_id: runtime_rule_evidence_catalog
owner: runtime
schema_ref: .nimi/contracts/table-family.schema.yaml#support_registry
allowed_fields:
  - type
  - command
  - path
  - description
  - evidence_type
  - validation_scope
forbidden_state_fields:
  - covered
  - coverage_status
  - audit_date
  - evidence_report
  - current
  - done
  - run_id
  - ledger_ref
entries:
  - runtime_kernel_consistency
  - runtime_go_test
  - sdk_runtime_test
  - desktop_boundary_test
  - runtime_go_lint
  - runtime_proto_linkage
  - runtime_provider_checks
  - runtime_catalog_drift
  - runtime_selection_freshness
runtime_kernel_consistency:
  type: static_gate
  command: pnpm exec nimicoding validate-spec-governance --profile nimi --scope runtime-consistency
  path: scripts/check-runtime-spec-kernel-consistency.mjs
  description: >-
    Kernel rule integrity, reason code coverage, error mapping matrix,
    RPC migration parity, provider catalog alignment, and domain doc
    compliance checks for Runtime domain.
runtime_go_test:
  type: test_gate
  command: cd runtime && make test
  path: runtime/Makefile
  description: >-
    Go unit and integration tests verifying runtime service behavior.
    Rules with this evidence have behavioral test coverage in the
    corresponding service package.
sdk_runtime_test:
  type: test_gate
  command: pnpm --filter @nimiplatform/sdk test
  path: sdk/test/runtime
  description: >-
    SDK runtime projection tests verifying generated Runtime RPC method
    coverage, auth posture classification, and typed client surfaces.
desktop_boundary_test:
  type: test_gate
  command: pnpm --filter @nimiplatform/desktop test
  path: apps/desktop/test
  description: >-
    Desktop app-boundary tests verifying Runtime projections are consumed through
    SDK/Kit-facing surfaces without Desktop-local platform truth.
runtime_go_lint:
  type: lint_gate
  command: cd runtime && golangci-lint run ./...
  path: runtime/.golangci.yml
  description: Go static analysis gate for runtime implementation.
runtime_proto_linkage:
  type: static_gate
  command: pnpm check:runtime-proto-spec-linkage
  path: scripts/check-runtime-proto-spec-linkage.mjs
  description: Proto definition and spec rule linkage validation.
runtime_provider_checks:
  type: static_gate
  command: pnpm check:runtime-provider-capability-token-canonicalization && pnpm check:runtime-provider-activation-alignment && pnpm check:runtime-provider-endpoint-ssot
  path: scripts/check-runtime-provider-capability-token-canonicalization.mjs
  description: Provider catalog, capability token, activation, and endpoint single-source-of-truth validation.
runtime_catalog_drift:
  type: static_gate
  command: pnpm check:runtime-catalog-drift
  path: scripts/check-runtime-catalog-drift.mjs
  description: Runtime catalog definition consistency and drift detection.
runtime_selection_freshness:
  type: static_gate
  command: pnpm check:runtime-selection-freshness
  path: scripts/check-runtime-selection-freshness.mjs
  description: Reviewed selection profile freshness, capability fit, and default-model projection validation.
