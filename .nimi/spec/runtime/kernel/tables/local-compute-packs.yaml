version: 1

# Canonical product-facing local compute pack authority.
# Packs are requested capability bundles. They are not model rows, engine-local
# installers, Desktop installers, or developer script entrypoints.

packs:
  - pack_id: local-text
    product_label: Local text
    owner: runtime_local_environment_plan
    user_entrypoints:
      - local_model_install
      - local_compute_setup
    capabilities:
      - text.generate
      - text.embed
      - image.understand
      - audio.understand
    required_dependency_families:
      - native-engine-package.llama
      - model.asset
    optional_dependency_families:
      - accelerator.cuda.runtime
    consumers:
      - llama.cpp.cpu
      - llama.cpp.vulkan
      - llama.cpp.cuda
    cloud_only_impact: none

  - pack_id: local-image-native
    product_label: Local image native
    owner: runtime_local_environment_plan
    user_entrypoints:
      - local_model_install
      - local_compute_setup
    capabilities:
      - image.generate.t2i
      - image.generate.i2i
    required_dependency_families:
      - native-engine-package.stablediffusion-ggml
      - model.asset
      - model.companion-asset
    optional_dependency_families:
      - accelerator.cuda.runtime
    consumers:
      - stable-diffusion.cpp.cpu
      - stable-diffusion.cpp.metal
      - stable-diffusion.cpp.cuda
    cloud_only_impact: none

  - pack_id: local-image-python
    product_label: Local image Python workflows
    owner: runtime_local_environment_plan
    user_entrypoints:
      - local_model_install
      - local_compute_setup
    capabilities:
      - image.generate.t2i
      - image.generate.i2i
    required_dependency_families:
      - python.tool.uv
      - python.runtime
      - python.venv
      - python.package-set
      - python.torch-wheel
      - model.asset
      - model.companion-asset
    optional_dependency_families:
      - accelerator.cuda.runtime
    consumers:
      - media.diffusers.cpu
      - media.diffusers.cuda
    cloud_only_impact: none

  - pack_id: local-video-python
    product_label: Local video Python workflows
    owner: runtime_local_environment_plan
    user_entrypoints:
      - local_model_install
      - local_compute_setup
    capabilities:
      - video.generate
      - i2v
    required_dependency_families:
      - python.tool.uv
      - python.runtime
      - python.venv
      - python.package-set
      - python.torch-wheel
      - model.asset
      - model.companion-asset
    optional_dependency_families:
      - accelerator.cuda.runtime
    consumers:
      - media.video-python.cpu
      - media.video-python.cuda
    cloud_only_impact: none

  - pack_id: local-speech
    product_label: Local speech
    owner: runtime_local_environment_plan
    user_entrypoints:
      - local_model_install
      - local_compute_setup
    capabilities:
      - audio.transcribe
      - audio.synthesize
    required_dependency_families:
      - python.tool.uv
      - python.runtime
      - python.venv
      - python.package-set
      - model.asset
    optional_dependency_families: []
    consumers:
      - speech.qwen3-asr.python
      - speech.qwen3-tts.python
    cloud_only_impact: none

  - pack_id: local-gpu-support
    product_label: Local GPU support
    owner: runtime_local_environment_plan
    user_entrypoints:
      - local_compute_setup
      - dependency_repair
    capabilities:
      - accelerator.cuda
    required_dependency_families:
      - accelerator.cuda.runtime
    optional_dependency_families: []
    consumers:
      - llama.cpp.cuda
      - stable-diffusion.cpp.cuda
      - media.diffusers.cuda
      - media.video-python.cuda
    cloud_only_impact: none

pack_rules:
  - pack selection may be explicit or derived from a local model/capability request
  - pack selection must resolve a Runtime-owned local environment plan before heavy materialization
  - pack selection must not make Runtime core readiness depend on local compute readiness
  - cloud-only usage must not select a local compute pack implicitly
  - Desktop may project pack status and confirmation only; it must not materialize packs
  - pack selection may produce a plan, dependency environments, and confirmation payloads; it must not perform first heavy or network materialization
  - missing local pack dependencies project Runtime local environment setup, failed, unsupported, cancelled, or repair state
  - local compute pack projection must not instruct ordinary users to install uv, Python, Torch, CUDA, native packages, model assets, or companion assets through system package managers or PATH mutation
