version: 3
table_family: protocol_surface
owner: runtime
protocol_id: runtime_protected_local_principal_profiles
surfaces: [windows, linux, macos]
entries: [windows, linux, macos]
description: Platform-neutral Runtime service-principal semantics plus closed OS principal and service-manager profiles.
authority_refs: [K-PLOCAL-001, K-PLOCAL-003, K-PLOCAL-007, K-CFG-001]
neutral_contract:
  production_runtime_execution_mode: isolated_os_service_principal
  interactive_user_relation: distinct_os_security_principal
  same_interactive_user_daemon_allowed: false
  listener_before_principal_verification: forbidden
  service_install_authority: signed_nimi_installer_only
  service_update_authority: signed_runtime_release_atomic_service_update_only
  environment_or_argv_override: forbidden
  interactive_app_state_enumeration: forbidden
  boot_security_configuration_authority: signed_service_definition_and_signed_release_descriptor_only
  mutable_product_configuration_authority: typed_protected_desktop_control_write_to_service_owned_state_only
  lifecycle_operation_transaction: validate_bindings_consume_idempotency_key_create_operation_atomic_database_commit
  ordinary_session_or_lifecycle_row_hmac_chain: forbidden
  unavailable_disposition: fail_closed_before_custody_or_listener
desktop_service_control:
  status_authority: os_service_manager_and_verified_runtime_control
  start_or_restart_authority: typed_os_service_control_gateway
  operations: [status, start, restart]
  product_stop_operation: absent
  desktop_direct_spawn: forbidden
  desktop_direct_stop: forbidden
  desktop_quit_disposition: service_remains_running
  release_staging_authority: signed_installer_service_updater
  runtime_binary_selection_by_desktop: forbidden
  common_response_fields: [state, release_id, reason_code, retryable]
  state_values: [stopped, start_pending, running, restart_pending, unavailable]
service_acceptance_contract:
  service_owned_candidate_root: required
  candidate_binding_source: signed_installer_or_service_owned_acceptance_manifest
  environment_or_argv_root_selection: forbidden
  candidate_id_in_app_or_renderer: forbidden
  cleanup: service_owned_candidate_cleanup_after_all_leases_sessions_and_jobs_end
  test_only_service_principal: forbidden
platform_admission:
  closeout_unit: os_platform
  windows: admitted_fixed_service_principal
  linux: requirements_only_fail_closed_pending_native_admission
  macos: requirements_only_fail_closed_pending_native_admission
  unadmitted_platform_disposition: fail_closed
  cross_platform_parity_required_before_first_platform_positive_chain: false
account_partition_source: verified_interactive_os_principal_and_login_session
non_product_same_user_fixture:
  allowed: false
profile_schema:
  fields:
    - os
    - admission
    - production_principal
    - interactive_user_relation
    - service_manager
    - service_installation
    - protected_state_location
    - account_partition_derivation
    - process_isolation
    - principal_constraints
    - principal_selection
    - service_control
    - acceptance_isolation
    - source_rule
profiles:
  - os: windows
    admission: admitted_fixed_service_principal
    production_principal: LocalSystem_token_user_with_restricted_NT_SERVICE_NimiRuntime_authorization_principal
    interactive_user_relation: distinct_os_security_principal
    service_manager: windows_service_control_manager
    service_installation: signed_installer_creates_fixed_local_system_host_with_restricted_windows_service_sid_no_interactive_logon
    protected_state_location: FOLDERID_ProgramData_plus_Nimi_Runtime_Protected
    account_partition_derivation: verified_pipe_client_user_sid_and_logon_luid
    process_isolation: service_process_dacl_denies_interactive_sensitive_rights_and_allows_only_sync_query_limited_read_control_for_mutual_runtime_verification
    principal_constraints:
      scm_account: LocalSystem
      token_user_sid: S-1-5-18
      state_acl_scope: exact_restricted_service_sid_only
      process_dacl_scope: service_sid_full_authority_interactive_read_only_sync_query_limited_read_control
      process_mandatory_label_scope: system_integrity_no_write_up_only_read_control_remains_available_for_mutual_verification
      process_token_dacl_scope: service_sid_full_authority_interactive_token_query_read_control_only
      process_token_mandatory_label_scope: system_integrity_no_write_up_only_token_query_remains_available_for_mutual_verification
      active_logon_query_authority: local_system_required_for_cross_session_WTSSessionInfo_and_exact_LSA_logon_record
      system_or_administrator_compromise: outside_current_threat_boundary
    principal_selection:
      authority_status: admitted
      selected_profile: local_system_host_with_restricted_service_sid
      rationale: exact_active_logon_bootstrap_without_interactive_user_token_retention_requires_LocalSystem_host
    service_control:
      service_name: NimiRuntime
      status_semantics: scm_query_status_then_verified_runtime_health_when_running
      start_semantics: scm_start_fixed_service_name_without_binary_path_or_arguments
      restart_semantics: runtime_self_exit_then_scm_recovery_start_and_new_boot_epoch_verification
      desktop_scm_access: [SERVICE_QUERY_STATUS, SERVICE_START]
      desktop_scm_stop_access: forbidden
      service_binary_path_or_arguments_input: forbidden
      running_success_requirement: verified_new_or_existing_runtime_process_and_protected_handshake
      restart_success_requirement: new_pid_creation_marker_and_runtime_boot_epoch_verified
      hung_runtime_recovery: signed_installer_service_updater_or_administrator_only
    acceptance_isolation:
      service_name: NimiRuntime
      service_principal: same_production_local_system_and_restricted_service_sid
      candidate_root_acl: restricted_service_sid_only
      account_partition: verified_interactive_sid
      runtime_lifecycle_and_restart: real_scm_service
      parallel_isolation: candidate_namespace_for_state_audit_and_child_pipes
    source_rule: K-PLOCAL-007
  - os: linux
    admission: requirements_only_fail_closed_pending_native_admission
    production_principal: dedicated_nimi_runtime_system_uid
    interactive_user_relation: distinct_os_security_principal
    service_manager: systemd_system_service_manager
    service_installation: signed_package_creates_systemd_system_service_with_no_login_uid
    protected_state_location: dedicated_runtime_system_uid_owned_protected_state_selected_by_signed_package
    account_partition_derivation: verified_so_peercred_uid_and_login_session
    process_isolation: systemd_protect_proc_invisible_no_new_privileges_protect_system_strict_private_tmp
    principal_constraints:
      login_capability: forbidden
      protected_state_owner: dedicated_nimi_runtime_system_uid
      interactive_process_access: verification_only
    principal_selection:
      authority_status: requirements_only
      selected_profile: dedicated_non_login_system_uid
    service_control:
      status_semantics: systemd_unit_state_then_verified_runtime_health_when_running
      start_semantics: fixed_signed_system_unit_without_exec_or_argument_selection
      restart_semantics: runtime_self_exit_then_systemd_restart_and_new_boot_epoch_verification
      implementation_status: requirements_only
    acceptance_isolation:
      service_principal: same_production_dedicated_system_uid
      candidate_root_acl: dedicated_runtime_uid_only
      account_partition: verified_interactive_uid_and_login_session
      runtime_lifecycle_and_restart: real_systemd_system_service
      parallel_isolation: candidate_namespace_for_state_audit_and_child_sockets
    source_rule: K-PLOCAL-007
  - os: macos
    admission: requirements_only_fail_closed_pending_native_admission
    production_principal: dedicated_non_login__nimiruntime_launchd_system_daemon_principal
    interactive_user_relation: distinct_os_security_principal
    service_manager: launchd_system_domain
    service_installation: signed_Developer_ID_installer_provisions__nimiruntime_and_SMAppService_registers_notarized_Contents_Library_LaunchDaemons_ai.nimi.runtime.plist_subject_to_explicit_admin_approval
    protected_state_location: installer_fixed_root_owned_nonwritable_/Library/Application_Support/Nimi/Runtime_boundary_with__nimiruntime_owned_mode_0700_state_child
    account_partition_derivation: verified_audit_token_euid_and_audit_session
    process_isolation: hardened_runtime_library_validation_and_task_for_pid_denial
    principal_constraints:
      launch_domain: system
      account_name: _nimiruntime
      account_uid_gid_class: dedicated_equal_local_system_id_in_200_through_499
      login_shell: /usr/bin/false
      home_directory: /var/empty
      password_authentication: disabled
      directory_service_hidden: true
      supplementary_groups: none_InitGroups_false
      protected_state_owner: root_for_installation_boundary_and_dedicated__nimiruntime_uid_for_exact_state_child
      service_definition_authority: signed_notarized_/Applications/Nimi.app_SMAppService_registration_only
      interactive_process_access: verification_only
    principal_selection:
      authority_status: requirements_only
      selected_profile: dedicated_non_login__nimiruntime_uid_with_launchd_system_job_ai.nimi.runtime
    service_control:
      status_semantics: SMAppService_registration_and_approval_status_then_launchd_system_job_pid_then_mutually_verified_runtime_health
      start_semantics: fixed_SMAppService_registered_daemon_only_without_program_path_argument_or_environment_selection
      restart_semantics: runtime_self_exit_then_launchd_restart_and_new_boot_epoch_verification
      implementation_status: requirements_only
    acceptance_isolation:
      service_principal: same_production_dedicated__nimiruntime_principal
      candidate_root_acl: dedicated__nimiruntime_uid_only
      account_partition: verified_interactive_euid_and_audit_session
      runtime_lifecycle_and_restart: real_launchd_system_daemon
      parallel_isolation: candidate_namespace_for_state_audit_and_child_sockets
    source_rule: K-PLOCAL-007
