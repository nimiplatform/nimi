  ordinary_candidate_update_preserves_state_lineage: true
  environment_or_argv_root_selection: forbidden
  candidate_id_in_app_or_renderer: forbidden
  cleanup: service_owned_candidate_cleanup_after_all_leases_sessions_and_jobs_end
  test_only_service_principal: forbidden
platform_admission:
  closeout_unit: os_platform
  windows: admitted_fixed_service_principal
  linux: requirements_only_fail_closed_pending_native_admission
  macos: requirements_only_fail_closed_pending_native_admission
