version: 1
table_family: protocol_surface
owner: runtime
protocol_id: runtime_multimodal_canonical_fields
surfaces:
  - app_id
  - target_ref
  - prompt
  - negative_prompt
  - reference_images
  - mask
  - mode
  - content[].type
  - content[].role
  - content[].text
  - content[].image_url
  - content[].video_url
  - content[].audio_url
  - options.resolution
  - options.ratio
  - options.duration_sec
  - options.frames
  - options.fps
  - options.seed
  - options.camera_fixed
  - options.watermark
  - options.generate_audio
  - options.draft
  - options.service_tier
  - options.execution_expires_after_sec
  - options.return_last_frame
  - voice_ref
  - voice_asset_target_ref
  - timing_mode
  - voice_render_hints.stability
  - voice_render_hints.similarity_boost
  - voice_render_hints.style
  - voice_render_hints.use_speaker_boost
  - voice_render_hints.speed
  - workflow_type
  - voice_clone.reference_audio_uri
  - voice_clone.reference_audio_bytes
  - voice_clone.reference_audio_mime
  - voice_clone.text
  - voice_design.instruction_text
  - voice_design.preview_text
  - voice_design.language
  - audio_source
fields:
  - modality: common
    field: app_id
    required: true
    description: caller application identity
    source_rule: K-MMPROV-001
  - modality: common
    field: target_ref
    required: true
    description: v2 Runtime durable target ref or resolved binding input
    source_rule: K-RTARGET-008
  - modality: image
    field: prompt
    required: true
    description: image prompt text
    source_rule: K-MMPROV-002
  - modality: image
    field: negative_prompt
    required: false
    description: optional negative prompt text
    source_rule: K-MMPROV-002
  - modality: image
    field: reference_images
    required: false
    description: optional i2i reference image inputs
    source_rule: K-MMPROV-016
  - modality: image
    field: mask
    required: false
    description: optional inpaint mask source
    source_rule: K-MMPROV-002
  - modality: video
    field: mode
    required: true
    description: video generation mode selector (t2v or i2v variants)
    source_rule: K-MMPROV-024
  - modality: video
    field: content[].type
    required: true
    description: content item type (text, image_url, video_url, or audio_url)
    source_rule: K-MMPROV-024
  - modality: video
    field: content[].role
    required: true
    description: content role (prompt/first_frame/last_frame/reference_image/reference_video/reference_audio) constrained by mode and model capability
    source_rule: K-MMPROV-024
  - modality: video
    field: content[].text
    required: false
    description: prompt text content when type=text
    source_rule: K-MMPROV-024
  - modality: video
    field: content[].image_url
    required: false
    description: image URL payload when type=image_url
    source_rule: K-MMPROV-024
  - modality: video
    field: content[].video_url
    required: false
    description: reference video URL payload when type=video_url
    source_rule: K-MMPROV-024
  - modality: video
    field: content[].audio_url
    required: false
    description: reference audio URL payload when type=audio_url
    source_rule: K-MMPROV-024
  - modality: video
    field: options.resolution
    required: false
    description: requested output resolution constrained by model capability matrix
    source_rule: K-MMPROV-025
  - modality: video
    field: options.ratio
    required: false
    description: requested output ratio constrained by model capability matrix
    source_rule: K-MMPROV-025
  - modality: video
    field: options.duration_sec
    required: false
    description: requested video duration
    source_rule: K-MMPROV-025
  - modality: video
    field: options.frames
    required: false
    description: requested output frame count (mutually exclusive with duration_sec)
    source_rule: K-MMPROV-025
  - modality: video
    field: options.fps
    required: false
    description: requested frame rate
    source_rule: K-MMPROV-025
  - modality: video
    field: options.seed
    required: false
    description: deterministic seed in range [-1, 4294967295]
    source_rule: K-MMPROV-025
  - modality: video
    field: options.camera_fixed
    required: false
    description: fixed-camera toggle (forbidden in i2v_reference mode)
    source_rule: K-MMPROV-025
  - modality: video
    field: options.watermark
    required: false
    description: watermark toggle
    source_rule: K-MMPROV-025
  - modality: video
    field: options.generate_audio
    required: false
    description: generate synchronized audio when provider supports it
    source_rule: K-MMPROV-025
  - modality: video
    field: options.draft
    required: false
    description: provider-specific draft/fast generation switch
    source_rule: K-MMPROV-025
  - modality: video
    field: options.service_tier
    required: false
    description: provider service tier selector
    source_rule: K-MMPROV-025
  - modality: video
    field: options.execution_expires_after_sec
    required: false
    description: max execution age before provider auto-expire
    source_rule: K-MMPROV-025
  - modality: video
    field: options.return_last_frame
    required: false
    description: request final frame output alongside video artifact
    source_rule: K-MMPROV-025
  - modality: tts
    field: voice_ref
    required: true
    description: strongly-typed synthesis voice reference
    source_rule: K-MMPROV-018
  - modality: tts
    field: voice_asset_target_ref
    required: false
    description: v2 voice asset compatibility target ref; not durable model identity
    source_rule: K-RTARGET-008
  - modality: tts
    field: timing_mode
    required: false
    description: synthesis alignment mode hint (none|word|char)
    source_rule: K-MMPROV-021
  - modality: tts
    field: voice_render_hints.stability
    required: false
    description: optional voice render stability hint
    source_rule: K-MMPROV-021
  - modality: tts
    field: voice_render_hints.similarity_boost
    required: false
    description: optional voice render similarity boost hint
    source_rule: K-MMPROV-021
  - modality: tts
    field: voice_render_hints.style
    required: false
    description: optional voice render style hint
    source_rule: K-MMPROV-021
  - modality: tts
    field: voice_render_hints.use_speaker_boost
    required: false
    description: optional voice render speaker boost toggle
    source_rule: K-MMPROV-021
  - modality: tts
    field: voice_render_hints.speed
    required: false
    description: optional provider-side render speed hint
    source_rule: K-MMPROV-021
  - modality: voice
    field: workflow_type
    required: true
    description: voice workflow selector (voice_clone or voice_design)
    source_rule: K-VOICE-002
  - modality: voice
    field: voice_asset_target_ref
    required: true
    description: v2 voice asset compatibility target ref; not durable model identity
    source_rule: K-RTARGET-008
  - modality: voice
    field: voice_clone.reference_audio_uri
    required: false
    description: optional remote audio input for voice_clone create voice
    source_rule: K-MMPROV-019
  - modality: voice
    field: voice_clone.reference_audio_bytes
    required: false
    description: optional inline audio input for voice_clone create voice
    source_rule: K-MMPROV-019
  - modality: voice
    field: voice_clone.reference_audio_mime
    required: false
    description: reference audio mime type for voice_clone
    source_rule: K-MMPROV-019
  - modality: voice
    field: voice_clone.text
    required: false
    description: optional transcript or text description of the reference audio for voice_clone
    source_rule: K-MMPROV-019
  - modality: voice
    field: voice_design.instruction_text
    required: false
    description: voice design instruction text for voice_design
    source_rule: K-MMPROV-019
  - modality: voice
    field: voice_design.preview_text
    required: false
    description: optional preview synthesis text for voice_design
    source_rule: K-MMPROV-019
  - modality: voice
    field: voice_design.language
    required: false
    description: optional language hint for voice_design design
    source_rule: K-MMPROV-019
  - modality: stt
    field: audio_source
    required: true
    description: transcription audio input
    source_rule: K-MMPROV-005
