version: 1
source_rules:
  - K-ACCSVC-018
  - K-ACCSVC-019
  - K-BIND-016
  - K-BIND-017
  - K-BIND-018
  - K-BIND-019
  - K-BIND-020
  - K-BIND-021
  - K-BIND-022
  - K-BIND-023
purpose: workspace.knowledge.consume
relation_fields:
  - name: binding_id
    requirement: required
    authority: runtime_issued
  - name: runtime_app_id
    requirement: required
    authority: runtime_authenticated_caller
  - name: app_instance_id
    requirement: required
    authority: runtime_authenticated_caller
  - name: device_id
    requirement: required
    authority: runtime_device_projection
  - name: account_id
    requirement: required
    authority: runtime_account_custody_projection
  - name: realm_environment_id
    requirement: required
    authority: runtime_account_projection
  - name: workspace_id
    requirement: required
    authority: realm_owned_membership_projection
  - name: purpose
    requirement: required
    value: workspace.knowledge.consume
  - name: scopes
    requirement: non_empty_subset
    authority: runtime_knowledge_scope_vocabulary
  - name: issued_at
    requirement: required
  - name: expires_at
    requirement: required
  - name: state
    requirement: required
  - name: reason_code
    requirement: required_on_non_allow
attachment_fields:
  allowed:
    - binding_id
    - binding_handle
    - runtime_app_id
    - app_instance_id
    - workspace_id
    - realm_environment_id
  forbidden:
    - account_id
    - device_id
    - subject_user_id
    - realm_access_token
    - realm_refresh_token
    - runtime_app_session_token
    - raw_jwt
    - decoded_subject
    - membership_proof
decisions:
  - ALLOW
  - DENY_MISSING_ATTACHMENT
  - DENY_MALFORMED_ATTACHMENT
  - DENY_NOT_FOUND
  - DENY_REVOKED
  - DENY_EXPIRED
  - DENY_REPLAY
  - DENY_ACCOUNT_UNAVAILABLE
  - DENY_CALLER_MISMATCH
  - DENY_WORKSPACE_MISMATCH
  - DENY_ENV_MISMATCH
  - DENY_DEVICE_MISMATCH
  - DENY_SCOPE_MISSING
revoke_triggers:
  - logout
  - account_switch
  - membership_loss
  - realm_environment_change
  - custody_unavailable
  - refresh_failure
  - reauth_required
  - account_expired
  - device_mismatch
  - scope_changed
  - replay_detected
  - policy_revoked
  - daemon_restart_no_recovery
