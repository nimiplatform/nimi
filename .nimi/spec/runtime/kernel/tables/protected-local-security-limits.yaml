version: 2
table_family: protocol_surface
owner: runtime
protocol_id: runtime_protected_local_security_limits
surfaces: [endpoint-handshake, protected-frame-bytes, desktop-sessions-per-process, lifecycle-idempotency-retention, boot-epoch-bytes]
entries:
  - endpoint-handshake
  - protected-frame-bytes
  - desktop-sessions-per-process
  - lifecycle-idempotency-retention
  - boot-epoch-bytes
description: Closed hard bounds for protected-local handshakes, connection-bound sessions and transactional lifecycle idempotency.
authority_refs: [K-PLOCAL-003, K-PLOCAL-006, K-PLOCAL-007]
bound_kind_enum: [exact, minimum, maximum, exact_enum]
limit_schema:
  fields:
    - limit_id
    - default
    - hard_bound
    - bound_kind
    - exact
    - minimum
    - maximum
    - unit
    - scope
    - enforcement_clock
    - restart_semantics
    - source_rule
  null_policy: non_selected_bound_fields_must_be_explicit_null
limits:
  - limit_id: endpoint-handshake
    default: 5
    hard_bound: 10
    bound_kind: maximum
    exact: null
    minimum: null
    maximum: 10
    unit: seconds
    scope: connection
    enforcement_clock: monotonic
    restart_semantics: restart_deadline
    source_rule: K-PLOCAL-003
  - limit_id: protected-frame-bytes
    default: 4096
    hard_bound: 16384
    bound_kind: maximum
    exact: null
    minimum: null
    maximum: 16384
    unit: bytes
    scope: handshake_frame
    enforcement_clock: not_applicable
    restart_semantics: unchanged
    source_rule: K-PLOCAL-003
  - limit_id: desktop-sessions-per-process
    default: 1
    hard_bound: 1
    bound_kind: exact
    exact: 1
    minimum: null
    maximum: null
    unit: session
    scope: canonical_process_tuple
    enforcement_clock: monotonic
    restart_semantics: revoke_on_restart
    source_rule: K-PLOCAL-006
  - limit_id: lifecycle-idempotency-retention
    default: 7
    hard_bound: 1
    bound_kind: minimum
    exact: null
    minimum: 1
    maximum: null
    unit: days
    scope: service_owned_transaction_database
    enforcement_clock: wall_clock_rollback_may_only_extend
    restart_semantics: retained
    source_rule: K-PLOCAL-007
  - limit_id: boot-epoch-bytes
    default: 32
    hard_bound: 32
    bound_kind: exact
    exact: 32
    minimum: null
    maximum: null
    unit: bytes
    scope: runtime_start
    enforcement_clock: not_applicable
    restart_semantics: regenerate_csprng
    source_rule: K-PLOCAL-007
deadline_semantics:
  live_deadline_clock: monotonic
  wall_clock_rollback_effect: retention_may_only_extend
  source_rule: K-PLOCAL-007
