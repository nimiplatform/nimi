format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.ai-provider
units:
  - id: definition.nimi.runtime.ai-provider.profile-execution-plane
    kind: definition
    lifecycle: removed
    title: Retired Runtime AI Profile execution plane
    reason: Removed because Profile prepare, materialization, readiness, apply eligibility, and execution binding are no longer one product workflow.
  - id: definition.nimi.runtime.ai-provider.capability-execution-composition-plane
    kind: definition
    title: Runtime capability execution composition plane
    meaning: The Runtime capability execution composition plane deterministically composes one committed AIConfig route with the current machine-selected Local Capability Configuration or committed Cloud CapabilityImplementation target plus the internally resolved current-account Connector, validates exact Driver configuration, ownership, credential, policy, bindings and standardized-feature support, derives request admission, and captures immutable Job inputs without App-supplied Connector identity, Profile materialization, search, ranking, probe, prewarm, or fallback.
    relations:
      - type: supersedes
        target: definition.nimi.runtime.ai-provider.profile-execution-plane
  - id: definition.nimi.runtime.ai-provider.connector-plane
    kind: definition
    title: Runtime connector plane
    meaning: The Runtime connector plane is credential custody and account-ownership support whose create, update, delete and listing lifecycle stores provider-defined sealed payloads and whose user-explicit bounded Test Connector diagnostic never establishes route, target, binding, readiness, or execution truth; Cloud execution validates the resolved current-account Connector directly through ownership, App Capability access, credential validity, and existing policy.
  - id: definition.nimi.runtime.ai-provider.model-service-plane
    kind: definition
    title: Runtime model service plane
    meaning: The Runtime model service plane provides concrete LocalAsset inventory, verified-content descriptors, install and transfer truth, and non-binding implementation or asset recommendations without owning public model health, warm, readiness, preferred or fallback engine, Local Capability Configuration, binding, machine selection, or routing truth.
  - id: definition.nimi.runtime.ai-provider.multimodal-provider-plane
    kind: definition
    title: Runtime multimodal provider plane
    meaning: The Runtime multimodal provider plane defines canonical CapabilityContract request and artifact semantics, CapabilityImplementationDriver obligations, Runtime-private Local ExecutionHost protocols, realtime session boundaries, standardized-feature support, and typed stable Job outputs without conflating Driver and ExecutionHost or selecting routes.
  - id: definition.nimi.runtime.ai-provider.voxcpm-family
    kind: definition
    title: Canonical VoxCPM capability family
    meaning: The canonical machine-readable VoxCPM family is voxcpm, one Runtime product family for the audio.synthesize CapabilityContract whose standard Python and MLX execution backends are Runtime-private implementation details rather than separate public families, capabilities, implementations, Drivers, providers, or routes; the first release includes no voice.create, voice cloning, or voice-design capability.
  - id: definition.nimi.runtime.ai-provider.nimillm-plane
    kind: definition
    title: Runtime nimillm plane
    meaning: The Runtime nimillm plane is a Cloud CapabilityImplementationDriver family that maps exact committed implementation and provider-model target configuration plus request-scoped Runtime-resolved current-account Connector credential context into provider wire formats and normalizes responses and errors, while Remote ExecutionHost owns transport and remote Job lifecycle and Connector custody stays separate.
  - id: definition.nimi.runtime.ai-provider.provider-health-plane
    kind: definition
    lifecycle: removed
    title: Retired Runtime provider health plane
    reason: Removed because periodic provider reachability, product health state machines, and probe-derived readiness are not execution authority.
  - id: definition.nimi.runtime.ai-provider.remote-execution-host-plane
    kind: definition
    title: Runtime Remote ExecutionHost plane
    meaning: The Runtime Remote ExecutionHost plane owns remote transport and remote Job lifecycle plus Runtime-private process and transport supervision; it consumes exact Driver output and request-scoped authorization and never exposes provider readiness, selects a route, or tests connection as an execution prerequisite.
    relations:
      - type: supersedes
        target: definition.nimi.runtime.ai-provider.provider-health-plane
  - id: rule.nimi.runtime.ai-provider.r001
    kind: rule
    title: Exact committed composition is the execution boundary
    modality: must
    statement: Runtime independently validates the committed AIConfig owner and CapabilityContract route, then for Local the current selected Local Capability Configuration, exact CapabilityImplementation, Driver identity and portable configuration, normalized requirements, exact bindings and required standardized features, or for ordinary same-account Cloud the exact CapabilityImplementation, Driver-owned provider-model target, internally resolved current-account Connector, credential configuration, App Capability access, applicable policy, and required features, before one request is admitted and captured as a Job.
    condition: Whenever a CapabilityContract request enters execution composition.
    failure: Reject Job submission with the typed admission reason until every exact required input is valid.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.capability-execution-composition-plane
  - id: rule.nimi.runtime.ai-provider.r002
    kind: rule
    title: AIProfile excludes machine account and execution evidence
    modality: must_not
    statement: AIProfile contains canonical AIConfig owner identity, Local Capability Configuration identity, machine selection, LocalAsset id or path, exact binding, connector or account identity, secret, Runtime process identity, selected-source evidence, install result, materialization record, Job input, provider health, or scheduler state; only portable AIConfig intent, local implementation-configuration intent, Cloud implementation-target recommendation, features, defaults, provenance, and license are admitted.
    condition: Whenever Runtime imports or validates an AIProfile.
    failure: Reject the Profile with a typed forbidden non-portable field failure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.capability-execution-composition-plane
  - id: rule.nimi.runtime.ai-provider.r003
    kind: rule
    title: Profile actions and execution composition stay separate
    modality: must
    statement: Import Profile changes only portable Profile storage, Apply Profile to AIConfig atomically creates or overwrites only owner intent, Add or Update Local Capability Configuration changes only one saved machine-local record, and Select Local Capability Configuration changes only the machine selection relation; Runtime-private selected-source, process, transport, admission, and Job evidence never enters Profile, AIConfig, Local Capability Configuration portable fields, or selection and no action automatically invokes another.
    condition: Whenever a Profile, configuration, selection, or execution action produces output.
    failure: Reject cross-action side effects and persistence of Runtime-private evidence in product configuration.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.capability-execution-composition-plane
  - id: rule.nimi.runtime.ai-provider.r004
    kind: rule
    title: Configuration and selection actions never probe or prewarm
    modality: must_not
    statement: Apply Profile to AIConfig, Add or Update Local Capability Configuration, and Select Local Capability Configuration invokes or requires route probes, resource feasibility probes, endpoint reachability, engine health, warm or resident state, file-name inference, prior execution success, installation, or process start; Apply may save unresolved Local intent or Cloud intent without a current-account Connector, and selection requires only currently interpretable and configured local state.
    condition: Whenever a configuration or selection action is evaluated.
    failure: Perform only the requested owner mutation and leave exact admission and Host preparation to Job submission and execution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.capability-execution-composition-plane
  - id: rule.nimi.runtime.ai-provider.r005
    kind: rule
    title: Implementation Driver and dialect mismatches fail closed
    modality: must
    statement: Runtime consumes the exact committed CapabilityImplementation, CapabilityImplementationDriver and dialect identity plus Driver-owned portable configuration as validation inputs rather than resolver hints; for Local text execution an omitted Driver context-size field selects the Driver-owned automatic capacity derived from the exact bound model's authored capacity while an explicit positive context-size field is a fixed advanced override stored only on that Local Capability Configuration and never changes omitted-field automatic semantics for any other saved configuration, and any unknown implementation, Driver, dialect, configuration, authored capacity, requirement projection, binding, or feature mismatch fails closed without adapter inference, engine substitution, or fallback.
    condition: Whenever Runtime interprets a committed Local or Cloud implementation configuration.
    failure: Return the typed admission reason without guessing capacity or inferring or substituting implementation, Driver, dialect, engine, or target.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.capability-execution-composition-plane
  - id: rule.nimi.runtime.ai-provider.r006
    kind: rule
    title: Jobs fix exact effective inputs at submission
    modality: must
    statement: Every execution or Job submission captures for Local the AIConfig Local route, required features and defaults, current selected Local Capability Configuration, exact CapabilityImplementation, Driver configuration, exact bindings and request, or for Cloud the exact CapabilityImplementation, provider-model target, internally resolved current-account Connector custody reference, defaults and request; all captured inputs are immutable under later Profile, AIConfig, local configuration, machine selection, Connector, inventory, or process changes and are written to the Job audit trail without raw secrets.
    condition: Whenever Runtime executes or submits an AI scenario.
    failure: Reject execution evidence that is missing, mutable after fixation, or absent from audit.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.capability-execution-composition-plane
  - id: rule.nimi.runtime.ai-provider.r007
    kind: rule
    title: Scheduling evidence is Job specific and non-authoritative
    modality: must
    statement: Any scheduling judgement recorded for a Job corresponds only to the exact captured execution inputs about to run, never a scope or owner aggregate, and remains execution evidence that cannot change AIConfig, Machine Local AI Configuration selection, Local Capability Configuration binding, derived admission, or another Job.
    condition: Whenever an execution snapshot records a scheduling judgement.
    failure: Reject a scope aggregate judgement recorded as execution evidence.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.capability-execution-composition-plane
  - id: rule.nimi.runtime.ai-provider.r008
    kind: rule
    title: Runtime holds no global active profile
    modality: must_not
    statement: Runtime maintains a runtime-global active AIProfile or AIConfig, treats Profile import or Apply as a persistent binding or re-apply relation, creates per-Agent AIConfig, or interprets the one shared LocalAgent subsystem AIConfig or one Machine Local AI Configuration as a global Profile.
    condition: Always.
    failure: Reject global-Profile, per-Agent, and live-Profile-binding interpretations and keep canonical owners separate.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.capability-execution-composition-plane
  - id: rule.nimi.runtime.ai-provider.r009
    kind: rule
    title: Memory embedding uses canonical deterministic composition
    modality: must
    statement: Runtime executes committed text.embed intent through the same AIConfig route and exact Local machine-selected configuration or Cloud implementation-target plus internally resolved current-account Connector composition as any CapabilityContract, never searches inventory or creates a resolved embedding Profile, and leaves the separately owned Memory bank with its binding and cutover truth.
    condition: Whenever Runtime resolves a committed memory embedding intent.
    failure: Return a fail-close result without silently falling back to another connector, provider, or local default embedding target.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.capability-execution-composition-plane
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.connector-plane
  - id: rule.nimi.runtime.ai-provider.r010
    kind: rule
    lifecycle: removed
    title: First-run execution evidence is real local proof
    reason: First-run admission now consumes current Runtime materialization and activation-gate state and no longer executes capabilities to mint a durable readiness proof.
  - id: rule.nimi.runtime.ai-provider.r011
    kind: rule
    lifecycle: removed
    title: Retired Profile Apply eligibility lifecycle
    reason: Removed because Apply validates and atomically writes AIConfig intent without inventory, requirement, binding, grant, feasibility, or readiness gating.
  - id: rule.nimi.runtime.ai-provider.r012
    kind: rule
    lifecycle: removed
    title: Retired Profile prepare and materialization path
    reason: Removed because Apply Profile to AIConfig never installs, prepares, binds, selects, probes, warms, or activates local execution dependencies.
  - id: rule.nimi.runtime.ai-provider.r013
    kind: rule
    title: Configuration admission and execution states are orthogonal
    modality: must
    statement: CapabilityImplementation interpretability, normalized requirement resolution, Machine Local AI Configuration selection, derived request admission, Job execution, LocalAsset content integrity, current-account Connector ownership and credential validation, and Runtime-private Host supervision remain separate facts; ordinary Driver, load, generation, provider, transport, scheduling, or execution failure ends the affected Job and never clears a binding, changes selection, route, or Connector, or mutates configuration, and when the Driver classifies a persistent hard blocker Runtime may additionally update only the future derived-admission reason while preserving every AIConfig, Local Capability Configuration, exact binding, machine selection, private custody reference, and immutable Job input.
    condition: Whenever Runtime records or projects configuration, admission, or execution failure.
    failure: Preserve orthogonal owner state and reject a combined readiness or Profile workflow lifecycle, execution-driven configuration, binding, selection, or route mutation, or any persistent-blocker effect beyond the derived-admission reason.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.capability-execution-composition-plane
  - id: rule.nimi.runtime.ai-provider.r014
    kind: rule
    title: Configuration selection Job and private source identities stay distinct
    modality: must
    statement: AIProfile portable intent, canonical App or shared LocalAgent AIConfig intent, one Machine Local AI Configuration, each saved Local Capability Configuration, LocalAsset verified-content identity, Runtime-private selected-source dependency evidence, private ExecutionHost process identity, and immutable Job identity remain distinct, and neither execution nor private source identity enters Profile, AIConfig, local configuration identity, or machine selection.
    condition: Whenever media generation identities are created, stored, or projected.
    failure: Reject identity leakage across the split or into portable payloads.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.capability-execution-composition-plane
  - id: rule.nimi.runtime.ai-provider.r015
    kind: rule
    title: Execution caches derive only from captured exact inputs
    modality: must
    statement: A Runtime-private execution cache key derives from the Job's captured exact CapabilityImplementation, Driver identity and portable configuration, standardized features, normalized requirement occurrences, exact bindings, defaults, request semantics, and relevant Host compatibility version; Profile identity, current inventory, current machine selection, mutable paths, or main asset identity alone never becomes execution authority or a product revision.
    condition: Whenever Runtime derives cache identity for capability execution.
    failure: Reject cache reuse keyed on incomplete or mutable semantic dimensions.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.capability-execution-composition-plane
  - id: rule.nimi.runtime.ai-provider.r016
    kind: rule
    title: Future media workflows keep first-class shapes
    modality: must
    statement: Each admitted CapabilityImplementation keeps first-class Driver-owned portable configuration and independently projected normalized resource-occurrence requirements, image and video contracts remain semantically distinct, no Core cross-engine option union or Nimi DAG IR is introduced, unresolved slots may persist in a Local Capability Configuration, and Driver and ExecutionHost identities remain distinct rather than public engine target inference.
    condition: Whenever Runtime admits or projects future local media workflow shapes.
    failure: Reject collapsed media shapes and public exposure of internal backend taxonomy.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.capability-execution-composition-plane
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r017
    kind: rule
    title: Create validates admitted auth shapes
    modality: must
    statement: CreateConnector validates required custody fields, injects only the default display label and initial authorization status, requires api_key and forbids provider_auth_profile and credential_json for auth_kind API_KEY, requires an authenticated caller plus provider_auth_profile and credential_json and forbids api_key for auth_kind OAUTH_MANAGED, and infers an omitted auth_kind as OAUTH_MANAGED when credential_json is present and as API_KEY otherwise; a Connector stores no ExecutionHost endpoint or route target.
    condition: Whenever ConnectorService creates a connector.
    failure: Reject creation requests that violate the admitted auth shape for the selected or inferred auth kind.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.connector-plane
  - id: rule.nimi.runtime.ai-provider.r018
    kind: rule
    title: Auth profiles come from the admitted registry
    modality: must
    statement: provider_auth_profile is never a free string, belongs only to the admitted connector auth profile registry, and stays compatible with the connector provider on create and on update.
    condition: Whenever a connector carries or changes provider_auth_profile.
    failure: Reject undeclared or provider-incompatible auth profiles.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.connector-plane
  - id: rule.nimi.runtime.ai-provider.r019
    kind: rule
    title: System connectors are injected and read only
    modality: must
    statement: The system owner identity is reserved for connectors injected from runtime configuration or environment, cannot be declared through an RPC request body, and system-managed remote connectors remain immutable and undeletable.
    condition: Whenever a request creates, updates, or deletes a system-managed connector identity.
    failure: Reject request-body system ownership claims and every mutation of a system-managed connector.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.connector-plane
  - id: rule.nimi.runtime.ai-provider.r020
    kind: rule
    title: Update keeps coherent auth state
    modality: must
    statement: UpdateConnector validates the mutable custody field set, invalidates authorization caches when credentials or auth profile change, keeps API_KEY patches free of provider_auth_profile, keeps OAUTH_MANAGED connectors holding a provider_auth_profile, never accepts api_key and credential_json in one patch, requires an auth-kind switch to supply the target shape credential explicitly without implicit conversion, and never accepts or changes an ExecutionHost endpoint or route target.
    condition: Whenever ConnectorService updates a connector.
    failure: Reject patches that produce an incoherent auth state or rely on implicit credential conversion.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.connector-plane
  - id: rule.nimi.runtime.ai-provider.r021
    kind: rule
    title: Update patch semantics are closed
    modality: must
    statement: update_mask paths admit only label, api_key, status, auth_kind, provider_auth_profile, and credential_json, an empty mask derives effective paths from explicitly present optional fields and a non-unspecified status, underivable, unknown, endpoint-bearing, or declared-but-absent paths return INVALID_ARGUMENT with AI_CONNECTOR_INVALID, and fields outside the effective paths stay unchanged without implicit full overwrite.
    condition: Whenever UpdateConnectorRequest patch semantics are evaluated.
    failure: Return INVALID_ARGUMENT with AI_CONNECTOR_INVALID instead of implicit or partial-unknown patching.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.connector-plane
  - id: rule.nimi.runtime.ai-provider.r022
    kind: rule
    title: Delete performs compensated cleanup
    modality: must
    statement: DeleteConnector executes cascading cleanup with a recoverable compensation flow, and process startup recovers delete-pending and other intermediate connector states.
    condition: Whenever a connector is deleted or a process restarts with intermediate connector state.
    failure: Recover or complete the compensation instead of leaving torn credential or cache state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.connector-plane
  - id: rule.nimi.runtime.ai-provider.r023
    kind: rule
    title: Concurrent connector mutations stay consistent
    modality: must
    statement: Concurrent connector updates and deletes are protected by consistency guarantees that prevent credential and cache state from tearing.
    condition: Whenever connector mutations race.
    failure: Reject or serialize the racing mutation rather than persisting torn state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.connector-plane
  - id: rule.nimi.runtime.ai-provider.r024
    kind: rule
    title: Connector model listing is snapshot only
    modality: must_not
    statement: ListConnectorModels loads custody secrets, resolves endpoints, calls a provider model list API, performs dynamic discovery, honors force_refresh as anything but a no-op, serves model rows from anywhere except the active catalog snapshot, promotes listing into CapabilityImplementation, Driver target, route, binding, or selection authority, or lets a non-scenario path promote live discovery results to catalog truth.
    condition: Whenever connector model listings are served.
    failure: Serve only the active catalog snapshot and reject discovery or probe semantics on the listing surface.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.connector-plane
  - id: rule.nimi.runtime.ai-provider.r025
    kind: rule
    title: Test Connector is explicit bounded diagnosis only
    modality: must
    statement: Test Connector runs only after an explicit user action, passes owner, custody status, and credential preconditions before its bounded outbound call, and diagnoses connectivity and credential validity without model or voice discovery, catalog warmup, periodic polling, readiness state, AIConfig mutation, route choice, binding, derived admission, or execution prerequisite semantics.
    condition: Whenever TestConnector probes a remote connector.
    failure: Reject probes that skip preconditions or exceed the bounded probe purpose.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.connector-plane
  - id: rule.nimi.runtime.ai-provider.r026
    kind: rule
    title: Connector pagination contract is fixed
    modality: must
    statement: ListConnectorsRequest and ListConnectorModelsRequest carry page_size and page_token, responses return next_page_token with an empty string marking the last page, page_size defaults to 50 with a maximum of 200 clamped to the maximum rather than reset to the default, an empty or missing page_token means the first page, and an invalid token returns INVALID_ARGUMENT with PAGE_TOKEN_INVALID.
    condition: Whenever connector list RPCs paginate.
    failure: Return the exact typed pagination error and never silently change page semantics.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.connector-plane
  - id: rule.nimi.runtime.ai-provider.r027
    kind: rule
    title: Connector owner fields stay frozen
    modality: must_not
    statement: A caller declares connector ownership through the request-body owner_id, which remains frozen as reserved, instead of the server deriving ownership from authenticated identity.
    condition: Whenever a connector request carries ownership information.
    failure: Reject request-body owner declarations and derive ownership only from authenticated identity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.connector-plane
  - id: rule.nimi.runtime.ai-provider.r028
    kind: rule
    title: Connector lifecycle is audited
    modality: must
    statement: Connector create, update, delete, and probe operations write the audit trail.
    condition: Whenever a connector lifecycle operation executes.
    failure: Fail the auditable operation rather than completing without audit evidence.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.connector-plane
  - id: rule.nimi.runtime.ai-provider.r029
    kind: rule
    title: World generation captures exact Runtime-resolved Cloud inputs
    modality: must
    statement: When a Cloud CapabilityImplementation admits world.generate, ordinary same-account Job submission captures the exact implementation, Driver-owned provider-model target, internally resolved current-account Connector custody reference and request, request-scoped credential injection stays with Runtime custody, and provider-returned world asset or viewer URLs never become credential ownership, target selection, or route authority.
    condition: Whenever world generation executes through a managed connector.
    failure: Reject raw provider secrets and URL-derived credential ownership on the world generation path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.connector-plane
  - id: rule.nimi.runtime.ai-provider.r030
    kind: rule
    title: OAuth custody excludes login orchestration
    modality: must_not
    statement: Runtime owns browser or device-code login, refresh orchestration, or token rotation persistence inside the admitted connector scope, or promotes provider-specific sealed payload schemas to proto truth when deriving provider-native execution headers per auth profile.
    condition: Whenever managed OAuth connectors are acquired, probed, or consumed.
    failure: Keep custody-only semantics and return AI_CONNECTOR_CREDENTIAL_MISSING when probe or consume cannot extract an execution token.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.connector-plane
  - id: rule.nimi.runtime.ai-provider.r031
    kind: rule
    title: Profiles and configuration carry no provider secrets
    modality: must_not
    statement: AIProfile, AIConfig, SDK state, Desktop storage, App manifests, or Kit UI state contains raw provider secrets, API keys, tokens, OAuth payloads, credential JSON, authorization headers, provider health evidence, quota, billing, or rate-limit state; AIProfile and AIConfig additionally carry no connector, account, or custody identity, Cloud intent may remain valid when current-account Connector or credential resolution is unavailable, and Cloud configuration carries no LocalAsset, local binding, selected source, or local process evidence.
    condition: Whenever cloud execution intent is declared or projected outside Runtime custody.
    failure: Reject the secret-bearing or cross-plane payload while preserving valid intent and return the existing owner or configuration-required, credential, access-denied, or policy reason when ordinary Cloud execution cannot resolve an allowed current-account Connector path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.capability-execution-composition-plane
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.connector-plane
  - id: rule.nimi.runtime.ai-provider.r032
    kind: rule
    title: Provider identifiers are canonical only
    modality: must
    statement: Connector custody provider values and CapabilityImplementationDriver provider-target configuration admit only canonical implementation and Driver catalog identities, and Create Connector, Test Connector, List Connector Models, AIConfig, and Job validation reject aliases, provider-name inference, and legacy names; no provider health configuration owner exists.
    condition: Whenever an implementation, Driver, target, or custody provider identifier enters configuration or an operation.
    failure: Reject non-canonical provider names at configuration validation and RPC entry.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.connector-plane
  - id: rule.nimi.runtime.ai-provider.r033
    kind: rule
    title: LocalAsset descriptors expose verified content metadata
    modality: must
    statement: A LocalAsset descriptor exposes concrete verified-content identity, version, content-integrity and install state, provenance, display information, artifact roles, host requirements and non-binding CapabilityImplementation recommendation metadata; it exposes no preferred or fallback engine, CapabilityImplementationDriver selection, public health timestamp, bundle readiness, warm or resident state, machine selection, binding, route, or capability readiness truth.
    condition: Whenever Runtime projects a model descriptor.
    failure: Reject descriptors missing required verified-content metadata or carrying routing, selection, binding, readiness, warm, or fallback truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.model-service-plane
  - id: rule.nimi.runtime.ai-provider.r034
    kind: rule
    title: Capability profile is summary not execution truth
    modality: must
    statement: Capability and feature metadata on a LocalAsset remains a non-binding summary, while runnable Local execution is derived only from the committed AIConfig Local route, current machine-selected Local Capability Configuration, exact CapabilityImplementation and Driver configuration, resolved requirement occurrences, exact bindings, required and supported feature subset, request, and authorization; filenames, paths, logical model labels, artifact roles, engine labels, install state, bundle state, warm state, or health never form routing truth.
    condition: Whenever local model capability or path truth is derived.
    failure: Reject path or execution truth derived from the summary profile or from logical_model_id for passive assets.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.model-service-plane
  - id: rule.nimi.runtime.ai-provider.r035
    kind: rule
    title: Model service method set is fixed
    modality: must
    statement: RuntimeModelService exposes passive inventory listing, concrete verified-content installation or pull, removal, and bounded content-integrity diagnostics only; it exposes no public Check Model Health, readiness, warm, start, route resolution, binding, selection, or execution-feasibility operation.
    condition: Whenever the unified model service surface is defined or extended.
    failure: Reject undeclared methods on the unified model service surface.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.model-service-plane
  - id: rule.nimi.runtime.ai-provider.r036
    kind: rule
    title: PullModel contract is fixed
    modality: must
    statement: PullModel requires an authorized owner and concrete asset reference with verifiable source and digest, returns a transfer Job identity and typed acceptance, commits only complete verified LocalAsset content and provenance, and writes no preferred Driver, fallback engine, bundle readiness, warm state, Local Capability Configuration, binding, machine selection, admission, or execution truth.
    condition: Whenever PullModel runs.
    failure: Reject unverifiable or partial content and any installation side effect outside concrete LocalAsset truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.model-service-plane
  - id: rule.nimi.runtime.ai-provider.r037
    kind: rule
    lifecycle: removed
    title: Retired public model health and readiness probe
    reason: Removed because model probe, warm, health, and not-ready state do not establish product routing or capability admission.
  - id: rule.nimi.runtime.ai-provider.r038
    kind: rule
    title: LocalAsset transfer and install status is content scoped
    modality: must
    statement: LocalAsset transfer and install transitions admit only their declared queued, transferring, verifying, installed, failed, canceled, retrying, and removed content lifecycle, and installed proves verified content only rather than CapabilityImplementation interpretability, requirement resolution, machine selection, derived admission, Host residency, health, or Job success.
    condition: Whenever a LocalAsset transfer or install status transition is applied.
    failure: Reject every transition outside the content lifecycle and every promotion of installed into execution readiness.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.model-service-plane
  - id: rule.nimi.runtime.ai-provider.r039
    kind: rule
    title: Unified views sync and lists stay passive
    modality: must
    statement: A successful verified LocalAsset install reflects into the passive inventory view, local asset management consumes RuntimeLocalService authoritative detail directly rather than a second host-owned state, and listing never triggers endpoint probes, Driver or Host bootstrap, warm execution, binding, machine selection, recommendation acceptance, recovery, admission, routing, state transitions, or writes.
    condition: Whenever unified or local model views are read or synchronized.
    failure: Reject side-effecting list reads and second host-owned local state mirrors.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.model-service-plane
  - id: rule.nimi.runtime.ai-provider.r040
    kind: rule
    lifecycle: removed
    title: Retired public local health freshness owner
    reason: Removed because Check, Warm, Start, background probing, and list-polling health do not create a public capability truth; ExecutionHost supervision stays Runtime private.
  - id: rule.nimi.runtime.ai-provider.r041
    kind: rule
    title: Local embedding bindings are exact configuration slots
    modality: must
    statement: A Local text.embed CapabilityImplementationDriver projects normalized independent requirement-occurrence slots into its Local Capability Configuration and each binding names exact verified LocalAsset content or remains unresolved; Runtime never searches inventory, paths, filenames, labels, or capability hints to bind at execution, and binding remains separate from machine selection, admission, Host state, and Memory bank truth.
    condition: Whenever a local memory embedding binding is validated.
    failure: Reject raw paths, engine names, renderer heuristics, and non-embedding-capable targets.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.model-service-plane
  - id: rule.nimi.runtime.ai-provider.r042
    kind: rule
    title: Runtime owns local model algorithms
    modality: must
    statement: LocalAsset recommendation, installation, verified-content registry identity, dependency installation, and download algorithms are Runtime-owned, and Desktop, Web, and Kit consume only typed projections without parallel resolvers or identity heuristics; recommendations never bind, select, route, or participate in Job composition.
    condition: Whenever local model algorithm decisions are produced or consumed.
    failure: Reject consumer-side parallel algorithm or identity authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.model-service-plane
  - id: rule.nimi.runtime.ai-provider.r043
    kind: rule
    title: Recommendation is typed evidence not readiness
    modality: must
    statement: Recommendation fit tiers derive deterministically from captured local device facts plus catalog evidence, confidence, memory budget, context window, quantization, file metadata, and declared implementation requirements, absent required metadata yields a typed no-recommendation result, and a recommendation never becomes install success, binding, machine selection, standardized-feature support, admission, readiness, or routing truth or mutates current configuration.
    condition: Whenever local model recommendation is computed or consumed.
    failure: Fail closed on missing metadata and reject recommendation results promoted to readiness.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.model-service-plane
  - id: rule.nimi.runtime.ai-provider.r044
    kind: rule
    title: Driver requirement occurrences are independent and exact
    modality: must
    statement: Every resource occurrence independently selected, downloaded, bound, or replaced is one normalized slot projected by the exact CapabilityImplementationDriver; unresolved slots are legal saved state, selection requires every required slot configured, execution checks exact bindings, and Runtime introduces neither a generic optional-requirement or alternative-auto-selection lifecycle nor implicit substitution from catalog, inventory, names, paths, labels, or field similarity.
    condition: Whenever Runtime projects or validates Local Capability Configuration requirements.
    failure: Preserve unresolved state or fail exact admission rather than fabricate satisfaction, inherit a binding, or choose an alternative.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.model-service-plane
  - id: rule.nimi.runtime.ai-provider.r045
    kind: rule
    title: Registry identity resolution is fixed
    modality: must
    statement: Runtime resolves verified-content identity before inserting LocalAsset records, prevents duplicate content identities, rebuilds non-binding indexes from Runtime registry truth excluding removed records, and preserves file metadata, digest, manifest and provenance evidence; model name, engine, logical label, filename, path, prefix, slot label, and field similarity never inherit a Local Capability Configuration binding or become routing identity.
    condition: Whenever local model registry identity is created or repaired.
    failure: Reject duplicate or heuristic identity writes outside Runtime registry truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.model-service-plane
  - id: rule.nimi.runtime.ai-provider.r046
    kind: rule
    title: Artifact downloads commit atomically
    modality: must
    statement: LocalAsset downloads stage outside committed storage, verify required hashes and manifests before commit, commit atomically or roll back without partial content, expose durable transfer and progress state, and resume only when Runtime proves staged bytes belong to the same transfer identity; completion proves concrete verified content only and never capability readiness, binding, machine selection, Driver compatibility, Host health, or execution success.
    condition: Whenever Runtime downloads local model or materialized assets.
    failure: Roll back partial commits and reject execution truth claimed from download or install progress.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.model-service-plane
  - id: rule.nimi.runtime.ai-provider.r047
    kind: rule
    title: Canonical multimodal fields have one registry
    modality: must
    statement: Multimodal canonical request head fields come from the runtime multimodal canonical field registry, while the TEXT_GENERATE and TEXT_EMBED main field contracts stay proto-first on the typed ScenarioSpec text_generate and text_embed messages without registry derivation.
    condition: Whenever multimodal canonical request fields are defined or consumed.
    failure: Reject field definitions outside the registry or duplicated away from the typed proto authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r048
    kind: rule
    title: Modality specs validate before dispatch
    modality: must
    statement: Image, video, TTS, and STT scenario specs are validatable before the provider request, video uses the structured mode plus content list plus options shape, and the legacy first frame, last frame, and camera motion fields are not primary video contract inputs.
    condition: Whenever a multimodal scenario spec is accepted for execution.
    failure: Reject unvalidatable specs and legacy-shaped video inputs before dispatch.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r049
    kind: rule
    title: Async media jobs are first class
    modality: must
    statement: Asynchronous media work, especially video and long audio, runs as a first-class job following the scenario job lifecycle, and media job submission and query never bypass job metadata semantics.
    condition: Whenever asynchronous media execution is submitted or queried.
    failure: Reject async media paths that bypass the scenario job contract.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.nimillm-plane
  - id: rule.nimi.runtime.ai-provider.r050
    kind: rule
    title: Artifact bodies use the closed Runtime custody handoff
    modality: must
    statement: Artifact metadata fields come from the Runtime multimodal artifact field registry, while an ExecutionHost or Driver hands an artifact body to Runtime as exactly bounded existing bytes, a context-aware incremental stream with bounded accounting, backpressure, cancellation, and one Runtime-owned close or abort after acceptance, or a Runtime-issued already-committed custody reference validated for current AccountID, Registered App Subject, size, digest, MIME, exact typed-operation eligibility, integrity, expiry, and availability; provider URLs and response streams are ingress only, Runtime commits custody before metadata or a reference is published, and no caller or provider selects a durable custody reference.
    condition: Whenever multimodal artifacts are returned.
    failure: Reject artifact envelopes missing registry-declared metadata, a fourth or ambiguous body form, an unbounded or cancelled stream, a foreign or mismatched committed reference, emit-before-commit, or durable provider URL truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r051
    kind: rule
    title: CapabilityImplementationDrivers normalize in layers
    modality: must
    statement: Every CapabilityImplementationDriver implements exact target and configuration validation, request mapping, stream and response normalization, and reason-code normalization as separated layers without owning route, Connector custody, machine selection, Host lifecycle, or fallback.
    condition: Whenever a CapabilityImplementationDriver is implemented or extended.
    failure: Reject Drivers that skip the layers or absorb another authority owner.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.nimillm-plane
  - id: rule.nimi.runtime.ai-provider.r052
    kind: rule
    title: Cloud modality routes stay truthful
    modality: must_not
    statement: Cloud modality execution hides the committed AIConfig route and exact CapabilityImplementation, Driver target, internally resolved current-account Connector, and Remote ExecutionHost composition, claims Runtime selected a substitute route, or fabricates a success response.
    condition: Whenever a Cloud modality Job executes.
    failure: Surface the committed route kind and exact typed outcome without exposing secrets or offering fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r053
    kind: rule
    title: Local image compatibility is exact and non-selecting
    modality: must
    statement: The exact selected local image CapabilityImplementation and Driver validate their declared configuration and required ExecutionHost compatibility against one canonical matrix keyed by stable implementation, Driver, platform and Host identities; the matrix may inform non-binding installation recommendation and typed admission but never resolves topology, selects implementation or Host, creates activation or ready health, or exposes private Host fields as product configuration.
    condition: Whenever Runtime validates an exact local image configuration for recommendation or Job admission.
    failure: Reject per-module inference, unknown compatibility, automatic selection, and unsupported exact composition.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r054
    kind: rule
    title: Media engine private protocol is fixed
    modality: must
    statement: The Local ExecutionHost media protocol is Runtime private and carries canonical image and video requests and artifact envelopes for the exact CapabilityImplementationDriver; protocol endpoints, process handshake and catalog details never become Driver identity, public readiness, route, binding, or selection, and no image or video Job falls back to another Host, OpenAI-compatible generation endpoint, legacy health path, or llama-carried image path.
    condition: Whenever Runtime dispatches to the media engine.
    failure: Reject dispatch outside the fixed canonical media surface.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r055
    kind: rule
    title: Host mismatch keeps the supervised contract
    modality: must_not
    statement: Runtime changes the selected Local Capability Configuration, Driver, or ExecutionHost mode after an exact local image configuration proves incompatible with the current host instead of preserving the committed selection and returning a typed derived admission reason with bounded compatibility detail.
    condition: Whenever the canonical local image path meets an unsupported host.
    failure: Fail closed for the exact committed selection without Host switching or automatic re-arbitration.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r056
    kind: rule
    title: Local Host state stays private and never falls back
    modality: must
    statement: Media and speech ExecutionHosts keep process, dependency, device, model, pipeline, warm, resident and health state Runtime private, never expose it as product-ready catalogs or configuration, and fail the exact Job truthfully when preparation or execution cannot proceed; no internal Driver, diffusers path, engine, static row, or alternate Host is used as a fallback strategy.
    condition: Whenever local engine catalogs or capabilities are exposed.
    failure: Fail the exact Job without fabricating artifacts, public readiness, or alternate execution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r057
    kind: rule
    title: Speech ExecutionHost protocol is private and fail closed
    modality: must
    statement: The runtime-to-speech ExecutionHost protocol remains a private transport for exact transcription, synthesis, and voice-creation Driver calls; placeholder responses, reachability, process state, private catalogs and handshakes never project capability readiness or select a route, and a missing or incompatible exact Host returns the typed admission or Job failure without masquerade or downgrade.
    condition: Whenever Runtime dispatches to or projects the speech engine.
    failure: Reject OpenAI-compatible masquerade, public readiness, fabricated success, and silent downgrade.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r058
    kind: rule
    title: Voice implementation support is exact and contract scoped
    modality: must
    statement: Voice creation, synthesis and transcription succeed only through the exact committed CapabilityImplementation and Driver that declare support for that CapabilityContract and required standardized features; family, provider, catalog, Host health, or another capability's success never implies support, readiness, binding, or fallback, and unsupported exact composition fails closed.
    condition: Whenever local voice execution or readiness is projected.
    failure: Return family-scoped fail-close results instead of generic local speech success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r059
    kind: rule
    title: Speech diagnostics stay redacted
    modality: must_not
    statement: Public speech diagnostics or detail expose raw request payloads, runtime-private bootstrap paths, or raw probe URLs.
    condition: Whenever speech diagnostics are emitted.
    failure: Keep finer reasons in runtime-private detail or audit surfaces only.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r060
    kind: rule
    title: Provider media tasks align with the job lifecycle
    modality: must
    statement: Provider-backed asynchronous media generation stages use the Runtime multimodal task lifecycle and do not create a general Workflow product.
    condition: Whenever provider-backed asynchronous media stages emit events.
    failure: Reject event semantics that diverge from the multimodal task lifecycle.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r061
    kind: rule
    title: Multimodal validation fails closed
    modality: must
    statement: Unsupported fields, failed policy checks, and unavailable providers fail closed.
    condition: Whenever multimodal validation or provider availability fails.
    failure: Return the typed failure without partial or fabricated success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r062
    kind: rule
    title: DashScope voice resolution is catalog driven
    modality: must
    statement: The exact DashScope audio.synthesize CapabilityImplementationDriver resolves voice identity only against its canonical captured target catalog and Driver configuration, performs no compatibility-mode endpoint probe, hardcoded voice fallback, provider re-selection, or route change, and emits bounded diagnostics that never become binding, readiness, or capability authority.
    condition: Whenever DashScope TTS voices are resolved or validated.
    failure: Reject bypass paths and unobservable voice resolution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r063
    kind: rule
    title: Local image workflow mapping is fixed
    modality: must
    statement: The exact local image CapabilityImplementationDriver maps text-to-image with empty reference images to a request without file, files, or ref_images, maps image-to-image with the first reference image to file, all reference images to files, and the remainder to ref_images, and passes through admitted negative_prompt, while provider, Driver, implementation and Host identity come from the committed Local Capability Configuration rather than inference from a resolved engine. For the stable-diffusion.cpp Local Driver, an absent image count resolves to one, an explicit image count admits only one through four, and an explicit size admits only WIDTHxHEIGHT with each dimension from 64 through 4096 and divisible by eight. An explicit request seed is admitted only from -2147483648 through 2147483647. Any unsupported image count, size, or seed returns AI_MEDIA_OPTION_UNSUPPORTED before Job publication or ExecutionHost dispatch.
    condition: Whenever Runtime maps a local image workflow request.
    failure: Reject silent drops or mismapped image workflow inputs.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r064
    kind: rule
    title: Local image configuration owns exact Driver slots and options
    modality: must
    statement: The exact local image CapabilityImplementationDriver owns portable configuration and projects normalized independent requirement-occurrence slots into the Local Capability Configuration; slots carry exact verified LocalAsset bindings or unresolved state, configuration changes update current state directly, implementation or dialect changes explicitly reproject requirements without inheriting bindings by path, name, slot label or field similarity, and execution consumes only exact committed bindings without ambient inventory resolution or dynamic import. For Z-Image, the stable-diffusion.cpp portable modelFamily field admits the canonical family identifier z-image; z-image-turbo and z-image-base are model identifiers under that family whose identity remains in canonical model catalog and LocalAsset fields, and neither identifier is a modelFamily value. The stable-diffusion.cpp portable executionOptions.seed field admits only an integer from -2147483648 through 2147483647; an invalid family placement or out-of-range seed is PORTABLE_CONFIG_INVALID and never becomes executable, normalized, or rewritten.
    condition: Whenever a local image workflow consumes profile overrides or slot dependencies.
    failure: Preserve unresolved state or fail exact admission rather than guessing, inheriting, importing, or choosing companions and defaults.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r065
    kind: rule
    title: Image response format closed and downloads bounded
    modality: must
    statement: Image response_format admits only b64_json, base64 normalized to b64_json, or url with other values failing closed as AI_MEDIA_OPTION_UNSUPPORTED, and URL artifact downloads inherit the parent request context with a bounded read limit where timeout, cancellation, empty payloads, or oversize payloads fail closed as AI_OUTPUT_INVALID.
    condition: Whenever local image responses or URL artifacts are processed.
    failure: Return the exact typed failure without unbounded or fabricated artifact handling.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r066
    kind: rule
    lifecycle: removed
    title: Retired legacy image option compatibility mapping
    reason: Removed because pre-launch hard cut rejects legacy aliases and ignored-option shims; only the exact CapabilityImplementationDriver dialect and portable configuration are admitted.
  - id: rule.nimi.runtime.ai-provider.r067
    kind: rule
    title: TTS primary entry is typed voice_ref
    modality: must
    statement: The TTS v2 synthesis primary entry is the strongly typed voice_ref with no fallback to a free-string voice field.
    condition: Whenever a TTS synthesis request is accepted.
    failure: Reject free-string voice input on the primary contract.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r068
    kind: rule
    title: Voice creation inputs are canonical and truthful
    modality: must
    statement: Voice creation canonical inputs come from the multimodal canonical field registry, providers never substitute implicit parameters for required field constraints, an optional reference transcript text is passed through explicitly when the provider requires it for reference-audio creation and its absence fails closed, and Runtime never fabricates a transcript.
    condition: Whenever voice creation inputs are mapped to a provider.
    failure: Fail closed on missing required inputs instead of fabricating or defaulting them.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r069
    kind: rule
    title: Voice creation never downgrades to default voices
    modality: must
    statement: Incomplete voice creation input, unsupported typed sources, mismatched target models, and illegal asset states fail closed without automatic downgrade to a provider default voice.
    condition: Whenever voice creation execution is validated.
    failure: Return the typed failure without default-voice downgrade.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r070
    kind: rule
    title: Media provider transport keys stay Runtime private
    modality: must_not
    statement: A Driver provider extension cannot escape its admitted origin or canonical base path, and transport, credential-header, Driver target, voice creation, preview, and create-path details remain Runtime private rather than catalog, AIConfig, Profile, SDK, or App-facing routing truth.
    condition: Whenever media provider extensions carry transport routing details.
    failure: Reject cross-origin or path-escaping overrides and keep transport keys runtime private.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r071
    kind: rule
    title: TTS timing and render hints are typed
    modality: must
    statement: TTS v2 strongly types timing_mode as none, word, or char plus the voice render hints stability, similarity_boost, style, use_speaker_boost, and speed, and when a caller requests word or char timing a supporting provider returns structured speech alignment while an unsupporting provider fails closed with AI_MEDIA_OPTION_UNSUPPORTED or an explicit provider error mapping instead of silently ignoring or downgrading to none.
    condition: Whenever TTS timing or render hints are requested.
    failure: Fail closed on unsupported timing instead of ignoring or degrading it.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r072
    kind: rule
    title: TTS provider status mapping baseline is fixed
    modality: must
    statement: TTS CapabilityImplementationDrivers map 401 and 403 to AI_PROVIDER_AUTH_FAILED, 429 to AI_PROVIDER_RATE_LIMITED, 400 and 422 to AI_VOICE_INPUT_INVALID for voice creation or AI_MEDIA_OPTION_UNSUPPORTED for synthesis parameters, target model or voice incompatibility to AI_VOICE_TARGET_MODEL_MISMATCH, invisible or unauthorized assets to AI_VOICE_ASSET_SCOPE_FORBIDDEN, 5xx to AI_PROVIDER_INTERNAL, and timeouts to AI_PROVIDER_TIMEOUT without changing the selected implementation, target, Connector, or route.
    condition: Whenever a TTS Driver receives a provider error status.
    failure: Return the mapped typed code instead of a generic or fabricated result.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r073
    kind: rule
    title: Plain speech implementation metadata is contract scoped
    modality: must
    statement: CapabilityImplementation and Driver metadata for audio.synthesize describes only that exact implementation's audio formats, timing modes, language and emotion fields, supported standardized features and Driver-owned option schema, while audio.transcribe metadata describes only its exact implementation's transcript tier, response format, features and schema; missing minimum metadata fails closed, and consumers never infer one contract's support from provider name, shared Host, route kind, or another capability.
    condition: Whenever plain speech implementation metadata is served or consumed.
    failure: Fail closed on missing metadata truth and reject cross-capability inference.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r074
    kind: rule
    title: Streaming TTS is declared contract and Job behavior
    modality: must
    statement: Streaming behavior belongs to the audio.synthesize CapabilityContract and Job semantics rather than a standardized feature, and an exact CapabilityImplementationDriver declares native, simulated, or unsupported stream behavior without inference from provider name, route kind, endpoint family, Host, or Local versus Cloud assumptions; unsupported execution fails closed and never switches implementation or route.
    condition: Whenever streaming TTS support is projected or selected.
    failure: Reject inferred or promoted native streaming claims.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r075
    kind: rule
    title: Video mode and role matrix is strict
    modality: must
    statement: Text-to-video requires at least one TEXT PROMPT part and forbids frame and reference image roles, first-frame mode requires exactly one IMAGE_URL FIRST_FRAME, first-last mode requires exactly one FIRST_FRAME and one LAST_FRAME, reference mode requires at least one REFERENCE_IMAGE, text content always uses the TEXT PROMPT role, optional REFERENCE_VIDEO and REFERENCE_AUDIO follow catalog-declared roles and limits with declared allowed roles never misread as per-request requirements, an audio reference requires at least one visual anchor input, and any mode or role conflict fails closed with AI_MEDIA_SPEC_INVALID or AI_MEDIA_OPTION_UNSUPPORTED.
    condition: Whenever a video generation request is validated.
    failure: Fail closed on every mode and role conflict.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r076
    kind: rule
    title: Video option guardrails are fixed
    modality: must
    statement: The frames and duration seconds options are mutually exclusive with conflicts failing closed, seed stays within -1 to 4294967295, reference mode forbids fixed camera, and ratio and resolution validate against the provider and model capability matrix.
    condition: Whenever video options are validated.
    failure: Fail closed on guardrail violations before provider dispatch.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r077
    kind: rule
    title: Seedance task protocol and Host endpoint stay separate
    modality: must
    statement: The Volcengine Seedance CapabilityImplementationDriver translates declared submit and query operations plus content-list and role request semantics without legacy video field assembly, while the Remote ExecutionHost materializes the exact private provider endpoint and owns transport and remote Job lifecycle; Driver target configuration contains provider-model or region semantics but no endpoint or port authority.
    condition: Whenever the Seedance video Driver executes.
    failure: Reject legacy-shaped requests, undeclared task operations, a Driver-owned endpoint, or alternate Host routing.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.remote-execution-host-plane
  - id: rule.nimi.runtime.ai-provider.r078
    kind: rule
    title: Async provider status is normalized
    modality: must
    statement: Provider asynchronous task states normalize to queued, running, cancelled, succeeded, failed, or expired, with cancelled mapping to job CANCELED, expired mapping to job TIMEOUT, and failed mapping to job FAILED.
    condition: Whenever a provider async task status is projected to a scenario job.
    failure: Reject unnormalized or misprojected task states.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r079
    kind: rule
    title: TTS inclusion layered and custom voice deferred
    modality: must
    statement: TTS provider inclusion treats synthesis as the required base capability with voice creation as an optional increment, synthesize-only providers are not forced into voice-creation alignment, and cloud training-style custom voice remains a provider extension never force-mapped to standard voice creation success semantics before a cross-provider verifiable typed abstraction exists.
    condition: Whenever a TTS provider is included or a custom voice feature is surfaced.
    failure: Reject forced voice-creation alignment and premature standard-success mapping.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r080
    kind: rule
    title: Text generate standardized-feature preflight is a deterministic subset check
    modality: must
    statement: For text.generate, AIConfig declares the required contract-scoped standardized-feature set and the effective CapabilityImplementation declares its supported set; Runtime checks required is a subset of supported with IMAGE_URL or image artifact requiring input.image, AUDIO_URL or audio artifact requiring input.audio, and VIDEO_URL or video artifact requiring input.video, unknown or unsupported parts fail closed, and missing support metadata never passes, changes route or machine selection, switches provider, or triggers fallback.
    condition: Whenever TEXT_GENERATE accepts multimodal content parts.
    failure: Fail closed per part instead of silently degrading modality support.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r081
    kind: rule
    title: Text generate IO boundary is fixed
    modality: must
    statement: TEXT_GENERATE output is always text with media outputs never returned through it, inputs admit text, image URL, audio URL, video URL, and artifact ref parts, large media inputs use only URLs or artifact refs with inline binary and data URIs excluded from the text chat contract, media-only prompts are legal, and system-only or empty content fails closed with AI_INPUT_INVALID.
    condition: Whenever TEXT_GENERATE input and output boundaries are enforced.
    failure: Reject out-of-boundary inputs and outputs with the typed failure.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r082
    kind: rule
    title: Realtime sessions have their own service
    modality: must
    statement: Bidirectional low-latency text and audio sessions run only through RuntimeAiRealtimeService with OpenRealtimeSession, AppendRealtimeInput, ReadRealtimeEvents, and CloseRealtimeSession, no executable realtime composition is currently admitted and OpenRealtimeSession deterministically fails with AI_ROUTE_UNSUPPORTED after caller authorization without composing a text route or leaking provider or engine identity, one session admits one active reader with conflicting readers failing closed, and realtime semantics are never fabricated as TEXT_GENERATE streams.
    condition: Whenever realtime AI sessions are requested or served.
    failure: Reject realtime semantics smuggled into scenario RPCs, fabricated streaming fallbacks, or fabricated realtime success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r083
    kind: rule
    title: Realtime is not agent voice output
    modality: must_not
    statement: The realtime session RPC surface is used as ordinary agent voice output carrying voice references, voice assets, committed assistant text, turn and message identity, final replay artifacts, or voice-playback interrupt semantics, or the realtime audio chunk is reused as a scenario voice stream delta or agent voice stream chunk field.
    condition: Whenever agent voice output or scenario voice streaming is designed or executed.
    failure: Route ordinary agent voice output through scenario audio synthesis semantics including its streaming paths.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r084
    kind: rule
    title: Artifact upload ingress contract is fixed
    modality: must
    statement: UploadArtifact is a client-stream RPC whose first frame carries the upload metadata and later frames carry ordered chunks, v1 admits only image, audio, and video media types, Runtime commits the accepted stream before the artifact is consumable, Local App custody is authorized only by the protected-session current AccountID plus Registered App Subject while AppID remains non-authorizing producer metadata, and illegal first frames, MIME types, owner context, or chunk ordering return AI_ARTIFACT_UPLOAD_INVALID while oversize uploads return AI_ARTIFACT_UPLOAD_TOO_LARGE.
    condition: Whenever large media enters through the artifact upload ingress.
    failure: Return the exact typed upload failure without partial artifact consumption.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r085
    kind: rule
    title: Remote OpenAI text implementation declares exact features
    modality: must
    statement: The remote OpenAI text.generate CapabilityImplementation and Driver declare support for input.image and input.audio and map those parts to provider-native inputs, do not declare input.video when video parts are unsupported, and the generic OpenAI-compatible implementation never inherits input.audio or input.video from provider family or protocol similarity; feature mismatch fails closed without target or provider switching.
    condition: Whenever remote OpenAI-family text multimodal requests are mapped.
    failure: Fail closed on unsupported modalities instead of pretending provider support.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r086
    kind: rule
    title: Music prior-audio extension is closed and gated
    modality: must
    statement: The music generate prior-audio extension admits only mode as extend, remix, or reference, source audio base64 required for the extension, and optional source MIME type and trim bounds, unknown extension keys are never forwarded to providers, the extension requires the effective implementation to declare the music.generate input.audio standardized feature decided together with a runtime provider strategy rather than provider-name hardcoding, an illegal mode, missing or undecodable audio, negative trim, or non-increasing trim range returns AI_MEDIA_SPEC_INVALID, unsupported provider semantics or declared feature support without a runtime strategy returns AI_MEDIA_OPTION_UNSUPPORTED, and extension-free requests stay prompt-only.
    condition: Whenever MUSIC_GENERATE carries or lacks the prior-audio extension.
    failure: Return the exact typed failure and never forward undeclared prior-audio semantics.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r087
    kind: rule
    title: Stable output is typed proto
    modality: must
    statement: Stable AI product output uses explicit typed proto messages with ScenarioOutput as the only oneof container mounted on the execute response output for sync paths and the artifacts response output for async paths, stream deltas use explicit oneof branches for text, reasoning, and artifact, the generic protobuf Struct survives only in workflow or internal explicit-dynamic envelopes, and SDK and consumer helpers consume the typed messages without degrading them to untyped records or MIME guessing.
    condition: Whenever stable AI scenario output or stream deltas are produced or consumed.
    failure: Reject Struct-first or field-guessing output contracts on stable surfaces.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r088
    kind: rule
    title: Reasoning config is typed and truthful
    modality: must
    statement: TEXT_GENERATE reasoning configuration uses the typed reasoning message covering at least mode, trace mode, and budget tokens with legacy and default requests keeping off plus hide semantics stable against model default drift, and a provider that cannot honor the requested reasoning switch, independent trace, or budget fails closed instead of silently merging reasoning into the body, fabricating an empty trace, or faking success.
    condition: Whenever TEXT_GENERATE reasoning is requested.
    failure: Fail closed on unsupported reasoning without silent merging or fabrication.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r089
    kind: rule
    title: Text stream timeouts split by activity
    modality: must
    statement: Text stream timeout semantics split into first-packet timeout, idle timeout, and an absolute cap, reasoning, text, tool, and usage deltas all count as activity refreshing the idle timer, and a bare started event is not valid progress.
    condition: Whenever text streaming timeouts are evaluated.
    failure: Terminate the stream by the split timeout rules instead of indefinite or premature cuts.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r090
    kind: rule
    title: Native binary managed backend is closed
    modality: must
    statement: A native-binary image CapabilityImplementationDriver invokes only its exact managed Local ExecutionHost protocol without calling llama import or execution routes, no second App-facing image control plane is observable, package-source and process details stay Runtime private, and an unsupported exact Driver and Host compatibility tuple fails closed before execution without selecting another backend, implementation, provider, or route.
    condition: Whenever a native-binary managed image backend path executes.
    failure: Fail closed instead of forwarding through llama or legacy management routes.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r091
    kind: rule
    title: nimillm executes exact captured Cloud inputs only
    modality: must_not
    statement: Outbound nimillm execution consumes a raw durable model id, provider prefix, connector, catalog row, current AIConfig, or mutable resolved-binding object as execution authority instead of the Job-captured exact Cloud CapabilityImplementation, Driver-owned provider-model target configuration, Runtime-resolved request-scoped current-account Connector credential context, and request.
    condition: Whenever nimillm receives an execution request.
    failure: Reject incomplete or non-captured Cloud inputs before provider outbound.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.nimillm-plane
  - id: rule.nimi.runtime.ai-provider.r092
    kind: rule
    title: Cloud Driver and Remote ExecutionHost responsibilities are separate
    modality: must
    statement: nimillm as a CapabilityImplementationDriver owns exact provider-target validation, protocol mapping, request, stream, response and error translation without Connector or custody persistence, while Remote ExecutionHost owns transport and remote Job lifecycle; current-account Connector ownership and credential validation completes before Driver and Host dispatch, and neither layer selects another route or target.
    condition: Whenever nimillm adapts a remote execution.
    failure: Reject outbound requests whose provider match validation has not completed.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.nimillm-plane
  - id: rule.nimi.runtime.ai-provider.r093
    kind: rule
    title: Stream events carry terminal semantics
    modality: must
    statement: Text and voice stream events follow the platform stream done and terminal-frame semantics.
    condition: Whenever nimillm emits stream events.
    failure: Reject streams lacking explicit terminal semantics.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.nimillm-plane
  - id: rule.nimi.runtime.ai-provider.r094
    kind: rule
    title: Committed Cloud composition is observable and audited
    modality: must
    statement: Execution entry, the committed AIConfig route, exact Cloud CapabilityImplementation, Driver target, internally resolved current-account Connector reference, Remote ExecutionHost dispatch and error exit write safe unified audit fields without secret material; no fallback decision exists to record because execution never switches implementation, provider, target, Connector, Host, or route.
    condition: Whenever nimillm executes or routes a request.
    failure: Fail the auditable operation rather than executing unobservably.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.nimillm-plane
  - id: rule.nimi.runtime.ai-provider.r095
    kind: rule
    title: Unsupported capability and availability are explicit
    modality: must
    statement: Unsupported CapabilityContracts or standardized-feature mismatch return the exact typed failure, unavailable exact targets or provider failures end only the attempted Job, and nimillm and Remote ExecutionHost contain no internal fallback, provider switching, Local or Cloud switching, or silent degradation.
    condition: Whenever nimillm validates support or executes an exact Cloud Job.
    failure: Return the exact typed result for the committed composition without fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.nimillm-plane
  - id: rule.nimi.runtime.ai-provider.r096
    kind: rule
    lifecycle: removed
    title: Retired provider health state machine
    reason: Removed because periodic reachability and healthy or unhealthy snapshots are not product readiness, binding, selection, admission, or execution authority.
  - id: rule.nimi.runtime.ai-provider.r097
    kind: rule
    title: Production Host targets reject external injection
    modality: must_not
    statement: Environment variables, argv, Desktop, SDK, renderer payloads, raw keys, catalog names, or process discovery create or override a production Remote ExecutionHost target; the target comes only from the exact Job-captured CapabilityImplementationDriver configuration and Runtime-resolved request-scoped current-account Connector custody context, while synthetic fixtures never load in production or count as product evidence.
    condition: Whenever a production Remote ExecutionHost target is prepared.
    failure: Reject externally injected targets and fixture posture in production.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.remote-execution-host-plane
  - id: rule.nimi.runtime.ai-provider.r098
    kind: rule
    title: ExecutionHost target admission is private and bounded
    modality: must
    statement: Before Host startup, Local and Remote ExecutionHost endpoints come only from exact Runtime-owned Host materialization or configuration associated with the committed Driver; a supervised Local Host may use private deterministic configuration or controlled allocation, an attached Local Host requires an exact admitted private endpoint, and a Remote Host consumes the exact Job-captured Driver target and Runtime-resolved request-scoped current-account Connector custody context. Authority promises no product-level fixed port, caller or ambient inference, environment default, or endpoint identity in an App, AIConfig, AIProfile, Driver target choice, catalog, Local Capability Configuration, binding, machine selection, public probe, or readiness truth.
    condition: Whenever an ExecutionHost target is admitted.
    failure: Reject caller-injected, environment-injected, ambient, unmaterialized, or publicly projected Host endpoints and fail the exact Host composition without alternate endpoint routing.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.remote-execution-host-plane
  - id: rule.nimi.runtime.ai-provider.r099
    kind: rule
    title: Local image compatibility attribution is matrix driven
    modality: must
    statement: Exact local image CapabilityImplementationDriver and ExecutionHost compatibility consumes the canonical matrix implementation, Driver, backend family, Host class and product-support facts, unsupported entries return recognized-but-unsupported typed admission detail, and private attribution may include backend and environment reason keys without producing provider health, selecting topology, changing machine selection, or routing to an attached or llama path.
    condition: Whenever exact local image compatibility is validated or attributed.
    failure: Fail closed with recognized-but-unsupported or dependency detail for the exact composition.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.remote-execution-host-plane
  - id: rule.nimi.runtime.ai-provider.r100
    kind: rule
    lifecycle: removed
    title: Retired periodic provider probe strategy
    reason: Removed because provider reachability is not polled into product readiness; only explicit bounded Test Connector diagnostics and actual Jobs make outbound calls.
  - id: rule.nimi.runtime.ai-provider.r101
    kind: rule
    lifecycle: removed
    title: Retired provider health panel and reachability truth
    reason: Removed because connection tests are explicit bounded diagnostics and never readiness, binding, selection, admission, or execution prerequisites.
  - id: rule.nimi.runtime.ai-provider.r102
    kind: rule
    title: Private Host health endpoints express process supervision only
    modality: must_not
    statement: A private ExecutionHost health endpoint reports capability, model, workflow, pipeline or selected-configuration readiness, or serves a static response as execution feasibility; it may report only bounded process or transport supervision truth and cannot change binding, machine selection, derived admission, route, or Job outcome.
    condition: Whenever a private Host health endpoint responds.
    failure: Reject capability conclusions and keep process supervision private.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.remote-execution-host-plane
  - id: rule.nimi.runtime.ai-provider.r103
    kind: rule
    lifecycle: removed
    title: Retired provider-health Runtime status linkage
    reason: Removed because provider probe targets do not drive daemon READY or DEGRADED state or capability readiness.
  - id: rule.nimi.runtime.ai-provider.r104
    kind: rule
    title: ExecutionHost observability detail stays private
    modality: must
    statement: Backend family, Host class, process state, transport target, control plane, execution plane and provider-specific details stay in Runtime-private supervision and safe audit records without public health snapshots, route or selection identity, and may explain an exact Job failure but never establish readiness or admission by themselves.
    condition: Whenever ExecutionHost observability fields are recorded or projected.
    failure: Reject public exposure or promotion of Runtime-private Host detail into product authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.remote-execution-host-plane
  - id: rule.nimi.runtime.ai-provider.r105
    kind: rule
    title: Gemini endpoint materialization is Host private
    modality: must
    statement: The Gemini CapabilityImplementationDriver emits only its declared provider protocol and provider-model target semantics, while the Remote ExecutionHost materializes the exact base endpoint from Runtime-private Host configuration before dispatch; neither Driver target nor Connector, environment variable, caller, catalog, AIConfig, or Profile supplies a base endpoint, and Host configuration never becomes route, provider-health, or machine-selection truth.
    condition: Whenever Gemini Driver output and its Remote ExecutionHost are composed.
    failure: Reject a Driver-, Connector-, environment-, caller-, catalog-, AIConfig-, or Profile-owned endpoint and every alternate endpoint fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.nimillm-plane
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.remote-execution-host-plane
  - id: rule.nimi.runtime.ai-provider.r106
    kind: rule
    title: Managed image package table validates exact compatibility
    modality: must
    statement: The managed image backend package table validates exact CapabilityImplementationDriver and Local ExecutionHost compatibility for recognized native-binary tuples, keeps package-source selection Runtime private, reports package-unsupported tuples as recognized-but-unsupported typed admission detail, and never produces public health, readiness, binding, machine selection, or a llama-derived alternate path.
    condition: Whenever managed image Driver and Host compatibility is evaluated.
    failure: Fail the exact composition with recognized-but-unsupported detail without fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r107
    kind: rule
    title: Local App foreground text candidates consume App AIConfig
    modality: must
    statement: The runtime.ai.text-candidate.generate Local App operation accepts only a bounded synchronous foreground request containing plain-text system and user messages plus bounded temperature, top-p, and output-token controls; Runtime admits the exact operation only for a current protected App session whose Effective App Access Snapshot covers runtime.consume, derives the current account and App identity from that session and the operation classification from the typed protected ingress, and deterministically composes Local with the current machine-selected text Local Capability Configuration or Cloud with the calling App owner's committed AIConfig-owned CapabilityImplementation and Driver target plus the internally resolved current-account Connector. Runtime validates Connector ownership, credential configuration, App access, and existing policy, returns the existing owner or configuration-required, credential, access-denied, or policy reason on failure without requesting App-side Connector selection, never chooses Local or Cloud, overrides AIConfig, or creates fallback, and the response exposes only candidate text, finish reason, and trace correlation; request and response contain no account, principal, Agent, provider, model, route, target, connector, credential, grant, tool, media, artifact, source, raw-chunk, reasoning-trace, stream, job, or background-execution field.
    condition: Whenever a third-party Local App generates owner-reviewable text candidate material.
    failure: Reject a missing or non-current protected App session, missing runtime.consume coverage, unbounded or non-plain-text input, absent or inadmissible owner AIConfig composition, and every caller-selected route or generic AI payload without forcing Local, changing the committed route, fallback, or synthesized output.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r108
    kind: rule
    title: Video request image artifacts resolve at submission
    modality: must
    statement: A video.generate content item may carry an image through a Runtime opaque artifact_id using only the existing first_frame, last_frame, or reference_image role; before Job creation Runtime uses the shared Local App artifact authorizer to require the protected-session current AccountID plus Registered App Subject, exact video artifact-reference operation, image MIME, admitted size, integrity, expiry, and availability, rejects historical subject-unbound records without AppID fallback, and captures one immutable opened source or committed custody reference as the execution handle without exposing a filesystem path or copying authority fields into the request. Existing URL-backed Cloud behavior remains unchanged, while a Cloud video route receiving an artifact-backed input returns typed unsupported without translating or forwarding the artifact reference.
    condition: Whenever video.generate content carries a Runtime artifact reference.
    failure: Return the same non-disclosing ARTIFACT_FORBIDDEN result for absent, foreign-owner, or subject-unbound artifact references, reject non-image, expired, corrupt, or oversized artifacts with the exact typed failure before Job creation, and reject artifact-backed Cloud video input as typed unsupported without fallback or passthrough.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r109
    kind: rule
    title: Local App scenario consumption composes App AIConfig
    modality: must
    statement: The runtime.ai.text-turn.stream, runtime.ai.scenario.execute, runtime.ai.scenario-job.submit, runtime.ai.scenario-job.get, runtime.ai.scenario-job.subscribe, runtime.ai.scenario-job.cancel, runtime.ai.artifact.read, runtime.ai.artifact.upload, runtime.ai.artifact.adopt-to-app-storage, and runtime.ai.voice-assets.list Local App operations accept only bounded closed-set scenario specifications, Job identifiers, artifact identifiers, the admitted upload body, asset adoption destination path and overwrite intent, and catalog page controls; Runtime admits each exact operation only for a current protected App session whose Effective App Access Snapshot covers runtime.consume, derives current AccountID and Registered App Subject from that session and operation classification from typed protected ingress, treats AppID only as producer or catalog metadata, and deterministically composes Local with the current machine-selected Local Capability Configuration or Cloud with the calling App owner's committed AIConfig-owned CapabilityImplementation and Driver target plus the internally resolved current-account Connector. Runtime validates Connector ownership, credential configuration, App access, and existing policy, returns the existing owner or configuration-required, credential, access-denied, or policy reason on failure without requesting App-side Connector selection, and Local App Job submit captures an immutable Runtime-private owner containing current AccountID plus Registered App Subject; get, subscribe, cancel, artifact metadata, and bounded validated transcription_text authorize and project only that owner, historical Jobs without subject binding fail, and no ScenarioRequestHead accepts the subject. Artifact read, adoption, and artifact-reference input share one authorizer over the same tuple and the exact Runtime-selected operation, artifact read alone returns complete inline bytes at or below 32 MiB, metadata and streamed custody are body-free and uncapped by that inline ceiling, provider media commits before reference, and requests and responses contain no account, subject, principal, Agent, provider, model, route, target, connector, credential, grant, allowed-use selector, tool, raw-chunk, reasoning-trace, provider URL, or background-execution field.
    condition: Whenever a third-party Local App executes a synchronous scenario, submits, observes, or cancels a scenario Job, reads, uploads, adopts, or references a scenario artifact, lists voice assets, or streams a text turn.
    failure: Reject a missing or non-current protected App session, missing runtime.consume coverage, unbounded or out-of-closed-set input, unsupported artifact upload MIME, cross-owner or historical-unbound Job or artifact access, oversized inline artifact read or upload, absent or inadmissible owner AIConfig composition, and every caller-selected owner, use, route, or generic AI payload without forcing Local, changing the committed route, fallback, synthesized output, or an existence oracle; adoption returns the single broader artifact-unavailable result without target mutation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r110
    kind: rule
    title: Voice creation source preflight is deterministic and non-switching
    modality: must
    statement: For voice.create, a request declares exactly one typed source as text_description or reference_audio, a text_description source requires the effective implementation to declare input.text and a reference_audio source requires input.audio, the Local route dereferences only its one selected Local Capability Configuration and the Cloud route only its configured CapabilityImplementation, an undeclared or unsupported source fails closed without switching Local Capability Configuration, provider, implementation, or route, and the typed source is recorded only as non-routing provenance.
    condition: Whenever VOICE_CREATE accepts or validates a typed source.
    failure: Fail closed on undeclared or unsupported sources without fallback, switching, or route change.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r111
    kind: rule
    title: Execution model provenance is generic only
    modality: must
    statement: Provider and model execution provenance on stable AI scenario outputs appears only in the generic execution-owner model_resolved fields, a typed capability result message carries no capability-specific provider or model identity field, and WorldGenerateResult carries no model field.
    condition: Whenever stable AI scenario output carries execution provenance.
    failure: Reject a capability-specific provider or model provenance field on a typed result.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
  - id: rule.nimi.runtime.ai-provider.r112
    kind: rule
    title: VoxCPM public contract is synthesis only
    modality: must
    statement: Runtime exposes VoxCPM only as family voxcpm through one exact audio.synthesize CapabilityImplementation and Driver identity; the request requires non-empty text, admits only WAV output and the explicitly declared default synthesis voice posture, and returns one non-empty audio artifact, while unsupported options or voice references, missing configuration or exact binding, an unavailable backend, model-load failure, inference failure, empty audio, and cancellation fail with the existing typed speech Job semantics without fabricated output, family switching, route switching, fallback, or backend substitution. The standard Python and MLX backends never appear as separate public family or capability values, and no VoxCPM voice.create, voice clone, voice-design, reusable voice handle, or voice asset success is admitted in the first release.
    condition: Whenever VoxCPM metadata, configuration, request admission, execution, output, or failure is projected.
    failure: Reject every non-voxcpm family projection, backend-shaped public identity, undeclared voice-creation surface, unsupported input, or pseudo-success result.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.multimodal-provider-plane
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.voxcpm-family
