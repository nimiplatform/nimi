format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.memory-world
units:
  - id: definition.nimi.runtime.memory-world.canonical-memory-plane
    kind: definition
    title: Runtime LocalAgent operational Memory plane
    meaning: Runtime Agent Service owns LocalAgent operational Memory admission, recall, retention, isolation, lifecycle, and authorized projection.
  - id: definition.nimi.runtime.memory-world.memory-service-plane
    kind: definition
    title: Runtime Memory service plane
    meaning: Runtime provides Memory as a core LocalAgent capability and as a typed authorized Runtime capability without transferring product truth to Apps, UI caches, Realm, or Cognition.
  - id: definition.nimi.runtime.memory-world.memory-substrate-plane
    kind: definition
    title: Runtime Memory substrate boundary
    meaning: Runtime may use an internal admitted Memory substrate, but provider identity, storage mechanics, replay, migration, indexing, and implementation bindings remain Runtime-private and never become App or SDK authority.
  - id: definition.nimi.runtime.memory-world.knowledge-plane
    kind: definition
    title: Runtime LocalAgent operational Knowledge plane
    meaning: Runtime owns LocalAgent operational Knowledge ingestion, retrieval, isolation, lifecycle, source relation, and authorized projection while Realm retains canonical Character and World source truth.
  - id: definition.nimi.runtime.memory-world.scheduling-plane
    kind: definition
    title: Runtime resource scheduling plane
    meaning: Runtime owns request-time derived admission, private resource scheduling, Quota, Budget, and Rate Limit decisions for Memory, Knowledge, and LocalAgent Jobs without creating reusable capability readiness or transferring route, selection, or resolution authority to Cognition.
  - id: definition.nimi.runtime.memory-world.world-evolution-plane
    kind: definition
    title: Deferred World Evolution boundary
    meaning: World Evolution is deferred and non-core, with no current Runtime execution contract, readiness dependency, Workflow dependency, or authority over Realm World truth.
  - id: rule.nimi.runtime.memory-world.r001
    kind: rule
    title: LocalAgent operational Memory is Runtime owned
    modality: must
    statement: Runtime Agent Service alone decides which authorized LocalAgent inputs become operational Memory, which Memory is recalled for execution, and which Memory projection an authorized consumer may receive.
    condition: Whenever LocalAgent operational Memory is admitted, recalled, or projected.
    failure: Reject Memory truth owned or inferred by an App, UI cache, Realm projection, SDK, Kit, or Cognition adapter.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.canonical-memory-plane
  - id: rule.nimi.runtime.memory-world.r002
    kind: rule
    title: LocalAgent operational Knowledge is Runtime owned
    modality: must
    statement: Runtime Agent Service alone owns LocalAgent operational Knowledge ingestion, indexing, retrieval, execution use, retention, and authorized projection.
    condition: Whenever LocalAgent operational Knowledge is changed, queried, or consumed.
    failure: Reject Knowledge truth owned or inferred by an App, UI cache, Realm projection, SDK, Kit, or Cognition adapter.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.knowledge-plane
  - id: rule.nimi.runtime.memory-world.r003
    kind: rule
    title: Realm source truth remains independent
    modality: must
    statement: Realm owns PersonaCharacter, WorldCharacter, Character Source, World Source, canonical World data, and their access rules, while Runtime may consume admitted source context for LocalAgent Memory and Knowledge without becoming Realm authority.
    condition: Whenever Runtime derives operational context from Realm data.
    failure: Reject Runtime mutation of Realm canonical truth or Realm ownership of Runtime operational state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.knowledge-plane
  - id: rule.nimi.runtime.memory-world.r004
    kind: rule
    title: Source context cannot create LocalAgent identity alone
    modality: must
    statement: World Source may contribute World context, Knowledge, relations, and constraints, but only a Realm-issued Character Source establishes the identity source for LocalAgent materialization.
    condition: Whenever Memory or Knowledge context participates in materialization.
    failure: Reject World-only or context-only LocalAgent identity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.knowledge-plane
  - id: rule.nimi.runtime.memory-world.r005
    kind: rule
    title: Independent LocalAgents have independent operational state
    modality: must
    statement: Multiple LocalAgents materialized from the same Character Source always have separate operational Memory and Knowledge with no implicit shared mutable state.
    condition: Whenever more than one LocalAgent uses the same Character Source.
    failure: Reject implicit global merging or shared mutable operational truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.canonical-memory-plane
      - type: applies_to
        target: definition.nimi.runtime.memory-world.knowledge-plane
  - id: rule.nimi.runtime.memory-world.r006
    kind: rule
    title: Apps are Memory and Knowledge consumers
    modality: must_not
    statement: Nimi Home, Desktop, Zhiyu, Avatar, Simulator, SDK, Kit, or a Third-party App turns UI state, chat cache, local database, summary, embedding status, or a displayed source into Runtime Memory or Knowledge truth.
    condition: Whenever a consumer displays, caches, or submits Memory or Knowledge intent.
    failure: Use the typed Runtime projection and keep consumer state non-authoritative.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-service-plane
  - id: rule.nimi.runtime.memory-world.r007
    kind: rule
    title: Conversation cache cannot reconstruct Memory
    modality: must_not
    statement: An App or projection rebuilds LocalAgent Memory, Knowledge, activity, state, or Conversation continuity from transcript, local history, cached messages, or a prior projection.
    condition: Whenever a consumer restores a conversation surface.
    failure: Re-read Runtime owner state or present unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.canonical-memory-plane
  - id: rule.nimi.runtime.memory-world.r008
    kind: rule
    title: Memory and Knowledge access is session authorized
    modality: must
    statement: Runtime derives the current account, authorized first-party or internal consumer identity, target LocalAgent or admitted scope, and requested operation from the active session before projecting or mutating Memory or Knowledge for a separately admitted first-party or internal consumer; this rule creates no Memory or Knowledge operation for a protected Third-party Local App outside the canonical App Operation Contract.
    condition: Whenever a separately admitted first-party or internal consumer accesses Runtime Memory or Knowledge.
    failure: Fail closed when identity, authorization, scope, or owner policy is unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-service-plane
  - id: rule.nimi.runtime.memory-world.r009
    kind: rule
    title: Private content stays bounded
    modality: must
    statement: Memory and Knowledge projections expose to a separately admitted first-party or internal consumer only the content and metadata admitted for its current account, LocalAgent, scope, and operation, with private prompt, credential, provider, and internal substrate data remaining hidden; this projection rule does not make Memory or Knowledge available to a protected Third-party Local App outside the canonical App Operation Contract.
    condition: Whenever Memory or Knowledge leaves Runtime for a separately admitted first-party or internal consumer.
    failure: Reject over-broad disclosure and preserve information hiding.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-service-plane
  - id: rule.nimi.runtime.memory-world.r010
    kind: rule
    title: Mutation and deletion are owner confirmed
    modality: must
    statement: Runtime reports Memory or Knowledge mutation, forget, retention, rebuild, or deletion success only after its owning transaction commits, and a retry or missing record remains idempotent according to the owner contract.
    condition: Whenever Memory or Knowledge lifecycle intent executes.
    failure: Return the typed failure or pending state without changing Conversation or unrelated owner truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-service-plane
  - id: rule.nimi.runtime.memory-world.r011
    kind: rule
    title: Internal substrate is not a public authority
    modality: must_not
    statement: A storage engine, bank id, embedding provider, model id, index, migration marker, rebuild state, private loopback endpoint, internal binding, file path, or provider-native record becomes the public owner of Runtime Memory or Knowledge.
    condition: Whenever Runtime Memory or Knowledge implementation is projected.
    failure: Expose the typed Runtime capability and keep substrate mechanics private.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-substrate-plane
  - id: rule.nimi.runtime.memory-world.r012
    kind: rule
    title: Memory and Knowledge consume canonical capability composition
    modality: must
    statement: Operational Memory and Knowledge use their canonical AIConfig owner route, the machine owner's Local Capability Configuration selection or the committed Cloud CapabilityImplementation target and ConnectorGrant, and Runtime's deterministic exact Driver, binding, Quota, Budget and Rate Limit composition; Runtime-private Memory text.embed preserves input order, partitions target-generation materialization into batches of no more than sixteen inputs, gives every batch a 20-second deadline further bounded by caller and Memory-service lifetime, accepts exactly one finite vector of the exact captured embedding profile dimension per input, and commits the bank-owned rebuild or cutover generation only together with the complete validated projection; their bank and retrieval state stays separately owned and neither subsystem selects a model, probes capability readiness, or invents fallback.
    condition: Whenever Memory or Knowledge requires AI resources.
    failure: Fail closed with the typed derived admission or Job failure when exact committed inputs are unavailable, discard the incomplete target-generation projection, and leave the bank profile, generation, cutover, and unrelated owner state unchanged.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.scheduling-plane
  - id: rule.nimi.runtime.memory-world.r013
    kind: rule
    title: Consumers express intent only
    modality: must
    statement: A Nimi-owned SDK, Kit, or Desktop surface or another separately admitted first-party or internal consumer may submit supported Memory or Knowledge intent and display Runtime results but never selects a provider credential, private bank, internal route, migration strategy, or execution binding; this rule adds no Memory or Knowledge operation for a protected Third-party Local App outside the canonical App Operation Contract.
    condition: Whenever a separately admitted first-party or internal consumer configures or requests Memory or Knowledge.
    failure: Reject consumer-owned Runtime execution facts.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.runtime.memory-world.scheduling-plane
  - id: rule.nimi.runtime.memory-world.r014
    kind: rule
    title: Cognition remains an independent authority
    modality: must
    statement: Cognition may own standalone cognition capabilities and serve as an internal adapter, but it does not silently acquire Runtime LocalAgent Memory, Knowledge, Conversation, account, authorization, lifecycle, or execution truth.
    condition: Whenever Runtime uses a Cognition capability.
    failure: Preserve Runtime product ownership and fail closed when the adapter is unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-substrate-plane
  - id: rule.nimi.runtime.memory-world.r015
    kind: rule
    title: Cognition completeness is non-blocking
    modality: must
    statement: Future Cognition product, service, schema, or platform completeness does not block the current Runtime LocalAgent Memory, Knowledge, Conversation, SDK, Nimi Home, or App closure.
    condition: Whenever Cognition roadmap work is related to Runtime readiness.
    failure: Keep current Runtime capabilities independently available or explicitly unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-substrate-plane
  - id: rule.nimi.runtime.memory-world.r016
    kind: rule
    title: World Evolution is deferred
    modality: must
    statement: World Evolution has no current Runtime core execution, Workflow, readiness, LocalAgent, Memory, Knowledge, or Realm World mutation contract and remains isolated and non-blocking.
    condition: Whenever current Runtime or Realm readiness is defined.
    failure: Keep World Evolution unavailable until a separate product authority resolves its future owner and contract.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.world-evolution-plane
  - id: rule.nimi.runtime.memory-world.r017
    kind: rule
    title: World truth never moves into Runtime evolution
    modality: must_not
    statement: A deferred World Evolution mechanism, Runtime Memory, Runtime Knowledge, or LocalAgent projection becomes canonical Realm World state or history.
    condition: Whenever World-related Runtime data is persisted or displayed.
    failure: Preserve Realm World authority and keep Runtime data operational and local.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.world-evolution-plane
  - id: rule.nimi.runtime.memory-world.r018
    kind: rule
    title: Missing Memory or Knowledge fails closed
    modality: must
    statement: Missing authorization, source access, Runtime service availability, substrate availability, exact admitted AI Job context, typed derived admission, or owner result produces typed unavailable or failure with no capability-readiness lifecycle, empty-success, fixture, cached truth, or App-local fallback.
    condition: Whenever a Memory or Knowledge operation cannot complete.
    failure: Return the typed Runtime failure before mutation or execution.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.memory-world.memory-service-plane
