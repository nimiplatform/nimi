format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.agent-service
units:
  - id: definition.nimi.runtime.agent-service.context-composition-plane
    kind: definition
    title: Runtime LocalAgent context composition plane
    meaning: Runtime owns the private composition of model-facing context for a LocalAgent turn from admitted Realm source material, committed Conversation, operational Memory and Knowledge, current policy, and Runtime-selected AI route; Apps receive only bounded status and output projections and never own or reconstruct that context.
  - id: definition.nimi.runtime.agent-service.agent-service-plane
    kind: definition
    title: Runtime LocalAgent service plane
    meaning: Runtime Agent Service is the service name for the Runtime-owned LocalAgent execution plane, including LocalAgent lifecycle, Conversation, operational Memory and Knowledge, state, voice, events, AI route consumption, and resource policy; it does not introduce a separate Agent product entity.
  - id: definition.nimi.runtime.agent-service.local-agent-materialization-plane
    kind: definition
    title: Runtime LocalAgent materialization plane
    meaning: Runtime materializes a new independent LocalAgent only from a Realm-issued Character Source, optionally enriched by an admitted World Source, and owns the resulting local identity, configuration, Memory, Knowledge, Conversation, and lifecycle without taking ownership of Realm Character or World truth.
  - id: rule.nimi.runtime.agent-service.r001
    kind: rule
    title: LocalAgent turn context is Runtime-owned
    modality: must
    statement: Runtime composes every LocalAgent turn from admitted source, Conversation, Memory, Knowledge, policy, tool, media, and AI route inputs and keeps model-facing context private from Apps and presentation consumers.
    condition: Whenever a LocalAgent turn is prepared or executed.
    failure: Reject caller-composed context, missing required Runtime inputs, or context ownership outside Runtime.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.context-composition-plane
  - id: rule.nimi.runtime.agent-service.r008
    kind: rule
    title: Realm source material remains data
    modality: must
    statement: Realm Character and World source material is admitted as typed data and provenance for Runtime composition and never becomes model-facing instruction authority merely because it was included in a source record.
    condition: Whenever Realm source material enters LocalAgent context.
    failure: Reject source material interpreted as higher-authority instruction or as Runtime-owned Realm truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.context-composition-plane
  - id: rule.nimi.runtime.agent-service.r010
    kind: rule
    title: Conversation truth is committed by Runtime
    modality: must
    statement: Runtime owns LocalAgent Conversation and committed conversation continuity; an App transcript, UI cache, optimistic turn, renderer state, or projection replay is never Conversation truth.
    condition: Whenever LocalAgent conversation history is written, recovered, or projected.
    failure: Reject App-owned conversation truth and recover only from Runtime-committed state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r011
    kind: rule
    title: Operational Memory and Knowledge are Runtime-owned
    modality: must
    statement: Runtime owns each LocalAgent's operational Memory and Knowledge as core capabilities, keeps them distinct from Conversation and from Cognition-owned data, and exposes them only through admitted Runtime operations and projections.
    condition: Whenever LocalAgent Memory or Knowledge is read, written, or projected.
    failure: Reject App, Avatar, Desktop, Cognition, or Realm takeover of Runtime operational truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r013
    kind: rule
    title: Runtime alone composes provider-visible input
    modality: must
    statement: Runtime alone selects and orders the provider-visible system, user, source, Conversation, Memory, Knowledge, tool, and media inputs for a LocalAgent operation.
    condition: Whenever a LocalAgent operation invokes Local or Cloud AI.
    failure: Reject App-authored provider payloads, role ordering, prompts, model selection, or hidden context.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.context-composition-plane
  - id: rule.nimi.runtime.agent-service.r016
    kind: rule
    title: Context status projections are bounded
    modality: must
    statement: Runtime may expose typed readiness, blocked, failure, budget, truncation, provenance, and correlation status for LocalAgent context, but never raw prompts, source bodies, transcripts, private Memory, Knowledge, credentials, provider payloads, or reconstructable context.
    condition: Whenever context status crosses the Runtime boundary.
    failure: Reject an over-broad or reconstructable projection and report typed unavailable state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.context-composition-plane
  - id: rule.nimi.runtime.agent-service.r020
    kind: rule
    title: Runtime Agent Service owns LocalAgents
    modality: must
    statement: Runtime Agent Service owns and executes LocalAgent entities; Agent, AgentFamily, AgentPersona, AgentFamilyId, and AgentPersonaId are not Nimi product entities, and the service name creates no additional ontology.
    condition: Whenever Runtime identity, lifecycle, execution, or API semantics are modeled.
    failure: Reject a parallel Agent ontology or any owner other than Runtime for LocalAgent execution truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r021
    kind: rule
    title: Runtime is the LocalAgent execution authority
    modality: must
    statement: Runtime owns LocalAgent execution, state, Conversation, operational Memory and Knowledge, voice decisions, event truth, and lifecycle while Nimi Home, Zhiyu, Avatar, SDK consumers, and Third-party Apps remain controllers or projection readers.
    condition: Whenever a LocalAgent capability is executed or consumed.
    failure: Reject execution truth or durable LocalAgent truth owned by a consumer.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r025
    kind: rule
    title: Apps remain controllers and projection readers
    modality: must
    statement: Apps may submit typed user intent, invoke admitted LocalAgent operations, and render bounded projections, but never assemble prompts, call providers for a LocalAgent, own Conversation, Memory or Knowledge, or infer LocalAgent truth from UI state.
    condition: Whenever an App consumes Runtime Agent Service.
    failure: Reject App-owned execution or truth and keep the operation unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r026
    kind: rule
    title: Public LocalAgent operations stay bounded
    modality: must
    statement: Public SDK and App operations expose typed LocalAgent intent, lifecycle, Conversation, Memory, Knowledge, voice, state, and projection capabilities only where separately admitted; internal composition, credentials, provider payloads, and Runtime proof material never become public operation inputs.
    condition: Whenever a Runtime LocalAgent operation is exposed.
    failure: Reject an operation that transfers Runtime ownership or accepts internal execution material.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r032
    kind: rule
    title: Local App access is session-derived and bounded
    modality: must
    statement: A Desktop-hosted Local App accesses an explicit localAgentId only when Runtime derives the current account, current App identity, current authorization, requested operation, and LocalAgent ownership or access from the active session; the App receives no Realm JWT, Provider Credential, account-wide LocalAgent inventory authority, caller-maintained Runtime proof, AgentProjectionRef, or LocalAgentBinding.
    condition: Whenever a scaffolded Third-party Local App invokes a LocalAgent operation.
    failure: Reject missing or caller-declared authorization and expose no broader LocalAgent state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r034
    kind: rule
    title: Conversation listing is scoped and read-only
    modality: must
    statement: Runtime may list only the calling App's authorized LocalAgent conversation summaries, and such summaries remain read-only projections rather than local transcript or ownership authority.
    condition: Whenever an App requests available LocalAgent conversations.
    failure: Reject cross-App, cross-account, or unauthorized LocalAgent listing.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r038
    kind: rule
    title: LocalAgent Conversation is not generic App history
    modality: must_not
    statement: An App treats Runtime LocalAgent Conversation as a generic chat-history store, App-owned transcript database, or replacement for App-private data.
    condition: Whenever conversation storage or history APIs are consumed.
    failure: Reject the misuse and preserve Runtime LocalAgent Conversation ownership.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r039
    kind: rule
    title: AI resources remain Runtime-managed
    modality: must
    statement: Runtime selects AI routes and owns Token, Quota, Budget, metering, and resource admission for LocalAgent execution; Apps may observe bounded readiness and usage projections but never own or bypass those decisions.
    condition: Whenever Local or Cloud AI resources are selected or consumed for a LocalAgent.
    failure: Reject caller-selected hidden routes, unmetered execution, or App-owned resource truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r040
    kind: rule
    title: Core capability unavailability is explicit
    modality: must
    statement: Missing Local AI readiness, authorization, Character Source, Runtime route, Memory, Knowledge, Conversation, or required service health produces a typed blocked, unavailable, or failed outcome and never mock success or an App-local fallback execution.
    condition: Whenever a LocalAgent core operation cannot run.
    failure: Fail closed with the owning Runtime reason and no fabricated result.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r043
    kind: rule
    title: Materialization is the sole LocalAgent creation path
    modality: must
    statement: Runtime creates a LocalAgent only by materializing a Realm-issued Character Source; a World Source may add admitted World context and constraints but cannot independently create LocalAgent identity.
    condition: Whenever a new LocalAgent is created.
    failure: Reject source-free, App-created, or World-only LocalAgent identity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.local-agent-materialization-plane
  - id: rule.nimi.runtime.agent-service.r044
    kind: rule
    title: Character Source kinds follow Realm Character ontology
    modality: must
    statement: A LocalAgent identity source resolves to a Realm PersonaCharacter or WorldCharacter through Realm-owned Character Source semantics, and Runtime does not invent another Character or Agent family.
    condition: Whenever Runtime interprets a LocalAgent identity source.
    failure: Reject an unrecognized source kind or a Runtime-owned Character classification.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.local-agent-materialization-plane
  - id: rule.nimi.runtime.agent-service.r045
    kind: rule
    title: Scaffolded App source access stays Runtime-mediated
    modality: must
    statement: For a Desktop-hosted scaffolded App, Runtime mediates the Realm source access required for LocalAgent materialization and keeps Realm authentication and proof custody outside the App.
    condition: Whenever a scaffolded App requests LocalAgent materialization.
    failure: Reject App-held Realm JWT, App-built Runtime proof, or direct App materialization bypass.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.local-agent-materialization-plane
  - id: rule.nimi.runtime.agent-service.r046
    kind: rule
    title: Materialization is not a Third-party App permission
    modality: must
    statement: Third-party App authorization to interact with a LocalAgent never grants authority to create, rematerialize, replace, or take ownership of a LocalAgent.
    condition: Whenever App permissions or LocalAgent lifecycle operations are evaluated.
    failure: Reject lifecycle authority inferred from interaction access.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.local-agent-materialization-plane
  - id: rule.nimi.runtime.agent-service.r047
    kind: rule
    title: Realm and Runtime ownership stays split
    modality: must
    statement: Realm owns Character, World, Character Source, World Source, access, and audit truth while Runtime owns the materialized LocalAgent and its local operational truth; neither side writes its owned truth back as the other's authority.
    condition: Whenever materialization or later LocalAgent lifecycle crosses the Realm and Runtime boundary.
    failure: Reject Realm-side LocalAgent ownership, Runtime-side Realm source ownership, or write-back across the owner boundary.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.local-agent-materialization-plane
  - id: rule.nimi.runtime.agent-service.r051
    kind: rule
    title: Each materialization creates an independent LocalAgent
    modality: must
    statement: The same Realm Character Source may materialize multiple independent LocalAgents, and every materialization receives distinct local identity, configuration, Memory, Knowledge, Conversation, and lifecycle without implicit merge or global default selection.
    condition: Whenever a Character Source is materialized more than once.
    failure: Reject identity reuse, implicit instance merge, or a source-wide global LocalAgent.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.local-agent-materialization-plane
  - id: rule.nimi.runtime.agent-service.r054
    kind: rule
    title: LocalAgent termination removes the complete local projection
    modality: must
    statement: Terminating a LocalAgent removes its Runtime-owned local identity, configuration, Conversation, operational Memory and Knowledge, events, scheduled work, and local execution material without mutating the originating Realm Character or World source.
    condition: Whenever an authorized LocalAgent termination commits.
    failure: Fail the termination if Runtime cannot remove the complete owned local projection atomically.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.local-agent-materialization-plane
  - id: rule.nimi.runtime.agent-service.r055
    kind: rule
    title: LocalAgent termination is idempotent and fail-closed
    modality: must
    statement: An authorized repeated termination reports the already-absent LocalAgent honestly, never recreates state, and never reports success while Runtime-owned LocalAgent material remains.
    condition: Whenever LocalAgent termination is retried or interrupted.
    failure: Return a typed non-success or already-absent outcome and preserve no partial-success claim.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.local-agent-materialization-plane
  - id: rule.nimi.runtime.agent-service.r057
    kind: rule
    title: Proactive projection is optional and non-blocking
    modality: must
    statement: Optional proactive LocalAgent behavior remains Runtime-owned, explicit, interruptible, default-off, and typed when present, and its absence never blocks ordinary LocalAgent conversation, Memory, Knowledge, voice, or readiness.
    condition: Whenever proactive behavior is configured or unavailable.
    failure: Reject hidden scheduling, App-owned proactive execution, and readiness dependency on the optional path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
