format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.agent-service
units:
  - id: definition.nimi.runtime.agent-service.context-composition-plane
    kind: definition
    title: Runtime LocalAgent context composition plane
    meaning: Runtime owns the private composition of model-facing context for a LocalAgent turn from the LocalAgent's immutable materialization snapshot projection, always-on Character and World lorebook, optional Cognition source candidates, optional Cognition-owned event-derived Memory hits, committed Conversation and sequence-bound summary, current policy, one shared private recall contract, and the Local or Cloud route committed by the singular account-scoped shared LocalAgent AIConfig; only at Job submission a Local route atomically dereferences the Machine Loadout store selection into a complete persisted ResolvedAssembly, and Apps receive only bounded status and output projections and never own, reread, or reconstruct that context.
  - id: definition.nimi.runtime.agent-service.agent-service-plane
    kind: definition
    title: Runtime LocalAgent service plane
    meaning: Runtime Agent Service is the service name for the Runtime-owned LocalAgent execution plane, including LocalAgent lifecycle, Conversation and committed events, Agent-scoped Memory lifecycle mediation, Cognition Memory authorization and facade operations, context planning, state, voice, AI route consumption, and resource policy without owning Cognition canonical Memory or Knowledge; the service name does not create another product identity layer.
  - id: definition.nimi.runtime.agent-service.local-agent-materialization-plane
    kind: definition
    title: Runtime LocalAgent materialization plane
    meaning: Runtime materializes a new independent LocalAgent only from a Realm-issued Character Source with its required owning World companion, validates and retains the resulting immutable execution snapshot, and solely projects that snapshot into one always-on Character and World lorebook plus typed non-lorebook Cognition ingestion units while owning the resulting local identity, Conversation, committed events, Agent-scoped Memory enabled state and lifecycle orchestration without taking ownership of Realm Character or World truth or Cognition canonical Memory and Knowledge.
  - id: rule.nimi.runtime.agent-service.r001
    kind: rule
    title: LocalAgent turn context is Runtime-owned
    modality: must
    statement: Runtime composes every LocalAgent turn from Runtime policy, the complete snapshot-bound Character and World lorebook, committed recent Conversation admitted newest-first only as complete user and assistant turns whose message content is admitted or omitted with the whole turn and never truncated, optional sequence-bound summary, optional snapshot-bound Cognition source candidates, optional Cognition-owned event-derived Memory hits, one shared source-or-Memory private recall opportunity, tool, media, current-turn, reserve, output, and captured AI route inputs; current request, recent Conversation, and canonical source truth remain above Memory, Runtime resolves the selected route's exact context capacity before provider execution and again after any private recall result, and keeps model-facing context private from Apps and presentation consumers.
    condition: Whenever a LocalAgent turn is prepared or executed.
    failure: Reject caller-composed context, missing required Runtime inputs, unresolved or insufficient exact context capacity, or context ownership outside Runtime with a typed pre-provider admission result.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.context-composition-plane
  - id: rule.nimi.runtime.agent-service.r008
    kind: rule
    title: Realm source material remains data
    modality: must
    statement: Realm Character and World source material is admitted as typed data and provenance for Runtime composition and never becomes model-facing instruction authority merely because it was included in a source record.
    condition: Whenever Realm source material enters LocalAgent context.
    failure: Reject source material interpreted as higher-authority instruction or as Runtime-owned Realm truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.context-composition-plane
  - id: rule.nimi.runtime.agent-service.r010
    kind: rule
    title: Conversation truth is committed by Runtime
    modality: must
    statement: Runtime owns LocalAgent Conversation and committed conversation continuity; an App transcript, UI cache, optimistic turn, renderer state, or projection replay is never Conversation truth.
    condition: Whenever LocalAgent conversation history is written, recovered, or projected.
    failure: Reject App-owned conversation truth and recover only from Runtime-committed state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r011
    kind: rule
    title: Long-term Memory and Knowledge remain Cognition-owned
    modality: must
    statement: Cognition alone owns each LocalAgent's long-term Memory and Knowledge canonical content, provenance, lifecycle, admission, recall ranking, correction, supersession, forget barriers, deletion, and derived indexes; Runtime owns only authorization and mediation, opaque binding and delivery state, AI Job execution, context selection, bounded projection, and final Conversation continuity, and Knowledge has no active V1 Runtime turn or prompt path.
    condition: Whenever LocalAgent Memory or Knowledge is read, written, or projected.
    failure: Reject Runtime, App, Avatar, Desktop, Realm, or SDK ownership of Cognition Memory or Knowledge truth and reject any parallel long-term store or direct write path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r013
    kind: rule
    title: Runtime alone composes provider-visible input
    modality: must
    statement: Runtime alone selects and orders the provider-visible policy, always-on lorebook, Cognition source candidates, Cognition-owned event-derived Memory hits, Conversation, summary, one shared source-or-Memory private recall result, tool, media, current-turn, and output-contract inputs for a LocalAgent operation without owning or recomputing Cognition ranking or lifecycle truth.
    condition: Whenever a LocalAgent operation invokes Local or Cloud AI.
    failure: Reject App-authored provider payloads, role ordering, prompts, model selection, or hidden context.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.context-composition-plane
  - id: rule.nimi.runtime.agent-service.r016
    kind: rule
    title: Context status projections are bounded
    modality: must
    statement: Runtime may expose typed snapshot and lorebook readiness, independent source and event-derived Memory unconfigured, pending or building, ready, unavailable, failure, invalid, or no_hits adapter outcomes, Runtime no_result selection outcome, recall count, admission, blocked, failure, budget, omission, bounded provenance, and safe correlation status for LocalAgent context, but never raw prompts, source bodies, Cognition units, Memory corpus, ranking, internal generation, opaque Cognition storage identity, transcripts, Knowledge, credentials, provider payloads, private recall payloads, reconstructable context, or a reusable readiness result.
    condition: Whenever context status crosses the Runtime boundary.
    failure: Reject an over-broad or reconstructable projection and report typed unavailable state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.context-composition-plane
  - id: rule.nimi.runtime.agent-service.r020
    kind: rule
    title: Runtime Agent Service owns LocalAgents
    modality: must
    statement: Runtime Agent Service owns and executes LocalAgent identities, lifecycle, state, and turns, and its service name does not introduce another product identity layer.
    condition: Whenever Runtime identity, lifecycle, execution, or API semantics are modeled.
    failure: Reject any owner other than Runtime for LocalAgent execution truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r021
    kind: rule
    title: Runtime is the LocalAgent execution authority
    modality: must
    statement: Runtime owns LocalAgent execution, state, Conversation, committed event truth, context planning, voice decisions, Agent-scoped Memory lifecycle mediation, and final commit while Cognition owns long-term Memory and Knowledge and Nimi Home, Zhiyu, Avatar, SDK consumers, and Third-party Apps remain controllers or projection readers.
    condition: Whenever a LocalAgent capability is executed or consumed.
    failure: Reject execution truth or durable LocalAgent truth owned by a consumer.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r025
    kind: rule
    title: Apps remain controllers and projection readers
    modality: must
    statement: Apps may submit typed user intent, invoke admitted LocalAgent operations, and render bounded projections, but never assemble prompts, call providers for a LocalAgent, own Conversation, Memory or Knowledge, or infer LocalAgent truth from UI state.
    condition: Whenever an App consumes Runtime Agent Service.
    failure: Reject App-owned execution or truth and keep the operation unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r026
    kind: rule
    title: Public LocalAgent operations stay bounded
    modality: must
    statement: Public SDK and App operations expose typed LocalAgent intent, lifecycle, Conversation, voice, state, and projection capabilities plus Runtime-mediated Memory inspect, correction, forget, enabled-state, and delete-all intent only where separately admitted; generic Knowledge, direct Memory write, export, observatory, internal composition, credentials, provider payloads, and Runtime proof material never become public operation inputs.
    condition: Whenever a Runtime LocalAgent operation is exposed.
    failure: Reject an operation that transfers Runtime ownership or accepts internal execution material.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r032
    kind: rule
    title: Local App access is session-derived and bounded
    modality: must
    statement: Runtime may project the calling protected Local App a bounded reference catalog covering all current-account active LocalAgents and a session-scoped opaque handle for each entry only when the canonical App Operation Contract maps runtime.agent.reference.list to agent.local and the current Effective App Access Snapshot covers agent.local; each handle is a non-secret selector rather than a grant, bearer, durable identity, relationship authority, or raw localAgentId, and every later operation, including bounded embodiment snapshot or subscription carrying independently owned companion state, resolves and revalidates the handle against the current account, active LocalAgent, App subject, agent.local snapshot coverage, exact canonical AppOperationId mapping, and any operation-required Runtime-issued Conversation anchor before sanitizing existing Runtime owner truth; companion request and cancel remain Conversation send and interrupt intent and raw replay is never projected.
    condition: Whenever a formal registered App invokes a LocalAgent operation through protected ingress.
    failure: Reject missing, stale, caller-authored, cross-account, inactive-Agent, or unsupported-operation access and expose no broader LocalAgent, credential, configuration, or inventory truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r034
    kind: rule
    lifecycle: removed
    title: Retired Third-party App conversation listing
    reason: Removed because conversation listing is not in the initial canonical App operation contract; reference listing and the admitted typed Conversation operations do not imply a shadow history or conversation-inventory API.
  - id: rule.nimi.runtime.agent-service.r038
    kind: rule
    title: LocalAgent Conversation is not generic App history
    modality: must_not
    statement: An App treats Runtime LocalAgent Conversation as a generic chat-history store, App-owned transcript database, or replacement for App-private data.
    condition: Whenever conversation storage or history APIs are consumed.
    failure: Reject the misuse and preserve Runtime LocalAgent Conversation ownership.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r039
    kind: rule
    title: AI resources remain Runtime-managed
    modality: must
    statement: The shared LocalAgent AIConfig owns each CapabilityContract's Local or Cloud route intent, the Machine Loadout store owns its set-or-empty selected relation, and at LocalAgent Job admission Runtime atomically persists either a complete Local ResolvedAssembly or exact Cloud effective inputs together with authorization, Token, Quota, Budget, and metering; queued, running, and resumed Jobs use only those captured inputs. Apps may observe bounded typed admission and usage projections but never choose a hidden execution target or bypass those facts.
    condition: Whenever Local or Cloud AI resources are composed or consumed for a LocalAgent.
    failure: Reject Runtime route search, current-owner rereads, per-Agent overrides, caller-selected hidden targets, unmetered execution, fallback, or App-owned resource truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r040
    kind: rule
    title: Core capability unavailability is explicit
    modality: must
    statement: A missing or invalid selected Loadout, unresolved required binding, uninterpretable Driver configuration, standardized-feature mismatch, missing or foreign current-account Cloud Connector, unusable credential, App access or policy denial, Character Source, Conversation, or required service dependency produces the existing typed owner, configuration-required, access-denied, admission, unavailable, or failed outcome without requesting App-side Connector selection and never public readiness, mock success, route mutation, automatic re-selection, or App-local fallback execution; event-derived Memory Recall unconfigured, building, unavailable, or failed contributes zero optional hits and does not block an otherwise valid ordinary turn, while Memory mutation, correction, forget, or deletion failure remains typed and fail closed.
    condition: Whenever a LocalAgent core operation cannot run.
    failure: Fail closed with the owning Runtime reason and no fabricated result.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r043
    kind: rule
    title: Materialization is the sole LocalAgent creation path
    modality: must
    statement: Runtime creates a LocalAgent only by materializing a Realm-issued Character Source whose verified Packet carries exactly one required owning World companion closure; Runtime accepts no Character-only materialization and no optional or independently supplied World Source input, and World context cannot independently create LocalAgent identity.
    condition: Whenever a new LocalAgent is created.
    failure: Reject source-free, App-created, Character-only, missing-owning-World, optional-independent-World, or World-only LocalAgent materialization.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.local-agent-materialization-plane
  - id: rule.nimi.runtime.agent-service.r044
    kind: rule
    title: Character Source kinds follow Realm Character ontology
    modality: must
    statement: A LocalAgent identity source resolves to a Realm PersonaCharacter or WorldCharacter through Realm-owned Character Source semantics, and Runtime does not invent another Character or LocalAgent source taxonomy.
    condition: Whenever Runtime interprets a LocalAgent identity source.
    failure: Reject an unrecognized source kind or a Runtime-owned Character classification.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.local-agent-materialization-plane
  - id: rule.nimi.runtime.agent-service.r045
    kind: rule
    lifecycle: removed
    title: Retired scaffolded App LocalAgent materialization
    reason: Removed because Third-party App LocalAgent materialization is not in the canonical App operation contract and no direct or hidden materialization path is admitted.
  - id: rule.nimi.runtime.agent-service.r046
    kind: rule
    title: App interaction access creates no materialization authority
    modality: must
    statement: Declaration-derived Third-party App access to reference or interact with an existing LocalAgent never creates authority to create, materialize, rematerialize, replace, terminate, or take ownership of a LocalAgent.
    condition: Whenever Third-party App access or LocalAgent lifecycle operations are evaluated.
    failure: Reject lifecycle authority inferred from interaction access.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.local-agent-materialization-plane
  - id: rule.nimi.runtime.agent-service.r047
    kind: rule
    title: Realm and Runtime ownership stays split
    modality: must
    statement: Realm owns Character, World, Character Source, World Source, access, and audit truth while Runtime owns the materialized LocalAgent and its local operational truth; neither side writes its owned truth back as the other's authority.
    condition: Whenever materialization or later LocalAgent lifecycle crosses the Realm and Runtime boundary.
    failure: Reject Realm-side LocalAgent ownership, Runtime-side Realm source ownership, or write-back across the owner boundary.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.local-agent-materialization-plane
  - id: rule.nimi.runtime.agent-service.r051
    kind: rule
    title: Each materialization creates an independent LocalAgent
    modality: must
    statement: The same Realm Character Source may materialize multiple independent LocalAgents, and every materialization receives distinct local identity, Conversation, Cognition Memory bank binding, Agent-scoped Memory enabled state, Memory and Knowledge namespace, and lifecycle without implicit merge or global default selection, while every LocalAgent in one account continues to consume the same singular account-scoped shared LocalAgent AIConfig with no per-Agent route or model override.
    condition: Whenever a Character Source is materialized more than once.
    failure: Reject identity reuse, implicit instance merge, or a source-wide global LocalAgent.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.local-agent-materialization-plane
  - id: rule.nimi.runtime.agent-service.r054
    kind: rule
    title: LocalAgent termination removes the complete local projection
    modality: must
    statement: Terminating a LocalAgent establishes a durable terminating fence before destructive work, rejects new sessions, turns, event delivery, Memory Commit and Recall, and reports success only after Cognition has committed deletion or already-absence for the exact Agent-private Memory bank and required source scope and Runtime has removed the LocalAgent identity, immutable snapshot and lorebook, Agent-scoped configuration, Conversation and summary, committed event delivery state, scheduled work, and local execution material without mutating the originating Realm Character or World source or another LocalAgent; rematerializing the same source creates a new empty Memory bank.
    condition: Whenever an authorized LocalAgent termination commits.
    failure: Fail the termination if Runtime cannot remove the complete owned local projection atomically.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.local-agent-materialization-plane
  - id: rule.nimi.runtime.agent-service.r055
    kind: rule
    title: LocalAgent termination is idempotent and fail-closed
    modality: must
    statement: An authorized repeated termination reports the already-absent LocalAgent honestly, never recreates Runtime or Cognition Memory, and never reports success while the Runtime-owned LocalAgent projection, exact Cognition Memory bank, or required source scope remains; a Cognition deletion failure prevents aggregate success, while a later Runtime phase failure preserves a durable retryable fence and never silently rebuilds deleted Memory or reports partial success.
    condition: Whenever LocalAgent termination is retried or interrupted.
    failure: Return a typed non-success or already-absent outcome and preserve no partial-success claim.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.local-agent-materialization-plane
  - id: rule.nimi.runtime.agent-service.r057
    kind: rule
    title: Proactive projection is optional and non-blocking
    modality: must
    statement: Optional proactive LocalAgent behavior remains Runtime-owned, explicit, interruptible, default-off, and typed when present, and its absence never blocks ordinary LocalAgent conversation, Memory, Knowledge, voice, or readiness.
    condition: Whenever proactive behavior is configured or unavailable.
    failure: Reject hidden scheduling, App-owned proactive execution, and readiness dependency on the optional path.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
  - id: rule.nimi.runtime.agent-service.r058
    kind: rule
    title: Materialization partition is singular and snapshot-bound
    modality: must
    statement: Each new-contract materialization or derived rebuild invokes exactly one Runtime materialization projector over the target LocalAgent immutable snapshot and obtains one deterministic partition result that simultaneously yields the complete Runtime Character and World lorebook, typed non-lorebook Cognition ingestion units, provenance, and explicit omissions; Cognition never parses the raw snapshot or independently classifies always-on content.
    condition: Whenever a LocalAgent is materialized or its derived lorebook or Cognition source corpus is rebuilt.
    failure: Reject the materialization or rebuild before ready state when the snapshot, partition, provenance, coverage, or output binding is missing, contradictory, non-deterministic, or produced by another parser.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.local-agent-materialization-plane
  - id: rule.nimi.runtime.agent-service.r059
    kind: rule
    title: Snapshot lorebook is complete and always on
    modality: must
    statement: Runtime derives the complete compact Character and World lorebook only from the Realm-declared always-on fields in the LocalAgent immutable snapshot, admits that unchanged lorebook on every turn, and never retrieves, summarizes, infers, truncates, or replaces it with optional Cognition content.
    condition: Whenever a source-backed LocalAgent is materialized, restored, rebuilt, or admitted for a turn.
    failure: Block materialization or the turn before provider execution when the required declaration, owning World, lorebook, or snapshot binding is missing, invalid, corrupt, over-bound, or mismatched.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.context-composition-plane
      - type: applies_to
        target: definition.nimi.runtime.agent-service.local-agent-materialization-plane
  - id: rule.nimi.runtime.agent-service.r060
    kind: rule
    title: Source Cognition is optional and never a full-source fallback
    modality: must
    statement: Runtime consumes Cognition source candidates only after authorization and opaque per-Agent scope plus immutable snapshot validation and within an independent whole-unit budget; Bridge no_hits means a successful query returned no candidates, Runtime no_result means successful candidates were all rejected by Runtime guard or budget while the Bridge result remains preserved, and unconfigured, building, unavailable, or failed Cognition yields zero optional units without changing LocalAgent readiness or selecting another provider or model.
    condition: Whenever Runtime retrieves or plans optional Cognition source context.
    failure: Reject mismatched candidates, merged outcomes, partial units, automatic route changes, Realm-current-source reads, cached cross-Agent results, and any full-source prompt fallback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.context-composition-plane
      - type: applies_to
        target: definition.nimi.runtime.agent-service.local-agent-materialization-plane
  - id: rule.nimi.runtime.agent-service.r061
    kind: rule
    title: One shared private source or Memory recall round is Runtime mediated
    modality: must
    statement: The Round One shared source-or-Memory recall definition is part of the mandatory execution floor, a LocalAgent turn may issue at most one validated Runtime-private recall request across both optional lanes, Runtime mediates it against the same authorized Agent scope, source snapshot, and Memory bank and replans Round Two with the same captured route and Loadout, and only the final validated assistant output may commit to Conversation.
    condition: Whenever a LocalAgent model requests deeper source or Memory context.
    failure: Fail before provider execution when the mandatory recall definition cannot fit, or fail the turn on malformed, repeated, unauthorized, cross-Agent, mismatched, parallel source-and-Memory, or second-round recall without exposing or committing the private request or result.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.context-composition-plane
  - id: rule.nimi.runtime.agent-service.r062
    kind: rule
    title: Legacy source consumption is hard cut
    modality: must_not
    statement: Active Runtime reads, upgrades, migrates, rematerializes, or rebuilds an implementation-precut LocalAgent snapshot, rereads current Realm source for an existing LocalAgent, supports post-birth source adoption, or retains a dual per-turn full-source compiler, compatibility reader, feature flag, or prompt fallback.
    condition: Whenever a LocalAgent source snapshot is admitted, restored, rebuilt, or consumed after the new materialization contract is active.
    failure: Reject the unsupported snapshot or operation explicitly and require a new authorized materialization rather than adapting or falling back.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.agent-service.local-agent-materialization-plane
  - id: rule.nimi.runtime.agent-service.r063
    kind: rule
    title: Legacy Runtime long-term Memory ownership is hard cut
    modality: must_not
    statement: Active Runtime creates, reads, writes, ranks, reviews, indexes, decays, forgets, exports, migrates, or serves a long-term Memory or Knowledge store, accepts direct Retain or generic Memory and Knowledge operations, maintains dual delivery, dual read, compatibility readers, feature flags, fallback owners, or product startup migration for pre-Cognition-v1 state, or treats historical Runtime Memory data as current truth.
    condition: Whenever LocalAgent long-term Memory or Knowledge is admitted, delivered, recalled, mutated, restored, or exposed after the Cognition v1 contract is active.
    failure: Reject the legacy path explicitly, retain Cognition as the sole mutable owner, and limit pre-release old data disposition to a non-product one-time action.
    relations:
      - type: applies_to
        target: definition.nimi.cognition.memory.domain
      - type: applies_to
        target: definition.nimi.runtime.agent-service.agent-service-plane
