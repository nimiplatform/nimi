format: nimicoding.authority/v2
owner: team.runtime
scope: runtime.model-catalog
units:
  - id: definition.nimi.runtime.model-catalog.catalog-plane
    kind: definition
    title: Runtime model catalog plane
    meaning: The Runtime model catalog plane owns provider-scoped snapshot and source truth for models, voices, pricing, capabilities, and activation, together with catalog resolution order, overlay merge semantics, and lookup fail-close behavior for every catalog consumer.
  - id: definition.nimi.runtime.model-catalog.local-resolver-plane
    kind: definition
    lifecycle: removed
    title: Retired Runtime local resolver plane
    reason: Removed because catalog and host fitness may recommend concrete LocalAssets but never resolve bindings, machine selection, admission, readiness, or execution routes.
  - id: definition.nimi.runtime.model-catalog.local-install-recommendation-plane
    kind: definition
    title: Runtime local recipe and install recommendation plane
    meaning: The Runtime local recipe and install recommendation plane owns versioned catalog recipe metadata, concrete ModelAsset install offers with transfer integrity, per-Driver-slot non-binding content recommendations and Model Contract parameters, minimal pinned non-model RecipeCustody declarations, host and engine authoring requirements, and deterministic recommendation results; the versioned Driver dialect owns slot topology and fixed request or execution mapping, and catalog owns no download trigger, Loadout, binding, selection, admission, route, mutable execution fact, or Job truth.
    relations:
      - type: supersedes
        target: definition.nimi.runtime.model-catalog.local-resolver-plane
  - id: definition.nimi.runtime.model-catalog.provider-metadata-plane
    kind: definition
    title: Runtime provider metadata plane
    meaning: The Runtime provider metadata plane owns the merged source-provider schema and its one-way catalog inventory, capability, pricing, voice, and request-option projections into registries and tables, together with the boundary between source providers and runtime infrastructure providers; it never owns a Connector, Cloud provider-model target, committed default, execution route, execution selection, or ExecutionHost endpoint.
  - id: definition.nimi.runtime.model-catalog.voice-workflow-catalog-plane
    kind: definition
    title: Runtime voice-workflow catalog plane
    meaning: The Runtime voice-workflow catalog plane owns synthesis voice blocks, voice workflow model declarations, workflow-to-synthesis compatibility metadata, voice handle policies, language profiles, video capability blocks, and family-scoped catalog declaration admission for local speech including exact audio.cpp TTS, ASR, and reference-voice rows; it never owns provider endpoints, transport paths, multi-step invocation flow, CapabilityImplementationDriver request mapping, AIConfig targets, execution bindings, routes, or Job execution truth.
  - id: definition.nimi.runtime.model-catalog.voice-plane
    kind: definition
    title: Runtime voice plane
    meaning: The Runtime voice plane owns voice creation scenario execution, the VoiceReference and VoiceAsset public contracts, voice discovery channels, tenant and target binding guarantees, agent voice output policy, voice streaming and interruption truth, and the third-party voice transport boundary.
  - id: definition.nimi.runtime.model-catalog.workflow-plane
    kind: definition
    title: Deferred product Workflow boundary
    meaning: General product Workflow is outside the current Runtime core, its future owner and DAG, node, state, event, resume, retry, cancellation, SDK, and protocol semantics remain undecided, and its absence never blocks Local AI, LocalAgent, Conversation, Memory, Knowledge, voice, or ordinary readiness.
  - id: rule.nimi.runtime.model-catalog.r001
    kind: rule
    title: Catalog snapshot and source layout is fixed
    modality: must
    statement: Runtime loads built-in model catalog snapshots only from the provider-scoped snapshot files under runtime/catalog/providers, source-provider authoring truth lives only under runtime/catalog/source/providers as one provider source file or one provider directory of merged fragments, and projected registry or spec tables derive from that source without ever serving as the runtime load source or owning an ExecutionHost endpoint, Cloud provider-model target, committed default, execution route, execution selection, or capability execution truth.
    condition: Whenever Runtime or tooling loads, projects, or edits model catalog truth.
    failure: Reject catalog loads or projections from any surface outside the declared snapshot and source layout.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.catalog-plane
  - id: rule.nimi.runtime.model-catalog.r002
    kind: rule
    title: Snapshot provider schema is fixed
    modality: must
    statement: Every provider snapshot document declares version, provider, catalog_version, and inventory_mode limited to static_source or dynamic_endpoint, models rows are omitted only by dynamic_endpoint providers that carry provider-level dynamic inventory metadata instead, each models row carries provider, model_id, model_type, updated_at, capabilities, pricing, and source_ref, and voices rows are present whenever TTS-capable models exist with each row carrying voice_set_id, provider, voice_id, name, langs, model_ids, and source_ref.
    condition: Whenever a provider snapshot document is authored, generated, or loaded.
    failure: Reject snapshot documents missing required fields or using an undeclared inventory mode.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.catalog-plane
  - id: rule.nimi.runtime.model-catalog.r003
    kind: rule
    title: Capability-conditional row fields are exact
    modality: must
    statement: A remote static_source text.generate row carries a positive context_window_tokens from a source model override or the reviewed conservative provider floor while non-text rows never carry it, audio.synthesize rows carry voice_set_id, video.generate rows carry video_generation, image.generate rows carry image_request_options once image route metadata is admitted, and embedding with a positive dimension appears only on a text.embed row with one admitted output dimension where the catalog is authority for the exact Runtime AI Job output contract while variable-dimension models omit it and Job admission fails closed instead of fabricating a dimension; Cognition separately owns its derived Memory index generation and compatibility.
    condition: Whenever capability-conditional snapshot row fields are authored or validated.
    failure: Reject rows whose capability-conditional fields are missing, misplaced, or fabricated.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.catalog-plane
  - id: rule.nimi.runtime.model-catalog.r004
    kind: rule
    title: Pricing entries are normalized
    modality: must
    statement: pricing uses only the metering units token, char, second, and request with values priced per one million tokens, per one million characters, per sixty seconds, and per single request respectively, every entry carries input, output, currency, as_of, and notes, unknown pricing appears only as the literal string unknown, and local rows with currency none set input and output to the literal string 0.
    condition: Whenever a catalog pricing entry is authored or validated.
    failure: Reject pricing entries with undeclared units, missing fields, or unknown values outside the literal form.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.catalog-plane
  - id: rule.nimi.runtime.model-catalog.r005
    kind: rule
    title: Catalog entries are source traceable
    modality: must
    statement: Every model and voice entry carries a source_ref with a retrieved_at date and either the authoritative provider documentation URL or, only for an authenticated provider-private model route that is not publicly documented, the exact official provider inventory endpoint URL, source_kind authenticated_provider_inventory, and a note explicitly identifying an authenticated non-public inventory observation; documentation for a neighboring public model never proves a private inventory identifier.
    condition: Whenever a model or voice catalog entry is authored or validated.
    failure: Reject entries without traceable source references, private identifiers traced only to neighboring public documentation or untyped notes, and inventory observations without the exact endpoint, source kind, date, or explicit non-public observation note.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.catalog-plane
  - id: rule.nimi.runtime.model-catalog.r006
    kind: rule
    title: Catalog resolution order is closed
    modality: must
    statement: Runtime catalog resolution consults the required built-in snapshot first and the optional local custom provider directory second, no remote metadata cache or refresh path exists as a non-scenario catalog source, and the dynamic connector discovery cache for dynamic_endpoint providers stays a runtime execution cache that never becomes a second catalog truth source.
    condition: Whenever Runtime resolves model catalog truth.
    failure: Reject catalog reads from undeclared sources and discovery caches claiming catalog authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.catalog-plane
  - id: rule.nimi.runtime.model-catalog.r007
    kind: rule
    title: Custom catalog overrides stay local and safe
    modality: must
    statement: Custom catalog overrides are local files only that never fetch provider metadata from remote discovery endpoints, pass parse validation before activation, fall back to the last-known-good built-in snapshot on invalid input, and introduce no startup dependency on mutable external metadata.
    condition: Whenever a custom catalog override is ingested or activated.
    failure: Reject the override and keep serving the last-known-good built-in snapshot.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.catalog-plane
  - id: rule.nimi.runtime.model-catalog.r008
    kind: rule
    title: Overlay merge is model grained and user isolated
    modality: must
    statement: Custom catalog overlays persist as provider-scoped local fragments merged at model granularity where effective provider state is the built-in document plus overlay upserts, an overlay entry with the same model_id overrides the built-in entry, built-in models unmentioned by overlays remain visible and continue receiving built-in upgrades, and user-created models and overrides stay isolated to the requesting subject user without mutating other users' effective catalogs.
    condition: Whenever catalog overlays are stored or merged into effective provider state.
    failure: Reject full-snapshot overlays, lost built-in rows, and cross-user overlay leakage.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.catalog-plane
  - id: rule.nimi.runtime.model-catalog.r009
    kind: rule
    title: Desktop consumes runtime catalog truth
    modality: must
    statement: Desktop catalog browsing and editing consume runtime model catalog truth resolved from the provider snapshots plus overlay merge semantics, include providers that exist only in runtime catalog truth such as local, and never treat the projected remote-provider table as the catalog page truth source.
    condition: Whenever Desktop renders or edits the model catalog.
    failure: Reject desktop catalog surfaces built on projected tables or a second catalog truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.catalog-plane
  - id: rule.nimi.runtime.model-catalog.r010
    kind: rule
    title: Catalog lookups fail closed
    modality: must
    statement: An unknown model returns AI_MODEL_NOT_FOUND, an unsupported voice returns AI_MEDIA_OPTION_UNSUPPORTED, and no catalog lookup silently falls back to legacy hardcoded voice or model lists.
    condition: Whenever a catalog model or voice lookup fails.
    failure: Return the exact typed failure without hardcoded fallback rows.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.catalog-plane
  - id: rule.nimi.runtime.model-catalog.r011
    kind: rule
    title: Capability vocabulary is canonical and closed
    modality: must
    statement: Source, snapshot, registry, recommendation, scenario guard, and implementation-support metadata use only the canonical CapabilityContract tokens text.generate, text.embed, image.generate, video.generate, world.generate, audio.synthesize, audio.transcribe, music.generate, voice.create, and realtime.interact; text.generate image, audio, and video input support is expressed only by the contract-scoped standardized feature short names input.image, input.audio, and input.video, image.generate reference and mask conditioning support only by input.image and input.mask, video.generate image conditioning support only by input.image, music.generate prior-audio support only by input.audio, voice.create text-description and reference-audio source support only by input.text and input.audio, realtime.interact remains one provider-independent bidirectional text-and-audio contract rather than batch-contract composition, and retired, legacy, prefixed, or capability-subtype aliases are rejected rather than converted on a semantic surface.
    condition: Whenever a capability token is declared or consumed on a catalog semantic surface.
    failure: Reject undeclared or retired capability tokens at validation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.catalog-plane
  - id: rule.nimi.runtime.model-catalog.r012
    kind: rule
    title: Catalog support requires an implementation and Driver
    modality: must
    statement: Catalog support metadata names only an admitted CapabilityImplementation with a wired CapabilityImplementationDriver, never treats a catalog row, provider row, ModelAsset, adapter label, health result, or active flag as a route, Machine Loadout store selection, derived admission, or execution truth, and fails closed when its implementation or Driver identity is unknown.
    condition: Whenever catalog support metadata is declared or consumed.
    failure: Reject support metadata whose exact CapabilityImplementation or Driver is unknown and never infer a route from catalog availability.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.catalog-plane
  - id: rule.nimi.runtime.model-catalog.r013
    kind: rule
    title: Source schema v3 structure is fixed
    modality: must
    statement: A merged source-provider entry uses schema v3 whose core structure is runtime, models, language_profiles, and sources plus optional voice_sets, voice_workflow_models, and model_workflow_bindings, runtime.inventory_mode is required with values static_source or dynamic_endpoint, dynamic_endpoint requires runtime.dynamic_inventory and may omit models because inventory is discovered dynamically, and no catalog schema field carries an ExecutionHost endpoint, committed provider-model default, or execution selection.
    condition: Whenever a source-provider entry is merged or validated.
    failure: Reject source entries outside the v3 structure or carrying Runtime-private endpoint or execution-selection truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.provider-metadata-plane
  - id: rule.nimi.runtime.model-catalog.r014
    kind: rule
    title: Context window floors are reviewed source truth
    modality: must
    statement: A static_source remote source whose models declare text.generate declares a positive provider-default context_window_tokens or a positive per-row override, the value is the reviewed conservative request-capacity floor rather than a guessed general default, the model row override takes precedence over the provider default, and alias expansion inherits the canonical model's exact value.
    condition: Whenever source context window capacity is declared or expanded.
    failure: Fail closed in generation and freshness gating when the floor is missing or inconsistent.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.provider-metadata-plane
  - id: rule.nimi.runtime.model-catalog.r015
    kind: rule
    title: Catalog metadata projects one way from source
    modality: must
    statement: Provider catalog inventory, capability, pricing, voice, and request-option metadata lives in the merged source-provider entry and projects one way into generated catalog registries and tables; dynamic inventory metadata describes catalog discovery only, and neither source metadata nor a projection carries or supplies an ExecutionHost endpoint, Connector, Cloud provider-model target, committed default, execution route, or execution selection.
    condition: Whenever provider catalog metadata is declared, generated, or consumed.
    failure: Reject a projection that bypasses catalog source metadata or any source or projection that claims Runtime-private endpoint or execution-composition truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.provider-metadata-plane
  - id: rule.nimi.runtime.model-catalog.r016
    kind: rule
    title: Provider metadata never owns Cloud model selection
    modality: must_not
    statement: A source-provider schema, snapshot, catalog row, registry projection, selection metadata, or recommendation supplies, commits, resolves, gates, or changes a Cloud provider-model target, including by treating a visible non-binding recommendation as target truth before an explicit AIConfig owner action.
    condition: Whenever provider metadata or a recommendation is declared, projected, or consumed.
    failure: Reject the execution-relevant default or selection projection and preserve the unresolved or exact target state owned by AIConfig.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.provider-metadata-plane
  - id: rule.nimi.runtime.model-catalog.r017
    kind: rule
    title: Infra providers cannot pose as sources
    modality: must_not
    statement: The runtime infrastructure providers nimillm, openai_compatible, and volcengine_openspeech appear as source-provider capability declarations instead of remaining registry and routing layer identities.
    condition: Whenever provider identities are declared in catalog source.
    failure: Reject infra-provider entries at source validation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.provider-metadata-plane
  - id: rule.nimi.runtime.model-catalog.r018
    kind: rule
    title: Model option metadata is placed exactly
    modality: must
    statement: Voice request options appear only on audio.synthesize models, transcription metadata only on audio.transcribe models, embedding metadata only on text.embed models carrying only model-inherent dimension facts, and image_request_options only on image.generate models expressing response_formats, max_images_per_request, supports_negative_prompt, supports_reference_images, supports_mask, supports_seed, supports_size, supports_aspect_ratio, supports_quality, and supports_style as the sole image request-option metadata source.
    condition: Whenever model request-option metadata is authored or consumed.
    failure: Reject misplaced or reverse-derived model request-option metadata.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.provider-metadata-plane
  - id: rule.nimi.runtime.model-catalog.r019
    kind: rule
    title: Synthesis rows declare the voice block
    modality: must
    statement: Every audio.synthesize model row declares a voice capability block with discovery_mode limited to static_catalog, dynamic_user_scoped, or mixed, supports_voice_ref_kinds, voice_set_ref whenever discovery includes the static catalog channel, and langs_ref.
    condition: Whenever a synthesis-capable catalog row is authored or validated.
    failure: Reject synthesis rows without a complete voice block.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-workflow-catalog-plane
  - id: rule.nimi.runtime.model-catalog.r020
    kind: rule
    title: Voice generation pipelines are declared explicitly
    modality: must
    statement: Voice creation generation pipelines declare typed input, output retention, supported targets, and language capability through Runtime catalog truth without exposing provider transport or creating a general Workflow product.
    condition: Whenever a voice generation pipeline is declared in catalog source.
    failure: Reject incomplete capability declarations and transport-bearing public metadata.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-workflow-catalog-plane
  - id: rule.nimi.runtime.model-catalog.r021
    kind: rule
    title: Voice pipeline compatibility is Runtime owned
    modality: must
    statement: Runtime catalog truth declares voice generation and synthesis compatibility explicitly, consumers never guess provider-side compatibility, and any local or cloud reuse is admitted by Runtime rather than inferred from names.
    condition: Whenever voice generation and synthesis compatibility is declared or consumed.
    failure: Reject implicit, guessed, or cross-plane compatibility outside the declared matrix.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-workflow-catalog-plane
  - id: rule.nimi.runtime.model-catalog.r022
    kind: rule
    title: Desktop speech bundle is a projection
    modality: must
    statement: A Desktop local speech bundle projection reads only runtime catalog truth and runtime-owned asset and service truth, mints no second bundle catalog, bundle row, or generic local speech marketplace truth, never flattens the qwen3_asr and qwen3_tts family lines into one canonical install row, keeps its admitted scope fixed to baseline local speech, and never rewrites the catalog into an install truth owner from Desktop or shell helpers.
    condition: Whenever Desktop projects admitted local speech rows as a user-facing bundle.
    failure: Reject second bundle truths and flattened or rewritten catalog rows.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-workflow-catalog-plane
  - id: rule.nimi.runtime.model-catalog.r023
    kind: rule
    title: Language profiles are dual track
    modality: must
    statement: Source language configuration supports region codes and short codes as parallel tracks whose coexistence never triggers automatic mapping, and any mapping policy is declared explicitly.
    condition: Whenever source language profiles are declared or mapped.
    failure: Reject implicit region-to-short-code mapping.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-workflow-catalog-plane
  - id: rule.nimi.runtime.model-catalog.r024
    kind: rule
    title: ElevenLabs catalog profile minimum is fixed
    modality: must
    statement: The ElevenLabs source uses schema v3 and declares synthesize-capable models whose provider-global preset voices enumerate through the static catalog channel with voice_set_ref, voice creation models with typed capability and compatible synthesis-target metadata, an explicit voice-creation-to-synthesis compatibility matrix, and voice handle policies defaulting to provider_persistent persistence with user_scoped scope; provider endpoints, preview or create sequences, transport paths, and request construction remain CapabilityImplementationDriver-private and never become catalog fields.
    condition: Whenever the ElevenLabs source entry is authored or validated.
    failure: Reject ElevenLabs source entries missing the catalog capability or compatibility metadata or carrying provider endpoint, transport-path, invocation-flow, or request-construction truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-workflow-catalog-plane
  - id: rule.nimi.runtime.model-catalog.r025
    kind: rule
    title: Dynamic user voices stay out of snapshots
    modality: must_not
    statement: A flattened snapshot for a provider whose voice discovery mode includes dynamic_user_scoped enumerates the provider's dynamic user voices beyond a minimal placeholder entry, or replaces runtime ListVoiceAssets discovery as the source of real custom voices.
    condition: Whenever a dynamic user-scoped voice snapshot is generated.
    failure: Reject snapshots enumerating dynamic user voices beyond the minimal placeholder.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-workflow-catalog-plane
  - id: rule.nimi.runtime.model-catalog.r026
    kind: rule
    title: Video capability blocks are complete
    modality: must
    statement: Every video.generate model declares a video_generation block containing modes, input_roles, limits, options, and outputs, the modes set is non-empty and each member comes only from the closed canonical set t2v, i2v_first_frame, i2v_first_last, and i2v_reference, every declared mode carries its input_roles, limits, options, and outputs coverage so every requested role belongs to the declared mode's allowed set, a request naming an undeclared mode is rejected, count caps come only from limits rather than role existence, outputs declare video_url and last_frame_url availability explicitly, and any journey that needs the full canonical mode set expresses that in a selection policy rather than as a per-model catalog fact.
    condition: Whenever a video capability block is authored or validated, or a video request names a mode.
    failure: Reject an empty or non-canonical modes set, a declared mode without its role, limit, option, and output coverage, a request for an undeclared mode, and role or output truth inferred from provider documentation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-workflow-catalog-plane
  - id: rule.nimi.runtime.model-catalog.r027
    kind: rule
    title: Video-only providers need no voices
    modality: must_not
    statement: A provider without audio.synthesize is required to define voice_set_id or voices rows, or the runtime loader and consistency gates reject its catalog for the missing voice mapping.
    condition: Whenever a video-only provider catalog is loaded or gated.
    failure: The voice requirement is invalid and the voice-free catalog loads.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-workflow-catalog-plane
  - id: rule.nimi.runtime.model-catalog.r028
    kind: rule
    title: Transcription declarations are reviewed and honest
    modality: must
    statement: audio.transcribe is declared only on source providers with a completed Runtime review and a real admitted execution path, unreviewed providers fail closed without infra-provider semantics implying support, and local speech rows expose only concrete install offers, source, role, format, compatibility, handle policy, and admitted capability claims rather than ready, binding, machine selection, execution route, aggregate green state, or capability success; exact configured facts and request-time derived admission remain outside the catalog.
    condition: Whenever transcription or local workflow capability is declared or projected from catalog truth.
    failure: Fail closed on unreviewed, unadmitted, or placeholder-backed capability declarations.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-workflow-catalog-plane
  - id: rule.nimi.runtime.model-catalog.r029
    kind: rule
    title: Voice asset policies gate activation
    modality: must
    statement: A provider capable of producing reusable voice assets declares Runtime-owned retention, scope, deletion, and reconciliation policy, and remains unavailable until those owner policies are admitted.
    condition: Whenever a voice-asset-capable provider or family is declared or admitted.
    failure: Deny activation and admission until the handle policy is declared.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-workflow-catalog-plane
  - id: rule.nimi.runtime.model-catalog.r030
    kind: rule
    title: Local speech offers preserve concrete subroles
    modality: must
    statement: Local speech catalog offers distinguish the existing package-native Qwen3-ASR bundle for the qwen-asr-package Driver from exact Transformers-native Qwen3-ASR-0.6B-hf and Qwen3-ASR-1.7B-hf folder bundles with their separate Driver and managed package set, mark 0.6B-hf as the visible recommended Transformers-native option and 1.7B-hf as an explicit higher-resource option without selecting either, and distinguish Qwen3-TTS-12Hz-0.6B-CustomVoice for plain synthesis, Qwen3-TTS-12Hz-0.6B-Base for reference-audio voice creation, and Qwen3-TTS-12Hz-1.7B-VoiceDesign for text-description voice creation. The release-0.6.1 audio.cpp offers preserve twenty-four TTS-capable implementations including MiniMax-H3 and Vevo2, eleven offline core-text ASR implementations, and twenty reference-audio voice.create implementations as independent exact family rows with one pinned recommended package variant per row, separate Driver dialect and consumer identities, explicit MioTTS and MioCodec occurrences, and the Inflect-only eSpeak-ng dependency; community, experimental, and work-in-progress upstream labels do not become readiness, and unsupported streaming, timestamp, diarization, or non-WAV claims are absent. Every offer preserves its source, role, format, compatibility, Driver identity, and split environment fact and may feed a visible portable factory AIProfile recommendation; neither catalog nor speech policy owns a default model lane, binding, Loadout, machine selection, AIConfig route, fallback, migration, or Cloud target.
    condition: Whenever local speech catalog or install-offer truth is declared.
    failure: Reject fuzzy buckets, implicit family generalization, merged environment topology, a default lane, binding truth, or recommendation presented as live selection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-workflow-catalog-plane
  - id: rule.nimi.runtime.model-catalog.r031
    kind: rule
    title: Local rows carry closed recipe and ModelAsset offer blocks
    modality: must
    statement: Every local catalog recipe declares recipe_id and revision, one CapabilityContract, one CapabilityImplementation and exact versioned Driver dialect, slot_metadata for every model slot that the dialect projects for that recipeId including the Driver-projected required or optional-conditional presence and standardized-feature triggers, optional Model Contract parameters, zero or more pinned non-model RecipeCustody entries, and host or engine authoring requirements; each slot metadata entry may carry ordered independent ModelAsset install offers with source, entry, files, per-file sha256, total_size_bytes, immutable recommended content reference, provenance, quantization, and host requirement. A conditional projector offer remains independent from its main model offer and may recommend an exact compatibility cohort, but catalog order, family, filename, co-location, or recommendation never binds or pairs it. Runnable audio TTS and STT offers declare their exact accelerator posture, while numeric RAM, VRAM, unified-memory, parameter-count, and context fitness are emitted only from direct model or measured evidence and omission never means zero capacity or readiness. The catalog recipe owns recommendations, contract parameters, custody pins, and authoring requirements only, while Driver code owns slot topology, conditional triggers, Text Behavior execution mapping, fixed request mapping, loader facts, and load-affecting execution defaults, and catalog owns no binding, Loadout, selection, readiness, route, behavior support promotion, or automatic download.
    condition: Whenever a local catalog recipe or ModelAsset offer is authored or validated.
    failure: Reject recipes missing exact identities or Driver-projected slot metadata, offers missing transfer integrity, catalog-defined optionality, pairing, behavior, slot topology or execution mapping, model-bearing custody, or catalog state presented as committed Loadout or execution truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.local-install-recommendation-plane
  - id: rule.nimi.runtime.model-catalog.r032
    kind: rule
    title: Catalog variants are install offers not ModelAsset instances
    modality: must
    statement: A variant_id identifies one catalog install offer with exact source and content integrity, quantization or host-specific offers remain distinct recommendation candidates, and successful acquisition mints a new per-import ModelAsset identity whose immutable content_id may equal another instance; host-fit uses only declared host requirements, complete per-file hashes remain mandatory for catalog transfer and install, and neither variant_id nor recommended content identity becomes a Loadout binding or strict execution pin.
    condition: Whenever catalog variant identity, installation, or host fit is resolved.
    failure: Fail closed on missing transfer integrity, inferred fitness, collapsed offer identity, offer-to-instance identity reuse, or recommendation promoted to binding.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.local-install-recommendation-plane
  - id: rule.nimi.runtime.model-catalog.r033
    kind: rule
    title: Every model slot recommendation is independent
    modality: must
    statement: Model content formerly described as a companion is an ordinary independent ModelAsset candidate listed under the exact Driver-projected slot metadata, never a child or identity component of another model; a recipe may recommend one or more content references per slot, including host-ranked alternatives, but makes no cross-slot training-compatibility guarantee, binding inheritance, grouped identity, selection, or download claim. A passive install-only ModelAsset offer retains its canonical model_type through catalog search and install-plan projections and may declare zero CapabilityContracts; product consumers use that model_type only to present and install the independent ModelAsset and never to infer Driver slot eligibility, cross-slot compatibility, selection, route, readiness, or execution support. RecipeCustody is a separate list limited to pinned non-model loader or execution supply and never contains a model, encoder, VAE, tokenizer data payload, or user-replaceable slot.
    condition: Whenever slot recommendations or RecipeCustody are authored or consumed.
    failure: Reject parent-coupled companion identity, model-bearing custody, inherited or grouped bindings, catalog-defined slot requiredness, and recommendation presented as selection or compatibility proof.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.local-install-recommendation-plane
  - id: rule.nimi.runtime.model-catalog.r034
    kind: rule
    title: Recipe presets are per-slot non-binding recommendations
    modality: must
    statement: A local source may carry curated recipe recommendations whose entries resolve to admitted recipes, exact Driver-projected slot ids, and concrete ModelAsset offers; the result is only a visible per-slot Loadout prefill or explicit install recommendation, and a one-click recommended combination still enumerates and installs each ModelAsset independently after user confirmation without creating a bundle identity, first-run gate, readiness set, AIConfig payload, binding, selection, fallback, or route.
    condition: Whenever local recipe presets are authored, validated, installed, or consumed.
    failure: Reject unknown recipes or slots, hidden model acquisition, grouped identity, unresolvable offers, and preset truth outside catalog source.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.local-install-recommendation-plane
  - id: rule.nimi.runtime.model-catalog.r035
    kind: rule
    title: Per-slot recommendation is deterministic and non-authoritative
    modality: must
    statement: An explicit recommendation request maps the same catalog version, recipe_id and revision, exact Driver dialect, slot id, Model Contract recommendation inputs, and already captured host facts to the same ordered catalog ModelAsset offers without probing hardware during the request; it never creates or mutates AIConfig, Loadout, bindings, selection, admission, inventory, transfer, or Jobs and is never consulted at admission or execution.
    condition: Whenever Runtime produces a ModelAsset install or Loadout-slot recommendation.
    failure: Reject nondeterministic output, live hardware probing, automatic acquisition, and any recommendation participating in committed or execution authority.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.local-install-recommendation-plane
  - id: rule.nimi.runtime.model-catalog.r036
    kind: rule
    title: Slot recommendation variants are rank ordered
    modality: must
    statement: A recommender evaluates each slot's catalog offers from captured host facts and declared host requirements, orders eligible offers with one stable catalog-defined ranking and tie-break, lowers confidence with typed reasons on incomplete metadata, and never binds, selects, substitutes, falls back, or guarantees compatibility across slots; every model slot is recommended independently even when one user action displays a recipe combination.
    condition: Whenever Runtime recommends local recipe slot variants.
    failure: Reject silent binding, cross-slot coupling, substitution, fallback, or a second contradictory ranking mechanism.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.local-install-recommendation-plane
  - id: rule.nimi.runtime.model-catalog.r037
    kind: rule
    title: Recommendation outcomes are closed
    modality: must
    statement: A recommendation returns either an ordered set of concrete catalog ModelAsset offers for one exact slot with captured inputs or a typed no-recommendation reason; it never returns a ModelAsset instance, resolved binding set, readiness result, selected Loadout, substitute route, or cross-slot guarantee, and absence of a recommendation does not invalidate an unresolved or custom-bound Loadout.
    condition: Whenever local recommendation outcomes are produced.
    failure: Return the typed recommendation outcome without fabricating inventory, bindings, readiness, selection, substitution, or compatibility.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.local-install-recommendation-plane
  - id: rule.nimi.runtime.model-catalog.r038
    kind: rule
    title: Recommendation failures stay typed and non-binding
    modality: must
    statement: Recommendation failures carry typed Runtime-owned reasons that consumers do not invent, no slot is silently satisfied, no placeholder ModelAsset or pseudo-ready state is emitted, and recommendation output may influence a Loadout only as server-side Prepare Loadout prefill followed by user-visible confirmation and Commit; it never feeds first-run readiness, ambient resolution, machine selection, Job admission, or execution.
    condition: Whenever recommendation results are returned, prepared, or displayed.
    failure: Reject invented reasons, placeholder identities, fabricated readiness, implicit Commit, and any direct configuration or execution mutation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.local-install-recommendation-plane
  - id: rule.nimi.runtime.model-catalog.r039
    kind: rule
    title: Voice creation runs on the scenario surface
    modality: must
    statement: Voice creation executes only as scenario jobs on the runtime AI service whose public voice surface is exactly SubmitScenarioJob, GetScenarioJob, CancelScenarioJob, SubscribeScenarioJobEvents, GetVoiceAsset, ListVoiceAssets, DeleteVoiceAsset, and ListPresetVoices; SubmitScenarioJob returns only the Job, SubscribeScenarioJobEvents projects only Job snapshots, and after a terminal success the consumer calls GetScenarioJob to obtain the VoiceAsset and VoiceReference result, with no separate public voice service.
    condition: Whenever the public voice surface is defined or consumed.
    failure: Reject undeclared public voice methods, a parallel voice service, a Submit or event carrier containing a voice result, or a terminal voice result read outside GetScenarioJob.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-plane
  - id: rule.nimi.runtime.model-catalog.r040
    kind: rule
    title: Provider steps and private parameters stay encapsulated
    modality: must
    statement: A provider-native multi-step voice creation flow is encapsulated in the one ScenarioJob lifecycle without a second VoiceAsset creation state machine; Runtime may preallocate a private asset identity, but no VoiceAsset or VoiceReference is stored, listed, or returned before the provider succeeds and the non-empty provider handle, Runtime-private exact target binding, persistence record, ACTIVE VoiceAsset, VoiceReference, and COMPLETED Job are committed as one terminal success publication. FAILED, CANCELED, and TIMEOUT publish no VoiceAsset or VoiceReference, and provider-private parameters travel only through namespaced scenario extensions constrained by the extension registry rather than free passthrough.
    condition: Whenever a voice creation workflow executes against a provider.
    failure: Reject leaked provider steps, unregistered extension passthrough, a public pre-terminal voice result, a terminal success missing any required committed result fact, or any public voice result from a non-success terminal state.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-plane
  - id: rule.nimi.runtime.model-catalog.r041
    kind: rule
    title: Voice references use closed kinds
    modality: must
    statement: A VoiceReference admits exactly the reference kinds preset_voice_id, voice_asset_id, and provider_voice_ref drawn from the runtime voice enum registry, an ordinary profile or SDK surface receiving a bare provider handle or an undiscriminated free-string voice reference fails closed instead of upgrading it to a public binding, a provider-returned native handle converges into the VoiceAsset plus VoiceReference public contract only through the successful atomic terminal publication, and embedding a VoiceReference in the runtime agent presentation profile transfers no voice workflow, discovery, or asset ownership.
    condition: Whenever a voice reference is created, bound, or consumed.
    failure: Fail closed on undiscriminated references and reject provider handles as public identity.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-plane
  - id: rule.nimi.runtime.model-catalog.r042
    kind: rule
    title: VoiceAsset shape and identity are fixed
    modality: must
    statement: A public VoiceAsset exists only as a successful voice.create result, has status ACTIVE and a non-empty provider_voice_ref, and carries at least voice_asset_id, app_id, subject_user_id, a non-routing creation source limited to text_description or reference_audio, provider, persistence, and status with persistence and status values from the runtime voice enum registry; its public identity is voice_asset_id, residual model identifiers remain guarded non-identity facts, and the exact committed execution target binding stays Runtime-private rather than being projected as target_ref or voice_asset_target_ref.
    condition: Whenever a VoiceAsset is created, stored, or projected.
    failure: Reject assets missing required fields, ACTIVE assets with an empty provider_voice_ref, pre-terminal public assets, or identity derived from model identifiers.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-plane
  - id: rule.nimi.runtime.model-catalog.r043
    kind: rule
    title: Profile binding requires durable persistence
    modality: must
    statement: A VoiceAsset bound by an assistant profile through voice_asset_id holds a durable persistence class and survives pruning of its originating voice creation job retention, and a session-ephemeral local-generated VoiceAsset is not a profile-bindable durable identity before a durable local substrate is separately admitted so binding it fails closed.
    condition: Whenever an assistant profile binds a voice asset.
    failure: Fail closed on non-durable bindings instead of masquerading them as durable.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-plane
  - id: rule.nimi.runtime.model-catalog.r044
    kind: rule
    title: Voice assets stay tenant scoped
    modality: must_not
    statement: A VoiceAsset read, list, new or changed presentation bind, or delete crosses the owning app_id or subject_user_id boundary, or an unrelated same-Account presentation compare-and-swap either rebinds an unchanged already-committed voice_asset_id to the caller App or retains it without Runtime rechecking the owning subject plus ACTIVE, durable, unexpired, and captured-target validity.
    condition: Whenever voice assets are accessed.
    failure: Fail closed without cross-tenant disclosure; admit an unchanged already-committed reference during another presentation-field mutation only after Runtime revalidates its original owner asset while granting the caller no read, list, create, delete, or new-bind authority over that asset.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-plane
  - id: rule.nimi.runtime.model-catalog.r045
    kind: rule
    title: Synthesis honors the bound target
    modality: must
    statement: VoiceAsset creation commits an exact Runtime-private execution target binding before the VoiceAsset is atomically published with terminal success, and synthesis through that VoiceAsset resolves and validates the captured binding before execution so an incompatible selected target returns AI_VOICE_TARGET_MODEL_MISMATCH without projecting target_ref or voice_asset_target_ref through the public VoiceAsset contract.
    condition: Whenever a voice asset is created or consumed for synthesis.
    failure: Return the exact mismatch code instead of executing on an incompatible target.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-plane
  - id: rule.nimi.runtime.model-catalog.r046
    kind: rule
    title: Discovery channels stay separated
    modality: must
    statement: Preset voices are discovered only through ListPresetVoices serving catalog snapshot or explicit local custom truth, including a typed owner-service delegation that captures its canonical audio.synthesize intent before invoking that same resolver; user custom voices are discovered only through ListVoiceAssets, including a bounded agent.configure owner-service delegation that derives the current protected session account-plus-App owner and projects only bindable selection metadata without granting create, delete, cross-App access, or runtime.consume coverage. The static_catalog, dynamic_user_scoped, and mixed discovery modes map exactly onto those channels with mixed exposing both in presentation composition without merging their owner listings or changing either discovery source.
    condition: Whenever voice discovery is served or consumed.
    failure: Reject mixed-stream listings, owner delegation without canonical route capture, and channel responsibilities outside the discovery mode.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-plane
  - id: rule.nimi.runtime.model-catalog.r047
    kind: rule
    title: Preset metadata stays optional
    modality: must
    statement: ListPresetVoices supports optional cross-provider metadata extensions such as tags, categories, and preview URLs whose absence keeps fields omissible without rejecting a provider's preset listing.
    condition: Whenever preset voice metadata is returned.
    failure: Return the listing with omitted fields instead of rejecting metadata-poor providers.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-plane
  - id: rule.nimi.runtime.model-catalog.r048
    kind: rule
    title: Voice errors use the typed family
    modality: must
    statement: Voice input, creation, asset state, permission, and job errors map to the AI_VOICE reason-code family and fail closed.
    condition: Whenever a voice operation fails.
    failure: Return the typed voice failure without generic or silent outcomes.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-plane
  - id: rule.nimi.runtime.model-catalog.r049
    kind: rule
    title: Local voice creation admission is implementation scoped
    modality: must
    statement: Local voice.create uses the current machine-selected Loadout for the committed Local voice.create route whose CapabilityImplementation declares support for input.audio, input.text, or both, admits only reference_audio and text_description requests whose required input feature is supported by that selected implementation, never switches implementation, configuration, provider, or route because of the source, and keeps local generated voice handles persistence session_ephemeral, delete_semantics runtime_authoritative_delete, and runtime_reconciliation_required false unless a durable local voice asset substrate is separately admitted; qwen3_tts is one concrete CapabilityImplementation and never the CapabilityContract identity or generic local voice execution boundary.
    condition: Whenever local voice creation admission, selection, execution, or handles are projected.
    failure: Fail closed on an unsupported source feature, absent or incomplete selected configuration, implementation mismatch, route substitution, or a session-ephemeral handle promoted to durable truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-plane
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-workflow-catalog-plane
  - id: rule.nimi.runtime.model-catalog.r050
    kind: rule
    title: LocalAgent voice policy is Runtime owned
    modality: must
    statement: LocalAgent voice output policy lives on Runtime, including synthesis intent, voice identity, user-visible playback posture, and durable voice artifact retention, while the account-scoped shared LocalAgent AIConfig exclusively owns the audio.synthesize Local-or-Cloud route and exact Cloud Connector reference, implementation, and Driver target, and the Machine Loadout store owns the current Local selection; Runtime captures the exact effective Loadout or committed Cloud identities at Job submission without a second per-Agent permission, and LocalAgent preset discovery captures that same shared audio.synthesize intent and delegates internally to the canonical ListPresetVoices resolver without consulting an App AIConfig or exposing route authority to the caller; Desktop, Zhiyu, Avatar, the voice plane, and the catalog consume projections without deciding route, resource, model binding, or whether a committed assistant message has voice semantics, while voice identity follows the LocalAgent presentation profile rather than Avatar assets, instances, or conversation surfaces.
    condition: Whenever agent voice policy is stored, mutated, or consumed.
    failure: Reject consumer-owned policy state and route or identity decisions outside Runtime.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-plane
  - id: rule.nimi.runtime.model-catalog.r051
    kind: rule
    title: Playable projections are policy gated and truthful
    modality: must
    statement: Runtime emits a playable voice projection for an ordinary assistant message only when the exact admitted Job produces playable audio and playback policy admits it, and a typed derived-admission block, missing TTS asset, absent voice reference, provider or Driver Job failure, or unavailable voice creation completes the agent turn as normal text-only output without fake playback success, synthetic audio bytes, route fallback, or reusable speech readiness unless another hard turn error exists.
    condition: Whenever an agent turn evaluates voice output.
    failure: Complete the turn text-only with the real reason instead of fabricated playback.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-plane
  - id: rule.nimi.runtime.model-catalog.r052
    kind: rule
    title: LocalAgent voice artifact and timing output remains typed
    modality: must
    statement: Runtime projects LocalAgent voice output availability, canonical Conversation artifact continuity, semantic timing correlation, and terminal reason as distinct typed facts, while consumers never infer voice success, realtime readiness, local playback, decoder clock, lipsync, viseme, or mouth state from event shape alone.
    condition: Whenever LocalAgent Conversation voice artifact or semantic timing truth is projected or consumed.
    failure: Reject conflated, consumer-inferred, or renderer-specific voice truth in the common projection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-plane
  - id: rule.nimi.runtime.model-catalog.r053
    kind: rule
    title: Voice artifacts keep Conversation identity and admitted transport
    modality: must
    statement: A semantic voice artifact or timing projection preserves the same Runtime-issued LocalAgent, Conversation, turn, committed-message, artifact-sequence, and correlation continuity as its text turn, SDK consumes it through canonical Conversation events and typed artifact reads, raw audio bytes never become app-message or presentation-event truth, and durable artifacts follow Runtime retention authority.
    condition: Whenever agent Conversation voice artifacts or semantic timing projections are produced or consumed.
    failure: Reject identity drift, undeclared transports, inline raw bytes, raw replay, and per-chunk durable minting.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-plane
  - id: rule.nimi.runtime.model-catalog.r054
    kind: rule
    title: Conversation interruption and local playback remain distinct truths
    modality: must
    statement: Canonical Conversation interruptTurn targets the active turn, cancels admitted generation and voice production, fences late results, and emits one Runtime terminal turn truth, while Host or Avatar may stop local decoding and playback immediately but never treats that local stop as Runtime interruption success; no separate Runtime voice playback broker, playback-state product owner, Avatar special interrupt operation, or duplicate companion request or cancel path exists.
    condition: Whenever a voiced Conversation turn is interrupted or local playback is stopped.
    failure: Reject local-stop-only success, late-result commit, duplicate interrupt operations, and partial Runtime cancellation truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-plane
  - id: rule.nimi.runtime.model-catalog.r055
    kind: rule
    title: Voice caches and cleanup stay runtime owned
    modality: must_not
    statement: Avatar owns durable voice cache state, or a Desktop cleanup surface deletes generated voice artifacts through anything but the runtime-owned artifact and voice cleanup surface.
    condition: Whenever generated voice retention is cached or cleaned by consumers.
    failure: Reject consumer-owned durable voice caches and out-of-band cleanup.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-plane
  - id: rule.nimi.runtime.model-catalog.r056
    kind: rule
    title: App voice transport is canonical and bounded
    modality: must_not
    statement: An App protected surface exposes a provider or decoder stream, raw audio chunk subscription, raw replay, generic AI execution, route, provider, or model selection, an Avatar-special voice command or privileged client, or treats declaration, a protected session, or an Agent identifier alone as voice authorization; the canonical covered Conversation family is limited to typed voice render and artifact reads, semantic timing correlation, and Conversation interruption with common result and error semantics.
    condition: Whenever protected App access meets canonical Conversation voice capability.
    failure: Deny the prohibited request while preserving admitted canonical Conversation voice operations without fallback, partial admission, or fabricated success.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-plane
  - id: rule.nimi.runtime.model-catalog.r057
    kind: rule
    title: General product Workflow remains deferred and non-core
    modality: must
    statement: Runtime exposes no current general product Workflow DAG, node registry, execution, event stream, resume, retry, cancellation, or SDK contract, while media pipelines described as voice or image workflows remain internal capability implementation and do not create a general Workflow product.
    condition: Whenever general product Workflow is proposed, documented, or unavailable.
    failure: Keep the future capability isolated and unavailable rather than inferring a Runtime owner, API, protocol, or readiness dependency.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.workflow-plane
  - id: rule.nimi.runtime.model-catalog.r058
    kind: rule
    title: VoxCPM catalog exposes one synthesis family
    modality: must
    statement: The local catalog exposes VoxCPM through the canonical voxcpm2-local model row with family voxcpm and audio.synthesize only, no voice.create feature, workflow, reusable voice handle, or voice-cloning claim, and one default synthesis voice posture; its reviewed ModelAsset offers remain variants under that one logical row, may carry exact per-variant repo and revision plus Runtime-private standard or MLX backend material when host-specific formats require different immutable sources, and preserve complete hashes, host requirements, family, artifact role, and backend compatibility without turning a backend or variant into a second public family, default selection, binding, route, or readiness truth.
    condition: Whenever VoxCPM model, voice, ModelAsset offer, family, or install metadata is authored or projected.
    failure: Reject a missing or non-voxcpm family, voice-creation claim, backend-shaped family or capability, incomplete integrity material, backend and host mismatch, or recommendation presented as live selection.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.ai-provider.voxcpm-family
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.local-install-recommendation-plane
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.voice-workflow-catalog-plane
  - id: rule.nimi.runtime.model-catalog.r059
    kind: rule
    title: Gemma 4 catalog cutover follows one recipe identity
    modality: must
    statement: When the approved Gemma 4 v2 release train is promoted, the catalog atomically emits recipeId llama.text-generate.gemma4.v1 with dialect llama.cpp/text-generate/v2 and stops emitting recipeIds llama.text-generate.gemma-4-e2b-it.v1 and llama.text-generate.gemma-4-26b-a4b-it.v1 together with dialect llama.cpp/text-generate/v1; Gemma 4 E2B, 26B, quantizations, and ordinary release variants remain independent install offers for the same required main.gguf slot, compatible projector offers occupy the independent optional-conditional companion.mmproj slot, and resource or recommendation differences never create a duplicate recipe. The catalog may recommend exact model, template, projector, and Text Behavior adapter cohorts but cannot define their execution mapping, bind them, alias old identities, migrate a Loadout or selection, or make the old and new train simultaneously selectable.
    condition: Whenever the Gemma 4 v2 catalog candidate is promoted to production.
    failure: Reject partial catalog promotion, old and new recipe coexistence, duplicated size-shaped recipes, inferred projector pairing, adapter execution mapping, alias, migration, or selection mutation.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.local-install-recommendation-plane
  - id: rule.nimi.runtime.model-catalog.r060
    kind: rule
    title: Resource tiers remain measured release facts until separately admitted
    modality: must
    statement: A per-platform, per-backend, per-model-or-variant resource tier may be published only from approved measurements naming the exact device, driver, package and ABI, backend, RAM, VRAM or unified memory, model content, and Driver dialect; one platform or variant never supplies another cell, omission means unverified, and no universal minimum is inferred. Until a separate canonical decision approves tier names, numeric thresholds, public fields, and any Runtime admission owner, these facts remain release-review and recommendation input and create no live catalog readiness, automatic variant choice, scheduling policy, or Runtime admission.
    condition: Whenever model resource measurements or resource-tier recommendations are authored or consumed.
    failure: Reject unsupported extrapolation, missing exact tuple identity, one-platform substitution, unapproved thresholds, and a tier projected as selection, readiness, or execution truth.
    relations:
      - type: applies_to
        target: definition.nimi.runtime.model-catalog.local-install-recommendation-plane
