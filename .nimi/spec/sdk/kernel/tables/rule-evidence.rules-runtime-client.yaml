    evidence_requirement: required
  - rule_id: S-RUNTIME-080
    evidence_refs:
      - sdk_kernel_consistency
    note: World Evolution Engine event projection is constrained to normalized K-WEV envelope fields and may not promote adapter-only or workflow-only fields
    evidence_requirement: required
  - rule_id: S-RUNTIME-081
    evidence_refs:
      - sdk_kernel_consistency
    note: Replay/checkpoint/supervision projection rule; SDK contract remains mirror-only and fail-close on unsupported Runtime shapes
    evidence_requirement: required
  - rule_id: S-RUNTIME-082
    evidence_refs:
      - sdk_kernel_consistency
    note: Commit-request staging remains an adapter-bound projection and must not become SDK write authority
    evidence_requirement: required
  - rule_id: S-RUNTIME-083
    evidence_refs:
      - sdk_kernel_consistency
    note: Workflow substrate leakage hardcut; SDK top-level World Evolution Engine models must stay in K-WEV vocabulary
    evidence_requirement: required
  - rule_id: S-RUNTIME-084
    evidence_refs:
      - sdk_kernel_consistency
      - sdk_boundary_gate
    note: Private-boundary and no-widening hardcut; SDK may not bypass public surface or reinterpret Runtime semantics
    evidence_requirement: required
  - rule_id: S-RUNTIME-085
    evidence_refs:
      - sdk_kernel_consistency
    note: Consumer API lands in SDK kernel as a downstream seam only; Runtime stays semantic owner and SDK projection stays shape owner
    evidence_requirement: required
  - rule_id: S-RUNTIME-086
    evidence_refs:
      - sdk_kernel_consistency
    note: Only read/observe and command/request consumer surface families are admissible, and both must compose projection-visible shapes only
    evidence_requirement: required
  - rule_id: S-RUNTIME-087
    evidence_refs:
      - sdk_kernel_consistency
    note: Read/observe surface is limited to normalized event, replay, checkpoint, supervision, and adapter-bound commit-request views with fail-close behavior
    evidence_requirement: required
  - rule_id: S-RUNTIME-088
    evidence_refs:
      - sdk_kernel_consistency
    note: Command/request surface may accept only projection-visible identifiers and must not create workflow-truth, commit-truth, or fallback-control side channels
    evidence_requirement: required
  - rule_id: S-RUNTIME-089
    evidence_refs:
      - sdk_kernel_consistency
      - sdk_boundary_gate
    note: Consumer API inadmissible-affordance hardcut blocks workflow substrate leakage, private handles, and semantic reinterpretation of missing evidence
    evidence_requirement: required
  - rule_id: S-RUNTIME-090
    evidence_refs:
      - sdk_kernel_consistency
      - sdk_boundary_gate
    note: App/mod delivery path must preserve the same public consumer contract without host-private, app-private, or mod-private implementation assumptions
    evidence_requirement: required
  - rule_id: S-RUNTIME-091
    evidence_refs:
      - sdk_kernel_consistency
    note: World Evolution Engine app-facing candidate families remain logical SDK facades layered on projection-visible shapes rather than new daemon RPC parity
    evidence_requirement: required
  - rule_id: S-RUNTIME-092
    evidence_refs:
      - sdk_kernel_consistency
    note: App-facing and mod-facing World Evolution Engine facades share one minimal projection-derived selector and reference vocabulary without creating a second semantic identity model
    evidence_requirement: required
  - rule_id: S-RUNTIME-093
    evidence_refs:
      - sdk_kernel_consistency
    note: Observe and selector-read categories are limited to normalized event/evidence views and explicit runtime-local or adapter-bound evidence classes
    evidence_requirement: required
  - rule_id: S-RUNTIME-094
    evidence_refs:
      - sdk_kernel_consistency
    note: Request/result/rejection framing is category-only, explicit, and fail-close; it may not add fallback knobs or reinterpret candidate views as canonical truth
    evidence_requirement: required
  - rule_id: S-RUNTIME-095
    evidence_refs:
      - sdk_kernel_consistency
    note: World Evolution Engine facade work is admitted only as candidate framing for later implementation design, not as a frozen method list or transport contract
    evidence_requirement: required
  - rule_id: S-RUNTIME-096
    evidence_refs:
      - sdk_kernel_consistency
      - sdk_boundary_gate
    note: Workflow-control, canonical-mutation, substrate-control, passthrough, and private-bypass candidate shapes remain inadmissible
    evidence_requirement: required
  - rule_id: S-RUNTIME-097
    evidence_refs:
      - sdk_kernel_consistency
    note: Selector-read stable method categories are closed to five shared logical read methods and may not widen into observe or effectful method families
    evidence_requirement: required
  - rule_id: S-RUNTIME-098
    evidence_refs:
      - sdk_kernel_consistency
    note: Shared selector matrix freezes admitted exact-match and filter-like selector forms and requires fail-close on incomplete, unknown, or non-projection-visible primitives
    evidence_requirement: required
  - rule_id: S-RUNTIME-099
    evidence_refs:
      - sdk_kernel_consistency
