  - surface: types
    allowed:
      - "@nimiplatform/sdk/types"
    forbidden:
      - "@nimiplatform/sdk/runtime/internal/**"
      - "@nimiplatform/sdk/realm/internal/**"
      - "runtime/internal/**"
    source_rules:
      - S-BOUNDARY-001
  - surface: legacy-entrypoints
    allowed: []
    forbidden:
      - "createNimiClient"
      - "OpenAPI.BASE"
      - "OpenAPI.TOKEN"
    source_rules:
      - S-BOUNDARY-001
      - S-BOUNDARY-004
