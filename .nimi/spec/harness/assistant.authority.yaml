format: nimicoding.authority/v2
owner: team.harness
scope: harness.assistant
units:
  - id: definition.nimi.harness.assistant.core-app
    kind: definition
    title: Nimi Harness PC Body and activity console App
    meaning: Nimi Harness (apps/harness, canonical App identity nimi.harness) is an independent supervised Electron PC Body and multi-session activity console App consuming the non-privileged agent.local, agent.session.manage, and agent.body.pc domains (never bundled inside Desktop and replaceable by any authorized PC Body App), using an internal Electron utilityProcess to host pi-durable@1.6.0 (WAL FULL SQLite) and SecureWorkspaceExecutionEnv; Runtime remains the sole LocalAgent Brain and persona/context authority while Harness owns local PC tool execution, approvals, crash non-replay, file snapshots, and two fixed views (Tasks & Deliverables and Project Workspace).
  - id: rule.nimi.harness.assistant.symbiosis-and-durability
    kind: rule
    title: Harness maintains WAL FULL durability, tombstone-first reconciliation, and official beforeCompact hook
    modality: must
    statement: Harness opens its pi-durable SQLite database with explicit PRAGMA journal_mode=WAL and PRAGMA synchronous=FULL verified by readback (2), persists requestId=outbox_id with payload hash, submission id, and withdraw state in the same FULL transaction, drains and acknowledges all PURGE_SESSION, PURGE_AGENT, and INVALIDATE_MEMORY tombstones before reporting monotonic (lease_epoch, projection_seq) reconciliation on startup, retains pi-durable@1.6.0 core unmodified while registering the official CompactionTask beforeCompact hook with backgroundTokens=0 (two bounded retries and usage reporting) using stable logical model id local-agent:<agent_binding> and Runtime-projected effective_context_budget_tokens, keeps tool images attributed to toolResult rather than role user, and invokes synchronous AuthorizeBodySideEffect before starting any high-risk side effect while failing closed on disconnect.
    condition: Whenever Harness starts, accepts Runtime BodyOutbox commands, runs inference/compaction, or starts a side-effecting tool.
    failure: Reject synchronous mode below FULL, unverified reconciliation ahead of tombstones, replayed interrupted commands, unauthorized side effects during disconnect, or role-user image smuggling.
    relations:
      - type: applies_to
        target: definition.nimi.harness.assistant.core-app
      - type: applies_to
        target: definition.nimi.platform.core-protocol.agent-session-body-plane
  - id: rule.nimi.harness.assistant.security-gates
    kind: rule
    title: Apply all seven Harness PC Body security gates
    modality: must
    statement: SecureWorkspaceExecutionEnv and the protected-local Rust helpers enforce process containment, handle and path validation, workspace control-file and secret protection, developer shell approval, atomic approval revisions, recoverable workspace writes and bounded isolated workers. Package the native helpers in asarUnpack with the matching Electron ABI.
    condition: Whenever Harness resolves paths, reads/searches/modifies workspace files, executes shell commands, or processes local or remote approvals.
    failure: Deny policy violations, path escapes, hard-link/symlink escapes, sensitive file reads, stale CAS revisions, or Job Object assignment failures before executing any file or process side effect.
    relations:
      - type: applies_to
        target: definition.nimi.harness.assistant.core-app
  - id: rule.nimi.harness.assistant.dual-views
    kind: rule
    title: Harness provides Tasks and Deliverables and Project Workspace fixed views
    modality: must
    statement: Harness exposes two top-level fixed views sharing one underlying session and receipt model—Tasks & Deliverables (default view for daily deliverables, approvals, alarms/delegations, receipts, and one-click typed pre-write file restore) and Project Workspace (pinned repositories, file tree, line-level diff review, terminal output, Follow-Up, Withdraw, and Stop)—alongside cross-Agent sidebar filtering, intake of general_inbox promotion handoff_history, and intake of user-editable Zhiyu handoff briefs.
    condition: Whenever a user operates Harness or hands off work from Home or Zhiyu.
    failure: Never claim automatic undo for Shell commands or sent external messages, and never silently ingest unapproved Zhiyu private companion transcripts.
    relations:
      - type: applies_to
        target: definition.nimi.harness.assistant.core-app
  - id: rule.nimi.harness.assistant.process-containment
    kind: rule
    title: Contain the complete Windows child process tree
    modality: must
    statement: Use a Win32 Job Object with CREATE_SUSPENDED and KILL_ON_JOB_CLOSE. Wait for ActiveProcesses to reach zero. Preserve lossy UTF-8 process output.
    condition: When Harness launches or terminates a Windows workspace child process.
    failure: Deny execution if the suspended child cannot be assigned to its Job Object.
    relations:
      - type: applies_to
        target: definition.nimi.harness.assistant.core-app
  - id: rule.nimi.harness.assistant.workspace-handles
    kind: rule
    title: Validate the actual workspace file handle
    modality: must
    statement: Use CreateFileW and GetFinalPathNameByHandleW for NTFS handle-level validation. Require nNumberOfLinks == 1 and enforce precondition_sha256. Reject paths with a leading @, file://, the Windows extended path prefix, ADS colons or trailing dots or spaces.
    condition: When resolving a workspace path or operating on an NTFS file.
    failure: Reject a path, link, final handle or content precondition that crosses the validated workspace boundary before the side effect.
    relations:
      - type: applies_to
        target: definition.nimi.harness.assistant.core-app
  - id: rule.nimi.harness.assistant.workspace-control-files
    kind: rule
    title: Protect workspace control files and secrets
    modality: must
    statement: Apply case-folded control-file checks and require allow_once for .git/**, .github/**, package.json scripts, test and build configs, Makefile, scripts, conftest.py and build.rs. Permit only safe git flags. Use the shared isSensitivePath() decision to deny .env* and keys across read, write, edit, grep and glob.
    condition: When a workspace tool resolves a control file, command flag or sensitive path.
    failure: Deny sensitive access or an unapproved control-file action before operating on it.
    relations:
      - type: applies_to
        target: definition.nimi.harness.assistant.core-app
  - id: rule.nimi.harness.assistant.developer-shell
    kind: rule
    title: Constrain and disclose free shell execution
    modality: must
    statement: Offer free Shell only in explicit developer workspaces. Each invocation requires allow_once, inheritEnv=false and a minimal environment allowlist. Its approval card highlights recently AI-modified scripts and tests. Redact high-entropy or credential .env* canary values from stdout and stderr as [REDACTED_WORKSPACE_SECRET]. This release makes no OS AppContainer guarantee.
    condition: When Harness presents, runs or reports a free Shell request.
    failure: Refuse a shell request outside its workspace or approval boundary and withhold unredacted output.
    relations:
      - type: applies_to
        target: definition.nimi.harness.assistant.core-app
  - id: rule.nimi.harness.assistant.approval-revisions
    kind: rule
    title: Use one atomic approval revision across carriers
    modality: must
    statement: Generate approval cards from trusted execution state. Local and remote decisions share atomic revision compare-and-swap and a 24-to-72-hour TTL.
    condition: When a user acts on a local or remote approval.
    failure: Reject an untrusted, expired or stale-revision decision before the requested effect.
    relations:
      - type: applies_to
        target: definition.nimi.harness.assistant.core-app
  - id: rule.nimi.harness.assistant.workspace-restore
    kind: rule
    title: Serialize overlapping writes and provide typed file restore
    modality: must
    statement: Record an isolated pre-write snapshot under <nimi-data>/snapshots/ before every workspace file write. Serialize writes to overlapping workspace paths. Use the snapshot and its contents only for typed restoration of the recorded file. Keep those contents out of task summaries, model context, Memory and other business uses.
    condition: Whenever Harness writes a workspace file, accesses a pre-write snapshot or its contents, or receives a request for file restoration.
    failure: Refuse a write without its required snapshot or overlapping-write protection. Reject snapshot use for any purpose outside typed file restore and deny restoration outside the recorded file scope.
    relations:
      - type: applies_to
        target: definition.nimi.harness.assistant.core-app
  - id: rule.nimi.harness.assistant.worker-isolation
    kind: rule
    title: Bound spill, control frames and worker lifetime
    modality: must
    statement: Redirect temporary spill to <nimi-data>/spill/ with a 2 GB limit and 14-day LRU policy. Bound control frames to 256 KiB and use a single-instance lock and an isolated utilityProcess.
    condition: When the Harness worker starts, stores spill data or receives control frames.
    failure: Reject an oversized frame or a conflicting worker and enforce the spill limits.
    relations:
      - type: applies_to
        target: definition.nimi.harness.assistant.core-app
