format: nimicoding.authority/v2
owner: team.nimiday
scope: nimiday.assistant
units:
  - id: rule.nimi.nimiday.assistant.source-attention-summary
    kind: rule
    title: Bound the Today source summary and preserve precise full-list access
    modality: must
    statement: Today shows at most three source attention units, one unresolved-association summary and one recent-unread-dynamics summary, without borrowing empty slots or growing with publisher count. Deduplicate stable business objects within their publishing registration; aggregate only records with the same verified source group, association, attention tier and handling reason, never by names or across registrations. Rank explicit needs-attention before ordinary open reminders, distribute equal-tier units across Apps and keep deterministic stable-identity order rather than promoting repeated updates. Do not infer deadlines or urgency from titles, publication times or recommendation windows. Always expose See all into Care's all-sources view, including unassociated records, with exact group and state entry filters, searchable App and object filters and access to arranged, snoozed, hidden and terminal records. Counts describe distinct loaded items, not cards or update events, and incomplete coverage is explicitly qualified. Recent dynamics include only unread non-action content from the past seven days; old open reminders never expire by age. Ordinary updates do not reshuffle a user's active reading session without an explicit refresh, while permission and terminal-state changes invalidate obsolete actions immediately.
    condition: Whenever NimiDay presents other Apps' Activity in Today or its linked complete list.
    failure: Preserve bounded summaries and reachable omitted items; show loading, unavailable or incomplete coverage instead of empty-success or fabricated totals.
    relations:
      - type: applies_to
        target: definition.nimi.nimiday.assistant.business
  - id: rule.nimi.nimiday.assistant.source-attention-lifecycle
    kind: rule
    title: Separate source completion from local attention and reading state
    modality: must
    statement: Opening or acknowledging a source never completes it. Saved active Day arrangements remove duplicate arrangement prompts; deletion or ending of the arrangement, changed source content or source completion/cancellation requiring review of a still-active arrangement can restore a precise review prompt. Local review acknowledgement suppresses only that reviewed content and handling reason. Local snooze suppresses homepage presentation until the chosen time, and stable-object hide persists across ordinary revisions until explicit restore; neither mutates shared read state or source business. Terminal sources leave pending attention, except an unresolved impact on an active arrangement, and never return solely because a snooze expires. Local hide and snooze remain visible and reversible in the complete list. Association removes only the association prerequisite, never the source task. Source-follow preferences and ended-care scope remain effective. Presentation choices are persisted through normal App storage with failed saves exposed; no source mutation or success is inferred from a timer, opening, local completion or unavailable source.
    condition: Whenever a user handles a source reminder or its linked Day arrangement.
    failure: Retain the actual source state and expose unsaved or unavailable outcomes without false completion or lost access to locally suppressed items.
    relations:
      - type: applies_to
        target: definition.nimi.nimiday.assistant.business
  - id: rule.nimi.nimiday.assistant.child-source-addition
    kind: rule
    title: Add a shared child and its care association in one explicit action
    modality: must
    statement: In first-run setup and every add-child or child-linking entry point, Day obtains candidates only from the complete current ParentOS child-directory.v1 Activity snapshot, never from reminders. Day completes the independent activity listing before offering candidates, validates the app, publishing sourceRef, stable child-directory key, activity kind and every children entry, and distinguishes missing snapshot, valid empty family, loading, no access, malformed or unavailable snapshot and unavailable source. Each candidate uses sourceRef plus childId; equal names and different registrations never merge. Adding and associating a child is one explicit action that creates or reuses the local care circle and saves its sourceGroups mapping together, enables following ParentOS, and reports success only after persistence. Linking an existing child is supported in the same flow, and manual child creation remains a secondary entry without implicit source association. First-run drafts revalidate against the current complete directory before finishing. Directory rename preserves identity; deletion removes the candidate while preserving local care objects, mappings and arrangements. Reminders retain their independent identity validation. Unavailable permissions or sessions never permit new source additions; recovery refreshes and revalidates without duplicates.
    condition: Whenever Day offers or completes child creation from ParentOS.
    failure: Refuse unavailable or invalid source selections, preserve manual creation and existing care data, and keep unsaved results visibly retryable.
    relations:
      - type: applies_to
        target: definition.nimi.nimiday.assistant.business
  - id: rule.nimi.nimiday.assistant.child-source-association
    kind: rule
    title: ParentOS reminders require an explicit source and child association
    modality: must
    statement: For ParentOS growth-record-reminder.v1 and care-reminder.v1 Activity records, Day validates the Runtime source app and sourceRef and the published data.childId, childName, ruleId, repeatIndex, windowStart and windowEnd against the existing key and objectRef. Day associates a child only by the publishing sourceRef and childId through a user-selected non-ended child care circle, reusing its sourceGroups preferences with a child-specific key; opaque groupRef preferences, App-wide choices, equal names, current selection and first-child defaults never establish this association. Invalid, missing or unassociated identity remains visibly unassociated outside child detail pages; invalid identity is not openable or associable. Settings shows child names and distinguishable source and child identifiers, permits association even when only one child is published, and permits clearing an association without fallback. A rename changes display text while preserving association; distinct source registrations and distinct child IDs remain separate. Opening uses the original Activity ID through the public Activity open operation and does not complete the source reminder.
    condition: Whenever Day projects, displays, associates or opens ParentOS reminders.
    failure: Keep unknown or conflicting ownership unassociated and prevent attribution to another child; do not guess or silently migrate historical opaque groups.
    relations:
      - type: applies_to
        target: definition.nimi.nimiday.assistant.business
  - id: rule.nimi.nimiday.assistant.item-editor-scheduling
    kind: rule
    title: Item editing prevents new past schedules while preserving overdue items
    modality: must
    statement: In Day's item editor, creating an item or changing its date or time permits only today or a later local date; a timed schedule must not precede the current instant. Date and time panels constrain their selectable values and saving rechecks the current clock. All-day items may use today and undated items remain supported. An existing item's unchanged date and time, including an overdue schedule, remain editable with other fields and are never silently moved forward merely by opening or saving the editor.
    condition: Whenever a user creates or edits an item through the Day item editor.
    failure: Keep an invalid draft open with an actionable scheduling message and do not save it; preserve existing item data until the user saves a valid draft.
    relations:
      - type: applies_to
        target: definition.nimi.nimiday.assistant.business
  - id: rule.nimi.nimiday.assistant.skill-library
    kind: rule
    title: Skill discovery, shortcuts and scheduled routines remain distinct
    modality: must
    statement: Day offers its available built-in and user-authored skills through an add-skill library and exposes only the user's saved favorites as everyday shortcuts. Using a skill once does not add a favorite or create a routine. Adding or removing a favorite changes only that shortcut and preserves the skill's method, lessons, task history and existing routines. Creating a custom skill also adds its shortcut; editing one does not restore a shortcut the user removed. Setting a routine requires choosing and saving its schedule, independently of favorites. A fresh favorites list starts empty and offers lightweight discovery guidance; historical use and available presets do not silently enroll favorites.
    condition: Whenever a user discovers, starts, personalizes or schedules a Day skill.
    failure: Keep unavailable skills non-executable and preserve saved user choices; do not report a shortcut as scheduled or delete underlying work when removing it.
    relations:
      - type: applies_to
        target: definition.nimi.nimiday.assistant.business
  - id: definition.nimi.nimiday.assistant.business
    kind: definition
    title: NimiDay App-owned arrangements and follow-up
    meaning: NimiDay owns its user arrangements, items, routines, skills, user decisions, waits and completion checks while using an appointed existing LocalAgent and formally admitted integrations. App exchanges and results remain business state, with optional publication and Memory submission rather than an additional canonical Conversation.
  - id: rule.nimi.nimiday.assistant.background-follow-up
    kind: rule
    title: Day follows real replies while its admitted executor lives
    modality: must
    statement: For its supported arrange, notify and collect-replies workflow, Day keeps its necessary business code in its live protected Host when its window closes, binds the selected account and permitted recipients or selection rules, consumes the selected real reply or object-state interface, and updates its own arrangement or requests an actual user decision. Agent busy retains definitely unaccepted work and later continues with its original material and connection. Day distinguishes created arrangement, sent notification, received reply and actual goal completion; exit or session loss halts progress and recovery remains App-selected under a new valid context.
    condition: Whenever Day performs its supported arrangement follow-up.
    failure: Report unavailable, interrupted or unconfirmed instead of treating a timer, outbound send, model reply or Runtime reconnection as completed follow-up.
    relations:
      - type: applies_to
        target: definition.nimi.nimiday.assistant.business
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-business-execution
      - type: applies_to
        target: definition.nimi.runtime.integration.call-plane
  - id: rule.nimi.nimiday.assistant.business-effects
    kind: rule
    title: Day commits only its own actual effects
    modality: must
    statement: Day saves its own item or handbook change before reporting successful tool completion, preserves source linkage and treats a related App reminder as separately owned. Scheduling or completing a Day item and opening its source do not mark that source business complete. Source replies are data under the original authorized selection rules and cannot expand the account, action or recipient scope.
    condition: Whenever Day handles a tool write or cross-App arrangement.
    failure: Return unsaved, conflict, unavailable or uncertainty without duplicate-effect assumptions, unauthorized source mutation or fabricated completion.
    relations:
      - type: applies_to
        target: definition.nimi.nimiday.assistant.business
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-business-execution
