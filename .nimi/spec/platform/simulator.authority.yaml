format: nimicoding.authority/v2
owner: team.platform
scope: platform.simulator
units:
  - id: definition.nimi.platform.simulator.product
    kind: definition
    title: Independent Simulator product
    meaning: Simulator is the lower-priority public Nimi ecosystem website and browser preview product for selected App experiences using clearly disclosed Mock or Deterministic Data with no real Realm, Runtime, account, permission, credential, or LocalAgent side effects.
  - id: definition.nimi.platform.simulator.selected-source-protocol
    kind: definition
    title: Selected App preview boundary
    meaning: Simulator previews only explicitly selected, reviewed, host-neutral App presentation sources required by current product journeys and does not become a public source registry, arbitrary hosting platform, or distribution authority.
  - id: definition.nimi.platform.simulator.renderer-factory
    kind: definition
    title: App-owned preview renderer
    meaning: Each selected App owns its renderer, resources, routes, presentation, and product semantics; Simulator supplies only the bounded preview host context.
  - id: definition.nimi.platform.simulator.adapter
    kind: definition
    title: App-owned Simulator adapter
    meaning: A selected App may provide the minimal adapter needed to construct its host-neutral preview without transferring App or product authority to Simulator.
  - id: definition.nimi.platform.simulator.state-engine
    kind: definition
    title: Deterministic Simulator state
    meaning: Simulator may own deterministic, session-ephemeral presentation scenarios, logical ordering, seeded randomness, reset, and replay for preview only.
  - id: definition.nimi.platform.simulator.session-projection
    kind: definition
    title: Simulated session projection
    meaning: A simulated session is clearly labeled deterministic presentation state and never a real or inferred Nimi account, Runtime session, App permission, or persistent identity.
  - id: definition.nimi.platform.simulator.interaction-protocol
    kind: definition
    title: Simulated presentation interaction
    meaning: Simulated interactions coordinate selected preview instances through typed presentation-only intent and events without creating real App-to-App, Runtime, Realm, permission, or messaging authority.
  - id: definition.nimi.platform.simulator.effect-boundary
    kind: definition
    title: Simulator effect boundary
    meaning: Simulator admits only reviewed presentation effects required for preview and excludes real authentication, credentials, product mutation, provider execution, local host control, installation, and persistent side effects.
  - id: definition.nimi.platform.simulator.owner-boundary
    kind: definition
    title: Simulator owner boundary
    meaning: Simulator owns its public website, preview shell, disclosure, deterministic presentation scenarios, and session-local controls while Realm, Runtime, SDK, Kit, Apps, LocalAgent, Avatar, authorization, and distribution semantics remain with their existing owners.
  - id: definition.nimi.platform.simulator.failure-model
    kind: definition
    title: Simulator failure model
    meaning: Simulator exposes explicit typed preview, adapter, instance, scenario, and session failure without retries or fallbacks that imply real product success.
  - id: rule.nimi.platform.simulator.p-sim-001a
    kind: rule
    title: Simulator retains its current core position
    modality: must
    statement: Simulator remains the public Nimi ecosystem website and a browser preview and check surface for selected current App experiences.
    condition: Whenever Simulator product scope is planned or presented.
    failure: Reject a new product category unrelated to the current public website and bounded preview role.
    relations:
      - type: applies_to
        target: definition.nimi.platform.simulator.product
  - id: rule.nimi.platform.simulator.p-sim-001b
    kind: rule
    title: Simulation is always disclosed
    modality: must
    statement: Every Simulator preview clearly and accessibly discloses that displayed identity, account, permission, data, LocalAgent, Conversation, and product state is simulated or deterministic.
    condition: Whenever a Simulator preview is visible.
    failure: Treat an undisclosed preview as invalid.
    relations:
      - type: applies_to
        target: definition.nimi.platform.simulator.product
  - id: rule.nimi.platform.simulator.p-sim-001c
    kind: rule
    title: Simulator is lower priority and non-blocking
    modality: must
    statement: Simulator work and completeness do not block the current Windows Nimi Home, Runtime, Local AI, Character materialization, LocalAgent, Memory, Knowledge, Avatar, SDK, Kit, or Third-party Local App closure.
    condition: Whenever Simulator readiness is related to current product closure.
    failure: Remove Simulator as a prerequisite and report its own state separately.
    relations:
      - type: applies_to
        target: definition.nimi.platform.simulator.product
  - id: rule.nimi.platform.simulator.p-sim-002
    kind: rule
    title: Simulator creates no real side effects
    modality: must_not
    statement: Simulator creates, changes, deletes, or authorizes a real Realm record, Runtime resource, account, permission, credential, LocalAgent, Conversation, Memory, Knowledge, App installation, Avatar state, provider job, or host operation.
    condition: Whenever a preview interaction is executed.
    failure: Keep the effect in deterministic session-local presentation state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.simulator.effect-boundary
  - id: rule.nimi.platform.simulator.p-sim-003
    kind: rule
    title: Simulator receives no real credentials
    modality: must_not
    statement: Simulator requests, stores, forwards, or derives Realm JWT, Provider Credential, Runtime proof, account bearer, protected endpoint, host session, or real App authorization.
    condition: Whenever Simulator loads or runs a preview.
    failure: Reject the credential path and keep the preview deterministic and credential free.
    relations:
      - type: applies_to
        target: definition.nimi.platform.simulator.effect-boundary
  - id: rule.nimi.platform.simulator.p-sim-004
    kind: rule
    title: App renderers remain App owned
    modality: must
    statement: A selected App owns its renderer, routes, resources, product copy, and presentation behavior, while Simulator supplies only the bounded preview host and mock inputs.
    condition: Whenever Simulator renders a selected App.
    failure: Reject a Simulator-owned fork of App product behavior.
    relations:
      - type: applies_to
        target: definition.nimi.platform.simulator.renderer-factory
  - id: rule.nimi.platform.simulator.p-sim-005
    kind: rule
    title: Preview adapters are minimal and demand driven
    modality: must
    statement: A Simulator adapter exists only for a concrete selected App preview journey, remains host neutral and presentation-only, and does not become a mandatory App framework, SDK layer, capability catalog, or lifecycle owner.
    condition: Whenever a selected App needs Simulator integration.
    failure: Reject speculative adapter surface without a current preview consumer.
    relations:
      - type: applies_to
        target: definition.nimi.platform.simulator.adapter
  - id: rule.nimi.platform.simulator.p-sim-006
    kind: rule
    title: Selected sources do not create a registry product
    modality: must_not
    statement: A selected preview source list, generated import map, renderer descriptor, fixture catalog, or build input is treated as public distribution, Marketplace, Registry, Trust Tier, installation, or product admission authority.
    condition: Whenever Simulator selects preview sources.
    failure: Keep source selection internal to the bounded current preview build.
    relations:
      - type: applies_to
        target: definition.nimi.platform.simulator.selected-source-protocol
  - id: rule.nimi.platform.simulator.p-sim-007
    kind: rule
    title: Arbitrary source hosting is out of scope
    modality: must_not
    statement: Simulator accepts arbitrary source repositories, unreviewed code, user uploads, package installation, general remote execution, or public App hosting.
    condition: Whenever Simulator source intake is proposed.
    failure: Keep the source unavailable until a separate product and security authority admits it.
    relations:
      - type: applies_to
        target: definition.nimi.platform.simulator.selected-source-protocol
  - id: rule.nimi.platform.simulator.p-sim-current-008
    kind: rule
    title: Simulated state is deterministic and ephemeral
    modality: must
    statement: Preview scenarios use explicit deterministic fixtures, seeded variation, ordered operations, and session-local state that resets without becoming account, App, Realm, Runtime, or LocalAgent persistence.
    condition: Whenever Simulator produces or restores scenario state.
    failure: Reject hidden nondeterminism and persistent product truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.simulator.state-engine
  - id: rule.nimi.platform.simulator.p-sim-009
    kind: rule
    title: Reset restores the selected fixture
    modality: must
    statement: Simulator reset discards session-local mutations and returns each selected preview to its declared deterministic starting state without contacting product owners.
    condition: Whenever a user resets a preview or session.
    failure: Report reset failure rather than retain hidden state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.simulator.state-engine
  - id: rule.nimi.platform.simulator.p-sim-010
    kind: rule
    title: Simulated sessions never become identity
    modality: must_not
    statement: A simulated persona, account label, App session, permission posture, LocalAgent selector, or route is accepted as real identity or authorization by any product owner.
    condition: Whenever simulated session data crosses a preview boundary.
    failure: Keep the data inside the Simulator presentation session.
    relations:
      - type: applies_to
        target: definition.nimi.platform.simulator.session-projection
  - id: rule.nimi.platform.simulator.p-sim-011
    kind: rule
    title: Instance state is isolated
    modality: must
    statement: Each preview instance has isolated App resources and session-local presentation state, and one instance cannot mutate another except through an explicitly simulated presentation interaction.
    condition: Whenever multiple preview instances are visible.
    failure: Reject hidden shared mutable state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.simulator.session-projection
  - id: rule.nimi.platform.simulator.p-sim-012
    kind: rule
    title: Simulated interactions create no platform bus
    modality: must_not
    statement: Simulator interaction events become a Runtime, Realm, SDK, Kit, App-to-App, LocalAgent, or public platform event protocol.
    condition: Whenever selected preview instances coordinate.
    failure: Keep the event typed, presentation-only, and local to the simulated session.
    relations:
      - type: applies_to
        target: definition.nimi.platform.simulator.interaction-protocol
  - id: rule.nimi.platform.simulator.p-sim-013
    kind: rule
    title: Product owners remain authoritative
    modality: must
    statement: Simulator projections of Realm, Runtime, LocalAgent, Avatar, App, permission, AI, SDK, and Kit concepts follow their public semantics but never claim current owner state or implementation acceptance.
    condition: Whenever Simulator presents a Nimi domain concept.
    failure: Label the projection simulated and reject owner claims.
    relations:
      - type: applies_to
        target: definition.nimi.platform.simulator.owner-boundary
  - id: rule.nimi.platform.simulator.p-sim-014
    kind: rule
    title: Future platform expansion is deferred
    modality: must
    statement: Marketplace, public App distribution, Registry, Trust Tier, arbitrary source hosting, cross-product platform orchestration, real authentication, real Runtime connectivity, and any new Simulator product class remain outside the current Simulator scope.
    condition: Whenever Simulator expansion is proposed.
    failure: Isolate the proposal until separate product authority admits it.
    relations:
      - type: applies_to
        target: definition.nimi.platform.simulator.owner-boundary
  - id: rule.nimi.platform.simulator.p-sim-015
    kind: rule
    title: Failures remain visible and local
    modality: must
    statement: Adapter, renderer, fixture, scenario, interaction, and instance failures are typed, visible, and isolated to the affected preview when possible.
    condition: Whenever a Simulator component fails.
    failure: Do not convert failure into empty success or a claim about real product state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.simulator.failure-model
  - id: rule.nimi.platform.simulator.p-sim-016
    kind: rule
    title: Simulator checks do not prove product connectivity
    modality: must_not
    statement: A deterministic preview, visual check, fixture test, build, source registry, or replay is reported as successful Realm, Runtime, LocalAgent, Avatar, account, permission, or Third-party App product connectivity.
    condition: Whenever Simulator acceptance is summarized.
    failure: Report only preview behavior and classify real connectivity as not verified.
    relations:
      - type: applies_to
        target: definition.nimi.platform.simulator.failure-model
