format: nimicoding.authority/v2
owner: team.platform
scope: platform.app-ecosystem
units:
  - id: rule.nimi.platform.remote-clients.development-source
    kind: rule
    title: Official Realm development retains reviewed source qualification
    modality: must
    statement: A Web development origin or Android debug App Link may use the existing reviewed remote registration without a native package release. Debug build type does not select local Realm or waive package, certificate, verified App Link, exact callback, PKCE or Home confirmation. Untrusted Web Apps use distinct explicitly configured HTTPS origins; a scaffold port hash and client id storage key are not browser isolation. Ordinary content updates do not advance source revision. The local-only android-dev-scheme remains unavailable in official production and the public Registry. Tools report unregistered input honestly and never manufacture approval, an official-manager identity or another source database.
    condition: When preparing or running an ecosystem Web or Android development source.
    failure: Refuse unregistered or mismatched sources and preserve existing account, source and operation admission; do not turn a local Registry check into official acceptance.
    relations:
      - type: applies_to
        target: definition.nimi.platform.remote-clients.registration
  - id: definition.nimi.platform.remote-clients.registration
    kind: definition
    title: Registry admitted remote application source
    meaning: A remote client registration belongs to the same Git-reviewed nimiplatform/nimi-app-registry authority as native package admission. Its remote-clients.json document maps a stable client identifier to one canonical App identity, publisher, display name, source kind and exact source, callback, source revision, App access declaration, capability references, current active or paused status, and human review. A website is a mutable deployment and requires no fictitious package, immutable release or byte digest. Explicit App identity mapping determines whether Web and native clients share the current user's App configuration; branding or publisher equality does not. Registration confers neither user identity nor Runtime admission.
  - id: rule.nimi.platform.remote-clients.web-registration
    kind: rule
    title: Web sources use exact registered origins and callbacks
    modality: must
    statement: Web registration admits sources with an exact canonical HTTPS origin and one exact same-origin HTTPS callback without userinfo, query or fragment. Wildcards, caller-supplied callbacks and client secrets are absent. A client identifier cannot be reassigned to a different canonical App. Source, callback, role, declaration or capability changes advance the source revision by one and require new Runtime source confirmation; ordinary website content updates need no byte proof. Display changes and pause or resume retain the source revision, and pausing preserves application data and the owner's prior source decision. Native carriers outside the admitted Android contracts remain unavailable until their own source proof is implemented, without creating a different business permission model.
    condition: When a remote Web source is registered, changed or consumed.
    failure: Reject malformed or unreviewed entries, callback or origin mismatch, identifier reassignment, wrong revision or paused source before issuing a current use context; never infer native process identity from a Web origin.
    relations:
      - type: applies_to
        target: definition.nimi.platform.remote-clients.registration
  - id: rule.nimi.platform.remote-clients.review-and-role
    kind: rule
    title: Registry review establishes source qualification only
    modality: must
    statement: Remote registration changes use a human Registry maintainer decision and the existing Git review boundary. Deterministic validation checks shape, exact identity, changed source revision and the actual maintainer actor; it never authors an approval. The Registry's app or official_manager role is maintainer-owned qualification, not a publisher declaration or a request field. Official manager qualification does not itself authorize Runtime management; each connection still needs the current primary owner's verified identity and management session, and the PC Home confirms once per Account, primary Runtime and management application/source rather than per browser or device. App access declaration and resource decisions retain their existing Runtime owners. Registry publication never asserts a completed or reachable remote AI path.
    condition: When a remote source is admitted, paused, resumed or used to establish client qualification.
    failure: Reject automated or self-reported approval and role elevation, unrelated App identity and any attempt to treat source qualification as owner consent or Runtime operation permission.
    relations:
      - type: applies_to
        target: definition.nimi.platform.remote-clients.registration
  - id: rule.nimi.platform.remote-clients.android-registration
    kind: rule
    title: Android sources use a registered signed App Link identity
    modality: must
    statement: An android-app-link source reuses the canonical App, client id, source revision, role, declaration and human Registry review. It declares a canonical HTTPS association origin, one exact same-origin HTTPS callback, the Android package name and one uppercase colon-separated SHA-256 signing-certificate fingerprint. Admission requires the publisher-controlled association host to bind that package and certificate through Android Digital Asset Links and the signed application to declare the exact verified callback; source metadata or a self-reported native flag is not proof of callback delivery. The system browser owns Nimi authentication and the OS-verified App Link returns the single-use PKCE code to the initiating application, which validates its current transaction before exchange. Package, signing identity, callback, association origin, role or declarations changing advances the source revision and requires fresh Home source confirmation; ordinary same-signature app updates or another device do not. Native source registration does not add browser CORS admission, a device grant, a second business permission model or Runtime management authority.
    condition: When an Android App Link source is registered, changed or used.
    failure: Reject malformed or unreviewed source metadata, unverified callback association, wrong package or signing identity, mismatched PKCE callback, source revision changes or use of a Web registration as native qualification; leave native carriers outside the explicitly admitted contracts unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.platform.remote-clients.registration
  - id: rule.nimi.platform.remote-clients.android-development
    kind: rule
    title: Local Android development uses an explicitly admitted private-use callback
    modality: must
    statement: An android-dev-scheme source reuses the ordinary App registration, Android package and signing certificate, source revision, declarations and human Registry review. Its origin is the lowercase reverse-domain private-use scheme followed by a single slash after the colon, and its exact callback is a canonical absolute path under that scheme without authority, userinfo, query or fragment. Realm admits this source only from an explicitly configured local Registry in a non-production environment. The public snapshot and its merge validation reject this development kind; local reviewed entries use the same registration schema in separate local data. Its role is app and never official_manager. The installed debug application verifies its package, signing certificate and declared callback, while the official system-browser login uses the same single-use authorization code, S256 PKCE, state and exact callback checks. Scheme dispatch does not claim OS-verified domain ownership or confidential client identity. This is a supported local development carrier, not a skipped App Link check; Android App Link remains the distributed carrier and no automatic fallback selects the development source. Home confirms this source once under the existing Account and primary Runtime boundary; updates and reconnections do not add device approvals. It creates no browser CORS grant, Account token, separate permission system, relay or AI execution path.
    condition: When an Android application is developed against a local Realm using a private-use URI callback.
    failure: Reject production or public-Registry use, non-debug hosts, missing review, manager role, invalid callback, wrong installed identity, replayed or mismatched login transaction; keep the existing App Link verification unchanged.
    relations:
      - type: applies_to
        target: definition.nimi.platform.remote-clients.registration
