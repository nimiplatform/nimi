format: nimicoding.authority/v2
owner: team.platform
scope: platform.core-protocol
units:
  - id: definition.nimi.platform.core-protocol.protocol-version
    kind: definition
    title: Protocol version
    meaning: A protocol version has major, minor, and patch components and uses strict compatibility in version one.
  - id: definition.nimi.platform.core-protocol.participant-profile
    kind: definition
    title: Participant capability profile
    meaning: A participant capability profile is the statically published capability description referenced by a Realm or Runtime participant.
  - id: definition.nimi.platform.core-protocol.realm-primitive-layer
    kind: definition
    title: Realm primitive protocol layer
    meaning: The platform protocol layer exposes the six world primitives Timeflow, Social, Economy, Transit, Context, and Presence while the Realm canonical surface separately elaborates their semantic core and read path.
  - id: definition.nimi.platform.core-protocol.l0-envelope
    kind: definition
    title: L0 request envelope
    meaning: The L0 request envelope carries protocol version, participant protocol version, participant identity, domain, optional app identity, trace identity, idempotency identity, and world and primitive identity for world-primitive requests through gRPC metadata while the business payload remains in the proto body.
  - id: definition.nimi.platform.core-protocol.protected-app-authorization
    kind: definition
    lifecycle: removed
    title: Retired protected App permission authorization decision
    reason: Removed because protected App ingress now uses one exact App operation contract and a fresh Effective App Access Snapshot derived from registration and declaration, with no permission or grant decision.
  - id: definition.nimi.platform.core-protocol.app-operation-contract
    kind: definition
    title: Canonical App operation contract
    meaning: The closed App operation contract contains exactly thirty-five mappings—runtime.app-storage.json.read as Base, runtime.app-storage.json.write as Base, runtime.app-storage.json.remove as Base, runtime.app-storage.asset.stat as Base, runtime.app-storage.asset.list as Base, runtime.app-storage.asset.write as Base, runtime.app-storage.asset.read as Base, runtime.app-storage.asset.remove as Base, runtime.app-storage.asset.move as Base, runtime.ai.app-config.get as Base, realm.world-core.list as AppAccess realm.data, realm.world-core.create as AppAccess realm.data, runtime.ai.text-candidate.generate as AppAccess runtime.consume, runtime.ai.text-turn.stream as AppAccess runtime.consume, runtime.ai.scenario.execute as AppAccess runtime.consume, runtime.ai.scenario-job.submit as AppAccess runtime.consume, runtime.ai.scenario-job.get as AppAccess runtime.consume, runtime.ai.scenario-job.subscribe as AppAccess runtime.consume, runtime.ai.scenario-job.cancel as AppAccess runtime.consume, runtime.ai.artifact.read as AppAccess runtime.consume, runtime.ai.artifact.upload as AppAccess runtime.consume, runtime.ai.artifact.adopt-to-app-storage as AppAccess runtime.consume, runtime.ai.voice-assets.list as AppAccess runtime.consume, runtime.agent.reference.list as AppAccess agent.local, runtime.agent.conversation.open as AppAccess agent.local, runtime.agent.conversation.turn.send as AppAccess agent.local, runtime.agent.conversation.turn.interrupt as AppAccess agent.local, runtime.agent.conversation.events.subscribe as AppAccess agent.local, runtime.agent.conversation.snapshot.get as AppAccess agent.local, runtime.agent.ai-config.get as AppAccess agent.configure, runtime.agent.ai-config.overwrite as AppAccess agent.configure, runtime.agent.autonomy.snapshot.get as AppAccess agent.configure, runtime.agent.autonomy.update as AppAccess agent.configure, runtime.agent.presentation.snapshot.get as AppAccess agent.configure, and runtime.agent.presentation.commit as AppAccess agent.configure; each AppOperationId is a stable callable identity derived by Runtime from the typed protected ingress rather than caller-supplied classification, authority, exact handler identity, implementation detail, or an extensible public catalog.
    relations:
      - type: supersedes
        target: definition.nimi.platform.core-protocol.protected-app-authorization
  - id: definition.nimi.platform.core-protocol.effective-app-access-snapshot
    kind: definition
    title: Effective App Access Snapshot
    meaning: An Effective App Access Snapshot is the immutable session-scoped Runtime result derived from one registered App subject, exact source and declaration generations, current account context generation, and only the supported declared AppAccess domain coverage; Base operation classification and invariants remain outside the snapshot in the canonical App operation contract, and the snapshot is neither persistent configuration, catalog or review truth, a service, a PermissionGrant, nor a durable authorization posture.
  - id: definition.nimi.platform.core-protocol.world-app-binding
    kind: definition
    lifecycle: removed
    title: Retired world and extension-app binding
    reason: Removed because supported App Realm access is only the Runtime-mediated realm.data typed operation path and no render-app or extension-app world binding authorizes a direct Realm primitive operation.
  - id: definition.nimi.platform.core-protocol.app-mode
    kind: definition
    lifecycle: removed
    title: Retired render-app and extension-app access mode
    reason: Removed because supported App access uses Base plus the closed declaration domains and exact operation mapping, with no mode-based direct world access matrix.
  - id: definition.nimi.platform.core-protocol.action-plane
    kind: definition
    title: Isolated external action capability plane
    meaning: The action plane is an isolated optional capability, not a Runtime core prerequisite or LocalAgent owner; when separately admitted, consumers reach it only through typed Runtime and SDK projection.
  - id: definition.nimi.platform.core-protocol.execution-principal
    kind: definition
    title: AI execution principal
    meaning: An AI execution principal is an admitted security context for an authenticated human or account, a Runtime LocalAgent, a device, a service, or a separately admitted external action caller; principal classification does not change product identity or owner boundaries.
  - id: definition.nimi.platform.core-protocol.action-descriptor
    kind: definition
    title: Action descriptor
    meaning: An action descriptor contains actionId, inputSchema, outputSchema, riskLevel, executionMode, idempotent, supportsDryRun, auditEventMap, and compensation, with riskLevel in low, medium, or high and executionMode in full, guarded, or opaque.
  - id: definition.nimi.platform.core-protocol.action-execution
    kind: definition
    title: Action execution protocol
    meaning: Action execution proceeds through discover, dry-run, verify, commit, and audit, where full execution uses dry-run and post-commit verification, guarded execution may substitute preflight and uses strong audit, and opaque execution uses persistent audit.
  - id: definition.nimi.platform.core-protocol.ai-route
    kind: definition
    title: AI route
    meaning: An AIConfig route intent is exactly Local or Cloud for one CapabilityContract; Local dynamically dereferences the machine-selected Local Capability Configuration, Cloud names one Cloud CapabilityImplementation and Driver-owned provider-model target intent, and local privacy semantics apply only to Local.
  - id: definition.nimi.platform.core-protocol.ai-scope-ref
    kind: definition
    lifecycle: removed
    title: Retired scoped AI configuration identity
    reason: Removed because AIConfig ownership is now closed to App or product owners and one shared Runtime LocalAgent subsystem rather than app, module, feature, or per-LocalAgent scopes.
  - id: definition.nimi.platform.core-protocol.ai-scope-lifecycle
    kind: definition
    lifecycle: removed
    title: Retired AI scope lifecycle
    reason: Removed with the scoped AI configuration identity and replaced by canonical AIConfig owner lifecycle.
  - id: definition.nimi.platform.core-protocol.materialized-ai-config
    kind: definition
    lifecycle: removed
    title: Retired materialized scoped AI configuration
    reason: Removed because AIConfig no longer owns Local implementation, model, component, LocalAsset binding, or Runtime exact-target materialization.
  - id: definition.nimi.platform.core-protocol.built-in-chat-scopes
    kind: definition
    lifecycle: removed
    title: Retired built-in chat scopes
    reason: Removed because Desktop Nimi Chat uses the Desktop App AIConfig while Desktop Agent Chat projects the one shared Runtime LocalAgent subsystem AIConfig.
  - id: definition.nimi.platform.core-protocol.app-launch-ai-scope
    kind: definition
    lifecycle: removed
    title: Retired Nimi App launch AI scope
    reason: Removed because each admitted App or product owner owns one AIConfig and launch does not create feature, module, route, renderer, or transient AI scopes.
  - id: definition.nimi.platform.core-protocol.capability-contract
    kind: definition
    title: CapabilityContract
    meaning: A CapabilityContract is the canonical product capability request, input, output, stream, cancel, progress, artifact, error, and job semantic boundary that Apps and LocalAgents consume without naming an engine, provider, model, or implementation.
  - id: definition.nimi.platform.core-protocol.standardized-capability-feature
    kind: definition
    title: Contract-scoped standardized feature
    meaning: A standardized feature identity is the pair of one CapabilityContract and one contract-local short name; the same short name under another contract has no shared meaning, and the current standardized input features are input.image, input.audio, and input.video on text.generate, input.image and input.mask on image.generate, input.image on video.generate, input.audio on music.generate, and input.text and input.audio on voice.create.
  - id: definition.nimi.platform.core-protocol.capability-implementation
    kind: definition
    title: CapabilityImplementation
    meaning: A CapabilityImplementation is a concrete Local or Cloud semantic implementation of one or more CapabilityContracts with a declared standardized-feature support set and exactly one CapabilityImplementationDriver and dialect identity.
  - id: definition.nimi.platform.core-protocol.capability-implementation-driver
    kind: definition
    title: CapabilityImplementationDriver
    meaning: A CapabilityImplementationDriver owns one implementation dialect, interprets its opaque portable configuration, deterministically projects normalized requirements, validates known compatibility and feature support, maps exact bindings and requests to engine invocation, and translates stream, progress, cancel, artifact, and error semantics without owning AIConfig, machine selection, routing, or fallback.
  - id: definition.nimi.platform.core-protocol.execution-host
    kind: definition
    title: ExecutionHost
    meaning: An ExecutionHost is the Runtime-private local process, Python worker, managed server, or remote transport substrate that owns supervision, IPC, leases, concurrency, and private health while owning no capability, Driver dialect, configuration, binding, route, or selection semantics.
  - id: definition.nimi.platform.core-protocol.ai-config-owner
    kind: definition
    title: AIConfig owner
    meaning: The closed current AIConfig owner set contains each admitted App or product owner and exactly one Runtime LocalAgent subsystem owner shared by all Runtime LocalAgents; Agent, feature, module, route, chat mode, renderer, window, conversation, or other transient identities are not AIConfig owners.
    relations:
      - type: supersedes
        target: definition.nimi.platform.core-protocol.ai-scope-ref
  - id: definition.nimi.platform.core-protocol.ai-config-owner-lifecycle
    kind: definition
    title: AIConfig owner lifecycle
    meaning: An App or product AIConfig follows its canonical owner lifecycle, while the shared Runtime LocalAgent AIConfig follows the Runtime LocalAgent subsystem lifecycle and never follows an individual LocalAgent lifecycle.
    relations:
      - type: supersedes
        target: definition.nimi.platform.core-protocol.ai-scope-lifecycle
  - id: definition.nimi.platform.core-protocol.ai-config
    kind: definition
    title: AIConfig
    meaning: An AIConfig is the current capability intent for exactly one canonical AIConfig owner and stores per CapabilityContract a Local or Cloud route intent, required standardized features, defaults, and, only for Cloud, the CapabilityImplementation and Driver-owned provider-model target intent chosen through authorized Nimi-owned configuration; a protected App may read and consume its owner record but cannot author or overwrite it, and ordinary same-account App input carries no route, implementation, provider-model target, connector identity, account identity, or credential material.
    relations:
      - type: supersedes
        target: definition.nimi.platform.core-protocol.materialized-ai-config
  - id: definition.nimi.platform.core-protocol.ai-profile
    kind: definition
    title: AIProfile
    meaning: An AIProfile is an independently and directly editable portable template that may carry AIConfig intent, Local Capability Configuration intent, Cloud implementation or target recommendations, standardized features, defaults, provenance, and license without becoming live configuration or retaining a product revision, history, inheritance, or re-apply relationship.
  - id: definition.nimi.platform.core-protocol.ai-profile-actions
    kind: definition
    title: AIProfile and configuration product actions
    meaning: The formal product actions are Import Profile, Apply Profile to AIConfig, Add or Update Local Capability Configuration, and Select Local Capability Configuration, with each action writing only its named owner and no cross-owner transaction or success claim.
    relations:
      - type: supersedes
        target: definition.nimi.platform.core-protocol.ai-profile-apply-state
  - id: definition.nimi.platform.core-protocol.machine-local-ai-configuration
    kind: definition
    title: Machine Local AI Configuration
    meaning: Machine Local AI Configuration is the unique per-machine owner of zero or more flat saved Local Capability Configurations per CapabilityContract and at most one selected Local Capability Configuration relation per contract; it contains no App Cloud intent, App defaults, AIProfile, global AIConfig, revision, history, preset chain, or inheritance.
  - id: definition.nimi.platform.core-protocol.local-capability-configuration
    kind: definition
    title: Local Capability Configuration
    meaning: A Local Capability Configuration is a machine-local saved record with a Runtime-generated identity that remains stable for the record's lifetime and contains one CapabilityContract, one CapabilityImplementation, its CapabilityImplementationDriver and dialect identity, Driver-owned portable configuration, deterministically projected normalized local requirements, exact bindings or unresolved slots, declared standardized-feature support, and provenance and display metadata; the stable identity is neither revision nor history, and provenance is non-authorizing metadata rather than identity, binding, or selection truth.
  - id: definition.nimi.platform.core-protocol.connector-grant
    kind: definition
    lifecycle: removed
    title: Retired ConnectorGrant definition
    reason: Removed because the current product provides no per-Connector delegated authorization mechanism; any future cross-account, cross-Realm, shared-credential, service-account, enterprise-managed, or time-bounded delegation requires new authority and a new subject model without compatibility with this retired identity.
  - id: definition.nimi.platform.core-protocol.capability-job-effective-inputs
    kind: definition
    title: Capability job effective inputs
    meaning: Capability job effective inputs are the immutable exact request-time composition captured at submission from authorization, the owner AIConfig, and either the selected Local Capability Configuration with implementation, Driver configuration, and exact bindings or the Cloud implementation, target, Runtime-resolved current-account Connector custody reference, defaults, and request.
  - id: definition.nimi.platform.core-protocol.derived-capability-admission
    kind: definition
    title: Derived capability admission
    meaning: Derived capability admission is a request-time allow or typed blocked reason computed from committed configuration, selection, requirement resolution, feature subset, authorization, quota, budget, and exact current facts without becoming configuration state, readiness, a probe result, or job execution outcome.
  - id: definition.nimi.platform.core-protocol.built-in-chat-ai-config-owners
    kind: definition
    title: Built-in chat AIConfig owners
    meaning: Desktop Nimi Chat consumes the Desktop App AIConfig, while Desktop Agent Chat is a Runtime LocalAgent projection that consumes the one shared Runtime LocalAgent subsystem AIConfig; the two chat surfaces remain distinct consumers and never create chat-specific or per-Agent AIConfig owners.
    relations:
      - type: supersedes
        target: definition.nimi.platform.core-protocol.built-in-chat-scopes
  - id: definition.nimi.platform.core-protocol.app-ai-config-owner
    kind: definition
    title: App AIConfig owner
    meaning: Each admitted Nimi App or product owner has exactly one AIConfig whose owner identity is the canonical app or product identity; app launch, features, modules, surfaces, and renderer instances do not create additional AIConfig owners.
    relations:
      - type: supersedes
        target: definition.nimi.platform.core-protocol.app-launch-ai-scope
  - id: definition.nimi.platform.core-protocol.capability-catalog
    kind: definition
    title: Canonical capability catalog
    meaning: The canonical capability catalog is the single enumeration of active and deferred CapabilityContract identities, also projected as CanonicalCapabilityId values, and gives each active contract its catalog metadata without owning standardized-feature identity, implementation, Driver, provider, model, engine, routing, binding, selection, or permission state.
  - id: definition.nimi.platform.core-protocol.capability-source-resolver
    kind: definition
    title: Capability runtime source resolver
    meaning: A capability runtime source resolver maps provider-capabilities to providers capability tokens and local-adapter-routing to route capability tokens, supports distinct additional runtime tables on one canonical row, and compares active and table-scoped deferred catalog tokens with the complete union admitted by both runtime tables.
  - id: definition.nimi.platform.core-protocol.deferred-capability
    kind: definition
    title: Deferred capability entry
    meaning: A deferred capability entry acknowledges a runtime-admitted token that is not an admitted CanonicalCapabilityId and records a non-empty capability, reason, and source platform rule.
  - id: rule.nimi.platform.core-protocol.p-proto-001
    kind: rule
    title: P-PROTO-001 strict-only version negotiation
    modality: must
    statement: Version negotiation rejects unequal major versions, rejects a participant minor version unequal to the platform minor version, ignores patch for protocol semantics, and accepts only strict compatibility mode in version one.
    condition: Whenever a participant negotiates protocol compatibility.
    failure: Reject the participant before processing its protocol request.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.protocol-version
  - id: rule.nimi.platform.core-protocol.p-proto-002
    kind: rule
    title: P-PROTO-002 static participant profiles
    modality: must
    statement: Realm and Runtime provide capabilityProfileRef, publish fixed-participant profiles statically with versions, and use one realm.core-profile version track for all six primitives without per-primitive tracks or remote hot delivery.
    condition: Whenever participant capability profiles are published or resolved.
    failure: Reject a missing, dynamically delivered, or independently versioned primitive profile.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.participant-profile
  - id: rule.nimi.platform.core-protocol.p-proto-003a
    kind: rule
    title: P-PROTO-003 Realm primitive execution sovereignty
    modality: must
    statement: Semantic execution and truth for all six primitives remain on the Realm canonical surface, while Runtime and apps only consume or transport primitive operations.
    condition: Whenever a participant executes or represents a six-primitive operation.
    failure: Reject a non-Realm provider with REALM_PRIMITIVE_PROVIDER_FORBIDDEN and prevent substitute execution.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.realm-primitive-layer
  - id: rule.nimi.platform.core-protocol.p-proto-003b
    kind: rule
    title: P-PROTO-003 primitive layer is not a semantic-core alias
    modality: must_not
    statement: Platform text aliases the six-primitive protocol layer to the complete Realm semantic core structure.
    condition: Whenever the primitive protocol layer is documented or projected.
    failure: Reject the alias and retain a separate reference to the Realm canonical surface.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.realm-primitive-layer
  - id: rule.nimi.platform.core-protocol.p-proto-010
    kind: rule
    title: P-PROTO-010 request envelope requirements
    modality: must
    statement: Every request carries participantId, every write carries idempotencyKey, and a world-primitive request carries worldId and primitive.
    condition: Whenever an L0 request is admitted.
    failure: Reject the request before domain execution when any required field is absent.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.l0-envelope
  - id: rule.nimi.platform.core-protocol.p-proto-010b
    kind: rule
    title: P-PROTO-010 no caller-supplied protected App context
    modality: must_not
    statement: App request metadata, environment, argv, renderer state, SDK fields, Host fields, or request body supplies the registered subject, account, session, Effective App Access Snapshot, AppOperationId, AppAccessDomainId, classification, owner identity, credential, or other protected access truth.
    condition: Whenever a supported App request is admitted or mapped from a typed protected ingress.
    failure: Reject caller-supplied protected context and derive identity, account, session, snapshot coverage, and stable callable operation only from the protected Runtime ingress and canonical operation contract.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
  - id: rule.nimi.platform.core-protocol.p-proto-011
    kind: rule
    title: P-PROTO-011 gRPC envelope mapping
    modality: must
    statement: gRPC transports L0 fields as x-nimi-protocol-version, x-nimi-participant-protocol-version, x-nimi-participant-id, x-nimi-domain, x-nimi-app-id, x-nimi-trace-id, x-nimi-idempotency-key, x-nimi-world-id, and x-nimi-primitive metadata and transports the business payload in the proto body.
    condition: Whenever an L0 envelope is mapped to gRPC.
    failure: Reject a request whose envelope is mapped through the payload or whose required world metadata is absent.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.l0-envelope
  - id: rule.nimi.platform.core-protocol.p-proto-020
    kind: rule
    title: P-PROTO-020 App access ownership boundaries
    modality: must
    statement: Runtime protected App ingress is the sole App access admission owner and admits each call only after verifying the exact Desktop-launched Host peer and process, a fresh protected session bound to the registered subject and current source generation, declaration generation, and account context generation, the exact canonical AppOperationId classification, and either the classified Base-row invariants or fresh Effective App Access Snapshot coverage for the mapped AppAccess domain; only then may Runtime dispatch to the owner service, which independently applies its resource and business policy and returns an operation-specific typed result, while SDK, Kit, Host, Desktop, marketplace, and listing projections transport or display only and mint no App-held token or access state.
    condition: Whenever a protected App call is admitted or projected.
    failure: Deny the exact operation before dispatch when any required admission input is absent; admission success never implies owner success, and an owner rejection remains an owner-specific typed result; reject direct Realm or Runtime fallback, projection-owned admission, or an App-held credential.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
  - id: rule.nimi.platform.core-protocol.p-proto-021
    kind: rule
    title: P-PROTO-021 canonical thirty-five-operation mapping
    modality: must_not
    statement: An App, declaration, SDK, Host, manifest, catalog, endpoint string, free-form scope, or owner-local allowlist adds, aliases, reclassifies, or widens an AppOperationId or changes its one Base or AppAccess domain mapping outside the canonical thirty-five-row contract.
    condition: Whenever an App operation is declared, admitted, mapped, or described.
    failure: Reject the unknown, aliased, duplicated, or mismapped operation and use only the stable callable identity selected by the typed protected ingress and its canonical mapping.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
  - id: rule.nimi.platform.core-protocol.p-proto-030
    kind: rule
    title: P-PROTO-030 removed public app credentials
    modality: must_not
    statement: A public App permission, grant, request, approval, denial, revocation, settings row, preset, token issuance, credential grant, request-body consent, custom scope, resource selector, self-reported identity, external-principal session, parent token, or bearer admits an operation or mints a protected credential.
    condition: Whenever a protected app operation is evaluated.
    failure: Reject the operation, keep former permission and credential identities only as removed authority history and absent from active proto, generated, SDK, handler, and persistence surfaces, and return no reusable credential.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
  - id: rule.nimi.platform.core-protocol.p-proto-030b
    kind: rule
    title: P-PROTO-030 exact private operation evaluation
    modality: must
    statement: Runtime-private operation admission requires the verified exact Desktop-launched Host peer and process, an exact fresh protected session bound to the registered subject and current source generation, declaration generation, and account context generation, canonical classification of the stable callable operation, and the Base invariants when the row is Base or fresh Effective App Access Snapshot coverage for the mapped domain when the row is AppAccess; only after every admission input passes may Runtime dispatch to the owner service, which independently evaluates its resource and business policy and returns an owner-specific typed result.
    condition: Whenever Runtime evaluates a protected app operation.
    failure: Deny the exact operation before dispatch without issuing a credential when any required admission input or coverage is unavailable; do not report admission success as operation success when the owner rejects or cannot complete the request.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
  - id: rule.nimi.platform.core-protocol.p-proto-035
    kind: rule
    title: P-PROTO-035 public delegation removed
    modality: must_not
    statement: A parent token, scope subset, TTL, resource selector, canDelegate value, preset, chain record, or former delegation field admits a child credential or compatibility path.
    condition: Whenever protected credential delegation is requested or interpreted.
    failure: Reject delegation and retain former fields only as removal inventory.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
  - id: rule.nimi.platform.core-protocol.p-proto-041
    kind: rule
    title: P-PROTO-041 Effective App Access Snapshot lifecycle
    modality: must
    statement: Runtime creates a fresh Effective App Access Snapshot only after the exact Desktop-launched Host binds a protected session, includes only currently supported declared AppAccess domains for the exact source and declaration generations, and invalidates the session and snapshot on account or context change, source or declaration generation change, Runtime restart, or session end while allowing the same exact running Host to bind a new session; all ten Base rows remain outside the snapshot and are evaluated from their canonical operation classification and Base invariants on each call.
    condition: Whenever an App session or its declaration, account, Runtime, or Host context changes.
    failure: Deny further protected operations under the stale session or snapshot without deleting registration or rotating the registered subject; require Host restart or replacement only when a security-relevant exact Host executable, entrypoint, or launch input changes, the exact process identity or start marker no longer matches, the supervised process lifetime ends, or the process exits, and do not require it for ordinary source, asset, or HMR changes alone.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
  - id: rule.nimi.platform.core-protocol.p-proto-042
    kind: rule
    title: P-PROTO-042 owner execution and positive App projection
    modality: must
    statement: After exact Runtime admission, an internal owner executor may enforce its canonical resource and business rules and returns only the operation-specific typed positive projection; supported App API, SDK, Host, environment, argv, renderer, generic forwarding, and raw Realm response surfaces expose no Realm token, refresh token, Provider Credential, connector credential material, equivalent portable authority, raw owner response, or caller-selectable generic protected executor.
    condition: Whenever an admitted App operation executes or returns data to the App.
    failure: Deny or sanitize the exact result before the App boundary when owner execution fails, projection is absent, or forbidden authority material would cross the supported surface, without treating an optional scanner as the admission proof.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
  - id: rule.nimi.platform.core-protocol.p-proto-043
    kind: rule
    title: P-PROTO-043 protected-operation failure is bounded
    modality: must
    statement: Missing session, stale snapshot, missing domain coverage, unknown or unsupported operation, unavailable Runtime, or owner-domain rejection makes only the affected Nimi access or exact protected operation unavailable and does not by itself require Host termination or restart, registration deletion, registered-subject rotation, a durable security posture, a new authorization flow, or global Runtime unavailability.
    condition: Whenever App access admission or owner execution cannot complete.
    failure: Return the exact typed unavailable, unsupported, validation, conflict, or owner failure and never report protected success or use direct Realm, Runtime, generic-forwarding, or compatibility fallback.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
  - id: rule.nimi.platform.core-protocol.p-proto-044
    kind: rule
    title: P-PROTO-044 Realm App operations remain owner-mediated
    modality: must
    statement: realm.world-core.list and realm.world-core.create enter only through Runtime protected App ingress under realm.data coverage, derive the current account and App context from the protected session, invoke the typed Realm WorldCore owner adapter, preserve every Realm resource and business rule, and return only the operation-specific positive App projection rather than a Realm token, direct endpoint, generic request, or raw Realm response.
    condition: Whenever either admitted realm.data App operation is invoked.
    failure: Deny the exact operation on missing coverage, Runtime mediation, owner admission, business-rule rejection, or positive projection and expose no direct Realm fallback or credential.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
  - id: rule.nimi.platform.core-protocol.p-proto-045
    kind: rule
    title: P-PROTO-045 foreground text candidate App operation
    modality: must
    statement: runtime.ai.text-candidate.generate is one synchronous foreground runtime.consume operation that consumes the calling App owner's committed AIConfig without caller-selected route, provider, model, target, connector, credential, tool, media, stream, Job, background authority, or fallback and returns only the typed candidate result and trace correlation.
    condition: Whenever runtime.ai.text-candidate.generate is invoked.
    failure: Deny the exact operation on missing runtime.consume coverage, invalid bounded input, owner AIConfig composition failure, metering failure, missing or foreign current-account Connector, unusable credential, policy denial, or execution failure, returning the existing owner or configuration-required reason without requesting App-side Connector selection and never changing the committed route.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
  - id: rule.nimi.platform.core-protocol.p-proto-046
    kind: rule
    title: P-PROTO-046 Base App operations remain bounded
    modality: must
    statement: The three Base JSON operations and six Base asset operations address only the Runtime-derived current-account-plus-Registered-App-Subject private partition; JSON documents and binary assets occupy collision-proof namespaces with independent committed-usage quotas, asset stat, bounded list, streamed write, immutable-source ranged read, idempotent remove, and same-partition move expose no physical layout or authority selector, and owner-configured path, chunk, page, concurrency, object, partition, and minimum-free-space bounds must support ordinary assets larger than the 32-MiB inline artifact ceiling; runtime.ai.app-config.get returns the calling App owner's portable AIConfig intent and may additionally return a bounded read-only Model Config projection containing only each currently selected Local CapabilityContract's state, display name, supported features, and safe reason codes without configuration identity, implementation, binding, LocalAsset, path, or execution truth; no Base operation mutates AIConfig or exposes internal identity, account, session, snapshot, credential, owner inventory beyond that bounded current-selection projection, or generic Runtime access.
    condition: Whenever one of the ten Base App operations is invoked.
    failure: Deny the exact operation on missing session, owner, partition, path, quota, schema, or positive projection and never manufacture AppAccess coverage or accept an App-supplied Connector binding.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
  - id: rule.nimi.platform.core-protocol.p-proto-047
    kind: rule
    title: P-PROTO-047 scenario consumption App operation family
    modality: must
    statement: runtime.ai.text-turn.stream, runtime.ai.scenario.execute, runtime.ai.scenario-job.submit, runtime.ai.scenario-job.get, runtime.ai.scenario-job.subscribe, runtime.ai.scenario-job.cancel, runtime.ai.artifact.read, runtime.ai.artifact.upload, runtime.ai.artifact.adopt-to-app-storage, and runtime.ai.voice-assets.list are runtime.consume operations that consume the calling App owner's committed AIConfig without caller-selected route, provider, model, target, connector, credential, grant, tool, background authority, allowed-use selector, or fallback; Local App Job submit captures a Runtime-private immutable owner composed only of current AccountID plus Registered App Subject, and get, subscribe, cancel, artifact metadata, and bounded typed transcription text projection authorize that owner while AppID remains non-authorizing producer or catalog metadata; artifact read, adoption, and artifact-reference scenario input use one owner authorizer over the same tuple and exact Runtime-selected typed operation, historical subject-unbound Jobs and artifacts fail closed without AppID fallback, absent, foreign-owner, and subject-unbound artifact read or artifact-ref identifiers return one non-disclosing forbidden result, and adoption collapses missing, foreign, unbound, expired, and corrupt sources to one artifact-unavailable result without target mutation; runtime.ai.artifact.read returns at most 32 MiB of inline bytes, runtime.ai.artifact.upload preserves its bounded inline contract, scenario-specific inline audio bytes are admitted or rejected by their exact typed byte cap rather than a generic per-byte structural-node count, streamed custody, adoption, metadata, and Base asset streaming do not use that ceiling, and every response returns only the operation-specific typed projection with trace correlation.
    condition: Whenever one of the ten scenario-consumption App operations is invoked or a Local App Job or artifact consumer is authorized.
    failure: Deny the exact operation on missing runtime.consume coverage, invalid bounded input, unsupported artifact upload MIME, cross-owner or historical-unbound Job or artifact access, oversized inline artifact read or upload, owner AIConfig composition failure, or execution failure, return the admitted non-disclosing public result for artifact lookup or adoption, and never expose route, provider, model, account, subject, connector, credential, grant, or internal owner facts in any request or response field.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
  - id: rule.nimi.platform.core-protocol.p-proto-040
    kind: rule
    lifecycle: removed
    title: Retired P-PROTO-040 current permission decisions
    reason: Removed with the per-capability permission decision store and direct render-app or extension-app world access path; the replacement is the session snapshot and exact fourteen-operation Runtime ingress contract.
  - id: rule.nimi.platform.core-protocol.p-proto-040b
    kind: rule
    lifecycle: removed
    title: Retired P-PROTO-040 no pre-admission positive store
    reason: Removed with the per-capability permission decision store and direct render-app or extension-app world access path; the replacement is the session snapshot and exact fourteen-operation Runtime ingress contract.
  - id: rule.nimi.platform.core-protocol.p-proto-050
    kind: rule
    lifecycle: removed
    title: Retired P-PROTO-050 world-app write admission
    reason: Removed with the per-capability permission decision store and direct render-app or extension-app world access path; the replacement is the session snapshot and exact fourteen-operation Runtime ingress contract.
  - id: rule.nimi.platform.core-protocol.p-proto-050b
    kind: rule
    lifecycle: removed
    title: Retired P-PROTO-050 unique binding state machine
    reason: Removed with the per-capability permission decision store and direct render-app or extension-app world access path; the replacement is the session snapshot and exact fourteen-operation Runtime ingress contract.
  - id: rule.nimi.platform.core-protocol.p-proto-060
    kind: rule
    lifecycle: removed
    title: Retired P-PROTO-060 app mode boundary
    reason: Removed with the per-capability permission decision store and direct render-app or extension-app world access path; the replacement is the session snapshot and exact fourteen-operation Runtime ingress contract.
  - id: rule.nimi.platform.core-protocol.p-proto-070
    kind: rule
    title: P-PROTO-070 cross-primitive consistency
    modality: must
    statement: Transit satisfies Social, Economy, and Context constraints, Presence changes preserve Social admission, Timeflow preserves Economy settlement windows, and Context injection preserves Identity and LocalAgent core anchors.
    condition: Whenever multiple primitives participate in one operation.
    failure: Reject the operation when any cross-primitive constraint fails.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.realm-primitive-layer
  - id: rule.nimi.platform.core-protocol.p-proto-070b
    kind: rule
    title: P-PROTO-070 no silent primitive degradation
    modality: must_not
    statement: An unexecuted primitive is silently degraded to bypass an admission rule.
    condition: Whenever a required primitive cannot execute.
    failure: Fail closed and expose the unmet primitive admission requirement.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.realm-primitive-layer
  - id: rule.nimi.platform.core-protocol.p-proto-100
    kind: rule
    title: P-PROTO-100 Timeflow primitive
    modality: must
    statement: Timeflow uses its canonical primitive fields, keeps world time monotonic, triggers audit when drift exceeds budget, and makes replay reproducible.
    condition: Whenever Timeflow is executed.
    failure: Reject a non-monotonic or non-reproducible transition and emit the required drift audit.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.realm-primitive-layer
  - id: rule.nimi.platform.core-protocol.p-proto-101
    kind: rule
    title: P-PROTO-101 Social primitive
    modality: must
    statement: Social uses its canonical primitive fields and produces decidable admission, explainable rejection, and reproducible decay.
    condition: Whenever Social is executed.
    failure: Reject an indeterminate admission, unexplained rejection, or non-reproducible decay.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.realm-primitive-layer
  - id: rule.nimi.platform.core-protocol.p-proto-102
    kind: rule
    title: P-PROTO-102 Economy primitive
    modality: must
    statement: Economy uses its canonical primitive fields, conserves value transfer, and keeps settlement windows auditable.
    condition: Whenever Economy is executed.
    failure: Reject non-conserving value transfer or an unauditable settlement window.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.realm-primitive-layer
  - id: rule.nimi.platform.core-protocol.p-proto-103
    kind: rule
    title: P-PROTO-103 Transit primitive
    modality: must
    statement: Transit uses its canonical primitive fields, enforces dual-gate admission, makes state transitions traceable, and returns actionHint on rejection.
    condition: Whenever Transit is executed.
    failure: Reject admission without both gates or an untraceable transition and include actionHint on denial.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.realm-primitive-layer
  - id: rule.nimi.platform.core-protocol.p-proto-104
    kind: rule
    title: P-PROTO-104 Context primitive
    modality: must
    statement: Context uses its canonical primitive fields, makes trimming observable, keeps priority stable, and audits handoff.
    condition: Whenever Context is executed.
    failure: Reject hidden trimming, unstable priority, or unaudited handoff.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.realm-primitive-layer
  - id: rule.nimi.platform.core-protocol.p-proto-105
    kind: rule
    title: P-PROTO-105 Presence primitive
    modality: must
    statement: Presence uses its canonical primitive fields, keeps state recoverable, converges expired state automatically, and merges cross-device state deterministically.
    condition: Whenever Presence is executed.
    failure: Reject unrecoverable state or nondeterministic merge and converge expired state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.realm-primitive-layer
  - id: rule.nimi.platform.core-protocol.p-almi-001
    kind: rule
    title: P-ALMI-001 two-part AI last mile
    modality: must
    statement: The current AI last mile provides LocalAgent Conversation, Memory, Knowledge, and Local AI Runtime capability; any existing external action capability remains separately admitted and non-blocking.
    condition: Whenever the AI last mile is delivered.
    failure: Treat the core last mile as unavailable when required LocalAgent Conversation, Memory, Knowledge, or Local AI Runtime capability is absent; report an unavailable external action capability separately without blocking the core last mile.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.action-plane
  - id: rule.nimi.platform.core-protocol.p-almi-002
    kind: rule
    title: P-ALMI-002 Runtime action plane boundary
    modality: must
    statement: When separately admitted, external action execution uses Runtime-owned descriptors, permission checks, execution state, completion results, and audit while Desktop, Web, Kit, and Apps consume only typed SDK projections.
    condition: Whenever an external action capability is discovered, executed, completed, or audited.
    failure: Reject renderer-local, host-only, app-local, or Tauri-local action, token, success, handler-state, or audit authority.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.action-plane
  - id: rule.nimi.platform.core-protocol.p-almi-003
    kind: rule
    title: P-ALMI-003 least-privilege principals
    modality: must
    statement: Every execution principal receives least privilege constrained by applicable time, scenario, quota, device, and validity conditions, and every high-risk write has explicit consent and auditable attribution.
    condition: Whenever an AI execution principal is authorized.
    failure: Deny authorization when least privilege, required constraints, consent, or attribution is absent.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.execution-principal
  - id: rule.nimi.platform.core-protocol.p-almi-004
    kind: rule
    title: P-ALMI-004 external action caller admission
    modality: must
    statement: A third-party external action caller uses the separately admitted action plane, presents an explicitly issued time-limited credential with principalId, issuer, and signature, verifies Friendship in delegated mode, and uses an independent account in autonomous mode.
    condition: Whenever an external action caller invokes the optional action plane.
    failure: Reject the call when identity, credential, signature, mode, or Friendship requirements fail.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.execution-principal
  - id: rule.nimi.platform.core-protocol.p-almi-010
    kind: rule
    title: P-ALMI-010 action registration constraints
    modality: must
    statement: Every registered action provides the complete descriptor, sets supportsDryRun false for opaque mode, and excludes high risk from opaque mode.
    condition: Whenever an action is registered.
    failure: Reject an incomplete descriptor, dry-runnable opaque action, or high-risk opaque action.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.action-descriptor
  - id: rule.nimi.platform.core-protocol.p-almi-011a
    kind: rule
    title: P-ALMI-011 execution ordering and durability
    modality: must
    statement: Action execution follows discover, dry-run or admitted preflight, verify, commit, and audit order, gives writes an idempotencyKey, gives multi-action orchestration compensation, persists the execution ledger at commit, and reuses the same idempotencyKey on retry.
    condition: Whenever an action is executed or retried.
    failure: Fail closed before or at commit when ordering, idempotency, compensation, or persistence is absent or uncertain.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.action-execution
  - id: rule.nimi.platform.core-protocol.p-almi-011b
    kind: rule
    title: P-ALMI-011 failure transitions
    modality: must
    statement: Any failed stage enters audit with its reason, dry-run failure has no side effect, verify failure terminates execution, and commit failure invokes declared compensation.
    condition: Whenever an action execution stage fails.
    failure: Stop execution, prevent or compensate side effects as applicable, and persist the failure audit.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.action-execution
  - id: rule.nimi.platform.core-protocol.p-almi-011c
    kind: rule
    title: P-ALMI-011 execution-level guarantees
    modality: must
    statement: Full execution performs dry-run and post-commit verification, guarded execution performs preflight when substituting for dry-run and uses strong audit, and opaque execution persists audit and excludes high risk.
    condition: Whenever an action executes under an executionMode.
    failure: Reject execution that does not satisfy its mode guarantees.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.action-execution
  - id: rule.nimi.platform.core-protocol.p-almi-020
    kind: rule
    title: P-ALMI-020 explicit AI routing
    modality: must
    statement: One AIConfig explicitly commits exactly one Local or Cloud route intent per configured CapabilityContract, and Runtime deterministically dereferences that committed intent without search, ranking, probing, provider arbitration, or fallback while claiming local privacy semantics only for Local.
    condition: Whenever an AIConfig route is committed or a capability request is composed.
    failure: Reject an unknown, omitted, inferred, searched, or fallback route and withhold local privacy claims from Cloud.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-route
  - id: rule.nimi.platform.core-protocol.p-almi-030
    kind: rule
    title: P-ALMI-030 action-plane availability boundaries
    modality: must
    statement: The action plane separates control and data planes, locally caches policy and authorization decisions, writes audit asynchronously by default, and keeps p95 control-plane overhead at or below 20 milliseconds.
    condition: Whenever the action plane serves an action.
    failure: Treat the service-level boundary as violated and do not conceal the violation with success data.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.action-plane
  - id: rule.nimi.platform.core-protocol.p-almi-030b
    kind: rule
    title: P-ALMI-030 risk-sensitive policy failure
    modality: must
    statement: A policy failure may use controlled fail-open only for a read-only low-risk action and defaults to fail-closed for every high-risk write.
    condition: Whenever action policy evaluation fails.
    failure: Deny a high-risk write and reject any uncontrolled or ineligible fail-open.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.action-descriptor
  - id: rule.nimi.platform.core-protocol.p-aisc-001
    kind: rule
    title: P-AISC-001 AIConfig owner identity semantics
    modality: must
    statement: AIConfig owner identity resolves only to one admitted App or product owner or the single Runtime LocalAgent subsystem owner shared by every Runtime LocalAgent.
    condition: Whenever an AIConfig owner is created, resolved, or interpreted.
    failure: Reject an Agent, feature, module, route, chat mode, renderer, window, conversation, transient object, or caller-fabricated owner.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config-owner
  - id: rule.nimi.platform.core-protocol.p-aisc-002a
    kind: rule
    title: P-AISC-002 canonical owner-driven AIConfig lifecycle
    modality: must
    statement: Every AIConfig remains keyed by one canonical owner for its lifetime, App AIConfig follows the App or product lifecycle, and the shared Runtime LocalAgent AIConfig survives individual LocalAgent creation, selection, and deletion.
    condition: Whenever an AIConfig owner or AIConfig is created, retained, or destroyed.
    failure: Reject an ad hoc or duplicate owner, remove an orphaned App AIConfig, and reject per-Agent lifecycle coupling.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config-owner-lifecycle
  - id: rule.nimi.platform.core-protocol.p-aisc-002b
    kind: rule
    title: P-AISC-002 no fragmented AIConfig owners
    modality: must_not
    statement: An App, product, or Runtime LocalAgent subsystem creates extra AIConfig owners for a feature, module, Agent, tab, session, thread, document, selected record, modal, wizard step, route, window, conversation, renderer, or other subordinate or transient object.
    condition: Whenever an AIConfig owner boundary is declared or persisted.
    failure: Keep exactly one AIConfig for the canonical owner and represent subordinate selection in its owning domain state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config-owner
  - id: rule.nimi.platform.core-protocol.p-aisc-003
    kind: rule
    title: P-AISC-003 AIConfig has no inheritance or Local binding
    modality: must_not
    statement: An AIConfig inherits another AIConfig, retains an AIProfile as live configuration, or stores a Local Capability Configuration identity, local model, workflow, node environment, LocalAsset binding, machine selection, process state, residency, health, or exact local execution target.
    condition: Whenever an AIConfig is created, overwritten, edited, read, or composed for execution.
    failure: Reject the inheritance or duplicated Local truth and keep Local implementation and binding solely in Machine Local AI Configuration.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config
      - type: applies_to
        target: definition.nimi.platform.core-protocol.machine-local-ai-configuration
  - id: rule.nimi.platform.core-protocol.p-aisc-004
    kind: rule
    title: P-AISC-004 cross-surface AIConfig owner applicability
    modality: must
    statement: Canonical AIConfig owner identity applies consistently across Desktop, Web, SDK, and Runtime while each surface defines only its placement and interaction behavior.
    condition: Whenever AIConfig owner identity is consumed across surfaces.
    failure: Reject a consumer-local owner kind, alias, or identity extension.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config-owner
  - id: rule.nimi.platform.core-protocol.p-aisc-005
    kind: rule
    title: P-AISC-005 consumers preserve owner identity
    modality: must_not
    statement: Desktop storage, SDK typed config, Profile, Job, or Runtime evidence extends canonical AIConfig owner identity with consumer-local scope, Agent, feature, module, route, renderer, or selection fields.
    condition: Whenever an admitted consumer needs additional domain annotation.
    failure: Keep the canonical owner identity unchanged and place the annotation in its separate owner structure.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config-owner
  - id: rule.nimi.platform.core-protocol.p-aisc-006a
    kind: rule
    title: P-AISC-006 exact built-in chat AIConfig owners
    modality: must
    statement: Desktop Nimi Chat always uses the Desktop App AIConfig and Desktop Agent Chat always uses the one shared Runtime LocalAgent subsystem AIConfig, regardless of which LocalAgent is selected for conversation.
    condition: Whenever either built-in chat submits, initializes, stores, or edits AI capability intent.
    failure: Reject a merged chat owner, chat-specific AIConfig, per-Agent AIConfig, or Desktop-owned substitute for the shared LocalAgent owner.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.built-in-chat-ai-config-owners
  - id: rule.nimi.platform.core-protocol.p-aisc-006b
    kind: rule
    title: P-AISC-006 no built-in chat owner substitutes
    modality: must_not
    statement: First-run, Desktop, Agent Center, renderer state, selected Agent, chat mode, or conversation state creates or substitutes a distinct AIConfig owner for either built-in chat.
    condition: Whenever a built-in chat AIConfig owner is resolved.
    failure: Reject the substitute and require the exact canonical Desktop App or shared Runtime LocalAgent subsystem owner.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.built-in-chat-ai-config-owners
  - id: rule.nimi.platform.core-protocol.p-aisc-007a
    kind: rule
    title: P-AISC-007 explicit Nimi App AIConfig owner
    modality: must
    statement: Nimi App Open resolves the admitted App identity to its one canonical App AIConfig owner and never creates a launch-, surface-, feature-, or renderer-specific configuration owner; only an authorized Nimi-owned account-product configuration interaction may create or edit intent for that exact admitted App owner, while the protected App may read and consume the record but never mutate route, implementation, provider-model target, or Connector selection.
    condition: Whenever an admitted Nimi App is launched through Open flow or consumes AIConfig.
    failure: Reject an absent, inferred, unadmitted, transient, fragmented, or caller-fabricated App owner.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-ai-config-owner
  - id: rule.nimi.platform.core-protocol.p-aisc-007b
    kind: rule
    title: P-AISC-007 App AIConfig lifecycle
    modality: must
    statement: App AIConfig follows canonical App or product owner lifecycle and is invalidated or removed when that owner leaves the account library.
    condition: Whenever an admitted app is removed from the account library.
    failure: Remove or invalidate the app-scoped configuration and reject orphaned use.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-ai-config-owner
  - id: rule.nimi.platform.core-protocol.p-aisc-007c
    kind: rule
    title: P-AISC-007 no App owner fallback or chat reuse
    modality: must_not
    statement: App launch uses a generic, inferred, omitted, previous, active-selection, renderer-local, or consumer-default AIConfig owner, reuses a built-in chat owner, or fragments App AIConfig across features or surfaces.
    condition: Whenever an App AIConfig owner is resolved.
    failure: Fail closed and require the exact admitted App or product owner.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-ai-config-owner
  - id: rule.nimi.platform.core-protocol.p-capcat-001a
    kind: rule
    title: P-CAPCAT-001 canonical capability admission
    modality: must
    statement: Every emitted or accepted CanonicalCapabilityId appears as an active or deferred canonical catalog entry, and every new canonical identity receives a catalog row before consumer use.
    condition: Whenever an app, Kit module, Runtime surface, or other consumer emits or accepts a capability identity.
    failure: Reject an identity absent from the canonical catalog.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.capability-catalog
  - id: rule.nimi.platform.core-protocol.p-capcat-001b
    kind: rule
    title: P-CAPCAT-001 catalog row schema and boundaries
    modality: must
    statement: Each active catalog row provides capabilityId, section, editorKind, sourceRef, i18nKeys, and runtimeEvidenceClass, uses the closed section and editorKind sets, and does not admit provider, model, engine, routing, or binding preference.
    condition: Whenever an active capability row is admitted or read.
    failure: Reject an incomplete row, an unknown enum value, or authority outside the catalog boundary.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.capability-catalog
  - id: rule.nimi.platform.core-protocol.p-capcat-002a
    kind: rule
    title: P-CAPCAT-002 runtime source references
    modality: must
    statement: Every active capability row carries a structured primary sourceRef to provider-capabilities or local-adapter-routing and may carry only distinct-table additionalRuntimeTables entries that resolve under the same table-specific semantics.
    condition: Whenever an active capability row is admitted or resolved.
    failure: Reject an absent, unknown, duplicate-table, or unresolved runtime source anchor.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.capability-source-resolver
  - id: rule.nimi.platform.core-protocol.p-capcat-002b
    kind: rule
    title: P-CAPCAT-002 capability source consistency
    modality: must
    statement: Active primary and additional source anchors resolve, and the union of active and table-scoped deferred catalog tokens equals the capability-token union admitted by provider-capabilities and local-adapter-routing.
    condition: Whenever catalog and runtime capability consistency is evaluated.
    failure: Fail closed on any unresolved anchor, missing token, extra token, partial result, silent skip, or placeholder admission.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.capability-source-resolver
  - id: rule.nimi.platform.core-protocol.p-capcat-003a
    kind: rule
    title: P-CAPCAT-003 deferred entry completeness
    modality: must
    statement: Every runtime-admitted capability not active in the canonical identity set has a deferred entry with non-empty capability, reason, and source_rule referencing the platform rule that owns deferral.
    condition: Whenever a runtime capability token is not admitted as an active canonical row.
    failure: Reject an absent or incomplete deferred entry.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.deferred-capability
  - id: rule.nimi.platform.core-protocol.p-capcat-003b
    kind: rule
    title: P-CAPCAT-003 deferred tokens are not canonical identities
    modality: must_not
    statement: An app, Kit module, or Runtime consumer emits or accepts a deferred token as a CanonicalCapabilityId.
    condition: Whenever a deferred capability token reaches a canonical identity consumer.
    failure: Reject the token as not admitted to the canonical identity set.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.deferred-capability
  - id: definition.nimi.platform.core-protocol.protocol-error-code
    kind: definition
    title: protocol-error-codes protocol error code
    meaning: A protocol error code is a member of the closed platform protocol error vocabulary and has exactly one category and one owning platform source rule.
  - id: definition.nimi.platform.core-protocol.protocol-error-category
    kind: definition
    title: protocol-error-codes error category
    meaning: A protocol error category is exactly one of version, capability_profile, protocol_envelope, local_app, app_access, admission, state_machine, or consistency; permission, app_mode, and world_app_binding remain retired and have no active compatibility alias.
  - id: definition.nimi.platform.core-protocol.protocol-audit-event
    kind: definition
    title: audit-events protocol audit event
    meaning: A protocol audit event is a member of the closed platform audit-event vocabulary with one protocol, ai_last_mile, primitive, app_access, or app_resource group and the fields required by its base schema, group, and event type; audit records observe owner truth and never become App access state.
  - id: definition.nimi.platform.core-protocol.protocol-compatibility-matrix
    kind: definition
    title: compliance-test-matrix product compatibility boundary
    meaning: The protocol compatibility matrix is the product obligation set that keeps envelope, profile, exact App operation and snapshot admission, primitive, action-plane, and architecture semantics mutually compatible without defining test topology, runners, evidence accounting, or product runtime shape.
  - id: rule.nimi.platform.core-protocol.p-proto-error-001
    kind: rule
    title: protocol-error-codes P-PROTO closed error vocabulary
    modality: must
    statement: Every protocol failure uses exactly one code from the closed protocol-error-codes vocabulary, and every admitted code has exactly one category and one owning P-PROTO source rule.
    condition: Whenever a protocol failure is produced, transported, or interpreted.
    failure: Fail closed and reject an unknown, uncategorized, multiply categorized, or ownerless error code.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.protocol-error-category
      - type: applies_to
        target: definition.nimi.platform.core-protocol.protocol-error-code
  - id: rule.nimi.platform.core-protocol.p-proto-error-002
    kind: rule
    title: protocol-error-codes P-PROTO category semantics
    modality: must
    statement: Protocol error categories preserve the closed category meanings, and an error with a declared actionHint returns that canonical actionable hint without category substitution.
    condition: Whenever a protocol error is classified or exposed to a participant.
    failure: Reject an unknown category, category mismatch, missing declared actionHint, or substitute hint.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.protocol-error-category
  - id: rule.nimi.platform.core-protocol.p-proto-100-fields
    kind: rule
    title: protocol-primitives P-PROTO-100 Timeflow wire fields
    modality: must
    statement: A Timeflow primitive contract requires numeric ratio greater than zero and at most 1440, integer tickSeconds from 1 through 3600, integer driftBudgetSecondsPerHour from 0 through 120, catchUpPolicy PAUSE or FAST_FORWARD, and rewindAllowed fixed false in version 0.1.
    condition: Whenever a Timeflow primitive contract is admitted or interpreted.
    failure: Reject the contract when a required field is absent, mistyped, out of range, outside its enum, or not fixed as required.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.realm-primitive-layer
  - id: rule.nimi.platform.core-protocol.p-proto-101-fields
    kind: rule
    title: protocol-primitives P-PROTO-101 Social wire fields
    modality: must
    statement: A Social primitive contract requires relationshipTypes containing HUMAN_HUMAN, HUMAN_CHARACTER, and CHARACTER_CHARACTER, preconditionModel FRIENDSHIP_GATE or OPEN, reputationScale with integer min and max satisfying zero at most min less than max at most 10000, decayWindowHours at least one, and blockPolicy HARD_DENY or SOFT_DENY.
    condition: Whenever a Social primitive contract is admitted or interpreted.
    failure: Reject the contract when a required field, required relationship type, valid range, or admitted enum value is absent.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.realm-primitive-layer
  - id: rule.nimi.platform.core-protocol.p-proto-102-fields
    kind: rule
    title: protocol-primitives P-PROTO-102 Economy wire fields
    modality: must
    statement: An Economy primitive contract requires a Realm-globally-unique currencyNamespace formed as worldId.currencyName with a lower-case alphanumeric-or-hyphen currencyName of at most 32 characters, transferMode DIRECT or ESCROW, settlementWindowSeconds from 60 through 86400, conservationRequired fixed true in version 0.1, and inflationPolicy FIXED_CAP or PROGRAMMATIC.
    condition: Whenever an Economy primitive contract is admitted or interpreted.
    failure: Reject the contract when a required field, namespace constraint, range, fixed value, or admitted enum value is absent.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.realm-primitive-layer
  - id: rule.nimi.platform.core-protocol.p-proto-103-fields
    kind: rule
    title: protocol-primitives P-PROTO-103 Transit wire fields
    modality: must
    statement: A Transit primitive contract requires nonnegative integer ingressUserQuotaPerDay and ingressWorldQuotaPerDay, carryPolicy IDENTITY_ONLY, IDENTITY_AND_CHARACTER, or FULL, mappingPolicy STRICT_MAP or ADAPTIVE_MAP, and transitStateModel fixed ACTIVE_COMPLETED_ONLY in version 0.1.
    condition: Whenever a Transit primitive contract is admitted or interpreted.
    failure: Reject the contract when a required field, nonnegative quota, admitted enum value, or fixed state model is absent.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.realm-primitive-layer
  - id: rule.nimi.platform.core-protocol.p-proto-104-fields
    kind: rule
    title: protocol-primitives P-PROTO-104 Context wire fields
    modality: must
    statement: A Context primitive contract requires contextScope SESSION, WORLD, or DEVICE, retentionTtlSeconds at least 60, ordered injectionPriority values drawn only from identity, character, world_rules, conversation, memory_recall, and tool_context with lower indexes injected first, truncationPolicy SUMMARY_FIRST or RECENCY_FIRST, and handoffPolicy EXPLICIT_ONLY or ASSISTED.
    condition: Whenever a Context primitive contract is admitted or interpreted.
    failure: Reject the contract when a required field, range, priority member or order, or admitted enum value is invalid.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.realm-primitive-layer
  - id: rule.nimi.platform.core-protocol.p-proto-105-fields
    kind: rule
    title: protocol-primitives P-PROTO-105 Presence wire fields
    modality: must
    statement: A Presence primitive contract requires presenceStates containing ACTIVE, IDLE, AWAY, and OFFLINE, heartbeatSeconds from 5 through 120, ttlSeconds at least twice heartbeatSeconds, staleTransition fixed FORCE_OFFLINE in version 0.1, and deviceMergePolicy LATEST_WINS or PRIORITY_ORDER.
    condition: Whenever a Presence primitive contract is admitted or interpreted.
    failure: Reject the contract when a required field, required state, range relation, fixed transition, or admitted merge policy is absent.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.realm-primitive-layer
  - id: rule.nimi.platform.core-protocol.p-proto-002-profiles
    kind: rule
    title: participant-profiles P-PROTO-002 closed profile definitions
    modality: must
    statement: The closed fixed-participant profile set contains realm at realm.core-profile.v1.0.0 as a reference to Realm-owned provider capability for all six primitives and runtime_local at runtime.access-profile.v1.0.0 as provider of protected App access, while SDK remains a bridge without a participant profile.
    condition: Whenever a fixed participant profile is published, resolved, or negotiated.
    failure: Reject an unknown profile, mismatched reference, incomplete declared capability set, SDK profile, or platform claim of Realm semantic ownership.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.participant-profile
  - id: rule.nimi.platform.core-protocol.p-almi-003-participant-types
    kind: rule
    title: participant-profiles P-ALMI-003 participant projections do not create product ontology
    modality: must
    statement: A protocol participant projection may represent a human, a Runtime LocalAgent, an external participant, an App, a device, or a service only as context for an already admitted execution principal, and participant labels never transfer LocalAgent ownership or create a new authorization principal.
    condition: Whenever a participant is declared or mapped to an execution principal.
    failure: Reject a projection that creates an unauthorized principal or ownership inferred from a participant label.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.execution-principal
      - type: applies_to
        target: definition.nimi.platform.core-protocol.participant-profile
  - id: rule.nimi.platform.core-protocol.p-proto-audit-001
    kind: rule
    title: audit-events P-PROTO closed event and group boundary
    modality: must
    statement: Every platform protocol audit record uses exactly one event type from the closed audit-events vocabulary and exactly one admitted event group, and each event type retains its owning source rule.
    condition: Whenever a platform protocol audit record is emitted or interpreted.
    failure: Reject an unknown event type, unknown group, group mismatch, or ownerless event.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.protocol-audit-event
  - id: rule.nimi.platform.core-protocol.p-proto-audit-002
    kind: rule
    title: audit-events P-PROTO required field schema
    modality: must
    statement: Every protocol audit event carries participantId, traceId, timestamp, domain, reasonCode, and protocolVersion and also carries every context field required by its group and every field required by its event type.
    condition: Whenever a platform protocol audit event is emitted or accepted.
    failure: Reject or mark failed any audit event missing a required base, group-context, or event-specific field without fabricating a value.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.protocol-audit-event
  - id: rule.nimi.platform.core-protocol.p-proto-error-map-001
    kind: rule
    title: error-code-mapping P-PROTO cross-layer semantic consistency
    modality: must
    statement: A mapped platform error and Runtime reason code preserve the same failure semantics and canonical token across Runtime, typed SDK projections, and Desktop consumers without broadening, substitution, or renumbering.
    condition: Whenever a mapped protocol error is produced, projected, or consumed across layers.
    failure: Fail closed on a missing mapping, semantic mismatch, token mismatch, numeric mismatch, or consumer-local substitute.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.protocol-error-code
  - id: rule.nimi.platform.core-protocol.p-proto-error-map-002
    kind: rule
    title: error-code-mapping P-PROTO mapping category closure
    modality: must
    statement: Every protocol error mapping has exactly one category from mapped, realm_only, or unmapped_v1, mapped entries resolve an exact Runtime reason code, realm_only entries remain protocol or Realm concerns without a Runtime substitute, and unmapped_v1 entries remain explicitly deferred without generic fallback.
    condition: Whenever protocol-to-Runtime error correspondence is declared or resolved.
    failure: Reject an unknown or inconsistent category, unresolved mapped entry, Runtime substitute for realm_only, or fallback for unmapped_v1.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.protocol-error-code
  - id: rule.nimi.platform.core-protocol.p-ctm-l0
    kind: rule
    title: compliance-test-matrix L0 P-PROTO-001 P-PROTO-010 P-PROTO-011 compatibility
    modality: must
    statement: L0 compatibility preserves strict version negotiation, mutually compatible request and response envelope handling, exact gRPC metadata mapping, required participantId, valid domain-field combinations, explainable canonical error codes, and complete required audit fields across protocol participants.
    condition: Whenever an L0 protocol producer, transport, or consumer changes.
    failure: Reject the change when any L0 producer and consumer disagree on an admitted value, field, mapping, rejection, error meaning, or audit requirement.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.l0-envelope
      - type: applies_to
        target: definition.nimi.platform.core-protocol.protocol-compatibility-matrix
  - id: rule.nimi.platform.core-protocol.p-ctm-l1
    kind: rule
    title: compliance-test-matrix L1 participant and App access compatibility
    modality: must
    statement: L1 compatibility preserves Realm and Runtime profile correspondence, all six Realm profile references, rejection of non-Realm primitive providers, and agreement on the canonical App operation contract, declaration-domain coverage, fresh Effective App Access Snapshot, owner boundaries, and absence of an App-held token.
    condition: Whenever participant-profile or protected App access semantics change.
    failure: Reject the change when profiles, provider sovereignty, exact operation mapping, snapshot semantics, or Runtime and owner admission become inconsistent across participants.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.platform.core-protocol.participant-profile
      - type: applies_to
        target: definition.nimi.platform.core-protocol.protocol-compatibility-matrix
  - id: rule.nimi.platform.core-protocol.p-ctm-l1-app-auth
    kind: rule
    title: compliance-test-matrix L1 App access compatibility
    modality: must
    statement: Local App access compatibility preserves Desktop-verified exact Host launch, a fresh process-bound session and snapshot derived without caller-supplied protected context, exactly ten Base rows plus twenty-five AppAccess rows across four declared domains, and typed SDK and Host projections without credential, generic Runtime forwarder, permission, grant, or project-consent surfaces.
    condition: Whenever the local App session, operation contract, or consumer projection changes.
    failure: Reject the change when session opening gains caller-supplied access truth, the thirty-five-row mapping diverges, or a consumer gains credential, owner, generic-forwarding, or durable access state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.platform.core-protocol.protocol-compatibility-matrix
  - id: rule.nimi.platform.core-protocol.p-ctm-l1-world-app
    kind: rule
    lifecycle: removed
    title: Retired compliance-test-matrix L1_world_app P-PROTO-050 P-PROTO-060 compatibility
    reason: Removed with the per-capability permission decision store and direct render-app or extension-app world access path; the replacement is the session snapshot and exact fourteen-operation Runtime ingress contract.
  - id: rule.nimi.platform.core-protocol.p-ctm-l2
    kind: rule
    title: compliance-test-matrix L2 P-PROTO-070 P-PROTO-100 through P-PROTO-105 compatibility
    modality: must
    statement: L2 compatibility preserves admitted and rejected Timeflow, Social, Economy, Transit, Context, and Presence semantics, deterministic replay where the primitive contract requires it, and fail-closed cross-primitive consistency across Realm producers and protocol consumers.
    condition: Whenever a six-primitive contract, producer, transport, or consumer changes.
    failure: Reject the change when primitive acceptance, rejection, replay, or cross-primitive consistency differs from the canonical contract.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.protocol-compatibility-matrix
      - type: applies_to
        target: definition.nimi.platform.core-protocol.realm-primitive-layer
  - id: rule.nimi.platform.core-protocol.p-ctm-l3-almi
    kind: rule
    title: compliance-test-matrix L3_almi P-ALMI-002 P-ALMI-003 P-ALMI-004 P-ALMI-010 P-ALMI-011 P-ALMI-020 P-ALMI-030 compatibility
    modality: must
    statement: Action-plane compatibility preserves Runtime-owned action registration and dispatch, least-privilege principals, external action caller credential lifecycle, descriptor-registry consistency, execution state transitions, admitted latency and availability boundaries, and explicit local-or-cloud AI routing across typed consumers.
    condition: Whenever the action plane or a typed action-plane consumer changes.
    failure: Reject the change when ownership, privilege, credential lifecycle, descriptors, execution transitions, service boundaries, or route meaning diverges across layers.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.action-plane
      - type: applies_to
        target: definition.nimi.platform.core-protocol.protocol-compatibility-matrix
  - id: rule.nimi.platform.core-protocol.p-ctm-l3-arch
    kind: rule
    title: compliance-test-matrix L3_arch P-ARCH-001 P-ARCH-011 P-ARCH-020 P-ARCH-030 compatibility
    modality: must
    statement: Architecture compatibility preserves canonical layer ownership, SDK bridge isolation, separation of credential control and data planes, and the protocol and execution audit layers without moving authority into an app or projection.
    condition: Whenever a protocol layer boundary, SDK bridge, credential plane, or audit projection changes.
    failure: Reject the change when layers collapse, SDK becomes protocol authority, credential planes merge, or an audit projection becomes product truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.action-plane
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.protocol-audit-event
      - type: applies_to
        target: definition.nimi.platform.core-protocol.protocol-compatibility-matrix
  - id: definition.nimi.platform.core-protocol.factory-ai-profile-catalog
    kind: definition
    title: Factory AIProfile catalog
    meaning: The Platform-owned factory AIProfile catalog is a closed set of portable templates that may be browsed, imported, or recommended without becoming live AIConfig, Machine Local AI Configuration, machine selection, installation, binding, or execution authority.
  - id: definition.nimi.platform.core-protocol.factory-ai-profile-row
    kind: definition
    title: Factory AIProfile row
    meaning: A factory AIProfile row carries portable AIConfig intent, portable Local Capability Configuration intent, non-binding Local or Cloud recommendations, contract-scoped standardized features, defaults, provenance, and license, and uses its alias only as readable catalog identity.
  - id: definition.nimi.platform.core-protocol.factory-profile-cloud-first
    kind: definition
    title: cloud-first factory AIProfile row
    meaning: The cloud-first row portably recommends Cloud AIConfig intent for text.generate with required input.image plus text.embed, audio.synthesize, audio.transcribe, and image.generate, may recommend Cloud implementations and Driver-owned provider-model targets, carries no Connector or account identity, and performs no Local installation or selection.
  - id: definition.nimi.platform.core-protocol.factory-profile-local-standard
    kind: definition
    title: local-standard factory AIProfile row
    meaning: The local-standard row portably recommends Local AIConfig intent for text.generate and text.embed and may carry corresponding local implementation configuration intent, but importing or applying it does not install, bind, add, update, or select a Local Capability Configuration.
  - id: definition.nimi.platform.core-protocol.factory-profile-local-speech-ready
    kind: definition
    lifecycle: removed
    title: Retired local-speech-ready factory AIProfile row
    reason: Removed because a portable Profile alias must not encode product readiness and local-speech is its hard-cut successor.
  - id: definition.nimi.platform.core-protocol.factory-profile-local-speech
    kind: definition
    title: local-speech factory AIProfile row
    meaning: The local-speech row portably recommends Local AIConfig intent for text.generate, audio.transcribe, and audio.synthesize and may carry corresponding local implementation configuration intent, but it performs no installation, binding, machine selection, admission, probe, or readiness action.
    relations:
      - type: supersedes
        target: definition.nimi.platform.core-protocol.factory-profile-local-speech-ready
  - id: definition.nimi.platform.core-protocol.factory-profile-local-gpu
    kind: definition
    title: local-gpu factory AIProfile row
    meaning: The local-gpu row portably recommends Local AIConfig intent for text.generate with required input.image plus audio.transcribe, audio.synthesize, and image.generate and may carry local implementation configuration intent with independent main and companion requirements, but it performs no host probe, installation, binding, or machine selection.
  - id: definition.nimi.platform.core-protocol.factory-profile-hybrid-recommended
    kind: definition
    title: hybrid-recommended factory AIProfile row
    meaning: The hybrid-recommended row contains explicit per-CapabilityContract Local or Cloud recommendations for text.generate with required input.image, text.embed, audio.transcribe, audio.synthesize, image.generate, and video.generate, and it never authorizes runtime hybrid fallback or a cross-owner Apply transaction.
  - id: definition.nimi.platform.core-protocol.ai-profile-selection
    kind: definition
    title: AIProfile recommendation result
    meaning: An AIProfile recommendation result is a typed factory AIProfile reference and reason produced from explicit user posture and bounded catalog or host facts without becoming AIConfig route choice, Local Capability Configuration, machine selection, binding, installation, admission, or execution truth.
  - id: definition.nimi.platform.core-protocol.ai-profile-apply-state
    kind: definition
    lifecycle: removed
    title: Retired AIProfile apply state
    reason: Removed because Apply Profile to AIConfig is one atomic create-or-overwrite action and does not own materialization, installation, readiness, activation, recovery, revision, or re-apply lifecycle.
  - id: definition.nimi.platform.core-protocol.first-party-ai-profile-hint
    kind: definition
    title: First-party AIProfile hint
    meaning: A first-party AIProfile hint is a typed reference from an admitted app registry row or manifest to an admitted factory profile and recommends an experience without granting identity, data, consumption, memory, cognition, or permission authority.
  - id: definition.nimi.platform.core-protocol.account-default-profile
    kind: definition
    title: Account Default Profile
    meaning: The Account Default Profile is an optional durable account-owned library association to portable AIProfile content stored under the selected data root; its portable content contains no account or machine private identity, it changes only through an explicit profile operation, remains outside Product Control readiness, and is never sourced from Realm identity material or ambient projection.
  - id: definition.nimi.platform.core-protocol.capability-governance
    kind: definition
    title: Canonical capability governance metadata
    meaning: Canonical capability governance metadata maps each CapabilityContract, including the single text.generate contract whose input.image, input.audio, and input.video features are contract-scoped rather than subtype capabilities, to non-empty owner, dataMovement, retention, revocation, and auditSource facts without moving AIConfig route, machine selection, implementation, permission, or job authority into the catalog.
  - id: rule.nimi.platform.core-protocol.p-aips-001a
    kind: rule
    title: P-AIPS-001 canonical capability configuration owners
    modality: must
    statement: Each canonical AIConfig owner owns only its per-contract route, required standardized features, defaults, and Cloud intent; Machine Local AI Configuration owns saved Local Capability Configurations and machine selection; each Job owns only its immutable execution inputs and outcome; ExecutionHost owns only private process and transport state; and SDK owns typed projection.
    condition: Whenever AI capability configuration, selection, admission, execution, or projection is defined.
    failure: Reject a duplicated fact or any move of canonical ownership across these boundaries.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config
      - type: applies_to
        target: definition.nimi.platform.core-protocol.capability-job-effective-inputs
      - type: applies_to
        target: definition.nimi.platform.core-protocol.execution-host
      - type: applies_to
        target: definition.nimi.platform.core-protocol.machine-local-ai-configuration
  - id: rule.nimi.platform.core-protocol.p-aips-001b
    kind: rule
    title: P-AIPS-001 no parallel capability configuration truth
    modality: must_not
    statement: A catalog, inventory, selected-source record, process registry, Agent Center, App-local settings object, profile binding, readiness record, route resolver, or renamed helper persists AIConfig route intent, Local Capability Configuration, machine selection, Cloud grant binding, or job effective inputs outside its canonical owner.
    condition: Whenever capability configuration or execution state is defined or persisted.
    failure: Reject the parallel truth and retain the fact only with its canonical owner.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config
      - type: applies_to
        target: definition.nimi.platform.core-protocol.capability-job-effective-inputs
      - type: applies_to
        target: definition.nimi.platform.core-protocol.factory-ai-profile-catalog
      - type: applies_to
        target: definition.nimi.platform.core-protocol.machine-local-ai-configuration
  - id: rule.nimi.platform.core-protocol.p-aips-001c
    kind: rule
    title: P-AIPS-001 portable catalog boundary
    modality: must
    statement: Factory rows contain only portable AIProfile intent and non-binding recommendation semantics and exclude Local Capability Configuration identity, machine selection, LocalAsset id or path, connector or account identity, secret, process identity, installation, health, and other host state.
    condition: Whenever a factory row is admitted, imported, recommended, or consumed.
    failure: Reject the non-portable field or any direct mutation of AIConfig or Machine Local AI Configuration by catalog consumption.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-profile
      - type: applies_to
        target: definition.nimi.platform.core-protocol.factory-ai-profile-row
  - id: rule.nimi.platform.core-protocol.p-aips-002a
    kind: rule
    title: P-AIPS-002 factory row portable content boundary
    modality: must
    statement: Every factory row declares typed portable AIConfig intent and any portable Local Capability Configuration intent using CapabilityContracts, contract-scoped required or supported features, defaults, implementation or target recommendations, provenance, and license, while any recommendation posture remains non-binding.
    condition: Whenever a factory row is admitted or interpreted.
    failure: Reject an unknown contract or feature, an untyped intent, or a recommendation represented as committed route, binding, selection, installation, or readiness.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.factory-ai-profile-row
      - type: applies_to
        target: definition.nimi.platform.core-protocol.standardized-capability-feature
  - id: rule.nimi.platform.core-protocol.p-aips-002b
    kind: rule
    title: P-AIPS-002 matrix and field separation
    modality: must
    statement: A readable alias neither owns schema nor binds a Connector, LocalAsset, machine identity, machine selection, account, process, provider credential, or exact local target, and portable AIConfig intent remains distinct from portable local implementation configuration intent.
    condition: Whenever a factory row is represented, imported, recommended, or applied.
    failure: Reject schema authority in an alias, a machine or account binding, or conflation of the two intent families.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.factory-ai-profile-row
  - id: rule.nimi.platform.core-protocol.p-aips-002c
    kind: rule
    title: P-AIPS-002 closed factory profile rows
    modality: must
    statement: The closed factory catalog contains exactly cloud-first, local-standard, local-speech, local-gpu, and hybrid-recommended with only the portable AIConfig intent, portable Local Capability Configuration intent, non-binding recommendations, standardized features, defaults, provenance, and license defined by their canonical rows.
    condition: Whenever the factory catalog is published, selected, or validated.
    failure: Reject a missing, additional, renamed, or semantically changed row without explicit Platform authority revision.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.factory-ai-profile-catalog
      - type: applies_to
        target: definition.nimi.platform.core-protocol.factory-profile-cloud-first
      - type: applies_to
        target: definition.nimi.platform.core-protocol.factory-profile-hybrid-recommended
      - type: applies_to
        target: definition.nimi.platform.core-protocol.factory-profile-local-gpu
      - type: applies_to
        target: definition.nimi.platform.core-protocol.factory-profile-local-speech
      - type: applies_to
        target: definition.nimi.platform.core-protocol.factory-profile-local-standard
  - id: rule.nimi.platform.core-protocol.p-aips-003a
    kind: rule
    title: P-AIPS-003 four product actions remain disjoint
    modality: must
    statement: Import Profile saves only portable AIProfile; Apply Profile to AIConfig atomically creates or overwrites only the target owner AIConfig without merge or live Profile linkage; Add or Update Local Capability Configuration writes only the machine aggregate; and Select Local Capability Configuration writes only the machine selection relation.
    condition: Whenever any Profile or capability configuration product action is invoked.
    failure: Reject a cross-owner transaction, merged write, implicit re-apply, installation, binding, selection, or fabricated aggregate success.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-profile
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-profile-actions
      - type: applies_to
        target: definition.nimi.platform.core-protocol.machine-local-ai-configuration
  - id: rule.nimi.platform.core-protocol.p-aips-003b
    kind: rule
    title: P-AIPS-003 Apply writes portable AIConfig intent without readiness
    modality: must
    statement: Apply Profile to AIConfig validates portable schema and owner eligibility, then atomically creates or overwrites route intent, required features, defaults, and Cloud implementation or target recommendation even when a Local configuration, LocalAsset, Connector, Driver, process, or provider connection is absent.
    condition: Whenever Apply Profile to AIConfig validates or commits.
    failure: Reject invalid portable intent or an ineligible owner, but never require inventory resolution, installation, binding, selection, probe, warm, process start, or execution readiness to commit valid intent.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-profile-actions
  - id: rule.nimi.platform.core-protocol.p-aips-003c
    kind: rule
    title: P-AIPS-003 independent Local configuration mutation
    modality: must
    statement: Add or Update Local Capability Configuration directly commits the current machine-local record, reprojects requirements whenever its CapabilityImplementation, Driver dialect, or Driver-owned portable configuration changes, and never mutates the source AIProfile, any AIConfig, or machine selection unless Select Local Capability Configuration is separately invoked; Runtime may reuse one existing record only for exact portable-content equivalence, while changed content associated with the same source or provenance requires the user to choose Update existing or Add new and never silently overwrites by provenance, label, path, or similarity.
    condition: Whenever a Local Capability Configuration is added or updated.
    failure: Reject a Profile back-write, AIConfig local binding, implicit selection, inherited old binding, provenance-derived identity, silent source-based overwrite, or cross-owner aggregate success.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-profile-actions
      - type: applies_to
        target: definition.nimi.platform.core-protocol.local-capability-configuration
  - id: rule.nimi.platform.core-protocol.p-aips-004a
    kind: rule
    title: P-AIPS-004 recommendations are bounded and non-binding
    modality: must
    statement: A factory Profile recommendation consumes only explicit user posture and bounded catalog or host facts, returns a typed recommendation and reason, and never reads chat selection, active App state, inventory order, current machine selection, process health, or other ambient state as authority.
    condition: Whenever a Profile recommendation is evaluated.
    failure: Reject an unresolved reference, implicit posture input, ambient selection, or recommendation presented as committed configuration.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-profile-selection
  - id: rule.nimi.platform.core-protocol.p-aips-004b
    kind: rule
    title: P-AIPS-004 recommendation has no write authority
    modality: must
    statement: A recommendation returns only a typed Profile reference and typed reason and changes no AIProfile, AIConfig, Local Capability Configuration, machine selection, Connector, installation, or job.
    condition: Whenever recommendation output is returned or displayed.
    failure: Reject a recommendation that commits state, implies readiness, or bypasses one of the four formal product actions.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-profile-selection
  - id: rule.nimi.platform.core-protocol.p-aips-005a
    kind: rule
    title: P-AIPS-005 canonical capability binding
    modality: must
    statement: Every factory capability set contains only admitted CapabilityContract identities, every feature uses a contract-scoped standardized-feature identity, and an unadmitted or deferred contract or feature is excluded rather than accompanied by a fallback declaration.
    condition: Whenever a factory row declares a capability.
    failure: Reject an unknown contract, a cross-contract short-name interpretation, a subtype capability standing in for a feature, or a fallback declaration.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.capability-catalog
      - type: applies_to
        target: definition.nimi.platform.core-protocol.deferred-capability
      - type: applies_to
        target: definition.nimi.platform.core-protocol.factory-ai-profile-row
      - type: applies_to
        target: definition.nimi.platform.core-protocol.standardized-capability-feature
  - id: rule.nimi.platform.core-protocol.p-aips-005b
    kind: rule
    title: P-AIPS-005 no hidden vendor default
    modality: must_not
    statement: An alias, catalog row, UI, SDK, App, first-party hint, or policy text silently hardcodes a provider, Connector, engine, model, or Local Capability Configuration as committed default-experience truth rather than expressing a visible portable recommendation.
    condition: Whenever a factory experience is declared, projected, or consumed.
    failure: Reject the hidden default and require an explicit portable recommendation followed by the applicable formal user action.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.factory-ai-profile-catalog
  - id: rule.nimi.platform.core-protocol.p-aips-006a
    kind: rule
    title: P-AIPS-006 Profile route intent is explicit and non-fallback
    modality: must
    statement: Portable Profile intent may recommend Local or Cloud independently per CapabilityContract, but applying that intent commits one explicit AIConfig route and never establishes a local-preferred, cloud-first, hybrid, or readiness-dependent fallback policy.
    condition: Whenever Profile route intent is interpreted or applied.
    failure: Reject an implicit route, priority list, hybrid execution, or any Local-to-Cloud, Cloud-to-Local, or provider fallback.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-profile
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-route
  - id: rule.nimi.platform.core-protocol.p-aips-006b
    kind: rule
    title: P-AIPS-006 route selection and machine selection are disjoint
    modality: must
    statement: AIConfig route selection changes only one owner AIConfig, while Machine Local AI Configuration selection is the separate Select Local Capability Configuration action that changes only the selected Local Capability Configuration relation dereferenced by every future Local request and changes no AIConfig, Cloud route, or running Job; Runtime composes these committed facts and never performs another model or configuration selection.
    condition: Whenever either selection is committed, described, or projected.
    failure: Reject a mixed write, Runtime re-selection, implicit fallback, App veto over Machine Local AI Configuration selection, or application of that selection to a Cloud route.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-route
      - type: applies_to
        target: definition.nimi.platform.core-protocol.machine-local-ai-configuration
  - id: rule.nimi.platform.core-protocol.p-aips-007a
    kind: rule
    title: P-AIPS-007 materialization stays outside Profile Apply
    modality: must
    statement: LocalAsset transfer, dependency materialization, repair, process supervision, and execution jobs retain their own typed operation state and never become AIProfile state, Apply state, AIConfig state, machine selection state, or a single capability readiness lifecycle.
    condition: Whenever materialization, repair, activation, or execution state is projected near Profile or configuration UI.
    failure: Keep the operation state with its owner and reject a derived Profile active, ready, materializing, or failed lifecycle.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-profile-actions
      - type: applies_to
        target: definition.nimi.platform.core-protocol.derived-capability-admission
  - id: rule.nimi.platform.core-protocol.p-aips-007b
    kind: rule
    title: P-AIPS-007 no product readiness or feasibility probe
    modality: must_not
    statement: AIProfile, AIConfig, Local Capability Configuration, machine selection, or CapabilityImplementation publishes or persists a ready, warm, resident, active, healthy, probe-success, feasibility, or preflight truth derived from file existence, endpoint reachability, inventory, transfer, package presence, process liveness, warmup, prior health, or provider connection testing.
    condition: Whenever product capability configuration or selection state is determined or exposed.
    failure: Reject the readiness or probe truth; retain only orthogonal interpretability, requirement resolution, selection, derived admission, job execution, and Runtime-private supervision facts.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.derived-capability-admission
      - type: applies_to
        target: definition.nimi.platform.core-protocol.local-capability-configuration
  - id: rule.nimi.platform.core-protocol.p-aips-008
    kind: rule
    title: P-AIPS-008 no provider or model constants
    modality: must_not
    statement: Factory-policy text, catalog data, Home or first-run code, SDK profile or config surfaces, first-party bindings, documentation constants, UI strings, generated snapshots, placeholders, fallbacks, or bootstrap seeds embed a provider, connector, engine, or model constant as default-experience truth or provide a compatibility alias for one.
    condition: Whenever a factory profile producer or consumer supplies default-experience data.
    failure: Reject the constant, alias, or indirect hard-coded default without fallback.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.factory-ai-profile-catalog
  - id: rule.nimi.platform.core-protocol.p-aips-009a
    kind: rule
    title: P-AIPS-009 typed first-party hint
    modality: must
    statement: An admitted first-party App may declare a typed non-binding factory AIProfile recommendation and, only when explicitly requested by the user, apply its portable AIConfig intent atomically to that App's canonical AIConfig owner.
    condition: Whenever a first-party app declares or applies a default-experience hint.
    failure: Reject an untyped, unresolved, implicit, non-atomic, machine-selecting, installing, binding, or readiness-gated hint application.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-ai-config-owner
      - type: applies_to
        target: definition.nimi.platform.core-protocol.first-party-ai-profile-hint
  - id: rule.nimi.platform.core-protocol.p-aips-009b
    kind: rule
    title: P-AIPS-009 hint has no authority or parallel truth
    modality: must_not
    statement: A first-party hint creates account, data, Agent, AI consumption, Memory, Cognition, permission, Local Capability Configuration, machine selection, Connector, installation, or execution authority, or maintains a parallel default track or second AIConfig truth for the same owner.
    condition: Whenever a first-party hint is declared or consumed.
    failure: Deny the unauthorized effect or bypass and remove the parallel truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config
      - type: applies_to
        target: definition.nimi.platform.core-protocol.first-party-ai-profile-hint
  - id: rule.nimi.platform.core-protocol.p-aips-010a
    kind: rule
    title: P-AIPS-010 formal action scope closure
    modality: must
    statement: Import Profile, Apply Profile to AIConfig, Add or Update Local Capability Configuration, and Select Local Capability Configuration each return only the typed success or failure of their own atomic write and establish no product revision, history, draft, re-apply, materialization, activation, readiness, or cross-action lifecycle.
    condition: Whenever a formal Profile or configuration action is executed or projected.
    failure: Reject an undeclared action, cross-owner success, lifecycle state machine, or success inferred from a later action.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-profile-actions
  - id: rule.nimi.platform.core-protocol.p-aips-010b
    kind: rule
    title: P-AIPS-010 action failure is owner-local
    modality: must
    statement: A failed formal action leaves every other canonical owner unchanged, never reports aggregate success, and never selects another Local configuration, route, Connector, provider, implementation, or fallback; valid AIConfig intent and unresolved Local configuration records remain persistable independently.
    condition: Whenever one formal action fails.
    failure: Preserve all unaffected owners and return the exact typed action failure without fallback or fabricated rollback success.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-profile-actions
      - type: applies_to
        target: definition.nimi.platform.core-protocol.local-capability-configuration
  - id: rule.nimi.platform.core-protocol.p-aips-011
    kind: rule
    title: P-AIPS-011 Cloud Profile intent carries no account binding
    modality: must
    statement: A Profile's Cloud intent may recommend a CapabilityImplementation and Driver-owned provider-model target but carries no connectorId, account identity, secret, credential, connection-test result, or local-environment request.
    condition: Whenever Cloud Profile intent is authored, imported, exported, recommended, or applied.
    failure: Reject the account or machine binding while preserving portable Cloud intent.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.factory-ai-profile-row
  - id: rule.nimi.platform.core-protocol.p-aips-012a
    kind: rule
    title: P-AIPS-012 Profile action target closure
    modality: must
    statement: Profile import targets the Profile library, Apply targets exactly one canonical AIConfig owner, local configuration intent may be consumed only by a separate Add or Update Local Capability Configuration action, and no Profile action directly targets machine selection, LocalAsset binding, Connector selection, process state, or Job.
    condition: Whenever Profile applicability or a Profile-derived action target is declared or interpreted.
    failure: Reject an unknown target, AIConfig owner outside the closed set, or a cross-owner Profile action.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config-owner
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-profile-actions
      - type: applies_to
        target: definition.nimi.platform.core-protocol.factory-ai-profile-row
  - id: rule.nimi.platform.core-protocol.p-aips-012b
    kind: rule
    title: P-AIPS-012 first-run Profile recommendation is non-blocking
    modality: must_not
    statement: A first-run Profile recommendation, Local capability pack, LocalAsset, Local Capability Configuration, machine selection, Connector, or AI capability admission becomes a prerequisite for Product Control ready_for_use.
    condition: Whenever first-run Profile recommendation or product readiness is evaluated.
    failure: Keep AI capability setup orthogonal and allow Product Control completion without claiming the affected capability can execute.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-profile-selection
      - type: applies_to
        target: definition.nimi.platform.core-protocol.factory-ai-profile-row
  - id: rule.nimi.platform.core-protocol.p-aips-013a
    kind: rule
    title: P-AIPS-013 durable Account Default Profile association
    modality: must
    statement: An Account Default Profile, when configured, is one durable account-owned library record whose ownership metadata remains outside its portable AIProfile content and whose content contains no account, machine, Local Capability Configuration, machine selection, LocalAsset, Connector, secret, or process identity.
    condition: Whenever Account Default Profile is created, read, edited, or used as a recommendation source.
    failure: Reject the profile operation on a missing field, unresolved record, account mismatch, or data-root mismatch without changing Product Control readiness.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.account-default-profile
  - id: rule.nimi.platform.core-protocol.p-aips-013b
    kind: rule
    title: P-AIPS-013 explicit import and direct-edit boundary
    modality: must
    statement: Account Default Profile content enters the Profile library only through explicit Import Profile from a resolvable Platform factory row or supplied portable AIProfile and may then be edited directly as current portable content; there is no restore, revision, history, inheritance, re-apply, or factory-linked update action, and an official factory update never silently overwrites an existing record.
    condition: Whenever Account Default Profile content is imported, directly edited, or compared with a factory catalog update.
    failure: Reject an unrequested or unresolved source, hidden restore or re-apply action, and silent overwrite of the existing account record.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.account-default-profile
      - type: applies_to
        target: definition.nimi.platform.core-protocol.factory-ai-profile-catalog
  - id: rule.nimi.platform.core-protocol.p-aips-013c
    kind: rule
    title: P-AIPS-013 forbidden profile inputs and independent scopes
    modality: must_not
    statement: Realm OAuth tokens or profile projections, decoded claims, subject_user_id, renderer state, SDK cache, or App cache supplies Account Default Profile content, a caller-provided string is treated as a complete Profile, or editing the default Profile mutates an existing AIConfig, Local Capability Configuration, machine selection, or Connector.
    condition: Whenever Account Default Profile content or edits are evaluated.
    failure: Fail closed, keep ownership metadata outside portable content, and require the separate explicit formal action before any canonical owner changes.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.account-default-profile
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config
  - id: rule.nimi.platform.core-protocol.p-caiex-001
    kind: rule
    title: P-CAIEX-001 Capability execution chain is closed
    modality: must
    statement: An App or LocalAgent request enters one CapabilityContract and its owner AIConfig; Local composition dereferences Machine Local AI Configuration to its selected Local Capability Configuration and then its CapabilityImplementation, CapabilityImplementationDriver, and local ExecutionHost, while ordinary same-account Cloud composition uses the AIConfig-owned Cloud CapabilityImplementation and Driver target, Runtime resolves the exact current-account Connector and credential custody internally, and Remote ExecutionHost performs transport.
    condition: Whenever a capability request is admitted, composed, or executed.
    failure: Reject a bypass, alternate owner, missing committed link, engine or provider inference, Core option union, or Core Workflow DAG intermediate representation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config
      - type: applies_to
        target: definition.nimi.platform.core-protocol.capability-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.capability-implementation-driver
      - type: applies_to
        target: definition.nimi.platform.core-protocol.execution-host
      - type: applies_to
        target: definition.nimi.platform.core-protocol.machine-local-ai-configuration
  - id: rule.nimi.platform.core-protocol.p-caiex-002
    kind: rule
    title: P-CAIEX-002 Driver and ExecutionHost responsibilities are disjoint
    modality: must
    statement: CapabilityImplementationDriver alone interprets its dialect, projects requirements, validates declared standardized-feature support and known compatibility, maps exact bindings, and translates engine semantics, while ExecutionHost alone supplies local process or remote transport mechanisms and private supervision, leases, concurrency, and health.
    condition: Whenever a CapabilityImplementation is interpreted or invoked.
    failure: Reject a Host acting as Driver, a Driver owning routing or selection, a repository-wide adapter alias treated as a Driver, or a shared Core engine configuration union.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.capability-implementation
      - type: applies_to
        target: definition.nimi.platform.core-protocol.capability-implementation-driver
      - type: applies_to
        target: definition.nimi.platform.core-protocol.execution-host
  - id: rule.nimi.platform.core-protocol.p-caiex-003
    kind: rule
    title: P-CAIEX-003 Machine Local AI aggregate has one selection per contract
    modality: must
    statement: Each machine has exactly one Machine Local AI Configuration containing zero or more flat Local Capability Configurations per CapabilityContract and zero or one selected relation per contract; unselected records never participate in routing, ranking, fallback, or job composition.
    condition: Whenever local capability configuration is saved, listed, selected, or dereferenced.
    failure: Reject a second aggregate, nested preset or inheritance chain, multiple selections, implicit active record, or use of any unselected record.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.local-capability-configuration
      - type: applies_to
        target: definition.nimi.platform.core-protocol.machine-local-ai-configuration
  - id: rule.nimi.platform.core-protocol.p-caiex-004
    kind: rule
    title: P-CAIEX-004 Local configuration state is orthogonal
    modality: must
    statement: Local Capability Configuration records interpretability as interpretable or unavailable with reason, requirement resolution as unresolved or configured, and selection as unselected or selected; derived admission and each Job outcome remain separate facts, unresolved is a legal persistent state, and there is no draft, revision, history, readiness, warm, resident, active, or health lifecycle.
    condition: Whenever a Local Capability Configuration is saved, displayed, selected, admitted, or executed.
    failure: Reject a collapsed state, readiness alias, persistent draft, product revision, execution result written as configuration state, or unavailable Driver intent discarded instead of preserved.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.derived-capability-admission
      - type: applies_to
        target: definition.nimi.platform.core-protocol.local-capability-configuration
  - id: rule.nimi.platform.core-protocol.p-caiex-005
    kind: rule
    title: P-CAIEX-005 requirement projection and binding are exact
    modality: must
    statement: Creating or explicitly reprojecting a Local Capability Configuration deterministically projects normalized requirements from its exact Driver and dialect plus portable configuration and may atomically auto-bind only a unique exact verified-content match; implementation, dialect, or execution-relevant configuration change reprojects requirements, old bindings never inherit by path, filename, name, slot label, field similarity, or provenance, and inventory change never triggers ambient re-resolution.
    condition: Whenever local requirements are projected, reprojected, resolved, or rebound.
    failure: Preserve unresolved slots and reject a guessed, ambiguous, stale, inherited, ambient, path-derived, or name-derived binding.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.capability-implementation-driver
      - type: applies_to
        target: definition.nimi.platform.core-protocol.local-capability-configuration
  - id: rule.nimi.platform.core-protocol.p-caiex-006
    kind: rule
    title: P-CAIEX-006 machine selection is explicit and persistent through later failure
    modality: must
    statement: Select Local Capability Configuration requires the target to be interpretable and configured at commit time and changes only the machine relation; when a bound LocalAsset later becomes missing or damaged, its committed exact binding identity, the record, and machine selection remain unchanged while derived admission and real execution fail closed with a typed reason and no automatic re-resolution or re-selection. Only an explicit bind, unbind, rebind, requirement reprojection, or Update action may change a binding, and when such an explicit action or a later unavailable Driver or persistent hard blocker leaves the selected record unresolved or blocked, the selection relation still remains until an explicit Select or Delete action changes it.
    condition: Whenever machine selection is committed or a selected configuration later becomes unresolved or blocked.
    failure: Reject selection of an uninterpretable or unresolved target, automatic clearing, replacement, re-resolution, binding deletion caused by asset loss or execution failure, or mutation of any AIConfig or running Job.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.derived-capability-admission
      - type: applies_to
        target: definition.nimi.platform.core-protocol.local-capability-configuration
      - type: applies_to
        target: definition.nimi.platform.core-protocol.machine-local-ai-configuration
  - id: rule.nimi.platform.core-protocol.p-caiex-007
    kind: rule
    title: P-CAIEX-007 machine-wide Local mutation requires explicit confirmation
    modality: must
    statement: Before Select Local Capability Configuration, an execution-relevant Update of the selected record, or deletion of the selected record commits, the machine owner surface derives and displays the impact on every future matching Local App and LocalAgent execution and obtains user-observed explicit confirmation; impact calculation or display alone is not confirmation, presentation-only updates and deletion of an unselected record require no machine-wide confirmation, the projection is not persisted and grants no App veto, no action changes an AIConfig or running Job, and deleting the selected record atomically clears selection without choosing another or deleting shared resources.
    condition: Whenever a machine action can change future Local dereference.
    failure: Reject commit without the required explicit confirmation, a persisted owner index or compatibility snapshot, a Cloud AIConfig in the impact set, an AIConfig rewrite, an automatic replacement, or cascading LocalAsset deletion.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config
      - type: applies_to
        target: definition.nimi.platform.core-protocol.machine-local-ai-configuration
  - id: rule.nimi.platform.core-protocol.p-caiex-008
    kind: rule
    title: P-CAIEX-008 standardized features use deterministic subset admission
    modality: must
    statement: AIConfig declares a required feature set per CapabilityContract, the effective Local or Cloud implementation route declares a supported set validated by its Driver, and Core admits the feature check only when required is a subset of supported; declared support is semantic capability support rather than proof of exact bindings, authorization, current ExecutionHost feasibility, readiness, or Job success, mismatch fails closed without changing AIConfig route, Machine Local AI Configuration selection, provider, implementation, or Runtime-resolved Connector, and streaming remains CapabilityContract and Job semantics rather than a feature.
    condition: Whenever feature compatibility is authored, projected, or checked for a request.
    failure: Return typed feature mismatch and reject subtype capability tokens, a global short-name ontology, inferred support, optional-feature lifecycle, automatic switching, or streaming-as-feature.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config
      - type: applies_to
        target: definition.nimi.platform.core-protocol.capability-implementation
      - type: applies_to
        target: definition.nimi.platform.core-protocol.standardized-capability-feature
  - id: rule.nimi.platform.core-protocol.p-caiex-009
    kind: rule
    title: P-CAIEX-009 ordinary Cloud execution resolves current-account Connector internally
    modality: must
    statement: Cloud AIConfig intent owns one CapabilityImplementation and Driver-owned provider-model target selected and atomically committed for the exact App owner only through authorized Nimi-owned configuration; the protected App request, App-owned configuration carrier, and protected App consumer accept no route, implementation, provider-model target, connector, account, credential, or AIConfig mutation input. Runtime derives the exact Connector from that committed implementation-target selection, validates current-account ownership, credential and configuration validity, App Capability access, and existing data-movement, security, and management policy, and requires no second per-App or per-Connector authorization; provider API or capability-semantic change replaces the implementation while target or region change within one implementation remains Driver configuration.
    condition: Whenever Cloud intent, Nimi-owned App AIConfig configuration, target, Connector resolution, or execution admission is committed or evaluated.
    failure: Reject a protected App AIConfig mutation or App or Profile connector, account, or credential input, a connector used as CapabilityContract router, connection-test prerequisite, missing or foreign current-account Connector, unusable credential, App access denial, or policy denial; return the existing owner, configuration-required, credential, access-denied, or policy reason without requesting App-side Connector selection.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.capability-implementation-driver
  - id: rule.nimi.platform.core-protocol.p-caiex-010
    kind: rule
    lifecycle: removed
    title: Retired occurrence exactness rule that deferred bundle and ordering semantics
    reason: Replaced by the successor occurrence rule that admits ordered occurrences and sharded-bundle identity through the media vertical slice.
  - id: rule.nimi.platform.core-protocol.p-caiex-013
    kind: rule
    title: P-CAIEX-013 LocalAsset occurrences remain exact with admitted ordering and bundles
    modality: must
    statement: LocalAsset always denotes concrete verified content, strict or substitutable is requirement policy rather than an asset category, and each resource occurrence that can be independently selected, downloaded, bound, or replaced forms a distinct required slot; an upstream optional file creates no Nimi requirement unless the exact CapabilityImplementation and Driver declare it required, llama implementations project no mmproj for text-only support and project a required independent mmproj companion slot when declaring text.generate input.image support, and image or video implementations project a required main slot plus Driver-declared required companion slots such as text encoder, VAE, or an ordered LoRA sequence whose roles and options Core carries opaquely; Core admits a Driver-declared role-scoped occurrence ordinal and a sharded-bundle identity formed as the canonical digest over ordered per-entry digests as opaque exact facts with only requirement identity, role, ordinal, and display label visible, declares image.generate or video.generate standardized features only through Driver-validated support, and still defines no generic optional-requirement state machine.
    condition: Whenever a Driver projects normalized local requirements or a local binding is committed.
    failure: Reject an abstract asset, invented optional requirement, inferred ordering, split or Core-interpreted bundle, filename-derived companion, collapsed independently selectable occurrence, missing required companion, or companion projected for an implementation that does not declare it.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.local-capability-configuration
      - type: applies_to
        target: definition.nimi.platform.core-protocol.standardized-capability-feature
      - type: supersedes
        target: rule.nimi.platform.core-protocol.p-caiex-010
  - id: rule.nimi.platform.core-protocol.p-caiex-011
    kind: rule
    title: P-CAIEX-011 Jobs capture exact immutable composition
    modality: must
    statement: Local job submission atomically captures authorization, AIConfig Local route, required features, defaults, current selected Local Capability Configuration identity, exact CapabilityImplementation, Driver configuration, exact bindings, and request; Cloud job submission captures authorization, exact Cloud implementation, provider-model target, Runtime-resolved current-account Connector custody reference, defaults, and request; later configuration, Connector, selection, or process changes never rewrite either running Job.
    condition: Whenever a Local or Cloud capability Job is submitted or resumed.
    failure: Reject a missing exact input, live reread as execution truth, Job write-back into configuration, or substitution from catalog, inventory, filename, path, prefix, resident process, or unselected record.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-config
      - type: applies_to
        target: definition.nimi.platform.core-protocol.capability-job-effective-inputs
      - type: applies_to
        target: definition.nimi.platform.core-protocol.local-capability-configuration
  - id: rule.nimi.platform.core-protocol.p-caiex-012
    kind: rule
    title: P-CAIEX-012 execution failure does not mutate configuration
    modality: must
    statement: Ordinary load, generate, stream, transport, or provider failure ends only the affected Job and clears no exact binding, selection, route, or configuration; only a CapabilityImplementationDriver classification of a persistent hard blocker may change derived admission reason, and no Local, Cloud, provider, implementation, or configuration fallback is attempted.
    condition: Whenever capability execution fails.
    failure: Preserve canonical configuration and return the typed Job failure without fallback, readiness mutation, ambient re-resolution, or automatic re-selection.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.capability-implementation-driver
      - type: applies_to
        target: definition.nimi.platform.core-protocol.capability-job-effective-inputs
      - type: applies_to
        target: definition.nimi.platform.core-protocol.derived-capability-admission
  - id: rule.nimi.platform.core-protocol.p-capcat-004
    kind: rule
    title: canonical-capability-catalog P-CAPCAT-004 governance metadata
    modality: must
    statement: Every active CapabilityContract row carries non-empty governance owner, dataMovement, retention, revocation, and auditSource metadata; contract-scoped standardized features inherit that contract boundary without becoming subtype capability rows, and governance metadata grants no catalog-owned route, implementation, machine selection, or permission authority.
    condition: Whenever an active canonical capability row is admitted or consumed for governance projection.
    failure: Reject missing, unresolved, contradictory, or authority-expanding governance metadata.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.capability-catalog
      - type: applies_to
        target: definition.nimi.platform.core-protocol.capability-governance
  - id: definition.nimi.platform.core-protocol.architecture-layer-model
    kind: definition
    title: P-ARCH execution layer model
    meaning: The platform layer model places the installable Nimi product and its Nimi Home entry shell above Nimi Apps, SDK bridges, parallel Realm and Runtime authority surfaces, and independently owned cognition authority without exposing private implementation topology.
  - id: definition.nimi.platform.core-protocol.cognition-domain
    kind: definition
    title: P-ARCH cognition authority domain
    meaning: Cognition is an independent authority domain bridged and consumed by Runtime and SDK rather than a seventh execution-host layer or a subdivision of Realm or Runtime.
  - id: definition.nimi.platform.core-protocol.desktop-home-shell
    kind: definition
    title: P-ARCH Desktop-hosted Nimi Home shell
    meaning: Desktop is the current replaceable host implementation of the Nimi Home entry shell while Nimi is the installable product name and Nimi App is the local-development, registration, declaration, and Runtime access unit; public App distribution and ordinary-user App installation remain deferred until separate lifecycle authority activates them.
  - id: definition.nimi.platform.core-protocol.world-domain-facade
    kind: definition
    title: P-ARCH sdk world facade
    meaning: sdk/world is the app-facing world-domain facade for world-truth consumption, world-input projection, generation and materialization orchestration, fixture-package consumption, renderer-orchestration consumption, and world-session composition without replacing Realm truth or Runtime provider execution.
  - id: definition.nimi.platform.core-protocol.desktop-open-contract
    kind: definition
    title: P-DOPEN running Desktop open contract
    meaning: DesktopOpenIntent, projected publicly in TypeScript as NimiDesktopOpenIntent, is the sole closed cross-app protocol for asking an already-running Nimi Desktop process through desktop-open.openIntent to focus and open an admitted Desktop-owned surface.
  - id: definition.nimi.platform.core-protocol.desktop-open-target
    kind: definition
    title: P-DOPEN closed target kind
    meaning: A Desktop Open target kind is exactly open-explore, open-runtime-config, open-agents, open-apps, or open-settings, while target-specific values remain owned by the referenced Desktop target catalog.
  - id: definition.nimi.platform.core-protocol.desktop-open-envelope
    kind: definition
    title: P-DOPEN closed intent envelope
    meaning: DesktopOpenEnvelope version one contains host-injected sourceApp, host-injected sourceHost, a host-generated-or-validated requestId, and one closed Desktop Open intent with no unknown fields.
  - id: definition.nimi.platform.core-protocol.desktop-open-result
    kind: definition
    title: P-DOPEN closed domain result
    meaning: The version-one Desktop Open domain result vocabulary is exactly desktop-open-desktop-not-running, desktop-open-desktop-not-ready, desktop-open-intent-invalid, desktop-open-target-unsupported, desktop-open-bridge-auth-failed, and desktop-open-host-unavailable.
  - id: definition.nimi.platform.core-protocol.desktop-open-transport
    kind: definition
    title: P-DOPEN running presence transport
    meaning: The production Desktop Open transport is the Desktop-owned running presence descriptor and exact-loopback bridge invoked by Kit standard shell hosts without starting Desktop or creating another listener.
  - id: rule.nimi.platform.core-protocol.p-arch-001a
    kind: rule
    title: P-ARCH-001 public product and layer framing
    modality: must
    statement: Public architecture identifies Nimi as the installable long-term user product, Nimi Home as its currently Desktop-hosted replaceable entry shell, Nimi App as the current local-development, registration, declaration, and Runtime access unit, public App distribution and ordinary-user App installation as deferred, and the canonical public authority entry as nimi/.nimi/spec/**.
    condition: Whenever the public top-layer architecture is described.
    failure: Reject a product, shell, app-unit, lifecycle-stage, or canonical-entry description that changes this layer framing.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.architecture-layer-model
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-home-shell
  - id: rule.nimi.platform.core-protocol.p-arch-001b
    kind: rule
    title: P-ARCH-001 independent cognition authority
    modality: must_not
    statement: Platform architecture makes cognition a seventh execution-host layer or silently places its authority under Realm or Runtime.
    condition: Whenever cognition is placed or consumed in the layer model.
    failure: Reject the placement and preserve cognition as an independently bridged authority domain.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.cognition-domain
  - id: rule.nimi.platform.core-protocol.p-arch-001c
    kind: rule
    title: P-ARCH-001 public projection boundary
    modality: must_not
    statement: Public top-layer architecture exposes private implementation topology, source-checkout shape, semantic-owner paths, or Realm-facing content outside an admitted public projection boundary.
    condition: Whenever a public architecture or Realm-facing projection is published.
    failure: Reject the private detail and retain only public authority surfaces and routing references.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.architecture-layer-model
      - type: applies_to
        target: definition.nimi.platform.core-protocol.realm-primitive-layer
  - id: rule.nimi.platform.core-protocol.p-arch-002
    kind: rule
    title: P-ARCH-002 parallel layers and fixed protocols
    modality: must
    statement: Realm and Runtime remain parallel and mutually independent, communicate through SDK bridging, expose Realm through REST and WebSocket and Runtime through gRPC, and give Nimi Apps one @nimiplatform/sdk entry.
    condition: Whenever layers communicate or an app accesses the platform.
    failure: Reject a direct Realm-to-Runtime dependency, non-SDK app entry, or substituted canonical protocol.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.architecture-layer-model
  - id: rule.nimi.platform.core-protocol.p-arch-003
    kind: rule
    title: P-ARCH-003 Realm responsibility allocation
    modality: must
    statement: Platform architecture references the Realm canonical surface as shared persistent-world truth owner for auth, social, chat, economy, world, PersonaCharacter, WorldCharacter, Character Source, and cloud audit, keeps six-primitive execution in the separate Platform primitive layer, and leaves semantic persistence and read paths with Realm-owned Truth, World State, World History, Chat, and adjacent formal domains.
    condition: Whenever Realm responsibilities or primitive ownership are allocated by Platform text.
    failure: Reject an allocation that moves Realm-owned domains, aliases the primitive layer to Realm internals, or authors Realm internal semantics.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.realm-primitive-layer
  - id: rule.nimi.platform.core-protocol.p-arch-004
    kind: rule
    title: P-ARCH-004 Runtime responsibility allocation
    modality: must
    statement: Runtime remains an independent local service owning deterministic consumption, admission, composition, and execution of each canonical AIConfig owner's committed Local or Cloud route intent, process and model management, local Text, STT and TTS, Token, Quota and Budget, Credential custody, LocalAgent materialization and lifecycle, Conversation, operational Memory and Knowledge, LocalAgent state, voice and events, local audit, protected App access admission, and bounded bridges to independent Realm and Cognition authority without owning another Local or Cloud route choice.
    condition: Whenever Platform architecture allocates Runtime responsibilities.
    failure: Reject an allocation that removes these core responsibilities from Runtime, gives Runtime an additional route-choice authority beyond consuming canonical AIConfig owner intent, makes Runtime dependent on an App layer, or promotes Workflow, MCP, or World Evolution into a Runtime core prerequisite.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.architecture-layer-model
  - id: rule.nimi.platform.core-protocol.p-arch-005
    kind: rule
    title: P-ARCH-005 single target architecture
    modality: must
    statement: Architecture execution uses one target state, reset-first data posture, and AI-first execution without long-lived parallel legacy and target tracks.
    condition: Whenever an architecture transition or execution mode is selected.
    failure: Reject a long-lived dual track or compatibility target that preserves the superseded architecture.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.architecture-layer-model
  - id: rule.nimi.platform.core-protocol.p-arch-010
    kind: rule
    title: P-ARCH-010 current AI execution owner boundary
    modality: must
    statement: Each canonical AIConfig owner commits explicit Local or Cloud intent, Runtime deterministically composes that intent with the current machine selection or the exact Cloud implementation and target plus the internally resolved current-account Connector and owns execution truth and credential custody without accepting caller selection, searching for a substitute, probing, or falling back, while Core defines no cross-engine option union or general Workflow DAG intermediate representation.
    condition: Whenever the current AI execution stack is implemented or described.
    failure: Reject Runtime route choice, hidden fallback, caller credential injection, App-owned execution truth, a Core engine-option union, or Workflow treated as a core prerequisite.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.ai-route
      - type: applies_to
        target: definition.nimi.platform.core-protocol.architecture-layer-model
  - id: rule.nimi.platform.core-protocol.p-arch-011
    kind: rule
    title: P-ARCH-011 isolated production credential plane
    modality: must_not
    statement: Production accepts apiKeyEnv, inline request credentials, Desktop, SDK, Host, renderer, or App credential injection, App-owned secret providers, user-session vault credentials, or synthetic probe credentials in place of Runtime resolution of the exact current-account Connector and its credential custody inside the independently admitted isolated production service principal; production service topology, signed deployment, installer privilege, update, and custody authority remain independent from and never substitute for the per-user non-elevated App ingress boundary.
    condition: Whenever a production credential is resolved or product behavior is claimed from a probe.
    failure: Deny the operation, preserve the independent production Runtime custody boundary, and expose no credential or portable authority through the supported App surface.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
  - id: rule.nimi.platform.core-protocol.p-arch-020
    kind: rule
    title: P-ARCH-020 sole SDK developer entry
    modality: must
    statement: Desktop and third-party apps use the same SDK API as the sole developer platform entry, with node-grpc and tauri-ipc transport profiles and local-broker reserved as future.
    condition: Whenever a developer client or transport profile accesses platform capabilities.
    failure: Reject a second developer entry, a Desktop-private API variant, or present use of the future local-broker profile.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.architecture-layer-model
  - id: rule.nimi.platform.core-protocol.p-arch-021a
    kind: rule
    title: P-ARCH-021 Desktop shell and Apps projection
    modality: must
    statement: Desktop remains the host of Nimi Home rather than a public ontology owner or flagship product name, ordinary product wording uses Apps instead of historical App Store, Library, or Discovery, and lower-level historical projections remain subordinate shell surfaces.
    condition: Whenever the Desktop-hosted product shell or its ordinary app surface is named.
    failure: Reject Desktop as the product ontology, a superseded ordinary label, or a subordinate projection presented as product authority.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-home-shell
  - id: rule.nimi.platform.core-protocol.p-arch-021b
    kind: rule
    title: P-ARCH-021 Desktop shell ownership exclusions
    modality: must_not
    statement: A Desktop-hosted Home, Runtime Console, diagnostics, settings, Library, Discovery, or Apps projection owns Runtime materialization, app registry or admission, Realm or cognition truth, marketplace economy truth, factory profile recommendation, Home information architecture, release identity, self-update policy, daemon handoff, or selected-source records.
    condition: Whenever a Desktop-hosted projection allocates authority.
    failure: Reject the ownership claim and retain each domain with its referenced canonical owner surface without reinterpreting that owner's internals.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-home-shell
  - id: rule.nimi.platform.core-protocol.p-arch-030
    kind: rule
    title: P-ARCH-030 independent audit layers
    modality: must
    statement: Runtime local audit independently records AI calls, model operations, app communication, and authorization chains, Realm cloud audit independently records business and compliance operations, and local audit may optionally report to cloud aggregation without merging ownership.
    condition: Whenever audit events cross or are allocated between Runtime and Realm.
    failure: Reject merged audit truth or a mandatory aggregation dependency between the independent layers.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.protocol-audit-event
  - id: rule.nimi.platform.core-protocol.p-arch-031
    kind: rule
    title: P-ARCH-031 sdk world facade boundary
    modality: must_not
    statement: sdk/world replaces Realm World truth, Runtime AI or LocalAgent execution, or renderer authority, becomes a second public platform entry, absorbs provider-native request ownership, or publishes World Evolution as a current capability.
    condition: Whenever sdk/world or its internal core is implemented, projected, or renamed.
    failure: Reject the authority expansion and retain sdk/world as the app-facing facade adjacent to its canonical owners.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.world-domain-facade
  - id: rule.nimi.platform.core-protocol.p-dopen-001a
    kind: rule
    title: P-DOPEN-001 sole running Desktop operation
    modality: must
    statement: Every other-app request to focus a running Desktop and open an admitted Desktop-owned surface uses DesktopOpenIntent through desktop-open.openIntent and its NimiDesktopOpenIntent SDK projection.
    condition: Whenever an app requests navigation in an already-running Desktop.
    failure: Reject any alternate cross-app Desktop-open contract or operation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-open-contract
  - id: rule.nimi.platform.core-protocol.p-dopen-001b
    kind: rule
    title: P-DOPEN-001 no Desktop-private navigation bypass
    modality: must_not
    statement: An app constructs a Desktop URL, emits a Desktop menu-bar event, or calls Desktop-private IPC to request Desktop navigation.
    condition: Whenever an app requests Desktop focus or navigation.
    failure: Reject the bypass and require desktop-open.openIntent.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-open-contract
  - id: rule.nimi.platform.core-protocol.p-dopen-002
    kind: rule
    title: P-DOPEN-002 running-only fail-closed boundary
    modality: must
    statement: Desktop Open never starts Desktop, maps missing, stale, malformed, refused, or mismatched presence to desktop-open-desktop-not-running, maps running but not ready to desktop-open-desktop-not-ready, and does not queue while Desktop is not ready.
    condition: Whenever Desktop presence or readiness cannot admit immediate execution.
    failure: Return the exact typed result without starting Desktop, queuing, or reporting success.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-open-result
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-open-transport
  - id: rule.nimi.platform.core-protocol.p-dopen-003
    kind: rule
    title: P-DOPEN-003 closed target kinds and Desktop ownership
    modality: must
    statement: Desktop Open accepts only the five closed target kinds and resolves target-specific enum values from the referenced Desktop catalog without duplicating Desktop information-architecture truth in Platform.
    condition: Whenever a Desktop Open target is admitted or interpreted.
    failure: Return desktop-open-target-unsupported for an unknown target and reject Platform-owned target-specific values.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-open-target
  - id: rule.nimi.platform.core-protocol.p-dopen-004a
    kind: rule
    title: P-DOPEN-004 exact closed envelope
    modality: must
    statement: DesktopOpenEnvelope uses schemaVersion one, host-injected sourceApp and sourceHost, a host-generated-or-validated requestId matching ^desktop-open-[A-Za-z0-9][A-Za-z0-9._:-]{0,114}$ with maximum length 128, and one closed intent, and rejects unknown fields.
    condition: Whenever a Desktop Open envelope is created, admitted, or decoded.
    failure: Return desktop-open-intent-invalid before dispatch when a field, value, grammar, length, or closure requirement fails.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-open-envelope
  - id: rule.nimi.platform.core-protocol.p-dopen-004b
    kind: rule
    title: P-DOPEN-004 untrusted app identity fields
    modality: must_not
    statement: Application code supplies a trusted Desktop Open identity field, sourceApp becomes authorization truth, or sourceApp or open-apps.appId violates the canonical Platform app-id grammar or Desktop Open maximum length 96.
    condition: Whenever Desktop Open source or target app identity is injected or authorized.
    failure: Reject the envelope and derive identity only from the verified host without granting authority from sourceApp.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-open-envelope
  - id: rule.nimi.platform.core-protocol.p-dopen-005a
    kind: rule
    title: P-DOPEN-005 closed intent is not a URL opener
    modality: must_not
    statement: desktop-open.openIntent accepts a raw URL, OAuth URL, OS custom scheme, browser-navigation request, or other arbitrary navigation payload.
    condition: Whenever Desktop Open input is admitted.
    failure: Return desktop-open-intent-invalid without opening or forwarding the payload.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-open-contract
  - id: rule.nimi.platform.core-protocol.p-dopen-005b
    kind: rule
    title: P-DOPEN-005 OAuth opener isolation
    modality: must_not
    statement: oauth.openExternalUrl dispatches Desktop Open Intent or admits a Desktop Open reserved loopback route before bridge authentication.
    condition: Whenever the OAuth external opener handles a URL or route.
    failure: Reject the reserved route before bridge authentication and keep the protocols isolated.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-open-transport
  - id: rule.nimi.platform.core-protocol.p-dopen-006
    kind: rule
    title: P-DOPEN-006 canonical running transport
    modality: must
    statement: Production Desktop Open uses the Desktop-owned running presence descriptor and exact-loopback bridge through a Kit standard shell host and never uses an OS custom scheme that can cold-start Desktop.
    condition: Whenever a production Desktop Open intent is transported.
    failure: Reject a custom-scheme or noncanonical transport before Desktop navigation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-open-transport
  - id: rule.nimi.platform.core-protocol.p-dopen-007a
    kind: rule
    title: P-DOPEN-007 verified local-app source host
    modality: must
    statement: A verified local-nimi-app-standard-shell-v1 carrier injects desktop-electron-local-app-host as sourceHost without application selection, override, or collapse into generic Electron identity.
    condition: Whenever a verified Electron local-app host creates a Desktop Open envelope.
    failure: Reject an absent, caller-selected, overridden, or collapsed host class.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-open-envelope
  - id: rule.nimi.platform.core-protocol.p-dopen-007b
    kind: rule
    title: P-DOPEN-007 source host has provenance only
    modality: must_not
    statement: desktop-electron-local-app-host supplies registered subject, account, declaration generation, protected session, Effective App Access Snapshot, package, or access truth rather than routing provenance only.
    condition: Whenever local-app sourceHost is interpreted.
    failure: Deny the access claim and use independently verified Runtime session and snapshot inputs.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-open-envelope
  - id: rule.nimi.platform.core-protocol.p-dopen-007c
    kind: rule
    title: P-DOPEN-007 local-app shell transport closure
    modality: must
    statement: The local-app standard shell admits exactly desktop-open.openIntent, reads the existing Desktop presence descriptor, invokes the existing exact-loopback bridge, creates no listener, avoids Runtime public TCP, and maps missing or stale presence to desktop-open-desktop-not-running.
    condition: Whenever the verified Electron local-app host performs Desktop Open.
    failure: Reject a Desktop URL, generic navigation proxy, raw loopback request, cold-start operation, new listener, Runtime TCP route, or incorrect presence result.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-open-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-open-transport
  - id: rule.nimi.platform.core-protocol.p-dopen-008a
    kind: rule
    title: P-DOPEN-008 closed version-one result codes
    modality: must
    statement: Every version-one Desktop Open domain outcome uses exactly one admitted result code and never emits desktop-open-bridge-unavailable.
    condition: Whenever Desktop Open returns a domain result.
    failure: Reject an unknown or unadmitted result and return the applicable admitted failure without pseudo-success.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-open-result
  - id: rule.nimi.platform.core-protocol.p-dopen-008b
    kind: rule
    title: P-DOPEN-008 presence failures are not bridge unavailable
    modality: must
    statement: Connection refusal, a stale or malformed descriptor, a non-loopback endpoint, or bridgeId mismatch resolves to desktop-open-desktop-not-running rather than a bridge-unavailable substitute.
    condition: Whenever the Desktop-owned bridge presence fails validation or connection.
    failure: Return desktop-open-desktop-not-running without fallback or substitute result.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-open-result
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-open-transport
  - id: rule.nimi.platform.core-protocol.p-dopen-table-source-hosts
    kind: rule
    title: desktop-open-intents P-DOPEN-001 closed sourceHost values
    modality: must
    statement: Desktop Open sourceHost is exactly electron-standard-shell, tauri-standard-shell, desktop-electron-local-app-host, or dev-fixture, and the SDK and Kit projections remain @nimiplatform/sdk/app and @nimiplatform/kit/core/desktop-open.
    condition: Whenever a Desktop Open source host or public projection is emitted or accepted.
    failure: Reject an unknown sourceHost or a projection outside the declared public surfaces.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.desktop-open-envelope
  - id: rule.nimi.platform.core-protocol.p-arch-011b
    kind: rule
    title: P-ARCH-011 isolated synthetic probe credentials
    modality: must
    statement: A synthetic probe fixture uses non-product credentials only when separately signed and remains isolated from the production credential plane and product-behavior claims.
    condition: Whenever a synthetic probe uses a credential.
    failure: Reject an unsigned or product credential and withhold the probe from product evidence.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
