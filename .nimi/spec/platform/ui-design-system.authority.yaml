format: nimicoding.authority/v2
owner: team.platform
scope: platform.ui-design-system
units:
  - id: definition.nimi.platform.ui-design-system.design-pattern
    kind: definition
    title: Nimi design pattern
    meaning: The Nimi design pattern is the cross-app product contract for shared semantic tokens, theme expression, primitive families, material and motion semantics, reusable composition boundaries, and external app integration.
  - id: definition.nimi.platform.ui-design-system.theme-system
    kind: definition
    title: Shared theme system
    meaning: The shared theme system combines one light or dark foundation scheme with exactly one app accent pack and exposes governed semantic tokens by foundation or accent layer.
  - id: definition.nimi.platform.ui-design-system.shared-primitive
    kind: definition
    title: Shared UI primitive
    meaning: A shared UI primitive is a Kit-delivered accessible behavior and visual family whose variants, states, sizing, and semantic-token use are common across governed product surfaces.
  - id: definition.nimi.platform.ui-design-system.governed-surface
    kind: definition
    title: Governed UI surface
    meaning: A governed UI surface is a shell, product, overlay, field, navigation, content, feedback, or interaction surface subject to the shared design pattern while retaining app-owned information architecture, data models, placement, and art direction.
  - id: definition.nimi.platform.ui-design-system.ui-material
    kind: definition
    title: UI material system
    meaning: UI material is a tone-orthogonal five-tier surface axis comprising solid, glass-thin, glass-regular, glass-thick, and glass-chrome with neutral foundation tokens, downgrade semantics, accessibility thresholds, and spatial stacking roles.
  - id: definition.nimi.platform.ui-design-system.ambient-system
    kind: definition
    title: Ambient background system
    meaning: The ambient background system is the governed mesh, minimal, or none treatment for a surface, with none as the default and token-owned composition and color slots.
  - id: definition.nimi.platform.ui-design-system.motion-system
    kind: definition
    title: UI motion system
    meaning: The UI motion system is the shared interaction-state, duration, easing, spring, gesture, overlay, interruption, and reduced-motion vocabulary for governed surfaces.
  - id: definition.nimi.platform.ui-design-system.density-system
    kind: definition
    title: UI density system
    meaning: UI density is a theme-layer runtime axis with compact, regular, and expressive values, regular as the default, and application at page or composition boundaries.
  - id: definition.nimi.platform.ui-design-system.kit-module-surface
    kind: definition
    title: Reusable Kit module surface
    meaning: A reusable Kit module surface owns common layout, rendering, interaction, loading, failure, disabled, and responsive behavior while consuming domain truth only through typed owner projections and adapters.
  - id: definition.nimi.platform.ui-design-system.agent-center-surface
    kind: definition
    title: LocalAgent Center surface
    meaning: Agent Center is the reusable Kit surface for presenting and editing admitted Runtime LocalAgent personality, appearance, behavior, Memory, Conversation-presentation, and the account-scoped shared LocalAgent AIConfig from Desktop or any protected App whose current session has agent.configure coverage; it presents Runtime-owned LocalAgent CapabilityContract participation independently from configured AIConfig intent, may select route-only Local or exact Cloud Connector and target intent through the canonical AIConfig manager while displaying the current machine-selected Local resource through bounded effective projection, and owns no execution, lifecycle, capability catalog, participation policy, readiness, Loadout or Connector content, credential, endpoint, configuration persistence, authorization, or semantic presentation truth.
  - id: definition.nimi.platform.ui-design-system.runtime-projection
    kind: definition
    title: Runtime-owned UI projection
    meaning: A Runtime-owned UI projection is bounded typed state or mutation capability exposed to Kit through the public SDK or an injected typed adapter without transferring Runtime truth ownership to Kit or an app.
  - id: rule.nimi.platform.ui-design-system.p-design-001a
    kind: rule
    title: P-DESIGN-001 shared foundation authority
    modality: must
    statement: The Nimi design pattern remains the single cross-app authority for shared primitive families, semantic-token taxonomy, theme-pack schema, material taxonomy, and external app integration behavior.
    condition: Whenever a governed product surface defines or consumes shared design behavior.
    failure: Reject any parallel cross-app design authority.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.design-pattern
  - id: rule.nimi.platform.ui-design-system.p-design-001b
    kind: rule
    title: P-DESIGN-001 app composition boundary
    modality: must_not
    statement: An app-local contract redefines shared primitive families, semantic-token taxonomies, theme governance, or material and motion behavior.
    condition: Whenever an app owns concrete consumption, retained composition, information architecture, or product art direction.
    failure: Keep app-specific composition locally owned and reject the shared-contract redefinition.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.governed-surface
  - id: rule.nimi.platform.ui-design-system.p-design-002a
    kind: rule
    title: P-DESIGN-002 foundation and accent composition
    modality: must
    statement: Every governed app composes the shared light and dark foundation schemes with exactly one app accent pack, using nimi-light and nimi-dark as foundation schemes and nimi-accent as the shared Nimi accent pack.
    condition: Whenever a governed app initializes theme expression.
    failure: Reject a missing foundation scheme, multiple accent packs, or an app-local replacement foundation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.theme-system
  - id: rule.nimi.platform.ui-design-system.p-design-002b
    kind: rule
    title: P-DESIGN-002 external accent ownership
    modality: must
    statement: An external app accent pack may be packaged by Kit only when its values remain owned by the consuming app rather than platform design authority.
    condition: Whenever Kit packages an external app accent pack.
    failure: Reject a pack whose app-specific values are claimed as platform-owned design truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.theme-system
  - id: rule.nimi.platform.ui-design-system.p-design-003
    kind: rule
    title: P-DESIGN-003 semantic token taxonomy
    modality: must
    statement: Shared semantic tokens use the closed surface, text, action, overlay, sidebar, field, status, radius, spacing, typography, stroke, elevation, motion, z, sizing, border, opacity, focus, scrollbar, toggle, material, backdrop, and ambient categories, declare foundation or accent layer ownership, and receive theme values from the shared structured design tables rather than app-local registries.
    condition: Whenever a shared semantic token or theme value is declared or consumed.
    failure: Reject an unknown category, absent layer, or parallel app token registry.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.theme-system
  - id: rule.nimi.platform.ui-design-system.p-design-004
    kind: rule
    title: P-DESIGN-004 shared scheme mechanism
    modality: must
    statement: Governed apps resolve light or dark theme state through the shared scheme mechanism, and accent expression layers above the foundation without changing primitive-family structure.
    condition: Whenever theme state is resolved or an accent is applied.
    failure: Reject a parallel theme entrypoint, root token system, or accent-owned primitive structure.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.theme-system
  - id: rule.nimi.platform.ui-design-system.p-design-005
    kind: rule
    title: P-DESIGN-005 primitive visual authority
    modality: must
    statement: Shared primitive variants are closed structured taxonomy implemented in Kit with accessible headless behavior, class-variance styling, Tailwind utilities, and semantic theme values, while app and shared-library code may compose but may not define variants for shared families outside Kit UI.
    condition: Whenever a shared primitive family is implemented, styled, or composed.
    failure: Reject an undeclared variant, inaccessible behavior substrate, generated primitive selector authority, or out-of-bound variant definition.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.shared-primitive
  - id: rule.nimi.platform.ui-design-system.p-design-006
    kind: rule
    title: P-DESIGN-006 no local primitive redefinition
    modality: must_not
    statement: Governed app styling defines shared-family variants, targeted utility overrides, or wrapper styling that changes a Kit primitive visual contract.
    condition: Whenever an app styles a governed shared primitive.
    failure: Remove the redefinition and retain only app-owned composition styling.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.shared-primitive
  - id: rule.nimi.platform.ui-design-system.p-design-007
    kind: rule
    title: P-DESIGN-007 no local shared token authority
    modality: must_not
    statement: Governed app or handwritten shared-library styling assigns shared Nimi semantic-token values or supplies fallback token authority.
    condition: Whenever governed styling reads or writes a shared semantic token.
    failure: Remove the assignment or fallback and resolve the value from the generated shared theme.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.theme-system
  - id: rule.nimi.platform.ui-design-system.p-design-008
    kind: rule
    title: P-DESIGN-008 accent alias phase-out
    modality: must_not
    statement: Generated accent packs retain app-scoped alias namespaces or retired full-theme compatibility outputs, or governed chrome depends on such aliases for shared background, text, focus, or surface meaning.
    condition: Whenever foundation-plus-accent theme output is generated or consumed.
    failure: Emit and consume shared semantic tokens only while preserving app identity through those tokens and local color mixing.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.theme-system
  - id: rule.nimi.platform.ui-design-system.p-design-009a
    kind: rule
    title: P-DESIGN-009 visual references are non-authoritative inputs
    modality: must_not
    statement: Reference images, labels, pixels, measurements, artifact identities, hashes, or host-local locations become canonical token values, theme packs, app composition truth, or implementation proof.
    condition: Whenever a visual reference informs shared taxonomy.
    failure: Keep reference identity diagnostic and source numeric visual values from admitted shared token authority.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.design-pattern
  - id: rule.nimi.platform.ui-design-system.p-design-009b
    kind: rule
    title: P-DESIGN-009 reusable abstraction boundary
    modality: must
    statement: A reference composition becomes shared Kit authority only as a reusable primitive abstraction, while its information architecture, route placement, data model, and screen composition remain app-owned.
    condition: Whenever a visual reference composition is promoted into shared design authority.
    failure: Reject promotion of app-specific product structure.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.governed-surface
  - id: rule.nimi.platform.ui-design-system.p-design-010
    kind: rule
    title: P-DESIGN-010 shared primitive contract
    modality: must
    statement: Kit delivers accessible token-styled shared primitives for surface, action, overlay, sidebar, field, status, scroll area, toggle, and avatar families, and any compatibility wrapper delegates directly without changing their visual contract.
    condition: Whenever a governed shell-level module uses one of the shared families.
    failure: Reject a hand-rolled family or a wrapper that changes shared behavior or visuals.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.shared-primitive
  - id: rule.nimi.platform.ui-design-system.p-design-011
    kind: rule
    title: P-DESIGN-011 surface contract
    modality: must
    statement: Surface is the sole shared shell primitive for canvas, panel, card, hero, and overlay tones, and its elevation and border treatment resolve through semantic tokens rather than feature-local constants.
    condition: Whenever a governed shell surface is rendered.
    failure: Reject a substitute shared surface family or local elevation and border contract.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.shared-primitive
  - id: rule.nimi.platform.ui-design-system.p-design-012a
    kind: rule
    title: P-DESIGN-012 action taxonomy and shape
    modality: must
    statement: Button and IconButton provide primary, secondary, ghost, and danger actions through semantic tokens; standard actions use the continuous 12-pixel action radius rather than a capsule, and capsule shape remains reserved for chip, filter, badge, segmented selection, search, and toggle families.
    condition: Whenever a governed action primitive is rendered.
    failure: Reject an unknown tone, tone-dependent shape, or capsule-shaped standard action.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.shared-primitive
  - id: rule.nimi.platform.ui-design-system.p-design-012b
    kind: rule
    title: P-DESIGN-012 immediate action feedback
    modality: must
    statement: Shared actions provide visible token-driven pressed feedback on pointer-down within one frame and do not use hover-only feedback or vertical hover lifts.
    condition: Whenever a pointer activates a shared action.
    failure: Treat the action interaction as non-conforming until immediate pressed feedback replaces the prohibited model.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.motion-system
  - id: rule.nimi.platform.ui-design-system.p-design-013a
    kind: rule
    title: P-DESIGN-013 overlay family contract
    modality: must
    statement: OverlayShell owns governed dialog and drawer backdrop, panel, title, content, footer, motion, stacking, close behavior, and testability slots, while controlled lower-level dialog, popover, and tooltip parts retain canonical overlay-family classes and reduced-motion behavior.
    condition: Whenever governed overlay content is rendered.
    failure: Reject a hand-rolled governed dialog or drawer, missing canonical slots, or unstable accessibility and testability behavior.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.shared-primitive
  - id: rule.nimi.platform.ui-design-system.p-design-013b
    kind: rule
    title: P-DESIGN-013 overlay sizing and sidebar
    modality: must
    statement: OverlayShell admits S 480-pixel, M 720-pixel, L 960-pixel, XL 1120-pixel, and full viewport-minus-32-pixel panel sizes with the same viewport-safe maximum, preserves its default medium-width layout when size is absent, and offers an optional Kit-chromed 200-pixel sidebar while retaining single-column default behavior.
    condition: Whenever OverlayShell sizing or two-column composition is requested.
    failure: Reject an unknown size, viewport-unsafe panel, caller-owned sidebar chrome, or changed default composition.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.shared-primitive
  - id: rule.nimi.platform.ui-design-system.p-design-014
    kind: rule
    title: P-DESIGN-014 sidebar and navigation contract
    modality: must
    statement: Shared sidebars and shell navigation use the nimi-sidebar-v1 family with entity-row, category-row, or nav-row items and badge, status-dot, chevron, or count trailing affordances.
    condition: Whenever a governed sidebar or shell navigation list is rendered.
    failure: Reject an unknown item kind, trailing affordance, or parallel sidebar family.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.shared-primitive
  - id: rule.nimi.platform.ui-design-system.p-design-015a
    kind: rule
    title: P-DESIGN-015 field family and tones
    modality: must
    statement: TextField, SearchField, TextareaField, and SelectField are the shared governed fields; field background, stroke, placeholder, and focus use semantic tokens, and text and textarea fields admit only default, search, quiet, and danger tones.
    condition: Whenever a governed form or settings field is rendered.
    failure: Reject a parallel field primitive, unknown tone, or local visual-state constant.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.shared-primitive
  - id: rule.nimi.platform.ui-design-system.p-design-015b
    kind: rule
    title: P-DESIGN-015 danger accessibility semantics
    modality: must
    statement: Danger-tone text and textarea fields resolve invalid chrome through the shared danger status token and default the inner control to aria-invalid true unless the caller explicitly supplies that attribute.
    condition: Whenever a text or textarea field uses danger tone.
    failure: Reject missing invalid semantics, non-token danger chrome, or overwriting of a caller-supplied accessibility attribute.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.shared-primitive
  - id: rule.nimi.platform.ui-design-system.p-design-016
    kind: rule
    title: P-DESIGN-016 typography contract
    modality: must
    statement: Governed typography scale, weights, line heights, letter spacing, and shared role utilities derive from semantic typography tokens, and modules do not invent an ad hoc scale for a covered role.
    condition: Whenever governed text uses a shared page, section, body, caption, label, overline, or monospaced role.
    failure: Replace the local typography contract with the shared tokenized role.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.theme-system
  - id: rule.nimi.platform.ui-design-system.p-design-017
    kind: rule
    title: P-DESIGN-017 spacing and sizing contract
    modality: must
    statement: Shared primitive padding, gaps, minimum heights, icon sizes, sidebar rows, and scrollbars resolve through semantic spacing and sizing scales rather than raw module values when a shared token exists.
    condition: Whenever a governed primitive defines layout rhythm or component size.
    failure: Replace the raw covered value with its shared token.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.shared-primitive
  - id: rule.nimi.platform.ui-design-system.p-design-018
    kind: rule
    title: P-DESIGN-018 focus opacity and icon contract
    modality: must
    statement: Governed focus rings, disabled opacity, interaction overlays, hover treatment, and icon sizing resolve through shared semantic tokens, while apps may vary icon glyphs but not shared size or focus behavior.
    condition: Whenever a governed primitive presents focus, disabled, hover, overlay, or icon state.
    failure: Reject a per-app constant or app-local focus and icon-size contract.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.shared-primitive
  - id: rule.nimi.platform.ui-design-system.p-design-019
    kind: rule
    title: P-DESIGN-019 app-owned composition boundary
    modality: must_not
    statement: An app-owned composition becomes parallel visual authority for action, field, surface, sidebar, overlay, status, scroll area, toggle, or avatar families, or a thin wrapper adds a visual contract instead of direct delegation.
    condition: Whenever an app retains a composition or wrapper around shared primitives.
    failure: Keep only app-owned interaction and layout for an uncovered family and delegate covered families unchanged.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.governed-surface
  - id: rule.nimi.platform.ui-design-system.p-design-021
    kind: rule
    title: P-DESIGN-021 controlled exception boundary
    modality: must
    statement: A controlled exception to shared primitive adoption is narrow, app-owned, and still consumes shared semantic tokens without defining an independent token system or placing concrete app exception inventory in platform authority.
    condition: Whenever a governed app cannot consume a shared primitive unchanged.
    failure: Reject a broad, platform-owned, or parallel-token exception.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.governed-surface
  - id: rule.nimi.platform.ui-design-system.p-design-022a
    kind: rule
    title: P-DESIGN-022 five-tier material taxonomy
    modality: must
    statement: Governed surfaces use material as an axis separate from tone, default to solid, and admit only solid, glass-thin, glass-regular, glass-thick, and glass-chrome, preserving prior solid, glass-regular, and glass-thick semantics.
    condition: Whenever a governed surface declares or infers material.
    failure: Reject a parallel material axis, undeclared tier, or missing tone on non-solid material.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.ui-material
  - id: rule.nimi.platform.ui-design-system.p-design-022b
    kind: rule
    title: P-DESIGN-022 neutral tokenized material
    modality: must
    statement: Glass background, border, blur, and saturation resolve through neutral foundation material and backdrop tokens with light and dark values, and accent packs neither own nor override those material values.
    condition: Whenever a glass material is defined, themed, or rendered.
    failure: Reject inline visual material values, absent scheme values, or accent-coupled material tokens.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.ui-material
  - id: rule.nimi.platform.ui-design-system.p-design-022c
    kind: rule
    title: P-DESIGN-022 transparency fallback
    modality: must
    statement: A glass consumer preserves legibility without backdrop filtering and downgrades to solid for a reduced-transparency preference.
    condition: Whenever backdrop filtering is unsupported or reduced transparency is requested.
    failure: Replace the glass result with the required legible fallback rather than displaying unsupported or inaccessible material.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.ui-material
  - id: rule.nimi.platform.ui-design-system.p-design-023
    kind: rule
    title: P-DESIGN-023 ambient background contract
    modality: must
    statement: Ambient backgrounds use mesh, minimal, or default none as governed surfaces; mesh derives composition and neutral light and dark color slots from ambient tokens, permits accent-slot overrides without structural change, stops halo motion for reduced motion, and falls back to minimal or none for reduced transparency.
    condition: Whenever a governed surface renders an ambient background.
    failure: Reject an ad hoc decorative implementation, raw gradient or color value, missing foundation value, structurally changing accent override, or ignored accessibility preference.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.ambient-system
  - id: rule.nimi.platform.ui-design-system.p-design-024a
    kind: rule
    title: P-DESIGN-024 reusable taxonomy families
    modality: must
    statement: Shared taxonomy admits app-background, regular-glass, elevated-glass, navigation, floating-panel, and modal-shell surface roles; page-title, section-title, card-title, body, helper, label, caption, and CJK typography roles; button, icon-button, segmented-control, text, search, select, textarea, toggle, checkbox, slider, stepper, and tab controls; badge, progress, alert, empty, loading, error, success, tooltip, menu, popover, confirmation, and settings-shell roles; focus, selection, primary-action, active-navigation, subtle-tint, and confirming accent roles; fixed companion-color tokens; and soft-status background, border, and text tokens without admitting product placement, data models, settings structure, or unavailable component APIs.
    condition: Whenever UI Card v2.1 taxonomy informs a governed surface.
    failure: Reject app composition truth, raw palette and status values, or an API not admitted by the executable primitive contract.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.design-pattern
  - id: rule.nimi.platform.ui-design-system.p-design-024b
    kind: rule
    title: P-DESIGN-024 density taxonomy separation
    modality: must
    statement: Density-mode taxonomy remains separate from reusable platform composition rows and does not use composition registry entries to carry density guidance.
    condition: Whenever density or composition taxonomy is represented.
    failure: Separate density semantics from component composition records.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.density-system
  - id: rule.nimi.platform.ui-design-system.p-design-025
    kind: rule
    title: P-DESIGN-025 composition extraction boundary
    modality: must
    statement: Desktop reference compositions may identify reusable shell, navigation, control, panel, list, badge, avatar, stat, and meter primitive gaps but do not become platform-owned dock, status-bar, workflow, metric, world-data, contact, route, or panel-placement truth, and an ambiguous candidate remains app-local until reusable abstraction is established.
    condition: Whenever a Desktop reference composition is evaluated for shared extraction.
    failure: Reject the app composition as platform truth and retain only a proven reusable primitive abstraction.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.governed-surface
  - id: rule.nimi.platform.ui-design-system.p-design-026
    kind: rule
    title: P-DESIGN-026 anti-drift product patterns
    modality: must_not
    statement: A governed product surface introduces a marketing hero, oversized gradient card, random accent palette, plain native form style, dense border-first form grid, or ad hoc heavy-shadow card when a shared primitive family covers the need.
    condition: Whenever a governed product surface selects a visual pattern.
    failure: Replace the negative pattern with compact, glass-based, token-governed, component-led UI unless a narrow app-owned exception preserves shared authority.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.governed-surface
  - id: rule.nimi.platform.ui-design-system.p-design-027a
    kind: rule
    title: P-DESIGN-027 unified motion scale
    modality: must
    statement: CSS and typed animation code resolve one fast, base, slow, and ambient duration scale and one standard, emphasized, decelerated, and accelerated easing scale from shared motion tokens without divergent hardcoded values.
    condition: Whenever governed motion timing or easing is resolved.
    failure: Reject a divergent duration, easing, or parallel motion scale.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.motion-system
  - id: rule.nimi.platform.ui-design-system.p-design-027b
    kind: rule
    title: P-DESIGN-027 immediate pressed feedback
    modality: must
    statement: Every interactive primitive produces visible pressed feedback within one frame through the shared pressed-scale token or an admitted token-driven equivalent independent of hover.
    condition: Whenever pointer-down occurs on an interactive primitive.
    failure: Treat delayed, release-only, or hover-only feedback as non-conforming.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.motion-system
  - id: rule.nimi.platform.ui-design-system.p-design-027c
    kind: rule
    title: P-DESIGN-027 overlay and gesture causality
    modality: must
    statement: Governed overlays enter and exit symmetrically through Kit spring motion anchored to their spatial source, and gesture settles begin at the live presentation value with inherited pointer velocity and admitted decay projection rather than a fixed-duration or app-authored substitute.
    condition: Whenever an overlay transitions or a gesture-driven surface settles.
    failure: Reject asymmetric paths, lost velocity, logical-target restarts, overlay keyframes, or app-owned projection math.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.motion-system
  - id: rule.nimi.platform.ui-design-system.p-design-027d
    kind: rule
    title: P-DESIGN-027 functional property boundary
    modality: must_not
    statement: A governed component uses transition-all or animates non-compositor layout properties for functional travel when transform and opacity suffice.
    condition: Whenever a governed functional transition is authored.
    failure: Restrict travel to transform and opacity and state changes to admitted color or shadow properties.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.motion-system
  - id: rule.nimi.platform.ui-design-system.p-design-027e
    kind: rule
    title: P-DESIGN-027 reduced-motion causality
    modality: must
    statement: Reduced motion preserves feedback and spatial causality by cross-fading overlays in place, making pressed feedback instantaneous, and stopping ambient, looping, and parallax motion rather than relying only on a global duration guard.
    condition: Whenever reduced motion is requested.
    failure: Replace travel and looping motion with the required reduced-motion substitutions.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.motion-system
  - id: rule.nimi.platform.ui-design-system.p-design-028a
    kind: rule
    title: P-DESIGN-028 density runtime boundary
    modality: must
    statement: Density uses compact, regular, or expressive at a page or composition boundary through the shared scheme runtime, defaults to regular, permits expressive subtree restoration inside compact regions, and does not use per-control height or radius overrides to simulate density.
    condition: Whenever a governed surface selects or changes density.
    failure: Reject an unknown value, ad hoc control override, or density state outside the shared runtime axis.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.density-system
  - id: rule.nimi.platform.ui-design-system.p-design-028b
    kind: rule
    title: P-DESIGN-028 density pack boundaries
    modality: must
    statement: Compact density packs override only sizing and typography tokens, governed consumers load the shared density pack, Desktop operational surfaces default compact, and identity or hero surfaces use expressive only at an admitted composition boundary.
    condition: Whenever a density pack is defined or a governed surface consumes density.
    failure: Reject an out-of-family token override, missing density pack, or unadmitted composition-level density choice.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.density-system
  - id: rule.nimi.platform.ui-design-system.p-agent-center-001a
    kind: rule
    title: P-AGENT-CENTER-001 public Kit surface ownership
    modality: must
    statement: Kit owns the AgentCenter component's shared layout, typed controls, loading, failure, disabled, and responsive behavior while combining Runtime-owned LocalAgent projections with bounded Kit Shell asset custody; Desktop and every protected App whose current session has agent.configure coverage may mount the same public Kit surface through the canonical App Operation Contract, and Nimi ownership, bundling, incubation, rollout order, or third-party status creates no additional eligibility class.
    condition: Whenever AgentCenter is rendered or integrated.
    failure: Reject an app fork of shared behavior, a private operation path, treatment of rollout staging as access eligibility, or ownership transfer of Runtime LocalAgent truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.agent-center-surface
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-module-surface
  - id: rule.nimi.platform.ui-design-system.p-agent-center-001b
    kind: rule
    title: P-AGENT-CENTER-001 Runtime and resource ownership boundary
    modality: must_not
    statement: AgentCenter owns LocalAgent execution, lifecycle, Conversation, Memory or Knowledge content, events, Machine Loadout store, Loadout, machine selection, AI resources, configuration persistence, authorization, semantic presentation selection, Avatar lifecycle, render truth, backend readiness, calibration, or launch truth.
    condition: Whenever AgentCenter consumes or edits LocalAgent state.
    failure: Keep the truth with Runtime, Cognition, SDK custody, Avatar, or Kit Shell as applicable and expose only a typed bounded projection.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.runtime-projection
  - id: rule.nimi.platform.ui-design-system.p-agent-center-001c
    kind: rule
    title: P-AGENT-CENTER-001 bounded staged integration
    modality: must
    statement: AgentCenter consumers may supply presentation-tier inputs for standalone or embedded chrome, layout, density, and active semantic area plus the sealed canonical Manager Session, copy, navigation, and placement callbacks, while access facts, arbitrary feature panels, private bridges, raw Agent or account identity, raw context, prompts, Memory or Knowledge content, proof, provider credential, Connector endpoint, and tool payloads remain outside component props; every protected App with current agent.configure coverage integrates through the same public Kit surface and exact canonical App operations.
    condition: Whenever a consumer integrates AgentCenter or a staged rollout is evaluated.
    failure: Reject an authority-bearing prop, untyped or App-authoritative input, raw data, private adapter, speculative integration, or treatment of the current staging sequence as a permanent eligibility boundary.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.agent-center-surface
  - id: rule.nimi.platform.ui-design-system.p-agent-center-002a
    kind: rule
    lifecycle: removed
    title: P-AGENT-CENTER-002 complete generic sections
    reason: Superseded by the public successor contract of 2026-07-29; deleted without tombstone in d1e7034d8.
  - id: rule.nimi.platform.ui-design-system.p-agent-center-002c
    kind: rule
    title: P-AGENT-CENTER-002 complete semantic areas and identity chrome
    modality: must
    statement: A complete AgentCenter provides Overview, Appearance, Behavior, Memory, shared LocalAgent AIConfig, Cognition, and Diagnostics or Advanced as required semantic areas and supplies canonical Agent identity chrome; this complete capability set is preserved through one canonical Manager Session, factory, SDK client, and agent.configure operation family for Desktop and every equally eligible protected App and never converges by deleting a section or action, treating the current smallest App implementation as a denominator, or retiring an old path before an equivalent or more complete canonical replacement is active; Memory remains a semantic area of this existing AgentCenter rather than a separate product center; the AI area lets the user select route-only Local or exact Cloud Connector, implementation, and target options under current agent.configure coverage, displays the current machine-selected Local model and health without making it a per-owner picker, and presents data-egress, provider, and shared-scope consequences as non-blocking information before one Save without a second permission, grant, approval, or confirmation gate; concrete tabs, ordering, layout, and responsive collapse remain presentational and host-configurable without allowing an App to hand-copy the identity chrome, own Loadout or Connector content, or offer a per-Agent route override.
    condition: Whenever the complete AgentCenter surface is presented.
    failure: Reject a missing, empty-shell, permanently unavailable, or first-party-dependent semantic area or action, a capability-reducing convergence, hidden shared Cloud consequence, per-Agent route implication, app-owned identity-chrome copy, or hardcoded tab structure presented as semantic authority.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.agent-center-surface
      - type: supersedes
        target: rule.nimi.platform.ui-design-system.p-agent-center-002a
  - id: rule.nimi.platform.ui-design-system.p-agent-center-002b
    kind: rule
    title: P-AGENT-CENTER-002 bounded context summary
    modality: must
    statement: The AgentCenter context summary may render only bounded read-only state, reason, source availability, budget, truncation, count, and safe correlation facts without rendering or reconstructing source, prompt, Conversation, Memory or Knowledge content, proof, provider, credential, or tool context; the separately authorized Memory semantic area does not widen this closed context-summary projection, and this context summary is not AI capability readiness or execution admission.
    condition: Whenever AgentCenter presents LocalAgent context status.
    failure: Treat unknown or raw context as unavailable and do not reconstruct execution input.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.runtime-projection
  - id: rule.nimi.platform.ui-design-system.p-agent-center-003
    kind: rule
    title: P-AGENT-CENTER-003 no local persisted config
    modality: must_not
    statement: AgentCenter persists App-local or Kit-local Runtime configuration, temporary import or renderer state as committed success, Conversation history, Memory, Knowledge, authorization, Machine Loadout store, Loadout, machine selection, or private host bridges; Runtime owns LocalAgent and presentation selections, the machine owner surface owns Prepare, Commit, Select including explicit clearing, and Delete Loadout, and Kit Shell owns only bounded temporary import custody.
    condition: Whenever AgentCenter reads, changes, imports, renders, or persists state.
    failure: Remove the local record or bridge and require committed Runtime presentation truth plus bounded temporary Kit Shell custody.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.agent-center-surface
  - id: rule.nimi.platform.ui-design-system.p-agent-center-004
    kind: rule
    title: P-AGENT-CENTER-004 Runtime-owned voice split
    modality: must
    statement: AgentCenter reads and commits the default voice reference only through the admitted Runtime presentation-profile operation, configures the audio.transcribe route only in the one shared LocalAgent subsystem AIConfig, and invokes neither voice generation nor transcription execution; it never chooses a machine Loadout, creates an App-local voice operation, or transfers voice truth to the host App.
    condition: Whenever LocalAgent voice, transcription, or audio configuration is read, changed, generated, or executed.
    failure: Reject an AI-config-owned default voice, app-local audio truth, direct execution, or pseudo artifact and retain the applicable Runtime owner path.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.runtime-projection
  - id: rule.nimi.platform.ui-design-system.p-agent-center-005a
    kind: rule
    title: P-AGENT-CENTER-005 typed dependency boundary
    modality: must_not
    statement: Production AgentCenter imports Runtime internals, App code, SDK-private modules, or App aliases instead of the public Kit SDK contract or explicitly injected typed adapters.
    condition: Whenever AgentCenter obtains Runtime or App capability.
    failure: Remove the private dependency and consume only the typed public projection or adapter.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-module-surface
  - id: rule.nimi.platform.ui-design-system.p-agent-center-005b
    kind: rule
    title: P-AGENT-CENTER-005 closed LocalAgent inputs
    modality: must
    statement: AgentCenter accepts only bounded source readiness and turn-context status; unknown or partial state becomes unavailable or failed, and no adapter assembles, overrides, or attaches LocalAgent context.
    condition: Whenever AgentCenter receives a LocalAgent projection.
    failure: Fail closed in the UI and reject raw, partial, or context-authoring input.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.runtime-projection
  - id: rule.nimi.platform.ui-design-system.p-agent-center-006a
    kind: rule
    lifecycle: removed
    title: P-AGENT-CENTER-006 surface ownership mapping
    reason: Superseded by the public successor contract of 2026-07-29; deleted without tombstone in d1e7034d8.
  - id: rule.nimi.platform.ui-design-system.p-agent-center-006c
    kind: rule
    title: P-AGENT-CENTER-006 single canonical Manager Session and factory
    modality: must
    statement: Each mounted AgentCenter has exactly one canonical factory and Manager Session that own its snapshot, refresh, mutation, typed action availability, commit, and one section model and bind the same agentHandle-addressed agent.configure App client for bounded manager snapshot, shared AIConfig, autonomy, presentation, and Memory operations; Desktop, protected Apps, production, and Simulator use that same factory, operation semantics, state logic, and result or error mapping, and no first-party factory may add inspect, Memory, Cognition, Diagnostics or Advanced, or appearance product transports; a Host may inject only bounded file selection, Avatar preview, temporary asset custody, native placement, and navigation mechanics beneath the same Manager appearance action and committed presentation result without owning product state, eligibility, or availability; React props are limited to UI and UX inputs for chrome, layout, density, active section, locale, and placement callbacks; and the pre-1.0 hard cut admits no legacy seed authority, per-adapter AIConfig props, compatibility copy objects, caller-owned access posture, raw identity, per-Agent AIConfig, carrier branch inside presentation state, or parallel state path.
    condition: Whenever AgentCenter state, sections, sessions, transports, factories, or React props are constructed.
    failure: Reject a missing or second factory or Manager Session, divergent store, Desktop-only or Simulator-only product transport, stateful Host mechanics adapter, capability loss, authority-bearing prop, caller-assembled authority, legacy compatibility input, or carrier distinction implemented inside presentation state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.agent-center-surface
      - type: supersedes
        target: rule.nimi.platform.ui-design-system.p-agent-center-006a
  - id: rule.nimi.platform.ui-design-system.p-agent-center-006b
    kind: rule
    title: P-AGENT-CENTER-006 intent presentation and truth separation
    modality: must_not
    statement: Kit or an App promotes bounded summary fields into source, prompt, context, Memory, Knowledge, proof, authorization, or execution authority; Apps own only LocalAgent intent capture, placement, copy, navigation, and bounded presentation while Runtime owns source, context, and execution truth.
    condition: Whenever bounded LocalAgent state is rendered or used by an App.
    failure: Reject the promoted authority and return to the Runtime-owned typed projection.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.runtime-projection
  - id: rule.nimi.platform.ui-design-system.p-agent-center-007
    kind: rule
    title: P-AGENT-CENTER-007 closed product-action availability projection
    modality: must
    statement: The single Manager Session materializes from Runtime or SDK truth the only action-availability projection AgentCenter consumes, covering the bounded manager snapshot for Overview, Behavior, Cognition, and Diagnostics or Advanced, admitted shared LocalAgent AIConfig get, compare-and-swap overwrite, bounded current Local selection projection and Cloud options, autonomy, bounded Memory read plus correct, forget, switch, and delete, complete appearance selection and imported-asset commit, restore, voice, autoplay, validation, and committed preview, and presentation selection; at equal operation coverage Desktop and every protected App receive identical section and action availability, typed results, and typed errors, while native mechanics differences never change product capability; each action is available or unavailable with one typed owner reason such as runtime-offline, owner-rejected, selection-required, unsupported, operation-unavailable, or unknown and an admitted retry or resource-owner handoff, while AgentCenter receives no Loadout or Connector content mutation, AppOperationId, Effective App Access Snapshot, carrier discriminator, credential, Connector endpoint, account identity, raw Agent identity, prompt or private reasoning, internal score or generation, provider, model, or storage detail through props or state and callers cannot assemble or override availability.
    condition: Whenever AgentCenter action availability, degraded state, props, or state are materialized.
    failure: Fail closed and reject caller-supplied authority facts, an action outside the closed projection, static or carrier-specific availability, an untyped or collapsed unavailable reason, a non-admitted next step, leaked authority material or identity, carrier-specific presentation state, capability removal or empty-shell convergence, or a misleading enabled state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.agent-center-surface
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.runtime-projection
  - id: rule.nimi.platform.ui-design-system.p-agent-center-008
    kind: rule
    title: P-AGENT-CENTER-008 presentation auto-save custody and rendering boundary
    modality: must
    statement: Before file selection AgentCenter warns that a successful selection immediately replaces the current appearance; the same canonical Manager factory may consume a Host mechanics adapter that owns only file selection, bounded temporary import custody, and native Avatar preview without receiving raw Agent or account identity, deciding eligibility, committing Runtime state, or creating a second appearance projection, while Kit Shell never owns long-term Avatar asset custody; the canonical agentHandle-addressed presentation operation carries admitted imported assets, the Runtime asset subsystem owns validation, official storage, integrity, and cleanup, the Runtime LocalAgent presentation profile owns the current selection, AgentCenter shows saving state, the committed current effect, typed render failure distinct from save failure, and restore-previous recovery, and Avatar renders only the committed asset, while a failed save leaves the current selection unchanged.
    condition: Whenever an appearance file is selected, imported, saved, rendered, fails after save, or is explicitly restored.
    failure: Reject a missing pre-selection warning, raw-path transfer, long-term Kit custody, Kit-owned validation or persistence, a product-level pre-commit candidate or preview, rendering of an uncommitted asset, fabricated render success, or automatic rollback after render failure.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.agent-center-surface
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.runtime-projection
  - id: rule.nimi.platform.ui-design-system.p-agent-center-009
    kind: rule
    title: P-AGENT-CENTER-009 canonical localization catalog
    modality: must
    statement: Kit AgentCenter owns its canonical localization key catalog and ships base translations for every supported language as package data; Apps may override individual keys only through the injected localization seam and neither fork nor re-own the catalog; and a missing active-language translation falls back to the Kit base language rather than a raw key.
    condition: Whenever AgentCenter copy is published, resolved, translated, or overridden.
    failure: Reject an App-owned catalog fork, missing shipped base translation, bypassed localization seam, or raw-key fallback.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.agent-center-surface
  - id: rule.nimi.platform.ui-design-system.p-agent-center-010
    kind: rule
    title: P-AGENT-CENTER-010 participation is independent Manager truth
    modality: must
    statement: The single AgentCenter Manager Session consumes one ordered Runtime-owned participation projection containing exactly text.generate as conversation.primary, text.embed as memory.embedding, audio.transcribe as conversation.input.voice, audio.synthesize as conversation.output.voice, realtime.interact as conversation.realtime, and image.generate as conversation.action.image; it uses those six rows as the capability denominator and joins configured intents and effective selections separately, so absent config, clear, overwrite success or conflict, and effective-selection failure retain six unconfigured or configured rows without creating intents or dynamically removing the Realtime row. Kit removes any configured-capabilities parallel list and hardcoded capability pair, derives ModelConfig capability inputs from participation, labels text.embed as internal embedding support that may serve active Memory V1 rather than a user action, keeps Knowledge V1 inactive without deriving a Knowledge capability, permission, configuration, or UI from that row, keeps deferred capabilities absent, and preserves the same state and behavior for every formal App factory without changing the generic ModelConfig editor or accepting caller-owned participation, readiness, host support, or operation authority through React props.
    condition: Whenever AgentCenter loads, refreshes, overwrites, clears, reduces, or renders shared LocalAgent AI configuration and participation.
    failure: Reject missing, duplicate, reordered, deferred, cross-paired, configured-only, catalog-derived, caller-supplied, readiness-bearing, or carrier-divergent participation; fail closed as manager unavailable without synthesizing rows when the Runtime participation projection itself is unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.agent-center-surface
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.runtime-projection
  - id: rule.nimi.platform.ui-design-system.p-agent-center-011a
    kind: rule
    title: P-AGENT-CENTER-011 bounded Memory section projection
    modality: must
    statement: The dedicated Memory semantic area in the existing AgentCenter receives the current user's authorized projection of the selected LocalAgent's private Memory only through the single Manager Session and may display only human-readable Memory content, current status, bounded time, and a bounded source explanation classified exactly as explicit, inferred, or consolidated; it never displays or reconstructs score, ranking, algorithm, policy, generation metadata, raw prompt, reasoning, internal reference, storage identity, hash, provider, model, full transcript, raw source, Cognition corpus or unit content, or private recall payload.
    condition: Whenever AgentCenter loads, refreshes, or renders the Memory semantic area.
    failure: Reject an over-broad, caller-authored, raw, unknown, or partially reconstructed Memory projection and show the typed owner unavailable or failure state without widening the context summary.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.agent-center-surface
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.runtime-projection
  - id: rule.nimi.platform.ui-design-system.p-agent-center-011b
    kind: rule
    title: P-AGENT-CENTER-011 Runtime-mediated Memory actions
    modality: must
    statement: Memory correct, forget, switch, and delete submit only typed current-user intent through the single Manager Session and Runtime mediation to the applicable owner, with Runtime alone committing the Agent-scoped enabled switch and Cognition alone committing canonical Memory correction, forget, and delete-all effects; every action inherits the same current-session agent.configure eligibility and per-operation owner revalidation as the existing AgentCenter, preserves typed pending, committed, conflict, unavailable, and failure outcomes, and creates no Cognition permission, grant, approval, protected-App special plane, corpus or scope control, prompt or context authority, authorization bypass, caller-owned availability, local mutation truth, automatic action chain, or pseudo-success. The existing new-Agent or AgentCenter presentation clearly discloses that a newly created Agent's default-enabled Memory is private to that Agent without adding a confirmation gate, while an implementation-precut existing Agent remains disabled until the user explicitly enables its Memory switch.
    condition: Whenever AgentCenter presents, enables, invokes, retries, or completes a Memory action.
    failure: Fail closed through the Manager action-availability projection, leave Runtime mediation state and Cognition Memory truth unchanged without a committed owner result, and reject any direct host, App, Cognition, provider, model, or local persistence path.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.agent-center-surface
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.runtime-projection
  - id: rule.nimi.platform.ui-design-system.p-design-022d
    kind: rule
    title: P-DESIGN-022 material token interface and radii
    modality: must
    statement: Governed surfaces consume material through the shared Surface material interface or equivalent material marker; solid resolves through surface tone without material background or border tokens; glass-thin, glass-regular, glass-thick, and glass-chrome resolve through matching material background and border tokens and blur-thin 10, blur-regular 18, blur-strong 24, and blur-chrome 28 pixel tokens, with no sixth tier pre-authorized.
    condition: Whenever the material token interface is declared or consumed.
    failure: Reject a mismatched token, obsolete blur radius, inline material value, or unadmitted tier.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.ui-material
  - id: rule.nimi.platform.ui-design-system.p-design-022e
    kind: rule
    title: P-DESIGN-022 transparency downgrade interface
    modality: must
    statement: Transparency level is auto, none, reduced, or full; solid never changes, none maps every glass tier to solid, reduced maps thin to solid, regular to thin, thick to regular, and chrome to thick, full preserves input, auto equals full under no preference and collapses to reduced or to none when the operating-system preference disables transparency, and every downgrade is idempotent and independent of accent packs.
    condition: Whenever runtime material performance or accessibility policy downgrades a tier.
    failure: Reject an unknown level, noncanonical mapping, non-idempotent result, or accent-dependent downgrade.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.ui-material
  - id: rule.nimi.platform.ui-design-system.p-design-022f
    kind: rule
    title: P-DESIGN-022 material contrast threshold
    modality: must
    statement: Every material-tier and surface-tone combination over the expected app background provides WCAG 2.1 AA contrast of at least 4.5 to 1 for normal text and 3 to 1 for large text, and body text on thin glass over noisy ambient content gains an opaque text surface or downgrades under reduced transparency.
    condition: Whenever text is rendered on a governed material surface.
    failure: Reject the combination or apply the required legible surface or downgrade.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.ui-material
  - id: rule.nimi.platform.ui-design-system.p-design-022g
    kind: rule
    title: P-DESIGN-022 material role matrix
    modality: must
    statement: Canvas uses solid with operational ambient motion off by default outside expressive boundaries, structural chrome uses chrome or thick glass, content uses solid, thin, or regular glass, and floating or modal surfaces use regular through chrome glass according to overlay kind; glass content does not nest equal or stronger glass and stacked sheets dim or push back instead of stacking equal-strength layers.
    condition: Whenever a governed material is assigned to a spatial role.
    failure: Reject a tier outside the role, equal-strength nesting, or flattened stacked-sheet hierarchy.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.ui-material
  - id: rule.nimi.platform.ui-design-system.p-design-022h
    kind: rule
    title: P-DESIGN-022 material stacking and vibrancy
    modality: must
    statement: One region overlaps at most one structural, one content, and one floating material layer, and glass combines its blur with the shared 180-percent saturation token through Kit-emitted classes rather than handwritten backdrop filters.
    condition: Whenever material layers overlap or render over changing content.
    failure: Reject excess overlap, same-role equal-or-stronger glass stacking, or hand-authored saturation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.ui-material
  - id: rule.nimi.platform.ui-design-system.p-design-022i
    kind: rule
    title: P-DESIGN-022 no admitted material exceptions
    modality: must_not
    statement: A governed material bypasses the fixed contrast threshold or role and stacking semantics through an exception.
    condition: While the admitted material exception set is empty.
    failure: Reject the exception and apply the default material contract.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.ui-material
  - id: rule.nimi.platform.ui-design-system.p-design-027f
    kind: rule
    title: P-DESIGN-027 interaction state model
    modality: must
    statement: Every interactive primitive supports idle without operational looping, hover through subtle token color or border change without lift, same-frame 0.97-scale pressed feedback, one-to-one dragging from grab offset, velocity-preserving settling from live state, and interruption without input lockout.
    condition: Whenever an interactive primitive enters an interaction state.
    failure: Reject a skipped state, hover-only substitute, end-only dragging update, stale restart, or locked input.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.motion-system
  - id: rule.nimi.platform.ui-design-system.p-design-027g
    kind: rule
    title: P-DESIGN-027 exact duration and easing values
    modality: must
    statement: Motion fast is 120 milliseconds for presses, hover, and toggles, base is 200 for standard state changes, slow is 320 for overlay fades and reduced-motion fallback, and ambient is 600 only for ambient and theme changes; standard easing is cubic-bezier 0.2, 0, 0, 1, emphasized is 0.05, 0.7, 0.1, 1 for mirrored overlays, decelerated is 0, 0, 0, 1 for enter-only fallback, and accelerated is 0.3, 0, 1, 1 for exit-only fallback.
    condition: Whenever a governed duration or easing token is resolved.
    failure: Reject any divergent CSS or typed-code value.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.motion-system
  - id: rule.nimi.platform.ui-design-system.p-design-027h
    kind: rule
    title: P-DESIGN-027 spring presets
    modality: must
    statement: The default spring uses 0.4-second response and 1.0 damping without overshoot for overlays and repositioning, the momentum spring uses 0.35-second response and 0.8 damping only after a velocity-carrying gesture, two-dimensional motion uses independent axes, and retargeting blends current velocity.
    condition: Whenever governed motion uses a spring.
    failure: Reject an unknown preset, unearned bounce, coupled axes, or velocity-reset retargeting.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.motion-system
  - id: rule.nimi.platform.ui-design-system.p-design-027i
    kind: rule
    title: P-DESIGN-027 momentum projection
    modality: must
    statement: Gesture settlement hands raw pointer velocity to absolute-velocity springs or normalizes it by target minus current value for relative-velocity springs, projects the endpoint as current position plus release velocity divided by 1000 times d divided by one minus d using d 0.998 for scroll-like or 0.99 for snappier settlement, snaps to the nearest projected target, and compares explicit origin and target destinations without assuming zero.
    condition: Whenever a governed gesture ends or chooses commit versus reverse.
    failure: Reject a seam, incorrect velocity convention, noncanonical decay, or implicit zero destination.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.motion-system
  - id: rule.nimi.platform.ui-design-system.p-design-027j
    kind: rule
    title: P-DESIGN-027 overlay motion grammar
    modality: must
    statement: Dialogs fade and scale from 0.95 around center or known trigger, drawers translate only on their edge axis without scale, popovers and menus fade and scale from 0.96 with a four-pixel side-aware offset and trigger-facing origin, all reverse symmetrically, and backdrops animate opacity only with slow standard easing.
    condition: Whenever a governed overlay enters or exits.
    failure: Reject motion that violates the overlay-kind path, origin, symmetry, or backdrop boundary.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.motion-system
  - id: rule.nimi.platform.ui-design-system.p-design-027k
    kind: rule
    title: P-DESIGN-027 admitted animation substrate
    modality: must
    statement: Governed surfaces use the Kit motion layer as their sole animation library, retain CSS transitions only for micro-state and color behavior, limit CSS keyframes to ambient backgrounds and loading indicators, and do not use app-authored animation-frame loops for overlays or gestures.
    condition: Whenever governed animation is implemented.
    failure: Remove the second library, prohibited keyframe, or hand-rolled loop and use the shared substrate.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.motion-system
  - id: definition.nimi.platform.ui-design-system.model-config-surface
    kind: definition
    title: Public Kit model-config surface
    meaning: Model-config is the public Kit feature module for host-neutral typed composition of canonical App or shared LocalAgent AIConfig get, compare-and-swap overwrite, clear, lightweight effective selected-resource state, route-only Local choice, and bounded Cloud option selection without app-authored, feature-local, or per-Agent shadow truth; a protected App with runtime.consume may edit only its own App owner and one with agent.configure may edit only the account-scoped shared LocalAgent owner, Desktop may edit only currently projected App owners, and no context receives Connector credentials, endpoints, account identity, generic Connector CRUD, Loadout content mutation, per-owner Local Loadout selection, or a host-specific configuration capability.
  - id: definition.nimi.platform.ui-design-system.model-picker-surface
    kind: definition
    title: Public Kit model-picker surface
    meaning: Model-picker is a non-committing public Kit discovery and choice module that may browse, filter, compare, and apply user-directed ordering to owner-supplied candidates and returns one typed choice for a later canonical owner action; it owns no catalog, automatic ranking, routing, AIConfig mutation, Machine Loadout store selection, or resource binding truth.
  - id: definition.nimi.platform.ui-design-system.machine-local-ai-surface
    kind: definition
    title: Machine Loadout owner surface
    meaning: The Machine Loadout owner surface is the Runtime resource-lifecycle surface for listing Loadouts and invoking Prepare Loadout, Commit Loadout, Select Loadout, and Delete Loadout in the one Machine Loadout store; UpdateLoadout is only a Prepare-plus-Commit convenience, no independent bind, unbind, rebind, reprojection, or Clear action exists, and Select owns the current machine-wide Loadout choice per CapabilityContract without copying it into Agent Center or an App AIConfig editor or transferring Loadout content, ModelAssets, or resource mutation authority.
  - id: rule.nimi.platform.ui-design-system.p-model-config-001
    kind: rule
    title: P-MODEL-CONFIG-001 public shared configuration surface
    modality: must
    statement: Model-config follows the Kit public-module, dependency, and portable-feature rules, consumes the canonical CapabilityContract and standardized-feature catalog, and mounts for exactly one canonical App or shared LocalAgent owner; a protected App with runtime.consume may get, compare-and-swap overwrite, clear, and list bounded options only for its own App AIConfig, a protected App with agent.configure may perform the same actions only for the account-scoped shared LocalAgent AIConfig, and Desktop may manage currently projected App owners through the same public manager contract without becoming the exclusive path. Local choice saves only the route and displays safe current machine-selected Loadout metadata from effective projection even when missing or blocked, while Cloud option selection exposes safe Connector, implementation, and target metadata; credential, endpoint, generic Connector CRUD, per-owner Local Loadout picker, Loadout content mutation, public readiness, probe, warm, install-as-apply, fallback, stub, and unsupported parameters remain outside the surface.
    condition: Whenever model-config is published, integrated, or rendered.
    failure: Reject a private or parallel model-config surface, per-Agent or App-local shadow truth, an owner selector from a protected App, App self-mutation without runtime.consume, shared LocalAgent mutation without agent.configure, Desktop management of a non-projected owner, Connector credential or generic CRUD exposure, Loadout content mutation, catalog shadow, fabricated config or effective health, unsupported control, extra permission or confirmation gate, or Profile apply that mutates resource-owned truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-module-family
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-public-surface
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.model-config-surface
  - id: rule.nimi.platform.ui-design-system.p-model-picker-001
    kind: rule
    title: P-MODEL-PICKER-001 non-committing discovery and choice
    modality: must
    statement: Model-picker follows the Kit public-module, dependency, and portable-feature rules, consumes but never redeclares or shadows the Kit-core code-generated canonical CapabilityContract and standardized-feature catalog, accepts only typed owner-supplied candidates, may browse, filter, compare, and apply user-directed ordering, and returns one typed choice without committing it; AIConfig route mutation, Prepare and Commit Loadout, and Select Loadout remain distinct explicit actions on their canonical owner surfaces, and search or ordering never automatically decides any route, model axis, or selection.
    condition: Whenever model-picker is published, integrated, browses candidates, or returns a choice.
    failure: Reject a private module, handwritten capability catalog, direct app seam, provider or model hardcoding, caller-fabricated owner, automatic ranking as routing authority, ambiguous choice, direct commit, or cross-owner mutation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-module-family
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-public-surface
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.model-picker-surface
  - id: rule.nimi.platform.ui-design-system.p-machine-local-ai-001
    kind: rule
    title: P-MACHINE-LOCAL-AI-001 machine owner actions stay separate
    modality: must
    statement: The Machine Loadout owner surface presents zero or more flat saved Loadouts per CapabilityContract and at most one current machine selection, permits unresolved Loadouts to remain saved, and exposes only Prepare, Commit, Select, and Delete Loadout. Select either sets an eligible non-empty selection or explicitly clears it; clearing preserves every Loadout and ModelAsset, changes no AIConfig or captured Job, and chooses no replacement, while the current selection supplies Local resource choice only for future Jobs whose canonical owner AIConfig commits Local for the same CapabilityContract. A later-invalid selected Loadout preserves its exact axes and every committed Local intent, projects the applicable typed derived-admission reason, and the surface never starts a Job, probes or prewarms an ExecutionHost, or automatically reselects. AIConfig Save requires no second permission or confirmation gate, while Select set or clear, execution-relevant Commit over the selected Loadout, and Delete of the selected Loadout require the machine owner surface to display future matching Local App/shared LocalAgent impact and obtain explicit confirmation; confirmation rewrites no AIConfig or captured Job and grants no App veto.
    condition: Whenever Loadouts or selection are presented, prepared, committed, set, cleared, or deleted.
    failure: Reject hidden ownership, App or Agent scoped Local selection, draft or history state, independent bind, unbind, rebind, reprojection, or Clear actions, deletion required for selection clearing, copying selection into AIConfig, rereading selection after Job publication, an extra AIConfig permission gate, missing required machine-impact confirmation, probe-driven selection, automatic re-arbitration, or cross-owner mutation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.machine-local-ai-surface
  - id: definition.nimi.platform.ui-design-system.kit-module-family
    kind: definition
    title: Kit module family
    meaning: A Kit module is a demand-driven integration above the SDK with a bounded owner and dependency direction, admitted only for a concrete Nimi Home, Avatar, Simulator, or Third-party reference App consumer and real journey rather than to complete a catalog or framework taxonomy.
  - id: definition.nimi.platform.ui-design-system.kit-public-surface
    kind: definition
    title: Kit public surface
    meaning: A Kit public surface is an explicitly delivered typed package, native-host, headless, UI, Runtime-aware, Realm-aware, adapter, or backend-renderer entrypoint consumable without private app, Runtime, SDK, or host implementation access.
  - id: definition.nimi.platform.ui-design-system.kit-dependency-boundary
    kind: definition
    title: Kit dependency boundary
    meaning: A Kit dependency boundary is the directed import and ownership constraint that keeps reusable modules independent of app code, private Runtime and SDK code, platform bridge implementations, foreign product truth, and undeclared host assumptions.
  - id: rule.nimi.platform.ui-design-system.p-kit-001
    kind: rule
    title: P-KIT-001 single package and reuse authority
    modality: must
    statement: The Nimi Kit package is the single cross-app authority for shared platform infrastructure, delivers UI, authentication, core, telemetry, feature, shell-capability, renderer-shell, and Electron-shell modules through explicit public subpaths, and apps consume rather than duplicate covered capabilities.
    condition: Whenever cross-app platform infrastructure is published, consumed, or implemented by an app.
    failure: Reject a parallel package, private entrypoint, or app-local duplicate.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-module-surface
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-public-surface
  - id: rule.nimi.platform.ui-design-system.p-kit-003
    kind: rule
    title: P-KIT-003 package host and dependency boundary
    modality: must
    statement: Kit remains one workspace package; its modules never import app or Runtime-internal code; TypeScript apps use explicit Kit subpaths; standard shell identifiers, commands, and errors come from the shell-capabilities surface; Tauri hosts consume the shared non-npm Rust surface; Electron main and preload consume the Electron surface; and renderer applications consume neither host-specific surface.
    condition: Whenever a Kit module or app resolves a Kit or shell dependency.
    failure: Reject an independent submodule authority, private import, duplicated shell contract, wrong host delivery, or host-specific renderer dependency.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-dependency-boundary
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-module-family
  - id: rule.nimi.platform.ui-design-system.p-kit-010
    kind: rule
    title: P-KIT-010 UI module ownership boundary
    modality: must
    statement: The Kit UI foundation owns shared tokens, primitives, themes, generated visual contracts, reusable primitive families, and default visual behavior under all P-DESIGN rules, while app composition, information architecture, route placement, data schemas, and app-local inventories remain app-owned and reference-taxonomy gaps remain non-authoritative until a public primitive exists.
    condition: Whenever shared UI behavior or a candidate primitive is considered.
    failure: Reject app-product truth in Kit UI or an unimplemented candidate presented as available.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.governed-surface
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.shared-primitive
  - id: rule.nimi.platform.ui-design-system.p-kit-020
    kind: rule
    title: P-KIT-020 authentication module boundary
    modality: must
    statement: The authentication feature may combine components, hooks, logic, adapters, storage, and styling in one bounded surface, consumes shared Nimi semantic variables, receives platform behavior only through its typed adapter, and permits presentation-scoped variable overrides without a parallel global token namespace.
    condition: Whenever shared authentication UI or behavior is implemented.
    failure: Reject an independent token system, direct host-platform import, or unscoped theme namespace.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-dependency-boundary
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-module-family
  - id: rule.nimi.platform.ui-design-system.p-kit-030
    kind: rule
    title: P-KIT-030 pure core logic boundary
    modality: must
    statement: Kit core provides shared environment, capability detection, OAuth, and Desktop Open Intent helpers as pure TypeScript logic with no UI, styling, or rendering dependencies, consumes the SDK only through the single kit-core SDK contract boundary module, parameterizes OAuth through a typed bridge, and detects shell mode from injected environment values without app-name assumptions.
    condition: Whenever a shared core helper is implemented or consumed.
    failure: Reject a visual or rendering dependency, an SDK import outside the contract boundary module, a host-specific import, or hardcoded app identity.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-dependency-boundary
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-module-family
  - id: rule.nimi.platform.ui-design-system.p-kit-040
    kind: rule
    title: P-KIT-040 renderer-safe telemetry boundary
    modality: must
    statement: The telemetry infrastructure module provides renderer-side telemetry and reusable React-only error boundaries, accepts caller-shaped payloads without imposing a schema, assumes no app context, and has no direct Tauri, Node.js, or Electron dependency beyond React as a peer.
    condition: Whenever shared renderer telemetry or an error boundary is implemented.
    failure: Reject a host import, app-context assumption, payload-schema ownership, or non-React dependency.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-dependency-boundary
  - id: rule.nimi.platform.ui-design-system.p-kit-041
    kind: rule
    title: P-KIT-041 protected carrier and Tauri boundaries
    modality: must
    statement: Protected-local carries only typed exact-Host correlation, fresh protected-session bootstrap, and fixed-service status, start, and restart while Runtime and the operating system retain admission, security, and lifecycle truth; its host-only carrier never reaches renderer and neither proves binary or project-payload integrity nor creates an operating-system sandbox or long-lived authorization lineage; host adapters do not own credentials, OAuth, Realm, Runtime, App, snapshot, operation, or business truth, shared defaults remain non-security hints, platform catalogs are read-only display projections, and IPC semantics and generated commands retain their external owner.
    condition: Whenever Kit carries protected local or Tauri shell behavior.
    failure: Reject renderer exposure, product stop, caller selectors, generic configuration or RPC, foreign truth, hardcoded branding, cross-layer app inclusion, duplicate App access catalogs, or parallel command truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-dependency-boundary
  - id: rule.nimi.platform.ui-design-system.p-kit-041c
    kind: rule
    title: P-KIT-041C demand-driven standard shell capability
    modality: must
    statement: A standard shell capability is added or refactored only for a concrete current consumer and real journey, uses one typed contract across its supported hosts, returns typed unavailable or failure for unsupported host behavior, and owns neither protected authority nor a generic proxy over SDK, Runtime, Realm, LocalAgent, Avatar, or App truth.
    condition: Whenever a reusable shell capability is proposed, defined, or implemented.
    failure: Reject a speculative capability family, parallel owner truth, pseudo-success, untyped host gap, protected behavior in ordinary transport, or a generic cross-domain proxy.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-dependency-boundary
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-public-surface
  - id: rule.nimi.platform.ui-design-system.p-kit-041c-storage
    kind: rule
    title: P-KIT-041C host-owned managed JSON and asset storage
    modality: must
    statement: Standard storage resolves canonical relative keys within the Runtime-private current-account-plus-Registered-App-Subject partition without exposing physical layout and never accepts an absolute root, account, App, registration, subject, partition, operation, credential, or proof selector; JSON admits only typed read and write results containing value and byte size plus idempotent remove and retains its 256-KiB document and 16-MiB committed-partition quotas, while binary assets admit exactly stat, bounded list, incremental write, immutable-source ranged read returning asset, range, and body, idempotent remove, same-partition move, purpose-specific reveal, and runtime.consume artifact adoption with independent Runtime-owned committed asset quotas above the 32-MiB inline artifact ceiling; adoption materializes the single committed payload as a collision-safe App-relative file whose real extension is derived from Runtime-verified MIME, keeps metadata separate from payload bytes, and reveal revalidates owner, existence, metadata, and integrity before the verified native Host opens the OS file manager on that exact file without copying it or returning its absolute path; candidates and internal metadata count toward neither public quota, and managed storage remains without a user-mediated access workflow or generic file authority.
    condition: Whenever a standard host processes App-private managed storage.
    failure: Fail closed on an absolute or escaping path, malformed stream or range, oversized or over-quota data, foreign owner, path or protected-material disclosure, or implied generic file access.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-public-surface
  - id: rule.nimi.platform.ui-design-system.p-kit-041f
    kind: rule
    title: P-KIT-041F standard file artifact and window boundary
    modality: must
    statement: Full standard hosts provide host-selected file paths, validated reveal, sanitized collision-free export, bounded artifact writes under the app-data artifact subtree, and invoking-window-only floating controls through shared operations; validate and register paths and bytes; allow full-host artifact URLs only after valid writes; reserve direct Runtime artifact reading for an admitted owner picker and one-shot handle; keep system window dragging shell-UI-owned while manual floating drag reports current origin and requires renderer-driven moves; fail unsupported behavior without simulation; and expose none of those path-bearing file, export, picker, or full-host artifact operations to local-app capability sets, while the separately admitted rootless App asset methods, purpose-specific reveal of one already committed App asset, and opaque App-media playback handler remain available only through their exact SDK and protected-carrier contracts; App-asset reveal accepts no OS path, picker input, destination, bytes, URL, or Runtime artifact identity, creates no copy, and returns only revealed true.
    condition: Whenever file, artifact, export, or floating-window capability is exposed or invoked.
    failure: Fail closed on renderer-supplied absolute input, invalid bytes, untrusted or escaping path, cross-window control, unsupported behavior, local-app exposure, or caller-selected internal artifact identity.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-public-surface
  - id: rule.nimi.platform.ui-design-system.p-kit-042
    kind: rule
    title: P-KIT-042 host-neutral renderer shell
    modality: must
    statement: Renderer shell provides host-neutral commands, bridges, bootstrap hooks, and a provider-scoped seam for capabilities, localization, opaque identity, targets, theme, lifecycle, overlays, and result mapping; concrete hosts allocate resources; Kit exposes no host discriminator, credentials, Runtime transport, simulator authority, raw identity, app store, navigation, UI, readiness, auth, or telemetry truth; bridges source standard commands and failures, parse required defaults without empty normalization, fail closed without a host, and exclude raw host APIs, local-file fallbacks, consumer UI, and shared-core app duplicates.
    condition: Whenever renderer shell glue initializes or dispatches.
    failure: Reject foreign ownership, host discrimination, forked parsing, silent fallback, raw host access, consumer UI, or app-specific shared logic.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-dependency-boundary
  - id: rule.nimi.platform.ui-design-system.p-kit-041e
    kind: rule
    title: P-KIT-041E Electron host security boundary
    modality: must
    statement: Electron shell is main and narrowed preload glue over exact protected and standard capabilities; accepts only app identity, exact renderer locations, and IPC registration; excludes external-daemon, app, Runtime, and Realm truth; never exposes raw Electron, Node, filesystem, process, arbitrary channels, native binding, credentials, protected sessions, roots, endpoints, or provider URLs; validates closed native operations before verified transport; keeps generated bytes behind exact selection; enforces command namespaces, sender identity, origin allowlists, sandboxing, context isolation, disabled renderer Node integration, and one opaque App-media protocol whose random handle is scoped to the issuing webContents and window for at most ten minutes and stores only relative asset path, MIME, size, digest, and expiry. Handle creation and every single-range request use the current typed Base asset stat or read client, pin and compare MIME, size, and digest before chunks are served, send nosniff, deny top-level navigation, and admit only image/png by the 8-byte PNG signature, image/jpeg by the 3-byte JPEG start marker, image/gif by the 6-byte GIF87a or GIF89a signature, image/webp by the 12-byte RIFF-WEBP signature, audio/wav by the 12-byte RIFF-WAVE signature, audio/mpeg by an ID3 or valid MPEG audio frame within the first 64 KiB, audio/ogg by OggS plus an Opus or Vorbis identification header within the first 64 KiB, video/mp4 by an ISO-BMFF ftyp box and compatible brand within the first 64 KiB, or video/webm by an EBML header and webm DocType within the first 64 KiB; the exact App-asset reveal operation receives a Runtime-validated host-private absolute payload path only inside the native binding, revalidates that it is an existing regular file matching the committed metadata, invokes the platform file manager reveal action, and projects only revealed true to Electron main and the renderer; and the Electron shell carries only fixed-service status, start, and restart without Runtime lifecycle ownership.
    condition: Whenever Electron main, preload, IPC, window, protected transport, lifecycle, or artifact serving is configured or used.
    failure: Fail closed before body chunks on unsafe exposure, app-selected authority, arbitrary methods, missing renderer or window identity, disallowed origin, unsafe window posture, raw local files, unsupported or mismatched MIME or bounded signature, pinned metadata mismatch, multiple or invalid ranges, top-level navigation, expired or revoked handles, parallel path-bearing protocols, generic lifecycle mutation, or pseudo-offline success.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-dependency-boundary
  - id: rule.nimi.platform.ui-design-system.p-kit-041e-recovery
    kind: rule
    title: P-KIT-041E bounded restart recovery
    modality: must
    statement: Runtime restart invalidates affected protected App sessions, Effective App Access Snapshots, asset streams, and opaque App-media handles but does not delete registration, rotate the stable Registered App Subject, remove committed assets, or require an otherwise unchanged exact App Host to restart; the same exact Host may establish a fresh Runtime bind and create a fresh handle, while carrier or session change, navigation, window close, expiry, explicit revoke, and managed remove, move, or overwrite of the pinned path also invalidate affected handles and recovery never retries endpoint, owner-business, unsupported-operation, or unclassified failures indefinitely.
    condition: Whenever an Electron-carried Runtime call encounters Runtime restart or protected-session invalidation.
    failure: Close stale state and reject protected metadata reconstruction, misclassification, or unbounded retry.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registered-app-subject
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-dependency-boundary
  - id: rule.nimi.platform.ui-design-system.p-kit-044
    kind: rule
    title: P-KIT-044 exact local-app carrier boundary
    modality: must
    statement: Kit never creates or accepts account authority, registered App subject, provenance, declaration generation, snapshot, AppOperationId, AppAccessDomainId, classification, launch witness, process proof, session identity, endpoint, or security truth; qualified Hosts share one typed Runtime-bound App client exposing only purpose-specific methods from the central App Operation Contract, including the thirteen agent.configure methods, three JSON storage methods, seven Base asset methods, and runtime.consume artifact adoption, while Runtime alone evaluates each call against its current private Effective App Access Snapshot and derives the storage and artifact owner; every equally eligible protected App Host may additionally expose the same two identity-free AgentCenter native material-selection and bounded temporary-custody mechanics beneath the canonical presentation commit, with file selection and any absolute source path remaining wholly native and no product identity, eligibility, state, availability, or commit authority entering the Host mechanic; Kit incrementally carries asset chunks with bounded backpressure and cancellation and may issue only the opaque bounded-signature-validated App-media handle, retaining relative path, issuing renderer and window, expiry, MIME, size, and digest but no raw account, subject, session, endpoint, proof, provider URL, absolute path, or complete data URL; only the native binding may transiently receive the Runtime-validated absolute payload path for the exact purpose-specific reveal call and it never returns or retains that path outside the call; the client projects the current-user display fields handle, displayName, and avatarUrl and may project current-account active Agent references as non-secret session-scoped opaque selectors that are revalidated by the owner on every operation and never act as a bearer, durable identity, or authorization record; no generic Realm or Runtime proxy, renderer-supplied operation identity, filesystem fallback, caller-built authorization, credential, direct Avatar control, embedded rendering, private Runtime Agent Service, voice, attachment, or configuration surface outside that canonical contract exists, while App-native data and commands remain App-owned and protected identity material remains host-private.
    condition: Whenever a local-app host opens, exposes, or uses its native session.
    failure: Reject caller-supplied authority, stale or foreign Agent selectors, root disclosure, generic forwarding, filesystem substitution, or protected-material projection before transport, preserve Runtime's typed rejection of missing snapshot coverage and unknown or unsupported operations before owner execution, and never decide App access locally.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.current-user-display-projection
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-dependency-boundary
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-public-surface
  - id: rule.nimi.platform.ui-design-system.p-kit-044-recovery
    kind: rule
    title: P-KIT-044 fail-closed local-app recovery
    modality: must
    statement: Missing or untrusted service or carrier, exact Host process mismatch, account or declaration-generation change, Runtime restart, and unsupported platform or profile return typed access or operation failure with no ordinary RPC, external daemon, manually started Host, caller-supplied or inherited registered App subject, provenance-derived access, Runtime lease, or pseudo-success fallback; account, declaration, carrier, or Runtime changes close stale sessions, snapshots, asset streams, and opaque media handles and allow the same exact Host to bind fresh and create a fresh handle, while navigation, window close, expiry, explicit revoke, and managed remove, move, or overwrite invalidate affected handles and a security-relevant executable, entrypoint, or process-start mismatch requires a new verified Host launch.
    condition: Whenever a local-app carrier cannot maintain verified state.
    failure: Close only the invalid access state or mismatched Host carrier, preserve unaffected App and tooling state, and surface typed failure without fallback.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-dependency-boundary
  - id: rule.nimi.platform.ui-design-system.p-kit-045
    kind: rule
    title: P-KIT-045 Desktop Open Intent boundary
    modality: must
    statement: Desktop Open Intent core wraps SDK-owned parsing without a second parser; the standard capability owns its operation and command; renderer input contains only intent and optional request identity; hosts contact but never start the running Desktop bridge; domain rejections return typed domain results; and pre-domain host failures use the standard shell envelope.
    condition: Whenever Kit parses, transports, or reports a Desktop Open Intent.
    failure: Reject parser duplication, forbidden source or endpoint fields, Desktop startup, or confusion between domain and host failures.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-public-surface
  - id: rule.nimi.platform.ui-design-system.p-kit-046
    kind: rule
    title: P-KIT-046 local-development bootstrap boundary
    modality: must
    statement: Local-development bootstrap uses the common exact-Host-correlated carrier, accepts no App-provided security, identity, process, domain, operation, or snapshot selector, serializes fresh protected-session binding against business calls, and projects the same three independent facts across supported per-user non-elevated hosts consisting of App running or stopped, Nimi access available or unavailable with typed reason and retryability, and official tooling active or inactive; access failure removes only protected commands and streams while an exact Host mismatch or explicit stop closes the Host carrier, and the renderer receives only the admitted typed App client surface.
    condition: Whenever a local-development host bootstraps, renews, replaces, closes, or projects its carrier.
    failure: Reject App authority, stale concurrent use, collapsed lifecycle facts, protected disclosure, generic forwarding, ordinary-RPC fallback, inherited identity, or automatic Host termination for an access-only failure.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-dependency-boundary
  - id: rule.nimi.platform.ui-design-system.p-kit-047
    kind: rule
    title: P-KIT-047 generated protected profile transport
    modality: must
    statement: The shared protected adapter derives exact Desktop machine, Desktop account, and bundled Avatar operation sets from the single Runtime-owned profile projection, preserves the Desktop profiles on desktop_control and the independent bundled Avatar profile on the avatar_control logical carrier while allowing only their separately attested logical carriers to reuse the same OS-verified physical endpoint, authorizes exact Desktop window and frame objects separately from the exact verified Avatar native-host process and native sender, fixes each profile after renderer parsing, accepts no renderer authority fields, never requires OpenDesktopSession or a live Desktop process for Avatar and never transfers Desktop account-control into Avatar, carries generated SDK bytes only after named intent selection, binds streams to the correct sender, connection, boot epoch, and applicable account generation, closes them on every identity or lifecycle invalidation, and never reconnects or falls back across profiles or logical transports.
    condition: Whenever a first-party protected unary or stream operation is selected, delivered, or invalidated.
    failure: Fail before Runtime dispatch or later delivery on a parallel selector, borrowed identity, unbound sender, wrong entrypoint, stale generation, unsupported platform, invalidation, or profile mismatch.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-dependency-boundary
  - id: rule.nimi.platform.ui-design-system.p-kit-043
    kind: rule
    title: P-KIT-043 capability integration follows demand
    modality: must
    statement: Kit integrates shared Runtime and Realm capability semantics only when a current consumer journey requires them, remains above the standard SDK, and does not create a second SDK, mandatory App framework, generated feature catalog, or speculative capability directory.
    condition: Whenever shared Kit capability semantics are implemented or consumed.
    failure: Reject speculative catalog expansion, duplicate SDK semantics, or a Kit feature without a current consumer journey.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-module-family
  - id: rule.nimi.platform.ui-design-system.p-kit-050
    kind: rule
    title: P-KIT-050 reusable module admission
    modality: must
    statement: A new capability module enters Kit only for a concrete Nimi Home, Avatar, Simulator, or Third-party reference App requirement with a real journey, bounded owner, public surface, and dependency direction; one real consumer is sufficient and speculative multi-App planning is not admission.
    condition: Whenever a new Kit module family is proposed.
    failure: Keep the capability App-owned until a concrete integration need and bounded public boundary exist.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-module-family
  - id: rule.nimi.platform.ui-design-system.p-kit-060
    kind: rule
    title: P-KIT-060 portable feature module topology
    modality: must
    statement: Feature modules are reusable AI capability surfaces that may combine components, hooks, headless logic, adapters, and styling but remain portable by receiving app data and platform capability through injected adapters rather than app code, app stores, synchronization code, or bridge implementations.
    condition: Whenever a Kit feature module is implemented or integrated.
    failure: Reject a direct app or platform dependency and require the typed adapter seam.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-module-family
  - id: rule.nimi.platform.ui-design-system.p-kit-061
    kind: rule
    title: P-KIT-061 chat composition adapter boundary
    modality: must
    statement: Shared chat remains conversation-shell parity owner outside explicit caller-owned geometry, placement, or flow inputs and neither forks transcript, scroll-root, grouping, or virtualization truth nor widens host-local flow into shared ownership without a separate authority change.
    condition: Whenever a host composes or adapts the shared chat shell.
    failure: Reject private shell truth or implicit expansion of Kit ownership.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-module-surface
  - id: rule.nimi.platform.ui-design-system.p-kit-065
    kind: rule
    title: P-KIT-065 Kit-first reuse obligation
    modality: must
    statement: An app extends or composes an existing Kit surface whenever it covers most baseline styling and interaction behavior, keeps local implementation only for unmatched or clearly app-specific requirements, and treats a shell likely reusable across two apps as a future Kit candidate rather than entrenching a parallel baseline.
    condition: Before app-local UI or interaction behavior is added or refactored.
    failure: Reject the parallel app-local shell and use or propose the reusable Kit surface.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-module-surface
  - id: rule.nimi.platform.ui-design-system.p-kit-070
    kind: rule
    title: P-KIT-070 headless UI and domain seams
    modality: must
    statement: A reusable feature exposes a headless surface, a default UI surface, or both according to the concrete consumer and journey that justified the feature; when both exist, UI composes shared primitives without bypassing headless semantics; Runtime-aware and Realm-aware integration surfaces bind only their corresponding public SDK domain without app stores or bridges; and Runtime and Realm remain distinct seams.
    condition: Whenever a feature publishes or binds its reusable contract.
    failure: Reject a surface without a concrete consumer, a required consumer seam left unavailable, a duplicated consumer shell, a bypassed headless contract when one exists, private integration, or a mislabeled domain seam.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-public-surface
  - id: rule.nimi.platform.ui-design-system.p-kit-071
    kind: rule
    title: P-KIT-071 reusable Avatar surfaces
    modality: must
    statement: Avatar publishes aggregate, headless, UI, and Runtime-aware surfaces; headless owns normalized presentation inputs and transient interaction contracts; UI owns the default stage shell; Runtime integration binds only Runtime-owned persistent presentation projection; optional backend renderers remain lightweight semantic-preserving seams; and chat or app shells consume the shared Avatar contract without private semantics, app stores, host bridges, renderer-local truth transfer, or app-placement ownership.
    condition: Whenever reusable Avatar presentation is implemented or consumed.
    failure: Reject a missing baseline surface, heavyweight default coupling, parallel renderer shell, semantic fork, or transferred app or Runtime truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-public-surface
  - id: rule.nimi.platform.ui-design-system.p-kit-072
    kind: rule
    title: P-KIT-072 Avatar ownership hardcut
    modality: must_not
    statement: Avatar owns Runtime-persistent presentation, App-transient interaction, LocalAgent identity, Memory, Knowledge, Conversation, voice truth, App access, placement or orchestration truth, imports App stores, private host bridges, or Runtime internals, or invents fallback assets, voices, or pseudo-success when required projection inputs are unresolved.
    condition: Whenever Avatar consumes presentation or interaction state.
    failure: Keep truth with its owner and fail closed on unresolved required presentation fields.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-dependency-boundary
  - id: rule.nimi.platform.ui-design-system.p-kit-073
    kind: rule
    title: P-KIT-073 Avatar backend renderer seam
    modality: must
    statement: An explicitly delivered Avatar backend renderer preserves normalized headless presentation, owns only stage-rendering semantics, accepts bounded framing after App synonym mapping, and excludes asset import, storage, registry, LocalAgent ownership or product binding, fallback truth, packaging, App lifecycle, raw driver APIs, authoring, and model inspection unless separately admitted.
    condition: Whenever an optional Avatar backend renderer is published or invoked.
    failure: Reject an undelivered export, unknown framing term, transferred truth, or unadmitted behavior.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-public-surface
  - id: rule.nimi.platform.ui-design-system.p-kit-074
    kind: rule
    title: P-KIT-074 Avatar interaction adapter boundary
    modality: must
    statement: Avatar interaction adapters may receive typed resolved attention targets, continuous presence, and bounded follow intent, while raw pointer capture, viewport measurement, smoothing, clamping, speaking precedence, stop lines, and raw interaction lifecycle remain outside Kit and backend-renderer semantic ownership unless separately admitted.
    condition: Whenever an active Avatar surface receives interaction input.
    failure: Reject raw intake or implicit lifecycle ownership and require caller-resolved bounded input.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-dependency-boundary
  - id: rule.nimi.platform.ui-design-system.p-kit-080
    kind: rule
    title: P-KIT-080 typed adapters and host-neutral construction
    modality: must
    statement: Feature modules expose obvious typed adapters as the sole seam for app data, mutations, and platform capability; bind public SDK Runtime or Realm services only from the matching integration surface; avoid direct app, host bridge, Runtime-internal, or injectable SDK-service imports; and app renderer factories use identical provider, store, route, and UI construction for production-host and Simulator bindings without host discrimination while Simulator reducers, scenarios, fixtures, and selection remain app-owned.
    condition: Whenever a feature receives app or first-party capability or an app constructs its canonical renderer.
    failure: Reject an implicit, mislabeled, private, direct, or host-discriminated integration or transfer of Simulator app truth into Kit.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-dependency-boundary
  - id: rule.nimi.platform.ui-design-system.standard-shell-capabilities-envelope
    kind: rule
    title: standard-shell-capabilities command and error envelope
    modality: must
    statement: Every standard shell invocation resolves one cataloged capability-family, operation, and command tuple, accepts only that operation's declared request fields, returns only its declared result fields, and maps failure to an admitted operation-level negative state in an envelope containing code, reasonCode, actionHint, and source with optional details.
    condition: Whenever a standard shell host validates, dispatches, completes, or rejects an invocation.
    failure: Reject an unknown tuple or field and surface a typed admitted error without raw host failure, silent fallback, or pseudo-success.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-public-surface
  - id: rule.nimi.platform.ui-design-system.standard-shell-capabilities-closure
    kind: rule
    title: standard-shell-capabilities catalog closure
    modality: must
    statement: A standard shell host exposes only its cataloged ordinary host commands, permits one only when the resolved shell capability set allows it, and denies every forbidden, planned, or uncataloged shell command; this shell catalog is transport and host-feature closure only and never supplies, duplicates, filters, enlarges, or replaces the Runtime-owned central App Operation Contract or Effective App Access Snapshot.
    condition: Whenever a host resolves or enforces a standard shell capability set.
    failure: Deny dispatch before owner invocation and return the cataloged typed failure for unavailable or forbidden capability.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-public-surface
  - id: rule.nimi.platform.ui-design-system.standard-shell-capabilities-profile-schema
    kind: rule
    title: standard-shell-capabilities profile schema
    modality: must
    statement: Every ordinary standard-shell capability profile declares a stable set identity, host class, package kind, verified host resolution, and disjoint allowed, planned, and forbidden shell-command sets with deny-until-available disposition for planned commands; the profile carries no Runtime App authority status, declaration mapping, Registered App Subject, Effective App Access Snapshot, or protected App-operation allowlist.
    condition: Whenever a standard shell capability profile is registered or resolved.
    failure: Reject an incomplete, overlapping, selector-derived, or permissive profile.
    relations:
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.platform.core-protocol.effective-app-access-snapshot
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-dependency-boundary
  - id: rule.nimi.platform.ui-design-system.standard-shell-capabilities-family-security
    kind: rule
    title: standard-shell-capabilities family security boundaries
    modality: must
    statement: Each standard shell command family remains bound to its declared host contract and payload, result, and ownership constraints; renderer input cannot supply protected identity, authorization, endpoint, process, session, account, declaration, snapshot, operation, storage-root, or absolute-path authority; and the host verifies the invoking shell profile before dispatch without transferring domain or Runtime App-access ownership.
    condition: Whenever a renderer or host crosses a standard shell command-family boundary.
    failure: Fail closed before dispatch on forbidden authority input, wrong host contract, profile mismatch, path disclosure, or ownership transfer.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.kit-dependency-boundary
  - id: definition.nimi.platform.ui-design-system.nimi-ui-compositions-compact-density
    kind: definition
    title: nimi-ui-compositions compact density
    meaning: Compact density is the low-ceremony, high-scan-efficiency presentation mode for repeated operational work.
  - id: definition.nimi.platform.ui-design-system.nimi-ui-compositions-regular-density
    kind: definition
    title: nimi-ui-compositions regular density
    meaning: Regular density is the default readability mode for ordinary application pages, shared primitives, standard forms, and mixed content.
  - id: definition.nimi.platform.ui-design-system.nimi-ui-compositions-expressive-density
    kind: definition
    title: nimi-ui-compositions expressive density
    meaning: Expressive density is an opt-in presentation mode for identity-led, content-led, cinematic, or admitted ambient moments rather than operational chrome.
  - id: rule.nimi.platform.ui-design-system.nimi-ui-compositions-density-selection
    kind: rule
    title: nimi-ui-compositions density selection semantics
    modality: must
    statement: A governed surface selects compact density for repeated operational work, regular density for default readable application content, and expressive density only for an explicit identity-led, content-led, cinematic, or admitted ambient boundary.
    condition: Whenever a governed page or composition selects a density mode.
    failure: Reject a density selection that contradicts the semantic role of the governed surface.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.nimi-ui-compositions-compact-density
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.nimi-ui-compositions-expressive-density
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.nimi-ui-compositions-regular-density
  - id: rule.nimi.platform.ui-design-system.nimi-ui-compositions-density-behavior
    kind: rule
    title: nimi-ui-compositions density behavior semantics
    modality: must
    statement: Compact density uses functional transitions without decorative operational-state motion, regular density permits light elevation and useful transitions only when they clarify grouping or state, and expressive density provides reduced-motion handling while operational descendants return to regular or compact density.
    condition: Whenever a governed surface applies density-specific motion or contains a nested operational region.
    failure: Reject decorative compact motion, uninformative regular motion, missing expressive reduced-motion handling, or an expressive operational descendant.
    relations:
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.nimi-ui-compositions-compact-density
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.nimi-ui-compositions-expressive-density
      - type: applies_to
        target: definition.nimi.platform.ui-design-system.nimi-ui-compositions-regular-density
