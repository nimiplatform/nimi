    runtime_registration_mode: app-managed
    permission_scope_ref:
      - { appId: nimi.realm-agent-studio, scopeFamily: account, scopeName: account.session.read }
      - { appId: nimi.realm-agent-studio, scopeFamily: agent, scopeName: agent.identity.project }
      - { appId: nimi.realm-agent-studio, scopeFamily: ai_profile, scopeName: ai_profile.selection.consume }
      - { appId: nimi.realm-agent-studio, scopeFamily: ai_spend, scopeName: ai.spend.meter }
