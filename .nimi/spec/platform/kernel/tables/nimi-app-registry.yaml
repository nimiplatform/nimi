version: 1
table_family: product_catalog
owner: platform
catalog_id: platform_nimi_app_registry
entries:
  - apps_1
  - apps_2
  - registry rows must reference admitted trust tier, package signature policy, release channel, factory AIProfile selection, canonical capability ids, and local compute pack rows
  - registry must not admit a row with package_kind outside nimi-app
  - registry rows must not embed provider, connector, engine, or model identifier strings
  - avatar registry row admission_status must remain gated_by_avatar_master_gate until the avatar productization master gate clears
  - ordinary Apps visibility requires admission_status admitted and ordinary_visibility ordinary-visible
  - no ordinary-visible first-party app is admitted in this cut
  - Avatar must remain hidden-internal for ordinary Apps even when package/update coordination rows exist
  - Realm Agent Studio is admitted only as developer-only first-party App in
    this cut so standalone desktop dev-shell account registration can fail
    closed through Runtime registry truth instead of app-local session shims
  - every installable non-bundled version must resolve to an immutable release descriptor with digest verification before unpack or execution
  - permission_scope_ref must remain permission_fabric_pending until an admitted permission fabric provides concrete scope sets

# Canonical Nimi App registry — Platform admission/catalog authority.
# See nimi-app-admission-contract.md (P-NAPP-001..P-NAPP-011; P-NAPP-013..P-NAPP-032).

app_schema:
  owner: platform_nimi_app_registry
  fields:
    - app_id
    - display_label
    - publisher
    - trust_tier_ref
    - package_kind
    - package_signature_policy_ref
    - update_channel_ref
    - ai_profile_selection_ref
    - capability_set_refs
    - local_compute_pack_refs
    - runtime_registration_mode
    - permission_scope_ref
    - health_repair_projection
    - ordinary_visibility
    - release_descriptor_ref
    - install_storage_policy_ref
    - source_repo_url
    - admission_status
    - source_rule
  enums:
    package_kind:
      - nimi-app
    runtime_registration_mode:
      - app-managed
    admission_status:
      - admitted
      - gated_by_avatar_master_gate
      - permission_fabric_pending
      - deferred
      - retired
    ordinary_visibility:
      - ordinary-visible
      - hidden-internal
      - developer-only
      - not-admitted-visible
    health_repair_projection:
      - unavailable
      - setup-required
      - needs-confirmation
      - in-progress
      - failed
      - unsupported
      - repair-required
      - stale-projection

apps:
  - app_id: nimi.avatar
    display_label: Avatar
    publisher: nimi-first-party
    trust_tier_ref: nimi-first-party
    package_kind: nimi-app
    package_signature_policy_ref: nimi-first-party-signature-policy
    update_channel_ref: stable
    ai_profile_selection_ref: local-gpu
    capability_set_refs:
      - text.generate
      - audio.synthesize
      - audio.transcribe
      - image.generate
    local_compute_pack_refs:
      - local-text
      - local-speech
      - local-image-native
      - local-gpu-support
    runtime_registration_mode: app-managed
    permission_scope_ref: permission_fabric_pending
    health_repair_projection:
      - unavailable
      - setup-required
      - needs-confirmation
      - in-progress
      - failed
      - unsupported
      - repair-required
      - stale-projection
    ordinary_visibility: hidden-internal
    release_descriptor_ref: nimi.avatar.bundled-with-nimi
    install_storage_policy_ref: nimi-data-app-roots
    source_repo_url: null
    admission_status: gated_by_avatar_master_gate
    source_rule: P-NAPP-011
