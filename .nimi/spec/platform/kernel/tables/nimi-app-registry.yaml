      - { appId: nimi.parentos, scopeFamily: memory, scopeName: memory.read.bounded, qualifier: persona-scoped }
      - { appId: nimi.parentos, scopeFamily: knowledge, scopeName: knowledge.read.bounded }
      - { appId: nimi.parentos, scopeFamily: ai_spend, scopeName: ai.spend.meter }
      - { appId: nimi.parentos, scopeFamily: notification, scopeName: notification.send }
      - { appId: nimi.parentos, scopeFamily: ai_profile, scopeName: ai_profile.selection.consume }
    health_repair_projection:
      - unavailable
      - setup-required
      - needs-confirmation
      - in-progress
      - failed
      - unsupported
      - repair-required
      - stale-projection
    ordinary_visibility: ordinary-visible
    release_descriptor_ref: nimi.parentos.bundled-with-nimi
    install_storage_policy_ref: nimi-data-app-roots
    admission_status: admitted
    source_rule: P-NAPP-011

  - app_id: nimi.tester
    display_label: Tester
    publisher: nimi-first-party
    trust_tier_ref: nimi-first-party
    package_kind: nimi-app
    package_signature_policy_ref: nimi-first-party-signature-policy
    update_channel_ref: stable
    ai_profile_selection_ref: hybrid-recommended
    capability_set_refs:
      - text.generate
      - text.embed
      - audio.synthesize
      - audio.transcribe
      - image.generate
      - video.generate
      - world.generate
    local_compute_pack_refs:
      - local-text
      - local-speech
      - local-image-native
      - local-image-python
      - local-video-python
      - local-gpu-support
    runtime_registration_mode: app-managed
    permission_scope_ref:
      - { appId: nimi.tester, scopeFamily: account, scopeName: account.session.read }
      - { appId: nimi.tester, scopeFamily: ai_profile, scopeName: ai_profile.selection.consume }
      - { appId: nimi.tester, scopeFamily: ai_spend, scopeName: ai.spend.meter }
      - { appId: nimi.tester, scopeFamily: file_device, scopeName: file.read.scoped, qualifier: tester-fixture-root }
      - { appId: nimi.tester, scopeFamily: file_device, scopeName: file.write.scoped, qualifier: tester-app-storage }
      - { appId: nimi.tester, scopeFamily: audit, scopeName: audit.read.scoped, qualifier: tester-run-evidence }
    health_repair_projection:
      - unavailable
      - setup-required
      - needs-confirmation
      - in-progress
      - failed
      - unsupported
      - repair-required
      - stale-projection
    ordinary_visibility: developer-only
    release_descriptor_ref: nimi.tester.bundled-with-nimi
    install_storage_policy_ref: nimi-data-app-roots
