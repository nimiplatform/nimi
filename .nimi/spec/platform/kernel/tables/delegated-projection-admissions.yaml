version: 1
table_family: product_catalog
owner: platform
catalog_id: platform_delegated_projection_admissions
entries:
  - realm-spec-projection
admissions:
  - id: realm-spec-projection
    admission_posture: active
    owner_domain: realm
    authority_root: .nimi/spec/realm
    source_authority_root: external-authority://<nimi-realm>/realm
    local_projection_evidence_roots:
      - scripts/check-realm-spec-projection-guard.mjs
    delegated_evidence_roots:
      - external-authority://<nimi-realm>/realm/spec
      - external-authority://<nimi-realm>/realm/openapi
      - external-authority://<nimi-realm>/realm/sdk-consumer-input
    delegated_declared_evidence_prefixes:
      - realm-implementation://
      - realm-test-evidence://
      - realm-openapi://
      - realm-schema://
    host_owned_relative_paths:
      - AGENTS.md
      - README.md
      - external-realm.md
    required_verification_commands:
      - local-guard://check:realm-spec-projection-guard
    source_rule: P-PKG-009
