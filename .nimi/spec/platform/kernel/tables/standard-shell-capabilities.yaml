version: 1
table_family: protocol_surface
owner: platform
protocol_id: platform_standard_shell_capabilities
surfaces:
  - runtime
  - runtime-lifecycle
  - runtime-defaults
  - filesystem
  - window
  - notification
  - storage
  - ai-config
  - agent-center
  - auth
  - desktop-open
authority:
  id: platform.standard-shell-capabilities
  owner: platform
  source_rule: P-KIT-041C
  package_surface: "@nimiplatform/kit/shell/capabilities"
  rust_host_surface: nimi_shell_tauri::capabilities
  electron_host_surface: "@nimiplatform/kit/shell/electron/main"
  renderer_surface: "@nimiplatform/kit/shell/renderer/bridge"

error_envelope:
  required_fields:
    - code
    - reasonCode
    - actionHint
    - source
  optional_fields:
    - details
  codes:
    - capability-unavailable
    - external-daemon-required
    - runtime-permission-denied
    - runtime-unauthenticated
    - forbidden-renderer-access
    - invalid-path
    - not-found
    - invalid-payload
    - host-internal-error

storage_payload_policy:
  root_source: host_owned_runtime_app_storage_root
  host_resolution:
    - runtime_get_app_storage
    - runtime_attested_launch_projection
  renderer_payloads:
    data.pathResolve:
      allowed_fields:
        - relativePath
    storage.readJson:
      allowed_fields:
        - relativePath
    storage.writeJson:
      allowed_fields:
        - relativePath
        - value
    storage.removeJson:
      allowed_fields:
        - relativePath
      result_shape:
        - path
        - removed
      idempotent_missing_file: true
    artifacts.write:
      allowed_fields:
        - relativePath
        - mimeType
        - dataBase64
  forbidden_renderer_fields:
    - path
    - storageRoot
    - root
    - absolutePath
    - dataRoot
    - cacheRoot
    - tempRoot

capability_set_schema:
  owner: platform_standard_shell_capabilities
  source_rule: P-KIT-044
  fields:
    - set_id
    - host_class
    - app_package_kind
    - launch_resolution
    - auth_binding
    - allowed_operations
    - forbidden_operations
    - negative_tests
    - source_rule

capability_sets:
  - set_id: installed-nimi-app-standard-shell-v1
    host_class: desktop-electron-installed-app-host
    app_package_kind: nimi-app
    launch_resolution: runtime-openapp-attested
    auth_binding: host-owned-runtime-app-session
    allowed_operations:
      - runtime.unary
      - runtime.streamOpen
      - runtime.streamClose
      - data.pathResolve
      - storage.readJson
      - storage.writeJson
      - storage.removeJson
      - config.get
      - config.set
      - ai-config.get
      - ai-config.set
      - local-assets.resolveUrl
      - desktop-open.openIntent
      - shell-ui.confirmDialog
      - shell-ui.startWindowDrag
      - shell-ui.focusMainWindow
    forbidden_operations:
      - runtime-lifecycle.status
      - runtime-lifecycle.start
      - runtime-lifecycle.stop
      - runtime-lifecycle.restart
      - runtime-defaults.get
      - auth.sessionLoad
      - auth.sessionSave
      - auth.sessionClear
      - oauth.openExternalUrl
      - oauth.tokenExchange
      - oauth.listenForCode
      - diagnostics.rendererEntryProbe
      - local-agent.identity
      - local-agent.runtimeTrustedCaller
      - ai-profile.get
      - avatar.assetResolve
      - agent-center.avatarAssetImport
      - agent-center.avatarAssetValidate
      - agent-center.avatarAssetResolvePreview
      - agent-center.live2dAdapterImport
      - agent-center.backgroundImport
      - agent-center.backgroundGet
      - agent-center.backgroundValidate
      - agent-center.backgroundRemove
      - agent-center.agentResourcesRemove
      - agent-center.accountResourcesRemove
      - platform-projection.get
      - file-dialog.open
      - file-reveal.reveal
      - export.saveFile
      - artifacts.write
      - floating-window.setBounds
      - floating-window.setIgnoreCursorEvents
      - floating-window.setAlwaysOnTop
      - floating-window.hide
      - floating-window.close
      - floating-window.beginManualDrag
      - floating-window.moveManualDrag
      - floating-window.constrainToVisibleArea
      - desktop-private.product-control
      - tauri-only.commands
      - electron.raw-ipc
      - node.raw-fs
    negative_tests:
      - desktop-installed-app-denies-runtime-lifecycle
      - desktop-installed-app-denies-auth-session-custody
      - desktop-installed-app-denies-oauth-token-exchange
      - desktop-installed-app-denies-local-agent-trusted-caller
      - desktop-installed-app-denies-platform-projection
      - desktop-installed-app-denies-desktop-private-bridge
      - desktop-installed-app-denies-tauri-only-commands
      - desktop-installed-app-denies-file-system-handoff
      - desktop-installed-app-denies-floating-window
    source_rule: P-KIT-044

capabilities:
  - id: runtime
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: unary
        command: nimi.shell.runtime.unary
        negative_states:
          - capability-unavailable
          - external-daemon-required
          - runtime-permission-denied
          - runtime-unauthenticated
          - invalid-payload
          - host-internal-error
      - id: streamOpen
        command: nimi.shell.runtime.stream.open
        negative_states:
          - capability-unavailable
          - external-daemon-required
          - runtime-permission-denied
          - runtime-unauthenticated
          - invalid-payload
          - host-internal-error
      - id: streamClose
        command: nimi.shell.runtime.stream.close
        negative_states:
          - capability-unavailable
          - not-found
          - invalid-payload
          - host-internal-error
  - id: runtime-lifecycle
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: status
        command: nimi.shell.runtimeLifecycle.status
        negative_states:
          - capability-unavailable
          - external-daemon-required
          - runtime-permission-denied
          - runtime-unauthenticated
      - id: start
        command: nimi.shell.runtimeLifecycle.start
        negative_states:
          - external-daemon-required
      - id: stop
        command: nimi.shell.runtimeLifecycle.stop
        negative_states:
          - external-daemon-required
      - id: restart
        command: nimi.shell.runtimeLifecycle.restart
        negative_states:
          - external-daemon-required
  - id: runtime-defaults
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: get
        command: nimi.shell.runtimeDefaults.get
        negative_states:
          - capability-unavailable
          - invalid-payload
  - id: auth
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: sessionLoad
        command: nimi.shell.auth.session.load
        negative_states:
          - external-daemon-required
          - capability-unavailable
      - id: sessionSave
        command: nimi.shell.auth.session.save
        negative_states:
          - external-daemon-required
          - capability-unavailable
          - invalid-payload
      - id: sessionClear
        command: nimi.shell.auth.session.clear
        negative_states:
          - external-daemon-required
          - capability-unavailable
  - id: oauth
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: openExternalUrl
        command: nimi.shell.oauth.openExternalUrl
        negative_states:
          - capability-unavailable
          - forbidden-renderer-access
          - invalid-payload
      - id: tokenExchange
        command: nimi.shell.oauth.tokenExchange
        negative_states:
          - capability-unavailable
          - invalid-payload
          - host-internal-error
      - id: listenForCode
        command: nimi.shell.oauth.listenForCode
        negative_states:
          - capability-unavailable
          - invalid-payload
          - host-internal-error
  - id: desktop-open
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: openIntent
        command: nimi.shell.desktopOpen.openIntent
        negative_states:
          - capability-unavailable
          - forbidden-renderer-access
          - invalid-payload
          - host-internal-error
  - id: shell-ui
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: confirmDialog
        command: nimi.shell.ui.confirmDialog
        negative_states:
          - capability-unavailable
          - invalid-payload
          - host-internal-error
      - id: startWindowDrag
        command: nimi.shell.ui.startWindowDrag
        negative_states:
          - capability-unavailable
          - host-internal-error
      - id: focusMainWindow
        command: nimi.shell.ui.focusMainWindow
        negative_states:
          - capability-unavailable
          - host-internal-error
  - id: diagnostics
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: rendererEntryProbe
        command: nimi.shell.diagnostics.rendererEntryProbe
        negative_states:
          - capability-unavailable
          - invalid-payload
  - id: data
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: pathResolve
        command: nimi.shell.data.pathResolve
        negative_states:
          - capability-unavailable
          - invalid-path
          - invalid-payload
  - id: storage
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: readJson
        command: nimi.shell.storage.readJson
        negative_states:
          - capability-unavailable
          - invalid-path
          - not-found
          - invalid-payload
      - id: writeJson
        command: nimi.shell.storage.writeJson
        negative_states:
          - capability-unavailable
          - invalid-path
          - invalid-payload
      - id: removeJson
        command: nimi.shell.storage.removeJson
        negative_states:
          - capability-unavailable
          - invalid-path
          - invalid-payload
  - id: config
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: get
        command: nimi.shell.config.get
        negative_states:
          - capability-unavailable
          - not-found
      - id: set
        command: nimi.shell.config.set
        negative_states:
          - external-daemon-required
          - capability-unavailable
          - invalid-payload
  - id: local-assets
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: resolveUrl
        command: nimi.shell.localAssets.resolveUrl
        negative_states:
          - capability-unavailable
          - invalid-path
          - not-found
  - id: local-agent
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: identity
        command: nimi.shell.localAgent.identity
        negative_states:
          - capability-unavailable
      - id: runtimeTrustedCaller
        command: nimi.shell.localAgent.runtimeTrustedCaller
        negative_states:
          - capability-unavailable
          - forbidden-renderer-access
  - id: ai-profile
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: get
        command: nimi.shell.aiProfile.get
        negative_states:
          - capability-unavailable
          - not-found
  - id: ai-config
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: get
        command: nimi.shell.aiConfig.get
        negative_states:
          - capability-unavailable
          - not-found
      - id: set
        command: nimi.shell.aiConfig.set
        negative_states:
          - capability-unavailable
          - invalid-payload
  - id: avatar
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: assetResolve
        command: nimi.shell.avatar.assetResolve
        negative_states:
          - capability-unavailable
          - invalid-path
          - not-found
  - id: agent-center
    host_contract: NimiStandardShellCapabilityHost
    ownership: host_local_asset_custody_only
    forbidden_operations:
      - configGet
      - configSet
    operations:
      - id: avatarAssetImport
        command: nimi.shell.agentCenter.avatarAssetImport
        payload_owner: host_registered_file_dialog_path
        result_owner: kit_shell_asset_custody
        negative_states:
          - capability-unavailable
          - invalid-payload
          - invalid-path
          - forbidden-renderer-access
          - host-internal-error
      - id: avatarAssetValidate
        command: nimi.shell.agentCenter.avatarAssetValidate
        payload_owner: kit_shell_local_asset_ref
        result_owner: kit_shell_validation_projection
        negative_states:
          - capability-unavailable
          - invalid-payload
          - invalid-path
          - not-found
          - host-internal-error
      - id: avatarAssetResolvePreview
