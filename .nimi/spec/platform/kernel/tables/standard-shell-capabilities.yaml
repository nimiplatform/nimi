        payload_owner: kit_shell_local_asset_ref
        result_owner: avatar_preview_material_projection
        negative_states:
          - capability-unavailable
          - invalid-payload
          - invalid-path
          - not-found
          - host-internal-error
      - id: live2dAdapterImport
        command: nimi.shell.agentCenter.live2dAdapterImport
        payload_owner: host_registered_file_dialog_path
        result_owner: kit_shell_asset_scoped_sidecar_custody
        negative_states:
          - capability-unavailable
          - invalid-payload
          - invalid-path
          - not-found
          - forbidden-renderer-access
          - host-internal-error
      - id: backgroundImport
        command: nimi.shell.agentCenter.backgroundImport
        payload_owner: host_registered_file_dialog_path
        result_owner: kit_shell_asset_custody
        negative_states:
          - capability-unavailable
          - invalid-payload
          - invalid-path
          - forbidden-renderer-access
          - host-internal-error
      - id: backgroundGet
        command: nimi.shell.agentCenter.backgroundGet
        payload_owner: kit_shell_background_asset_ref
        result_owner: standard_local_asset_url_projection
        negative_states:
          - capability-unavailable
          - invalid-payload
          - invalid-path
          - not-found
          - host-internal-error
      - id: backgroundValidate
        command: nimi.shell.agentCenter.backgroundValidate
        payload_owner: kit_shell_background_asset_ref
        result_owner: kit_shell_validation_projection
        negative_states:
          - capability-unavailable
          - invalid-payload
          - invalid-path
          - not-found
          - host-internal-error
      - id: backgroundRemove
        command: nimi.shell.agentCenter.backgroundRemove
        payload_owner: kit_shell_background_asset_ref
        result_owner: kit_shell_removal_projection
