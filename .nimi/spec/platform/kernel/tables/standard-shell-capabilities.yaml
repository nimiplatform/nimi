        negative_states:
          - capability-unavailable
          - invalid-payload
          - host-internal-error
  - id: artifacts
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: write
        command: nimi.shell.artifacts.write
        negative_states:
          - capability-unavailable
          - invalid-path
          - invalid-payload
          - host-internal-error
  - id: floating-window
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: setBounds
        command: nimi.shell.floatingWindow.setBounds
        negative_states:
          - capability-unavailable
