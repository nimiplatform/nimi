          - capability-unavailable
          - invalid-payload
          - invalid-path
          - host-internal-error
      - id: accountResourcesRemove
        command: nimi.shell.agentCenter.accountResourcesRemove
        payload_owner: account_scope
        result_owner: kit_shell_removal_projection
        negative_states:
          - capability-unavailable
          - invalid-payload
          - invalid-path
          - host-internal-error
  - id: platform-projection
    host_contract: NimiStandardShellCapabilityHost
    operations:
      - id: get
        command: nimi.shell.platformProjection.get
        negative_states:
          - capability-unavailable
