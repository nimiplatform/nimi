    runtime_source: K-GRANT-009
    category: mapped

  - platform_error: APP_SCOPE_REVOKED
    platform_source: P-PROTO-040
    runtime_reason_code: APP_SCOPE_REVOKED
    runtime_code_number: 504
    runtime_source: K-GRANT-010
    category: mapped

  # ── mapped: Auth errors → runtime AUTH family ──
  - platform_error: PRINCIPAL_UNAUTHORIZED
    platform_source: P-PROTO-020
    runtime_reason_code: PRINCIPAL_UNAUTHORIZED
    runtime_code_number: 8
    runtime_source: K-AUTH-001
    category: mapped
    note: Exact Runtime reason code exists; do not broaden to token-invalid semantics

  - platform_error: EXTERNAL_PRINCIPAL_PROOF_INVALID
    platform_source: P-PROTO-020
    runtime_reason_code: EXTERNAL_PRINCIPAL_PROOF_INVALID
    runtime_code_number: 114
