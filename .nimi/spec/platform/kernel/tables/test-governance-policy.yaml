    root: apps/desktop
    inventory: config/desktop-test-inventory.yaml
    authority_refs: [P-TEST-008]
  - domain: kit
    owner: platform
    root: kit
    inventory: config/kit-test-inventory.yaml
    authority_refs: [P-TEST-008]
  - domain: sdks-typescript
    owner: sdks
    root: sdks/typescript
    inventory: config/sdks-typescript-test-inventory.yaml
    authority_refs: [P-TEST-008]
  - domain: avatar
    owner: avatar
    root: apps/avatar
    inventory: config/avatar-test-inventory.yaml
    authority_refs: [P-TEST-008]
  - domain: scripts
    owner: platform
    root: scripts
    inventory: config/scripts-test-inventory.yaml
    authority_refs: [P-TEST-008]
  - domain: zhiyu
    owner: zhiyu
    root: apps/zhiyu/test
    inventory: config/zhiyu-test-inventory.yaml
    authority_refs: [P-TEST-008]
  - domain: nimi-cognition
    owner: cognition
    root: nimi-cognition
    inventory: config/nimi-cognition-test-inventory.yaml
    authority_refs: [P-TEST-008]
  - domain: tester
    owner: tester
    root: apps/tester
    inventory: config/tester-test-inventory.yaml
    authority_refs: [P-TEST-008]
  - domain: web
