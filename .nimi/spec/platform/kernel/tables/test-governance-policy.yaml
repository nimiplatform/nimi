version: 2
table_family: product_catalog
owner: platform
catalog_id: platform_test_governance_policy
source_rule: P-TEST-001
entries:
  - evidence_classes
  - execution_lanes
  - hard_blocks
  - census
  - suites
  - local_agent_conversation_report
  - local_agent_journey_acceptance
evidence_classes:
  - classification: authority_boundary_guard
    tier: T3
    meaning: static forbidden-import, forbidden-API, or forbidden-copy boundary
    authority_refs: [P-TEST-002, P-TEST-004]
  - classification: behavior_unit
    tier: T4
    meaning: deterministic logic or state machine asserted through real production calls
    authority_refs: [P-TEST-002]
  - classification: contract_conformance
    tier: T5
    meaning: public contract, adapter, wire, or typed-core conformance
    authority_refs: [P-TEST-002]
  - classification: generated_drift_guard
    tier: T2
    meaning: source-to-generated byte or semantic drift comparison
    authority_refs: [P-TEST-002]
  - classification: product_acceptance
    tier: T6
    meaning: real app shell, transport, process, or user path
    authority_refs: [P-TEST-002, P-TEST-006]
  - classification: live_provider_proof
    tier: T7
    meaning: real provider execution with declared environment evidence
    authority_refs: [P-TEST-002, P-TEST-006]
execution_lanes:
  - id: workspace_regression
    semantics: deterministic portable suites executed by the stable root pnpm test command
    required_outcome: pass
    authority_refs: [P-TEST-002, P-TEST-006]
  - id: domain_release
    semantics: deterministic owner gate executed in its domain release environment
    required_outcome: pass
    authority_refs: [P-TEST-002, P-TEST-006]
  - id: release_native
    semantics: deterministic native or platform-toolchain suite with typed platform requirements
    required_outcome: pass_or_declared_blocked
    authority_refs: [P-TEST-002, P-TEST-006]
  - id: product_acceptance
    semantics: real shell, process, transport, or user-path acceptance suite
    required_outcome: pass_or_declared_blocked
    authority_refs: [P-TEST-002, P-TEST-006]
  - id: live_provider
    semantics: real provider suite outside ordinary regression
    required_outcome: pass_or_declared_blocked
    authority_refs: [P-TEST-002, P-TEST-006]
hard_blocks:
  - id: unmapped_test_source
    condition: census-discovered test-bearing source belongs to no executable suite
    authority_refs: [P-TEST-003]
  - id: multiply_mapped_test_source
    condition: census-discovered test-bearing source belongs to more than one suite
    authority_refs: [P-TEST-003]
  - id: empty_or_missing_suite_selector
    condition: suite selector is missing, references a missing file, or expands to zero sources
    authority_refs: [P-TEST-002, P-TEST-003]
  - id: unresolved_suite_command_or_gate
    condition: suite command, cwd, or release-gate identity cannot be resolved exactly
    authority_refs: [P-TEST-002]
  - id: workspace_regression_not_reachable
    condition: workspace_regression suite is absent from the stable root pnpm test execution graph
    authority_refs: [P-TEST-002, P-TEST-003]
  - id: active_quarantine_or_phase_state
    condition: active test topology contains quarantine, legacy, wave, phase, candidate, or remove-after delivery state
    authority_refs: [P-TEST-005]
  - id: source_inspection_claims_behavior
    condition: source, regex, or snapshot inspection claims runtime, state, transport, persistence, UI, or failure behavior
    authority_refs: [P-TEST-004]
  - id: required_prerequisite_converted_to_pass
    condition: missing required binary, platform, shell, provider, secret, or external repository yields pass
    authority_refs: [P-TEST-006]
  - id: automatic_semantic_verdict_or_acceptance
    condition: matcher, score, evaluator, threshold, or generated report automatically passes/fails/accepts LocalAgent semantic quality
    authority_refs: [P-TEST-009, P-TEST-013]
  - id: deterministic_context_admission_wrong_classification
    condition: deterministic LocalAgent context admission does not use behavior_unit T4
    authority_refs: [P-TEST-010]
  - id: electron_behavior_acceptance_wrong_classification
    condition: real Electron LocalAgent product interaction does not use product_acceptance T6
    authority_refs: [P-TEST-010]
  - id: live_conversation_without_t7_env_evidence
    condition: real provider conversation execution is counted outside live_provider_proof T7 after_env_evidence
    authority_refs: [P-TEST-006, P-TEST-011]
  - id: reported_model_fingerprint_incomplete
    condition: a reported turn omits providerId, modelId, or resolved model revision/fingerprint
    authority_refs: [P-TEST-012]
  - id: direct_provider_or_provider_model_constant
    condition: app/test runner directly calls provider/model or embeds provider/model selection
    authority_refs: [P-TEST-012]
  - id: generated_review_status_not_unreviewed
    condition: generated report or review dimension defaults to accepted/needs_adjustment or has non-empty generated review notes
    authority_refs: [P-TEST-013]
  - id: incomplete_conversation_report_bundle
    condition: declared transcript, provider capture, Runtime state, context/memory/relationship snapshot, presentation output, lifecycle event, screenshot, or artifact hash is missing
    authority_refs: [P-TEST-014]
  - id: source_or_app_owned_conversation_identity
    condition: Character, Persona, sourceRef, Desktop, or Zhiyu owns/derives localAgentRef or conversationAnchorId
    authority_refs: [P-TEST-014, P-TEST-018]
  - id: materialized_local_agent_automatic_source_rebase
    condition: a Realm source change automatically rebases a materialized LocalAgent instead of continuing from its frozen snapshot
    authority_refs: [P-TEST-014]
  - id: local_agent_execution_layer_outside_closed_set
    condition: LocalAgent acceptance uses an execution layer outside L0 through L5
    authority_refs: [P-TEST-015]
  - id: electron_cartesian_product
    condition: enum, property, schema mutation, or high-repeat negative coverage starts a full Electron environment per case
    authority_refs: [P-TEST-015, P-TEST-019]
  - id: mixed_point_scenario_journey_policy_truth
    condition: point identity, conversation scenario, Journey topology, and gate scheduling are owned by one mixed registry
    authority_refs: [P-TEST-017]
  - id: i8_observation_masquerades_as_acceptance
    condition: an I8 behavior observation point receives a semantic pass, fail, skip, blocked, or completed-as-passed record
    authority_refs: [P-TEST-017]
  - id: missing_acceptance_or_observation_mapping
    condition: an acceptance point lacks objective result evidence or an observation point lacks a report stream/turn/lifecycle/section mapping
    authority_refs: [P-TEST-016, P-TEST-018]
  - id: prerequisite_failure_downstream_pass
    condition: a failed prerequisite checkpoint produces a dependent passing leaf
    authority_refs: [P-TEST-018]
  - id: non_pass_counted_as_pass
    condition: blocked, skipped, missing, unexecuted, or unknown outcome is counted as pass
    authority_refs: [P-TEST-018]
  - id: source_artifact_privacy_or_process_integrity_failure
    condition: source digest, artifact hash, privacy, console/page error, process problem, or provider lane integrity is invalid
    authority_refs: [P-TEST-018]
  - id: journey_environment_start_count_mismatch
    condition: observed process starts differ from the Journey environment declaration
    authority_refs: [P-TEST-016, P-TEST-019]
  - id: journey_repeat_logical_identity_reuse
    condition: a Journey repeat reuses an account, world, source, Runtime source, or LocalAgent identity from another repeat, or omits the observed identities from environmentIdentity
    authority_refs: [P-TEST-016, P-TEST-018]
  - id: journey_or_gate_budget_exceeded
    condition: a required Journey or aggregate gate exceeds its hard budget
    authority_refs: [P-TEST-015, P-TEST-019]
  - id: leaf_result_orphan_duplicate_conflict
    condition: catalog, Journey checkpoint, and leaf result identities contain an orphan, duplicate, or conflicting owner
    authority_refs: [P-TEST-017, P-TEST-018]
  - id: leaf_per_process_required_path
    condition: an active required script, runner, checker, or fallback derives full environment starts from leaf count
    authority_refs: [P-TEST-016, P-TEST-019]
local_agent_conversation_report:
  contract_version: 1
  identity_model:
    source_owner: realm
    source_kinds: [worldCharacter, personaCharacter]
    source_role_after_materialization: provenance_and_frozen_typed_snapshot
    local_agent_owner: runtime
    conversation_owner: runtime
    resolved_identity_fields: [localAgentRef, conversationAnchorId]
    registry_or_app_derived_identity: forbidden
    automatic_source_rebase: forbidden
    materializations_per_declared_source: 1
    authority_refs: [P-TEST-014, P-TEST-018]
  classification_bindings:
    deterministic_context_integrity:
      classification: behavior_unit
      tier: T4
      authority_refs: [P-TEST-010]
    electron_product_execution:
      classification: product_acceptance
      tier: T6
      release_eligibility: after_real_shell_evidence
      authority_refs: [P-TEST-010, P-TEST-011]
    live_provider_execution:
      classification: live_provider_proof
      tier: T7
      release_eligibility: after_env_evidence
      authority_refs: [P-TEST-006, P-TEST-011]
  baseline_shape:
    clean_environment_count: 1
    local_agent_stream_count: 2
    lifecycle_timeline_count: 1
    source_materialization_count: {worldCharacter: 1, personaCharacter: 1}
    environment_starts: {provider: 1, realm: 1, runtime: 2, desktop: 1, zhiyu: 1}
    runtime_restart_count: 1
    realm_offline_transition_count: 1
    model_count: 1
    run_count: 1
    repeat_count: 1
    retry_policy: none
    full_environment_per_scene_or_turn: forbidden
    authority_refs: [P-TEST-014, P-TEST-019]
  stream_contract:
    required_source_kinds: [worldCharacter, personaCharacter]
    required_distinct_fields: [localAgentRef, conversationAnchorId, sourceSnapshotHash, memoryScope]
    shared_fields: [ownerAccountId, runtimeEnvironment, providerEnvironment]
    cross_surface_continuity: same_localAgentRef_and_conversationAnchorId
    restart_continuity: same_localAgentRef_and_conversationAnchorId
    realm_offline_input: frozen_local_agent_source_snapshot
    app_materialization_after_handoff: forbidden
    authority_refs: [P-TEST-014, P-TEST-018]
  model_identity:
    selection_owner: runtime_catalog_and_ai_config
    required_fields: [providerId, modelId, modelRevisionOrFingerprint]
    route_change_within_run: forbidden
    app_or_test_direct_provider: forbidden
    provider_model_constants: forbidden
    configurable_axes: [models, repeats]
    authority_refs: [P-TEST-012]
  report_bundle:
    required_files: [report.html, report.json, run-manifest.json, transcripts, screenshots, provider-captures, runtime-state]
    turn_correlation_chain: [accountId, sourceRef, sourceSnapshotRef, localAgentRef, conversationAnchorId, turnId, surface, providerId, modelId, modelRevisionOrFingerprint]
    required_turn_captures: [contextSummary, memorySnapshot, relationshipSnapshot, presentationOutput]
    required_presentation_fields: [voice, emotion, activity, apml, hooks]
    required_lifecycle_events: [materialization, desktop_to_zhiyu_continuation, agent_switch, runtime_restart, realm_offline, post_restart_turn, post_offline_turn]
    transcript_report_agreement: exact
    local_links_resolve: required
    authority_refs: [P-TEST-014, P-TEST-018]
  objective_findings:
    automatic_outcomes: [journey_execution, process_health, transport_completion, correlation_integrity, artifact_integrity, page_console_errors, privacy_findings, exact_cross_agent_canary_leakage, lifecycle_execution, time_budget, environment_start_counts]
    semantic_outcomes: forbidden
    authority_refs: [P-TEST-009, P-TEST-010, P-TEST-018]
  human_review:
    dimensions_role: report_headings_only
    status_values: [unreviewed, accepted, needs_adjustment]
    generated_default_status: unreviewed
    generated_default_notes: ""
    forbidden_automation: [semantic_matcher, style_score, semantic_threshold, evaluator_calibration, automatic_accepted]
    optional_ai_annotation_authority: none
    admission_threshold: none
    authority_refs: [P-TEST-009, P-TEST-013]
local_agent_journey_acceptance:
  contract_version: 1
  execution_layers:
    L0:
      name: static_unit
      scope: [schema, codec, hash, pure_function, type_boundary, state_mapping]
      frequency: every_related_change
      hard_budget_ms: 180000
      authority_refs: [P-TEST-015]
    L1:
      name: module_integration_contract
      scope: [packet_challenge_snapshot, context_compiler, sdk_kit_projection, provider_capture, security_predicate, targeted_persistence_restart]
      frequency: every_pr_iteration
      hard_budget_ms: 480000
      authority_refs: [P-TEST-015]
    L2:
      name: core_product_journey
      scope: [realm, runtime, sdk_kit, desktop, zhiyu, provider_visible_context, transcript_memory, voice_emotion_apml, isolation, restart_offline]
      frequency: every_product_affecting_iteration
      target_budget_ms: 900000
      hard_budget_ms: 1200000
      authority_refs: [P-TEST-015, P-TEST-019]
    L3:
      name: extended_risk_journeys
      scope: [access_denial_forgery, replay_concurrency, destructive_lifecycle, source_no_rebase, crash_recovery, native_platform, operator_recovery]
      frequency: related_change_or_nightly
      aggregate_hard_budget_ms: 2700000
      authority_refs: [P-TEST-015, P-TEST-019]
    L4:
      name: exhaustive_deterministic
      scope: [property_repetition, enum_schema_mutation, high_repeat_negative, platform_variants, stability_three]
      frequency: nightly_release_true_close
      single_platform_hard_budget_ms: 5400000
      full_electron_per_leaf: forbidden
      authority_refs: [P-TEST-015, P-TEST-019]
    L5:
      name: live_conversation_report
      scope: [two_runtime_local_agent_streams, cross_surface_lifecycle_timeline, complete_human_review_bundle]
      frequency: on_demand
      ordinary_core_regression: forbidden
      release_admission_threshold: none
      human_review: required
      authority_refs: [P-TEST-011, P-TEST-013, P-TEST-014, P-TEST-015, P-TEST-019]
  required_gate_budgets:
    local_pr_l0_l1_l2_target_ms: 1500000
    required_pr_job_hard_max_ms: 1800000
    i7_core_stability_hard_max_ms: 3600000
    extended_aggregate_hard_max_ms: 2700000
    deterministic_exhaustive_hard_max_ms: 5400000
    live_provider_separate_clock: true
    authority_refs: [P-TEST-015, P-TEST-019]
  execution_identity:
    acceptance_point_role: independently_traceable_product_fact
    behavior_observation_point_role: human_review_report_location
    checkpoint_role: fact_collection_position_within_journey
    journey_trial_role: one_clean_environment_complete_product_path
    acceptance_results_per_journey: many
    observation_results: forbidden
    isolation_boundary: state_pollution
    point_scene_turn_count_drives_process_starts: false
    ordinary_conversation_change: extend_existing_stream_registry
    repeat_identity_scope: [account, world, source, runtime_source, local_agent]
    fresh_logical_identity_per_repeat: true
    observed_identity_record: environmentIdentity
    new_journey_reasons: [different_initial_subject, different_user_path, different_state_machine, destructive_boundary, recovery_boundary, native_platform, unsafe_state_reset]
    authority_refs: [P-TEST-016]
  registry_ownership:
    point_catalog: [point_id, point_kind, owner_iteration, group, product_requirement, assertion_ids, review_dimensions, minimum_sufficient_layer, evidence_class]
    conversation_scenario_registry: [scenario_id, stream_alias, source_provenance, ordered_turns, surfaces, continuation, capture_requirements, lifecycle_checkpoints, model_matrix, time_budget]
    journey_registry: [journey_id, applicable_layer, environment, real_realm, desktop, zhiyu, native_macos, checkpoints, covered_point_ids, prerequisites, isolation_level, repeat_policy, time_budget]
    execution_policy: [gate_journey_selection, gate_suite_selection, repeat_counts, exhaustive_frequency, time_budgets, platform_requirements]
    mixed_truth: forbidden
    authority_refs: [P-TEST-017]
  iteration_boundary:
    total_point_count: 169
    i7_acceptance_point_count: 145
    i8_behavior_observation_point_count: 24
    i7_result_for_i8_observation: forbidden
    i8_layer: L5
    authority_refs: [P-TEST-017]
  evidence_accounting:
    catalog_membership_counts_as_current_evidence: false
    historical_mapping_only_counts_as_current_evidence: false
    current_and_historical_counts_are_separate: true
    unbound_active_checkpoint_posture: explicit_incomplete_evidence
    architecture_validation_claim: structural_integrity_not_point_coverage
    authority_refs: [P-TEST-017]
  result_integrity:
    prerequisite_failure_outcomes: [failed, blocked_by_failed_prerequisite]
    passing_outcome: passed
    non_passing_outcomes: [failed, blocked_by_failed_prerequisite, blocked, skipped, missing, unexecuted]
    required_journey_fields: [schemaVersion, journeyTrialId, journeyId, tier, batch, repeatIndex, sourceState, environmentIdentity, durationMs, checkpoints, leafResults, artifacts, processProblems, privacy, outcome]
    required_checkpoint_fields: [checkpointId, prerequisiteIds, startedAt, completedAt, correlations, assertions, artifactRefs, outcome]
    required_leaf_result_fields: [leafId, journeyTrialId, checkpointIds, assertionIds, evidenceRefs, outcome, failureClass]
    required_integrity: [source_digest, nimi_head, realm_head, artifact_sha256, privacy_zero, process_problems_zero, provider_capture_complete, environment_start_count, logical_identity_unique_per_repeat, duration_budget]
    conversation_report_required_integrity: [two_distinct_local_agent_streams, one_lifecycle_timeline, source_snapshot_provenance, runtime_resolved_identity, exact_transcript_agreement, provider_model_revision, context_memory_relationship_capture, presentation_capture, runtime_restart_once, realm_offline_once, local_link_resolution, observation_mapping_complete, generated_review_unreviewed]
    conversation_report_semantic_outcome: forbidden
    authority_refs: [P-TEST-018]
  active_runner:
    scheduling_unit: journey
    repeat_unit: independent_journey_environment
    full_environment_per_leaf: forbidden
    l5_scheduling_unit: one_baseline_report_environment
    full_environment_per_scene_turn_or_observation: forbidden
    process_start_formula: declared_journey_environment
    alternate_runner_fallback: forbidden
    authority_refs: [P-TEST-019]
census:
  include_globs:
    - '**/*.test.ts'
    - '**/*.test.tsx'
    - '**/*.test.mts'
    - '**/*.test.mjs'
    - '**/*.test.cts'
    - '**/*.test.cjs'
    - '**/*.test.js'
    - '**/*.test.jsx'
    - '**/*.spec.ts'
    - '**/*.spec.tsx'
    - '**/*.spec.mts'
    - '**/*.spec.cts'
    - '**/*.spec.mjs'
    - '**/*.spec.cjs'
    - '**/*.spec.js'
    - '**/*.spec.jsx'
    - '**/*.e2e.mjs'
    - '**/*_test.go'
    - '**/test_*.py'
    - '**/*_test.py'
  rust_inline_glob: '**/*.rs'
  rust_test_markers: ['#[test]', '#[cfg(test)]']
  active_roots: [app-tools, apps, docs, examples, gateways, kit, nimi-cognition, nimi2d, proto, runtime, scripts, sdks, tests]
  exclude_dirs: [archive, _external, node_modules, dist, dist-electron, generated, gen, target, reports, .next, .cache, .iterate, .local]
  exclude_paths: [app-tools/templates/app-source]
  authority_refs: [P-TEST-003, P-TEST-007]
suites:
  - id: sdk-typescript
    owner: sdk
    lane: workspace_regression
    workspace_order: 10
    provides_workspace_surfaces: [sdk_dist]
    gate_id: gate.sdk.coverage
    command: pnpm check:sdk-coverage
    selectors:
      globs: ['sdks/typescript/**/*.test.ts']
    authority_refs: [P-TEST-002, P-TEST-003]
  - id: kit-typescript
    owner: platform
    lane: workspace_regression
    workspace_order: 20
    provides_workspace_surfaces: [kit_dist]
    gate_id: gate.ui.kit-test
    command: pnpm test:kit
    selectors:
      globs: ['kit/**/*.test.ts', 'kit/**/*.test.tsx']
    authority_refs: [P-TEST-002, P-TEST-003]
  - id: app-tools-unit
    owner: app-tools
    lane: workspace_regression
    workspace_order: 30
    requires_workspace_surfaces: [sdk_dist, kit_dist]
    gate_id: gate.app-tools.unit
    command: pnpm --filter @nimiplatform/app-tools test
    selectors:
      globs: ['app-tools/**/*.test.mjs']
    authority_refs: [P-TEST-002, P-TEST-003]
  - id: simulator-build-control-unit
    owner: simulator
    lane: workspace_regression
    workspace_order: 35
    requires_workspace_surfaces: [sdk_dist, kit_dist]
    gate_id: gate.simulator.build-control-unit
    command: pnpm --filter @nimiplatform/simulator test
    selectors:
      globs: ['apps/simulator/test/*.test.mjs']
    authority_refs: [P-TEST-002, P-TEST-003]
  - id: simulator-contract-unit
    owner: simulator
    lane: workspace_regression
    workspace_order: 36
    requires_workspace_surfaces: [sdk_dist, kit_dist]
    gate_id: gate.simulator.contract
    command: pnpm --filter @nimiplatform/simulator test:contract:prepared
    selectors:
      globs: ['apps/simulator/test/contract/*.test.mjs']
    authority_refs: [P-TEST-002, P-TEST-003]
  - id: avatar-unit
    owner: avatar
    lane: workspace_regression
    workspace_order: 40
    requires_workspace_surfaces: [sdk_dist, kit_dist]
    gate_id: gate.desktop.avatar-unit
    command: pnpm --filter @nimiplatform/avatar test
    selectors:
      globs: ['apps/avatar/src/**/*.test.ts', 'apps/avatar/src/**/*.test.tsx']
    authority_refs: [P-TEST-002, P-TEST-003]
  - id: desktop-unit
    owner: desktop
    lane: workspace_regression
    workspace_order: 50
    requires_workspace_surfaces: [sdk_dist, kit_dist]
    gate_id: gate.desktop.test
    command: pnpm --filter @nimiplatform/desktop test
    selectors:
      globs: ['apps/desktop/test/**/*.test.ts', 'apps/desktop/test/**/*.test.tsx', 'apps/desktop/test/**/*.test.mjs']
    authority_refs: [P-TEST-002, P-TEST-003]
  - id: install-gateway-unit
    owner: web
    lane: workspace_regression
    workspace_order: 60
    gate_id: gate.web.install-gateway-unit
    command: pnpm --filter @nimiplatform/install-gateway test
    selectors:
      globs: ['apps/install-gateway/**/*.test.mjs']
    authority_refs: [P-TEST-002, P-TEST-003]
  - id: nimi-app-platform-fixture-unit
    owner: app-tools
    lane: workspace_regression
    workspace_order: 70
    requires_workspace_surfaces: [sdk_dist, kit_dist]
    gate_id: gate.app-tools.platform-fixture-unit
    command: pnpm --filter @nimiplatform/nimi-app-platform-fixture test
    selectors:
      globs: ['apps/nimi-app-platform-fixture/**/*.test.mjs']
    authority_refs: [P-TEST-002, P-TEST-003]
  - id: tester-unit
    owner: tester
    lane: workspace_regression
    workspace_order: 80
    requires_workspace_surfaces: [sdk_dist, kit_dist]
    gate_id: gate.tester.unit
    command: pnpm --filter @nimiplatform/tester test
    selectors:
      globs: ['apps/tester/test/*.test.mjs']
      files:
        - apps/tester/test/tester-contract/ai-config.mjs
        - apps/tester/test/tester-contract/boundary.mjs
        - apps/tester/test/tester-contract/history-ui.mjs
        - apps/tester/test/tester-contract/no-input-composer.mjs
    authority_refs: [P-TEST-002, P-TEST-003]
  - id: web-unit
    owner: web
    lane: workspace_regression
    workspace_order: 90
    requires_workspace_surfaces: [sdk_dist, kit_dist]
    gate_id: gate.web.test
    command: pnpm --filter @nimiplatform/web test
    selectors:
      globs: ['apps/web/**/*.test.ts']
    authority_refs: [P-TEST-002, P-TEST-003]
  - id: zhiyu-unit
    owner: zhiyu
    lane: workspace_regression
    workspace_order: 100
    requires_workspace_surfaces: [sdk_dist, kit_dist]
    gate_id: gate.desktop.zhiyu-unit
    command: pnpm --filter @nimiplatform/zhiyu test
    selectors:
      globs: ['apps/zhiyu/test/*.test.mjs']
    authority_refs: [P-TEST-002, P-TEST-003]
  - id: openai-compatible-gateway-unit
    owner: web
    lane: workspace_regression
    workspace_order: 110
    gate_id: gate.web.openai-compatible-gateway-unit
    command: pnpm --filter @nimiplatform/openai-compatible-gateway test
    selectors:
      globs: ['gateways/openai-compatible/**/*.test.mjs']
    authority_refs: [P-TEST-002, P-TEST-003]
  - id: nimi2d-unit
    owner: platform
