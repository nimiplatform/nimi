version: 1
table_family: product_catalog
owner: platform
catalog_id: platform_test_governance_policy
source_rule: P-TEST-001
entries:
  - classification_vocabulary
  - gate_eligibility_enum
  - hard_blocks
  - census
  - module_owner_map
  - local_agent_behavior_evaluation
classification_vocabulary:
  - classification: authority_boundary_guard
    tier: T3
    meaning: forbidden-import / forbidden-API / forbidden-copy sentinel; boundary gate
    default_gate_eligibility:
      regression: allowed
      release: allowed
      product_acceptance: never
    authority_refs: [P-TEST-002, P-TEST-004]
  - classification: behavior_unit
    tier: T4
    meaning: deterministic logic / state machine / fail-closed asserted via real calls
    default_gate_eligibility:
      regression: allowed
    authority_refs: [P-TEST-002]
  - classification: contract_conformance
    tier: T5
    meaning: public contract / adapter / conformance / typed-core
    default_gate_eligibility:
      regression: allowed
      release: allowed
    authority_refs: [P-TEST-002]
  - classification: generated_drift_guard
    tier: T2
    meaning: asserts a generated artifact equals its source-of-truth input
    default_gate_eligibility:
      release: allowed
    authority_refs: [P-TEST-002]
  - classification: product_acceptance
    tier: T6
    meaning: real app-shell / e2e / real user path
    default_gate_eligibility:
      release: after_real_shell_evidence
    authority_refs: [P-TEST-002, P-TEST-006]
  - classification: live_provider_proof
    tier: T7
    meaning: requires a real provider/env
    default_gate_eligibility:
      release: after_env_evidence
    authority_refs: [P-TEST-002, P-TEST-006]
  - classification: source_regex_sentinel
    tier: T3
    tier_marker: T3-flagged
    meaning: asserts by scanning source text with regex/string match
    sentinel_purpose_values: [forbidden_import, forbidden_api, forbidden_copy]
    authority_refs: [P-TEST-002, P-TEST-004]
  - classification: evidence_only
    tier: T10
    meaning: closeout / proof / screenshot / wave / phase artifact
    default_gate_eligibility:
      regression: never
      release: never
      product_acceptance: never
    authority_refs: [P-TEST-002, P-TEST-006]
  - classification: legacy_drift_quarantine
    tier: null
    meaning: acknowledged drift fossil, pending rewrite/removal
    default_gate_eligibility:
      regression: never
      release: never
      product_acceptance: never
    required_fields: [removal_condition]
    authority_refs: [P-TEST-002, P-TEST-005]
  - classification: redundant_candidate
    tier: null
    meaning: invariant already covered by a stronger gate, pending dedup
    default_gate_eligibility:
      regression: never
      release: never
      product_acceptance: never
    required_fields: [removal_condition, supersede_ref]
    authority_refs: [P-TEST-002, P-TEST-005]
  - classification: remove_after_replacement
    tier: null
    meaning: scheduled removal once a named replacement lands
    default_gate_eligibility:
      regression: never
      release: never
      product_acceptance: never
    required_fields: [removal_condition, supersede_ref]
    authority_refs: [P-TEST-002, P-TEST-005]
  - classification: quarantine_unreviewed
    tier: null
    meaning: on disk, registered, not yet human-classified (bootstrap-only)
    default_gate_eligibility:
      regression: never
      release: never
      product_acceptance: never
    required_fields: [removal_condition]
    authority_refs: [P-TEST-002, P-TEST-003, P-TEST-005, P-TEST-006]
gate_eligibility_enum:
  values:
    - allowed
    - never
    - after_rewrite
    - after_scope_limit
    - after_real_shell_evidence
    - after_env_evidence
  authority_refs: [P-TEST-002, P-TEST-006]
hard_blocks:
  - id: unclassified_test_file
    condition: test file on disk with no row
    authority_refs: [P-TEST-003]
  - id: test_file_without_spec_ref
    condition: "empty `spec_refs` or undefined rule ref"
    authority_refs: [P-TEST-001]
  - id: authority_claim_true
    condition: "any row with `authority_claim != false`"
    authority_refs: [P-TEST-001]
  - id: quarantine_without_removal_condition
    condition: "non-trusted class, no `removal_condition`"
    authority_refs: [P-TEST-005]
  - id: source_regex_sentinel_not_forbidden_purpose
    condition: source-regex test not in forbidden-* purpose
    authority_refs: [P-TEST-004]
  - id: evidence_only_in_gate
    condition: "`evidence_only` with any gate eligibility `!= never`"
    authority_refs: [P-TEST-006]
  - id: live_proof_without_env_evidence
    condition: "`live_provider_proof` counted for release without env evidence"
    authority_refs: [P-TEST-006]
  - id: unreviewed_in_release_gate
    condition: "`quarantine_unreviewed` reachable by the release gate"
    authority_refs: [P-TEST-006]
  - id: owner_mismatch
    condition: "row `owner` does not equal module root's mapped owner"
    authority_refs: [P-TEST-008]
  - id: tier_classification_mismatch
    condition: "`tier` does not equal classification's canonical tier"
    authority_refs: [P-TEST-002]
  - id: behavior_expectation_not_source_derived
    condition: LocalAgent behavior expectation is not derived from typed source/world/relationship/knowledge truth
    authority_refs: [P-TEST-009]
  - id: deterministic_context_admission_wrong_classification
    condition: deterministic LocalAgent context admission does not use behavior_unit T4
    authority_refs: [P-TEST-010]
  - id: electron_behavior_acceptance_wrong_classification
    condition: real Electron LocalAgent product interaction does not use product_acceptance T6
    authority_refs: [P-TEST-010]
  - id: live_behavior_or_evaluator_without_t7_env_evidence
    condition: real subject behavior or semantic evaluator execution is counted outside live_provider_proof T7 after_env_evidence
    authority_refs: [P-TEST-006, P-TEST-011]
  - id: subject_evaluator_route_fingerprint_missing_or_equal
    condition: subject/evaluator providerId, modelId, or resolved revision/fingerprint is missing, unproven, or the complete fingerprints are equal
    authority_refs: [P-TEST-012]
  - id: direct_provider_or_provider_model_constant
    condition: app/test runner directly calls provider/model or embeds provider/model selection
    authority_refs: [P-TEST-012]
  - id: evaluator_schema_or_calibration_invalid
    condition: strict JSON result, known-pass/deliberate-fail calibration, reason codes, or non-constant scoring is invalid
    authority_refs: [P-TEST-013]
  - id: behavior_batch_retry_or_mutable_inputs
    condition: evaluator trial retries automatically or threshold/control/rubric/schema changes within the batch
    authority_refs: [P-TEST-013]
  - id: behavior_trial_not_retained
    condition: any raw subject/evaluator/calibration/provider trial is removed from the original denominator
    authority_refs: [P-TEST-014]
  - id: evaluator_product_state_or_personality_mutation
    condition: evaluator mutates product state or its score becomes personality truth/context input
    authority_refs: [P-TEST-009, P-TEST-014]
local_agent_behavior_evaluation:
  contract_version: 1
  expectation_manifest:
    source: typed_source_snapshot
    required_domains: [identity, behavior, world, relationship, knowledge]
    prohibited_sources: [app_metadata, evaluator_score, raw_system_prompt]
    authority_refs: [P-TEST-009]
  classification_bindings:
    deterministic_context_admission:
      classification: behavior_unit
      tier: T4
      authority_refs: [P-TEST-010]
    electron_product_acceptance:
      classification: product_acceptance
      tier: T6
      release_eligibility: after_real_shell_evidence
      authority_refs: [P-TEST-010]
    live_subject_behavior:
      classification: live_provider_proof
      tier: T7
      release_eligibility: after_env_evidence
      authority_refs: [P-TEST-006, P-TEST-011]
    semantic_evaluator:
      classification: live_provider_proof
      tier: T7
      release_eligibility: after_env_evidence
      authority_refs: [P-TEST-006, P-TEST-011]
  deterministic_context_admission:
    evidence_source: provider_visible_runtime_request_capture
    required_domains: [identity, behavior, boundary, world, relationship, knowledge, transcript, memory]
    required_assertions: [typed_lane, lane_order, content_hash, token_budget, forbidden_canary_absence, exact_provider_call_count]
    fixture_substitutes_live_behavior: false
    authority_refs: [P-TEST-010, P-TEST-011]
  route_independence:
    executor: runtime_ai_execution
    fingerprint_fields: [providerId, modelId, modelRevisionOrFingerprint]
    comparison: complete_fingerprint_must_differ
    unresolved_or_equal_outcome: blocked_live_provider_admission
    app_or_test_direct_provider: forbidden
    provider_model_constants: forbidden
    authority_refs: [P-TEST-012]
  evaluator_contract:
    input_allowlist: [expectation_manifest, rubric, transcript]
    input_forbidden: [raw_system_prompt, private_context_lanes, product_anchor, product_memory_scope]
    result_format: strict_json_schema
    unknown_or_malformed_outcome: fail_closed
    deterministic_dimensions: [facts, boundaries, ids, hashes, leakage]
    semantic_dimensions: [style, cadence, voice, pacing]
    authority_refs: [P-TEST-009, P-TEST-013]
  calibration:
    controls_per_dimension: [known_pass, deliberate_fail]
    timing: before_subject_trials
    block_on: [control_misclassification, constant_scoring, schema_mismatch, reason_code_mismatch, route_collision]
    fixed_within_batch: [thresholds, controls, rubric, result_schema]
    retry_policy: none
    authority_refs: [P-TEST-013]
  evidence_and_state:
    raw_trial_retention: all
    denominator: all_original_trials
    product_state_mutation: forbidden
    mutation_targets: [realm_source, runtime_source_snapshot, local_agent, turn, message, transcript, memory, anchor]
    score_truth_role: non_authoritative_evaluation_evidence
    score_context_influence: forbidden
    authority_refs: [P-TEST-009, P-TEST-014]
census:
  include_globs:
    - '**/*.test.ts'
    - '**/*.test.tsx'
    - '**/*.test.mts'
    - '**/*.test.mjs'
    - '**/*.test.cts'
    - '**/*.test.cjs'
    - '**/*.test.js'
    - '**/*.test.jsx'
    - '**/*.spec.ts'
    - '**/*.spec.tsx'
    - '**/*.spec.mjs'
    - '**/*.spec.js'
    - '**/*_test.go'
  helper_globs:
    - '**/*-helpers.mjs'
    - '**/*.test-helper.ts'
  exclude_dirs: [archive, _external, node_modules, dist, generated, .next, .cache, .iterate]
  authority_refs: [P-TEST-007]
