version: 1
table_family: product_catalog
owner: platform
catalog_id: platform_release_promise_freeze
authority_class: product_authority_table
source_rule: P-GOV-026
description: Cross-domain release promise freeze for the first publishable Nimi capability set. This table is a promise boundary index; canonical semantics remain with the referenced owner domains.
positioning:
  statement: Nimi is an open-source, local-first, multi-provider personal AI runtime with Realm-owned ecosystem identity.
  owner_domain: platform
  source_rule: P-GOV-026
posture_values:
  - supported
  - partial
  - unsupported
  - deferred
login_requirement_values:
  - realm_login_required
  - local_runtime_allowed
  - anonymous_projection_only
  - not_applicable
entries:
  - product.positioning
  - realm.account-login
  - realm.ecosystem-identity
  - local.runtime-degraded-mode
  - runtime.multi-provider-ai
  - runtime.agent.lifecycle
  - runtime.agent.chat-track
  - runtime.agent.life-track
  - runtime.agent.memory
  - runtime.agent.hooks
  - runtime.agent.delegated-approval-resume
  - runtime.artifact.read-bytes
  - runtime.agent.voice-avatar
  - runtime.agent.participation-sdk
