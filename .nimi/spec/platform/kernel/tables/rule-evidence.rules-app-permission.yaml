rules:
  - rule_id: P-PERM-001
    evidence_refs:
      - platform_kernel_consistency
    evidence_requirement: structural_required
    evidence_scope_note: the single Platform catalog and per-row decision-owner split require catalog validation plus Runtime/Realm/Cognition consumer convergence
  - rule_id: P-PERM-002
    evidence_refs:
      - platform_kernel_consistency
    evidence_requirement: structural_required
    evidence_scope_note: admitted/reserved closure requires machine catalog validation and SDK/manifest rejection tests; retired identifiers remain in Git history rather than active catalog truth
  - rule_id: P-PERM-003
    evidence_refs:
      - platform_kernel_consistency
    evidence_requirement: structural_required
    evidence_scope_note: internal lifecycle and simplified public posture require owner lifecycle tests plus SDK/Desktop projection tests
  - rule_id: P-PERM-004
    evidence_refs:
      - platform_kernel_consistency
    evidence_requirement: structural_required
    evidence_scope_note: structural only; audit event mapping enforcement requires Realm cloud audit and Runtime local audit consumer validation
  - rule_id: P-PERM-005
    evidence_refs:
      - platform_kernel_consistency
    evidence_requirement: structural_required
    evidence_scope_note: user-permission, base-entitlement and one-shot denial rules require separate Runtime/Realm/SDK negative tests
  - rule_id: P-PERM-006
    evidence_refs:
      - platform_kernel_consistency
    evidence_requirement: structural_required
    evidence_scope_note: shared_resources.open must remain reserved until source-owner broker, picker handle validation and two-sided audit exist
  - rule_id: P-PERM-007
    evidence_refs:
      - platform_kernel_consistency
    evidence_requirement: structural_required
    evidence_scope_note: public request shape and forbidden caller fields require manifest, SDK, Kit and Desktop raw-identity scans
  - rule_id: P-PERM-008
    evidence_refs:
      - platform_kernel_consistency
    evidence_requirement: structural_required
    evidence_scope_note: Runtime AI execution must meter without an ai.spend.meter grant; ai.background remains reserved
  - rule_id: P-PERM-009
    evidence_refs:
      - platform_kernel_consistency
    evidence_requirement: structural_required
    evidence_scope_note: first-party service entitlements must not materialize synthetic third-party permission rows; product and OS policies remain independently enforced
  - rule_id: P-PERM-010
    evidence_refs:
      - platform_kernel_consistency
    evidence_requirement: structural_required
    evidence_scope_note: structural only; cross-kernel backend retention enforcement is recorded in `authority-supersession-map.md` and verified by Realm / Runtime / Cognition kernel consistency checks
  - rule_id: P-PERM-011
    evidence_refs:
      - platform_kernel_consistency
    evidence_requirement: structural_required
    evidence_scope_note: structural only; app-private storage is a base entitlement, app-local-drafts is not an admitted permission qualifier, and Runtime `K-APP-018` / SDK `S-APP-014` retain generic file-API/client non-admission
    test_files:
      - scripts/check-local-app-owner-boundary.mjs
  - rule_id: P-PERM-012
    evidence_refs:
      - platform_kernel_consistency
    evidence_requirement: structural_required
    evidence_scope_note: Zhiyu proactive_interruptibility_v1 is a first-party product preference and must not reintroduce notification.subscribe or AIScopeRef as a third-party permission
  - rule_id: P-PERM-013
    evidence_refs:
      - platform_kernel_consistency
    evidence_requirement: structural_required
    evidence_scope_note: local principal/record/session/permission separation, permission-id plus owner-selector binding, trust-class non-effect and next-operation revoke require Runtime protected-local and LocalAgent journey evidence
    test_files:
      - scripts/check-protected-local-authority.mjs
      - scripts/check-local-app-owner-boundary.mjs
  - rule_id: P-PERM-014
    evidence_refs:
      - platform_kernel_consistency
    evidence_requirement: structural_required
    evidence_scope_note: Realm source materialization must be an authenticated first-party product operation with canonical source visibility and fresh Runtime proof, with no app id, Realm scope, access grant, synthetic decision, or Runtime-local grant dependency
    test_files:
      - scripts/check-realm-v3-authority.mjs
  - rule_id: P-PERM-015
    evidence_refs:
      - platform_kernel_consistency
      - nimi_kit_gate
      - protected_local_authority_gate
    evidence_requirement: required
    evidence_scope_note: five-class separation requires Runtime base-entitlement and user-permission tests, one-shot reserved checks, exact Electron/Tauri app-owned command tests, and native-right disclosure checks
    test_files:
      - scripts/check-protected-local-authority.mjs
      - scripts/check-local-development-admission-authority.mjs
      - scripts/check-local-app-owner-boundary.mjs
  - rule_id: P-PERM-016
    evidence_refs:
      - platform_kernel_consistency
      - nimi_kit_gate
      - protected_local_authority_gate
    evidence_requirement: required
    evidence_scope_note: one agents.interact decision must cover the closed internal conversation/voice mapping while public manifest, SDK and ordinary UI expose no operation/resource identity
    test_files:
      - scripts/check-protected-local-authority.mjs
      - scripts/check-local-development-admission-authority.mjs
  - rule_id: P-PERM-017
    evidence_refs:
      - platform_kernel_consistency
      - protected_local_authority_gate
    evidence_requirement: required
    evidence_scope_note: every admitted row requires catalog, selector, owner lifecycle/proof, operation mapping, enforcement, SDK/Kit/UI, audit, revoke and positive/negative evidence; decision CRUD alone is insufficient
    test_files:
      - scripts/check-protected-local-authority.mjs
      - scripts/check-local-app-owner-boundary.mjs
