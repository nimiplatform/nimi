version: 1
table_family: product_catalog
owner: platform
catalog_id: platform_audit_evidence_roots
entries:
  - platform-web-release
  - avatar-shell-renderer-relative-modules
  - avatar-vrm-renderer-relative-modules
  - desktop-renderer-design-relative-modules
  - platform-kit-package-manifest
  - platform-shared-tauri-kit
  - platform-canonical-capability-catalog-codegen
  - platform-host-local-nimicoding-projection
  - spec-generation-audit-nimicoding-implementation
  - platform-repository-governance
  - runtime-proto-root-governance
  - sdks-root-package-governance
roots:
  - id: platform-web-release
    owner_domain: platform
    authority_refs:
      - .nimi/spec/platform/kernel/web-release-contract.md
    evidence_roots:
      - apps/web
      - apps/install-gateway
    source_rule: P-WEB-005
  - id: avatar-shell-renderer-relative-modules
    owner_domain: avatar
    authority_refs:
      - .nimi/spec/avatar/kernel/app-shell-contract.md
      - .nimi/spec/avatar/kernel/kit-ui-consumption-contract.md
      - .nimi/spec/avatar/kernel/mock-fixture-contract.md
      - .nimi/spec/avatar/kernel/tables/window-bounds-policy.yaml
    evidence_roots:
      - apps/avatar/src/shell/renderer
    source_rule: P-GOV-025
  - id: avatar-vrm-renderer-relative-modules
    owner_domain: avatar
    authority_refs:
      - .nimi/spec/avatar/kernel/vrm-backend-contract.md
    evidence_roots:
      - apps/avatar/src/shell/renderer
      - kit/features/avatar/src
    source_rule: P-GOV-025
  - id: desktop-renderer-design-relative-modules
    owner_domain: desktop
    authority_refs:
      - .nimi/spec/desktop/kernel/tables/renderer-design-overlays.yaml
      - .nimi/spec/desktop/kernel/tables/renderer-design-sidebars.yaml
      - .nimi/spec/desktop/kernel/tables/renderer-design-surfaces.yaml
    evidence_roots:
      - apps/desktop/src/shell/renderer
    source_rule: P-GOV-025
  - id: platform-kit-package-manifest
    owner_domain: platform
    authority_refs:
      - .nimi/spec/platform/kernel/kit-contract.md
      - .nimi/spec/platform/kernel/tables/nimi-kit-registry.yaml
    evidence_roots:
      - kit/package.json
    source_rule: P-KIT-090
  - id: platform-shared-tauri-kit
    owner_domain: platform
    authority_refs:
      - .nimi/spec/platform/kernel/kit-contract.md
      - .nimi/spec/platform/kernel/tables/nimi-kit-registry.yaml
    evidence_roots:
      - kit/shell/tauri
    source_rule: P-KIT-041
  - id: platform-canonical-capability-catalog-codegen
    owner_domain: platform
    authority_refs:
      - .nimi/spec/platform/kernel/tables/canonical-capability-catalog.yaml
      - .nimi/spec/platform/kernel/tables/nimi-kit-registry.yaml
    evidence_roots:
      - scripts/gen-canonical-capability-catalog.mjs
      - kit/core/src/runtime-capabilities/generated/canonical-capability-catalog.ts
    source_rule: P-CAPCAT-001
  - id: platform-host-local-nimicoding-projection
    owner_domain: platform
    authority_refs:
      - .nimi/spec/platform/kernel/package-authority-admission-contract.md
    evidence_roots:
      - .nimi/contracts
      - .nimi/methodology
    source_rule: P-PKG-006
  - id: spec-generation-audit-nimicoding-implementation
    owner_domain: spec-meta
    authority_refs:
      - .nimi/spec/platform/kernel/package-authority-admission-contract.md
    evidence_roots:
      - .nimi/contracts/spec-generation-audit.schema.yaml
      - .nimi/methodology/spec-reconstruction.yaml
      - package://@nimiplatform/nimi-coding/contracts/spec-generation-audit.schema.yaml
      - package://@nimiplatform/nimi-coding/methodology/spec-reconstruction.yaml
      - package://@nimiplatform/nimi-coding/cli/commands/validate-spec-audit.mjs
      - package://@nimiplatform/nimi-coding/cli/lib/internal/validators-spec.mjs
      - package://@nimiplatform/nimi-coding/cli/lib/closeout.mjs
      - package://@nimiplatform/nimi-coding/test/spec-generation-scenarios.mjs
      - package://@nimiplatform/nimi-coding/test/nimicoding.test.mjs
    source_rule: P-PKG-008
  - id: platform-repository-governance
    owner_domain: platform
    authority_refs:
      - .nimi/spec/platform/kernel/governance-contract.md
    evidence_roots:
      - .github
    source_rule: P-GOV-021
  - id: runtime-proto-root-governance
    owner_domain: runtime
    authority_refs:
      - .nimi/spec/runtime/kernel/proto-governance-contract.md
    evidence_roots:
      - proto
    source_rule: P-GOV-022
  - id: sdks-root-package-governance
    owner_domain: sdks
    authority_refs:
      - .nimi/spec/sdks/kernel/package-governance-contract.md
    evidence_roots:
      - sdks/typescript
    source_rule: P-GOV-022
