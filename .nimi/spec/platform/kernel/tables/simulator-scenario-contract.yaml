version: 1
table_family: protocol_surface
owner: platform
protocol_id: platform_simulator_scenario
source_rule: P-SIM-010
surfaces:
  - tracked_artifact
  - initial_state
  - module_data
  - launch
  - readiness
  - build_binding

tracked_artifact:
  path: config/simulator/scenario.yaml
  schema: nimi.simulator.scenario/v1
  active_artifacts: exactly_one
  unknown_fields: forbidden
  yaml_aliases_anchors_merges_custom_tags: forbidden
  generated_or_runtime_authored_input: forbidden
  compatibility_reader: forbidden
  top_level_required_fields:
    - schema
    - scenario_id
    - scenario_revision
    - seed
    - initial_logical_time
    - state
    - module_data
    - enabled_capabilities
    - launch
    - readiness
  id_pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
  revision_pattern: "^[a-z0-9][a-z0-9.-]*$"
  seed_pattern: "^[0-9a-f]{64}$"
  initial_logical_time: non_negative_safe_integer

initial_state:
  field: state
  exact_fields: [scenario, ecosystem, shell]
  value_type: immutable_json_value
  runtime_owner: simulator_state_engine
  external_product_truth: forbidden

module_data:
  representation: ordered_rows
  row_exact_fields: [module_id, data]
  module_id_pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
  data_type: immutable_json_value
  ordering: selected_registry_order
  duplicate_module_id: forbidden
  selected_module_coverage: exact
  app_fixture_as_runtime_input: forbidden
  desktop_auth:
    persona_input_count: exactly_one
    initial_status_enum: [anonymous, authenticated]
    canonical_initial_status: authenticated
    identity_identifier_prefix: sim-
    state_owner: simulator_state_engine
    per_instance_override: required
    shared_ecosystem_projection: derived_from_persona_at_scenario_construction_then_updated_by_declared_idempotent_interaction
    second_persona_authority: forbidden
    reset: clear_overrides_and_restore_initial_status
    post_login_ai_runtime_status: typed_unavailable

enabled_capabilities:
  representation: ordered_unique_strings
  ordering: unicode_code_point
  undeclared_or_unsupported_capability: forbidden

launch:
  representation: ordered_rows
  row_exact_fields: [launch_id, module_id, surface_id, activate]
  launch_id_pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
  surface_id_pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
  duplicate_launch_id: forbidden
  selected_module_required: true
  declared_surface_required: true
  activate_type: boolean
  execution_order: row_order
  instance_id_allocation: simulator_state_engine
  app_specific_shell_branch: forbidden

readiness:
  representation: ordered_rows
  row_exact_fields:
    - module_id
    - surface_id
    - contract_id
    - root_content_semantic_id
    - primary_control
    - projection
    - blocking
  row_identity: module_id_plus_surface_id
  duplicate_row_identity: forbidden
  selected_surface_coverage: exact
  app_declaration_match: exact
  primary_control_exact_fields: [semantic_id, aria_role, accessible_name]
  projection_exact_fields: [kind, json_pointer, expected]
  projection_kinds: [json_pointer_equals]
  json_pointer_syntax: RFC-6901
  blocking_exact_fields: [kind]
  blocking_kinds: [no_active_overlay_lease]
  semantic_marker_scope: assigned_renderer_and_overlay_roots_only
  authenticated_desktop_primary_control:
    owner: desktop_canonical_renderer
    required_surface: post_login_main_shell
    login_surface_marker: forbidden
    simulator_owned_desktop_dom: forbidden

build_binding:
  parser_owner: simulator
  manifest_cross_validation: required_before_registry_generation
  non_empty_selection_without_exact_scenario: fail
  generated_projection: apps/simulator/.generated/scenario.ts
  generated_projection_hand_edit: forbidden
  digest_algorithm: SHA-256
  digest_canonicalization: RFC-8785
  digest_domain: nimi-simulator-scenario-v1
  artifact_manifest_binding: required
  final_qualification_binding: required
  controlled_browser_profiles: [development, cp5-z, cp6]
  controlled_browser_trace_mechanism: shared_vite_chromium_qualification_trace
  all_launch_instances_usable: required
  default_desktop_shell: authenticated_post_login
  auth_runtime_realm_request_observation: zero
  browser_auth_persistence_observation: zero
  absolute_path_serialization: forbidden
  source_secret_or_credential: forbidden
