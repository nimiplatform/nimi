version: 1
table_family: protocol_surface
owner: platform
protocol_id: platform_simulator_state_engine
source_rule: P-SIM-010
surfaces:
  - snapshot
  - operation_queue
  - transaction
  - notification
  - logical_clock
  - async_reservation
  - random
  - stream
  - instance_lifecycle
  - scenario_reset
  - readiness
  - replay

snapshot:
  representation: immutable_json_value
  partitions: [scenario, ecosystem, shell, instances, modules]
  app_module_write_scope: own_modules_partition_only
  simulator_write_scope: declared_scenario_ecosystem_shell_instance_fields
  committed_revision_initial: 0
  revision_increment_per_successful_state_command: 1

operation_queue:
  queues_per_session: 1
  ordering: FIFO_acceptance_sequence
  accepted_kinds: [command, declared_query]
  drain: synchronous_to_quiescence
  await_inside_drain: forbidden
  host_yield_inside_drain: forbidden
  microtask_checkpoint_inside_drain: forbidden
  max_operations_per_drain: 10000
  overflow_result: SIMULATOR_INTEGRITY_FAILURE
  overflow_continue_in_new_turn: forbidden
  reducer_dispatch: forbidden
  wildcard_write_set: forbidden
  query_write: forbidden
  query_revision_increment: forbidden

transaction:
  input: one_committed_snapshot
  reducer: synchronous_pure
  success: atomic_snapshot_plus_one_revision_plus_ordered_events
  failure: zero_state_revision_event_change
  partial_commit: forbidden
  reducer_managed_rollback: forbidden

notification_order:
  - commit_snapshot_and_revision
  - allocate_event_sequences_in_declared_order
  - notify_state_subscribers_by_registration_sequence
  - deliver_events_by_event_sequence
  - target_modules_by_registry_ordering_key
  - target_instances_by_instance_creation_sequence
  - invoke_instance_handlers_by_subscription_sequence
  - record_command_result_settlement
  - continue_fifo_drain_without_yield
  - expose_recorded_promise_settlements_after_drain_returns

quiescence:
  state_engine_requires:
    - operation_queue_empty
    - no_subscriber_or_event_callback_running
    - no_due_clock_job_waiting_to_enqueue
    - no_immediately_releasable_async_reservation
  open_external_reservation_blocks: false
  session_additional_requirements:
    - no_active_reset
    - no_lifecycle_cleanup
    - no_readiness_barrier

logical_clock:
  unit: integer_millisecond
  minimum: 0
  maximum: Number.MAX_SAFE_INTEGER
  advancement: [advanceBy, advanceTo]
  job_order: due_time_then_allocation_sequence
  real_time_affects_state: forbidden

async_reservation:
  allocation: synchronous_before_await
  captures: [epoch, issuer, causation, command_type, payload_schema, allocation_sequence]
  settlement: schema_validated_completion_buffer
  release_order: allocation_sequence
  later_slot_overtake: forbidden
  states: [open, buffered, released, cancelled]
  settle_once: true
  cancel_reasons: [caller, dispose, reset]
  raw_exception_payload: forbidden
  promise_timing_as_order_truth: forbidden

random:
  generator: xoshiro256ss-v1
  seed_pattern: "^[0-9a-f]{64}$"
  all_zero_seed: forbidden
  seed_decode: four_big_endian_unsigned_64_bit_words
  arithmetic: javascript_bigint_masked_to_uint64
  mask_expression: "(1n << 64n) - 1n"
  draw_algorithm:
    - "output = rotl(s1 * 5, 7) * 9"
    - "t = s1 << 17"
    - "s2 ^= s0; s3 ^= s1; s1 ^= s2; s0 ^= s3"
    - "s2 ^= t; s3 = rotl(s3, 45)"
    - "value = Number(output >> 11n) / 9007199254740992"
  committed_json:
    required_fields: [generator, state, drawCount]
    generator_literal: xoshiro256ss-v1
    state_words: 4
    state_word_pattern: "^[0-9a-f]{16}$"
    draw_count: non_negative_safe_integer
    bigint_serialization: forbidden
  draw_state_commits_with_transaction: true
  math_random_affects_state: forbidden
  cryptographic_random_affects_state: forbidden

stream:
  id_pattern: "{epoch}:stream:{allocation_sequence}"
  allocation_order: stream_allocation_sequence
  terminal_order: stream_allocation_sequence
  stale_epoch_delivery: forbidden
  reset_terminal: cancelled

instance_lifecycle:
  states: [closed, loading, preparing, inactive, active, disposing, disposed, failed]
  transitions:
    - { from: closed, operation: open, to: loading }
    - { from: loading, operation: module_loaded, to: preparing }
    - { from: loading, operation: attributable_failure, to: failed }
    - { from: loading, operation: dispose, to: disposing_then_disposed }
    - { from: preparing, operation: prepare_success, to: inactive }
    - { from: preparing, operation: attributable_failure, to: failed }
    - { from: preparing, operation: dispose, to: disposing_then_disposed }
    - { from: inactive, operation: activate, to: active }
    - { from: active, operation: deactivate, to: inactive }
    - { from: inactive, operation: attributable_failure, to: failed }
    - { from: active, operation: attributable_failure, to: failed }
    - { from: inactive, operation: dispose, to: disposing_then_disposed }
    - { from: active, operation: dispose, to: disposing_then_disposed }
    - { from: failed, operation: dispose, to: disposing_then_disposed }
  invalid_transition_result: SIMULATOR_INVALID_LIFECYCLE
  ordinary_lifecycle_overlap: forbidden
  admitted_interrupt: close_during_prepare
  close_during_loading_constructs_adapter: false
  token_invalidation_precedes_cleanup: true
  cleanup_order:
    - unmount_surface
    - dispose_canonical_renderer_once
    - dispose_adapter_once
    - run_host_cleanup_once_in_reverse_registration_order
  watchdog_ms: 5000
  cleanup_failure_result: SIMULATOR_INTEGRITY_FAILURE
  disposed_instance_id_reuse_same_epoch: forbidden

scenario_reset:
  only_reset_operation: resetScenario
  instance_reset_hook: forbidden
  phases:
    - synchronous_old_epoch_linearization
    - asynchronous_ordered_cleanup_outside_fifo
    - synchronous_new_epoch_reconstruction_and_settlement
  linearization_actions:
    - set_session_resetting
    - close_all_admission
    - increment_epoch
    - invalidate_old_tokens
    - detach_accepted_tail_in_operation_sequence
    - end_old_drain
  cleanup_actions:
    - cancel_streams_by_allocation_sequence
    - cancel_jobs_and_reservations_by_allocation_sequence
    - dispose_instances_in_reverse_creation_order
    - observe_interrupted_prepare
    - enforce_cleanup_watchdog
  success_reconstruction:
    revision: 0
    allocation_sequences_restart_at: 1
    behavior_order: registry_order
    never_loaded_behavior: remains_unloaded
  settlement_order:
    - reset_result
    - detached_tail_by_operation_sequence
    - stream_reservation_readiness_lifecycle_terminals
  detached_tail_successful_reset_result: SIMULATOR_STALE_EPOCH
  barrier_failure_result: SIMULATOR_INTEGRITY_FAILURE
  accepted_result_left_pending: forbidden

canonical_ids:
  operation: "{epoch}:op:{sequence}"
  event: "{epoch}:evt:{sequence}"
  job: "{epoch}:job:{sequence}"
  instance: "{epoch}:instance:{sequence}"
  overlay: "{epoch}:overlay:{sequence}"
  stream: "{epoch}:stream:{sequence}"
  readiness: "{epoch}:ready:{sequence}"
  async_reservation: "{epoch}:async:{sequence}"
  first_epoch: 1

readiness:
  required_order:
    - typed_app_candidate
    - state_engine_quiescence
    - current_epoch_and_instance
    - react_commit
    - animation_frame_one
    - animation_frame_two
    - paint_composite_observation
    - semantic_markers_inside_assigned_roots
  cancelled_by: [close, reset, stale_epoch, state_change, instance_failure, module_failure, session_failure]
  skeleton_ready: forbidden
  off_root_marker: forbidden
  hidden_simulation_disclosure: forbidden

replay:
  canonicalization: RFC-8785
  digest: SHA-256
  required_inputs:
    - protocol_and_scenario_revision
    - selected_source_objects_and_digests
    - app_production_inventory
    - host_invocation_inventory
    - initial_seed_and_random_snapshot
    - logical_time
    - accepted_external_operations
    - reservation_allocations_and_terminals
    - stream_ids_and_terminals
    - readiness_and_reset_terminals
    - explicit_clock_advancements
    - expected_quiescent_revision_and_event_digest
  byte_identical_reproduction: required
