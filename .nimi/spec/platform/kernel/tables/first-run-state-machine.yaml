version: 1
table_family: product_state_machine
owner: platform
state_machine_id: nimi_product_first_run
source_rule: P-COLD-014
states:
  - state: not_logged_in
    surface: login
    entry_condition: no authenticated Runtime account session projection exists
    allowed_user_actions:
      - sign_in
      - open_recovery_only_when_admitted
    exit_condition: authenticated account session exists
    copy_floor: Sign in to use Nimi.
  - state: config_missing
    surface: internal_creation
    entry_condition: ~/.nimi/nimi.json is missing or cannot be parsed as a Nimi product config
    allowed_user_actions: []
    exit_condition: valid empty product config is created, otherwise blocked
    copy_floor: Nimi is creating its local product record.
  - state: data_root_missing
    surface: data_location_setup
    entry_condition: product config exists but no valid nimi_data root is recorded
    allowed_user_actions:
      - choose_folder
      - review_storage_role
      - confirm
    exit_condition: selected folder is absolute, writable, recorded in ~/.nimi/nimi.json, and required root directories are created
    copy_floor: Choose where Nimi stores models, apps, and large local data.
  - state: data_root_selected
    surface: device_environment_scan
    entry_condition: nimi_data is recorded and writable, but default AI environment proposal has not been generated
    allowed_user_actions:
      - wait
      - retry_scan
      - change_nimi_data_before_heavy_setup
    exit_condition: device, OS, storage, and Runtime-managed environment evidence is collected or fails closed
    copy_floor: Nimi is checking this device.
  - state: ai_environment_unconfigured
    surface: install_plan_choice
    entry_condition: Nimi has enough evidence to propose a local baseline but no materialization plan is confirmed
    allowed_user_actions:
      - choose_minimal
      - choose_recommended
      - review_size_time_capability_summary
      - confirm
      - change_data_root_before_heavy_setup
    exit_condition: user confirms a concrete Nimi initialization plan
    copy_floor: Choose how much of the local Nimi environment to install.
  - state: local_ai_profile_selected_assets_missing
    surface: download_install_progress
    entry_condition: user confirmed plan and selected profile needs local model or dependency assets that are not present
    allowed_user_actions:
      - pause_when_safe
      - cancel_when_safe
      - retry_failed_jobs
      - view_details
    exit_condition: required assets are downloaded, verified, and placed under selected nimi_data
    copy_floor: Nimi is downloading and verifying required local models and dependencies.
  - state: local_ai_profile_selected_environment_not_ready
    surface: environment_setup_progress
    entry_condition: required profile and asset plan are known, but managed environment or dependencies are missing or unverified
    allowed_user_actions:
      - retry
      - repair
      - view_details
    exit_condition: Runtime verifies required managed environment, dependencies, and activation evidence
    copy_floor: Nimi is preparing its managed local environment.
  - state: local_ai_assets_downloaded_environment_not_ready
    surface: repair_setup_progress
    entry_condition: assets are present, but activation or environment readiness still fails
    allowed_user_actions:
      - repair_dependency
      - retry_activation
      - view_failure_details
    exit_condition: Runtime activation and readiness evidence succeeds, or non-recoverable error moves to blocked
    copy_floor: Nimi has the files, but the local environment still needs repair.
  - state: local_ai_ready
    surface: finalization_progress
    entry_condition: local baseline route is ready, but account Default Profile, built-in AIConfigs, or snapshots are not fully committed
    allowed_user_actions:
      - wait
      - retry_finalization_on_failure
    exit_condition: Account Default Profile exists, built-in AIConfig scopes are applied, and baseline execution evidence is valid
    copy_floor: Nimi is finishing your default AI setup.
  - state: repair_required
    surface: repair_flow
    entry_condition: a previously valid required component is missing, stale, corrupted, failed verification, or inconsistent
    allowed_user_actions:
      - repair
      - retry
      - export_logs
      - change_nimi_data_only_through_migration
    exit_condition: repair restores required evidence and returns to the appropriate setup state or ready_for_use
    copy_floor: Nimi needs to repair a required local component before normal use.
  - state: blocked
    surface: blocking_error
    entry_condition: Nimi cannot safely create config, use data root, validate account/session, or materialize required baseline
    allowed_user_actions:
      - retry_when_available
      - choose_another_data_root_when_relevant
      - export_logs
      - open_support
    exit_condition: blocking cause is resolved, then state machine re-evaluates from earliest affected state
    copy_floor: Nimi cannot continue safely yet.
  - state: ready_for_use
    surface: ordinary_shell_chat_nimi_chat
    entry_condition: login, config, nimi_data, Account Default Profile, built-in AIConfigs, Runtime baseline, and execution evidence are valid
    allowed_user_actions:
      - use_nimi
      - open_runtime_for_optional_changes
    exit_condition: remains ready until required evidence becomes invalid, then repair_required or not_logged_in
    copy_floor: Nimi is ready.
