description: Platform-neutral bidirectional executable-trust semantics plus closed OS code-signing profiles and trust rows.
authority_refs: [P-NAPP-034, P-NAPP-037, K-PLOCAL-003, K-PLOCAL-005]
platform_admission:
  closeout_unit: os_platform
  independent_admission_allowed: true
  windows: admitted_same_open_object_authenticode
  linux: requirements_only_fail_closed_pending_native_admission
  macos: requirements_only_fail_closed_pending_native_admission
  macos_local_development: local_development_non_product_admitted
  unadmitted_platform_disposition: fail_closed
  cross_platform_parity_required_before_first_platform_positive_chain: false
trust_set_schema:
  fields:
    - trust_set_id
    - executable_role
    - environment
    - allowed_os_profiles
    - platform_code_signing_policy_ref
    - installer_release_authority
    - launch_authority
    - configuration_authority
    - runtime_build_allowance
    - product_readiness_claim_allowed
    - runtime_configuration_mutable
    - source_rule
signer_policy_schema:
  fields:
    - signer_policy_id
    - environment
    - identity_authority
    - platform_verification_profile_ref
    - key_material_boundary
    - identity_class
    - release_record_signature_algorithm
    - team_id_posture
    - notarization_posture
    - runtime_build_allowance
    - source_rule
neutral_contract:
  verification_direction: bidirectional_runtime_and_client_carrier
  process_and_executable_binding: same_running_process_and_same_open_executable_object
  executable_role_binding: required
  service_or_launch_authority_binding: required
  trust_set_and_signer_policy_binding: required
  caller_selected_path_release_or_policy: forbidden
  peer_owned_release_generation: forbidden
  custom_peer_release_record: forbidden_only_platform_release_root_signed_fixed_role_record_allowed
  update_and_rollback_authority: signed_installer_package_manager_or_service_updater
  immutable_app_release_digest_authority: opaque_0K_slot_unavailable_for_positive_launch_until_0P
  same_open_object_required: true
  unavailable_disposition: fail_closed_before_protocol_or_credential_bytes
release_trust_record_schema:
  encoding: RFC_8785_JSON_Canonicalization_Scheme_UTF_8
  schema_version: 2
  signature: signer_policy_selected_algorithm_over_canonical_record_without_signature
  production_signature: Ed25519_over_canonical_record_without_signature
  local_development_signature: ECDSA_P256_SHA256_DER_over_canonical_record_without_signature # pragma: allowlist secret -- public signature algorithm identifier, not credential material
  root: stable_profile_specific_release_root_public_key_and_key_id_embedded_only_in_matching_compile_time_verifier
  release_private_key_custody: fixed_root_owned_same_team_signed_/usr/local/libexec/nimi-release-record-signer_HSM_or_Keychain_service_stdin_payload_only_no_private_key_in_argv_environment_repo_or_artifact
  maximum_bytes: 65536
  fields:
    - schema_version
    - environment
    - identity_class
    - signature_algorithm
    - executable_role
    - trust_set_id
    - os_profile
    - protected_local_protocol_version
    - compatible_peer_release_ids
    - release_id
    - build_id
    - artifact_sha256
    - signer_policy_id
    - windows_leaf_spki_sha256
    - windows_chain_policy_ref
    - macos_designated_requirement
    - macos_team_id
    - macos_leaf_spki_sha256
    - macos_cdhash
    - macos_hardened_runtime_required
    - macos_notarization_required
    - linux_manifest_key_id
    - os_service_principal
    - valid_from
    - expires_at
    - generation
    - root_key_id
    - signature
  macos_release_order:
    - sign_each_nested_executable_inside_out_without_deep_resigning
    - sign_Nimi.app_outer_bundle_last_to_seal_nested_code_and_resources
    - notarize_and_staple_the_exact_final_Nimi.app
    - compute_same_open_vnode_sha256_final_dynamic_SecCode_cdhash_and_designated_requirement
    - emit_and_Platform_release_root_sign_one_external_fixed_path_record_per_executable_role
    - package_exact_final_app_and_role_records_with_Developer_ID_Installer_signature
    - notarize_and_staple_the_exact_final_installer_package
  macos_fixed_record_root: /Library/Application Support/Nimi/Runtime/trust/protected-local/v1
  macos_role_records:
    - executable_role: nimi_runtime_service
      trust_set_id: nimi-runtime-production-v1
      signing_identifier: ai.nimi.runtime
      os_service_principal: _nimiruntime
      fixed_filename: nimi_runtime_service.release-trust-record.json
    - executable_role: nimi_desktop
      trust_set_id: nimi-desktop-production-v1
      signing_identifier: ai.nimi.apps.nimi.desktop
      os_service_principal: active_console_user
      fixed_filename: nimi_desktop.release-trust-record.json
    - executable_role: nimi_local_app_host
      trust_set_id: nimi-local-development-host-macos-production-v1
      signing_identifier: ai.nimi.apps.nimi.local-app-host
      os_service_principal: verified_desktop_supervised_active_console_user
      fixed_filename: nimi_local_app_host.release-trust-record.json
  macos_local_development_record_root: /Library/Application Support/Nimi/RuntimeDev/active/trust/protected-local/v1
  macos_fixed_record_path_authority:
    system_owned_ancestors:
      - /Library
      - /Library/Application Support
    system_owned_ancestor_policy: exact_absolute_component_open_with_O_NOFOLLOW_then_root_UID_directory_nonzero_link_count_and_group_world_nonwritable;_native_OS_group_and_nonwritable_mode_are_preserved
    nimi_owned_subtree_root: /Library/Application Support/Nimi
    nimi_owned_subtree_policy: every_component_from_Nimi_through_the_record_parent_is_exact_root_wheel_mode_0755_directory_nonzero_link_count_and_opened_without_symlink_following
    record_policy: exact_root_wheel_mode_0644_regular_single_link_file_opened_with_O_NOFOLLOW_and_same_open_vnode_read_stability
    system_directory_reownership_or_chmod: forbidden
  macos_local_development_role_records:
    - executable_role: nimi_runtime_service
      trust_set_id: nimi-runtime-macos-local-development-v1
      signing_identifier: ai.nimi.runtime.dev
      os_service_principal: _nimiruntimedev
      fixed_filename: nimi_runtime_service.release-trust-record.json
    - executable_role: nimi_desktop
      trust_set_id: nimi-desktop-macos-local-development-v1
      signing_identifier: ai.nimi.apps.nimi.desktop.dev
      os_service_principal: active_console_user
      fixed_filename: nimi_desktop.release-trust-record.json
    - executable_role: nimi_local_app_host
      trust_set_id: nimi-local-development-host-macos-local-development-v1
      signing_identifier: ai.nimi.apps.nimi.local-app-host.dev
      os_service_principal: verified_desktop_supervised_active_console_user
      fixed_filename: nimi_local_app_host.release-trust-record.json
  macos_identity_class_rules:
    production:
      identity_class: developer_id_application
      signature_algorithm: ed25519
      macos_team_id: exact_nonempty_required
      macos_leaf_spki_sha256: optional_empty
      macos_hardened_runtime_required: true
      macos_notarization_required: true
    local_development:
      identity_class: local_ca
      signature_algorithm: ecdsa_p256_sha256
      macos_team_id: exact_empty_required
      macos_leaf_spki_sha256: exact_lower_hex_sha256_required
      macos_hardened_runtime_required: true
      macos_notarization_required: false
  macos_forbidden_cycle: final_peer_cdhash_compiled_into_mutually_verifying_executables_or_Desktop_cdhash_record_embedded_inside_the_same_outer_bundle_resource_seal
  validation:
    - fixed_role_record_path_only
    - OS_owned_/Library_and_/Library/Application_Support_ancestors_require_root_UID_directory_and_group_world_nonwritable_without_requiring_wheel;_Nimi_owned_subtree_requires_exact_root_wheel_0755_directories;_record_requires_exact_root_wheel_0644_regular_single_link_same_open_vnode
    - canonical_bytes_equal_input
    - exact_root_key_id_and_valid_signature
    - exact_environment_role_trust_set_os_protocol_signer_policy_and_service_principal
    - nonempty_unique_mutually_compatible_peer_release_ids
    - current_time_within_valid_from_inclusive_expires_at_exclusive
    - Runtime_Keychain_anchored_append_only_per_role_generation_high_water_after_actual_process_verification_no_rollback_or_generation_rebinding
    - same_open_vnode_artifact_sha256
    - dynamic_SecCode_designated_requirement_team_id_cdhash_and_identifier
    - final_outer_bundle_strict_static_validity_and_resource_seal_independent_of_external_record_content_authority
    - identity_class_signature_algorithm_team_id_leaf_SPKI_hardened_runtime_and_notarization_posture_match_exact_compile_time_profile
platform_verification_profile_schema:
  fields:
    - os
    - admission
    - native_release_verification
    - client_executable_verification
    - server_executable_verification
    - production_signer_constraint
    - non_product_test_signer_constraint
