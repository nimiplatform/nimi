    source_rule: K-PLOCAL-005
  - os: macos
    admission: requirements_only_fail_closed_pending_native_admission
    native_release_verification: LOCAL_PEERTOKEN_connected_process_plus_dynamic_SecCode_exact_designated_requirement_team_id_identifier_cdhash_hardened_runtime_same_open_vnode_Platform_release_root_signed_fixed_role_record_outer_bundle_seal_notarization_and_Gatekeeper_acceptance
    client_executable_verification: running_process_audit_token_dynamic_SecCode_exact_role_requirement_team_id_identifier_cdhash_from_signed_role_record_hardened_runtime_same_open_vnode_digest_and_liveness
    server_executable_verification: running_runtime_audit_token_dynamic_SecCode_exact_Runtime_requirement_team_id_identifier_cdhash_from_signed_role_record_hardened_runtime_installed_same_open_vnode_digest_stable_launchd_job_and_boot_epoch
    production_signer_constraint: Developer_ID_Application_exact_designated_requirement_team_id_identifier_release_record_cdhash_notarization_hardened_runtime_and_executable_role
    non_product_test_signer_constraint: explicit_external_non_product_certificate_exact_designated_requirement_identifier_leaf_SPKI_cdhash_hardened_runtime_Team_ID_absent_and_executable_role_never_product_ready
    service_or_launch_authority: signed_notarized_SMAppService_registered_launchd_system_daemon_or_signed_Desktop_supervised_posix_spawn_child
    pathname_only_verification: forbidden
    verified_transport_profile_ref: .nimi/spec/runtime/kernel/tables/protected-local-os-profiles.yaml#same-os
    source_rule: K-PLOCAL-005
signer_policies:
  - signer_policy_id: nimi-production-release-signing-policy
    environment: production
    identity_authority: nimi_production_release_signing_identity
    platform_verification_profile_ref: platform_verification_profiles#same-os
    key_material_boundary: production_release_signing_service_only
    identity_class: developer_id_application
    release_record_signature_algorithm: ed25519
    team_id_posture: exact_nonempty_required_on_macos
    notarization_posture: required_on_macos
    runtime_build_allowance: production_only
    source_rule: P-NAPP-034
  - signer_policy_id: external-non-product-e2e-signing-policy
    environment: non_product_test
    identity_authority: external_ephemeral_e2e_fixture_identity
    platform_verification_profile_ref: platform_verification_profiles#same-os
    key_material_boundary: external_test_secret_store_only
    identity_class: external_test_fixture
    release_record_signature_algorithm: ed25519
    team_id_posture: platform_fixture_specific
    notarization_posture: never_product_ready
    runtime_build_allowance: test_only
    source_rule: P-NAPP-034
  - signer_policy_id: nimi-macos-local-development-signing-policy
    environment: local_development
    identity_authority: machine_local_non_product_CA_with_distinct_P256_role_leaves
    platform_verification_profile_ref: platform_verification_profiles#macos
    key_material_boundary: System_Keychain_root_CA_record_signer_and_helper_bound_unlock_secret_plus_root_wheel_0600_locked_system_domain_role_identity_keychain_opened_only_inside_the_real_uid_0_helper_transaction;_direct_System_Keychain_role_key_ACL_to_/usr/bin/codesign_is_forbidden
    identity_class: local_ca
    release_record_signature_algorithm: ecdsa_p256_sha256
    team_id_posture: exact_empty_required
    notarization_posture: absent_and_must_not_be_claimed
    runtime_build_allowance: compile_time_macos_local_development_only
    source_rule: P-NAPP-037
