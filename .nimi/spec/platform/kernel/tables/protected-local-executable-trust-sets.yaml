version: 2
table_family: product_catalog
owner: platform
catalog_id: platform_protected_local_executable_trust_sets
entries:
  - nimi-desktop-production-v1
  - nimi-desktop-e2e-fixture-v1
  - nimi-runtime-production-v1
  - nimi-desktop-control-carrier-production-v1
  - nimi-desktop-control-carrier-e2e-fixture-v1
  - nimi-production-release-signing-policy
  - external-non-product-e2e-signing-policy
description: Platform-neutral bidirectional executable-trust semantics plus closed OS code-signing profiles and trust rows.
authority_refs: [P-NAPP-034, K-PLOCAL-003, K-PLOCAL-005]
platform_admission:
  closeout_unit: os_platform
  independent_admission_allowed: true
  windows: admitted_same_open_object_authenticode
  linux: requirements_only_fail_closed_pending_native_admission
  macos: requirements_only_fail_closed_pending_native_admission
  unadmitted_platform_disposition: fail_closed
  cross_platform_parity_required_before_first_platform_positive_chain: false
trust_set_schema:
  fields:
    - trust_set_id
    - executable_role
    - environment
    - allowed_os_profiles
    - platform_code_signing_policy_ref
    - installer_release_authority
    - launch_authority
    - configuration_authority
    - runtime_build_allowance
    - product_readiness_claim_allowed
    - runtime_configuration_mutable
    - source_rule
signer_policy_schema:
  fields:
    - signer_policy_id
    - environment
    - identity_authority
    - platform_verification_profile_ref
    - key_material_boundary
    - runtime_build_allowance
    - source_rule
neutral_contract:
  verification_direction: bidirectional_runtime_and_client_carrier
  process_and_executable_binding: same_running_process_and_same_open_executable_object
  executable_role_binding: required
  service_or_launch_authority_binding: required
  trust_set_and_signer_policy_binding: required
  caller_selected_path_release_or_policy: forbidden
  peer_owned_release_generation: forbidden
  custom_peer_release_record: absent
  update_and_rollback_authority: signed_installer_package_manager_or_service_updater
  immutable_app_release_digest_authority: opaque_0K_slot_unavailable_for_positive_launch_until_0P
  same_open_object_required: true
  unavailable_disposition: fail_closed_before_protocol_or_credential_bytes
platform_verification_profile_schema:
  fields:
    - os
    - admission
    - native_release_verification
    - client_executable_verification
    - server_executable_verification
    - production_signer_constraint
    - non_product_test_signer_constraint
    - service_or_launch_authority
    - pathname_only_verification
    - verified_transport_profile_ref
    - source_rule
platform_verification_profiles:
  - os: windows
    admission: admitted_same_open_object_authenticode
    native_release_verification: connected_process_same_open_hfile_plus_WinVerifyTrust_and_installer_owned_Nimi_signer_policy
    client_executable_verification: same_open_hfile_volume_serial_file_id_win_verify_trust_installer_signer_policy
    server_executable_verification: same_open_hfile_volume_serial_file_id_win_verify_trust_installer_signer_policy_and_service_sid
    production_signer_constraint: exact_authenticode_publisher_leaf_certificate_and_executable_role
    non_product_test_signer_constraint: exact_non_product_fixture_certificate_and_executable_role
    service_or_launch_authority: signed_installer_fixed_service_definition_or_signed_desktop_launch_registration
    pathname_only_verification: forbidden
    verified_transport_profile_ref: .nimi/spec/runtime/kernel/tables/protected-local-os-profiles.yaml#same-os
    source_rule: K-PLOCAL-005
  - os: linux
    admission: requirements_only_fail_closed_pending_native_admission
    native_release_verification: connected_process_proc_exe_fd_device_inode_plus_signed_package_repository_identity_and_system_service_definition
    client_executable_verification: opened_proc_pid_exe_fd_device_inode_platform_package_signing_identity
    server_executable_verification: opened_proc_pid_exe_fd_device_inode_platform_package_signing_identity
    production_signer_constraint: exact_signed_package_repository_identity_and_executable_role
    non_product_test_signer_constraint: exact_non_product_fixture_release_digest_and_executable_role
    service_or_launch_authority: signed_system_package_service_definition_or_signed_desktop_carrier_launch
    pathname_only_verification: forbidden
    verified_transport_profile_ref: .nimi/spec/runtime/kernel/tables/protected-local-os-profiles.yaml#same-os
    source_rule: K-PLOCAL-005
  - os: macos
    admission: requirements_only_fail_closed_pending_native_admission
    native_release_verification: connected_process_audit_token_plus_dynamic_SecCode_designated_requirement_team_id_cdhash_and_notarized_installer
    client_executable_verification: running_process_dynamic_SecCode_designated_requirement_team_id_cdhash
    server_executable_verification: running_runtime_dynamic_SecCode_designated_requirement_team_id_cdhash
    production_signer_constraint: exact_designated_requirement_team_id_cdhash_notarization_and_executable_role
    non_product_test_signer_constraint: exact_non_product_designated_requirement_team_id_cdhash_and_executable_role
    service_or_launch_authority: signed_installer_launchd_system_daemon_or_signed_desktop_application_registration
    pathname_only_verification: forbidden
    verified_transport_profile_ref: .nimi/spec/runtime/kernel/tables/protected-local-os-profiles.yaml#same-os
    source_rule: K-PLOCAL-005
signer_policies:
  - signer_policy_id: nimi-production-release-signing-policy
    environment: production
    identity_authority: nimi_production_release_signing_identity
    platform_verification_profile_ref: platform_verification_profiles#same-os
    key_material_boundary: production_release_signing_service_only
    runtime_build_allowance: production_only
    source_rule: P-NAPP-034
  - signer_policy_id: external-non-product-e2e-signing-policy
    environment: non_product_test
    identity_authority: external_ephemeral_e2e_fixture_identity
    platform_verification_profile_ref: platform_verification_profiles#same-os
    key_material_boundary: external_test_secret_store_only
    runtime_build_allowance: test_only
    source_rule: P-NAPP-034
production_runtime_accepts_test_trust_set: false
test_runtime_accepts_production_realm_endpoints: false
test_runtime_accepts_production_account_custody: false
production_runtime_trusts_user_selected_executable: false
production_configuration_override_sources_forbidden: [environment_variable, argv, renderer_url, app_manifest, user_writable_config]
trust_direction_requirements:
  runtime_verifies_desktop_or_control_carrier: required
  desktop_or_control_carrier_verifies_runtime: required
selection_override_sources_forbidden:
  - environment_variable
  - app_manifest
  - renderer_metadata
  - app_owned_host_metadata
  - request_field
fixture_private_key_locations_forbidden:
  - repository
  - product_bundle
  - app_starter
  - evidence_artifact
trust_sets:
  - trust_set_id: nimi-desktop-production-v1
    executable_role: nimi_desktop
    environment: production
    allowed_os_profiles: [windows, macos]
    platform_code_signing_policy_ref: nimi-production-release-signing-policy
    installer_release_authority: signed_desktop_installer_and_os_update_registration
    launch_authority: interactive_start_signed_binary_with_immutable_production_config
    configuration_authority: signed_release_descriptor_no_environment_argv_or_renderer_url_override
    runtime_build_allowance: production_only
    product_readiness_claim_allowed: true
    runtime_configuration_mutable: false
    source_rule: P-NAPP-034
  - trust_set_id: nimi-desktop-e2e-fixture-v1
    executable_role: nimi_desktop
    environment: non_product_test
    allowed_os_profiles: [windows, macos]
    platform_code_signing_policy_ref: external-non-product-e2e-signing-policy
    installer_release_authority: isolated_non_product_fixture_installer
    launch_authority: non_product_harness_only
    configuration_authority: non_product_harness_config_only
    runtime_build_allowance: test_only
    product_readiness_claim_allowed: false
    runtime_configuration_mutable: false
    source_rule: P-NAPP-034
  - trust_set_id: nimi-runtime-production-v1
    executable_role: nimi_runtime_service
    environment: production
    allowed_os_profiles: [windows, linux, macos]
    platform_code_signing_policy_ref: nimi-production-release-signing-policy
    installer_release_authority: signed_runtime_service_installer_or_service_updater
    launch_authority: os_service_manager_exact_signed_service_definition
    configuration_authority: signed_service_definition_and_runtime_release_descriptor_only
    runtime_build_allowance: production_only
    product_readiness_claim_allowed: true
    runtime_configuration_mutable: false
    source_rule: P-NAPP-034
  - trust_set_id: nimi-desktop-control-carrier-production-v1
    executable_role: nimi_desktop_control_carrier
    environment: production
    allowed_os_profiles: [linux]
    platform_code_signing_policy_ref: nimi-production-release-signing-policy
    installer_release_authority: signed_desktop_installer_inherited_static_carrier
    launch_authority: desktop_explicit_inherited_handle_spawn_only
    configuration_authority: signed_static_carrier_no_runtime_configuration_inputs
    runtime_build_allowance: production_only
    product_readiness_claim_allowed: true
    runtime_configuration_mutable: false
    source_rule: P-NAPP-034
  - trust_set_id: nimi-desktop-control-carrier-e2e-fixture-v1
    executable_role: nimi_desktop_control_carrier
    environment: non_product_test
    allowed_os_profiles: [linux]
    platform_code_signing_policy_ref: external-non-product-e2e-signing-policy
    installer_release_authority: isolated_non_product_desktop_fixture_carrier
    launch_authority: non_product_desktop_harness_explicit_handle_only
    configuration_authority: synthetic_non_product_carrier_config_only
    runtime_build_allowance: test_only
    product_readiness_claim_allowed: false
    runtime_configuration_mutable: false
    source_rule: P-NAPP-034
