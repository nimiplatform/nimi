version: 1
table_family: product_catalog
owner: platform
catalog_id: platform_nimi_app_release_descriptors
entries:
  - descriptors_1
  - release descriptor is the install truth for each installable app version
  - third-party install must verify sha256 before unpack, registration, or execution
  - GitHub and npm are source/distribution inputs only, not admission truth
  - bundled first-party descriptors bind to the atomic Nimi release bundle and do not authorize external download
  - Zhiyu R1 uses a bundled first-party descriptor and does not use the local
    PP12 tarball as release trust

descriptor_schema:
  owner: platform_nimi_app_release_descriptors
  fields:
    - descriptor_id
    - app_id
    - version
    - admission_track
    - descriptor_class
    - publisher
    - source
    - artifact
    - artifact_mirror_ref
    - mirror_license_cleared
    - build_assurance
    - dependency_assurance
    - platform_signing_assurance
    - runtime
    - permissions_ref
    - storage_policy_ref.id
    - storage_policy_ref.kind
    - os_storage_disclosure
    - update_channel_ref
    - rollback_eligibility
    - review
    - support
    - source_rule
  enums:
    descriptor_class:
      - bundled-with-nimi
      - external-immutable-artifact
    source.kind:
      - nimi-bundle
      - github-release
      - github-commit
      - npm-package
      - admission-sandbox-https-artifact
    admission_track:
      - ordinary-release-proof
      - admission-sandbox-ci
    artifact.digest_algorithm:
      - sha256
    runtime.package_kind:
      - nimi-app
    storage_policy_ref.kind:
      - nimi-mediated-default
      - app-owned-os-storage

descriptors:
  - descriptor_id: nimi.avatar.bundled-with-nimi
    app_id: nimi.avatar
    version: bundled-with-current-nimi-release
    descriptor_class: bundled-with-nimi
    source:
      kind: nimi-bundle
      ref: current-atomic-nimi-release
    artifact:
      locator: current-nimi-release-bundle
      digest_algorithm: sha256
      sha256: inherited-from-atomic-nimi-release-manifest
      size: inherited-from-atomic-nimi-release-manifest
      signature_or_provenance_ref: nimi-first-party-signature-policy
    runtime:
      package_kind: nimi-app
      entry_ref: avatar-runtime-registration
      sandbox_ref: first-party-bundled-app
    permissions_ref: nimi.avatar.permission_scope_ref
    storage_policy_ref: nimi-data-app-roots
    review:
      admission_path: first-party-bundled-release
      mutable_source_allowed: false
      install_digest_verification_required: inherited_from_atomic_bundle
    source_rule: P-NAPP-014
  - descriptor_id: nimi.realm-persona-studio.bundled-with-nimi
    app_id: nimi.realm-persona-studio
    version: bundled-with-current-nimi-release
    descriptor_class: bundled-with-nimi
    source:
      kind: nimi-bundle
      ref: current-atomic-nimi-release
    artifact:
      locator: current-nimi-release-bundle
      digest_algorithm: sha256
      sha256: inherited-from-atomic-nimi-release-manifest
      size: inherited-from-atomic-nimi-release-manifest
      signature_or_provenance_ref: nimi-first-party-signature-policy
    runtime:
      package_kind: nimi-app
      entry_ref: realm-persona-studio-runtime-registration
      sandbox_ref: first-party-bundled-app
    permissions_ref: nimi.realm-persona-studio.permission_scope_ref
    storage_policy_ref: nimi-data-app-roots
    review:
      admission_path: first-party-bundled-release
      mutable_source_allowed: false
