version: 1
table_family: product_catalog
owner: platform
catalog_id: platform_nimi_app_release_descriptors
entries:
  - descriptors_1
  - release descriptor is the install truth for each installable app version
  - third-party install must verify sha256 before unpack, registration, or execution
  - GitHub and npm are source/distribution inputs only, not admission truth
  - bundled first-party descriptors bind to the atomic Nimi release bundle and do not authorize external download

descriptor_schema:
  owner: platform_nimi_app_release_descriptors
  fields:
    - descriptor_id
    - app_id
    - version
    - descriptor_class
    - source
    - artifact
    - runtime
    - permissions_ref
    - storage_policy_ref
    - review
    - source_rule
  enums:
    descriptor_class:
      - bundled-with-nimi
      - external-immutable-artifact
    source.kind:
      - nimi-bundle
      - github-release
      - github-commit
      - npm-package
    artifact.digest_algorithm:
      - sha256
    runtime.package_kind:
      - nimi-app

descriptors:
  - descriptor_id: nimi.avatar.bundled-with-nimi
    app_id: nimi.avatar
    version: bundled-with-current-nimi-release
    descriptor_class: bundled-with-nimi
    source:
      kind: nimi-bundle
      ref: current-atomic-nimi-release
    artifact:
      locator: current-nimi-release-bundle
      digest_algorithm: sha256
      sha256: inherited-from-atomic-nimi-release-manifest
      size: inherited-from-atomic-nimi-release-manifest
      signature_or_provenance_ref: nimi-first-party-signature-policy
    runtime:
      package_kind: nimi-app
      entry_ref: avatar-runtime-registration
      sandbox_ref: first-party-bundled-app
    permissions_ref: nimi.avatar.permission_scope_ref
    storage_policy_ref: nimi-data-app-roots
    review:
      admission_path: first-party-bundled-release
      mutable_source_allowed: false
      install_digest_verification_required: inherited_from_atomic_bundle
    source_rule: P-NAPP-014

  - descriptor_id: nimi.shijing.bundled-with-nimi
    app_id: nimi.shijing
    version: bundled-with-current-nimi-release
    descriptor_class: bundled-with-nimi
    source:
      kind: nimi-bundle
      ref: current-atomic-nimi-release
    artifact:
      locator: current-nimi-release-bundle
      digest_algorithm: sha256
      sha256: inherited-from-atomic-nimi-release-manifest
      size: inherited-from-atomic-nimi-release-manifest
      signature_or_provenance_ref: nimi-first-party-signature-policy
    runtime:
      package_kind: nimi-app
      entry_ref: shijing-runtime-registration
      sandbox_ref: first-party-bundled-app
    permissions_ref: nimi.shijing.permission_scope_ref
    storage_policy_ref: nimi-data-app-roots
    review:
      admission_path: first-party-bundled-release
      mutable_source_allowed: false
      install_digest_verification_required: inherited_from_atomic_bundle
    source_rule: P-NAPP-014

  - descriptor_id: nimi.tester.bundled-with-nimi
    app_id: nimi.tester
    version: bundled-with-current-nimi-release
    descriptor_class: bundled-with-nimi
    source:
      kind: nimi-bundle
      ref: current-atomic-nimi-release
    artifact:
      locator: current-nimi-release-bundle
      digest_algorithm: sha256
      sha256: inherited-from-atomic-nimi-release-manifest
      size: inherited-from-atomic-nimi-release-manifest
      signature_or_provenance_ref: nimi-first-party-signature-policy
    runtime:
      package_kind: nimi-app
      entry_ref: tester-runtime-registration
      sandbox_ref: first-party-bundled-app
    permissions_ref: nimi.tester.permission_scope_ref
    storage_policy_ref: nimi-data-app-roots
    review:
      admission_path: first-party-bundled-release
      mutable_source_allowed: false
      install_digest_verification_required: inherited_from_atomic_bundle
    source_rule: P-NAPP-016

third_party_descriptor_floor:
  required_fields:
    - descriptor_id
    - app_id
    - version
    - publisher.github_namespace
    - publisher.namespace_kind
    - publisher.identity_assurance
    - publisher.verified_domain
    - publisher.kyc_verification_ref
    - source.kind
    - source.ref
    - artifact.locator
    - artifact.sha256
    - artifact.size
    - artifact.size.download
    - artifact.size.installed
    - artifact.size.user_data
    - artifact.size.cache
    - artifact.size.shared_deps
    - artifact.signature_or_provenance_ref
    - artifact_mirror_ref
    - mirror_license_cleared
    - build_assurance
    - dependency_assurance
    - platform_signing_assurance
    - platform_signing_assurance.macos_notarization
    - platform_signing_assurance.macos_developer_id_subject
    - platform_signing_assurance.windows_code_signing
    - platform_signing_assurance.installer_signature
    - platform_signing_assurance.entitlements_ref
    - platform_signing_assurance.signing_subject
    - runtime.package_kind
    - runtime.entry_ref
    - runtime.sandbox_ref
    - permissions_ref
    - storage_policy_ref
    - update_channel_ref
    - rollback_eligibility
    - review.admission_path
    - review.decision
    - review.adjudicator_kind
    - review.adjudicator_ref
    - review.decided_at
    - support.diagnostics_bundle_fields
    - support.redaction_rules
    - support.user_visible_issue_categories
    - support.escalation_path
    - support.kill_switch_visibility
    - support.recovery_instructions
  allowed_source_kinds:
    - github-release
    - github-commit
    - npm-package
  forbidden_install_inputs:
    - mutable_git_branch
    - mutable_git_tag_without_protection
    - npm_dist_tag
    - npm_version_range
    - direct_npx
    - direct_clone_build_run
    - arbitrary_install_script_as_product_truth
  forbidden_third_party_build_assurance:
    - checksum-pinned
  verification:
    before_unpack_register_execute: sha256_must_match_descriptor
    mismatch: fail_closed_no_install_no_execution
