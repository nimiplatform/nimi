    parent_p_gov_anchors: [P-GOV-003]
    experimental: false

  - id: gate.cargo.clippy
    description: Desktop Rust cargo clippy with generated bundled runtime release resources.
    command: pnpm --filter @nimiplatform/desktop run check:cargo:clippy
    runner: pnpm
    tiers: [release, release-target:desktop]
    targets: [desktop]
    timeout_seconds: 900
