table_family: gate_registry
owner: platform
registry_id: platform_release_gate_registry
# Release Gate Registry
#
# Single source of release gate identity, governed by P-RELG-001..014
# in .nimi/spec/platform/kernel/release-gate-contract.md (operational
# refinement of P-GOV-003, P-GOV-011, P-GOV-021, P-GOV-023).
#
# DO NOT hand-edit gate rows in projection surfaces (preflight, lint
# chain, CI workflow fences). Every projection is generated from this
# file. Hand-edits in projection surfaces are a projection-drift fail.

schema_version: release-gate-registry/v1
registry_version: "3.1.3"
profile_id: nimi
# -----------------------------------------------------------------------
# Tier definitions (P-RELG-012 tier membership constraint)
# -----------------------------------------------------------------------
tiers:
  - id: pre-commit
    semantic: instant_no_network_per_staged_file
  - id: fast
    semantic: dev_laptop_under_60s_no_secrets
  - id: regression
    semantic: deterministic_workspace_test_aggregate
  - id: first-public-existence
    semantic: named_first_public_existence_proof_bundle
  - id: release
    semantic: full_release_blocking_set
  - id: release-target:sdk
    semantic: sdk_release_blocking_subset
  - id: release-target:runtime
    semantic: runtime_release_blocking_subset
  - id: release-target:proto
    semantic: proto_release_blocking_subset
  - id: release-target:desktop
    semantic: desktop_release_blocking_subset
  - id: release-target:web
    semantic: web_release_blocking_subset
  - id: live
    semantic: requires_secrets_and_external_repo
  - id: nightly
    semantic: scheduled_only

# -----------------------------------------------------------------------
# Target definitions
# -----------------------------------------------------------------------
targets:
  - any
  - sdk
  - runtime
  - proto
  - desktop
  - web
  - nimicoding

# -----------------------------------------------------------------------
# Reason codes (P-RELG-005 verdict-set lock; D7 reason code catalog)
# -----------------------------------------------------------------------
reason_codes:
  - id: SECRETS_MISSING
    semantic: blocked_runtime_env_missing_required_secret
  - id: LIVE_PROVIDER_UNAVAILABLE
    semantic: blocked_live_provider_endpoint_unreachable
  - id: BINARY_MISSING
    semantic: blocked_required_binary_not_on_path
  - id: PRECONDITION_NOT_MET
    semantic: blocked_required_artifact_or_state_absent
  - id: TIMEOUT
    semantic: failed_command_exceeded_deadline
  - id: COMMAND_NONZERO
    semantic: failed_command_exited_nonzero
  - id: UPSTREAM_GATE_FAILED
    semantic: unreachable_prerequisite_gate_did_not_pass
  - id: PROJECTION_DRIFT
    semantic: failed_projection_surface_drifted_from_registry_output
  - id: UNKNOWN_PROJECTION_KEY
    semantic: failed_workflow_fence_uses_unrecognized_projection_key
  - id: REGISTRY_COHERENCE_VIOLATION
    semantic: failed_registry_violates_d2_schema_rule
  - id: WORKFLOW_PNPM_REFERENCE_UNRESOLVED
    semantic: failed_workflow_yml_references_undefined_pnpm_script

# -----------------------------------------------------------------------
# Gate rows (organized by owner namespace, alphabetical)
# -----------------------------------------------------------------------
gates:
  # =====================================================================
  # owner: app-tools (Nimi app scaffold authoring and generated app smoke)
  # =====================================================================
  - id: gate.app-tools.generated-app-smoke
    description: app-tools default generated app workspace-backed install/init/check/build smoke without tester-only product code.
    command: pnpm --filter @nimiplatform/app-tools run check:generated-app-smoke
    runner: pnpm
    cwd: .
    tiers: [release]
    targets: [any]
    timeout_seconds: 1200
    prerequisites: []
    requires_secrets: []
    requires_external_repo: []
    requires_binaries: [pnpm, node]
    blocker_semantics:
      on_binary_missing: blocked
    evidence:
      shape: command_exit
    p_relg_anchors: [P-RELG-001]
    parent_p_gov_anchors: [P-GOV-003]
    experimental: false

  # =====================================================================
  # owner: cargo (Rust / Tauri verification chain in apps/desktop/src-tauri)
  # =====================================================================

  - id: gate.cargo.desktop-native-quality
    description: Complete Desktop native quality gate across product-control-core and the Tauri shell, with one metadata preparation/sync followed by clippy and tests.
    command: pnpm check:desktop-native-quality
    runner: pnpm
    tiers: [release, release-target:desktop]
    targets: [desktop]
    timeout_seconds: 1200
    requires_binaries: [pnpm, cargo]
    blocker_semantics:
      on_binary_missing: blocked
    evidence:
      shape: command_exit
    p_relg_anchors: [P-RELG-001]
    parent_p_gov_anchors: [P-GOV-003]
    experimental: false


  - id: gate.cargo.audit
    description: cargo audit against apps/desktop/src-tauri/Cargo.lock for known Rust vulnerabilities.
    command: cargo audit --file apps/desktop/src-tauri/Cargo.lock
    runner: shell
    tiers: [release, release-target:desktop]
    targets: [desktop]
    timeout_seconds: 300
    requires_binaries: [cargo, cargo-audit]
    blocker_semantics:
      on_binary_missing: blocked
    evidence:
      shape: command_exit
    p_relg_anchors: [P-RELG-001]
    parent_p_gov_anchors: [P-GOV-003, P-GOV-011]
    experimental: false

  # =====================================================================
  # owner: cognition (nimi-cognition Go package)
  # =====================================================================
  - id: gate.cognition.go-build
    description: nimi-cognition Go package build (unique workspace; not part of runtime).
    command: go build ./...
    runner: shell
    cwd: nimi-cognition
    tiers: [release]
    targets: [any]
    timeout_seconds: 300
    requires_binaries: [go]
    blocker_semantics:
      on_binary_missing: blocked
    evidence:
      shape: command_exit
    p_relg_anchors: [P-RELG-001]
    parent_p_gov_anchors: [P-GOV-003]
    experimental: false
    notes: Standalone cognition package Go build release gate.

  - id: gate.cognition.go-vet
    description: nimi-cognition Go vet.
    command: go vet ./...
