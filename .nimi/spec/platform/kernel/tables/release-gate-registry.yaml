    p_relg_anchors: [P-RELG-003, P-RELG-009, P-RELG-010]
    parent_p_gov_anchors: [P-GOV-003, P-GOV-021, P-GOV-023]
    experimental: false
    notes: |
      Consumer script scripts/check-release-gate-projection-drift.mjs
      landed in W2; experimental flag cleared in same commit per
      implementation-doctrine.md W1 hard-constraint exception. The
      checker operates in W2 mode (informational warnings only)
      until W3 lands the lint-chain regenerator and W5 lands the
      CI fence regenerator; both W3 and W5 transitions activate
      stricter modes via mode-detection at runtime, not by row
      mutation.

