  - id: gate.workflow.runtime-goreleaser-check
    description: Goreleaser config validation for runtime release pipeline.
    command: go run github.com/goreleaser/goreleaser/v2@latest check --config .goreleaser.yml
    runner: shell
    tiers: [release, release-target:runtime]
    targets: [runtime]
    timeout_seconds: 300
    requires_binaries: [go]
    blocker_semantics:
      on_binary_missing: blocked
    evidence:
      shape: command_exit
    p_relg_anchors: [P-RELG-001]
    parent_p_gov_anchors: [P-GOV-003]
    experimental: false

  - id: gate.workflow.runtime-goreleaser-snapshot
    description: Goreleaser snapshot dry-run for runtime release pipeline.
    command: pnpm check:runtime-goreleaser-snapshot
    runner: pnpm
    tiers: [release, release-target:runtime]
    targets: [runtime]
    timeout_seconds: 1800
    requires_binaries: [pnpm, node, go]
    blocker_semantics:
      on_binary_missing: blocked
    evidence:
      shape: command_exit
    p_relg_anchors: [P-RELG-001]
    parent_p_gov_anchors: [P-GOV-003]
    experimental: false
    notes: |
      The project wrapper skips Goreleaser sign/SBOM phases during this
      snapshot dry-run. Artifact signing and SBOM validation are owned by
      gate.security.runtime-release-signing, which requires real artifact
      paths and release signing identity.

  - id: gate.workflow.install-gateway-build
    description: install-gateway package build.
    command: pnpm build:install-gateway
    runner: pnpm
    tiers: [release]
    targets: [any]
    timeout_seconds: 300
    requires_binaries: [pnpm]
    evidence:
      shape: command_exit
    p_relg_anchors: [P-RELG-001]
    parent_p_gov_anchors: [P-GOV-003]
    experimental: false

  - id: gate.workflow.bundle-size
    description: Bundle size guard against baseline.
    command: pnpm check:bundle-size
    runner: pnpm
    tiers: [release]
    targets: [desktop, web, sdk]
    timeout_seconds: 120
    requires_binaries: [pnpm]
    evidence:
      shape: command_exit
    p_relg_anchors: [P-RELG-001]
    parent_p_gov_anchors: [P-GOV-003]
    experimental: false
