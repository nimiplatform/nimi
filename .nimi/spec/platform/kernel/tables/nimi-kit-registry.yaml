version: 1
table_family: product_catalog
owner: platform
catalog_id: platform_nimi_kit_registry
entries:
  - kit.ui
  - kit.auth
  - kit.core
  - kit.shell.tauri
  - kit.shell.renderer
  - kit.core.runtime-capabilities
  - kit.core.model-config
  - kit.telemetry
  - kit.features.chat
  - kit.features.avatar
  - kit.features.model-picker
  - kit.features.model-config
  - kit.features.generation
  - kit.features.commerce
modules:
  - id: kit.ui
    subpath: /ui
    kind: foundation
    surface_level: foundation
    adapter_contract: none
    description: Cross-app design system built on Radix UI + CVA + Tailwind, with nimi semantic tokens
    dependencies:
      - "@radix-ui/react-dialog"
      - "@radix-ui/react-tooltip"
      - "@radix-ui/react-scroll-area"
      - "@radix-ui/react-select"
      - "@radix-ui/react-switch"
      - "@radix-ui/react-avatar"
      - "@radix-ui/react-popover"
      - "@radix-ui/react-slot"
      - class-variance-authority
      - clsx
      - tailwind-merge
    peer_dependencies:
      - react
      - react-dom
    exports:
      - ./ui
      - ./ui/glass
      - ./ui/motion
      - ./ui/a11y
      - ./ui/styles.css
      - ./ui/themes/light.css
      - ./ui/themes/dark.css
      - ./ui/themes/nimi-accent.css
    headless_exports: []
    ui_exports:
      - ./ui
      - ./ui/glass
      - ./ui/motion
      - ./ui/a11y
      - ./ui/styles.css
      - ./ui/themes/light.css
      - ./ui/themes/dark.css
      - ./ui/themes/nimi-accent.css
    reuse_entrypoints:
      - ./ui
      - ./ui/glass
      - ./ui/motion
      - ./ui/a11y
      - ./ui/styles.css
    admission_status: active
    owner: platform
    source_rule: P-KIT-010
  - id: kit.auth
    subpath: /auth
    kind: feature
    surface_level: headless+ui
    adapter_contract: AuthPlatformAdapter
    description: Cross-app authentication UI (email, OTP, wallet, social OAuth)
    dependencies:
      - kit.core
      - sdk
    peer_dependencies:
      - react
      - react-i18next
    exports:
      - ./auth
      - ./auth/styles.css
      - ./auth/native-oauth-result-page
    headless_exports:
      - ./auth
      - ./auth/native-oauth-result-page
    ui_exports:
      - ./auth
      - ./auth/styles.css
    reuse_entrypoints:
      - ./auth
      - ./auth/styles.css
      - ./auth/native-oauth-result-page
    admission_status: active
    owner: platform
    source_rule: P-KIT-020
  - id: kit.core
    subpath: /core
    kind: logic
    surface_level: logic
    adapter_contract: none
    description: Pure-logic utilities (OAuth, env, shell-mode, Character Card V2 parsing)
    dependencies: []
    peer_dependencies: []
    exports:
      - ./core/shell-mode
      - ./core/oauth
      - ./core/character-card
      - ./core/sdk-contract
    headless_exports:
      - ./core/shell-mode
      - ./core/oauth
      - ./core/character-card
      - ./core/sdk-contract
    ui_exports: []
    reuse_entrypoints:
      - ./core/shell-mode
      - ./core/oauth
      - ./core/character-card
      - ./core/sdk-contract
    admission_status: active
    owner: platform
    source_rule: P-KIT-030
  - id: kit.shell.tauri
    subpath: /shell/tauri
    kind: infra
    surface_level: infra
    adapter_contract: none
    description: Shared Tauri host glue — runtime bridge, daemon lifecycle, session logging, auth/oauth commands, runtime defaults, packaged Platform catalog projections, deterministic host projection record builders, and SDK-shaped host bridge mappers for Rust host materialization/verification code. Delivered as the public Rust crate nimi-shell-tauri for standalone apps and as a Cargo path dependency for workspace apps, within the single kit authority.
    dependencies: []
    peer_dependencies: []
    exports: []
    headless_exports: []
    ui_exports: []
    reuse_entrypoints: []
    admission_status: active
    owner: platform
    source_rule: P-KIT-041
    public_crate_name: nimi-shell-tauri
    standalone_dependency: published_crate_after_wave_1_api_publication
    workspace_dependency: cargo_path_dependency
    wave_0_implementation_rename: none
    notes: Non-npm Rust crate. Standalone apps consume the public delivery crate name nimi-shell-tauri after Wave 1 admits API/publication mechanics; workspace apps consume via Cargo path dependency. No package.json exports. Wave 0 does not rename implementation files, package manifests, crate source, package exports, or the kit.shell.tauri authority id. The platform_catalog Rust modules are generated read-only Platform catalog projections for consumers; platform_projection Rust modules provide deterministic host projection record construction/validation and SDK-shaped bridge mapping from those catalog projections. Canonical truth remains under .nimi/spec/platform/kernel/tables/**; apps remain responsible for admitted storage roots, file materialization, and app-specific command adapters.
  - id: kit.shell.renderer
    subpath: /shell/renderer
    kind: infra
    surface_level: infra
    adapter_contract: none
    description: Shared renderer shell glue — Tauri command wrappers, bridge primitives, bootstrap skeleton. Delivered as subpath exports of the single nimi-kit npm package.
    dependencies:
      - kit.core
      - kit.auth
      - kit.telemetry
      - sdk
    peer_dependencies:
      - react
    exports:
      - ./shell/renderer/bridge
      - ./shell/renderer/bootstrap
    headless_exports:
      - ./shell/renderer/bridge
      - ./shell/renderer/bootstrap
    ui_exports: []
    reuse_entrypoints:
      - ./shell/renderer/bridge
      - ./shell/renderer/bootstrap
    admission_status: active
    owner: platform
    source_rule: P-KIT-042
  - id: kit.core.runtime-capabilities
    subpath: /core/runtime-capabilities
    kind: logic
    surface_level: logic
    adapter_contract: none
    description: Pure-logic capability normalization, wildcard matching, and codegen capability catalog truth. Runtime-safe and renderer-safe.
    dependencies: []
    peer_dependencies: []
    exports:
      - ./core/runtime-capabilities
    headless_exports:
      - ./core/runtime-capabilities
    ui_exports: []
    reuse_entrypoints:
      - ./core/runtime-capabilities
    admission_status: active
    owner: platform
    source_rule: P-KIT-043
    generated_from_spec:
      source_table: .nimi/spec/platform/kernel/tables/canonical-capability-catalog.yaml
      source_rule: P-CAPCAT-001
      generated_path: kit/core/src/runtime-capabilities/generated/canonical-capability-catalog.ts
      emitter: scripts/gen-canonical-capability-catalog.mjs
      drift_gate: scripts/check-canonical-capability-catalog.mjs
    notes: Runtime-safe — may be consumed by runtime-side code (Go consumers import via kit/core transpiled output or shared contract). The CANONICAL_CAPABILITY_CATALOG constant is codegen output of canonical-capability-catalog.yaml per P-CAPCAT-001; do not hand-edit.
  - id: kit.core.model-config
    subpath: /core/model-config
    kind: logic
    surface_level: logic
    adapter_contract: AppModelConfigSurface consumer-injection contract (SharedAIConfigService, providerResolver, projectionResolver, localAssetSource, userProfilesSource, i18n)
    description: Pure-logic seam for the model-config feature — AppModelConfigSurface contracts, SharedAIConfigService ambient interface, aggregate summary/enabled-descriptor selectors, and the default ModelConfigProfileControllerCore that enforces D-AIPC-005 atomic apply semantics. Renderer-free, app-free, runtime-safe. Consumes canonical capability descriptors as type-only imports from kit.core.runtime-capabilities without declaring it as a registry dependency (logic modules must not declare runtime kit dependencies per check-nimi-kit.mjs).
    dependencies: []
    peer_dependencies: []
    exports:
      - ./core/model-config
    headless_exports:
      - ./core/model-config
    ui_exports: []
    reuse_entrypoints:
      - ./core/model-config
    admission_status: active
    owner: platform
    source_rule: P-KIT-050
    notes: Pure logic only — no React, no DOM, no CSS, no Node/Tauri/Electron, no apps/** imports. Consumed by kit.features.model-config and by app-side headless bindings.
  - id: kit.telemetry
    subpath: /telemetry
    kind: infra
    surface_level: infra
    adapter_contract: none
    description: Renderer-side telemetry (emit, debug-buffer, error-boundary)
    dependencies: []
    peer_dependencies:
      - react
    exports:
      - ./telemetry
      - ./telemetry/error-boundary
    headless_exports:
      - ./telemetry
    ui_exports:
      - ./telemetry/error-boundary
    reuse_entrypoints:
      - ./telemetry
      - ./telemetry/error-boundary
    admission_status: active
    owner: platform
    source_rule: P-KIT-040
  - id: kit.features.chat
    subpath: /features/chat
    kind: feature
    surface_level: headless+ui+runtime+realm
    adapter_contract: ConversationSourceAdapter + ConversationShellAdapter + ConversationThreadAdapter + ConversationComposerAdapter + ConversationOrchestrationProvider + ConversationOrchestrationRegistry + ConversationRuntimeAdapter + ConversationContinuityAdapter + RuntimeChatComposerAdapterOptions + RealmChatComposerAdapterOptions
    description: Reusable unified conversation shell with target-first AI/human/agent contracts, a canonical presentational and message shell, orchestration provider registry/contracts, active simple-ai runtime integration, active realm typed human chat integration, realtime normalization, timeline composition/display helpers, and a socket-agnostic transport controller
    dependencies:
      - kit.ui
    peer_dependencies:
      - react
    exports:
      - ./features/chat
      - ./features/chat/headless
      - ./features/chat/realm
      - ./features/chat/runtime
      - ./features/chat/ui
      - ./features/chat/types
      - ./features/chat/components/canonical-composer
      - ./features/chat/components/canonical-conversation-shell
      - ./features/chat/components/canonical-drawer-section
      - ./features/chat/components/canonical-runtime-inspect-sidebar
      - ./features/chat/components/canonical-stage-panel
      - ./features/chat/components/canonical-transcript-view
      - ./features/chat/components/chat-stream-status
    headless_exports:
      - ./features/chat/headless
      - ./features/chat/realm
      - ./features/chat/runtime
      - ./features/chat/types
    ui_exports:
      - ./features/chat/ui
      - ./features/chat/components/canonical-composer
      - ./features/chat/components/canonical-conversation-shell
      - ./features/chat/components/canonical-drawer-section
      - ./features/chat/components/canonical-runtime-inspect-sidebar
      - ./features/chat/components/canonical-stage-panel
      - ./features/chat/components/canonical-transcript-view
      - ./features/chat/components/chat-stream-status
    reuse_entrypoints:
      - ./features/chat/ui
      - ./features/chat/headless
      - ./features/chat/runtime
      - ./features/chat/realm
      - ./features/chat/components/canonical-conversation-shell
    admission_status: active
    owner: platform
    source_rule: P-KIT-070
  - id: kit.features.avatar
    subpath: /features/avatar
    kind: feature
    surface_level: headless+ui+runtime
    adapter_contract: AvatarPresentationAdapter + AvatarInteractionAdapter + RuntimeAgentPresentationAdapter
    description: Desktop chat preview/viewport avatar stage utility with normalized headless presentation contracts, default UI shell, runtime-backed agent presentation projection binding, stage/media helpers, and optional renderer helper seams for the admitted live2d/vrm backend vocabulary
    dependencies:
      - kit.ui
      - sdk
    peer_dependencies:
      - react
    exports:
      - ./features/avatar
      - ./features/avatar/headless
      - ./features/avatar/runtime
      - ./features/avatar/ui
      - ./features/avatar/vrm
      - ./features/avatar/live2d
    headless_exports:
      - ./features/avatar/headless
      - ./features/avatar/runtime
    ui_exports:
      - ./features/avatar/ui
      - ./features/avatar/vrm
      - ./features/avatar/live2d
    reuse_entrypoints:
      - ./features/avatar/ui
      - ./features/avatar/headless
      - ./features/avatar/runtime
      - ./features/avatar/vrm
      - ./features/avatar/live2d
    admission_status: active
    owner: platform
    source_rule: P-KIT-071
    notes: This module is for Desktop chat preview, viewport, stage, and media utility reuse. It is not the launched `apps/avatar` carrier surface, package activation surface, materialization authority, or backend authority. Launched Avatar backend authority remains `.nimi/spec/avatar/kernel/backend-branch-contract.md` with `live2d | vrm`; `AvatarBackendKind` must not admit `sprite2d`, `canvas2d`, or `video`. Live2D is shipped as `./features/avatar/live2d` for reusable renderer-domain helpers and optional renderer seams only. App-local viewport policy and product placement are outside platform kit registry truth.
  - id: kit.features.model-picker
    subpath: /features/model-picker
    kind: feature
    surface_level: headless+ui+runtime
    adapter_contract: ModelCatalogAdapter
    description: Reusable model browse-and-select surface with headless filtering, default UI shell, and runtime-backed catalog panels
    dependencies:
      - kit.ui
    peer_dependencies:
      - react
    exports:
      - ./features/model-picker
      - ./features/model-picker/headless
      - ./features/model-picker/runtime
      - ./features/model-picker/ui
    headless_exports:
      - ./features/model-picker/headless
      - ./features/model-picker/runtime
    ui_exports:
      - ./features/model-picker/ui
    reuse_entrypoints:
      - ./features/model-picker/ui
      - ./features/model-picker/headless
      - ./features/model-picker/runtime
    admission_status: active
    owner: platform
    source_rule: P-KIT-070
  - id: kit.features.model-config
    subpath: /features/model-config
    kind: feature
    surface_level: headless+ui
    adapter_contract: AppModelConfigSurface consumer-injection contract (scopeRef, SharedAIConfigService, providerResolver, projectionResolver, localAssetSource, capabilityOverrides, i18n)
    description: Reusable AI Model hub shell consuming the spec-resident CANONICAL_CAPABILITY_CATALOG, with complete params editors (text / audio-synthesize / audio-transcribe / voice-workflow / image / video), default profile controller enforcing D-AIPC-005 atomic apply, and ModelConfigAiModelHub composition that owns the Import AI Profile header action placement
    dependencies:
      - kit.ui
      - kit.features.model-picker
      - kit.core.runtime-capabilities
      - kit.core.model-config
      - sdk
    peer_dependencies:
      - react
    exports:
      - ./features/model-config
      - ./features/model-config/headless
      - ./features/model-config/ui
    headless_exports:
      - ./features/model-config/headless
    ui_exports:
      - ./features/model-config/ui
    reuse_entrypoints:
      - ./features/model-config/ui
      - ./features/model-config/headless
    admission_status: active
    owner: platform
    source_rule: P-KIT-070
  - id: kit.features.generation
    subpath: /features/generation
    kind: feature
    surface_level: headless+ui+runtime
    adapter_contract: GenerationPanelAdapter
    description: Reusable generation workflow shell with headless submit orchestration, default status panel UI, app-local runtime panels, and app-local runtime-status consumers
    dependencies:
      - kit.ui
    peer_dependencies:
      - react
    exports:
      - ./features/generation
      - ./features/generation/headless
      - ./features/generation/runtime
      - ./features/generation/ui
    headless_exports:
      - ./features/generation/headless
      - ./features/generation/runtime
    ui_exports:
      - ./features/generation/ui
    reuse_entrypoints:
      - ./features/generation/ui
      - ./features/generation/headless
      - ./features/generation/runtime
    admission_status: active
    owner: platform
    source_rule: P-KIT-070
  - id: kit.features.commerce
    subpath: /features/commerce
    kind: feature
    surface_level: headless+ui+realm
    adapter_contract: CommerceGiftAdapter
    description: Reusable commerce surface for cross-app gifting and lightweight transactional dialogs backed by realm business services, with app-local consumers declared outside platform kit authority
    dependencies:
      - kit.ui
    peer_dependencies:
      - react
    exports:
      - ./features/commerce
      - ./features/commerce/headless
      - ./features/commerce/realm
      - ./features/commerce/ui
    headless_exports:
      - ./features/commerce/headless
      - ./features/commerce/realm
    ui_exports:
      - ./features/commerce/ui
    reuse_entrypoints:
      - ./features/commerce/ui
      - ./features/commerce/headless
      - ./features/commerce/realm
    admission_status: active
    owner: platform
    source_rule: P-KIT-070
