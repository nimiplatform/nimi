format: nimicoding.authority/v2
owner: team.platform
scope: platform.app-ecosystem
units:
  - id: definition.nimi.platform.app-ecosystem.local-agent-identity
    kind: definition
    title: Runtime LocalAgent identity
    meaning: A LocalAgent is an independent Runtime-owned local identity materialized from one Realm-issued Character Source, with optional World Source context, and repeated materialization from the same source creates distinct identities, configuration, Memory, Knowledge, and lifecycle.
  - id: definition.nimi.platform.app-ecosystem.local-agent-projection
    kind: definition
    title: LocalAgent consumer projection
    meaning: Nimi Home, Zhiyu, Avatar, and authorized Third-party Local Apps consume Runtime LocalAgent messages, state, activity, emotion, voice, and errors as product projections that neither create a separate identity nor own LocalAgent execution truth.
  - id: definition.nimi.platform.app-ecosystem.character-local-agent-model
    kind: definition
    title: Realm Character and Runtime LocalAgent model
    meaning: Realm Character consists of PersonaCharacter and WorldCharacter, each LocalAgent identity comes from a Realm Character Source, and one Character Source may materialize multiple independent Runtime LocalAgents.
  - id: definition.nimi.platform.app-ecosystem.conversation-anchor
    kind: definition
    title: Runtime LocalAgent conversation continuity
    meaning: Runtime owns the durable local conversation state and continuity identity for each LocalAgent conversation across authorized product projections.
  - id: definition.nimi.platform.app-ecosystem.chat-history
    kind: definition
    title: Consumer LocalAgent conversation view
    meaning: Nimi Home, Zhiyu, and authorized Third-party Local Apps may display, replay, or cache a LocalAgent conversation as non-authoritative UI state while Runtime retains durable conversation, Memory, and Knowledge truth.
  - id: definition.nimi.platform.app-ecosystem.chat-derived-memory
    kind: definition
    title: Runtime operational memory admission
    meaning: Runtime Agent Service alone decides whether authorized LocalAgent conversation input becomes operational Memory and keeps that Memory bound to Runtime-owned LocalAgent and conversation truth.
  - id: definition.nimi.platform.app-ecosystem.projection-lifecycle
    kind: definition
    title: LocalAgent app access lifecycle
    meaning: LocalAgent app access is derived from the current Runtime-authenticated account, current App session authorization, target localAgentId, requested operation, and their current lifecycle state.
  - id: rule.nimi.platform.app-ecosystem.p-agid-001a
    kind: rule
    title: P-AGID-001 Character-sourced LocalAgent identity
    modality: must
    statement: Runtime creates each LocalAgent as a new independent local identity only from a Realm-issued PersonaCharacter or WorldCharacter Source, with World Source supplying context but never creating identity without a Character Source.
    condition: Whenever a LocalAgent identity is materialized or restored.
    failure: Reject source-free identity, World-only identity, or implicit reuse of another materialization.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-agent-identity
  - id: rule.nimi.platform.app-ecosystem.p-agid-001b
    kind: rule
    title: P-AGID-001 no app-owned LocalAgent identity
    modality: must_not
    statement: An App, Nimi Home host, Avatar, Zhiyu, SDK, or Kit creates, owns, or reconstructs LocalAgent identity from UI state, chat cache, App identity, or projection state.
    condition: Whenever a consumer addresses or presents a LocalAgent.
    failure: Reject the local substitute and resolve the Runtime-owned LocalAgent.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-agent-identity
  - id: rule.nimi.platform.app-ecosystem.p-agid-002a
    kind: rule
    title: P-AGID-002 projection consumer semantics
    modality: must
    statement: Nimi Home, Zhiyu, Avatar, and authorized Third-party Local Apps consume the same Runtime LocalAgent as isolated product projections while Runtime Agent Service remains the sole execution owner.
    condition: Whenever LocalAgent output is presented by one or more product consumers.
    failure: Reject a projection that creates another LocalAgent identity, executes a turn independently, or becomes Conversation, Memory, Knowledge, activity, emotion, or voice truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.character-local-agent-model
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-agent-projection
  - id: rule.nimi.platform.app-ecosystem.p-agid-002b
    kind: rule
    title: P-AGID-002 no cross-app authorization reuse
    modality: must_not
    statement: Apps share or reuse LocalAgent authorization, account state, App session state, or consumer cache across App boundaries as an access decision.
    condition: Whenever more than one App consumes the same LocalAgent.
    failure: Reject shared authorization and derive access independently from each current Runtime App session.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-agent-projection
  - id: rule.nimi.platform.app-ecosystem.p-agid-003a
    kind: rule
    title: P-AGID-003 session-derived LocalAgent access
    modality: must
    statement: Runtime evaluates each LocalAgent operation from the current authenticated account, current App identity and authorization state, requested localAgentId, requested operation, ownership or access policy, and current lifecycle state.
    condition: Whenever an App requests a LocalAgent operation.
    failure: Fail closed when the account, App session, authorization, LocalAgent access, operation, or lifecycle check is missing, stale, denied, or revoked.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-agent-projection
  - id: rule.nimi.platform.app-ecosystem.p-agid-003b
    kind: rule
    title: P-AGID-003 no caller-declared authorization truth
    modality: must_not
    statement: An App supplies accountId, App identity, authorization state, session proof, or another consumer projection as ordinary request fields that Runtime trusts as LocalAgent authorization truth.
    condition: Whenever an App requests a LocalAgent operation.
    failure: Reject caller-declared authorization and derive the account, App, and authorization state from the current Runtime session.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-agent-projection
  - id: rule.nimi.platform.app-ecosystem.p-agid-004a
    kind: rule
    title: P-AGID-004 Runtime conversation continuity
    modality: must
    statement: Every LocalAgent conversation uses Runtime-owned durable local conversation state and continuity across authorized product projections.
    condition: Whenever a LocalAgent conversation is created, resumed, or presented by another consumer.
    failure: Reject continuity that cannot be resolved from Runtime-owned conversation state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.conversation-anchor
  - id: rule.nimi.platform.app-ecosystem.p-agid-004b
    kind: rule
    title: P-AGID-004 no consumer-owned continuity
    modality: must_not
    statement: Nimi Home, Desktop, Zhiyu, Avatar, a Third-party App, SDK, or Kit replaces Runtime conversation continuity with renderer-local state or chat-local cache.
    condition: Whenever conversation continuity is stored or resolved.
    failure: Reject the consumer substitute and resolve Runtime-owned conversation state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.conversation-anchor
  - id: rule.nimi.platform.app-ecosystem.p-agid-005
    kind: rule
    title: P-AGID-005 no parallel identity ontology
    modality: must_not
    statement: A product, App, Runtime surface, SDK, Kit, or host introduces a generic Agent layer, family, persona, projection-reference, or binding entity alongside Realm Character and Runtime LocalAgent.
    condition: Whenever Character, LocalAgent identity, projection, or LocalAgent access is modeled.
    failure: Reject the parallel ontology and use Realm Character, Runtime LocalAgent, consumer projection, and session-derived authorization semantics.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-agent-identity
  - id: rule.nimi.platform.app-ecosystem.p-agid-006a
    kind: rule
    title: P-AGID-006 conversation view owner boundary
    modality: must
    statement: Each authorized product consumer owns only its LocalAgent conversation presentation and non-authoritative UI cache while Runtime owns durable conversation, Memory, Knowledge, and execution continuity.
    condition: Whenever a LocalAgent conversation is displayed, replayed, cached, or interpreted.
    failure: Reject consumer ownership of Runtime truth or direct elevation of UI cache into Memory or Knowledge truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.chat-history
  - id: rule.nimi.platform.app-ecosystem.p-agid-006b
    kind: rule
    title: P-AGID-006 protected conversation consumption
    modality: must_not
    statement: A transcript, history cache, or UI projection becomes Runtime Conversation, Memory, or Knowledge truth or is exposed to another App without current Runtime authorization.
    condition: Whenever cached conversation content is interpreted as Runtime truth or exposed externally.
    failure: Deny the write or read until Runtime-owned admission and the current App session authorization succeed.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.chat-derived-memory
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.chat-history
  - id: rule.nimi.platform.app-ecosystem.p-agid-007a
    kind: rule
    title: P-AGID-007 Runtime operational memory admission
    modality: must
    statement: Runtime Agent Service alone admits authorized LocalAgent conversation input into operational Memory and keeps the result bound to Runtime-owned LocalAgent and conversation truth.
    condition: Whenever LocalAgent conversation input may become operational Memory.
    failure: Reject admission outside Runtime Agent Service or without the current LocalAgent and conversation context.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.chat-derived-memory
  - id: rule.nimi.platform.app-ecosystem.p-agid-007b
    kind: rule
    title: P-AGID-007 no passive memory creation
    modality: must_not
    statement: A consumer background job, passive cache, chat replay, or UI state automatically creates Runtime operational Memory.
    condition: Whenever conversation-derived Memory creation is attempted.
    failure: Deny creation until Runtime Agent Service explicitly admits it.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.chat-derived-memory
  - id: rule.nimi.platform.app-ecosystem.p-agid-008a
    kind: rule
    title: P-AGID-008 LocalAgent access follows session lifecycle
    modality: must
    statement: App exit or uninstall, permission revocation, account switch or exit, Runtime restart, and App session termination invalidate the affected prior LocalAgent access before another operation.
    condition: Whenever App, authorization, account, Runtime, or session lifecycle changes.
    failure: Invalidate affected access before another LocalAgent operation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.projection-lifecycle
  - id: rule.nimi.platform.app-ecosystem.p-agid-008b
    kind: rule
    title: P-AGID-008 no stale LocalAgent access
    modality: must_not
    statement: A stale consumer projection, cached decision, ended session, or revoked authorization remains usable as LocalAgent access.
    condition: Whenever LocalAgent access is resolved.
    failure: Fail closed and require a current Runtime session-derived decision.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.projection-lifecycle
  - id: definition.nimi.platform.app-ecosystem.app-permission
    kind: definition
    title: App permission
    meaning: An App permission is one canonical public identifier for a user-recognizable intent to access protected Nimi-owned, Realm-owned, Runtime LocalAgent-owned, Cognition-owned, or another App's resource, with exactly one decision owner and no parallel public scope or operation vocabulary.
  - id: definition.nimi.platform.app-ecosystem.permission-grant
    kind: definition
    title: Permission grant
    meaning: A permission grant is owner-held decision truth whose positive use remains bound to the protected-carrier-derived app principal, current account and OS-user anchor where applicable, canonical public permission, owner-issued selector, exact internal mapping, current owner policy, and lifecycle revision.
  - id: definition.nimi.platform.app-ecosystem.app-authority-class
    kind: definition
    title: App action authority class
    meaning: Every app action belongs to exactly one mutually exclusive authority class from base_entitlement, user_permission, one_shot_consent, app_owned_authority, and os_right; review, launch, route availability, and feature flags are not authority classes.
  - id: definition.nimi.platform.app-ecosystem.local-app-principal
    kind: definition
    title: Local app principal
    meaning: A local app principal is a random non-reused Runtime-derived security subject partitioned by the local OS-user anchor and kept distinct from display app identity, provenance, trust tier, project approval, process session, and permission truth.
  - id: definition.nimi.platform.app-ecosystem.local-app-provenance
    kind: definition
    title: Local app provenance
    meaning: Local app provenance is the closed verified, user_imported, or local_development Runtime-derived record classification, with local_development as the sole mutable third-party class and bundled components excluded.
  - id: definition.nimi.platform.app-ecosystem.protected-local-transport
    kind: definition
    title: Protected-local transport
    meaning: Protected-local transport is the Runtime-owned native boundary that admits a local caller only after the current platform independently verifies process identity, liveness, executable trust, session binding, revocation state, and authorization before protected product data or operations; no localhost, bearer, same-user process, or portable proof substitutes for that platform admission.
  - id: definition.nimi.platform.app-ecosystem.executable-trust-set
    kind: definition
    title: Executable trust set
    meaning: An executable trust set is the release-owned native evidence that the current platform uses to admit only the intended signed product roles and reject substituted, stale, revoked, or unverified executables without making any one OS signing mechanism cross-platform product truth.
  - id: definition.nimi.platform.app-ecosystem.macos-protected-admission
    kind: definition
    title: Deferred macOS protected-local admission boundary
    meaning: macOS is the platform priority after the current Windows product closure and requires its own native admission with isolated Runtime principal, Runtime-only secret custody, verified and supervised native host, least privilege, revocation, and fail-closed negative outcomes; its implementation is not current ordinary readiness and no Windows mechanism or portable localhost proof is treated as cross-platform product truth.
  - id: rule.nimi.platform.app-ecosystem.p-perm-001
    kind: rule
    title: P-PERM-001 canonical product permission vocabulary
    modality: must
    statement: Platform exposes only the catalog's canonical public permission vocabulary, where each permission expresses one user-recognizable product intent and has exactly one decision owner; backend owners may expand it into internal checks but never expose a parallel public vocabulary based on RPCs, endpoints, scopes, tables, paths, or resource fingerprints.
    condition: Whenever a third-party app permission is declared, displayed, requested, or enforced.
    failure: Reject any non-canonical identifier or parallel public vocabulary.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
  - id: rule.nimi.platform.app-ecosystem.p-perm-002a
    kind: rule
    title: P-PERM-002 closed catalog and current admission
    modality: must
    statement: The public permission identifier set is exactly the catalog public_permissions section, and an identifier is requestable only when its row is admitted and manifest_allowed; the current admitted set is exactly agents.interact for Runtime session-derived access through an owner-granted account scope dynamically materialized as opaque LocalAgent handle projections and the open-conversation, send-turn, subscribe-turn, and conversation-snapshot operation families, all agents.interact scope extensions and the other eighteen catalog rows remain reserved pending their own atomic admission slices, and zero-permission apps using base entitlements, app-owned authority, or OS rights remain runnable.
    condition: Whenever manifest permission eligibility or requestability is evaluated.
    failure: Deny unknown, reserved, legacy-scope, Runtime-operation, and endpoint-string identifiers without preventing a zero-permission app from running.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
  - id: rule.nimi.platform.app-ecosystem.p-perm-002b
    kind: rule
    title: P-PERM-002 no partial permission admission
    modality: must_not
    statement: A catalog edit, manifest declaration, CRUD endpoint, or mock approval surface alone makes a reserved public permission admitted.
    condition: Whenever a catalog row is proposed to move to admitted.
    failure: Keep the row reserved until the complete P-PERM-017 owner slice lands atomically.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
  - id: rule.nimi.platform.app-ecosystem.p-perm-003a
    kind: rule
    title: P-PERM-003 public posture and app request boundary
    modality: must
    statement: App-facing posture is exactly prompt, pending, granted, denied, or unavailable; an app may inspect only its own posture and request each admitted permission with a user-facing reason, an owner may present multiple requested recognizable intents as separately identified items in one just-in-time consent surface while issuing independent decisions, and the app cannot approve, revoke, mint, carry, or inspect owner-internal decision records.
    condition: Whenever permission posture or request controls are exposed to an app.
    failure: Reject a posture outside the closed set or any app attempt to exercise owner decision authority.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.permission-grant
  - id: rule.nimi.platform.app-ecosystem.p-perm-003b
    kind: rule
    title: P-PERM-003 durable owner lifecycle
    modality: must
    statement: An admitted durable owner lifecycle uses monotonic revisions and only pending, granted, denied, expired, or revoked internal states; expired and revoked history remains owner and audit truth rather than app workflow API, each permission is independently revocable except that revoking agents.interact immediately invalidates the effective agents.configure, agents.voice, and agents.delegate grants that depend on its Agent scope while preserving their owner history, and no positive Runtime-local permission lifecycle or store exists until admitted.
    condition: Whenever durable permission decision state is implemented or projected.
    failure: Deny use of non-monotonic, non-canonical, app-owned, or unadmitted Runtime-local lifecycle state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.permission-grant
  - id: rule.nimi.platform.app-ecosystem.p-perm-004a
    kind: rule
    title: P-PERM-004 owner audit binding
    modality: must
    statement: Every admitted durable decision transition and one-shot handle issuance or consumption emits a distinct owner audit event binding owner-derived subject, calling app principal, display app id, public permission id, selector digest, old and new posture or one-shot action, trigger, timestamp, and owner revision; protected operation or resource identity appears only in protected owner audit.
    condition: Whenever an admitted decision transitions or a one-shot handle is issued or consumed.
    failure: Fail the affected positive path closed if its complete distinct audit event cannot be persisted.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.permission-grant
  - id: rule.nimi.platform.app-ecosystem.p-perm-004b
    kind: rule
    title: P-PERM-004 no secret-bearing or coalesced audit
    modality: must_not
    statement: Permission audit logs credentials, raw tokens, or reusable proofs, or silently coalesces events across decisions.
    condition: Whenever permission audit is recorded.
    failure: Reject the positive transition or one-shot action and emit no secret-bearing or coalesced record.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.permission-grant
  - id: rule.nimi.platform.app-ecosystem.p-perm-005a
    kind: rule
    title: P-PERM-005 fail-closed user permission evaluation
    modality: must
    statement: A user_permission operation requires an admitted identifier, manifest eligibility, current owner decision, owner-issued selector, exact permission-to-operation mapping, and current domain-owner resource policy; any missing, denied, expired, revoked, mismatched, or unavailable fact denies, and publisher tier, review, first-party identity, provenance, or session existence cannot widen the decision.
    condition: Whenever a protected operation is evaluated as user_permission.
    failure: Deny the protected operation without fallback authorization.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.permission-grant
  - id: rule.nimi.platform.app-ecosystem.p-perm-005b
    kind: rule
    title: P-PERM-005 bounded base entitlement
    modality: must
    statement: A base_entitlement remains available without a user permission but enforces its principal, session, account, path, and quota boundaries.
    condition: Whenever an app invokes a base entitlement.
    failure: Deny use outside any base-entitlement boundary without manufacturing a permission requirement.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-authority-class
  - id: rule.nimi.platform.app-ecosystem.p-perm-005c
    kind: rule
    title: P-PERM-005 non-forgeable one-shot consent
    modality: must
    statement: A one_shot_consent operation requires an owner-issued non-forgeable handle, and a caller-supplied resource identifier carries no authority.
    condition: Whenever a one-shot protected resource operation is attempted.
    failure: Deny absent, forged, expired, replayed, or caller-constructed proof.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-authority-class
  - id: rule.nimi.platform.app-ecosystem.p-perm-006
    kind: rule
    title: P-PERM-006 owner-brokered cross-app resource
    modality: must
    statement: Cross-app access has no generic durable grant; a source app or canonical resource owner exports through an admitted broker whose owner-controlled picker produces one bounded one-shot handle audited against source app, target app, and resource owner, while files, sockets, host bridges, and path conventions provide no substitute and shared_resources.open remains reserved until the broker is complete.
    condition: Whenever one app requests another app's resource.
    failure: Deny access unless the admitted broker issues the exact one-shot handle.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-authority-class
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
  - id: rule.nimi.platform.app-ecosystem.p-perm-007a
    kind: rule
    title: P-PERM-007 exact public request shapes
    modality: must
    statement: Manifest permission declaration is exactly an id and bounded explanatory reason, Runtime request is exactly permissionId and bounded explanatory reason, the reason carries no authority, protected carrier supplies app id, account, OS-user anchor, and principal, and the canonical owner picker supplies any selector.
    condition: Whenever a public manifest or Runtime permission request is accepted.
    failure: Reject extra authority-bearing fields, an unbounded reason, or caller-supplied identity or selector facts.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
  - id: rule.nimi.platform.app-ecosystem.p-perm-007b
    kind: rule
    title: P-PERM-007 no internal authorization fields on public surfaces
    modality: must_not
    statement: Public manifests, SDKs, Kit bridges, or ordinary UI expose scope family or name, qualifier, operation id, resource ref, selector digest, decision id, account, principal, session identity, token, or credential.
    condition: Whenever a public permission surface is defined or rendered.
    failure: Remove the internal field and fail closed rather than accepting it from the app.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
  - id: rule.nimi.platform.app-ecosystem.p-perm-008
    kind: rule
    title: P-PERM-008 AI metering is mandatory owner policy
    modality: must
    statement: Every cloud or local AI execution emits typed usage and obeys Runtime budget, rate, route, and credential policy; metering is not a requestable or user-disableable permission, and reserved ai.background remains unavailable until activity visibility, budget ceiling, and cancellation are complete.
    condition: Whenever an app initiates or continues AI execution.
    failure: Deny execution that cannot satisfy mandatory owner policy or attempts unadmitted background continuation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-authority-class
  - id: rule.nimi.platform.app-ecosystem.p-perm-009
    kind: rule
    title: P-PERM-009 first-party entitlements stay distinct
    modality: must
    statement: Built-in Nimi products use exact service entitlements admitted by their owning contracts, never synthetic third-party permissions or seeded permission-ledger rows; first-party status cannot widen third-party permission or bypass OS privacy, user preference, account policy, or owner checks.
    condition: Whenever first-party product access is authorized or projected.
    failure: Reject synthetic permission state and enforce the exact first-party entitlement and all independent checks.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-authority-class
  - id: rule.nimi.platform.app-ecosystem.p-perm-010
    kind: rule
    title: P-PERM-010 decision-owner boundaries
    modality: must
    statement: Cloud account, OAuth, Realm-owned decisions, domain data, and endpoint enforcement are decided on the Realm surface; Runtime decides local identity, session, operational Memory, Knowledge, Conversation, other Runtime-owned decisions, and local enforcement; Cognition remains an independent capability domain and does not silently take over those Runtime truths; Platform standardizes only catalog and projection, copies no backend truth, and one user intent receives no duplicate approval from multiple owners.
    condition: Whenever permission ownership, enforcement, or projection is allocated.
    failure: Reject copied owner truth, a parallel decision owner, or duplicate approval flow.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.permission-grant
  - id: rule.nimi.platform.app-ecosystem.p-perm-011a
    kind: rule
    title: P-PERM-011 app-private storage authority
    modality: must
    statement: An app needs no Nimi permission for its own SQLite, JSON, media, settings, cache, or product routes; Runtime-mediated private JSON is a base_entitlement constrained to the live principal and account partition, canonical relative paths, quota, and escape and symlink policy, while native app storage is app_owned_authority under actual OS rights and disclosed sandbox posture.
    condition: Whenever an app uses private storage or product-local routes.
    failure: Reject storage outside the class boundary without inventing a generic Nimi storage permission.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-authority-class
  - id: rule.nimi.platform.app-ecosystem.p-perm-011b
    kind: rule
    title: P-PERM-011 external files remain picker-bound
    modality: must
    statement: Reserved files.open and files.save use one-shot native picker handles, another app's resource uses shared_resources.open, and none creates generic filesystem permission.
    condition: Whenever an app requests an external file or another app's stored resource.
    failure: Deny access until the applicable permission and one-shot broker are admitted.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
  - id: rule.nimi.platform.app-ecosystem.p-perm-012
    kind: rule
    title: P-PERM-012 preferences do not mint permission
    modality: must
    statement: A first-party preference configures only an already-admitted product surface, never a third-party permission; signed-out, disabled, suppressed, or unavailable owner state produces typed suppression, and reserved notification permission cannot be inferred from preference state.
    condition: Whenever a first-party preference affects protected product behavior.
    failure: Suppress the behavior with a typed result instead of minting or inferring permission.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
  - id: rule.nimi.platform.app-ecosystem.p-perm-013a
    kind: rule
    title: P-PERM-013 local identity and permission separation
    modality: must
    statement: Project or package approval creates only a random non-reused principal and provenance record, launch creates only a process-bound session, and neither creates or widens permission; a valid zero-permission session may inspect its own posture and use base entitlements but cannot enumerate protected inventory to manufacture a selector.
    condition: Whenever a local app is approved, launched, or operates without granted permissions.
    failure: Deny any inferred permission, protected inventory enumeration, or caller-manufactured selector.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-principal
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.permission-grant
  - id: rule.nimi.platform.app-ecosystem.p-perm-013b
    kind: rule
    title: P-PERM-013 future Runtime permission binding
    modality: must
    statement: Any later-admitted Runtime-owned permission lifecycle binds OS-user anchor, current account, opaque app principal, public permission id, and owner selector digest, where an owner selector may grant the current account scope of all local Agents including future additions and Runtime dynamically materializes only opaque handle projections from that scope; each protected endpoint re-reads current decision, dependent permission scope, and owner policy, while display app id and trust tier are never positive keys.
    condition: Whenever a Runtime-owned public permission is admitted and used.
    failure: Deny the endpoint when exact current binding and policy cannot be re-read.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-principal
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.permission-grant
  - id: rule.nimi.platform.app-ecosystem.p-perm-014
    kind: rule
    title: P-PERM-014 source materialization is first-party
    modality: must
    statement: Source materialization is an authenticated first-party product operation in which Runtime uses the current account and one Realm Character Source, Realm enforces current source and World visibility, and Runtime creates a new LocalAgent only after the Realm-issued source material is verified; the operation is not authorized by a Third-party App permission or caller-declared account, App, grant, endpoint, or credential input.
    condition: Whenever Realm source materialization is requested or consumed.
    failure: Reject materialization outside the first-party Realm-to-Runtime authority chain or from caller-declared authorization material.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-authority-class
  - id: rule.nimi.platform.app-ecosystem.p-perm-015a
    kind: rule
    title: P-PERM-015 closed mutually exclusive authority classes
    modality: must
    statement: Every app action resolves to exactly one of base_entitlement, user_permission, one_shot_consent, app_owned_authority, or os_right with the class's catalog, prompt, and durable-row semantics; review, launch, route availability, and feature flags cannot create a sixth class.
    condition: Whenever an app action is classified for authorization.
    failure: Reject an unclassified, multiply classified, or invented-class action.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-authority-class
  - id: rule.nimi.platform.app-ecosystem.p-perm-015b
    kind: rule
    title: P-PERM-015 no protected-operation relabeling
    modality: must_not
    statement: An app-owned command proxies a protected Nimi operation, or a protected operation is labeled app_owned_authority or base_entitlement.
    condition: Whenever commands or protected operations are classified.
    failure: Reject the proxy or misclassification and require the protected owner's admitted authorization path.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-authority-class
  - id: rule.nimi.platform.app-ecosystem.p-perm-016a
    kind: rule
    title: P-PERM-016 public intent with exact internal enforcement
    modality: must
    statement: One public permission may expand only inside its owner into exact operations, provenance checks, quotas, budgets, rates, and policies, and every call still enforces least privilege while the public surface remains one human-recognizable intent; after each corresponding atomic extension slice is admitted, agents.interact additionally covers the granted Agents' Runtime-owned history list with disclosed cross-surface visibility, bounded source and turn summaries, companion state and presence, Agent events, redacted delegation read projections, Avatar live-instance handoff without raw Avatar control, and image bytes derived from the calling app's Conversation, while agents.configure, agents.voice, and agents.delegate remain separate reserved intents until their own complete slices are admitted.
    condition: Whenever a public permission maps to internal enforcement.
    failure: Deny calls lacking exact internal checks without exposing those checks as public permissions.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
  - id: rule.nimi.platform.app-ecosystem.p-perm-016b
    kind: rule
    title: P-PERM-016 no internal-resource approval UX
    modality: must_not
    statement: Users are prompted to approve individual RPC methods, conversation anchors, turns, streams, or internal file operations, or apps and renderers construct or display internal operation or resource identities.
    condition: Whenever permission UX or app-visible authorization data is produced.
    failure: Reject the internalized UX and expose only the canonical recognizable intent.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
  - id: rule.nimi.platform.app-ecosystem.p-perm-017a
    kind: rule
    title: P-PERM-017 atomic owner-complete admission
    modality: must
    statement: Public permission admission, including any new operation family added to an already admitted permission, atomically includes catalog row, one decision owner, manifest validation, owner selector, durable decision or one-shot proof, closed internal mapping, enforcement at every endpoint, SDK and Kit surface, just-in-time approval UI, and audit; durable permissions also include settings and revoke UI, while one-shot consent includes exact preview, selection, expiry, single consumption, cancellation, and replay rejection and creates no durable settings row.
    condition: Whenever a public permission row moves to admitted.
    failure: Keep the permission reserved if any conjunct is absent or non-atomic.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.permission-grant
  - id: rule.nimi.platform.app-ecosystem.p-perm-017b
    kind: rule
    title: P-PERM-017 bounded permission UX
    modality: must
    statement: Permission UX preserves one independent decision per recognizable intent and owner-selected resource scope, may combine interact, configure, memory, voice, and delegation as separately described items in one just-in-time surface using the same account scope without per-Agent authorization, gives a normal app using only its own data zero Nimi permission prompts, and forbids install-time permission walls, method-level prompts, hidden scope or qualifier editors, raw resource ids, and duplicate Runtime and Realm approvals.
    condition: Whenever install, launch, or just-in-time permission UX is rendered.
    failure: Reject an over-broad, duplicated, internalized, or unnecessary prompt flow.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
  - id: rule.nimi.platform.app-ecosystem.p-napp-030a
    kind: rule
    title: P-NAPP-030 complete listing-closure field set
    modality: must
    statement: The existing P-NAPP-009 ordinary-visible listing predicate evaluates at projection time the conjunction of admitted admission_status, ordinary-visible visibility, resolved trust tier, package kind, release descriptor, permission requirements including an empty list, Runtime registration mode, storage policy, and absence of unsupported or blocked fail-close from host, Runtime, or the Realm surface.
    condition: Whenever an Apps listing row is projected.
    failure: Exclude the row from ordinary-visible projection when any conjunct is absent, unresolved, or negative.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: rule.nimi.platform.app-ecosystem.p-napp-030b
    kind: rule
    title: P-NAPP-030 no parallel or reduced listing predicate
    modality: must_not
    statement: A listing implementation creates a predicate parallel to P-NAPP-009, removes a listing-closure conjunct, or treats one resolved field as implied by another.
    condition: Whenever the ordinary-visible listing predicate is implemented or changed.
    failure: Fail the row out of ordinary-visible projection and restore the single complete conjunction.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: rule.nimi.platform.app-ecosystem.p-napp-031
    kind: rule
    title: P-NAPP-031 unified inventory preserves owner projections
    modality: must
    statement: Desktop and SDK inventory preserves inspectable catalog, account, and local_record source identities as distinct owner projections, keeps current permission posture separate, and never joins by display app id in a way that merges principals, permissions, storage, audience, sessions, or turns one source fact into another.
    condition: Whenever Apps inventory rows are composed or joined.
    failure: Reject a merged or source-erasing inventory projection.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-principal
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.permission-grant
  - id: rule.nimi.platform.app-ecosystem.p-napp-032
    kind: rule
    title: P-NAPP-032 local record creation boundary
    modality: must
    statement: A mutable project enters only through local_development, an immutable package remains unavailable until its opaque-lineage mapping is admitted, and workspace adoption or scanning, file presence, package installation, cloned source, process liveness, app-local specs, aliases, and inventory-only rows cannot create a principal, local record, provenance, permission decision, launch lease, or session.
    condition: Whenever a local app record or positive local authority is created.
    failure: Deny creation unless the admitted provenance-specific path supplies every required fact.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-principal
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: rule.nimi.platform.app-ecosystem.p-napp-035a
    kind: rule
    title: P-NAPP-035 explicit local development authorization
    modality: must
    statement: local_development is the sole mutable third-party provenance class and uses the common principal, launch and session, permission, and owner-operation coordinator; the global Developer Mode grants nothing, and first project authorization requires fresh presence plus explicit run_once or allow_project consent.
    condition: Whenever a mutable third-party project is authorized.
    failure: Deny authorization or launch without the exact explicit consent path.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-principal
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: rule.nimi.platform.app-ecosystem.p-napp-035b
    kind: rule
    title: P-NAPP-035 bound development consent and permission requirements
    modality: must
    statement: Development authorization binds canonical project-root file identity, declared app id, permission-requirement fingerprint, current account, fixed shell and entry policy, and consent; manifest permission requirements contain only catalog rows whose admission is admitted and manifest_allowed is true, currently exactly agents.interact, together with its required reason, express request eligibility and transparency only rather than a grant, and reject every reserved, unknown, or other non-empty identifier before approval, while a zero-permission app remains runnable.
    condition: Whenever run_once or allow_project is created or reused.
    failure: Deny consent creation or reuse on any binding mismatch or unadmitted permission requirement.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: rule.nimi.platform.app-ecosystem.p-napp-035c
    kind: rule
    title: P-NAPP-035 lease renewal and consent invalidation
    modality: must
    statement: Every build or host replacement receives a new lease, process binding, and local-app session; exact allow_project consent may survive controlled HMR, rebuild, restart, supervisor replacement, Desktop restart, and Runtime restart, upgrade, or reinstall, while Runtime boot epoch and supervisor-run identity remain session inputs rather than durable consent inputs; account switch, mode-off, supervisor end, or Runtime replacement revokes live carriers, and revoke, bound-field mismatch, risk expansion, copied project, or integrity failure invalidates or requires fresh approval; run_once ends with supervisor run or any invalidation.
    condition: Whenever development host, account, Runtime, supervisor, project, or authorization state changes.
    failure: Revoke affected live carriers and deny reuse unless every durable consent binding remains exact.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-principal
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: rule.nimi.platform.app-ecosystem.p-napp-035d
    kind: rule
    title: P-NAPP-035 stable protected consent custody
    modality: must
    statement: Runtime-owned allow_project consent remains under the stable protected service authority root outside candidate and product-data roots; candidate installation may rebuild candidate-local principal or record projections from it but cannot replace, copy, or reinterpret the consent store, and mode-off, absent account, or absent supervisor never makes it auto-run.
    condition: Whenever local-development consent is stored, projected, or reused.
    failure: Deny use of consent from mutable candidate or product-data custody and require exact protected-store verification before explicit launch reuse.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: rule.nimi.platform.app-ecosystem.p-napp-035e
    kind: rule
    title: P-NAPP-035 zero-permission app authority remains valid
    modality: must
    statement: A local-development app using only its native host, app-owned OS storage, bounded app-private base entitlement, or exact app-owned native commands remains valid with an empty public permission list; those authorities do not enter the permission fingerprint, native-host changes remain bound by host and payload digest, shell and entry, process, and project generation checks, protected operations cannot be tunneled through native commands, and any later change to admitted public requirements triggers the existing reapproval flow.
    condition: Whenever local-development requirements or app-owned commands are evaluated.
    failure: Reject a tunneled protected operation or stale fingerprint without inventing Nimi permissions for app-owned authority.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-authority-class
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
  - id: rule.nimi.platform.app-ecosystem.p-napp-035f
    kind: rule
    title: P-NAPP-035 development host custody and disclosure
    modality: must
    statement: Controlled-account development remains Runtime-mediated and receives no token, bearer, stronger permission, persistent managed logon, or boot autostart; UI discloses that Nimi permissions do not constrain all ordinary OS rights of native code, including the admitted Windows ordinary-rights disclosure where applicable, renderer receives no raw filesystem, account, credential, partition, or generic host proxy, and exact Electron or Tauri host commands remain app authority only.
    condition: Whenever a local-development host is launched or its authority is disclosed.
    failure: Deny secret or generic-host exposure and present the applicable OS-rights disclosure.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-authority-class
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-principal
  - id: rule.nimi.platform.app-ecosystem.p-napp-036a
    kind: rule
    title: P-NAPP-036 closed local provenance
    modality: must
    statement: The local trust-class table closes third-party provenance to verified, user_imported, and local_development with its transition seams and bundled-component exclusions; provenance is Runtime-derived record state, cannot be selected or upgraded by a request, and has no Nimi API permission effect.
    condition: Whenever local app provenance is assigned, changed, or consumed.
    failure: Reject an unknown, caller-selected, permission-bearing, or invalidly transitioned provenance class.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: rule.nimi.platform.app-ecosystem.p-napp-036b
    kind: rule
    title: P-NAPP-036 principal and immutable lineage boundary
    modality: must
    statement: Runtime derives the random non-reused local_app_principal_id under local_os_user_anchor; opaque immutable lineage, attestation refs, provenance revision, execution-profile ref, and host and payload digest slots remain fixed, later package mapping cannot reshape them, promotion invalidates leases and sessions without creating permission, and shipped Zhiyu remains bundled while its integration build uses an isolated development principal.
    condition: Whenever a local principal, immutable lineage, promotion, or bundled integration identity is handled.
    failure: Reject reused or caller-derived principal identity, slot reshaping, permission creation by promotion, or bundled and development principal conflation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-principal
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: rule.nimi.platform.app-ecosystem.p-napp-037a
    kind: rule
    title: P-NAPP-037 macOS follows Windows and remains non-blocking
    modality: must
    statement: macOS protected-local product admission is a separate platform phase after the current Windows closure, Linux remains deferred, and neither platform is an ordinary-user readiness prerequisite before its own admission is complete.
    condition: Whenever platform order, readiness, or macOS support is described.
    failure: Keep the unadmitted platform unavailable without weakening Windows security or blocking the current Windows product closure.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.macos-protected-admission
  - id: rule.nimi.platform.app-ecosystem.p-napp-037b
    kind: rule
    title: P-NAPP-037 macOS requires independent native security outcomes
    modality: must
    statement: Future macOS admission requires an isolated non-interactive Runtime principal, Runtime-only secret custody, verified and supervised native host, process and executable trust, liveness, least privilege, session and account revocation, and fail-closed authorization without localhost, bearer, same-user daemon, development identity, or Windows-mechanism fallback.
    condition: Whenever macOS protected-local admission is implemented or evaluated.
    failure: Deny protected access until every required native security outcome is independently satisfied.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.executable-trust-set
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.macos-protected-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.protected-local-transport
  - id: rule.nimi.platform.app-ecosystem.p-napp-037ab
    kind: rule
    title: P-NAPP-037 negative posture preserves authority classes
    modality: must
    statement: Incomplete or failed macOS admission projects a typed unavailable, untrusted, repair-required, restarted, replaced, account-changed, or session-revoked outcome without minting permission, changing App authority class, exposing secrets, or reporting a successful protected session.
    condition: Whenever macOS protected-local posture is projected.
    failure: Return the owning typed negative state and deny protected access.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-authority-class
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.macos-protected-admission
  - id: definition.nimi.platform.app-ecosystem.catalog-admission
    kind: definition
    title: Verified app catalog admission
    meaning: Verified app catalog admission is Platform-owned immutable release discovery and review truth for the closed package-kind set and is distinct from Runtime-owned local identity, provenance, grants, leases, processes, sessions, and runnable truth.
  - id: definition.nimi.platform.app-ecosystem.registry-row
    kind: definition
    title: Verified app registry row
    meaning: A verified app registry row is the closed Platform schema joining canonical app identity, publisher and trust references, release and update references, AI and capability requirements, permission requirements, Runtime registration mode, storage policy, health projection, visibility, and admission status.
  - id: definition.nimi.platform.app-ecosystem.release-descriptor
    kind: definition
    title: Immutable third-party release descriptor
    meaning: An immutable third-party release descriptor is canonical Platform-owned versioned package-discovery truth whose closed publisher, source, artifact, assurance, Runtime, permission, storage, update, rollback-review, decision, and support fields resolve before admission.
  - id: definition.nimi.platform.app-ecosystem.health-repair-projection
    kind: definition
    title: App health and repair projection
    meaning: App health and repair projection is exactly unavailable, setup-required, needs-confirmation, in-progress, failed, unsupported, repair-required, or stale-projection as distinct fail-closed posture.
  - id: definition.nimi.platform.app-ecosystem.immutable-package-seam
    kind: definition
    title: Immutable package integration seam
    meaning: The immutable package integration seam consists only of opaque immutable_lineage_id, provenance_attestation_refs, provenance_revision, execution_profile_ref, host_executable_digest, and payload_root_digest slots without positive package operations or readiness.
  - id: definition.nimi.platform.app-ecosystem.publisher-identity
    kind: definition
    title: Admitted publisher identity
    meaning: Admitted publisher identity is reviewer-confirmed descriptor truth anchored by a GitHub user or organization namespace, a closed assurance value, and assurance-required verified domain and KYC references.
  - id: definition.nimi.platform.app-ecosystem.storage-posture
    kind: definition
    title: Third-party app storage posture
    meaning: Third-party app storage posture is exactly nimi-mediated-default with the Runtime-derived bounded private-storage template or app-owned-os-storage with explicit OS-path disclosure.
  - id: definition.nimi.platform.app-ecosystem.review-decision
    kind: definition
    title: Terminal app admission review decision
    meaning: A terminal app admission review decision is exactly approved, revision-requested, rejected, or kill-switched and records final security disposition without redefining the owning review state machine or adjudicator policy.
  - id: definition.nimi.platform.app-ecosystem.support-manifest
    kind: definition
    title: Admitted app support manifest
    meaning: An admitted app support manifest is the canonical descriptor block containing typed diagnostics fields, redaction rules, user-visible issue categories, escalation route, kill-switch visibility, and recovery instructions.
  - id: definition.nimi.platform.app-ecosystem.catalog-admission-track
    kind: definition
    title: Verified catalog admission track
    meaning: A verified catalog admission track classifies catalog review only, admits ordinary-release-proof as the sole third-party descriptor track, and never represents local development, user import, CI fixture posture, or local runnable truth.
  - id: rule.nimi.platform.app-ecosystem.p-napp-001a
    kind: rule
    title: P-NAPP-001 catalog authority and package kind
    modality: must
    statement: The current third-party App product scope admits only Runtime-owned local_development, while retained Platform catalog, public release, trust-tier, ordinary-user install, update, repair, and user_imported designs remain unavailable until separate lifecycle authority activates them; future catalog presence alone creates no principal, record, grant, lease, session, runnable truth, or ordinary visibility.
    condition: Whenever current App scope, future package admission, or local runnable posture is resolved.
    failure: Reject current non-local-development admission, premature public-lifecycle activation, another package kind, or local authority inferred from future catalog presence or absence.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: rule.nimi.platform.app-ecosystem.p-napp-001b
    kind: rule
    title: P-NAPP-001 shared content packs are not installable apps
    modality: must_not
    statement: A shared Nimi Content Pack is admitted as an installable product unit.
    condition: Whenever an installable package kind is evaluated.
    failure: Deny admission as an installable app.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
  - id: rule.nimi.platform.app-ecosystem.p-napp-002a
    kind: rule
    title: P-NAPP-002 complete registry row schema
    modality: must
    statement: Every verified registry row contains app_id, display_label, publisher, trust_tier_ref, package_kind, package_signature_policy_ref, update_channel_ref, ai_profile_selection_ref, capability_set_refs, ai_capability_requirement_refs, local_compute_pack_refs, runtime_registration_mode, permission_requirements, health_repair_projection, ordinary_visibility, release_descriptor_ref, install_storage_policy_ref, and admission_status with every reference resolving to its admitted owner row.
    condition: Whenever a verified registry row is admitted or consumed.
    failure: Fail admission closed when a field or reference is missing or unresolved.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registry-row
  - id: rule.nimi.platform.app-ecosystem.p-napp-002b
    kind: rule
    title: P-NAPP-002 closed registry field semantics
    modality: must
    statement: A registry row uses nimi-app, app-managed registration, permission items shaped only as id and reason with an empty list valid for install, launch, and app-owned UI, ordinary_visibility from ordinary-visible, hidden-internal, developer-only, or not-admitted-visible, admission_status from admitted, gated_by_avatar_master_gate, deferred, or retired, and Apps shows only ordinary-visible admitted rows; permission readiness is not admission or launch status.
    condition: Whenever registry values or visibility are evaluated.
    failure: Reject an unknown value, malformed permission item, permission-readiness status, or improperly visible row.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registry-row
  - id: rule.nimi.platform.app-ecosystem.p-napp-003
    kind: rule
    title: P-NAPP-003 alias-driven AI profile selection
    modality: must
    statement: ai_profile_selection_ref resolves to an admitted factory AIProfile alias or profileId, and a registry row contains no embedded provider, connector, engine, or model identifier constant because vendor preference is alias-driven.
    condition: Whenever AI profile selection metadata is admitted.
    failure: Reject an unresolved reference or embedded vendor identifier.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registry-row
  - id: rule.nimi.platform.app-ecosystem.p-napp-004
    kind: rule
    title: P-NAPP-004 trust-tier reference boundary
    modality: must
    statement: trust_tier_ref is exactly nimi-first-party, nimi-verified-partner, or nimi-community unless explicit authority admits an extension, remains distinct from verified, user_imported, and local_development provenance, and never grants, denies, widens, or narrows a Nimi API permission.
    condition: Whenever trust tier, provenance, or permission is resolved.
    failure: Reject an unknown tier or any tier, provenance, or permission conflation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: rule.nimi.platform.app-ecosystem.p-napp-005a
    kind: rule
    title: P-NAPP-005 requirement reference closure
    modality: must
    statement: capability_set_refs, ai_capability_requirement_refs, and local_compute_pack_refs resolve respectively to admitted Platform capability vocabulary, SDK app, module, and feature required or optional AI setup declarations, and Runtime local environment packs before admission and remain three distinct meanings rather than one consumer concept.
    condition: Whenever app capability or compute requirements are admitted.
    failure: Fail admission on an unresolved reference or collapsed meaning.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registry-row
  - id: rule.nimi.platform.app-ecosystem.p-napp-005b
    kind: rule
    title: P-NAPP-005 no activation or secret material
    modality: must_not
    statement: A registry row, manifest, or app-local specification carries Runtime activation consumer_id as app requirement ownership or declares local paths, selected source records, materialization evidence, route bindings, provider health, scheduler state, or connector secrets.
    condition: Whenever app requirement metadata is authored or consumed.
    failure: Reject the authority-crossing or secret-bearing metadata.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registry-row
  - id: rule.nimi.platform.app-ecosystem.p-napp-006
    kind: rule
    title: P-NAPP-006 Runtime registration ownership
    modality: must
    statement: Runtime exclusively owns registration, local principal and record, enforcement, and process and session supervision, while a registry row records only verified release input and Platform admission never replaces Runtime registration semantics.
    condition: Whenever verified release input is projected locally.
    failure: Reject Platform-owned runnable truth or replacement Runtime semantics.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-principal
  - id: rule.nimi.platform.app-ecosystem.p-napp-007
    kind: rule
    title: P-NAPP-007 package trust and update boundary
    modality: must
    statement: Platform owns catalog signature, attestation, and update metadata, package mapping into opaque lineage, attestation, execution-profile, and digest slots remains unavailable until admitted, and updates neither mutate the Runtime-selected source record nor introduce parallel package trust.
    condition: Whenever verified package trust or update metadata meets local state.
    failure: Deny unmapped package use, selected-source mutation, or parallel trust.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.immutable-package-seam
  - id: rule.nimi.platform.app-ecosystem.p-napp-008
    kind: rule
    title: P-NAPP-008 explicit fail-closed health projection
    modality: must
    statement: health_repair_projection distinguishes unavailable, setup-required, needs-confirmation, in-progress, failed, unsupported, repair-required, and stale-projection, never collapses distinct reasons into unavailable, and never infers ready from file existence, endpoint reachability, process liveness, or transfer completion.
    condition: Whenever health, repair, or readiness is projected.
    failure: Deny ready and return the exact applicable negative state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.health-repair-projection
  - id: rule.nimi.platform.app-ecosystem.p-napp-009a
    kind: rule
    title: P-NAPP-009 owner-only authority allocation
    modality: must
    statement: Platform owns catalog, release, publisher and review posture, permission vocabulary, and provenance taxonomy; Runtime and canonical domain owners retain principals, records, grants, launch, sessions, credentials, and operations; app-tools owns only authoring and build orchestration; Desktop is only the current protected launcher implementation; and Apps consumes only admitted registry, package, and SDK projection satisfying the complete listing closure.
    condition: Whenever app authority or ordinary visibility is allocated.
    failure: Reject ownership or visibility outside the canonical owner projection.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-principal
  - id: rule.nimi.platform.app-ecosystem.p-napp-009b
    kind: rule
    title: P-NAPP-009 metadata grants no authority
    modality: must_not
    statement: App id, catalog row, tier, manifest, renderer metadata, host description, Desktop, or app-tools grants privilege or runnable identity or owns admission, marketplace, economy, or package trust truth, or Apps reads source workspace, app-local specifications, or unadmitted rows to decide visibility.
    condition: Whenever authority or Apps visibility is resolved.
    failure: Deny the inferred authority or visibility.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-principal
  - id: rule.nimi.platform.app-ecosystem.p-napp-011
    kind: rule
    title: P-NAPP-011 bundled seed and mutable-build isolation
    modality: must
    statement: The catalog may retain admitted bundled Avatar, Realm Persona Studio, Realm World Studio, and Zhiyu rows with owner posture without third-party redesign or provenance, shipped Avatar and Zhiyu retain owner caller semantics, Zhiyu's mutable integration build uses an isolated local-development principal inheriting no bundled identity, permission, storage, audience, session, LocalAgent, or Memory state, and no bundled row creates an external principal or package readiness.
    condition: Whenever bundled rows or mutable integration builds are handled.
    failure: Reject redesign, third-party mapping, inherited state, external principal, or inferred readiness.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-principal
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: rule.nimi.platform.app-ecosystem.p-napp-012a
    kind: rule
    title: P-NAPP-012 identity surface mapping
    modality: must
    statement: Platform owns canonical app_id display and routing mapping, Runtime resolves protected permission, storage, audience, session, and audit through random non-reused local_app_principal_id within local_os_user_anchor, and protected calls use Runtime-derived principal and session context rather than app_id, app_instance_id, or device_id.
    condition: Whenever display identity maps to a protected surface.
    failure: Reject a protected key or call derived from display identity.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-principal
  - id: rule.nimi.platform.app-ecosystem.p-napp-012b
    kind: rule
    title: P-NAPP-012 canonical identity syntax and bundle mapping
    modality: must
    statement: app_id is lowercase dot-separated with segments starting and ending in ASCII lowercase letters or digits and containing only internal lowercase letters, digits, or hyphens, underscore is forbidden, and Tauri identifier is only an OS bundle, signing, and update identifier derived exactly as ai.nimi.apps.<app_id> without AI semantics.
    condition: Whenever app_id or a Tauri identifier is admitted.
    failure: Reject invalid syntax or a non-derived or overloaded bundle identifier.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registry-row
  - id: rule.nimi.platform.app-ecosystem.p-napp-012c
    kind: rule
    title: P-NAPP-012 no side-namespace identity
    modality: must_not
    statement: Active source, scaffold state, Runtime caller behavior, or Tauri configuration uses app.nimi.*, dev.nimi.*, or another side namespace as active identity or encodes development or test posture into canonical app_id.
    condition: Whenever an active app identity is authored or consumed.
    failure: Reject the side namespace and keep non-product posture in Runtime-owned mode, record, build profile, or non-product evidence.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registry-row
  - id: rule.nimi.platform.app-ecosystem.p-napp-013a
    kind: rule
    title: P-NAPP-013 immutable admission closure
    modality: must
    statement: A verified third-party admission closes registry metadata, permission and Runtime requirements, AI profile requirements, exact version, immutable source, release descriptor, artifact digest and size, applicable signature or provenance, and storage policy in one immutable release record that owns discovery and attestation input only.
    condition: Whenever a third-party release is admitted.
    failure: Fail closed when any package or schema fact is absent or mutable.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-napp-013b
    kind: rule
    title: P-NAPP-013 source is not runnable authority
    modality: must_not
    statement: Repository ownership, package name, source directory, app-local specification, direct npm or npx, mutable branch or tag, clone, build, run, or installer execution creates immutable local truth, principal, grant, or session; mutable source uses local_development and immutable import remains unavailable until admitted.
    condition: Whenever source presence is interpreted locally.
    failure: Deny local authority and route mutable source through local_development.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.immutable-package-seam
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: rule.nimi.platform.app-ecosystem.p-napp-014a
    kind: rule
    title: P-NAPP-014 immutable descriptor and digest verification
    modality: must
    statement: Every catalog version resolves an immutable descriptor with exact app_id, version, source kind and ref, artifact locator, SHA-256, size, signature or provenance ref, Runtime kind and entry, permissions, and storage policy, and future mapping downloads only from that source, hashes bytes before unpack, registration, or execution, compares SHA-256, and continues manifest, permission, Runtime, and storage validation only after a match.
    condition: Whenever a catalog version or immutable mapping is admitted.
    failure: Fail closed before unpacking on missing fields, wrong source, or digest mismatch.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.immutable-package-seam
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-napp-014b
    kind: rule
    title: P-NAPP-014 descriptor and hash are not package safety
    modality: must_not
    statement: The descriptor is treated as immutable package format, hostile-byte inspector, or fixed-AppHost authority, enables user_imported installation before admission, or treats hash match alone as safety proof.
    condition: Whenever descriptor or digest success is interpreted.
    failure: Keep installation unavailable and require every independent validation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.immutable-package-seam
  - id: rule.nimi.platform.app-ecosystem.p-napp-015a
    kind: rule
    title: P-NAPP-015 principal-rooted app storage
    modality: must
    statement: Mediated storage is selected nimi_data/apps/<local_app_principal_id>/releases/<version>, data, cache, and tmp, Runtime alone resolves the principal, uninstall or project revoke tombstones it, retained durable data becomes orphaned and delete-only, deletion requires explicit fresh-presence confirmation, and reinstall or reauthorization never rebinds it.
    condition: Whenever app storage is resolved or lifecycle changes.
    failure: Deny caller-derived roots, implicit deletion, or orphan rebinding.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-principal
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.storage-posture
  - id: rule.nimi.platform.app-ecosystem.p-napp-015b
    kind: rule
    title: P-NAPP-015 bounded install and uninstall
    modality: must_not
    statement: Ordinary installation writes outside principal roots except through admitted Runtime dependency or materialization, or uninstall implicitly deletes shared models, Runtime dependencies, account data, or another app's data.
    condition: Whenever an app is installed or uninstalled.
    failure: Reject the write or unrelated deletion.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.storage-posture
  - id: rule.nimi.platform.app-ecosystem.p-napp-018a
    kind: rule
    title: P-NAPP-018 complete third-party descriptor
    modality: must
    statement: Every third-party descriptor resolves descriptor_id, app_id, exact version, ordinary-release-proof, publisher namespace, kind, assurance, domain, and KYC ref, immutable source kind and ref, artifact locator, digest, size, provenance ref and mirror ref, build, dependency, and platform-signing assurance, nimi-app Runtime kind, entry and sandbox refs, exact permissions including empty, storage policy, update channel, rollback marker, terminal review decision, and support manifest.
    condition: Whenever a third-party descriptor is admitted.
    failure: Fail closed when a required field or reference is missing, malformed, mutable, or unresolved.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-napp-018b
    kind: rule
    title: P-NAPP-018 descriptor is canonical truth
    modality: must_not
    statement: Descriptor truth is collapsed into a developer manifest or parallel artifact, or a developer manifest is treated as admission truth.
    condition: Whenever descriptor truth is authored or consumed.
    failure: Reject parallel truth and consume only the Platform descriptor.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-napp-019a
    kind: rule
    title: P-NAPP-019 opaque immutable seam
    modality: must
    statement: The local kernel admits only the six opaque seam slots and keeps size partition, dates, installed version, rollback candidate, active release pointer, install evidence, job, storage root, signer envelope, import, update, promotion, repair, positive operation, and readiness unavailable.
    condition: Whenever immutable package state is projected before separate admission.
    failure: Return typed unavailable and reject additional positive state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.immutable-package-seam
  - id: rule.nimi.platform.app-ecosystem.p-napp-019b
    kind: rule
    title: P-NAPP-019 frozen schema and non-local metadata
    modality: must_not
    statement: Future package mapping renames, splits, merges, or adds identity-bearing principal, record, grant, lease, process, or session fields, admits detailed package evidence without separate authority, or interprets catalog version, size, date, or rollback metadata as local package, principal, install, launch, grant, promotion, or rollback truth.
    condition: Whenever package mapping or catalog metadata is projected.
    failure: Reject schema change, undeclared evidence, or inferred local truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.immutable-package-seam
  - id: rule.nimi.platform.app-ecosystem.p-napp-020
    kind: rule
    title: P-NAPP-020 publisher identity requirements
    modality: must
    statement: Every third-party descriptor carries publisher.github_namespace and publisher.namespace_kind from user or org, domain-verified and identity-verified carry a non-null DNS-verifiable domain bound to the GitHub organization namespace, and manifest fields, repository ownership, or package name never substitutes for reviewer-confirmed publisher truth.
    condition: Whenever publisher identity is admitted.
    failure: Return publisher_identity_missing for absent or invalid namespace facts and verified_domain_unresolved for absent, unresolvable, or unbound domain.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.publisher-identity
  - id: rule.nimi.platform.app-ecosystem.p-napp-021
    kind: rule
    title: P-NAPP-021 assurance enum and KYC deferral
    modality: must
    statement: Assurance is exactly pseudonymous with GitHub anchor, domain-verified with DNS-verified org, or identity-verified with KYC-verified entity, the latter two require org, identity-verified requires a non-null reference through a separately admitted KYC pipeline, and assurance is never silently upgraded, downgraded, or mutated but requires new descriptor admission.
    condition: Whenever publisher assurance is admitted or changed.
    failure: Return publisher_identity_missing for invalid namespace binding or kyc_pipeline_not_yet_admitted for unresolved KYC and reject in-place mutation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.publisher-identity
  - id: rule.nimi.platform.app-ecosystem.p-napp-022
    kind: rule
    title: P-NAPP-022 pre-mirror reference and license closure
    modality: must
    statement: Every third-party descriptor resolves artifact_mirror_ref to a Nimi-controlled immutable mirror locator and has mirror_license_cleared true before mirroring, keeps the ref stable across substrate migration, and preserves artifact_mirror_ref_unresolved and mirror_license_unclear as distinct pre-mirror failures.
    condition: Whenever an artifact is admitted for mirroring.
    failure: Return the exact failure and perform no mirror mutation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-napp-023
    kind: rule
    title: P-NAPP-023 third-party build assurance
    modality: must
    statement: Third-party build_assurance is exactly nimi-built, reproducible-verified, or developer-attested, checksum-pinned remains restricted to first-party, internal, and developer-testing classes, and build assurance is review and display input rather than standalone automated install or runnable authority.
    condition: Whenever third-party build assurance is admitted or consumed.
    failure: Return build_assurance_third_party_violation for checksum-pinned or another invalid value and deny local-positive inference.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-napp-024a
    kind: rule
    title: P-NAPP-024 platform signing assurance schema
    modality: must
    statement: Every third-party descriptor carries macos_notarization from notarized, not-applicable, or not-required-internal, macos_developer_id_subject present unless not-applicable, windows_code_signing from signed, not-applicable, or not-required-internal, installer_signature from signed or unsigned-internal-only, entitlements_ref as admitted ref or null, and signing_subject as nimi or publisher.
    condition: Whenever platform signing assurance is admitted.
    failure: Fail closed when the sub-object or a typed subfield is missing or inconsistent.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-napp-024b
    kind: rule
    title: P-NAPP-024 ordinary signing and non-authority boundary
    modality: must
    statement: Ordinary-user third-party macOS resolves notarized and Windows resolves signed with no not-applicable or internal-only substitute, while signing fields remain catalog input that creates no package signing identity, principal, record, install, import, update, promotion, launch, ordinary visibility from non-product tracks, package readiness, or new admission_status value and future mapping uses only the opaque seam.
    condition: Whenever ordinary release signing assurance is admitted or projected.
    failure: Return platform_signing_required for insufficient signing and deny every local-positive or enum-extension claim.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission-track
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.immutable-package-seam
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-napp-025a
    kind: rule
    title: P-NAPP-025 terminal review decision semantics
    modality: must
    statement: Every third-party descriptor records review.decision as approved, revision-requested, rejected, or kill-switched, only approved posture advances positive catalog admission, and rejected or kill-switched posture remains fail-closed.
    condition: Whenever terminal review disposition is enforced.
    failure: Reject an unknown decision or positive admission without approved posture.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.review-decision
  - id: rule.nimi.platform.app-ecosystem.p-napp-025b
    kind: rule
    title: P-NAPP-025 terminal subset preserves review ownership
    modality: must_not
    statement: submitted or under-review appears as terminal review.decision, or this descriptor schema redefines the owning review-state set or tier-to-adjudicator policy.
    condition: Whenever review decision schema is consumed.
    failure: Reject the transient value or policy redefinition.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.review-decision
  - id: rule.nimi.platform.app-ecosystem.p-napp-026
    kind: rule
    title: P-NAPP-026 complete canonical support manifest
    modality: must
    statement: Every third-party descriptor carries a non-empty support block with typed diagnostics_bundle_fields, redaction_rules, user_visible_issue_categories, escalation_path, kill_switch_visibility, and recovery_instructions, and Runtime never infers those fields from a developer manifest, file existence, process liveness, or endpoint reachability.
    condition: Whenever support truth is admitted or projected.
    failure: Return support_manifest_incomplete for absent or incomplete fields and fail inferred support truth closed.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.support-manifest
  - id: rule.nimi.platform.app-ecosystem.p-napp-027a
    kind: rule
    title: P-NAPP-027 closed storage posture and template
    modality: must
    statement: storage_policy_ref.kind is exactly nimi-mediated-default or app-owned-os-storage with no in-place third value, and mediated posture resolves exactly selected nimi_data/apps/<local_app_principal_id>/releases/<version>, data, cache, and tmp using the Runtime-derived principal while materialization remains unavailable until package mapping is admitted.
    condition: Whenever storage posture is admitted or resolved.
    failure: Return storage_policy_kind_unresolved for invalid kind or nimi_mediated_storage_unresolved for unresolved template and typed unavailable for premature materialization.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.immutable-package-seam
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.storage-posture
  - id: rule.nimi.platform.app-ecosystem.p-napp-027b
    kind: rule
    title: P-NAPP-027 storage authority classes
    modality: must
    statement: The calling app's mediated partition is base_entitlement requiring live principal, session, account, path, type, quota, and symlink policy rather than a file permission or grant, cross-app and destructive retained-data access is excluded, and app-owned OS storage is accepted at every trust tier with disclosure, native schemas and commands outside protected-operation grants, and only an opaque session partition handle when needed.
    condition: Whenever either storage posture is authorized.
    failure: Deny access outside the exact authority class, invented grant, or raw account or credential exposure without rejecting app-owned posture itself.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-authority-class
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.storage-posture
  - id: rule.nimi.platform.app-ecosystem.p-napp-028a
    kind: rule
    title: P-NAPP-028 OS storage disclosure invariant
    modality: must
    statement: app-owned-os-storage carries a non-empty reviewer-visible and user-visible os_storage_disclosure whose entries contain typed path_pattern, purpose, and expected_size_band, while nimi-mediated-default carries no such field and the disjoint shapes use os_storage_disclosure_missing for either symmetric violation.
    condition: Whenever storage posture and disclosure are validated.
    failure: Fail admission closed with os_storage_disclosure_missing.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.storage-posture
  - id: rule.nimi.platform.app-ecosystem.p-napp-028b
    kind: rule
    title: P-NAPP-028 disclosure is not mutation authority
    modality: must_not
    statement: Runtime immutable uninstall, update, or repair unilaterally touches an os_storage_disclosure path.
    condition: Whenever lifecycle operations encounter disclosed app-owned paths.
    failure: Preserve the path and inform the user that clean-uninstall coverage is outside Nimi mediation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.storage-posture
  - id: rule.nimi.platform.app-ecosystem.p-napp-029a
    kind: rule
    title: P-NAPP-029 public source by trust tier
    modality: must
    statement: Every nimi-verified-partner or nimi-community descriptor resolves registry source_repo_url to a publicly visible GitHub repository at admission while nimi-first-party remains unconstrained, and an unresolvable URL is a distinct failure from source_repo_visibility_violation.
    condition: Whenever source URL and visibility are evaluated.
    failure: Return the distinct URL-resolution reason or source_repo_visibility_violation for a resolved non-public repository.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registry-row
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-napp-029b
    kind: rule
    title: P-NAPP-029 immutable source posture
    modality: must_not
    statement: Source visibility enforcement redefines the trust-tier vocabulary or source_repo_url or repository visibility posture is mutated in place after admission.
    condition: Whenever admitted source posture changes.
    failure: Preserve the tier vocabulary and require new descriptor admission.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-napp-033
    kind: rule
    title: P-NAPP-033 catalog track boundary
    modality: must
    statement: Tracks classify catalog review only, ordinary-release-proof is the sole third-party track, CI descriptors create no runnable truth, local_development is not a catalog track, user_imported is not simulated by a fixture, and positive immutable behavior remains unavailable until admitted.
    condition: Whenever an admission track is interpreted.
    failure: Reject a non-admitted track or local-positive inference.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission-track
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.immutable-package-seam
  - id: rule.nimi.platform.app-ecosystem.p-napp-034a
    kind: rule
    title: P-NAPP-034 protected launch prerequisites
    modality: must
    statement: A positive third-party session requires same-OS fixed Runtime, Runtime-derived local_app_control, PrepareLocalAppLaunch, native peer, process, and executable proof, exact principal, record, provenance, generation, account, and boot epoch; the lease is non-durable and absent from renderer and app state; and shortcuts target only the verified launcher selected by the launch profile.
    condition: Whenever a protected local session launches.
    failure: Deny launch on any missing prerequisite or launcher binding.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-principal
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.protected-local-transport
  - id: rule.nimi.platform.app-ecosystem.p-napp-034b
    kind: rule
    title: P-NAPP-034 platform-specific fail-closed launch
    modality: must
    statement: Windows is the current positive product-closure platform, macOS follows only after its independent native admission, Linux remains deferred, Desktop is a replaceable host implementation rather than authority, and an unsupported platform or portable localhost, environment, caller metadata, copied credential, or raw process-launch substitute never creates protected access.
    condition: Whenever a platform profile or substitute path is evaluated.
    failure: Fail an unadmitted platform or substitute path closed before protected session creation without blocking the current Windows closure.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.protected-local-transport
  - id: rule.nimi.platform.app-ecosystem.p-napp-038
    kind: rule
    title: P-NAPP-038 deferred registry membership cannot activate product behavior
    modality: must_not
    statement: Registry membership, a registry row, a release descriptor, trust-tier posture, or package presence creates current catalog admission, ordinary Apps visibility, ordinary-user installation, update, repair, or runnable truth.
    condition: Until separate lifecycle authority activates the public App lifecycle.
    failure: Keep every public-lifecycle outcome unavailable and preserve only the explicit local-development flow.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registry-row
  - id: rule.nimi.platform.app-ecosystem.p-napp-039
    kind: rule
    title: P-NAPP-039 stable trust-tier transitions
    modality: must
    statement: The publisher trust-tier vocabulary remains the closed stable set nimi-first-party, nimi-verified-partner, and nimi-community; a tier id is never renamed, rotated, or silently reassigned, and any publisher tier change requires a new catalog and release admission that re-resolves the tier's signature, identity-assurance, source-visibility, review, and kill-switch references without changing local principal, provenance, grant, or permission truth.
    condition: Whenever a trust tier is defined, assigned, or changed.
    failure: Reject an unknown or mutated tier and deny transition until the new admission and every tier-owned reference resolve.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.publisher-identity
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.review-decision
  - id: rule.nimi.platform.app-ecosystem.p-perm-018
    kind: rule
    title: P-PERM-018 closed permission catalog row schema
    modality: must
    statement: Every public permission catalog row has one canonical permission_id, admission posture, authority class, decision owner, manifest eligibility, decision mode, selector owner and shape, user-recognizable semantics, and explicit incomplete-admission blocker, with owner-specific invariants when applicable; missing, duplicate, unknown, inconsistent, or unresolved fields never make the permission requestable, and a Realm-owned row remains reference-only Platform metadata whose decision and enforcement stay on the Realm surface.
    condition: Whenever a public permission catalog row is authored, projected, declared, requested, or enforced.
    failure: Keep the permission unavailable and deny declaration or use until the unique complete owner-consistent row and its atomic owner slice are admitted.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.permission-grant
  - id: rule.nimi.platform.app-ecosystem.p-audit-001
    kind: rule
    title: P-AUDIT-001 admission outcomes preserve required truth
    modality: must
    statement: A third-party admission outcome is positive only when the exact immutable candidate and manifest inputs satisfy schema, digest, provenance, license, dependency, composite audit, review, and canonical registry-and-descriptor admission truth, and no mutable-source, present-fields-only, self-attested, AI-only, app-local, repository, or package-name shortcut may project a pass.
    condition: Whenever a third-party candidate admission outcome is produced.
    failure: Fail admission closed with the applicable typed reason when required truth is absent or a shortcut is attempted.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-audit-002
    kind: rule
    title: P-AUDIT-002 complete vendor-neutral audit risk classes
    modality: must
    statement: Every third-party admission resolves independent vendor-neutral risk coverage for malicious packages, known vulnerabilities, static analysis, repository security posture, malware reputation, and AI semantic or malice triage against the exact reviewed commit and admitted artifact, with each class supplied by a replaceable admitted adapter and no class collapsed or omitted.
    condition: Whenever third-party audit security coverage is evaluated.
    failure: Fail admission closed with audit_class_coverage_missing when a class, admitted adapter, exact commit binding, or exact artifact binding is absent.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.review-decision
  - id: rule.nimi.platform.app-ecosystem.p-audit-003
    kind: rule
    title: P-AUDIT-003 AI and self-attested evidence cannot decide admission
    modality: must_not
    statement: AI triage alone or developer-supplied scanner output substitutes for complete Nimi-run risk coverage or an admitted adjudicator, and developer context is represented as authoritative scanner evidence or an admission verdict.
    condition: Whenever AI triage or developer-supplied audit context is consumed for third-party admission.
    failure: Fail admission closed with ai_only_review_forbidden or self_attested_scan_forbidden as applicable.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.review-decision
  - id: rule.nimi.platform.app-ecosystem.p-audit-004a
    kind: rule
    title: P-AUDIT-004 community admission risk classification
    modality: must
    statement: The Nimi-run AI-audit descriptor diff classifies every nimi-community admission into exactly one risk class before adjudication, with a new app or any permission-requirement, publisher-namespace, namespace-kind, or build-assurance change classified manual and only a clean descriptor diff preserving all of those fields classified automated.
    condition: Whenever a nimi-community candidate is classified for adjudication.
    failure: Fail admission closed with solo_reviewer_classification_unresolved when the diff is absent, ambiguous, or outside the automated-class boundary.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.publisher-identity
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.review-decision
  - id: rule.nimi.platform.app-ecosystem.p-audit-004b
    kind: rule
    title: P-AUDIT-004 adjudicator floors and escalation
    modality: must
    statement: The risk classification never changes nimi-first-party internal review or the nimi-verified-partner full-manual floor, while a nimi-community manual class uses human adjudication and its automated class uses the Nimi-run automated gate only while every scanner and AI-triage risk signal remains clear.
    condition: Whenever risk classification influences adjudicator selection.
    failure: Fail admission closed with tier_floor_violation for a weakened tier floor and escalate a flagged or risk-elevating community candidate to human adjudication.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.review-decision
  - id: rule.nimi.platform.app-ecosystem.p-audit-005-p-dev-003
    kind: rule
    title: P-AUDIT-005 and P-DEV-003 developer audit is context only
    modality: must_not
    statement: A developer-side audit dry-run or local self-check is treated as an admission gate or as Nimi-run scanner output, even when its typed output accompanies a submission as developer-supplied context.
    condition: Whenever developer-side audit output is consumed.
    failure: Fail admission closed with developer_side_audit_not_gate and require authoritative coverage against the exact reviewed commit and admitted artifact.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.review-decision
  - id: rule.nimi.platform.app-ecosystem.p-audit-006
    kind: rule
    title: P-AUDIT-006 review decision security binding
    modality: must
    statement: A terminal third-party review decision is Nimi-owned, distinct from developer-authored manifest truth, and binds the exact candidate, complete risk-class coverage, AI model identity and version when AI triage applies, deterministic scanner results, adjudicator kind and identity, and decision time without collapsing evidence meanings or redefining terminal decision semantics.
    condition: Whenever a terminal third-party review decision is admitted or enforced.
    failure: Fail admission closed when any required binding is absent, developer-inferred, collapsed, or inconsistent with the admitted decision schema.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.review-decision
  - id: rule.nimi.platform.app-ecosystem.p-dev-004
    kind: rule
    title: P-DEV-004 immutable candidate submission
    modality: must
    statement: A submitted candidate artifact is built from either a protected immutable Git tag resolved to an unchangeable commit SHA or a reviewed commit SHA, records that exact source reference in submitted manifest input, and carries it unchanged into the immutable admitted release descriptor.
    condition: Whenever a third-party candidate artifact is submitted or admitted.
    failure: Fail admission closed with mutable_submission_artifact for a branch, unprotected tag, dist-tag, version range, latest projection, or any other mutable resolver.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-dev-006
    kind: rule
    title: P-DEV-006 production Developer Mode security boundary
    modality: must
    statement: The single production Developer Mode defaults off and grants nothing; first project authorization requires Runtime-owned fresh presence and exactly run_once or allow_project bound to OS-user anchor, isolated principal, canonical project identity, declared app id, exact capability fingerprint, current account, and fixed shell and entry policy, while all controlled replacements rotate launch and session proof without widening durable consent.
    condition: Whenever a mutable local_development project is authorized or reauthorized.
    failure: Deny authorization or consent reuse when mode, presence, choice, or any durable binding is absent or mismatched.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-principal
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: rule.nimi.platform.app-ecosystem.p-dev-006b
    kind: rule
    title: P-DEV-006 production Developer Mode revocation and custody
    modality: must
    statement: Mode off, account change, supervisor termination, or Runtime replacement revokes live sessions and run-once authority without auto-running preserved exact allow_project consent, and a development project receives only Runtime-mediated owner-policy access with no credential, portable proof, generic protected proxy, persistent managed logon, or boot autostart while product UX continuously discloses project, account, risk, and unconstrained ordinary OS rights.
    condition: Whenever Developer Mode lifecycle, project access, or production disclosure is evaluated.
    failure: Revoke affected carriers, deny secret or generic-proxy exposure, and require fresh approval after project, account, capability, risk, shell, entry, or origin mismatch.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-authority-class
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-principal
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: definition.nimi.platform.app-ecosystem.scaffold-custody
    kind: definition
    title: Scaffold authoring and custody boundary
    meaning: App Tools owns Scaffold creation, tool-owned initialization, local development launch, SDK and demand-driven Kit integration, Simulator preview and checks, and Nimi Home host glue for the current Desktop-hosted Third-party Local App flow while the App owns product logic and private data and Runtime owns protected identity, session, authorization, Realm mediation, and credentials.
  - id: definition.nimi.platform.app-ecosystem.ecosystem-economy-boundary
    kind: definition
    title: Ecosystem economy non-admission boundary
    meaning: The ecosystem economy boundary keeps take-rate, billing, paid-app, subscription, developer-economics, creator-economics, and AI-spend policy unadmitted on the Platform ecosystem surface until a separate owner-complete specification cut.
  - id: definition.nimi.platform.app-ecosystem.proposal-record
    kind: definition
    title: Non-executing proposal intake record
    meaning: A proposal record is Platform-owned durable intake truth for a conversation-originated request, its closed kind and review state, source reference, selected owner, next review step, reason, and audit reference, and carries no admission, installation, grant, or execution authority.
  - id: definition.nimi.platform.app-ecosystem.mod-extension-retirement
    kind: definition
    title: Public mod and extension retirement boundary
    meaning: The mod-extension retirement boundary permanently excludes public Mod, Extension, Hook, shared content-pack, and equivalent aliased installable surfaces from current Nimi product admission while keeping app-internal content under its app or admitted domain owner.
  - id: rule.nimi.platform.app-ecosystem.p-scaf-001a
    kind: rule
    title: P-SCAF-001 scaffold and app product ownership
    modality: must
    statement: Platform owns app scaffolding, and a generated app owns only its app-specific product logic, routes, state, and feature behavior after the scaffold places the admitted boundaries.
    condition: Whenever a generated app repository is created or maintained.
    failure: Reject scaffold output or app code that crosses the owner boundary.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-001b
    kind: rule
    title: P-SCAF-001 upstream admission and no shadow ownership
    modality: must
    statement: Scaffolding generates only inputs for the upstream developer workflow and never makes generated product code a shadow owner for public app admission, Runtime account custody or registration, SDK client semantics, Realm login, permission grants, or Kit shell behavior.
    condition: Whenever scaffold output enters an owner workflow or consumes an owner surface.
    failure: Deny the shadow authority and require the upstream owner decision or public projection.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-002a
    kind: rule
    title: P-SCAF-002 accepted bootstrap command and dependency boundaries
    modality: must
    statement: App authoring remains under nimi-app create, init, doctor, and update; standalone Rust shell consumption uses the published nimi-shell-tauri channel only after its public mechanics are admitted, and workspace consumption uses its admitted Cargo path dependency.
    condition: Whenever the app-authoring command or Rust-shell dependency surface is selected.
    failure: Reject a Runtime CLI takeover, unadmitted publication claim, or dependency path outside the applicable boundary.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-002b
    kind: rule
    title: P-SCAF-002 host-neutral client boundary
    modality: must
    statement: Generated third-party apps consume one host-neutral SDK client through an injected local_app_host carrier without selecting caller mode, trust class, endpoint, principal, grant, lease, or session, and scaffolding writes no authority or admitted product truth.
    condition: Whenever scaffolding composes SDK access.
    failure: Reject caller-selected protected facts or scaffold-authored authority and admitted product truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-002c
    kind: rule
    title: P-SCAF-002 production development path and accepted-input stability
    modality: must
    statement: Local development uses production Developer Mode, an isolated local_development principal, the fixed service, the shared grant evaluator, and a host-private local-app session, forbids daemon, mock-auth, disabled-gate, pseudo-success, and first-party-self-declaration shortcuts, and does not reopen the accepted A0 through A5 boundaries without an explicit superseding specification cut.
    condition: Whenever scaffolded local development or compatibility behavior is implemented.
    failure: Fail closed on any shortcut or unsuperseded compatibility alternative.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-004
    kind: rule
    title: P-SCAF-004 submitted manifest is not descriptor truth
    modality: must
    statement: Scaffolding may generate nimi.app.yaml only as labeled developer-submitted input for the owner review flow and never as release-descriptor, registry, review, mirror, ordinary-install, or public-admission truth.
    condition: Whenever a scaffold generates, labels, or consumes nimi.app.yaml.
    failure: Reject any positive owner truth inferred from the submitted manifest.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-006
    kind: rule
    title: P-SCAF-006 permission declarations are review input only
    modality: must
    statement: Generated permission declarations are closed transparency and review input only, while readiness and launch consume current owner grant or promptable-grant projections and never treat a declaration as a grant, entitlement, launch authorization, AI-spend authorization, or denial bypass.
    condition: Whenever scaffolded permission input is generated or used.
    failure: Deny protected use until the admitted owner projection authorizes it.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-008
    kind: rule
    title: P-SCAF-008 app-authoring command family
    modality: must
    statement: The public developer-repository authoring command family is exactly nimi-app create, nimi-app init, nimi-app doctor, and nimi-app update, and the Runtime nimi CLI does not own scaffold templates, build inputs, publishing, admission, doctor, or update semantics.
    condition: Whenever an app-authoring command is exposed or assigned an owner.
    failure: Reject an additional command owner or Runtime CLI ownership of the authoring surface.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-009a
    kind: rule
    title: P-SCAF-009 create and init custody
    modality: must
    statement: nimi-app create writes only the source skeleton and explicit initialization intent, while nimi-app init consumes installed dependencies, performs pinned deterministic package projection sync, and writes scaffold-owned lock and developer-input state without template-copying package projections, hidden postinstall mutation, or interactive project reconstruction.
    condition: Whenever create or init mutates a developer repository.
    failure: Abort on uninstalled, hidden, interactive, template-owned, or out-of-custody mutation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-009b
    kind: rule
    title: P-SCAF-009 update preservation and non-admission output
    modality: must
    statement: nimi-app update changes only scaffold-managed glue through admitted dependency updates and codemods, preserves app-owned product code, fails closed on conflicts or mixed and stale projection state, and no init, doctor, update, audit, reachability, file, or build result becomes public admission, installed-app health, launch, rollback, update, or kill-switch truth.
    condition: Whenever scaffold maintenance output is produced or interpreted.
    failure: Stop the mutation on unsafe state and reject every projected owner-lifecycle claim.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-010
    kind: rule
    title: P-SCAF-010 package projection custody
    modality: must
    statement: Package-owned .nimi config, contract, and methodology projections remain externally package-owned, generated repositories consume them through the package's declared synchronization surface, host-local truth stays inside the generated repository's .nimi boundary, and local evidence, lifecycle reports, or package projections do not become semantic truth or override canonical product authority under .nimi/spec.
    condition: Whenever generated repository projections or host-local truth are synchronized or interpreted.
    failure: Reject copied, re-owned, out-of-boundary, or falsely promoted projection content.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-012
    kind: rule
    title: P-SCAF-012 separate scaffold and public admission surfaces
    modality: must
    statement: Public app admission and developer-repository scaffold shape remain separate owner surfaces; scaffolding writes no admitted truth and cannot create registry, descriptor, mirror, review, visibility, install, or kill-switch truth.
    condition: Whenever scaffolding creates or projects admission-related content.
    failure: Reject scaffold-created public truth or substitution for the public admission owner.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-013
    kind: rule
    title: P-SCAF-013 model-test feature non-availability
    modality: must_not
    statement: Default scaffold content imports, fabricates, or edits a kit/features/model-test package surface before that feature is admitted and available, or presents a planned feature as shipped.
    condition: Whenever default scaffold content or examples are generated.
    failure: Remove the unadmitted surface and use only admitted SDK, Kit, Runtime, or app-owned placeholder areas.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-016a
    kind: rule
    title: P-SCAF-016 protected launch and session custody
    modality: must
    statement: A Scaffolded Third-party Local App is launched by the current Nimi Home host, uses Runtime-derived account, App identity, and authorization through the standard SDK, and never receives Realm JWT, Provider Credential, Runtime session proof, or internal authorization material.
    condition: Whenever a scaffolded third-party app opens a protected local session.
    failure: Deny launch or session creation when protected identity, authorization, proof, or credentials are App-supplied or exposed.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-016b
    kind: rule
    title: P-SCAF-016 host bridge composition and fail-closed status
    modality: must
    statement: Generated source composes the standard SDK and any demand-driven Kit host integration in scaffold-owned glue, keeps Runtime mediation transparent to the App developer, returns typed unavailable for inapplicable operations, and never constructs caller identity or self-reports host, account, session, token, proof, or authorization truth.
    condition: Whenever generated source composes or reports local-app host access.
    failure: Return typed unavailable and reject app-supplied or self-reported protected truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-018a
    kind: rule
    title: P-SCAF-018 official local development launcher
    modality: must
    statement: Fresh scaffolds expose their dev and dev:shell package scripts through the same official nimi-app dev launcher, whose authority is limited to parsing, validation, build coordination, and safe status and cannot issue authorization, grants, tickets, sessions, protected endpoints, credentials, release trust, or product evidence.
    condition: Whenever a scaffolded local-development command runs.
    failure: Reject a private launcher or any launcher-created protected authority.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-018b
    kind: rule
    title: P-SCAF-018 production path and bypass prohibition
    modality: must
    statement: The positive development command requests Desktop production Developer Mode, fresh project presence, isolated principal, and supervised fixed-service launch, receives only stable status or failure, and rejects direct Tauri, manual Electron, generic proxy, token or session custody, app-owned authorization, caller-selected Runtime inputs, private launchers, registration bypasses, and protected-operation-positive renderer-only development.
    condition: Whenever local development attempts to reach protected operations.
    failure: Fail closed before protected access and route the request through the official supervised path.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-018c
    kind: rule
    title: P-SCAF-018 synchronization preserves app custody
    modality: must
    statement: Scaffold synchronization keeps the official launcher reference deterministic, never overwrites app-owned product files, and applies the same launcher, Kit, and Runtime boundary to tester and external app consumers.
    condition: Whenever launcher glue is synchronized or consumed.
    failure: Reject non-deterministic glue, product-file overwrite, or consumer-specific authority bypass.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-eco-001
    kind: rule
    title: P-ECO-001 ecosystem expansion scope
    modality: must
    statement: Platform ecosystem expansion covers third-party onboarding, trust-tier policy, future world and game app classes, the future Engine SDK seam, economy non-admission, and negative strategic gates without replacing app admission, permission, or retired extension authority.
    condition: Whenever ecosystem expansion policy is authored or applied.
    failure: Reject scope outside this boundary or replacement of an existing owner surface.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.ecosystem-economy-boundary
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.mod-extension-retirement
  - id: rule.nimi.platform.app-ecosystem.p-eco-002
    kind: rule
    title: P-ECO-002 third-party registry onboarding remains deferred
    modality: must_not
    statement: A third-party developer enters the current product through registry onboarding, public admission, trust-tier review, ordinary-user installation, or a registry-bypass alias instead of the explicit local-development flow.
    condition: Until separate lifecycle authority activates public App distribution and onboarding.
    failure: Keep public onboarding unavailable and require the current local-development flow.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registry-row
  - id: rule.nimi.platform.app-ecosystem.p-eco-003
    kind: rule
    title: P-ECO-003 closed trust-tier expansion
    modality: must
    statement: Ecosystem expansion fills policy references only for the existing nimi-first-party, nimi-verified-partner, and nimi-community tiers and admits no fourth public tier without an explicit specification cut.
    condition: Whenever ecosystem trust-tier policy expands.
    failure: Reject a new or mutated public tier absent the explicit cut.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
  - id: rule.nimi.platform.app-ecosystem.p-eco-004
    kind: rule
    title: P-ECO-004 typed review posture reference
    modality: must
    statement: Ecosystem review posture references the closed submitted, under-review, revision-requested, approved, rejected, and kill-switched states, applies internal review to first-party, full manual review to verified partners, and automated review with manual kill-switch eligibility to community, with no silent transition and no automatic recovery from kill-switched.
    condition: Whenever ecosystem review posture is projected or changed.
    failure: Reject an unknown state, tier-policy mismatch, silent transition, or terminal-state recovery.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.review-decision
  - id: rule.nimi.platform.app-ecosystem.p-eco-005
    kind: rule
    title: P-ECO-005 future world and game app boundary
    modality: must
    statement: A future world or game app remains a Nimi App registry candidate, and any cross-world or cross-game flow requires the existing permission lifecycle and an admitted projection while retaining source app, target app, and AIScopeRef references on the Realm audit surface; raw sharing and first-party trust inheritance are forbidden.
    condition: Whenever a world or game app class or cross-app flow is proposed.
    failure: Deny admission or data flow without the registry, owner permission, projection, audit reference, and trust-tier boundary.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
  - id: rule.nimi.platform.app-ecosystem.p-eco-006
    kind: rule
    title: P-ECO-006 Engine SDK public-surface seam
    modality: must
    statement: A future Engine SDK is placed on the Platform seam and consumes Runtime and Realm authority only through SDK public surfaces, while Runtime retains implementation semantics and the Engine SDK never imports Runtime internals, Realm private client or transport, Cognition private endpoints, or replaces any canonical owner.
    condition: Whenever an Engine SDK integration is designed or implemented.
    failure: Reject the private import, private endpoint, or owner substitution.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
  - id: rule.nimi.platform.app-ecosystem.p-eco-007
    kind: rule
    title: P-ECO-007 economy policy remains unadmitted
    modality: must_not
    statement: Platform ecosystem authority decides take-rate, billing, paid-app, subscription, creator or developer economics, or cloud and Runtime AI-spend policy, or disguises such a decision as pricing copy, registry metadata, or an app-local setting.
    condition: Until a separate specification cut identifies the economy owner, scope, audit, and enforcement boundary.
    failure: Keep the economy decision unadmitted and require the owner-complete cut.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.ecosystem-economy-boundary
  - id: rule.nimi.platform.app-ecosystem.p-eco-008
    kind: rule
    title: P-ECO-008 no Steam-copy strategic posture
    modality: must_not
    statement: Product positioning, registry rows, admission review, or ecosystem marketing uses a Workshop clone, trading-card or achievement grind, collectible badge or platform inventory, family-sharing clone, Big-Picture clone, screenshot or video social-feed clone, or a friends or invite clone outside Realm social authority as Nimi's primary justification or strategic posture.
    condition: Whenever ecosystem product strategy or messaging is produced.
    failure: Reject the clone-based posture and preserve the Realm social owner boundary.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
  - id: rule.nimi.platform.app-ecosystem.p-eco-010
    kind: rule
    title: P-ECO-010 cross-cutting owner invariants
    modality: must
    statement: Ecosystem expansion preserves fail-closed permission decisions, provider-neutral and model-neutral selection, Apps non-ownership, the single ordinary-user truth after hard cut, the Character-sourced LocalAgent identity floor, and every existing Platform, Runtime, Realm, Cognition, and SDK owner boundary.
    condition: Whenever ecosystem capability expands.
    failure: Deny expansion that bypasses or weakens any referenced invariant.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-permission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-agent-identity
  - id: rule.nimi.platform.app-ecosystem.p-prop-001a
    kind: rule
    title: P-PROP-001 durable intake and non-execution
    modality: must
    statement: A first-party durable request, queued capability, review item, or future handoff uses the Platform-owned proposal record, and creating, updating, submitting, or closing it installs nothing, registers no service, grants no permission, loads no code, starts no workflow, invokes no tool, selects no provider or model, mutates no external user data, and exposes no release.
    condition: Whenever conversation-originated proposal intake becomes durable or changes state.
    failure: Reject the parallel intake or attempted side effect and preserve only proposal-record mutation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-prop-001b
    kind: rule
    title: P-PROP-001 no local proposal truth or admission proof
    modality: must_not
    statement: App-local tables, renderer state, transcripts, files, or UI cards become durable proposal truth, or a proposal record proves a capability, workflow, app, tool, permission, package, or release admitted.
    condition: Whenever proposal state or downstream eligibility is resolved.
    failure: Discard the local or inferred truth and require the Platform record followed by owner review.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-prop-002
    kind: rule
    title: P-PROP-002 closed proposal record shape
    modality: must
    statement: Every proposal record carries Platform-minted proposal_id, closed proposal_kind, source_conversation_anchor_id, requester_subject_ref, owner_domain, requested_capability_ref, policy-selected risk_tier, explicit required_permission_refs including an empty list, non-executing next_review_step, closed state, reason_code, audit_ref, and created_at, with the identity, kind, owner, state, reason, audit, and creation fields also required for rejected requests.
    condition: Whenever a proposal record is created, read, or updated.
    failure: Reject an incomplete, app-minted, open-valued, or malformed record.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-prop-002b
    kind: rule
    title: P-PROP-002 non-executable record contents
    modality: must_not
    statement: A proposal record carries executable code, prompt bodies, provider or model names, install commands, hidden grants, unreviewed package locators, local filesystem paths, or app-local admission flags.
    condition: Whenever proposal record content is accepted.
    failure: Reject the forbidden content and keep any rejected summary bounded and redacted.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-prop-003
    kind: rule
    title: P-PROP-003 closed proposal kinds and retired aliases
    modality: must
    statement: proposal_kind is exactly capability_proposal, workflow_draft_request, nimi_app_request, delegated_tool_request, or rejected_request with their intake-only meanings, and any new kind requires a Platform authority change and synchronized projections.
    condition: Whenever proposal kind is assigned or extended.
    failure: Reject an unknown kind, and classify a Mod, Extension, content-pack, plugin, worker, VM, hook, shared-package, or equivalent retired alias as rejected_request or blocked with a typed reason.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.mod-extension-retirement
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-prop-004a
    kind: rule
    title: P-PROP-004 closed intake state machine
    modality: must
    statement: Proposal state is exactly draft, submitted, under-review, revision-requested, rejected, accepted-for-admission, or blocked, every transition sets a typed reason_code and updates audit_ref, and these remain intake states rather than app-admission review states.
    condition: Whenever proposal state is created or transitioned.
    failure: Reject an unknown, unaudited, reasonless, or admission-schema-substituting transition.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-prop-004b
    kind: rule
    title: P-PROP-004 accepted-for-admission is not approval
    modality: must_not
    statement: accepted-for-admission is treated as approved, admitted, installed, enabled, granted, running, or ordinary-user-visible.
    condition: Whenever an accepted proposal is handed to a downstream owner.
    failure: Preserve intake-only status and require the downstream owner's admitted process.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-prop-005
    kind: rule
    title: P-PROP-005 owner-review handoff only
    modality: must
    statement: Every proposal handoff names an owner and non-executing next step, and the owner independently validates it; app requests use the existing developer, registry, and audit admission path, delegated-tool requests wait for Runtime owner acceptance and all consent, and workflow drafts remain blocked with a missing-authority reference while execution authority is absent.
    condition: Whenever proposal intake hands a request to another owner.
    failure: Block the handoff before install, execution, provider or model selection, permission grant, release promotion, hidden runner creation, or bypass of owner validation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-prop-006
    kind: rule
    title: P-PROP-006 conversation reference without transcript custody
    modality: must
    statement: source_conversation_anchor_id remains a provenance-only reference to conversation continuity, any request summary is bounded, redacted when needed, and review-only, and the proposal record stores no raw transcript, private memory, provider trace, account secret, or app-owned conversation state.
    condition: Whenever proposal intake references source conversation material.
    failure: Reject transferred owner content and retain only the bounded reference or redacted review input.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.conversation-anchor
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-prop-007
    kind: rule
    title: P-PROP-007 typed transition audit
    modality: must
    statement: Every proposal creation and transition returns an owner-issued audit_ref whose audit or pending record binds proposal_id, applicable from_state, to_state, transition_cause, decided_at, and adjudicator reference, and unavailable audit fails closed or returns blocked with proposal_audit_unavailable without synthetic app-issued references.
    condition: Whenever a proposal is created or changes state.
    failure: Fail the operation or return the typed blocked result when the complete owner audit reference cannot be produced.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-prop-008
    kind: rule
    title: P-PROP-008 typed SDK and app consumer boundary
    modality: must
    statement: SDK proposal projections preserve the closed shape and non-execution semantics, apps render only returned Platform state and fail closed on absent, rejected, or blocked results, and neither SDK nor apps create a parallel durable state machine, bypass intake through REST, files, renderer persistence, or Runtime private imports, or hardcode providers, models, execution paths, or retired aliases.
    condition: Whenever SDK or app consumers create, read, update, or render proposals.
    failure: Reject the bypass or hardcoded projection and return the owner result or typed failure.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-moex-001
    kind: rule
    title: P-MOEX-001 public mod and extension non-admission
    modality: must_not
    statement: A Public Mod or Public Extension is admitted as an external installable, distributable, or user-authorized product category, including through a registry, SDK, Apps, install gateway, release channel, or alias.
    condition: Whenever an external product category or public ecosystem entry is proposed.
    failure: Deny admission and preserve the retired boundary.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.mod-extension-retirement
  - id: rule.nimi.platform.app-ecosystem.p-moex-002
    kind: rule
    title: P-MOEX-002 retired Mod and Hook surfaces stay retired
    modality: must_not
    statement: A retired Mod, Hook, runtime-mod, or SDK mod surface returns as an ordinary-user entry, Nimi App, ecosystem entry, public SDK or API promise, compatibility layer, or reserved namespace without a new explicit admission that reuses none of the retired authority files, paths, or names.
    condition: Whenever a retired surface or equivalent proposal is introduced.
    failure: Reject the reintroduced or compatibility surface and require a new non-reusing admission.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.mod-extension-retirement
  - id: rule.nimi.platform.app-ecosystem.p-moex-003
    kind: rule
    title: P-MOEX-003 no shared Nimi Content Pack channel
    modality: must_not
    statement: Nimi creates or admits a shared Nimi Content Pack product or cross-app general content-package channel through Registry, Apps, SDK, or an alias.
    condition: Whenever a shared content channel is proposed or classified.
    failure: Deny the channel and treat the proposal as a request to reopen explicit authority.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.mod-extension-retirement
  - id: rule.nimi.platform.app-ecosystem.p-moex-004
    kind: rule
    title: P-MOEX-004 app-internal content custody
    modality: must
    statement: App-internal Avatar, Live2D, VRM, voice, persona, prompt, knowledge, workflow, and other content packages remain owned by their app or explicitly admitted domain authority and are never classified as a Nimi App, Mod, Extension, or shared content channel.
    condition: Whenever an app-internal content package is owned or classified.
    failure: Restore app or domain custody and reject the public or shared classification.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.mod-extension-retirement
  - id: rule.nimi.platform.app-ecosystem.p-moex-005
    kind: rule
    title: P-MOEX-005 retired Asset Market cannot silently return
    modality: must_not
    statement: Asset Market returns as first-party app admission, backend or projection behavior, or active product authority without a new explicit admission row and newly authored authority.
    condition: Whenever an Asset Market surface is proposed after retirement.
    failure: Deny the revival until a complete new admission is authored.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.mod-extension-retirement
