  - id: rule.nimi.platform.app-ecosystem.p-napp-030a
    kind: rule
    title: P-NAPP-030 complete listing-closure field set
    modality: must
    statement: The ordinary-visible listing predicate evaluates the composed Platform index and approved descriptor conjunction of admitted admission_status, ordinary-visible visibility, non-kill-switched posture, resolved trust tier, nimi-app package kind and signature policy, protected source and immutable GitHub Release, app-managed Runtime registration mode, App access declaration including empty, CapabilityContract and required standardized features, storage and support policy, at least one valid target, and absence of blocked facts; Runtime-local installation, health, Host, session, snapshot, access, and operation availability are independent annotations and never gate catalog discovery.
    condition: Whenever an Apps listing row is projected.
    failure: Exclude the row from ordinary-visible projection when any conjunct is absent, unresolved, or negative.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: rule.nimi.platform.app-ecosystem.p-napp-030b
    kind: rule
    title: P-NAPP-030 no parallel or reduced listing predicate
    modality: must_not
    statement: A listing implementation creates a predicate parallel to P-NAPP-009, removes a listing-closure conjunct, duplicates canonical descriptor facts into the index, treats one resolved field as implied by another, or uses Runtime-local health or installation as catalog visibility truth.
    condition: Whenever the ordinary-visible listing predicate is implemented or changed.
    failure: Fail the row out of ordinary-visible projection and restore the single complete conjunction.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: rule.nimi.platform.app-ecosystem.p-napp-031
    kind: rule
    title: P-NAPP-031 unified inventory preserves owner projections
    modality: must
    statement: Desktop and SDK inventory preserves inspectable catalog, account, and local_record source identities as distinct owner projections, keeps registered subject, declaration generation, session, and current access availability separate, and never joins by display App id in a way that merges subjects, storage, audience, sessions, snapshots, or turns one source fact into another.
    condition: Whenever Apps inventory rows are composed or joined.
    failure: Reject a merged or source-erasing inventory projection.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registered-app-subject
  - id: rule.nimi.platform.app-ecosystem.p-napp-032
    kind: rule
    title: P-NAPP-032 local record creation boundary
    modality: must
    statement: A verified local record is created only by atomic commit of an approved catalog artifact and a local_development record only by Developer-Mode source evaluation and registration; caller-selected local artifacts, workspace adoption or scanning, file presence, installer execution, cloned source, process liveness, app-local specs, aliases, and inventory-only rows cannot create a registered subject, local record, provenance, declaration generation, Desktop launch witness, protected session, or Effective App Access Snapshot.
    condition: Whenever a local app record or positive local authority is created.
    failure: Deny creation unless the admitted provenance-specific path supplies every required fact.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registered-app-subject
  - id: rule.nimi.platform.app-ecosystem.p-napp-035a
    kind: rule
    title: P-NAPP-035 local development uses the common App path
    modality: must
    statement: local_development is the sole mutable third-party provenance class and uses the same registered subject, declaration, Desktop exact-Host launch, fresh Runtime session, Effective App Access Snapshot, and exact operation admission path as other Third-party Apps; Developer Mode controls official development-source registration, evaluation, launch, supervision, and tooling, but neither grants App access nor creates project consent or durable access state, and disabling it stops only the local-development Host and tooling without affecting a separately admitted verified-installed source.
    condition: Whenever a mutable Third-party App project is registered, launched, or given protected access.
    failure: Refuse official development-source registration, evaluation, launch, supervision, and tooling while Developer Mode is disabled, keep protected access independently unavailable whenever its own current prerequisites are absent, and create no run_once, allow_project, project approval, permission, capability fingerprint, or durable access state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registered-app-subject
