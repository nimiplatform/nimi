format: nimicoding.authority/v2
owner: team.platform
scope: platform.app-ecosystem
units:
  - id: definition.nimi.platform.app-ecosystem.local-agent-identity
    kind: definition
    title: Runtime LocalAgent identity
    meaning: A LocalAgent is an independent Runtime-owned local identity materialized from one Realm-issued Character Source, with optional World Source context, and repeated materialization from the same source creates distinct identities, configuration, Cognition-owned long-term Memory and Knowledge bindings, and lifecycle.
  - id: definition.nimi.platform.app-ecosystem.local-agent-projection
    kind: definition
    title: LocalAgent consumer projection
    meaning: Nimi Home, Zhiyu, Avatar, and every other formal registered App use the same canonical typed SDK for LocalAgent reference listing, nine durable Conversation operations, six Agent-owned Realtime media operations, two bounded semantic embodiment read operations carrying any independently owned companion state, and the bounded agent configuration family; all receive the same rich sanitized Conversation vocabulary, separate bounded transient Realtime media vocabulary, and closed handle-and-anchor-scoped embodiment projections, while product placement, capture, playback, Avatar rendering, backend motion, expression, pose, look-at, lipsync parameters, audio clock, local playback, package state, window, hit-region, recovery, and diagnostics remain outside those canonical protocols and no consumer creates a separate identity, transcript, reducer, route, LocalAgent execution truth, raw presence tuple, or Avatar control path.
  - id: definition.nimi.platform.app-ecosystem.character-local-agent-model
    kind: definition
    title: Realm Character and Runtime LocalAgent model
    meaning: Realm Character consists of PersonaCharacter and WorldCharacter, each LocalAgent identity comes from a Realm Character Source, and one Character Source may materialize multiple independent Runtime LocalAgents.
  - id: definition.nimi.platform.app-ecosystem.conversation-anchor
    kind: definition
    title: Runtime LocalAgent conversation continuity
    meaning: Runtime owns the durable local conversation state and continuity identity for each LocalAgent conversation across authorized product projections.
  - id: definition.nimi.platform.app-ecosystem.chat-history
    kind: definition
    title: Consumer LocalAgent conversation view
    meaning: Nimi Home, Zhiyu, and authorized Third-party Local Apps may display, replay, or cache a LocalAgent conversation as non-authoritative UI state while Runtime retains durable Conversation and committed event truth and Cognition retains long-term Memory and Knowledge canonical truth.
  - id: definition.nimi.platform.app-ecosystem.chat-derived-memory
    kind: definition
    title: Cognition-owned long-term memory admission
    meaning: Runtime Agent Service owns authorization, committed Conversation and Agent events, same-transaction outbox delivery, AI Job execution, request-context assembly, and Conversation or turn final commit and sends Cognition the complete admitted typed committed-event envelope without a Memory candidate or relevance decision, while Cognition algorithms alone decide semantic Memory admission and Cognition Core alone owns and commits the resulting long-term Memory canonical truth and its binding to Runtime-owned LocalAgent and Conversation anchors.
  - id: definition.nimi.platform.app-ecosystem.manager-agent-bootstrap-projection
    kind: definition
    title: Manager Agent selector bootstrap projection
    meaning: The Manager Agent selector is a Host-carried SDK bootstrap projection for a current protected App session with agent.configure coverage, including an App without agent.local coverage, and presents current-account active Runtime LocalAgents through session-scoped opaque Agent handles for per-Agent manager operations without becoming an AppOperation, grant, durable authorization, raw LocalAgent inventory, or owner truth.
  - id: definition.nimi.platform.app-ecosystem.agent-manager-snapshot
    kind: definition
    title: Bounded Agent manager snapshot
    meaning: The Agent manager snapshot is the bounded typed agent.configure projection used by the canonical AgentCenter Manager Session for current lifecycle, execution, status, emotion, source readiness, and optional current-Conversation context status, addressed only by a current session-scoped opaque Agent handle plus an optional Runtime-issued opaque Conversation handle and excluding raw LocalAgent or account identity, source or Memory corpus, prompt or reasoning material, internal generation, score, provider, model, storage, credential, and reconstructable context detail.
  - id: definition.nimi.platform.app-ecosystem.agent-memory-management
    kind: definition
    title: Agent-scoped Memory management
    meaning: Agent-scoped Memory management is the bounded agent.configure operation family runtime.agent.memory.inspect, runtime.agent.memory.correct, runtime.agent.memory.forget, runtime.agent.memory.switch, and runtime.agent.memory.delete, addressed by a current session-scoped opaque Agent handle and admitted by Runtime while Cognition remains the canonical owner of resulting long-term Memory state; Memory Recall remains optional and Knowledge V1 remains inactive.
  - id: definition.nimi.platform.app-ecosystem.projection-lifecycle
    kind: definition
    title: LocalAgent app access lifecycle
    meaning: Third-party App LocalAgent access is an immediate fact derived from one current Runtime-protected App session, its Effective App Access Snapshot coverage for the exact operation's canonical declaration domain, any operation-required session-scoped opaque Agent reference handle, and the current owner lifecycle; it is neither durable authorization nor access state carried by the handle.
  - id: rule.nimi.platform.app-ecosystem.p-agid-001a
    kind: rule
    title: P-AGID-001 Character-sourced LocalAgent identity
    modality: must
    statement: Runtime creates each LocalAgent as a new independent local identity only from a Realm-issued PersonaCharacter or WorldCharacter Source, with World Source supplying context but never creating identity without a Character Source.
    condition: Whenever a LocalAgent identity is materialized or restored.
    failure: Reject source-free identity, World-only identity, or implicit reuse of another materialization.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-agent-identity
  - id: rule.nimi.platform.app-ecosystem.p-agid-001b
    kind: rule
    title: P-AGID-001 no app-owned LocalAgent identity
    modality: must_not
    statement: An App, Nimi Home host, Avatar, Zhiyu, SDK, or Kit creates, owns, or reconstructs LocalAgent identity from UI state, chat cache, App identity, or projection state.
    condition: Whenever a consumer addresses or presents a LocalAgent.
    failure: Reject the local substitute and resolve the Runtime-owned LocalAgent.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-agent-identity
  - id: rule.nimi.platform.app-ecosystem.p-agid-002a
    kind: rule
    title: P-AGID-002 projection consumer semantics
    modality: must
    statement: Nimi Home, Zhiyu, Avatar, and every other authorized formal registered App consume the same Runtime LocalAgent and canonical typed owner protocols as isolated product projections while Runtime Agent Service remains the sole execution owner and product placement, capture, playback, and rendering roles create no privileged semantic API.
    condition: Whenever LocalAgent output is presented by one or more product consumers.
    failure: Reject a projection that creates another LocalAgent identity, executes a turn independently, or becomes Runtime Conversation or committed-event truth, Cognition long-term Memory or Knowledge truth, activity, emotion, or voice truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.character-local-agent-model
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-agent-projection
  - id: rule.nimi.platform.app-ecosystem.p-agid-002b
    kind: rule
    title: P-AGID-002 no cross-app authorization reuse
    modality: must_not
    statement: Apps share or reuse LocalAgent authorization, account state, App session state, or consumer cache across App boundaries as an access decision.
    condition: Whenever more than one App consumes the same LocalAgent.
    failure: Reject shared authorization and derive access independently from each current Runtime App session.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-agent-projection
  - id: rule.nimi.platform.app-ecosystem.p-agid-003a
    kind: rule
    title: P-AGID-003 session-derived LocalAgent access
    modality: must
    statement: Runtime evaluates each LocalAgent operation from the current authenticated account, registered App subject, fresh protected session and Effective App Access Snapshot, session-scoped opaque Agent reference handle, exact canonical operation, current-account active-Agent membership, owner access policy, and current lifecycle state.
    condition: Whenever an App requests a LocalAgent operation.
    failure: Deny only the protected operation when the account, subject, session, snapshot coverage, handle, current active-Agent membership, operation, owner policy, or lifecycle check is missing, stale, unsupported, or denied.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-agent-projection
  - id: rule.nimi.platform.app-ecosystem.p-agid-003b
    kind: rule
    title: P-AGID-003 no caller-declared authorization truth
    modality: must_not
    statement: An App supplies account, registered subject, session, Effective App Access Snapshot, AppOperationId, AppAccessDomainId, classification, raw LocalAgent identity, or another consumer projection as ordinary request fields that Runtime trusts as access truth.
    condition: Whenever an App requests a LocalAgent operation.
    failure: Reject caller-declared access truth and derive identity, context, coverage, and the stable callable operation from the typed Runtime-protected ingress, canonical operation contract, and owner state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-agent-projection
  - id: rule.nimi.platform.app-ecosystem.p-agid-004a
    kind: rule
    title: P-AGID-004 Runtime conversation continuity
    modality: must
    statement: Every LocalAgent conversation uses Runtime-owned durable local conversation state and continuity across authorized product projections.
    condition: Whenever a LocalAgent conversation is created, resumed, or presented by another consumer.
    failure: Reject continuity that cannot be resolved from Runtime-owned conversation state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.conversation-anchor
  - id: rule.nimi.platform.app-ecosystem.p-agid-004b
    kind: rule
    title: P-AGID-004 no consumer-owned continuity
    modality: must_not
    statement: Nimi Home, Desktop, Zhiyu, Avatar, a Third-party App, SDK, or Kit replaces Runtime conversation continuity with renderer-local state or chat-local cache.
    condition: Whenever conversation continuity is stored or resolved.
    failure: Reject the consumer substitute and resolve Runtime-owned conversation state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.conversation-anchor
  - id: rule.nimi.platform.app-ecosystem.p-agid-005
    kind: rule
    title: P-AGID-005 no parallel identity ontology
    modality: must_not
    statement: A product, App, Runtime surface, SDK, Kit, or host introduces a generic Agent layer, family, persona, projection-reference, or binding entity alongside Realm Character and Runtime LocalAgent.
    condition: Whenever Character, LocalAgent identity, projection, or LocalAgent access is modeled.
    failure: Reject the parallel ontology and use Realm Character, Runtime LocalAgent, consumer projection, and session-derived authorization semantics.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-agent-identity
  - id: rule.nimi.platform.app-ecosystem.p-agid-006a
    kind: rule
    title: P-AGID-006 conversation view owner boundary
    modality: must
    statement: Each authorized product consumer owns only its LocalAgent conversation presentation and non-authoritative UI cache while Runtime owns durable Conversation, committed events, authorization, outbox delivery, AI Jobs, request-context assembly, Conversation or turn final commit, and execution continuity and Cognition owns long-term Memory and Knowledge canonical truth.
    condition: Whenever a LocalAgent conversation is displayed, replayed, cached, or interpreted.
    failure: Reject consumer ownership of Runtime or Cognition truth or direct elevation of UI cache into long-term Memory or Knowledge truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.chat-history
  - id: rule.nimi.platform.app-ecosystem.p-agid-006b
    kind: rule
    title: P-AGID-006 protected conversation consumption
    modality: must_not
    statement: A transcript, history cache, or UI projection becomes Runtime Conversation or committed-event truth, becomes Cognition long-term Memory or Knowledge truth, or is exposed to another App without current Runtime authorization.
    condition: Whenever cached conversation content is interpreted as Runtime truth or exposed externally.
    failure: Deny the write or read until Runtime-owned admission and the current App session authorization succeed.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.chat-derived-memory
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.chat-history
  - id: rule.nimi.platform.app-ecosystem.p-agid-007a
    kind: rule
    title: P-AGID-007 Runtime event delivery and Cognition memory admission
    modality: must
    statement: Runtime Agent Service alone authorizes and commits LocalAgent Conversation and Agent events, writes and delivers the complete typed committed-event envelope without a Memory candidate, relevance selection, or admission decision, owns AI Job execution and request-context assembly, and commits the Conversation or turn result, while Cognition algorithms alone decide semantic Memory admission and Cognition Core alone owns and commits the resulting long-term Memory canonical truth bound to Runtime-owned LocalAgent and Conversation anchors.
    condition: Whenever a committed LocalAgent event may become long-term Memory.
    failure: Reject an uncommitted or unauthorized Runtime event envelope, Runtime-authored Memory candidate or admission decision, or long-term Memory commit outside Cognition Core, and never fabricate success when either owner rejects or is unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.chat-derived-memory
  - id: rule.nimi.platform.app-ecosystem.p-agid-007b
    kind: rule
    title: P-AGID-007 no passive memory creation
    modality: must_not
    statement: A consumer background job, passive cache, chat replay, UI state, or Runtime-only write automatically creates Cognition long-term Memory canonical truth.
    condition: Whenever conversation-derived Memory creation is attempted.
    failure: Deny creation until Runtime has delivered an authorized committed-event envelope and Cognition algorithms have produced a valid plan that Cognition Core atomically commits.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.chat-derived-memory
  - id: rule.nimi.platform.app-ecosystem.p-agid-008a
    kind: rule
    title: P-AGID-008 LocalAgent access follows session lifecycle
    modality: must
    statement: App exit or uninstall, account switch or exit, declaration generation change, Runtime restart, and App session termination invalidate the affected session and Effective App Access Snapshot before another LocalAgent operation while leaving the registered subject stable unless its owner lifecycle ends; a source-generation change also invalidates the session and snapshot and requires Desktop to re-evaluate the objective security-relevant executable, entrypoint, and process-start facts that identify the exact Host.
    condition: Whenever App, declaration, account, Runtime, or session lifecycle changes.
    failure: Invalidate the affected session and snapshot before another LocalAgent operation without registration deletion or subject rotation; account, declaration, Runtime, or session invalidation alone does not require Host termination or restart, while Desktop owns Host lifecycle when source re-evaluation finds an objective exact-Host input mismatch.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.projection-lifecycle
  - id: rule.nimi.platform.app-ecosystem.p-agid-008b
    kind: rule
    title: P-AGID-008 no stale LocalAgent access
    modality: must_not
    statement: A stale consumer projection, cached snapshot, ended session, expired Agent reference handle, or previous account or declaration generation remains usable as LocalAgent access.
    condition: Whenever LocalAgent access is resolved.
    failure: Fail closed and require a current Runtime session-derived decision.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.projection-lifecycle
  - id: rule.nimi.platform.app-ecosystem.p-agid-009a
    kind: rule
    title: P-AGID-009 current-account Agent reference projection
    modality: must
    statement: runtime.agent.reference.list returns every current-account active Runtime LocalAgent as exactly {agentHandle, displayName, avatarUrl}; agentHandle is session-scoped and opaque, avatarUrl is nullable and when present is a safe-display URL containing no bearer, token, private signature, credential-like query, internal endpoint, or local sensitive path, and the projection is the resource-reachability entry for admitted agent.local Conversation and Agent Realtime operations and, when separately covered, per-Agent agent.configure operations rather than an access scope or exposure of internal Agent inventory.
    condition: Whenever an App with current agent.local snapshot coverage invokes runtime.agent.reference.list.
    failure: Deny the operation when current account, snapshot coverage, or owner projection is unavailable and return no raw localAgentId, source identity, account identity, credential, configuration, Memory, Knowledge, or internal inventory field.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-agent-projection
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.projection-lifecycle
  - id: rule.nimi.platform.app-ecosystem.p-agid-009b
    kind: rule
    title: P-AGID-009 opaque Agent handle is not authority
    modality: must_not
    statement: A session-scoped opaque Agent reference handle is persisted as durable App authorization, reused across sessions or accounts, treated as a bearer or grant, or accepted without per-call current-account active-Agent and owner-policy revalidation.
    condition: Whenever an App supplies an Agent reference handle to an admitted agent.local or per-Agent agent.configure operation.
    failure: Reject stale, unknown, cross-session, cross-account, inactive, or no-longer-reachable handles before owner-domain execution.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.projection-lifecycle
  - id: rule.nimi.platform.app-ecosystem.p-agid-010a
    kind: rule
    title: P-AGID-010 session-derived agent configuration access
    modality: must
    statement: Each agent configuration operation is admitted only from the current protected App session with Effective App Access Snapshot coverage for agent.configure; shared AIConfig get, compare-and-swap overwrite, and bounded options list resolve the account-scoped singular Runtime LocalAgent subsystem owner without an Agent handle, Get and Overwrite project the same fixed Runtime-owned LocalAgent capability-role participation rows independently of configured intent while Options does not, and the bounded manager snapshot plus per-Agent autonomy, presentation, or Memory operations present the session-scoped opaque Agent reference handle with per-call current-account active-Agent and owner-policy revalidation, preserve independent autonomy and presentation revisions through typed conflict results, keep Cognition as long-term Memory canonical owner, and expose identical operation, availability, result, and error semantics to Desktop and every equally covered protected App.
    condition: Whenever an App invokes an agent configuration operation.
    failure: Fail closed without owner mutation when the session or snapshot coverage is missing or stale, or when a per-Agent operation lacks its required current handle or independent revision or encounters a typed conflict.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.agent-configuration-operation-family
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.projection-lifecycle
  - id: rule.nimi.platform.app-ecosystem.p-agid-010b
    kind: rule
    title: P-AGID-010 no app-owned AI or configuration truth
    modality: must_not
    statement: An App agent configuration surface carries a secondary access workflow or decision state, addresses the shared LocalAgent AIConfig by Agent handle, creates a per-Agent AIConfig or per-Agent Cloud override, merges AIConfig, derives or mutates LocalAgent capability participation from configured intents, persists a route, model, Connector, provider, option catalog, participation catalog, effective posture, or long-term Memory or Knowledge truth outside the canonical owner records and Runtime projections, stores Provider Credentials or endpoints, invokes generic Connector management, or infers readiness, Quota, Budget, Rate Limit, or fallback; submitting route-only Local intent or explicit user-selected Cloud Connector and target references through the admitted account-scoped singular shared LocalAgent owner compare-and-swap operation is not App-owned truth.
    condition: Whenever an App presents or mutates agent configuration.
    failure: Reject the carrier, cross-owner mutation, or invented truth and keep Runtime owner state unchanged.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.agent-configuration-operation-family
  - id: rule.nimi.platform.app-ecosystem.p-agid-011a
    kind: rule
    title: P-AGID-011 protected multimodal LocalAgent operation boundary
    modality: must
    statement: A formal App with current agent.local coverage uses exactly runtime.agent.reference.list, runtime.agent.conversation.open, runtime.agent.conversation.turn.send, runtime.agent.conversation.turn.interrupt, runtime.agent.conversation.events.subscribe, runtime.agent.conversation.snapshot.get, runtime.agent.conversation.attachment.upload, runtime.agent.conversation.artifact.read, runtime.agent.conversation.voice.transcribe, runtime.agent.conversation.voice.render, runtime.agent.realtime.open, runtime.agent.realtime.input.append, runtime.agent.realtime.events.subscribe, runtime.agent.realtime.status.get, runtime.agent.realtime.output.interrupt, runtime.agent.realtime.close, runtime.agent.embodiment.snapshot.get, and runtime.agent.embodiment.events.subscribe through the same standard typed SDK and opaque Agent-handle seam; the Conversation operations project the canonical rich sanitized live and committed union, recorded transcription, bounded on-demand final-voice synthesis for a committed assistant message, the immutable final sidecar, and existing user request or interrupt intent, the separate Realtime operations project only bounded transient user media, speech or transcript status, outputTrack, audio, pressure, health, and terminal state, and the embodiment operations project only ordered bounded activity, emotion, semantic posture, presentation timing, independently owned companion state, provenance, and opaque turn or voice correlation. Runtime revalidates the exact operation, current session, account, active Agent handle, and where required exact Conversation anchor per call; the App supplies no Agent-private context, voice selection, tool result, route, backend command, or response control, native audio appears only on Realtime, companion request and cancel remain canonical Conversation send and interrupt intent rather than duplicate operations, raw replay is not public, and no protocol exposes raw LocalAgent or account identity, private carrier envelopes, raw score, prompt or reasoning, provider, model, credential, Memory, Knowledge, execution proof, renderer motion, expression, pose, look-at, lipsync parameters, decoder or audio clock, package or backend state, diagnostics, generic Runtime forwarding, or a privileged formal-App variant.
    condition: Whenever a formal App invokes or consumes agent.local after the Realtime hard cut.
    failure: Reject an operation outside the eighteen-row agent.local family, a stale or unauthorized handle or continuity fence, a caller-authored authority, owner-control, voice selection, backend command, or execution field, a private or degraded sideband, duplicate companion mutation, raw replay, an unknown public variant, native audio outside Realtime, or a generic forwarding or artifact path.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-agent-projection
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
  - id: rule.nimi.platform.app-ecosystem.p-agid-012a
    kind: rule
    title: P-AGID-012 Manager Agent selector bootstrap
    modality: must
    statement: The verified Host provides every agent.configure-covered App, including an App without agent.local coverage, one canonical Manager Agent selector during SDK bootstrap from the current Runtime session and active-Agent projection; the Host may present and carry the selected session-scoped opaque Agent handle but does not create an AppOperation, grant, access decision, durable selection authority, raw LocalAgent identity, or owner truth, and session or account invalidation requires a fresh bootstrap and selection.
    condition: Whenever a Host bootstraps a formal App that may invoke per-Agent agent.configure operations.
    failure: Withhold only the Manager Agent selector and its dependent per-Agent manager operations when the current session, agent.configure coverage, or active-Agent projection is unavailable, and reject stale, cross-session, cross-account, or Host-authored authority without widening agent.local or creating a new AppAccess domain.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.manager-agent-bootstrap-projection
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.projection-lifecycle
  - id: rule.nimi.platform.app-ecosystem.p-agid-013a
    kind: rule
    title: P-AGID-013 protected Agent Memory management
    modality: must
    statement: A formal App invokes runtime.agent.memory.inspect, runtime.agent.memory.correct, runtime.agent.memory.forget, runtime.agent.memory.switch, and runtime.agent.memory.delete only under current agent.configure coverage with the Manager Agent bootstrap's current session-scoped opaque Agent handle; Runtime revalidates current-account active-Agent membership, owner policy, lifecycle, and exact operation on every call, retains authorization, committed events, outbox delivery, AI Job execution, request-context assembly, and Conversation or turn final commit, and projects only the typed applicable-owner result, with Runtime alone committing the Agent-scoped enabled switch and Cognition remaining owner of inspectable long-term Memory canonical state and alone committing correction, forget, and delete-all effects.
    condition: Whenever a formal App inspects or changes Agent-scoped Memory through the canonical manager surface.
    failure: Deny the exact action before owner mutation on a missing, stale, unknown, cross-session, cross-account, inactive, or no-longer-reachable handle, missing coverage, applicable Runtime or Cognition owner rejection, or unavailable required owner commit without falling back, activating Knowledge V1, or fabricating Memory success.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.agent-configuration-operation-family
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.agent-memory-management
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.projection-lifecycle
  - id: rule.nimi.platform.app-ecosystem.p-agid-013b
    kind: rule
    title: P-AGID-013 no App-owned Memory truth
    modality: must_not
    statement: An App, Host, SDK, UI cache, Manager Agent selection, shared LocalAgent AIConfig, per-Agent shadow configuration, or Cloud override becomes long-term Memory or Knowledge truth, treats a session-scoped Agent handle as a grant, bypasses Runtime admission or Cognition ownership, makes optional Memory Recall a prerequisite, or exposes Knowledge V1 as active.
    condition: Whenever Agent-scoped Memory management is composed, projected, cached, or consumed.
    failure: Reject the shadow truth, authority expansion, AIConfig coupling, or unsupported capability and preserve the Runtime and Cognition owner records unchanged.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.agent-memory-management
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.chat-derived-memory
  - id: rule.nimi.platform.app-ecosystem.p-agid-014a
    kind: rule
    title: P-AGID-014 bounded AgentCenter manager snapshot
    modality: must
    statement: A formal App invokes runtime.agent.manager.snapshot.get only under current agent.configure coverage with the Manager Agent bootstrap's current session-scoped opaque Agent handle and, when requesting current-Conversation diagnostics, a Runtime-issued opaque Conversation handle; Runtime revalidates the session, exact operation, current-account active-Agent membership, owner policy, lifecycle, and optional Conversation binding on every call and returns only the bounded Agent manager snapshot, while Desktop first-party status, ownership, bundling, incubation, or rollout position creates no richer inspect operation, hidden bridge, raw identity sideband, availability class, result, or error path.
    condition: Whenever a formal App or Desktop loads AgentCenter Overview, Cognition, Behavior, or Advanced or Diagnostics owner state.
    failure: Deny before projection on missing coverage, stale or cross-session handles, mismatched Conversation, or unavailable owner state and reject raw identity, corpus, prompt, reasoning, score, generation, provider, model, storage, credential, reconstructable context, Desktop-only inspect, or fabricated availability.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.agent-configuration-operation-family
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.agent-manager-snapshot
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.projection-lifecycle
  - id: definition.nimi.platform.app-ecosystem.app-permission
    kind: definition
    lifecycle: removed
    title: Retired App permission
    reason: Removed because Third-party App access now comes only from the registered declaration and fresh Effective App Access Snapshot, with no per-capability permission, request, approval, revocation, or settings lifecycle.
  - id: definition.nimi.platform.app-ecosystem.permission-grant
    kind: definition
    lifecycle: removed
    title: Retired permission grant
    reason: Removed because App declaration coverage is derived into a session snapshot and never materializes a durable PermissionGrant or user decision state.
  - id: definition.nimi.platform.app-ecosystem.agents-configure-operation-family
    kind: definition
    lifecycle: removed
    title: Retired agents.configure operation family
    reason: Removed because the initial App operation contract contains no shared Runtime LocalAgent AIConfig, autonomy, or presentation operations and introduces no per-Agent permission family.
  - id: definition.nimi.platform.app-ecosystem.agent-configuration-operation-family
    kind: definition
    title: App agent configuration operation family
    meaning: The agent configuration operation family is the bounded agent.configure App operation set runtime.agent.manager.snapshot.get, runtime.agent.ai-config.get, runtime.agent.ai-config.overwrite, runtime.agent.ai-config.options.list, runtime.agent.autonomy.snapshot.get, runtime.agent.autonomy.update, runtime.agent.presentation.snapshot.get, runtime.agent.presentation.commit, runtime.agent.memory.inspect, runtime.agent.memory.correct, runtime.agent.memory.forget, runtime.agent.memory.switch, and runtime.agent.memory.delete; the shared account-scoped Runtime LocalAgent subsystem AIConfig operations resolve the singular subsystem owner without an Agent handle and expose the canonical record, compare-and-swap mutation, lightweight effective selected-resource projection, one bounded current machine-selected Local projection, bounded safe Cloud Connector and target options, shared-owner preset voice options, or bounded bindable custom VoiceAsset options derived from the current session account-plus-App owner through canonical ListVoiceAssets truth, and for Get and Overwrite one fixed Runtime-owned LocalAgent capability-role participation projection independent of configured intent, while custom VoiceAsset selection commits only through the separately handle-addressed presentation operation and neither the shared AIConfig nor agent.configure creates, deletes, re-owns, or crosses an App boundary for a VoiceAsset; the bounded manager snapshot plus autonomy, presentation, and Memory operations are addressed by the session-scoped opaque Agent reference handle, preserve only their owner-specific concurrency and typed conflict semantics, and keep Cognition as long-term Memory canonical owner, all without a secondary access state, raw identity sideband, first-party inspect path, per-Agent AIConfig or per-Agent Cloud override, App-owned shadow carrier, Connector credential, endpoint, generic Connector operation, or second participation catalog.
    relations:
      - type: supersedes
        target: definition.nimi.platform.app-ecosystem.agents-configure-operation-family
  - id: definition.nimi.platform.app-ecosystem.ai-text-generate-operation-family
    kind: definition
    lifecycle: removed
    title: Retired ai.text.generate permission family
    reason: Removed because runtime.ai.text-candidate.generate is one exact runtime.consume App operation in the single canonical App operation contract rather than a separate permission or operation-family catalog.
  - id: definition.nimi.platform.app-ecosystem.app-authority-class
    kind: definition
    lifecycle: removed
    title: Retired App action authority classes
    reason: Removed because the supported App surface now uses only the closed Base and AppAccess operation mapping while App-owned native behavior remains outside Nimi access semantics.
  - id: definition.nimi.platform.app-ecosystem.registered-app-subject
    kind: definition
    title: Registered App subject
    meaning: A registered App subject is the stable Runtime-derived formal protected App security subject for one local OS user and one canonical App registration, including separately admitted installed, immutable local-import, Developer-Mode, bundled, and platform App sources, kept distinct from display identity, provenance, current account, declaration and source generations, Host-control principal, Desktop launch witness, native profile or trust class, process, protected session, and Effective App Access Snapshot.
    relations:
      - type: supersedes
        target: definition.nimi.platform.app-ecosystem.local-app-principal
  - id: definition.nimi.platform.app-ecosystem.app-access-domain
    kind: definition
    title: App access domain
    meaning: The closed AppAccess domain set is exactly realm.data, runtime.consume, agent.local, and agent.configure; a declaration names domains rather than permissions, grants, operations, resources, or owner-internal policy, and Base operations require no declared domain.
  - id: definition.nimi.platform.app-ecosystem.current-user-display-projection
    kind: definition
    title: Current User Display Projection
    meaning: The App-facing Current User Display Projection is a Host-carried SDK bootstrap projection outside the closed App Operation Contract and AppAccess domains, contains exactly handle, displayName, and nullable avatarUrl from the current Account owner projection, requires any present avatarUrl to be a safe-display URL containing no bearer, token, private signature, credential-like query, internal endpoint, or local sensitive path, and carries no internal account identity, token, session, generation, policy, credential, or authorization material.
  - id: definition.nimi.platform.app-ecosystem.local-app-principal
    kind: definition
    lifecycle: removed
    title: Retired local App principal term
    reason: Removed because registered-app-subject is the sole current stable Runtime-derived formal protected App security-subject definition and no principal alias or parallel identity remains.
  - id: definition.nimi.platform.app-ecosystem.local-app-provenance
    kind: definition
    title: Local app provenance
    meaning: Local app provenance is the closed verified, user_imported, or local_development Runtime-derived record classification, with local_development as the sole mutable third-party class and bundled components excluded.
  - id: definition.nimi.platform.app-ecosystem.protected-local-transport
    kind: definition
    title: Protected-local transport
    meaning: Protected-local transport is the per-user Runtime boundary that binds the connected native peer to Desktop's current exact Host launch witness and then creates a fresh protected session for Runtime-owned App, account, snapshot, and operation admission; the peer check proves only the exact Desktop-launched Host connection and is not binary or mutable-project integrity, OS sandboxing, complete process attestation, machine identity, or long-lived authorization lineage.
  - id: definition.nimi.platform.app-ecosystem.executable-trust-set
    kind: definition
    lifecycle: removed
    title: Executable trust set
    reason: Removed because native admission now validates the current operating-system peer directly and no product-level executable trust-set record remains.
  - id: definition.nimi.platform.app-ecosystem.macos-protected-admission
    kind: definition
    title: macOS per-user protected admission
    meaning: macOS D2 protected App ingress uses a per-user non-elevated local endpoint and a thin operating-system peer adapter that binds the connected peer to Desktop's current exact Host launch; exact IPC, peer-query, and process-observation APIs remain implementation details, root-owned installation, LaunchDaemon, system account, sudo flow, project payload integrity, and complete attestation are not App access admission primitives, and independently admitted signed production installation, service, update, and credential-custody topology remains outside this boundary.
  - id: rule.nimi.platform.app-ecosystem.p-appacc-001
    kind: rule
    title: P-APPACC-001 declaration-derived App access
    modality: must
    statement: Registration records one registered App subject and the exact canonical source and declaration generations for every formal protected App, the Desktop Host Control Plane verifies and launches the exact Host, and Runtime derives access only from that current registration and declaration into a fresh protected session without a per-capability grant, request, approval, denial, revocation, prompt, settings state, built-in App-id domain table, profile-derived declaration, synthetic subject, or self-declared first-party coverage; a bundled or platform release identity supplies canonical registration and declaration input but uses the same registration, generation, session, snapshot, operation, result, and error path as an ordinary protected App, while Host-control principals, native profiles, trust classes, transport allowlists, and process witnesses remain non-authorizing mechanics.
    condition: Whenever a formal protected App registration, launch, or access session is created or interpreted.
    failure: Deny protected session creation when registration, generation, declaration, exact Host launch, or current account context is unavailable or mismatched without deleting registration or rotating the stable subject; account, declaration, or Runtime-context mismatch alone does not terminate the App, while the lifecycle owner controls Host termination only when source re-evaluation finds an objective security-relevant executable, entrypoint, or process-start mismatch for the exact Host, and no first-party profile or fallback may manufacture product coverage.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-access-domain
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registered-app-subject
  - id: rule.nimi.platform.app-ecosystem.p-appacc-002
    kind: rule
    title: P-APPACC-002 closed declaration domains
    modality: must
    statement: A formal protected App declaration, including a bundled or platform App declaration produced from its canonical registered release input, may retain unknown items as raw authoring and diagnostic input, but its activated semantic set contains only the closed supported domain values realm.data, runtime.consume, agent.local, and agent.configure; an unknown domain remains inert for that exact declaration generation, later Runtime support does not activate it until a new source or declaration generation is registered and a fresh protected session is created, and no App id, trust class, native profile, transport method, process witness, or first-party self-declaration adds or enlarges domains.
    condition: Whenever a declaration is registered, changed, or resolved into App access.
    failure: Exclude an unknown or unsupported domain from the Effective App Access Snapshot and deny operations requiring it without creating a grant, approval flow, compatibility alias, or fallback.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-access-domain
  - id: rule.nimi.platform.app-ecosystem.p-appacc-003
    kind: rule
    title: P-APPACC-003 minimal current-user display projection
    modality: must
    statement: The App-facing current-user result is a Host-carried SDK bootstrap projection from the Account owner's current-account substrate, contains exactly handle, displayName, and nullable avatarUrl under the safe-display constraint, and creates no AppOperation, AppAccess domain, App-owned account cache, service, credential, raw Account response, or authorization projection.
    condition: Whenever current-user display data is returned through a supported App surface.
    failure: On a display-source or display-carrier failure, return typed current-user unavailable and withhold only this projection without invalidating an otherwise-current protected session or other supported App operation; only an Account-owner account or context generation change follows the owning session-invalidation rule, and no additional account, session, generation, token, credential, or policy field is exposed.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.current-user-display-projection
