  - id: rule.nimi.platform.app-ecosystem.p-napp-035f
    kind: rule
    title: P-NAPP-035 development host custody and disclosure
    modality: must
    statement: Controlled-account development remains Runtime-mediated and receives no token, bearer, portable authority, persistent managed logon, or boot autostart; UI discloses that Nimi App access does not constrain the ordinary OS rights of native code, renderer receives no raw account, credential, partition, internal peer proof, or generic protected proxy, and exact Electron or Tauri App-owned host commands remain outside Nimi protected-operation semantics.
    condition: Whenever a local-development host is launched or its authority is disclosed.
    failure: Deny secret, peer-proof, or generic-proxy exposure and present the applicable OS-rights disclosure without terminating the App merely because Nimi access is unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.protected-local-transport
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registered-app-subject
  - id: rule.nimi.platform.app-ecosystem.p-napp-036a
    kind: rule
    title: P-NAPP-036 closed local provenance
    modality: must
    statement: The local trust-class table closes third-party provenance to verified, user_imported, and local_development with its transition seams and bundled-component exclusions; provenance is Runtime-derived record state, cannot be selected or upgraded by a request, and does not add or remove declared App access.
    condition: Whenever local app provenance is assigned, changed, or consumed.
    failure: Reject an unknown, caller-selected, access-bearing, or invalidly transitioned provenance class.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: rule.nimi.platform.app-ecosystem.p-napp-036b
    kind: rule
    title: P-NAPP-036 subject and immutable lineage boundary
    modality: must
    statement: Runtime derives one random non-reused registered App subject for one local OS user and one canonical App registration; immutable lineage, attestation references, execution profile, and artifact digests remain only immutable-package facts, while mutable local development carries no project-payload fingerprint or integrity claim and native peer admission binds only the current exact Desktop Host launch; provenance transition never creates App access, and shipped Zhiyu remains bundled while its integration build uses an isolated development subject.
    condition: Whenever a registered App subject, mutable project, immutable lineage, provenance transition, or bundled integration identity is handled.
    failure: Reject reused or caller-derived subject identity, immutable-package facts used as mutable-project attestation, access inferred from provenance, or bundled and development subject conflation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registered-app-subject
  - id: rule.nimi.platform.app-ecosystem.p-napp-037a
    kind: rule
    title: P-NAPP-037 Windows and macOS use one security architecture
    modality: must
    statement: Windows and macOS D2 protected local-development App ingress use the same per-user, non-elevated registration, exact Desktop Host launch, fresh Runtime session, snapshot, and exact operation architecture with only a thin native peer and local IPC adapter differing by platform; the common registration, declaration, session, snapshot, and operation semantics also govern independently admitted production or deployment source topologies without requiring them to share D2 service, installer, update, custody, or IPC topology, and Linux remains deferred.
    condition: Whenever platform architecture or support boundaries are described.
    failure: Reject a second D2 App-ingress security architecture, privileged service topology required for local development, narrowing of independently admitted production or deployment topology, or one platform blocking work on the other.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.macos-protected-admission
  - id: rule.nimi.platform.app-ecosystem.p-napp-037b
    kind: rule
    title: P-NAPP-037 macOS per-user native peer boundary
    modality: must
    statement: macOS D2 protected App ingress uses a current-user non-elevated local endpoint and one thin operating-system peer adapter that binds the connected peer to Desktop's current exact Host launch before Runtime creates a fresh App session and snapshot; exact IPC, peer-query, and process-observation APIs remain implementation details, root installation, LaunchDaemon, sudo flow, system-account isolation, mutable-project integrity, and complete attestation do not create App access, and separately admitted signed production installation, service, update, credential-custody, signing, and notarization topology remains unchanged and outside Runtime App access semantics.
    condition: Whenever macOS D2 protected-local admission is implemented or evaluated.
    failure: Deny protected session creation when the user-scoped endpoint, peer-to-launch binding, registration, or Runtime context fails without treating distribution signing posture as App access authority.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.macos-protected-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.protected-local-transport
  - id: rule.nimi.platform.app-ecosystem.p-napp-037ab
    kind: rule
    title: P-NAPP-037 macOS failures remain exact and fail closed
    modality: must
    statement: Failed macOS native peer admission, Runtime custody, session creation, snapshot derivation, or owner admission returns the exact owning unavailable, untrusted, repair-required, unsupported, or access failure without changing registration, exposing secrets, terminating the App, or reporting protected success.
    condition: Whenever macOS protected-local posture is projected.
    failure: Return the exact owning failure and deny protected access.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.macos-protected-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.protected-local-transport
  - id: definition.nimi.platform.app-ecosystem.catalog-admission
    kind: definition
    title: Verified app catalog admission
    meaning: Verified app catalog admission is Platform-owned immutable release discovery and review truth for the closed package-kind set and is distinct from Runtime-owned canonical registration records, Registered App Subjects, current source and declaration generations, protected sessions, Effective App Access Snapshots, and App access admission, from Desktop-owned exact Host launch and process supervision, and from separately owned runnable lifecycle truth.
  - id: definition.nimi.platform.app-ecosystem.registry-row
    kind: definition
    title: Verified app registry row
    meaning: A verified app registry row is the closed Platform schema joining canonical App identity, publisher and trust references, release and update references, an optional non-binding AIProfile recommendation, CapabilityContract identities and contract-scoped required standardized features, the App access declaration for transparency, Runtime registration mode, storage policy, health projection, visibility, and admission status; marketplace listing and review contain no Runtime access, local compute pack, Runtime-private source, implementation, binding, or machine-selection authority.
  - id: definition.nimi.platform.app-ecosystem.release-descriptor
    kind: definition
    title: Immutable third-party release descriptor
    meaning: An immutable Third-party App release descriptor is canonical Platform-owned versioned package-discovery and review truth whose closed publisher, source, artifact, assurance, Runtime, App access declaration, storage, update, rollback-review, decision, and support fields resolve before admission without becoming Runtime access semantics.
  - id: definition.nimi.platform.app-ecosystem.health-repair-projection
    kind: definition
    title: App health and repair projection
    meaning: App health and repair projection is exactly unavailable, setup-required, needs-confirmation, in-progress, failed, unsupported, repair-required, or stale-projection as distinct fail-closed posture.
  - id: definition.nimi.platform.app-ecosystem.immutable-package-seam
    kind: definition
    title: Immutable package integration seam
    meaning: The immutable package integration seam projects only opaque immutable_lineage_id, provenance_attestation_refs, provenance_revision, execution_profile_ref, host_executable_digest, and payload_root_digest into Runtime registration and access truth while the package lifecycle owner separately retains installed release, lifecycle job, progress, rollback, and readiness state.
  - id: definition.nimi.platform.app-ecosystem.app-local-lifecycle-projection
    kind: definition
    title: App local lifecycle projection
    meaning: An App local lifecycle projection keeps source_class as verified, user_imported, or local_development, package_state as not-installed, installing, installed, updating, repairing, uninstalling, failed, or not-applicable, update_state as not-applicable, unknown, up-to-date, update-available, or check-failed, run_state as stopped, launching, running, stopping, or crashed, the existing negative health_repair_projection, and current typed App access availability as independent axes that never collapse into one ready or normal state.
  - id: definition.nimi.platform.app-ecosystem.app-lifecycle-job
    kind: definition
    title: App package lifecycle job
    meaning: An App package lifecycle job contains job_id, install, update, repair, or uninstall kind, verified or user_imported source class, an exact candidate or release reference, queued, downloading, reading-local, verifying, verifying-installed, acquiring-missing, staging, committing, stopping-host, removing-package, unregistering, completed, failed, or canceled phase, bytes_completed, nullable bytes_total, bytes, steps, or indeterminate progress basis, started_at, nullable completed_at, nullable terminal result and typed reason, and cancelable, with local_development excluded from package jobs.
  - id: definition.nimi.platform.app-ecosystem.publisher-identity
    kind: definition
    title: Admitted publisher identity
    meaning: Admitted publisher identity is reviewer-confirmed descriptor truth anchored by a GitHub user or organization namespace, a closed assurance value, and assurance-required verified domain and KYC references.
  - id: definition.nimi.platform.app-ecosystem.storage-posture
    kind: definition
    title: Third-party app storage posture
    meaning: Third-party app storage posture is exactly nimi-mediated-default with Runtime-derived collision-proof private JSON and binary asset namespaces partitioned by current account plus Registered App Subject, or app-owned-os-storage with explicit OS-path disclosure.
  - id: definition.nimi.platform.app-ecosystem.review-decision
    kind: definition
    title: Terminal app admission review decision
    meaning: A terminal app admission review decision is exactly approved, revision-requested, rejected, or kill-switched and records final security disposition without redefining the owning review state machine or adjudicator policy.
  - id: definition.nimi.platform.app-ecosystem.support-manifest
    kind: definition
    title: Admitted app support manifest
    meaning: An admitted app support manifest is the canonical descriptor block containing typed diagnostics fields, redaction rules, user-visible issue categories, escalation route, kill-switch visibility, and recovery instructions.
  - id: definition.nimi.platform.app-ecosystem.catalog-admission-track
    kind: definition
    title: Verified catalog admission track
    meaning: A verified catalog admission track classifies catalog review only, admits ordinary-release-proof as the sole third-party descriptor track, and never represents local development, user import, CI fixture posture, or local runnable truth.
  - id: rule.nimi.platform.app-ecosystem.p-napp-001a
    kind: rule
    title: P-NAPP-001 catalog authority and package kind
    modality: must
    statement: The current Third-party App product scope admits approved ordinary-visible catalog releases through verified installation, explicitly selected immutable local packages through user_imported installation, and mutable projects through local_development; catalog or artifact presence alone creates no registration, subject, local record, declaration generation, Desktop launch, protected session, Effective App Access Snapshot, or runnable truth, and only a successful provenance-specific lifecycle commit may create or update the corresponding local record.
    condition: Whenever current App scope, package admission, or local runnable posture is resolved.
    failure: Reject another source class, bypassed provenance-specific admission, or local authority inferred before the successful lifecycle commit.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: rule.nimi.platform.app-ecosystem.p-napp-001b
    kind: rule
    title: P-NAPP-001 shared content packs are not installable apps
    modality: must_not
    statement: A shared Nimi Content Pack is admitted as an installable product unit.
    condition: Whenever an installable package kind is evaluated.
    failure: Deny admission as an installable app.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
  - id: rule.nimi.platform.app-ecosystem.p-napp-002a
    kind: rule
    title: P-NAPP-002 complete registry row schema
    modality: must
    statement: Every verified registry row contains app_id, display_label, publisher, trust_tier_ref, package_kind, package_signature_policy_ref, update_channel_ref, optional ai_profile_recommendation_ref, capability_contract_refs, required_standardized_feature_refs, runtime_registration_mode, app_access_declaration, health_repair_projection, ordinary_visibility, release_descriptor_ref, install_storage_policy_ref, and admission_status with every present reference resolving to its admitted owner row; Runtime-local compute-pack references, access snapshots, and selection hints are outside the registry row.
    condition: Whenever a verified registry row is admitted or consumed.
    failure: Fail admission closed when a field or reference is missing or unresolved.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registry-row
  - id: rule.nimi.platform.app-ecosystem.p-napp-002b
    kind: rule
    title: P-NAPP-002 closed registry field semantics
    modality: must
    statement: A registry row uses nimi-app, app-managed registration, one closed App access declaration containing zero or more of realm.data, runtime.consume, agent.local, and agent.configure, ordinary_visibility from ordinary-visible, hidden-internal, developer-only, or not-admitted-visible, and admission_status from admitted, gated_by_avatar_master_gate, deferred, or retired; registry or review posture never creates Runtime access, and an empty declaration remains valid.
    condition: Whenever registry values or visibility are evaluated.
    failure: Reject an unknown registry value or improperly visible row, keep an unknown declaration domain inert for its exact generation, and never infer Runtime access from listing or review posture.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-access-domain
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registry-row
  - id: rule.nimi.platform.app-ecosystem.p-napp-003
    kind: rule
    title: P-NAPP-003 AIProfile recommendation is portable and non-binding
    modality: must
    statement: An optional ai_profile_recommendation_ref resolves to an admitted factory AIProfile alias or profileId and remains a visible portable recommendation that produces non-committing editor prefill only if the user later invokes explicit Apply Profile to AIConfig; a registry row contains no embedded provider, Connector, engine, model, or current-environment resource identifier constant, and the recommendation never selects or commits an AIConfig route, Loadout reference, machine preference, binding, or Connector reference.
    condition: Whenever AIProfile recommendation metadata is admitted or presented.
    failure: Reject an unresolved reference, embedded vendor or resource identifier, automatic Apply or Save, or recommendation presented as committed configuration, live selection, or binding.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registry-row
  - id: rule.nimi.platform.app-ecosystem.p-napp-004
    kind: rule
    title: P-NAPP-004 trust-tier reference boundary
    modality: must
    statement: trust_tier_ref is exactly nimi-first-party, nimi-verified-partner, or nimi-community unless explicit authority admits an extension, remains distinct from verified, user_imported, and local_development provenance, and never adds, removes, widens, or narrows declared Runtime App access.
    condition: Whenever trust tier, provenance, declaration, or App access is resolved.
    failure: Reject an unknown tier or any tier, provenance, declaration, or access conflation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-access-domain
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: rule.nimi.platform.app-ecosystem.p-napp-005a
    kind: rule
    title: P-NAPP-005 requirement reference closure
    modality: must
    statement: App capability declarations resolve only to admitted CapabilityContract identities and contract-scoped required standardized features for the one App AIConfig owner; App admission and manifests declare no module or feature AIConfig owner, Loadout, local model, ModelAsset binding, machine selection, Driver, engine, local compute pack, or Runtime-private pack or source as an admission input, execution truth, or non-binding hint.
    condition: Whenever app capability or compute requirements are admitted.
    failure: Fail admission on an unknown contract or feature and reject every App-local or engine-specific configuration authority.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registry-row
  - id: rule.nimi.platform.app-ecosystem.p-napp-005b
    kind: rule
    title: P-NAPP-005 no activation or secret material
    modality: must_not
    statement: A registry row, manifest, or app-local specification carries Runtime activation consumer_id as app requirement ownership or declares local paths, selected source records, materialization evidence, route bindings, provider health, scheduler state, or connector secrets.
    condition: Whenever app requirement metadata is authored or consumed.
    failure: Reject the authority-crossing or secret-bearing metadata.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registry-row
  - id: rule.nimi.platform.app-ecosystem.p-napp-006
    kind: rule
    title: P-NAPP-006 Runtime registration ownership
    modality: must
    statement: Runtime exclusively owns canonical registration-record mutation, Registered App Subject allocation and persistence, current source and declaration generations, protected-session truth, and App access admission; Desktop owns the registration workflow, source and declaration evaluation, exact Host launch witness, and Host and process supervision; a registry row records only verified release input and Platform admission never replaces those Runtime or Desktop semantics.
    condition: Whenever verified release input is projected locally.
    failure: Reject Platform-owned runnable truth, Desktop-owned Runtime record or access truth, Runtime-owned Desktop launch or process truth, and any registry row that replaces the canonical owner split.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registered-app-subject
  - id: rule.nimi.platform.app-ecosystem.p-napp-007
    kind: rule
    title: P-NAPP-007 package trust and update boundary
    modality: must
    statement: Platform owns catalog signature, attestation, and update metadata, the package lifecycle owner consumes one immutable descriptor and validated artifact to map the six opaque lineage, attestation, execution-profile, and digest slots, and every update selects and atomically commits a new immutable release without directly mutating Runtime-selected security truth or introducing parallel package trust.
    condition: Whenever verified package trust or update metadata meets local state.
    failure: Deny unmapped package use, selected-source mutation, or parallel trust.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.immutable-package-seam
  - id: rule.nimi.platform.app-ecosystem.p-napp-008
    kind: rule
    title: P-NAPP-008 explicit fail-closed health projection
    modality: must
    statement: health_repair_projection distinguishes unavailable, setup-required, needs-confirmation, in-progress, failed, unsupported, repair-required, and stale-projection, never collapses distinct reasons into unavailable, and never infers ready from file existence, endpoint reachability, process liveness, or transfer completion.
    condition: Whenever health, repair, or readiness is projected.
    failure: Deny ready and return the exact applicable negative state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.health-repair-projection
  - id: rule.nimi.platform.app-ecosystem.p-napp-009a
    kind: rule
    title: P-NAPP-009 owner-only authority allocation
    modality: must
    statement: Platform owns catalog, release, publisher and review posture, the closed declaration-domain vocabulary, and provenance taxonomy; Runtime and canonical domain owners retain registration, subjects, records, declaration generations, sessions, snapshots, credentials, admission, and operations; app-tools owns only authoring and build orchestration; Desktop owns verified exact-Host launch but not Runtime access; and Apps consumes only admitted registry, package, and SDK projections satisfying the complete listing closure.
    condition: Whenever app authority or ordinary visibility is allocated.
    failure: Reject ownership or visibility outside the canonical owner projection.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registered-app-subject
  - id: rule.nimi.platform.app-ecosystem.p-napp-009b
    kind: rule
    title: P-NAPP-009 metadata grants no authority
    modality: must_not
    statement: App id, catalog row, tier, manifest, renderer metadata, host description, Desktop, or app-tools creates Runtime access or runnable identity or owns admission, marketplace, economy, or package trust truth, or Apps reads source workspace, app-local specifications, or unadmitted rows to decide visibility.
    condition: Whenever authority or Apps visibility is resolved.
    failure: Deny the inferred authority or visibility.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registered-app-subject
  - id: rule.nimi.platform.app-ecosystem.p-napp-011
    kind: rule
    title: P-NAPP-011 bundled seed and mutable-build isolation
    modality: must
    statement: The catalog may retain admitted bundled Avatar, Realm Persona Studio, Realm World Studio, and Zhiyu rows with owner posture without third-party redesign or provenance, each shipped App supplies canonical registered release and declaration input and consumes its App Product Plane only through the same formal protected App subject, fresh session, Effective App Access Snapshot, and operation semantics as an equally covered ordinary App, Zhiyu's mutable integration build uses an isolated local-development subject inheriting no bundled identity, declaration coverage, storage, audience, session, snapshot, LocalAgent, or Memory state, and no bundled row, owner posture, native profile, or trust class creates extra product coverage or package readiness.
    condition: Whenever bundled rows or mutable integration builds are handled.
    failure: Reject redesign, third-party mapping, inherited state, external principal, or inferred readiness.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registered-app-subject
  - id: rule.nimi.platform.app-ecosystem.p-napp-012a
    kind: rule
    title: P-NAPP-012 identity surface mapping
    modality: must
    statement: Platform owns canonical app_id display and routing mapping, Runtime resolves protected App access, storage, audience, session, snapshot, and audit through the random non-reused registered subject within the Runtime-verified current local OS-user logical scope, and protected calls use Runtime-derived subject and session context rather than app_id, app_instance_id, or device_id.
    condition: Whenever display identity maps to a protected surface.
    failure: Reject a protected key or call derived from display identity.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registered-app-subject
  - id: rule.nimi.platform.app-ecosystem.p-napp-012b
    kind: rule
    title: P-NAPP-012 canonical identity syntax and native bundle mapping
    modality: must
    statement: app_id is lowercase dot-separated with segments starting and ending in ASCII lowercase letters or digits and containing only internal lowercase letters, digits, or hyphens, underscore is forbidden, and an Electron or Tauri native bundle identifier is only an OS bundle, signing, and update identifier derived exactly as ai.nimi.apps.<app_id> without AI semantics.
    condition: Whenever app_id or a native shell bundle identifier is admitted.
    failure: Reject invalid syntax or a non-derived or overloaded bundle identifier.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registry-row
  - id: rule.nimi.platform.app-ecosystem.p-napp-012c
    kind: rule
    title: P-NAPP-012 no side-namespace identity
    modality: must_not
    statement: Active source, scaffold state, Runtime caller behavior, or native shell configuration uses app.nimi.*, dev.nimi.*, or another side namespace as active identity or encodes development or test posture into canonical app_id.
    condition: Whenever an active app identity is authored or consumed.
    failure: Reject the side namespace and keep non-product posture in Runtime-owned mode, record, build profile, or non-product evidence.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registry-row
  - id: rule.nimi.platform.app-ecosystem.p-napp-013a
    kind: rule
    title: P-NAPP-013 immutable admission closure
    modality: must
    statement: A verified third-party admission closes registry metadata, the App access declaration for transparency, Runtime requirements, AI profile requirements, exact version, immutable source, release descriptor, artifact digest and size, applicable signature or provenance, and storage policy in one immutable release record that owns discovery and review input only and never Runtime access.
    condition: Whenever a third-party release is admitted.
    failure: Fail closed when any package or schema fact is absent or mutable.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-napp-013b
    kind: rule
    title: P-NAPP-013 source is not runnable authority
    modality: must_not
    statement: Repository ownership, package name, source directory, app-local specification, direct npm or npx, mutable branch or tag, clone, build, run, or installer execution creates immutable local truth, registered subject, declaration generation, Desktop launch witness, protected session, or Effective App Access Snapshot; mutable source uses local_development, an explicit immutable local package uses the user_imported validation and install path, and a catalog package uses the approved verified install path.
    condition: Whenever source presence is interpreted locally.
    failure: Deny local authority and route the source through its exact local_development, user_imported, or verified lifecycle.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.immutable-package-seam
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
  - id: rule.nimi.platform.app-ecosystem.p-napp-014a
    kind: rule
    title: P-NAPP-014 immutable descriptor and digest verification
    modality: must
    statement: Every catalog install or update resolves an immutable descriptor with exact app_id, version, source kind and ref, artifact locator, SHA-256, size, signature or provenance ref, Runtime kind and entry, App access declaration, and storage policy, downloads only from that source or admitted mirror, verifies exact size, SHA-256, signature or provenance, manifest, declaration, Runtime, and storage posture before staging and atomic commit, and an explicit local import reads only the user-selected immutable artifact through the same validation and staging boundary without a download phase; these checks do not define mutable-project peer proof or Runtime access.
    condition: Whenever a catalog version or immutable mapping is admitted.
    failure: Fail closed before staging or commit on missing fields, wrong source, size or digest mismatch, signature or provenance failure, or another unresolved validation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.immutable-package-seam
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-napp-014b
    kind: rule
    title: P-NAPP-014 descriptor and hash are not package safety
    modality: must_not
    statement: The descriptor is treated as immutable package format, hostile-byte inspector, or fixed-AppHost authority, a user_imported package bypasses the complete explicit local-import validation lifecycle, or hash match alone is treated as safety proof.
    condition: Whenever descriptor or digest success is interpreted.
    failure: Reject the lifecycle commit and require every independent validation without granting catalog, publisher, trust-tier, or verified posture to user_imported.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.immutable-package-seam
  - id: rule.nimi.platform.app-ecosystem.p-napp-015a
    kind: rule
    title: P-NAPP-015 subject-scoped app storage
    modality: must
    statement: Mediated storage is a Runtime-private current-account-plus-Registered-App-Subject logical partition whose physical layout remains an implementation detail; Runtime alone resolves both owner components, account switch selects another partition and switching back restores the prior partition, explicit Nimi data reset may remove the current account partition, uninstall or registration removal tombstones retained durable data as orphaned and delete-only, deletion requires explicit fresh-presence confirmation, reinstall or a new registration never rebinds it, and historical subject-only JSON data is a hard cut that the product path neither reads, migrates, nor silently reuses across accounts.
    condition: Whenever app storage is resolved or lifecycle changes.
    failure: Deny caller-derived roots, implicit deletion, or orphan rebinding.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registered-app-subject
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.storage-posture
  - id: rule.nimi.platform.app-ecosystem.p-napp-015b
    kind: rule
    title: P-NAPP-015 bounded install and uninstall
    modality: must_not
    statement: Ordinary installation writes outside the Runtime-private Registered-App-Subject-scoped logical partition except through admitted Runtime dependency or materialization, or uninstall implicitly deletes shared models, Runtime dependencies, account data, or another App's data.
    condition: Whenever an app is installed or uninstalled.
    failure: Reject the write or unrelated deletion.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.storage-posture
  - id: rule.nimi.platform.app-ecosystem.p-napp-018a
    kind: rule
    title: P-NAPP-018 complete third-party descriptor
    modality: must
    statement: Every third-party descriptor resolves descriptor_id, app_id, exact version, ordinary-release-proof, publisher namespace, kind, assurance, domain, and KYC ref, immutable source kind and ref, artifact locator, digest, size, provenance ref and mirror ref, build, dependency, and platform-signing assurance, nimi-app Runtime kind, entry and sandbox refs, the exact App access declaration including empty, storage policy, update channel, rollback marker, terminal review decision, and support manifest without making review posture Runtime access truth.
    condition: Whenever a third-party descriptor is admitted.
    failure: Fail closed when a required field or reference is missing, malformed, mutable, or unresolved.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-napp-018b
    kind: rule
    title: P-NAPP-018 descriptor is canonical truth
    modality: must_not
    statement: Descriptor truth is collapsed into a developer manifest or parallel artifact, or a developer manifest is treated as admission truth.
    condition: Whenever descriptor truth is authored or consumed.
    failure: Reject parallel truth and consume only the Platform descriptor.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-napp-019a
    kind: rule
    lifecycle: removed
    title: Retired P-NAPP-019 immutable package lifecycle non-admission
    reason: Removed because the current App package lifecycle now admits truthful install, update, repair, uninstall, job, progress, active-release, rollback, and readiness projections while the six-field Runtime identity seam remains separately constrained.
  - id: rule.nimi.platform.app-ecosystem.p-napp-019b
    kind: rule
    title: P-NAPP-019 frozen schema and non-local metadata
    modality: must_not
    statement: Package mapping renames, splits, merges, or adds identity-bearing subject, record, declaration generation, launch witness, process, session, or snapshot fields, projects lifecycle evidence into the six-field Runtime identity seam, or interprets catalog version, size, date, or rollback metadata alone as local install, Desktop launch, Runtime access, promotion, or rollback truth; the package lifecycle owner may separately retain installed version, active release, rollback candidate, job, progress, install, update, repair, uninstall, and readiness truth only from committed local lifecycle state.
    condition: Whenever package mapping or catalog metadata is projected.
    failure: Reject schema change, undeclared evidence, or inferred local truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.immutable-package-seam
  - id: rule.nimi.platform.app-ecosystem.p-napp-020
    kind: rule
    title: P-NAPP-020 publisher identity requirements
    modality: must
    statement: Every third-party descriptor carries publisher.github_namespace and publisher.namespace_kind from user or org, domain-verified and identity-verified carry a non-null DNS-verifiable domain bound to the GitHub organization namespace, and manifest fields, repository ownership, or package name never substitutes for reviewer-confirmed publisher truth.
    condition: Whenever publisher identity is admitted.
    failure: Return publisher_identity_missing for absent or invalid namespace facts and verified_domain_unresolved for absent, unresolvable, or unbound domain.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.publisher-identity
  - id: rule.nimi.platform.app-ecosystem.p-napp-021
    kind: rule
    title: P-NAPP-021 assurance enum and KYC deferral
    modality: must
    statement: Assurance is exactly pseudonymous with GitHub anchor, domain-verified with DNS-verified org, or identity-verified with KYC-verified entity, the latter two require org, identity-verified requires a non-null reference through a separately admitted KYC pipeline, and assurance is never silently upgraded, downgraded, or mutated but requires new descriptor admission.
    condition: Whenever publisher assurance is admitted or changed.
    failure: Return publisher_identity_missing for invalid namespace binding or kyc_pipeline_not_yet_admitted for unresolved KYC and reject in-place mutation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.publisher-identity
  - id: rule.nimi.platform.app-ecosystem.p-napp-022
    kind: rule
    title: P-NAPP-022 pre-mirror reference and license closure
    modality: must
    statement: Every third-party descriptor resolves artifact_mirror_ref to a Nimi-controlled immutable mirror locator and has mirror_license_cleared true before mirroring, keeps the ref stable across substrate migration, and preserves artifact_mirror_ref_unresolved and mirror_license_unclear as distinct pre-mirror failures.
    condition: Whenever an artifact is admitted for mirroring.
    failure: Return the exact failure and perform no mirror mutation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-napp-023
    kind: rule
    title: P-NAPP-023 third-party build assurance
    modality: must
    statement: Third-party build_assurance is exactly nimi-built, reproducible-verified, or developer-attested, checksum-pinned remains restricted to first-party, internal, and developer-testing classes, and build assurance is review and display input rather than standalone automated install or runnable authority.
    condition: Whenever third-party build assurance is admitted or consumed.
    failure: Return build_assurance_third_party_violation for checksum-pinned or another invalid value and deny local-positive inference.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-napp-024a
    kind: rule
    title: P-NAPP-024 platform signing assurance schema
    modality: must
    statement: Every third-party descriptor carries macos_notarization from notarized, not-applicable, or not-required-internal, macos_developer_id_subject present unless not-applicable, windows_code_signing from signed, not-applicable, or not-required-internal, installer_signature from signed or unsigned-internal-only, entitlements_ref as admitted ref or null, and signing_subject as nimi or publisher.
    condition: Whenever platform signing assurance is admitted.
    failure: Fail closed when the sub-object or a typed subfield is missing or inconsistent.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-napp-024b
    kind: rule
    title: P-NAPP-024 ordinary signing and non-authority boundary
    modality: must
    statement: Ordinary-user third-party macOS resolves notarized and Windows resolves signed with no not-applicable or internal-only substitute, while signing fields remain catalog input that alone creates no package signing identity, registered App subject, record, install, import, update, promotion, launch, ordinary visibility from non-product tracks, package readiness, or new admission_status value; only complete descriptor, signing, artifact validation, and atomic lifecycle commit creates local installed state, and Runtime registration receives only the six opaque seam facts.
    condition: Whenever ordinary release signing assurance is admitted or projected.
    failure: Return platform_signing_required for insufficient signing and deny every local-positive or enum-extension claim.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission-track
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.immutable-package-seam
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-napp-025a
    kind: rule
    title: P-NAPP-025 terminal review decision semantics
    modality: must
    statement: Every third-party descriptor records review.decision as approved, revision-requested, rejected, or kill-switched, only approved posture advances positive catalog admission, and rejected or kill-switched posture remains fail-closed.
    condition: Whenever terminal review disposition is enforced.
    failure: Reject an unknown decision or positive admission without approved posture.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.review-decision
  - id: rule.nimi.platform.app-ecosystem.p-napp-025b
    kind: rule
    title: P-NAPP-025 terminal subset preserves review ownership
    modality: must_not
    statement: submitted or under-review appears as terminal review.decision, or this descriptor schema redefines the owning review-state set or tier-to-adjudicator policy.
    condition: Whenever review decision schema is consumed.
    failure: Reject the transient value or policy redefinition.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.review-decision
  - id: rule.nimi.platform.app-ecosystem.p-napp-026
    kind: rule
    title: P-NAPP-026 complete canonical support manifest
    modality: must
    statement: Every third-party descriptor carries a non-empty support block with typed diagnostics_bundle_fields, redaction_rules, user_visible_issue_categories, escalation_path, kill_switch_visibility, and recovery_instructions, and Runtime never infers those fields from a developer manifest, file existence, process liveness, or endpoint reachability.
    condition: Whenever support truth is admitted or projected.
    failure: Return support_manifest_incomplete for absent or incomplete fields and fail inferred support truth closed.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.support-manifest
  - id: rule.nimi.platform.app-ecosystem.p-napp-027a
    kind: rule
    title: P-NAPP-027 closed storage posture
    modality: must
    statement: storage_policy_ref.kind is exactly nimi-mediated-default or app-owned-os-storage with no in-place third value, and mediated posture resolves to Runtime-private collision-proof JSON and binary asset namespaces under the current-account-plus-Registered-App-Subject partition without exposing physical layout; once package mapping and a protected session are admitted, the exact managed storage operations may materialize JSON documents and assets without admitting a raw or general filesystem surface.
    condition: Whenever storage posture is admitted or resolved.
    failure: Return storage_policy_kind_unresolved for invalid kind or nimi_mediated_storage_unresolved for unresolved template and typed unavailable for premature materialization.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.immutable-package-seam
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registered-app-subject
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.storage-posture
  - id: rule.nimi.platform.app-ecosystem.p-napp-027b
    kind: rule
    title: P-NAPP-027 storage authority classes
    modality: must
    statement: The calling App's mediated partition is reachable for JSON only through runtime.app-storage.json.read, runtime.app-storage.json.write, and runtime.app-storage.json.remove and for binary assets only through the seven Base operations runtime.app-storage.asset.stat, runtime.app-storage.asset.list, runtime.app-storage.asset.write, runtime.app-storage.asset.read, runtime.app-storage.asset.remove, runtime.app-storage.asset.move, and runtime.app-storage.asset.reveal; reveal accepts only one canonical App-relative committed asset path, revalidates the Runtime-derived owner, existence, metadata, and integrity, and permits only the verified native Host to reveal the exact payload file in the OS file manager without returning its absolute path; every call requires a fresh session, Runtime-derived current account and Registered App Subject, canonical relative path or bounded prefix, type and integrity validation, the independent JSON or asset quota policy, and filesystem safety, while cross-owner and destructive retained-data access is excluded and App-owned OS storage remains outside Nimi protected-operation semantics.
    condition: Whenever either storage posture is authorized.
    failure: Deny access outside the exact Base operation and storage boundary or any raw account or credential exposure without treating App-owned OS storage as Nimi-mediated.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registered-app-subject
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.storage-posture
  - id: rule.nimi.platform.app-ecosystem.p-napp-028a
    kind: rule
    title: P-NAPP-028 OS storage disclosure invariant
    modality: must
    statement: app-owned-os-storage carries a non-empty reviewer-visible and user-visible os_storage_disclosure whose entries contain typed path_pattern, purpose, and expected_size_band, while nimi-mediated-default carries no such field and the disjoint shapes use os_storage_disclosure_missing for either symmetric violation.
    condition: Whenever storage posture and disclosure are validated.
    failure: Fail admission closed with os_storage_disclosure_missing.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.storage-posture
  - id: rule.nimi.platform.app-ecosystem.p-napp-028b
    kind: rule
    title: P-NAPP-028 disclosure is not mutation authority
    modality: must_not
    statement: Runtime immutable uninstall, update, or repair unilaterally touches an os_storage_disclosure path.
    condition: Whenever lifecycle operations encounter disclosed app-owned paths.
    failure: Preserve the path and inform the user that clean-uninstall coverage is outside Nimi mediation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.storage-posture
  - id: rule.nimi.platform.app-ecosystem.p-napp-029a
    kind: rule
    title: P-NAPP-029 public source by trust tier
    modality: must
    statement: Every nimi-verified-partner or nimi-community descriptor resolves registry source_repo_url to a publicly visible GitHub repository at admission while nimi-first-party remains unconstrained, and an unresolvable URL is a distinct failure from source_repo_visibility_violation.
    condition: Whenever source URL and visibility are evaluated.
    failure: Return the distinct URL-resolution reason or source_repo_visibility_violation for a resolved non-public repository.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registry-row
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-napp-029b
    kind: rule
    title: P-NAPP-029 immutable source posture
    modality: must_not
    statement: Source visibility enforcement redefines the trust-tier vocabulary or source_repo_url or repository visibility posture is mutated in place after admission.
    condition: Whenever admitted source posture changes.
    failure: Preserve the tier vocabulary and require new descriptor admission.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-napp-033
    kind: rule
    title: P-NAPP-033 catalog track boundary
    modality: must
    statement: Tracks classify catalog review only, ordinary-release-proof is the sole third-party track, verified positive lifecycle state requires an approved descriptor plus a successful current package lifecycle commit, CI descriptors create no install or runnable truth, local_development is not a catalog track, and user_imported is neither a catalog track nor simulated by a fixture.
    condition: Whenever an admission track is interpreted.
    failure: Reject a non-admitted track or local-positive inference.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission-track
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.immutable-package-seam
  - id: rule.nimi.platform.app-ecosystem.p-napp-034a
    kind: rule
    title: P-NAPP-034 exact Desktop Host launch prerequisites
    modality: must
    statement: Desktop launches the exact registered Host and supplies a current launch witness bound only to the security-relevant executable, entrypoint, and process-start facts needed to identify that Host instance; the same-user per-platform peer adapter proves only that the connected peer matches this launch, after which Runtime independently requires the registered subject, exact source and declaration generations, current account context, and fresh protected session before App operations.
    condition: Whenever a protected local App session is created.
    failure: Deny protected session creation on a missing or mismatched registration, exact Host launch, native peer binding, generation, or account fact without treating the failure as whole-project integrity loss, deleting registration, or rotating the subject; account or declaration mismatch alone does not terminate the App, while Desktop may restart or terminate the Host only when the launch witness or re-evaluated security-relevant executable, entrypoint, or process-start facts objectively mismatch the exact Host.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.protected-local-transport
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registered-app-subject
  - id: rule.nimi.platform.app-ecosystem.p-napp-034b
    kind: rule
    title: P-NAPP-034 D2 per-user platform-specific fail-closed launch
    modality: must
    statement: Windows and macOS D2 local development use per-user non-elevated Runtime endpoints and thin native peer adapters, Linux remains deferred, Desktop is the verified exact-Host launcher rather than the App access owner, and portable localhost, environment, argv, renderer metadata, caller fields, copied credentials, raw process launch, SCM or LocalSystem service, root daemon, LaunchDaemon, sudo, or system-account substitute never creates protected access by itself; this D2 rule does not redefine independently admitted production or deployment topology.
    condition: Whenever a D2 platform profile or substitute protected-access path is evaluated.
    failure: Fail an unsupported platform or substitute path closed before protected session creation while leaving the App process, official tooling status, and each other platform's readiness as independent facts.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.protected-local-transport
  - id: rule.nimi.platform.app-ecosystem.p-napp-038
    kind: rule
    lifecycle: removed
    title: Retired P-NAPP-038 public App lifecycle deferral
    reason: Removed because public catalog visibility and the ordinary install, update, repair, and uninstall lifecycle are current product behavior, while metadata-alone non-authority remains covered by P-NAPP-009.
  - id: rule.nimi.platform.app-ecosystem.p-napp-039
    kind: rule
    title: P-NAPP-039 stable trust-tier transitions
    modality: must
    statement: The publisher trust-tier vocabulary remains the closed stable set nimi-first-party, nimi-verified-partner, and nimi-community; a tier id is never renamed, rotated, or silently reassigned, and any publisher tier change requires a new catalog and release admission that re-resolves the tier's signature, identity-assurance, source-visibility, review, and kill-switch references without changing the registered subject, provenance, declaration coverage, session, snapshot, or Runtime access truth.
    condition: Whenever a trust tier is defined, assigned, or changed.
    failure: Reject an unknown or mutated tier and deny transition until the new admission and every tier-owned reference resolve.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.publisher-identity
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.review-decision
  - id: rule.nimi.platform.app-ecosystem.p-napp-040a
    kind: rule
    title: P-NAPP-040 closed App source entry paths
    modality: must
    statement: verified installs use only an approved ordinary-visible catalog descriptor, user_imported installs use only an immutable artifact explicitly selected by the current user and fully validated without receiving catalog trust, and local_development uses only Developer Mode without package install, update, or repair truth; after its exact source lifecycle succeeds, every source shares the canonical registration, declaration, Desktop exact-Host launch, Runtime session, and App operation access seams.
    condition: Whenever an App enters the local product lifecycle.
    failure: Reject a source-class alias, bypass, or package-state claim outside its exact entry path.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-local-lifecycle-projection
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-app-provenance
      - type: supersedes
        target: rule.nimi.platform.app-ecosystem.p-napp-038
  - id: rule.nimi.platform.app-ecosystem.p-napp-040b
    kind: rule
    title: P-NAPP-040 atomic package lifecycle jobs
    modality: must
    statement: At most one package mutation job runs for one App source at a time, download or local read, verification, and staging never change the active release, only one atomic commit changes installed version and Runtime source generation, update or repair failure preserves the prior runnable release, uninstall stops the Host before removing the managed package and registration, cancellation before commit removes only transfer and staging state, and every byte or step progress value comes from observed work without synthetic success or a false one hundred percent.
    condition: Whenever an install, update, repair, uninstall, or cancellation job runs.
    failure: Reject concurrent mutation, non-atomic publication, stale-release loss, unrelated deletion, or simulated progress and return the exact failed or canceled job state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-lifecycle-job
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-local-lifecycle-projection
      - type: supersedes
        target: rule.nimi.platform.app-ecosystem.p-napp-019a
  - id: rule.nimi.platform.app-ecosystem.p-napp-040c
    kind: rule
    title: P-NAPP-040 lifecycle owner and state separation
    modality: must
    statement: Platform owns catalog, admission, descriptor, publisher, trust, and update metadata, Runtime owns local package jobs, committed installed-release and readiness projections, registered subject, source and declaration generations, session, snapshot, and App operation access, and Desktop owns exact Host launch, run, focus, stop, restart, and process supervision; catalog admitted is not installed, installed is not running, running is not Nimi Access available, transfer complete is not committed, and repair-required is not repaired.
    condition: Whenever Apps composes discovery, package, Host, health, or access state or dispatches an action.
    failure: Reject an owner crossing or collapsed state and expose only the exact current projection from each owner.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-lifecycle-job
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-local-lifecycle-projection
  - id: rule.nimi.platform.app-ecosystem.p-perm-018
    kind: rule
    lifecycle: removed
    title: Retired P-PERM-018 closed permission catalog row schema
    reason: Removed with the per-capability App permission, grant, request, approval, revocation, and settings model; any still-current safety invariant is expressed by the declaration, session snapshot, exact operation contract, or canonical owner rule.
  - id: rule.nimi.platform.app-ecosystem.p-audit-001
    kind: rule
    title: P-AUDIT-001 admission outcomes preserve required truth
    modality: must
    statement: A third-party admission outcome is positive only when the exact immutable candidate and manifest inputs satisfy schema, digest, provenance, license, dependency, composite audit, review, and canonical registry-and-descriptor admission truth, and no mutable-source, present-fields-only, self-attested, AI-only, app-local, repository, or package-name shortcut may project a pass.
    condition: Whenever a third-party candidate admission outcome is produced.
    failure: Fail admission closed with the applicable typed reason when required truth is absent or a shortcut is attempted.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-audit-002
    kind: rule
    title: P-AUDIT-002 complete vendor-neutral audit risk classes
    modality: must
    statement: Every third-party admission resolves independent vendor-neutral risk coverage for malicious packages, known vulnerabilities, static analysis, repository security posture, malware reputation, and AI semantic or malice triage against the exact reviewed commit and admitted artifact, with each class supplied by a replaceable admitted adapter and no class collapsed or omitted.
    condition: Whenever third-party audit security coverage is evaluated.
    failure: Fail admission closed with audit_class_coverage_missing when a class, admitted adapter, exact commit binding, or exact artifact binding is absent.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.review-decision
  - id: rule.nimi.platform.app-ecosystem.p-audit-003
    kind: rule
    title: P-AUDIT-003 AI and self-attested evidence cannot decide admission
    modality: must_not
    statement: AI triage alone or developer-supplied scanner output substitutes for complete Nimi-run risk coverage or an admitted adjudicator, and developer context is represented as authoritative scanner evidence or an admission verdict.
    condition: Whenever AI triage or developer-supplied audit context is consumed for third-party admission.
    failure: Fail admission closed with ai_only_review_forbidden or self_attested_scan_forbidden as applicable.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.review-decision
  - id: rule.nimi.platform.app-ecosystem.p-audit-004a
    kind: rule
    title: P-AUDIT-004 community admission risk classification
    modality: must
    statement: The Nimi-run AI-audit descriptor diff classifies every nimi-community admission into exactly one review risk class before adjudication, with a new App or any App access declaration, publisher-namespace, namespace-kind, or build-assurance change classified manual and only a clean descriptor diff preserving all of those fields classified automated; this review classification never changes Runtime declaration semantics or current App access.
    condition: Whenever a nimi-community candidate is classified for adjudication.
    failure: Fail admission closed with solo_reviewer_classification_unresolved when the diff is absent, ambiguous, or outside the automated-class boundary.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.publisher-identity
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.review-decision
  - id: rule.nimi.platform.app-ecosystem.p-audit-004b
    kind: rule
    title: P-AUDIT-004 adjudicator floors and escalation
    modality: must
    statement: The risk classification never changes nimi-first-party internal review or the nimi-verified-partner full-manual floor, while a nimi-community manual class uses human adjudication and its automated class uses the Nimi-run automated gate only while every scanner and AI-triage risk signal remains clear.
    condition: Whenever risk classification influences adjudicator selection.
    failure: Fail admission closed with tier_floor_violation for a weakened tier floor and escalate a flagged or risk-elevating community candidate to human adjudication.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.review-decision
  - id: rule.nimi.platform.app-ecosystem.p-audit-005-p-dev-003
    kind: rule
    title: P-AUDIT-005 and P-DEV-003 developer audit is context only
    modality: must_not
    statement: A developer-side audit dry-run or local self-check is treated as an admission gate or as Nimi-run scanner output, even when its typed output accompanies a submission as developer-supplied context.
    condition: Whenever developer-side audit output is consumed.
    failure: Fail admission closed with developer_side_audit_not_gate and require authoritative coverage against the exact reviewed commit and admitted artifact.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.review-decision
  - id: rule.nimi.platform.app-ecosystem.p-audit-006
    kind: rule
    title: P-AUDIT-006 review decision security binding
    modality: must
    statement: A terminal third-party review decision is Nimi-owned, distinct from developer-authored manifest truth, and binds the exact candidate, complete risk-class coverage, AI model identity and version when AI triage applies, deterministic scanner results, adjudicator kind and identity, and decision time without collapsing evidence meanings or redefining terminal decision semantics.
    condition: Whenever a terminal third-party review decision is admitted or enforced.
    failure: Fail admission closed when any required binding is absent, developer-inferred, collapsed, or inconsistent with the admitted decision schema.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.review-decision
  - id: rule.nimi.platform.app-ecosystem.p-dev-004
    kind: rule
    title: P-DEV-004 immutable candidate submission
    modality: must
    statement: A submitted candidate artifact is built from either a protected immutable Git tag resolved to an unchangeable commit SHA or a reviewed commit SHA, records that exact source reference in submitted manifest input, and carries it unchanged into the immutable admitted release descriptor.
    condition: Whenever a third-party candidate artifact is submitted or admitted.
    failure: Fail admission closed with mutable_submission_artifact for a branch, unprotected tag, dist-tag, version range, latest projection, or any other mutable resolver.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
  - id: rule.nimi.platform.app-ecosystem.p-dev-006
    kind: rule
    lifecycle: removed
    title: Retired P-DEV-006 production Developer Mode security boundary
    reason: Removed because local development has no run_once or allow_project consent, project authorization, durable consent store, permission or capability fingerprint, or project-level access state.
  - id: rule.nimi.platform.app-ecosystem.p-dev-006b
    kind: rule
    lifecycle: removed
    title: Retired P-DEV-006 production Developer Mode revocation and custody
    reason: Removed because local development has no run_once or allow_project consent, project authorization, durable consent store, permission or capability fingerprint, or project-level access state.
  - id: definition.nimi.platform.app-ecosystem.scaffold-custody
    kind: definition
    title: Scaffold authoring and custody boundary
    meaning: App Tools owns Scaffold creation, tool-owned initialization, local development launch, SDK and demand-driven Kit integration, Simulator preview and checks, and Nimi Home host glue for the current Desktop-hosted Third-party Local App flow while the App owns product logic and private data and Runtime owns protected identity, session, authorization, Realm mediation, and credentials.
  - id: definition.nimi.platform.app-ecosystem.nimi-lab
    kind: definition
    title: Nimi Lab full-capability development App
    meaning: Nimi Lab is the local-development-only hand-authored full-capability integration, testing, and incubation Nimi App. It composes owner-admitted SDK and demand-driven Kit surfaces over Runtime and Realm without owning their semantics, authorization, registry, admission, release, or permission truth; it distinguishes scaffoldable capability slices from Lab-only diagnostics, fixtures, and incubation surfaces, and Lab inclusion alone creates no scaffold or public capability promise.
  - id: definition.nimi.platform.app-ecosystem.ecosystem-economy-boundary
    kind: definition
    title: Ecosystem economy non-admission boundary
    meaning: The ecosystem economy boundary keeps take-rate, billing, paid-app, subscription, developer-economics, creator-economics, and AI-spend policy unadmitted on the Platform ecosystem surface until a separate owner-complete specification cut.
  - id: definition.nimi.platform.app-ecosystem.proposal-record
    kind: definition
    title: Non-executing proposal intake record
    meaning: A proposal record is Platform-owned durable intake truth for a conversation-originated request, its closed kind and review state, source reference, selected owner, next review step, reason, and audit reference, and carries no admission, installation, grant, or execution authority.
  - id: definition.nimi.platform.app-ecosystem.mod-extension-retirement
    kind: definition
    title: Public mod and extension retirement boundary
    meaning: The mod-extension retirement boundary permanently excludes public Mod, Extension, Hook, shared content-pack, and equivalent aliased installable surfaces from current Nimi product admission while keeping app-internal content under its app or admitted domain owner.
  - id: rule.nimi.platform.app-ecosystem.p-scaf-001a
    kind: rule
    title: P-SCAF-001 scaffold and app product ownership
    modality: must
    statement: Platform owns app scaffolding, and a generated app owns only its app-specific product logic, routes, state, and feature behavior after the scaffold places the admitted boundaries.
    condition: Whenever a generated app repository is created or maintained.
    failure: Reject scaffold output or app code that crosses the owner boundary.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-001b
    kind: rule
    title: P-SCAF-001 upstream admission and no shadow ownership
    modality: must
    statement: Scaffolding generates only inputs for the upstream developer workflow and never makes generated product code a shadow owner for public App admission, Runtime account custody, registration, registered subjects, declaration generations, protected sessions, Effective App Access Snapshots, SDK client semantics, Realm login, or Kit shell behavior.
    condition: Whenever scaffold output enters an owner workflow or consumes an owner surface.
    failure: Deny the shadow authority and require the upstream owner decision or public projection.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-002a
    kind: rule
    title: P-SCAF-002 accepted bootstrap command and dependency boundaries
    modality: must
    statement: App authoring remains under nimi-app create, init, doctor, and update; standalone Rust shell consumption uses the published nimi-shell-tauri channel only after its public mechanics are admitted, and workspace consumption uses its admitted Cargo path dependency.
    condition: Whenever the app-authoring command or Rust-shell dependency surface is selected.
    failure: Reject a Runtime CLI takeover, unadmitted publication claim, or dependency path outside the applicable boundary.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-002b
    kind: rule
    title: P-SCAF-002 host-neutral client boundary
    modality: must
    statement: Generated Third-party Apps consume one host-neutral SDK client through the verified Host-injected typed carrier without selecting caller mode, trust class, endpoint, registered subject, account, declaration generation, exact-launch correlation, session, snapshot, AppOperationId, AppAccessDomainId, or classification, and scaffolding writes no authority or admitted product truth.
    condition: Whenever scaffolding composes SDK access.
    failure: Reject caller-selected protected facts or scaffold-authored authority and admitted product truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-002c
    kind: rule
    title: P-SCAF-002 production development path and accepted-input stability
    modality: must
    statement: Protected local development uses Developer Mode to activate official development-source registration, evaluation, launch, supervision, and tooling without granting App access, and follows the common Third-party App declaration, Desktop exact-Host launch, fresh protected session, Effective App Access Snapshot, and exact operation semantics through a D2 per-user non-elevated Runtime path; Windows and macOS D2 differ only in thin peer and local IPC adapters, independently admitted production or deployment sources may retain their own service, installer, update, custody, and IPC topology, and manual or direct renderer development that lacks the verified Host path returns typed unavailable for protected operations while mock-auth, caller-selected Runtime truth, pseudo-success, project consent, and first-party self-declaration remain forbidden.
    condition: Whenever scaffolded local development or compatibility behavior is implemented.
    failure: Keep official tooling, App execution, and protected access as independent truthful facts, route protected access through the common per-user path, and return typed unavailable rather than protected success when any current prerequisite is absent.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-004
    kind: rule
    title: P-SCAF-004 submitted manifest is not descriptor truth
    modality: must
    statement: Scaffolding may generate nimi.app.yaml only as labeled developer-submitted input for the owner review flow and never as release-descriptor, registry, review, mirror, ordinary-install, or public-admission truth; for local-development presentation it may separately carry optional ai_config_ui.allowed_routes as a non-empty duplicate-free subset of local and cloud, defaulting to both when absent, solely so the App and Desktop use the same editor route choices without changing AppAccess, AIConfig owner eligibility, Runtime overwrite validation, execution admission, or a committed current route, while an installed release must receive any equivalent presentation policy from its canonical release descriptor rather than the submitted manifest.
    condition: Whenever a scaffold generates, labels, or consumes nimi.app.yaml.
    failure: Reject any positive owner, access, configuration, or execution truth inferred from the submitted manifest, reject an invalid ai_config_ui route set, and reject hardcoded App identity as a substitute for the bounded presentation input.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.release-descriptor
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-006
    kind: rule
    title: P-SCAF-006 App access declaration is source input
    modality: must
    statement: Scaffolded source records AppAccess declaration items as transparency and registration input and may retain unknown items for authoring diagnostics, but only the closed supported AppAccess domains enter the activated semantic set; supported declaration coverage is automatic for the exact registered source generation and becomes effective only through a fresh Runtime-derived snapshot, while marketplace listing or review does not add, remove, approve, or deny Runtime App access.
    condition: Whenever scaffolded App access declaration input is generated, registered, reviewed, or used.
    failure: Exclude unknown domains and deny an uncovered protected operation without creating a grant, prompt, approval, project consent, or review-owned Runtime decision.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-access-domain
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-008
    kind: rule
    title: P-SCAF-008 app-authoring command family
    modality: must
    statement: The public developer-repository authoring command family is exactly nimi-app create, nimi-app init, nimi-app doctor, and nimi-app update, and the Runtime nimi CLI does not own scaffold templates, build inputs, publishing, admission, doctor, or update semantics.
    condition: Whenever an app-authoring command is exposed or assigned an owner.
    failure: Reject an additional command owner or Runtime CLI ownership of the authoring surface.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-009a
    kind: rule
    title: P-SCAF-009 create and init custody
    modality: must
    statement: nimi-app create writes only the source skeleton and explicit initialization intent, while nimi-app init consumes installed dependencies, performs pinned deterministic package projection sync, and writes scaffold-owned lock and developer-input state without template-copying package projections, hidden postinstall mutation, or interactive project reconstruction.
    condition: Whenever create or init mutates a developer repository.
    failure: Abort on uninstalled, hidden, interactive, template-owned, or out-of-custody mutation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-009b
    kind: rule
    title: P-SCAF-009 update preservation and non-admission output
    modality: must
    statement: nimi-app update changes only scaffold-managed glue through admitted dependency updates and codemods, preserves app-owned product code, fails closed on conflicts or mixed and stale projection state, and no init, doctor, update, audit, reachability, file, or build result becomes public admission, installed-app health, launch, rollback, update, or kill-switch truth.
    condition: Whenever scaffold maintenance output is produced or interpreted.
    failure: Stop the mutation on unsafe state and reject every projected owner-lifecycle claim.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-010
    kind: rule
    title: P-SCAF-010 package projection custody
    modality: must
    statement: Package-owned .nimi config, contract, and methodology projections remain externally package-owned, generated repositories consume them through the package's declared synchronization surface, host-local truth stays inside the generated repository's .nimi boundary, and local evidence, lifecycle reports, or package projections do not become semantic truth or override canonical product authority under .nimi/spec.
    condition: Whenever generated repository projections or host-local truth are synchronized or interpreted.
    failure: Reject copied, re-owned, out-of-boundary, or falsely promoted projection content.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-012
    kind: rule
    title: P-SCAF-012 separate scaffold and public admission surfaces
    modality: must
    statement: Public app admission and developer-repository scaffold shape remain separate owner surfaces; scaffolding writes no admitted truth and cannot create registry, descriptor, mirror, review, visibility, install, or kill-switch truth.
    condition: Whenever scaffolding creates or projects admission-related content.
    failure: Reject scaffold-created public truth or substitution for the public admission owner.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-013
    kind: rule
    title: P-SCAF-013 model-test feature non-availability
    modality: must_not
    statement: Default scaffold content imports, fabricates, or edits a kit/features/model-test package surface before that feature is admitted and available, or presents a planned feature as shipped.
    condition: Whenever default scaffold content or examples are generated.
    failure: Remove the unadmitted surface and use only admitted SDK, Kit, Runtime, or app-owned placeholder areas.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-016a
    kind: rule
    title: P-SCAF-016 protected launch and session custody
    modality: must
    statement: A Scaffolded Third-party Local App is launched as the exact Host by Desktop and uses the standard SDK only to carry typed requests and results, while Runtime privately derives and interprets the current account, registered subject, protected session, Effective App Access Snapshot, and exact operation admission; the App and SDK receive no snapshot content or identifier, Realm or refresh token, Provider Credential, connector credential material, native peer proof, or internal authorization material.
    condition: Whenever a scaffolded third-party app opens a protected local session.
    failure: Deny protected session creation or the exact operation when identity, context, snapshot, peer material, or credentials are App-supplied or exposed without requiring Host termination for ordinary access unavailability.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-016b
    kind: rule
    title: P-SCAF-016 host bridge composition and fail-closed status
    modality: must
    statement: Generated source composes the standard SDK and any demand-driven Kit host integration in scaffold-owned glue, keeps Runtime mediation transparent to the App developer, returns typed unavailable for inapplicable operations, and never constructs or self-reports Host identity, registered subject, account, session, Effective App Access Snapshot, AppOperationId, AppAccessDomainId, classification, token, peer proof, or authorization truth.
    condition: Whenever generated source composes or reports local-app host access.
    failure: Return typed unavailable and reject app-supplied or self-reported protected truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-017
    kind: rule
    title: P-SCAF-017 Realtime microphone permission stays with the OS Host
    modality: must
    statement: A formal App may begin microphone capture for an exact admitted Agent or AI Realtime operation only through its verified native Host after explicit user intent and the current operating-system microphone decision; the Host owns OS permission request and denial, device selection and change observation, capture framing, and physical playback, Runtime owns only the admitted channel, negotiated media contract, bounded frames, pressure, track, and terminal execution after protected dispatch, and manifest declaration, AppOperation, AppAccess, CapabilityContract, AIConfig, Realm authorization, and OS permission remain separate facts. Denial or device loss projects a readable typed state and permits recovery only after a new user or OS state permits capture, without creating a PermissionGrant store, approval UI, first-party whitelist, sandbox, attestation, or per-frame security protocol.
    condition: Whenever a formal App requests, denies, recovers, changes, or closes microphone or playback resources for Realtime.
    failure: Start no capture and send no audio before OS admission, stop and release the exact device on loss or close, and expose the typed permission or device result without bypass, silent downgrade, mock audio, or text-only success.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-018a
    kind: rule
    title: P-SCAF-018 official local development launcher
    modality: must
    statement: Fresh scaffolds expose their dev and dev:shell package scripts through the same official nimi-app dev launcher, whose role is limited to parsing, validation, build coordination, launch request, and truthful tooling status and which cannot create a registered subject, declaration coverage, session, snapshot, protected endpoint, credential, release trust, or product evidence.
    condition: Whenever a scaffolded local-development command runs.
    failure: Reject a private launcher or launcher-created protected access while keeping tooling active or inactive independent from App running and Nimi access available or unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-018b
    kind: rule
    title: P-SCAF-018 production path and bypass prohibition
    modality: must
    statement: The protected-development command requests official Developer Mode tooling and Desktop launch and receives only truthful lifecycle or operation results; Windows and macOS use the common per-user non-elevated Runtime path with their thin native peer adapters, while direct Tauri or Electron process launch, generic proxy, token custody, App-owned admission, caller-selected Runtime inputs, private launchers, registration bypasses, project consent, and renderer-only protected success remain forbidden.
    condition: Whenever local development attempts to reach protected operations.
    failure: Fail the exact protected session or operation closed, route official protected development through Desktop and the common Runtime path, and return typed unavailable rather than protected success from an unverified Host path.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-018c
    kind: rule
    title: P-SCAF-018 synchronization preserves app custody
    modality: must
    statement: Scaffold synchronization keeps the official launcher reference deterministic, never overwrites app-owned product files, and applies the same launcher, Kit, and Runtime boundary to Nimi Lab and external app consumers.
    condition: Whenever launcher glue is synchronized or consumed.
    failure: Reject non-deterministic glue, product-file overwrite, or consumer-specific authority bypass.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-019a
    kind: rule
    title: P-SCAF-019 Nimi Lab canonical identity hard cut
    modality: must
    statement: The canonical local-development identity is Nimi Lab at apps/lab with package @nimiplatform/lab, app_id nimi.lab, native identifier ai.nimi.apps.nimi.lab, and Lab-owned source namespaces; Tester, apps/tester, @nimiplatform/tester, nimi.tester, tester-reference, and tester-owned namespace forms are losing internal pre-release vocabulary removed without alias, dual path, compatibility read, or migration.
    condition: Whenever the Lab App, its source, native shell, or scaffold source is identified.
    failure: Reject a mixed, aliased, migrated, or losing Lab identity and require the canonical Nimi Lab identity.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.nimi-lab
  - id: rule.nimi.platform.app-ecosystem.p-scaf-019b
    kind: rule
    title: P-SCAF-019 Lab inclusion and scaffold selection boundary
    modality: must
    statement: App Tools keeps topology profile and capability selection orthogonal, exposes only explicitly catalogued scaffoldable Nimi Lab slices backed by admitted owner surfaces, and never infers scaffold or public availability from inclusion in the full Lab composition; Lab-only diagnostics, fixtures, and incubation surfaces remain excluded.
    condition: Whenever a Nimi Lab capability is considered for scaffold selection or generation.
    failure: Reject implicit feature admission, a Lab-as-profile path, or inclusion of a Lab-only surface in scaffold output.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.nimi-lab
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-scaf-019c
    kind: rule
    title: P-SCAF-019 positive capability closure generation
    modality: must
    statement: nimi-app create positively composes the generic base with the selected catalog feature dependency closure, includes only that closure's source, route, dependency, and App access inputs, expands all to the current catalog's exact ordered feature set at creation, and records the expanded set in scaffold intent and lock state without copying the full Lab and deleting omissions.
    condition: Whenever capability selection is resolved or scaffold source is generated.
    failure: Abort before producing a completed scaffold on an unknown feature, dependency cycle, path collision, non-selected input, Lab-only input, or non-deterministic expansion.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.nimi-lab
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.scaffold-custody
  - id: rule.nimi.platform.app-ecosystem.p-eco-001
    kind: rule
    title: P-ECO-001 ecosystem expansion scope
    modality: must
    statement: Platform ecosystem expansion covers third-party onboarding, trust-tier policy, future world and game App classes, the future Engine SDK seam, economy non-admission, and negative strategic gates without replacing App admission, the current declaration and exact operation access model, or retired extension authority.
    condition: Whenever ecosystem expansion policy is authored or applied.
    failure: Reject scope outside this boundary or replacement of an existing owner surface.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.ecosystem-economy-boundary
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.mod-extension-retirement
  - id: rule.nimi.platform.app-ecosystem.p-eco-002
    kind: rule
    lifecycle: removed
    title: Retired P-ECO-002 public registry onboarding deferral
    reason: Removed because canonical third-party registry onboarding, trust-tier review, descriptor admission, publication, and ordinary-user installation are current product behavior.
  - id: rule.nimi.platform.app-ecosystem.p-eco-002b
    kind: rule
    title: P-ECO-002 canonical public registry onboarding
    modality: must
    statement: A third-party developer enters the public catalog only through canonical registry submission, immutable candidate review, trust-tier resolution, complete descriptor admission, and publication, while repository presence, an App-local manifest, local_development registration, user_imported installation, or another registry-bypass alias never creates public admission.
    condition: Whenever a third-party developer or release enters the public catalog.
    failure: Reject incomplete onboarding or a registry bypass before publication.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registry-row
      - type: supersedes
        target: rule.nimi.platform.app-ecosystem.p-eco-002
  - id: rule.nimi.platform.app-ecosystem.p-eco-003
    kind: rule
    title: P-ECO-003 closed trust-tier expansion
    modality: must
    statement: Ecosystem expansion fills policy references only for the existing nimi-first-party, nimi-verified-partner, and nimi-community tiers and admits no fourth public tier without an explicit specification cut.
    condition: Whenever ecosystem trust-tier policy expands.
    failure: Reject a new or mutated public tier absent the explicit cut.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
  - id: rule.nimi.platform.app-ecosystem.p-eco-004
    kind: rule
    title: P-ECO-004 typed review posture reference
    modality: must
    statement: Ecosystem review posture references the closed submitted, under-review, revision-requested, approved, rejected, and kill-switched states, applies internal review to first-party, full manual review to verified partners, and automated review with manual kill-switch eligibility to community, with no silent transition and no automatic recovery from kill-switched.
    condition: Whenever ecosystem review posture is projected or changed.
    failure: Reject an unknown state, tier-policy mismatch, silent transition, or terminal-state recovery.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.review-decision
  - id: rule.nimi.platform.app-ecosystem.p-eco-005
    kind: rule
    title: P-ECO-005 future world and game app boundary
    modality: must
    statement: A future world or game App remains only a registry candidate, and any cross-world or cross-game flow requires a separate owner-complete authority cut and typed projection while retaining source App, target App, and canonical App owner references on the Realm audit surface; it cannot widen the current four AppAccess domains or seventy-four operations through registry, review, trust inheritance, or raw sharing.
    condition: Whenever a world or game app class or cross-app flow is proposed.
    failure: Deny admission or data flow without the separate owner authority, projection, audit reference, and trust-tier boundary.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-access-domain
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
  - id: rule.nimi.platform.app-ecosystem.p-eco-006
    kind: rule
    title: P-ECO-006 Engine SDK public-surface seam
    modality: must
    statement: A future Engine SDK is placed on the Platform seam and consumes Runtime and Realm authority only through SDK public surfaces, while Runtime retains implementation semantics and the Engine SDK never imports Runtime internals, Realm private client or transport, Cognition private endpoints, or replaces any canonical owner.
    condition: Whenever an Engine SDK integration is designed or implemented.
    failure: Reject the private import, private endpoint, or owner substitution.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
  - id: rule.nimi.platform.app-ecosystem.p-eco-007
    kind: rule
    title: P-ECO-007 economy policy remains unadmitted
    modality: must_not
    statement: Platform ecosystem authority decides take-rate, billing, paid-app, subscription, creator or developer economics, or cloud and Runtime AI-spend policy, or disguises such a decision as pricing copy, registry metadata, or an app-local setting.
    condition: Until a separate specification cut identifies the economy owner, scope, audit, and enforcement boundary.
    failure: Keep the economy decision unadmitted and require the owner-complete cut.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.ecosystem-economy-boundary
  - id: rule.nimi.platform.app-ecosystem.p-eco-008
    kind: rule
    title: P-ECO-008 no Steam-copy strategic posture
    modality: must_not
    statement: Product positioning, registry rows, admission review, or ecosystem marketing uses a Workshop clone, trading-card or achievement grind, collectible badge or platform inventory, family-sharing clone, Big-Picture clone, screenshot or video social-feed clone, or a friends or invite clone outside Realm social authority as Nimi's primary justification or strategic posture.
    condition: Whenever ecosystem product strategy or messaging is produced.
    failure: Reject the clone-based posture and preserve the Realm social owner boundary.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
  - id: rule.nimi.platform.app-ecosystem.p-eco-010
    kind: rule
    title: P-ECO-010 cross-cutting owner invariants
    modality: must
    statement: Ecosystem expansion preserves fail-closed exact App operation admission, provider-neutral and model-neutral selection, Apps non-ownership, the single ordinary-user truth after hard cut, the Character-sourced LocalAgent identity floor, and every existing Platform, Runtime, Realm, Cognition, and SDK owner boundary.
    condition: Whenever ecosystem capability expands.
    failure: Deny expansion that bypasses or weakens any referenced invariant.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.app-access-domain
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.catalog-admission
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.local-agent-identity
  - id: rule.nimi.platform.app-ecosystem.p-prop-001a
    kind: rule
    title: P-PROP-001 durable intake and non-execution
    modality: must
    statement: A first-party durable request, queued capability, review item, or future handoff uses the Platform-owned proposal record, and creating, updating, submitting, or closing it installs nothing, registers no service, grants no permission, loads no code, starts no workflow, invokes no tool, selects no provider or model, mutates no external user data, and exposes no release.
    condition: Whenever conversation-originated proposal intake becomes durable or changes state.
    failure: Reject the parallel intake or attempted side effect and preserve only proposal-record mutation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-prop-001b
    kind: rule
    title: P-PROP-001 no local proposal truth or admission proof
    modality: must_not
    statement: App-local tables, renderer state, transcripts, files, or UI cards become durable proposal truth, or a proposal record proves a capability, workflow, app, tool, permission, package, or release admitted.
    condition: Whenever proposal state or downstream eligibility is resolved.
    failure: Discard the local or inferred truth and require the Platform record followed by owner review.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-prop-002
    kind: rule
    title: P-PROP-002 closed proposal record shape
    modality: must
    statement: Every proposal record carries Platform-minted proposal_id, closed proposal_kind, source_conversation_anchor_id, requester_subject_ref, owner_domain, requested_capability_ref, policy-selected risk_tier, explicit required_owner_review_refs including an empty list, non-executing next_review_step, closed state, reason_code, audit_ref, and created_at, with every review reference remaining non-executing and carrying no permission, grant, access, consent, or admission authority and with the identity, kind, owner, state, reason, audit, and creation fields also required for rejected requests.
    condition: Whenever a proposal record is created, read, or updated.
    failure: Reject an incomplete, app-minted, open-valued, or malformed record.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-prop-002b
    kind: rule
    title: P-PROP-002 non-executable record contents
    modality: must_not
    statement: A proposal record carries executable code, prompt bodies, provider or model names, install commands, hidden grants, unreviewed package locators, local filesystem paths, or app-local admission flags.
    condition: Whenever proposal record content is accepted.
    failure: Reject the forbidden content and keep any rejected summary bounded and redacted.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-prop-003
    kind: rule
    title: P-PROP-003 closed proposal kinds and retired aliases
    modality: must
    statement: proposal_kind is exactly capability_proposal, workflow_draft_request, nimi_app_request, delegated_tool_request, or rejected_request with their intake-only meanings, and any new kind requires a Platform authority change and synchronized projections.
    condition: Whenever proposal kind is assigned or extended.
    failure: Reject an unknown kind, and classify a Mod, Extension, content-pack, plugin, worker, VM, hook, shared-package, or equivalent retired alias as rejected_request or blocked with a typed reason.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.mod-extension-retirement
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-prop-004a
    kind: rule
    title: P-PROP-004 closed intake state machine
    modality: must
    statement: Proposal state is exactly draft, submitted, under-review, revision-requested, rejected, accepted-for-admission, or blocked, every transition sets a typed reason_code and updates audit_ref, and these remain intake states rather than app-admission review states.
    condition: Whenever proposal state is created or transitioned.
    failure: Reject an unknown, unaudited, reasonless, or admission-schema-substituting transition.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-prop-004b
    kind: rule
    title: P-PROP-004 accepted-for-admission is not approval
    modality: must_not
    statement: accepted-for-admission is treated as approved, admitted, installed, enabled, granted, running, or ordinary-user-visible.
    condition: Whenever an accepted proposal is handed to a downstream owner.
    failure: Preserve intake-only status and require the downstream owner's admitted process.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-prop-005
    kind: rule
    title: P-PROP-005 owner-review handoff only
    modality: must
    statement: Every proposal handoff names an owner and non-executing next step, and the owner independently validates it; app requests use the existing developer, registry, and audit admission path, delegated-tool requests wait for Runtime owner acceptance and all consent, and workflow drafts remain blocked with a missing-authority reference while execution authority is absent.
    condition: Whenever proposal intake hands a request to another owner.
    failure: Block the handoff before install, execution, provider or model selection, permission grant, release promotion, hidden runner creation, or bypass of owner validation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-prop-006
    kind: rule
    title: P-PROP-006 conversation reference without transcript custody
    modality: must
    statement: source_conversation_anchor_id remains a provenance-only reference to conversation continuity, any request summary is bounded, redacted when needed, and review-only, and the proposal record stores no raw transcript, private memory, provider trace, account secret, or app-owned conversation state.
    condition: Whenever proposal intake references source conversation material.
    failure: Reject transferred owner content and retain only the bounded reference or redacted review input.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.conversation-anchor
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-prop-007
    kind: rule
    title: P-PROP-007 typed transition audit
    modality: must
    statement: Every proposal creation and transition returns an owner-issued audit_ref whose audit or pending record binds proposal_id, applicable from_state, to_state, transition_cause, decided_at, and adjudicator reference, and unavailable audit fails closed or returns blocked with proposal_audit_unavailable without synthetic app-issued references.
    condition: Whenever a proposal is created or changes state.
    failure: Fail the operation or return the typed blocked result when the complete owner audit reference cannot be produced.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-prop-008
    kind: rule
    title: P-PROP-008 typed SDK and app consumer boundary
    modality: must
    statement: SDK proposal projections preserve the closed shape and non-execution semantics, apps render only returned Platform state and fail closed on absent, rejected, or blocked results, and neither SDK nor apps create a parallel durable state machine, bypass intake through REST, files, renderer persistence, or Runtime private imports, or hardcode providers, models, execution paths, or retired aliases.
    condition: Whenever SDK or app consumers create, read, update, or render proposals.
    failure: Reject the bypass or hardcoded projection and return the owner result or typed failure.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.proposal-record
  - id: rule.nimi.platform.app-ecosystem.p-moex-001
    kind: rule
    title: P-MOEX-001 public mod and extension non-admission
    modality: must_not
    statement: A Public Mod or Public Extension is admitted as an external installable, distributable, or user-authorized product category, including through a registry, SDK, Apps, install gateway, release channel, or alias.
    condition: Whenever an external product category or public ecosystem entry is proposed.
    failure: Deny admission and preserve the retired boundary.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.mod-extension-retirement
  - id: rule.nimi.platform.app-ecosystem.p-moex-002
    kind: rule
    title: P-MOEX-002 retired Mod and Hook surfaces stay retired
    modality: must_not
    statement: A retired Mod, Hook, runtime-mod, or SDK mod surface returns as an ordinary-user entry, Nimi App, ecosystem entry, public SDK or API promise, compatibility layer, or reserved namespace without a new explicit admission that reuses none of the retired authority files, paths, or names.
    condition: Whenever a retired surface or equivalent proposal is introduced.
    failure: Reject the reintroduced or compatibility surface and require a new non-reusing admission.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.mod-extension-retirement
  - id: rule.nimi.platform.app-ecosystem.p-moex-003
    kind: rule
    title: P-MOEX-003 no shared Nimi Content Pack channel
    modality: must_not
    statement: Nimi creates or admits a shared Nimi Content Pack product or cross-app general content-package channel through Registry, Apps, SDK, or an alias.
    condition: Whenever a shared content channel is proposed or classified.
    failure: Deny the channel and treat the proposal as a request to reopen explicit authority.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.mod-extension-retirement
  - id: rule.nimi.platform.app-ecosystem.p-moex-004
    kind: rule
    title: P-MOEX-004 app-internal content custody
    modality: must
    statement: App-internal Avatar, Live2D, VRM, voice, persona, prompt, knowledge, workflow, and other content packages remain owned by their app or explicitly admitted domain authority and are never classified as a Nimi App, Mod, Extension, or shared content channel.
    condition: Whenever an app-internal content package is owned or classified.
    failure: Restore app or domain custody and reject the public or shared classification.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.mod-extension-retirement
  - id: rule.nimi.platform.app-ecosystem.p-moex-005
    kind: rule
    title: P-MOEX-005 retired Asset Market cannot silently return
    modality: must_not
    statement: Asset Market returns as first-party app admission, backend or projection behavior, or active product authority without a new explicit admission row and newly authored authority.
    condition: Whenever an Asset Market surface is proposed after retirement.
    failure: Deny the revival until a complete new admission is authored.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.mod-extension-retirement
