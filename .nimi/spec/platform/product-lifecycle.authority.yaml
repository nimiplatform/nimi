format: nimicoding.authority/v2
owner: team.platform
scope: platform.product-lifecycle
units:
  - id: definition.nimi.platform.product-lifecycle.cold-start-state
    kind: definition
    title: Cold-start projection state
    meaning: A cold-start projection state describes product posture after process start and before required account, canonical Product Control, data-root, Runtime service, and current local-development App authority is available; AIProfile, AIConfig, Local Capability Configuration, machine selection, ConnectorGrant, capability admission, LocalAsset, and AI execution are orthogonal and never become cold-start prerequisites; its closed fail-closed values are unavailable, setup-required, needs-confirmation, in-progress, failed, unsupported, and stale-projection.
  - id: definition.nimi.platform.product-lifecycle.product-control-record
    kind: definition
    title: Canonical product-control record
    meaning: The installed product shell product-control record is the small local ordinary-product-entry and discovery record, is the sole authority that records the selected data root, and contains schemaVersion, installId, productVersion, state, dataRoot, firstRun, pointers, and repair; its closed states are not_logged_in, config_missing, data_root_missing, data_root_selected, repair_required, blocked, and ready_for_use, none of which asserts AI capability readiness.
  - id: definition.nimi.platform.product-lifecycle.nimi-data-root
    kind: definition
    title: User-selected nimi_data root
    meaning: The nimi_data root is the one user-selected writable large-data-plane directory recorded by the canonical product-control record; it cannot be a filesystem or volume root, and its managed content remains partitioned by the applicable Runtime, account, and registered App subject owners without making any physical App partition layout product authority.
  - id: definition.nimi.platform.product-lifecycle.first-run-lifecycle
    kind: definition
    title: First-run product lifecycle
    meaning: First run is the Product Control workflow from missing or incomplete account, canonical local product state, and selected writable data root to ready_for_use and ordinary product entry without requiring an AIProfile, AIConfig, local model, Local Capability Configuration, machine selection, ConnectorGrant, or AI capability execution.
  - id: definition.nimi.platform.product-lifecycle.runtime-service-configuration
    kind: definition
    title: Runtime service configuration boundary
    meaning: Production Runtime configuration is protected state owned by the isolated Runtime service and contains private service identity, custody, grants, sessions, security evidence, and data-root verification derived from the canonical product-control record, while product control communicates only through the protected Home Host Contract and never owns physical Runtime configuration paths.
  - id: definition.nimi.platform.product-lifecycle.development-checkpoint-lineage
    kind: definition
    lifecycle: removed
    title: Retired signed development checkpoint lineage
    reason: Removed because fixed platform development candidates no longer create a parallel signed-trial, profile, acceptance-round, or Runtime-candidate lineage.
  - id: definition.nimi.platform.product-lifecycle.governed-local-config-family
    kind: definition
    title: Governed local configuration family
    meaning: The governed local configuration family keeps the product-control record, Runtime default seed, and factory AI profile index under their separate schema owners; Runtime service configuration, derived data-root verification, and protected local-app state remain outside this interactive-user family and cannot become a second product-control record.
  - id: definition.nimi.platform.product-lifecycle.current-schema-repair
    kind: definition
    title: Current-schema repair outcome
    meaning: Current-schema validation accepts only an owner-declared current positive integer schemaVersion and otherwise produces a typed repair_required or blocked outcome without read-time writes, guessed repair, partial readiness, silent recreation, or data orphaning.
  - id: definition.nimi.platform.product-lifecycle.nimi-data-ownership
    kind: definition
    title: nimi_data ownership and cleanup boundary
    meaning: Each first-level nimi_data directory has one canonical owner and cleanup rule, with Runtime management paths owning models, dependencies, and environments, Runtime-private Registered-App-Subject-scoped logical partitions isolating App data without a canonical physical layout, and explicit user, export, or deletion policy protecting durable account and App data.
  - id: definition.nimi.platform.product-lifecycle.home-surface
    kind: definition
    title: Nimi Home surface
    meaning: Nimi Home is the core product entry and control contract for account state, Runtime health and repair, canonical AIConfig editing and separately owned Machine Local AI Configuration management, current local-development Apps, Realm World and Character browsing, Avatar and Voice entry, and Support; for LocalAgent creation Home first consumes the Realm-owned public PersonaCharacter creation seam and resulting Character Source, then requests Runtime-owned materialization as a separate step; Desktop is the current replaceable host implementation and owns none of the underlying Realm, Runtime, LocalAgent, App, machine-local, protected-access, or credential truth.
  - id: definition.nimi.platform.product-lifecycle.home-placement
    kind: definition
    title: Nimi Home placement set
    meaning: The Nimi Home placement set contains first-run, apps, agent-chat, runtime-health, app-health, account, settings, diagnostics, developer-mode, and failure-projection, each with an explicit source authority and forbidden ownership.
  - id: definition.nimi.platform.product-lifecycle.home-agent-chat
    kind: definition
    title: Home LocalAgent conversation projection
    meaning: LocalAgent conversation inside Nimi Home is a consumer projection of Runtime-owned execution, durable Conversation, Memory, Knowledge, state, and errors and does not become LocalAgent identity or truth.
  - id: definition.nimi.platform.product-lifecycle.home-apps
    kind: definition
    title: Home Apps projection
    meaning: The current Apps surface is a developer-visible projection of local-development App identity, typed client, Runtime-derived session, registration, and enforcement truth; retained registry, package, public distribution, and ordinary-user lifecycle designs remain unavailable until separate lifecycle authority activates them, and Library and Discovery are lower-level or historical projection names rather than the primary navigation label.
  - id: rule.nimi.platform.product-lifecycle.p-cold-001a
    kind: rule
    title: P-COLD-001 closed cold-start state set
    modality: must
    statement: Nimi Home projects only a value from the closed cold-start projection state set before every required upstream authority is ready.
    condition: During cold start while any required authority is not ready.
    failure: Reject any state outside the closed set and project the precise fail-closed state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.cold-start-state
  - id: rule.nimi.platform.product-lifecycle.p-cold-001b
    kind: rule
    title: P-COLD-001 no fabricated readiness
    modality: must_not
    statement: Nimi Home projects empty success, best-effort-ready, a guessed default, anonymous success as authenticated, or a latest-known projection as ready.
    condition: Before every required upstream authority is ready.
    failure: Fail closed to the precise non-ready cold-start state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.cold-start-state
  - id: rule.nimi.platform.product-lifecycle.p-cold-002
    kind: rule
    title: P-COLD-002 process-start owner split
    modality: must
    statement: The Desktop-hosted Home may render the shell and load packaged release metadata at process start, but derives cold-start state only from the closed Product Control inputs and owner projections admitted by P-COLD-014; AI or model configuration, capability support, LocalAsset, machine selection, ConnectorGrant, admission, and Job facts remain separate setup or execution outcomes and never determine Home cold-start state.
    condition: When the product process starts.
    failure: Reject any cold-start claim or non-ready presentation derived from an AI or model fact and project only the precise Product Control state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.cold-start-state
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-surface
  - id: rule.nimi.platform.product-lifecycle.p-cold-003
    kind: rule
    title: P-COLD-003 Runtime bootstrap boundary
    modality: must_not
    statement: Desktop substitutes for the Runtime-owned packaged daemon, falls back through PATH, fabricates its version, or conceals an exact bootstrap failure.
    condition: When Desktop starts or observes Runtime bootstrap.
    failure: Start or observe only the packaged daemon and expose the exact failure.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.runtime-service-configuration
  - id: rule.nimi.platform.product-lifecycle.p-cold-004
    kind: rule
    title: P-COLD-004 unauthenticated account boundary
    modality: must_not
    statement: Renderer state takes durable token custody or represents anonymous posture as authenticated success.
    condition: When the account is unauthenticated.
    failure: Preserve Runtime custody and show sign-in, skip, or precise local posture from the account projection.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.cold-start-state
  - id: rule.nimi.platform.product-lifecycle.p-cold-005
    kind: rule
    title: P-COLD-005 Runtime-owned host capability detection
    modality: must_not
    statement: Home probes GPU, CUDA, or Python capability or implements host-capability installer logic.
    condition: When host capability is detected for cold start or setup.
    failure: Require the Runtime-probed host profile projection and expose unavailable status when it is absent.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-surface
  - id: rule.nimi.platform.product-lifecycle.p-cold-006
    kind: rule
    lifecycle: removed
    title: Retired first-run factory AIProfile selection boundary
    reason: Removed because first run no longer selects or applies an AIProfile and AI configuration is an independent post-entry product action.
  - id: rule.nimi.platform.product-lifecycle.p-cold-007
    kind: rule
    title: P-COLD-007 Runtime-owned local dependency setup
    modality: must_not
    statement: Home directly downloads, verifies, or repairs local dependencies instead of using Runtime materializer plan, explicit confirmation, job, verification, and promotion operations, or treats completion of those operations as Product Control ready_for_use authority.
    condition: When optional local capability dependency setup is explicitly requested.
    failure: Reject the Home-local operation, route setup through Runtime materializers, and keep Product Control state unchanged.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.first-run-lifecycle
  - id: rule.nimi.platform.product-lifecycle.p-cold-008
    kind: rule
    title: P-COLD-008 current local-development App projection
    modality: must_not
    statement: Home derives first-app or Apps truth locally, from registry or package data, or from an ordinary-user lifecycle surface instead of projecting Runtime-mediated local-development App state with explicit unknown or unavailable outcomes.
    condition: When first-app or Apps state is projected before separate public App lifecycle activation.
    failure: Reject the unowned or premature public projection, use the current local-development owner projection, and keep ordinary-user lifecycle unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-apps
  - id: rule.nimi.platform.product-lifecycle.p-cold-009a
    kind: rule
    title: P-COLD-009 fixed product-control locator and authority
    modality: must
    statement: The canonical product-control record is the sole product-discovery authority for the selected data root; trusted product and verification surfaces use one shared resolver, the owning host and Runtime verify the current OS account scope, and no request, environment, renderer, cache, test, repository, or app-local source becomes an alternate authority; physical path and filesystem verification mechanisms remain owner implementation.
    condition: Whenever installed-product readiness or the selected data root is located, read, written, or reused.
    failure: Reject an unverified account scope, substitute locator, or substitute record, route missing or invalid canonical state to config_missing or repair, and route disagreement with protected derived state to explicit repair or fail-closed without allowing protected state to override the selected data root.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-cold-009b
    kind: rule
    title: P-COLD-009 closed product-control schema and states
    modality: must
    statement: The product-control record contains every defined control field and uses only the closed product-control state set.
    condition: Whenever a product-control record is created, read, transitioned, or persisted.
    failure: Reject the invalid record and enter config_missing, repair_required, or blocked as applicable.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-cold-010a
    kind: rule
    title: P-COLD-010 data-root selection precedes heavy mutation
    modality: must
    statement: First run records an absolute ordinary non-volume-root user-selected nimi_data directory in canonical dataRoot.path, rejects Windows drive roots, UNC share roots, extended-path volume roots, the POSIX filesystem root, and equivalent volume roots while admitting ordinary absolute subdirectories, and verifies writability and required root-directory creation before heavy download, dependency installation, app-package installation, model materialization, or environment setup begins.
    condition: Before the first heavy first-run mutation.
    failure: Block the mutation and remain in a non-ready data-root state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.nimi-data-root
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-cold-010b
    kind: rule
    title: P-COLD-010 no silent data-root default
    modality: must_not
    statement: A product, development, or verification surface silently defaults, guesses, or accepts an alternate data root while the canonical product-control record has a valid selection.
    condition: When any trusted product or verification surface proposes, selects, restores, or resolves a data root.
    failure: Reuse the valid canonical selection, or if it is absent require the normal Product Control UI selection and remain non-ready without establishing another path authority.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.nimi-data-root
  - id: rule.nimi.platform.product-lifecycle.p-cold-010c
    kind: rule
    title: P-COLD-010 subject-scoped app storage
    modality: must_not
    statement: An app id becomes a positive storage key, a non-Runtime surface controls an app storage partition, or the displayed nimi_data skeleton admits immutable app release materialization before the source-defined 0P milestone.
    condition: When app storage beneath nimi_data is addressed or projected.
    failure: Reject the path or selector and require a Runtime-private Registered-App-Subject-scoped logical partition whose physical layout remains implementation detail.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.registered-app-subject
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.nimi-data-root
  - id: rule.nimi.platform.product-lifecycle.p-cold-011a
    kind: rule
    lifecycle: removed
    title: Retired first-run Local AI install levels
    reason: Removed because Minimal or Recommended Local AI setup is no longer part of the Product Control first-run or ready_for_use contract.
  - id: rule.nimi.platform.product-lifecycle.p-cold-011b
    kind: rule
    title: P-COLD-011 AI capability state is outside ordinary product entry
    modality: must_not
    statement: Local Text, STT, TTS, image, Cloud AI, AIProfile, AIConfig, Local Capability Configuration, machine selection, LocalAsset, ConnectorGrant, Driver, provider, model, probe, warm, or derived admission state gates ready_for_use or ordinary product entry.
    condition: When first run attempts to enter ordinary product use.
    failure: Evaluate only Product Control prerequisites, enter ready_for_use when they pass, and project any affected AI capability as separately blocked or selection-required without weakening product entry.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.first-run-lifecycle
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-cold-011c
    kind: rule
    title: P-COLD-011 no AI configuration as product readiness evidence
    modality: must_not
    statement: Cloud API, Profile recommendation, Local or Cloud route, ConnectorGrant, App-specific pack, model installation, dependency activation, health probe, provider connection test, or successful AI execution establishes or substitutes for ready_for_use.
    condition: When first-run readiness is evaluated.
    failure: Reject the AI evidence and evaluate only canonical Product Control prerequisites.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.first-run-lifecycle
  - id: rule.nimi.platform.product-lifecycle.p-cold-012a
    kind: rule
    title: P-COLD-012 ready entry target
    modality: must
    statement: After ready_for_use, Desktop opens ordinary product use at Chat to Nimi Chat while Home remains the feed surface rather than the ready entry target.
    condition: When first run completes successfully.
    failure: Keep the product out of ordinary entry until the canonical target can open.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.first-run-lifecycle
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-surface
  - id: rule.nimi.platform.product-lifecycle.p-cold-012b
    kind: rule
    title: P-COLD-012 authenticated ordinary shell
    modality: must_not
    statement: Desktop renders ordinary shell normal use while account state is not_logged_in or treats anonymous Runtime or debug posture as authenticated readiness.
    condition: Until a Runtime account-session projection exists.
    failure: Route the user to login or recovery-only state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-cold-013a
    kind: rule
    title: P-COLD-013 service-owned Runtime configuration
    modality: must
    statement: Production Runtime private configuration remains in service-owned protected state, the protected Home Host Contract carries only the canonical product-control data-root selection, Runtime independently validates account scope, ownership, and access, and protected state stores only derived references, managed roots, verification evidence, and audit without exposing physical paths or becoming a second product-control record; platform-specific protection mechanisms remain owner implementation.
    condition: When product control configures the Runtime data root.
    failure: Reject the update unless the canonical selection, protected operation, independent verification, and private-state boundary hold; on protected-state disagreement enter repair or fail closed without selecting or overriding dataRoot.path.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.nimi-data-root
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.runtime-service-configuration
  - id: rule.nimi.platform.product-lifecycle.p-cold-013b
    kind: rule
    title: P-COLD-013 Windows data-root access security
    modality: must
    statement: On Windows, first run preserves the user's ownership of the selected Nimi data root, grants only the minimum Runtime access needed for that selected tree, rejects substituted or unsafe roots, and requires independent Runtime identity, ownership, scope, and integrity verification before configuration or mutation.
    condition: When Windows first run prepares service access to selected nimi_data.
    failure: Fail closed to setup or repair before configuration or mutation when identity, ownership, scope, root integrity, least privilege, or Runtime verification fails.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.nimi-data-root
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.runtime-service-configuration
  - id: rule.nimi.platform.product-lifecycle.p-cold-013c
    kind: rule
    title: P-COLD-013 no alternate Runtime configuration truth
    modality: must_not
    statement: A renderer, broad service or user grant, test-only principal, retired record, cache, environment, request, imported configuration, credential, protected Runtime state, or evidence becomes Runtime private configuration truth or independently selects or overrides the canonical data root.
    condition: When production Runtime configuration or selected-root access is established or repaired.
    failure: Reject the source, grant, selection, or override; preserve the canonical product-control record as the selection authority and enter explicit repair or fail closed on disagreement.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.runtime-service-configuration
  - id: rule.nimi.platform.product-lifecycle.p-cold-014a
    kind: rule
    title: P-COLD-014 canonical first-run semantics
    modality: must
    statement: The canonical first-run state model explicitly records product states, entry conditions, allowed user actions, exit conditions, and user-facing copy floor.
    condition: Whenever first-run workflow semantics are defined or changed.
    failure: Reject an incomplete state model.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.first-run-lifecycle
  - id: rule.nimi.platform.product-lifecycle.p-cold-014b
    kind: rule
    title: P-COLD-014 Desktop consumes product-control semantics
    modality: must
    statement: Desktop first-run UI consumes canonical product-control state semantics and uses generic cold-start diagnostics only as secondary status.
    condition: When Desktop renders first run.
    failure: Reject a UI state that replaces the workflow with diagnostic status.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.first-run-lifecycle
  - id: rule.nimi.platform.product-lifecycle.p-cold-014c
    kind: rule
    title: P-COLD-014 no collapsed or technical first-run state
    modality: must_not
    statement: Desktop collapses first run into generic ready, available, or done states or presents technical enum names as primary user-facing copy.
    condition: When Desktop projects a first-run state.
    failure: Require the exact workflow state and admitted user-facing copy.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.first-run-lifecycle
  - id: rule.nimi.platform.product-lifecycle.p-cold-015a
    kind: rule
    title: P-COLD-015 readiness transition schema invariants
    modality: must
    statement: Every transition to ready_for_use validates only the canonical Product Control record shape, authenticated Runtime account, selected writable nimi_data root, and required Runtime service and protected-state availability; AI configuration, dependency materialization, machine selection, grant, admission, and execution are excluded.
    condition: When a product-control transition targets ready_for_use.
    failure: Reject the transition and retain or enter the precise repair or first-run state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-cold-015b
    kind: rule
    title: P-COLD-015 no readiness proxy
    modality: must_not
    statement: Runtime config, Desktop path cache, AIProfile, AIConfig, Local Capability Configuration, machine selection, ConnectorGrant, file existence, transfer completion, import success, endpoint probe, provider test, script exit, job success, or renderer-local state satisfies product readiness without the canonical ready_for_use Product Control record.
    condition: When product readiness is evaluated.
    failure: Reject the proxy and remain non-ready.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-cold-015c
    kind: rule
    lifecycle: removed
    title: Retired development lineage continuity
    reason: Removed with the parallel development checkpoint lineage; development candidates now use the fixed platform installation and current service state without signed-trial or acceptance-round continuity records.
  - id: rule.nimi.platform.product-lifecycle.p-cold-015d
    kind: rule
    title: P-COLD-015 Product Control survives service lifecycle
    modality: must_not
    statement: Runtime restart, fixed-candidate replacement, installer install or uninstall, an existing Product Control record, or a damaged record silently creates a fresh Product Control record or resets completed first run in place.
    condition: When Runtime or Desktop restarts, installs, uninstalls, replaces a development candidate, or encounters existing or damaged Product Control state.
    failure: Preserve valid completed Product Control state, use the normal repair state machine for damaged state, and require an explicit destructive Product Control reset to start again.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-cold-015e
    kind: rule
    lifecycle: removed
    title: Retired protected checkpoint identity inputs
    reason: Removed with checkpoint, profile, harness, and round identities; the active Product Control data-root rule independently rejects non-UI selection channels.
  - id: rule.nimi.platform.product-lifecycle.p-cold-015f
    kind: rule
    title: P-COLD-015 service consumers reuse canonical data-root selection
    modality: must
    statement: Runtime, Desktop, fixed development candidate installation, and product operations consume dataRoot.path only from the canonical Product Control record through the shared resolver; when that record has no valid selection, only the normal Product Control UI may select it through the exact typed operation.
    condition: When Runtime, Desktop, installation, update, or a product operation resolves the Nimi data root.
    failure: Reuse the valid canonical selection, or route an absent, invalid, or mismatched selection to normal setup or explicit repair without guessing, prompting from a non-UI channel, or recording another root.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.nimi-data-root
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-cold-015g
    kind: rule
    lifecycle: removed
    title: Retired isolated checkpoint evidence
    reason: Removed because checkpoint-specific profile, candidate, catalog-hash, manifest, and isolated-evidence records duplicated Product Control and Runtime readiness instead of proving a separate product decision.
  - id: rule.nimi.platform.product-lifecycle.p-cold-015h
    kind: rule
    lifecycle: removed
    title: Retired checkpoint product-bypass rule
    reason: Removed because the checkpoint profile and its parallel Product Control state no longer exist.
  - id: rule.nimi.platform.product-lifecycle.p-cold-016-owner
    kind: rule
    title: P-COLD-016 Runtime-owned finalization operation
    modality: must_not
    statement: Renderer or Desktop shell writes ready_for_use, performs Product Control validation, or writes the canonical Product Control record; bounded native operating-system helpers and any AI configuration or execution owner do not transfer this authority from the Runtime-owned typed Product Control finalization operation.
    condition: When final readiness is requested, validated, or persisted.
    failure: Reject the non-Runtime finalization and leave the product non-ready.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-cold-closure
    kind: rule
    title: P-COLD upstream authority remains fail closed
    modality: must_not
    statement: Home predicts or defaults any required upstream account, Runtime service, current local-development App identity or admission, or first-party integration authority to available before that owner projects its state, or adds AIProfile, AIConfig, machine selection, grant, or capability admission as a required upstream Product Control authority.
    condition: When a required upstream authority is not ready.
    failure: Project the corresponding precise non-ready state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.cold-start-state
  - id: rule.nimi.platform.product-lifecycle.p-mig-family
    kind: rule
    title: P-MIG governed-family admission
    modality: must_not
    statement: A new interactive-user local configuration file participates in ordinary readiness without an explicit family membership and schema owner, or Runtime service configuration or protected local-app state is treated as a member.
    condition: When a local configuration file is introduced or resolved.
    failure: Treat the file as ungoverned and deny ordinary readiness use.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.governed-local-config-family
  - id: rule.nimi.platform.product-lifecycle.p-mig-001
    kind: rule
    title: P-MIG-001 mandatory positive integer schema version
    modality: must
    statement: Every governed local configuration file has a root integer schemaVersion greater than zero as its migration-entry identity.
    condition: Whenever a governed file is read or admitted to ordinary readiness.
    failure: Treat a missing, non-integer, zero, or negative value as unknown schema and route it to typed repair.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.current-schema-repair
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.governed-local-config-family
  - id: rule.nimi.platform.product-lifecycle.p-mig-002
    kind: rule
    title: P-MIG-002 exact current-version read
    modality: must
    statement: A governed-file reader first compares schemaVersion with that file owner's current supported version, accepts only equality, and routes both older and unknown future versions to repair_required without automatic upgrade.
    condition: Whenever a governed file is read.
    failure: Fail closed to typed repair before ordinary readiness.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.current-schema-repair
  - id: rule.nimi.platform.product-lifecycle.p-mig-002b
    kind: rule
    title: P-MIG-002 no guessed schema recovery
    modality: must_not
    statement: A reader guesses repair for an unknown schemaVersion, fills default fields, degrades to partial availability, or projects best-effort state as ready.
    condition: When schemaVersion is unsupported or unknown.
    failure: Preserve the file and route to repair_required.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.current-schema-repair
  - id: rule.nimi.platform.product-lifecycle.p-mig-003a
    kind: rule
    title: P-MIG-003 shared current-schema framework
    modality: must
    statement: The governed family uses one shared current-schema validation and typed repair-routing framework that accepts only the owner-declared current version while leaving field schema, pointer validation, repair, and regeneration semantics to each file owner.
    condition: Whenever a governed file is validated or routed for repair.
    failure: Reject a divergent version gate or owner-boundary violation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.current-schema-repair
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.governed-local-config-family
  - id: rule.nimi.platform.product-lifecycle.p-mig-003b
    kind: rule
    title: P-MIG-003 read failures never write
    modality: must_not
    statement: Reading, parsing, version checking, or structural validation modifies a governed file, creates a backup, or writes default fields on failure.
    condition: During governed-file read or validation.
    failure: Leave on-disk state unchanged and return the typed repair outcome.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.current-schema-repair
  - id: rule.nimi.platform.product-lifecycle.p-mig-003c
    kind: rule
    title: P-MIG-003 schema bump requires prior owner authority
    modality: must
    statement: A real post-launch schema bump is preceded by the schema owner's admitted authority and migration packet, and older versions remain fail-closed to repair until then.
    condition: When a governed schema version changes.
    failure: Reject the bump and any old-version ordinary readiness path.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.current-schema-repair
  - id: rule.nimi.platform.product-lifecycle.p-mig-003f
    kind: rule
    title: P-MIG-003 no parallel schema upgrader
    modality: must_not
    statement: A second schema-upgrade implementation reads old versions, automatically fills fields, rewrites files, retains migration backups, or treats old versions as ordinary ready.
    condition: When a governed file uses the shared framework.
    failure: Remove the parallel path and route the old version to typed repair.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.current-schema-repair
  - id: rule.nimi.platform.product-lifecycle.p-mig-004a
    kind: rule
    title: P-MIG-004 typed repair routing
    modality: must
    statement: Parse failure, unknown schemaVersion, or an unresolved pointer to local configuration or nimi_data produces typed repair state rather than a raw renderer error; product control uses config_missing, repair_required, or blocked, and another governed file uses repair_required or blocked normalized to a product repair entry.
    condition: When a governed file cannot be safely read.
    failure: Fail closed before readiness and expose only the typed repair route.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.current-schema-repair
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-mig-004b
    kind: rule
    title: P-MIG-004 no silent pointer recreation
    modality: must_not
    statement: A reader silently recreates a broken pointer or modifies its file when doing so may orphan existing nimi_data, app, account, model, or dependency data.
    condition: When a governed-file pointer is broken.
    failure: Preserve disk state and route to repair_required or blocked until explicit repair confirms no orphaning.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.current-schema-repair
  - id: rule.nimi.platform.product-lifecycle.p-mig-005a
    kind: rule
    title: P-MIG-005 no-orphaning repair invariant
    modality: must
    statement: Every governed-file repair or rebuild preserves authoritative pointers to existing user, app, account, model, dependency, and environment data and fails closed to repair_required or blocked until an explicit impact-aware repair restores consistency.
    condition: When repair or rebuild could change a data pointer.
    failure: Stop before mutation and expose the typed repair state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.current-schema-repair
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.nimi-data-root
  - id: rule.nimi.platform.product-lifecycle.p-mig-005b
    kind: rule
    title: P-MIG-005 no empty-root recovery or ordinary relocation
    modality: must_not
    statement: Missing configuration is recovered with a default pointer to a new empty directory while a prior selected data root exists, or ordinary migration, reconnection, or pointer rewrite is offered before data-root relocation authority is admitted.
    condition: When configuration is missing or a prior data root is detected.
    failure: Enter blocked or repair_required without rewriting the pointer.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.current-schema-repair
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.nimi-data-root
  - id: rule.nimi.platform.product-lifecycle.p-mig-006a
    kind: rule
    title: P-MIG-006 canonical directory ownership
    modality: must
    statement: Every cleanup, deletion, or repair beneath nimi_data follows the canonical owner and cleanup rule for that first-level directory.
    condition: When any nimi_data subtree is mutated for cleanup, deletion, or repair.
    failure: Reject the operation when owner or cleanup policy does not authorize it.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.nimi-data-ownership
  - id: rule.nimi.platform.product-lifecycle.p-mig-006b
    kind: rule
    title: P-MIG-006 protected durable directory semantics
    modality: must
    statement: Models, dependencies, and environments change only through Runtime management or job paths; registered-App-subject-scoped data remains delete-only after record removal or tombstone until explicit user deletion; and durable account data requires explicit user, export, or delete policy.
    condition: When protected nimi_data content changes or its owning record is removed.
    failure: Deny an ownerless, implicit, or unconfirmed durable-data mutation.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.nimi-data-ownership
  - id: rule.nimi.platform.product-lifecycle.p-mig-006c
    kind: rule
    title: P-MIG-006 no renderer or uninstall bypass
    modality: must_not
    statement: Desktop shell, Support, or renderer directly mutates models, dependencies, or environments, or app uninstall implicitly deletes shared models, Runtime dependencies, account data, or another app's data.
    condition: When a UI surface cleans, repairs, or uninstalls local content.
    failure: Reject the bypass and route the operation to the owning management path.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.nimi-data-ownership
  - id: rule.nimi.platform.product-lifecycle.p-mig-007a
    kind: rule
    title: P-MIG-007 relocation requires admitted administration
    modality: must
    statement: Post-first-run data-root relocation exists only as an admitted Support or Admin capability with an owner, impact preview, typed state machine, pointer commit last, Runtime configuration resynchronization, and no-orphaning semantics.
    condition: When post-first-run data-root movement is proposed or performed.
    failure: Reject relocation until the complete administrative boundary is admitted.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.current-schema-repair
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.nimi-data-root
  - id: rule.nimi.platform.product-lifecycle.p-mig-007b
    kind: rule
    title: P-MIG-007 no ordinary relocation rewrite
    modality: must_not
    statement: Ordinary Desktop settings, renderer, or first-run product control implements post-first-run relocation as silent pointer rewrite, ordinary reselection, or silent Runtime configuration resynchronization.
    condition: When a user attempts to change data root after first run.
    failure: Deny the ordinary path and require the admitted Support or Admin capability.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.nimi-data-root
  - id: rule.nimi.platform.product-lifecycle.p-mig-008a
    kind: rule
    title: P-MIG-008 destructive cleanup confirmation floor
    modality: must
    statement: Cleanup that may delete user, app, or account data, including generated artifacts and release payloads, presents an impact preview and obtains explicit confirmation before execution while following the directory cleanup rule.
    condition: Before potentially destructive cleanup executes.
    failure: Block cleanup until preview, confirmation, and owner policy are satisfied.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.nimi-data-ownership
  - id: rule.nimi.platform.product-lifecycle.p-mig-008b
    kind: rule
    title: P-MIG-008 cache exception stays classified
    modality: must_not
    statement: A cleanup path deletes non-cache persistent user, app, or account data without impact preview and explicit confirmation; a cache or temporary cleanup bypasses its canonical cleanup classification even when confirmation is optional.
    condition: When cleanup executes.
    failure: Reject the deletion and preserve the data.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.nimi-data-ownership
  - id: rule.nimi.platform.product-lifecycle.p-home-001a
    kind: rule
    title: P-HOME-001 product-entry ownership split
    modality: must
    statement: Nimi Home owns the product entry and control contract while Desktop is its current replaceable host implementation; when a user creates a LocalAgent, Home first invokes the Realm-owned public PersonaCharacter creation path and uses the resulting Realm-issued Character Source to invoke Runtime-owned LocalAgent materialization; protected installer, service control, and OS integration use a Home Host Contract, and ordinary product capability continues through public SDK and Kit surfaces.
    condition: Whenever Nimi Home scope or ownership is defined.
    failure: Reject Desktop-only product ontology, host ownership of Realm or Runtime truth, or ordinary capability exposed only through a private Desktop API.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-surface
  - id: rule.nimi.platform.product-lifecycle.p-home-001b
    kind: rule
    title: P-HOME-001 no parallel Home kernel
    modality: must_not
    statement: A parallel .nimi/spec/home kernel is created.
    condition: Whenever Home authority is organized.
    failure: Reject the parallel authority surface.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-surface
  - id: rule.nimi.platform.product-lifecycle.p-home-001c
    kind: rule
    title: P-HOME-001 no second authority meaning for Home
    modality: must_not
    statement: The Nimi Home name is reused as a schema, registry, table-column, IPC-command, or file-path segment to create a second authority meaning.
    condition: Whenever a product identifier is introduced.
    failure: Reject the duplicate authority name.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-surface
  - id: rule.nimi.platform.product-lifecycle.p-home-002
    kind: rule
    title: P-HOME-002 hosted-shell binding
    modality: must_not
    statement: The Desktop-hosted shell rewrites Nimi Home product capability or makes Desktop identity an irreplaceable authority instead of implementing the Nimi Home Contract through the protected Home Host Contract and public SDK or Kit surfaces.
    condition: When Desktop renders or changes Nimi Home.
    failure: Reject the Desktop-local authority and retain the replaceable host owner split.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-surface
  - id: rule.nimi.platform.product-lifecycle.p-home-003
    kind: rule
    title: P-HOME-003 non-owner boundaries
    modality: must_not
    statement: Nimi Home owns installer execution, service-control truth, Runtime model or credential truth, LocalAgent materialization or execution truth, Runtime Conversation, Memory, or Knowledge truth, Realm Account, Character, World, or Source truth, Avatar rendering truth, App authorization truth, or protected OS-operation truth.
    condition: Whenever Nimi Home consumes or presents a cross-domain projection.
    failure: Reject Home ownership and require a neutral projection from the corresponding owner.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-surface
  - id: rule.nimi.platform.product-lifecycle.p-home-004
    kind: rule
    title: P-HOME-004 explicit Home placement boundaries
    modality: must
    statement: Desktop-owned shell placement projects exactly the defined Home placement set, and every surface declares its source authority and forbidden ownership rather than acting as an undeclared generic multi-authority surface.
    condition: Whenever a Home surface is registered or rendered.
    failure: Reject an unknown, ownerless, or generic surface.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-placement
  - id: rule.nimi.platform.product-lifecycle.p-home-005
    kind: rule
    title: P-HOME-005 Profile and AI configuration actions remain explicit
    modality: must_not
    statement: Home, first-run, shell, or first-party App treats a Profile recommendation as committed configuration, combines Apply Profile to AIConfig with Local Capability Configuration add, update, binding, selection, installation, or ConnectorGrant selection, or embeds hidden provider, connector, engine, or model defaults.
    condition: When Nimi Home presents or invokes a Profile or AI configuration action.
    failure: Reject the mixed or implicit write and require the applicable separate typed user action.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-surface
  - id: rule.nimi.platform.product-lifecycle.p-home-006
    kind: rule
    title: P-HOME-006 LocalAgent Conversation placement is non-owning
    modality: must_not
    statement: Home LocalAgent Conversation becomes more than an in-shell reference placement or owns transcript, history, chat-derived Memory, cross-app LocalAgent identity, grant, Memory, or Conversation truth.
    condition: When LocalAgent Conversation is placed or used in Nimi Home.
    failure: Reject the ownership and retain neutral projection from the corresponding owner.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-agent-chat
  - id: rule.nimi.platform.product-lifecycle.p-home-007
    kind: rule
    title: P-HOME-007 explicit Runtime AI context
    modality: must
    statement: Every LocalAgent conversation and other Nimi Home path invoking Runtime AI execution carries the explicit CapabilityContract request and canonical AIConfig owner context required for authorization and deterministic composition; it carries no caller-selected local target or inferred route.
    condition: Whenever Nimi Home invokes Runtime AI execution.
    failure: Reject execution before Runtime invocation when the required contract or owner context is absent or when caller-selected execution truth is supplied.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-agent-chat
  - id: rule.nimi.platform.product-lifecycle.p-home-008
    kind: rule
    title: P-HOME-008 no private implementation path
    modality: must_not
    statement: Nimi Home code imports Runtime internals, a Realm private client or private transport, or SDK private internals.
    condition: Whenever Nimi Home code accesses another layer.
    failure: Reject the import and require the public typed projection.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-surface
  - id: rule.nimi.platform.product-lifecycle.p-home-009a
    kind: rule
    title: P-HOME-009 Apps projection and label
    modality: must
    statement: Current Apps consumes local-development App identity, typed app-client projection, and Runtime-derived session, registration, and enforcement projection, exposes no public distribution or ordinary-user install, update, or repair flow, and uses Apps as the primary navigation label rather than Library or Discovery.
    condition: When the Apps surface is populated or labeled.
    failure: Reject an unbacked, public-lifecycle, or noncanonical primary-label projection.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-apps
  - id: rule.nimi.platform.product-lifecycle.p-home-009b
    kind: rule
    title: P-HOME-009 Apps does not own external truth
    modality: must_not
    statement: Apps owns admission, marketplace, economy, package-trust, or a second app-discovery truth plane.
    condition: Whenever Apps consumes or presents app information.
    failure: Reject the local truth and require the owning projection.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-apps
  - id: rule.nimi.platform.product-lifecycle.p-home-009c
    kind: rule
    title: P-HOME-009 ordinary visibility remains deferred
    modality: must_not
    statement: Apps derives or displays an ordinary-user-visible App entry from app-local specification, workspace source, registry or package data, or any other projection, including Avatar.
    condition: Until separate lifecycle authority activates public distribution and ordinary-user App installation.
    failure: Keep ordinary-user Apps visibility unavailable while preserving the explicit local-development flow.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-apps
  - id: rule.nimi.platform.product-lifecycle.p-home-009d
    kind: rule
    title: P-HOME-009 no displaced app truth or recursive naming
    modality: must_not
    statement: Hiding Avatar moves package, install, or update truth into LocalAgent Conversation, or the shell introduces a Home tab named Home as recursive authority.
    condition: When app truth is placed or Home navigation is named.
    failure: Reject the displaced truth or recursive name and retain the canonical owner and placement.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-apps
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-surface
  - id: rule.nimi.platform.product-lifecycle.p-home-010a
    kind: rule
    title: P-HOME-010 actionable product-control first screen
    modality: must
    statement: The first Nimi Home screen is actionable product control and, when cold-start state is fail closed, directly offers applicable settings, setup, account, Runtime health, or Apps controls.
    condition: When Nimi Home renders its first screen.
    failure: Replace the screen with an actionable fail-closed product-control surface.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.cold-start-state
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-surface
  - id: rule.nimi.platform.product-lifecycle.p-home-010b
    kind: rule
    title: P-HOME-010 no non-product first screen
    modality: must_not
    statement: The first Nimi Home screen is marketing copy, a landing page, or a third-party placeholder.
    condition: When Nimi Home renders its first screen.
    failure: Reject the screen and show actionable product control.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-surface
  - id: definition.nimi.platform.product-lifecycle.release-bundle
    kind: definition
    title: Nimi release bundle
    meaning: A Nimi release bundle is one coordinated atomic product release identity comprising the Desktop-host shell release, its exact signed Runtime service release compatibility, and admitted version, update-channel, signature, and rollback metadata.
  - id: definition.nimi.platform.product-lifecycle.update-channel
    kind: definition
    title: Nimi update channel
    meaning: A Nimi update channel is the Platform-owned stable or beta release identity together with its configured updater endpoint, verification public-key policy, compatibility gates, and rollback policy.
  - id: definition.nimi.platform.product-lifecycle.web-release-surface
    kind: definition
    title: Web release surface
    meaning: The Web release surface consists of the first-party Nimi site and web-shell adapters under apps/web and the release-distribution gateway under apps/install-gateway, while the independently owned Simulator remains a separate product and artifact.
  - id: definition.nimi.platform.product-lifecycle.first-party-app-registration
    kind: definition
    lifecycle: removed
    title: First-party app registration
    reason: Removed because public App registry, trust, distribution, and ordinary-user lifecycle are deferred; current local first-party identity and admission do not reserve a registry-backed lifecycle contract.
  - id: definition.nimi.platform.product-lifecycle.first-party-migration-state
    kind: definition
    lifecycle: removed
    title: First-party migration state
    reason: Removed because the pre-release hard cut retains no first-party dual track or migration product state, while ordinary-user App lifecycle remains deferred.
  - id: rule.nimi.platform.product-lifecycle.p-supd-001
    kind: rule
    title: P-SUPD-001 Platform owns self-update policy
    modality: must
    statement: Platform exclusively owns Nimi self-update policy, update-channel identity, trust posture, compatibility gates, and rollback policy; Desktop, Home, SDK consumers, and first-party apps do not create alternatives, and Runtime materializers do not install models or local dependencies through self-update.
    condition: Whenever Nimi self-update policy or execution is defined.
    failure: Reject the non-Platform policy or materializer operation and leave update state fail closed.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.update-channel
  - id: rule.nimi.platform.product-lifecycle.p-supd-002
    kind: rule
    title: P-SUPD-002 Home owns the self-update user surface
    modality: must
    statement: Nimi Home owns user-facing update discovery, consent, progress, restart, rollback, and diagnostic projection while consuming rather than inventing channel, endpoint, public-key, and fail-closed policy.
    condition: Whenever self-update is presented to a user.
    failure: Reject the non-Home surface or locally invented policy and project the precise unavailable or failure state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-surface
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.update-channel
  - id: rule.nimi.platform.product-lifecycle.p-supd-003
    kind: rule
    title: P-SUPD-003 Runtime owns daemon handoff
    modality: must
    statement: Runtime owns daemon lifecycle handoff, stop, start, restart status, and post-update local health, but self-update handoff does not replace selected-source-record, model-catalog, or local-dependency updates.
    condition: When Nimi self-update hands off or evaluates the Runtime service.
    failure: Stop the update and expose the exact handoff or health failure without mutating local-environment truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.runtime-service-configuration
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.update-channel
  - id: rule.nimi.platform.product-lifecycle.p-supd-004
    kind: rule
    title: P-SUPD-004 app and product updates stay distinct
    modality: must_not
    statement: Nimi self-update substitutes for an app-package update, or an app-package update substitutes for Nimi self-update.
    condition: Whenever a product or app update is selected or applied.
    failure: Reject the cross-surface update and route it to its owning update surface.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-apps
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.release-bundle
  - id: rule.nimi.platform.product-lifecycle.p-supd-005
    kind: rule
    title: P-SUPD-005 self-update does not mutate local-environment truth
    modality: must_not
    statement: Nimi self-update mutates the Runtime-owned selected source record, local-environment dependency state, or model and dependency download, verification, promotion, or activation truth.
    condition: During any self-update operation.
    failure: Reject the mutation and preserve the independently owned local-environment state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.update-channel
  - id: rule.nimi.platform.product-lifecycle.p-supd-006
    kind: rule
    title: P-SUPD-006 self-update fails closed
    modality: must
    statement: Missing release evidence, verification failure, signature mismatch, required rollback, unreachable daemon handoff, or failed compatibility produces an explicit failed, rollback-required, verification-failed, unsupported, or stale-projection state rather than silent update, skipped verification, or latest-as-ready projection.
    condition: When any self-update prerequisite or operation fails.
    failure: Stop update progression and project the precise fail-closed state and reason class.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-surface
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.update-channel
  - id: rule.nimi.platform.product-lifecycle.p-supd-007a
    kind: rule
    title: P-SUPD-007 Desktop implementation is subordinate
    modality: must
    statement: Desktop-hosted update mechanics remain an implementation layer beneath Platform product self-update policy and preserve signed compatibility with the independently installed Runtime service; Desktop update contracts never become a peer policy owner.
    condition: Whenever Desktop implements or describes Nimi self-update.
    failure: Reject the peer owner or incompatible implementation and retain Platform policy ownership.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.release-bundle
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.update-channel
  - id: rule.nimi.platform.product-lifecycle.p-supd-007b
    kind: rule
    title: P-SUPD-007 Runtime service update custody
    modality: must_not
    statement: A Desktop bundle, host framework, renderer, or Kit component carries, stages, executes, selects, or probes a production Runtime binary, or installs, updates, rolls back, or activates Runtime outside the signed service installer or updater and operating-system service manager.
    condition: When a production Runtime release is installed, updated, rolled back, or activated.
    failure: Reject the payload or operation and preserve the existing verified Runtime service.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.release-bundle
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.runtime-service-configuration
  - id: rule.nimi.platform.product-lifecycle.p-supd-008
    kind: rule
    title: P-SUPD-008 no Web self-update path
    modality: must_not
    statement: The current Web release surface presents or executes a Web self-update path.
    condition: Unless future canonical authority explicitly admits Web self-update.
    failure: Reject the path as unsupported and return a fail-closed state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.web-release-surface
  - id: rule.nimi.platform.product-lifecycle.p-pkgrel-001
    kind: rule
    title: P-PKGREL-001 Nimi is the only installable product name
    modality: must
    statement: Nimi is the only user-facing installable product identity; Desktop does not become product identity in UI, package metadata, manifests, channels, registry schemas, or IPC names, and Launcher remains only an internal capability-category term.
    condition: Whenever installable-product identity is named or serialized.
    failure: Reject the non-Nimi identity from the product surface.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.release-bundle
  - id: rule.nimi.platform.product-lifecycle.p-pkgrel-002
    kind: rule
    title: P-PKGREL-002 atomic release identity
    modality: must
    statement: Every Nimi installation or update preserves one atomic release identity across the Desktop-host shell, exact signed Runtime compatibility, and admitted release metadata, and no hot patch, partial replacement, or out-of-band Runtime replacement may produce an unsynchronized identity.
    condition: Whenever a Nimi release is assembled, installed, or updated.
    failure: Reject or roll back the release before activation when atomic identity or compatibility is not preserved.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.release-bundle
  - id: rule.nimi.platform.product-lifecycle.p-pkgrel-003
    kind: rule
    title: P-PKGREL-003 closed release channels
    modality: must
    statement: Product release-channel identity is limited to stable and beta, and UI, SDK, and apps consume that identity without creating channel strings as product truth.
    condition: Whenever a release channel is selected, emitted, or consumed.
    failure: Reject an unknown or locally invented channel identity.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.update-channel
  - id: rule.nimi.platform.product-lifecycle.p-pkgrel-004
    kind: rule
    title: P-PKGREL-004 updater endpoint and public-key policy
    modality: must
    statement: Platform owns updater endpoint and public-key configuration; key rotation requires explicit canonical admission of its rotation signal, grace window, and old-key invalidation condition, and builders, Runtime, SDKs, and apps cannot dynamically inject or switch either policy.
    condition: Whenever updater trust configuration is established or rotated.
    failure: Reject the unadmitted endpoint, key, rotation, or dynamic override and stop update verification.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.update-channel
  - id: rule.nimi.platform.product-lifecycle.p-pkgrel-005
    kind: rule
    title: P-PKGREL-005 install gateway handoff boundary
    modality: must
    statement: The Web install gateway distributes Nimi packages and verification material and hands off to the native installer, but does not materialize Runtime environments, install models or dependencies, persist selected-source state, or mutate PATH, shell profiles, system Python, system CUDA, or package-manager global state.
    condition: Whenever the Web install gateway handles installation.
    failure: Reject the out-of-scope mutation and keep installation unstarted or failed.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.release-bundle
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.web-release-surface
  - id: rule.nimi.platform.product-lifecycle.p-pkgrel-006
    kind: rule
    title: P-PKGREL-006 release failures expose reason classes
    modality: must
    statement: Every release or update failure exposes an explicit Nimi Home fail-closed state traceable to a specific reason class rather than hiding the failure behind a generic latest-version-unavailable field.
    condition: Whenever a release or update path fails.
    failure: Keep the release inactive and project the specific failure state and reason class.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-surface
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.release-bundle
  - id: rule.nimi.platform.product-lifecycle.p-pkgrel-007
    kind: rule
    title: P-PKGREL-007 three update surfaces remain distinct
    modality: must_not
    statement: Nimi self-update, app updates, or Runtime local-dependency updates silently mutates either other update surface's source of truth.
    condition: Whenever any of the three update surfaces operates.
    failure: Reject the cross-surface mutation and preserve each owner's prior truth.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.home-apps
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.update-channel
  - id: rule.nimi.platform.product-lifecycle.p-pkgrel-008
    kind: rule
    title: P-PKGREL-008 no packaging identity split
    modality: must_not
    statement: Packaging, release, and update identity is split into an unrecorded subordinate owner, or a Web-only installation or update identity is introduced without explicit canonical Web release admission.
    condition: Whenever release ownership or a new release form is introduced.
    failure: Reject the split or new identity until canonical admission exists.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.release-bundle
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.web-release-surface
  - id: rule.nimi.platform.product-lifecycle.p-web-001a
    kind: rule
    title: P-WEB-001 Web surface ownership
    modality: must
    statement: The first-party Web site, static legal pages, Cloudflare function adapters, and web-shell adapters remain Platform-owned release surfaces rather than app-local subordinate specification truth.
    condition: Whenever Web release ownership is assigned.
    failure: Reject the app-local owner and retain Platform ownership.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.web-release-surface
  - id: rule.nimi.platform.product-lifecycle.p-web-001b
    kind: rule
    title: P-WEB-001 Simulator remains independent
    modality: must_not
    statement: Web becomes the Simulator shell, module registry, state engine, source materializer, build owner, or evidence owner instead of exposing only a typed navigation link to the independent deployment.
    condition: When Web links to or integrates with the Simulator.
    failure: Reject the ownership merge and preserve separate products and artifacts.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.web-release-surface
  - id: rule.nimi.platform.product-lifecycle.p-web-002a
    kind: rule
    title: P-WEB-002 public Web adapter boundary
    modality: must_not
    statement: Web shell mode imports Tauri APIs, Desktop-private renderer aliases, Runtime internals, local-filesystem behavior, Desktop CORS bypass, or private IPC instead of public-for-Web surfaces, Web adapters, and native browser fetch.
    condition: Whenever Web shell mode consumes a Desktop-shaped capability.
    failure: Reject the private capability and return unsupported when no public adapter exists.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.web-release-surface
  - id: rule.nimi.platform.product-lifecycle.p-web-002b
    kind: rule
    title: P-WEB-002 unsupported Desktop release behavior fails closed
    modality: must
    statement: Unsupported Desktop-only release and self-update operations return an explicit unsupported state rather than pseudo-success in Web shell mode.
    condition: When Web shell mode encounters a Desktop-only release operation.
    failure: Reject the operation and preserve the unsupported state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.web-release-surface
  - id: rule.nimi.platform.product-lifecycle.p-web-002c
    kind: rule
    title: P-WEB-002 client-only browser boundary
    modality: must
    statement: Web shell bootstrap is client-only without server-side rendering or service-worker cache, uses same-origin deployment unless an admitted adapter supplies another origin, replaces native deep links with browser OAuth redirect, and keeps raw bearer tokens memory-only while persisting only non-sensitive session metadata.
    condition: Whenever Web shell mode bootstraps or authenticates.
    failure: Reject the unsupported bootstrap, unadmitted origin, native deep link, or persistent raw token.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.web-release-surface
  - id: rule.nimi.platform.product-lifecycle.p-web-002d
    kind: rule
    title: P-WEB-002 Simulator is not a shell mode
    modality: must_not
    statement: Web adds Simulator to the Desktop-or-Web shell-mode identity, imports selected Simulator app source, or merges Web and Simulator into one module graph.
    condition: Whenever shell modes or Web build inputs are defined.
    failure: Reject the mode or import and preserve separate artifacts.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.web-release-surface
  - id: rule.nimi.platform.product-lifecycle.p-web-003
    kind: rule
    title: P-WEB-003 install gateway ownership
    modality: must
    statement: The install gateway owns install scripts, platform manifests, updater metadata, and release-feed projection, obtains release data from the admitted GitHub release source, validates platform archive checksums explicitly, and never treats generated distribution copies as source truth.
    condition: Whenever release distribution data is produced or served.
    failure: Reject unadmitted, unchecked, or generated-copy truth and fail distribution closed.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.web-release-surface
  - id: rule.nimi.platform.product-lifecycle.p-web-004a
    kind: rule
    title: P-WEB-004 Cloudflare adapters do not invent truth
    modality: must_not
    statement: A Cloudflare Worker or Pages function under Web or the install gateway invents Runtime, SDK, account-service, Desktop, or release truth outside an admitted source contract.
    condition: Whenever a Cloudflare adapter proxies or projects data.
    failure: Reject the projection and return an explicit unavailable or upstream-failure state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.web-release-surface
  - id: rule.nimi.platform.product-lifecycle.p-web-004b
    kind: rule
    title: P-WEB-004 Simulator deployment separation
    modality: must_not
    statement: Simulator relies on a Cloudflare function as a hidden real-capability backend, or cross-origin navigation merges its build, credentials, content-security policy, environment schema, or release evidence with Web.
    condition: When Simulator and Web are deployed or linked.
    failure: Reject the hidden backend or merged deployment authority and preserve independent artifacts.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.web-release-surface
  - id: rule.nimi.platform.product-lifecycle.p-fpi-001
    kind: rule
    lifecycle: removed
    title: P-FPI-001 registered first-party hardcut targets only
    reason: Removed with registry-backed first-party lifecycle; current local first-party identities are admitted by their owning identity projection rather than registry rows.
  - id: rule.nimi.platform.product-lifecycle.p-fpi-002
    kind: rule
    lifecycle: removed
    title: P-FPI-002 single registry and typed lifecycle client
    reason: Removed because ordinary-user App installation, update, uninstall, health, and repair are deferred and no registry-backed lifecycle client is current.
  - id: rule.nimi.platform.product-lifecycle.p-fpi-003
    kind: rule
    lifecycle: removed
    title: P-FPI-003 first-party AI profile hint consumption
    reason: Removed with the deferred registry row and AI-profile hint contract; current AI configuration remains governed by its owning typed configuration authority.
  - id: rule.nimi.platform.product-lifecycle.p-fpi-004
    kind: rule
    lifecycle: removed
    title: P-FPI-004 first-party permission classification
    reason: Removed as a registry-specific duplicate; current protected operations and permissions remain fail closed under their owning Runtime and Platform authorities.
  - id: rule.nimi.platform.product-lifecycle.p-fpi-005
    kind: rule
    lifecycle: removed
    title: P-FPI-005 Runtime registration relationship
    reason: Removed because no current registry-declared app-managed launch relationship is admitted; local first-party identity and protected session ownership remain separate current contracts.
  - id: rule.nimi.platform.product-lifecycle.p-fpi-006a
    kind: rule
    lifecycle: removed
    title: P-FPI-006 Avatar admission and visibility
    reason: Removed with the registry row and ordinary Apps visibility contract; Avatar remains a local first-party projection Consumer under its owning authority.
  - id: rule.nimi.platform.product-lifecycle.p-fpi-006b
    kind: rule
    lifecycle: removed
    title: P-FPI-006 Avatar registers before protected reads
    reason: Removed because registry-backed launch registration is not current; protected reads still require verified local first-party identity and owning fail-closed projections.
  - id: rule.nimi.platform.product-lifecycle.p-fpi-007
    kind: rule
    lifecycle: removed
    title: P-FPI-007 no standalone ordinary-user truth
    reason: Removed because ordinary-user App lifecycle and registry ownership are deferred; current scope admits only the explicit local-development flow.
  - id: rule.nimi.platform.product-lifecycle.p-fpi-008
    kind: rule
    lifecycle: removed
    title: P-FPI-008 Avatar kernel authority stays canonical
    reason: Removed as a registry and migration integration duplicate; canonical Avatar ownership remains governed directly by the Avatar authority.
  - id: rule.nimi.platform.product-lifecycle.p-fpm-002
    kind: rule
    lifecycle: removed
    title: P-FPM-002 closed fail-closed migration states
    reason: Removed with the first-party migration state set; no migration projection remains current.
  - id: rule.nimi.platform.product-lifecycle.p-fpm-003
    kind: rule
    lifecycle: removed
    title: P-FPM-003 no silent user-state reset
    reason: Removed with the migration path; the pre-release hard cut does not retain a reset, compatibility loader, or automatic migration product behavior.
  - id: rule.nimi.platform.product-lifecycle.p-fpm-004
    kind: rule
    lifecycle: removed
    title: P-FPM-004 source-development marker boundary
    reason: Removed as a registry-migration rule; current local-development admission is governed directly by host and protected-session configuration.
  - id: rule.nimi.platform.product-lifecycle.p-fpm-005
    kind: rule
    lifecycle: removed
    title: P-FPM-005 zero dual-track after cutover
    reason: Removed because no ordinary-user dual track or Nimi-managed registry variant remains current after the pre-release hard cut.
  - id: rule.nimi.platform.product-lifecycle.p-cold-014-not-logged-in
    kind: rule
    title: P-COLD-014 not_logged_in transition closure from first-run-state-machine
    modality: must
    statement: The not_logged_in state is entered only when no authenticated Runtime account-session projection exists, permits only sign_in and admitted recovery, exits only when an authenticated account session exists, and presents copy no weaker than Sign in to use Nimi.
    condition: Whenever first run evaluates or renders not_logged_in.
    failure: Reject any other entry, action, exit, or weaker copy and remain not_logged_in.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.first-run-lifecycle
  - id: rule.nimi.platform.product-lifecycle.p-cold-014-config-missing
    kind: rule
    title: P-COLD-014 config_missing transition closure from first-run-state-machine
    modality: must
    statement: The config_missing state is entered only when the canonical product-control record is missing or unparsable, permits no user action, exits only after creating a valid empty product-control record or enters blocked, and presents copy no weaker than Nimi is creating its local product record.
    condition: Whenever first run evaluates or renders config_missing.
    failure: Reject any other entry, action, exit, or weaker copy and remain config_missing or enter blocked.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-cold-014-data-root-missing
    kind: rule
    title: P-COLD-014 data_root_missing transition closure from first-run-state-machine
    modality: must
    statement: The data_root_missing state is entered only when product control exists without a valid nimi_data root, permits only folder choice, storage-role review, and confirmation, exits only after absolute writable selection, exact service-principal access preparation, independent Runtime verification, canonical recording, and required-directory creation, and presents copy no weaker than Choose where Nimi stores models, apps, and large local data.
    condition: Whenever first run evaluates or renders data_root_missing.
    failure: Reject any other entry, action, exit, or weaker copy and remain data_root_missing.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.nimi-data-root
  - id: rule.nimi.platform.product-lifecycle.p-cold-014-data-root-selected
    kind: rule
    title: P-COLD-014 data_root_selected transition closure from first-run-state-machine
    modality: must
    statement: The data_root_selected state is entered only when nimi_data is recorded and writable but Product Control finalization has not completed, permits validation retry and data-root change, and exits to ready_for_use when the account, record, data root, Runtime service, and protected state validate or to the precise repair or blocked state on failure without evaluating AI capability configuration or readiness.
    condition: Whenever first run evaluates or renders data_root_selected.
    failure: Reject any other entry, action, exit, or weaker copy and remain data_root_selected or enter the precise failure state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.first-run-lifecycle
  - id: rule.nimi.platform.product-lifecycle.p-cold-014-ai-environment-unconfigured
    kind: rule
    lifecycle: removed
    title: Retired ai_environment_unconfigured first-run state
    reason: Removed because AI environment configuration is orthogonal to Product Control first run and ready_for_use.
  - id: rule.nimi.platform.product-lifecycle.p-cold-014-assets-missing
    kind: rule
    lifecycle: removed
    title: Retired local_ai_profile_selected_assets_missing first-run state
    reason: Removed because missing LocalAssets block only affected Local capability admission and no longer block Product Control first run.
  - id: rule.nimi.platform.product-lifecycle.p-cold-014-environment-not-ready
    kind: rule
    lifecycle: removed
    title: Retired local_ai_profile_selected_environment_not_ready first-run state
    reason: Removed because Local execution environment state is Runtime-private or capability-specific and no longer blocks Product Control first run.
  - id: rule.nimi.platform.product-lifecycle.p-cold-014-assets-downloaded
    kind: rule
    lifecycle: removed
    title: Retired local_ai_assets_downloaded_environment_not_ready first-run state
    reason: Removed because Local dependency activation state no longer participates in Product Control first run.
  - id: rule.nimi.platform.product-lifecycle.p-cold-014-local-ai-ready
    kind: rule
    lifecycle: removed
    title: Retired local_ai_ready first-run state
    reason: Removed because the product exposes no aggregate Local AI readiness state and capability admission is evaluated per request.
  - id: rule.nimi.platform.product-lifecycle.p-cold-014-repair-required
    kind: rule
    title: P-COLD-014 repair_required transition closure from first-run-state-machine
    modality: must
    statement: The repair_required state is entered only when a previously valid required component is missing, stale, corrupted, unverifiable, or inconsistent, permits only repair, retry, log export, and admitted data-root migration, exits only to the appropriate setup state or ready_for_use after the component is restored and rechecked, and presents copy no weaker than Nimi needs to repair a required local component before normal use.
    condition: Whenever first run evaluates or renders repair_required.
    failure: Reject any other entry, action, exit, or weaker copy and remain repair_required.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.first-run-lifecycle
  - id: rule.nimi.platform.product-lifecycle.p-cold-014-blocked
    kind: rule
    title: P-COLD-014 blocked transition closure from first-run-state-machine
    modality: must
    statement: The blocked state is entered only when Nimi cannot safely create product control, use the data root, validate account or session, or materialize the baseline, permits only available retry, relevant alternate-root choice, log export, and support, exits only after resolving the cause and re-evaluating from the earliest affected state, and presents copy no weaker than Nimi cannot continue safely yet.
    condition: Whenever first run evaluates or renders blocked.
    failure: Reject any other entry, action, exit, or weaker copy and remain blocked.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.first-run-lifecycle
  - id: rule.nimi.platform.product-lifecycle.p-cold-014-ready-for-use
    kind: rule
    title: P-COLD-014 ready_for_use transition closure from first-run-state-machine
    modality: must
    statement: The ready_for_use state is entered only by atomic backend Product Control admission after validating the record shape, authenticated Runtime account session, selected writable nimi_data, and required Runtime service and protected state, permits ordinary Nimi use including separate AI setup actions, and exits only when one of those Product Control inputs routes to setup, repair_required, blocked, or not_logged_in.
    condition: Whenever first run evaluates or renders ready_for_use.
    failure: Reject any other entry, action, exit, or weaker copy and retain or enter the precise non-ready state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-cold-014-forbidden-ready-inputs
    kind: rule
    title: P-COLD-014 closed forbidden readiness inputs from first-run-state-machine
    modality: must_not
    statement: Renderer-local state, localStorage, AIProfile, AIConfig, Local Capability Configuration, machine selection, LocalAsset, ConnectorGrant, Runtime route or process health, endpoint probe, provider connection test, file existence, AI job outcome, Cloud API, model pack, or App-specific pack establishes ready_for_use.
    condition: Whenever first-run readiness is evaluated.
    failure: Reject the positive input and remain in the earliest affected non-ready state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-cold-015-wire-shape
    kind: rule
    title: P-COLD-015 product-control-record-schema required wire shape
    modality: must
    statement: Product control uses schemaVersion 1 and requires schemaVersion, installId, productVersion, state, dataRoot, firstRun, pointers, and repair as top-level fields.
    condition: Whenever the product-control record is created, read, transitioned, or persisted.
    failure: Reject the record and route to config_missing, repair_required, or blocked.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-cold-015-data-root-wire-shape
    kind: rule
    title: P-COLD-015 product-control-record-schema dataRoot wire shape
    modality: must
    statement: Product control requires dataRoot in every state from data_root_selected through ready_for_use, with absolute user-selected path, status limited to selected, ready, or repair_required, selectedAt selection timestamp, and verifiedAt writability and directory-verification timestamp.
    condition: Whenever product control is in a state that requires dataRoot.
    failure: Reject the record and remain in or enter the precise data-root or repair state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-cold-015-first-run-wire-shape
    kind: rule
    title: P-COLD-015 product-control-record-schema firstRun wire shape
    modality: must
    statement: The firstRun object carries only Product Control completion truth and timestamps required by its current schema; it contains no installLevel, aiProfileAlias, AIProfile reference, AIConfig reference, Local Capability Configuration reference, machine selection, LocalAsset, ConnectorGrant, or AI readiness evidence, and ready_for_use requires completed=true with non-empty completedAt.
    condition: Whenever the product-control firstRun object is created, validated, or persisted.
    failure: Reject the invalid object and remain in or enter the precise first-run or repair state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-cold-015-record-identity
    kind: rule
    title: P-COLD-015 product-control-record-schema installId immutability
    modality: must_not
    statement: Runtime or Desktop restart, fixed-candidate replacement, update, or installer install changes installId, resets grants, abandons selected payloads, or creates a fresh Product Control record without an explicit destructive Product Control repair or reset.
    condition: When an existing Product Control record is resumed, repaired, or used after service installation, replacement, or update.
    failure: Reject the replacement and preserve the existing installId and Product Control record.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-cold-015-ready-write
    kind: rule
    title: P-COLD-015 product-control-record-schema atomic readiness writes
    modality: must
    statement: A ready_for_use write is atomic with firstRun.completed true and completedAt, failed Product Control validation leaves the earliest affected non-ready state, and later loss of the authenticated account session, selected data root, required Runtime service, or protected state routes to the precise setup, repair_required, blocked, or not_logged_in state without evaluating AI capability state.
    condition: Whenever readiness is written, retried, repaired, or invalidated.
    failure: Reject the write or retry and preserve the precise non-ready state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-cold-016-composition-order
    kind: rule
    title: P-COLD-016 product-control-record-schema readiness composition order
    modality: must
    statement: Product Control admission validates record shape and selected data root, authenticated Runtime account session, required Runtime service and protected state, and the atomic record write in that order, with every AI configuration, selection, dependency, grant, admission, probe, and execution fact excluded.
    condition: Whenever the backend admits ready_for_use.
    failure: Reject out-of-order or incomplete admission and retain the earliest affected non-ready state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-cold-015-data-root-proposal
    kind: rule
    title: P-COLD-015 no alternate data-root authority
    modality: must_not
    statement: An updater, installer, CLI, environment variable, argv field, endpoint, request, home-derived guess, test input, or dataRootProposal field becomes a second data-root locator, proposal authority, selection authority, or persisted Product Control field.
    condition: When development, installation, update, test, or product code resolves or carries a data root.
    failure: Reject the alternate channel and use only the canonical Product Control record through the shared resolver, with the normal Product Control UI as the sole initial selection surface.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.nimi-data-root
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.product-control-record
  - id: rule.nimi.platform.product-lifecycle.p-cold-015-account-profile-ref
    kind: rule
    lifecycle: removed
    title: P-COLD-015 product-control-record-schema accountDefaultProfileRef projection
    reason: Product readiness no longer stores or verifies an Account Default Profile proof reference; profiles remain ordinary product configuration outside Product Control admission.
  - id: rule.nimi.platform.product-lifecycle.p-cold-015-built-in-config-refs
    kind: rule
    lifecycle: removed
    title: P-COLD-015 product-control-record-schema builtInAiConfigRefs projection
    reason: Product readiness no longer stores or verifies built-in AIConfig proof references; scope configuration is initialized and validated by its ordinary product owner when consumed.
  - id: rule.nimi.platform.product-lifecycle.p-cold-015-runtime-baseline-ref
    kind: rule
    lifecycle: removed
    title: P-COLD-015 product-control-record-schema runtimeBaselineRef projection
    reason: Product readiness consumes current Runtime materialization and activation-gate state directly and no longer mints or persists a duplicate baseline proof reference.
  - id: rule.nimi.platform.product-lifecycle.p-cold-015-execution-evidence-ref
    kind: rule
    lifecycle: removed
    title: P-COLD-015 product-control-record-schema executionEvidenceRef projection
    reason: Product readiness no longer runs baseline capabilities to mint a durable proof; ordinary execution failures are handled by the owning feature after current Runtime activation readiness is admitted.
  - id: rule.nimi.platform.product-lifecycle.p-mig-006-directory-declarations
    kind: rule
    title: P-MIG-006 nimi-data-directory-ownership declaration closure
    modality: must
    statement: Every first-level nimi_data directory declares one canonical owner and one cleanup rule before any cleanup, deletion, or repair operation is admitted.
    condition: Whenever a first-level nimi_data directory or its mutation policy is defined.
    failure: Reject an ownerless or cleanup-rule-free directory and every operation against it.
    relations:
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.nimi-data-ownership
