format: nimicoding.authority/v2
owner: team.platform
scope: platform.governance-release
units:
  - id: definition.nimi.platform.governance-release.release-promise
    kind: definition
    title: P-GOV-026 release promise from release-promise-freeze
    meaning: A release promise is a public product claim indexed by Platform while its canonical capability semantics, ownership, and failure behavior remain exclusively with the referenced owner domain.
  - id: definition.nimi.platform.governance-release.promise-posture
    kind: definition
    title: P-GOV-026 promise posture and login requirement vocabularies
    meaning: Promise posture has the closed values supported, partial, unsupported, and deferred, while login requirement has the closed values realm_login_required, local_runtime_allowed, anonymous_projection_only, and not_applicable.
  - id: definition.nimi.platform.governance-release.degraded-mode
    kind: definition
    title: P-GOV-026 Realm-unavailable degraded mode
    meaning: Degraded mode is the explicit Realm-unavailable posture in which reachable local Runtime AI and current-renderer local-agent interaction may continue without converting local state or pending intent into Realm, social, economy, synchronization, or account truth.
  - id: rule.nimi.platform.governance-release.p-gov-026-positioning
    kind: rule
    title: Nimi public product positioning
    modality: must
    statement: Public positioning connects Nimi’s cross-terminal AI foundation direction to its current installable, open-source, local-first personal AI product and App ecosystem, with Home as an entry, Realm as ecosystem identity owner and Runtime as executor of local and cloud capabilities. Characters, conversations, creations, stories and worlds remain experiences within Nimi. Public claims distinguish the current PC Runtime and native/remote consumers, current native App lifecycle availability and exact remote carrier availability, without copying another domain’s capability or lifecycle truth into this release-promise index. A source implementation, dependency version or build does not establish product acceptance or released artifact support; supported, partial, unsupported and deferred claims retain their existing owner, login, failure and verification requirements.
    condition: Whenever public Nimi positioning is published for the release.
    failure: Correct copy that collapses Nimi into Runtime, equates Nimi Home with Desktop, promotes one experience to the product category, omits an admitted App lifecycle path, presents an unavailable App path as current behavior, or assigns its owner truth to the release-promise index.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.native-lifecycle-availability
      - type: applies_to
        target: definition.nimi.platform.core-protocol.cross-terminal-platform
      - type: applies_to
        target: definition.nimi.platform.core-protocol.current-runtime-topology
      - type: applies_to
        target: definition.nimi.platform.governance-release.release-promise
  - id: rule.nimi.platform.governance-release.p-gov-026-posture-values
    kind: rule
    title: P-GOV-026 closed posture_values from release-promise-freeze
    modality: must
    statement: Every release promise uses exactly one posture from supported, partial, unsupported, or deferred.
    condition: Whenever a release promise is classified or published.
    failure: Reject an absent or unknown posture and withhold the promise from publication.
    relations:
      - type: applies_to
        target: definition.nimi.platform.governance-release.promise-posture
  - id: rule.nimi.platform.governance-release.p-gov-026-login-requirement-values
    kind: rule
    title: P-GOV-026 closed login_requirement_values from release-promise-freeze
    modality: must
    statement: Every release promise uses exactly one login requirement from realm_login_required, local_runtime_allowed, anonymous_projection_only, or not_applicable.
    condition: Whenever a release promise is classified or published.
    failure: Reject an absent or unknown login requirement and withhold the promise from publication.
    relations:
      - type: applies_to
        target: definition.nimi.platform.governance-release.promise-posture
  - id: rule.nimi.platform.governance-release.p-gov-026-owner-boundary
    kind: rule
    title: P-GOV-026 promise boundary from release-promise-freeze
    modality: must
    statement: Every public promise matches the canonical semantics of its referenced owner domain, and the Platform release-promise index never overrides, reassigns, or independently defines that domain's ownership or capability truth.
    condition: Whenever a release promise is authored, interpreted, or published.
    failure: Reject the conflicting promise and resolve semantics from the referenced owner domain before publication.
    relations:
      - type: applies_to
        target: definition.nimi.platform.governance-release.release-promise
  - id: rule.nimi.platform.governance-release.p-gov-026-degraded-local-claims
    kind: rule
    title: P-GOV-026 degraded-mode local-operation claim boundary
    modality: must_not
    statement: Realm-unavailable local operation claims Realm synchronization, social, economy, or account success or treats a local outbox as Realm truth.
    condition: While Realm is unavailable and local Runtime operation continues.
    failure: Preserve only the explicit local result and project Realm-owned outcomes as unavailable or pending.
    relations:
      - type: applies_to
        target: definition.nimi.platform.governance-release.degraded-mode
  - id: rule.nimi.platform.governance-release.p-gov-026-degraded-realm-mutations
    kind: rule
    title: P-GOV-026 degraded-mode Realm mutation fail closure
    modality: must
    statement: Realm commit, account mutation, economy, source-provenance materialization, and cross-device state fail closed or remain explicit pending intent while Realm is unavailable.
    condition: Whenever degraded mode requests an operation requiring Realm-owned completion.
    failure: Reject fabricated completion and preserve an explicit failed, unavailable, or pending-intent outcome.
    relations:
      - type: applies_to
        target: definition.nimi.platform.governance-release.degraded-mode
  - id: definition.nimi.platform.governance-release.license-boundary
    kind: definition
    title: P-GOV-001 and P-GOV-002 public distribution license boundary
    meaning: The public distribution boundary excludes the Realm implementation surface, licenses runtime, sdk, proto, app-tools, and npm-packages under Apache-2.0, licenses apps, kit, app-tools/templates/default-starter, and app-tools/templates/app-source under MIT, and licenses docs and spec under CC-BY-4.0.
  - id: definition.nimi.platform.governance-release.final-authority
    kind: definition
    title: P-GOV-024 active final authority boundary
    meaning: Active final authority under .nimi/spec/** contains current product rules and facts rather than repository-work task lifecycle, subordinate-process, historical-process, process-provenance, operational evidence, or task-state truth.
  - id: definition.nimi.platform.governance-release.pre-release-transition
    kind: definition
    title: P-GOV-003 internal pre-release breaking transition
    meaning: An internal pre-release breaking transition is a declared breaking product change made while Nimi is internal pre-release with no external users or external App developers; it hard-cuts losing vocabulary and semantics, removes losing local test state only through existing owner or test reset operations, explicitly rebuilds only canonical test configuration, and is not a compatibility, conversion, automatic migration, dual-path, or migration-framework guarantee.
  - id: rule.nimi.platform.governance-release.p-gov-001-002
    kind: rule
    title: P-GOV-001 and P-GOV-002 license matrix
    modality: must
    statement: Publicly distributed Nimi surfaces use the license assigned by the closed license boundary, and the Realm implementation surface is not distributed by this public repository.
    condition: Whenever a repository surface is publicly distributed or licensed.
    failure: Block distribution until the surface uses its assigned license and the Realm implementation exclusion remains intact.
    relations:
      - type: applies_to
        target: definition.nimi.platform.governance-release.license-boundary
  - id: rule.nimi.platform.governance-release.p-gov-003
    kind: rule
    title: P-GOV-003 breaking changes and authority-first release discipline
    modality: must
    statement: Update active final authority before changing its implementation. Every released breaking change, including a public Beta change, declares the affected artifact, migration path and user-data impact. Every internal pre-release breaking transition declares its local-test hard reset and canonical rebuild.
    condition: Whenever a breaking release change or an internal pre-release breaking transition is introduced.
    failure: Block a released breaking change until its declaration identifies the affected artifact, migration path and user-data impact. Block an internal pre-release breaking transition until its local-test hard reset and canonical rebuild are declared. In either case block the implementation change until active final authority has been updated.
    relations:
      - type: applies_to
        target: definition.nimi.platform.governance-release.final-authority
      - type: applies_to
        target: definition.nimi.platform.governance-release.pre-release-transition
  - id: rule.nimi.platform.governance-release.p-gov-003a
    kind: rule
    title: P-GOV-003 internal pre-release transition state boundary
    modality: must
    statement: An internal pre-release breaking transition removes losing local test state only through existing owner or test reset operations, rebuilds only canonical test configuration, preserves each affected endpoint's existing confirmation, absence, and non-disclosure semantics, and stops when an actually populated state plane has no existing owner or test reset operation.
    condition: Whenever an internal pre-release breaking transition removes or rebuilds local test state.
    failure: Stop the transition at the affected state plane without adding a compatibility alias, conversion, automatic migration, dual path, cleanup tool, or reset-specific state.
    relations:
      - type: applies_to
        target: definition.nimi.platform.governance-release.pre-release-transition
  - id: rule.nimi.platform.governance-release.p-gov-024
    kind: rule
    title: P-GOV-024 spec contains active final authority only
    modality: must_not
    statement: Active authority under .nimi/spec/** uses repository task lifecycle, subordinate-process, historical-process, process-provenance, operational evidence, worker results, decision dossiers, or task status as the source of truth for an active rule, table, status, evidence requirement, or fact.
    condition: Whenever active authority is authored or interpreted.
    failure: Reject the process-derived claim and resolve product meaning only from active final authority.
    relations:
      - type: applies_to
        target: definition.nimi.platform.governance-release.final-authority
  - id: rule.nimi.platform.governance-release.p-gov-026-non-promises
    kind: rule
    title: P-GOV-026 non-promise capability postures
    modality: must_not
    statement: A semantic-contract-only proto-unavailable, source-root-only, fixture-only, design-only, or adapter-placeholder surface is represented as a public release promise.
    condition: Whenever a capability is evaluated for public release positioning.
    failure: Exclude the surface from public promises until an owner-domain capability with real release behavior exists.
    relations:
      - type: applies_to
        target: definition.nimi.platform.governance-release.release-promise
  - id: rule.nimi.platform.governance-release.p-gov-026-supported-completeness
    kind: rule
    title: P-GOV-026 supported promise completeness
    modality: must
    statement: Every supported release promise names its canonical owner, login requirement, and failure behavior, and corresponds to a directly verified real vertical slice of its referenced owner domain.
    condition: Whenever a release promise has supported posture.
    failure: Withhold the promise from publication until every required product field is explicit, resolves to owner authority, and its real slice is verified.
    relations:
      - type: applies_to
        target: definition.nimi.platform.governance-release.promise-posture
      - type: applies_to
        target: definition.nimi.platform.governance-release.release-promise
  - id: definition.nimi.platform.governance-release.first-party-public-component-release
    kind: definition
    title: First-party public component release
    meaning: A first-party public component release binds one immutable tag and commit to one of five independently versioned packages, @nimiplatform/sdk (sdk/v<SDK SemVer>), @nimiplatform/kit (kit/v<Kit SemVer>), @nimiplatform/app-tools (app-tools/v<App Tools SemVer>), @nimiplatform/sdk-adapter-vercel-ai (sdk-adapter-vercel-ai/v<adapter SemVer>) or nimi-shell-protected-local (nimi-shell-protected-local/v<protected-local Cargo SemVer>). The installable product bundle and publisher-owned Apps have their own release identities.
  - id: rule.nimi.platform.governance-release.p-gov-027-component-release-identity
    kind: rule
    title: First-party public component release identity
    modality: must
    statement: Use the tag family assigned to the component. Its version must match the canonical package manifest, its commit must already belong to canonical main, and all published artifacts must identify that component and commit. A global release train, another component’s tag, a Proto version or a publisher’s App tag cannot authorize publication.
    condition: Whenever a first-party public component is tagged or published for production.
    failure: Reject before release or package-registry publication when the component family, tag, canonical package version, artifact owner, or commit mismatches, without falling back to a global or cross-component release train.
    relations:
      - type: applies_to
        target: definition.nimi.platform.governance-release.first-party-public-component-release
  - id: rule.nimi.platform.governance-release.p-gov-026-nonsupported-completeness
    kind: rule
    title: P-GOV-026 partial unsupported and deferred promise completeness
    modality: must
    statement: Every partial, unsupported, or deferred release promise names its product reason and fail-closed behavior.
    condition: Whenever a release promise has partial, unsupported, or deferred posture.
    failure: Withhold the promise from publication until its product reason and fail-closed behavior are explicit.
    relations:
      - type: applies_to
        target: definition.nimi.platform.governance-release.promise-posture
      - type: applies_to
        target: definition.nimi.platform.governance-release.release-promise
  - id: rule.nimi.platform.governance-release.p-gov-028-release-tag-namespace
    kind: rule
    title: Release tags identify their product or component owner
    modality: must
    statement: Every product or component release tag in the Nimi repository, including preview and release-candidate tags, names its release owner before /v<SemVer>; the complete Desktop plus Runtime plus Avatar plus Zhiyu Nimi product uses nimi/v<product SemVer>, a Desktop-only release uses desktop/v<Desktop SemVer>, a Runtime-only release uses runtime/v<Runtime SemVer>, and public library families retain their independently governed component prefixes and versions. A bare v<SemVer> tag or a manually numbered mixed-component batch never identifies a Nimi repository-wide release, and nimi/ never identifies a partial product or an unrelated collection of component artifacts; independent Third-party App repositories retain their publisher-owned tag identities.
    condition: Whenever a Nimi-repository product or component release tag is created, interpreted, or published.
    failure: Reject publication when the tag lacks an owner namespace, its version lacks the named owner's release identity, or the delivered components do not match that identity; do not rename a mixed release into a component or complete-product release.
    relations:
      - type: applies_to
        target: definition.nimi.platform.governance-release.first-party-public-component-release
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.release-bundle
