format: nimicoding.authority/v2
owner: team.avatar
scope: avatar.embodiment-surface
units:
  - id: definition.nimi.avatar.embodiment.product-boundary
    kind: definition
    title: Avatar embodiment product boundary
    meaning: Avatar is the LocalAgent shape, state, and voice projection product with its own App-specific feature authority over Live2D, VRM, and Nimi2D rendering, deterministic motion, expression, pose, look-at and generated-motion mapping, decoder and audio-clock integration, local playback and lipsync parameters, backend diagnostics, probes, evidence and replay, package validation, window and hit-region behavior, and backend recovery; it consumes only Runtime-owned current-session Agent, Conversation, activity, emotion, semantic posture, artifact and timing correlation, independently owned companion state, voice, and presentation facts available through the common formal App contract and gains no first-party, platform, declaration, coverage, availability, result, error, identity, or Runtime privilege authority.
  - id: definition.nimi.avatar.embodiment.backend-branch
    kind: definition
    title: BackendBranch carrier protocol
    meaning: A BackendBranch is the closed discriminated Avatar-local carrier protocol for one validated live2d, vrm, or nimi2d backend, including nominal bounds, hit regions, audio consumption, ontology-level projection, a render surface, opaque metadata, and shutdown; temporary faults and recovery remain internal to the concrete backend.
  - id: definition.nimi.avatar.embodiment.projection-output
    kind: definition
    title: Embodiment projection output
    meaning: An embodiment projection output is a backend-neutral Avatar-local motion, expression, pose, lookat, speak, parameter_delta, or surface_bounds cue produced from typed Runtime or SDK truth and non-authoritative shell context for validated backend execution.
  - id: definition.nimi.avatar.embodiment.event-family
    kind: definition
    title: Avatar event wire family
    meaning: The Avatar event wire family is the typed avatar namespace for local user interaction, rendering, application lifecycle, shell intent, composition, audio playback, lipsync phase, generated motion, hit-region, carrier lifecycle, debug evaluation, and cancellable before-event observations without becoming Runtime semantic truth.
  - id: definition.nimi.avatar.embodiment.nas-projection-api
    kind: definition
    title: NAS EmbodimentProjectionApi
    meaning: The NAS EmbodimentProjectionApi is the closed creator-facing capability surface that lets isolated Avatar handlers issue backend-neutral motion, signal, expression, pose, wait, surface-bounds, and optional default-activity operations without receiving renderer, backend, host, credential, filesystem, or Runtime client objects.
  - id: definition.nimi.avatar.embodiment.shell-lifecycle
    kind: definition
    lifecycle: removed
    title: Avatar shell lifecycle protocol
    reason: Removed because Avatar presentation has no public renderer or shell lifecycle state machine; shell prerequisite composition remains an implementation detail and terminal presentation failure is handled locally in the Avatar window.
  - id: definition.nimi.avatar.embodiment.generated-motion-provider
    kind: definition
    title: Generated-motion provider
    meaning: A generated-motion provider is the Avatar-owned deterministic route from typed Runtime projection plus validated Avatar route, backend capability profile, and optional mapping sidecar to executable backend output or a typed fail-closed result.
  - id: definition.nimi.avatar.embodiment.debug-backend-result
    kind: definition
    title: Avatar debug backend result
    meaning: An Avatar debug backend result is a typed local evaluation bound to an Avatar diagnostic session and validated backend identity that may carry bounded backend facts and an optional opaque common Runtime correlation ref but creates no Runtime probe identity, special product store or transport, public App entitlement, LocalAgent truth, or run-record accounting authority.
  - id: definition.nimi.avatar.embodiment.renderer-smoothing
    kind: definition
    title: Renderer-local signal smoothing
    meaning: Renderer-local signal smoothing is a bounded Avatar projection pressure valve that coalesces setSignal writes, accumulates addSignal writes, preserves read-your-write behavior, and flushes before every non-signal cue without owning cue meaning or Runtime ordering.
  - id: definition.nimi.avatar.embodiment.host-consumption-boundary
    kind: definition
    title: Host-only Kit consumption boundary
    meaning: The host-only Kit consumption boundary permits reusable Avatar-vertical headless protocol types, projection helpers, theme tokens, UI primitives, semantic-to-renderer mapping utilities, and backend-local support under kit/features/avatar while Avatar retains product semantics and concrete backend execution and Kit gains no public App entitlement, declaration coverage, special Runtime permission or client, or Avatar, Runtime, Desktop, Realm, and Cognition truth ownership.
  - id: rule.nimi.avatar.embodiment.r001
    kind: rule
    title: Ownership guardrail for Avatar embodiment
    modality: must_not
    statement: Avatar redefines Runtime participation, provenance, current Agent, Conversation, activity, emotion, semantic posture, artifact or timing correlation, independently owned companion state, voice, presentation, or continuity truth, Realm truth, or Desktop Host mechanics, or promotes its App-specific renderer, mapping, playback, diagnostics, package, window, or recovery feature authority into first-party or platform privilege, common App entitlement, declaration coverage, special Runtime operations, or a privileged SDK client while validating or rendering an embodiment.
    condition: Whenever Avatar consumes or projects another owner surface.
    failure: Reject the ownership transfer and retain only the typed downstream projection or opaque reference.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.product-boundary
  - id: rule.nimi.avatar.embodiment.r002
    kind: rule
    title: Backend Branch Contract 2.1 closed backend kinds
    modality: must
    statement: BackendKind contains exactly live2d, vrm, and nimi2d, and one Avatar-owned branch factory validates the selected model and exhaustively selects one matching BackendBranch.
    condition: Whenever a backend model is admitted or a branch is created.
    failure: Reject an unknown, unvalidated, ambiguous, or non-exhaustively handled backend kind without a placeholder branch.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
  - id: rule.nimi.avatar.embodiment.r003
    kind: rule
    title: Backend Branch Contract 2.2 nominal bounds
    modality: must
    statement: Each BackendBranch exposes positive logical nominal width and height plus normalized bodyCenterX and bodyCenterY values as embodiment framing and surface-bounds inputs.
    condition: Whenever a backend branch becomes renderable.
    failure: Keep the branch unready when its nominal bounds are absent, non-positive, non-finite, or outside the normalized center range.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
  - id: rule.nimi.avatar.embodiment.r004
    kind: rule
    title: Backend Branch Contract 2.3 hit-region protocol
    modality: must
    statement: Each backend hit-region snapshot contains normalized body and drag rectangles and an optional point-opacity query whose boolean result takes precision priority while null or unavailable precision falls back to the body rectangle.
    condition: Whenever Avatar determines embodiment interaction or click-through membership.
    failure: Reject an invalid rectangle or unsafe precision result and use only the last valid bounded fallback without claiming alpha precision.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
  - id: rule.nimi.avatar.embodiment.r005
    kind: rule
    title: Backend Branch Contract 2.4 audio-consumer protocol
    modality: must
    statement: A backend audio consumer asynchronously attaches an audio source, synchronously detaches it, immediately forces silent snapshots until the next attach, and returns either null or bounded AEIOUS weights plus volume from snapshot.
    condition: Whenever a branch admits local audio-driven lipsync.
    failure: Fail the audio or lipsync operation and enter silent state on an incomplete consumer, failed attach, malformed snapshot, or synthetic success.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
  - id: rule.nimi.avatar.embodiment.r006
    kind: rule
    title: Backend Branch Contract 2.5 ontology-level projection
    modality: must
    statement: BackendProjection exposes only applyActivity with name and nullable intensity, applyEmotion with current and nullable previous, applyMotion with routeId and optional fade and loop, applyExpression with name and optional weight and fade, and reset.
    condition: Whenever the carrier projects validated semantic state into a backend branch.
    failure: Reject an unknown method, malformed argument, raw Runtime payload, public APML syntax, or backend parameter identifier on this surface.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
      - type: applies_to
        target: definition.nimi.avatar.embodiment.projection-output
  - id: rule.nimi.avatar.embodiment.r007
    kind: rule
    lifecycle: removed
    title: Backend Branch Contract 2.7 through 2.9 branch shape
    reason: Removed because the exact aggregate TypeScript-like surface shape and typed lifecycle reporting had no product consumer; active resource, projection, interaction, and shutdown rules own the surviving semantics.
  - id: rule.nimi.avatar.embodiment.r008
    kind: rule
    title: Backend Branch Contract 2.6 branch-local extension
    modality: must
    statement: Only a live2d BackendBranch exposes the branch-local setParameter extension, and only Avatar-owned projection translation may invoke it after kind narrowing.
    condition: Whenever fine-grained parameter_delta output reaches backend execution.
    failure: Reject extension access from NAS creator source or a vrm branch and fail the unsupported cue without cross-branch fallback.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
      - type: applies_to
        target: definition.nimi.avatar.embodiment.projection-output
  - id: rule.nimi.avatar.embodiment.r009
    kind: rule
    title: Backend Branch Contract 3 resource ownership
    modality: must
    statement: Carrier attachment and detachment preserve one validated BackendBranch, and shutdown cancels Avatar-local work and releases all branch render, audio, and projection resources without exposing backend-specific state through the carrier.
    condition: Whenever a Runtime driver attaches, detaches, a model changes, or the carrier shuts down.
    failure: Fail the affected operation and retain no presentation success while resources, handlers, sinks, or backend-specific fields escape their branch.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
  - id: rule.nimi.avatar.embodiment.r010
    kind: rule
    title: Embodiment Projection Contract 3 output closure
    modality: must
    statement: Embodiment projection emits only motion, expression, pose, lookat, speak, parameter_delta, and surface_bounds cues, with speak remaining downstream of Runtime voice timing and requiring backend proof before Avatar reports local success.
    condition: Whenever typed Runtime or SDK truth and shell context are projected for rendering.
    failure: Reject an unknown cue, semantic writeback, fabricated voice or lipsync state, or backend-specific value outside the admitted extension path.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.projection-output
  - id: rule.nimi.avatar.embodiment.r011
    kind: rule
    title: Embodiment Projection Contract 4 backend split
    modality: must
    statement: Backend-neutral cues preserve their Avatar meaning before a validated branch maps them to renderer-local motion, expression, pose, look-at, audio, parameter, and bounds operations.
    condition: Whenever projection output crosses into backend execution.
    failure: Reject a renderer branch that changes cue meaning, writes upstream truth, or leaks renderer identifiers into the backend-neutral surface.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
      - type: applies_to
        target: definition.nimi.avatar.embodiment.projection-output
  - id: rule.nimi.avatar.embodiment.r014
    kind: rule
    title: Embodiment Projection Contract 7 reset boundary
    modality: must
    statement: Projection reset clears Avatar-owned backend-local motion, expression, pose, signal, and cue state without altering Runtime presentation, continuity, participation, or provenance truth.
    condition: Whenever a branch resets, detaches, changes model, or recovers from a local failure.
    failure: Fail the reset if backend-local state remains active or any upstream semantic state is mutated.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.nas-projection-api
      - type: applies_to
        target: definition.nimi.avatar.embodiment.projection-output
  - id: rule.nimi.avatar.embodiment.r015
    kind: rule
    title: AV-PROJ-SMOOTH-002 signal-only smoothing
    modality: must
    statement: Renderer smoothing coalesces latest setSignal values per signal, accumulates addSignal deltas per signal, preserves pending read-your-write values, bounds pending memory, and flushes before triggerMotion, stopMotion, setExpression, clearExpression, setPose, clearPose, wait, getSurfaceBounds, or runDefaultActivity.
    condition: Whenever the Avatar carrier enables projection smoothing.
    failure: Dispose or bypass the smoothing handle after flushing and reject any reordered, dropped, unbounded, or semantically coalesced non-signal cue.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.renderer-smoothing
  - id: rule.nimi.avatar.embodiment.r016
    kind: rule
    title: AV-PROJ-SMOOTH-003 no cue authority
    modality: must_not
    statement: Renderer smoothing creates Runtime ordering, activity, expression, motion, speech, lipsync, provenance, readiness, or generated-motion truth.
    condition: Whenever pending projection writes are coalesced, read, flushed, or disposed.
    failure: Reject the semantic claim and retain smoothing as renderer-local signal transport only.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.renderer-smoothing
  - id: rule.nimi.avatar.embodiment.r017
    kind: rule
    title: Avatar events remain presentation observations
    modality: must
    statement: Avatar-owned events report only Avatar rendering, playback, interaction, backend, and lifecycle observations under the Avatar owner and do not become Runtime LocalAgent truth or a public raw motion, expression, pose, renderer, or driver API.
    condition: Whenever Avatar publishes or consumes a product event.
    failure: Reject an event that claims Runtime truth, exposes raw backend control, or grants Third-party Avatar driving authority.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.event-family
  - id: rule.nimi.avatar.embodiment.r018
    kind: rule
    title: Avatar event envelopes are typed and bounded
    modality: must
    statement: Every Avatar event has one declared identity, typed detail payload, bounded rate posture, lifecycle meaning, and owner-defined handling, with no generic public cancellation or driver hook.
    condition: Whenever an Avatar event is emitted, handled, canceled, or evolved.
    failure: Reject an undeclared identity, malformed payload, unbounded high-rate publication, or generic consumer control hook.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.event-family
  - id: rule.nimi.avatar.embodiment.r019
    kind: rule
    title: Avatar Event Contract 2 rendering and lifecycle truth
    modality: must
    statement: Avatar rendering events bind local activity, motion, expression, pose, look-at, speak, audio playback, lipsync phase, hit-region, carrier lifecycle, model, composition, shell, and app observations to the active avatar instance and validated backend result without claiming upstream success.
    condition: Whenever Avatar reports a local render or lifecycle observation.
    failure: Reject a stale-instance, wrong-backend, malformed, deprecated per-frame lipsync, or success-shaped event lacking the required local result.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.event-family
  - id: rule.nimi.avatar.embodiment.r020
    kind: rule
    title: Avatar Event Contract 6 provenance boundary
    modality: must_not
    statement: An Avatar, Desktop, shell, backend, provider, fixture, or NAS event synthesizes, mirrors, reorders, or implies runtime.agent participation, turn, presentation, state, hook, session, proactive, debug, or provenance truth.
    condition: Whenever Avatar consumes typed Runtime events or emits downstream observations.
    failure: Reject the fabricated event and preserve the original Runtime family identity, origin linkage, and continuity lineage.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.event-family
      - type: applies_to
        target: definition.nimi.avatar.embodiment.product-boundary
  - id: rule.nimi.avatar.embodiment.r021
    kind: rule
    lifecycle: removed
    title: K-NAV-SHELL-COMPOSITION-001 closed shell lifecycle
    reason: Removed because loading, ready, degraded, fatal, and relaunch are not a canonical Avatar presentation state machine; bootstrap and host prerequisite composition remains App-local implementation.
  - id: rule.nimi.avatar.embodiment.r022
    kind: rule
    lifecycle: removed
    title: K-NAV-SHELL-COMPOSITION-002 ready and degraded exclusion
    reason: Removed with the shell lifecycle state machine; Avatar presentation inability is governed directly by the local failure rule rather than ready and degraded phase exclusion.
  - id: rule.nimi.avatar.embodiment.r023
    kind: rule
    title: K-NAV-SHELL-FIRST-PARTY-RUNTIME-003 minimal launch intent
    modality: must
    statement: Default Avatar launch carries only a session-scoped Agent-handle target hint, optional exact Conversation anchor, Avatar instance id, bounded non-authorizing launch source, and optional opaque committed-presentation or temporary-custody refs, treats every handoff field as untrusted targeting intent rather than identity or authority, resolves an Avatar-current-session Agent handle and Conversation continuity through the formal App client and Runtime revalidation before product use, and permits only the Desktop Host Control Plane to launch or focus the verified Avatar native host and authorize materialization of the exact Runtime-validated visual package under the protected data root; the requesting App, handoff, Host presence port, Avatar renderer, NAS, and SDK surfaces receive no Host lifecycle authority, account, owner, raw LocalAgent, Realm source identity, runtimeSourceRef, configuration, private global, raw root, or arbitrary path authority.
    condition: Whenever the Desktop Host Control Plane launches or focuses the default Avatar in response to Nimi Home or a formal App request, or authorizes materialization of an Avatar visual package.
    failure: Reject missing or invalid LocalAgent selection, a mismatched materialization result, raw-root disclosure, renderer or NAS path authority, and any launch-carried account, user, Realm, credential, calibration, model, render, or performance truth.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.product-boundary
  - id: rule.nimi.avatar.embodiment.r024
    kind: rule
    title: K-NAV-SHELL-FIRST-PARTY-RUNTIME-001 credential custody prohibition
    modality: must_not
    statement: Avatar reads or stores access tokens, refresh tokens, raw JWTs, authorization headers, a second account snapshot, event stream, resync loop, or durable account session, shared auth truth, independent Realm authentication or connectivity truth, native-profile-derived product availability, local subject truth, or an App-owned credential provider instead of deriving product readiness and operations from its current credential-free formal protected App session and typed owner results.
    condition: Whenever Avatar authenticates, accesses private data, or invokes a Realm-mediated operation.
    failure: Deny the operation, discard the sensitive value, and remain in a typed non-ready or unauthorized state.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.product-boundary
  - id: rule.nimi.avatar.embodiment.r025
    kind: rule
    title: K-NAV-SHELL-OUTPUT-002 local presentation ownership
    modality: must_not
    statement: Avatar local presentation, semantic-to-motion mapping, lipsync parameters, backend diagnostics, probe evidence, replay, or window state creates Conversation history, activity, emotion, posture, timing, companion, wake, listener arbitration, audible-speaker arbitration, interruption success, account truth, semantic writeback, or any corresponding visible product success without the applicable formal App Conversation, Realtime, embodiment, or presentation owner result.
    condition: Whenever Avatar renders output or handles a shell-local interaction.
    failure: Keep the effect presentation-local and require the typed owning Runtime result before showing the corresponding product truth.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.product-boundary
  - id: rule.nimi.avatar.embodiment.r026
    kind: rule
    title: Generated Motion Provider Contract 3 typed input
    modality: must
    statement: Generated-motion input contains one admitted typed Runtime presentation or state projection, one Avatar route id, one active backend kind, one validated capability-profile ref, and at most one validated mapping-sidecar ref.
    condition: Whenever generated motion is requested.
    failure: Return invalid_runtime_projection, missing_route, or missing_profile as applicable and execute no backend motion.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.generated-motion-provider
  - id: rule.nimi.avatar.embodiment.r027
    kind: rule
    title: Generated Motion Provider Contract 4 typed result
    modality: must
    statement: Generated-motion returns either executable output bound to the requested backend and route or fail_closed with exactly one of unsupported_capability, unsafe_pose, mapping_confidence_below_threshold, mapping_unconfirmed, missing_profile, missing_route, or invalid_runtime_projection.
    condition: Whenever generated-motion evaluation terminates.
    failure: Reject neutral success, idle substitution for a non-idle route, wrong-backend output, or an unknown reason code.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.generated-motion-provider
  - id: rule.nimi.avatar.embodiment.r028
    kind: rule
    title: Generated Motion Provider Contract 5 through 7 profile and routing
    modality: must
    statement: Capability profiles describe only validated model and backend facts, mapping sidecars provide non-authoritative target-field matches with confidence and required manual confirmation for LLM-produced mappings, and deterministic provider code alone owns bounded motion math reproducible from typed projection, route, profile, sidecar, and provider version.
    condition: Whenever a profile, mapping, or generated route supports executable output.
    failure: Fail closed on an unsupported target, confidence below threshold, missing confirmation, mismatched profile evidence, nondeterministic output, provider hardcoding, or sidecar-authored motion math.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.generated-motion-provider
  - id: rule.nimi.avatar.embodiment.r029
    kind: rule
    title: Avatar debug session backend result shape
    modality: must
    statement: An Avatar-owned debug backend result requires diagnostic_session_id, backend kind, probe kind, observed_at, and evidence containing evidence_id, evidence_kind, status, and source with status exactly passed, failed, unsupported, or invalid, and may carry only an optional opaque correlation ref from the common bounded Runtime embodiment projection; it contains no Runtime probe id, raw Agent or account identity, Runtime special-store ref, provider, model, storage, package path, prompt, reasoning, or public operation authority.
    condition: Whenever Avatar evaluates or records local backend diagnostic evidence.
    failure: Reject the local result when its diagnostic session, backend binding, timestamp, evidence, status, or optional common correlation is missing, unknown, malformed, stale, or over-broad.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.debug-backend-result
  - id: rule.nimi.avatar.embodiment.r030
    kind: rule
    title: Avatar debug session evidence-kind closure
    modality: must
    statement: Debug evidence_kind is exactly package_descriptor_resolved, backend_loaded, capability_profile_validated, route_support_checked, generated_motion_checked, emotion_expression_checked, speech_lipsync_checked, or carrier_diagnostics_checked, and its optional payload contains only typed bounded facts or opaque authorized refs.
    condition: Whenever Avatar constructs backend debug evidence.
    failure: Reject an unknown kind, raw protocol or provider payload, backend command, package path, token, account or user identity, Realm URL, app business data, or untyped evidence field.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.debug-backend-result
  - id: rule.nimi.avatar.embodiment.r031
    kind: rule
    title: Avatar debug public result boundary
    modality: must_not
    statement: Avatar backend evaluation, local event, run record, artifact reference, screenshot, preview, fixture, or evidence record establishes Runtime LocalAgent, Conversation, activity, emotion, posture, timing, companion, voice, presentation, availability, or operation success or is exposed as a common App entitlement beyond the bounded Avatar-owned diagnostic result admitted by its exact local feature contract.
    condition: Whenever a local debug result is displayed, retained, or submitted.
    failure: Keep the result within the Avatar-owned diagnostic surface and require the applicable common Runtime owner result before presenting any Runtime product truth.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.debug-backend-result
  - id: rule.nimi.avatar.embodiment.r032
    kind: rule
    title: K-NAV-KIT-UI-001 host-only consumption
    modality: must
    statement: Avatar consumes reusable Kit theme, primitive, headless projection, protocol-type, semantic-to-renderer mapping, backend-local support, and smoothing surfaces only as Avatar-vertical feature support while retaining Avatar product meaning and concrete backend validation and rendering; publication under kit/features/avatar grants no ordinary App entitlement, declaration coverage, Runtime operation, special client, product availability, or owner authority.
    condition: Whenever Avatar or Kit shares an embodiment-related surface.
    failure: Reject duplicated semantic ownership, a global fallback, public entitlement inference, privileged Runtime access, or transfer of Avatar, Runtime, Desktop, Realm, Cognition, or backend execution truth into Kit.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.host-consumption-boundary
  - id: definition.nimi.avatar.embodiment.live2d-adapter
    kind: definition
    title: Live2D Render Contract Live2D adapter
    meaning: A Live2D adapter is the Avatar-owned validated backend implementation that loads one Cubism package, projects admitted Avatar cues into model-local behavior, produces carrier output, and releases its resources without creating Runtime semantics or mutating the source package.
  - id: definition.nimi.avatar.embodiment.live2d-adapter-manifest
    kind: definition
    title: Live2D Adapter Manifest Schema v1
    meaning: A Live2D adapter manifest is the closed versioned Avatar wire document that explicitly selects one Cubism target, license posture, requested compatibility tier, feature dispositions, and model-local semantic mappings for one adapter.
  - id: definition.nimi.avatar.embodiment.live2d-compatibility-tier
    kind: definition
    title: Live2D Compatibility Tiers
    meaning: A Live2D compatibility tier is the validator-computed product claim unsupported, render_only, semantic_basic, or companion_complete that bounds which observable carrier and model-local semantic behavior a package may claim.
  - id: definition.nimi.avatar.embodiment.live2d-diagnostic-namespace
    kind: definition
    title: Live2D Adapter Diagnostics v1
    meaning: The Live2D diagnostic namespace is the closed Avatar-owned AVATAR_LIVE2D_COMPAT_* product code family that identifies manifest, target, license, motion, expression, pose, lipsync, physics, hit-region, and unsupported-semantic compatibility failures.
  - id: rule.nimi.avatar.embodiment.r033
    kind: rule
    title: K-NAV-L2D-001 adapter ownership and source immutability
    modality: must_not
    statement: The Live2D adapter mutates a source model3 document, motion, expression, texture, physics, pose, hit-area declaration, or other upstream Cubism asset, or exposes its model-local mapping as Runtime, SDK, Desktop, NAS, or platform ontology truth.
    condition: Whenever an existing Cubism package is loaded, adapted, validated, or projected.
    failure: Reject the mutation or ownership transfer and keep the source package read-only unless a human explicitly creates a separate derivative package.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter
      - type: applies_to
        target: definition.nimi.avatar.embodiment.product-boundary
  - id: rule.nimi.avatar.embodiment.r034
    kind: rule
    title: K-NAV-L2D-002 fail-closed package loading
    modality: must
    statement: Live2D loading resolves exactly one model3 document, validates its MOC3 and every required texture, registers declared model-local motions and expressions, and attaches each present valid physics, pose, or metadata resource before attempting presentation.
    condition: Whenever a Cubism package is selected for a Live2D branch.
    failure: Treat the current presentation as unable to render when the package root, unique model document, required binary, required texture, declared resource, or parse result is missing or invalid; never load a placeholder or fallback material as success.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter
  - id: rule.nimi.avatar.embodiment.r035
    kind: rule
    title: K-NAV-L2D-004 model and resource replacement
    modality: must
    statement: A Live2D load, model switch, unload, shutdown, or render-context replacement preserves one active validated model and releases the prior Cubism instance, textures, graphics resources, motion state, expression state, handlers, and adapter-local work before replacement completes.
    condition: Whenever the Live2D model or rendering context changes or terminates.
    failure: Treat the current presentation as unable to render when replacement cannot complete, and retain no success claim while stale resources or model state remain active.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter
  - id: rule.nimi.avatar.embodiment.r036
    kind: rule
    title: K-NAV-L2D-005 through K-NAV-L2D-010 deterministic frame lanes
    modality: must
    statement: Each admitted Live2D frame applies model motion, the Avatar expression overlay, physics, pose, breath or blink, Avatar-local look-at or idle-life, speech or lipsync, and direct parameter writes in that order when present, with direct writes last and no earlier lane overwriting a later lane in the same frame.
    condition: Whenever the Live2D branch advances an active model frame.
    failure: Reject the frame result and report a bounded lane failure when lane order is ambiguous, a later write is overwritten, elapsed time is accumulated across suspension, or model update does not reflect the validated command state.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter
      - type: applies_to
        target: definition.nimi.avatar.embodiment.projection-output
  - id: rule.nimi.avatar.embodiment.r037
    kind: rule
    title: K-NAV-L2D-008 expression inventory boundary
    modality: must
    statement: The Live2D expression inventory contains only model-local expression identity, an opaque source reference, parameter identifiers, normalized Add, Multiply, or Overwrite blend modes, and bounded parameter and blend counts.
    condition: Whenever expression resources are parsed, exposed as metadata, or included in diagnostics.
    failure: Reject an unknown blend mode, malformed inventory entry, raw expression payload, package path, parameter value, provider payload, NAS payload, Runtime payload, or claim that the inventory is Appearance or Runtime emotion truth.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter
      - type: applies_to
        target: definition.nimi.avatar.embodiment.product-boundary
  - id: rule.nimi.avatar.embodiment.r038
    kind: rule
    title: K-NAV-L2D-008 expression overlay and reset
    modality: must
    statement: Live2D keeps at most one active expression, applies each validated parameter by its Add, Multiply, or Overwrite mode, and restores parameters touched only by a cleared or replaced expression to loaded model defaults before applying the next overlay.
    condition: Whenever an expression is activated, advanced, cleared, or replaced.
    failure: Fail the expression operation without idle success when its identity or file is absent, a mapping is unsupported, a parameter is malformed, a default is guessed, or a stale expression value remains.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter
      - type: applies_to
        target: definition.nimi.avatar.embodiment.projection-output
  - id: rule.nimi.avatar.embodiment.r039
    kind: rule
    title: K-NAV-L2D-009 look-at and idle-life boundary
    modality: must
    statement: Live2D look-at and idle-life use only bounded Avatar-local pointer, focus, hit-region, and shell-action inputs and write gaze or blink only when the complete compatible model parameter pair is present.
    condition: Whenever Avatar-local look-at or idle-life behavior is evaluated.
    failure: Produce a bounded diagnostic no-op without success when a parameter pair is absent or partial, and reject raw model disclosure, guessed identifiers, transparent hit-region input, or any Runtime conversation, wake, listening, speaker, or Desktop calibration claim.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter
      - type: applies_to
        target: definition.nimi.avatar.embodiment.product-boundary
  - id: rule.nimi.avatar.embodiment.r040
    kind: rule
    title: K-NAV-L2D-013 Live2D lipsync binding
    modality: must
    statement: Live2D lipsync consumes provider-neutral voice timing or audio-level projection bound to the same agent, conversation anchor, turn, and stream as Runtime presentation truth, writes only validated mouth parameters, and stops further writes and restores model-default idle mouth behavior after interruption or cancellation.
    condition: Whenever the Live2D branch projects speech or lipsync.
    failure: Reject unbound, stale, placeholder, constant-value, fixture-only, wrong-renderer, or unsupported-parameter input and do not report local lipsync success without an observed computed mouth-parameter change.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter
      - type: applies_to
        target: definition.nimi.avatar.embodiment.projection-output
  - id: rule.nimi.avatar.embodiment.r041
    kind: rule
    title: K-NAV-L2D-010 through K-NAV-L2D-012 parameter pose and hit boundaries
    modality: must
    statement: Live2D accepts direct model parameter identifiers only through the narrowed branch extension, keeps pose activation and clearing model-local, and exposes bounded current-frame body, drag, alpha-precision, and declared named hit-region results through the existing backend protocols.
    condition: Whenever Avatar translates a direct parameter cue, controls a pose, or evaluates Live2D interaction membership.
    failure: Reject creator access, neutral projection leakage, unsupported parameters, invalid pose groups, stale masks, unbounded coordinates, or undeclared named regions without recording backend success.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter
      - type: applies_to
        target: definition.nimi.avatar.embodiment.projection-output
  - id: rule.nimi.avatar.embodiment.r042
    kind: rule
    title: Live2D Adapter Manifest Schema v1 identity and source selection
    modality: must
    statement: A Live2D adapter manifest has manifest_kind nimi.avatar.live2d.adapter, schema_version 1, a stable adapter_id, and exactly one explicitly selected embedded creator source or external host-local sidecar source; its seven closed top-level fields are manifest_kind, schema_version, adapter_id, target_model, license, compatibility, and semantics.
    condition: Whenever Avatar selects or parses a Live2D adapter manifest.
    failure: Emit manifest invalid and reject the manifest when identity, version, source selection, a required field, or top-level closure is violated; never merge sources or silently prefer one.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter-manifest
  - id: rule.nimi.avatar.embodiment.r043
    kind: rule
    title: Live2D Adapter Manifest Schema v1 target license and tier fields
    modality: must
    statement: Manifest target_model requires model_id and model3 and permits only optional expected_runtime_digest, license requires redistribution from allowed, forbidden, or unknown plus operator-reviewed evidence and fixture_use from committable, operator_local_only, or not_allowed, and compatibility requires requested_tier from render_only, semantic_basic, or companion_complete.
    condition: Whenever a Live2D adapter manifest is validated.
    failure: Reject unknown or missing fields and fail closed on a non-unique auto target, target identity mismatch, runtime digest mismatch, absent reviewed license evidence, or license posture incompatible with the requested use.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter-manifest
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-compatibility-tier
  - id: rule.nimi.avatar.embodiment.r044
    kind: rule
    title: Live2D Adapter Manifest Schema v1 feature disposition
    modality: must
    statement: Every feature disposition is closed to status and optional reason, status is exactly supported, unsupported, or not_applicable, and unsupported or not_applicable requires a reason while supported may provide one.
    condition: Whenever a manifest dispositions a Live2D semantic feature.
    failure: Reject the manifest when a disposition is absent, open, unknown, or lacks a required reason.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter-manifest
  - id: rule.nimi.avatar.embodiment.r045
    kind: rule
    title: Live2D Adapter Manifest Schema v1 semantic map closure
    modality: must
    statement: Manifest semantics contains exactly motions, expressions, poses, lipsync, physics, hit_regions, and nas_fallback with their closed v1 fields; motion requires idle group and missing_activity from diagnostic_no_success or idle_degraded_with_diagnostic, activities map active Runtime ids to optional group, weak_group, strong_group, and disposition, expression and pose maps target model-local ids with dispositions, lipsync permits mouth_open_y_parameter and paramMouthForm supported or absent with a disposition, physics requires mode model_physics, absent, or unsupported with a disposition, hit_regions permits only head, face, body, and accessory aliases plus fallback alpha_mask_only or fail_closed with a disposition, and nas_fallback requires default_idle_motion and missing_handler backend_default_with_diagnostic or no_default.
    condition: Whenever manifest semantic mappings are parsed or used.
    failure: Reject an omitted required field, unknown field or value, retired identifier, Runtime ontology creation, unsupported target, or semantic request counted as success without a supported mapping.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter-manifest
      - type: applies_to
        target: definition.nimi.avatar.embodiment.product-boundary
  - id: rule.nimi.avatar.embodiment.r046
    kind: rule
    title: Live2D Asset Compatibility Contract 4 claimed-feature validation
    modality: must
    statement: Live2D validation proves every claimed motion group, expression inventory id, pose resource, lipsync parameter, physics resource, and hit-region alias against the selected package and rejects a missing manifest whenever the requested tier requires one.
    condition: Whenever a package, manifest, requested tier, or mapped semantic is validated.
    failure: Return unsupported with the matching closed diagnostic when schema, target, digest, license, package resource, claimed feature, or missing-activity behavior cannot be proven; never downgrade silently or count an unsupported request as playback.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter-manifest
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-compatibility-tier
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-diagnostic-namespace
  - id: rule.nimi.avatar.embodiment.r047
    kind: rule
    title: Live2D Asset Compatibility Contract 5 NAS fallback binding
    modality: must
    statement: A missing NAS activity handler resolves first through an active adapter motion mapping, then through the Live2D branch convention only when the computed tier permits it, and otherwise returns an unsupported-semantic diagnostic without successful activity playback.
    condition: Whenever no NAS handler supports a requested typed activity.
    failure: Reject declarative NAS replacement, unvalidated convention fallback, idle substitution reported as the requested activity, or any unsupported request reported as success.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter-manifest
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-compatibility-tier
  - id: rule.nimi.avatar.embodiment.r048
    kind: rule
    title: Live2D Compatibility Tiers validator-owned claim
    modality: must
    statement: The validator returns only the highest Live2D compatibility tier proven by the package, selected manifest, security posture, feature dispositions, and product-observable Avatar carrier behavior, regardless of the requested tier.
    condition: Whenever Avatar computes or presents a Live2D compatibility claim.
    failure: Return unsupported with diagnostics when no tier is proven and reject requested, imported, Desktop-derived, or manually asserted tier inflation.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-compatibility-tier
  - id: rule.nimi.avatar.embodiment.r049
    kind: rule
    title: Live2D Compatibility Tiers unsupported claim
    modality: must_not
    statement: An unsupported package loads as a successful Avatar carrier, displays a placeholder as the model, mutates assets silently, or counts an unsupported semantic request as playback.
    condition: Whenever mandatory layout, schema, license, target, or claimed-feature validation fails.
    failure: Keep the branch non-ready and return the matching compatibility diagnostic.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-compatibility-tier
  - id: rule.nimi.avatar.embodiment.r050
    kind: rule
    title: Live2D Compatibility Tiers render_only claim
    modality: must
    statement: The render_only tier proves one resolvable model document, an accepted MOC3, and all declared textures while claiming no activity, expression, pose, lipsync, physics, hit-region, or NAS semantic support beyond each explicitly validated feature disposition.
    condition: Whenever Avatar returns or displays render_only.
    failure: Lower the result to unsupported when required package resources are absent or invalid and reject any undeclared semantic-support claim.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-compatibility-tier
  - id: rule.nimi.avatar.embodiment.r051
    kind: rule
    title: Live2D Compatibility Tiers semantic_basic claim
    modality: must
    statement: The semantic_basic tier requires a valid v1 manifest, explicit license posture, existing motion mappings for idle, neutral, greet, listening, and thinking, explicit dispositions for expressions, poses, lipsync, physics, and hit regions, valid inventory entries for supported expressions, diagnostics for unsupported requests, and the render_only observable behavior.
    condition: Whenever Avatar returns or displays semantic_basic.
    failure: Return only the highest lower proven tier with matching diagnostics when any required mapping, disposition, resource, security posture, or observable behavior is absent, and never report a degraded request as successful semantic playback.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter-manifest
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-compatibility-tier
  - id: rule.nimi.avatar.embodiment.r052
    kind: rule
    title: Live2D Compatibility Tiers companion_complete claim
    modality: must
    statement: The companion_complete tier proves mappings or admitted handlers for every active core Avatar activity, an existing idle fallback, complete current emotion expression disposition, pose mappings when supported, an available mouth-open parameter for lipsync, valid physics or explicit not_applicable, sufficient hit-region aliases or fail-closed interaction, and at least one product-observable mapped semantic change in the active Avatar carrier.
    condition: Whenever Avatar returns or displays companion_complete.
    failure: Return only the highest lower proven tier with matching diagnostics when any current-scope feature, mapping, resource, disposition, or observable carrier behavior is absent.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-adapter-manifest
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-compatibility-tier
  - id: rule.nimi.avatar.embodiment.r053
    kind: rule
    lifecycle: removed
    title: Live2D Asset Compatibility Contract 7 product-observable validation
    reason: Removed because canonical authority does not define first-frame, pixel, timing, quality, or backend-specific visual acceptance criteria; actual visible presentation remains a real product acceptance target.
  - id: rule.nimi.avatar.embodiment.r054
    kind: rule
    title: Live2D Adapter Diagnostics v1 closed code meanings
    modality: must
    statement: The diagnostic code set is exactly AVATAR_LIVE2D_COMPAT_MANIFEST_MISSING for a required unselected manifest, AVATAR_LIVE2D_COMPAT_MANIFEST_INVALID for invalid JSON or schema, AVATAR_LIVE2D_COMPAT_MODEL_ID_MISMATCH for target identity or digest mismatch, AVATAR_LIVE2D_COMPAT_LICENSE_UNVERIFIED for insufficient license posture, AVATAR_LIVE2D_COMPAT_MOTION_MISSING for a missing claimed motion, AVATAR_LIVE2D_COMPAT_EXPRESSION_MISSING for a missing claimed expression, AVATAR_LIVE2D_COMPAT_POSE_UNAVAILABLE for unavailable claimed pose support, AVATAR_LIVE2D_COMPAT_LIPSYNC_PARAMETER_MISSING for an unavailable claimed mouth parameter, AVATAR_LIVE2D_COMPAT_PHYSICS_UNAVAILABLE for unavailable or invalid claimed physics, AVATAR_LIVE2D_COMPAT_HIT_REGION_MISSING for a missing claimed hit area, and AVATAR_LIVE2D_COMPAT_UNSUPPORTED_SEMANTIC for an unmapped Runtime semantic request; every code has error severity and fail-closed claim semantics, with unsupported semantic specifically prohibiting successful playback.
    condition: Whenever Avatar emits a Live2D compatibility diagnostic.
    failure: Reject an unknown code, mismatched meaning, or success claim covered by one of the closed failures.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-diagnostic-namespace
  - id: rule.nimi.avatar.embodiment.r055
    kind: rule
    title: Live2D Adapter Diagnostics v1 ownership boundary
    modality: must
    statement: Only Avatar validation or Avatar carrier execution emits Live2D compatibility diagnostics, Desktop may display them without changing their meanings, and Runtime and SDK neither own nor extend the namespace.
    condition: Whenever a Live2D diagnostic is emitted, transported, displayed, or interpreted.
    failure: Reject non-Avatar emission, reinterpretation, an unregistered code, diagnostic closure by Desktop import or rendering alone, or widening of Runtime, SDK, APML, MCP, or A2A ontology.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.live2d-diagnostic-namespace
      - type: applies_to
        target: definition.nimi.avatar.embodiment.product-boundary
  - id: rule.nimi.avatar.embodiment.r056
    kind: rule
    title: K-NAV-VRM-001 validated model loading
    modality: must
    statement: A VRM branch resolves one readable VRM asset, obtains a complete humanoid model through a VRM-aware loader, establishes valid nominal bounds, and initializes its validated capability profile before attempting presentation.
    condition: Whenever Avatar loads a model for a vrm BackendBranch.
    failure: Treat the current presentation as unable to render when any required asset, parse result, humanoid capability, bounds result, profile, or initialization step is absent or invalid; never substitute an empty model or placeholder.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
  - id: rule.nimi.avatar.embodiment.r057
    kind: rule
    title: K-NAV-VRM-002 context recovery and resource ownership
    modality: must
    statement: A VRM branch keeps context loss and bounded automatic recovery internal, reloads scene resources before resuming presentation, and on unload or shutdown stops animation and disposes branch-owned scene, renderer, audio, surface, handler, and scheduled resources.
    condition: Whenever the VRM context is lost, the model changes, or the branch unloads or shuts down.
    failure: Treat the current presentation as unable to render when bounded restoration or reload cannot recover it, and retain no presentation success on failed disposal, stale resources, or retained local work.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
  - id: rule.nimi.avatar.embodiment.r058
    kind: rule
    title: K-NAV-VRM-003 and K-NAV-VRM-004 generated execution and VRMA interchange split
    modality: must
    statement: VRM generated-motion support is established only by deterministic executable clip output from typed Runtime projection and a validated route, profile, and optional sidecar, while VRMA assets, registries, and per-model overrides remain interchange-only, preserve ontology meaning, and cannot be required or used as runtime fallback proof.
    condition: Whenever Avatar evaluates, selects, replaces, advances, or stops a generated or interchange VRM animation.
    failure: Return the typed generated-motion failure and execute no idle or interchange substitute on an unknown route, unsupported target, unsafe pose, missing profile, invalid mapping, conflicting loop, clock mismatch, or ontology-shifting override.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
      - type: applies_to
        target: definition.nimi.avatar.embodiment.generated-motion-provider
  - id: rule.nimi.avatar.embodiment.r059
    kind: rule
    title: K-NAV-VRM-005 nominal bounds and framing semantics
    modality: must
    statement: VRM nominal bounds derive from validated scene geometry, an admitted Avatar-local framing intent, and the normalized humanoid body center, and only an explicitly configured bounded fallback may be used when geometry cannot be computed.
    condition: Whenever a VRM branch computes its initial or refined surface bounds.
    failure: Keep the branch non-ready or report bounded degradation when geometry, framing, body center, or fallback validation fails, and never expose non-positive, non-finite, or unbounded dimensions as ready bounds.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
      - type: applies_to
        target: definition.nimi.avatar.embodiment.projection-output
  - id: rule.nimi.avatar.embodiment.r060
    kind: rule
    title: K-NAV-VRM-006 and VRM Emote States v1 expression ownership
    modality: must
    statement: A runtime-loaded VRM emote recipe maps an admitted Runtime emotion reference or explicit backend-local fallback to a positive blend duration and bounded preset weights, keeps non-neutral primary weight below the configured expressive ceiling, permits neutral as the complete reset baseline, and grants the lipsync lane exclusive viseme writes during active speech.
    condition: Whenever Avatar validates, applies, interrupts, or resets a VRM emote or speech expression.
    failure: Reject unknown recipes, ontology claims for local fallbacks, invalid duration or weight, missing baseline, ceiling violations, conflicting viseme writes, or guessed defaults; skip an unavailable optional preset with a typed partial-degradation observation and no applied-success claim for that preset.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
      - type: applies_to
        target: definition.nimi.avatar.embodiment.projection-output
  - id: rule.nimi.avatar.embodiment.r061
    kind: rule
    title: K-NAV-VRM-008 decorative outline degradation
    modality: must
    statement: A VRM branch treats material outline rendering as decorative and may render the validated base material without an outline when outline capability is unavailable.
    condition: Whenever the active model requests or supports an outline effect.
    failure: Report bounded visual degradation and continue only with valid base material; fail the branch if base material rendering is invalid.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
  - id: rule.nimi.avatar.embodiment.r062
    kind: rule
    title: VRM Backend Contract 8 and 10 audio and hit-region behavior
    modality: must
    statement: The VRM audio consumer follows asynchronous attach, synchronous detach, immediate silence, bounded volume and viseme snapshots, and same-stream binding, while body and drag regions derive from current projected scene geometry and optional current-render alpha precision remains subordinate to the valid rectangle fallback.
    condition: Whenever VRM audio is attached, sampled, interrupted, or detached or a hit-region snapshot is published or queried.
    failure: Enter silent state and withhold lipsync success on invalid or stale audio or no observed mouth change, and reject stale, unbounded, hidden, or unreadable precision data in favor of the last valid bounded rectangle with typed degradation.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
      - type: applies_to
        target: definition.nimi.avatar.embodiment.projection-output
  - id: rule.nimi.avatar.embodiment.r063
    kind: rule
    lifecycle: removed
    title: Nimi2D Backend Contract 2 and 3 Avatar adapter intake
    reason: Removed because Nimi2D is blocked and is not an admitted current Avatar backend; no current carrier or reporting contract is reserved for it.
  - id: rule.nimi.avatar.embodiment.r064
    kind: rule
    lifecycle: removed
    title: Nimi2D Backend Contract 2 render-plan consumption
    reason: Removed because Nimi2D is blocked and no current Avatar render-plan consumer is admitted.
  - id: rule.nimi.avatar.embodiment.r065
    kind: rule
    lifecycle: removed
    title: Nimi2D Backend Contract 4 through 6 projection lanes and scheduler
    reason: Removed because Nimi2D is blocked and no current Avatar live-action lane or scheduler contract is admitted.
  - id: rule.nimi.avatar.embodiment.r066
    kind: rule
    lifecycle: removed
    title: Nimi2D Backend Contract 7 outfit-visible bounds and hit region
    reason: Removed because Nimi2D is blocked and no current Nimi2D interaction or bounds contract is admitted.
  - id: rule.nimi.avatar.embodiment.r067
    kind: rule
    lifecycle: removed
    title: Nimi2D Backend Contract 8 mounted visual truth
    reason: Removed because Nimi2D is blocked and canonical authority does not define Nimi2D renderer readiness or visual thresholds.
  - id: rule.nimi.avatar.embodiment.r068
    kind: rule
    title: Backend Capability Profile Schema v1 closure
    modality: must
    statement: "An Avatar backend capability profile is closed to profile_id, backend_kind, model_fingerprint, generated_motion with disjoint supported_routes, unsupported_routes, and safety_limits, plus exactly the kind-specific section: VRM humanoid bones, expression presets, look-at, and pose limits; Live2D motion groups, expression ids, and parameter ids; or Nimi2D validated package manifest ref, package digest, proven tier, default outfit ref, and closed live-action lanes, with package requested tier never establishing support and true viseme unavailable below proven tier two."
    condition: Whenever Avatar validates a capability profile or uses one for a generated route.
    failure: Reject an unknown kind, missing or extra section, duplicate disposition, malformed identity or fingerprint, unsafe limit, unsupported target, or open extension, and fail an absent route capability closed without idle fallback or ontology promotion.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.generated-motion-provider
      - type: applies_to
        target: definition.nimi.avatar.embodiment.product-boundary
  - id: rule.nimi.avatar.embodiment.r069
    kind: rule
    lifecycle: removed
    title: Nimi2D Backend Capability Profile Schema v1 carrier closure
    reason: Removed because Nimi2D is blocked and its capability profile is not part of the current Avatar schema.
  - id: rule.nimi.avatar.embodiment.r070
    kind: rule
    lifecycle: removed
    title: Nimi2D Live Action Routes v1 mapping invariants
    reason: Removed because Nimi2D is blocked and no current Avatar Nimi2D route mapping is admitted.
  - id: rule.nimi.avatar.embodiment.r071
    kind: rule
    title: Generated Motion Routes v1 and Activity Mapping v2 invariants
    modality: must
    statement: Each generated route maps one stable Avatar route id to typed Runtime projection and activity references, category, deterministic provider kind, backend targets, and interchange posture, and each mapped active Runtime activity has complete supported-backend dispositions whose motion and emotion targets resolve to admitted Avatar vocabularies and whose intensity is bounded before execution; concrete rows and fallback naming formulas remain configuration.
    condition: Whenever Avatar resolves or evolves generated-motion or activity mapping.
    failure: Fail closed on an unknown route, dangling reference, partial backend entry, unsupported target, missing profile, unbounded intensity, copied or invented ontology, undeclared extension namespace, or VRMA requirement without silently substituting idle.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.generated-motion-provider
      - type: applies_to
        target: definition.nimi.avatar.embodiment.product-boundary
      - type: applies_to
        target: definition.nimi.avatar.embodiment.projection-output
  - id: rule.nimi.avatar.embodiment.r072
    kind: rule
    title: Mapping Sidecar Schema v1 confidence and target closure
    modality: must
    statement: A mapping sidecar is closed to sidecar_id, Avatar route_id, backend_kind, matching profile_id, confidence, threshold, manual_confirmation, source_kind, and one or more non-empty backend-local target fields of kind humanoid_bone, expression_preset, lookat, motion_group, parameter_id, or manifest_entry.
    condition: Whenever a sidecar is parsed or used to support a generated route.
    failure: Reject the sidecar and fail closed when confidence is outside zero through one or below threshold, threshold is below the configured floor, an LLM mapping is unconfirmed, a target is absent or mismatched, or the sidecar contains keyframes, rotations, curves, easing, duration, APML tags, ontology creation, or motion math.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.generated-motion-provider
  - id: rule.nimi.avatar.embodiment.r073
    kind: rule
    title: Window Bounds Policy v1 bounds ownership and recomputation
    modality: must
    statement: Avatar derives ready-window size from active branch nominal bounds refined by validated surface bounds and persisted per-instance scale, recomputes synchronously when the model loads, switches, or scale changes, permits only programmatic window sizing while user sizing uses the admitted scale control, and excludes transient overlays from the default footprint.
    condition: Whenever the model, surface bounds, scale, overlays, or ready window size changes.
    failure: Keep or restore the last valid bounded state and report degradation on invalid bounds, scale, or resize output, without treating CSS scaling, user drag-handle sizing, stale bounds, overlay footprint, or implementation fallback as authoritative size.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
  - id: rule.nimi.avatar.embodiment.r074
    kind: rule
    title: Window Bounds Policy v1 visible-area and monitor recovery
    modality: must
    statement: The Avatar window preserves the configured minimum embodiment area within an available monitor work area, allows cross-monitor dragging, and repositions to a bounded primary-monitor default when a selected monitor is unavailable.
    condition: Whenever the window is moved, resized, restored, relaunched, or monitor topology changes.
    failure: Constrain or reposition the window using current monitor bounds and withhold valid-placement success while the embodiment remains unrecoverably off-screen or the selected monitor is unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.product-boundary
  - id: rule.nimi.avatar.embodiment.r075
    kind: rule
    title: Window Bounds Policy v1 drag ownership
    modality: must
    statement: Window drag initiation is limited to the validated embodiment body region, while transient overlays participate in hit regions only while mounted and neither overlays, transparent regions, nor degraded surfaces initiate drag.
    condition: Whenever Avatar handles pointer input for window dragging.
    failure: Reject drag initiation outside the current validated body region or from an overlay, transparent region, or degraded surface.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
  - id: rule.nimi.avatar.embodiment.r076
    kind: rule
    title: Avatar local presentation unavailability
    modality: must
    statement: The Avatar window attempts presentation with the selected Live2D, VRM, or Nimi2D backend and validated asset or package, shows the concrete surface without a public success phase when presentation succeeds, and shows a local unable-to-render surface with restart and close actions when the initial attempt cannot present or a presented surface is permanently lost after backend-local recovery is exhausted; Nimi2D requires a validated default outfit and proven package tier before any ready visual state and never treats base-body-only or an unsupported live-action lane as success.
    condition: Whenever the selected backend begins presentation, encounters a temporary fault, exhausts local recovery, or is replaced or shut down.
    failure: Keep temporary faults and recovery internal to the active backend, never return renderer operational state to Desktop or Runtime, and prevent a replaced or disposed attempt from changing the current presentation.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.backend-branch
      - type: applies_to
        target: definition.nimi.avatar.embodiment.product-boundary
