version: 1
description: >
  Closed Avatar-owned surface-kind vocabulary for companion participation
  consumers. These rows define consumer projection/control posture only; they
  do not create execution authority.
source_contract: .nimi/spec/avatar/kernel/companion-participation-consumer-contract.md
surface_kinds:
  avatar_companion:
    owner: avatar
    product_surface: Avatar companion stack
    projection_modes:
      - presentation_status
      - participation_status
      - candidate_summary
      - refusal_status
    control_modes:
      - user_explicit_trigger
      - interrupt_request
    forbidden:
      - prompt_assembly
      - provider_model_routing
      - memory_write
      - domain_commit
  desktop_companion_panel:
    owner: desktop
    product_surface: Desktop companion panel projection
    projection_modes:
      - participation_status
      - candidate_summary
      - refusal_status
    control_modes:
      - user_explicit_trigger
      - interrupt_request
    forbidden:
      - desktop_local_reply_queue
      - prompt_assembly
      - provider_model_routing
      - memory_write
      - domain_commit
  avatar_debug_workbench:
    owner: desktop_and_avatar
    product_surface: Avatar debug/probe workbench
    projection_modes:
      - typed_probe_status
      - typed_replay_status
      - carrier_evidence
      - refusal_status
    control_modes:
      - debug_probe_request
      - replay_open
    forbidden:
      - raw_debug_payload_truth
      - raw_backend_bus_truth
      - prompt_assembly
      - provider_model_routing
      - domain_commit
governance:
  open_string_surface_kinds: forbidden
  unknown_surface_kind: fail_closed
  persona_variants_are_avatar_configuration: required
  independent_persona_product_admission: forbidden
