version: 2
description: >
  Activity (ontology id) → backend-specific projection routing for Nimi
  Avatar. Each ontology-admitted activity declares BOTH `live2d` AND `vrm`
  routes (drift check: partial entries fail validator).

  Wave 0 admit (topic 2026-04-30-avatar-vrm-backend-branch, design-04):
  v2 schema replaces the v1 Live2D-only motion-group naming convention
  table. The Live2D `motion_group` naming convention itself is preserved
  in §naming_rule for default-fallback lookup behavior; the per-activity
  routing below is the primary authority.

  vrm-motion-presets.yaml admits only 4 entries at wave_0:
  `idle_subtle / listen_lean / nod_yes / shake_no` (`idle_subtle` is the
  airi MIT fork-copy PoC; the other three are internal author targets).
  Activities that
  conceptually map to `greet_wave / wave_hello / think_chin_touch`
  (greet / farewell / thinking / celebrating / excited / focused) use
  `idle_subtle` as fallback at wave_0; wave_3 admit packet flips them
  back to the formal preset (each fallback is annotated below).

source_authority: /.nimi/spec/runtime/kernel/tables/agent-activity-ontology.yaml

naming_rule:
  description: >
    Live2D default-fallback motion-group naming (when no NAS handler is
    registered for an activity and the per-activity route below also
    yields no matching model3.json group). Convention: split activity
    id by '-' and ':', CamelCase each segment, prefix with 'Activity_'.
  prefix: "Activity_"
  splitter_chars: ["-", ":"]
  case: "CamelCase"
  examples:
    - activity_id: "happy"
      motion_group: "Activity_Happy"
    - activity_id: "ext:grateful"
      motion_group: "Activity_ExtGrateful"
    - activity_id: "mod-weather:storm-watching"
      motion_group: "Activity_ModWeatherStormWatching"

# ── core ontology activities (every entry MUST have BOTH live2d AND vrm route) ──
activities:
  # ── interaction (no intensity) ──
  greet:
    live2d:
      motion_group: tap_body
      fallback_motion_group: tap_head
    vrm:
      motion: idle_subtle    # wave_0 fallback; wave_3 切到 greet_wave
      emotion: happy
      fade: 0.25
  farewell:
    live2d:
      motion_group: tap_head
    vrm:
      motion: idle_subtle    # wave_0 fallback; wave_3 切到 wave_hello
      emotion: happy
      fade: 0.3
  agree:
    live2d:
      motion_group: nod
    vrm:
      motion: nod_yes
      fade: 0.2
  disagree:
    live2d:
      motion_group: shake
    vrm:
      motion: shake_no
      fade: 0.2
  listening:
    live2d:
      motion_group: idle
    vrm:
      motion: listen_lean
      fade: 0.3
  thinking:
    live2d:
      motion_group: idle
    vrm:
      motion: idle_subtle    # wave_0 fallback; wave_3 切到 think_chin_touch
      fade: 0.4

  # ── state (no intensity) ──
  idle:
    live2d:
      motion_group: idle
    vrm:
      motion: idle_subtle
      fade: 0.5
  celebrating:
    live2d:
      motion_group: tap_body
    vrm:
      motion: idle_subtle    # wave_0 fallback; wave_3 切到 greet_wave
      emotion: excited
      fade: 0.25
  sleeping:
    live2d:
      motion_group: idle
    vrm:
      motion: idle_subtle
      fade: 0.6
  focused:
    live2d:
      motion_group: idle
    vrm:
      motion: idle_subtle    # wave_0 fallback; wave_3 切到 think_chin_touch
      fade: 0.4

  # ── emotion (intensity-supported; emotion expression is the primary driver,
  #    motion is supportive) ──
  happy:
    live2d:
      motion_group: tap_body
    vrm:
      emotion: happy
      fade: 0.4
  sad:
    live2d:
      motion_group: idle
    vrm:
      emotion: sad
      fade: 0.5
  shy:
    live2d:
      motion_group: idle
    vrm:
      emotion: relaxed       # VRM expression preset; emote bundle in vrm-emote-states.yaml
      fade: 0.5
  angry:
    live2d:
      motion_group: idle
    vrm:
      emotion: angry
      fade: 0.3
  surprised:
    live2d:
      motion_group: tap_head
    vrm:
      emotion: surprised
      fade: 0.15
  confused:
    live2d:
      motion_group: idle
    vrm:
      emotion: relaxed
      fade: 0.4
  excited:
    live2d:
      motion_group: tap_body
    vrm:
      emotion: excited
      motion: idle_subtle    # wave_0 fallback; wave_3 切到 greet_wave (与 celebrating 同 trigger 时机)
      fade: 0.25
  worried:
    live2d:
      motion_group: idle
    vrm:
      emotion: sad
      fade: 0.4
  embarrassed:
    live2d:
      motion_group: idle
    vrm:
      emotion: shy            # ontology embarrassed → emote state shy 复用
      fade: 0.4
  neutral:
    live2d:
      motion_group: idle
    vrm:
      emotion: neutral
      fade: 0.6

extended_activities_passthrough:
  rule: >
    `ext:*` activities are accepted at runtime; if not declared in this
    table, they fail-close (log warn + no projection). Wave 0 admits the
    table without ext:* entries; ext:* admission is a follow-up topic,
    not in this scope.

custom_activities_passthrough:
  rule: >
    `mod-<modid>:*` activities are admitted only when the mod manifest
    declares them. Same fail-close as extended.

intensity_variants:
  description: >
    Runtime typed projection may carry an intensity value
    (weak / moderate / strong).
    Live2D Wave 0 keeps v1 intensity_suffix convention for backward
    compat at the default-fallback layer (`Activity_Happy_Weak` /
    `Activity_Happy_Strong`). VRM uses `applyEmotion(intensity)` to
    scale emote bundle weights (clamp 0..1).
  live2d_suffix_map:
    weak: "_Weak"
    moderate: ""
    strong: "_Strong"
  vrm_intensity_scaling:
    weak: 0.5
    moderate: 1.0
    strong: 1.4   # capped at 1.0 by emote state machine

constraints:
  drift_checks:
    - description: >
        Every ontology core id (10 emotion + 6 interaction + 4 state =
        20 ids) MUST declare BOTH `live2d` AND `vrm` routes; partial
        entries fail spec validator.
    - description: >
        `vrm.motion` reference MUST resolve to an admitted preset id in
        vrm-motion-presets.yaml. References to wave_3 deferred entries
        (greet_wave / wave_hello / think_chin_touch) at wave_0 fail
        validator.
    - description: >
        `vrm.emotion` reference MUST resolve to an emote name in
        vrm-emote-states.yaml. The emote name need not equal the
        ontology emotion id (e.g. ontology `embarrassed` → emote `shy`
        is admitted reuse).
    - description: >
        Live2D `motion_group` references SHOULD resolve to a group in
        the loaded model3.json; missing group falls back via §naming_rule
        + emit `avatar.motion.preset.fail_close { reason_code: 'preset_not_admitted' }`.
        ext:/mod-: prefix activities NOT in this table fail-close
        (log warn, no silent fallback to idle).
    - description: >
        Adding a wave_3 vrm-motion-preset entry MUST flip every
        `# wave_0 fallback; wave_3 切到 <preset>` annotation in this
        table to the formal preset id in the same packet.
