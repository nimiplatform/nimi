schema_id: nimi.avatar.debug-session.v1
table_family: product_catalog
owner: .nimi/spec/avatar
catalog_id: avatar_debug_session_schema
entries:
  - id: nimi.avatar.debug-session.v1
description: >
  Avatar debug session intake and backend evidence schema. This schema consumes
  Runtime-owned probe semantics and emits Avatar-owned backend evidence.

required_fields:
  - debug_session_id
  - runtime_probe_id
  - agent_id
  - backend_kind
  - probe_kind
  - evidence
  - observed_at

fields:
  debug_session_id:
    type: string
    owner: avatar
  runtime_probe_id:
    type: string
    owner: runtime
  agent_id:
    type: string
    owner: runtime
  avatar_instance_id:
    type: string_optional
    owner: avatar
  backend_capability_profile_ref:
    type: string_optional
    semantics: opaque_authorized_ref
  backend_kind:
    type: enum
    values:
      - vrm
      - live2d
      - future
  probe_kind:
    type: ref
    ref: .nimi/spec/runtime/kernel/tables/avatar-debug-probe-events.yaml
  evidence:
    type: object
    required_fields:
      - evidence_id
      - evidence_kind
      - status
      - source
    evidence_kind_enum:
      - package_descriptor_resolved
      - backend_loaded
      - capability_profile_validated
      - route_support_checked
      - generated_motion_checked
      - emotion_expression_checked
      - speech_lipsync_checked
      - carrier_diagnostics_checked
    status_enum:
      - passed
      - failed
      - unsupported
      - invalid
    admitted_ref_fields:
      - route_ids
      - unsupported_route_ids
      - backend_capability_profile_ref
      - avatar_package_ref
      - carrier_visual_evidence_ref
      - carrier_preview_artifact_ref
      - live2d_expression_inventory_ref
      - live2d_backend_load_ref
      - live2d_capability_profile_ref
      - live2d_route_support_ref
      - live2d_lipsync_evidence_ref
      - live2d_hit_region_evidence_ref
      - live2d_parameter_lane_diagnostics_ref
      - live2d_calibration_ref
  observed_at:
    type: iso8601_utc_timestamp

forbidden_fields:
  - package_descriptor_from_launch
  - package_path_from_launch
  - desktop_binding_id
  - raw_apml
  - raw_mcp
  - raw_a2a
  - raw_provider_output
  - app_business_data
  - token
  - account_id
  - user_id
  - realm_url
  - backend_command

invariants:
  - Avatar evidence does not own public Runtime probe status.
  - Missing or unsupported backend capability is fail_closed evidence.
  - Debug success cannot depend on .vrma playback or placeholder profiles.
  - Carrier visual readiness refs must point at Avatar-owned carrier evidence;
    Desktop-rendered pixels, Pixi previews, and static screenshots cannot close
    Avatar debug success.
  - Live2D emotion/expression success must reference Avatar-owned parsed exp3
    inventory evidence when a Live2D backend claims expression support.
  - Live2D window/hit-region success must reference Avatar-owned carrier visual
    evidence, official-SDK preview artifact evidence, and Live2D hit-region
    evidence.
  - Live2D parameter-lane diagnostics are Avatar evidence refs only; raw
    backend commands, provider payloads, package paths, and tokens are forbidden.
  - Live2D calibration refs are opaque resolver evidence only; calibration
    payloads, values, render/framing effects, Desktop preview truth, and carrier
    truth remain forbidden.
