version: 1
table_family: protocol_surface
owner: avatar
protocol_id: avatar_window_bounds_policy
description: >
  Dynamic window sizing policy for Nimi Avatar.
  Governs how the Tauri window's physical size is derived from the active
  embodiment backend's surface bounds plus the companion-surface footprint,
  which triggers cause a recompute, the formula that combines the two
  contributions, and the visible-area + multi-monitor constraints. Rule ids
  follow K-NAV-SHELL-002 / K-NAV-SHELL-003 / K-NAV-SHELL-005-* admitted in
  app-shell-contract.md §1.2 / §1.3 / §3.3.

policy: &avatar_window_bounds_policy_surfaces
  initial:
    width_px: 400
    height_px: 600
    reason: >
      Boot placeholder declared in app-shell-contract K-NAV-SHELL-001. Replaced
      on the first model_load recompute trigger (no user-visible flash).

  recompute_triggers:
    - id: model_load
      title: "Model alpha bounding box first available"
      source: avatar.model.load
      debounce_ms: 0
      reason: >
        First time embodiment_bounds becomes available. Resize must run
        synchronously so the window does not stay at the placeholder size
        once the model is on screen.
    - id: model_switch
      title: "Embodiment model switched"
      source: avatar.model.switch
      debounce_ms: 0
      reason: >
        New model may have different alpha bounds; resize on switch keeps
        embodiment_bounds + companion_footprint envelope tight.
    - id: companion_footprint_change
      title: "Companion-surface footprint changed"
      source: companion-surface root ResizeObserver
      debounce_ms: 80
      reason: >
        Bubble expand/collapse, composer multi-line growth, status row
        wraps, etc. Debounced so transient layout thrash does not produce
        a flurry of set_size calls.

  dimensions:
    embodiment_bounds:
      source: embodiment_projection.getSurfaceBounds()
      shape: rect (x, y, width, height)
      nominal_bounds_source: BackendBranch.nominalBounds
      reason: >
        Authoritative bounds for the current backend's render surface.
        BackendBranch.nominalBounds (per backend-branch-contract.md
        §2.2 BackendNominalBounds) is the canonical source for the
        starting envelope; embodiment_projection.getSurfaceBounds() is
        the per-frame refinement (e.g. Live2D alpha bounding box may
        shrink as motion plays).
    companion_footprint:
      source: companion-surface root element bounding rect (DOM)
      stack_axis: vertical_below_embodiment
      min_height_px: 96
      max_height_px: 400
      reason: >
        Companion-surface lives in the SAME Tauri window (not a separate
        popout). Its footprint is added to the window envelope so the
        bubble + composer stay visually attached to the embodiment.

  composition:
    formula: |
      width_px  = max(embodiment_bounds.width, companion_footprint.width) + 2 * padding_px
      height_px = embodiment_bounds.height + companion_footprint.height + 2 * padding_px
    padding_px: 16
    min_width_px: 320
    min_height_px: 480
    max_width_px: 1200
    max_height_px: 1600
    rounding: round_to_integer
    reason: >
      Width takes the wider of the two surfaces because companion may be
      narrower than the model body or vice versa. Height stacks them since
      composition mounts companion below embodiment. Padding is symmetric
      around the union so drop-shadow / focus rings don't get clipped.

  visible_area:
    rule_id: K-NAV-SHELL-010
    min_visible_ratio: 0.20
    target_metric: embodiment_bounds_area
    enforcer: nimi_avatar_constrain_window_to_visible_area
    reason: >
      Per app-shell-contract §3.3: at least 20% of the embodiment_bounds
      must remain inside the active monitor's work area so the user can
      drag the avatar back when it slides off screen. Companion footprint
      is excluded from the ratio so the avatar itself is what stays grabbable.

  multi_monitor:
    allow_cross_monitor_drag: true
    fallback_on_unavailable_monitor: primary
    reason: >
      Avatar may be dragged onto secondary monitors. If a previously used
      monitor becomes unavailable on relaunch, fall back to the primary
      monitor at default position rather than positioning off-screen.

  # per-backend nominal bounds defaults (used when BackendBranch.nominalBounds
  # is unavailable at first model_load — e.g. before Live2D model3.json
  # canvas-size header parses, before VRM scene bbox computes).
  backends:
    live2d:
      nominal_bounds_default:
        width_px: 400
        height_px: 600
      reason: >
        Live2D model3.json canvas size carries authoritative width/height;
        the 400×600 fallback is consumed only at the boot placeholder
        stage before the model loads. Once model3.json `Canvas.Width` /
        `Canvas.Height` parse, embodiment_bounds switches to the model
        alpha bounding box (per live2d-render-contract.md).
    vrm:
      nominal_bounds_default:
        width_px: 360
        height_px: 720
      framing_intent_default: bottom-companion
      aspect_default: 0.45
      reason: >
        VRM scene bbox is computed at load time from the Three.js scene
        traversal. The 360×720 fallback (taller, narrower) reflects the
        default `bottom-companion` framing intent (humanoid model
        framed from bottom-third with subtle body cut-off). aspect 0.45
        keeps the avatar window narrow on portrait setups. Once
        scene bbox + framing intent compute, embodiment_bounds is set
        to the framed bbox per vrm-backend-contract.md §4.

constraints:
  - description: >
      Dynamic resize must use programmatic Tauri set_size only. The
      `resizable: false` runtime effect prevents user drag-handle resize;
      programmatic set_size remains the sole authority on window size.
  - description: >
      Companion footprint contributes to total window size; companion is
      NOT in a separate Tauri window. Splitting companion into its own
      window is forbidden by K-NAV-SHELL-COMPOSITION-002 (single shell window
      hosts both stacks).
  - description: >
      Drag region is limited to embodiment-stage hit area
      (avatar-hit-region.ts). Companion-surface and degraded-surface
      pointer-down events MUST NOT trigger window drag — drag rescue must
      come from the embodiment-stage body region per K-NAV-SHELL-008.
  - description: >
      Recompute on model_load + model_switch fires synchronously with
      debounce_ms=0; companion_footprint_change is debounced (80ms) to
      coalesce ResizeObserver bursts.
  - description: >
      Width/height clamps (min/max) are last-resort guards. The expected
      operating envelope is governed by embodiment_bounds + companion
      footprint; clamps prevent runaway sizes from a misbehaving
      embodiment backend.

drift_checks:
  - description: >
      Any change to recompute_triggers source ids must be reflected in the
      renderer's resize wiring (app-shell/window-bounds.ts) and in
      avatar-event-contract.md if the trigger surface emits a new event.
  - description: >
      Any change to composition.formula must update both
      window-bounds-computer unit tests and the Tauri cargo test that
      asserts set_size receives the expected derived dimensions.
surfaces: *avatar_window_bounds_policy_surfaces
