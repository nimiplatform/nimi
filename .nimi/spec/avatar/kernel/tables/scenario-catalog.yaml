version: 1
table_family: product_catalog
owner: avatar
catalog_id: avatar_scenario_catalog
description: >
  Mock scenario catalog for Nimi Avatar explicit fixture mode. Each scenario is
  a *.mock.json file in src/shell/renderer/mock/scenarios/ driving NAS handler
  execution via the MockDriver (see mock-fixture-contract.md). These scenarios
  serve as dev/test integration fixtures while the normal app boot path runs
  through the real runtime/SDK consume chain.

default_scenario: "default"

scenarios: &avatar_scenario_catalog_entries
  - id: "default"
    title: "Default bootstrap scenario"
    file: "src/shell/renderer/mock/scenarios/default.mock.json"
    duration_ms: 15000
    loop: true
    description: >
      Default scenario loaded only when fixture mode is selected and no other
      scenario is chosen.
      Cycles a small activity sequence (neutral → happy → greet → thinking) to
      exercise the fallback motion group lookup and expression blending.
    tags: ["fixture-bootstrap", "runtime-smoke"]
    validates:
      - "Activity fallback motion group lookup"
      - "NAS runtime startup + handler discovery"
      - "Agent bundle initial projection"

  - id: "basic-emotion-cycle"
    title: "Basic emotion cycle"
    file: "src/shell/renderer/mock/scenarios/basic-emotion-cycle.mock.json"
    duration_ms: 24000
    loop: true
    description: >
      Rotates through all 10 core emotion activities with varying intensity.
      Validates motion group mapping for the emotion category and intensity
      variant suffix lookup.
    tags: ["emotion", "fallback"]
    validates:
      - "10 core emotion activities all present"
      - "Intensity variants (weak / moderate / strong) applied correctly"
      - "Activity interrupt (new activity pre-empts previous)"

  - id: "user-click-interaction"
    title: "User click → NAS event handler"
    file: "src/shell/renderer/mock/scenarios/user-click-interaction.mock.json"
    duration_ms: null
    loop: false
    description: >
      Idle scenario until user clicks avatar; trigger definitions fire reactive
      activity events based on click region (head / body / face). Validates
      reactive trigger flow from shell → driver.emit → MockDriver trigger match
      → runtime.agent.presentation.activity_requested injection → NAS event handler execution.
    tags: ["interaction", "reactive"]
    validates:
      - "avatar.user.click event delivery"
      - "MockDriver trigger filter matching"
      - "NAS event handler (avatar_user_click.js) execution"

  - id: "continuous-eye-tracking"
    title: "Continuous eye tracking handler"
    file: "src/shell/renderer/mock/scenarios/continuous-eye-tracking.mock.json"
    duration_ms: null
    loop: false
    description: >
      Idle agent bundle; relies on a continuous handler (eye_tracker.js) running
      at 60fps reading ctx.app.cursor_x / cursor_y and driving
      ParamEyeBallX / Y + ParamAngleX / Y. Validates continuous handler frame
      scheduling and parameter API throughput.
    tags: ["continuous", "parameter-api"]
    validates:
      - "Continuous handler fps scheduling"
      - "Parameter direct write (setParameter)"
      - "Frame budget warnings"

  - id: "sequence-greet"
    title: "Sequence handler with abort signal"
    file: "src/shell/renderer/mock/scenarios/sequence-greet.mock.json"
    duration_ms: 20000
    loop: true
    description: >
      Scenario emits 'greet' activity, then after 2000ms emits 'happy' to
      pre-empt mid-sequence. Validates that the greet handler's multi-step
      sequence (wave → wait → smile) respects the AbortSignal and yields to
      the new activity handler.
    tags: ["sequencing", "abort-signal"]
    validates:
      - "Handler execute() respects AbortSignal"
      - "New activity pre-empts previous mid-sequence"
      - "await wait() interrupted on abort"

  - id: "posture-sync"
    title: "Posture change → agent bundle projection"
    file: "src/shell/renderer/mock/scenarios/posture-sync.mock.json"
    duration_ms: 20000
    loop: true
    description: >
      Cycles posture.action_family through [observe, engage, support, rest] with
      runtime.agent.presentation.activity_requested appropriate for each. Validates that the agent bundle
      ctx delivered to handlers reflects the current posture, and handlers can
      branch behavior on ctx.posture.action_family.
    tags: ["posture", "bundle"]
    validates:
      - "Agent bundle posture update propagation"
      - "Handler branching on ctx.posture.action_family"
      - "Status text projection"

  - id: "vrm-lifecycle"
    title: "VRM BackendBranch lifecycle"
    file: "src/shell/renderer/mock/scenarios/vrm-lifecycle.mock.json"
    duration_ms: 8000
    loop: false
    description: >
      Drives the VRM BackendBranch lifecycle (manifest → carrier-surface → runtime →
      loader) end-to-end with a representative MIT-licensed VRM sample
      (VRM1_Constraint_Twist_Sample.vrm from pixiv/three-vrm; fetched on demand
      via apps/avatar/scripts/fetch-vrm-models.mjs into the gitignored
      apps/avatar/.cache/assets/vrm-models/ tree). The fixture's vrm_lifecycle
      block is consumed by vrm-lifecycle-e2e.test.tsx via the loaderOverride
      runtime seam (no .vrm binary required at test time).
    tags: ["vrm", "lifecycle"]
    validates:
      - "VRM manifest → loader → ready transition"
      - "webglcontextlost 1500ms single-retry recovery"
      - "Second context loss escalates to context_lost_twice fail-close"
      - "Asset switch disposes prior runtime + boots a new one"

  - id: "vrm-context-lost"
    title: "VRM context-lost recovery and fail-close"
    file: "src/shell/renderer/mock/scenarios/vrm-context-lost.mock.json"
    duration_ms: 7000
    loop: false
    description: >
      Isolates the context-loss proof required by the representative smoke matrix:
      first webglcontextlost recovers through the admitted 1500ms retry window,
      while a second loss before recovery fails closed with context_lost_twice.
      This scenario shares the VRM runtime lifecycle authority but is separate
      from vrm-lifecycle so smoke evidence can report seven distinct scenarios.
    tags: ["vrm", "lifecycle", "context-lost", "fail-close"]
    model_kind: "vrm"
    requires_assets: []
    validates:
      - "First context loss emits context_lost and context_restored"
      - "Second context loss before recovery emits failed_closed(context_lost_twice)"
      - "No context-loss path records placeholder visual readiness"

  - id: "vrm-listening"
    title: "VRM listening activity (generated provider fail-close)"
    file: "src/shell/renderer/mock/scenarios/vrm-listening.mock.json"
    duration_ms: 6000
    loop: false
    description: >
      Drives applyActivity('listening') through the VRM BackendBranch projection
      chain. Per activity-mapping.yaml v2 listening → vrm.motion='listen_lean'
      (loop=true, fade=0.3). The route is handled by generatedMotionProvider,
      not by built-in `.vrma` interchange assets. With the missing-provider
      test path, generatedMotionRuntime.play returns {played: false,
      reason: 'missing_profile'}; no `.vrma` fallback is
      treated as runtime support proof.
    tags: ["vrm", "lifecycle", "generated-motion"]
    model_kind: "vrm"
    requires_assets: []
    validates:
      - "applyActivity('listening') -> generatedMotionProvider.play({routeId: 'listen_lean'})"
      - "missing_profile fail-close when provider is absent"
      - "no .vrma fallback is counted as runtime motion support"
      - "Carrier surface remains visible (no fail_closed)"

  - id: "vrm-thinking"
    title: "VRM thinking activity (generated provider fail-close)"
    file: "src/shell/renderer/mock/scenarios/vrm-thinking.mock.json"
    duration_ms: 6000
    loop: false
    description: >
      Drives applyActivity('thinking') through the VRM projection chain. Per
      activity-mapping.yaml v2 thinking → vrm.motion='idle_subtle'. The route
      is handled by generatedMotionProvider; the physical idle_subtle.vrma file
      remains interchange-only evidence, not APML runtime support proof. With
      the missing-provider test path, generatedMotionRuntime.play returns
      {played: false, reason: 'missing_profile'}.
    tags: ["vrm", "lifecycle", "generated-motion"]
    model_kind: "vrm"
    requires_assets: ["idle_subtle"]
    validates:
      - "applyActivity('thinking') -> generatedMotionProvider.play({routeId: 'idle_subtle'})"
      - "missing_profile fail-close when provider is absent"
      - "generated motion route support does not depend on the .vrma registry"

  - id: "vrm-speaking-with-audio"
    title: "VRM speaking with non-synthetic audio (lipsync coordination)"
    file: "src/shell/renderer/mock/scenarios/vrm-speaking-with-audio.mock.json"
    duration_ms: 4000
    loop: false
    description: >
      Drives the AudioPipelineController voice playback path with a NON-synthetic audio
      mime (audio/wav). Exercises runtime.artifacts.readBytes →
      decodeAudioData → source.start → BackendAudioConsumer.attachAudioSource
      → wLipSync snapshot → vrm-lipsync-driver tick → emote state
      setLipsyncActive(true) → viseme suppression coordination. Audio pipeline
      state machine progresses idle → requested → started → completed.
    tags: ["vrm", "speaking", "lipsync"]
    model_kind: "vrm"
    requires_assets: []
    validates:
      - "AudioPipelineController state idle → requested → started → completed"
      - "BackendAudioConsumer.attachAudioSource called once during started phase"
      - "vrm-lipsync-driver tick reports {active: true} during voice phase"
      - "emote state suppresses viseme writes while lipsyncActive=true (skippedCount > 0)"
      - "Post-silent phase lipsync returns to {active: false}"

  - id: "vrm-speaking-silent-audio"
    title: "VRM speaking with synthetic mime (silent fail-close)"
    file: "src/shell/renderer/mock/scenarios/vrm-speaking-silent-audio.mock.json"
    duration_ms: 2000
    loop: false
    description: >
      Drives the AudioPipelineController voice playback path with the SYNTHETIC mime
      application/x-nimi-synthetic-lipsync. Per design-05 §'Synthetic mime
      fail-close' the controller fast-paths: NO decodeAudioData call, NO
      sink.attachAudioSource, sink.silent() invoked, state progresses idle →
      requested → completed (consumer state machine still advances). Mouth
      stays at zero throughout — explicit silent voice + silent mouth.
    tags: ["vrm", "speaking", "synthetic-fail-close"]
    model_kind: "vrm"
    requires_assets: []
    validates:
      - "Synthetic mime fast-path: no AudioContext.decodeAudioData call"
      - "AudioPipelineController state idle → requested → completed (with synthetic_audio_no_playback reason)"
      - "BackendAudioConsumer.silent() invoked at least once"
      - "BackendAudioConsumer.attachAudioSource NOT invoked"
      - "vrm-lipsync-driver remains {active: false}"

  - id: "vrm-emote-cycle"
    title: "VRM emote crossfade cycle (cap + skipped_count invariants)"
    file: "src/shell/renderer/mock/scenarios/vrm-emote-cycle.mock.json"
    duration_ms: 2000
    loop: false
    description: >
      Cycles neutral → happy → sad → relaxed → neutral via applyEmotion to validate
      the emote bundle crossfade (per-bundle blend_duration_sec
      ramp), the primary expressive weight cap (≤ 0.8 per
      vrm-emote-states.yaml constraint), and avatar.emote.applied evidence
      (skipped_count=0 since lipsync inactive).
    tags: ["vrm", "emote", "crossfade"]
    model_kind: "vrm"
    requires_assets: []
    validates:
      - "Sequential applyEmotion updates emoteState.snapshot().activeEmote in order"
      - "Primary expressive weight per emote ≤ 0.8 (cap; neutral preset exempt)"
      - "skippedCount=0 when lipsyncActive=false"
      - "VRM.expressionManager.setValue called for each emote bundle's preset names"

constraints:
  drift_checks:
    - description: "每个 scenario file 必须存在于指定路径"
    - description: "每个 scenario id 在 catalog 内唯一"
    - description: "default_scenario 必须在 scenarios 列表中"
    - description: "loop: true 的 scenario 必须有 finite duration_ms"
    - description: "scenario file 内的 scenario_id 字段必须等于 catalog id"
    - description: "新增 scenario 必须更新本 catalog，不允许 floating scenario files"
entries: *avatar_scenario_catalog_entries
