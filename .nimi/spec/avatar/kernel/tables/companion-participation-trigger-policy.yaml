version: 1
table_family: protocol_surface
owner: avatar
protocol_id: companion_participation_trigger_policy
description: >
  Trigger policy for Avatar companion/persona/debug participation consumers.
  Trigger sources are UI/domain causes only; Runtime still owns execution
  admission.
source_contract: .nimi/spec/avatar/kernel/companion-participation-consumer-contract.md
trigger_sources: &companion_participation_trigger_surfaces
  none:
    execution_request: forbidden
    allowed_profiles:
      - presentation_only
      - debug_or_probe_projection
    requires_room_orchestration: false
    posture: display_only
  user_explicit:
    execution_request: allowed_through_runtime_admission
    allowed_profiles:
      - canonical_agent_chat
      - realm_group_participation
      - scenario_sandbox
      - oasis_world_participation
      - debug_or_probe
    requires_room_orchestration: when_multi_participant_or_domain_context
    posture: explicit_user_control
  scheduled_proactive:
    execution_request: allowed_only_when_separate_scheduler_authority_exists
    allowed_profiles:
      - profile_authority_required
    requires_room_orchestration: true
    posture: not_admitted_by_avatar_surface_alone
  domain_event:
    execution_request: allowed_through_domain_room_orchestration
    allowed_profiles:
      - realm_group_participation
      - scenario_sandbox
      - oasis_world_participation
    requires_room_orchestration: true
    posture: domain_evidence_required
forbidden_grants:
  - prompt_assembly
  - provider_model_routing
  - memory_write
  - cognition_write
  - canonical_chat_commit
  - domain_commit
  - queue_budget_timeout_fairness
  - private_scheduler
validation:
  unknown_trigger_source: fail_closed
  missing_profile_for_execution: fail_closed
  missing_room_orchestration_for_domain_context: fail_closed
  local_fallback_execution: forbidden
surfaces: *companion_participation_trigger_surfaces
