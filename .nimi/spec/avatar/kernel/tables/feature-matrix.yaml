version: 4
table_family: product_catalog
owner: avatar
catalog_id: avatar_capability_matrix
entries:
  - shell_surface_authority
  - surface_composition
  - i18n_design_tokens
  - voice_lipsync
  - window_settings
  - multi_backend_carrier
  - live2d_branch_audio_pipeline
  - vrm_lifecycle
  - generated_motion_emote
  - multi_backend_hit_region
  - representative_smoke_evidence
description: >
  Final capability matrix for Nimi Avatar. This table lists the active
  Avatar product capability baselines, their authority references, dependency
  order, and verification gates. It is not a delivery journal and must not
  encode topic lifecycle, implementation history, or process provenance.

capabilities: &avatar_capability_matrix_entries
  shell_surface_authority:
    title: "Shell surface authority"
    authority_refs:
      - app-shell-contract.md
      - avatar-event-contract.md
      - tables/feature-matrix.yaml
    requires: []
    scope:
      - "Transparent no-chrome always-on-top shell semantics"
      - "Companion Surface, Degraded Surface, and Composition State authority"
      - "Avatar event namespace extensions for shell, composition, companion, audio, carrier, and hit-region events"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar check:spec-consistency"
      - "pnpm exec nimicoding validate-spec-governance --profile nimi --scope all"

  surface_composition:
    title: "Surface composition implementation"
    authority_refs:
      - app-shell-contract.md
      - avatar-event-contract.md
    requires:
      - shell_surface_authority
    scope:
      - "embodiment-stage owns the full embodiment carrier area"
      - "companion-surface is always visible and bound to the current launch-selected anchor"
      - "degraded-surface is mutually exclusive with ready composition"
      - "retired trigger-toggle and mixed recovery-panel ready paths are not admitted"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar test"
      - "pnpm --filter @nimiplatform/avatar lint"

  i18n_design_tokens:
    title: "Avatar i18n and design tokens"
    authority_refs:
      - app-shell-contract.md
      - tables/i18n-keys.yaml
    requires:
      - surface_composition
    scope:
      - "All visible Avatar shell copy is declared in tables/i18n-keys.yaml"
      - "English and Chinese locale files stay in exact key alignment"
      - "Avatar shell visual constants are centralized through app-shell tokens"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar check:spec-consistency"
      - "pnpm --filter @nimiplatform/avatar test"

  voice_lipsync:
    title: "Voice and lipsync end-to-end"
    authority_refs:
      - avatar-event-contract.md
      - live2d-render-contract.md
      - backend-branch-contract.md
      - .nimi/spec/runtime/kernel/agent-presentation-stream-contract.md
    requires:
      - surface_composition
    scope:
      - "Runtime-owned PresentationTimeline remains canonical voice timing truth"
      - "Avatar audio pipeline reads bytes through runtime.artifacts.readBytes"
      - "BackendAudioConsumer drives backend-local lipsync proof"
      - "Silent, synthetic, missing, interrupted, and canceled audio states fail closed"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar test"
      - "pnpm --filter @nimiplatform/sdk typecheck"
      - "cd runtime && go test ./internal/services/runtimeartifact/..."

  window_settings:
    title: "Window bounds and settings"
    authority_refs:
      - app-shell-contract.md
      - tables/window-bounds-policy.yaml
    requires:
      - surface_composition
    scope:
      - "Dynamic window sizing is derived from embodiment bounds plus companion footprint"
      - "Drag region is limited to embodiment-stage and excludes companion/degraded surfaces"
      - "Settings popover owns user-visible Avatar shell toggles"
      - "Visible-area constraint keeps the embodiment recoverable on screen"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar test"
      - "cd apps/avatar/src-tauri && cargo test"

  multi_backend_carrier:
    title: "Multi-backend carrier authority"
    authority_refs:
      - backend-branch-contract.md
      - vrm-backend-contract.md
      - embodiment-projection-contract.md
      - carrier-visual-acceptance-contract.md
      - .nimi/spec/runtime/kernel/runtime-artifact-contract.md
      - .nimi/spec/sdks/kernel/runtime-contract.md
    requires:
      - shell_surface_authority
      - voice_lipsync
    scope:
      - "BackendKind is the closed union live2d | vrm"
      - "BackendBranch is the public carrier abstraction consumed by Avatar shell and NAS"
      - "Runtime artifact bytes retrieval is the only admitted audio/artifact byte path"
      - "VRM and Live2D branches must produce the same carrier evidence shape"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar check:spec-consistency"
      - "pnpm --filter @nimiplatform/avatar typecheck"
      - "pnpm --filter @nimiplatform/sdk typecheck"
      - "cd runtime && go build ./..."
      - "pnpm proto:lint && pnpm proto:drift-check"

  live2d_branch_audio_pipeline:
    title: "Live2D branch and audio pipeline"
    authority_refs:
      - live2d-render-contract.md
      - live2d-asset-compatibility-contract.md
      - backend-branch-contract.md
    requires:
      - multi_backend_carrier
    scope:
      - "Live2D is a backend-specific branch, not Avatar semantic home"
      - "Live2D parameter-id direct writes are exposed only through the live2d extension escape hatch"
      - "lipsync_frame_batch consume path is not admitted under apps/avatar/src"
      - "caller-injected fetchBytes/fetchAudioBytes patterns are not admitted under apps/avatar/src"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar typecheck"
      - "pnpm --filter @nimiplatform/avatar test"
      - "pnpm --filter @nimiplatform/avatar lint"
      - "pnpm check:apps-avatar-isolation"

  vrm_lifecycle:
    title: "VRM lifecycle and diagnostics"
    authority_refs:
      - vrm-backend-contract.md
      - backend-branch-contract.md
      - tables/scenario-catalog.yaml
    requires:
      - multi_backend_carrier
    scope:
      - "VRM load, context-lost recovery, dispose, and asset switch fail closed"
      - "MToon outline policy is decorative and cannot mask carrier failure"
      - "VRM nominal bounds and framing intent feed the shared window-bounds policy"
      - "VRM diagnostics record lifecycle failures without placeholder readiness"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar typecheck"
      - "pnpm --filter @nimiplatform/avatar test"
      - "pnpm --filter @nimiplatform/avatar lint"

  generated_motion_emote:
    title: "Generated motion and emote projection"
    authority_refs:
      - generated-motion-provider-contract.md
      - tables/generated-motion-routes.yaml
      - tables/activity-mapping.yaml
      - tables/vrm-emote-states.yaml
    requires:
      - vrm_lifecycle
    scope:
      - "Runtime typed projection enters Avatar generated motion provider through admitted route ids"
      - "Generated motion provider returns executable backend output or fail-closed evidence"
      - ".vrma remains interchange-only unless a physical preset file is admitted"
      - "Emote and lipsync preset writes coordinate without dual ownership of viseme state"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar test"
      - "pnpm --filter @nimiplatform/avatar check:spec-consistency"

  multi_backend_hit_region:
    title: "Multi-backend hit region and window bounds"
    authority_refs:
      - app-shell-contract.md
      - backend-branch-contract.md
      - tables/window-bounds-policy.yaml
    requires:
      - generated_motion_emote
      - window_settings
    scope:
      - "Hit region combines alpha-mask query and bbox fallback for each backend"
      - "Click-through and drag decisions are backend-aware and throttled"
      - "Device tier fallback degrades to bbox-only with explicit evidence"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar test"
      - "cd apps/avatar/src-tauri && cargo test"

  representative_smoke_evidence:
    title: "Representative smoke evidence"
    authority_refs:
      - carrier-visual-acceptance-contract.md
      - mock-fixture-contract.md
      - tables/scenario-catalog.yaml
    requires:
      - multi_backend_hit_region
    scope:
      - "Representative scenarios cover lifecycle, context loss, generated motion, speech, synthetic silence, and emote cycle"
      - "Smoke evidence records executable carrier behavior and must not imply final launch readiness"
      - "Visual-human acceptance remains separately owned by carrier visual acceptance authority"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar test"
      - "pnpm --filter @nimiplatform/avatar check:spec-consistency"

constraints:
  drift_checks:
    - description: "Every implementation feature must map to one capability id in this matrix or to a more specific Avatar table authority."
    - description: "Capability dependencies are strict: implementation must not claim a dependent capability before its authority references and verification gates are present."
    - description: "Unadmitted surface, event, backend state, route id, emote, i18n key, or window policy cannot appear in implementation."
    - description: "Representative smoke evidence proves the named scenario matrix only; it must not be used as Avatar launch-readiness closure."
  hard_cut_rules:
    - description: "Retired feature-phasing framing is not active authority."
    - description: "Small chat button trigger path is not admitted."
    - description: "Recovery panel mixed into ready state is not admitted."
    - description: "lipsync_frame_batch consume path is not admitted under apps/avatar/src."
    - description: "fetchAudioBytes and caller-injected fetchBytes patterns are not admitted under apps/avatar/src."

surfaces: *avatar_capability_matrix_entries
