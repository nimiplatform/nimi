version: 4
table_family: product_catalog
owner: avatar
catalog_id: avatar_capability_matrix
entries:
  - shell_surface_authority
  - surface_composition
  - embodied_output_interaction
  - transient_text_composer
  - per_avatar_scale
  - i18n_design_tokens
  - voice_lipsync
  - wake_local_audio_lifecycle
  - window_settings
  - multi_backend_carrier
  - live2d_branch_audio_pipeline
  - vrm_lifecycle
  - generated_motion_emote
  - nimi2d_backend_contract
  - nimi2d_renderer_composer_proof
  - nimi2d_carrier_visual_pixel_proof
  - nimi2d_live_action_bench
  - multi_backend_hit_region
  - representative_smoke_evidence
description: >
  Final capability matrix for Nimi Avatar. This table lists the active
  Avatar product capability baselines, their authority references, dependency
  order, and verification gates. It is not a delivery journal and must not
  encode host task lifecycle, implementation history, or process provenance.

capabilities: &avatar_capability_matrix_entries
  shell_surface_authority:
    title: "Shell surface authority"
    authority_refs:
      - app-shell-contract.md
      - avatar-event-contract.md
      - tables/feature-matrix.yaml
    requires: []
    scope:
      - "Transparent no-chrome always-on-top shell semantics"
      - "Embodiment-first ready posture, transient overlay authority, Degraded Surface, and Composition State authority"
      - "Avatar event namespace extensions for shell, composition, audio, carrier, and hit-region events"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar check:spec-consistency"
      - "pnpm exec nimicoding validate-spec-governance --profile nimi --scope all"

  surface_composition:
    title: "Surface composition implementation"
    authority_refs:
      - app-shell-contract.md
      - avatar-event-contract.md
    requires:
      - shell_surface_authority
    scope:
      - "embodiment-stage owns the full embodiment carrier area and is the only default ready visible surface"
      - "context menu, action radial, transient composer, captions, and settings are transient overlays"
      - "degraded-surface is mutually exclusive with ready composition"
      - "retired trigger-toggle, permanent bottom companion bar, and mixed recovery-panel ready paths are not admitted"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar test"
      - "pnpm --filter @nimiplatform/avatar lint"

  embodied_output_interaction:
    title: "Embodied output interaction"
    authority_refs:
      - app-shell-contract.md
      - avatar-event-contract.md
    requires:
      - surface_composition
    scope:
      - "single click is local presentation interaction only"
      - "press-hold opens character action radial"
      - "right-click opens avatar-local tool menu"
      - "double-click requests Runtime-owned foreground response priority"
      - "Runtime owns wake/listening/output orchestration authority"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar check:spec-consistency"
      - "pnpm --filter @nimiplatform/avatar test"

  transient_text_composer:
    title: "Transient text composer"
    authority_refs:
      - app-shell-contract.md
      - avatar-event-contract.md
      - .nimi/spec/runtime/kernel/agent-conversation-anchor-contract.md
    requires:
      - embodied_output_interaction
    scope:
      - "composer opens from context menu or action radial"
      - "composer shows no history and does not auto-close after submit"
      - "focus switch, Escape, explicit close, or composition change dismisses composer"
      - "Desktop agent chat remains history authority"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar check:spec-consistency"
      - "pnpm --filter @nimiplatform/avatar test"

  per_avatar_scale:
    title: "Per-avatar instance scale"
    authority_refs:
      - app-shell-contract.md
      - tables/window-bounds-policy.yaml
      - avatar-event-contract.md
    requires:
      - embodied_output_interaction
      - window_settings
    scope:
      - "wheel over opaque avatar body scales current avatar instance"
      - "scale persists by avatar_instance_id"
      - "scale affects embodiment bounds, hit-region, window size, and visible-area constraint"
      - "context menu exposes reset scale"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar test"
      - "cd apps/avatar/src-tauri && cargo test"

  i18n_design_tokens:
    title: "Avatar i18n and design tokens"
    authority_refs:
      - app-shell-contract.md
    requires:
      - surface_composition
    scope:
      - "All visible Avatar shell copy is locale-resource backed"
      - "Concrete key coverage is app-owned implementation validation, not Avatar kernel table authority"
      - "English and Chinese locale files stay in exact app-owned key alignment"
      - "Avatar shell visual constants are centralized through app-shell tokens"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar check:spec-consistency"
      - "pnpm --filter @nimiplatform/avatar test"

  voice_lipsync:
    title: "Voice and lipsync end-to-end"
    authority_refs:
      - avatar-event-contract.md
      - live2d-render-contract.md
      - backend-branch-contract.md
      - .nimi/spec/runtime/kernel/agent-presentation-stream-contract.md
    requires:
      - surface_composition
    scope:
      - "Runtime-owned PresentationTimeline remains canonical voice timing truth"
      - "Avatar audio pipeline reads bytes through runtime.artifacts.readBytes"
      - "BackendAudioConsumer drives backend-local lipsync proof"
      - "Silent, synthetic, missing, interrupted, and canceled audio states fail closed"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar test"
      - "pnpm --filter @nimiplatform/sdk typecheck"
      - "cd runtime && go test ./internal/services/runtimeartifact/..."

  wake_local_audio_lifecycle:
    title: "Wake and local audio lifecycle boundary"
    authority_refs:
      - wake-local-audio-lifecycle-contract.md
      - app-shell-contract.md
      - avatar-event-contract.md
      - companion-participation-consumer-contract.md
      - .nimi/spec/runtime/kernel/agent-presentation-stream-contract.md
    requires:
      - surface_composition
      - voice_lipsync
    scope:
      - "Runtime owns any future wake phrase lifecycle admission, consent, policy, and state projection"
      - "Avatar owns foreground-priority intent, local audio privacy indicators, playback/lipsync rendering, and fail-closed visual state; Avatar does not own microphone capture lifecycle"
      - "Desktop owns launch/window/OS permission surfaces only and must not parse wake audio or supply hidden microphone truth"
      - "Current slice admits Runtime-owned wake/listening orchestration projection; Avatar-local start/stop/commit listening controls, background listening, lock-screen continuation, and hidden hot mic remain unadmitted"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar check:spec-consistency"
      - "pnpm --filter @nimiplatform/avatar test"

  window_settings:
    title: "Window bounds and settings"
    authority_refs:
      - app-shell-contract.md
      - tables/window-bounds-policy.yaml
    requires:
      - surface_composition
    scope:
      - "Dynamic window sizing is derived from scaled embodiment bounds"
      - "Drag region is limited to embodiment-stage and excludes transient overlays/degraded surfaces"
      - "Context-menu settings overlay owns user-visible Avatar shell toggles"
      - "Visible-area constraint keeps the embodiment recoverable on screen"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar test"
      - "cd apps/avatar/src-tauri && cargo test"

  multi_backend_carrier:
    title: "Multi-backend carrier authority"
    authority_refs:
      - backend-branch-contract.md
      - vrm-backend-contract.md
      - embodiment-projection-contract.md
      - carrier-visual-acceptance-contract.md
      - .nimi/spec/runtime/kernel/runtime-artifact-contract.md
      - .nimi/spec/sdks/kernel/runtime-contract.md
    requires:
      - shell_surface_authority
      - voice_lipsync
    scope:
      - "BackendKind is the closed union live2d | vrm | nimi2d"
      - "BackendBranch is the public carrier abstraction consumed by Avatar shell and NAS"
      - "Runtime artifact bytes retrieval is the only admitted audio/artifact byte path"
      - "VRM and Live2D branches must produce the same carrier evidence shape"
      - "Nimi2D branch is admitted only for valid package/profile input and remains bounded by the Nimi2D backend contract"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar check:spec-consistency"
      - "pnpm --filter @nimiplatform/avatar typecheck"
      - "pnpm --filter @nimiplatform/sdk typecheck"
      - "cd runtime && go build ./..."
      - "pnpm proto:lint && pnpm proto:drift-check"

  live2d_branch_audio_pipeline:
    title: "Live2D branch and audio pipeline"
    authority_refs:
      - live2d-render-contract.md
      - live2d-asset-compatibility-contract.md
      - backend-branch-contract.md
    requires:
      - multi_backend_carrier
    scope:
      - "Live2D is a backend-specific branch, not Avatar semantic home"
      - "Live2D parameter-id direct writes are exposed only through the live2d extension escape hatch"
      - "lipsync_frame_batch consume path is not admitted under apps/avatar/src"
      - "caller-injected fetchBytes/fetchAudioBytes patterns are not admitted under apps/avatar/src"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar typecheck"
      - "pnpm --filter @nimiplatform/avatar test"
      - "pnpm --filter @nimiplatform/avatar lint"
      - "pnpm check:apps-avatar-isolation"

  vrm_lifecycle:
    title: "VRM lifecycle and diagnostics"
    authority_refs:
      - vrm-backend-contract.md
      - backend-branch-contract.md
      - tables/scenario-catalog.yaml
    requires:
      - multi_backend_carrier
    scope:
      - "VRM load, context-lost recovery, dispose, and asset switch fail closed"
      - "MToon outline policy is decorative and cannot mask carrier failure"
      - "VRM nominal bounds and framing intent feed the shared window-bounds policy"
      - "VRM diagnostics record lifecycle failures without placeholder readiness"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar typecheck"
      - "pnpm --filter @nimiplatform/avatar test"
      - "pnpm --filter @nimiplatform/avatar lint"

  generated_motion_emote:
    title: "Generated motion and emote projection"
    authority_refs:
      - generated-motion-provider-contract.md
      - tables/generated-motion-routes.yaml
      - tables/activity-mapping.yaml
      - tables/vrm-emote-states.yaml
    requires:
      - vrm_lifecycle
    scope:
      - "Runtime typed projection enters Avatar generated motion provider through admitted route ids"
      - "Generated motion provider returns executable backend output or fail-closed evidence"
      - ".vrma remains interchange-only unless a physical preset file is admitted"
      - "Emote and lipsync preset writes coordinate without dual ownership of viseme state"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar test"
      - "pnpm --filter @nimiplatform/avatar check:spec-consistency"

  nimi2d_backend_contract:
    title: "Nimi2D backend contract"
    authority_refs:
      - nimi2d-backend-contract.md
      - backend-branch-contract.md
      - tables/nimi2d-backend-capability-profile.schema.yaml
      - tables/nimi2d-live-action-routes.yaml
      - .nimi/spec/nimi2d/kernel/package-manifest-contract.md
      - .nimi/spec/nimi2d/kernel/generation-bench-contract.md
    requires:
      - multi_backend_carrier
      - generated_motion_emote
    scope:
      - "Avatar recognizes kind: nimi2d as an admitted backend branch for admitted Nimi2D packages"
      - "Invalid, digest-mismatched, evidence-missing, or incomplete Nimi2D package/profile input fails closed"
      - "Avatar runtime verifies package manifest digest and admission/content evidence refs without duplicating the offline Nimi2D validator"
      - "Nimi2D backend consumes package proven_tier and validator evidence, never requested_tier"
      - "Live Action runtime proof cannot replace Nimi2D Generation Bench go/no-go"
      - "Tier-1 speech mouth is jaw/amplitude only; true viseme remains tier-2+"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar check:spec-consistency"
      - "pnpm --filter @nimiplatform/avatar typecheck"
      - "pnpm --filter @nimiplatform/avatar test"

  nimi2d_renderer_composer_proof:
    title: "Nimi2D renderer and composer proof"
    authority_refs:
      - nimi2d-backend-contract.md
      - carrier-visual-acceptance-contract.md
      - tables/nimi2d-backend-capability-profile.schema.yaml
    requires:
      - nimi2d_backend_contract
    scope:
      - "Valid Nimi2D package/profile input creates a real Avatar BackendBranch with a PixiJS renderer foundation"
      - "PixiJS renderer consumes package canvas, render_layers placement/bounds geometry, rectangular texture_bounds cropping, and optional package alpha_mask_asset bindings"
      - "PixiJS renderer consumes profile-declared motion_routes bindings for route-specific sprite translate/scale/opacity transforms without hardcoded route ids"
      - "Base body visual layers are rendered only with the selected default outfit; base-body-only display remains unreachable"
      - "BackendProjection updates local scheduler/composer state for activity, expression, and motion"
      - "Composer scheduler advances frame time, expression fade, motion fade/recovery, queued motion handoff, interrupt counters, and idle-life clock without LLM numeric frame control"
      - "BackendAudioConsumer feeds tier-1 amplitude mouth state; true viseme remains tier-2+ and unsupported"
      - "This proof does not close mounted-surface release visual acceptance or Nimi2D Generation Bench"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar typecheck"
      - "pnpm --filter @nimiplatform/avatar test -- create-backend-branch.test.ts nimi2d-backend-branch.test.tsx"
      - "pnpm --filter @nimiplatform/avatar check:spec-consistency"

  nimi2d_carrier_visual_pixel_proof:
    title: "Nimi2D carrier visual pixel proof"
    authority_refs:
      - carrier-visual-acceptance-contract.md
      - nimi2d-backend-contract.md
      - tables/nimi2d-backend-capability-profile.schema.yaml
    requires:
      - nimi2d_renderer_composer_proof
    scope:
      - "Nimi2D Pixi renderer foundation uses Avatar-owned deterministic offscreen layer composition with package render_layers geometry and optional package alpha_mask_asset bindings for pixel sampling"
      - "Pixel proof samples the same package render plan, layer geometry, texture bounds, layer assets, and alpha mask assets consumed by the Avatar Nimi2D surface"
      - "BackendHitRegion alpha query samples composited Nimi2D layer alpha and package alpha mask assets from the same package render plan and fails closed to null when the probe is unavailable or the default outfit layer is absent"
      - "BackendHitRegion body/drag bbox is derived from package visible render-layer geometry and is consumed by the existing EmbodimentStage click-through path"
      - "Mounted Pixi canvas capture writes human-visible artifact evidence only when readable mounted pixels are present; blank or unreadable frames record visual error evidence"
      - "Default outfit visible pixels are required"
      - "Base-body-only frames fail closed and cannot count as visual success"
      - "This proof does not close release-grade OS/window-shape acceptance, Nimi2D Generation Bench, or release-grade launch recording acceptance"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar typecheck"
      - "pnpm --filter @nimiplatform/avatar test -- nimi2d-carrier-visual-proof.test.ts nimi2d-backend-branch.test.tsx embodiment-stage.test.tsx"
      - "pnpm --filter @nimiplatform/avatar check:spec-consistency"

  nimi2d_live_action_bench:
    title: "Nimi2D Live Action Bench"
    authority_refs:
      - nimi2d-live-action-bench-contract.md
      - nimi2d-backend-contract.md
      - tables/nimi2d-live-action-routes.yaml
      - tables/nimi2d-backend-capability-profile.schema.yaml
    requires:
      - nimi2d_carrier_visual_pixel_proof
    scope:
      - "Bench exercises a real Avatar kind: nimi2d backend surface, not fixture-only scoring"
      - "Bench measures default outfit visibility, projection latency, state legibility, scheduler/blend stability, tier-1 jaw alignment, and interrupt recovery"
      - "Gaze is explicitly unsupported_v1 and cannot be counted as success"
      - "Bench does not admit release-grade gesture queue policy, gaze, or route-specific motion transform quality beyond profile-declared sprite transforms"
      - "Bench result cannot close Nimi2D Generation Bench or mounted-surface release visual acceptance"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar typecheck"
      - "pnpm --filter @nimiplatform/avatar test -- nimi2d-live-action-bench.test.tsx"
      - "pnpm --filter @nimiplatform/avatar check:spec-consistency"

  multi_backend_hit_region:
    title: "Multi-backend hit region and window bounds"
    authority_refs:
      - app-shell-contract.md
      - backend-branch-contract.md
      - tables/window-bounds-policy.yaml
    requires:
      - generated_motion_emote
      - window_settings
    scope:
      - "Hit region combines alpha-mask query and bbox fallback for each backend"
      - "Click-through and drag decisions are backend-aware and throttled"
      - "Device tier fallback degrades to bbox-only with explicit evidence"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar test"
      - "cd apps/avatar/src-tauri && cargo test"

  representative_smoke_evidence:
    title: "Representative smoke evidence"
    authority_refs:
      - carrier-visual-acceptance-contract.md
      - mock-fixture-contract.md
      - tables/scenario-catalog.yaml
      - tables/acceptance-recording-matrix.yaml
    requires:
      - multi_backend_hit_region
    scope:
      - "Representative scenarios cover lifecycle, context loss, generated motion, speech, synthetic silence, and emote cycle"
      - "Smoke evidence records executable carrier behavior and must not imply final launch readiness"
      - "Visual-human acceptance remains separately owned by carrier visual acceptance authority"
      - "Launch-readiness acceptance requires recording matrix evidence for idle, hover, click, drag, Runtime-projected voice/listening, TTS lipsync, interrupt, runtime degraded, and both backend families"
    verification_commands:
      - "pnpm --filter @nimiplatform/avatar test"
      - "pnpm --filter @nimiplatform/avatar check:spec-consistency"

constraints:
  drift_checks:
    - description: "Every implementation feature must map to one capability id in this matrix or to a more specific Avatar table authority."
    - description: "Capability dependencies are strict: implementation must not claim a dependent capability before its authority references and verification gates are present."
    - description: "Unadmitted surface, event, backend state, route id, emote, or window policy cannot appear in implementation."
    - description: "Representative smoke evidence proves the named scenario matrix only; it must not be used as Avatar launch-readiness closure."
  hard_cut_rules:
    - description: "Retired feature-phasing framing is not active authority."
    - description: "Small chat button trigger path is not admitted."
    - description: "Recovery panel mixed into ready state is not admitted."
    - description: "lipsync_frame_batch consume path is not admitted under apps/avatar/src."
    - description: "fetchAudioBytes and caller-injected fetchBytes patterns are not admitted under apps/avatar/src."

surfaces: *avatar_capability_matrix_entries
