format: nimicoding.authority/v2
owner: team.desktop
scope: desktop.agent-projection
units:
  - id: definition.nimi.desktop.agent-projection.agent-chat
    kind: definition
    title: Desktop LocalAgent Conversation projection
    meaning: Desktop owns Nimi Home placement, user intent controls, bounded immutable snapshot, lorebook, Cognition, summary, recall-count, context-capacity, and optional Memory status rendering, explicit unavailable states, and ephemeral UI state for LocalAgent Conversation, while Runtime owns LocalAgent identity, source projection, execution, Conversation, summary, context planning, state, voice, continuity, and lifecycle and executes AI Jobs required by Cognition pipelines; Cognition owns Memory and Knowledge semantic admission and canonical state plus its private source corpus and generation lifecycle, and Knowledge V1 has no active Desktop projection.
  - id: definition.nimi.desktop.agent-projection.conversation-capability
    kind: definition
    title: Desktop Runtime capability projection
    meaning: Desktop may display bounded Runtime LocalAgent, optional typed Memory, CapabilityContract, derived admission, Job, and media projections without owning the shared LocalAgent AIConfig, Machine Loadout store, Loadout, resource policy, Memory semantic truth, or execution truth; Knowledge V1 remains inactive and has no Desktop projection.
  - id: definition.nimi.desktop.agent-projection.avatar-surface
    kind: definition
    title: Desktop Avatar projection placement
    meaning: Desktop owns Nimi Home placement and explicit launch or focus intent for Avatar, Runtime owns the selected LocalAgent and its semantic projections, and Avatar owns visual rendering and backend-local state; Desktop is not an Avatar driver or LocalAgent owner.
  - id: definition.nimi.desktop.agent-projection.delegation-control
    kind: definition
    title: Deferred delegated capability projection
    meaning: Workflow, MCP, external-agent entry, and other delegated capability controls are optional future projections outside ordinary LocalAgent readiness and do not create a Desktop execution, credential, gateway, or audit owner.
  - id: definition.nimi.desktop.agent-projection.companion-panel
    kind: definition
    title: Desktop LocalAgent companion projection
    meaning: A Desktop companion panel is a first-party LocalAgent projection that owns placement and bounded user controls only and never owns execution, Conversation, Memory, Knowledge, voice truth, scheduling, provider routing, or Avatar rendering.
  - id: definition.nimi.desktop.agent-projection.realm-group-participation
    kind: definition
    lifecycle: removed
    title: Deferred Realm group LocalAgent participation projection
    reason: Removed because Realm and Nimi hard-cut group LocalAgent participation and the complete group-chat product instead of retaining a future Desktop projection.
  - id: rule.nimi.desktop.agent-projection.r001
    kind: rule
    title: LocalAgent Conversation accepts typed user intent only
    modality: must
    statement: Desktop submits canonical typed current-user LocalAgent intent through the same standard SDK and Runtime seam as every formal App, uses a session-scoped agentHandle as the only Agent selector and a Runtime-issued Conversation anchor only as a revalidated continuity fence, contains zero or one bounded text part plus zero or one Runtime image artifact reference with at least one part for durable turn send, and never attaches raw media bytes to Conversation operations, prompts, provider choices, route or resource overrides, Memory, Knowledge, credentials, Runtime proof, or caller-composed execution context.
    condition: Whenever Desktop starts or continues a LocalAgent Conversation.
    failure: Reject untyped, unauthorized, or context-bearing input before execution.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r002
    kind: rule
    title: Desktop consumes Runtime LocalAgent truth
    modality: must
    statement: Desktop renders the canonical rich sanitized Runtime LocalAgent live union including turn, text delta, reasoning status without private content, action, tool, committed response, interrupted, and failed state together with committed text and image messages, image-action lifecycle and artifact references, final voice sidecars, presentation, continuity, and canonical failures using the same typed SDK, stable identities, event sequence, reducer, and bounded snapshot semantics as every other formal App; Desktop-specific placement, capture, playback, and rendering roles create no different selector, wire, event union, or execution truth, and UI state, local history, optimistic output, or cached events never becomes Runtime truth.
    condition: Whenever Desktop renders or replays LocalAgent state.
    failure: Reject local semantic reconstruction and use the Runtime projection or explicit unavailable state.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r003
    kind: rule
    title: Unavailable LocalAgent Conversation stays explicit
    modality: must
    statement: Missing Runtime, authorization, LocalAgent, Conversation, route, Text, STT, TTS, or evidence required by the requested operation renders a typed unavailable, blocked, pending, failed, or refused state; an unavailable optional Memory projection remains independently typed without blocking LocalAgent Conversation, and inactive Knowledge V1 is not approximated as a required or available projection.
    condition: Whenever a LocalAgent Conversation projection cannot operate.
    failure: Display the owning failure without fallback execution or fake success.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r004
    kind: rule
    title: Desktop cannot synthesize LocalAgent success
    modality: must_not
    statement: Desktop creates assistant output, successful turns, voice artifacts, state changes, Memory results, lifecycle results, or Avatar-ready state without committed canonical-owner evidence, or fabricates a Knowledge result while Knowledge V1 is inactive.
    condition: Whenever the corresponding canonical-owner operation or evidence is absent, blocked, failed, or pending.
    failure: Keep the typed non-success state visible.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r005
    kind: rule
    title: LocalAgent context status is bounded
    modality: must
    statement: Desktop may render typed immutable snapshot and lorebook readiness, independent Cognition source and event-derived Memory unconfigured, pending or building, ready, unavailable, invalid, failure, or no_hits adapter outcomes, Runtime no_result selection outcome, summary availability, recall count, reason, lane budget, omission, count, bounded provenance, and safe correlation facts but never raw source, lorebook or Cognition unit text, opaque Cognition storage identity, World context, prompt, transcript or summary text, private Memory or Knowledge content, private recall payload, proof, credentials, provider payloads, or tool payloads; this context-status rule does not govern the separately admitted Agent Center Memory manager section, and a context-capacity failure is presented in user language with current and required capacity plus an explicit route to the owning Machine Loadout store instead of a duplicated or parsed raw internal error.
    condition: Whenever LocalAgent source or turn-context status is displayed.
    failure: Reject an over-broad projection or raw duplicated technical failure and show bounded unavailable status with an actionable owner route.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r008
    kind: rule
    title: Desktop owns no LocalAgent execution stack
    modality: must_not
    statement: Desktop owns source partition, lorebook generation, Cognition corpus or retrieval, prompt assembly, LocalAgent turn or recall planning, provider or model routing, Conversation summary generation, Memory or Knowledge policy, voice synthesis, Workflow execution, MCP execution, local schedulers, or direct AI or full-source fallbacks for LocalAgent behavior.
    condition: Whenever Desktop assembles LocalAgent controls or helpers.
    failure: Remove the execution path and route typed intent through Runtime.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r009
    kind: rule
    title: Desktop helpers remain view projections
    modality: must
    statement: A Desktop helper may adapt typed Runtime LocalAgent projection into a view model but never invokes hidden execution, mutates Runtime truth, or becomes an alternate semantic reducer.
    condition: Whenever Desktop adapts LocalAgent projection for display.
    failure: Reject a helper that crosses into execution or durable truth.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r010
    kind: rule
    title: LocalAgent outcomes keep typed provenance
    modality: must
    statement: Visible LocalAgent text, state, voice, media, optional Memory, and lifecycle outcomes retain typed canonical-owner identity, continuity, status, and failure provenance through Desktop rendering, while inactive Knowledge V1 produces no visible outcome.
    condition: Whenever Desktop presents a LocalAgent outcome.
    failure: Reject an outcome missing canonical-owner provenance or carrying App-authored semantic success.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r011
    kind: rule
    title: Explicit voice input uses Runtime STT
    modality: must
    statement: Desktop stops explicit voice capture at the first of the five-minute duration bound or a payload exceeding the 6 MiB byte bound, rejects the over-bound recording with typed AI_AUDIO_INPUT_TOO_LARGE, sends only admitted user-recorded voice input through the audio.transcribe route committed in the shared LocalAgent AIConfig, using the current machine-selected Loadout for Local or the exact Connector reference plus Cloud implementation-target committed for Cloud, and submits only the resulting typed text intent to the selected LocalAgent Conversation. Runtime captures that exact composition at Job admission, and Desktop treats only AbortError or a typed Canceled result as cancellation and never classifies cancellation from human-readable error text.
    condition: Whenever the user explicitly requests voice input.
    failure: Stop and reject over-bound capture, surface every non-cancellation failure, and reject App-local provider transcription, hidden capture, message-inferred cancellation, and fabricated transcript.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r012
    kind: rule
    title: Derived admission does not grant execution authority
    modality: must_not
    statement: Desktop uses a derived admission reason, UI state, cached projection, local source display, process state, or correlation metadata to invent LocalAgent actions, prompts, routing, machine selection, output, or product success.
    condition: Whenever Desktop decides which LocalAgent controls or outcomes to render.
    failure: Require the admitted Runtime operation and its typed result.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.conversation-capability
  - id: rule.nimi.desktop.agent-projection.r014
    kind: rule
    title: Voice playback consumes Runtime output
    modality: must
    statement: Desktop requests and plays only authorized Runtime-generated LocalAgent voice output under the route committed in the shared LocalAgent AIConfig, its exact Job-time Local or Cloud composition, policy, Quota, and Budget.
    condition: Whenever the user requests LocalAgent voice playback.
    failure: Keep the output text-only or unavailable without direct provider calls.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.conversation-capability
  - id: rule.nimi.desktop.agent-projection.r015
    kind: rule
    title: Desktop cannot call speech providers directly
    modality: must_not
    statement: Desktop calls provider TTS, App-local speech engines, or an App-level REST bypass for LocalAgent voice output.
    condition: Whenever LocalAgent speech output is requested.
    failure: Reject the bypass and use the Runtime voice operation or typed unavailable state.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.conversation-capability
  - id: rule.nimi.desktop.agent-projection.r016
    kind: rule
    title: Avatar launch is an explicit projection handoff
    modality: must
    statement: Desktop launches or focuses Avatar only from an explicitly selected authorized LocalAgent reference-list entry and hands off that current session-scoped agentHandle as bounded presentation intent, with a Runtime-issued Conversation anchor carried only when available and only as an optional revalidated continuity fence; Runtime validates current LocalAgent access and obtains or revalidates any exact Conversation anchor required by a later canonical operation, Avatar consumes the same canonical Conversation SDK contract, and any separately carried Runtime-internal presentation binding identity remains only a rendering sideband that cannot select, open, subscribe, reduce, or mutate canonical Conversation or Realtime truth. The handoff carries no account identity, credential, provider, route, or caller-authored owner proof.
    condition: Whenever Desktop opens or targets Avatar.
    failure: Keep the handoff unavailable on missing or unauthorized LocalAgent identity.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.avatar-surface
  - id: rule.nimi.desktop.agent-projection.r017
    kind: rule
    title: Desktop is not an Avatar driver
    modality: must_not
    statement: Desktop exposes or consumes raw Avatar motion, renderer commands, embedded renderer handles, local driver endpoints, backend-native payloads, or Third-party App direct Avatar control as product capability.
    condition: Whenever Desktop composes Avatar or Third-party App integration.
    failure: Reject the direct driver path and use bounded Runtime LocalAgent projection plus Avatar-owned rendering.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.avatar-surface
  - id: rule.nimi.desktop.agent-projection.r018
    kind: rule
    title: Composer state is ephemeral UI state
    modality: must
    statement: User-entered LocalAgent Conversation composer text remains Desktop UI state and does not become Runtime Conversation, Memory, Knowledge, recovery, or execution truth before an admitted submission commits.
    condition: Whenever Desktop holds an unsubmitted composer value.
    failure: Discard or keep it only as UI state without semantic promotion.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r019
    kind: rule
    title: Diagnostics remain non-authoritative
    modality: must
    statement: Desktop LocalAgent telemetry and diagnostics remain bounded diagnostic projection and never become Conversation, execution, success, authorization, or recovery truth.
    condition: Whenever Desktop records or displays LocalAgent diagnostics.
    failure: Reject diagnostic data used as positive product authority.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r020
    kind: rule
    title: Desktop persistence is UI state or disposable cache only
    modality: must
    statement: Desktop may persist non-sensitive layout, focus, scroll, panel, and disposable projection-cache state but never canonical LocalAgent Conversation, Memory, Knowledge, lifecycle, authorization, or execution truth.
    condition: Whenever Desktop persists state adjacent to a LocalAgent surface.
    failure: Reject durable semantic ownership and recover truth only from its owner.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r021
    kind: rule
    title: Desktop cannot own LocalAgent transcript truth
    modality: must_not
    statement: Desktop local persistence becomes canonical LocalAgent Conversation, message, turn, lifecycle, assistant output, or recovery truth.
    condition: Whenever LocalAgent Conversation data is cached or written locally.
    failure: Treat it as disposable projection and recover from Runtime.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r025
    kind: rule
    title: LocalAgent and Conversation selection are explicit
    modality: must
    statement: Desktop selects an explicit authorized LocalAgent reference-list entry through its session-scoped agentHandle and uses only the Runtime-issued, revalidated Conversation anchor for that Agent's single canonical Conversation rather than accepting raw localAgentId, deriving a platform default LocalAgent, or merging all Conversations for one Character Source.
    condition: Whenever Desktop opens or switches a LocalAgent Conversation.
    failure: Require explicit selection and keep the surface unavailable when it cannot be resolved.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r028
    kind: rule
    title: Conversation summaries come from Runtime
    modality: must
    statement: Desktop lists only authorized Runtime-projected LocalAgent Conversation summaries for the current account and App without reading a Desktop-owned transcript store.
    condition: Whenever Desktop displays available LocalAgent Conversations.
    failure: Reject local history as summary truth and show typed unavailable state.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r029
    kind: rule
    title: Selected Conversation recovers from Runtime
    modality: must
    statement: Desktop recovers a selected LocalAgent Conversation through Runtime-owned committed bounded snapshots and later ordered canonical live projections with stable turn, message, action, voice, artifact, sequence-high-watermark, and terminal status and never loses or duplicates an included content or sidecar relation; reload or Runtime restart does not promise durable replay of transient text, reasoning-status, action, or tool deltas and converges unfinished work through Agent-owned snapshot and terminal semantics.
    condition: Whenever Desktop reloads or reattaches to a LocalAgent Conversation.
    failure: Reject Desktop-local transcript reconstruction.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r033
    kind: rule
    title: Generic App chat is distinct from LocalAgent Conversation
    modality: must
    statement: An App may use general Runtime AI consume for its own product chat, but that UI does not become a Runtime LocalAgent, LocalAgent Conversation, Memory, Knowledge, lifecycle, or owner merely because it streams text or uses tools.
    condition: Whenever a generic App chat and LocalAgent Conversation are compared or composed.
    failure: Reject ontology or ownership inferred from similar UI.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r034
    kind: rule
    title: Desktop Agent Realtime uses the canonical media API
    modality: must
    statement: Desktop opens and consumes Agent-owned Realtime only through the canonical runtime.agent.realtime SDK methods, supplies bounded user text or OS-admitted microphone frames and explicit outputTrack or existing Agent-turn interrupt intent, and renders the same transient pressure, speech, transcript, outputTrack, audio, health, lifecycle, and terminal union as every formal App; Desktop owns OS permission prompts, device capture and change observation, playback, and rendering, Runtime Agent Service owns AIConfig resolution, transcript-to-turn composition, execution of AI Jobs required by Cognition pipelines, action, tool, final Conversation text, optional artifact, and any Agent-turn interruption decision, and Cognition owns Memory and Knowledge semantic admission and canonical state while inactive Knowledge V1 creates no Desktop Realtime feature.
    condition: Whenever Desktop starts, drives, interrupts, closes, or renders an Agent-owned Realtime session.
    failure: Preserve the typed permission, device, admission, route, Driver, pressure, or terminal failure and never use a Desktop-only protocol, direct provider, recorded STT, static TTS, text-only fallback, ordinary Agent voice chunk, or mock success.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r100
    kind: rule
    title: Delegated capability controls are non-core projections
    modality: must
    statement: Workflow, MCP, external-agent entry, and other delegated capability controls remain unavailable or isolated future projections until separately admitted and never block ordinary Nimi Home, LocalAgent, Text, STT, TTS, optional Memory projection, or Avatar readiness; Knowledge V1 remains inactive rather than an ordinary readiness dependency.
    condition: Whenever a delegated capability is absent, proposed, or displayed.
    failure: Show an explicit unavailable state without adding a Desktop execution or credential owner.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.delegation-control
  - id: rule.nimi.desktop.agent-projection.r144
    kind: rule
    title: Companion panels remain projection-only
    modality: must
    statement: A Desktop companion panel renders typed Runtime LocalAgent and Avatar projections and invokes bounded current-user controls only, with no prompt assembly, provider call, Memory or Knowledge write, scheduler, queue, raw motion API, or durable truth.
    condition: Whenever a companion panel renders or submits a control.
    failure: Reject consumer-local execution and show the Runtime or Avatar owner outcome.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.companion-panel
  - id: rule.nimi.desktop.agent-projection.r189
    kind: rule
    lifecycle: removed
    title: Realm group participation remains deferred
    reason: Removed because Realm and Nimi hard-cut group LocalAgent participation and the complete group-chat product rather than retaining a deferred Desktop surface.
  - id: rule.nimi.desktop.agent-projection.r199
    kind: rule
    title: Avatar startup cannot infer a default LocalAgent
    modality: must_not
    statement: Desktop launch behavior or Avatar normal boot silently creates, guesses, selects, or depends on a default LocalAgent when an explicit authorized current agentHandle handoff is absent, or treats a carried Runtime-issued Conversation anchor as LocalAgent identity or default-selection truth.
    condition: Whenever Desktop launches Avatar or targets LocalAgent presentation.
    failure: Keep the handoff unavailable and require explicit LocalAgent selection.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.avatar-surface
  - id: rule.nimi.desktop.agent-projection.r200
    kind: rule
    title: Companion controls use standard LocalAgent access
    modality: must
    statement: Desktop companion controls select an explicit authorized LocalAgent reference-list entry and carry only its current session-scoped agentHandle plus the typed requested operation through the standard SDK and Runtime seam, while a Runtime-issued Conversation anchor appears only when the exact operation uses it as a revalidated continuity fence and Runtime derives account, App identity, authorization, canonical internal LocalAgent identity, and access from the active session.
    condition: Whenever Desktop submits a companion control.
    failure: Reject missing, stale, unauthorized, raw localAgentId, internal-carrier, or caller-proven access.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.companion-panel
  - id: rule.nimi.desktop.agent-projection.r201
    kind: rule
    title: Character source chat consumes the shared profile projection
    modality: must
    statement: Desktop LocalAgent Conversation derives PersonaCharacter and WorldCharacter greeting and other shared character context from the same shared Realm character profile consumer projection, while Runtime-owned LocalAgent identity, materialization context, and non-null Runtime conversation fields remain Runtime projections and are not erased by absent source-contact fields.
    condition: Whenever Desktop builds or merges a LocalAgent Conversation target backed by a PersonaCharacter or WorldCharacter source.
    failure: Reject a WorldCharacter-only greeting path, source-kind-specific shared-context parser, legacy Core fallback, or null source-contact field that overwrites an available Runtime conversation field.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.character-profile-projection
  - id: rule.nimi.desktop.agent-projection.r202
    kind: rule
    title: Desktop attachment composer preserves Runtime custody and one-item bounds
    modality: must
    statement: Desktop stages at most one pending LocalAgent image attachment per turn across file selection, repeated selection, paste, retry restoration, and thread switching, uses only the Runtime attachment upload and artifact-reference path or its authority-equivalent first-party facade, and submits only the resulting artifact id with optional bounded text; selected bytes, display name, preview URL, capture state, and retry draft remain ephemeral UI state until Runtime commits one user message, and Desktop never creates an App-local artifact store, durable candidate, ownership proof, mime truth, multi-attachment turn, or generic artifact read authority.
    condition: Whenever Desktop selects, pastes, replaces, retries, submits, clears, or restores a LocalAgent attachment.
    failure: Reject a second staged attachment, raw-byte turn input, caller-authored artifact metadata, stale or foreign artifact reference, or local custody claim and keep the composer non-authoritative until Runtime commit.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r203
    kind: rule
    title: Cognition status is non-blocking and owner attributed
    modality: must
    statement: Desktop keeps LocalAgent readiness distinct from optional Cognition status, shows unconfigured, building, unavailable, failure, no_hits, and no_result with bounded Cognition semantic-owner attribution and Runtime AI-Job execution attribution where applicable, and never converts a non-ready adapter into Agent unavailability, successful no_hits, automatic provider change, or a local answer fallback.
    condition: Whenever Desktop displays a source-backed LocalAgent or a completed context plan.
    failure: Render the exact bounded Runtime mediation or Cognition owner state and preserve the LocalAgent readiness supplied by Runtime.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r204
    kind: rule
    title: Desktop exposes no post-birth source adoption
    modality: must_not
    statement: Desktop offers a control, repair path, or hidden coordinator that makes an existing LocalAgent adopt current Realm source, rematerializes it in place, reads a legacy snapshot, or manages a Cognition corpus or scope; repair is limited to Cognition-owned rebuild from the LocalAgent immutable snapshot with Runtime executing only the required AI Jobs, and capacity action routes to the owning Machine Loadout store.
    condition: Whenever Desktop renders source, repair, rebuild, or capacity controls for a LocalAgent.
    failure: Remove the unsupported control and present the typed owner unavailable, rebuild, or new-materialization path.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r205
    kind: rule
    title: Desktop App Product Plane uses the canonical Agent paths
    modality: must
    statement: Desktop LocalAgent Conversation, recorded transcription, manual voice consumption, AI Consume, and the complete AgentCenter use the same canonical agentHandle-addressed SDK operations, agent.configure App client, AgentCenter factory, Manager Session, section and action availability, typed results, and typed errors as every equally covered protected App; Desktop preserves Overview, Appearance, Behavior, shared AIConfig, Memory, Cognition, and Diagnostics or Advanced capabilities during convergence and owns only Nimi Home placement, navigation, OS file or microphone selection, bounded temporary custody, native preview or playback, and other Host mechanics that neither carry raw LocalAgent, source, or account identity into the App Product Plane nor decide product eligibility, state, commit, result, or error semantics.
    condition: Whenever Desktop opens, switches, renders, or invokes a LocalAgent Conversation, voice, AI Consume, or AgentCenter product capability.
    failure: Fail the cutover on a Desktop-only SDK, direct Runtime product operation, raw identity sideband, hidden first-party bridge, second Manager or factory, stale-handle mutation, capability loss, section or action removal, empty shell, permanent unavailable state, protected-App lower-denominator convergence, or retirement before an equivalent canonical replacement is active.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.companion-panel
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
