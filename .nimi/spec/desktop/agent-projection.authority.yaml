format: nimicoding.authority/v2
owner: team.desktop
scope: desktop.agent-projection
units:
  - id: definition.nimi.desktop.agent-projection.agent-chat
    kind: definition
    title: Home LocalAgent management and Conversation projection
    meaning: Home owns presentation of LocalAgent inventory, management, source navigation and ordinary Conversation using the admitted public SDK and Kit. Zhiyu independently presents the same canonical Conversation and its own App experience including transient Realtime. Runtime owns LocalAgent identity, execution, Conversation, summary, voice, continuity and lifecycle. Cognition owns Memory and Knowledge semantics and canonical state, with Knowledge V1 inactive.
  - id: definition.nimi.desktop.agent-projection.conversation-capability
    kind: definition
    title: Desktop Runtime capability projection
    meaning: Desktop may display bounded Runtime LocalAgent, optional typed Memory, CapabilityContract, derived admission, Job, and media projections without owning the shared LocalAgent AIConfig, Machine Loadout store, Loadout, resource policy, Memory semantic truth, or execution truth; Knowledge V1 remains inactive and has no Desktop projection.
  - id: definition.nimi.desktop.agent-projection.avatar-surface
    kind: definition
    title: Desktop Avatar projection placement
    meaning: Desktop owns Nimi Home placement and explicit launch or focus intent for Avatar, Runtime owns the selected LocalAgent and its semantic projections, and Avatar owns visual rendering and backend-local state; Desktop is not an Avatar driver or LocalAgent owner.
  - id: definition.nimi.desktop.agent-projection.delegation-control
    kind: definition
    title: Deferred delegated capability projection
    meaning: Workflow, MCP, external-agent entry, and other delegated capability controls are optional future projections outside ordinary LocalAgent readiness and do not create a Desktop execution, credential, gateway, or audit owner. Admitted integration connection, permission and usage management is a Home projection of its Runtime owner, not a Desktop workflow engine or a blanket MCP prohibition.
  - id: definition.nimi.desktop.agent-projection.companion-panel
    kind: definition
    title: Desktop LocalAgent companion projection
    meaning: A Desktop companion panel is a first-party LocalAgent projection that owns placement and bounded user controls only and never owns execution, Conversation, Memory, Knowledge, voice truth, scheduling, provider routing, or Avatar rendering.
  - id: definition.nimi.desktop.agent-projection.realm-group-participation
    kind: definition
    lifecycle: removed
    title: Deferred Realm group LocalAgent participation projection
    reason: Removed because Realm and Nimi hard-cut group LocalAgent participation and the complete group-chat product instead of retaining a future Desktop projection.
  - id: rule.nimi.desktop.agent-projection.r001
    kind: rule
    title: Home hands off explicit partner conversation intent
    modality: must
    statement: Home resolves the selected current-account partner through its own admitted client and hands only a Runtime-issued Conversation anchor, optional committed message reference and bounded unsent text to bundled Zhiyu through the verified Host. The destination resolves its own current-session Agent reference and confirms arrival; The handoff carries no turn, attachment, microphone input, provider choice, execution context, credential or caller handle.
    condition: Whenever the user explicitly opens a partner conversation in Zhiyu from Home.
    failure: Keep the source input and report unavailable or not reached without selecting another partner or submitting a turn.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r002
    kind: rule
    title: Home reads bounded Runtime LocalAgent projections
    modality: must
    statement: Home renders authorized Runtime LocalAgent inventory, management, conversation summaries, Conversation snapshots, events and typed failures through public SDK and Kit. Home can submit admitted user intent and control local playback through those same consumers. UI state and cached projections never become Runtime truth.
    condition: Whenever Home renders LocalAgent information.
    failure: Use the owner projection or an explicit unavailable state without reconstructing conversation or execution truth.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r003
    kind: rule
    title: Home partner availability and handoff failures stay explicit
    modality: must
    statement: Home keeps missing or unavailable Runtime, account, partner, source and destination states distinct for the requested read, management or handoff action. Optional source, Cognition or appearance failures remain local; missing AI execution preparation does not by itself forbid reading partner management or opening an existing admitted conversation.
    condition: Whenever a Home partner projection or handoff cannot operate.
    failure: Display the owning failure without fallback execution, false empty state or fake arrival.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r004
    kind: rule
    title: Desktop cannot synthesize LocalAgent success
    modality: must_not
    statement: Desktop creates assistant output, successful turns, voice artifacts, state changes, Memory results, lifecycle results, or Avatar-ready state without committed canonical-owner evidence, or fabricates a Knowledge result while Knowledge V1 is inactive.
    condition: Whenever the corresponding canonical-owner operation or evidence is absent, blocked, failed, or pending.
    failure: Keep the typed non-success state visible.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r005
    kind: rule
    title: LocalAgent context status is bounded
    modality: must
    statement: Desktop may render typed immutable snapshot and lorebook readiness, independent Cognition source and event-derived Memory unconfigured, pending or building, ready, unavailable, invalid, failure, or no_hits adapter outcomes, Runtime no_result selection outcome, summary availability, recall count, reason, lane budget, omission, count, bounded provenance, and safe correlation facts but never raw source, lorebook or Cognition unit text, opaque Cognition storage identity, World context, prompt, transcript or summary text, private Memory or Knowledge content, private recall payload, proof, credentials, provider payloads, or tool payloads; this context-status rule does not govern the separately admitted Agent Center Memory manager section, and a context-capacity failure is presented in user language with current and required capacity plus an explicit route to the owning Machine Loadout store instead of a duplicated or parsed raw internal error.
    condition: Whenever LocalAgent source or turn-context status is displayed.
    failure: Reject an over-broad projection or raw duplicated technical failure and show bounded unavailable status with an actionable owner route.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r008
    kind: rule
    title: Desktop owns no LocalAgent execution stack
    modality: must_not
    statement: Desktop owns source partition, lorebook generation, Cognition corpus or retrieval, prompt assembly, LocalAgent turn or recall planning, provider or model routing, Conversation summary generation, Memory or Knowledge policy, voice synthesis, Workflow execution, MCP execution, local schedulers, or direct AI or full-source fallbacks for LocalAgent behavior.
    condition: Whenever Desktop assembles LocalAgent controls or helpers.
    failure: Remove the execution path and route typed intent through Runtime.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r009
    kind: rule
    title: Desktop helpers remain view projections
    modality: must
    statement: A Desktop helper may adapt typed Runtime LocalAgent projection into a view model but never invokes hidden execution, mutates Runtime truth, or becomes an alternate semantic reducer.
    condition: Whenever Desktop adapts LocalAgent projection for display.
    failure: Reject a helper that crosses into execution or durable truth.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r010
    kind: rule
    title: LocalAgent outcomes keep typed provenance
    modality: must
    statement: Visible LocalAgent text, state, voice, media, optional Memory, and lifecycle outcomes retain typed canonical-owner identity, continuity, status, and failure provenance through Desktop rendering, while inactive Knowledge V1 produces no visible outcome.
    condition: Whenever Desktop presents a LocalAgent outcome.
    failure: Reject an outcome missing canonical-owner provenance or carrying App-authored semantic success.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r012
    kind: rule
    title: Derived admission does not grant execution authority
    modality: must_not
    statement: Desktop uses a derived admission reason, UI state, cached projection, local source display, process state, or correlation metadata to invent LocalAgent actions, prompts, routing, machine selection, output, or product success.
    condition: Whenever Desktop decides which LocalAgent controls or outcomes to render.
    failure: Require the admitted Runtime operation and its typed result.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.conversation-capability
  - id: rule.nimi.desktop.agent-projection.r015
    kind: rule
    title: Desktop cannot call speech providers directly
    modality: must_not
    statement: Desktop calls provider TTS, App-local speech engines, or an App-level REST bypass for LocalAgent voice output.
    condition: Whenever LocalAgent speech output is requested.
    failure: Reject the bypass and use the Runtime voice operation or typed unavailable state.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.conversation-capability
  - id: rule.nimi.desktop.agent-projection.r016
    kind: rule
    title: Avatar launch is an explicit projection handoff
    modality: must
    statement: Desktop launches or focuses Avatar only from an explicitly selected authorized LocalAgent reference-list entry and hands off that current session-scoped agentHandle as bounded presentation intent, with a Runtime-issued Conversation anchor carried only when available and only as an optional revalidated continuity fence; Runtime validates current LocalAgent access and obtains or revalidates any exact Conversation anchor required by a later canonical operation, the verified Desktop Host privately consumes the Runtime-minted generation-bounded Avatar Host target reference only to converge the same active LocalAgent across formal App sessions, Avatar consumes the same canonical Conversation SDK contract, and neither the Host-private target ref nor any separately carried Runtime-internal presentation binding identity can select, open, subscribe, reduce, or mutate canonical Conversation or Realtime truth. The handoff carries no account identity, credential, provider, route, raw LocalAgent identity, or caller-authored owner proof.
    condition: Whenever Desktop opens or targets Avatar.
    failure: Keep the handoff unavailable on missing or unauthorized LocalAgent identity.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.avatar-surface
  - id: rule.nimi.desktop.agent-projection.r017
    kind: rule
    title: Desktop is not an Avatar driver
    modality: must_not
    statement: Desktop exposes or consumes raw Avatar motion, renderer commands, embedded renderer handles, local driver endpoints, backend-native payloads, or Third-party App direct Avatar control as product capability.
    condition: Whenever Desktop composes Avatar or Third-party App integration.
    failure: Reject the direct driver path and use bounded Runtime LocalAgent projection plus Avatar-owned rendering.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.avatar-surface
  - id: rule.nimi.desktop.agent-projection.r018
    kind: rule
    title: Home shortcut text remains unsent UI state
    modality: must
    statement: Home partner shortcut text belongs to the current account and selected partner as ephemeral UI state. A Home conversation open or explicit Zhiyu handoff offers it to the destination as a draft, never sends it automatically, never silently overwrites the destination draft, and never turns it into Runtime Conversation, Memory, Knowledge, recovery or execution truth.
    condition: Whenever Home edits, transfers or hands off partner shortcut text.
    failure: Discard or keep it only as UI state without semantic promotion.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r019
    kind: rule
    title: Diagnostics remain non-authoritative
    modality: must
    statement: Desktop LocalAgent telemetry and diagnostics remain bounded diagnostic projection and never become Conversation, execution, success, authorization, or recovery truth.
    condition: Whenever Desktop records or displays LocalAgent diagnostics.
    failure: Reject diagnostic data used as positive product authority.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r020
    kind: rule
    title: Desktop persistence is UI state or disposable cache only
    modality: must
    statement: Desktop may persist non-sensitive layout, focus, scroll, panel, and disposable projection-cache state but never canonical LocalAgent Conversation, Memory, Knowledge, lifecycle, authorization, or execution truth.
    condition: Whenever Desktop persists state adjacent to a LocalAgent surface.
    failure: Reject durable semantic ownership and recover truth only from its owner.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r021
    kind: rule
    title: Desktop cannot own LocalAgent transcript truth
    modality: must_not
    statement: Desktop local persistence becomes canonical LocalAgent Conversation, message, turn, lifecycle, assistant output, or recovery truth.
    condition: Whenever LocalAgent Conversation data is cached or written locally.
    failure: Treat it as disposable projection and recover from Runtime.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r025
    kind: rule
    title: Home partner and conversation targeting remain explicit
    modality: must
    statement: Home resolves an explicitly selected current-account partner through its own authorized Agent reference and uses only the Runtime-issued Conversation anchor for that partner. An incoming open-agent-center correlation is resolved under Home authority for management; it neither transfers a caller handle nor mounts a conversation. Home never guesses a default partner, matches by display name, merges conversations for a source or treats a previous session handle as a navigation key.
    condition: Whenever Home selects a partner or resolves a partner management or conversation handoff target.
    failure: Require explicit selection and keep the surface unavailable when it cannot be resolved.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r028
    kind: rule
    title: Conversation summaries come from Runtime
    modality: must
    statement: Desktop lists only authorized Runtime-projected LocalAgent Conversation summaries for the current account and App without reading a Desktop-owned transcript store.
    condition: Whenever Desktop displays available LocalAgent Conversations.
    failure: Reject local history as summary truth and show typed unavailable state.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r029
    kind: rule
    title: Home conversation continuation reads owner summaries
    modality: must
    statement: Home consumes bounded summaries and uses canonical snapshots, event observation, message reads and the existing explicit recovery operations for the selected conversation. A historical message requires an exact committed message reference. An ambiguous submission may be queried without executing or explicitly continued using the original request identity and input. Regeneration requires the owner’s eligibility and a new request referencing the prior attempt. Runtime owns transcript, admission and recovery truth. Explicit Zhiyu handoff preserves the source position and draft on failure.
    condition: Whenever Home offers a partner conversation continuation or reply action.
    failure: Report a missing or unreadable target without fabricating history, replaying work or equating window launch with conversation arrival.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r033
    kind: rule
    title: Generic App chat is distinct from LocalAgent Conversation
    modality: must
    statement: An App may use general Runtime AI consume for its own product chat, but that UI does not become a Runtime LocalAgent, LocalAgent Conversation, Memory, Knowledge, lifecycle, or owner merely because it streams text or uses tools.
    condition: Whenever a generic App chat and LocalAgent Conversation are compared or composed.
    failure: Reject ontology or ownership inferred from similar UI.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r100
    kind: rule
    title: Delegated capability controls are non-core projections
    modality: must
    statement: Workflow, MCP, external-agent entry, and other delegated capability controls remain unavailable or isolated future projections until separately admitted and never block ordinary Nimi Home, LocalAgent, Text, STT, TTS, optional Memory projection, or Avatar readiness; Knowledge V1 remains inactive rather than an ordinary readiness dependency.
    condition: Whenever a delegated capability is absent, proposed, or displayed.
    failure: Show an explicit unavailable state without adding a Desktop execution or credential owner.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.delegation-control
  - id: rule.nimi.desktop.agent-projection.r144
    kind: rule
    title: Companion panels remain projection-only
    modality: must
    statement: A Desktop companion panel renders typed Runtime LocalAgent and Avatar projections and invokes bounded current-user controls only, with no prompt assembly, provider call, Memory or Knowledge write, scheduler, queue, raw motion API, or durable truth.
    condition: Whenever a companion panel renders or submits a control.
    failure: Reject consumer-local execution and show the Runtime or Avatar owner outcome.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.companion-panel
  - id: rule.nimi.desktop.agent-projection.r189
    kind: rule
    lifecycle: removed
    title: Realm group participation remains deferred
    reason: Removed because Realm and Nimi hard-cut group LocalAgent participation and the complete group-chat product rather than retaining a deferred Desktop surface.
  - id: rule.nimi.desktop.agent-projection.r199
    kind: rule
    title: Avatar startup cannot infer a default LocalAgent
    modality: must_not
    statement: Desktop launch behavior or Avatar normal boot silently creates, guesses, selects, or depends on a default LocalAgent when an explicit authorized current agentHandle handoff is absent, or treats a carried Runtime-issued Conversation anchor as LocalAgent identity or default-selection truth.
    condition: Whenever Desktop launches Avatar or targets LocalAgent presentation.
    failure: Keep the handoff unavailable and require explicit LocalAgent selection.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.avatar-surface
  - id: rule.nimi.desktop.agent-projection.r200
    kind: rule
    title: Companion controls use standard LocalAgent access
    modality: must
    statement: Desktop companion controls select an explicit authorized LocalAgent reference-list entry and carry only its current session-scoped agentHandle plus the typed requested operation through the standard SDK and Runtime seam, while a Runtime-issued Conversation anchor appears only when the exact operation uses it as a revalidated continuity fence and Runtime derives account, App identity, authorization, canonical internal LocalAgent identity, and access from the active session.
    condition: Whenever Desktop submits a companion control.
    failure: Reject missing, stale, unauthorized, raw localAgentId, internal-carrier, or caller-proven access.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.companion-panel
  - id: rule.nimi.desktop.agent-projection.r201
    kind: rule
    title: Character-backed Home display uses the shared source profile
    modality: must
    statement: Home source and partner display use the shared Realm Character profile projection for PersonaCharacter and WorldCharacter public fields. Runtime LocalAgent identity, immutable materialization context and non-null conversation correlations retain their Runtime provenance; absent Realm source-contact fields never erase them, and source display never supplies execution context to a conversation handoff.
    condition: Whenever Home composes Character-backed partner display or a conversation handoff target.
    failure: Reject a WorldCharacter-only greeting path, source-kind-specific shared-context parser, legacy Core fallback, or null source-contact field that overwrites an available Runtime conversation field.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.character-profile-projection
  - id: rule.nimi.desktop.agent-projection.r203
    kind: rule
    title: Cognition status is non-blocking and owner attributed
    modality: must
    statement: Desktop keeps LocalAgent readiness distinct from optional Cognition status, shows unconfigured, building, unavailable, failure, no_hits, and no_result with bounded Cognition semantic-owner attribution and Runtime AI-Job execution attribution where applicable, and never converts a non-ready adapter into Agent unavailability, successful no_hits, automatic provider change, or a local answer fallback.
    condition: Whenever Desktop displays a source-backed LocalAgent or a completed context plan.
    failure: Render the exact bounded Runtime mediation or Cognition owner state and preserve the LocalAgent readiness supplied by Runtime.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r204
    kind: rule
    title: Desktop exposes no post-birth source adoption
    modality: must_not
    statement: Desktop offers a control, repair path, or hidden coordinator that makes an existing LocalAgent adopt current Realm source, rematerializes it in place, reads a legacy snapshot, or manages a Cognition corpus or scope; repair is limited to Cognition-owned rebuild from the LocalAgent immutable snapshot with Runtime executing only the required AI Jobs, and capacity action routes to the owning Machine Loadout store.
    condition: Whenever Desktop renders source, repair, rebuild, or capacity controls for a LocalAgent.
    failure: Remove the unsupported control and present the typed owner unavailable, rebuild, or new-materialization path.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
  - id: rule.nimi.desktop.agent-projection.r205
    kind: rule
    title: Home App Product Plane uses canonical management and handoff paths
    modality: must
    statement: Home AI Consume and the complete AgentCenter use the same public SDK, agent.configure App client, AgentCenter factory, Manager Session, action availability, typed results and errors as every equally covered protected App. Home preserves Overview, Appearance, Behavior, shared AIConfig, Memory, Cognition and Diagnostics or Advanced management and presents ordinary LocalAgent Conversation and voice through the admitted public client. Home owns navigation, OS file selection, native preview and other admitted Host mechanics, without raw identity sidebands, private product clients or a second Manager.
    condition: Whenever Home renders or invokes AI Consume, partner management or a partner handoff.
    failure: Reject private product paths, raw authority sidebands, stale-handle mutation, a second Manager or a lost supported management capability. Keep conversation and execution truth in Runtime.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.companion-panel
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
  - id: rule.nimi.desktop.agent-projection.r206
    kind: rule
    title: Avatar caller confirms a different active companion
    modality: must
    statement: When the common Avatar Host handoff resolves the same Runtime-minted Host-private target as the current Avatar instance, Desktop converges to that instance regardless of the ordinary App caller or session-scoped handle; when it resolves a different active LocalAgent, presence reports a typed non-matching state without minting a switch intent or prompting, focus fails closed, and only an explicit user-triggered launch returns a typed confirmation-required result carrying one one-time opaque switch-intent ref. The requesting caller surface then offers Switch current companion or Cancel, Cancel sends no mutation, and confirmed Switch resubmits the same public launch command with that exact ref so the Host revalidates both the current and requested targets before replacing the instance. Desktop never silently replaces the active companion, opens a second active or audible P0 companion, compares Conversation anchors as Agent identity, or exposes the Host-private target ref.
    condition: Whenever Nimi Home or another formal App requests Avatar presence, launch, or focus while an Avatar instance already exists.
    failure: Keep the current instance unchanged and reject silent replacement, second-active creation, stale confirmation, anchor-as-identity, caller-authored stable identity, or an App-local chooser.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.avatar-surface
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.avatar-host-target-plane
  - id: rule.nimi.desktop.agent-projection.r207
    kind: rule
    title: Desktop Host owns distinct Avatar instance lifecycle
    modality: must
    statement: Desktop Host keeps a launched Avatar instance alive independently of the ordinary App caller window, executes Avatar-local Hide, Stop Companion, and Quit Avatar App only as bounded native mechanics with the outcomes defined by Avatar authority, lets any current-Agent formal App caller recall the existing instance through the same public focus operation, and destroys all hosted Avatar instances only on explicit Avatar quit, explicit Desktop or operating-system application shutdown, or terminal Host failure after local resource cleanup; it grants no ordinary App caller a private close, list, stop-all, or richer Avatar lifecycle port.
    condition: Whenever an ordinary App caller closes, Avatar requests a local lifecycle action, another caller focuses the same target, or Desktop Host shuts down.
    failure: Reject caller-close-as-Avatar-stop, a private caller lifecycle path, implicit microphone engage, Agent or Conversation deletion, or an orphaned Avatar window, binding, media stream, materialization, protocol admission, watcher, or backend resource.
    relations:
      - type: applies_to
        target: definition.nimi.avatar.embodiment.product-boundary
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.avatar-surface
  - id: rule.nimi.desktop.agent-projection.business-reference
    kind: rule
    title: Home partners show published App references
    modality: must
    statement: Home partner details compose authorized source-labeled App Activity references, summaries and todo state without promoting them into conversation messages, model context, Memory or a registry of every App using the partner. The explicit primary action opens the exact source App object through activity.open; reading or opening never resumes, completes or cancels source work.
    condition: Whenever Home presents partner App activity.
    failure: Show unavailable or incomplete owner data honestly without task mutation, content leakage or false object arrival.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
      - type: applies_to
        target: definition.nimi.runtime.agent-participation.app-work-plane
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-activity-plane
  - id: rule.nimi.desktop.agent-projection.agent-introduction
    kind: rule
    title: Home consumes the shared Agent introduction
    modality: must
    statement: When Home consumes a handle-addressed LocalAgent introduction, it uses the same public SDK operation and Kit mapping as every equally covered formal App, including missing-data and preview behavior. The separately owned Realm source-detail reader remains source display and never substitutes source identity or content for a LocalAgent introduction or execution authority.
    condition: Whenever this surface consumes or renders a LocalAgent introduction.
    failure: Reject divergent private data paths, fabricated source facts or execution authority in display code.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.agent-introduction
  - id: rule.nimi.desktop.agent-projection.composer-draft
    kind: rule
    title: Home drafts and pending inputs remain scoped to their host
    modality: must
    statement: Home keeps shortcut text in account-and-partner-scoped in-memory UI state. The formal Home composer may retain unsent text, a quotation and one unresolved request with its required input and correlation in Home protected App storage scoped to the current account and App-specific partner binding. A pending request is not an execution or history record and only supports user-confirmed resolution. Incoming draft text is never sent automatically or silently substituted for an existing draft, quote or pending request. Zhiyu retains its own protected draft and submission storage. Historical Home-only remnants use a one-time local export.
    condition: Whenever Home restores, edits, transfers, recovers or retires partner composer state.
    failure: Reject cross-account or cross-partner draft adoption, silent destination overwrite, false save acknowledgement and automatic message submission.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.agent-projection.agent-chat
