format: nimicoding.authority/v2
owner: team.desktop
scope: desktop.shell-runtime
units:
  - id: definition.nimi.desktop.shell-runtime.bootstrap-phase-plane
    kind: definition
    title: Nimi Home host bootstrap plane
    meaning: The Nimi Home host bootstrap plane composes verified Runtime service posture, protected host capabilities, standard SDK and Kit surfaces, Runtime-owned account projection, and owner-specific typed availability without becoming an owner of those facts or creating aggregate Local AI readiness.
  - id: definition.nimi.desktop.shell-runtime.account-session-plane
    kind: definition
    title: Nimi Home account projection plane
    meaning: The account projection plane renders Runtime-owned local account state and user intent while Runtime retains credential custody, login lifecycle, refresh, revocation, logout, switching, Realm mediation, and authorization truth.
  - id: definition.nimi.desktop.shell-runtime.security-boundary
    kind: definition
    title: Nimi Home host security boundary
    meaning: The Nimi Home host security boundary keeps protected installation, service-control, process, credential, account, and session authority in the verified native host and Runtime while renderer and App code receive only typed bounded projections.
  - id: definition.nimi.desktop.shell-runtime.state-plane
    kind: definition
    title: Nimi Home presentation state plane
    meaning: The presentation state plane owns navigation, transient view models, user input, and non-authoritative UI cache without owning Realm, Runtime, LocalAgent, Conversation, Memory, Knowledge, owner authorization, AI route, or App truth.
  - id: definition.nimi.desktop.shell-runtime.sync-plane
    kind: definition
    title: Desktop data ownership boundary
    meaning: Desktop consumes typed Realm, Runtime, SDK, and Kit data and may invalidate or cache views, but it does not create a general synchronization authority or parallel product store.
  - id: definition.nimi.desktop.shell-runtime.degradation-plane
    kind: definition
    title: Nimi Home degradation plane
    meaning: The degradation plane presents explicit owner-specific Runtime, Realm, account, configuration, derived-admission, and Job failure facts, keeps support and repair reachable, and prevents cached or partial state from masquerading as owner truth or aggregate Local AI readiness.
  - id: definition.nimi.desktop.shell-runtime.self-update-plane
    kind: definition
    lifecycle: removed
    title: Desktop self-update plane
    reason: Removed because the pre-release Electron Desktop has no authorized self-update mechanism; release update authority will be designed with the distribution path.
  - id: definition.nimi.desktop.shell-runtime.network-plane
    kind: definition
    title: Desktop shell network boundary
    meaning: Desktop may perform bounded unauthenticated shell fetches, while authenticated Realm access, Runtime operations, Provider Credentials, AI routes, and protected local calls use their standard owner paths.
  - id: rule.nimi.desktop.shell-runtime.r001
    kind: rule
    title: Desktop is the current replaceable Home host
    modality: must
    statement: Desktop implements the current Nimi Home Host Contract but gains no permanent authority over Realm, Runtime, LocalAgent, Apps, owner authorization, credentials, installation, or service lifecycle from being first party.
    condition: Whenever Desktop responsibility or privilege is interpreted.
    failure: Reject Desktop-only product authority and retain the owning Realm, Runtime, Platform, or protected host decision.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.shell-runtime.bootstrap-phase-plane
  - id: rule.nimi.desktop.shell-runtime.r002
    kind: rule
    title: Bootstrap consumes owner facts
    modality: must
    statement: Nimi Home bootstrap obtains verified Runtime service posture, protected host capability, SDK and Kit composition, current account projection, and owner-specific typed availability from their owners and reports each unavailable or pending state explicitly; it computes no aggregate capability readiness.
    condition: Whenever Nimi Home starts or rebuilds its composition.
    failure: Reject local inference, cached authority, and synthetic ready state.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.shell-runtime.bootstrap-phase-plane
  - id: rule.nimi.desktop.shell-runtime.r003
    kind: rule
    title: Runtime lifetime is independent of Desktop
    modality: must
    statement: Desktop does not spawn, select, directly stop, or own the Runtime service, and quitting Desktop does not define Runtime lifetime.
    condition: Whenever Desktop starts, exits, repairs, or observes Runtime.
    failure: Use the protected host and trusted service lifecycle boundary.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.shell-runtime.security-boundary
  - id: rule.nimi.desktop.shell-runtime.r004
    kind: rule
    title: Account truth remains Runtime owned
    modality: must
    statement: Desktop renders Runtime account status and sends typed login, logout, switch, and presence intent through the verified host but never stores or reconstructs canonical account, authorization, or session truth.
    condition: Whenever Nimi Home presents account UX.
    failure: Reject Desktop-owned account truth and display the typed Runtime state.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.shell-runtime.account-session-plane
  - id: rule.nimi.desktop.shell-runtime.r005
    kind: rule
    title: Desktop receives no App-path credentials
    modality: must_not
    statement: Desktop renderer or App state receives, reads, stores, refreshes, or forwards Realm App-path tokens, Provider Credentials, protected session proof, or account bearer material.
    condition: Whenever local account, Realm, AI, or connector capability is composed.
    failure: Keep custody inside Runtime and expose only typed projection.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.shell-runtime.security-boundary
  - id: rule.nimi.desktop.shell-runtime.r006
    kind: rule
    title: Ordinary product capability uses SDK and Kit
    modality: must
    statement: Nimi Home consumes ordinary Realm, Runtime, Character, LocalAgent, Conversation, Memory, Knowledge, AI, and App capabilities through standard SDK and demand-driven Kit composition while each owner retains its authorization semantics.
    condition: Whenever a Nimi Home product surface accesses owner capability.
    failure: Reject App-local REST, private Runtime imports, generic bridge forwarding, or a Desktop-only parallel API.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.shell-runtime.bootstrap-phase-plane
  - id: rule.nimi.desktop.shell-runtime.r007
    kind: rule
    title: Sensitive OS operations use the Home Host Contract
    modality: must
    statement: Installer, Runtime service control, protected local access, file picker, reveal, browser callback, notification, window, and other sensitive OS operations remain bounded native host capabilities rather than renderer or product-domain authority.
    condition: Whenever Nimi Home requests an OS-sensitive operation.
    failure: Reject direct renderer execution and generic native command forwarding.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.shell-runtime.security-boundary
  - id: rule.nimi.desktop.shell-runtime.r008
    kind: rule
    title: Renderer state is non-authoritative
    modality: must_not
    statement: Navigation, selected rows, current tabs, draft input, local stores, query cache, optimistic state, or recent-item state becomes account, Realm, Runtime, LocalAgent, Conversation, Memory, Knowledge, owner-authorization, route, model, or App truth.
    condition: Whenever Desktop renderer state is stored or restored.
    failure: Re-read the owner projection and present unresolved state honestly.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.shell-runtime.state-plane
  - id: rule.nimi.desktop.shell-runtime.r009
    kind: rule
    title: Desktop creates no synchronization authority
    modality: must_not
    statement: Desktop adds a general DataSync facade, conflict owner, offline product database, cross-App event broker, or durable outbox that replaces Realm or Runtime truth.
    condition: Whenever Desktop coordinates data refresh or offline behavior.
    failure: Keep synchronization and conflict semantics with the owning service and limit Desktop to view cache and explicit user retry.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.shell-runtime.sync-plane
  - id: rule.nimi.desktop.shell-runtime.r010
    kind: rule
    title: Cached data never proves a write
    modality: must_not
    statement: Cached, optimistic, queued, or offline UI state is reported as a committed Realm, Runtime, LocalAgent, Conversation, Memory, Knowledge, owner-authorization, or App mutation.
    condition: Whenever an owner service is unavailable or a write is pending.
    failure: Show pending, stale, unavailable, or failed state and require owner confirmation.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.shell-runtime.degradation-plane
  - id: rule.nimi.desktop.shell-runtime.r011
    kind: rule
    title: Reconnect revalidates authority
    modality: must
    statement: After Runtime restart, account switch, authorization revoke, host replacement, or connectivity loss, Desktop discards stale authority and rebuilds projections through fresh verified owner sessions.
    condition: Whenever Nimi Home reconnects.
    failure: Reject replay of cached credentials, sessions, authorization results, or owner success.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.shell-runtime.degradation-plane
  - id: rule.nimi.desktop.shell-runtime.r012
    kind: rule
    title: Support remains available during owner-specific failure
    modality: must
    statement: Support, diagnostics, configuration, model acquisition, and repair remain reachable when Runtime, Realm, account, committed AI configuration, a request-time derived admission, or a Job has a typed unavailable or failed outcome.
    condition: Whenever an owner-specific product dependency is unavailable or failed.
    failure: Reject a gate that hides the recovery path.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.shell-runtime.degradation-plane
  - id: rule.nimi.desktop.shell-runtime.r013
    kind: rule
    title: Ordinary Home entry is independent of capability configuration
    modality: must_not
    statement: Missing Text, STT, TTS, model, LocalAsset, Local Capability Configuration, machine selection, Driver, provider connection, or other AI capability fact blocks ordinary Product Control or Nimi Home entry or forms an aggregate Local AI readiness state; each capability execution instead consumes committed configuration, request-time derived admission, and the real Job outcome.
    condition: Whenever ordinary Home entry or capability availability is evaluated.
    failure: Keep ordinary Home and recovery surfaces available and project the exact typed owner, derived-admission, or Job failure only at the affected capability action.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.shell-runtime.degradation-plane
  - id: rule.nimi.desktop.shell-runtime.r014
    kind: rule
    title: LocalAgent projections stay non-owning
    modality: must
    statement: Nimi Home presents LocalAgent inventory, lifecycle intent, Conversation, state, Memory and Knowledge status, voice, Avatar entry, and errors from typed Runtime projections without executing turns or reconstructing truth from UI cache.
    condition: Whenever Nimi Home displays or controls a LocalAgent.
    failure: Reject Desktop-owned LocalAgent, Conversation, Memory, Knowledge, activity, emotion, or voice truth.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.shell-runtime.state-plane
  - id: rule.nimi.desktop.shell-runtime.r015
    kind: rule
    title: Character and LocalAgent owners remain separated
    modality: must
    statement: Nimi Home consumes Realm PersonaCharacter and WorldCharacter data, sends PersonaCharacter creation intent through the Realm-owned public typed seam when the user creates a character, and only after Realm returns the Character Source sends a separate materialization intent to Runtime; Realm keeps Character and Source truth while Runtime keeps LocalAgent identity and lifecycle.
    condition: Whenever Nimi Home browses Character data or materializes a LocalAgent.
    failure: Reject Desktop-owned creation or source truth, source-free or World-only identity materialization, or merged Realm and Runtime ownership.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.shell-runtime.state-plane
  - id: rule.nimi.desktop.shell-runtime.r016
    kind: rule
    title: Desktop does not execute AI providers
    modality: must_not
    statement: Desktop owns Provider Credentials, chooses Runtime routes or models as execution truth, calls unadmitted provider endpoints, or treats Cloud AI as proof that required Local AI is ready.
    condition: Whenever Desktop presents or submits AI intent.
    failure: Use typed Runtime AI configuration and execution projections.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.shell-runtime.security-boundary
  - id: rule.nimi.desktop.shell-runtime.r017
    kind: rule
    lifecycle: removed
    title: Desktop update does not own Runtime update
    reason: Removed with the unauthorized pre-release Desktop self-update path; Runtime service lifecycle remains independently owned.
  - id: rule.nimi.desktop.shell-runtime.r018
    kind: rule
    title: Shell networking cannot bypass owners
    modality: must_not
    statement: A Desktop-local fetch helper carries authenticated Realm calls, Runtime operations, cookies, tokens, Provider Credentials, connector secrets, AI routes, or protected local commands.
    condition: Whenever Desktop performs a shell network request.
    failure: Use the standard Realm, Runtime, SDK, or protected host path.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.shell-runtime.network-plane
  - id: rule.nimi.desktop.shell-runtime.r019
    kind: rule
    title: Failures remain owner-specific
    modality: must
    statement: Desktop distinguishes Runtime unavailable, Realm offline, unauthenticated, permission denied, request-time derived-admission blocked, validation failure, Job failure, cancellation, and unsupported capability without converting them into anonymous, cached, local, aggregate-readiness, or mock success.
    condition: Whenever an owner operation or stream fails.
    failure: Render the typed failure and preserve recovery action.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.shell-runtime.degradation-plane
  - id: rule.nimi.desktop.shell-runtime.r020
    kind: rule
    title: Product connectivity remains unclaimed when unrun
    modality: must_not
    statement: A build, typecheck, unit test, fixture, file-presence check, or shell bootstrap projection is reported as a completed Realm, Runtime, LocalAgent, Avatar, or Third-party App product journey.
    condition: Whenever Desktop acceptance is summarized.
    failure: Classify unrun connectivity as not verified.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.shell-runtime.bootstrap-phase-plane
