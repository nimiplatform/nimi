version: 1
table_family: owner_matrix
owner: desktop
matrix_id: desktop_local_app_control_surfaces
source_rule: D-IPC-020
logical_role:
  id: local_app_control
  current_implementation: protected_desktop_process
  portable_credential: forbidden
  authority_source: runtime_derived_from_verified_desktop_control_connection
  owns:
    - local_app_grant_ux_coordination
    - local_app_lifecycle_ux
    - local_development_confirmation_and_supervision
    - protected_launch_request_and_process_binding
  does_not_own:
    - local_app_principal
    - provenance
    - lifecycle_record
    - grant
    - launch_lease
    - local_app_session
    - account_or_token_custody
    - operation_policy
actions:
  - action: get_developer_mode_status
    renderer_payload: []
    security_effect_owner: runtime
  - action: set_developer_mode
    renderer_payload: [enabled]
    security_effect_owner: runtime
  - action: evaluate_local_development_project
    renderer_payload: [project_selector]
    security_effect_owner: runtime
  - action: decide_local_development_project
    renderer_payload: [evaluation_handle, decision, lifetime, risk_disclosure_acknowledged]
    native_host_attaches: [current_presence_proof, authoritative_risk_disclosure_revision]
    security_effect_owner: runtime
  - action: reactivate_local_development_project
    renderer_payload: [project_handle, reactivate_requested, risk_disclosure_acknowledged]
    native_host_attaches: [current_presence_proof, authoritative_risk_disclosure_revision]
    security_effect_owner: runtime
  - action: prepare_local_app_launch
    renderer_access: forbidden
    native_host_only: true
    security_effect_owner: runtime
  - action: bind_local_app_process
    renderer_access: forbidden
    native_host_only: true
    security_effect_owner: runtime
  - action: revoke_local_development_project
    renderer_payload: [project_handle, revoke_requested]
    native_host_attaches: [current_presence_proof]
    security_effect_owner: runtime
future_control_transports:
  authority_status: unadmitted
  requirement: separate_transport_and_identity_admission
constraints:
  - existing_open_desktop_session_account_control_semantics_remain_desktop_specific
  - renderer_receives_status_and_user_decision_inputs_only
  - evaluation_handle_and_project_handle_are_renderer_safe_non_authoritative_correlations_resolved_by_the_native_host
  - renderer_acknowledgement_without_native_presence_and_authoritative_disclosure_revision_never_authorizes
  - no_endpoint_token_bearer_session_proof_process_tuple_or_trust_override_in_renderer
  - no_direct_runtime_process_launch
  - no_raw_executable_self_authentication
  - developer_mode_grants_nothing
  - run_once_or_remember_project_only
  - remembered_project_is_dormant_between_runs
  - mode_off_revoke_account_switch_and_runtime_restart_invalidate_live_carrier
  - native_windows_execution_risk_disclosure_is_required
  - no_persistent_local_development_autostart
