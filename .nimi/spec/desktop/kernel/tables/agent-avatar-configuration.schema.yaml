version: 2
table_family: retired_protocol_surface
protocol_id: desktop_agent_avatar_configuration_schema
schema_id: nimi.desktop.agent-avatar-configuration.v1
owner: .nimi/spec/desktop
status: retired
retired_by: 2026-07-09-agent-center-avatar-kit-shell-hardcut
replacement:
  selection_truth: runtime.AgentPresentationProfile
  asset_custody: kit_shell.agent-center
  preview_truth: avatar.agent_center_preview_service
source_rule: D-LLM-079
description: >
  Retired Desktop control-record schema for Agent Center avatar/background
  configuration. Product is not launched; no user data migration is admitted.
  The schema must not be used by Desktop, Zhiyu, SDK, Kit, or Runtime as active
  semantic authority.
retired_fields_not_migrated:
  - local_avatar_asset_ref
  - live2d_adapter_manifest_source
  - live2d_adapter_manifest_ref
  - live2d_calibration_ref
  - avatar_instance_policy
  - backend_kind
  - backend_capability_profile_ref
  - generated_motion_provider_policy
  - launch_mode
  - debug_profile
  - local_history
  - ui.last_section
forbidden_revival:
  - AgentCenterLocalConfig
  - app_local_avatar_selection_store
  - app_local_background_selection_store
  - app_local_voice_avatar_autoplay
invariants:
  - Runtime AgentPresentationProfile owns avatar/background/default-voice/autoplay selection truth.
  - Kit Shell standard agent-center operations own host-local asset byte custody only.
  - Live2D adapter manifest association is asset-scoped Kit Shell custody metadata.
  - No compatibility shim, migration, dual-write, configGet, or configSet is admitted.
