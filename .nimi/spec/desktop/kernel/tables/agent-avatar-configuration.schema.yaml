table_family: protocol_surface
protocol_id: desktop_agent_avatar_configuration_schema
surfaces:
  - agent_id
  - conversation_anchor_scope
  - live2d_adapter_manifest_source
  - avatar_instance_policy
  - backend_kind
  - launch_mode
  - debug_profile
  - updated_at
  - provenance
  - local_avatar_asset_ref
  - live2d_adapter_manifest_ref
  - backend_capability_profile_ref
  - generated_motion_provider_policy
  - package_descriptor
  - package_path
  - launch_local_asset_id
  - live2d_adapter_manifest_payload
  - live2d_adapter_manifest_path
  - live2d_adapter_manifest_absolute_path
  - compatibility_tier
  - avatar_compatibility_diagnostics
  - carrier_registry_id
  - scoped_avatar_binding_id
  - account_id
  - user_id
  - realm_url
  - token
  - refresh_token
  - jwt
  - auth_payload
  - raw_apml
  - raw_mcp
  - raw_a2a
  - raw_provider_output
  - backend_command
  - Desktop stores opaque refs only and does not dereference package descriptors.
  - The schema must not be copied into Avatar launch payload.
  - External Live2D sidecar refs are Desktop custody refs only; Avatar remains
    manifest resolver, compatibility validator, diagnostics, and carrier-proof
    owner.
  - Embedded and external Live2D adapter manifests must not be merged or
    silently preferred.
  - Missing evidence produces fail-closed configuration status.
schema_id: nimi.desktop.agent-avatar-configuration.v1
owner: .nimi/spec/desktop
status: active
source_rule: D-LLM-079
description: >
  Closed Desktop control-record schema for Agent Chat Settings Avatar
  configuration. This schema is not Avatar launch payload and not carrier truth.

required_fields:
  - agent_id
  - conversation_anchor_scope
  - live2d_adapter_manifest_source
  - avatar_instance_policy
  - backend_kind
  - launch_mode
  - debug_profile
  - updated_at
  - provenance

fields:
  agent_id:
    type: string
    owner: runtime_projection_identity
  conversation_anchor_scope:
    type: enum
    values:
      - current_anchor
      - explicit_debug_anchor
      - no_anchor
  local_avatar_asset_ref:
    type: string_optional
    semantics: opaque_control_ref
    forbidden_as:
      - launch_payload
      - package_descriptor
      - carrier_truth
  live2d_adapter_manifest_source:
    type: enum
    values:
      - none
      - embedded_creator_manifest
      - external_sidecar_manifest
    semantics: exact_one_manifest_source_selection
    forbidden_as:
      - launch_payload
      - compatibility_tier_truth
      - carrier_truth
  live2d_adapter_manifest_ref:
    type: string_optional
    pattern: "^live2d_adapter_[a-f0-9]{12}$"
    semantics: opaque_external_sidecar_control_ref
    required_when: "live2d_adapter_manifest_source == external_sidecar_manifest"
    forbidden_as:
      - raw_manifest_payload
      - absolute_source_path
      - package_descriptor
      - launch_payload
      - Avatar_diagnostic_truth
  avatar_instance_policy:
    type: enum
    values:
      - reuse_active_instance
      - launch_new_instance
      - require_user_selection
  backend_kind:
    type: enum
    values:
      - vrm
      - live2d
      - future
  backend_capability_profile_ref:
    type: string_optional
    semantics: opaque_control_ref
    forbidden_as:
      - backend_capability_truth
      - launch_payload
  generated_motion_provider_policy:
    type: enum
    values:
      - require_profile_support
      - disable_generated_motion
      - debug_only
  launch_mode:
    type: enum
    values:
      - manual
      - debug_session
      - start_with_chat
  debug_profile:
    type: enum
    values:
      - standard
      - strict_backend_evidence
      - route_matrix
  updated_at:
    type: iso8601_utc_timestamp
  provenance:
    type: object
    required_fields:
      - source
      - evidence_ref
    source_enum:
      - user_selection
      - import_validation
      - runtime_projection
      - avatar_backend_evidence

forbidden_fields:
  - package_descriptor
  - package_path
  - launch_local_asset_id
  - live2d_adapter_manifest_payload
  - live2d_adapter_manifest_path
  - live2d_adapter_manifest_absolute_path
  - compatibility_tier
  - avatar_compatibility_diagnostics
  - carrier_registry_id
  - scoped_avatar_binding_id
  - account_id
  - user_id
  - realm_url
  - token
  - refresh_token
  - jwt
  - auth_payload
  - raw_apml
  - raw_mcp
  - raw_a2a
  - raw_provider_output
  - backend_command

invariants:
  - Desktop stores opaque refs only and does not dereference package descriptors.
  - The schema must not be copied into Avatar launch payload.
  - External Live2D sidecar refs are Desktop custody refs only; Avatar remains
    manifest resolver, compatibility validator, diagnostics, and carrier-proof owner.
  - Embedded and external Live2D adapter manifests must not be merged or silently preferred.
  - Missing evidence produces fail-closed configuration status.
