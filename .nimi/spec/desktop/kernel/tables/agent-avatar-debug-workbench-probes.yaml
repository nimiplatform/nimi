version: 1
table_family: product_catalog
catalog_id: desktop_agent_avatar_debug_workbench_probes
entries:
  - local_asset_validation
  - launch_readiness
  - backend_load
  - capability_profile
  - route_support_matrix
  - generated_motion
  - emotion_expression
  - speech_lipsync
  - window_hit_region
  - runtime_replay
  - No probe category may report success without all required evidence.
  - Desktop categories are product views and do not own Runtime or Avatar
    semantics.
  - Raw APML, MCP/A2A, provider, or app data is not admissible evidence.
owner: .nimi/spec/desktop
source_rule: D-LLM-085
status: active
probe_categories:
  - id: local_asset_validation
    required_evidence:
      - local_avatar_asset_ref
      - import_validation_ref
    semantic_owner: desktop_control_surface
  - id: launch_readiness
    required_evidence:
      - runtime_authorization_ref
      - avatar_launch_payload_shape
    semantic_owner: runtime_and_desktop_contracts
  - id: backend_load
    required_evidence:
      - avatar_debug_session_id
      - backend_load_evidence_ref
    semantic_owner: avatar_backend
  - id: capability_profile
    required_evidence:
      - backend_capability_profile_ref
      - profile_validation_evidence_ref
    semantic_owner: avatar_backend
  - id: route_support_matrix
    required_evidence:
      - generated_motion_routes_ref
      - backend_capability_profile_ref
    semantic_owner: avatar_backend
  - id: generated_motion
    required_evidence:
      - runtime_probe_id
      - avatar_backend_evidence_ref
    semantic_owner: runtime_probe_and_avatar_backend
  - id: emotion_expression
    required_evidence:
      - runtime_probe_id
      - avatar_backend_evidence_ref
    semantic_owner: runtime_probe_and_avatar_backend
  - id: speech_lipsync
    required_evidence:
      - runtime_probe_id
      - avatar_backend_evidence_ref
    semantic_owner: runtime_probe_and_avatar_backend
  - id: window_hit_region
    required_evidence:
      - avatar_carrier_diagnostics_ref
    semantic_owner: avatar_carrier
  - id: runtime_replay
    required_evidence:
      - runtime_replay_ref
    semantic_owner: runtime_audit

invariants:
  - No probe category may report success without all required evidence.
  - Desktop categories are product views and do not own Runtime or Avatar semantics.
  - Raw APML, MCP/A2A, provider, or app data is not admissible evidence.
