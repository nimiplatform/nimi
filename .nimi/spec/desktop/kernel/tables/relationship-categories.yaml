table_family: product_catalog
owner: desktop
catalog_id: desktop_relationship_categories
authority_refs:
  - D-REL-001
entries:
  - id: human_friends
    name: Human Friends
    semantics: Active human-to-human Friendship relations of the current account. Shared profile/social consumers may resolve each entry to a human relationship and route to Human Chat.
  - id: local_agents
    name: Local Agents
    semantics: Runtime-owned LocalAgents discovered from local Runtime inventory/provenance. Shared profile/social consumers may show source provenance and open existing local agents, but must not treat source records as friends or derive LocalAgent identity from source metadata.
