table_family: state_machine
owner: desktop
machine_id: desktop_realm_persona_local_materialization_action_model
authority_refs:
  - D-EXPL-006
  - D-EXPL-007
  - K-AGCORE-139
  - K-AGCORE-141
states:
  - state: source_materialization_available
    primary_action: Become my partner
    description: Desktop has a readable RealmPersona source record and may request a fresh SourceMaterializationPacket before asking Runtime to materialize the opaque Runtime-owned LocalAgent behind the partner relationship.
  - state: local_agent_available
    primary_action: Open partner
    description: Runtime local inventory/provenance has exactly one Runtime-owned LocalAgent for this source; Desktop may open that partner by opaque localAgentRef.
  - state: local_agent_ambiguous
    primary_action: Open from partners
    description: Runtime local inventory/provenance has more than one matching Runtime-owned LocalAgent; Desktop must fail closed instead of choosing an arbitrary localAgentRef.
  - state: runtime_agent_inventory_pending
    primary_action: Checking partner
    description: Desktop is checking Runtime inventory/provenance and must keep the partner action disabled until state is known.
  - state: runtime_agent_inventory_unavailable
    primary_action: Runtime unavailable
    description: Runtime, SDK lifecycle, or auth-backed inventory is unavailable; Desktop must keep the partner action disabled with a readable failure state.
transitions: []
