version: 1
table_family: product_catalog
owner: desktop
catalog_id: desktop_nimi_home_surfaces
entries:
  - surfaces_1
  - surfaces_2
  - surfaces_3
  - surfaces_4
  - surfaces_5
  - surface placement is owned by desktop-hosted shell per D-HOME-001
  - each row must declare source_authority and forbidden_ownership
  - failure-projection is a first-class surface and must not be collapsed into a generic unavailable label
  - apps row consumes Nimi App registry, package projection, SDK app client, and Runtime registration projection

# Canonical Nimi Home surface placement registry — desktop-hosted shell IA.
# See nimi-home-shell-contract.md (D-HOME-001..D-HOME-012) and Platform
# nimi-home-contract.md (P-HOME-001..P-HOME-010).

surface_schema:
  owner: desktop_nimi_home_shell
  fields:
    - surface_id
    - surface_label
    - owner
    - source_authority
    - allowed_projection_scope
    - forbidden_ownership
    - source_rule

surfaces:
  - surface_id: first-run
    surface_label: First-Run
    owner: desktop_nimi_home_shell
    source_authority:
      - .nimi/spec/platform/kernel/cold-start-authority-contract.md
      - .nimi/spec/platform/kernel/ai-profile-selection-policy-contract.md
      - .nimi/spec/runtime/kernel/local-environment-consumer-activation-contract.md
    allowed_projection_scope:
      - cold_start_state_per_P_COLD_001
      - ai_profile_state_per_P_AIPS_010
      - runtime_activation_gate_state_per_K_LENV_ACT_005
    forbidden_ownership:
      - ai_profile_selection_authority
      - host_capability_profile_authority
      - selected_source_record_authority
      - provider_or_model_constant
    source_rule: D-HOME-002

  - surface_id: apps
    surface_label: Apps
    owner: desktop_nimi_home_shell
    source_authority:
      - .nimi/spec/platform/kernel/nimi-home-contract.md
      - .nimi/spec/platform/kernel/nimi-app-admission-contract.md
      - .nimi/spec/sdk/kernel/nimi-app-client-contract.md
    allowed_projection_scope:
      - ordinary_visible_nimi_app_listing_consumed_from_registry_projection
      - install_update_uninstall_card_states_consumed_from_sdk_projection
      - app_health_consumed_from_runtime_registration_projection
      - avatar_filtered_from_ordinary_apps
    forbidden_ownership:
      - app_registry_admission_authority
      - marketplace_economy_truth
      - package_trust_authority
      - app_local_spec_discovery_truth
      - avatar_package_install_update_authority
    source_rule: D-HOME-004

  - surface_id: agent-chat
    surface_label: Agent Chat
    owner: desktop_nimi_home_shell
    source_authority:
      - .nimi/spec/platform/kernel/nimi-home-contract.md
      - .nimi/spec/desktop/kernel/agent-chat-behavior-contract.md
      - .nimi/spec/sdk/kernel/ai-config-surface-contract.md
    allowed_projection_scope:
      - in_shell_reference_surface_placement_per_P_HOME_006
      - aiscoperef_enforced_per_D_HOME_007
    forbidden_ownership:
      - transcript_history_truth_in_wave_1
      - cross_app_agent_identity_truth_in_wave_1
      - chat_derived_memory_truth_in_wave_1
      - runtime_internal_import
    source_rule: D-HOME-006

  - surface_id: runtime-health
    surface_label: Runtime Health
    owner: desktop_nimi_home_shell
    source_authority:
      - .nimi/spec/runtime/kernel/local-engine-contract.md
      - .nimi/spec/sdk/kernel/local-environment-projection-contract.md
    allowed_projection_scope:
      - daemon_lifecycle_state
      - host_capability_profile_projection
      - runtime_activation_gate_state
    forbidden_ownership:
      - runtime_materializer_authority
      - selected_source_record_authority
      - desktop_owned_runtime_replacement
    source_rule: D-HOME-009

  - surface_id: app-health
    surface_label: App Health
    owner: desktop_nimi_home_shell
    source_authority:
      - .nimi/spec/platform/kernel/nimi-home-contract.md
    allowed_projection_scope:
      - app_runtime_registration_status_consumed_from_runtime
      - app_health_consumed_from_wave_3_registry
    forbidden_ownership:
      - app_runtime_registration_authority
      - app_lifecycle_authority
    source_rule: D-HOME-009

  - surface_id: account
    surface_label: Account
    owner: desktop_nimi_home_shell
    source_authority:
      - .nimi/spec/platform/kernel/cold-start-authority-contract.md
      - .nimi/spec/desktop/kernel/auth-session-contract.md
    allowed_projection_scope:
      - sign_in_skip_local_posture_per_P_COLD_004
      - runtime_local_custody_projection
    forbidden_ownership:
      - renderer_durable_token_custody
      - realm_canonical_account_truth
      - anonymous_success_as_authenticated
    source_rule: D-HOME-009

  - surface_id: settings
    surface_label: Settings
    owner: desktop_nimi_home_shell
    source_authority:
      - .nimi/spec/desktop/kernel/ai-profile-config-contract.md
      - .nimi/spec/platform/kernel/ai-profile-selection-policy-contract.md
    allowed_projection_scope:
      - scope_bound_aiconfig_edit_per_D_AIPC_011
      - ai_profile_selection_per_P_AIPS_010
    forbidden_ownership:
      - provider_or_model_constant_per_P_AIPS_008
      - selected_source_record_authority
    source_rule: D-HOME-009

  - surface_id: diagnostics
    surface_label: Diagnostics
    owner: desktop_nimi_home_shell
    source_authority:
      - .nimi/spec/runtime/kernel/local-engine-contract.md
      - .nimi/spec/sdk/kernel/local-environment-projection-contract.md
    allowed_projection_scope:
      - runtime_diagnostic_reports
      - dependency_job_state_projection
      - selected_source_record_projection
    forbidden_ownership:
      - runtime_log_authority
      - runtime_audit_authority
    source_rule: D-HOME-009

  - surface_id: developer-mode
    surface_label: Developer Mode
    owner: desktop_nimi_home_shell
    source_authority:
      - .nimi/spec/desktop/kernel/mod-governance-contract.md
      - .nimi/spec/desktop/kernel/hook-capability-contract.md
    allowed_projection_scope:
      - developer_only_visibility_per_naming_and_kernel_ontology
      - mod_hook_retirement_projection
    forbidden_ownership:
      - public_mod_or_extension_admission
      - ordinary_user_product_promise
    source_rule: D-HOME-009

  - surface_id: failure-projection
    surface_label: Failure Projection
    owner: desktop_nimi_home_shell
    source_authority:
      - .nimi/spec/platform/kernel/cold-start-authority-contract.md
      - .nimi/spec/platform/kernel/nimi-self-update-contract.md
      - .nimi/spec/platform/kernel/nimi-package-release-contract.md
      - .nimi/spec/runtime/kernel/local-environment-consumer-activation-contract.md
    allowed_projection_scope:
      - typed_failure_state_per_P_COLD_001
      - typed_self_update_failure_per_P_SUPD_006
      - typed_release_failure_per_P_PKGREL_006
      - typed_activation_gate_failure_per_K_LENV_ACT_005
    forbidden_ownership:
      - generic_unavailable_collapse_label
      - hidden_failure_reason
    source_rule: D-HOME-012
