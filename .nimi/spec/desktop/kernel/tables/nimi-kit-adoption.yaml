forbidden_patterns:
  - id: desktop.no_legacy_brand_or_accent_aliases
    scope: apps/desktop/src/shell/renderer/styles.css
    pattern: --color-brand-|--color-accent-
    reason: Desktop governed styles must use kit semantic tokens and nimi-accent, not retired brand/accent aliases.
    source_rule: P-DESIGN-008
  - id: desktop.no_motion_base_alias
    scope: .nimi/spec/desktop/kernel/tables/renderer-design-tokens.yaml
    pattern: 'motion\.base|--nimi-motion-base'
    reason: Desktop downstream design tokens must align to motion.slow and must not retain motion.base aliases.
    source_rule: P-DESIGN-017
