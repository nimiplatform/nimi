    app: desktop
    module: apps/desktop/src/shell/renderer/app-shell/routes/app-routes.tsx
    families:
      - surface
      - action
      - status
      - feedback
    testid_required: false
    exception_policy: none
    source_rule: P-DESIGN-020
    scheme_support:
      - light
      - dark
    default_scheme: light
    accent_pack: nimi-accent
  - id: desktop.contacts.sidebar
