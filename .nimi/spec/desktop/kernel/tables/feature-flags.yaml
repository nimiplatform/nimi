# Desktop Shell Feature Flags
# Source: kit/core/src/shell-mode.ts (ShellFeatureFlags)
# Note: platform-conditional desktop defaults are captured in entry-specific fields when a plain
# `default_desktop` boolean is not sufficient.

flags:
  - flag: enableRuntimeTab
    default_desktop: true
    default_web: false
    description: Internal migration guard only; Runtime is an ordinary primary nav item in product authority
    source_rule: D-SHELL-001

  - flag: enableModUi
    default_desktop: false
    default_web: false
    description: >-
      Enable mod UI extension rendering. Default false on desktop and web; mod UI
      surfaces are reachable only behind admitted Developer Mode per D-DEV-004,
      consistent with the developer/internal/retirement-only posture of D-SHELL-002.
    source_rule: D-DEV-004

  - flag: enableDeveloperTools
    default_desktop: false
    default_web: false
    description: >-
      Enable the Developer Tools developer-group surface. Default false; the
      surface is reachable only after the user enables admitted Developer Mode
      from the discoverable Settings toggle per D-DEV-001 and D-DEV-002.
    source_rule: D-DEV-001

  - flag: enableModWorkspaceTabs
    default_desktop: true
    default_web: false
    description: Enable mod workspace tab management
    source_rule: D-SHELL-002

  - flag: enableSettingsExtensions
    default_desktop: true
    default_web: false
    description: Enable settings panel extension sections
    source_rule: D-SHELL-002

  - flag: enableTitlebarDrag
    default_desktop: true
    default_web: false
    description: Enable native window titlebar drag
    source_rule: D-SHELL-003

  - flag: enableMenuBarShell
    default_desktop: true
    default_web: false
    desktop_platform_defaults:
      macos: true
      other: false
    description: Enable menu bar runtime entry shell; true on macOS desktop and false on non-macOS desktop or web
    source_rule: D-MBAR-001

  - flag: enableRuntimeBootstrap
    default_desktop: true
    default_web: false
    description: Execute full runtime bootstrap sequence (hook runtime, mods, external agent)
    source_rule: D-BOOT-004
