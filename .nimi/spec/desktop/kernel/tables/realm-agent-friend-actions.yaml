table_family: state_machine
owner: desktop
machine_id: desktop_realm_agent_friend_action_model
authority_refs:
  - D-EXPL-006
  - D-EXPL-007
  - R-SOC-007
  - R-SOC-008
  - R-SOC-009
states:
  - state: not_friend
    description: Current account has no AgentFriend relation with this RealmAgent. Primary action is Add friend.
  - state: pending
    description: An AgentFriend request exists and is awaiting resolution. Primary action is Pending; no duplicate request.
  - state: friend
    description: AgentFriend relation exists with its one-to-one LocalAgent projection. Primary action is Open Agent Chat, opening LocalAgent Chat.
  - state: limit_reached
    description: Agent friend quota is reached. Primary action is Manage Agent friends; the user must remove an AgentFriend or upgrade where later admitted.
transitions:
  - from: not_friend
    to: pending
    guard: User triggers Add friend and the request is not yet resolved.
  - from: not_friend
    to: friend
    guard: Add friend auto-approves under quota; AgentFriend relation and the idempotent LocalAgent projection are created. The Friendship creation is synchronous, but the LocalAgent projection establishment converges eventually through the durable LocalAgentProvisionIntent and the desktop courier defined by R-SOC-009, not as a synchronous backend-to-runtime call.
  - from: not_friend
    to: limit_reached
    guard: Add friend is attempted while the Agent friend quota is already reached.
  - from: pending
    to: friend
    guard: AgentFriend request is approved; the idempotent LocalAgent projection is created. The Friendship creation is synchronous, but the LocalAgent projection establishment converges eventually through the durable LocalAgentProvisionIntent and the desktop courier defined by R-SOC-009, not as a synchronous backend-to-runtime call.
  - from: friend
    to: not_friend
    guard: AgentFriend is removed; the one-to-one LocalAgent projection is deleted. The Friendship deletion is synchronous, but the LocalAgent projection deletion converges eventually through the durable LocalAgentTerminationIntent and the desktop courier defined by R-SOC-008, not as a synchronous backend-to-runtime call.
  - from: limit_reached
    to: not_friend
    guard: User removes another AgentFriend, freeing quota for this RealmAgent.
