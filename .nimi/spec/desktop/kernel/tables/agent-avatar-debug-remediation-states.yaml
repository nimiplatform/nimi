version: 1
table_family: closed_enum
enum_id: desktop_agent_avatar_debug_remediation_states
values:
  - ready
  - package_missing
  - package_unresolved
  - launch_payload_invalid
  - runtime_authorization_missing
  - runtime_probe_missing
  - avatar_session_unavailable
  - backend_load_failed
  - capability_profile_missing
  - route_unsupported
  - generated_motion_provider_missing
  - replay_unavailable
  - Terminal states must not be rendered as success.
  - User remediation may propose actions but may not mutate Runtime or Avatar
    truth locally.
owner: .nimi/spec/desktop
source_rule: D-LLM-085
status: active
states:
  - id: ready
    terminal: false
    meaning: all_required_typed_evidence_present
  - id: package_missing
    terminal: true
    meaning: no_avatar_package_ref_selected
  - id: package_unresolved
    terminal: true
    meaning: avatar_package_ref_not_resolved_by_authorized_projection
  - id: launch_payload_invalid
    terminal: true
    meaning: launch_payload_shape_would_violate_minimal_avatar_launch_contract
  - id: runtime_authorization_missing
    terminal: true
    meaning: runtime_authorization_or_agent_projection_missing
  - id: runtime_probe_missing
    terminal: true
    meaning: runtime_probe_or_replay_evidence_missing
  - id: avatar_session_unavailable
    terminal: true
    meaning: avatar_debug_session_not_available
  - id: backend_load_failed
    terminal: true
    meaning: avatar_backend_load_evidence_failed
  - id: capability_profile_missing
    terminal: true
    meaning: backend_capability_profile_ref_missing_or_invalid
  - id: route_unsupported
    terminal: true
    meaning: backend_profile_declares_route_unsupported
  - id: generated_motion_provider_missing
    terminal: true
    meaning: generated_motion_provider_evidence_missing
  - id: replay_unavailable
    terminal: true
    meaning: runtime_replay_link_missing_or_forbidden

invariants:
  - Terminal states must not be rendered as success.
  - User remediation may propose actions but may not mutate Runtime or Avatar truth locally.

