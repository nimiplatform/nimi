version: 2
table_family: product_catalog
owner: desktop
catalog_id: desktop_local_app_launch_hosts
entries:
  - desktop-electron-local-app-host
  - desktop-tauri-local-app-host
authority_status: admitted
description: >-
  Final host-neutral local-app launch behavior. No installed-app identity or
  public installed session remains.
host_schema:
  owner: desktop_ui_shell
  source_rule: D-SHELL-038
  fields:
    - host_id
    - authority_status
    - trust_classes
    - product_launch_allowed
    - host_kind
    - caller_mode
    - carrier
    - process_replacement
    - runtime_restart
    - immutable_positive_posture
    - source_rule
hosts:
  - host_id: desktop-electron-local-app-host
    authority_status: admitted
    trust_classes: [local_development]
    product_launch_allowed: true
    host_kind: electron
    caller_mode: LOCAL_APP
    carrier: protected_local_app_host
    process_replacement: new_lease_bind_and_session
    runtime_restart: new_lease_bind_and_session
    immutable_positive_posture: typed_unavailable_until_0p_or_p
    source_rule: D-SHELL-038
  - host_id: desktop-tauri-local-app-host
    authority_status: admitted
    trust_classes: [local_development]
    product_launch_allowed: true
    host_kind: tauri
    caller_mode: LOCAL_APP
    carrier: protected_local_app_host
    process_replacement: new_lease_bind_and_session
    runtime_restart: new_lease_bind_and_session
    immutable_positive_posture: typed_unavailable_until_0p_or_p
    source_rule: D-SHELL-038
constraints:
  - shipped_bundled_components_are_excluded
  - isolated_zhiyu_integration_build_uses_local_development
  - renderer_receives_no_principal_grant_session_endpoint_or_token_material
  - app_id_is_display_and_routing_metadata_only
  - no_generic_runtime_proxy_or_direct_daemon_fallback
  - no_persistent_local_development_autostart
