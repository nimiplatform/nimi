        - desktop_avatar_launch_handoff
        - desktop_avatar_close_handoff
        - desktop_avatar_instance_registry_list
        - focus_main_window
        - start_window_drag
    origin_crate: mixed
    owner_domain: desktop-shell
    execution_class: bounded_blocking_with_admission
    remediation_required: false
    admitted_risks:
      - os_browser_handoff
      - window_handoff
      - std_fs
      - sync_lock_contention
    source_rule: D-GATE-092

  - family: native_dialogs_and_pickers
