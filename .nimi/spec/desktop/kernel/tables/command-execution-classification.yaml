# Desktop Tauri command execution classification.
# Source of truth for D-GATE-092..D-GATE-096.
schema_version: desktop-tauri-command-execution/v1
source_rules:
  - D-GATE-092
  - D-GATE-093
  - D-GATE-094
  - D-GATE-095
  - D-GATE-096

scan_roots:
  - apps/desktop/src-tauri/src
  - kit/shell/tauri/src

registered_surface:
  source_rule: D-GATE-093
  generate_handler: apps/desktop/src-tauri/src/main_parts/app_bootstrap.rs
  minimum_registered_count: 1

execution_classes:
  - class: ui_sync
    source_rule: D-GATE-092
    description: Pure in-memory or constant config command with no admitted blocking source.
  - class: request_response_async
    source_rule: D-GATE-092
    description: Async request/response command using async-aware I/O or runtime bridge work.
  - class: background_job
    source_rule: D-GATE-092
    description: Long-running transfer, install, import, archive, scan, hash, or bulk mutation with progress/cancel ownership.
  - class: bounded_blocking_with_admission
    source_rule: D-GATE-092
    description: Explicitly bounded synchronous local or OS work with admitted risk families.
  - class: registered_disabled_stub
    source_rule: D-GATE-092
    description: Registered fail-closed command stub with no active side effect.

dormant_classes:
  - class: dormant_admitted
    source_rule: D-GATE-095
    description: Annotated but unregistered command retained only as unavailable code; re-registration requires active classification first.
  - class: dead_for_removal
    source_rule: D-GATE-095
    description: Annotated but unregistered command that should be deleted by cleanup.

risk_catalog:
  - risk: blocking_http
    source_rule: D-GATE-094
  - risk: sync_dns_or_connect
    source_rule: D-GATE-094
  - risk: runtime_bridge_block_on
    source_rule: D-GATE-094
  - risk: block_on_variants
    source_rule: D-GATE-094
  - risk: process_command
    source_rule: D-GATE-094
  - risk: archive_or_compression
    source_rule: D-GATE-094
  - risk: sqlite_sync
    source_rule: D-GATE-094
  - risk: std_fs
    source_rule: D-GATE-094
  - risk: native_dialog
    source_rule: D-GATE-094
  - risk: thread_sleep
    source_rule: D-GATE-094
  - risk: raw_thread_spawn
    source_rule: D-GATE-094
  - risk: spawn_blocking
    source_rule: D-GATE-094
  - risk: sync_lock_contention
    source_rule: D-GATE-094
  - risk: cpu_hash_or_codec
    source_rule: D-GATE-094
  - risk: sync_socket_bind
    source_rule: D-GATE-094
  - risk: os_browser_handoff
    source_rule: D-GATE-094
  - risk: window_handoff
    source_rule: D-GATE-094
  - risk: sync_keyring_dialog
    source_rule: D-GATE-094

registered_command_families:
  - family: static_desktop_state
    match:
      exact:
        - runtime_defaults
        - desktop_release_info_get
        - desktop_update_state_get
        - built_in_ai_config_for_scope_init
    origin_crate: mixed
    owner_domain: desktop-state-projection
    execution_class: bounded_blocking_with_admission
    remediation_required: false
    admitted_risks:
      - std_fs
      - sync_lock_contention
    source_rule: D-GATE-092

  - family: desktop_update_async
    match:
      exact:
        - desktop_update_check
        - desktop_update_download
        - desktop_update_install
    origin_crate: apps/desktop/src-tauri
    owner_domain: desktop-updater
    execution_class: request_response_async
    remediation_required: false
    admitted_risks:
      - blocking_http
      - std_fs
    source_rule: D-GATE-092

  # Retained app-local in the 2026-07-09 Tauri shell refactor batch;
  # future redesign target: kit shell host network capability.
  - family: admitted_shell_network_async
    match:
      exact:
        - http_request
    origin_crate: apps/desktop/src-tauri
    owner_domain: desktop-admitted-shell-network
    execution_class: request_response_async
    remediation_required: false
    admitted_risks:
      - blocking_http
    source_rule: D-GATE-092

  - family: native_window_and_os_handoff
    match:
