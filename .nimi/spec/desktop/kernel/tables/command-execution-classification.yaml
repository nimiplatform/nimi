dormant_command_families:
  - family: kit_installed_app_commands_for_non_desktop_hosts
    match:
      exact:
        - app_host_bootstrap
        - artifacts_read_runtime_bytes
    origin_crate: kit/shell/tauri
    owner_domain: installed-app-standard-shell
    dormant_class: dormant_admitted
    remediation_required: false
    reason: Shared Kit installed-app commands are registered only by supervised installed or local-development app hosts; the Desktop renderer does not expose this app-host surface.
    source_rule: D-GATE-095

  - family: kit_shell_floating_window_for_non_desktop_hosts
    match:
      prefix: floating_window_
    origin_crate: kit/shell/tauri
    owner_domain: standard-shell-floating-window
    dormant_class: dormant_admitted
    remediation_required: false
    reason: Shared Kit floating-window commands are scanned from the kit Tauri crate but Desktop does not register the floating-window host surface in the current shell.
    source_rule: D-GATE-095

  - family: kit_shell_avatar_asset_resolvers_for_avatar_app
    match:
      exact:
        - nimi_avatar_resolve_agent_center_avatar_asset
    origin_crate: kit/shell/tauri
    owner_domain: avatar-shell-local-asset-resolution
    dormant_class: dormant_admitted
    remediation_required: false
    reason: Avatar app registers these shared Kit shell commands; Desktop scans
      the shared Kit root but does not expose the Avatar resolver surface.
    source_rule: D-GATE-095
