table_family: protocol_surface
owner: desktop
protocol_id: desktop_data_sync_non_admission_map
surfaces:
  - non_admitted_infrastructure
  - non_admitted_auth
  - non_admitted_account_profile
  - non_admitted_human_chat
  - non_admitted_social
  - non_admitted_world
  - non_admitted_economy
  - non_admitted_feed_resource
  - non_admitted_explore
  - non_admitted_notification
  - non_admitted_settings
  - non_admitted_agent
  - non_admitted_transit
# Desktop DataSync Non-Admission Owner Map
# Source: .nimi/spec/desktop/kernel/data-sync-contract.md

flows:
  - flow: infrastructure
    methods: []
    replacement_owner: SDK projection / SDK DX-client-orchestration / shell-scaffold
    description: Realm transport, auth custody, reason-code handling, hot-state, and polling authority are not Desktop DataSync responsibilities; bounded HMR/query/offline scaffold may exist outside DataSync
    source_rule: D-DSYNC-000
  - flow: auth
    methods: []
    replacement_owner: Runtime / Realm / SDK DX-client-orchestration / Kit auth shell
    description: Credential exchange, session truth, token custody, password, OAuth, OTP, 2FA, and logout authority are not Desktop DataSync responsibilities
    source_rule: D-DSYNC-001
  - flow: account_profile
    methods: []
    replacement_owner: Realm / SDK projection / SDK DX-client-orchestration
    description: Current-user, profile, account settings, creator eligibility, and account-data actions belong to SDK Realm helpers or Platform Client domains
    source_rule: D-DSYNC-002
  - flow: human_chat
    methods: []
    replacement_owner: Realm / Kit chat / SDK projection / shell-scaffold
    description: Human chat typed access and realtime assembly are Kit/SDK surfaces; Desktop may keep local offline cache/outbox scaffold outside DataSync
    source_rule: D-DSYNC-003
  - flow: social
    methods: []
    replacement_owner: Realm / SDK projection / Kit headless / shell-scaffold
    description: Relationship graph and social mutation truth belong to Realm; Desktop may keep UI confirmation and offline mutation scaffold outside DataSync
    source_rule: D-DSYNC-004
  - flow: world
    methods: []
    replacement_owner: Realm / SDK projection / Kit headless
    description: World list, detail, semantic, lore, binding, scene, and audit reads are not Desktop DataSync authority
    source_rule: D-DSYNC-005
  - flow: economy
    methods: []
    replacement_owner: Realm / Kit commerce
    description: Currency, transactions, subscriptions, gifts, checkout, withdrawal, and gift-review flows are Realm truth consumed through Kit commerce Realm helpers
    source_rule: D-DSYNC-006
  - flow: feed_resource
    methods: []
    replacement_owner: Realm / SDK projection / SDK DX-client-orchestration / Kit headless
    description: Feed, post interactions, governance reports, direct upload sessions, resource finalization, and attachment request helpers are not Desktop DataSync responsibilities
    source_rule: D-DSYNC-007
  - flow: explore
    methods: []
    replacement_owner: Realm / SDK projection / Kit headless
    description: Explore search, recommendations, discovery feed, and public source profile reads are not Desktop DataSync authority
    source_rule: D-DSYNC-008
  - flow: notification
    methods: []
    replacement_owner: Realm / SDK projection
    description: Notification unread/list/read mutations are Realm truth consumed through SDK Realm notification helpers
    source_rule: D-DSYNC-009
  - flow: settings
    methods: []
    replacement_owner: Realm / SDK projection / SDK DX-client-orchestration
    description: User settings, notification preferences, creator eligibility, password, OAuth, and 2FA flows are Realm truth consumed through SDK Realm account/settings helpers
    source_rule: D-DSYNC-010
  - flow: source
    methods: []
    replacement_owner: Realm / Runtime / Cognition / SDK projection
    description: Creator source reads belong to Realm helpers; LocalAgent lifecycle, execution, memory, and route truth belong to Runtime/Cognition
    source_rule: D-DSYNC-011
  - flow: transit
    methods: []
    replacement_owner: Realm / Runtime / SDK projection / Kit headless
    description: World transit state is not Desktop DataSync authority
    source_rule: D-DSYNC-012
