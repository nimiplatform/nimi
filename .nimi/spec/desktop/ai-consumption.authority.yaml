format: nimicoding.authority/v2
owner: team.desktop
scope: desktop.ai-consumption
units:
  - id: definition.nimi.desktop.ai-consumption.profile-config
    kind: definition
    title: Desktop AI profile configuration consumption surface
    meaning: The Desktop AI profile and configuration consumption surface is the typed SDK and host projection for portable AIProfile, canonical App or shared LocalAgent AIConfig, the separately machine-owned Machine Loadout store and Loadouts, the six closed product actions, derived admission, and immutable Job inputs including a Local Job's complete ResolvedAssembly; Desktop owns placement and interaction for its authorized owner context but no per-Agent or feature configuration, execution binding, credential, machine selection, Runtime process, or Job truth.
  - id: definition.nimi.desktop.ai-consumption.llm-adapter
    kind: definition
    lifecycle: removed
    title: Retired Desktop LLM adaptation consumption surface
    reason: Removed because adapter, connector, route resolver, local health, and public readiness projections do not own capability execution.
  - id: definition.nimi.desktop.ai-consumption.capability-execution-projection
    kind: definition
    title: Desktop capability execution projection
    meaning: The Desktop capability execution projection submits CapabilityContract requests under a canonical AIConfig owner and consumes Runtime's deterministic Local or Cloud composition, typed derived admission, immutable Job events, artifacts, and failures without selecting a target, acting as a CapabilityImplementationDriver or ExecutionHost, holding secrets, probing readiness, or falling back.
    relations:
      - type: supersedes
        target: definition.nimi.desktop.ai-consumption.llm-adapter
  - id: definition.nimi.desktop.ai-consumption.streaming
    kind: definition
    title: Desktop streaming consumption surface
    meaning: The Desktop streaming consumption surface owns renderer subscription lifecycle, incremental presentation, explicit cancellation, timeout, interruption, backpressure, job progress, and retry affordances while Runtime and SDK own stream protocols, LocalAgent outputs, actions, continuations, jobs, presentation timelines, and execution truth.
  - id: rule.nimi.desktop.ai-consumption.r001
    kind: rule
    title: AIConfig stores route intent with exact safe resource references
    modality: must
    statement: Desktop projects AIConfig per CapabilityContract as Local or Cloud route intent with required standardized features and defaults; Local carries one exact Loadout reference without Loadout content, model, workflow, node, ModelAsset binding, or machine preference, while Cloud carries one exact current-account Connector reference plus CapabilityImplementation and Driver-owned provider-model target without account selector, credential, endpoint, or secret.
    condition: Whenever Desktop stores, applies, exports, imports, or projects durable AI target identity.
    failure: Reject legacy or guessed target references, embedded local resource material, Connector-derived routing, account selectors, and any credential-, endpoint-, or secret-bearing target.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r002
    kind: rule
    title: Profile, configuration, selection, and Job facts are orthogonal
    modality: must
    statement: AIProfile remains a portable template, AIConfig remains current route and feature intent for one canonical App or shared LocalAgent owner, the Machine Loadout store remains the one machine aggregate with saved Loadouts and a set-or-empty selected relation, and each Local Job owns a complete immutable ResolvedAssembly atomically persisted at submission; none is a fallback for, shadow of, or write-back source for another.
    condition: Whenever Desktop consumes AI configuration, selection, or execution evidence.
    failure: Reject Profile-as-live-config, AIConfig-owned local bindings, selection-as-readiness, deletion required for explicit selection clearing, live rereads in place of Job inputs, and cross-owner write-back.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r003
    kind: rule
    title: Desktop remains a canonical-owner configuration consumer
    modality: must
    statement: Each account-scoped App owner owns one canonical AIConfig and the Runtime LocalAgent subsystem owns one shared AIConfig for all LocalAgents; the machine owner separately owns the Machine Loadout store, where Desktop presents omitted Local text context size as the recommended automatic mode and an explicit positive size as an advanced fixed override, Runtime owns deterministic composition, derived admission, process and Job facts, SDK owns typed projection, and Desktop owns authorized placement and editing interaction for currently projected owners through the same manager contract that a runtime.consume-covered protected App uses for its session-derived self owner.
    condition: Whenever renderer, Chat, Settings, Runtime Config, or another Desktop surface reads or mutates AI configuration.
    failure: Reject renderer-local, per-Agent, module, feature, route, chat-mode, inferred or unauthorized cross-App, caller-selected protected-App owner, Desktop-exclusive, or mixed resource-and-AIConfig persistence as canonical truth, and never require an ordinary user to calculate token budgets to recover a capacity failure.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r004
    kind: rule
    title: AIProfile carries portable configuration intent
    modality: must
    statement: AIProfile may carry AIConfig route intent, local CapabilityImplementation and Driver-owned portable configuration intent, Cloud CapabilityImplementation and target recommendation, required standardized features, defaults, provenance, license, and display metadata while preserving independent resource occurrences needed by a Driver.
    condition: Whenever Desktop imports, exports, previews, applies, or edits an AIProfile.
    failure: Reject a Profile that cannot preserve its portable contract, feature, configuration, occurrence, provenance, and license intent.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r005
    kind: rule
    title: AIProfile excludes machine and execution truth
    modality: must_not
    statement: An AIProfile contains a canonical AIConfig owner identity, Loadout identity, machine selection, ModelAsset id or path, concrete binding, connector or account identity, secret, Runtime process identity, install or dependency result, device feasibility, selected-source evidence, Job input, scheduler state, provider health, or quota truth.
    condition: Whenever a portable AIProfile payload is created or accepted.
    failure: Drop the non-portable field through an admitted portable-intent projection or reject the payload when safe filtering cannot be proven.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r006
    kind: rule
    title: Profile local intent uses a separate configuration action
    modality: must
    statement: Portable local implementation intent in a Profile is never a Machine Loadout store preference or exact AIConfig resource reference and may be consumed only by Prepare Loadout followed by Commit Loadout, which may save unresolved model slots without selecting the result; a user may later choose the saved Loadout reference in the canonical AIConfig editor and commit it through the same compare-and-swap Save, while UpdateLoadout is only the two-stage Loadout convenience and Profile handling never invokes model acquisition or an independent binding mutation.
    condition: Whenever Desktop relates portable Profile intent to Prepare and Commit Loadout.
    failure: Reject Profile-driven resource selection, guessed reference, installation, binding, direct Loadout mutation, or a Profile Apply path that writes AIConfig.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r007
    kind: rule
    title: AIConfig is complete current intent for one canonical owner
    modality: must
    statement: Every revisioned AIConfig belongs to exactly one account-scoped canonical App owner or the singular shared LocalAgent subsystem owner and stores the complete current per-CapabilityContract route intent, required standardized features, defaults, and one exact Local Loadout reference or exact Cloud Connector reference plus implementation-target intent without account selector, credential, endpoint, partial overlay, inheritance, history, per-Agent override, or fallback chain; a committed reference that later becomes missing, blocked, or unusable remains legal saved intent with typed effective failure until the user explicitly replaces or clears it.
    condition: Whenever a live AIConfig is committed, read, subscribed, or presented.
    failure: Reject partial or inherited configuration, a route without its required exact reference, and a write without the expected owner revision, and preserve the prior committed current state on atomic-write failure.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r008
    kind: rule
    title: AIConfig preserves its canonical envelope
    modality: must
    statement: AIConfig contains its canonical owner, opaque owner revision, per-CapabilityContract Local or Cloud route intent, required standardized-feature set, defaults, and exactly one Local Loadout reference or Cloud Connector reference plus CapabilityImplementation and Driver-owned provider-model target; resource content, credentials, endpoints, and account selectors remain outside the envelope, and optional Profile provenance is display-only and never a live binding or re-apply relation.
    condition: Whenever Desktop serializes or projects an AIConfig.
    failure: Reject an envelope without exact owner identity and opaque revision, without its route's exact resource reference, with embedded resource or credential material, or treating Profile provenance as a live binding.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r009
    kind: rule
    title: AIConfig capability payload stays compact
    modality: must
    statement: AIConfig capability entries contain only CapabilityContract identity, Local or Cloud route intent, the contract-scoped required standardized-feature set, typed defaults, and either one exact Loadout reference or one exact Connector reference plus intended CapabilityImplementation, Driver-owned provider-model target configuration, and portable display provenance; account selector, credential, endpoint, Local model content, components, workflow, node environment, ModelAsset bindings, and machine preference are absent.
    condition: Whenever a capability entry is materialized or persisted in AIConfig.
    failure: Reject a capability entry that exceeds its owner intent boundary, omits its exact route reference, or embeds Loadout content, Connector custody, ModelAsset binding, ResolvedAssembly, or other resource-owned state in AIConfig.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r010
    kind: rule
    title: AIConfig excludes Runtime and credential evidence
    modality: must_not
    statement: AIConfig persists Loadout content, local model or workflow identity, local components, requirement slots, ModelAsset ids or paths, exact Local bindings beyond its safe Loadout reference, machine preference, selected source records, install or process state, Connector content beyond its safe Connector reference, endpoint authority, provider health, scheduler state, raw secrets, tokens, API keys, OAuth payloads, credential payloads, or mutable Job inputs.
    condition: Whenever Desktop writes or exports live AIConfig.
    failure: Reject the write and retain the Runtime-owned facts or credentials solely in their typed owner projection.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r011
    kind: rule
    title: AIConfig does not absorb LocalAgent Conversation behavior
    modality: must_not
    statement: Desktop promotes LocalAgent Conversation behavior settings, turn planning, prompt or context assembly, message or action outputs, voice workflows, media execution, memory policy, or Runtime LocalAgent projections into top-level AIConfig truth.
    condition: Whenever Desktop models or edits AIConfig.
    failure: Consume the Runtime and SDK LocalAgent projection and keep AIConfig limited to configuration intent.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r012
    kind: rule
    title: Adjacent live config requires a distinct owner boundary
    modality: must
    statement: A live setting remains adjacent to AIConfig only when it has an independently named canonical owner and typed persistence boundary and affects a Runtime-owned bank, substrate, or retained-memory behavior rather than CapabilityContract route intent; Memory embedding bank configuration is the admitted instance and creates no additional AIConfig owner.
    condition: Whenever Desktop places an independently owned AI-adjacent setting outside AIConfig capability intent.
    failure: Reject an adjacent surface that lacks all boundary conditions or silently folds Runtime bank truth into capability selection.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r013
    kind: rule
    title: Adjacent config carries intent through typed projection only
    modality: must
    statement: Memory embedding and any admitted adjacent configuration carry only their separately owned user intent through typed SDK or host projection, while Runtime retains exact binding, bank identity, migration, cutover, and operation state; those facts never become AIConfig route, Machine Loadout store selection, or capability readiness.
    condition: Whenever Desktop reads or writes adjacent live configuration.
    failure: Reject renderer-local state, Desktop-local storage, private loopback endpoints, and Runtime evidence as adjacent config authority.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r014
    kind: rule
    title: Job inputs are an immutable execution envelope
    modality: must
    statement: Each Job records its Runtime-issued identity, admitted account and canonical AIConfig owner, CapabilityContract, creation time, and exact immutable effective inputs atomically persisted before publication; for Local those inputs are one complete ResolvedAssembly containing the committed Loadout reference, route, features, defaults, CapabilityImplementation, versioned Driver dialect and recipeId, typed options, every model axis's model_asset_id, expected_content_id, reverified absolute path and content identity, RecipeCustody identity, request, load plan, and process identity, while Cloud captures the committed Connector reference, implementation, provider-model target, defaults, and request and resolves custody only from that captured reference. Runtime owns the Job and SDK and Desktop consume bounded typed projections only.
    condition: Whenever a Desktop-consumed turn or Job is submitted or resumed.
    failure: Reject an ownerless, consumer-local, mutable, reconstructed, live-read, or field-incomplete Job input snapshot.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r015
    kind: rule
    title: Executions read only their captured Job inputs
    modality: must
    statement: A queued, running, or resumed turn or Job reads only its complete persisted effective inputs, never uses them as recovery or fallback, never rereads current Profile, AIConfig, Loadout, Machine Loadout store selection, catalog, inventory, process state, private CAS, current-account Connector selection, or other mutable owner state in their place, and never writes Job inputs back to configuration or Profile; later byte verification compares only the captured content identities and fails typed on drift.
    condition: From Job publication through terminal completion or resume.
    failure: Stop the execution path or preserve the original captured inputs instead of reconstructing or changing execution evidence in flight.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r016
    kind: rule
    title: Production Job evidence is durably projected
    modality: must
    statement: Desktop Job record and read behavior uses typed Runtime and SDK projection and does not represent a renderer-memory ring buffer, current configuration reread, or consumer-generated snapshot as durable execution evidence.
    condition: Whenever Desktop reads or presents Job evidence in production.
    failure: Reject renderer-owned execution evidence and report the Runtime Job projection as unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r017
    kind: rule
    title: Profile apply prefill and AIConfig overwrite remain separate
    modality: must
    statement: Applying AIProfile to one canonical App or shared LocalAgent AIConfig owner returns only non-committing portable editor prefill without exact resource references, merge, partial patch, shared Profile binding, owner mutation, or history; after the user selects exact current-environment Loadout or Connector references, the same canonical whole-object overwrite with expected opaque owner revision is the only commit path.
    condition: Whenever Profile Apply prefill or a later AIConfig Save is requested.
    failure: Reject Profile Apply as a commit, guessed references, or a mutation without the expected owner revision; a failed overwrite leaves the prior config unchanged.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r018
    kind: rule
    title: Apply validates portable prefill without requiring executability
    modality: must
    statement: Apply validates Profile schema and canonical owner, then returns valid Local or Cloud portable prefill even when no current-environment Loadout, ModelAsset, Connector, or usable credential exists; it never writes AIConfig, resolves inventory, acquires a ModelAsset, invokes Prepare, Commit, Select, or Delete Loadout, probes, prewarms, requires ready state, guesses an exact resource reference, or changes the prior committed config.
    condition: Whenever Desktop previews or applies a Profile as editor prefill.
    failure: Reject invalid portable schema, execution gating, guessed references, owner mutation, side effects, and partial pseudo-success.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r019
    kind: rule
    title: Apply never manufactures execution state
    modality: must_not
    statement: Desktop treats Profile import, preview, Apply, current inventory, Connector diagnostic, installation, process start, or static schema validity as an exact resource reference, binding, machine preference, admission, readiness, Job success, or committed AIConfig fact, or deletes unresolved prefill or committed intent to report success.
    condition: Whenever Profile or AIConfig actions are presented.
    failure: Preserve the committed owner intent, keep prefill non-committing, and let exact Job submission derive a typed admission result only after canonical Save.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r020
    kind: rule
    title: Canonical configuration aggregates are closed
    modality: must_not
    statement: Desktop defines a global active Profile, singleton global AIConfig, per-Agent AIConfig, module or feature AIConfig, fallback inheritance, or shadow Machine Loadout store; each App or product owns one AIConfig, all LocalAgents share one Runtime-owned AIConfig, and each machine has one canonical Machine Loadout store.
    condition: Whenever Profile, AIConfig owner, Loadout, or machine selection state is modeled.
    failure: Preserve the canonical owner aggregates and reject parallel or inherited live truth.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r021
    kind: rule
    title: Portable export preserves authored intent
    modality: must
    statement: AIProfile export preserves CapabilityContract and contract-scoped standardized-feature intent, AIConfig route and defaults intent, local CapabilityImplementation, Driver identity, portable configuration and independent resource-occurrence intent, Cloud implementation-target recommendation, provenance, license, and display metadata without machine or account identity.
    condition: Whenever Desktop exports or shares an AIProfile.
    failure: Reject an export that loses required authored intent or collapses distinct resource-occurrence identity or role; no generic occurrence ordering is implied.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r022
    kind: rule
    title: Live-config export filters non-portable evidence
    modality: must
    statement: Exporting current configuration to AIProfile uses only portable intent and drops or fails closed on canonical owner identity, Loadout identity, machine selection, ModelAsset id or path, exact bindings, selected source, install or process state, connector or account identity, secret, Job input, provider health, scheduler, and credential evidence.
    condition: Whenever Desktop derives a portable profile from live AIConfig.
    failure: Reject direct copying of AIConfig capabilities when the portable boundary cannot be proven.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r023
    kind: rule
    title: Image Loadout ownership stays machine scoped
    modality: must
    statement: An AIProfile may carry portable image.generate implementation and Driver configuration intent without resource identity, while AIConfig carries one exact saved image Loadout reference for Local image execution and the Machine Loadout store separately owns that Loadout's content and any machine-default preference; defaultRefs.imageProfileRef, localProfileRef, compact local targets, and App-local shadow configuration do not exist.
    condition: Whenever Desktop reads, writes, or displays image-related AI configuration.
    failure: Reject each retired field without a compatibility layer and require the canonical AIConfig Local route plus exact Loadout reference without transferring Loadout content ownership.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r024
    kind: rule
    title: Exact capture occurs per Job
    modality: must
    statement: Runtime atomically derives and persists complete exact effective inputs at each Job submission, including one ResolvedAssembly for Local, and Desktop consumes only that immutable Job projection; later Profile, AIConfig, Loadout, selection, catalog, inventory, Connector, process, or private CAS changes affect only future Jobs, and no session-level permanent or current-state binding exists.
    condition: Whenever execution inputs are captured, resumed, or owner state changes.
    failure: Reject partial capture, current-state reconstruction, session-wide binding, and in-flight configuration drift.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r025
    kind: rule
    title: All LocalAgents share the LocalAgent subsystem AIConfig
    modality: must
    statement: Every LocalAgent capability request uses the one Runtime-owned shared LocalAgent subsystem AIConfig through the SDK and no individual LocalAgent stores a route, model, or AIConfig override; personality, appearance, behavior, Memory, Knowledge, Conversation presentation, voice playback, and presentation settings remain separately owned non-AI LocalAgent configuration.
    condition: Whenever Desktop composes conversation capability and AI configuration models.
    failure: Reject peer ownership between configuration models or absorption of LocalAgent presentation truth into configuration.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r026
    kind: rule
    title: Six product actions mutate only their owner
    modality: must
    statement: Import Profile changes only the portable Profile catalog, Apply Profile to AIConfig returns only non-committing portable prefill, canonical AIConfig overwrite with expected owner revision is the only config commit, Prepare Loadout stores only a server-held no-write proposal, Commit Loadout atomically creates or replaces one Loadout from prepare_id, Select Loadout changes only one machine-default preference by setting an eligible target or explicitly clearing it, and Delete Loadout removes only its target and any preference selecting that target. Explicit Select clearing preserves Loadouts and ModelAssets, changes no AIConfig or captured Job, and chooses no replacement; UpdateLoadout is only a Prepare-plus-Commit convenience, no seventh Clear action or independent bind, unbind, rebind, or reprojection action exists, and no action installs, probes, prewarms, starts a Job, mutates another owner, or automatically invokes another action. A Desktop wizard may visibly sequence separately user-invoked resource actions and Profile prefill but never auto-selects a reference, commits AIConfig, or adds an aggregate confirmation gate.
    condition: Whenever Desktop presents or invokes a Profile or Loadout action.
    failure: Reject Profile Apply commit, cross-owner mutation, reverse Profile mutation, implicit reapply, deletion required for preference clearing, automatic mutation chaining, aggregate confirmation, or consumer-specific persistence.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r027
    kind: rule
    lifecycle: removed
    title: Retired AI configuration probe classes
    reason: Removed because static validation, availability probes, engine health, and feasibility do not form a product readiness surface or configuration authority.
  - id: rule.nimi.desktop.ai-consumption.r028
    kind: rule
    lifecycle: removed
    title: Retired aggregate capability feasibility probe
    reason: Removed because only exact Job submission derives admission from committed inputs and no scope aggregate, scheduler Peek, or probe result is execution authority.
  - id: rule.nimi.desktop.ai-consumption.r029
    kind: rule
    lifecycle: removed
    title: Retired capability probe presentation
    reason: Removed with the public probe lifecycle; Desktop presents typed request admission and Job failure reasons instead.
  - id: rule.nimi.desktop.ai-consumption.r030
    kind: rule
    title: Built-in chat AIConfig owners remain distinct
    modality: must
    statement: Desktop Nimi Chat is a Desktop-owned capability consumer using the Desktop App AIConfig, while Desktop Agent Chat is a projection of Runtime LocalAgent Conversation using the one shared LocalAgent subsystem AIConfig; neither creates a chat-specific or per-Agent owner, Profile Apply produces only portable non-committing prefill, and the later canonical Save requires user-selected exact current-environment references and expected owner revision without waiting for execution readiness.
    condition: Whenever built-in Nimi chat or a Runtime LocalAgent AIConfig is initialized or reconfigured.
    failure: Reject owner conflation, per-Agent AIConfig, Profile Apply commit, guessed resource references, and implicit execution materialization without changing Product Control readiness.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r031
    kind: rule
    lifecycle: removed
    title: Built-in config evidence is backend-verifiable
    reason: Built-in AIConfig is ordinary scope configuration and no longer produces a second proof record for Product Control admission.
  - id: rule.nimi.desktop.ai-consumption.r032
    kind: rule
    title: Built-in config has no inferred success or fallback owner
    modality: must_not
    statement: Desktop synthesizes AIConfig, route, Cloud target, current-account Connector, Loadout, machine selection, binding, admission, or Job truth from renderer state, selected tab, Conversation state, inventory, process health, caller-provided LocalAgent identity, or execution references; shares fallback across Desktop Nimi Chat and Desktop Agent Chat; creates a chat-specific or per-Agent owner; or hardcodes provider, engine, model, or configuration identity.
    condition: Whenever built-in chat configuration or execution admission is evaluated.
    failure: Preserve the canonical Desktop App or shared LocalAgent AIConfig owner and return the typed admission reason.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r033
    kind: rule
    title: Apply preview is typed and non-committing
    modality: must
    statement: Apply preview accepts one canonical AIConfig owner and AIProfile, returns a typed portable prefill diff with explicit null before for an absent config, and remains a non-committing operation separate from the later canonical whole-object Save; it returns no guessed resource reference, product revision, history, freshness evidence, or reusable commit token.
    condition: Whenever Desktop previews profile application.
    failure: Reject a free-form, partial, mutating, implicitly queued, or implicitly committed preview.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r034
    kind: rule
    title: Preview isolation excludes execution checks
    modality: must
    statement: Preview does not persist AIConfig, notify live subscribers, mutate AIProfile, resolve inventory, invoke Prepare or Commit Loadout, install ModelAssets, set or clear machine preference, select a Loadout or Connector reference, probe, prewarm, derive readiness or admission, create Job inputs, or gate a valid later Save; invalid Profile schema returns a typed error without a partial diff.
    condition: Whenever preview computes or returns a result.
    failure: Reject side effects, execution gating, partial diffs, and pseudo-success after invalid intent.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r035
    kind: rule
    title: Preview never creates product revision or history
    modality: must
    statement: Preview represents current intent at the time it is computed but creates no Profile revision, AIConfig version, history, lock, draft, or re-apply relation; Apply validates current input and may use a private compare-and-swap solely to prevent lost writes without treating preview output as commit authority.
    condition: Whenever AIConfig changes between preview and Apply.
    failure: Recompute the informational diff or reject a conflicting atomic write without creating product lifecycle state.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
  - id: rule.nimi.desktop.ai-consumption.r036
    kind: rule
    title: Cloud execution uses the exact implementation target and current-account Connector
    modality: must
    statement: Desktop submits only the canonical CapabilityContract request under the committed owner AIConfig, and for Cloud Runtime consumes its exact committed Connector reference, CapabilityImplementation, and Driver-owned provider-model target, validates Connector ownership, credential custody, App access, and existing policy, and captures those exact inputs before creating the Job without a second per-App or per-Connector authorization, while inline credential material remains unavailable.
    condition: Whenever Desktop constructs an AI provider request.
    failure: Reject inline credentials, connector-as-router, caller-selected hidden targets, and execution without exact committed Cloud inputs.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.capability-execution-projection
  - id: rule.nimi.desktop.ai-consumption.r037
    kind: rule
    title: Local endpoints remain Runtime private
    modality: must
    statement: Desktop does not persist or interpret a local provider endpoint, loopback URL, filename, model label, selected source, prefix, resident process, or engine name as Loadout identity, binding, machine selection, admission, or routing truth; Runtime-private Driver and ExecutionHost mechanics stay outside the product projection.
    condition: Whenever Desktop presents or consumes Local capability execution details.
    failure: Return the typed configuration or admission reason instead of inventing an endpoint, model, or binding.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.capability-execution-projection
  - id: rule.nimi.desktop.ai-consumption.r038
    kind: rule
    title: Cloud provider execution remains Runtime-only
    modality: must_not
    statement: Desktop restores a provider adapter factory, directly calls provider model-list, health, or execution APIs, or bypasses Runtime's CapabilityImplementationDriver, Remote ExecutionHost, current-account Connector ownership and credential validation, and typed SDK Job projection for Cloud execution.
    condition: Whenever a cloud connector path is used.
    failure: Keep execution unavailable until exact Runtime composition and admission succeeds.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.capability-execution-projection
  - id: rule.nimi.desktop.ai-consumption.r039
    kind: rule
    title: LocalAgent identity does not own route resolution
    modality: must
    statement: localAgentId identifies the authorized LocalAgent and Conversation only; every LocalAgent request uses the same shared LocalAgent AIConfig and at Job submission Runtime atomically dereferences its exact committed Loadout reference into a complete persisted ResolvedAssembly or captures its exact committed Connector reference plus Cloud implementation-target; missing identity, configuration, referenced resource, binding, credential, or feature support returns a typed failure without synthesizing a route or substituting machine preference.
    condition: Whenever Desktop submits a LocalAgent Conversation request.
    failure: Reject the request and present the typed Runtime failure without per-Agent model or route state.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.capability-execution-projection
  - id: rule.nimi.desktop.ai-consumption.r040
    kind: rule
    title: Text execution consumes deterministic composition
    modality: must
    statement: Desktop text.generate execution submits under the committed canonical AIConfig and consumes Runtime's exact Job projection; only at Job submission Runtime atomically dereferences its exact committed Local Loadout reference into a complete persisted ResolvedAssembly or captures its exact committed Cloud Connector reference and implementation target, then never searches, ranks, probes, rereads current owner state, chooses a substitute, or falls back, while Desktop infers nothing from provider, model, endpoint, inventory, machine preference, process, setup, or launcher state.
    condition: Whenever an LLM Job is submitted or presented.
    failure: Fail closed with the typed admission or Job reason for the exact captured composition.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.capability-execution-projection
  - id: rule.nimi.desktop.ai-consumption.r041
    kind: rule
    title: LocalAgent Conversation execution stays on Runtime
    modality: must_not
    statement: Desktop wraps a local kernel LocalAgent turn, assembles prompts, synthesizes state deltas, memory writes, or audit events, or replaces Runtime LocalAgent truth with a local mode enum.
    condition: Whenever Desktop submits or consumes a LocalAgent Conversation turn.
    failure: Route typed user intent through Runtime Agent Service and consume the SDK projection.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.capability-execution-projection
  - id: rule.nimi.desktop.ai-consumption.r042
    kind: rule
    title: Cloud credential custody never enters the renderer
    modality: must
    statement: Desktop AIConfig projection may carry the safe exact Connector reference committed by its canonical owner, while ordinary execution requests accept no Connector override and neither AIConfig nor requests carry credential-ref, token, endpoint, custody payload, or secret material; Runtime validates the committed reference, captures it at Job admission, obtains the minimum request-scoped secret material from that Connector for dispatch, and keeps custody material absent from renderer state and App projections.
    condition: Whenever a remote AI request requires credentials.
    failure: Reject raw secret, token, key, OAuth payload, or retired credentialRefId transport through Desktop.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.capability-execution-projection
  - id: rule.nimi.desktop.ai-consumption.r043
    kind: rule
    lifecycle: removed
    title: Retired public local text health projection
    reason: Removed because inventory, installed state, process health, residency, and warm state do not establish capability routing or product readiness.
  - id: rule.nimi.desktop.ai-consumption.r044
    kind: rule
    lifecycle: removed
    title: Retired local capability health inference
    reason: Removed because Desktop has no public local capability probe, health, readiness, or endpoint-derived sendability surface.
  - id: rule.nimi.desktop.ai-consumption.r045
    kind: rule
    title: Speech uses the typed Runtime media surface
    modality: must
    statement: Desktop speech consumption submits the audio.synthesize or audio.transcribe CapabilityContract under the canonical AIConfig owner and consumes the exact Runtime Job and media projection without an independent Desktop speech engine, Driver, provider, route, or readiness facade.
    condition: Whenever Desktop lists voices, synthesizes or streams speech, or transcribes audio.
    failure: Reject direct engine or provider execution outside the typed Runtime media surface.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.capability-execution-projection
  - id: rule.nimi.desktop.ai-consumption.r046
    kind: rule
    title: Voice capabilities compose committed routes independently
    modality: must
    statement: audio.synthesize and voice.create each use their own committed AIConfig CapabilityContract route and at Job submission Runtime atomically dereferences the exact committed Local Loadout reference into a complete persisted ResolvedAssembly or captures the exact committed Cloud Connector reference and implementation-target; a voice.create typed source determines only its input.text or input.audio feature preflight and creates no independent route, mode, Loadout, provider, or fallback selection, and queued or running Jobs never reread current AIConfig, machine preference, or Loadout. No contract reuses another contract's route, feature, binding, or Job snapshot and none performs execution-time list-options, resolve, health-check, or fallback selection.
    condition: Whenever Desktop invokes audio synthesis or voice creation.
    failure: Fail closed with the exact typed admission reason instead of returning an empty voice list or substitute execution as success.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.capability-execution-projection
  - id: rule.nimi.desktop.ai-consumption.r047
    kind: rule
    title: Voice adaptation does not own LocalAgent voice truth
    modality: must_not
    statement: Desktop capability projection decides LocalAgent voice admission, voice identity, return path, voice action execution, playback outcome, voice session, transcript, or caption semantics.
    condition: Whenever LocalAgent Conversation consumes a voice projection.
    failure: Render only the admitted Runtime LocalAgent and Voice projection.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.capability-execution-projection
  - id: rule.nimi.desktop.ai-consumption.r048
    kind: rule
    title: Renderer inference audit remains supplemental
    modality: must
    statement: A Desktop inference audit event may record event type, Local or Cloud route kind, CapabilityContract, exact CapabilityImplementation and Driver identity when projected, policy gate, traceId, and reasonCode and is appended through Runtime, while Runtime remains the durable audit owner with Job, request, target, private Connector custody reference, user, and usage context and no audit field becomes routing authority.
    condition: Whenever Desktop records a renderer-observed inference decision or failure.
    failure: Reject credential-bearing audit data and do not present the renderer record as complete Runtime audit truth.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.capability-execution-projection
  - id: rule.nimi.desktop.ai-consumption.r049
    kind: rule
    title: Cross-modality trace identity remains continuous
    modality: must
    statement: Desktop returns one traceId across text, image, video, speech, transcription, and embedding, aligns promptTraceId to that identity when retained, generates a trace when Runtime omits one, and includes traceId, CapabilityContract, route kind, implementation identity when admitted, and reason code in inference audit projection without using trace metadata as route or success truth.
    condition: Whenever Desktop consumes an AI execution response or records its audit projection.
    failure: Reject an untraceable Desktop execution result or repair the missing trace before presentation and audit handoff.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.capability-execution-projection
  - id: rule.nimi.desktop.ai-consumption.r050
    kind: rule
    title: World generation remains Runtime-only
    modality: must
    statement: Desktop submits, observes, cancels, and fetches world.generate Jobs only through Runtime surfaces under the committed owner AIConfig, with ordinary same-account Cloud execution capturing its exact committed Connector reference, CapabilityImplementation, Driver-owned provider-model target, and request and resolving custody only from that captured Connector, and treats a provider viewer URL only as external handoff; Desktop never resolves routes or uses Connector identity as a capability target.
    condition: Whenever Desktop consumes world.generate.
    failure: Reject direct provider upload, generate, operation, or get-world HTTP calls and any Desktop claim over provider execution truth.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.capability-execution-projection
  - id: rule.nimi.desktop.ai-consumption.r051
    kind: rule
    title: Streaming subscriptions always reach cleanup
    modality: must
    statement: A text or speech stream follows subscribe, zero or more non-terminal deltas, exactly one done or error outcome, and cleanup; done extracts usage and completion state, while cleanup releases subscription resources and removes progress indication after every outcome.
    condition: Whenever Desktop consumes StreamScenario output.
    failure: Mark the stream interrupted and clean up instead of leaving a live subscription or progress indicator.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.streaming
  - id: rule.nimi.desktop.ai-consumption.r052
    kind: rule
    title: Stream rendering cannot invent LocalAgent outputs
    modality: must_not
    statement: Desktop stream consumption splits, merges, reorders, or fabricates assistant messages, actions, voice actions, prompt payloads, deferred continuations, HookIntent decisions, continuation timers, interruption rules, or recursive chain limits outside Runtime-owned projection truth.
    condition: Whenever a LocalAgent Conversation stream includes message, action, modality, or deferred-continuation projection.
    failure: Preserve the exact Runtime-resolved relation and keep missing output absent.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.streaming
  - id: rule.nimi.desktop.ai-consumption.r053
    kind: rule
    title: Text deltas render incrementally
    modality: must
    statement: Desktop appends each typed text delta in Runtime order, keeps a typing indicator only while the stream is active, does not add a semantic buffer that changes ordering or terminal behavior, and hides usage when Runtime reports it unavailable.
    condition: Whenever Desktop renders streamed text.
    failure: Reject whole-message replacement, stale progress indication, fabricated usage, or chunk reassembly that changes semantic order.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.streaming
  - id: rule.nimi.desktop.ai-consumption.r054
    kind: rule
    title: First-chunk delay is visibly bounded
    modality: must
    statement: Desktop displays an explicit waiting warning when a StreamScenario first chunk has not arrived within 10 seconds and does not leave the surface in silent indefinite loading.
    condition: Whenever a stream is subscribed but no chunk has arrived.
    failure: Show the waiting or timeout projection while preserving the active stream state until Runtime terminates or the user cancels.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.streaming
  - id: rule.nimi.desktop.ai-consumption.r055
    kind: rule
    title: Stream errors preserve partial presentation
    modality: must
    statement: Pre-subscription failures use structured error projection, post-subscription interruption preserves rendered text and adds an interrupted state with retry affordance, and terminal nonzero reason codes remain mapped typed failures including general provider, timeout, and broken-stream reasons for speech.
    condition: Whenever stream establishment or transport fails.
    failure: Reject clearing partial content, reporting completion, or hiding the typed reason.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.streaming
  - id: rule.nimi.desktop.ai-consumption.r056
    kind: rule
    title: Interrupted execution streams are never replayed implicitly
    modality: must_not
    statement: Desktop or SDK silently reconnects, resumes, or replays an interrupted non-idempotent text, speech, or Scenario execution stream.
    condition: Whenever an execution stream ends before its admitted terminal outcome.
    failure: Preserve partial output and require an explicit user retry or a separately admitted recovery operation.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.streaming
  - id: rule.nimi.desktop.ai-consumption.r057
    kind: rule
    title: User cancellation is explicit and non-error
    modality: must
    statement: User stop aborts the active stream, preserves rendered content, marks it stopped, returns the UI to ready without entering an error boundary, and permits a new request only after the prior stream is done or canceled; Runtime total timeout terminates the stream through its typed terminal path.
    condition: Whenever a user stops generation or a stream reaches total timeout.
    failure: Reject concurrent streams for one chat and clean up a canceled stream without reporting successful completion.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.streaming
  - id: rule.nimi.desktop.ai-consumption.r058
    kind: rule
    title: ScenarioJob streams use terminal-state closure
    modality: must
    statement: SubscribeScenarioJobEvents consumes zero or more job snapshots, recognizes COMPLETED, FAILED, CANCELED, or TIMEOUT as terminal, expects normal stream close after terminal state, and never expects a text-stream done=true frame.
    condition: Whenever Desktop subscribes to ScenarioJob events.
    failure: Reject text-stream terminal semantics and clean up when the terminal job snapshot and normal close are observed.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.streaming
  - id: rule.nimi.desktop.ai-consumption.r059
    kind: rule
    title: ScenarioJob progress and outcomes remain typed
    modality: must
    statement: Desktop replaces older job state with each latest snapshot, accepts repeated RUNNING events, prioritizes progress_percent with current and total steps as supplemental detail, presents completed artifacts, typed failure with retry, canceled history, or timeout retry guidance, and fetches artifacts only after COMPLETED.
    condition: Whenever a ScenarioJob event or terminal state is rendered.
    failure: Reject regressed progress, hidden terminal state, pre-completion artifact success, and generic completion for failure or cancellation.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.streaming
  - id: rule.nimi.desktop.ai-consumption.r060
    kind: rule
    title: Job streams do not own modality action truth
    modality: must_not
    statement: ScenarioJob consumption decides whether an image, voice, video, or other action exists or owns pending invalidation, prompt semantics, or modality execution admission.
    condition: Whenever a job stream corresponds to a modality action.
    failure: Consume only an already-admitted Runtime action and its job lifecycle.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.streaming
  - id: rule.nimi.desktop.ai-consumption.r061
    kind: rule
    title: AI operation indicators align with Runtime timeouts
    modality: must
    statement: Desktop aligns indicators to 30 seconds for text generation, 10 seconds for streaming first chunk, 120 seconds for total text stream, 20 seconds for text embedding, 45 seconds for speech synthesis stream and non-Local speech-synthesis jobs, 120 seconds for image job submission, 300 seconds for video job submission, 90 seconds for non-Local speech-to-text jobs, and 15 minutes for Local speech-synthesis and speech-to-text jobs.
    condition: Whenever Desktop starts an AI operation covered by the Runtime timeout hierarchy.
    failure: Stop indefinite loading and project Runtime deadline-exceeded with the typed provider-timeout reason without claiming completion.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.streaming
  - id: rule.nimi.desktop.ai-consumption.r062
    kind: rule
    title: Mode C audit export is not a current Desktop stream
    modality: must_not
    statement: Desktop Phase 1 consumes the eof=true ExportAuditEvents Mode C stream before a separately admitted typed consumer surface exists.
    condition: Whenever Desktop stream capabilities are exposed.
    failure: Keep Mode C unavailable rather than approximating its end-of-file protocol.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.streaming
  - id: rule.nimi.desktop.ai-consumption.r063
    kind: rule
    title: Operational status and explicit diagnostics stay non-authoritative
    modality: must
    statement: Desktop may consume Runtime bridge operational status and a user-explicit bounded Test Connector diagnostic while private or broad App message streams remain unavailable; no local LLM health, provider readiness, periodic probe, warm state, or diagnostic result establishes a binding, machine selection, route, admission, or execution prerequisite.
    condition: Whenever Desktop presents operational status, connector diagnostics, or a stream projection.
    failure: Reject a private or broad stream, public capability health lifecycle, and diagnostic-as-readiness or binding truth.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.streaming
  - id: rule.nimi.desktop.ai-consumption.r064
    kind: rule
    title: Long-lived subscription cancellation is a disconnect
    modality: must
    statement: A directly admitted Mode D consumer treats server CANCELLED during daemon stop or resource loss as normal disconnection, never as successful data completion, and rebuilds only by an explicit Desktop policy or after runtime.connected rather than hidden SDK continuation.
    condition: Whenever a long-lived subscription stream is directly consumed.
    failure: Clean up and expose disconnected state until an admitted resubscription policy runs.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.streaming
  - id: rule.nimi.desktop.ai-consumption.r065
    kind: rule
    title: Backpressure closure stays interrupted
    modality: must
    statement: RESOURCE_EXHAUSTED or non-user CANCELLED preserves partial content, marks the stream interrupted, retains traceId, and offers explicit retry without replaying non-idempotent execution; only long-lived subscription streams may rebuild under their admitted policy.
    condition: Whenever Runtime closes a stream because its server queue exceeds budget.
    failure: Reject completed status, lost trace, cleared output, or automatic execution replay.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.streaming
  - id: rule.nimi.desktop.ai-consumption.r066
    kind: rule
    title: ScenarioJob disconnect recovery is bounded
    modality: must
    statement: After ScenarioJob subscription loss, Desktop polls GetScenarioJob every 2 seconds for at most 30 attempts and 60 seconds, stops on a typed terminal state, shows reconnecting during recovery, and shows unknown status after the bound expires.
    condition: Whenever an observable ScenarioJob loses its event stream before terminal state.
    failure: Stop bounded polling without inventing terminal state or replaying the job.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.streaming
  - id: rule.nimi.desktop.ai-consumption.r067
    kind: rule
    title: ScenarioJob cancellation is asynchronous acknowledgement
    modality: must
    statement: CancelScenarioJob success means only that cancellation was accepted, Desktop shows canceling until a CANCELED terminal event, a non-cancellable result remains a typed failure, and GetScenarioArtifacts is called only after COMPLETED.
    condition: Whenever a user cancels or fetches results for a ScenarioJob.
    failure: Reject immediate canceled or completed success without the corresponding terminal state.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.streaming
  - id: rule.nimi.desktop.ai-consumption.r068
    kind: rule
    title: Job observability survives connector deletion
    modality: must
    statement: Desktop continues to show Job metadata and event history after the Job's captured current-account Connector or underlying custody record is deleted or invalidated, never rewrites the captured implementation, provider-model target, private custody reference, request, or completed result from current configuration, and projects an actual authorization rejection during execution as FAILED with the typed provider-authentication reason.
    condition: Whenever Connector or custody state changes while a Job remains observable or executing.
    failure: Reject disappearance of job history and do not report credential failure as cancellation or completion.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.streaming
  - id: rule.nimi.desktop.ai-consumption.r069
    kind: rule
    title: PresentationTimeline requires typed Runtime projection
    modality: must
    statement: Desktop consumes PresentationTimeline only after Runtime and SDK expose a typed projection, aligns rendering only to Runtime timing, and preserves Runtime-issued LocalAgent, Conversation, turn, and stream continuity references in Avatar handoff and diagnostics.
    condition: Whenever a stream carries presentation timeline metadata.
    failure: Keep timeline behavior unavailable or diagnostic-only until the typed projection and linkage are complete.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.streaming
  - id: rule.nimi.desktop.ai-consumption.r070
    kind: rule
    title: Timeline cancellation and proof remain owner-bounded
    modality: must_not
    statement: Desktop leaves voice, lipsync, or Avatar motion running after Runtime stream interrupt, bypasses typed timeline projection through broad events or app-local namespaces, or treats renderer-only evidence as Avatar speak or lipsync proof.
    condition: Whenever timeline-bearing presentation is canceled, handed off, or verified.
    failure: Stop dependent presentation on Runtime interrupt and require Avatar-owned render proof.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.streaming
  - id: rule.nimi.desktop.ai-consumption.r071
    kind: rule
    title: Interactive profile apply is non-committing prefill
    modality: must
    statement: Desktop interactive Profile Apply produces editable portable prefill and may display its changes without a confirmation gate, never invokes or queues a commit, and leaves exact current-environment resource choice to the ordinary AIConfig editor; the user's later single Save invokes only the canonical whole-object compare-and-swap overwrite.
    condition: Whenever a user applies an AIProfile through the ordinary Desktop UI or saves the resulting AIConfig.
    failure: Reject Profile Apply as commit authority, guessed resource references, a second confirmation or approval gate, and any Save path outside the canonical owner revision overwrite.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.ai-consumption.profile-config
