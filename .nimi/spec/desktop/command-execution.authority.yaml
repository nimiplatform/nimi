format: nimicoding.authority/v2
owner: team.desktop
scope: desktop.command-execution
units:
  - id: definition.nimi.desktop.command-execution.ui-sync
    kind: definition
    title: Desktop ui_sync execution class
    meaning: ui_sync is a Desktop registered-command execution class for pure in-memory or constant configuration reads only, with no reachable I/O, process, network, dialog, lock wait, recursive walk, hashing, archive, socket, sleep, raw thread, spawn_blocking, or block_on work.
  - id: definition.nimi.desktop.command-execution.request-response-async
    kind: definition
    title: Desktop request_response_async execution class
    meaning: request_response_async is a Desktop registered-command execution class for async request and response work whose network, Runtime bridge unary or stream, daemon status, and package-owned bridge operations remain async-aware and never hide synchronous blocking work as success.
  - id: definition.nimi.desktop.command-execution.background-job
    kind: definition
    title: Desktop background_job execution class
    meaning: background_job is a Desktop registered-command execution class for long-running transfer, install, archive, copy, import, hash, scan, migration, rebuild, or bulk mutation that returns an accepted job and progress contract or an equivalent admitted background handoff with command-family ownership of cancellation, progress, failure, and rollback semantics.
  - id: definition.nimi.desktop.command-execution.bounded-blocking-with-admission
    kind: definition
    title: Desktop bounded_blocking_with_admission execution class
    meaning: bounded_blocking_with_admission is a Desktop registered-command execution class for explicitly admitted small synchronous work with a named risk family, owner, and bound, limited to native UI handoff, one-shot local store reads or writes, small fixture reads, and user-triggered operating-system actions.
  - id: definition.nimi.desktop.command-execution.registered-disabled-stub
    kind: definition
    title: Desktop registered_disabled_stub execution class
    meaning: registered_disabled_stub is a Desktop registered-command execution class for a registered command that intentionally returns a fail-closed error with no active side effect; it grants no risk waiver and requires reclassification before re-enabling.
  - id: definition.nimi.desktop.command-execution.risk-catalog
    kind: definition
    title: Desktop command blocking risk catalog
    meaning: The Desktop command blocking risk families are blocking_http, sync_dns_or_connect, runtime_bridge_block_on, block_on_variants, process_command, archive_or_compression, sqlite_sync, std_fs, native_dialog, thread_sleep, raw_thread_spawn, spawn_blocking, sync_lock_contention, cpu_hash_or_codec, sync_socket_bind, os_browser_handoff, window_handoff, and sync_keyring_dialog.
  - id: definition.nimi.desktop.command-execution.registered-surface
    kind: definition
    title: Desktop Electron registered IPC surface
    meaning: The Desktop registered IPC surface is the host-owned command handler map supplied to registerNimiElectronRuntimeBridge by apps/desktop/src-electron/main.ts, including admitted Kit Electron standard shell and Runtime bridge commands plus app-domain handlers implemented under apps/desktop/src-electron and kit/shell/electron/src.
  - id: rule.nimi.desktop.command-execution.r001
    kind: rule
    title: Every registered command has exactly one execution class
    modality: must
    statement: Every command in the Desktop registered invoke surface belongs to exactly one admitted execution class.
    condition: Whenever a command is registered through the Desktop invoke surface.
    failure: Reject the registered surface while any command has no execution class or matches more than one execution class.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.command-execution.background-job
      - type: applies_to
        target: definition.nimi.desktop.command-execution.bounded-blocking-with-admission
      - type: applies_to
        target: definition.nimi.desktop.command-execution.registered-disabled-stub
      - type: applies_to
        target: definition.nimi.desktop.command-execution.registered-surface
      - type: applies_to
        target: definition.nimi.desktop.command-execution.request-response-async
      - type: applies_to
        target: definition.nimi.desktop.command-execution.ui-sync
  - id: rule.nimi.desktop.command-execution.r002
    kind: rule
    title: Registered command behavior conforms to its execution class
    modality: must
    statement: Every registered Desktop command satisfies the complete meaning of its assigned execution class.
    condition: Whenever registered-command behavior is implemented, changed, or evaluated.
    failure: Reject the command classification until the implementation conforms to its assigned execution class.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.command-execution.background-job
      - type: applies_to
        target: definition.nimi.desktop.command-execution.bounded-blocking-with-admission
      - type: applies_to
        target: definition.nimi.desktop.command-execution.registered-disabled-stub
      - type: applies_to
        target: definition.nimi.desktop.command-execution.request-response-async
      - type: applies_to
        target: definition.nimi.desktop.command-execution.ui-sync
  - id: rule.nimi.desktop.command-execution.r003
    kind: rule
    title: Synchronous blocking requires bounded admission
    modality: must
    statement: A registered command that performs synchronous blocking work on the Electron IPC execution path uses bounded_blocking_with_admission with a cataloged risk family, explicit owner, and explicit bound.
    condition: Whenever synchronous blocking work is reachable from a registered command on the Electron IPC execution path.
    failure: Reject the command until blocking is removed from the IPC path or the command receives complete bounded blocking admission.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.command-execution.bounded-blocking-with-admission
      - type: applies_to
        target: definition.nimi.desktop.command-execution.registered-surface
      - type: applies_to
        target: definition.nimi.desktop.command-execution.risk-catalog
  - id: rule.nimi.desktop.command-execution.r004
    kind: rule
    title: Async syntax and wrappers do not prove responsiveness
    modality: must_not
    statement: An async function signature or a spawn_blocking wrapper is treated as sufficient evidence of command responsiveness or as a final execution model without background_job or bounded_blocking_with_admission classification and explicit ownership and observability.
    condition: Whenever registered-command responsiveness or execution classification is evaluated.
    failure: Reject the claimed classification and require behavior-level execution evidence.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.command-execution.background-job
      - type: applies_to
        target: definition.nimi.desktop.command-execution.bounded-blocking-with-admission
      - type: applies_to
        target: definition.nimi.desktop.command-execution.request-response-async
  - id: rule.nimi.desktop.command-execution.r005
    kind: rule
    title: Electron IPC registration and dispatch fail closed
    modality: must
    statement: Desktop installs one explicit Electron IPC handler through the Kit bridge, dispatches only registered standard-shell, Runtime, or app-domain command keys, and unregisters that handler during completed shutdown.
    condition: Whenever the Desktop Electron IPC surface is registered, invoked, or shut down.
    failure: Reject unknown command keys and renderer invocations that do not resolve through the registered Electron host surface.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.command-execution.registered-surface
  - id: rule.nimi.desktop.command-execution.r006
    kind: rule
    title: Package-owned commands remain first-class Desktop surface
    modality: must
    statement: Registered package-owned command families, including oauth_, runtime_bridge_, log_renderer_event, open_external_url, and shared runtime_defaults implementations, receive the same definition resolution, execution classification, and risk admission as app-local commands.
    condition: Whenever a package-owned command is registered by the Desktop host.
    failure: Reject any registered package-owned command treated as unscannable or outside Desktop execution classification.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.command-execution.registered-surface
      - type: applies_to
        target: definition.nimi.desktop.command-execution.risk-catalog
  - id: rule.nimi.desktop.command-execution.r007
    kind: rule
    title: Cataloged risks require explicit admission
    modality: must_not
    statement: New command code touches a cataloged blocking risk source without an execution classification and explicit admission for that risk family.
    condition: Whenever new or changed command code reaches a cataloged risk source.
    failure: Reject the command change until both execution classification and explicit risk admission are present.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.command-execution.registered-surface
      - type: applies_to
        target: definition.nimi.desktop.command-execution.risk-catalog
