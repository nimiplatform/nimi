format: nimicoding.authority/v2
owner: team.desktop
scope: desktop.bridge-ipc
units:
  - id: definition.nimi.desktop.bridge-ipc.transport-plane
    kind: definition
    title: Desktop renderer-to-host bridge plane
    meaning: The Desktop bridge is a bounded typed renderer-to-native-host carriage surface with defensive input validation, explicit failure, and no authority of its own.
  - id: definition.nimi.desktop.bridge-ipc.command-registration-plane
    kind: definition
    title: Desktop host capability plane
    meaning: The host capability plane exposes only purpose-specific Nimi Home and shell-native operations owned by the verified host, SDK, Kit, Runtime, Realm, installer, or operating system.
  - id: definition.nimi.desktop.bridge-ipc.event-stream-plane
    kind: definition
    title: Desktop bridge event plane
    meaning: The bridge event plane projects typed host and owner events to renderer consumers without becoming durable state, replay authority, account truth, or product event ownership.
  - id: definition.nimi.desktop.bridge-ipc.runtime-defaults
    kind: definition
    title: Desktop shell hints projection
    meaning: Shell hints are non-security presentation defaults and never Runtime, Realm, account, credential, route, endpoint, executable, service, trust, authorization, or configuration authority.
  - id: definition.nimi.desktop.bridge-ipc.protected-account-carrier
    kind: definition
    title: Protected Home host carrier
    meaning: The protected Home host carrier is established and held by the verified native host; Runtime derives the current caller, App, process, account, session, and authorization rather than accepting renderer claims.
  - id: definition.nimi.desktop.bridge-ipc.runtime-service-control-plane
    kind: definition
    title: Runtime service-control projection
    meaning: Runtime service control is a bounded protected host capability for truthful status and owner-admitted lifecycle intent, distinct from Runtime AI, provider, App, and product readiness.
  - id: definition.nimi.desktop.bridge-ipc.shell-network-helper
    kind: definition
    title: Desktop public shell fetch plane
    meaning: The public shell fetch plane is bounded to unauthenticated shell content and carries no Runtime, Realm, provider, account, connector, token, cookie, or credential authority.
  - id: definition.nimi.desktop.bridge-ipc.invoke-infrastructure
    kind: definition
    title: Desktop bridge invocation infrastructure
    meaning: Shared invocation infrastructure performs defensive validation, correlation, cancellation, and typed error normalization without defining product methods or owner truth.
  - id: definition.nimi.desktop.bridge-ipc.sdk-typed-runtime-path
    kind: definition
    title: SDK typed product path
    meaning: Product logic uses standard typed SDK and demand-driven Kit surfaces; the bridge carries only host-required calls and never becomes a generic Runtime or Realm facade.
  - id: definition.nimi.desktop.bridge-ipc.shell-native-helper-plane
    kind: definition
    title: Desktop shell-native helper plane
    meaning: Shell-native helpers provide bounded browser, callback, picker, reveal, notification, window, dialog, and similar host-local operations without owning application, Runtime, Realm, or security truth.
  - id: rule.nimi.desktop.bridge-ipc.r001
    kind: rule
    title: The bridge is typed and bounded
    modality: must
    statement: Every renderer-to-host operation has a purpose-specific typed request, typed result, explicit owner, and fail-closed validation.
    condition: Whenever a bridge command or event is exposed.
    failure: Reject untyped payloads, generic forwarding, and ambiguous ownership.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.bridge-ipc.transport-plane
  - id: rule.nimi.desktop.bridge-ipc.r002
    kind: rule
    title: Renderer input never establishes authority
    modality: must_not
    statement: App id, accountId, subject, caller kind, host role, endpoint, session, permission, grant, executable path, renderer metadata, or a request field establishes protected origin or owner authorization.
    condition: Whenever the native host receives renderer input.
    failure: Derive protected identity and authorization from the verified host and Runtime session or reject the request.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.bridge-ipc.protected-account-carrier
  - id: rule.nimi.desktop.bridge-ipc.r003
    kind: rule
    title: The bridge exposes no generic product proxy
    modality: must_not
    statement: The bridge accepts a method id, service name, raw bytes, arbitrary URL, arbitrary filesystem path, bearer metadata, or generic request object to invoke Runtime, Realm, provider, installer, or operating-system behavior.
    condition: Whenever renderer code requests product or host behavior.
    failure: Use an admitted typed SDK, Kit, or purpose-specific host capability.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.bridge-ipc.command-registration-plane
  - id: rule.nimi.desktop.bridge-ipc.r004
    kind: rule
    title: Protected carrier material stays host private
    modality: must_not
    statement: Renderer or App code receives protected endpoints, process proof, session proof, service identity, Realm JWT, Provider Credential, account principal, authorization decision, or host security material.
    condition: Whenever the protected carrier is opened or used.
    failure: Keep material inside the verified native host and expose only bounded typed results.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.bridge-ipc.protected-account-carrier
  - id: rule.nimi.desktop.bridge-ipc.r005
    kind: rule
    title: Account UX consumes Runtime projection
    modality: must
    statement: Desktop account UX sends typed user intent and renders Runtime-owned status, login, logout, switch, permission, presence, and failure projection without storing or reconstructing account or authorization truth.
    condition: Whenever account UX uses the bridge.
    failure: Reject renderer-owned account state and raw credential handling.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.bridge-ipc.protected-account-carrier
  - id: rule.nimi.desktop.bridge-ipc.r006
    kind: rule
    title: Scaffolded Local Apps use host-injected SDK access
    modality: must
    statement: A Desktop-hosted App Tools scaffolded Local App receives standard SDK access through its verified host session and never obtains Realm JWT, Provider Credential, Runtime proof, account identity, or generic bridge access.
    condition: Whenever the Desktop host launches or serves a scaffolded Local App.
    failure: Fail closed when the verified App session or owner authorization is unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.bridge-ipc.sdk-typed-runtime-path
  - id: rule.nimi.desktop.bridge-ipc.r007
    kind: rule
    title: Direct SDK authentication stays outside the bridge
    modality: must
    statement: A direct SDK consumer may use standard Realm Auth and maintain its own Realm token, but Desktop bridge APIs do not accept or project that direct token path into a scaffolded Local App.
    condition: Whenever direct and scaffolded SDK contexts are composed.
    failure: Reject direct bearer carriage through the Desktop bridge.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.bridge-ipc.sdk-typed-runtime-path
  - id: rule.nimi.desktop.bridge-ipc.r008
    kind: rule
    title: Product logic stays on SDK and Kit
    modality: must
    statement: Realm, Runtime, Character, LocalAgent, Conversation, Memory, Knowledge, AI, App, and permission product logic uses standard SDK and demand-driven Kit surfaces; the bridge supplies only native carriage required by the current host.
    condition: Whenever Desktop product logic needs an owner capability.
    failure: Reject a Desktop-only product API or bridge-owned domain behavior.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.bridge-ipc.sdk-typed-runtime-path
  - id: rule.nimi.desktop.bridge-ipc.r009
    kind: rule
    title: Service control is protected and observational
    modality: must
    statement: Runtime status, start, restart, repair, and update intent use the bounded protected host boundary, and UI reports success only after observing the requested verified service state.
    condition: Whenever Desktop requests or presents Runtime service state.
    failure: Reject renderer service control, direct stop, executable selection, and acknowledgement-only success.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.bridge-ipc.runtime-service-control-plane
  - id: rule.nimi.desktop.bridge-ipc.r010
    kind: rule
    title: Runtime service lifetime is not Desktop lifetime
    modality: must_not
    statement: Closing Desktop stops Runtime, Desktop directly owns the service process, or a renderer selects the Runtime binary or service identity.
    condition: Whenever Desktop or Runtime starts or exits.
    failure: Preserve the independent trusted Runtime service lifecycle.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.bridge-ipc.runtime-service-control-plane
  - id: rule.nimi.desktop.bridge-ipc.r011
    kind: rule
    title: Host events are projections only
    modality: must
    statement: Bridge events preserve typed source, ordering, lifecycle, cancellation, and failure state but never become account, App, Runtime, Realm, LocalAgent, Conversation, update, or permission truth.
    condition: Whenever the host emits or the renderer consumes an event.
    failure: Re-read the owning state before an authoritative decision.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.bridge-ipc.event-stream-plane
  - id: rule.nimi.desktop.bridge-ipc.r012
    kind: rule
    title: Stale streams close
    modality: must
    statement: Process replacement, account switch, Runtime restart, authorization revoke, host disconnect, or owner cancellation closes affected bridge streams and requires fresh owner state.
    condition: Whenever a stream dependency changes.
    failure: Reject events from the stale stream and do not synthesize replay.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.bridge-ipc.event-stream-plane
  - id: rule.nimi.desktop.bridge-ipc.r013
    kind: rule
    title: Shell defaults are non-security hints
    modality: must
    statement: Shell defaults may influence presentation only and never select Runtime, Realm, endpoint, route, model, account, credential, service, trust, permission, or executable authority.
    condition: Whenever shell defaults are parsed or applied.
    failure: Ignore the hint as authority and require owner projection.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.bridge-ipc.runtime-defaults
  - id: rule.nimi.desktop.bridge-ipc.r014
    kind: rule
    title: Shell-native helpers stay purpose specific
    modality: must
    statement: Browser, callback, picker, reveal, notification, window, dialog, and similar helpers validate bounded inputs and never become arbitrary command, filesystem, network, or product-domain proxies.
    condition: Whenever a shell-native helper is exposed.
    failure: Reject inputs outside the helper's declared host purpose.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.bridge-ipc.shell-native-helper-plane
  - id: rule.nimi.desktop.bridge-ipc.r015
    kind: rule
    title: Public shell fetch carries no credentials
    modality: must_not
    statement: The public shell fetch path carries cookies, authorization, Realm or Runtime calls, Provider Credentials, connector secrets, AI route state, or protected local operations.
    condition: Whenever Desktop performs a public shell fetch.
    failure: Reject the request or use the standard owner path.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.bridge-ipc.shell-network-helper
  - id: rule.nimi.desktop.bridge-ipc.r016
    kind: rule
    title: Errors remain typed and scrubbed
    modality: must
    statement: Bridge failures preserve owner category and actionable state while removing credentials, protected paths, session material, process proof, and other authority-bearing diagnostics from renderer-visible output.
    condition: Whenever a native or owner operation fails.
    failure: Return a typed scrubbed error without local success fallback.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.bridge-ipc.invoke-infrastructure
  - id: rule.nimi.desktop.bridge-ipc.r017
    kind: rule
    title: Missing native capability fails closed
    modality: must
    statement: A missing host capability, protected carrier, Runtime owner operation, authorization, or valid result produces typed unavailable or failure rather than a silent skip, empty success, fixture, or browser fallback.
    condition: Whenever a bridge dependency is missing.
    failure: Return the typed failure before product mutation.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.bridge-ipc.invoke-infrastructure
  - id: rule.nimi.desktop.bridge-ipc.r018
    kind: rule
    title: Avatar remains an independent projection
    modality: must_not
    statement: The Desktop bridge exposes a third-party Avatar driver, embedded renderer, raw motion API, App-owned Avatar execution, or LocalAgent truth surface.
    condition: Whenever Avatar-related bridge capability is proposed.
    failure: Preserve Runtime LocalAgent projection and Avatar-owned rendering boundaries.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.bridge-ipc.sdk-typed-runtime-path
  - id: rule.nimi.desktop.bridge-ipc.r019
    kind: rule
    title: Host mechanism is not product ontology
    modality: must_not
    statement: A Tauri command name, Electron channel, transport class, operating-system object, service-manager primitive, fixed framing length, or concrete Runtime method list becomes cross-layer product authority.
    condition: Whenever bridge or host semantics are documented.
    failure: Keep only the product outcome and owner boundary in authority.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.bridge-ipc.transport-plane
  - id: rule.nimi.desktop.bridge-ipc.r020
    kind: rule
    title: Desktop implementation does not make the Host Contract exclusive
    modality: must_not
    statement: A capability is defined as valid only because the current Desktop implementation or bridge command provides it when another qualified Home host could satisfy the same public contract.
    condition: Whenever a Nimi Home host capability is specified.
    failure: Define the product behavior at the replaceable Home Host Contract and keep Desktop as one implementation.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.bridge-ipc.command-registration-plane
