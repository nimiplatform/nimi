format: nimicoding.authority/v2
owner: team.desktop
scope: desktop.product-surfaces
units:
  - id: definition.nimi.desktop.product-surfaces.creator-world-preview
    kind: definition
    lifecycle: removed
    title: Creator world-character trial
    reason: World Studio authoring and acceptance maintain Realm World and WorldCharacter settings only; the creator-specific Desktop trial surface is withdrawn without changing ordinary Desktop Explore or Agent operations.
  - id: rule.nimi.desktop.product-surfaces.creator-world-preview
    kind: rule
    lifecycle: removed
    title: Saved source versions drive real creator trials
    reason: World Studio authoring and acceptance maintain Realm World and WorldCharacter settings only; the creator-specific Desktop trial surface is withdrawn without changing ordinary Desktop Explore or Agent operations.
  - id: definition.nimi.desktop.product-surfaces.explore
    kind: definition
    title: Desktop Explore product surface
    meaning: Desktop Explore is the ordinary Realm discovery surface for admitted Worlds, PersonaCharacter sources and World-bound WorldCharacter sources; Realm public-activity feed and publishing are deferred for the current launch. It owns no Realm, source, Runtime, LocalAgent or AI-execution truth.
  - id: definition.nimi.desktop.product-surfaces.home-feed
    kind: definition
    title: Desktop activity feed
    meaning: Realm public-activity feed is deferred for the current Desktop launch and has no mounted reader, publishing affordance or navigation destination; its historical records do not admit an executable Desktop surface.
  - id: definition.nimi.desktop.product-surfaces.support
    kind: definition
    title: Desktop Support product surface
    meaning: Home support presents owner-governed troubleshooting and local log export within normal Settings, with independently mounted recovery content when ordinary Home is unavailable. It owns no readiness, account, Runtime, storage, diagnostic or repair truth and does not absorb AI Capabilities, Cloud Services, integrations, App configuration or the cross-App Agent Center.
  - id: definition.nimi.desktop.product-surfaces.data-root-management
    kind: definition
    title: Desktop data-root management surface
    meaning: Desktop data-root management is the Settings-owned presentation for the current Product Control data root, user-explicit replacement, automatic and manual owner-aware Check and Sync status, typed owner repair actions, and lifecycle handoff state, plus the startup recovery page's maintenance replacement while Runtime refuses its stored data, without owning Product Control, Runtime, cognition, owner storage, data movement, or readiness truth.
  - id: definition.nimi.desktop.product-surfaces.relationship-profile
    kind: definition
    title: Desktop contextual relationship and profile surface
    meaning: Desktop relationship and profile UX is a contextual composition consumed by Home, Chat, Explore, Profile, notifications, World detail, source detail, and local materialization flows rather than a standalone primary product surface; Human UserProfile, Character Source profile, and Runtime LocalAgent presentation remain explicit typed subjects whose visual primitives may be shared without merging identity, truth, data models, caches, or action authority.
  - id: rule.nimi.desktop.product-surfaces.r001
    kind: rule
    title: Explore is the unified Realm discovery surface
    modality: must
    statement: Explore is the single ordinary Desktop surface for discovering admitted Realm Worlds and PersonaCharacters. World is folded into Explore, Apps retains App discovery, and WorldCharacter discovery uses World detail and source detail. Realm public activity, publishing and social search or recommendation are deferred and have no ordinary entry.
    condition: Whenever Desktop exposes ordinary Realm discovery or constructs its ordinary navigation destinations.
    failure: Reject a standalone World destination, App discovery in Explore, a fourth Explore section, or another ordinary Realm discovery owner.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.explore
  - id: rule.nimi.desktop.product-surfaces.r002
    kind: rule
    title: Explore sections are closed
    modality: must
    statement: Explore has exactly Worlds for admitted WorldCore browsing and World detail entry and Personas for PersonaCharacter discovery across Worlds. Their meanings remain distinct; the deferred Realm Activity feed is not a third section.
    condition: Whenever Desktop configures, renders, labels, or selects an Explore section.
    failure: Reject a missing, additional, renamed, reordered in meaning, or undifferentiated Explore section projection.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.explore
  - id: rule.nimi.desktop.product-surfaces.r003
    kind: rule
    title: World cards consume a closed typed fact set
    modality: must
    statement: Explore World cards present only name, visual, lineage or world type, tagline or summary, meaningful era or current-time label, sourceSignal such as persona or world-character count, activitySignal, and status from WorldCore or its typed World projection; absent optional fields shrink, and old payloads, prompt or lore fields, invented counts, placeholder eras, and local world facts are never card truth.
    condition: Whenever Explore builds a World card.
    failure: Omit an unavailable optional field and reject any untyped, guessed, placeholder, legacy, prompt-derived, or lore-derived World fact.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.explore
  - id: rule.nimi.desktop.product-surfaces.r004
    kind: rule
    title: World detail presents bounded typed product facts
    modality: must
    statement: World detail presents WorldCore overview, semantic or world summary, scenes, locations and entry points, WorldCharacter or PersonaCharacter sources with typed source-detail routing, and useful governance or status only when corresponding typed data exists; Realm people discovery does not depend on Runtime LocalAgent inventory, source detail owns materialization and partner actions, Desktop shell authority retains ordering and responsive layout, and ordinary Explore exposes no Desktop-local source creation entry.
    condition: Whenever Explore opens or composes World detail.
    failure: Shrink sections lacking typed data and reject untyped facts, product-surface-owned layout authority, or ordinary Explore authoring controls.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.explore
  - id: rule.nimi.desktop.product-surfaces.r005
    kind: rule
    title: Character and persona source cards are source-typed
    modality: must
    statement: PersonaCharacter and WorldCharacter source cards present only displayName or avatar, worldOrigin, sourceKind and supplied role or category, concept or short description, supplied traits or topics, and supplied Realm activitySignal; World people discovery offers View character through canonical source-detail routing without LocalAgent-dependent grouping or actions, while surfaces that expose materialization or partner actions derive sourceState only from typed core source data plus bounded Runtime or SDK LocalAgentSourceContextStatus and opaque local-agent inventory or provenance projection, with unknown or partial status unavailable; Personas enter through Personas and WorldCharacters through World detail and source detail.
    condition: Whenever Explore renders or routes a PersonaCharacter or WorldCharacter source card.
    failure: Reject local or guessed source state, a new Explore source section, relationship or quota state as source truth, bare-source chat, and local conversation readiness as PersonaCharacter truth.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.explore
  - id: rule.nimi.desktop.product-surfaces.r006
    kind: rule
    title: Source state determines the primary action
    modality: must
    statement: "The source-generic primary action follows exact owner state: materialization_available offers Become my partner through MaterializeRealmSource with CharacterSourceRefV3 and fresh requestId; sign_in_required, source_not_ready, source_access_denied, materializing and runtime_unavailable remain disabled with their exact reasons; materialization_error remains unavailable with its bounded Runtime reason. On an explicit Open partner action, local_agent_available resolves the uniquely matching current-account owner-projected LocalAgent through the read-only Desktop ResolveDesktopAgentReference operation, then opens only its returned current-session agentHandle through canonical Conversation open. A missing, stale, denied or ambiguous target creates no Conversation; local_agent_ambiguous retains Open from partners and the canonical reference-list selection path. An explicit secondary Create another partner action may issue one fresh-requestId materialization for the current canonical source even when existing partners match; it explains that the current setting creates an independent new partner while existing partners and conversations remain, verifies the returned new LocalAgent in current Runtime inventory and provenance without requiring a unique source match, and preserves canonical reference-list selection for multiple instances; a source detail may distinguish current owner-projected instances by their captured creation time, and an explicit instance selection is revalidated for the same current account and canonical source before ResolveDesktopAgentReference and Conversation open. Materialization alone does not open a Conversation. Desktop receives only bounded LocalAgentSourceContextStatus and owner projections, never source snapshot, Packet, proof, raw diagnostics, prompt, context or caller-selected audience."
    condition: Whenever Desktop derives or performs a WorldCharacter or PersonaCharacter primary action, explicit secondary materialization, or instance selection from source state.
    failure: Reject unknown or partial state, disable ineligible or concurrently repeated actions, and never acquire Packets, synthesize identity, present Create LocalAgent language, select an arbitrary matching Agent, use source identity or raw localAgentRef as an App handle, open before exact Runtime revalidation, or report materialization success without Runtime inventory and provenance.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.explore
  - id: rule.nimi.desktop.product-surfaces.r007
    kind: rule
    title: Source materialization is a bounded Runtime handoff
    modality: must
    statement: Explore source selection may emit only a local materialization handoff containing exactly canonical CharacterSourceRefV3 and bounded requestId; Runtime owns current account and bearer resolution, challenge, Packet v3 acquisition and strict validation, LocalAgentSourceSnapshotV2, v3 provenance, atomic LocalAgent creation, and Runtime-local deletion or reset, while source removal never deletes LocalAgent state.
    condition: Whenever a user chooses to materialize a WorldCharacter or PersonaCharacter source.
    failure: Reject a relationship mutation, durable Realm connection, packet DTO, caller-selected audience, prompt or context, source write-back, renderer-created LocalAgent, cached-card readiness inference, or replacement of Runtime identity and authority.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.explore
  - id: rule.nimi.desktop.product-surfaces.r008
    kind: rule
    title: Explore has no source authoring entry
    modality: must_not
    statement: Explore creates, imports, generates, reviews, publishes, audits, parses, or writes PersonaCharacter or WorldCharacter sources or acts as a source authoring workbench.
    condition: Whenever Explore presents or handles source content or a creator action.
    failure: Reject the operation or route a separately admitted typed external studio or forge action that returns only after the owning surface writes core truth.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.explore
  - id: rule.nimi.desktop.product-surfaces.r009
    kind: rule
    title: Explore defines no persona draft schema
    modality: must_not
    statement: Explore defines or retains a local minimum field schema or parallel draft schema for persona creation that can be mistaken for Realm core truth.
    condition: Whenever Explore consumes or presents pre-acceptance persona data.
    failure: Reject the schema and consume only Realm core or creator-owned typed projections.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.explore
  - id: rule.nimi.desktop.product-surfaces.r010
    kind: rule
    title: Explore writes no draft truth
    modality: must_not
    statement: Explore submits pre-acceptance source data as Realm truth, projects import or generation candidates as accepted source records, or presents generic success for a source write it does not own.
    condition: Whenever Explore displays or hands off source data before Realm acceptance.
    failure: Keep the data display-only or handoff-only and reject any unowned write or success projection.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.explore
  - id: rule.nimi.desktop.product-surfaces.r011
    kind: rule
    title: Invalid Explore data fails closed
    modality: must
    statement: Missing or invalid typed Explore fields produce a typed unavailable or failed state or shrink only the affected optional surface; unknown or partial LocalAgentSourceContextStatus schema, enum, state, source kind, reason, or coverage is never materialization-ready or local-agent-ready.
    condition: Whenever Explore receives missing, invalid, unknown, unsupported, or partial data.
    failure: Reject guessed names, counts, Worlds, avatars, activity, coerced source fields, local materialization truth, and any success or readiness inferred from invalid data.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.explore
  - id: rule.nimi.desktop.product-surfaces.r012
    kind: rule
    title: Explore consumes source governance only
    modality: must
    statement: Explore consumes World policy, source visibility, account capability, moderation, quota, and audit outcomes only through admitted typed projections, receives no raw source or World snapshot, packet, proof, prompt, lane, memory, or context authority, and treats bounded status as presentation input only.
    condition: Whenever Explore projects or enforces source governance state.
    failure: Reject renderer-local mutation, policy bypass, visibility bypass, moderation bypass, quota bypass, audit bypass, or promotion of bounded presentation status into source authority.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.explore
  - id: rule.nimi.desktop.product-surfaces.r013
    kind: rule
    title: World creation is not ordinary Explore behavior
    modality: must_not
    statement: An ordinary Explore section exposes free World creation or local source creation as a Desktop discovery action.
    condition: Whenever Explore builds an ordinary user action or section.
    failure: Reject the action and retain World and source creation in a controlled admitted creator or studio path.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.explore
  - id: rule.nimi.desktop.product-surfaces.r014
    kind: rule
    title: Explore Open targets are closed
    modality: must
    statement: Explore Open accepts exactly worlds with optional discover-worlds and personas with optional discover-personas or select-partner. Activity and view-activity are not admitted in the current launch. WorldCharacter materialization remains behind selected World detail and source detail and adds no section or productIntent pair.
    condition: Whenever Desktop applies an Explore Open Intent section and productIntent pairing.
    failure: Reject an invalid pairing as desktop-open-target-unsupported and never create WorldCore, PersonaCharacter, Packet v3, or LocalAgent truth while opening Explore.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.explore
  - id: rule.nimi.desktop.product-surfaces.r015
    kind: rule
    title: Home presents the personal AI overview
    modality: must
    statement: Home presents quick start or continue-use actions, current machine AI preparation and Runtime availability, and one Messages column that previews pending items and recent messages from App and Runtime Agent activity, download progress, unresolved setup failures and available App updates, in one bounded timeline ordered by owner fact time newest first with unknown times last. The column header holds a compact Pending filter with the loaded pending count, View all messages to the Home Message center, and a filter control for message and item types and all, unread and pending states with an explicit clear action. Only consecutive same-source, same-type activity within a short time window may collapse together; pending or download status never overrides Home chronology. Activity has no separate bottom preview section; message settings remain accessible while the deferred Realm feed and Create Post surface have no entry. Optional usage, cost and Agent activity appear only with trustworthy scoped data; missing data is not zero and raw maintenance panels are not embedded as the overview.
    condition: Whenever Desktop renders or routes the Home primary-navigation tab.
    failure: Keep independent sections and message sources usable when a projection is unavailable, omit unsupported optional statistics, and preserve access to the Message center, existing use surfaces.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.home-overview
  - id: rule.nimi.desktop.product-surfaces.r016
    kind: rule
    title: Ordinary ready entry opens the Nimi overview
    modality: must
    statement: After canonical Product Control ready_for_use, ordinary first and return entry and the Nimi Logo open the Home overview; explicit App, Chat or other admitted direct-open intents retain their requested destination. Optional overview reads are independent of startup admission and do not block ordinary use.
    condition: Whenever Desktop selects the post-initialization ready destination.
    failure: Open the overview for ordinary entry, honor an explicit destination, and never revoke product readiness because optional overview data failed.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.home-overview
  - id: rule.nimi.desktop.product-surfaces.r017
    kind: rule
    title: Activity feed and Nimi Home do not overlap
    modality: must_not
    statement: The current Desktop launch mounts a Realm activity feed, Create Post affordance or equivalent publishing or feed navigation inside Nimi Home. Nimi Home overview, App and Runtime messages, direct human messaging and source catalogs retain their existing ownership.
    condition: Whenever Desktop composes, names, or assigns ownership to Home or Nimi Home.
    failure: Reject a deferred feed or publishing entry before any Realm call; never display an empty-success replacement.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.home-feed
  - id: rule.nimi.desktop.product-surfaces.r018
    kind: rule
    title: Activity feed scopes are closed
    modality: must_not
    statement: The current Desktop launch emits Realm feed, post, like, social search or recommendation calls through Home, Profile, Explore, offline replay or another renamed entry. World and Persona catalog filtering and precise human handle lookup remain admitted.
    condition: Whenever Desktop composes Realm consumers for the current launch.
    failure: Reject the deferred action and remove its active consumer without bypassing retained source, chat or account authorization.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.home-feed
  - id: rule.nimi.desktop.product-surfaces.r019
    kind: rule
    title: The activity feed provides a typed Create Post affordance
    modality: must
    statement: The activity feed provides a Create Post affordance and submits publication intent through the SDK-typed Realm path, while Realm retains author attribution, attachment envelope, worldId and visibility resolution, content moderation, and truth-write admission; Desktop supplies no client-authoritative authorId, postId, worldId, or contentRating.
    condition: Only after a later release explicitly re-admits the activity feed; it is deferred in the current launch. Whenever The activity feed presents or submits Create Post.
    failure: Present the typed fail-closed state for attachment, moderation, or Realm-write failure and reject client-owned identifiers, generic success, and synthetic success.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.home-feed
  - id: rule.nimi.desktop.product-surfaces.r020
    kind: rule
    title: Home consumes SDK-typed Realm feed projection
    modality: must
    statement: Activity feed reads and Create Post consume the SDK-typed Realm PostDto and FeedResponseDto path, and pagination consumes Realm cursor-paginated projection without renderer-direct Realm REST, shell-local Post or Feed truth, or placeholder Posts, attachments, counts, and success.
    condition: Only after a later release explicitly re-admits the activity feed; it is deferred in the current launch. Whenever the activity feed reads, paginates, or writes Realm feed content.
    failure: Fail closed or shrink the affected presentation when the typed projection is absent or failed and reject REST bypass, parallel truth, and fabricated content.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.home-feed
  - id: rule.nimi.desktop.product-surfaces.r021
    kind: rule
    title: Activity feed performs no AI execution
    modality: must_not
    statement: Activity feed carries AIConfig owner identity, CapabilityContract, prompt text, provider or model selection, Runtime turn payload, or Runtime AI execution on feed read or Create Post paths.
    condition: Only after a later release explicitly re-admits the activity feed; it is deferred in the current launch. Whenever The activity feed presents, reads, or publishes Realm social content.
    failure: Reject the AI payload or execution call and preserve the activity feed as a Realm social projection and publication surface only.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.home-feed
  - id: rule.nimi.desktop.product-surfaces.r022
    kind: rule
    title: Normal Home support shares the Settings workspace
    modality: must
    statement: Normal Home places personal preferences, account controls, data management, development, troubleshooting and log export in one grouped Settings workspace. Account, menu and tray support shortcuts open its exact troubleshooting or logs section, not a parallel ordinary Support page. About, legal documents, documentation and shortcut instructions belong to Help; AI Capabilities, Cloud Services, integrations, advanced Runtime management, App configuration, Chat and Agent Center retain their separate domain surfaces and existing owners.
    condition: Whenever Desktop registers, groups, or routes the Support surface.
    failure: Reject a second normal Support workspace, global Settings that absorbs ecosystem or Agent configuration, or a recovery path gated by ordinary Settings readiness.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.support
  - id: rule.nimi.desktop.product-surfaces.r023
    kind: rule
    title: Home Settings categories distinguish preferences and support
    modality: must
    statement: Home Settings groups appearance and language plus notifications as preferences; profile, privacy and account security as account controls; storage and Developer Mode as device management; and troubleshooting plus log export as support. Troubleshooting combines repair and recovery guidance with bounded technical information. Home content cache and regenerable standard App cache remain explicitly distinct in storage; owner-approved directory cleanup stays an advanced troubleshooting action. One implementation may serve normal and degraded hosts without creating another configuration owner. Search lists only these pages and their synonyms, never executes actions or promises unavailable controls.
    condition: Whenever Desktop configures, routes, or renders Support content.
    failure: Reject About and legal as Settings categories, conflated cleanup or notification scopes, a second configuration store, or a search that mutates settings.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.support
  - id: rule.nimi.desktop.product-surfaces.r024
    kind: rule
    title: Support repair delegates governed repair
    modality: must
    statement: Support repair presents and invokes governed owner flows for repair_required or blocked ~/.nimi configuration, broken current pointers without orphaning existing data, dependency repair, Runtime service repair, and typed owner repair actions surfaced by Check and Sync, while Product Control and each canonical owner retain pointer, lifecycle, owner-state, and repair truth; Support does not perform data-root replacement or data movement.
    condition: Whenever Support presents or triggers a repair operation.
    failure: Reject Support-local replacement, migration, pointer reconstruction, owner-state interpretation, or data movement and block destructive repair without the owner-projected impact and confirmation required by its policy.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.support
  - id: rule.nimi.desktop.product-surfaces.r025
    kind: rule
    lifecycle: removed
    title: Support updates consumes verified owner projections
    reason: Removed because the pre-release Electron Desktop has no authorized application-update product surface or update command path.
  - id: rule.nimi.desktop.product-surfaces.r026
    kind: rule
    title: Support diagnostics aggregates typed projections only
    modality: must
    statement: Support diagnostics aggregates daemon lifecycle, host capability profile, dependency job state, selected source record projection, and other technical diagnostics only through Runtime or SDK typed diagnostic projections and owns no diagnostic, log, or audit truth.
    condition: Whenever Support presents technical diagnostics.
    failure: Reject direct Runtime-internal reads, feature-local diagnostic truth, and an ordinary-user product path that depends on diagnostics.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.support
  - id: rule.nimi.desktop.product-surfaces.r027
    kind: rule
    title: Support logs exports a concrete artifact
    modality: must
    statement: Support logs provides log viewing and export, consumes the non-authoritative config/desktop-shell-ui-log-areas.yaml projection and the Runtime-product-support-owned logs directory under nimi_data, and produces a non-empty user-locatable export artifact without mutating or deleting retained logs.
    condition: Whenever Support views or exports logs.
    failure: Return a typed fail-closed export failure instead of an empty artifact or pseudo-success and reject Support-local retention, cleanup, mutation, or deletion.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.support
  - id: rule.nimi.desktop.product-surfaces.r028
    kind: rule
    title: Support recovery projects typed recovery guidance
    modality: must
    statement: Home troubleshooting presents the actual current recovery gate cause and allowed callbacks alongside typed Product Control record facts. Runtime maintenance, Home profile, formal-session and account admission failure must not be portrayed as ready merely because the persisted Product Control record reads ready_for_use. Recovery guides damaged configuration, unavailable data root and incomplete first run through their existing owner paths, without minting readiness or changing admission truth.
    condition: Whenever Desktop presents recovery help for degraded setup or storage state.
    failure: Reject a healthy claim that overrides a current owner gate failure, untyped or fabricated recovery, or a normal settings route used in place of unavailable recovery.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.support
  - id: rule.nimi.desktop.product-surfaces.r029
    kind: rule
    title: Support remains reachable while degraded
    modality: must
    statement: Troubleshooting remains reachable without ordinary shell or preference readiness through a minimal recovery host on first-run, repair, Runtime maintenance, Home-profile, formal-session and account-admission failures. It reuses the same troubleshooting and existing owner-permitted App-cache and directory-cleanup content; host visibility grants no operation permission. Non-ready tray recovery may focus the actual gate and offer its visible keyboard-operable troubleshooting entry, and acknowledgement describes that focus rather than falsely claiming repair opened or completed.
    condition: Whenever Desktop is in degraded, repair-required, setup-incomplete, or ordinary-shell-unavailable state.
    failure: Reject a readiness-gated recovery entry, lost owner-permitted degraded cleanup, a stale ready record overriding the current gate, or replay of recovery actions after scope loss.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.support
  - id: rule.nimi.desktop.product-surfaces.r030
    kind: rule
    title: Relationship and profile UX remains contextual
    modality: must
    statement: Contextual profile intent uses exactly a Human subject keyed by Realm accountId or a Character Source subject keyed by complete CharacterSourceRefV3, while Runtime LocalAgent presentation and Conversation remain keyed by Runtime-owned localAgentRef; Human detail may use a contextual Human profile modal, every Character detail intent routes through the canonical Character source-detail projection, and shared visual primitives never authorize a shared loader, semantic union, cache namespace, tab set, or action controller; friend, remove friend, block, unblock, privacy, edit, and Human Chat actions apply only to Human subjects, while Character subjects expose only typed source facts and explicitly admitted materialization, existing-LocalAgent open, and World navigation actions, with unavailable capability failing closed.
    condition: Whenever Desktop presents profile detail, relationship state, social mutation, or local materialization state.
    failure: Reject renderer-local social truth, pseudo-success, Realm REST bypass, an isSource-style UserProfile and Character union, localAgentRef or bare sourceId substituted for CharacterSourceRefV3, a Character ID submitted to a Human API or tab, bare-source direct chat, and any shared component that leaks action authority across subjects.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.relationship-profile
  - id: rule.nimi.desktop.product-surfaces.r031
    kind: rule
    title: Relationship categories are closed
    modality: must
    statement: Contextual relationship and profile consumers distinguish exactly human_friends for ACTIVE human-to-human Friendship relations that resolve to human relationship and Human Chat, and local_agents for Runtime-owned LocalAgents discovered only from Runtime inventory and provenance that may expose a complete CharacterSourceRefV3 and open an existing LocalAgent; a WorldPublic viewer relation remains a typed Character source relation with its own state, connectionId, and runtimeSourceRef and is never projected as Friendship or isFriend, while Realm social contacts never supply or override a LocalAgent target.
    condition: Whenever Desktop categorizes a relationship or source-backed profile entry.
    failure: Reject an additional or collapsed category, non-ACTIVE human relation as a friend, source record or viewer relation as Friendship, source contacts merged into Runtime LocalAgent inventory, or source-derived LocalAgent identity.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.relationship-profile
  - id: rule.nimi.desktop.product-surfaces.r032
    kind: rule
    title: Friend request states and transitions are closed
    modality: must
    statement: Desktop friend-request projection uses exactly received_pending with accept or reject, sent_pending with cancel and no duplicate resend, accepted as an ACTIVE relationship no longer represented as a request, rejected with no relationship and no automatic duplicate, and cancelled with no relationship; only received_pending transitions to accepted or rejected and sent_pending transitions to accepted by the other party or cancelled by the sender, while Realm social admission alone creates the canonical relationship.
    condition: Whenever Desktop projects or advances friend-request state.
    failure: Reject an unknown state or transition, duplicate resend, Desktop-created canonical relationship, automatic duplicate after rejection, and any accepted, rejected, or cancelled request still presented as pending.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.relationship-profile
  - id: rule.nimi.desktop.product-surfaces.r033
    kind: rule
    title: Desktop character surfaces consume the shared profile projection
    modality: must
    statement: Explore, Home, source detail, World detail, and contextual Character consumers derive PersonaCharacter and WorldCharacter display, narrative, knowledge, interaction, media, biography milestones, viewer relation, and public-source facts from one typed shared Realm character profile consumer projection and route every Character detail intent with complete CharacterSourceRefV3, so the same shared input has the same projected meaning for both source kinds; WorldCharacter-only entity and incident relationship sections are rendered only from their typed augmentation, Realm public ownership worldOwned or userOwned, Persona ownerAccountId, and Runtime ownerUserId or localAgentRef remain distinct namespaces, and absent public facts or statistics remain null, unavailable, or hidden.
    condition: Whenever Desktop presents or routes a PersonaCharacter or WorldCharacter source outside LocalAgent Conversation.
    failure: Reject a source-kind-specific profile parser, duplicated semantic view model, parallel Character profile modal, obsolete Core field fallback, shared-field loss, source identity or ownership namespace alias, fabricated zero fact, or WorldCharacter relationship augmentation represented as shared CharacterProfile data.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.explore
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.relationship-profile
      - type: applies_to
        target: definition.nimi.sdks.realm-consumer.character-profile-projection
  - id: rule.nimi.desktop.product-surfaces.r034
    kind: rule
    title: Data-root management delegates replacement and Check and Sync
    modality: must
    statement: Desktop Settings presents the current canonical data root, a native user-explicit path-disjoint Replace action, automatic and manual Check and Sync progress, independent typed owner and resource outcomes, and exact owner repair actions; Desktop Host carries only the protected Product Control and Runtime contracts and required lifecycle restart supervision, while the renderer never reads private stores, scans or hashes owner material, interprets owner schemas, moves or cleans the former root, invents aggregate readiness, or exposes these operations to ordinary Apps.
    condition: Whenever Desktop presents, invokes, resumes, or reports data-root replacement or Check and Sync.
    failure: Keep the current Product Control state, expose the typed protected failure or partial outcomes, and reject renderer-owned root authority, private-state interpretation, data movement, silent repair, pseudo-success, or public App projection.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.data-root-management
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.data-root-replacement
      - type: applies_to
        target: definition.nimi.platform.product-lifecycle.owner-aware-check-sync
  - id: definition.nimi.desktop.product-surfaces.home-overview
    kind: definition
    title: Nimi personal AI overview
    meaning: The Home default pane is a Desktop-owned personal AI overview of existing usage entry points, machine preparation and Runtime availability, with a Messages column and a Home-internal Message center that present, as one card family, App and Runtime Agent activity published through the App activity protocol, downloads, setup failures and App updates. Each section and message source consumes its existing owner projection independently; the presentation creates no new execution, billing, social, readiness, read, completion or publishing truth.
  - id: rule.nimi.desktop.product-surfaces.home-system-activity
    kind: rule
    title: Home and its system entry share owner activity and AI usage
    modality: must
    statement: Home and its compact system entry share admitted attention, recent conversation and source-qualified open-App destinations, downloads, Runtime actual-execution summaries and current-account device AI usage without a second settings, task or billing manager. Current work, actual AI attempts, open Apps, pending todos and unread messages remain distinct; at most two attention and three current-work entries lead to the existing full Home destinations. The user local natural day is converted into a half-open interval, partial and unassociated data are explicit, currencies and estimate limits remain visible, and product AI usage never falls back to generic RPC Usage. Opening a source preserves its owner action and never implicitly marks read, completes a todo or replays work.
    condition: Whenever Home composes or navigates from system activity or AI usage.
    failure: Preserve current admission and source-local failures, reject fabricated totals or execution and expose only the currently admitted destination.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.home-overview
      - type: applies_to
        target: definition.nimi.runtime.rpc-foundations.home-ai-observation
  - id: definition.nimi.desktop.product-surfaces.home-message-preferences
    kind: definition
    title: Home message display preferences
    meaning: Home message display preferences are Desktop-owned presentation choices kept in the Desktop formal App private JSON storage of the current account, subject and data root, holding App or Runtime activity hidden from Home at a displayed revision, Home display per App sourceRef; they change only the Home Messages preview and never publishing, sharing, read state, todo state, App access or Realm notification settings.
  - id: definition.nimi.desktop.product-surfaces.global-downloads
    kind: definition
    title: Global preparation and downloads surface
    meaning: Downloads is the shell-lifetime combined presentation of existing App package jobs, model transfers, environment dependency jobs and their explicit setup-task associations; operation and durable execution truth stay with each existing owner.
  - id: rule.nimi.desktop.product-surfaces.global-downloads
    kind: rule
    title: Downloads is a persistent cross-surface utility
    modality: must
    statement: Downloads stays reachable from ordinary navigation with an activity indicator, includes App, model and environment preparation, and returns to its source capability or App. Existing job identities and explicit associations determine grouping and deduplication; unsupported pause, cancel or retry operations are not offered. Closing a page does not stop work; stopping one setup does not delete resources or implicitly cancel shared dependencies. Per-module views link to this utility instead of keeping parallel complete managers.
    condition: Whenever Desktop displays or controls downloads or setup progress.
    failure: Display the actual stage or owner failure, retain completed effects, and reject duplicate queues, guessed association, fabricated progress or cross-owner controls.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.global-downloads
  - id: rule.nimi.desktop.product-surfaces.r035
    kind: rule
    title: Home activity consumes the public App activity client
    modality: must
    statement: Home reads App activity only through Desktop's formal App client and the same activity operations, SDK merged views, and open action as every covered App; the Messages preview and Message center share one open-todo view and one recent view, a record present in both is taken at its highest decimal change sequence before state and unread are judged, and read open todos stay pending. Each card shows source, title, summary, occurred time, todo state, attention and unread emphasis, and an open action only when the record has an App source object; App sources are grouped by sourceRef rather than appId, Runtime Agent summaries by agentRef without Conversation navigation, unknown extension types use the standard card without App-specific parsing or executable content, reading is marked only by an explicit Mark as read of the displayed revision, and Realm notifications and existing Home sections keep their own owners.
    condition: Whenever Desktop renders, refreshes, reads, marks read, or opens App activity in Home or its Message center.
    failure: Show only the App message source as unavailable with a retry on read failure without blocking Desktop startup or other Home sections and message sources, show the typed unavailable or failed open result, claim no complete count or definite empty state while a listing is incomplete, and never merge Realm cursors, unread counts, or state into activity.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.home-overview
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-activity-record
  - id: rule.nimi.desktop.product-surfaces.r036
    kind: rule
    title: The Message center is a Home-internal view over existing owners
    modality: must
    statement: View all messages opens a full-width Message center inside Home without a new primary navigation item, keeps Home selected, returns to the overview through Back to Home, and ordinary Home entry opens the overview. The center lists loaded messages with All, Pending and source filters; Pending holds loaded open todos including read and Home-hidden ones plus active downloads, unresolved setup failures and available App updates. Center cards show full titles and summaries, App listings use their owner continuation, and counts or empty results are stated as complete only after the relevant listing is complete. System cards open their download, setup task or App detail, and a collapsed group only expands.
    condition: Whenever Desktop renders, filters, paginates, or navigates from the Home Messages column or the Message center.
    failure: Show loading, source-local unavailable with retry, incomplete, and actual open results, and reject merged owner cursors, read state or counts, fabricated completeness, and open actions that a source does not support.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.home-overview
  - id: rule.nimi.desktop.product-surfaces.r037
    kind: rule
    title: Home hiding and display preferences change only the Home preview
    modality: must
    statement: Hiding an App or Runtime activity card from Home stores its activityId at the displayed revision so only a higher revision reappears, and hiding a group stores only the members counted in that group when the user acts; system items collapse but are not hidden. The Message center ignores Home hiding and source display choices, offers Show on Home for hidden cards, and says when a source display choice still keeps a restored card off Home. Settings > Notifications presents a Home messages section, saved and reported apart from Realm notification settings, with Home display per App sourceRef that has appeared, and a restore action that clears hidden cards without changing source choices. A first read that returns APP_STORAGE_ENTRY_NOT_FOUND means no preferences yet and the first user change writes the document; any other read failure keeps messages visible while hiding and preference changes stay unavailable until a manual reload, and a change updates the display only after its write succeeds.
    condition: Whenever Home, the Message center or Settings reads, applies, or changes Home message display preferences.
    failure: Keep the previous display and show the read or save failure with a manual retry, and reject hiding that marks read, completes, cancels, or stops publishing, reuse of the Realm notification settings DTO, and preferences carried across accounts, subjects, or data roots.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.home-message-preferences
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.home-overview
  - id: rule.nimi.desktop.product-surfaces.r038
    kind: rule
    title: Startup recovery presents the maintenance replacement
    modality: must
    statement: The startup recovery page is the Product Control surface for refused stored data; it shows the current data location as unchanged, explains that choosing a new empty folder starts Nimi there while the current folder stays in place, obtains the folder from the native picker and an explicit confirmation, invokes only the protected Product Control maintenance replacement, presents typed non-activation such as a non-empty or overlapping folder with a way to choose again, and after activation restarts Runtime and relaunches Home or, for the source Runtime, asks the developer to restart it; Support stays reachable from the page and never performs the replacement.
    condition: Whenever Desktop presents or invokes recovery for a Runtime maintenance refusal.
    failure: Reject renderer path authority, unconfirmed replacement, Support-performed replacement, reading or cleaning the current folder, and success shown before the typed activation.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.data-root-management
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.support
  - id: rule.nimi.desktop.product-surfaces.execution-notice
    kind: rule
    title: Home distinguishes technical interruption from App business state
    modality: must
    statement: "The surviving Host or availability owner reports confirmed App executor or session unavailability to Home and related message projections, including when no model or tool call is active and when Runtime restart invalidates a still-running App session. Home distinguishes executor stopped, connection unavailable and source App openability, retains an in-app technical notice and uses the local OS notification channel once per meaningful interruption according to user preferences and OS permission. Disabled notifications expose their limitation without repeated permission prompts; reconnect does not hide an old interrupted execution. The Host privately compares Runtime execution-scope references for each exact run: an initial pending result without a prior valid reference creates no old-scope interruption, A to B confirms A ended even when both observations are available, and repeated observations do not duplicate notices. Unknown or failed reads describe connection uncertainty without declaring scope revocation; a confirmed revocation or a new valid reference retains the prior interruption while separately projecting current availability. Scope references stay outside renderer and message payloads. App progress and terminal business outcomes remain App-origin facts, and notification or object open does not restart work or imply remote delivery."
    condition: Whenever an App loses its execution conditions and a surviving owner can report it.
    failure: Do not fabricate task failure, completion, resumption or notification delivery; preserve the known technical state and explicit unavailable path.
    relations:
      - type: applies_to
        target: definition.nimi.desktop.product-surfaces.home-overview
      - type: applies_to
        target: definition.nimi.runtime.app-surface.app-activity-plane
