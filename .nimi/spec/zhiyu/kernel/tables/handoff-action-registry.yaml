version: 1
table_family: product_catalog
owner: zhiyu
catalog_id: zhiyu_handoff_action_registry
entries:
  - check_local_service
  - go_to_desktop_partner_creation
  - open_ai_model_config
  - configure_avatar
  - launch_avatar
  - open_diagnostics
actions:
  check_local_service:
    owner: runtime_sdk_desktop_if_facade_exists
    zhiyu_role: trigger_probe_and_refresh_state
    fallback: owner_aware_failure_plus_diagnostics
    source_rule: Z-STATE-004
  go_to_desktop_partner_creation:
    owner: desktop_realm
    zhiyu_role: handoff_or_honest_guidance
    fallback: open_desktop_or_show_guidance
    source_rule: Z-PARTNER-002
  open_ai_model_config:
    owner: runtime_sdk_kit_platform
    zhiyu_role: display_and_operate_config_facade
    fallback: show_config_unavailable_state
    source_rule: Z-CONFIG-001
  configure_avatar:
    owner: avatar_runtime_kit
    zhiyu_role: display_import_select_config_facade
    fallback: show_avatar_config_unavailable_state
    source_rule: Z-CONFIG-003
  launch_avatar:
    owner: avatar_runtime_kit_desktop_if_needed
    zhiyu_role: launch_handoff
    fallback: show_launch_unavailable_state
    source_rule: Z-AV-002
  open_diagnostics:
    owner: zhiyu
    zhiyu_role: secondary_surface
    fallback: none
    source_rule: Z-DIAG-001
