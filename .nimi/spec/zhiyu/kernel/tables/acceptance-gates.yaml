version: 1
table_family: gate_registry
owner: zhiyu
registry_id: zhiyu_acceptance_gates
entries:
  - spec_consistency
  - spec_negative_fixture
  - docs_drift
  - acceptance_matrix
  - binding_only_consumption
  - sdk_kit_turn_consumption
  - no_duplicate_turn_reducer
  - config_boundary
  - no_direct_ai_consumption
  - artifact_boundary
  - local_persistence_boundary
  - test_quarantine
gates:
  - gate: spec_consistency
    command: node scripts/check-zhiyu-spec-kernel-consistency.mjs
    source_rule: Z-GATE-004
  - gate: spec_negative_fixture
    command: check:zhiyu-spec-negative-fixtures
    source_rule: Z-GATE-004
  - gate: docs_drift
    command: node scripts/generate-zhiyu-spec-kernel-docs.mjs --check
    source_rule: Z-GATE-004
  - gate: acceptance_matrix
    command: check:zhiyu-acceptance-matrix
    source_rule: Z-GATE-005
  - gate: binding_only_consumption
    command: check:zhiyu-binding-only-consumption
    source_rule: Z-AUTH-002
  - gate: sdk_kit_turn_consumption
    command: check:zhiyu-sdk-kit-turn-consumption
    source_rule: Z-CHAT-001
  - gate: no_duplicate_turn_reducer
    command: check:zhiyu-no-duplicate-turn-reducer
    source_rule: Z-CHAT-003
  - gate: config_boundary
    command: check:zhiyu-config-boundary
    source_rule: Z-CONFIG-004
  - gate: no_direct_ai_consumption
    command: check:zhiyu-no-direct-ai-consumption
    source_rule: Z-CHAT-003
  - gate: artifact_boundary
    command: check:zhiyu-conversation-artifact-boundary
    source_rule: Z-CHAT-005
  - gate: local_persistence_boundary
    command: check:zhiyu-local-persistence-boundary
    source_rule: Z-PERSIST-002
  - gate: test_quarantine
    command: check:zhiyu-test-inventory
    source_rule: Z-GATE-001
