version: 1
table_family: gate_registry
owner: zhiyu
registry_id: zhiyu_test_quarantine_policy
source_rule: Z-GATE-001
inventory_support_input: config/zhiyu-test-inventory.yaml
default_status:
  apps/zhiyu/test: non_authoritative_until_inventory
  check:zhiyu-bootstrap: non_authoritative_until_inventory
  release_evidence: non_authoritative_until_inventory
classification:
  - id: story_regression_candidate
    may_enter_release_gate: after_spec_ref_and_rewrite
  - id: diagnostics_regression_candidate
    may_enter_release_gate: after_spec_ref_and_scope_limit
  - id: owner_boundary_guard_candidate
    may_enter_release_gate: after_upstream_and_zhiyu_refs
  - id: legacy_drift_quarantine
    may_enter_release_gate: false
  - id: remove_after_replacement
    may_enter_release_gate: false
hard_blocks:
  - unclassified_zhiyu_test_in_release_gate
  - image_studio_test_as_product_authority
  - release_evidence_as_product_authority
  - e2e_green_as_spec_admission
