version: 1
table_family: product_record_schema
owner: zhiyu
record_id: zhiyu_permission_posture
path: .nimi/spec/zhiyu/kernel/tables/permission-posture.yaml
schema_version: 2
source_rule: Z-AUTH-003
required_top_level_fields:
  - manifest_permission_requirements
  - authority_classifications
  - runtime_agent_product_authority
  - runtime_agent_ai_config_authority
invariants:
  - manifest_permission_requirements_are_empty_until_public_permission_admission
  - base_entitlements_and_app_owned_authority_are_not_permissions
  - mutable_local_development_app_id_does_not_prove_first_party_identity
  - protected_owner_operations_fail_closed_without_an_attested_first_party_carrier_or_admitted_public_permission
manifest_permission_requirements:
  source: apps/zhiyu/nimi.app.yaml#permissions
  item_shape: [id, reason]
  current_values: []
  admitted_public_permission_ids: []
  reserved_or_unknown_id: reject_before_project_approval
  creates_permission_decision: false
authority_classifications:
  account_session_posture:
    authority_class: base_entitlement
    owner: runtime
  app_private_storage:
    authority_class: base_entitlement
    owner: runtime
  ai_metering:
    authority_class: base_entitlement
    owner: runtime
  ai_route_profile_consumption:
    authority_class: base_entitlement
    owner: runtime
  app_sqlite_media_settings_routes_cache_and_exact_native_commands:
    authority_class: app_owned_authority
    owner: zhiyu_native_host
  microphone_and_external_filesystem:
    authority_class: os_right
    owner: operating_system_or_native_picker
  runtime_agent_realm_cognition_notifications_and_cross_app_resources:
    authority_class: protected_owner_resource
    positive_paths: [attested_first_party_product_carrier, admitted_public_permission]
runtime_agent_product_authority:
  consumer_class: incubated_first_party
  current_local_development_positive_carrier: not_admitted
  current_posture: fail_closed
  required_future_carrier_bindings:
    - attested_first_party_zhiyu_principal
    - exact_runtime_agent_product_operation_set
    - current_account_and_generation
    - protected_native_carrier
    - runtime_owner_policy
    - audit
  blocked_operation_families:
    - runtime_agent_turn
    - runtime_agent_voice
    - runtime_agent_derived_artifact
    - cognition_memory
  forbidden_positive_sources:
    - display_app_id
    - mutable_manifest
    - local_project_approval
    - account_session
    - subject_user_id
    - public_permission_scope
runtime_agent_ai_config_authority:
  source_rule: K-AGCORE-144
  authority_class: first_party_product_operation
  current_local_development_positive_carrier: not_admitted
  current_posture: fail_closed
  allowed_after_carrier_admission: runtime_owned_agent_ai_config_edit_and_readiness_projection
  forbidden_interpretations: [app_local_route_truth, per_turn_binding_authoring, readiness_recomputation]
