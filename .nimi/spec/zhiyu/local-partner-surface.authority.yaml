format: nimicoding.authority/v2
owner: team.zhiyu
scope: zhiyu.local-partner-surface
units:
  - id: definition.nimi.zhiyu.local-partner-surface.product-surface
    kind: definition
    title: Zhiyu LocalAgent partner surface
    meaning: Zhiyu is a product-specific LocalAgent Conversation projection that owns its brand, copy, layout, user input, partner selection UX, and non-authoritative view state while Runtime owns LocalAgent execution and truth.
  - id: definition.nimi.zhiyu.local-partner-surface.conversation-surface
    kind: definition
    title: Zhiyu Conversation projection
    meaning: Zhiyu projects the Runtime-owned canonical agent.local Conversation core—rich sanitized live turn, text, reasoning-status, action, and tool events, typed committed text and image messages, image actions and artifacts, recorded-voice transcription text, terminal final-voice sidecars, canonical failures, bounded snapshots, and continuity—and the separate Agent-owned transient Realtime media and status union through the same standard SDK used by every formal App; activity, emotion, Avatar, capture, playback, and presentation roles remain outside the canonical reducers and do not substitute for Runtime truth or acceptance.
  - id: definition.nimi.zhiyu.local-partner-surface.configuration-surface
    kind: definition
    title: Zhiyu LocalAgent settings projection
    meaning: Zhiyu may mount the canonical AgentCenter from its current protected App session with agent.configure coverage and submit typed user intent through the existing bounded operation family, including the shared Appearance Resource Pack card and its canonical selected-state read, manual same-reviewed-byte Apply, and selection-only Clear, while Runtime owns the singular shared LocalAgent subsystem AIConfig and its opaque owner revision without Zhiyu-owned revision, history, or readiness, per-Agent autonomy and presentation state with their own independent concurrency revisions, request-time derived admission, and exact Job results; Zhiyu owns only the disposable non-canonical Resource Pack review and target rendering in its existing Conversation and owns no route, model, provider, Connector, Host lifecycle, canonical selection, or machine-local truth.
  - id: definition.nimi.zhiyu.local-partner-surface.resource-pack-target
    kind: definition
    title: Zhiyu Experience Resource Pack target
    meaning: Zhiyu Experience · Surface V1 is the sole V1 Resource Pack target for the existing Zhiyu LocalAgent Conversation and accepts one single-file .nimipack whose authority-owned public meaning is a versioned manifest envelope, exact target identity and version, one stylesheet entry, and declared packaged resources with no executable, action, timer, audio, video, remote, settings-schema, dependency-graph, multi-Pack, or compatibility-negotiation semantics; Zhiyu owns target-support interpretation, Default presentation, bounded semantic CSS and packaged-asset rendering, guarded canonical Conversation controls, reduced-motion behavior, honest selected-versus-effective fallback, and disposable review, while DOM shape, parser algorithm, package placement, provisional zone identities, and numeric resource or layout bounds remain implementation detail until any later creator-facing public identity is separately admitted.
  - id: definition.nimi.zhiyu.local-partner-surface.avatar-surface
    kind: definition
    title: Zhiyu and Avatar projection relation
    meaning: Zhiyu and Avatar independently consume the same Runtime LocalAgent; Zhiyu may request the Desktop Host Control Plane's common launch, focus, and presence-handoff mechanics port with only current opaque handle-and-anchor targeting intent, a bounded non-authorizing launch source, and opaque presentation, custody, and instance refs and receive only typed opaque mechanic availability or instance outcome, while it never owns Host lifecycle or drives, embeds, or owns Avatar rendering, motion, expression, voice, presentation truth, product availability, or Runtime result semantics.
  - id: rule.nimi.zhiyu.local-partner-surface.r001
    kind: rule
    title: Zhiyu is a LocalAgent projection consumer
    modality: must
    statement: Zhiyu collects user input, submits typed LocalAgent Conversation intent to Runtime Agent Service, and renders Runtime projections while owning only its product presentation and ephemeral UI state.
    condition: Whenever Zhiyu interacts with a LocalAgent.
    failure: Reject Zhiyu-owned LocalAgent execution or product truth.
    relations:
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.product-surface
  - id: rule.nimi.zhiyu.local-partner-surface.r002
    kind: rule
    title: Runtime remains the execution owner
    modality: must_not
    statement: Zhiyu executes LocalAgent turns, assembles authoritative prompts or context, selects provider or model execution, writes operational Memory or Knowledge directly, or synthesizes Conversation, activity, emotion, voice, or success truth.
    condition: Whenever Zhiyu submits or consumes a Conversation turn.
    failure: Use Runtime Agent Service and render the typed owner result.
    relations:
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.conversation-surface
  - id: rule.nimi.zhiyu.local-partner-surface.r003
    kind: rule
    title: Conversation continuity is Runtime owned
    modality: must
    statement: Zhiyu preserves Runtime-issued Agent handle, Conversation anchor, turn, message, action, voice, artifact, event sequence, snapshot high-watermark, and parent continuity, subscribes before hydration, and never synthesizes identity or reconstructs, rolls back, or duplicates durable state from local history, array position, selected partner UI, timestamps, activity or emotion sidebands, or cached messages.
    condition: Whenever Zhiyu opens, resumes, or streams a Conversation.
    failure: Re-read Runtime continuity or show unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.conversation-surface
  - id: rule.nimi.zhiyu.local-partner-surface.r004
    kind: rule
    title: Local cache is non-authoritative
    modality: must_not
    statement: Zhiyu local history, stores, drafts, selected partner, optimistic messages, or cached projections become Runtime Conversation, Memory, Knowledge, LocalAgent state, authorization, or execution truth.
    condition: Whenever Zhiyu stores or restores UI state.
    failure: Keep cache presentation-only and require Runtime confirmation.
    relations:
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.conversation-surface
  - id: rule.nimi.zhiyu.local-partner-surface.r005
    kind: rule
    title: Partner selection is explicit and local
    modality: must
    statement: Zhiyu selects each partner only from Runtime's dynamically materialized opaque handle projection for the owner-granted account scope and presents that handle explicitly for each operation, while current or recent partner selection remains Zhiyu UI state and never becomes a platform default LocalAgent or caller-authored selector.
    condition: Whenever Zhiyu selects or invokes a partner.
    failure: Reject raw, implicit, inferred, stale, or out-of-scope LocalAgent identity.
    relations:
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.product-surface
  - id: rule.nimi.zhiyu.local-partner-surface.r006
    kind: rule
    title: Authorization is session derived
    modality: must
    statement: Runtime derives current account, Zhiyu App identity, authorization, LocalAgent ownership or access, and requested operation from the active session for every operation and revalidates them at operation time; Zhiyu supplies no account, subject, grant, reusable or portable binding proof, Realm JWT, or Provider Credential.
    condition: Whenever Zhiyu requests a protected LocalAgent operation.
    failure: Fail closed when the active Runtime session or per-operation owner decision is unavailable.
    relations:
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.product-surface
  - id: rule.nimi.zhiyu.local-partner-surface.r007
    kind: rule
    title: Runtime state remains typed
    modality: must
    statement: Zhiyu renders protected Runtime text and image messages, image-action lifecycle and artifacts, terminal final-voice sidecars, operation-specific owner decision, cancellation, request-time derived admission, and canonical failure projection without silently dropping unknown public variants, duplicating artifacts from action records, inventing fallback values or aggregate AI readiness, or converting unknown state into success; first-party activity, emotion, Avatar, and presentation sidebands remain independently rendered and never feed the protected Conversation reducer.
    condition: Whenever Zhiyu consumes Runtime state.
    failure: Preserve the typed unavailable or failure state.
    relations:
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.conversation-surface
  - id: rule.nimi.zhiyu.local-partner-surface.r008
    kind: rule
    title: Shared AIConfig and per-Agent settings remain distinct
    modality: must
    statement: Zhiyu may get, compare-and-swap overwrite, clear, and list bounded current Local selection projection, Cloud Connector and target options, shared-owner preset voices, or current-session account-plus-App-owned bindable custom VoiceAsset options only through the public agent.configure SDK and canonical Kit Manager Session; the AIConfig actions resolve the singular subsystem owner without an Agent handle, custom VoiceAsset discovery retains its separate current App owner and selection commits only through handle-addressed presentation, and neither action grants runtime.consume or VoiceAsset create, delete, or cross-App access. The same manager projects the fixed six LocalAgent capability-role participation rows including realtime.interact as conversation.realtime independently of configured intents and effective selections, retains all six for absent or cleared config, never dynamically removes a row or auto-configures an intent, and per-Agent autonomy and presentation remain separately handle-addressed with independent revisions and typed conflicts while Zhiyu persists no second configuration, voice catalog, or participation truth.
    condition: Whenever Zhiyu edits shared LocalAgent AIConfig or per-Agent non-AI settings.
    failure: Reject an Agent-handle-addressed AI action, per-Agent route or model, Zhiyu-owned AIConfig revision, history, or merge, cross-owner mutation, or lost autonomy or presentation conflict and keep the Runtime-issued opaque AIConfig revision and Runtime truth unchanged.
    relations:
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.configuration-surface
  - id: rule.nimi.zhiyu.local-partner-surface.r009
    kind: rule
    title: Configuration does not own AI resources
    modality: must_not
    statement: Zhiyu stores Provider Credentials, Connector endpoints, Loadout content, option catalogs, effective health, selected route or resource as Zhiyu-owned truth, infers readiness, Quota, Budget, Rate Limit, or fallback, calls generic Connector management, or calls an unadmitted provider directly; passing route-only Local intent or the user's selected safe Cloud Connector and target references to the canonical shared-owner compare-and-swap operation is not Zhiyu-owned truth.
    condition: Whenever Zhiyu presents or applies LocalAgent AI settings.
    failure: Use the canonical shared AIConfig owner action, per-Agent non-AI owner action, request-time derived admission, or exact Job failure without creating a Zhiyu-owned projection.
    relations:
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.configuration-surface
  - id: rule.nimi.zhiyu.local-partner-surface.r010
    kind: rule
    title: Kit composition is demand driven
    modality: must
    statement: Zhiyu uses only the public SDK and Kit controls required by its current protected Conversation and settings journeys, derives attachment, microphone, artifact, and local playback controls from the exact current operation plus host adapter and Agent Center rows from Runtime participation, and does not define a reusable LocalAgent Center framework, capability or participation catalog, private Kit registry, hardcoded denominator, configured-intent fallback list, or second SDK.
    condition: Whenever Zhiyu adds shared SDK or Kit composition.
    failure: Keep product-specific composition in Zhiyu and shared capability demand-driven.
    relations:
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.configuration-surface
  - id: rule.nimi.zhiyu.local-partner-surface.r011
    kind: rule
    title: Zhiyu does not control Avatar
    modality: must_not
    statement: Zhiyu directly drives Avatar motion, expression, pose, look-at, rendering backend, visual package, voice playback, lipsync, raw presentation state, or product availability, or sends raw identity, private global state, configuration ref, capability, state, commit, result, or error authority through the common Host launch, focus, and presence-handoff mechanics port.
    condition: Whenever Zhiyu and Avatar present the same LocalAgent.
    failure: Submit product intent through canonical Runtime operations, use only the common opaque Host mechanics port for launch or focus, and let Avatar independently consume the same formal App presentation and embodiment projections.
    relations:
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.avatar-surface
  - id: rule.nimi.zhiyu.local-partner-surface.r012
    kind: rule
    title: Avatar availability is independent
    modality: must
    statement: Zhiyu Conversation remains usable without launching Avatar, and Avatar failure does not convert a successful Runtime Conversation into failure or give Zhiyu fallback rendering authority.
    condition: Whenever Avatar is unavailable or disabled.
    failure: Preserve independent typed Conversation and Avatar states.
    relations:
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.avatar-surface
  - id: rule.nimi.zhiyu.local-partner-surface.r013
    kind: rule
    title: Missing owner capability fails closed
    modality: must
    statement: Missing Runtime service, authorization, LocalAgent, Conversation, shared AIConfig, request-time derived admission, voice, or exact Job result produces a typed unavailable or failure state without aggregate AI readiness, fixture, local provider, cached truth, empty-success, or silent fallback.
    condition: Whenever a Zhiyu owner dependency is missing.
    failure: Render the typed state and preserve a recovery action when available.
    relations:
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.product-surface
  - id: rule.nimi.zhiyu.local-partner-surface.r014
    kind: rule
    title: Zhiyu parity is presentation parity
    modality: must
    statement: Any parity with Nimi Home LocalAgent Conversation covers product copy, layout, input, selection, rendering, failure, and diagnostics presentation while shared typed SDK or Kit state mapping remains the only projection path.
    condition: Whenever Zhiyu aligns with another LocalAgent Conversation surface.
    failure: Reject App-local transport, execution, provider, model, Memory, Knowledge, Avatar, voice, or authorization truth.
    relations:
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.conversation-surface
  - id: rule.nimi.zhiyu.local-partner-surface.r015
    kind: rule
    title: Recorded Conversation media controls use exact agent.local operations
    modality: must
    statement: Zhiyu exposes image attachment only when the host picker and runtime.agent.conversation.attachment.upload are available, artifact rendering only through runtime.agent.conversation.artifact.read, recorded microphone transcription only when host capture and runtime.agent.conversation.voice.transcribe are available, and local final-voice artifact playback only from a ready protected sidecar; recorded capture cancel submits nothing, transcription cancellation or generation change suppresses late turn submission, local artifact play or stop never calls Runtime interruption, and this distinct non-Realtime path uses no runtime.consume, provider APIs, raw native chunks, App-local artifacts, configured AIConfig rows, or predicted readiness as a LocalAgent substitute or Realtime fallback.
    condition: Whenever Zhiyu renders or invokes a protected attachment, artifact, recorded transcription, or final-voice sidecar control.
    failure: Hide or disable the unavailable control and preserve the canonical typed Runtime failure without mock success, fallback execution, late send, generic artifact access, or first-party sideband substitution.
    relations:
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.conversation-surface
  - id: rule.nimi.zhiyu.local-partner-surface.r016
    kind: rule
    title: Zhiyu Agent Realtime uses the canonical typed media surface
    modality: must
    statement: Zhiyu uses runtime.agent.realtime.open, input.append, events.subscribe, status.get, output.interrupt, and close through the canonical SDK with agentHandle as the only Agent selector, supplies only bounded user text or OS-admitted microphone frames and explicit outputTrack or existing Agent-turn interrupt intent, and consumes the shared transient pressure, speech, transcript, outputTrack, audio, health, lifecycle, and terminal union; it supplies no Agent instruction, context, tool result, route, response control, Memory, Knowledge, provider, model, or direct transport, and Realtime media never enters the Conversation snapshot or replaces recorded transcription or final voice sidecar.
    condition: Whenever Zhiyu starts, drives, interrupts, closes, or renders Agent-owned Realtime.
    failure: Hide or stop the unavailable control and preserve the typed permission, device, admission, route, Driver, pressure, or terminal result without Zhiyu-only protocol, owner-control injection, batch or static fallback, ordinary Agent voice reuse, polling, or mock success.
    relations:
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.conversation-surface
  - id: rule.nimi.zhiyu.local-partner-surface.r017
    kind: rule
    title: Zhiyu AgentCenter production and Simulator preserve canonical parity
    modality: must
    statement: Zhiyu production and Simulator both construct the complete AgentCenter through the same canonical agentHandle-addressed agent.configure client, factory, single Manager Session, existing section model, and Appearance Resource Pack card as Desktop and every covered protected App, preserve Overview, Appearance including preset, current-session-owned bindable custom voice discovery, canonical Pack selected state, Clear, replace or preview entry, Behavior, shared AIConfig, Memory, Cognition, and Diagnostics or Advanced sections and actions at equal operation coverage, expose manual Apply only while Zhiyu holds one current valid disposable review without treating that local precondition as different App eligibility or operation coverage, simulate the canonical typed configure client rather than a first-party raw-identity adapter or separate VoiceAsset or Pack client, and use file selection, immutable-byte delivery, native Avatar preview, AgentCenter Resource Pack placement, or navigation adapters only as non-authoritative Host mechanics beneath the same product action and typed owner result; Zhiyu alone retains the bounded disposable Pack review copy after file delivery and renders it on the existing Conversation, while no Host adapter, source App, or Simulator fact becomes selection, review, compatibility, render-success, or destination-session authority.
    condition: Whenever Zhiyu production or Simulator opens, refreshes, switches, renders, or mutates AgentCenter.
    failure: Invalidate the old Manager Session and disposable review before an account, session, Agent handle, target, or panel switch can mutate or render, and reject a raw identity sideband, first-party factory, Desktop fallback instruction, second Manager or Pack path, Host review custody, static or divergent availability, non-Zhiyu Pack rendering, capability-reducing convergence, missing or empty shared card or action, permanent unavailable result, or retirement before the canonical replacement is complete.
    relations:
      - type: applies_to
        target: definition.nimi.platform.app-ecosystem.agent-center-resource-pack-placement
      - type: applies_to
        target: definition.nimi.platform.core-protocol.app-operation-contract
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.configuration-surface
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.resource-pack-target
  - id: rule.nimi.zhiyu.local-partner-surface.r018
    kind: rule
    title: Resource Pack review is bounded, non-effectful, and Conversation-targeted
    modality: must
    statement: In a Zhiyu AgentCenter mount a direct user file choice yields one bounded immutable byte snapshot that the canonical Manager and Zhiyu preview controller bind to the current session-scoped Agent and presentation revision, validate for preview against the authority-defined Zhiyu Experience · Surface V1 target-support meaning later used by Runtime admission without making the preview result admission proof, mark visibly not yet applied, and render only as CSS and packaged-asset presentation on the existing target Agent Conversation; preview uses only currently admitted identity, canonical Conversation, and turn facts, keeps actual composer input, submit, stop, permission, failure, recovery, Clear, focus, live-region, draft, and scroll behavior inside the guarded Zhiyu surface, permits only bounded decorative CSS motion under the same reduced-motion policy as committed render, and creates no canonical selection, Runtime candidate, persistence, SDK effect, executable behavior, audio or video playback, remote resource, owner action, fabricated activity or emotion, or cross-App byte transfer; Cancel, failure, account, session, Agent, target, or panel change destroys the review and returns to the current canonical selection, Apply occurs only by direct user action with the exact reviewed bytes and expected revision, successful commit begins a fresh committed-resource render, known failure returns to the still-current canonical selection, ambiguous outcome rereads without blind replay, committed Pack render failure uses the Zhiyu Default with an honest selected-versus-effective mismatch, local Retry Render changes no selection, and explicit Clear alone removes the Pack selection.
    condition: Whenever Zhiyu previews, cancels, applies, renders, retries, falls back from, or clears a LocalAgent Resource Pack.
    failure: Reject preview outside the existing target Conversation, hidden or auto Apply, different reviewed and committed bytes, stale or wrong-Agent review, unguarded controls, executable or remote content, autoplay audio or video, fabricated owner truth, stale result display, cross-App candidate transfer, silent selected-state rewrite, previous-Pack restore, or fallback presented as committed render success.
    relations:
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.configuration-surface
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.conversation-surface
      - type: applies_to
        target: definition.nimi.zhiyu.local-partner-surface.resource-pack-target
