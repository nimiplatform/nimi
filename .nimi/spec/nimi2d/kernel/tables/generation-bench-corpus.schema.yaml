version: 1
table_family: protocol_surface
owner: nimi2d
schema_id: nimi.nimi2d.generation-bench-corpus.v1
authority: "nimi2d.kernel.generation_bench"
source_rule: N2D-BENCH-030
description: >
  Closed corpus manifest schema for Nimi2D Generation Bench. Corpus cases
  reference already-conformant layer input manifests or deliberately invalid
  fixtures. Raw image corpora are forbidden.

required_top_level_fields:
  - corpus_id
  - corpus_version
  - corpus_digest_sha256
  - frozen
  - created_at
  - case_splits
  - cases

closed_top_level_fields:
  - corpus_id
  - corpus_version
  - corpus_digest_sha256
  - frozen
  - created_at
  - case_splits
  - cases

fields:
  corpus_id:
    type: string
    pattern: "^n2d_generation_corpus_[a-z0-9][a-z0-9_-]{2,63}$"
  corpus_version:
    type: semver
  corpus_digest_sha256:
    type: lowercase_hex
    length: 64
  frozen:
    literal: true
  created_at:
    type: iso8601_utc_timestamp
  case_splits:
    required_fields:
      - certified_good_tier1
      - invalid_contract
    closed_fields:
      - certified_good_tier1
      - invalid_contract
      - tracking_tier2_plus
      - upstream_reference_only
    fields:
      certified_good_tier1:
        type: array
        item_ref: case_id
      invalid_contract:
        type: array
        item_ref: case_id
      tracking_tier2_plus:
        type: array_optional
        item_ref: case_id
      upstream_reference_only:
        type: array_optional
        item_ref: case_id
  cases:
    type: non_empty_array
    item_required_fields:
      - case_id
      - split
      - layer_input_manifest_ref
      - content_hash_sha256
      - expected_outcome
      - target_tier
      - source_evidence
    item_closed_fields:
      - case_id
      - split
      - layer_input_manifest_ref
      - content_hash_sha256
      - expected_outcome
      - expected_reject_codes
      - target_tier
      - source_evidence
      - distribution_tags
    item_fields:
      case_id:
        type: string
        pattern: "^n2d_case_[a-z0-9][a-z0-9_-]{2,63}$"
        uniqueness: required
      split:
        enum:
          - certified_good_tier1
          - invalid_contract
          - tracking_tier2_plus
          - upstream_reference_only
      layer_input_manifest_ref:
        type: relative_path_or_opaque_ref
        forbidden:
          - raw_image
          - source_image
          - url
          - prompt_only
      content_hash_sha256:
        type: lowercase_hex
        length: 64
      expected_outcome:
        enum:
          - admit
          - reject
          - tracking_only
      expected_reject_codes:
        type: array_optional
        item_namespace: NIMI2D_LAYER_INPUT_*
        required_when: "expected_outcome == reject"
      target_tier:
        enum:
          - tier-0_static_layered
          - tier-1_agent_basic
          - tier-2_viseme_gesture
          - tier-3_full_body_semantic
      source_evidence:
        required_fields:
          - layer_generation_ref
          - identity_preservation_ref
          - content_admission_ref
        closed_fields:
          - layer_generation_ref
          - occlusion_completion_ref
          - identity_preservation_ref
          - content_admission_ref
        semantics: "source evidence only; upstream generation quality is out of Nimi2D bench scope"
      distribution_tags:
        type: array_optional
        item_enum:
          - realm_persona_representative
          - expression_stress
          - wardrobe_stress
          - anchor_stress
          - invalid_fixture
          - tracking_only

forbidden_fields_and_values:
  - "raw_image_ref"
  - "source_image_ref"
  - "segmentation_prompt"
  - "inpainting_prompt"
  - "adult_fixture_v1"
  - "manual_case_omission"
  - "unhashed_case_asset"

invariants:
  - "Corpus manifests are immutable once frozen; changes require version and digest changes."
  - "Every selected case must appear in results."
  - "Certified-good tier-1 split is the quality gate split."
  - "Invalid contract split closes typed rejection behavior."
  - "Raw image corpora are forbidden."
  - "Adult v1 fixtures are forbidden."

refs:
  generation_bench_contract: ".nimi/spec/nimi2d/kernel/generation-bench-contract.md"
  gates: ".nimi/spec/nimi2d/kernel/tables/generation-bench-gates.yaml"
  result_schema: ".nimi/spec/nimi2d/kernel/tables/generation-bench-result.schema.yaml"
