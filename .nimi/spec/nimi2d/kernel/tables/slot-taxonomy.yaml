version: 1
table_family: product_catalog
owner: nimi2d
catalog_id: nimi2d_slot_taxonomy
taxonomy_id: "nimi.nimi2d.slot-taxonomy.v1"
authority: "nimi2d.kernel.wardrobe_slot"
source_rule: N2D-WARD-011
entries:
  - body_root
  - neck_base
  - head_center
  - face_center
  - left_eye_center
  - right_eye_center
  - mouth_center
  - left_shoulder
  - right_shoulder
  - left_hand
  - right_hand
  - hip_center
  - attachment_point
  - scene_origin
  - body_core
  - facial
  - limb
  - outfit
  - accessory
  - prop
  - scene
description: >
  Closed v1 Nimi2D anchor, slot, and wardrobe compatibility taxonomy. This
  table is asset/package topology authority only. It does not define Avatar
  runtime routes, PixiJS display objects, APML syntax, or renderer events.

topology:
  topology_id: "nimi.nimi2d.base-body.topology"
  topology_version: 1
  skeleton_owner: base_body
  wardrobe_main_rig_ownership: forbidden

required_anchor_kinds:
  - body_root
  - neck_base
  - head_center
  - face_center
  - left_eye_center
  - right_eye_center
  - mouth_center
  - left_shoulder
  - right_shoulder
  - left_hand
  - right_hand
  - hip_center

anchor_kinds:
  body_root:
    class: body_core
    required_for_character: true
  neck_base:
    class: body_core
    required_for_character: true
  head_center:
    class: head
    required_for_character: true
  face_center:
    class: face
    required_for_character: true
  left_eye_center:
    class: face
    required_for_character: true
  right_eye_center:
    class: face
    required_for_character: true
  mouth_center:
    class: face
    required_for_character: true
  left_shoulder:
    class: limb
    required_for_character: true
  right_shoulder:
    class: limb
    required_for_character: true
  left_hand:
    class: limb
    required_for_character: true
  right_hand:
    class: limb
    required_for_character: true
  hip_center:
    class: body_core
    required_for_character: true
  attachment_point:
    class: attachment
    required_for_character: false
  scene_origin:
    class: scene
    required_for_character: false

slot_classes:
  body_core:
    owner: base_body
    wardrobe_binding: forbidden
  facial:
    owner: base_body
    wardrobe_binding: accessory_only
  limb:
    owner: base_body
    wardrobe_binding: outfit_or_accessory
  outfit:
    owner: base_body
    wardrobe_binding: outfit
  accessory:
    owner: base_body
    wardrobe_binding: accessory
  prop:
    owner: base_body
    wardrobe_binding: prop
  scene:
    owner: package_scene
    wardrobe_binding: scene_layer

required_slots:
  - head
  - face
  - hair
  - neck
  - torso
  - hip
  - left_arm
  - right_arm
  - left_hand
  - right_hand
  - left_leg
  - right_leg
  - left_foot
  - right_foot
  - outfit_upper
  - outfit_lower
  - outfit_full
  - accessory_head
  - accessory_face
  - accessory_hand
  - prop_hand

slot_kinds:
  head:
    class: facial
    required_for_character: true
    exclusivity: exclusive
    allowed_wardrobe_kinds:
      - hair_variant
      - accessory
  face:
    class: facial
    required_for_character: true
    exclusivity: stackable
    allowed_wardrobe_kinds:
      - accessory
  hair:
    class: facial
    required_for_character: true
    exclusivity: exclusive
    allowed_wardrobe_kinds:
      - hair_variant
      - accessory
  neck:
    class: outfit
    required_for_character: true
    exclusivity: stackable
    allowed_wardrobe_kinds:
      - outfit
      - default_outfit
      - accessory
  torso:
    class: outfit
    required_for_character: true
    exclusivity: exclusive
    allowed_wardrobe_kinds:
      - outfit
      - default_outfit
  hip:
    class: outfit
    required_for_character: true
    exclusivity: exclusive
    allowed_wardrobe_kinds:
      - outfit
      - default_outfit
  left_arm:
    class: limb
    required_for_character: true
    exclusivity: exclusive
    allowed_wardrobe_kinds:
      - outfit
      - default_outfit
      - accessory
  right_arm:
    class: limb
    required_for_character: true
    exclusivity: exclusive
    allowed_wardrobe_kinds:
      - outfit
      - default_outfit
      - accessory
  left_hand:
    class: limb
    required_for_character: true
    exclusivity: stackable
    allowed_wardrobe_kinds:
      - outfit
      - default_outfit
      - accessory
      - held_prop
  right_hand:
    class: limb
    required_for_character: true
    exclusivity: stackable
    allowed_wardrobe_kinds:
      - outfit
      - default_outfit
      - accessory
      - held_prop
  left_leg:
    class: limb
    required_for_character: true
    exclusivity: exclusive
    allowed_wardrobe_kinds:
      - outfit
      - default_outfit
  right_leg:
    class: limb
    required_for_character: true
    exclusivity: exclusive
    allowed_wardrobe_kinds:
      - outfit
      - default_outfit
  left_foot:
    class: limb
    required_for_character: true
    exclusivity: stackable
    allowed_wardrobe_kinds:
      - outfit
      - default_outfit
      - accessory
  right_foot:
    class: limb
    required_for_character: true
    exclusivity: stackable
    allowed_wardrobe_kinds:
      - outfit
      - default_outfit
      - accessory
  outfit_upper:
    class: outfit
    required_for_character: true
    exclusivity: exclusive
    allowed_wardrobe_kinds:
      - outfit
      - default_outfit
  outfit_lower:
    class: outfit
    required_for_character: true
    exclusivity: exclusive
    allowed_wardrobe_kinds:
      - outfit
      - default_outfit
  outfit_full:
    class: outfit
    required_for_character: true
    exclusivity: exclusive
    allowed_wardrobe_kinds:
      - outfit
      - default_outfit
  accessory_head:
    class: accessory
    required_for_character: true
    exclusivity: stackable
    allowed_wardrobe_kinds:
      - accessory
      - hair_variant
  accessory_face:
    class: accessory
    required_for_character: true
    exclusivity: stackable
    allowed_wardrobe_kinds:
      - accessory
  accessory_hand:
    class: accessory
    required_for_character: true
    exclusivity: stackable
    allowed_wardrobe_kinds:
      - accessory
      - held_prop
  prop_hand:
    class: prop
    required_for_character: true
    exclusivity: stackable
    allowed_wardrobe_kinds:
      - held_prop
  scene_back:
    class: scene
    required_for_character: false
    exclusivity: stackable
    allowed_wardrobe_kinds:
      - scene_layer
  scene_front:
    class: scene
    required_for_character: false
    exclusivity: stackable
    allowed_wardrobe_kinds:
      - scene_layer

wardrobe_kinds:
  default_outfit:
    satisfies_outfit_requirement: true
    may_bind_main_rig: false
  outfit:
    satisfies_outfit_requirement: true
    may_bind_main_rig: false
  accessory:
    satisfies_outfit_requirement: false
    may_bind_main_rig: false
  hair_variant:
    satisfies_outfit_requirement: false
    may_bind_main_rig: false
  held_prop:
    satisfies_outfit_requirement: false
    may_bind_main_rig: false
  scene_layer:
    satisfies_outfit_requirement: false
    may_bind_main_rig: false

local_attachment_rig:
  allowed: true
  allowed_for:
    - outfit
    - accessory
    - hair_variant
    - held_prop
    - scene_layer
  must_be_subordinate_to:
    - base_body_slot
    - base_body_anchor
  forbidden:
    - main_skeleton
    - posture_truth
    - action_topology_owner
    - runtime_composer
    - avatar_backend_route

invariants:
  - "Base body is the only main rig owner."
  - "Wardrobe assets bind to slots and inherit base-body deformation."
  - "default_outfit or outfit can satisfy outfit requirement; accessories, props, hair variants, and scene layers cannot."
  - "Slot names are asset/package topology vocabulary, not Runtime or Avatar route ids."
  - "Unknown slots or wardrobe kinds fail closed."

refs:
  base_body_contract: ".nimi/spec/nimi2d/kernel/base-body-contract.md"
  wardrobe_slot_contract: ".nimi/spec/nimi2d/kernel/wardrobe-slot-contract.md"
  renderability_governance_contract: ".nimi/spec/nimi2d/kernel/renderability-governance-contract.md"
