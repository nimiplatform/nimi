version: 1
table_family: product_catalog
owner: nimi2d
catalog_id: nimi2d_generation_bench_gates
authority: "nimi2d.kernel.generation_bench"
source_rule: N2D-BENCH-020
entries:
  - valid_locked_fixtures_admit
  - invalid_fixtures_typed_reject
  - asset_integrity_validation
  - no_outfit_no_render
  - base_body_only_rejected
  - adult_v1_unavailable
  - upstream_content_evidence_required
  - capability_overclaim_rejected
  - deterministic_replay
  - anchor_accuracy_overall
  - slot_accuracy
  - default_outfit_binding_success_rate
  - expression_usability_rate
  - jaw_amplitude_speech_mouth_usability_rate
  - motion_primitive_binding_success_rate
  - package_runtime_admission_readiness
  - wardrobe_reuse_rate
  - manual_correction_minutes_p50_p90
  - subjective_liveliness
  - true_viseme_usability_tier2_plus
  - upstream_occlusion_pass_rate
  - live_action_latency_stability
description: >
  Closed hard gate, quality gate, and tracking metric table for Nimi2D
  Generation Bench. Gates apply to generation from contract-conformant layer
  input, not raw images or upstream segmentation/occlusion generation.

decision:
  go_requires:
    hard_gates: all_pass
    quality_gates: all_pass
    corpus_split: certified_good_tier1
  conditional_go_requires:
    hard_gates: all_pass
    quality_gates: waiver_required
    waiver_fields:
      - failed_quality_gate
      - owner
      - accepted_risk
      - rerun_deadline
  no_go_when:
    - any_hard_gate_fails
    - quality_gate_fails_without_waiver
    - result_schema_invalid
    - selected_cases_not_fully_reported

hard_gates:
  valid_locked_fixtures_admit:
    description: "All valid locked fixtures admit without warnings."
    closure: binary_all_pass
  invalid_fixtures_typed_reject:
    description: "All invalid fixtures fail with exact typed reject codes."
    closure: binary_all_pass
  asset_integrity_validation:
    description: "Asset refs, sha256, RGBA, bounds, alpha, color, and draw order validate."
    closure: binary_all_pass
  no_outfit_no_render:
    description: "No character package is renderable without a default or selected outfit."
    closure: binary_all_pass
  base_body_only_rejected:
    description: "Base-body-only preview/export/render/debug/bench paths are rejected or unreachable."
    closure: binary_all_pass
  adult_v1_unavailable:
    description: "Adult-oriented assets, fixtures, corpora, capability claims, and distribution paths are absent."
    closure: binary_all_pass
  upstream_content_evidence_required:
    description: "Missing, ambiguous, or review-required upstream content evidence fails closed."
    closure: binary_all_pass
  capability_overclaim_rejected:
    description: "Requested tiers/channels above proven evidence fail closed."
    closure: binary_all_pass
  deterministic_replay:
    description: "Bench run can be reproduced from corpus digest, generator version, validator version, seed, and config."
    closure: binary_all_pass

quality_gates:
  anchor_accuracy_overall:
    metric: anchor_accuracy
    corpus_split: certified_good_tier1
    threshold: ">= 0.95"
    additional_rule: "no critical anchor family below 0.90"
  slot_accuracy:
    metric: slot_accuracy
    corpus_split: certified_good_tier1
    threshold: ">= 0.93"
  default_outfit_binding_success_rate:
    metric: default_outfit_binding_success_rate
    corpus_split: certified_good_tier1
    threshold: ">= 0.98"
  expression_usability_rate:
    metric: expression_usability_rate
    corpus_split: certified_good_tier1
    threshold: ">= 0.90"
  jaw_amplitude_speech_mouth_usability_rate:
    metric: jaw_amplitude_speech_mouth_usability_rate
    corpus_split: certified_good_tier1
    threshold: ">= 0.85"
  motion_primitive_binding_success_rate:
    metric: motion_primitive_binding_success_rate
    corpus_split: certified_good_tier1
    threshold: ">= 0.90"
    additional_rule: "zero unsafe pose"
  package_runtime_admission_readiness:
    metric: package_runtime_admission_readiness
    corpus_split: certified_good_tier1
    threshold: ">= 0.98"

tracking_metrics:
  wardrobe_reuse_rate:
    gate: false
  manual_correction_minutes_p50_p90:
    gate: false
    note: "Tracking only until a correction protocol is admitted."
  subjective_liveliness:
    gate: false
  true_viseme_usability_tier2_plus:
    gate: false
    note: "Must not be scored as tier-1 success."
  upstream_occlusion_pass_rate:
    gate: false
    owner: upstream_layer_generation
    note: "Recorded only as upstream evidence, not Nimi2D-owned Generation Bench metric."
  live_action_latency_stability:
    gate: false
    owner: avatar
    note: "Avatar Live Action Bench only; not Generation Bench closure."

invariants:
  - "Generation Bench gates test Nimi2D from valid layer input forward."
  - "Raw image, segmentation, and occlusion generation are out of scope."
  - "Tier-1 true viseme is not scored."
  - "Manual correction minutes are tracking only."
  - "All selected cases must be reported."
  - "Adult v1 assets and fixtures are unavailable."

refs:
  generation_bench_contract: ".nimi/spec/nimi2d/kernel/generation-bench-contract.md"
  corpus_schema: ".nimi/spec/nimi2d/kernel/tables/generation-bench-corpus.schema.yaml"
  result_schema: ".nimi/spec/nimi2d/kernel/tables/generation-bench-result.schema.yaml"
