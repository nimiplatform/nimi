version: 1
table_family: protocol_surface
owner: nimi2d
schema_id: nimi.nimi2d.generation-bench-result.v1
protocol_id: nimi2d_generation_bench_result
surfaces:
  - nimi2d.generation_bench.result
authority: "nimi2d.kernel.generation_bench"
source_rule: N2D-BENCH-040
description: >
  Closed deterministic result schema for Nimi2D Generation Bench runs.
  Results must report every selected case and separate hard gates, quality
  gates, tracking metrics, failure attribution, and final decision.

required_top_level_fields:
  - result_id
  - started_at
  - corpus
  - generator
  - validator
  - deterministic_replay
  - selected_cases
  - case_results
  - hard_gate_results
  - quality_gate_results
  - tracking_metrics
  - failure_attribution
  - decision

closed_top_level_fields:
  - result_id
  - started_at
  - completed_at
  - corpus
  - generator
  - validator
  - deterministic_replay
  - selected_cases
  - case_results
  - hard_gate_results
  - quality_gate_results
  - tracking_metrics
  - failure_attribution
  - decision

fields:
  result_id:
    type: string
    pattern: "^n2d_generation_bench_result_[a-z0-9][a-z0-9_-]{2,63}$"
  started_at:
    type: iso8601_utc_timestamp
  completed_at:
    type: iso8601_utc_timestamp_optional
  corpus:
    required_fields:
      - corpus_id
      - corpus_version
      - corpus_digest_sha256
    closed_fields:
      - corpus_id
      - corpus_version
      - corpus_digest_sha256
  generator:
    required_fields:
      - generator_id
      - generator_version
      - config_digest_sha256
    closed_fields:
      - generator_id
      - generator_version
      - config_digest_sha256
  validator:
    required_fields:
      - validator_id
      - validator_version
    closed_fields:
      - validator_id
      - validator_version
  deterministic_replay:
    required_fields:
      - seed
      - environment_digest_sha256
      - command_ref
    closed_fields:
      - seed
      - environment_digest_sha256
      - command_ref
  selected_cases:
    type: array
    item_ref: case_id
    invariant: "must equal the selected corpus split union for the run"
  case_results:
    type: array
    item_required_fields:
      - case_id
      - split
      - status
      - target_tier
      - proven_tier
      - package_manifest_ref
      - reject_codes
      - metrics
      - failure_attribution
    item_closed_fields:
      - case_id
      - split
      - status
      - target_tier
      - proven_tier
      - package_manifest_ref
      - reject_codes
      - metrics
      - failure_attribution
      - notes
    item_fields:
      status:
        enum:
          - admitted
          - rejected
          - failed_generation
          - failed_validation
          - tracking_only
      proven_tier:
        enum:
          - none
          - tier-0_static_layered
          - tier-1_agent_basic
          - tier-2_viseme_gesture
          - tier-3_full_body_semantic
      package_manifest_ref:
        type: opaque_ref_or_null
      reject_codes:
        type: array
        item_namespace: NIMI2D_LAYER_INPUT_*
      metrics:
        type: map
      failure_attribution:
        enum:
          - none
          - nimi2d_layer_input_admission
          - nimi2d_anchor_slot_solving
          - nimi2d_base_body_topology
          - nimi2d_wardrobe_binding
          - nimi2d_capability_validation
          - nimi2d_package_manifest
          - upstream_layer_generation
          - upstream_content_admission
          - test_harness
          - unknown
  hard_gate_results:
    type: map
    key_source: ".nimi/spec/nimi2d/kernel/tables/generation-bench-gates.yaml hard_gates"
    value_enum:
      - pass
      - fail
  quality_gate_results:
    type: map
    key_source: ".nimi/spec/nimi2d/kernel/tables/generation-bench-gates.yaml quality_gates"
    value_required_fields:
      - value
      - threshold
      - status
    value_closed_fields:
      - value
      - threshold
      - status
      - waiver_ref
    status_enum:
      - pass
      - fail
      - waived
  tracking_metrics:
    type: map
    key_source: ".nimi/spec/nimi2d/kernel/tables/generation-bench-gates.yaml tracking_metrics"
  failure_attribution:
    type: map
    key_enum:
      - nimi2d_layer_input_admission
      - nimi2d_anchor_slot_solving
      - nimi2d_base_body_topology
      - nimi2d_wardrobe_binding
      - nimi2d_capability_validation
      - nimi2d_package_manifest
      - upstream_layer_generation
      - upstream_content_admission
      - test_harness
      - unknown
  decision:
    required_fields:
      - verdict
      - reason
    closed_fields:
      - verdict
      - reason
      - waiver_refs
    fields:
      verdict:
        enum:
          - go
          - conditional_go
          - no_go
      reason:
        type: string
      waiver_refs:
        type: array_optional

forbidden_fields_and_values:
  - "partial_success"
  - "selected_successful_cases_only"
  - "manual_unrecorded_correction"
  - "raw_image_input"
  - "tier1_true_viseme_success"
  - "occlusion_pass_rate_nimi2d_owned"
  - "adult_fixture_v1"

invariants:
  - "All selected cases must be reported exactly once."
  - "Unverified cases count as failure unless corpus split is tracking_only."
  - "Hard gate failure prevents go and conditional_go."
  - "Tier-1 true viseme must not be counted as success."
  - "Occlusion pass rate is upstream-owned tracking evidence only."
  - "The result schema cannot close Avatar Live Action Bench."

refs:
  generation_bench_contract: ".nimi/spec/nimi2d/kernel/generation-bench-contract.md"
  gates: ".nimi/spec/nimi2d/kernel/tables/generation-bench-gates.yaml"
  corpus_schema: ".nimi/spec/nimi2d/kernel/tables/generation-bench-corpus.schema.yaml"
