version: 1
schema:
  id: nimi-coding.audit-remediation-map.v1
  kind: audit-remediation-map
required_top_level_fields:
  - version
  - kind
  - sweep_id
  - source_ledger_ref
  - source_findings_ref
  - grouping_policy
  - remediation_bundles
  - remediation_candidates
  - unmapped_findings
  - created_at
  - updated_at
remediation_candidate_required_fields:
  - candidate_id
  - status
  - owner_domain
  - priority
  - finding_ids
  - cluster_ids
  - clustered_symptom_count
  - source_chunks
  - files
  - suggested_write_set
  - remediation_bundle
  - authority_refs
  - required_gates
remediation_bundle_required_fields:
  - bundle_id
  - cluster_ids
  - representative_finding_ids
  - canonical_finding_ids
  - duplicate_symptom_count
  - source_chunks
  - repair_targets
status_enum:
  - proposed
  - needs_decision
  - blocked
  - empty
hard_constraints:
  - remediation_map_must_not_mutate_source_ledger
  - every_open_finding_must_be_mapped_or_explicitly_unmapped
  - duplicate_symptoms_must_remain_traceable_inside_remediation_bundles
  - duplicate_symptoms_do_not_count_as_independent_remediation_obligations_by_default
  - write_set_conflicts_must_be_visible
  - needs_decision_findings_require_authority_owner_review
  - remediation_candidates_must_not_authorize_or_schedule_implementation
  - external_ai_host_owns_planning_decomposition_and_execution_state
