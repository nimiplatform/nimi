      temporary_large_config_inventory:
        - config/zhiyu-test-inventory.yaml
        - config/platform-standard-shell-capabilities.yaml
      temporary_large_spec_yaml:
        - runtime/catalog/source/providers/local.source.yaml
        - config/spec-frozen/runtime/tables/first-party-protected-runtime-profiles.yaml
      proto_schema:
        - proto/**/*.proto
      scripts:
        - scripts/**
      tests:
        - "**/*.test.js"
        - "**/*.test.ts"
        - "**/*.test.mjs"
        - "**/*.test.tsx"
        - "**/*.spec.js"
        - "**/*.spec.ts"
        - "**/*.spec.mjs"
        - "**/*.spec.tsx"
        - "**/*_tests.rs"
        - "**/*_test.go"
        - "**/*_test.py"
        - "**/test_*.py"
        - "**/test/**/*.js"
        - "**/test/**/*.mjs"
        - "**/test/**/*.ts"
        - "**/test/**/*.tsx"
        - "**/__tests__/**"
        - "**/e2e/fixtures/**"
      spec_yaml:
        - .nimi/spec/**/*.yaml
        - spec/**/*.yaml
        - spec/**/*.yml
        - apps/**/spec/**/*.yaml
        - apps/**/spec/**/*.yml
      generated:
        - kit/auth/src/logic/native-oauth-result-logo.ts
        - runtime/internal/providerregistry/generated.go
        - runtime/catalog/providers/**
        - runtime/catalog/generated/**
        - runtime/gen/**
        - sdks/**/core-generated/**
        - spec/**/kernel/generated/**
      structured_data:
        - .secrets.baseline
        - apps/desktop/src/shell/renderer/locales/**/*.json
        - apps/avatar/assets/lip-sync/**/*.json
    exclude:
      - _external/**
      - .cache/**
      - .iterate/**
      - archive/**
      - docs/**
      - .local/**
      - .github/workflows/release.yml
      - config/platform-nimi-ui-tokens.yaml
      - runtime/catalog/source/providers/dashscope.source.yaml
      - "**/generated/**"
      - "**/gen/**"
      - "**/core_generated/**"
      - "**/core-generated/**"
      - "**/coregenerated/**"
      - runtime/**/*.pb.go
      - runtime/**/*.binpb
      - spec/generated/**
      - pnpm-lock.yaml
      - "**/Cargo.lock"
      - apps/desktop/src-tauri/gen/**
      - "**/*.ico"
      - "**/*.icns"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.webp"
      - "**/*.svg"
      - "**/*.frag"
      - "**/*.vert"
      - "**/*.min.js"
      - "**/*.node"
      - "**/*.wav"
      - "**/*.mp3"
      - "**/*.m4a"
      - "**/*.ogg"
      - "**/*.flac"
      - "**/*.aac"
      - "**/*.mp4"
      - "**/*.mov"
      - "**/*.webm"
      - "**/*.vrm"
      - "**/*.vrma"
      - "**/*.css"
      - "**/locales/en.json"
      - "**/locales/zh.json"
    waivers:
  structure_budget:
    version: 1
    allowed_forwarding_shells:
      - index.ts
      - index.tsx
      - mod.rs
    rules:
      - id: runtime_internal
        include:
          - runtime/internal/**
        depth_base: runtime/internal
        warning_depth: 4
        error_depth: 5
      - id: runtime_cmd
        include:
          - runtime/cmd/nimi/**
        depth_base: runtime/cmd/nimi
        warning_depth: 3
        error_depth: 4
      - id: sdks_typescript
        include:
          - sdks/typescript/**
        depth_base: sdks/typescript
        warning_depth: 4
        error_depth: 5
      - id: desktop_tauri
        include:
          - apps/desktop/src-tauri/src/**
        depth_base: apps/desktop/src-tauri/src
        warning_depth: 4
        error_depth: 5
      - id: desktop_src
        include:
          - apps/desktop/src/**
        depth_base: apps/desktop/src
        warning_depth: 6
        error_depth: 7
      - id: web_src
        include:
          - apps/web/src/**
        depth_base: apps/web/src
        warning_depth: 4
        error_depth: 5
      - id: scripts
        include:
          - scripts/**
        depth_base: scripts
        warning_depth: 3
        error_depth: 4
      - id: nimi_cognition
        include:
          - nimi-cognition/**
        depth_base: nimi-cognition
        warning_depth: 4
        error_depth: 5
    exclude:
      - _external/**
      - .cache/**
      - .iterate/**
      - archive/**
      - docs/**
      - .local/**
      - "**/generated/**"
      - "**/gen/**"
      - "**/core_generated/**"
      - "**/core-generated/**"
      - "**/coregenerated/**"
      - runtime/**/*.pb.go
      - runtime/**/*.binpb
      - spec/generated/**
      - pnpm-lock.yaml
      - "**/Cargo.lock"
      - apps/desktop/src-tauri/gen/**
      - "**/*.ico"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.webp"
      - "**/*.svg"
      - "**/*.frag"
      - "**/*.vert"
      - "**/*.vrm"
      - "**/*.vrma"
      - "**/*.min.js"
      - "**/*.css"
      - "**/locales/en.json"
      - "**/locales/zh.json"
    waivers:
  high_risk_doc_metadata:
    doc_roots:
      - .local
    exempt_paths: []
    name_patterns:
      - design
      - audit
      - implementation-plan
      - architecture
      - refactor
      - refactory
      - remediation-plan
      - unification
      - migration
    required_metadata_keys:
      - Spec Status
      - Authority Owner
      - Work Type
      - Parallel Truth
