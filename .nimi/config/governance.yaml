profile_id: nimi

spec_governance:
  canonical_root: .nimi/spec
  validate_commands:
    cognition:
      - node scripts/check-cognition-spec-kernel-consistency.mjs
    cognition-consistency:
      - node scripts/check-cognition-spec-kernel-consistency.mjs
    apps/cognition:
      - node scripts/check-cognition-spec-kernel-consistency.mjs
    runtime-consistency:
      - node scripts/check-runtime-spec-kernel-consistency.mjs
    sdks-consistency:
      - pnpm check:sdk-spec-kernel-consistency
    runtime-delegation-consistency:
      - node scripts/check-runtime-spec-kernel-consistency.mjs
      - pnpm check:sdk-spec-kernel-consistency
    desktop-consistency:
      - node scripts/check-desktop-spec-kernel-consistency.mjs
    apps/desktop:
      - node scripts/check-desktop-spec-kernel-consistency.mjs
    platform-consistency:
      - node scripts/check-platform-spec-kernel-consistency.mjs
    avatar:
      - node scripts/check-avatar-spec-kernel-consistency.mjs
    apps/avatar:
      - pnpm --filter @nimiplatform/avatar check:spec-consistency
      - pnpm check:apps-avatar-isolation
    realm-consistency:
      - node scripts/check-realm-spec-kernel-consistency.mjs
    release-gate-consistency:
      - node scripts/check-release-gate-registry-coherence.mjs
  generate_commands:
    cognition:
      - node scripts/generate-cognition-spec-kernel-docs.mjs
    runtime:
      - node scripts/generate-runtime-spec-kernel-docs.mjs
    sdks:
      - node scripts/generate-sdk-spec-kernel-docs.mjs
    desktop:
      - node scripts/generate-desktop-spec-kernel-docs.mjs
    platform:
      - node scripts/generate-platform-spec-kernel-docs.mjs
    avatar:
      - node scripts/generate-avatar-spec-kernel-docs.mjs
    realm:
      - node scripts/generate-realm-spec-kernel-docs.mjs
    spec-human-doc:
      - node scripts/generate-spec-human-doc.mjs
    release-gate-projection:
      - node scripts/generate-release-gate-projection-all.mjs

ai_governance:
  agents_freshness:
    targets:
      - rel: AGENTS.md
        max_lines: 40
      - rel: runtime/AGENTS.md
        max_lines: 30
      - rel: sdks/AGENTS.md
        max_lines: 30
      - rel: scripts/AGENTS.md
        max_lines: 30
      - rel: apps/desktop/AGENTS.md
        max_lines: 30
      - rel: apps/web/AGENTS.md
        max_lines: 30
      - rel: apps/install-gateway/AGENTS.md
        max_lines: 30
      - rel: kit/AGENTS.md
        max_lines: 30
      - rel: proto/AGENTS.md
        max_lines: 30
    required_sections:
      - "## Scope"
      - "## Hard Boundaries"
      - "## Retrieval Defaults"
      - "## Verification Commands"
    stale_tokens:
      - local_ai_runtime
      - runtime-ai-media-coverage
      - docs/refactory
  context_budget:
    version: 1
    default_profile: production
    profiles:
      production:
        warning_lines: 500
        warning_bytes: 61440
        warning_max_line_bytes: 2000
        warning_average_line_bytes: 350
        error_lines: 800
        error_bytes: 102400
        error_max_line_bytes: 12000
        error_average_line_bytes: 900
      temporary_large_production:
        warning_lines: 500
        warning_bytes: 61440
        warning_max_line_bytes: 2000
        warning_average_line_bytes: 350
        error_lines: 1800
        error_bytes: 102400
        error_max_line_bytes: 12000
        error_average_line_bytes: 900
      tests:
        warning_lines: 900
        warning_max_line_bytes: 3000
        warning_average_line_bytes: 500
        error_lines: 1400
        error_max_line_bytes: 12000
        error_average_line_bytes: 1200
      scripts:
        warning_lines: 1000
        warning_max_line_bytes: 3000
        warning_average_line_bytes: 500
        error_lines: 1400
        error_max_line_bytes: 12000
        error_average_line_bytes: 1200
      spec_yaml:
        warning_lines: 800
        warning_max_line_bytes: 4000
        warning_average_line_bytes: 800
        error_lines: 1200
        error_max_line_bytes: 16000
        error_average_line_bytes: 1600
      temporary_large_spec_yaml:
        warning_lines: 800
        warning_max_line_bytes: 4000
        warning_average_line_bytes: 800
        error_lines: 1400
        error_max_line_bytes: 16000
        error_average_line_bytes: 1600
      release_gate_registry:
        warning_lines: 5000
        warning_max_line_bytes: 4000
        warning_average_line_bytes: 800
        error_lines: 8000
        error_max_line_bytes: 16000
        error_average_line_bytes: 1600
      temporary_large_generated:
        warning_lines: 2000
        warning_max_line_bytes: 16000
        warning_average_line_bytes: 1600
        error_lines: 8000
        error_max_line_bytes: 64000
        error_average_line_bytes: 6400
      proto_schema:
        warning_lines: 500
        warning_bytes: 61440
        warning_max_line_bytes: 3000
        warning_average_line_bytes: 500
        error_lines: 900
        error_bytes: 102400
        error_max_line_bytes: 12000
        error_average_line_bytes: 1200
      generated:
        warning_lines: 2000
        warning_max_line_bytes: 16000
        warning_average_line_bytes: 1600
        error_lines: 4000
        error_max_line_bytes: 64000
        error_average_line_bytes: 6400
      structured_data:
        warning_lines: 1200
        warning_bytes: 61440
        warning_max_line_bytes: 1000
        warning_average_line_bytes: 250
        error_lines: 3000
        error_bytes: 102400
        error_max_line_bytes: 4000
        error_average_line_bytes: 800
      openapi_bundle:
        warning_lines: 12000
        warning_bytes: 262144
        warning_max_line_bytes: 4000
        warning_average_line_bytes: 250
        error_lines: 24000
        error_bytes: 1048576
        error_max_line_bytes: 16000
        error_average_line_bytes: 800
    classifiers:
      openapi_bundle:
        - config/realm-openapi/api-nimi.yaml
      temporary_large_generated:
        - config/*-public-surface-baseline.json
      temporary_large_production:
        - .nimi/spec/runtime/kernel/runtime-agent-service-contract.md
        - apps/desktop/src-tauri/src/desktop_product_control/operations.rs
        - apps/desktop/src/shell/renderer/first-run/product-control-workflow.tsx
        - runtime/internal/services/localservice/local_environment_jobs.go
      temporary_large_spec_yaml:
        - runtime/catalog/source/providers/local.source.yaml
        - spec/runtime/kernel/tables/rule-evidence.rules.yaml
        - .nimi/spec/runtime/kernel/tables/rule-evidence.rules.yaml
      release_gate_registry:
        - .nimi/spec/platform/kernel/tables/release-gate-registry.yaml
      proto_schema:
        - proto/**/*.proto
      scripts:
        - scripts/**
      tests:
        - "**/*.test.js"
        - "**/*.test.ts"
        - "**/*.test.mjs"
        - "**/*.test.tsx"
        - "**/*.spec.js"
        - "**/*.spec.ts"
        - "**/*.spec.mjs"
        - "**/*.spec.tsx"
        - "**/*_tests.rs"
        - "**/*_test.go"
        - "**/*_test.py"
        - "**/test_*.py"
        - "**/test/**/*.js"
        - "**/test/**/*.mjs"
        - "**/test/**/*.ts"
        - "**/test/**/*.tsx"
        - "**/__tests__/**"
        - "**/e2e/fixtures/**"
      spec_yaml:
        - .nimi/spec/**/*.yaml
        - .nimi/spec/**/*.yml
        - spec/**/*.yaml
        - spec/**/*.yml
        - apps/**/spec/**/*.yaml
        - apps/**/spec/**/*.yml
      generated:
        - .nimi/spec/**/kernel/generated/**
        - kit/design-projection.json
        - kit/auth/src/logic/native-oauth-result-logo.ts
        - runtime/internal/providerregistry/generated.go
        - runtime/catalog/providers/**
        - runtime/catalog/generated/**
        - runtime/gen/**
        - sdks/**/core-generated/**
        - spec/**/kernel/generated/**
      structured_data:
        - apps/desktop/src/shell/renderer/locales/**/*.json
        - apps/avatar/assets/lip-sync/**/*.json
    exclude:
      - _external/**
      - .cache/**
      - .iterate/**
      - archive/**
      - docs/**
      - .local/**
      - .github/workflows/release.yml
      - .nimi/spec/desktop/kernel/tables/rule-evidence.rules.yaml
      - .nimi/spec/platform/kernel/tables/nimi-ui-tokens.yaml
      - .nimi/spec/runtime/kernel/tables/rule-evidence.rules.yaml
      - runtime/catalog/source/providers/dashscope.source.yaml
      - "**/generated/**"
      - "**/gen/**"
      - "**/core_generated/**"
      - "**/core-generated/**"
      - "**/coregenerated/**"
      - runtime/**/*.pb.go
      - runtime/**/*.binpb
      - spec/generated/**
      - pnpm-lock.yaml
      - "**/Cargo.lock"
      - apps/desktop/src-tauri/gen/**
      - "**/*.ico"
      - "**/*.icns"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.webp"
      - "**/*.svg"
      - "**/*.frag"
      - "**/*.vert"
      - "**/*.min.js"
      - "**/*.wav"
      - "**/*.mp3"
      - "**/*.m4a"
      - "**/*.ogg"
      - "**/*.flac"
      - "**/*.aac"
      - "**/*.mp4"
      - "**/*.mov"
      - "**/*.webm"
      - "**/*.vrm"
      - "**/*.vrma"
      - "**/*.css"
      - "**/locales/en.json"
      - "**/locales/zh.json"
    waivers:
  structure_budget:
    version: 1
    allowed_forwarding_shells:
      - index.ts
      - index.tsx
      - mod.rs
    rules:
      - id: runtime_internal
        include:
          - runtime/internal/**
        depth_base: runtime/internal
        warning_depth: 4
        error_depth: 5
      - id: runtime_cmd
        include:
          - runtime/cmd/nimi/**
        depth_base: runtime/cmd/nimi
        warning_depth: 3
        error_depth: 4
      - id: sdks_typescript
        include:
          - sdks/typescript/**
        depth_base: sdks/typescript
        warning_depth: 4
        error_depth: 5
      - id: desktop_tauri
        include:
          - apps/desktop/src-tauri/src/**
        depth_base: apps/desktop/src-tauri/src
        warning_depth: 4
        error_depth: 5
      - id: desktop_src
        include:
          - apps/desktop/src/**
        depth_base: apps/desktop/src
        warning_depth: 6
        error_depth: 7
      - id: web_src
        include:
          - apps/web/src/**
        depth_base: apps/web/src
        warning_depth: 4
        error_depth: 5
      - id: scripts
        include:
          - scripts/**
        depth_base: scripts
        warning_depth: 3
        error_depth: 4
      - id: nimi_cognition
        include:
          - nimi-cognition/**
        depth_base: nimi-cognition
        warning_depth: 4
        error_depth: 5
    exclude:
      - _external/**
      - .cache/**
      - .iterate/**
      - archive/**
      - docs/**
      - .local/**
      - "**/generated/**"
      - "**/gen/**"
      - "**/core_generated/**"
      - "**/core-generated/**"
      - "**/coregenerated/**"
      - runtime/**/*.pb.go
      - runtime/**/*.binpb
      - spec/generated/**
      - pnpm-lock.yaml
      - "**/Cargo.lock"
      - apps/desktop/src-tauri/gen/**
      - "**/*.ico"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.webp"
      - "**/*.svg"
      - "**/*.frag"
      - "**/*.vert"
      - "**/*.vrm"
      - "**/*.vrma"
      - "**/*.min.js"
      - "**/*.css"
      - "**/locales/en.json"
      - "**/locales/zh.json"
    waivers:
  high_risk_doc_metadata:
    doc_roots:
      - .local
    exempt_paths: []
    name_patterns:
      - design
      - audit
      - implementation-plan
      - architecture
      - refactor
      - refactory
      - remediation-plan
      - unification
      - migration
    required_metadata_keys:
      - Spec Status
      - Authority Owner
      - Work Type
      - Parallel Truth
