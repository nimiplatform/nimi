profile_id: nimi

spec_governance:
  canonical_root: .nimi/spec
  validate_commands:
    apps/avatar:
      - pnpm check:apps-avatar-isolation

ai_governance:
  agents_freshness:
    targets:
      - rel: AGENTS.md
        max_lines: 40
      - rel: runtime/AGENTS.md
        max_lines: 30
      - rel: sdks/AGENTS.md
        max_lines: 30
      - rel: scripts/AGENTS.md
        max_lines: 30
      - rel: apps/desktop/AGENTS.md
        max_lines: 30
      - rel: apps/web/AGENTS.md
        max_lines: 30
      - rel: apps/install-gateway/AGENTS.md
        max_lines: 30
      - rel: kit/AGENTS.md
        max_lines: 30
      - rel: proto/AGENTS.md
        max_lines: 30
      - rel: app-tools/AGENTS.md
        max_lines: 60
      - rel: app-tools/templates/default-starter/AGENTS.md
        max_lines: 60
      - rel: apps/avatar/AGENTS.md
        max_lines: 80
      - rel: apps/tester/AGENTS.md
        max_lines: 60
      - rel: apps/zhiyu/AGENTS.md
        max_lines: 60
      - rel: gateways/AGENTS.md
        max_lines: 60
      - rel: kit/ui/AGENTS.md
        max_lines: 60
      - rel: nimi-cognition/AGENTS.md
        max_lines: 60
      - rel: runtime/catalog/source/AGENTS.md
        max_lines: 60
      - rel: nimi2d/AGENTS.md
        max_lines: 60
      - rel: tests/local-agent-product/AGENTS.md
        max_lines: 60
    required_sections:
      - "## Scope"
      - "## Hard Boundaries"
      - "## Retrieval Defaults"
      - "## Verification Commands"
    stale_tokens:
      - local_ai_runtime
      - runtime-ai-media-coverage
      - docs/refactory
  context_budget:
    version: 1
    default_profile: production
    profiles:
      production:
        warning_lines: 500
        warning_bytes: 61440
        warning_max_line_bytes: 2000
        warning_average_line_bytes: 350
        error_lines: 800
        error_bytes: 102400
        error_max_line_bytes: 12000
        error_average_line_bytes: 900
      temporary_large_production:
        warning_lines: 500
        warning_bytes: 61440
        warning_max_line_bytes: 2000
        warning_average_line_bytes: 350
        error_lines: 1800
        error_bytes: 102400
        error_max_line_bytes: 12000
        error_average_line_bytes: 900
      tests:
        warning_lines: 900
        warning_max_line_bytes: 3000
        warning_average_line_bytes: 500
        error_lines: 1400
        error_max_line_bytes: 12000
        error_average_line_bytes: 1200
      temporary_large_tests:
        warning_lines: 900
        warning_max_line_bytes: 3000
        warning_average_line_bytes: 500
        error_lines: 1800
        error_max_line_bytes: 12000
        error_average_line_bytes: 1200
      scripts:
        warning_lines: 1000
        warning_max_line_bytes: 3000
        warning_average_line_bytes: 500
        error_lines: 1400
        error_max_line_bytes: 12000
        error_average_line_bytes: 1200
      spec_yaml:
        warning_lines: 800
        warning_max_line_bytes: 4000
        warning_average_line_bytes: 800
        error_lines: 1200
        error_max_line_bytes: 16000
        error_average_line_bytes: 1600
      temporary_large_spec_yaml:
        warning_lines: 800
        warning_max_line_bytes: 4000
        warning_average_line_bytes: 800
        error_lines: 1400
        error_max_line_bytes: 16000
        error_average_line_bytes: 1600
      temporary_large_config_inventory:
        warning_lines: 800
        warning_max_line_bytes: 4000
        warning_average_line_bytes: 800
        error_lines: 1400
        error_max_line_bytes: 16000
        error_average_line_bytes: 1600
      release_gate_registry:
        warning_lines: 5000
        warning_max_line_bytes: 4000
        warning_average_line_bytes: 800
        error_lines: 8000
        error_max_line_bytes: 16000
        error_average_line_bytes: 1600
      temporary_large_generated:
        warning_lines: 2000
        warning_max_line_bytes: 16000
        warning_average_line_bytes: 1600
        error_lines: 8000
        error_max_line_bytes: 64000
        error_average_line_bytes: 6400
      proto_schema:
        warning_lines: 500
        warning_bytes: 61440
        warning_max_line_bytes: 3000
        warning_average_line_bytes: 500
        error_lines: 900
        error_bytes: 102400
        error_max_line_bytes: 12000
        error_average_line_bytes: 1200
      generated:
        warning_lines: 2000
        warning_max_line_bytes: 16000
        warning_average_line_bytes: 1600
        error_lines: 4000
        error_max_line_bytes: 64000
        error_average_line_bytes: 6400
      structured_data:
        warning_lines: 1200
        warning_bytes: 61440
        warning_max_line_bytes: 1000
        warning_average_line_bytes: 250
        error_lines: 3000
        error_bytes: 102400
        error_max_line_bytes: 4000
        error_average_line_bytes: 800
      openapi_bundle:
        warning_lines: 12000
        warning_bytes: 262144
        warning_max_line_bytes: 4000
        warning_average_line_bytes: 250
        error_lines: 24000
        error_bytes: 1048576
        error_max_line_bytes: 16000
        error_average_line_bytes: 800
      authority_container:
        warning_lines: 2400
        warning_max_line_bytes: 4000
        warning_average_line_bytes: 800
        error_lines: 3200
        error_max_line_bytes: 16000
        error_average_line_bytes: 1600
    classifiers:
      openapi_bundle:
        - config/realm-openapi/api-nimi.yaml
      authority_container:
        - .nimi/spec/**/*.authority.yaml
      temporary_large_generated:
        - config/*-public-surface-baseline.json
        - sdks/typescript/runtime/wire-types/index.ts
        - kit/design-projection.json
      temporary_large_production:
        - apps/desktop/scripts/run-e2e.mjs
        - apps/desktop/src-tauri/src/desktop_open_intent.rs
        - apps/desktop/src-tauri/src/desktop_product_control/operations.rs
        - apps/desktop/src/shell/renderer/first-run/product-control-workflow.tsx
        - kit/features/agent-center/src/components/AgentCenterAppearanceSection.tsx
        - kit/shell/tauri/src/runtime_bridge/metadata.rs
        - kit/shell/tauri/src/standard_desktop_open.rs
        - runtime/internal/services/localservice/local_environment_jobs.go
        - sdks/typescript/runtime/runtime-agent-turn-runner-stream.ts
      temporary_large_tests:
        - apps/tester/test/tester-media-scenario-jobs.test.mjs
        - kit/shell/electron/test/electron-shell.test.ts
        - runtime/internal/services/runtimeagent/public_chat_voice_lipsync_emission_test.go
        - sdks/typescript/runtime/runtime-agent-consume.test.ts
        - sdks/typescript/runtime/runtime-agent-helpers.test.ts
        - sdks/typescript/runtime/runtime-agent-live-e2e-fixture-realm-server.test-helper.ts
