version: 1
product:
  package_name: "@nimiplatform/nimi-coding"
  repository_stage: prelaunch
truth_model:
  root: ".nimi"
  methodology_in_project: true
  ai_native_first: true
  human_projection: derived_only
execution_bootstrap:
  self_hosting: false
  current_governance_mode: external_host_owned
  host_execution_owner: external_ai_host
methodology_posture:
  risk_shape: authority_bearing_or_high_risk_only
  execution_mode: host_owned
  continuity_model: continuity_agnostic
entry_policy:
  high_risk_work_requires_methodology: true
  host_workflow_state_must_not_be_mirrored: true
deferred_surfaces:
  - skill_runtime
  - skill_installation_runtime
  - self_hosting_execution
forbidden_surfaces:
  - topic_lifecycle
  - wave_dag
  - packet_orchestration
  - run_ledger
  - goal_bridge
  - nested_ai_host
