version: 1
authority_convergence_policy:
  gate_id: pre_implementation_authority_convergence
  purpose: >
    Require an independent auditor pass after authority/spec changes and before
    implementation dispatch, without making any concrete AI host runtime part of
    nimicoding semantic truth.
  trigger_conditions:
    - authority_owner_is_unclear
    - canonical_spec_is_missing_or_conflicting
    - redesign_changes_canonical_ownership
    - cross_owner_change_can_create_parallel_truth
  trigger_ref_prefixes:
    - .nimi/spec/
  required_result:
    result_kind: authority_convergence_audit
    pass_verdict: PASS
  post_update_review:
    trigger_conditions:
      - canonical_authority_changed
      - canonical_ownership_changed
    trigger_ref_prefixes:
      - .nimi/spec/
    required_result:
      result_kind: authority_convergence_audit
      pass_verdict: PASS
  blocked_verdicts:
    - NEEDS_REVISION
    - FAIL
  hard_constraints:
    - auditor_output_is_candidate_evidence_only
    - unresolved_blocking_findings_fail_closed
    - deferred_items_must_be_explicitly_non_blocking
    - external_ai_host_owns_task_and_subagent_mechanics
    - methodology_must_not_create_or_advance_host_workflow_state
