version: 1
four_closure_policy:
  closures:
    - authority
    - semantic
    - consumer
    - drift_resistance
  rule:
    all_four_must_be_explicit_for_acceptance: true
  acceptance_evidence:
    require_authority_refs: true
    require_validation_evidence: true
    require_consumer_evidence_when_affected: true
    require_drift_resistance_checks: true
  authority_examples:
    - canonical_owner_is_unique
    - no_parallel_truth_remains
  semantic_examples:
    - required_fields_and_failure_modes_are_pinned
    - complex_cases_are_not_deferred_as_assumptions
  consumer_examples:
    - normal_consumers_use_the_correct_seam
    - shortcuts_cannot_silently_become_mainline_truth
  drift_resistance_examples:
    - forbidden_shortcuts_are_explicit
    - future_implementers_cannot_easily_thin_the_design
