version: 1
projection_contract:
  id: delegated_skill_exchange_projection
  owner: nimi_host_projection
  locality: host_project
  truth_mode: fail_closed
  exchange_surfaces:
    - handoff
    - closeout
  output_modes:
    - human_readable
    - json
    - prompt
  handoff_payload:
    required_fields:
      - contractVersion
      - projectRoot
      - runtimeOwner
      - triggerMode
      - handoffReady
      - skill.id
      - skill.required
      - skill.source
      - skill.purpose
      - skill.resultContractRef
      - skill.readiness.ok
      - context.orderedPaths
      - constraints
      - expectedResults
      - contracts.exchangeProjectionContractRef
    optional_fields:
      - doctor
      - nextAction
  closeout_payload:
    required_fields:
      - contractVersion
      - projectRoot
      - skill.id
      - outcome
      - verifiedAt
      - localOnly
      - artifactPath
      - readiness.ok
      - contracts.exchangeProjectionContractRef
    optional_fields:
      - doctor
      - nextAction
      - skill.expectedArtifactRoots
      - summary
  hard_constraints:
    - do_not_promote_projection_payloads_to_semantic_truth
    - imported_closeout_summaries_must_match_current_project
    - missing_required_projection_fields_must_fail_closed
    - completed_projection_claims_must_match_declared_canonical_tree_state
    - exchange_projection_must_not_create_or_mirror_host_workflow_state
