version: 1
role_separation_policy:
  roles:
    authority_owner:
      owns:
        - canonical_authority
        - semantic_decisions
        - acceptance_criteria
      must_not:
        - use_operational_host_state_as_product_truth
    external_ai_host:
      owns:
        - task_lifecycle
        - planning_and_decomposition
        - subagent_dispatch
        - waiting_resume_and_completion_state
      must_not:
        - redefine_canonical_authority
        - promote_runtime_state_to_semantic_truth
    auditor:
      owns:
        - structural_review
        - drift_detection
        - acceptance_evidence_review
        - authority_convergence_evidence
      must_not:
        - silently_turn_missing_scope_into_future_follow_up
        - mutate_authority_or_implementation_while_auditing
        - decide_semantic_acceptance
