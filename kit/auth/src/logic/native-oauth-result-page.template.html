<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>__PAGE_TITLE__</title>
    <style>
        :root {
            color-scheme: light dark;
            --oauth-bg: __BODY_BACKGROUND__;
            --oauth-card-bg: rgba(255, 255, 255, 0.94);
            --oauth-card-border: rgba(15, 23, 42, 0.08);
            --oauth-card-shadow: 0 24px 48px -12px rgba(15, 23, 42, 0.16);
            --oauth-heading: #111827;
            --oauth-body: #4b5563;
            --oauth-pill-bg: #f3f4f6;
            --oauth-pill-text: #4b5563;
            --oauth-dot: #6b7280;
            --oauth-accent: #1476d4;
            --oauth-accent-hover: #0f62b5;
            --oauth-focus: #1476d4;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-optical-sizing: auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--oauth-bg);
            color: var(--oauth-heading);
            padding: 1.5rem;
        }
        .container {
            text-align: center;
            padding: 3rem 2.5rem;
            background: var(--oauth-card-bg);
            border: 1px solid var(--oauth-card-border);
            border-radius: 1.75rem;
            box-shadow: var(--oauth-card-shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            max-width: 28.75rem;
            width: 100%;
            animation: slideUp 0.36s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo_wrapper {
            margin-bottom: 1.75rem;
            animation: __LOGO_ANIMATION_NAME__ __LOGO_ANIMATION_DURATION__ ease-in-out __LOGO_ANIMATION_REPEAT__;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .logo {
            width: 8rem;
            height: 8rem;
            filter: __LOGO_FILTER__;
            object-fit: contain;
        }
        .status_wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .success_icon,
        .error_icon {
            width: 1.75rem;
            height: 1.75rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .success_icon {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            animation: __SUCCESS_ICON_ANIMATION__;
        }
        .error_icon {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            animation: __ERROR_ICON_ANIMATION__;
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.7); }
            to { opacity: 1; transform: scale(1); }
        }
        .checkmark,
        .x_mark {
            width: 1rem;
            height: 1rem;
            stroke: #ffffff;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        h1 {
            color: var(--oauth-heading);
            font-size: 1.625rem;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.02em;
            animation: __HEADING_ANIMATION__;
        }
        p {
            color: var(--oauth-body);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 0.5rem;
            animation: __MESSAGE_ANIMATION__;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .auto_close {
            margin-top: 1.5rem;
            padding: 0.75rem 1.25rem;
            background: var(--oauth-pill-bg);
            color: var(--oauth-pill-text);
            border-radius: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            animation: __ACTION_ANIMATION__;
        }
        .dots {
            display: inline-flex;
            gap: 0.25rem;
        }
        .dot {
            width: 0.25rem;
            height: 0.25rem;
            background: var(--oauth-dot);
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite both;
        }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.4); opacity: 0.45; }
            40% { transform: scale(1); opacity: 1; }
        }
        .retry_btn {
            margin-top: 1.5rem;
            padding: 0.75rem 1.75rem;
            background: var(--oauth-accent);
            color: #ffffff;
            border: 1px solid transparent;
            border-radius: 0.75rem;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            animation: __ACTION_ANIMATION__;
            transition: background-color 150ms cubic-bezier(0.22, 1, 0.36, 1), transform 150ms cubic-bezier(0.22, 1, 0.36, 1);
        }
        .retry_btn:hover {
            background: var(--oauth-accent-hover);
        }
        .retry_btn:active {
            transform: scale(0.97);
        }
        .retry_btn:focus-visible {
            outline: 2px solid var(--oauth-focus);
            outline-offset: 2px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --oauth-bg: #0f172a;
                --oauth-card-bg: rgba(17, 24, 39, 0.94);
                --oauth-card-border: rgba(255, 255, 255, 0.12);
                --oauth-card-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.55);
                --oauth-heading: #f8fafc;
                --oauth-body: #cbd5e1;
                --oauth-pill-bg: #1e293b;
                --oauth-pill-text: #cbd5e1;
                --oauth-dot: #94a3b8;
                --oauth-accent: #38bdf8;
                --oauth-accent-hover: #0ea5e9;
                --oauth-focus: #38bdf8;
            }
            .retry_btn {
                color: #0f172a;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .container,
            .logo_wrapper,
            .success_icon,
            .error_icon,
            h1,
            p,
            .auto_close,
            .dot,
            .retry_btn {
                animation: none !important;
                transition: none !important;
            }
            .retry_btn:active {
                transform: none;
            }
        }
        @media (prefers-reduced-transparency: reduce) {
            .container {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: #ffffff;
            }
            @media (prefers-color-scheme: dark) {
                .container {
                    background: #111827;
                }
            }
        }
        @media (prefers-contrast: more) {
            .container {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: #ffffff;
                border: 2px solid #0f172a;
            }
            .retry_btn {
                border-color: #0f172a;
            }
            @media (prefers-color-scheme: dark) {
                .container {
                    background: #020617;
                    border: 2px solid #f8fafc;
                }
                .retry_btn {
                    border-color: #f8fafc;
                }
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo_wrapper">
            <img class="logo" src="__LOGO_DATA_URI__" alt="Nimi" aria-label="Nimi" />
        </div>
        <div class="status_wrapper">
            <div class="__STATUS_ICON_CLASS__">
                __STATUS_ICON_SVG__
            </div>
            <h1>__HEADING__</h1>
        </div>
        <p>__MESSAGE_PRIMARY__</p>
        __MESSAGE_SECONDARY_BLOCK__
        __ACTION_BLOCK__
    </div>
    __AUTO_CLOSE_SCRIPT__
</body>
</html>
