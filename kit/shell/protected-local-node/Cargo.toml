[package]
name = "nimi-shell-protected-local-node"
version = "0.1.0"
edition = "2021"
description = "Node-API projection of the Nimi protected-local Local App carrier."
license = "MIT"
repository = "https://github.com/nimiplatform/nimi"
readme = "README.md"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = []
windows-e2e-fixture = ["nimi-shell-protected-local/windows-e2e-fixture"]
macos-local-development = ["nimi-shell-protected-local/macos-local-development"]

[dependencies]
base64 = "0.22"
napi = { version = "3", features = ["napi8", "tokio_rt", "serde-json"] }
napi-derive = "3"
nimi-shell-protected-local = { path = "../protected-local" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[build-dependencies]
napi-build = "2"
