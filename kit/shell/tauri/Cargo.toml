[package]
name = "nimi-shell-tauri"
version = "0.11.0"
edition = "2021"
description = "Shared Tauri host glue for Nimi apps — runtime bridge, daemon lifecycle, session logging, auth/oauth commands, runtime defaults."
license = "MIT"
repository = "https://github.com/nimiplatform/nimi"
readme = "README.md"

[dependencies]
tauri = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
base64 = "0.23"
sha2 = "0.11"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rfd = "0.17"
webbrowser = "1"
futures-util = "0.3"
getrandom = "0.4"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
nimi-shell-protected-local = { version = "0.11.1", path = "../protected-local" }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
serde-saphyr = "2"

[features]
default = []
test-observability = []
