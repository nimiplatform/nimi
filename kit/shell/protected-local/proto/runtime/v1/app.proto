syntax = "proto3";

package nimi.runtime.v1;

option go_package = "github.com/nimiplatform/nimi/runtime/gen/runtime/v1;runtimev1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "runtime/v1/common.proto";

enum AppMessageEventType {
  APP_MESSAGE_EVENT_TYPE_UNSPECIFIED = 0;
  APP_MESSAGE_EVENT_RECEIVED = 1;
  APP_MESSAGE_EVENT_ACKED = 2;
  APP_MESSAGE_EVENT_FAILED = 3;
}

message SendAppMessageRequest {
  reserved 7;
  reserved "scoped_binding";
  string from_app_id = 1;
  string to_app_id = 2;
  string subject_user_id = 3;
  string message_type = 4;
  google.protobuf.Struct payload = 5;
  bool require_ack = 6;
}

message SendAppMessageResponse {
  string message_id = 1;
  bool accepted = 2;
  ReasonCode reason_code = 3;
}

message SubscribeAppMessagesRequest {
  reserved 5;
  reserved "scoped_binding";
  string app_id = 1;
  string subject_user_id = 2;
  // Cursor replay is not admitted by K-APP-007. Runtime rejects non-empty
  // cursor values with INVALID_ARGUMENT + PROTOCOL_ENVELOPE_INVALID.
  string cursor = 3;
  repeated string from_app_ids = 4;
  // Local-app carrier selector only. These fields never establish caller,
  // Agent ownership, conversation ownership, grant, or session authority;
  // Runtime accepts them only on the verified local_app_host transport and
  // revalidates them in the operation owner.
  string local_agent_ref = 6;
  string conversation_anchor_id = 7;
}

message AppMessageEvent {
  AppMessageEventType event_type = 1;
  uint64 sequence = 2;
  string message_id = 3;
  string from_app_id = 4;
  string to_app_id = 5;
  string subject_user_id = 6;
  string message_type = 7;
  google.protobuf.Struct payload = 8;
  ReasonCode reason_code = 9;
  string trace_id = 10;
  google.protobuf.Timestamp timestamp = 11;
}

// AppStorageState describes current app-private storage independently of any
// deferred ordinary package lifecycle.
enum AppStorageState {
  APP_STORAGE_STATE_UNSPECIFIED = 0;
  APP_STORAGE_STATE_READY = 1;
  reserved 2;
  reserved "APP_STORAGE_STATE_INSTALL_REQUIRED";
  APP_STORAGE_STATE_REPAIR_REQUIRED = 3;
  APP_STORAGE_STATE_STORAGE_UNAVAILABLE = 4;
}

// AppStorageProjection is the stable Runtime-owned app-private storage truth
// surface (K-APP-022). data/cache/tmp are principal-partitioned roots under the
// selected nimi_data root. Ordinary release roots and versions are deferred.
message AppStorageProjection {
  string app_id = 1;
  AppStorageState state = 2;
  string app_root = 3;
  reserved 4;
  reserved "active_release_root";
  string durable_data_root = 5;
  string cache_root = 6;
  string temp_root = 7;
  reserved 8;
  reserved "active_version";
  string storage_policy_ref = 9;
  ReasonCode reason_code = 10;
  string detail = 11;
}

message GetAppStorageRequest {
  // app_id is correlation-only and must match the verified principal/record
  // binding. Runtime never uses it as authority or an app-id fallback.
  string app_id = 1;
}

message GetAppStorageResponse {
  AppStorageProjection projection = 1;
}

// Protected local-app JSON storage requests carry only a canonical relative
// path. Runtime derives the current principal partition from the verified
// process-bound session and exact operation grant.
message ReadLocalAppStorageJsonRequest {
  string relative_path = 1;
}

message ReadLocalAppStorageJsonResponse {
  bytes json_value = 1;
  int64 size_bytes = 2;
  ReasonCode reason_code = 3;
}

message WriteLocalAppStorageJsonRequest {
  string relative_path = 1;
  bytes json_value = 2;
}

message WriteLocalAppStorageJsonResponse {
  bytes json_value = 1;
  int64 size_bytes = 2;
  ReasonCode reason_code = 3;
}

message RemoveLocalAppStorageJsonRequest {
  string relative_path = 1;
}

message RemoveLocalAppStorageJsonResponse {
  bool removed = 1;
  ReasonCode reason_code = 2;
}

// LocalAppAssetRecord is public metadata for one committed App-private asset.
// Runtime derives its owner from the protected session and never exposes a
// physical path or producer identity here.
message LocalAppAssetRecord {
  string relative_path = 1;
  string media_type = 2;
  int64 size_bytes = 3;
  string sha256 = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message StatLocalAppAssetRequest {
  string relative_path = 1;
}

message StatLocalAppAssetResponse {
  LocalAppAssetRecord asset = 1;
  ReasonCode reason_code = 2;
}

message ListLocalAppAssetsRequest {
  string prefix = 1;
  string cursor = 2;
  int32 page_size = 3;
}

message ListLocalAppAssetsResponse {
  repeated LocalAppAssetRecord assets = 1;
  string next_cursor = 2;
  ReasonCode reason_code = 3;
}

message WriteLocalAppAssetMetadata {
  string relative_path = 1;
  string media_type = 2;
  bool overwrite = 3;
}

message WriteLocalAppAssetRequest {
  oneof frame {
    WriteLocalAppAssetMetadata metadata = 1;
    bytes body_chunk = 2;
  }
}

message WriteLocalAppAssetResponse {
  LocalAppAssetRecord asset = 1;
  ReasonCode reason_code = 2;
}

message ReadLocalAppAssetRequest {
  string relative_path = 1;
  optional int64 offset = 2;
  optional int64 length = 3;
}

message LocalAppAssetRange {
  int64 offset = 1;
  int64 length = 2;
  int64 total_size = 3;
}

message ReadLocalAppAssetMetadata {
  LocalAppAssetRecord asset = 1;
  LocalAppAssetRange range = 2;
}

message ReadLocalAppAssetResponse {
  oneof frame {
    ReadLocalAppAssetMetadata metadata = 1;
    bytes body_chunk = 2;
  }
}

message RemoveLocalAppAssetRequest {
  string relative_path = 1;
}

message RemoveLocalAppAssetResponse {
  bool removed = 1;
  ReasonCode reason_code = 2;
}

message MoveLocalAppAssetRequest {
  string from_relative_path = 1;
  string to_relative_path = 2;
  bool overwrite = 3;
}

message MoveLocalAppAssetResponse {
  LocalAppAssetRecord asset = 1;
  ReasonCode reason_code = 2;
}

// Purpose-specific host-only reveal. The renderer and SDK supply only the
// canonical App-relative path and never receive absolute_path; the native
// protected Host consumes it inside the reveal call and returns only success.
message RevealLocalAppAssetRequest {
  string relative_path = 1;
}

message RevealLocalAppAssetResponse {
  LocalAppAssetRecord asset = 1;
  string absolute_path = 2;
  ReasonCode reason_code = 3;
}

message AdoptLocalAppArtifactRequest {
  string artifact_id = 1;
  string relative_path = 2;
  bool overwrite = 3;
}

message AdoptLocalAppArtifactResponse {
  LocalAppAssetRecord asset = 1;
  ReasonCode reason_code = 2;
}

// === Shared local-app protected launch (K-APP-017 / K-PLOCAL-008) ===

message PrepareLocalAppLaunchRequest {
  // Runtime-generated management handle resolving an active development
  // registration. It is not the Registered App Subject, an account selector,
  // an access decision, a path, or a credential.
  bytes local_app_handle = 1;
  // Required only for a live local_development supervisor run.
  bytes supervisor_run_id = 2;
}

message PrepareLocalAppLaunchResponse {
  bytes launch_id = 1;
  google.protobuf.Timestamp bind_deadline = 2;
  ReasonCode reason_code = 3;
}

message BindLocalAppProcessRequest {
  bytes launch_id = 1;
  uint32 child_process_id = 2;
}

message BindLocalAppProcessResponse {
  bytes launch_id = 1;
  google.protobuf.Timestamp bind_deadline = 2;
  ReasonCode reason_code = 3;
}

// Source-only per-user D2 reauthorizes the already-running exact Desktop
// child after Runtime loss. Runtime derives all authority from the protected
// Desktop connection, current registration/run, and fresh kernel process
// witness; the request carries no App principal or credential.
message RebindLocalAppProcessRequest {
  bytes launch_id = 1;
  uint32 child_process_id = 2;
}

message RebindLocalAppProcessResponse {
  bytes launch_id = 1;
  google.protobuf.Timestamp bind_deadline = 2;
  ReasonCode reason_code = 3;
}

enum AppPackageSourceClass {
  APP_PACKAGE_SOURCE_CLASS_UNSPECIFIED = 0;
  APP_PACKAGE_SOURCE_CLASS_VERIFIED = 1;
  reserved 2;
  reserved "APP_PACKAGE_SOURCE_CLASS_USER_IMPORTED";
}

enum AppPackageJobKind {
  APP_PACKAGE_JOB_KIND_UNSPECIFIED = 0;
  APP_PACKAGE_JOB_KIND_INSTALL = 1;
  APP_PACKAGE_JOB_KIND_UPDATE = 2;
  APP_PACKAGE_JOB_KIND_REPAIR = 3;
  APP_PACKAGE_JOB_KIND_UNINSTALL = 4;
}

enum AppPackageJobPhase {
  APP_PACKAGE_JOB_PHASE_UNSPECIFIED = 0;
  APP_PACKAGE_JOB_PHASE_QUEUED = 1;
  APP_PACKAGE_JOB_PHASE_DOWNLOADING = 2;
  reserved 3;
  reserved "APP_PACKAGE_JOB_PHASE_READING_LOCAL";
  APP_PACKAGE_JOB_PHASE_VERIFYING = 4;
  APP_PACKAGE_JOB_PHASE_VERIFYING_INSTALLED = 5;
  APP_PACKAGE_JOB_PHASE_ACQUIRING_MISSING = 6;
  APP_PACKAGE_JOB_PHASE_STAGING = 7;
  APP_PACKAGE_JOB_PHASE_COMMITTING = 8;
  APP_PACKAGE_JOB_PHASE_REMOVING_PACKAGE = 10;
  APP_PACKAGE_JOB_PHASE_UNREGISTERING = 11;
  APP_PACKAGE_JOB_PHASE_COMPLETED = 12;
  APP_PACKAGE_JOB_PHASE_FAILED = 13;
  APP_PACKAGE_JOB_PHASE_CANCELED = 14;
  reserved 9;
  reserved "APP_PACKAGE_JOB_PHASE_STOPPING_HOST";
}

enum AppPackageProgressBasis {
  APP_PACKAGE_PROGRESS_BASIS_UNSPECIFIED = 0;
  APP_PACKAGE_PROGRESS_BASIS_BYTES = 1;
  APP_PACKAGE_PROGRESS_BASIS_STEPS = 2;
  APP_PACKAGE_PROGRESS_BASIS_INDETERMINATE = 3;
}

enum AppPackageTerminalResult {
  APP_PACKAGE_TERMINAL_RESULT_UNSPECIFIED = 0;
  APP_PACKAGE_TERMINAL_RESULT_COMPLETED = 1;
  APP_PACKAGE_TERMINAL_RESULT_FAILED = 2;
  APP_PACKAGE_TERMINAL_RESULT_CANCELED = 3;
}

message CommittedAppRelease {
  string app_id = 1;
  AppPackageSourceClass source_class = 2;
  string version = 3;
  string release_ref = 4;
  bytes launch_selector = 5;
  reserved 6 to 11;
  reserved "registration_handle", "immutable_lineage_id", "provenance_attestation_refs", "provenance_revision", "execution_profile_ref", "host_executable_digest", "payload_root_digest";
  google.protobuf.Timestamp committed_at = 12;
}

message AppPackageJob {
  bytes job_id = 1;
  string app_id = 2;
  AppPackageSourceClass source_class = 3;
  AppPackageJobKind kind = 4;
  string target_ref = 5;
  AppPackageJobPhase phase = 6;
  AppPackageProgressBasis progress_basis = 7;
  uint64 bytes_completed = 8;
  optional uint64 bytes_total = 9;
  uint64 steps_completed = 10;
  optional uint64 steps_total = 11;
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp completed_at = 13;
  AppPackageTerminalResult terminal_result = 14;
  string reason_code = 15;
  bool cancelable = 16;
}

message ListCommittedAppReleasesRequest {}

message ListCommittedAppReleasesResponse {
  repeated CommittedAppRelease releases = 1;
  ReasonCode reason_code = 2;
}

message ListAppPackageJobsRequest {}

message ListAppPackageJobsResponse {
  repeated AppPackageJob jobs = 1;
  ReasonCode reason_code = 2;
}

message GetAppPackageJobRequest {
  bytes job_id = 1;
}

message GetAppPackageJobResponse {
  AppPackageJob job = 1;
  ReasonCode reason_code = 2;
}

message StartAppPackageInstallRequest {
  bytes approved_target_selector = 1;
}

message StartAppPackageInstallResponse {
  AppPackageJob job = 1;
  ReasonCode reason_code = 2;
}

message CancelAppPackageJobRequest {
  bytes job_id = 1;
  AppPackageJobPhase expected_phase = 2;
  string reason_code = 3;
}

message CancelAppPackageJobResponse {
  AppPackageJob job = 1;
  ReasonCode reason_code = 2;
}

// Desktop-protected Runtime owner projection. StartAppPackageInstall remains
// excluded from every shipped protected profile until the Desktop confirmation
// and install-availability cutover land together. local_development is absent
// from every package enum and request.
service RuntimeAppPackageService {
  rpc ListCommittedAppReleases(ListCommittedAppReleasesRequest) returns (ListCommittedAppReleasesResponse);
  rpc ListAppPackageJobs(ListAppPackageJobsRequest) returns (ListAppPackageJobsResponse);
  rpc GetAppPackageJob(GetAppPackageJobRequest) returns (GetAppPackageJobResponse);
  rpc StartAppPackageInstall(StartAppPackageInstallRequest) returns (StartAppPackageInstallResponse);
  rpc CancelAppPackageJob(CancelAppPackageJobRequest) returns (CancelAppPackageJobResponse);
}

service RuntimeAppService {
  rpc SendAppMessage(SendAppMessageRequest) returns (SendAppMessageResponse);
  rpc SubscribeAppMessages(SubscribeAppMessagesRequest) returns (stream AppMessageEvent);

  rpc GetAppStorage(GetAppStorageRequest) returns (GetAppStorageResponse);
  rpc ReadLocalAppStorageJson(ReadLocalAppStorageJsonRequest) returns (ReadLocalAppStorageJsonResponse);
  rpc WriteLocalAppStorageJson(WriteLocalAppStorageJsonRequest) returns (WriteLocalAppStorageJsonResponse);
  rpc RemoveLocalAppStorageJson(RemoveLocalAppStorageJsonRequest) returns (RemoveLocalAppStorageJsonResponse);
  rpc StatLocalAppAsset(StatLocalAppAssetRequest) returns (StatLocalAppAssetResponse);
  rpc ListLocalAppAssets(ListLocalAppAssetsRequest) returns (ListLocalAppAssetsResponse);
  rpc WriteLocalAppAsset(stream WriteLocalAppAssetRequest) returns (WriteLocalAppAssetResponse);
  rpc ReadLocalAppAsset(ReadLocalAppAssetRequest) returns (stream ReadLocalAppAssetResponse);
  rpc RemoveLocalAppAsset(RemoveLocalAppAssetRequest) returns (RemoveLocalAppAssetResponse);
  rpc MoveLocalAppAsset(MoveLocalAppAssetRequest) returns (MoveLocalAppAssetResponse);
  rpc RevealLocalAppAsset(RevealLocalAppAssetRequest) returns (RevealLocalAppAssetResponse);
  rpc AdoptLocalAppArtifact(AdoptLocalAppArtifactRequest) returns (AdoptLocalAppArtifactResponse);
  rpc PrepareLocalAppLaunch(PrepareLocalAppLaunchRequest) returns (PrepareLocalAppLaunchResponse);
  rpc BindLocalAppProcess(BindLocalAppProcessRequest) returns (BindLocalAppProcessResponse);
  rpc RebindLocalAppProcess(RebindLocalAppProcessRequest) returns (RebindLocalAppProcessResponse);
}
