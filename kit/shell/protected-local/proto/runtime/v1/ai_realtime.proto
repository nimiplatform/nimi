syntax = "proto3";

package nimi.runtime.v1;

option go_package = "github.com/nimiplatform/nimi/runtime/gen/runtime/v1;runtimev1";

import "runtime/v1/ai.proto";
import "runtime/v1/common.proto";
import "runtime/v1/realtime_control.proto";

enum AiRealtimeAudioCodec {
  AI_REALTIME_AUDIO_CODEC_UNSPECIFIED = 0;
  AI_REALTIME_AUDIO_CODEC_PCM_S16LE = 1;
}

enum AiRealtimeTurnDetectionMode {
  AI_REALTIME_TURN_DETECTION_MODE_UNSPECIFIED = 0;
  AI_REALTIME_TURN_DETECTION_MODE_SERVER_VAD = 1;
  AI_REALTIME_TURN_DETECTION_MODE_MANUAL = 2;
}

enum AiRealtimeInteractionMode {
  AI_REALTIME_INTERACTION_MODE_UNSPECIFIED = 0;
  AI_REALTIME_INTERACTION_MODE_OWNER_CONTROLLED = 1;
  AI_REALTIME_INTERACTION_MODE_CONTINUOUS = 2;
}

message AiRealtimeAudioFormat {
  AiRealtimeAudioCodec codec = 1;
  uint32 sample_rate_hz = 2;
  uint32 channel_count = 3;
  uint32 frame_duration_ms = 4;
  uint32 maximum_frame_bytes = 5;
}

message OpenRealtimeSessionRequest {
  AiRealtimeAudioFormat input_audio = 1;
  bool audio_output_enabled = 2;
  AiRealtimeTurnDetectionMode turn_detection = 3;
  string initial_instruction = 4;
  AiRealtimeInteractionMode interaction_mode = 5;
}

message OpenRealtimeSessionResponse {
  string realtime_session_id = 1;
  string channel_id = 2;
  uint64 generation = 3;
  AiRealtimeAudioFormat negotiated_input_audio = 4;
  AiRealtimeAudioFormat negotiated_output_audio = 5;
  RealtimeControlStatus control = 6;
  AiRealtimeInteractionMode interaction_mode = 7;
}

message AiRealtimeTextInput {
  string request_id = 1;
  string text = 2;
}

message AiRealtimeAudioFrameInput {
  string input_track_id = 1;
  string utterance_id = 2;
  uint64 frame_sequence = 3;
  bytes frame = 4;
}

enum AiRealtimeOwnerContextKind {
  AI_REALTIME_OWNER_CONTEXT_KIND_UNSPECIFIED = 0;
  AI_REALTIME_OWNER_CONTEXT_KIND_INSTRUCTION = 1;
  AI_REALTIME_OWNER_CONTEXT_KIND_CONTEXT = 2;
  AI_REALTIME_OWNER_CONTEXT_KIND_SANITIZED_RESULT = 3;
}

message AiRealtimeOwnerContextInput {
  string request_id = 1;
  AiRealtimeOwnerContextKind kind = 2;
  string text = 3;
  // Optional Runtime-issued context request, never a native delegation handle.
  string context_request_id = 4;
}

message AppendRealtimeInputRequest {
  string realtime_session_id = 1;
  uint64 generation = 2;
  oneof input {
    AiRealtimeTextInput text = 10;
    AiRealtimeAudioFrameInput audio_frame = 11;
    AiRealtimeOwnerContextInput owner_context = 12;
  }
}

message AppendRealtimeInputResponse {
  Ack ack = 1;
  RealtimeControlStatus control = 2;
}

enum AiRealtimeOwnerControlKind {
  AI_REALTIME_OWNER_CONTROL_KIND_UNSPECIFIED = 0;
  AI_REALTIME_OWNER_CONTROL_KIND_COMMIT_INPUT = 1;
  AI_REALTIME_OWNER_CONTROL_KIND_START_RESPONSE = 2;
  AI_REALTIME_OWNER_CONTROL_KIND_CONTINUE_RESPONSE = 3;
  AI_REALTIME_OWNER_CONTROL_KIND_PAUSE_RESPONSE = 4;
  AI_REALTIME_OWNER_CONTROL_KIND_CANCEL_RESPONSE = 5;
  AI_REALTIME_OWNER_CONTROL_KIND_MUTE_INPUT = 6;
  AI_REALTIME_OWNER_CONTROL_KIND_UNMUTE_INPUT = 7;
}

message SubmitRealtimeOwnerControlRequest {
  string realtime_session_id = 1;
  uint64 generation = 2;
  string request_id = 3;
  AiRealtimeOwnerControlKind control = 4;
}

message SubmitRealtimeOwnerControlResponse {
  Ack ack = 1;
  RealtimeControlStatus control = 2;
}

message ReadRealtimeEventsRequest {
  string realtime_session_id = 1;
  uint64 generation = 2;
}

message AiRealtimeSessionOpened {
  AiRealtimeAudioFormat input_audio = 1;
  AiRealtimeAudioFormat output_audio = 2;
  AiRealtimeTurnDetectionMode turn_detection = 3;
  AiRealtimeInteractionMode interaction_mode = 4;
}

message AiRealtimeInputAccepted {
  string input_track_id = 1;
  string utterance_id = 2;
  uint64 frame_sequence = 3;
  string request_id = 4;
}

enum AiRealtimeSpeechState {
  AI_REALTIME_SPEECH_STATE_UNSPECIFIED = 0;
  AI_REALTIME_SPEECH_STATE_STARTED = 1;
  AI_REALTIME_SPEECH_STATE_STOPPED = 2;
}

message AiRealtimeSpeechStatus {
  string input_track_id = 1;
  string utterance_id = 2;
  AiRealtimeSpeechState state = 3;
}

message AiRealtimeTranscript {
  string input_track_id = 1;
  string utterance_id = 2;
  string text = 3;
  bool final = 4;
}

message AiRealtimeTextOutput {
  string request_id = 1;
  string output_track_id = 2;
  string text = 3;
  bool final = 4;
}

message AiRealtimeAudioFrameOutput {
  string request_id = 1;
  string output_track_id = 2;
  uint64 frame_sequence = 3;
  bytes frame = 4;
  AiRealtimeAudioFormat format = 5;
}

enum AiRealtimeOutputTrackLifecycle {
  AI_REALTIME_OUTPUT_TRACK_LIFECYCLE_UNSPECIFIED = 0;
  AI_REALTIME_OUTPUT_TRACK_LIFECYCLE_ACTIVE = 1;
  AI_REALTIME_OUTPUT_TRACK_LIFECYCLE_INTERRUPTED = 2;
  AI_REALTIME_OUTPUT_TRACK_LIFECYCLE_COMPLETED = 3;
  AI_REALTIME_OUTPUT_TRACK_LIFECYCLE_FAILED = 4;
}

message AiRealtimeOutputTrackStatus {
  string request_id = 1;
  string output_track_id = 2;
  AiRealtimeOutputTrackLifecycle lifecycle = 3;
  ReasonCode reason_code = 4;
}

message AiRealtimeRequestTerminal {
  string request_id = 1;
  FinishReason finish_reason = 2;
  UsageStats usage = 3;
  ReasonCode reason_code = 4;
}

message AiRealtimeSessionTerminal {
  ReasonCode reason_code = 1;
  AiRealtimeSessionUsage usage = 2;
  AiRealtimeSessionClosure closure = 3;
}

// Independent observations, not a guarantee that provider billing stopped.
message AiRealtimeSessionClosure {
  bool local_resources_released = 1;
  bool provider_session_closed = 2;
}

enum AiRealtimeTranscriptDirection {
  AI_REALTIME_TRANSCRIPT_DIRECTION_UNSPECIFIED = 0;
  AI_REALTIME_TRANSCRIPT_DIRECTION_INPUT = 1;
  AI_REALTIME_TRANSCRIPT_DIRECTION_OUTPUT = 2;
}

message AiRealtimeContinuousTranscript {
  AiRealtimeTranscriptDirection direction = 1;
  string text_delta = 2;
  // Both native timestamps are present, or both are absent. Never inferred.
  optional int64 start_ms = 3;
  optional int64 end_ms = 4;
}

message AiRealtimeContinuousInterruption {
  // Empty when the native interruption preceded any observed output audio.
  string output_track_id = 1;
}

message AiRealtimeContextRequest {
  string context_request_id = 1;
  int64 offset_ms = 2;
}

// Cumulative native audio duration: replace earlier observations, never sum.
// It is neither token usage nor a charge estimate. Final requires native proof.
message AiRealtimeSessionUsage {
  double audio_seconds = 1;
  bool final = 2;
}

message AiRealtimeFailure {
  string request_id = 1;
  string output_track_id = 2;
  ReasonCode reason_code = 3;
}

message AiRealtimeEvent {
  RealtimeControlStatus control = 1;
  oneof event {
    AiRealtimeSessionOpened opened = 10;
    AiRealtimeInputAccepted input_accepted = 11;
    AiRealtimeSpeechStatus speech_status = 12;
    AiRealtimeTranscript transcript = 13;
    AiRealtimeTextOutput text_output = 14;
    AiRealtimeAudioFrameOutput audio_frame = 15;
    AiRealtimeOutputTrackStatus output_track = 16;
    AiRealtimeRequestTerminal request_terminal = 17;
    AiRealtimeSessionTerminal session_terminal = 18;
    AiRealtimeFailure failure = 19;
    AiRealtimeContinuousTranscript continuous_transcript = 20;
    AiRealtimeContextRequest context_request = 21;
    AiRealtimeSessionUsage session_usage = 22;
    AiRealtimeContinuousInterruption continuous_interruption = 23;
  }
}

message InterruptRealtimeOutputRequest {
  string realtime_session_id = 1;
  uint64 generation = 2;
  string output_track_id = 3;
}

message InterruptRealtimeOutputResponse {
  Ack ack = 1;
  RealtimeControlStatus control = 2;
}

message CloseRealtimeSessionRequest {
  string realtime_session_id = 1;
  uint64 generation = 2;
}

message CloseRealtimeSessionResponse {
  Ack ack = 1;
  RealtimeControlStatus control = 2;
  AiRealtimeSessionUsage usage = 3;
  AiRealtimeSessionClosure closure = 4;
}

service RuntimeAiRealtimeService {
  rpc OpenRealtimeSession(OpenRealtimeSessionRequest) returns (OpenRealtimeSessionResponse);
  rpc AppendRealtimeInput(AppendRealtimeInputRequest) returns (AppendRealtimeInputResponse);
  rpc SubmitRealtimeOwnerControl(SubmitRealtimeOwnerControlRequest) returns (SubmitRealtimeOwnerControlResponse);
  rpc ReadRealtimeEvents(ReadRealtimeEventsRequest) returns (stream AiRealtimeEvent);
  rpc InterruptRealtimeOutput(InterruptRealtimeOutputRequest) returns (InterruptRealtimeOutputResponse);
  rpc CloseRealtimeSession(CloseRealtimeSessionRequest) returns (CloseRealtimeSessionResponse);
}
