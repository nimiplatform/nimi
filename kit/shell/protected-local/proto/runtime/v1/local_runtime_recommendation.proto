syntax = "proto3";

package nimi.runtime.v1;

option go_package = "github.com/nimiplatform/nimi/runtime/gen/runtime/v1;runtimev1";

import "runtime/v1/common.proto";

// Runtime-owned applicability for one exact recommendation context. It is
// neither configuration, readiness, selection, nor execution truth.
enum LocalRecommendationApplicability {
  LOCAL_RECOMMENDATION_APPLICABILITY_UNSPECIFIED = 0;
  LOCAL_RECOMMENDATION_APPLICABILITY_SUPPORTED = 1;
  LOCAL_RECOMMENDATION_APPLICABILITY_UNKNOWN = 2;
  LOCAL_RECOMMENDATION_APPLICABILITY_UNSUPPORTED = 3;
}

enum ModelAssetSourceAvailability {
  MODEL_ASSET_SOURCE_AVAILABILITY_UNSPECIFIED = 0;
  MODEL_ASSET_SOURCE_AVAILABILITY_AVAILABLE = 1;
  MODEL_ASSET_SOURCE_AVAILABILITY_UNAVAILABLE = 2;
}

enum ModelAssetSourceFreshness {
  MODEL_ASSET_SOURCE_FRESHNESS_UNSPECIFIED = 0;
  MODEL_ASSET_SOURCE_FRESHNESS_FRESH = 1;
  MODEL_ASSET_SOURCE_FRESHNESS_STALE = 2;
}

// Source observation is scoped only to the model-index featured section.
// generation never participates in offer identity.
message ModelAssetFeaturedSourceObservation {
  ModelAssetSourceAvailability availability = 1;
  ModelAssetSourceFreshness freshness = 2;
  string generation = 3;
  ReasonCode reason_code = 4;
}

// Browse-only search result. model_locator opens detail or variant listing and
// never authorizes installation.
message ModelAssetCatalogSearchResult {
  string model_locator = 1;
  string source_label = 2;
  string title = 3;
  string description = 4;
  repeated string categories = 5;
  string model_type = 6;
  string license = 7;
  repeated string tags = 8;
  int64 downloads = 9;
  int64 likes = 10;
  string last_modified = 11;
  bool verified = 12;
  // Publishing organization or author label (for example the repository
  // owner). Presentation only; never part of offer identity.
  string author = 13;
}

// Exact entry-level offer. The opaque offer_ref is the only install-plan input
// exposed to SDK and Desktop.
message ModelAssetMarketCandidate {
  string offer_ref = 1;
  string source_label = 2;
  string title = 3;
  string description = 4;
  repeated string categories = 5;
  string model_type = 6;
  string variant_label = 7;
  string format = 8;
  int64 total_size_bytes = 9;
  string license = 10;
  repeated string tags = 11;
  int64 downloads = 12;
  int64 likes = 13;
  string last_modified = 14;
  bool verified = 15;
  bool installed = 16;
  bool installable = 17;
  optional int32 featured_ordinal = 18;
  string editorial_reason = 19;
  // Publishing organization or author label (for example the repository
  // owner). Presentation only; never part of offer identity.
  string author = 20;
}

message ListFeaturedModelAssetsRequest {
  string category = 1;
  int32 page_size = 2;
}

message ListFeaturedModelAssetsResponse {
  ModelAssetFeaturedSourceObservation source = 1;
  repeated ModelAssetMarketCandidate items = 2;
}

message FactoryProfileCapabilityApplicability {
  string capability_contract = 1;
  LocalRecommendationApplicability applicability = 2;
  repeated ReasonCode reasons = 3;
}

message FactoryProfileRecommendation {
  string profile_alias = 1;
  repeated FactoryProfileCapabilityApplicability capabilities = 2;
}

message ListFactoryProfileRecommendationsRequest {
  string capability_contract = 1;
}

message ListFactoryProfileRecommendationsResponse {
  repeated FactoryProfileRecommendation profiles = 1;
}
