[package]
name = "nimi-shell-protected-local"
version = "0.1.0"
edition = "2021"
description = "Native host-only protected-local Runtime carrier contract for Nimi desktop shells."
license = "MIT"
repository = "https://github.com/nimiplatform/nimi"
readme = "README.md"

[lib]
path = "src/lib.rs"

[features]
default = []
macos-local-development = []
macos-source-local-development = []
windows-source-local-development = []

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
url = "2"
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
