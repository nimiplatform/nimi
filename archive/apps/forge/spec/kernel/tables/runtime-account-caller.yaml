# Forge — Runtime Account Caller (FG-SHELL-011)
# Authoritative identity used by Forge when calling RuntimeAccountService
# (BeginLogin, CompleteLogin, GetAccountSessionStatus, Logout). The caller is
# fixed; runtime owns refresh-token custody and short-lived access-token
# projection (FG-SHELL-012, spec K-ACCSVC-008).

caller:
  app_id: app.nimi.forge
  app_instance_id: app.nimi.forge.local-first-party
  device_id: local-first-party-device
  mode: ACCOUNT_CALLER_MODE_LOCAL_FIRST_PARTY_APP
  scopes: []

# Notes
# - app_id MUST equal the Tauri identifier (FG-SHELL-001).
# - app_instance_id MUST be a stable per-install constant; multiple windows of
#   the same Forge install share one instance id.
# - device_id is informational; runtime admission keys on (app_id, app_instance_id)
#   per runtime/internal/appregistry/registry.go AdmitLocalFirstPartyInstance.
# - mode is fixed to LOCAL_FIRST_PARTY_APP; DESKTOP_LAUNCHED_AVATAR is rejected
#   by runtime helpers as AVATAR_BINDING_ONLY and is not admitted for Forge.
