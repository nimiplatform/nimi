# Realm Drift — Runtime Account Caller (RD-SHELL-009)
# Authoritative identity used by Realm Drift when calling RuntimeAccountService
# (BeginLogin, CompleteLogin, GetAccountSessionStatus, GetAccessToken, Logout).
# The caller is fixed; runtime owns refresh-token custody and short-lived
# access-token projection (RD-SHELL-010, spec K-ACCSVC-008).

caller:
  app_id: app.nimi.realm-drift
  app_instance_id: app.nimi.realm-drift.local-first-party
  device_id: local-first-party-device
  mode: ACCOUNT_CALLER_MODE_LOCAL_FIRST_PARTY_APP
  scopes: []

# Notes
# - app_id MUST equal the Tauri identifier (RD-SHELL-001).
# - app_instance_id MUST be a stable per-install constant; Realm Drift runs as
#   a single primary window.
# - device_id is informational; runtime admission keys on (app_id, app_instance_id)
#   per runtime/internal/appregistry/registry.go AdmitLocalFirstPartyInstance.
# - mode is fixed to LOCAL_FIRST_PARTY_APP; DESKTOP_LAUNCHED_AVATAR is rejected
#   by runtime helpers as AVATAR_BINDING_ONLY and is not admitted for Realm Drift.
