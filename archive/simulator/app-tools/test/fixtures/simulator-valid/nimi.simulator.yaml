schema: nimi.simulator.module/v1
module_id: sample-app
composition:
  factory_entry: src/renderer/factory.ts
  factory_export: sampleCanonicalRendererFactory
  style_entry: src/renderer/styles.css
renderer:
  entry: src/simulator/renderer.ts
  export: sampleSimulatorRenderer
  adapter_entry: src/simulator/adapter.ts
  adapter_export: sampleSimulatorAdapterFactory
  surfaces:
    - id: main
      factory_surface: main
      label: Sample
      initial_route: /
requires:
  kit_capabilities: []
  sdk_methods: []
  simulator_commands:
    - sample-app.window.open
  simulator_events:
    - sample-app.window.opened
fixtures:
  conformance: src/simulator/fixture.ts
