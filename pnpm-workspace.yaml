packages:
  - 'apps/*'
  - 'kit'
  - 'kit/shell/protected-local-node/npm/win32-x64'
  - 'kit/shell/protected-local-node/npm/darwin-arm64'
  - 'docs'
  - 'examples'
  - 'app-tools'
  - 'gateways/*'
  - 'nimi2d'
  - 'nimi-cognition'
  - 'sdks/typescript'
  - 'sdks/typescript/adapters/*'
overrides:
  fast-uri: 3.1.8
  gh-pages: ^6.3.0
  lodash: 4.18.1
  protobufjs: 7.6.5
  socket.io-parser: 4.2.7
  'undici@>=7.0.0 <7.30.1': 7.30.1
  ws: 8.22.0
  brace-expansion@>=5.0.0 <5.0.12: 5.0.12
  source-map-js: 1.2.2
  vitepress>vite: 6.4.4
allowBuilds:
  electron: true
  esbuild: true
  protobufjs: true
packageExtensions:
  # Resolve Motion's React declarations from its consumer's type peer, not an
  # unrelated React 18 copy in the workspace's hidden hoist directory.
  'motion@14':
    peerDependencies:
      '@types/react': '^18.0.0 || ^19.0.0'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  'framer-motion@14':
    peerDependencies:
      '@types/react': '^18.0.0 || ^19.0.0'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  # Router children must use the same React types as the consuming app.
  'react-router@7':
    peerDependencies:
      '@types/react': '^18.0.0 || ^19.0.0'
    peerDependenciesMeta:
      '@types/react':
        optional: true
