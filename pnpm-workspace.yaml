packages:
  - 'apps/*'
  - 'kit'
  - 'kit/shell/protected-local-node/npm/win32-x64'
  - 'kit/shell/protected-local-node/npm/darwin-arm64'
  - 'docs'
  - 'examples'
  - 'app-tools'
  - 'gateways/*'
  - 'nimi2d'
  - 'nimi-cognition'
  - 'sdks/typescript'
  - 'sdks/typescript/adapters/*'
overrides:
  fast-uri: 3.1.5
  gh-pages: ^6.3.0
  lodash: 4.18.1
  picomatch@>=4.0.0 <4.0.4: 4.0.4
  protobufjs: 7.6.5
  socket.io-parser: 4.2.7
  undici: 7.29.0
  ws: 8.21.0
allowBuilds:
  electron: true
  esbuild: true
  protobufjs: true
packageExtensions:
  # Resolve Motion's React declarations from its consumer's type peer, not an
  # unrelated React 18 copy in the workspace's hidden hoist directory.
  'motion@12':
    peerDependencies:
      '@types/react': '^18.0.0 || ^19.0.0'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  'framer-motion@12':
    peerDependencies:
      '@types/react': '^18.0.0 || ^19.0.0'
    peerDependenciesMeta:
      '@types/react':
        optional: true
