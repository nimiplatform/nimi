syntax = "proto3";

package nimi.runtime.v1;

option go_package = "github.com/nimiplatform/nimi/runtime/gen/runtime/v1;runtimev1";

import "google/protobuf/struct.proto";
import "runtime/v1/common.proto";
import "runtime/v1/local_runtime_engine.proto";
import "runtime/v1/local_runtime_types.proto";

// === Asset CRUD (unified from Model + Artifact) ===

message ListLocalAssetsRequest {
  LocalAssetStatus status_filter = 1;
  LocalAssetKind kind_filter     = 2;
  string engine_filter           = 3;
  int32 page_size                = 4;
  string page_token              = 5;
}

message ListLocalAssetsResponse {
  repeated LocalAssetRecord assets = 1;
  string next_page_token           = 2;
}

message ListVerifiedAssetsRequest {
  LocalAssetKind kind_filter = 1;
  string engine_filter       = 2;
  int32 page_size            = 3;
  string page_token          = 4;
}

message ListVerifiedAssetsResponse {
  repeated LocalVerifiedAssetDescriptor assets = 1;
  string next_page_token                       = 2;
}

message InstallVerifiedAssetRequest {
  string template_id = 1;
  string endpoint    = 2;
}

message InstallVerifiedAssetResponse {
  LocalAssetRecord asset = 1;
}

message ImportLocalAssetRequest {
  string manifest_path                 = 1;
  string endpoint                      = 2;
  google.protobuf.Struct engine_config = 3;
}

message ImportLocalAssetResponse {
  LocalAssetRecord asset = 1;
}

message ImportLocalAssetFileRequest {
  string file_path       = 1;
  LocalAssetKind kind    = 2;
  string engine          = 3;
  string asset_name      = 4;
  repeated string capabilities = 5;
  string endpoint        = 6;
}

message ImportLocalAssetFileResponse {
  LocalAssetRecord asset = 1;
}

message ScaffoldOrphanAssetRequest {
  string path              = 1;
  LocalAssetKind kind      = 2;
  string engine            = 3;
  repeated string capabilities = 4;
  string endpoint          = 5;
}

message ScaffoldOrphanAssetResponse {
  LocalAssetRecord asset = 1;
}

message RemoveLocalAssetRequest {
  string local_asset_id = 1;
}

message RemoveLocalAssetResponse {
  LocalAssetRecord asset = 1;
}

// === Catalog & Install Plan ===

message SearchCatalogModelsRequest {
  string query           = 1;
  string capability      = 2;
  reserved 3;
  reserved "limit";
  string category_filter = 4;
  string engine_filter   = 5;
  int32 page_size        = 6;
  string page_token      = 7;
}

message SearchCatalogModelsResponse {
  repeated LocalCatalogModelDescriptor items = 1;
  string next_page_token                     = 2;
}

message ResolveModelInstallPlanRequest {
  string item_id                       = 1;
  string source                        = 2;
  string template_id                   = 3;
  string model_id                      = 4;
  string repo                          = 5;
  string revision                      = 6;
  repeated string capabilities         = 7;
  string engine                        = 8;
  string entry                         = 9;
  repeated string files                = 10;
  string license                       = 11;
  map<string, string> hashes           = 12;
  string endpoint                      = 13;
  google.protobuf.Struct engine_config = 14;
}

message ResolveModelInstallPlanResponse {
  LocalInstallPlanDescriptor plan = 1;
}

// === Asset Lifecycle (runnable assets) ===

message StartLocalAssetRequest {
  string local_asset_id = 1;
}

message StartLocalAssetResponse {
  LocalAssetRecord asset = 1;
}

message StopLocalAssetRequest {
  string local_asset_id = 1;
}

message StopLocalAssetResponse {
  LocalAssetRecord asset = 1;
}

message CheckLocalAssetHealthRequest {
  string local_asset_id = 1;
}

message CheckLocalAssetHealthResponse {
  repeated LocalAssetHealth assets = 1;
}

message WarmLocalAssetRequest {
  string local_asset_id = 1;
  int32 timeout_ms      = 2;
}

message WarmLocalAssetResponse {
  string local_asset_id = 1;
  string asset_id       = 2;
  string model_resolved = 3;
  string endpoint       = 4;
  string engine         = 5;
  bool already_warm     = 6;
  int64 latency_ms      = 7;
  string trace_id       = 8;
}

// === Unregistered Asset Scan ===

message ScanUnregisteredAssetsRequest {}

message ScanUnregisteredAssetsResponse {
  repeated LocalUnregisteredAssetDescriptor items = 1;
}

// === Transfers ===

message LocalTransferSessionSummary {
  string install_session_id = 1;
  string asset_id           = 2;
  string local_asset_id     = 3;
  reserved 4, 5;
  string session_kind       = 6;
  string phase              = 7;
  string state              = 8;
  int64 bytes_received      = 9;
  int64 bytes_total         = 10;
  int64 speed_bytes_per_sec = 11;
  int64 eta_seconds         = 12;
  string message            = 13;
  string reason_code        = 14;
  bool retryable            = 15;
  string created_at         = 16;
  string updated_at         = 17;
}

message LocalTransferProgressEvent {
  string install_session_id = 1;
  string asset_id           = 2;
  string local_asset_id     = 3;
  reserved 4, 5;
  string session_kind       = 6;
  string phase              = 7;
  int64 bytes_received      = 8;
  int64 bytes_total         = 9;
  int64 speed_bytes_per_sec = 10;
  int64 eta_seconds         = 11;
  string message            = 12;
  string state              = 13;
  string reason_code        = 14;
  bool retryable            = 15;
  bool done                 = 16;
  bool success              = 17;
  string created_at         = 18;
  string updated_at         = 19;
}

message ListLocalTransfersRequest {}

message ListLocalTransfersResponse {
  repeated LocalTransferSessionSummary transfers = 1;
}

message PauseLocalTransferRequest {
  string install_session_id = 1;
}

message PauseLocalTransferResponse {
  LocalTransferSessionSummary transfer = 1;
}

message ResumeLocalTransferRequest {
  string install_session_id = 1;
}

message ResumeLocalTransferResponse {
  LocalTransferSessionSummary transfer = 1;
}

message CancelLocalTransferRequest {
  string install_session_id = 1;
}

message CancelLocalTransferResponse {
  LocalTransferSessionSummary transfer = 1;
}

message WatchLocalTransfersRequest {}

// === Runtime-owned Local Environment ===

message ResolveLocalEnvironmentPlanRequest {
  string pack_id = 1;
  string consumer_scope = 2;
  LocalDeviceProfile host_profile = 3;
  string runtime_data_root = 4;
  string asset_id = 5;
  string local_asset_id = 6;
  string companion_asset_id = 7;
  string parent_asset_id = 8;
}

message ResolveLocalEnvironmentPlanResponse {
  LocalEnvironmentPlan plan = 1;
}

message ListLocalEnvironmentSelectedSourcesRequest {
  string dependency_family = 1;
  string consumer_scope = 2;
}

message ListLocalEnvironmentSelectedSourcesResponse {
  repeated LocalEnvironmentSelectedSourceRecord sources = 1;
}

message ListLocalEnvironmentDependencyJobsRequest {
  string environment_key = 1;
  string state = 2;
}

message ListLocalEnvironmentDependencyJobsResponse {
  repeated LocalEnvironmentDependencyJob jobs = 1;
}

message ResolveLocalEnvironmentActivationGateRequest {
  string consumer_id = 1;
  string pack_id = 2;
  LocalDeviceProfile host_profile = 3;
  string runtime_data_root = 4;
  string asset_id = 5;
  string local_asset_id = 6;
  string companion_asset_id = 7;
  string parent_asset_id = 8;
}

message ResolveLocalEnvironmentActivationGateResponse {
  LocalEnvironmentActivationGate gate = 1;
}

// RuntimeBaselineConsumerBinding pins a first-run baseline consumer to the
// model asset selected by the first-run factory AIProfile. Consumers whose
// pack requires a model.asset dependency family supply asset identity here.
message RuntimeBaselineConsumerBinding {
  string consumer_id = 1;
  // asset_id is the selected baseline model asset id for model.asset
  // dependency resolution.
  string asset_id = 2;
  // local_asset_id optionally identifies an installed local asset whose
  // asset id is resolved by Runtime when asset_id is not supplied directly.
  string local_asset_id = 3;
}

// MintRuntimeBaselineReadinessRequest requests minting a first-run runtime
// baseline readiness evidence ref (K-LENV-ACT-011). RuntimeLocalService runs
// a fresh activation gate for every required first-run baseline consumer and
// mints the ref only when all required dependencies are ready_system or
// ready_managed.
message MintRuntimeBaselineReadinessRequest {
  string selected_local_factory_ai_profile_ref = 1;
  // install_level is minimal or recommended.
  string install_level = 2;
  string runtime_data_root_or_data_root_ref = 3;
  LocalDeviceProfile host_profile = 4;
  // baseline_consumers pins the first-run baseline consumer set and the model
  // asset bound to each consumer. When empty the canonical consumer set for
  // install_level is resolved by Runtime.
  repeated RuntimeBaselineConsumerBinding baseline_consumers = 5;
}

message MintRuntimeBaselineReadinessResponse {
  RuntimeBaselineReadinessRef ref = 1;
  // state is ready when minted, otherwise the fail-closed projection state.
  string state = 2;
  string reason_code = 3;
  string detail = 4;
}

// ResolveRuntimeBaselineReadinessRequest re-verifies a stored runtimeBaselineRef
// against fresh activation evidence (K-LENV-ACT-011). This is the seam product
// ready admission step 5 (P-COLD-016) consumes.
message ResolveRuntimeBaselineReadinessRequest {
  string runtime_baseline_ref = 1;
  LocalDeviceProfile host_profile = 2;
}

message ResolveRuntimeBaselineReadinessResponse {
  RuntimeBaselineReadinessRef ref = 1;
  // state is ready when the ref still resolves, otherwise the fail-closed
  // projection state.
  string state = 2;
  string reason_code = 3;
  string detail = 4;
}

message StartLocalEnvironmentDependencyJobRequest {
  string environment_key = 1;
  string dependency_family = 2;
  string dependency_id = 3;
  string source_kind = 4;
  bool confirmed = 5;
}

message StartLocalEnvironmentDependencyJobResponse {
  LocalEnvironmentDependencyJob job = 1;
}

message CancelLocalEnvironmentDependencyJobRequest {
  string job_id = 1;
}

message CancelLocalEnvironmentDependencyJobResponse {
  LocalEnvironmentDependencyJob job = 1;
}

message RetryLocalEnvironmentDependencyJobRequest {
  string job_id = 1;
  bool confirmed = 2;
}

message RetryLocalEnvironmentDependencyJobResponse {
  LocalEnvironmentDependencyJob job = 1;
}

message RepairLocalEnvironmentDependencyRequest {
  string environment_key = 1;
  string dependency_family = 2;
  string dependency_id = 3;
  bool confirmed = 4;
  string reason_code = 5;
}

message RepairLocalEnvironmentDependencyResponse {
  LocalEnvironmentDependencyJob job = 1;
}

// === Runtime-owned Local State Reconciliation ===

message LocalStateReconciliationPlan {
  string plan_id = 1;
  string state = 2;
  string reason_code = 3;
  string message = 4;
  string active_state_path = 5;
  string local_models_path = 6;
  string nimi_data_dir = 7;
  string retired_state_path = 8;
  bool retired_state_detected = 9;
  bool active_state_detected = 10;
  bool confirmation_required = 11;
  int32 active_asset_count = 12;
  int32 active_service_count = 13;
  int32 active_transfer_count = 14;
  int32 active_audit_count = 15;
  int32 retired_asset_count = 16;
  int32 retired_service_count = 17;
  int32 retired_transfer_count = 18;
  int32 retired_audit_count = 19;
  int32 conflict_count = 20;
}

message ResolveLocalStateReconciliationRequest {
  string nimi_data_dir = 1;
}

message ResolveLocalStateReconciliationResponse {
  LocalStateReconciliationPlan plan = 1;
}

message ExecuteLocalStateCutoverRequest {
  string nimi_data_dir = 1;
  string plan_id = 2;
  bool confirmed = 3;
}

message ExecuteLocalStateCutoverResponse {
  LocalStateReconciliationPlan plan = 1;
  LocalTransferSessionSummary transfer = 2;
}

// === Device Profile ===

message CollectDeviceProfileRequest {
  repeated int32 extra_ports = 1;
}

message CollectDeviceProfileResponse {
  LocalDeviceProfile profile = 1;
}

// === Profile Resolution ===

message ResolveProfileRequest {
  string mod_id                                = 1;
  LocalProfileDescriptor profile               = 2;
  string capability                            = 3;
  LocalDeviceProfile device_profile            = 4;
  repeated ProfileEntryOverride entry_overrides = 5;
}

message ResolveProfileResponse {
  LocalProfileResolutionPlan plan = 1;
}

message ApplyProfileRequest {
  LocalProfileResolutionPlan plan = 1;
}

message ApplyProfileResponse {
  LocalProfileApplyResult result = 1;
}

// === Services ===

message ListLocalServicesRequest {
  LocalServiceStatus status_filter = 1;
  int32 page_size                  = 2;
  string page_token                = 3;
}

message ListLocalServicesResponse {
  repeated LocalServiceDescriptor services = 1;
  string next_page_token                   = 2;
}

message InstallLocalServiceRequest {
  string service_id            = 1;
  string title                 = 2;
  string engine                = 3;
  string endpoint              = 4;
  repeated string capabilities = 5;
  string local_model_id        = 6;
}

message InstallLocalServiceResponse {
  LocalServiceDescriptor service = 1;
}

message StartLocalServiceRequest {
  string service_id = 1;
}

message StartLocalServiceResponse {
  LocalServiceDescriptor service = 1;
}

message StopLocalServiceRequest {
  string service_id = 1;
}

message StopLocalServiceResponse {
  LocalServiceDescriptor service = 1;
}

message CheckLocalServiceHealthRequest {
  string service_id = 1;
}

message CheckLocalServiceHealthResponse {
  repeated LocalServiceDescriptor services = 1;
}

message RemoveLocalServiceRequest {
  string service_id = 1;
}

message RemoveLocalServiceResponse {
  LocalServiceDescriptor service = 1;
}

// === Node Catalog ===

message ListNodeCatalogRequest {
  string capability  = 1;
  string service_id  = 2;
  string provider    = 3;
  string type_filter = 4;
  int32 page_size    = 5;
  string page_token  = 6;
}

message ListNodeCatalogResponse {
  repeated LocalNodeDescriptor nodes = 1;
  string next_page_token             = 2;
}

// === Audits ===

message ListLocalAuditsRequest {
  reserved 1;
  reserved "limit";
  string event_type            = 2;
  repeated string event_types  = 3;
  string source                = 4;
  string modality              = 5;
  string local_model_id        = 6;
  string mod_id                = 7;
  string reason_code           = 8;
  LocalAuditTimeRange time_range = 9;
  int32 page_size              = 10;
  string page_token            = 11;
  string app_id                = 12;
  string subject_user_id       = 13;
}

message ListLocalAuditsResponse {
  repeated LocalAuditEvent events = 1;
  string next_page_token          = 2;
}

message AppendInferenceAuditRequest {
  string event_type                = 1;
  string mod_id                    = 2;
  string source                    = 3;
  string provider                  = 4;
  string modality                  = 5;
  string adapter                   = 6;
  string model                     = 7;
  string local_model_id            = 8;
  string endpoint                  = 9;
  string reason_code               = 10;
  string detail                    = 11;
  google.protobuf.Struct policy_gate = 12;
  google.protobuf.Struct extra     = 13;
}

message AppendRuntimeAuditRequest {
  string event_type              = 1;
  string model_id                = 2;
  string local_model_id          = 3;
  google.protobuf.Struct payload = 4;
}

// === Service Definition ===

service RuntimeLocalService {
  // Asset CRUD (unified)
  rpc ListLocalAssets(ListLocalAssetsRequest) returns (ListLocalAssetsResponse);
  rpc ListVerifiedAssets(ListVerifiedAssetsRequest) returns (ListVerifiedAssetsResponse);
  rpc InstallVerifiedAsset(InstallVerifiedAssetRequest) returns (InstallVerifiedAssetResponse);
  rpc ImportLocalAsset(ImportLocalAssetRequest) returns (ImportLocalAssetResponse);
  rpc ImportLocalAssetFile(ImportLocalAssetFileRequest) returns (ImportLocalAssetFileResponse);
  rpc ScanUnregisteredAssets(ScanUnregisteredAssetsRequest) returns (ScanUnregisteredAssetsResponse);
  rpc ScaffoldOrphanAsset(ScaffoldOrphanAssetRequest) returns (ScaffoldOrphanAssetResponse);
  rpc RemoveLocalAsset(RemoveLocalAssetRequest) returns (RemoveLocalAssetResponse);

  // Catalog & Install
  rpc SearchCatalogModels(SearchCatalogModelsRequest) returns (SearchCatalogModelsResponse);
  rpc ResolveModelInstallPlan(ResolveModelInstallPlanRequest) returns (ResolveModelInstallPlanResponse);

  // Asset lifecycle (runnable assets)
  rpc StartLocalAsset(StartLocalAssetRequest) returns (StartLocalAssetResponse);
  rpc StopLocalAsset(StopLocalAssetRequest) returns (StopLocalAssetResponse);
  rpc CheckLocalAssetHealth(CheckLocalAssetHealthRequest) returns (CheckLocalAssetHealthResponse);
  rpc WarmLocalAsset(WarmLocalAssetRequest) returns (WarmLocalAssetResponse);

  // Transfers
  rpc ListLocalTransfers(ListLocalTransfersRequest) returns (ListLocalTransfersResponse);
  rpc PauseLocalTransfer(PauseLocalTransferRequest) returns (PauseLocalTransferResponse);
  rpc ResumeLocalTransfer(ResumeLocalTransferRequest) returns (ResumeLocalTransferResponse);
  rpc CancelLocalTransfer(CancelLocalTransferRequest) returns (CancelLocalTransferResponse);
  rpc WatchLocalTransfers(WatchLocalTransfersRequest) returns (stream LocalTransferProgressEvent);

  // Runtime-owned local environment
  rpc ResolveLocalEnvironmentPlan(ResolveLocalEnvironmentPlanRequest) returns (ResolveLocalEnvironmentPlanResponse);
  rpc ListLocalEnvironmentSelectedSources(ListLocalEnvironmentSelectedSourcesRequest) returns (ListLocalEnvironmentSelectedSourcesResponse);
  rpc ListLocalEnvironmentDependencyJobs(ListLocalEnvironmentDependencyJobsRequest) returns (ListLocalEnvironmentDependencyJobsResponse);
  rpc ResolveLocalEnvironmentActivationGate(ResolveLocalEnvironmentActivationGateRequest) returns (ResolveLocalEnvironmentActivationGateResponse);
  rpc MintRuntimeBaselineReadiness(MintRuntimeBaselineReadinessRequest) returns (MintRuntimeBaselineReadinessResponse);
  rpc ResolveRuntimeBaselineReadiness(ResolveRuntimeBaselineReadinessRequest) returns (ResolveRuntimeBaselineReadinessResponse);
  rpc StartLocalEnvironmentDependencyJob(StartLocalEnvironmentDependencyJobRequest) returns (StartLocalEnvironmentDependencyJobResponse);
  rpc CancelLocalEnvironmentDependencyJob(CancelLocalEnvironmentDependencyJobRequest) returns (CancelLocalEnvironmentDependencyJobResponse);
  rpc RetryLocalEnvironmentDependencyJob(RetryLocalEnvironmentDependencyJobRequest) returns (RetryLocalEnvironmentDependencyJobResponse);
  rpc RepairLocalEnvironmentDependency(RepairLocalEnvironmentDependencyRequest) returns (RepairLocalEnvironmentDependencyResponse);

  // Runtime-owned local state reconciliation
  rpc ResolveLocalStateReconciliation(ResolveLocalStateReconciliationRequest) returns (ResolveLocalStateReconciliationResponse);
  rpc ExecuteLocalStateCutover(ExecuteLocalStateCutoverRequest) returns (ExecuteLocalStateCutoverResponse);

  // Device
  rpc CollectDeviceProfile(CollectDeviceProfileRequest) returns (CollectDeviceProfileResponse);

  // Profile
  rpc ResolveProfile(ResolveProfileRequest) returns (ResolveProfileResponse);
  rpc ApplyProfile(ApplyProfileRequest) returns (ApplyProfileResponse);

  // Services
  rpc ListLocalServices(ListLocalServicesRequest) returns (ListLocalServicesResponse);
  rpc InstallLocalService(InstallLocalServiceRequest) returns (InstallLocalServiceResponse);
  rpc StartLocalService(StartLocalServiceRequest) returns (StartLocalServiceResponse);
  rpc StopLocalService(StopLocalServiceRequest) returns (StopLocalServiceResponse);
  rpc CheckLocalServiceHealth(CheckLocalServiceHealthRequest) returns (CheckLocalServiceHealthResponse);
  rpc RemoveLocalService(RemoveLocalServiceRequest) returns (RemoveLocalServiceResponse);

  // Nodes
  rpc ListNodeCatalog(ListNodeCatalogRequest) returns (ListNodeCatalogResponse);

  // Audits
  rpc ListLocalAudits(ListLocalAuditsRequest) returns (ListLocalAuditsResponse);
  rpc AppendInferenceAudit(AppendInferenceAuditRequest) returns (Ack);
  rpc AppendRuntimeAudit(AppendRuntimeAuditRequest) returns (Ack);

  // Engine management RPCs (K-LENG-004: SUPERVISED mode)
  rpc ListEngines(ListEnginesRequest) returns (ListEnginesResponse);
  rpc EnsureEngine(EnsureEngineRequest) returns (EnsureEngineResponse);
  rpc StartEngine(StartEngineRequest) returns (StartEngineResponse);
  rpc StopEngine(StopEngineRequest) returns (StopEngineResponse);
  rpc GetEngineStatus(GetEngineStatusRequest) returns (GetEngineStatusResponse);
}
