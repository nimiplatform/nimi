  AI_LOCAL_EXECUTION_OUT_OF_MEMORY = 725;

  // Canonical App or shared subsystem AIConfig optimistic concurrency.
  AI_CONFIG_REVISION_CONFLICT = 726;

  // Reserved: old values of renumbered codes.
