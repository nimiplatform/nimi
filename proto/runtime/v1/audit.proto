syntax = "proto3";

package nimi.runtime.v1;

option go_package = "github.com/nimiplatform/nimi/runtime/gen/runtime/v1;runtimev1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "runtime/v1/common.proto";

message ListAuditEventsRequest {
  string app_id = 1;
  string subject_user_id = 2;
  string domain = 3;
  ReasonCode reason_code = 4;
  google.protobuf.Timestamp from_time = 5;
  google.protobuf.Timestamp to_time = 6;
  int32 page_size = 7;
  string page_token = 8;
  CallerKind caller_kind = 9;
  string caller_id = 10;
}

message AuditEventRecord {
  string audit_id = 1;
  string app_id = 2;
  string subject_user_id = 3;
  string domain = 4;
  string operation = 5;
  ReasonCode reason_code = 6;
  string trace_id = 7;
  google.protobuf.Timestamp timestamp = 8;
  google.protobuf.Struct payload = 9;
  CallerKind caller_kind = 10;
  string caller_id = 11;
  string surface_id = 12;
  string principal_id = 13;
  string principal_type = 14;
  string external_principal_type = 15;
  string capability = 16;
  string token_id = 17;
  string parent_token_id = 18;
  string consent_id = 19;
  string consent_version = 20;
  string policy_version = 21;
  string resource_selector_hash = 22;
  string scope_catalog_version = 23;
  // K-AUDIT-003: request_id == trace_id baseline. Top-level fact surface; the
  // payload request_id entry is a temporary compat mirror, not the truth face.
  string request_id = 24;
}

message ListAuditEventsResponse {
  repeated AuditEventRecord events = 1;
  string next_page_token = 2;
}

// K-AUDIT-024: exact bounded filters for the protected Desktop projection.
// Both timestamps are required and may span at most seven days.
message ListDesktopAuditEventsRequest {
  string trace_id = 1;
  string request_id = 2;
  string app_id = 3;
  string domain = 4;
  string operation = 5;
  ReasonCode reason_code = 6;
  CallerKind caller_kind = 7;
  google.protobuf.Timestamp from_time = 8;
  google.protobuf.Timestamp to_time = 9;
  int32 page_size = 10;
  string page_token = 11;
}

// K-AUDIT-024: wire-level field whitelist. Sensitive payload, subject,
// caller, principal, token, consent, policy and resource fields do not exist
// on this message and therefore cannot cross the Desktop protected transport.
message DesktopAuditEventProjection {
  string audit_id = 1;
  string request_id = 2;
  string app_id = 3;
  string domain = 4;
  string operation = 5;
  ReasonCode reason_code = 6;
  string trace_id = 7;
  google.protobuf.Timestamp timestamp = 8;
  CallerKind caller_kind = 9;
}

message ListDesktopAuditEventsResponse {
  repeated DesktopAuditEventProjection events = 1;
  string next_page_token = 2;
}

message ExportAuditEventsRequest {
  string app_id = 1;
  string subject_user_id = 2;
  string format = 3;
  google.protobuf.Timestamp from_time = 4;
  google.protobuf.Timestamp to_time = 5;
  bool compress = 6;
}

enum UsageWindow {
  USAGE_WINDOW_UNSPECIFIED = 0;
  USAGE_WINDOW_MINUTE = 1;
  USAGE_WINDOW_HOUR = 2;
  USAGE_WINDOW_DAY = 3;
}

enum RuntimeHealthStatus {
  RUNTIME_HEALTH_STATUS_UNSPECIFIED = 0;
  RUNTIME_HEALTH_STATUS_STOPPED = 1;
  RUNTIME_HEALTH_STATUS_STARTING = 2;
  RUNTIME_HEALTH_STATUS_READY = 3;
  RUNTIME_HEALTH_STATUS_DEGRADED = 4;
  RUNTIME_HEALTH_STATUS_STOPPING = 5;
}

message ListUsageStatsRequest {
  string app_id = 1;
  string subject_user_id = 2;
  CallerKind caller_kind = 3;
  string caller_id = 4;
  string capability = 5;
  string model_id = 6;
  UsageWindow window = 7;
  google.protobuf.Timestamp from_time = 8;
  google.protobuf.Timestamp to_time = 9;
  int32 page_size = 10;
  string page_token = 11;
}

message UsageStatRecord {
  string app_id = 1;
  string subject_user_id = 2;
  CallerKind caller_kind = 3;
  string caller_id = 4;
  string capability = 5;
  string model_id = 6;
  UsageWindow window = 7;
  google.protobuf.Timestamp bucket_start = 8;
  int64 request_count = 9;
  int64 success_count = 10;
  int64 error_count = 11;
  int64 input_tokens = 12;
  int64 output_tokens = 13;
  int64 compute_ms = 14;
  int64 queue_wait_ms = 15;
}

message ListUsageStatsResponse {
  repeated UsageStatRecord records = 1;
  string next_page_token = 2;
}

message GetRuntimeHealthRequest {}

message GetRuntimeHealthResponse {
  reserved 4;
  reserved "active_workflows";

  RuntimeHealthStatus status = 1;
  string reason = 2;
  int32 queue_depth = 3;
  int32 active_inference_jobs = 5;
  int64 cpu_milli = 6;
  int64 memory_bytes = 7;
  int64 vram_bytes = 8;
  google.protobuf.Timestamp sampled_at = 9;
}

message SubscribeRuntimeHealthEventsRequest {}

message RuntimeHealthEvent {
  reserved 5;
  reserved "active_workflows";

  uint64 sequence = 1;
  RuntimeHealthStatus status = 2;
  string reason = 3;
  int32 queue_depth = 4;
  int32 active_inference_jobs = 6;
  int64 cpu_milli = 7;
  int64 memory_bytes = 8;
  int64 vram_bytes = 9;
  google.protobuf.Timestamp sampled_at = 10;
}

message AuditExportChunk {
  string export_id = 1;
  uint64 sequence = 2;
  bytes chunk = 3;
  bool eof = 4;
  string mime_type = 5;
}

// Protected Desktop-account projections. The authenticated account is derived
// from the native carrier; these requests deliberately have no account selector.
message GetDesktopAIActivitySnapshotRequest {
  int32 limit = 1;
}

message GetDesktopAIActivitySnapshotResponse {
  DesktopAIActivitySnapshot snapshot = 1;
}

message SubscribeDesktopAIActivityRequest {
  int32 limit = 1;
}

enum DesktopAIExecutionRoute {
  DESKTOP_AI_EXECUTION_ROUTE_UNSPECIFIED = 0;
  DESKTOP_AI_EXECUTION_ROUTE_LOCAL = 1;
  DESKTOP_AI_EXECUTION_ROUTE_CLOUD = 2;
}

enum DesktopAIExecutionState {
  DESKTOP_AI_EXECUTION_STATE_UNSPECIFIED = 0;
  DESKTOP_AI_EXECUTION_STATE_RUNNING = 1;
  DESKTOP_AI_EXECUTION_STATE_OBSERVATION_UNKNOWN = 2;
}

message DesktopAIExecutionModel {
  string model_id = 1;
  string display_name = 2;
  string role = 3;
  string provider_id = 4;
}

message DesktopAISourceCoverage {
  string source = 1;
  bool activity_complete = 2;
  bool usage_complete = 3;
}

message DesktopAIExecution {
  string attempt_id = 1;
  string parent_work_id = 2;
  string parent_work_kind = 3;
  string source_kind = 4;
  string source_id = 5;
  string source_label = 6;
  string capability = 7;
  repeated DesktopAIExecutionModel models = 8;
  DesktopAIExecutionRoute route = 9;
  DesktopAIExecutionState state = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp observed_at = 12;
}

message DesktopAIActivitySnapshot {
  string generation_id = 1;
  uint64 revision = 2;
  google.protobuf.Timestamp observed_at = 3;
  repeated DesktopAIExecution executions = 4;
  repeated DesktopAISourceCoverage source_coverage = 5;
  bool records_complete = 6;
  int64 known_active_attempt_count = 7;
  bool work_count_known = 8;
  int64 known_work_count = 9;
  repeated string partial_reasons = 10;
}

message GetDesktopAIUsageSummaryRequest {
  // Half-open UTC interval, at most seven days. Future time is not claimed as
  // covered: effective_to is the earlier of to_time and the consistent read.
  google.protobuf.Timestamp from_time = 1;
  google.protobuf.Timestamp to_time = 2;
  // Optional exact captured Cloud connection; never an account selector.
  string connector_ref = 3;
}

message GetDesktopAIUsageSummaryResponse {
  DesktopAIUsageSummary summary = 1;
}

message DesktopAIUsageTotals {
  int64 attempt_count = 1;
  int64 active_attempt_count = 2;
  int64 pending_usage_count = 3;
  int64 measured_attempt_count = 4;
  int64 input_tokens = 5;
  int64 output_tokens = 6;
  int64 cached_input_tokens = 7;
  int64 reasoning_output_tokens = 8;
  int64 compute_ms = 9;
  int64 unpriced_attempt_count = 10;
}

message DesktopAICostEstimate {
  string currency = 1;
  // Decimal estimated amount, never an actual Provider charge.
  string estimated_amount = 2;
  string pricing_basis = 3;
}

message DesktopAIUsageGroup {
  string source_kind = 1;
  string capability = 2;
  repeated DesktopAIExecutionModel models = 3;
  DesktopAIExecutionRoute route = 4;
  DesktopAIUsageTotals totals = 5;
  repeated DesktopAICostEstimate estimates = 6;
}

message DesktopAIUsageSummary {
  string generation_id = 1;
  google.protobuf.Timestamp read_at = 2;
  google.protobuf.Timestamp from_time = 3;
  google.protobuf.Timestamp to_time = 4;
  google.protobuf.Timestamp effective_to = 5;
  DesktopAIUsageTotals totals = 6;
  repeated DesktopAIUsageGroup groups = 7;
  bool groups_complete = 8;
  repeated DesktopAICostEstimate estimates = 9;
  repeated DesktopAISourceCoverage source_coverage = 10;
  bool source_complete = 11;
  bool time_complete = 12;
  bool quantity_complete = 13;
  google.protobuf.Timestamp coverage_from = 14;
  google.protobuf.Timestamp coverage_to = 15;
  repeated string partial_reasons = 16;
  bool attribution_complete = 17;
}

enum DesktopAICloudAttemptOutcome {
  DESKTOP_AI_CLOUD_ATTEMPT_OUTCOME_UNSPECIFIED = 0;
  DESKTOP_AI_CLOUD_ATTEMPT_OUTCOME_RUNNING = 1;
  DESKTOP_AI_CLOUD_ATTEMPT_OUTCOME_SUCCEEDED = 2;
  DESKTOP_AI_CLOUD_ATTEMPT_OUTCOME_FAILED = 3;
  DESKTOP_AI_CLOUD_ATTEMPT_OUTCOME_CANCELLED = 4;
  DESKTOP_AI_CLOUD_ATTEMPT_OUTCOME_UNKNOWN = 5;
}

// No payload, prompt, output, endpoint or private custody material crosses this projection.
message DesktopAICloudAttempt {
  string attempt_id = 1;
  string connector_ref = 2;
  string source_kind = 3;
  string source_id = 4;
  string source_label = 5;
  string parent_work_id = 6;
  string parent_work_kind = 7;
  string capability = 8;
  repeated DesktopAIExecutionModel models = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp observed_at = 11;
  google.protobuf.Timestamp finished_at = 12;
  DesktopAICloudAttemptOutcome outcome = 13;
  ReasonCode reason_code = 14;
  bool usage_measured = 15;
  UsageStats usage = 16;
}

message ListDesktopAICloudHistoryRequest {
  string connector_ref = 1;
  google.protobuf.Timestamp from_time = 2;
  google.protobuf.Timestamp to_time = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListDesktopAICloudHistoryResponse {
  repeated DesktopAICloudAttempt attempts = 1;
  string next_page_token = 2;
  google.protobuf.Timestamp read_at = 3;
  bool attribution_complete = 4;
  bool records_complete = 5;
  repeated string partial_reasons = 6;
}

service RuntimeAuditService {
  rpc ListDesktopAICloudHistory(ListDesktopAICloudHistoryRequest) returns (ListDesktopAICloudHistoryResponse);
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
  rpc ListDesktopAuditEvents(ListDesktopAuditEventsRequest) returns (ListDesktopAuditEventsResponse);
  rpc ExportAuditEvents(ExportAuditEventsRequest) returns (stream AuditExportChunk);
  rpc ListUsageStats(ListUsageStatsRequest) returns (ListUsageStatsResponse);
  rpc GetRuntimeHealth(GetRuntimeHealthRequest) returns (GetRuntimeHealthResponse);
  rpc SubscribeRuntimeHealthEvents(SubscribeRuntimeHealthEventsRequest) returns (stream RuntimeHealthEvent);
  rpc GetDesktopAIActivitySnapshot(GetDesktopAIActivitySnapshotRequest) returns (GetDesktopAIActivitySnapshotResponse);
  rpc SubscribeDesktopAIActivity(SubscribeDesktopAIActivityRequest) returns (stream DesktopAIActivitySnapshot);
  rpc GetDesktopAIUsageSummary(GetDesktopAIUsageSummaryRequest) returns (GetDesktopAIUsageSummaryResponse);
}
