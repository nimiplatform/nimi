syntax = "proto3";

package nimi.runtime.v1;

option go_package = "github.com/nimiplatform/nimi/runtime/gen/runtime/v1;runtimev1";

import "google/protobuf/timestamp.proto";
import "runtime/v1/ai.proto";
import "runtime/v1/common.proto";

enum RealtimeEventType {
  REALTIME_EVENT_TYPE_UNSPECIFIED = 0;
  REALTIME_EVENT_OPENED = 1;
  REALTIME_EVENT_TEXT_DELTA = 2;
  REALTIME_EVENT_AUDIO_CHUNK = 3;
  REALTIME_EVENT_COMPLETED = 4;
  REALTIME_EVENT_FAILED = 5;
}

message OpenRealtimeSessionRequest {
  ScenarioRequestHead head = 1;
  string system_prompt = 2;
  repeated ScenarioExtension extensions = 3;
  string output_audio_format = 4;
  int32 output_sample_rate_hz = 5;
}

message OpenRealtimeSessionResponse {
  string session_id = 1;
  RoutePolicy route_decision = 2;
  string model_resolved = 3;
  string trace_id = 4;
}

message RealtimeAudioInput {
  oneof source {
    bytes audio_bytes = 1;
    string audio_uri = 2;
    ChatContentArtifactRef artifact_ref = 3;
  }
  string mime_type = 4;
  int32 sample_rate_hz = 5;
  bool end_of_turn = 6;
  reserved 7 to 15;
}

message RealtimeInputItem {
  oneof item {
    ChatMessage message = 1;
    RealtimeAudioInput audio = 2;
  }
}

message AppendRealtimeInputRequest {
  string session_id = 1;
  repeated RealtimeInputItem items = 2;
}

message AppendRealtimeInputResponse {
  Ack ack = 1;
  string trace_id = 2;
}

message ReadRealtimeEventsRequest {
  string session_id = 1;
  uint64 after_sequence = 2;
}

message RealtimeSessionOpened {
  string session_id = 1;
  string model_resolved = 2;
  RoutePolicy route_decision = 3;
}

message RealtimeTextDelta {
  string text = 1;
}

message RealtimeAudioChunk {
  bytes chunk = 1;
  string mime_type = 2;
  int32 sample_rate_hz = 3;
  bool eof = 4;
}

message RealtimeCompleted {
  FinishReason finish_reason = 1;
  UsageStats usage = 2;
}

message RealtimeFailed {
  ReasonCode reason_code = 1;
  string action_hint = 2;
}

message RealtimeEvent {
  RealtimeEventType event_type = 1;
  uint64 sequence = 2;
  string trace_id = 3;
  google.protobuf.Timestamp timestamp = 4;
  oneof payload {
    RealtimeSessionOpened opened = 10;
    RealtimeTextDelta text_delta = 11;
    RealtimeAudioChunk audio_chunk = 12;
    RealtimeCompleted completed = 13;
    RealtimeFailed failed = 14;
  }
}

message CloseRealtimeSessionRequest {
  string session_id = 1;
}

message CloseRealtimeSessionResponse {
  Ack ack = 1;
}

service RuntimeAiRealtimeService {
  rpc OpenRealtimeSession(OpenRealtimeSessionRequest) returns (OpenRealtimeSessionResponse);
  rpc AppendRealtimeInput(AppendRealtimeInputRequest) returns (AppendRealtimeInputResponse);
  rpc ReadRealtimeEvents(ReadRealtimeEventsRequest) returns (stream RealtimeEvent);
  rpc CloseRealtimeSession(CloseRealtimeSessionRequest) returns (CloseRealtimeSessionResponse);
}
