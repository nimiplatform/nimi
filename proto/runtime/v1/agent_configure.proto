syntax = "proto3";

package nimi.runtime.v1;

option go_package = "github.com/nimiplatform/nimi/runtime/gen/runtime/v1;runtimev1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "runtime/v1/agent_presentation.proto";
import "runtime/v1/ai.proto";

// The local-app agents.configure carrier accepts only Runtime-issued opaque
// Agent handles. Raw Runtime/Realm identity and authorization fields are
// intentionally absent from every request and response.
message LocalAppAgentRouteIntent {
  string capability = 1;
  string provider = 2;
  string model = 3;
  RoutePolicy route_policy = 4;
}

enum LocalAppAgentReadinessState {
  LOCAL_APP_AGENT_READINESS_STATE_UNSPECIFIED = 0;
  LOCAL_APP_AGENT_READINESS_STATE_READY = 1;
  LOCAL_APP_AGENT_READINESS_STATE_BLOCKED = 2;
  LOCAL_APP_AGENT_READINESS_STATE_UNAVAILABLE = 3;
  LOCAL_APP_AGENT_READINESS_STATE_FAILED = 4;
}
message LocalAppAgentCapabilityReadiness {
  string capability = 1;
  LocalAppAgentReadinessState state = 2;
  string reason = 3;
  google.protobuf.Timestamp observed_at = 4;
}
message LocalAppAgentModelSettingsProjection {
  repeated string capabilities = 1;
  repeated LocalAppAgentRouteIntent route_intents = 2;
  repeated LocalAppAgentCapabilityReadiness readiness = 3;
  uint64 configuration_revision = 4;
}

message LocalAppAgentReadinessProjection {
  repeated LocalAppAgentCapabilityReadiness capabilities = 1;
  uint64 configuration_revision = 2;
}

message GetLocalAppAgentConfigurationSnapshotRequest { string agent_handle = 1; }
message LocalAppAgentConfigurationSnapshotResponse { LocalAppAgentModelSettingsProjection projection = 1; }
message UpdateLocalAppAgentConfigurationRequest {
  string agent_handle = 1;
  uint64 expected_configuration_revision = 2;
  repeated LocalAppAgentRouteIntent route_intents = 3;
}
message LocalAppAgentUpdateConfigurationResponse { LocalAppAgentModelSettingsProjection projection = 1; }
message GetLocalAppAgentReadinessSnapshotRequest { string agent_handle = 1; }
message LocalAppAgentReadinessSnapshotResponse { LocalAppAgentReadinessProjection projection = 1; }

enum LocalAppAgentAutonomyMode {
  LOCAL_APP_AGENT_AUTONOMY_MODE_UNSPECIFIED = 0;
  LOCAL_APP_AGENT_AUTONOMY_MODE_OFF = 1;
  LOCAL_APP_AGENT_AUTONOMY_MODE_LOW = 2;
  LOCAL_APP_AGENT_AUTONOMY_MODE_MEDIUM = 3;
  LOCAL_APP_AGENT_AUTONOMY_MODE_HIGH = 4;
}
message LocalAppAgentAutonomyConfig {
  int64 daily_token_budget = 1;
  int64 max_tokens_per_hook = 2;
  google.protobuf.Duration min_hook_interval = 3;
  google.protobuf.Timestamp suspend_until = 4;
  LocalAppAgentAutonomyMode mode = 5;
}
message LocalAppAgentAutonomyProjection {
  bool enabled = 1;
  LocalAppAgentAutonomyConfig config = 2;
  int64 used_tokens_in_window = 3;
  google.protobuf.Timestamp window_started_at = 4;
  bool budget_exhausted = 5;
  google.protobuf.Timestamp suspended_until = 6;
  uint64 autonomy_revision = 7;
}
message LocalAppAgentAutonomyIntent {
  optional bool enabled = 1;
  optional LocalAppAgentAutonomyConfig config = 2;
}
message GetLocalAppAgentAutonomySnapshotRequest { string agent_handle = 1; }
message LocalAppAgentAutonomySnapshotResponse { LocalAppAgentAutonomyProjection projection = 1; }
message UpdateLocalAppAgentAutonomyRequest {
  string agent_handle = 1;
  uint64 expected_autonomy_revision = 2;
  LocalAppAgentAutonomyIntent intent = 3;
}
message LocalAppAgentUpdateAutonomyResponse { LocalAppAgentAutonomyProjection projection = 1; }

message LocalAppAgentPresentationProjection {
  AgentPresentationProfile profile = 1;
  string default_voice_reference = 2;
  uint64 presentation_revision = 3;
  AgentPresentationProfile previous_profile = 4;
}
message LocalAppAgentPresentationIntent {
  AgentPresentationBackendKind backend_kind = 1;
  string avatar_asset_ref = 2;
  string expression_profile_ref = 3;
  string idle_preset = 4;
  string interaction_policy_ref = 5;
  string default_voice_reference = 6;
  bool avatar_autoplay = 7;
  string background_asset_ref = 8;
}
message GetLocalAppAgentPresentationSnapshotRequest { string agent_handle = 1; }
message LocalAppAgentPresentationSnapshotResponse { LocalAppAgentPresentationProjection projection = 1; }
message CommitLocalAppAgentPresentationRequest {
  string agent_handle = 1;
  uint64 expected_presentation_revision = 2;
  LocalAppAgentPresentationIntent intent = 3;
  repeated AgentPresentationAssetMaterial imported_assets = 4;
}
message LocalAppAgentCommitPresentationResponse { LocalAppAgentPresentationProjection projection = 1; }
