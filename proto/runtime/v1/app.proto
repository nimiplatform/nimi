syntax = "proto3";

package nimi.runtime.v1;

option go_package = "github.com/nimiplatform/nimi/runtime/gen/runtime/v1;runtimev1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "runtime/v1/common.proto";

enum AppMessageEventType {
  APP_MESSAGE_EVENT_TYPE_UNSPECIFIED = 0;
  APP_MESSAGE_EVENT_RECEIVED = 1;
  APP_MESSAGE_EVENT_ACKED = 2;
  APP_MESSAGE_EVENT_FAILED = 3;
}

message SendAppMessageRequest {
  string from_app_id = 1;
  string to_app_id = 2;
  string subject_user_id = 3;
  string message_type = 4;
  google.protobuf.Struct payload = 5;
  bool require_ack = 6;
  ScopedRuntimeBindingAttachment scoped_binding = 7;
}

message SendAppMessageResponse {
  string message_id = 1;
  bool accepted = 2;
  ReasonCode reason_code = 3;
}

message SubscribeAppMessagesRequest {
  string app_id = 1;
  string subject_user_id = 2;
  // Cursor replay is not admitted by K-APP-007. Runtime rejects non-empty
  // cursor values with INVALID_ARGUMENT + PROTOCOL_ENVELOPE_INVALID.
  string cursor = 3;
  repeated string from_app_ids = 4;
  ScopedRuntimeBindingAttachment scoped_binding = 5;
}

message AppMessageEvent {
  AppMessageEventType event_type = 1;
  uint64 sequence = 2;
  string message_id = 3;
  string from_app_id = 4;
  string to_app_id = 5;
  string subject_user_id = 6;
  string message_type = 7;
  google.protobuf.Struct payload = 8;
  ReasonCode reason_code = 9;
  string trace_id = 10;
  google.protobuf.Timestamp timestamp = 11;
}

// === Nimi App Install/Uninstall Lifecycle (K-APP-011..K-APP-014) ===

// AppInstallJobPhase is the typed install/update pipeline phase. It surfaces
// the concrete step so the product Apps card can show "download / verify /
// materialize / unpack / swap / evidence" instead of a generic spinner. It is
// never inferred from transfer/process/file state. The same phase shape covers
// install, update, and healthRepair jobs (K-APP-015 / K-APP-016).
enum AppInstallJobPhase {
  APP_INSTALL_JOB_PHASE_UNSPECIFIED = 0;
  APP_INSTALL_JOB_PHASE_QUEUED = 1;
  APP_INSTALL_JOB_PHASE_RESOLVE_DESCRIPTOR = 2;
  APP_INSTALL_JOB_PHASE_DOWNLOAD = 3;
  APP_INSTALL_JOB_PHASE_VERIFY = 4;
  APP_INSTALL_JOB_PHASE_MATERIALIZE = 5;
  APP_INSTALL_JOB_PHASE_UNPACK = 6;
  APP_INSTALL_JOB_PHASE_EVIDENCE = 7;
  APP_INSTALL_JOB_PHASE_INSTALLED = 8;
  APP_INSTALL_JOB_PHASE_FAILED = 9;
  // APP_INSTALL_JOB_PHASE_SWAP is the atomic active-release pointer swap of an
  // update job. It runs only after the new release is fully materialized and
  // digest-verified; the old release stays usable until the swap commits.
  APP_INSTALL_JOB_PHASE_SWAP = 10;
  // APP_INSTALL_JOB_PHASE_CANCELLED is the terminal phase of a job cancelled
  // through HealthRepairApp(action=cancel).
  APP_INSTALL_JOB_PHASE_CANCELLED = 11;
  // APP_INSTALL_JOB_PHASE_UNINSTALLED is the terminal phase of a completed
  // uninstall lifecycle job (K-APP-017). It is reached only by a job of kind
  // APP_LIFECYCLE_JOB_KIND_UNINSTALL after the release payload is removed.
  APP_INSTALL_JOB_PHASE_UNINSTALLED = 12;
}

// AppInstallJobState is the typed terminal/in-flight job state. It aligns with
// the Platform P-NAPP-008 fail-closed projection: a failed install/update
// never projects as success and always leaves a recoverable state.
enum AppInstallJobState {
  APP_INSTALL_JOB_STATE_UNSPECIFIED = 0;
  APP_INSTALL_JOB_STATE_QUEUED = 1;
  APP_INSTALL_JOB_STATE_IN_PROGRESS = 2;
  APP_INSTALL_JOB_STATE_INSTALLED = 3;
  APP_INSTALL_JOB_STATE_FAILED = 4;
  // APP_INSTALL_JOB_STATE_CANCELLED is the terminal state of a job cancelled
  // through HealthRepairApp(action=cancel). A cancelled job is recoverable via
  // retry and is never projected as success.
  APP_INSTALL_JOB_STATE_CANCELLED = 5;
  // APP_INSTALL_JOB_STATE_UNINSTALLED is the terminal success state of an
  // uninstall lifecycle job (K-APP-017). It is reached only by a job of kind
  // APP_LIFECYCLE_JOB_KIND_UNINSTALL; a successful uninstall is never
  // projected as APP_INSTALL_JOB_STATE_INSTALLED.
  APP_INSTALL_JOB_STATE_UNINSTALLED = 6;
}

// AppLifecycleJobKind distinguishes the lifecycle operation that produced a
// job. Install, update, healthRepair, and uninstall jobs share the
// AppInstallJob shape but carry a distinct kind so the consumer never infers
// intent from phase.
enum AppLifecycleJobKind {
  APP_LIFECYCLE_JOB_KIND_UNSPECIFIED = 0;
  APP_LIFECYCLE_JOB_KIND_INSTALL = 1;
  APP_LIFECYCLE_JOB_KIND_UPDATE = 2;
  APP_LIFECYCLE_JOB_KIND_REPAIR = 3;
  // APP_LIFECYCLE_JOB_KIND_UNINSTALL marks a watchable uninstall lifecycle
  // job (K-APP-017). UninstallApp emits a typed AppInstallJob of this kind so
  // the `uninstalling` Apps card state has a single live-job truth source. An
  // uninstall job never carries the install digest/download phases; it runs
  // through the materialize phase (release payload removal) to the installed
  // (completed) terminal phase, and a failed uninstall is recoverable.
  APP_LIFECYCLE_JOB_KIND_UNINSTALL = 4;
}

// AppHealthRepairAction is the typed health/repair action token. It admits
// only the four S-APP-002 tokens; no other action is accepted.
enum AppHealthRepairAction {
  APP_HEALTH_REPAIR_ACTION_UNSPECIFIED = 0;
  APP_HEALTH_REPAIR_ACTION_CANCEL = 1;
  APP_HEALTH_REPAIR_ACTION_RETRY = 2;
  APP_HEALTH_REPAIR_ACTION_REPAIR = 3;
  APP_HEALTH_REPAIR_ACTION_REINSTALL = 4;
}

// AppLifecycleIntentAction is the closed action vocabulary owned by
// K-APP-026. A single prepare/status protocol covers every lifecycle mutation;
// callers cannot introduce action-specific confirmation RPCs.
enum AppLifecycleIntentAction {
  APP_LIFECYCLE_INTENT_ACTION_UNSPECIFIED = 0;
  APP_LIFECYCLE_INTENT_ACTION_INSTALL = 1;
  APP_LIFECYCLE_INTENT_ACTION_UNINSTALL = 2;
  APP_LIFECYCLE_INTENT_ACTION_UPDATE = 3;
  APP_LIFECYCLE_INTENT_ACTION_HEALTH_REPAIR = 4;
  APP_LIFECYCLE_INTENT_ACTION_ADOPT_LOCAL_APP = 5;
  APP_LIFECYCLE_INTENT_ACTION_REMOVE_LOCAL_APP_ADOPTION = 6;
  APP_LIFECYCLE_INTENT_ACTION_OPEN_APP = 7;
}

// AppLifecycleIntentStatus is the durable reconciliation vocabulary. An
// intent id or status is correlation-only and never authorizes a mutation.
enum AppLifecycleIntentStatus {
  APP_LIFECYCLE_INTENT_STATUS_UNSPECIFIED = 0;
  APP_LIFECYCLE_INTENT_STATUS_PREPARED = 1;
  APP_LIFECYCLE_INTENT_STATUS_CONSUMED = 2;
  APP_LIFECYCLE_INTENT_STATUS_SIDE_EFFECT_STARTED = 3;
  APP_LIFECYCLE_INTENT_STATUS_SUCCEEDED = 4;
  APP_LIFECYCLE_INTENT_STATUS_FAILED = 5;
  APP_LIFECYCLE_INTENT_STATUS_CANCELLED = 6;
  APP_LIFECYCLE_INTENT_STATUS_EXPIRED = 7;
}

// AppLifecycleDestructiveOptions is the closed set of option values that can
// alter the canonical impact for today's lifecycle methods. Runtime resolves
// and revalidates their concrete target before it issues an intent.
message AppLifecycleDestructiveOptions {
  bool delete_durable_data = 1;
  AppHealthRepairAction health_repair_action = 2;
  string target_job_id = 3;
}

// AppLifecycleCanonicalImpact is the typed input to RFC8785 JSON
// canonicalization and SHA-256 digesting. account_generation remains inside
// Runtime/protected transport and is never projected into renderer IPC.
message AppLifecycleCanonicalImpact {
  uint32 schema_version = 1;
  AppLifecycleIntentAction action = 2;
  string app_id = 3;
  uint64 account_generation = 4;
  string release_ref = 5;
  string artifact_digest = 6;
  uint64 adoption_generation = 7;
  AppLifecycleDestructiveOptions destructive_options = 8;
  repeated string impact_flags = 9;
  uint32 display_contract_version = 10;
}

message PrepareAppLifecycleIntentRequest {
  AppLifecycleIntentAction action = 1;
  string app_id = 2;
  string expected_release_ref = 3;
  string expected_artifact_digest = 4;
  uint64 expected_adoption_generation = 5;
  AppLifecycleDestructiveOptions destructive_options = 6;
}

message PrepareAppLifecycleIntentResponse {
  string intent_id = 1;
  AppLifecycleCanonicalImpact canonical_impact = 2;
  string canonical_impact_digest = 3;
  google.protobuf.Timestamp deadline = 4;
  ReasonCode reason_code = 5;
}

message GetAppLifecycleIntentStatusRequest {
  string intent_id = 1;
}

message GetAppLifecycleIntentStatusResponse {
  string intent_id = 1;
  AppLifecycleIntentStatus status = 2;
  string non_authorizing_job_id = 3;
  // canonical_result is an RFC8785 JSON document with no credential,
  // process-tuple, boot-epoch, account-generation, or ledger-anchor material.
  string canonical_result = 4;
  ReasonCode reason_code = 5;
  bool retryability = 6;
}

// AppInstallSourceKind distinguishes a bundled first-party install (no network
// download; materialized from the atomic Nimi release bundle) from an external
// immutable artifact install (HTTPS download + sha256 verification).
enum AppInstallSourceKind {
  APP_INSTALL_SOURCE_KIND_UNSPECIFIED = 0;
  APP_INSTALL_SOURCE_KIND_BUNDLED = 1;
  APP_INSTALL_SOURCE_KIND_EXTERNAL_ARTIFACT = 2;
}

// AppInstallStorageProjection mirrors the Runtime-owned app storage roots
// (P-NAPP-015 / S-APP-011). All four roots are absolute paths under the
// selected nimi_data directory.
message AppInstallStorageProjection {
  string app_root = 1;
  string release_root = 2;
  string durable_data_root = 3;
  string cache_root = 4;
  string temp_root = 5;
}

// AppStorageState is the current app-scoped storage truth state. It is
// separate from install job state: a dev/runtime-registered app can have
// admitted data/cache/tmp roots before it has an active installed release.
enum AppStorageState {
  APP_STORAGE_STATE_UNSPECIFIED = 0;
  APP_STORAGE_STATE_READY = 1;
  APP_STORAGE_STATE_INSTALL_REQUIRED = 2;
  APP_STORAGE_STATE_REPAIR_REQUIRED = 3;
  APP_STORAGE_STATE_STORAGE_UNAVAILABLE = 4;
}

// AppPackageReadinessState is the Runtime-owned package readiness projection.
// It is separate from storage truth: it reads the active release pointer and
// install evidence to decide whether the currently materialized package is
// launchable, needs install/update/repair, or is blocked fail-closed.
enum AppPackageReadinessState {
  APP_PACKAGE_READINESS_STATE_UNSPECIFIED = 0;
  APP_PACKAGE_READINESS_STATE_READY = 1;
  APP_PACKAGE_READINESS_STATE_INSTALL_REQUIRED = 2;
  APP_PACKAGE_READINESS_STATE_UPDATE_REQUIRED = 3;
  APP_PACKAGE_READINESS_STATE_REPAIR_REQUIRED = 4;
  APP_PACKAGE_READINESS_STATE_BLOCKED = 5;
}

// AppStorageProjection is the stable Runtime-owned app storage truth surface
// for app consumers (P-NAPP-015 / S-APP-011). data/cache/tmp are app-scoped
// absolute roots under selected nimi_data. active_release_root is populated
// only when an installed active release pointer resolves.
message AppStorageProjection {
  string app_id = 1;
  AppStorageState state = 2;
  string app_root = 3;
  string active_release_root = 4;
  string durable_data_root = 5;
  string cache_root = 6;
  string temp_root = 7;
  string active_version = 8;
  string storage_policy_ref = 9;
  ReasonCode reason_code = 10;
  string detail = 11;
}

// AppPackageReadinessProjection is the Runtime-owned package readiness surface
// for app consumers. It projects active release + install evidence truth only;
// registry admission and permission gates stay in Platform/SDK projections.
message AppPackageReadinessProjection {
  string app_id = 1;
  string release_descriptor_ref = 2;
  string storage_policy_ref = 3;
  string expected_version = 4;
  string active_version = 5;
  string installed_version = 6;
  string sha256 = 7;
  string verification_state = 8;
  AppPackageReadinessState state = 9;
  ReasonCode reason_code = 10;
  string detail = 11;
}

// AppInstallJob is the typed install job projection. It mirrors the
// LocalEnvironmentDependencyJob shape: a stable job id, a typed state, the
// resolved descriptor identity, a fail-closed failure detail, and a
// retryable flag so a failed install can be retried or its partial files
// removed without ever projecting as success.
message AppInstallJob {
  string job_id = 1;
  string app_id = 2;
  string release_descriptor_ref = 3;
  string installed_version = 4;
  AppInstallJobState state = 5;
  AppInstallJobPhase phase = 6;
  AppInstallSourceKind source_kind = 7;
  // sha256 is the digest computed over the downloaded/bundled artifact bytes.
  // It is populated only after the verify phase succeeds.
  string sha256 = 8;
  int64 artifact_bytes = 9;
  AppInstallStorageProjection storage = 10;
  // reason_code is the typed fail-closed reason on a failed job. It is never
  // collapsed into a generic value.
  ReasonCode reason_code = 11;
  string failure_detail = 12;
  bool retryable = 13;
  string created_at = 14;
  string updated_at = 15;
  // kind distinguishes install / update / repair jobs. They share this shape
  // but the consumer never infers the lifecycle operation from the phase.
  AppLifecycleJobKind kind = 16;
  // previous_version is the active release version before an update or repair
  // job ran. It is empty for an install job.
  string previous_version = 17;
}

message InstallAppRequest {
  // app_id resolves an admitted Nimi App registry row and its bound release
  // descriptor.
  string app_id = 1;
  // confirmed records that the user confirmed the install requirement preview
  // (size, data roots, AI/profile requirements, permissions).
  bool confirmed = 2;
  string lifecycle_intent_id = 3;
  string displayed_impact_digest = 4;
}

message InstallAppResponse {
  AppInstallJob job = 1;
}

message GetAppInstallJobRequest {
  string job_id = 1;
}

message GetAppInstallJobResponse {
  AppInstallJob job = 1;
}

message GetAppStorageRequest {
  // app_id resolves the app-scoped storage roots. For ordinary installed apps
  // it resolves against the admitted descriptor/active release. For a
  // runtime-registered developer app, it still returns data/cache/tmp under
  // the selected nimi_data root without projecting an installed release.
  string app_id = 1;
}

message GetAppStorageResponse {
  AppStorageProjection projection = 1;
}

// AccountAppInventoryState is the account-side authority for an app row. It is
// not derived from local install evidence: a verified/entitled app may be
// visible before any package is installed or adopted on this machine.
enum AccountAppInventoryState {
  ACCOUNT_APP_INVENTORY_STATE_UNSPECIFIED = 0;
  ACCOUNT_APP_INVENTORY_STATE_VERIFIED = 1;
  ACCOUNT_APP_INVENTORY_STATE_ENTITLED = 2;
  ACCOUNT_APP_INVENTORY_STATE_DISABLED = 3;
  ACCOUNT_APP_INVENTORY_STATE_REMOVED = 4;
  ACCOUNT_APP_INVENTORY_STATE_REVOKED = 5;
}

// AccountAppInstallState is the account inventory's local materialization
// overlay. Runtime install/uninstall/adoption lifecycles mutate this field;
// they do not create account entitlement truth.
enum AccountAppInstallState {
  ACCOUNT_APP_INSTALL_STATE_UNSPECIFIED = 0;
  ACCOUNT_APP_INSTALL_STATE_NOT_INSTALLED = 1;
  ACCOUNT_APP_INSTALL_STATE_INSTALLED = 2;
  ACCOUNT_APP_INSTALL_STATE_ADOPTED_LOCAL = 3;
  ACCOUNT_APP_INSTALL_STATE_REMOVED = 4;
}

// AccountAppInventoryRow is one Runtime-owned account app inventory row.
// Consumers read it through GetAccountAppInventory; no renderer/app-supplied
// account_id is accepted.
message AccountAppInventoryRow {
  string app_id = 1;
  AccountAppInventoryState account_state = 2;
  AccountAppInstallState install_state = 3;
  string last_opened_at = 4;
  string data_policy = 5;
  string verified_at = 6;
  string source = 7;
  string detail = 8;
}

// AccountAppInventoryRecord is the authenticated account-scoped app inventory
// projection. Schema version 2 hard-cuts the previous install-after-write
// library shape: account visibility and local materialization are distinct.
message AccountAppInventoryRecord {
  uint32 schema_version = 1;
  string account_id = 2;
  string updated_at = 3;
  repeated AccountAppInventoryRow apps = 4;
}

message GetAccountAppInventoryRequest {
}

message GetAccountAppInventoryResponse {
  bool exists = 1;
  AccountAppInventoryRecord record = 2;
  ReasonCode reason_code = 3;
  string detail = 4;
}

// LocalAppAdoptionState is Runtime-owned local external app adoption state. It
// is written only by the explicit AdoptLocalApp lifecycle and never by source
// scanning or Desktop renderer state.
enum LocalAppAdoptionState {
  LOCAL_APP_ADOPTION_STATE_UNSPECIFIED = 0;
  LOCAL_APP_ADOPTION_STATE_ADOPTED = 1;
  LOCAL_APP_ADOPTION_STATE_REPAIR_REQUIRED = 2;
  LOCAL_APP_ADOPTION_STATE_REMOVED = 3;
}

// LocalAppAdoptionTrust is the local trust posture. Local adoption is not public
// Platform admission and must not be projected as ordinary catalog truth.
enum LocalAppAdoptionTrust {
  LOCAL_APP_ADOPTION_TRUST_UNSPECIFIED = 0;
  LOCAL_APP_ADOPTION_TRUST_EXPLICIT_LOCAL = 1;
  LOCAL_APP_ADOPTION_TRUST_DEVELOPER_LOCAL = 2;
}

message LocalAppAdoption {
  string app_id = 1;
  string root_path = 2;
  string manifest_path = 3;
  string display_name = 4;
  string version = 5;
  string entry_ref = 6;
  string permission_scope_ref = 7;
  string storage_policy_ref = 8;
  LocalAppAdoptionState state = 9;
  LocalAppAdoptionTrust trust = 10;
  string adopted_at = 11;
  string updated_at = 12;
  ReasonCode reason_code = 13;
  string detail = 14;
}

message AdoptLocalAppRequest {
  string root_path = 1;
  string expected_app_id = 2;
  string lifecycle_intent_id = 3;
  string displayed_impact_digest = 4;
}

message AdoptLocalAppResponse {
  LocalAppAdoption adoption = 1;
  ReasonCode reason_code = 2;
  string detail = 3;
}

message ListLocalAppAdoptionsRequest {
}

message ListLocalAppAdoptionsResponse {
  repeated LocalAppAdoption adoptions = 1;
  ReasonCode reason_code = 2;
  string detail = 3;
}

message RemoveLocalAppAdoptionRequest {
  string app_id = 1;
  bool delete_durable_data_confirmed = 2;
  string lifecycle_intent_id = 3;
  string displayed_impact_digest = 4;
}

message RemoveLocalAppAdoptionResponse {
  LocalAppAdoption adoption = 1;
  ReasonCode reason_code = 2;
  string detail = 3;
}

message GetAppPackageReadinessRequest {
  // app_id resolves the admitted app's release descriptor, active release
  // pointer, and install evidence. It never scans from an app-local source.
  string app_id = 1;
}

message GetAppPackageReadinessResponse {
  AppPackageReadinessProjection projection = 1;
}

message ListAppInstallJobsRequest {
  // app_id filters jobs to a single app. Empty fails closed; global install-job
  // enumeration is not admitted for Apps inventory projection.
  string app_id = 1;
}

message ListAppInstallJobsResponse {
  repeated AppInstallJob jobs = 1;
}

message WatchAppInstallJobEventsRequest {
  // job_id scopes the stream to one Runtime-emitted lifecycle job. Empty fails
  // closed; global job event streams are not admitted.
  string job_id = 1;
}

// AppInstallJobEvent is one typed progress frame for a Watch stream. The
// snapshot field carries the full typed job projection at the time of the
// event so the consumer never reconstructs state from partial deltas.
message AppInstallJobEvent {
  uint64 sequence = 1;
  AppInstallJob job = 2;
  google.protobuf.Timestamp timestamp = 3;
}

message UninstallAppRequest {
  string app_id = 1;
  // delete_durable_data, when true, additionally removes the durable app data
  // root. It requires destructive_data_delete_confirmed.
  bool delete_durable_data = 2;
  // destructive_data_delete_confirmed records explicit user confirmation of
  // the separate destructive "Delete app data" flow with impact preview.
  bool destructive_data_delete_confirmed = 3;
  string lifecycle_intent_id = 4;
  string displayed_impact_digest = 5;
}

// AppUninstallResult is the typed uninstall projection. Uninstall removes
// release payloads by default and keeps durable data unless destructive
// deletion was explicitly confirmed.
message AppUninstallResult {
  string app_id = 1;
  bool release_removed = 2;
  bool durable_data_removed = 3;
  AppInstallStorageProjection storage = 4;
  ReasonCode reason_code = 5;
}

message UninstallAppResponse {
  // result is the typed uninstall projection carrying the K-APP-014
  // durable-data retention semantics (release_removed / durable_data_removed).
  AppUninstallResult result = 1;
  // job is the watchable uninstall lifecycle job (K-APP-017,
  // AppLifecycleJobKind=APP_LIFECYCLE_JOB_KIND_UNINSTALL). It is the single
  // live-job truth source for the `uninstalling` Apps card state and can be
  // followed via WatchAppInstallJobEvents. A failed uninstall is recorded as a
  // recoverable job and is never projected as success.
  AppInstallJob job = 2;
}

// === Nimi App Update Lifecycle (K-APP-015) ===

message UpdateAppRequest {
  // app_id resolves an admitted Nimi App registry row whose bound release
  // descriptor advanced past the currently installed version.
  string app_id = 1;
  // confirmed records that the user confirmed the update impact preview
  // (version, size, breaking-vs-non-breaking impact). It is required for a
  // required (breaking) update and ignored for a non-breaking update.
  bool confirmed = 2;
  string lifecycle_intent_id = 3;
  string displayed_impact_digest = 4;
}

message UpdateAppResponse {
  // job is the typed update job projection. It reuses the AppInstallJob shape
  // with kind=APP_LIFECYCLE_JOB_KIND_UPDATE.
  AppInstallJob job = 1;
}

// === Nimi App Health / Repair Lifecycle (K-APP-016) ===

message HealthRepairAppRequest {
  // app_id resolves the admitted Nimi App registry row whose lifecycle job is
  // being repaired.
  string app_id = 1;
  // action is the typed repair action. Only the four admitted tokens are
  // accepted; any other value fails closed.
  AppHealthRepairAction action = 2;
  // job_id optionally targets a specific lifecycle job for cancel/retry. When
  // empty, cancel/retry resolve the most recent recoverable job for the app.
  string job_id = 3;
  string lifecycle_intent_id = 4;
  string displayed_impact_digest = 5;
}

message HealthRepairAppResponse {
  // job is the typed lifecycle job projection produced by the repair action.
  // cancel returns the cancelled job; retry/repair/reinstall return the new
  // in-flight job. A failed repair is never projected as success.
  AppInstallJob job = 1;
}

// === Nimi App Open / Launch Flow (K-APP-017) ===

// AppOpenScopeRef is the explicit canonical app-launch AIConfig scope a
// caller must carry to open a Nimi App (K-APP-017 / P-AISC-007). It is the
// app-shape AIScopeRef: kind is always `app`; owner_id is the admitted Nimi
// App registry app_id and must equal the app_id being opened; surface_id is
// optional and only set when the app's manifest declares a stable AI feature
// surface. OpenApp never infers this scope — a missing or mismatched
// AppOpenScopeRef fails closed.
message AppOpenScopeRef {
  // kind is the AIScopeRef kind discriminator. For OpenApp it is fixed to the
  // literal string `app`; any other value fails closed.
  string kind = 1;
  // owner_id is the admitted Nimi App registry app_id (dot-separated app
  // identity, e.g. `nimi.avatar`). It must equal OpenAppRequest.app_id.
  string owner_id = 2;
  // surface_id is the optional stable app-declared AI feature surface id.
  // Empty means the canonical app-level AI scope.
  string surface_id = 3;
}

// AppOpenFlowStep is the typed Open-flow step (K-APP-017). It surfaces the
// concrete checkpoint the launch is at so a failed Open names the exact step
// rather than a generic failure. It is never inferred.
enum AppOpenFlowStep {
  APP_OPEN_FLOW_STEP_UNSPECIFIED = 0;
  // RESOLVE_REGISTRY resolves the admitted Nimi App registry row.
  APP_OPEN_FLOW_STEP_RESOLVE_REGISTRY = 1;
  // VERIFY_PACKAGE verifies the materialized release package + install
  // evidence (active release pointer, digest-verified payload).
  APP_OPEN_FLOW_STEP_VERIFY_PACKAGE = 2;
  // VERIFY_LIBRARY verifies the account app-inventory state for the app.
  APP_OPEN_FLOW_STEP_VERIFY_LIBRARY = 3;
  // VERIFY_APP_DATA verifies the durable app-data root state.
  APP_OPEN_FLOW_STEP_VERIFY_APP_DATA = 4;
  // VERIFY_PERMISSIONS verifies the app permissions are granted or
  // promptable.
  APP_OPEN_FLOW_STEP_VERIFY_PERMISSIONS = 5;
  // ENSURE_AICONFIG ensures the app-scope AIConfig exists (first-launch
  // initialization per S-AICONF-009).
  APP_OPEN_FLOW_STEP_ENSURE_AICONFIG = 6;
  // VALIDATE_MANIFEST validates the app manifest requirements.
  APP_OPEN_FLOW_STEP_VALIDATE_MANIFEST = 7;
  // LAUNCH is the terminal launch step: the runtime-owned app launch
  // supervision admits the app process/surface.
  APP_OPEN_FLOW_STEP_LAUNCH = 8;
}

// AppOpenState is the typed terminal Open-flow state. A blocked or failed
// Open never projects as launched.
enum AppOpenState {
  APP_OPEN_STATE_UNSPECIFIED = 0;
  // APP_OPEN_STATE_LAUNCHED means the Open flow completed and the app launch
  // was admitted.
  APP_OPEN_STATE_LAUNCHED = 1;
  // APP_OPEN_STATE_BLOCKED means a verify step fail-closed before launch
  // (package/library/app-data/permission/AIConfig/manifest). It carries the
  // distinct typed reason_code; it is never collapsed into a generic value.
  APP_OPEN_STATE_BLOCKED = 2;
  // Runtime created a short-lived launch record, but no verified child has
  // consumed it yet. This is never projected as launched=true.
  APP_OPEN_STATE_LAUNCH_PREPARED = 3;
}

message OpenAppRequest {
  // app_id resolves an admitted Nimi App registry row
  // (admission_status=admitted) and a track-discriminated launch path.
  string app_id = 1;
  // scope is the explicit canonical app-launch AIConfig scope. It is
  // mandatory: OpenApp never infers launch scope (K-APP-017 / S-APP-003).
  AppOpenScopeRef scope = 2;
  string lifecycle_intent_id = 3;
  string displayed_impact_digest = 4;
}

// AppOpenProjection is the typed Open-flow projection. It reports the
// terminal state, the step the flow reached, the resolved launch scope, and a
// fail-closed reason_code on every blocked branch.
message AppOpenProjection {
  string app_id = 1;
  AppOpenState state = 2;
  // reached_step is the last Open-flow step the launch executed. On a blocked
  // open it names the exact step that fail-closed.
  AppOpenFlowStep reached_step = 3;
  // launched is true only when state is APP_OPEN_STATE_LAUNCHED. It is never
  // inferred from process liveness or file existence.
  bool launched = 4;
  // active_version is the active release version the launch resolved. Empty
  // when the open blocked before package verification.
  string active_version = 5;
  // scope echoes the resolved app-launch AIConfig scope. On a launched open
  // the Open flow has validated this scope as the canonical app-shape
  // AIScopeRef (P-AISC-007); the per-app first-launch AIConfig initialization
  // (S-AICONF-009) is finalized by the SDK/desktop AIConfig surface against
  // this validated scope — the AIConfig store is not Runtime-owned.
  AppOpenScopeRef scope = 6;
  // reason_code is the typed fail-closed reason on a blocked open, or
  // ACTION_EXECUTED on a launched open. It is never collapsed into a generic
  // value.
  ReasonCode reason_code = 7;
  string detail = 8;
  // release_descriptor_ref is Runtime-attested descriptor identity used for
  // the installed launch. It is empty for blocked local-adoption projections;
  // adoption inventory alone cannot satisfy either production installed or
  // P-NAPP-035 local-development launch authority.
  string release_descriptor_ref = 9;
  string descriptor_class = 10;
  string admission_track = 11;
  string source_kind = 12;
  string ordinary_visibility = 13;
  string digest_verification_state = 14;
  string runtime_entry_ref = 15;
  // active_release_root is the verified installed release root Desktop can
  // host without recomputing descriptor paths. Future opaque launch URI
  // support must use a new field, not overload this path.
  string active_release_root = 16;
  AppInstallStorageProjection storage = 17;
  string shell_capability_set_ref = 18;
  // caller_mode is the installed-app posture string. The AccountCallerMode enum
  // authority lands in Task 6; this field carries the OpenApp launch-resolution
  // string without reusing external-principal posture.
  string caller_mode = 19;
  // Non-authorizing 32-byte correlation id. The host-only verified process
  // binding is established separately over protected Desktop control.
  bytes launch_id = 20;
  bool product_readiness_claim_allowed = 21;
}

message OpenAppResponse {
  AppOpenProjection projection = 1;
}

// Desktop sends only selectors observed from its suspended exact-executable
// launch. Runtime independently opens and verifies the process before binding
// it to the launch record; neither field is authority by itself.
message BindInstalledLaunchProcessRequest {
  bytes launch_id = 1;
  uint32 child_process_id = 2;
}

message BindInstalledLaunchProcessResponse {
  bytes launch_id = 1;
  google.protobuf.Timestamp bind_deadline = 2;
}

service RuntimeAppService {
  rpc SendAppMessage(SendAppMessageRequest) returns (SendAppMessageResponse);
  rpc SubscribeAppMessages(SubscribeAppMessagesRequest) returns (stream AppMessageEvent);

  rpc PrepareAppLifecycleIntent(PrepareAppLifecycleIntentRequest) returns (PrepareAppLifecycleIntentResponse);
  rpc GetAppLifecycleIntentStatus(GetAppLifecycleIntentStatusRequest) returns (GetAppLifecycleIntentStatusResponse);

  // Nimi App install/uninstall lifecycle (K-APP-011..K-APP-014).
  rpc InstallApp(InstallAppRequest) returns (InstallAppResponse);
  rpc UninstallApp(UninstallAppRequest) returns (UninstallAppResponse);
  rpc GetAppStorage(GetAppStorageRequest) returns (GetAppStorageResponse);
  rpc GetAccountAppInventory(GetAccountAppInventoryRequest) returns (GetAccountAppInventoryResponse);
  rpc AdoptLocalApp(AdoptLocalAppRequest) returns (AdoptLocalAppResponse);
  rpc ListLocalAppAdoptions(ListLocalAppAdoptionsRequest) returns (ListLocalAppAdoptionsResponse);
  rpc RemoveLocalAppAdoption(RemoveLocalAppAdoptionRequest) returns (RemoveLocalAppAdoptionResponse);
  rpc GetAppPackageReadiness(GetAppPackageReadinessRequest) returns (GetAppPackageReadinessResponse);
  rpc GetAppInstallJob(GetAppInstallJobRequest) returns (GetAppInstallJobResponse);
  rpc ListAppInstallJobs(ListAppInstallJobsRequest) returns (ListAppInstallJobsResponse);
  rpc WatchAppInstallJobEvents(WatchAppInstallJobEventsRequest) returns (stream AppInstallJobEvent);

  // Nimi App update + health/repair lifecycle (K-APP-015..K-APP-016).
  rpc UpdateApp(UpdateAppRequest) returns (UpdateAppResponse);
  rpc HealthRepairApp(HealthRepairAppRequest) returns (HealthRepairAppResponse);

  // Nimi App Open / launch flow (K-APP-017). OpenApp is the sole Runtime RPC
  // entry for launching a Nimi App; it requires an explicit app-shape
  // AIScopeRef and never infers launch scope.
  rpc OpenApp(OpenAppRequest) returns (OpenAppResponse);
  rpc BindInstalledLaunchProcess(BindInstalledLaunchProcessRequest) returns (BindInstalledLaunchProcessResponse);
}
