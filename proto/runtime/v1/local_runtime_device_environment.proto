syntax = "proto3";

package nimi.runtime.v1;

option go_package = "github.com/nimiplatform/nimi/runtime/gen/runtime/v1;runtimev1";

import "runtime/v1/ai.proto";

// === Device Profile ===

// K-DEV-001: GPU memory architecture model.
enum GpuMemoryModel {
  GPU_MEMORY_MODEL_UNSPECIFIED  = 0;
  GPU_MEMORY_MODEL_DISCRETE = 1;
  GPU_MEMORY_MODEL_UNIFIED  = 2;
}

message LocalGpuProfile {
  bool available              = 1;
  string vendor               = 2;
  string model                = 3;
  // K-DEV-001: VRAM fields. Zero means probe unavailable (not "0 bytes").
  int64 total_vram_bytes      = 4;
  int64 available_vram_bytes  = 5;
  GpuMemoryModel memory_model = 6;
}

message LocalPythonProfile {
  bool available = 1;
  string version = 2;
}

message LocalNpuProfile {
  bool available = 1;
  bool ready     = 2;
  string vendor  = 3;
  string runtime = 4;
  string detail  = 5;
}

message LocalPortAvailability {
  int32 port     = 1;
  bool available = 2;
}

message LocalDeviceProfile {
  string os                             = 1;
  string arch                           = 2;
  LocalGpuProfile gpu                   = 3;
  LocalPythonProfile python             = 4;
  LocalNpuProfile npu                   = 5;
  int64 disk_free_bytes                 = 6;
  repeated LocalPortAvailability ports  = 7;
  // K-DEV-001: Host memory fields. Zero means probe unavailable.
  int64 total_ram_bytes                 = 8;
  int64 available_ram_bytes             = 9;
}

// === Runtime-owned Local Environment ===

message LocalEnvironmentPlanDependency {
  string dependency_family = 1;
  string dependency_id = 2;
  bool required = 3;
  string state = 4;
  string source_kind = 5;
  bool confirmation_required = 6;
  string selected_source_record_id = 7;
  string environment_key = 8;
  string canonical_root = 9;
  string reason_code = 10;
  string detail = 11;
  string consumer_scope = 12;
}

message LocalEnvironmentPlan {
  string plan_id = 1;
  string pack_id = 2;
  string product_label = 3;
  string host_profile_id = 4;
  string platform_tuple = 5;
  string runtime_data_root = 6;
  string consumer_scope = 7;
  string cloud_only_impact = 8;
  string state = 9;
  string reason_code = 10;
  repeated LocalEnvironmentPlanDependency dependencies = 11;
}

message LocalEnvironmentSelectedSourceRecord {
  string record_id = 1;
  string dependency_family = 2;
  string dependency_id = 3;
  string environment_key = 4;
  string source_kind = 5;
  string canonical_root = 6;
  string version = 7;
  repeated string compatibility_evidence = 8;
  repeated string verified_artifacts = 9;
  map<string, string> hashes = 10;
  repeated string selected_consumers = 11;
  repeated string activation_env_delta = 12;
  string selected_at = 13;
  string last_verified_at = 14;
  string repair_state = 15;
  string audit_reason_code = 16;
}

message LocalEnvironmentDependencyJob {
  string job_id = 1;
  string environment_key = 2;
  string dependency_family = 3;
  string dependency_id = 4;
  string state = 5;
  string source_kind = 6;
  string canonical_root = 7;
  string selected_source_record_id = 8;
  string failure_detail = 9;
  bool retryable = 10;
  string created_at = 11;
  string updated_at = 12;
  // K-RPC-025 dependency-job download-progress projection. The fields are a
  // bounded diagnostic projection of the byte progress Runtime already tracks
  // for the job's artifact transfer; they are meaningful only while the job is
  // actively materializing (downloading / verifying) and project zero/absent
  // for every other state. They never promote, select, or substitute for
  // verification evidence. speed_bytes_per_sec / eta_seconds are projected only
  // when a rate can actually be computed and are 0 (absent) otherwise — never a
  // fabricated value.
  int64 bytes_received = 13;
  int64 bytes_total = 14;
  // percent is an integer 0..100 projected only when bytes_total > 0; 0 means
  // the total is not yet known and the consumer renders an indeterminate state.
  int32 percent = 15;
  int64 speed_bytes_per_sec = 16;
  int64 eta_seconds = 17;
  // Runtime-owned terminal reason code for the job. Empty for in-progress
  // states unless Runtime has a structured non-ready reason to project.
  string reason_code = 18;
  // Runtime-owned recovery policy projection. Consumers may filter this closed
  // string but must not parse failure_detail for recovery semantics.
  string recovery_disposition = 19;
  string consumer_scope = 20;
}

message LocalEnvironmentActivationGate {
  string consumer_id = 1;
  string pack_id = 2;
  string state = 3;
  string reason_code = 4;
  string detail = 5;
  repeated LocalEnvironmentPlanDependency blocking_dependencies = 6;
  repeated LocalEnvironmentPlanDependency dependencies = 7;
}

// === Runtime-owned First-Run Baseline Readiness (K-LENV-ACT-011) ===

// RuntimeBaselineActivationDependencyEvidence is the per-dependency readiness
// projection captured into a runtimeBaselineRef. It is owner-verifiable
// evidence, not a probe result.
message RuntimeBaselineActivationDependencyEvidence {
  string dependency_family = 1;
  string dependency_id = 2;
  string environment_key = 3;
  string selected_source_record_id = 4;
  string source_kind = 5;
  // dependency_state is always ready_system or ready_managed for a valid ref.
  string dependency_state = 6;
  string canonical_root = 7;
  // materialization_or_system_source_verification_evidence carries the
  // materialization job terminal evidence ref or the system-source
  // verification evidence ref that produced the selected source record.
  string materialization_or_system_source_verification_evidence = 8;
}

// RuntimeBaselineActivationConsumerEvidence is the per-consumer activation
// response projection captured into a runtimeBaselineRef.
message RuntimeBaselineActivationConsumerEvidence {
  string consumer_id = 1;
  string pack_id = 2;
  // activation_state is always ready for a valid ref.
  string activation_state = 3;
  string reason_code = 4;
  repeated RuntimeBaselineActivationDependencyEvidence dependencies = 5;
  // bound_asset_id is the model asset id bound to this consumer; it is
  // re-supplied to the activation gate on baseline ref re-verification.
  string bound_asset_id = 6;
}

// RuntimeBaselineReadinessRef is the durable, owner-verifiable first-run
// runtime baseline readiness evidence record owned by RuntimeLocalService
// per K-LENV-ACT-011. It is minted only after fresh activation succeeds for
// every required first-run baseline consumer.
message RuntimeBaselineReadinessRef {
  string runtime_baseline_ref = 1;
  string selected_local_factory_ai_profile_ref = 2;
  // install_level is minimal or recommended.
  string install_level = 3;
  string runtime_data_root_or_data_root_ref = 4;
  repeated string required_dependency_families = 5;
  repeated string selected_source_record_ids = 6;
  repeated RuntimeBaselineActivationConsumerEvidence activation_ready_responses = 7;
  repeated string materialization_or_system_source_verification_evidence = 8;
  string observed_at = 9;
  string runtime_verifier_identity = 10;
  repeated string runtime_audit_sequence = 11;
}

// === Runtime-owned First-Run Baseline Execution Evidence (K-AIEXEC-007) ===

// ExecutionBaselineCapabilityProof is the durable per-capability execution
// proof captured into an executionEvidenceRef. Each entry proves one selected
// local first-run baseline capability actually executed through the admitted
// Runtime local execution path against a runtimeBaselineRef-bound model asset.
// It is owner-verifiable execution evidence, never a probe or warmup result.
message ExecutionBaselineCapabilityProof {
  // capability is the canonical baseline capability id, e.g.
  // local_text_chat_execution / local_basic_stt_execution /
  // local_basic_tts_execution.
  string capability = 1;
  // scenario_type is the runtime ScenarioType the proof executed. Only
  // TEXT_GENERATE, SPEECH_SYNTHESIZE, SPEECH_TRANSCRIBE are admitted for the
  // first-run baseline; every other scenario fails closed.
  ScenarioType scenario_type = 2;
  // bound_consumer_id is the runtimeBaselineRef baseline consumer this proof
  // executed against (llama.cpp.cpu / speech.qwen3-asr.python /
  // speech.qwen3-tts.python).
  string bound_consumer_id = 3;
  // bound_asset_id is the runtimeBaselineRef-bound local model asset id this
  // capability executed against.
  string bound_asset_id = 4;
  // local_route_target is the resolved local execution route target. It is
  // always a local route (route_policy ROUTE_POLICY_LOCAL); a cloud / remote
  // target fails the evidence closed.
  string local_route_target = 5;
  // route_policy is the resolved route policy. A valid proof is always
  // ROUTE_POLICY_LOCAL.
  RoutePolicy route_policy = 6;
  // model_resolved is the runtime-resolved local model id the local execution
  // path ran.
  string model_resolved = 7;
  // terminal_result is local_executed for a successful proof, otherwise the
  // fail-closed terminal projection.
  string terminal_result = 8;
  string reason_code = 9;
  // trace_id is the execution trace id stamped by the local execution path.
  string trace_id = 10;
  string executed_at = 11;
}

// ExecutionSchedulingJudgement carries a submit-specific execution target
// scheduling judgement (K-AIEXEC-003 / K-SCHED-002). It is recorded into
// executionEvidenceRef only when a submit-specific Peek was evaluated for the
// capability about to execute; a scope aggregate judgement is never recorded
// here. When no submit-specific Peek was evaluated this message is absent.
message ExecutionSchedulingJudgement {
  // evaluated is always true when this message is present.
  bool evaluated = 1;
  // capability is the submit-specific capability the Peek target evaluated.
  string capability = 2;
  // scheduling_state is the five-state K-SCHED-002 judgement.
  string scheduling_state = 3;
  string detail = 4;
  string evaluated_at = 5;
}

// ExecutionEvidenceRef is the durable, owner-verifiable first-run baseline
// execution evidence record owned by RuntimeLocalService runtime execution
// (K-AIEXEC-007). It is minted only after every selected first-run baseline
// capability executes through the admitted Runtime local execution path and
// every execution resolved to a local route target. It carries all ten
// required_projection fields declared by product-control-record-schema.yaml ->
// evidence_contracts.executionEvidenceRef.
message ExecutionEvidenceRef {
  string execution_evidence_ref = 1;
  // 1. selected_local_factory_aiProfile_ref
  string selected_local_factory_ai_profile_ref = 2;
  // 2. install_level (minimal or recommended)
  string install_level = 3;
  // 3. runtimeBaselineRef — the previously verified runtime baseline ref this
  // execution proof was bound to and re-confirmed against.
  string runtime_baseline_ref = 4;
  // 4. dataRootRef
  string data_root_ref = 5;
  // 5. local_execution_target_evidence — the de-duplicated set of resolved
  // local route targets every baseline capability executed against.
  repeated string local_execution_target_evidence = 6;
  // 6. selected_baseline_capability_proof — one proof per selected first-run
  // baseline capability.
  repeated ExecutionBaselineCapabilityProof selected_baseline_capability_proof = 7;
  // 7. submit_specific_scheduling_judgement_when_evaluated — present only when
  // a submit-specific Peek was evaluated, else absent.
  ExecutionSchedulingJudgement submit_specific_scheduling_judgement = 8;
  // 8. terminal_result — local_ai_ready when every proof executed locally,
  // otherwise the fail-closed projection (local_ai_blocked).
  string terminal_result = 9;
  // 9. timestamps — observed_at is the mint/verify timestamp.
  string observed_at = 10;
  // 10. runtime_audit_sequence — durable Runtime audit evidence sequence.
  repeated string runtime_audit_sequence = 11;
  // runtime_verifier_identity stamps the Runtime execution verifier.
  string runtime_verifier_identity = 12;
}
