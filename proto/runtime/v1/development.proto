syntax = "proto3";

package nimi.runtime.v1;

option go_package = "github.com/nimiplatform/nimi/runtime/gen/runtime/v1;runtimev1";

import "google/protobuf/timestamp.proto";
import "runtime/v1/common.proto";

// Local-development trust is a mutable-project, non-production trust class.
// None of these enums or messages can be converted into an installed release,
// store listing, portable grant, credential, or caller-selected session proof.
enum LocalDevelopmentShellKind {
  LOCAL_DEVELOPMENT_SHELL_KIND_UNSPECIFIED = 0;
  LOCAL_DEVELOPMENT_SHELL_KIND_ELECTRON = 1;
  LOCAL_DEVELOPMENT_SHELL_KIND_TAURI = 2;
}

enum LocalDevelopmentDecision {
  LOCAL_DEVELOPMENT_DECISION_UNSPECIFIED = 0;
  LOCAL_DEVELOPMENT_DECISION_DENY = 1;
  LOCAL_DEVELOPMENT_DECISION_ALLOW_RUN_ONCE = 2;
  LOCAL_DEVELOPMENT_DECISION_ALLOW_REMEMBER_PROJECT = 3;
}

enum LocalDevelopmentAuthorizationState {
  LOCAL_DEVELOPMENT_AUTHORIZATION_STATE_UNSPECIFIED = 0;
  LOCAL_DEVELOPMENT_AUTHORIZATION_STATE_CONFIRMATION_REQUIRED = 1;
  LOCAL_DEVELOPMENT_AUTHORIZATION_STATE_ACTIVE = 2;
  LOCAL_DEVELOPMENT_AUTHORIZATION_STATE_REAPPROVAL_REQUIRED = 3;
  LOCAL_DEVELOPMENT_AUTHORIZATION_STATE_DENIED = 4;
  LOCAL_DEVELOPMENT_AUTHORIZATION_STATE_REVOKED = 5;
  LOCAL_DEVELOPMENT_AUTHORIZATION_STATE_DORMANT = 6;
}

enum DeveloperModeState {
  DEVELOPER_MODE_STATE_UNSPECIFIED = 0;
  DEVELOPER_MODE_STATE_DISABLED = 1;
  DEVELOPER_MODE_STATE_ENABLED = 2;
  DEVELOPER_MODE_STATE_UNAVAILABLE = 3;
}

message GetDeveloperModeStatusRequest {}

message GetDeveloperModeStatusResponse {
  DeveloperModeState state = 1;
  uint64 revision = 2;
  uint64 account_generation = 3;
  ReasonCode reason_code = 4;
}

enum LocalDevelopmentSummaryAvailability {
  LOCAL_DEVELOPMENT_SUMMARY_AVAILABILITY_UNSPECIFIED = 0;
  LOCAL_DEVELOPMENT_SUMMARY_AVAILABILITY_AVAILABLE = 1;
  LOCAL_DEVELOPMENT_SUMMARY_AVAILABILITY_UNAVAILABLE = 2;
}

message LocalDevelopmentDeveloperModeSummary {
  LocalDevelopmentSummaryAvailability availability = 1;
  DeveloperModeState state = 2;
  ReasonCode reason_code = 3;
}

message LocalDevelopmentProjectAuthorizationSummary {
  LocalDevelopmentSummaryAvailability availability = 1;
  uint64 active_count = 2;
  uint64 dormant_count = 3;
  uint64 denied_count = 4;
  uint64 revoked_count = 5;
  ReasonCode reason_code = 6;
}

message LocalDevelopmentGrantSummary {
  LocalDevelopmentSummaryAvailability availability = 1;
  uint64 pending_count = 2;
  uint64 granted_count = 3;
  uint64 denied_count = 4;
  uint64 expired_count = 5;
  uint64 revoked_count = 6;
  uint64 superseded_count = 7;
  ReasonCode reason_code = 8;
}

message GetLocalDevelopmentAuthoritySummaryRequest {}

// Exact bounded diagnostic projection. These sections never contain an
// account, project, principal, authorization, grant, request, operation,
// resource, path, credential, session, or boot-epoch identifier.
message GetLocalDevelopmentAuthoritySummaryResponse {
  LocalDevelopmentDeveloperModeSummary developer_mode = 1;
  LocalDevelopmentProjectAuthorizationSummary project_authorization = 2;
  LocalDevelopmentGrantSummary grant_summary = 3;
  ReasonCode reason_code = 4;
}

message SetDeveloperModeRequest {
  bool enabled = 1;
}

message SetDeveloperModeResponse {
  DeveloperModeState state = 1;
  uint64 revision = 2;
  uint64 account_generation = 3;
  ReasonCode reason_code = 4;
}

message LocalDevelopmentProjectProjection {
  string app_id = 1;
  string display_name = 2;
  string canonical_project_root = 3;
  string canonical_manifest_path = 4;
  LocalDevelopmentShellKind shell_kind = 5;
  string account_id = 6;
  repeated string requested_capabilities = 7;
  bytes capability_fingerprint = 8;
  string trust_class = 9;
}

message LocalDevelopmentAuthorizationProjection {
  // Non-secret management selector. It is not sufficient to open, bind, or
  // use a technical session and is safe for Desktop management UI.
  bytes authorization_id = 1;
  LocalDevelopmentProjectProjection project = 2;
  LocalDevelopmentAuthorizationState state = 3;
  LocalDevelopmentDecision persistence = 4;
  uint64 authorization_generation = 5;
  google.protobuf.Timestamp approved_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  ReasonCode reason_code = 8;
}

message EvaluateLocalDevelopmentProjectRequest {
  string expected_app_id = 1;
  string project_root = 2;
  LocalDevelopmentShellKind shell_kind = 3;
  // Runtime treats this as a correlation selector only. It is generated and
  // retained by the Desktop-owned supervisor and never grants authority.
  bytes supervisor_run_id = 4;
}

message EvaluateLocalDevelopmentProjectResponse {
  bytes evaluation_id = 1;
  LocalDevelopmentProjectProjection project = 2;
  LocalDevelopmentAuthorizationState state = 3;
  bool confirmation_required = 4;
  LocalDevelopmentAuthorizationProjection authorization = 5;
  google.protobuf.Timestamp evaluation_expires_at = 6;
  ReasonCode reason_code = 7;
}

message DecideLocalDevelopmentProjectRequest {
  bytes evaluation_id = 1;
  LocalDevelopmentDecision decision = 2;
  bool risk_disclosure_acknowledged = 3;
}

message DecideLocalDevelopmentProjectResponse {
  LocalDevelopmentAuthorizationProjection authorization = 1;
  ReasonCode reason_code = 2;
}

message ListLocalDevelopmentAuthorizationsRequest {}

message ListLocalDevelopmentAuthorizationsResponse {
  repeated LocalDevelopmentAuthorizationProjection authorizations = 1;
  ReasonCode reason_code = 2;
}

message ReactivateLocalDevelopmentProjectRequest {
  bytes authorization_id = 1;
  bool risk_disclosure_acknowledged = 2;
}

message ReactivateLocalDevelopmentProjectResponse {
  LocalDevelopmentAuthorizationProjection authorization = 1;
  ReasonCode reason_code = 2;
}

message RevokeLocalDevelopmentAuthorizationRequest {
  bytes authorization_id = 1;
}

message RevokeLocalDevelopmentAuthorizationResponse {
  LocalDevelopmentAuthorizationProjection authorization = 1;
  ReasonCode reason_code = 2;
}

message EndLocalDevelopmentRunRequest {
  bytes authorization_id = 1;
  bytes supervisor_run_id = 2;
}

message EndLocalDevelopmentRunResponse {
  ReasonCode reason_code = 1;
}

// RuntimeDevelopmentService is registered only on protected Desktop control
// and verified native app-host transports. The ordinary TCP transport blocks
// every method in this service before handler dispatch.
service RuntimeDevelopmentService {
  rpc GetDeveloperModeStatus(GetDeveloperModeStatusRequest) returns (GetDeveloperModeStatusResponse);
  rpc GetLocalDevelopmentAuthoritySummary(GetLocalDevelopmentAuthoritySummaryRequest) returns (GetLocalDevelopmentAuthoritySummaryResponse);
  rpc SetDeveloperMode(SetDeveloperModeRequest) returns (SetDeveloperModeResponse);
  rpc EvaluateLocalDevelopmentProject(EvaluateLocalDevelopmentProjectRequest) returns (EvaluateLocalDevelopmentProjectResponse);
  rpc DecideLocalDevelopmentProject(DecideLocalDevelopmentProjectRequest) returns (DecideLocalDevelopmentProjectResponse);
  rpc ListLocalDevelopmentAuthorizations(ListLocalDevelopmentAuthorizationsRequest) returns (ListLocalDevelopmentAuthorizationsResponse);
  rpc ReactivateLocalDevelopmentProject(ReactivateLocalDevelopmentProjectRequest) returns (ReactivateLocalDevelopmentProjectResponse);
  rpc RevokeLocalDevelopmentAuthorization(RevokeLocalDevelopmentAuthorizationRequest) returns (RevokeLocalDevelopmentAuthorizationResponse);
  rpc EndLocalDevelopmentRun(EndLocalDevelopmentRunRequest) returns (EndLocalDevelopmentRunResponse);
}
