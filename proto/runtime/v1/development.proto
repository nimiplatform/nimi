syntax = "proto3";

package nimi.runtime.v1;

option go_package = "github.com/nimiplatform/nimi/runtime/gen/runtime/v1;runtimev1";

import "google/protobuf/timestamp.proto";
import "runtime/v1/common.proto";

enum LocalDevelopmentShellKind {
  LOCAL_DEVELOPMENT_SHELL_KIND_UNSPECIFIED = 0;
  LOCAL_DEVELOPMENT_SHELL_KIND_ELECTRON = 1;
  LOCAL_DEVELOPMENT_SHELL_KIND_TAURI = 2;
}

enum DeveloperModeState {
  DEVELOPER_MODE_STATE_UNSPECIFIED = 0;
  DEVELOPER_MODE_STATE_DISABLED = 1;
  DEVELOPER_MODE_STATE_ENABLED = 2;
  DEVELOPER_MODE_STATE_UNAVAILABLE = 3;
}

message GetDeveloperModeStatusRequest {}

message GetDeveloperModeStatusResponse {
  DeveloperModeState state = 1;
  uint64 revision = 2;
  reserved 3;
  reserved "account_generation";
  ReasonCode reason_code = 4;
}

message SetDeveloperModeRequest {
  bool enabled = 1;
}

message SetDeveloperModeResponse {
  DeveloperModeState state = 1;
  uint64 revision = 2;
  reserved 3;
  reserved "account_generation";
  ReasonCode reason_code = 4;
}

// Desktop-evaluated development source and declaration input. app_access keeps
// the raw declaration for transparency; Runtime activates only supported
// domains when it commits the current declaration generation.
message LocalDevelopmentProjectProjection {
  string app_id = 1;
  string display_name = 2;
  string canonical_project_root = 3;
  string canonical_manifest_path = 4;
  LocalDevelopmentShellKind shell_kind = 5;
  reserved 6;
  reserved "account_id";
  repeated string app_access = 7;
  reserved 8;
  reserved "permission_requirement_fingerprint";
  string trust_class = 9;
  uint64 source_generation = 10;
  uint64 declaration_generation = 11;
}

// registration_handle is a non-secret management selector. It is not the
// Registered App Subject and grants no launch, session, or operation access.
message LocalDevelopmentRegistrationProjection {
  bytes registration_handle = 1;
  LocalDevelopmentProjectProjection project = 2;
  google.protobuf.Timestamp registered_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  ReasonCode reason_code = 5;
}

message RegisterLocalDevelopmentProjectRequest {
  string expected_app_id = 1;
  string project_root = 2;
  LocalDevelopmentShellKind shell_kind = 3;
  // Desktop-owned run correlation only; never registration or access truth.
  bytes supervisor_run_id = 4;
}

message RegisterLocalDevelopmentProjectResponse {
  LocalDevelopmentRegistrationProjection registration = 1;
  ReasonCode reason_code = 2;
}

message ListLocalDevelopmentRegistrationsRequest {}

message ListLocalDevelopmentRegistrationsResponse {
  repeated LocalDevelopmentRegistrationProjection registrations = 1;
  ReasonCode reason_code = 2;
}

message RemoveLocalDevelopmentRegistrationRequest {
  bytes registration_handle = 1;
}

message RemoveLocalDevelopmentRegistrationResponse {
  ReasonCode reason_code = 1;
}

message EndLocalDevelopmentRunRequest {
  bytes registration_handle = 1;
  bytes supervisor_run_id = 2;
}

message EndLocalDevelopmentRunResponse {
  ReasonCode reason_code = 1;
}

// Registered only on protected Desktop control. Registration is per verified
// local OS-user scope and does not require or persist an account decision.
service RuntimeDevelopmentService {
  rpc GetDeveloperModeStatus(GetDeveloperModeStatusRequest) returns (GetDeveloperModeStatusResponse);
  rpc SetDeveloperMode(SetDeveloperModeRequest) returns (SetDeveloperModeResponse);
  rpc RegisterLocalDevelopmentProject(RegisterLocalDevelopmentProjectRequest) returns (RegisterLocalDevelopmentProjectResponse);
  rpc ListLocalDevelopmentRegistrations(ListLocalDevelopmentRegistrationsRequest) returns (ListLocalDevelopmentRegistrationsResponse);
  rpc RemoveLocalDevelopmentRegistration(RemoveLocalDevelopmentRegistrationRequest) returns (RemoveLocalDevelopmentRegistrationResponse);
  rpc EndLocalDevelopmentRun(EndLocalDevelopmentRunRequest) returns (EndLocalDevelopmentRunResponse);
}
