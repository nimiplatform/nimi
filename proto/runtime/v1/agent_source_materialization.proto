  AGENT_SOURCE_MATERIALIZATION_UPLOAD_STATE_COMMITTED = 3;
  AGENT_SOURCE_MATERIALIZATION_UPLOAD_STATE_FAILED = 4;
  AGENT_SOURCE_MATERIALIZATION_UPLOAD_STATE_ABORTED = 5;
