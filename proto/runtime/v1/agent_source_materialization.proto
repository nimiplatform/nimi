  AGENT_SOURCE_MATERIALIZATION_SOURCE_KIND_UNSPECIFIED = 0;
  AGENT_SOURCE_MATERIALIZATION_SOURCE_KIND_WORLD_CHARACTER = 1;
  AGENT_SOURCE_MATERIALIZATION_SOURCE_KIND_REALM_PERSONA = 2;
}
