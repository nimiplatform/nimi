  AGENT_TURN_CONTEXT_TRUNCATION_REASON_UNSPECIFIED = 0;
  AGENT_TURN_CONTEXT_TRUNCATION_REASON_NONE = 1;
  AGENT_TURN_CONTEXT_TRUNCATION_REASON_INPUT_BUDGET_EXHAUSTED = 2;
  AGENT_TURN_CONTEXT_TRUNCATION_REASON_OPTIONAL_CONTENT_OMITTED = 3;
  AGENT_TURN_CONTEXT_TRUNCATION_REASON_CONTEXT_CAPACITY_EXCEEDED = 4;
}
enum AgentContextProjectionReasonCode {
  AGENT_CONTEXT_PROJECTION_REASON_CODE_UNSPECIFIED = 0;
  AGENT_CONTEXT_PROJECTION_REASON_CODE_NONE = 1;
  AGENT_CONTEXT_PROJECTION_REASON_CODE_SOURCE_NOT_MATERIALIZED = 2;
  AGENT_CONTEXT_PROJECTION_REASON_CODE_SOURCE_VALIDATION_PENDING = 3;
  AGENT_CONTEXT_PROJECTION_REASON_CODE_SOURCE_SNAPSHOT_INVALID = 4;
  AGENT_CONTEXT_PROJECTION_REASON_CODE_CONTEXT_NOT_COMPOSED = 5;
  AGENT_CONTEXT_PROJECTION_REASON_CODE_CONTEXT_CAPACITY_EXCEEDED = 6;
  AGENT_CONTEXT_PROJECTION_REASON_CODE_CONTEXT_MANIFEST_INVALID = 7;
}
enum AgentLocalSourceContextSchemaVersion {
  AGENT_LOCAL_SOURCE_CONTEXT_SCHEMA_VERSION_UNSPECIFIED = 0;
  AGENT_LOCAL_SOURCE_CONTEXT_SCHEMA_VERSION_V1 = 1;
}
enum AgentLocalSourceSnapshotSchemaVersion {
  AGENT_LOCAL_SOURCE_SNAPSHOT_SCHEMA_VERSION_UNSPECIFIED = 0;
  AGENT_LOCAL_SOURCE_SNAPSHOT_SCHEMA_VERSION_V1 = 1;
}
enum AgentTurnContextSummarySchemaVersion {
  AGENT_TURN_CONTEXT_SUMMARY_SCHEMA_VERSION_UNSPECIFIED = 0;
  AGENT_TURN_CONTEXT_SUMMARY_SCHEMA_VERSION_V1 = 1;
}
enum AgentTurnContextManifestSchemaVersion {
  AGENT_TURN_CONTEXT_MANIFEST_SCHEMA_VERSION_UNSPECIFIED = 0;
  AGENT_TURN_CONTEXT_MANIFEST_SCHEMA_VERSION_V1 = 1;
}
enum AgentTurnContextCompilerSchemaVersion {
  AGENT_TURN_CONTEXT_COMPILER_SCHEMA_VERSION_UNSPECIFIED = 0;
  AGENT_TURN_CONTEXT_COMPILER_SCHEMA_VERSION_V1 = 1;
}

message SourceMaterializationSourceRef {
  AgentSourceMaterializationSourceKind kind = 1;
  string world_id = 2;
  string source_id = 3;
  string source_content_hash = 4;
}
message SourceMaterializationChallengeLimits {
  uint64 max_bundle_bytes = 1;
  uint32 max_component_count = 2;
  uint64 max_chunk_bytes = 3;
  uint32 max_chunks = 4;
}
message CreateSourceMaterializationChallengeRequest {
  AgentRequestContext context = 1;
  string request_id = 2;
  SourceMaterializationSourceRef source_ref = 3;
}
message CreateSourceMaterializationChallengeResponse {
  string challenge_id = 1;
  string intended_runtime_audience = 2;
  string challenge_digest = 3;
  google.protobuf.Timestamp expires_at = 4;
  SourceMaterializationChallengeLimits limits = 5;
  AgentSourceMaterializationChallengeState state = 6;
  AgentSourceMaterializationReasonCode reason_code = 7;
  SourceMaterializationSourceRef source_ref = 8;
  string materializer_account_id = 9;
}
// Typed unsigned packet-v2 envelope. Semantic source/world/component bodies
// are deliberately absent and enter Runtime only through Put chunk bytes.
message SourceMaterializationPacketEnvelopeV2 {
  AgentSourceMaterializationPacketSchemaVersion packet_schema_version = 1;
  string packet_id = 2;
  string issuer = 3;
  string key_id = 4;
  AgentSourceMaterializationProofAlgorithm algorithm = 5;
  AgentSourceMaterializationKeyUse key_use = 6;
  google.protobuf.Timestamp issued_at = 7;
  google.protobuf.Timestamp expires_at = 8;
  string nonce = 9;
  string intended_runtime_audience = 10;
  string challenge_id = 11;
  string challenge_digest = 12;
  SourceMaterializationChallengeLimits challenge_limits = 13;
  string materializer_account_id = 14;
  SourceMaterializationSourceRef source_ref = 15;
  string payload_hash = 16;
  string bundle_manifest_hash = 17;
  string packet_hash = 18;
}
message SourceMaterializationBundleComponentDescriptorV1 {
  string component_id = 1;
  AgentSourceMaterializationComponentKind kind = 2;
  string schema_version = 3;
  uint64 revision = 4;
  string content_hash = 5;
  string canonical_bytes_hash = 6;
  uint64 canonical_byte_length = 7;
}
// Realm packet-v2 chunk descriptors intentionally do not carry component_id;
// component binding is proved by the ordered component ranges and the Put
// request's explicit component identity.
message SourceMaterializationBundleChunkDescriptorV1 {
  uint32 global_ordinal = 1;
  uint64 component_offset = 2;
  uint64 length = 3;
  string chunk_sha256 = 4;
}
message BundleTransportManifestV1 {
  AgentSourceMaterializationBundleManifestSchemaVersion manifest_schema_version = 1;
  AgentSourceMaterializationPayloadAssemblyVersion payload_assembly_version = 2;
  string packet_id = 3;
  string challenge_digest = 4;
  uint64 total_canonical_bytes = 5;
  uint32 component_count = 6;
  uint32 chunk_count = 7;
  repeated SourceMaterializationBundleComponentDescriptorV1 components = 8;
  repeated SourceMaterializationBundleChunkDescriptorV1 chunks = 9;
}
message SourceMaterializationBeginControl {
  SourceMaterializationPacketEnvelopeV2 packet_envelope = 1;
  string packet_proof = 2;
  BundleTransportManifestV1 bundle_transport_manifest = 3;
}
message BeginSourceMaterializationUploadRequest {
  AgentRequestContext context = 1;
  string begin_request_id = 2;
  SourceMaterializationBeginControl control = 3;
}
message BeginSourceMaterializationUploadResponse {
  string upload_id = 1;
  string packet_hash = 2;
  string bundle_manifest_hash = 3;
  AgentSourceMaterializationUploadState upload_state = 4;
  AgentSourceMaterializationChallengeState challenge_state = 5;
  AgentSourceMaterializationReasonCode reason_code = 6;
  google.protobuf.Timestamp expires_at = 7;
}
message PutSourceMaterializationChunkRequest {
  AgentRequestContext context = 1;
  string put_request_id = 2;
  string upload_id = 3;
  string packet_hash = 4;
  string bundle_manifest_hash = 5;
  uint32 global_ordinal = 6;
  string component_id = 7;
  uint64 component_offset = 8;
  string chunk_sha256 = 9;
  bytes bytes = 10;
}
message PutSourceMaterializationChunkResponse {
  string upload_id = 1;
  uint32 global_ordinal = 2;
  string component_id = 3;
  bool idempotent_replay = 4;
  AgentSourceMaterializationUploadState upload_state = 5;
  AgentSourceMaterializationReasonCode reason_code = 6;
}
message CommitSourceMaterializationRequest {
  AgentRequestContext context = 1;
  string commit_request_id = 2;
  string upload_id = 3;
  string packet_hash = 4;
  string bundle_manifest_hash = 5;
}
message CommitSourceMaterializationResponse {
  string upload_id = 1;
  string local_agent_ref = 2;
  AgentSourceMaterializationUploadState upload_state = 3;
  AgentSourceMaterializationChallengeState challenge_state = 4;
  AgentSourceMaterializationReasonCode reason_code = 5;
  LocalAgentSourceContextStatus source_context_status = 6;
}
message AbortSourceMaterializationUploadRequest {
  AgentRequestContext context = 1;
  string abort_request_id = 2;
  string upload_id = 3;
  string packet_hash = 4;
  string bundle_manifest_hash = 5;
}
message AbortSourceMaterializationUploadResponse {
  string upload_id = 1;
  AgentSourceMaterializationUploadState upload_state = 2;
  AgentSourceMaterializationChallengeState challenge_state = 3;
  AgentSourceMaterializationReasonCode reason_code = 4;
  bool idempotent_replay = 5;
}
message LocalAgentSourceCoverageSectionStatus {
  AgentLocalSourceCoverageSection section = 1;
  AgentLocalSourceCoverageState state = 2;
  uint32 required_count = 3;
  uint32 resolved_count = 4;
  uint32 omitted_count = 5;
}
// K-AGCORE-158 bounded source/snapshot projection. It intentionally excludes
// raw core/world/closure content, proof, chunks, prompts, transcript, memory,
// and every free-form map.
message LocalAgentSourceContextStatus {
  AgentLocalSourceContextSchemaVersion schema_version = 1;
  bool ready = 2;
  AgentLocalSourceContextState state = 3;
  AgentContextProjectionReasonCode reason_code = 4;
  string local_agent_ref = 5;
  SourceMaterializationSourceRef source_ref = 6;
  string source_schema_version = 7;
  AgentLocalSourceSnapshotSchemaVersion snapshot_schema_version = 8;
  string snapshot_hash = 9;
  google.protobuf.Timestamp captured_at = 10;
  string world_content_hash = 11;
  string materialization_context_hash = 12;
  repeated LocalAgentSourceCoverageSectionStatus coverage_sections = 13;
}
message AgentTurnContextLaneSummary {
  AgentTurnContextLaneId lane_id = 1;
  AgentTurnContextLaneState state = 2;
  uint32 included_item_count = 3;
  uint32 omitted_item_count = 4;
  uint32 truncated_item_count = 5;
  uint64 allocated_tokens = 6;
  uint64 used_tokens = 7;
}
message AgentTurnContextBudgetSummary {
  uint64 context_window_tokens = 1;
  uint64 reserved_output_tokens = 2;
  uint64 reserved_safety_tokens = 3;
  uint64 reserved_adapter_tokens = 4;
  uint64 input_budget_tokens = 5;
  uint64 used_tokens = 6;
}
message AgentTurnContextTruncationSummary {
  AgentTurnContextTruncationReason reason = 1;
  uint32 omitted_item_count = 2;
  uint32 truncated_item_count = 3;
}
// K-AGCORE-158 bounded manifest projection. Raw lane/prompt/transcript/memory,
// provider payloads, credentials, and tool arguments/results are absent.
message AgentTurnContextSummary {
  AgentTurnContextSummarySchemaVersion schema_version = 1;
  bool ready = 2;
  AgentTurnContextState state = 3;
  AgentContextProjectionReasonCode reason_code = 4;
  AgentTurnContextManifestSchemaVersion manifest_schema_version = 5;
  AgentTurnContextCompilerSchemaVersion compiler_schema_version = 6;
  string manifest_instance_hash = 7;
  string context_content_hash = 8;
  string prompt_hash = 9;
  string source_snapshot_hash = 10;
  SourceMaterializationSourceRef source_ref = 11;
  string world_content_hash = 12;
  string materialization_context_hash = 13;
  repeated AgentTurnContextLaneSummary lanes = 14;
  AgentTurnContextBudgetSummary budget = 15;
  repeated AgentTurnContextTruncationSummary truncation = 16;
  uint32 transcript_turn_count = 17;
  uint32 memory_item_count = 18;
  uint32 media_count = 19;
  uint32 tool_count = 20;
  string route_digest = 21;
  string catalog_revision_digest = 22;
  string local_agent_ref = 23;
  string conversation_anchor_id = 24;
  string turn_id = 25;
}
