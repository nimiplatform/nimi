syntax = "proto3";
package nimi.runtime.v1;
option go_package = "github.com/nimiplatform/nimi/runtime/gen/runtime/v1;runtimev1";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "runtime/v1/agent_common.proto";
import "runtime/v1/agent_companion.proto";
import "runtime/v1/agent_configure.proto";
import "runtime/v1/agent_presentation.proto";
import "runtime/v1/agent_source_materialization.proto";
import "runtime/v1/capability_configuration.proto";
import "runtime/v1/common.proto";
import "runtime/v1/delegated_control.proto";
import "runtime/v1/memory.proto";
import "runtime/v1/voice.proto";
enum AgentLifecycleStatus { AGENT_LIFECYCLE_STATUS_UNSPECIFIED = 0; AGENT_LIFECYCLE_STATUS_INITIALIZING = 1; AGENT_LIFECYCLE_STATUS_ACTIVE = 2; AGENT_LIFECYCLE_STATUS_SUSPENDED = 3; AGENT_LIFECYCLE_STATUS_TERMINATING = 4; AGENT_LIFECYCLE_STATUS_TERMINATED = 5; }
enum AgentExecutionState { AGENT_EXECUTION_STATE_UNSPECIFIED = 0; AGENT_EXECUTION_STATE_IDLE = 1; AGENT_EXECUTION_STATE_CHAT_ACTIVE = 2; AGENT_EXECUTION_STATE_LIFE_PENDING = 3; AGENT_EXECUTION_STATE_LIFE_RUNNING = 4; AGENT_EXECUTION_STATE_SUSPENDED = 5; }
enum AgentTrackType { AGENT_TRACK_TYPE_UNSPECIFIED = 0; AGENT_TRACK_TYPE_CHAT = 1; AGENT_TRACK_TYPE_LIFE = 2; }
// K-AGCORE-041 HookIntent trigger family is limited to `time` and `event`.
// Non-admitted trigger families (turn_completed, scheduled_time absolute,
// state_condition, world_event, compound) are not part of the mounted
// vocabulary and must not be reintroduced by implementation rename.
enum HookTriggerFamily { HOOK_TRIGGER_FAMILY_UNSPECIFIED = 0; HOOK_TRIGGER_FAMILY_TIME = 1; HOOK_TRIGGER_FAMILY_EVENT = 2; }
// K-AGCORE-041 admitted effect is limited to `follow-up-turn`. Widening
// beyond this matrix requires a later dedicated runtime rule.
enum HookEffect { HOOK_EFFECT_UNSPECIFIED = 0; HOOK_EFFECT_FOLLOW_UP_TURN = 1; }
// K-AGCORE-041 admission states that must remain reconstructable through
// committed runtime truth.
enum HookAdmissionState { HOOK_ADMISSION_STATE_UNSPECIFIED = 0; HOOK_ADMISSION_STATE_PROPOSED = 1; HOOK_ADMISSION_STATE_PENDING = 2; HOOK_ADMISSION_STATE_REJECTED = 3; HOOK_ADMISSION_STATE_RUNNING = 4; HOOK_ADMISSION_STATE_COMPLETED = 5; HOOK_ADMISSION_STATE_FAILED = 6; HOOK_ADMISSION_STATE_CANCELED = 7; HOOK_ADMISSION_STATE_RESCHEDULED = 8; }
enum AgentEventType { AGENT_EVENT_TYPE_UNSPECIFIED = 0; AGENT_EVENT_TYPE_LIFECYCLE = 1; AGENT_EVENT_TYPE_HOOK = 2; AGENT_EVENT_TYPE_MEMORY = 3; AGENT_EVENT_TYPE_BUDGET = 4; AGENT_EVENT_TYPE_REPLICATION = 5; AGENT_EVENT_TYPE_STATE = 6; AGENT_EVENT_TYPE_PRESENTATION = 7; AGENT_EVENT_TYPE_AVATAR_DEBUG = 8; AGENT_EVENT_TYPE_PROACTIVE = 9; }
// K-AGCORE-037 AgentStateEventFamily discriminates runtime.agent.state.* event
// families. Mapping is 1:1 to the mounted public family names
// (runtime.agent.state.{status_text_changed|execution_state_changed|
// emotion_changed|posture_changed}). Consumers MUST dispatch on `family`;
// reading payload fields alone is not a substitute for the discriminator.
enum AgentStateEventFamily { AGENT_STATE_EVENT_FAMILY_UNSPECIFIED = 0; AGENT_STATE_EVENT_FAMILY_STATUS_TEXT_CHANGED = 1; AGENT_STATE_EVENT_FAMILY_EXECUTION_STATE_CHANGED = 2; AGENT_STATE_EVENT_FAMILY_EMOTION_CHANGED = 3; AGENT_STATE_EVENT_FAMILY_POSTURE_CHANGED = 4; }
// K-AGCORE-143 AgentProactiveEventFamily discriminates
// runtime.agent.proactive.* event families. The family maps 1:1 to
// runtime.agent.proactive.{suggested|delivered|suppressed}.
enum AgentProactiveEventFamily { AGENT_PROACTIVE_EVENT_FAMILY_UNSPECIFIED = 0; AGENT_PROACTIVE_EVENT_FAMILY_SUGGESTED = 1; AGENT_PROACTIVE_EVENT_FAMILY_DELIVERED = 2; AGENT_PROACTIVE_EVENT_FAMILY_SUPPRESSED = 3; }
enum AgentProactiveTriggerSource { AGENT_PROACTIVE_TRIGGER_SOURCE_UNSPECIFIED = 0; AGENT_PROACTIVE_TRIGGER_SOURCE_LIFE_TRACK_CADENCE = 1; AGENT_PROACTIVE_TRIGGER_SOURCE_HOOK_INTENT = 2; }
enum AgentProactiveEffectClass { AGENT_PROACTIVE_EFFECT_CLASS_UNSPECIFIED = 0; AGENT_PROACTIVE_EFFECT_CLASS_IN_APP_COMPANION_SURFACE = 1; }
enum AgentProactiveDeliveryChannel { AGENT_PROACTIVE_DELIVERY_CHANNEL_UNSPECIFIED = 0; AGENT_PROACTIVE_DELIVERY_CHANNEL_IN_APP_SURFACE = 1; AGENT_PROACTIVE_DELIVERY_CHANNEL_NOTIFICATION_NOT_ADMITTED = 2; }
enum AgentProactiveOptInState { AGENT_PROACTIVE_OPT_IN_STATE_UNSPECIFIED = 0; AGENT_PROACTIVE_OPT_IN_STATE_OFF = 1; AGENT_PROACTIVE_OPT_IN_STATE_PENDING = 2; AGENT_PROACTIVE_OPT_IN_STATE_GRANTED = 3; AGENT_PROACTIVE_OPT_IN_STATE_DENIED = 4; AGENT_PROACTIVE_OPT_IN_STATE_REVOKED = 5; AGENT_PROACTIVE_OPT_IN_STATE_EXPIRED = 6; AGENT_PROACTIVE_OPT_IN_STATE_MISSING = 7; }
enum AgentProactiveQuietHoursState { AGENT_PROACTIVE_QUIET_HOURS_STATE_UNSPECIFIED = 0; AGENT_PROACTIVE_QUIET_HOURS_STATE_INACTIVE = 1; AGENT_PROACTIVE_QUIET_HOURS_STATE_ACTIVE = 2; AGENT_PROACTIVE_QUIET_HOURS_STATE_NOT_CONFIGURED = 3; }
enum AgentProactiveFrequencyCapState { AGENT_PROACTIVE_FREQUENCY_CAP_STATE_UNSPECIFIED = 0; AGENT_PROACTIVE_FREQUENCY_CAP_STATE_WITHIN_CAP = 1; AGENT_PROACTIVE_FREQUENCY_CAP_STATE_CAPPED = 2; AGENT_PROACTIVE_FREQUENCY_CAP_STATE_NOT_CONFIGURED = 3; }
enum AgentProactiveSuppressionReason { AGENT_PROACTIVE_SUPPRESSION_REASON_UNSPECIFIED = 0; AGENT_PROACTIVE_SUPPRESSION_REASON_QUIET_HOURS_ACTIVE = 1; AGENT_PROACTIVE_SUPPRESSION_REASON_FREQUENCY_CAP_EXCEEDED = 2; AGENT_PROACTIVE_SUPPRESSION_REASON_PERMISSION_DENIED = 3; AGENT_PROACTIVE_SUPPRESSION_REASON_PERMISSION_REVOKED = 4; AGENT_PROACTIVE_SUPPRESSION_REASON_PERMISSION_MISSING = 5; AGENT_PROACTIVE_SUPPRESSION_REASON_PERMISSION_EXPIRED = 6; AGENT_PROACTIVE_SUPPRESSION_REASON_AUTONOMY_OFF = 7; AGENT_PROACTIVE_SUPPRESSION_REASON_BUDGET_EXHAUSTED = 8; AGENT_PROACTIVE_SUPPRESSION_REASON_SCHEDULER_DENIED = 9; AGENT_PROACTIVE_SUPPRESSION_REASON_HOOK_CONFLICT = 10; AGENT_PROACTIVE_SUPPRESSION_REASON_RUNTIME_UNAVAILABLE = 11; AGENT_PROACTIVE_SUPPRESSION_REASON_UNSUPPORTED_DELIVERY_CHANNEL = 12; AGENT_PROACTIVE_SUPPRESSION_REASON_MISSING_AUDIT_REF = 13; }
enum AvatarDebugProbeKind {
  AVATAR_DEBUG_PROBE_KIND_UNSPECIFIED = 0; AVATAR_DEBUG_PROBE_KIND_PACKAGE_VALIDATION = 1; AVATAR_DEBUG_PROBE_KIND_LAUNCH_READINESS = 2;
  AVATAR_DEBUG_PROBE_KIND_BACKEND_LOAD = 3; AVATAR_DEBUG_PROBE_KIND_CAPABILITY_PROFILE = 4; AVATAR_DEBUG_PROBE_KIND_ROUTE_SUPPORT_MATRIX = 5;
  AVATAR_DEBUG_PROBE_KIND_GENERATED_MOTION = 6; AVATAR_DEBUG_PROBE_KIND_EMOTION_EXPRESSION = 7; AVATAR_DEBUG_PROBE_KIND_SPEECH_LIPSYNC = 8; AVATAR_DEBUG_PROBE_KIND_WINDOW_HIT_REGION = 9;
}
enum AvatarDebugProbeStatus {
  AVATAR_DEBUG_PROBE_STATUS_UNSPECIFIED = 0; AVATAR_DEBUG_PROBE_STATUS_PASSED = 1; AVATAR_DEBUG_PROBE_STATUS_FAILED = 2;
  AVATAR_DEBUG_PROBE_STATUS_UNSUPPORTED = 3; AVATAR_DEBUG_PROBE_STATUS_BLOCKED = 4; AVATAR_DEBUG_PROBE_STATUS_INVALID = 5;
}
enum AvatarDebugRequestedBy { AVATAR_DEBUG_REQUESTED_BY_UNSPECIFIED = 0; AVATAR_DEBUG_REQUESTED_BY_DESKTOP_DEBUG_WORKBENCH = 1; AVATAR_DEBUG_REQUESTED_BY_RUNTIME_POLICY = 2; }
enum AvatarDebugEventFamily { AVATAR_DEBUG_EVENT_FAMILY_UNSPECIFIED = 0; AVATAR_DEBUG_EVENT_FAMILY_PROBE_REQUESTED = 1; AVATAR_DEBUG_EVENT_FAMILY_PROBE_RESULT = 2; AVATAR_DEBUG_EVENT_FAMILY_REPLAY_LINKED = 3; }
enum AvatarDebugReplayRedactionState { AVATAR_DEBUG_REPLAY_REDACTION_STATE_UNSPECIFIED = 0; AVATAR_DEBUG_REPLAY_REDACTION_STATE_REDACTED = 1; AVATAR_DEBUG_REPLAY_REDACTION_STATE_VISIBLE = 2; AVATAR_DEBUG_REPLAY_REDACTION_STATE_FORBIDDEN = 3; }
enum AvatarDebugReplayVisibility { AVATAR_DEBUG_REPLAY_VISIBILITY_UNSPECIFIED = 0; AVATAR_DEBUG_REPLAY_VISIBILITY_DESKTOP_DEBUG_WORKBENCH = 1; AVATAR_DEBUG_REPLAY_VISIBILITY_SDK_DIAGNOSTICS = 2; AVATAR_DEBUG_REPLAY_VISIBILITY_RUNTIME_AUDIT_ONLY = 3; }
enum AgentAutonomyMode {
  AGENT_AUTONOMY_MODE_UNSPECIFIED = 0;
  AGENT_AUTONOMY_MODE_OFF = 1;
  AGENT_AUTONOMY_MODE_LOW = 2;
  AGENT_AUTONOMY_MODE_MEDIUM = 3;
  AGENT_AUTONOMY_MODE_HIGH = 4;
}
enum AgentCanonicalMemoryReviewReadiness {
  AGENT_CANONICAL_MEMORY_REVIEW_READINESS_UNSPECIFIED = 0;
  AGENT_CANONICAL_MEMORY_REVIEW_READINESS_ELIGIBLE = 1;
  AGENT_CANONICAL_MEMORY_REVIEW_READINESS_WAITING_FOR_WINDOW = 2;
  AGENT_CANONICAL_MEMORY_REVIEW_READINESS_EXECUTOR_UNAVAILABLE = 3;
  AGENT_CANONICAL_MEMORY_REVIEW_READINESS_RECOVERABLE_RUN_BLOCKING = 4;
  AGENT_CANONICAL_MEMORY_REVIEW_READINESS_BANK_UNAVAILABLE = 5;
}
enum ConversationAnchorStatus {
  CONVERSATION_ANCHOR_STATUS_UNSPECIFIED = 0;
  CONVERSATION_ANCHOR_STATUS_ACTIVE = 1;
  CONVERSATION_ANCHOR_STATUS_CLOSED = 2;
}
message AgentAutonomyConfig {
  int64 daily_token_budget = 1;
  int64 max_tokens_per_hook = 2;
  google.protobuf.Duration min_hook_interval = 3;
  google.protobuf.Timestamp suspend_until = 4;
  AgentAutonomyMode mode = 5;
  google.protobuf.Struct extensions = 10;
}
message AgentAutonomyState {
  bool enabled = 1;
  AgentAutonomyConfig config = 2;
  int64 used_tokens_in_window = 3;
  google.protobuf.Timestamp window_started_at = 4;
  bool budget_exhausted = 5;
  google.protobuf.Timestamp suspended_until = 6;
  uint64 revision = 7;
}
message LocalAgentRecord {
  reserved 20;
  reserved "agent_id";
  string local_agent_ref = 1;
  string display_name = 2;
  AgentLifecycleStatus lifecycle_status = 3;
  AgentAutonomyState autonomy = 4;
  google.protobuf.Struct metadata = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  AgentPresentationProfile presentation_profile = 8;
  uint64 presentation_profile_revision = 9;
  string owner_user_id = 21;
  string runtime_source_ref = 22;
  LocalAgentSourceContextStatus source_context_status = 23;
  // Exactly one previous committed selection is retained for explicit
  // restore-as-new-commit. Its embedded revision records where it came from;
  // clients must commit the selection against the current profile revision.
  AgentPresentationProfile previous_presentation_profile = 24;
}
message AgentStateProjection {
  AgentExecutionState execution_state = 1;
  string status_text = 2;
  string active_world_id = 3;
  string active_user_id = 4;
  map<string, string> attributes = 5;
  google.protobuf.Timestamp updated_at = 6;
  // K-AGCORE-038: current_emotion is durable-until-replace runtime state and
  // must project through AgentStateProjection.current_emotion. Emitting only
  // runtime.agent.state.emotion_changed without writing here is authority
  // drift: GetAgentState / snapshot / recovery would not observe committed
  // emotion truth.
  string current_emotion = 7;
  // K-AGCORE-143: proactive_interruptibility is the bounded read-only
  // proactive_interruptibility_v1 projection. Runtime owns the fields; apps
  // and SDKs must not infer quiet hours, frequency caps, permission grants, or
  // delivery truth when this projection is absent.
  AgentProactiveInterruptibilityProjection proactive_interruptibility = 8;
}
message AgentStateSetStatusText {
  string status_text = 1;
}
message AgentStateSetWorldContext {
  string world_id = 1;
}
message AgentStateClearWorldContext {}
message AgentStateSetDyadicContext {
  string user_id = 1;
}
message AgentStateClearDyadicContext {}
message AgentStatePutAttribute {
  string key = 1;
  string value = 2;
}
message AgentStateRemoveAttribute {
  string key = 1;
}
message AgentStateMutation {
  oneof mutation {
    AgentStateSetStatusText set_status_text = 1;
    AgentStateSetWorldContext set_world_context = 2;
    AgentStateClearWorldContext clear_world_context = 3;
    AgentStateSetDyadicContext set_dyadic_context = 4;
    AgentStateClearDyadicContext clear_dyadic_context = 5;
    AgentStatePutAttribute put_attribute = 6;
    AgentStateRemoveAttribute remove_attribute = 7;
  }
}
// K-AGCORE-041 HookIntent admitted trigger detail shapes.
// `time(delay)` uses a relative delay applied at admission time.
// `event(user_idle, idle_for)` and `event(chat_ended)` are the only admitted
// event-family details. No absolute-time, turn-completed, state-condition,
// world-event, or compound trigger is admitted in the v1 matrix.
message HookTriggerTimeDetail {
  google.protobuf.Duration delay = 1;
}
message HookTriggerEventUserIdleDetail {
  google.protobuf.Duration idle_for = 1;
}
message HookTriggerEventChatEndedDetail {}
message HookTriggerDetail {
  oneof detail {
    HookTriggerTimeDetail time = 10;
    HookTriggerEventUserIdleDetail event_user_idle = 11;
    HookTriggerEventChatEndedDetail event_chat_ended = 12;
  }
}
// K-AGCORE-041 HookIntent minimum typed shape.
// `intent_id` is hook identity across the admission lifecycle.
// `trigger_family` + `trigger_detail` + `effect` + `admission_state` together
// form the committed runtime truth projected on `runtime.agent.hook.*`.
// Origin linkage (`conversation_anchor_id`, `originating_turn_id`,
// `originating_stream_id`) is preserved when present but never fabricated.
message HookIntent {
  string intent_id = 1;
  string agent_id = 2;
  string conversation_anchor_id = 3;
  string originating_turn_id = 4;
  string originating_stream_id = 5;
  HookTriggerFamily trigger_family = 6;
  HookTriggerDetail trigger_detail = 7;
  HookEffect effect = 8;
  HookAdmissionState admission_state = 9;
  google.protobuf.Timestamp not_before = 10;
  google.protobuf.Timestamp expires_at = 11;
  string reason = 12;
}
// HookExecutionOutcome projects a single admission-state transition of a
// `HookIntent`. `reason_code` is populated only on rejected/failed states;
// `reason` is populated only on canceled state. `observed_at` is the
// committed transition time.
message HookExecutionOutcome {
  HookIntent intent = 1;
  google.protobuf.Timestamp observed_at = 2;
  ReasonCode reason_code = 3;
  string message = 4;
  string reason = 5;
}
// PendingHook represents admitted scheduler truth for a HookIntent that has
// reached `pending` admission state. The embedded HookIntent carries all
// admitted hook vocabulary; there is no parallel trigger/next-intent shape.
message PendingHook {
  HookIntent intent = 1;
  google.protobuf.Timestamp scheduled_for = 2;
  google.protobuf.Timestamp admitted_at = 3;
}
message CanonicalMemoryCandidate {
  MemoryCanonicalClass canonical_class = 1;
  MemoryBankLocator target_bank = 2;
  MemoryRecordInput record = 3;
  string source_event_id = 4;
  string policy_reason = 5;
  google.protobuf.Struct extensions = 10;
}
message CanonicalMemoryView {
  MemoryCanonicalClass canonical_class = 1;
  MemoryBankLocator source_bank = 2;
  MemoryRecord record = 3;
  double recall_score = 4;
  string policy_reason = 5;
}
message CanonicalMemoryRejection {
  string source_event_id = 1;
  ReasonCode reason_code = 2;
  string message = 3;
}
message AgentLifecycleEventDetail {
  AgentLifecycleStatus previous_status = 1;
  AgentLifecycleStatus current_status = 2;
}
// AgentHookEventDetail projects a `runtime.agent.hook.*` event per
// K-AGCORE-042. `family` is the first-class runtime-owned discriminator
// (mirror of `intent.admission_state`) and maps 1:1 to the mounted public
// seam family name (`runtime.agent.hook.intent_proposed` / `pending` /
// `rejected` / `running` / `completed` / `failed` / `canceled` /
// `rescheduled`). Consumers MUST read `family` to dispatch; reading
// `intent.admission_state` alone is admitted but treated as an internal
// consistency check, not as the discriminator.
message AgentHookEventDetail {
  HookAdmissionState family = 1;
  HookIntent intent = 2;
  google.protobuf.Timestamp observed_at = 3;
  ReasonCode reason_code = 4;
  string message = 5;
  string reason = 6;
}
message AgentMemoryEventDetail {
  repeated CanonicalMemoryView accepted = 1;
  repeated CanonicalMemoryRejection rejected = 2;
}
message AgentBudgetEventDetail {
  bool budget_exhausted = 1;
  int64 remaining_tokens = 2;
  google.protobuf.Timestamp window_started_at = 3;
}
message AgentReplicationEventDetail {
  string memory_id = 1;
  MemoryReplicationState replication = 2;
}
// K-AGCORE-037 PostureProjection is the canonical schema alias for
// runtime.agent.state.posture_changed.detail.current_posture. Only the
// narrow read-only projection admitted through K-AGCORE-037 may cross the
// public RuntimeAgentService surface; runtime-private posture truth (truth
// basis ids, transition reason, posture class) is not exposed here.
message AgentPostureProjection {
  string action_family = 1;
  string interrupt_mode = 2;
}
// AgentStateEventDetail projects runtime.agent.state.* events per
// K-AGCORE-037 / state_envelope. `agent_id` is REQUIRED at the AgentEvent
// envelope level; origin linkage (`conversation_anchor_id` /
// `originating_turn_id` / `originating_stream_id`) is OPTIONAL and is carried
// ONLY when the state projection is traceable to a specific continuity
// branch. Runtime MUST NOT fabricate origin linkage for no-origin state
// transitions (admin posture change, lifecycle-driven state, etc.).
message AgentStateEventDetail {
  AgentStateEventFamily family = 1;
  // Optional origin linkage (state_envelope.optional_origin_fields).
  string conversation_anchor_id = 2;
  string originating_turn_id = 3;
  string originating_stream_id = 4;
  // Family-specific payload fields. Exactly one family's block is populated
  // per event; discriminator is `family`.
  string current_status_text = 10;
  string previous_status_text = 11;
  bool has_previous_status_text = 12;
  AgentExecutionState current_execution_state = 20;
  AgentExecutionState previous_execution_state = 21;
  string current_emotion = 30;
  string previous_emotion = 31;
  string emotion_source = 32;
  AgentPostureProjection current_posture = 40;
  AgentPostureProjection previous_posture = 41;
}
// AgentProactiveEventDetail projects runtime.agent.proactive.* per K-AGCORE-143; required audit/origin fields must not be fabricated.
message AgentProactiveEventDetail {
  AgentProactiveEventFamily family = 1; string projection_id = 2; string projection_kind = 3; string owner_domain = 4;
  AgentProactiveTriggerSource trigger_source = 5; AgentProactiveEffectClass effect_class = 6; AgentProactiveDeliveryChannel delivery_channel = 7; AgentAutonomyMode mode = 8;
  AgentProactiveOptInState opt_in_state = 9; AgentProactiveQuietHoursState quiet_hours = 10; AgentProactiveFrequencyCapState frequency_cap = 11; AgentProactiveSuppressionReason suppression_reason = 12;
  string reason_code = 13; string audit_ref = 14; string source_hook_id = 15; string source_cadence_id = 16; string conversation_anchor_id = 17; string originating_turn_id = 18; string originating_stream_id = 19; google.protobuf.Timestamp observed_at = 20;
}
// AgentProactiveInterruptibilityProjection is read-only proactive_interruptibility_v1 state; unsupported_fields blocks consumer inference.
message AgentProactiveInterruptibilityProjection {
  string projection_id = 1; string projection_kind = 2; AgentAutonomyMode mode = 3; AgentProactiveOptInState opt_in_state = 4;
  AgentProactiveDeliveryChannel delivery_channel = 5; AgentProactiveQuietHoursState quiet_hours = 6; AgentProactiveFrequencyCapState frequency_cap = 7; repeated string audit_refs = 8;
  AgentProactiveEventDetail suggested_event = 9; AgentProactiveEventDetail last_delivered_event = 10; AgentProactiveEventDetail last_suppressed_event = 11; repeated string unsupported_fields = 12;
}
message AvatarDebugProbeRequestEnvelope {
  string probe_id = 1; string agent_id = 2; string conversation_anchor_id = 3; AvatarDebugProbeKind probe_kind = 4; google.protobuf.Timestamp requested_at = 5; AvatarDebugRequestedBy requested_by = 6;
  string turn_id = 7; string stream_id = 8; string avatar_instance_id = 9; string runtime_replay_ref = 10; bool replay_requested = 11;
  reserved 12;
  reserved "scoped_binding";
}
message AvatarDebugProbeResultEnvelope {
  string probe_id = 1; string agent_id = 2; string conversation_anchor_id = 3; AvatarDebugProbeKind probe_kind = 4; AvatarDebugProbeStatus status = 5; google.protobuf.Timestamp observed_at = 6;
  repeated string evidence_refs = 7; string reason_code = 8; string result_id = 9;
}
message AvatarDebugReplayRef { string probe_id = 1; string replay_ref = 2; AvatarDebugReplayRedactionState redaction_state = 3; AvatarDebugReplayVisibility visibility = 4; google.protobuf.Timestamp linked_at = 5; }
message AgentAvatarDebugEventDetail { AvatarDebugEventFamily family = 1; AvatarDebugProbeRequestEnvelope request = 2; AvatarDebugProbeResultEnvelope result = 3; AvatarDebugReplayRef replay = 4; }
message AgentEvent {
  AgentEventType event_type = 1;
  uint64 sequence = 2;
  string agent_id = 3;
  google.protobuf.Timestamp timestamp = 4;
  string local_agent_ref = 20;
  string owner_user_id = 21;
  string runtime_source_ref = 22;
  oneof detail {
    AgentLifecycleEventDetail lifecycle = 10;
    AgentHookEventDetail hook = 11;
    AgentMemoryEventDetail memory = 12;
    AgentBudgetEventDetail budget = 13;
    AgentReplicationEventDetail replication = 14;
    AgentStateEventDetail state = 15;
    AgentPresentationEventDetail presentation = 16;
    AgentAvatarDebugEventDetail avatar_debug = 17;
    AgentProactiveEventDetail proactive = 18;
  }
}
message TerminateAgentRequest {
  AgentRequestContext context = 1;
  string agent_id = 2;
  string reason = 3;
}
message TerminateAgentResponse {
  Ack ack = 1;
}
message GetAgentRequest {
  AgentRequestContext context = 1;
  string agent_id = 2;
}
message GetAgentResponse {
  LocalAgentRecord agent = 1;
}
message ListAgentsRequest {
  AgentRequestContext context = 1;
  AgentLifecycleStatus lifecycle_filter = 2;
  optional bool autonomy_enabled = 3;
  int32 page_size = 4;
  string page_token = 5;
}
message ListAgentsResponse {
  repeated LocalAgentRecord agents = 1;
  string next_page_token = 2;
}
message GetAgentStateRequest {
  AgentRequestContext context = 1;
  string agent_id = 2;
}
message GetAgentStateResponse {
  AgentStateProjection state = 1;
}
message UpdateAgentStateRequest {
  AgentRequestContext context = 1;
  string agent_id = 2;
  repeated AgentStateMutation mutations = 3;
}
message UpdateAgentStateResponse {
  AgentStateProjection state = 1;
}
message EnableAutonomyRequest {
  AgentRequestContext context = 1;
  string agent_id = 2;
}
message EnableAutonomyResponse {
  AgentAutonomyState autonomy = 1;
}
message DisableAutonomyRequest {
  AgentRequestContext context = 1;
  string agent_id = 2;
  string reason = 3;
}
message DisableAutonomyResponse {
  AgentAutonomyState autonomy = 1;
}
message SetAutonomyConfigRequest {
  AgentRequestContext context = 1;
  string agent_id = 2;
  AgentAutonomyConfig config = 3;
  // When present, this request is the first-party atomic autonomy CAS path.
  // Omission retains the pre-r168 config-only mutation for compatibility.
  optional uint64 expected_autonomy_revision = 4;
  optional bool enabled = 5;
}
message SetAutonomyConfigResponse {
  AgentAutonomyState autonomy = 1;
}
message SetAgentPresentationProfileRequest {
  AgentRequestContext context = 1;
  string agent_id = 2;
  oneof mutation {
    AgentPresentationProfile profile = 3;
    ClearAgentPresentationProfile clear = 4;
    AgentPresentationProfilePatch patch = 5;
  }
  optional uint64 expected_revision = 6;
  repeated AgentPresentationAssetMaterial imported_assets = 7;
}
message SetAgentPresentationProfileResponse {
  AgentPresentationProfile profile = 1;
  uint64 committed_revision = 2;
  AgentPresentationProfile previous_profile = 3;
}
message GetAgentPresentationAssetRequest {
  AgentRequestContext context = 1;
  string agent_id = 2;
  string asset_ref = 3;
}
message GetAgentPresentationAssetResponse {
  string asset_ref = 1;
  AgentPresentationAssetRole role = 2;
  AgentPresentationBackendKind backend_kind = 3;
  string file_name = 4;
  string media_type = 5;
  bytes content = 6;
  string sha256 = 7;
}
message ListPendingHooksRequest {
  AgentRequestContext context = 1;
  string agent_id = 2;
  HookTriggerFamily trigger_family_filter = 3;
  HookAdmissionState admission_state_filter = 4;
  int32 page_size = 5;
  string page_token = 6;
}
message ListPendingHooksResponse {
  repeated PendingHook hooks = 1;
  string next_page_token = 2;
}
message CancelHookRequest {
  AgentRequestContext context = 1;
  string agent_id = 2;
  string intent_id = 3;
  string reason = 4;
}
message CancelHookResponse {
