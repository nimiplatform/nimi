  bool review_executor_available = 4;
  string last_review_run_id = 5;
  string checkpoint_basis = 6;
  google.protobuf.Timestamp last_completed_at = 7;
  google.protobuf.Timestamp next_eligible_at = 8;
  string recoverable_review_run_id = 9;
}
message GetAgentCanonicalMemoryReviewStatusRequest { AgentRequestContext context = 1; string agent_id = 2; MemoryBankLocator bank = 3; }
message GetAgentCanonicalMemoryReviewStatusResponse { AgentCanonicalMemoryReviewStatus status = 1; }
message SubscribeAgentEventsRequest {
  AgentRequestContext context = 1;
  string agent_id = 2;
  string cursor = 3;
  repeated AgentEventType event_filters = 4;
}
message SubscribeAgentVoiceStreamRequest {
  AgentRequestContext context = 1;
  string voice_stream_id = 2;
  string conversation_anchor_id = 3;
  string turn_id = 4;
  string agent_id = 5;
}
message InterruptAgentVoicePlaybackRequest {
  AgentRequestContext context = 1;
  string voice_stream_id = 2;
  string conversation_anchor_id = 3;
  string turn_id = 4;
  string reason = 5;
}
message InterruptAgentVoicePlaybackResponse {
  string voice_stream_id = 1;
  VoiceOutputMode voice_output_mode = 2;
  VoicePlaybackState voice_playback_state = 3;
  string terminal_reason = 4;
}
// First-party recorded voice ingress. Runtime validates the selected
// LocalAgent Conversation and executes audio.transcribe through the singular
// shared LocalAgent AIConfig before returning typed text to the caller. The
// caller cannot provide route, model, provider, Driver, or machine selection.
message TranscribeAgentVoiceInputRequest {
  AgentRequestContext context = 1;
  string agent_id = 2;
  string conversation_anchor_id = 3;
  bytes audio_bytes = 4;
  string mime_type = 5;
  string request_id = 6;
}
message TranscribeAgentVoiceInputResponse {
  string text = 1;
  string job_id = 2;
  string trace_id = 3;
}
message AgentVoiceStreamEvent {
  string voice_stream_id = 1;
  string conversation_anchor_id = 2;
  string turn_id = 3;
  string stream_id = 4;
  string message_id = 5;
  uint64 chunk_sequence = 6;
  bytes chunk = 7;
  string mime_type = 8;
  VoiceOutputMode voice_output_mode = 9;
  string playback_target = 10;
  bool terminal = 11;
  VoicePlaybackState voice_playback_state = 12;
  string terminal_reason = 13;
  bool replay_truncated = 14;
}
// ConversationAnchor is Runtime's continuity token for the one conversation
// transcript owned by a LocalAgent. The first authorized open creates it and
// every later authorized Desktop, local-app, or Avatar surface resolves the
// same anchor; App, principal, and surface identity never partition it.
// `turn_id` and `message_id` are scoped to that shared conversation, and
// `subject_user_id` equals the LocalAgent owner established by Runtime.
message ConversationAnchor {
  string conversation_anchor_id = 1;
  string agent_id = 2;
  string subject_user_id = 3;
  ConversationAnchorStatus status = 4;
  string last_turn_id = 5;
  string last_message_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Struct metadata = 9;
  string local_agent_ref = 20;
  string owner_user_id = 21;
  string runtime_source_ref = 22;
}
message ConversationAnchorSnapshot {
  ConversationAnchor anchor = 1;
  string active_turn_id = 2;
  string active_stream_id = 3;
  LocalAgentSourceContextStatus source_context_status = 4;
  AgentTurnContextSummary turn_context_summary = 5;
}
message OpenConversationAnchorRequest {
  AgentRequestContext context = 1;
  string agent_id = 2;
  string subject_user_id = 3;
  google.protobuf.Struct metadata = 4;
  string local_agent_ref = 20;
  string owner_user_id = 21;
  string runtime_source_ref = 22;
}
message OpenConversationAnchorResponse {
  ConversationAnchorSnapshot snapshot = 1;
}

// Protected Third-party Local Apps receive only this minimal current-account
// active-Agent catalog. The handle is a session-scoped opaque selector; it is
// never a raw LocalAgent identity or durable authorization.
message LocalAppAgentReference {
  string agent_handle = 1;
  string display_name = 2;
  optional string avatar_url = 3;
}
message ListLocalAppAgentReferencesRequest {}
message ListLocalAppAgentReferencesResponse {
  repeated LocalAppAgentReference references = 1;
}

// Protected Third-party Local App Conversation ingress is text-only and uses
// the session-scoped Agent selector above. These messages intentionally carry
// no raw LocalAgent identity, generic App-message envelope, attachment,
// execution configuration, provider choice, or caller-authored context.
message OpenLocalAppConversationRequest {
  string agent_handle = 1;
}
message OpenLocalAppConversationResponse {
  string conversation_anchor_id = 1;
  optional string active_turn_id = 2;
}
message SendLocalAppConversationTurnRequest {
  string agent_handle = 1;
  string conversation_anchor_id = 2;
  string request_id = 3;
  string text = 4;
}
message SendLocalAppConversationTurnResponse {
  string turn_id = 1;
}
message InterruptLocalAppConversationTurnRequest {
  string agent_handle = 1;
  string conversation_anchor_id = 2;
}
message InterruptLocalAppConversationTurnResponse {
  string turn_id = 1;
}
message SubscribeLocalAppConversationEventsRequest {
  string agent_handle = 1;
  string conversation_anchor_id = 2;
}
message GetLocalAppConversationSnapshotRequest {
  string agent_handle = 1;
  string conversation_anchor_id = 2;
}

enum LocalAppConversationMessageRole {
  LOCAL_APP_CONVERSATION_MESSAGE_ROLE_UNSPECIFIED = 0;
  LOCAL_APP_CONVERSATION_MESSAGE_ROLE_USER = 1;
  LOCAL_APP_CONVERSATION_MESSAGE_ROLE_ASSISTANT = 2;
}
message LocalAppConversationMessage {
  string turn_id = 1;
  LocalAppConversationMessageRole role = 2;
  string text = 3;
}
message LocalAppConversationSnapshot {
  string conversation_anchor_id = 1;
  optional string active_turn_id = 2;
  repeated LocalAppConversationMessage messages = 3;
  bool truncated_before = 4;
}
message GetLocalAppConversationSnapshotResponse {
  LocalAppConversationSnapshot snapshot = 1;
}

message LocalAppConversationTurnAccepted {
  string turn_id = 1;
  string request_id = 2;
}
message LocalAppConversationTurnStarted {
  string turn_id = 1;
}
message LocalAppConversationTextDelta {
  string turn_id = 1;
  string text = 2;
}
message LocalAppConversationMessageCommitted {
  string turn_id = 1;
  string message_id = 2;
  string text = 3;
}
message LocalAppConversationTurnCompleted {
  string turn_id = 1;
  string terminal_reason = 2;
}
message LocalAppConversationTurnFailed {
  string turn_id = 1;
  string reason_code = 2;
  optional string message = 3;
}
message LocalAppConversationTurnInterrupted {
  string turn_id = 1;
  string reason = 2;
}
message LocalAppConversationEvent {
  string conversation_anchor_id = 1;
  uint64 sequence = 2;
  oneof event {
    LocalAppConversationTurnAccepted turn_accepted = 10;
    LocalAppConversationTurnStarted turn_started = 11;
    LocalAppConversationTextDelta text_delta = 12;
    LocalAppConversationMessageCommitted message_committed = 13;
    LocalAppConversationTurnCompleted turn_completed = 14;
    LocalAppConversationTurnFailed turn_failed = 15;
    LocalAppConversationTurnInterrupted turn_interrupted = 16;
  }
}

message GetConversationAnchorSnapshotRequest {
  AgentRequestContext context = 1;
  string agent_id = 2;
  string conversation_anchor_id = 3;
}
message GetConversationAnchorSnapshotResponse {
  ConversationAnchorSnapshot snapshot = 1;
}
// K-AGCORE-138 AvatarLiveInstanceBinding boundary: runtime-owned recovery
// binding from an Avatar window instance to an already-open ConversationAnchor.
// Desktop may register this binding after opening an anchor; Avatar may resolve
// it after validating launch `agent_id` through Runtime/SDK. This binding is
// not launch payload authority and MUST NOT create anchors.
message AvatarLiveInstanceBinding {
  string avatar_instance_id = 1;
  string conversation_anchor_id = 2;
  string agent_id = 3;
  string subject_user_id = 4;
  google.protobuf.Timestamp registered_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  string local_agent_ref = 20;
  string owner_user_id = 21;
  string runtime_source_ref = 22;
  string caller_app_id = 23;
}
message RegisterAvatarLiveInstanceBindingRequest {
  AgentRequestContext context = 1;
  string avatar_instance_id = 2;
  string conversation_anchor_id = 3;
}
message RegisterAvatarLiveInstanceBindingResponse {
  AvatarLiveInstanceBinding binding = 1;
  ConversationAnchorSnapshot snapshot = 2;
}
message ResolveAvatarLiveInstanceBindingRequest {
  AgentRequestContext context = 1;
  string avatar_instance_id = 2;
}
message ResolveAvatarLiveInstanceBindingResponse {
  AvatarLiveInstanceBinding binding = 1;
  ConversationAnchorSnapshot snapshot = 2;
}
message GetPublicChatSessionSnapshotRequest {
  AgentRequestContext context = 1;
  string agent_id = 2;
  string conversation_anchor_id = 3;
  string request_id = 4;
  string world_id = 5;
}
message GetPublicChatSessionSnapshotResponse {
  google.protobuf.Struct snapshot = 1;
}
message AgentConversationSummary {
  ConversationAnchor anchor = 1;
  string title = 2;
  string last_message_role = 3;
  string last_message_text = 4;
  string last_message_id = 5;
  int32 transcript_message_count = 6;
  google.protobuf.Timestamp updated_at = 7;
  LocalAgentSourceContextStatus source_context_status = 8;
  AgentTurnContextSummary last_turn_context_summary = 9;
}
message ListAgentConversationSummariesRequest {
  AgentRequestContext context = 1;
  string agent_id = 2;
  repeated ConversationAnchorStatus status_filter = 3;
  int32 page_size = 4;
  string page_token = 5;
}
message ListAgentConversationSummariesResponse {
  repeated AgentConversationSummary summaries = 1;
  string next_page_token = 2;
}
message GetAvatarDebugSnapshotRequest { AgentRequestContext context = 1; string agent_id = 2; string conversation_anchor_id = 3; }
message GetAvatarDebugSnapshotResponse {
  string agent_id = 1; string conversation_anchor_id = 2; repeated AvatarDebugProbeResultEnvelope probe_results = 3; repeated AvatarDebugReplayRef replay_refs = 4; google.protobuf.Timestamp observed_at = 5;
}
message RequestAvatarDebugProbeRequest {
  AgentRequestContext context = 1; string agent_id = 2; string conversation_anchor_id = 3; AvatarDebugProbeKind probe_kind = 4; AvatarDebugRequestedBy requested_by = 5;
  string probe_id = 6; string turn_id = 7; string stream_id = 8; string avatar_instance_id = 9; bool replay_requested = 10;
}
message RequestAvatarDebugProbeResponse { AvatarDebugProbeRequestEnvelope request = 1; AvatarDebugProbeResultEnvelope result = 2; AvatarDebugReplayRef replay_ref = 3; }
message SubmitAvatarDebugProbeResultRequest { AgentRequestContext context = 1; string agent_id = 2; string conversation_anchor_id = 3; AvatarDebugProbeResultEnvelope result = 4; }
message SubmitAvatarDebugProbeResultResponse { AvatarDebugProbeResultEnvelope result = 1; }
message ListAvatarDebugProbeResultsRequest { AgentRequestContext context = 1; string agent_id = 2; string conversation_anchor_id = 3; AvatarDebugProbeKind probe_kind = 4; }
message ListAvatarDebugProbeResultsResponse { repeated AvatarDebugProbeResultEnvelope probe_results = 1; }
message GetAvatarDebugReplayRequest { AgentRequestContext context = 1; string agent_id = 2; string probe_id = 3; string conversation_anchor_id = 4; }
message GetAvatarDebugReplayResponse { AvatarDebugProbeRequestEnvelope request = 1; AvatarDebugProbeResultEnvelope result = 2; AvatarDebugReplayRef replay_ref = 3; }
// Runtime projects exactly one shared LocalAgent subsystem AIConfig. These
// requests carry only authenticated App/account scope; runtime_source_ref and
// local_agent_ref remain empty and never select a configuration owner.
message GetSharedLocalAgentAIConfigRequest { AgentRequestContext context = 1; }
message GetSharedLocalAgentAIConfigResponse { AIConfig config = 1; }
message OverwriteSharedLocalAgentAIConfigRequest {
  AgentRequestContext context = 1;
  repeated AIConfigCapabilityIntent capabilities = 2;
}
message OverwriteSharedLocalAgentAIConfigResponse { AIConfig config = 1; }
// AIProfile remains a portable template. Apply writes complete current owner
// intent only; it never materializes Local bindings or waits for readiness.
message PreviewSharedLocalAgentAIProfileRequest {
  AgentRequestContext context = 1;
  bytes profile_json = 2;
}
message PreviewSharedLocalAgentAIProfileResponse {
  AIConfig before = 1;
  AIConfig after = 2;
}
message ApplySharedLocalAgentAIProfileRequest {
  AgentRequestContext context = 1;
  bytes profile_json = 2;
}
message ApplySharedLocalAgentAIProfileResponse {
  AIConfig config = 1;
}
service RuntimeAgentService {
  // K-AGCORE-139/K-AGCORE-151: the sole public Realm source ingress. Runtime
  // privately acquires and verifies Packet v3; transport/auth material is not
  // accepted from callers.
  rpc MaterializeRealmSource(MaterializeRealmSourceRequest) returns (MaterializeRealmSourceResponse);
  rpc TerminateAgent(TerminateAgentRequest) returns (TerminateAgentResponse);
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc ListLocalAppAgentReferences(ListLocalAppAgentReferencesRequest) returns (ListLocalAppAgentReferencesResponse);
  rpc OpenLocalAppConversation(OpenLocalAppConversationRequest) returns (OpenLocalAppConversationResponse);
  rpc SendLocalAppConversationTurn(SendLocalAppConversationTurnRequest) returns (SendLocalAppConversationTurnResponse);
  rpc InterruptLocalAppConversationTurn(InterruptLocalAppConversationTurnRequest) returns (InterruptLocalAppConversationTurnResponse);
  rpc SubscribeLocalAppConversationEvents(SubscribeLocalAppConversationEventsRequest) returns (stream LocalAppConversationEvent);
  rpc GetLocalAppConversationSnapshot(GetLocalAppConversationSnapshotRequest) returns (GetLocalAppConversationSnapshotResponse);
  rpc OpenConversationAnchor(OpenConversationAnchorRequest) returns (OpenConversationAnchorResponse);
  rpc GetConversationAnchorSnapshot(GetConversationAnchorSnapshotRequest) returns (GetConversationAnchorSnapshotResponse);
  rpc RegisterAvatarLiveInstanceBinding(RegisterAvatarLiveInstanceBindingRequest) returns (RegisterAvatarLiveInstanceBindingResponse);
  rpc ResolveAvatarLiveInstanceBinding(ResolveAvatarLiveInstanceBindingRequest) returns (ResolveAvatarLiveInstanceBindingResponse);
  rpc GetPublicChatSessionSnapshot(GetPublicChatSessionSnapshotRequest) returns (GetPublicChatSessionSnapshotResponse);
  rpc ListAgentConversationSummaries(ListAgentConversationSummariesRequest) returns (ListAgentConversationSummariesResponse);
  rpc GetCompanionParticipationProjection(GetCompanionParticipationProjectionRequest) returns (GetCompanionParticipationProjectionResponse);
  rpc RequestCompanionParticipation(RequestCompanionParticipationRequest) returns (RequestCompanionParticipationResponse);
  rpc CancelCompanionParticipation(CancelCompanionParticipationRequest) returns (CancelCompanionParticipationResponse);
  rpc OpenCompanionParticipationReplay(OpenCompanionParticipationReplayRequest) returns (OpenCompanionParticipationReplayResponse);
  rpc GetAvatarDebugSnapshot(GetAvatarDebugSnapshotRequest) returns (GetAvatarDebugSnapshotResponse);
  rpc RequestAvatarDebugProbe(RequestAvatarDebugProbeRequest) returns (RequestAvatarDebugProbeResponse);
  rpc SubmitAvatarDebugProbeResult(SubmitAvatarDebugProbeResultRequest) returns (SubmitAvatarDebugProbeResultResponse);
  rpc ListAvatarDebugProbeResults(ListAvatarDebugProbeResultsRequest) returns (ListAvatarDebugProbeResultsResponse);
  rpc GetAvatarDebugReplay(GetAvatarDebugReplayRequest) returns (GetAvatarDebugReplayResponse);
  rpc GetAgentState(GetAgentStateRequest) returns (GetAgentStateResponse);
  rpc UpdateAgentState(UpdateAgentStateRequest) returns (UpdateAgentStateResponse);
  rpc SetAgentPresentationProfile(SetAgentPresentationProfileRequest) returns (SetAgentPresentationProfileResponse);
  rpc GetAgentPresentationAsset(GetAgentPresentationAssetRequest) returns (GetAgentPresentationAssetResponse);
  rpc EnableAutonomy(EnableAutonomyRequest) returns (EnableAutonomyResponse);
  rpc DisableAutonomy(DisableAutonomyRequest) returns (DisableAutonomyResponse);
  rpc SetAutonomyConfig(SetAutonomyConfigRequest) returns (SetAutonomyConfigResponse);
  rpc ListPendingHooks(ListPendingHooksRequest) returns (ListPendingHooksResponse);
  rpc CancelHook(CancelHookRequest) returns (CancelHookResponse);
  rpc ListDelegatedProviderProfiles(ListDelegatedProviderProfilesRequest) returns (ListDelegatedProviderProfilesResponse);
  rpc ListDelegatedApprovalRequests(ListDelegatedApprovalRequestsRequest) returns (ListDelegatedApprovalRequestsResponse);
  rpc SubmitDelegatedApprovalDecision(SubmitDelegatedApprovalDecisionRequest) returns (SubmitDelegatedApprovalDecisionResponse);
  rpc ListDelegatedDiagnostics(ListDelegatedDiagnosticsRequest) returns (ListDelegatedDiagnosticsResponse);
  rpc GetDelegatedReplayTrace(GetDelegatedReplayTraceRequest) returns (GetDelegatedReplayTraceResponse);
  rpc GetDelegatedControlSurfaceSnapshot(GetDelegatedControlSurfaceSnapshotRequest) returns (GetDelegatedControlSurfaceSnapshotResponse);
  rpc QueryAgentMemory(QueryAgentMemoryRequest) returns (QueryAgentMemoryResponse);
  rpc WriteAgentMemory(WriteAgentMemoryRequest) returns (WriteAgentMemoryResponse);
  rpc GetAgentCanonicalMemoryBankStatus(GetAgentCanonicalMemoryBankStatusRequest) returns (GetAgentCanonicalMemoryBankStatusResponse);
  rpc RequestAgentCanonicalMemoryBankBind(RequestAgentCanonicalMemoryBankBindRequest) returns (RequestAgentCanonicalMemoryBankBindResponse);
  rpc GetAgentCanonicalMemoryReviewStatus(GetAgentCanonicalMemoryReviewStatusRequest) returns (GetAgentCanonicalMemoryReviewStatusResponse);
  rpc SubscribeAgentEvents(SubscribeAgentEventsRequest) returns (stream AgentEvent);
  rpc SubscribeAgentVoiceStream(SubscribeAgentVoiceStreamRequest) returns (stream AgentVoiceStreamEvent);
  rpc InterruptAgentVoicePlayback(InterruptAgentVoicePlaybackRequest) returns (InterruptAgentVoicePlaybackResponse);
  rpc TranscribeAgentVoiceInput(TranscribeAgentVoiceInputRequest) returns (TranscribeAgentVoiceInputResponse);
  // Shared Runtime LocalAgent subsystem AIConfig surface.
  rpc GetSharedLocalAgentAIConfig(GetSharedLocalAgentAIConfigRequest) returns (GetSharedLocalAgentAIConfigResponse);
  rpc OverwriteSharedLocalAgentAIConfig(OverwriteSharedLocalAgentAIConfigRequest) returns (OverwriteSharedLocalAgentAIConfigResponse);
  rpc PreviewSharedLocalAgentAIProfile(PreviewSharedLocalAgentAIProfileRequest) returns (PreviewSharedLocalAgentAIProfileResponse);
  rpc ApplySharedLocalAgentAIProfile(ApplySharedLocalAgentAIProfileRequest) returns (ApplySharedLocalAgentAIProfileResponse);
  // Protected-local App agent configuration carrier (agent.configure AppAccess
  // domain). Shared AIConfig actions resolve the singular subsystem owner;
  // autonomy and presentation stay per-Agent behind session-scoped handles.
  rpc GetLocalAppSharedLocalAgentAIConfig(GetLocalAppSharedLocalAgentAIConfigRequest) returns (GetLocalAppSharedLocalAgentAIConfigResponse);
  rpc OverwriteLocalAppSharedLocalAgentAIConfig(OverwriteLocalAppSharedLocalAgentAIConfigRequest) returns (OverwriteLocalAppSharedLocalAgentAIConfigResponse);
  rpc GetLocalAppAgentAutonomySnapshot(GetLocalAppAgentAutonomySnapshotRequest) returns (LocalAppAgentAutonomySnapshotResponse);
  rpc UpdateLocalAppAgentAutonomy(UpdateLocalAppAgentAutonomyRequest) returns (LocalAppAgentUpdateAutonomyResponse);
  rpc GetLocalAppAgentPresentationSnapshot(GetLocalAppAgentPresentationSnapshotRequest) returns (LocalAppAgentPresentationSnapshotResponse);
  rpc CommitLocalAppAgentPresentation(CommitLocalAppAgentPresentationRequest) returns (LocalAppAgentCommitPresentationResponse);
}
