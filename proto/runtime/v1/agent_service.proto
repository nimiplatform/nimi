service RuntimeAgentService {
  // K-AGCORE-139/K-AGCORE-151: the sole public Realm source ingress. Runtime
  // privately acquires and verifies Packet v3; transport/auth material is not
  // accepted from callers.
  rpc MaterializeRealmSource(MaterializeRealmSourceRequest) returns (MaterializeRealmSourceResponse);
  rpc TerminateAgent(TerminateAgentRequest) returns (TerminateAgentResponse);
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc ListLocalAppAgentReferences(ListLocalAppAgentReferencesRequest) returns (ListLocalAppAgentReferencesResponse);
  rpc OpenLocalAppConversation(OpenLocalAppConversationRequest) returns (OpenLocalAppConversationResponse);
  rpc SendLocalAppConversationTurn(SendLocalAppConversationTurnRequest) returns (SendLocalAppConversationTurnResponse);
  rpc UploadLocalAppConversationAttachment(UploadLocalAppConversationAttachmentRequest) returns (UploadLocalAppConversationAttachmentResponse);
  rpc ReadLocalAppConversationArtifact(ReadLocalAppConversationArtifactRequest) returns (ReadLocalAppConversationArtifactResponse);
  rpc TranscribeLocalAppConversationVoice(TranscribeLocalAppConversationVoiceRequest) returns (TranscribeLocalAppConversationVoiceResponse);
  rpc RenderLocalAppConversationVoice(RenderLocalAppConversationVoiceRequest) returns (RenderLocalAppConversationVoiceResponse);
  rpc InterruptLocalAppConversationTurn(InterruptLocalAppConversationTurnRequest) returns (InterruptLocalAppConversationTurnResponse);
  rpc SubscribeLocalAppConversationEvents(SubscribeLocalAppConversationEventsRequest) returns (stream LocalAppConversationEvent);
  rpc GetLocalAppConversationSnapshot(GetLocalAppConversationSnapshotRequest) returns (GetLocalAppConversationSnapshotResponse);
  rpc OpenLocalAppAgentRealtime(OpenLocalAppAgentRealtimeRequest) returns (OpenLocalAppAgentRealtimeResponse);
  rpc AppendLocalAppAgentRealtimeInput(AppendLocalAppAgentRealtimeInputRequest) returns (AppendLocalAppAgentRealtimeInputResponse);
  rpc SubscribeLocalAppAgentRealtimeEvents(SubscribeLocalAppAgentRealtimeEventsRequest) returns (stream LocalAppAgentRealtimeEvent);
  rpc GetLocalAppAgentRealtimeStatus(GetLocalAppAgentRealtimeStatusRequest) returns (GetLocalAppAgentRealtimeStatusResponse);
  rpc InterruptLocalAppAgentRealtimeOutput(InterruptLocalAppAgentRealtimeOutputRequest) returns (InterruptLocalAppAgentRealtimeOutputResponse);
  rpc CloseLocalAppAgentRealtime(CloseLocalAppAgentRealtimeRequest) returns (CloseLocalAppAgentRealtimeResponse);
  rpc GetLocalAppEmbodimentSnapshot(GetLocalAppEmbodimentSnapshotRequest) returns (GetLocalAppEmbodimentSnapshotResponse);
  rpc SubscribeLocalAppEmbodimentEvents(SubscribeLocalAppEmbodimentEventsRequest) returns (stream LocalAppEmbodimentEvent);
  rpc OpenConversationAnchor(OpenConversationAnchorRequest) returns (OpenConversationAnchorResponse);
  rpc GetConversationAnchorSnapshot(GetConversationAnchorSnapshotRequest) returns (GetConversationAnchorSnapshotResponse);
  rpc GetPublicChatSessionSnapshot(GetPublicChatSessionSnapshotRequest) returns (GetPublicChatSessionSnapshotResponse);
  rpc ReadConversationArtifact(ReadConversationArtifactRequest) returns (ReadConversationArtifactResponse);
  rpc ListAgentConversationSummaries(ListAgentConversationSummariesRequest) returns (ListAgentConversationSummariesResponse);
  rpc GetAgentState(GetAgentStateRequest) returns (GetAgentStateResponse);
  rpc UpdateAgentState(UpdateAgentStateRequest) returns (UpdateAgentStateResponse);
  rpc SetAgentPresentationProfile(SetAgentPresentationProfileRequest) returns (SetAgentPresentationProfileResponse);
  rpc GetAgentPresentationAsset(GetAgentPresentationAssetRequest) returns (GetAgentPresentationAssetResponse);
  rpc EnableAutonomy(EnableAutonomyRequest) returns (EnableAutonomyResponse);
  rpc DisableAutonomy(DisableAutonomyRequest) returns (DisableAutonomyResponse);
  rpc SetAutonomyConfig(SetAutonomyConfigRequest) returns (SetAutonomyConfigResponse);
  rpc ListPendingHooks(ListPendingHooksRequest) returns (ListPendingHooksResponse);
  rpc CancelHook(CancelHookRequest) returns (CancelHookResponse);
  rpc ListDelegatedProviderProfiles(ListDelegatedProviderProfilesRequest) returns (ListDelegatedProviderProfilesResponse);
  rpc ListDelegatedApprovalRequests(ListDelegatedApprovalRequestsRequest) returns (ListDelegatedApprovalRequestsResponse);
  rpc SubmitDelegatedApprovalDecision(SubmitDelegatedApprovalDecisionRequest) returns (SubmitDelegatedApprovalDecisionResponse);
  rpc ListDelegatedDiagnostics(ListDelegatedDiagnosticsRequest) returns (ListDelegatedDiagnosticsResponse);
  rpc GetDelegatedReplayTrace(GetDelegatedReplayTraceRequest) returns (GetDelegatedReplayTraceResponse);
  rpc GetDelegatedControlSurfaceSnapshot(GetDelegatedControlSurfaceSnapshotRequest) returns (GetDelegatedControlSurfaceSnapshotResponse);
  rpc TranscribeAgentVoiceInput(TranscribeAgentVoiceInputRequest) returns (TranscribeAgentVoiceInputResponse);
  // Shared Runtime LocalAgent subsystem AIConfig surface.
  rpc GetSharedLocalAgentAIConfig(GetSharedLocalAgentAIConfigRequest) returns (GetSharedLocalAgentAIConfigResponse);
  rpc OverwriteSharedLocalAgentAIConfig(OverwriteSharedLocalAgentAIConfigRequest) returns (OverwriteSharedLocalAgentAIConfigResponse);
  rpc ListSharedLocalAgentAIConfigOptions(ListSharedLocalAgentAIConfigOptionsRequest) returns (ListSharedLocalAgentAIConfigOptionsResponse);
  rpc PreviewSharedLocalAgentAIProfile(PreviewSharedLocalAgentAIProfileRequest) returns (PreviewSharedLocalAgentAIProfileResponse);
  rpc ApplySharedLocalAgentAIProfile(ApplySharedLocalAgentAIProfileRequest) returns (ApplySharedLocalAgentAIProfileResponse);
  rpc ImportPortableAIProfile(ImportPortableAIProfileRequest) returns (ImportPortableAIProfileResponse);
  rpc ListPortableAIProfiles(ListPortableAIProfilesRequest) returns (ListPortableAIProfilesResponse);
  // Protected-local App agent configuration carrier (agent.configure AppAccess
  // domain). Shared AIConfig actions resolve the singular subsystem owner;
  // autonomy and presentation stay per-Agent behind session-scoped handles.
  rpc GetLocalAppAgentManagerSnapshot(GetLocalAppAgentManagerSnapshotRequest) returns (GetLocalAppAgentManagerSnapshotResponse);
