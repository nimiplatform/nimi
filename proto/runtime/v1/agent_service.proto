}
message QueryAgentMemoryRequest {
  AgentRequestContext context = 1;
  string agent_id = 2;
  string query = 3;
  int32 limit = 4;
  repeated MemoryCanonicalClass canonical_classes = 5;
  repeated MemoryRecordKind kinds = 6;
  bool include_invalidated = 7;
}
message QueryAgentMemoryResponse {
  repeated CanonicalMemoryView memories = 1;
  repeated NarrativeRecallHit narratives = 2;
}
message WriteAgentMemoryRequest {
  AgentRequestContext context = 1;
  string agent_id = 2;
  repeated CanonicalMemoryCandidate candidates = 3;
}
message WriteAgentMemoryResponse {
  repeated CanonicalMemoryView accepted = 1;
  repeated CanonicalMemoryRejection rejected = 2;
}
enum AgentCanonicalMemoryBankMode {
  AGENT_CANONICAL_MEMORY_BANK_MODE_UNSPECIFIED = 0;
  AGENT_CANONICAL_MEMORY_BANK_MODE_BASELINE = 1;
  AGENT_CANONICAL_MEMORY_BANK_MODE_STANDARD = 2;
  AGENT_CANONICAL_MEMORY_BANK_MODE_UNAVAILABLE = 3;
}
message AgentCanonicalMemoryBankStatus {
  AgentCanonicalMemoryBankMode mode = 1;
  string bank_id = 2;
  MemoryEmbeddingProfile embedding_profile = 3;
  string binding_source_kind = 4;
  ReasonCode blocked_reason_code = 5;
  bool pending_cutover = 6;
  string canonical_bank_status = 7;
  bool bind_allowed = 8;
  bool cutover_allowed = 9;
}
message GetAgentCanonicalMemoryBankStatusRequest {
