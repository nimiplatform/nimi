    SharedLocalAgentPresetVoiceOptionsQuery preset_voices = 5;
  }
}
message ListSharedLocalAgentAIConfigOptionsResponse {
  oneof result {
    AIConfigLocalLoadoutOptions local_loadouts = 1;
    AIConfigCloudConnectorOptions cloud_connectors = 3;
    AIConfigCloudTargetOptions cloud_targets = 4;
    SharedLocalAgentPresetVoiceOptions preset_voices = 5;
  }
  bool truncated = 2;
}
// AIProfile remains a portable template. Apply writes complete current owner
