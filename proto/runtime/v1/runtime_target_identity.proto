syntax = "proto3";

package nimi.runtime.v1;

option go_package = "github.com/nimiplatform/nimi/runtime/gen/runtime/v1;runtimev1";

message RuntimeDurableLocalTargetRef {
  string version = 1;
  oneof ref {
    string profile_binding_id = 2;
    string readiness_ref = 3;
  }
}

message RuntimeDurableCloudTargetRef {
  string version = 1;
  string connector_id = 2;
  string remote_model_catalog_id = 3;
  string provider_model_id = 4;
  string provider = 5;
}

message RuntimeDurableTargetRef {
  oneof target {
    RuntimeDurableLocalTargetRef local_runtime = 1;
    RuntimeDurableCloudTargetRef cloud = 2;
  }
}

message RuntimeResolvedLocalExecutionBinding {
  string profile_binding_id = 1;
  string readiness_ref = 2;
  string local_asset_id = 3;
  string execution_profile_id = 4;
  string resolved_model_id = 5;
}

message RuntimeResolvedCloudExecutionBinding {
  string connector_id = 1;
  string remote_model_catalog_id = 2;
  string provider_model_id = 3;
  string provider = 4;
  string endpoint_profile_id = 5;
  string connector_snapshot_id = 6;
}

message RuntimeResolvedExecutionBinding {
  string binding_version = 1;
  string capability = 2;
  string resolved_binding_ref = 3;
  RuntimeDurableTargetRef source_target_ref = 4;
  string route_metadata_ref = 5;
  oneof binding {
    RuntimeResolvedLocalExecutionBinding local_runtime = 10;
    RuntimeResolvedCloudExecutionBinding cloud = 11;
  }
}
