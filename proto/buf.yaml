version: v2
modules:
  - path: .
    name: buf.build/nimiplatform/runtime
lint:
  use:
    - STANDARD
  ignore_only:
    PACKAGE_DIRECTORY_MATCH:
      - runtime/v1/account.proto
      - runtime/v1/agent_common.proto
      - runtime/v1/agent_embodiment.proto
      - runtime/v1/agent_configure.proto
      - runtime/v1/agent_presentation.proto
      - runtime/v1/agent_source_materialization.proto
      - runtime/v1/ai.proto
      - runtime/v1/ai_realtime.proto
      - runtime/v1/ai_scheduling.proto
      - runtime/v1/app.proto
      - runtime/v1/capability_configuration.proto
      - runtime/v1/agent_service.proto
      - runtime/v1/artifact_service.proto
      - runtime/v1/audit.proto
      - runtime/v1/auth.proto
      - runtime/v1/cognition_memory.proto
      - runtime/v1/common.proto
      - runtime/v1/connector.proto
      - runtime/v1/delegated_control.proto
      - runtime/v1/development.proto
      - runtime/v1/external_agent.proto
      - runtime/v1/local_runtime.proto
      - runtime/v1/local_runtime_asset_catalog.proto
      - runtime/v1/local_runtime_device_environment.proto
      - runtime/v1/local_runtime_execution_profile.proto
      - runtime/v1/local_runtime_recommendation.proto
      - runtime/v1/realm_realtime.proto
      - runtime/v1/realtime_control.proto
      - runtime/v1/runtime_service_control.proto
      - runtime/v1/voice.proto
    ENUM_VALUE_PREFIX:
      - runtime/v1/ai.proto
      - runtime/v1/ai_realtime.proto
      - runtime/v1/app.proto
      - runtime/v1/common.proto
    RPC_RESPONSE_STANDARD_NAME:
      - runtime/v1/account.proto
      - runtime/v1/ai.proto
      - runtime/v1/ai_realtime.proto
      - runtime/v1/agent_service.proto
      - runtime/v1/app.proto
      - runtime/v1/audit.proto
      - runtime/v1/auth.proto
      - runtime/v1/external_agent.proto
      - runtime/v1/local_runtime.proto
    RPC_REQUEST_STANDARD_NAME:
      - runtime/v1/external_agent.proto
    RPC_REQUEST_RESPONSE_UNIQUE:
      - runtime/v1/auth.proto
      - runtime/v1/external_agent.proto
      - runtime/v1/local_runtime.proto
breaking:
  use:
    - PACKAGE
