maintenance:
  ownership: Runtime engineering acceptance records, maintained by the person or agent performing the actual acceptance.
  update_policy:
    - Append a new version observation or update the applicable scenario. Never rewrite a historical failure
      as if that request succeeded.
    - Record route, exact target, platform/distribution, version scope, executed scenario, result dimensions
      and concise evidence.
    - Retain retired targets as retired-route-history; do not imply current availability.
    - Never derive acceptance automatically from catalog presence, completed downloads, connection checks, CI
      or builds.
    - Record only supported facts. Do not add redundant receipts/manifests or rerun models merely to archive
      evidence.
