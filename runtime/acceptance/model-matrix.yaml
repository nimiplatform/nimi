capabilities:
  # audio.speaker.embed
  - capability: audio.speaker.embed
    platform_status:
      windows_development: SCENARIO-SPECIFIC
      windows_installed: NOT-VERIFIED
      macos_development: NOT-VERIFIED
      macos_installed: NOT-VERIFIED
    scenarios:
      - id: macos-20261111-installed-campplus-prerequisite
        route: local
        models: [ 3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx ]
        environment: macos_installed
        scenario: Import the exact existing weight through Home and inspect the bound speaker-encoder preparation plan
        result: { execution: NOT-VERIFIED, quality: NOT-VERIFIED }
        summary: Home imported the verified 29596978-byte ONNX and accepted it in the encoder slot. The formal
          plan then reported that this model has no managed runtime environment on this device, with
          Use these settings disabled. No inference ran and the machine selection stayed unchanged.
        observed_on: 2026-11-11
        version:
          implementation_commit: 571ddade2
          runtime_revision: fb618d18d; modified=false
          home: 0.2.5-rc.6; signed installed package
          lab: 0.1.0; workspace source 571ddade2
          engine: null
        weights:
          main_sha256: 357a834f702b80161e5b981182c038e18553c1f2ca752ed6cec2052365d4129b # pragma: allowlist secret -- public weight digest
        evidence:
          - { source: macos_installed_20261111 }
        limitations:
          - Requires an admitted macOS execution environment. Import and a bound slot do not establish vectors,
            speaker comparison, cancellation or quality.
      - id: macos-20261110-campplus-imported-environment-block
        route: local
        models: [ 3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx ]
        environment: macos_development
        scenario: Verify the upstream exact file, import through Home's native file picker, bind the encoder slot
          and inspect the formal preparation plan
        result: { execution: NOT-VERIFIED, quality: NOT-VERIFIED }
        summary: The earlier missing-weight prerequisite was resolved. The exact 29596978-byte ONNX was verified
          against the upstream digest and imported as a validated one-file asset in Home. Its speaker configuration
          then reported no managed execution environment for this device, with Use disabled. No model inference ran.
        observed_on: 2026-11-10
        version: { implementation_commit: e4574df00, runtime_revision: aadf45727; modified=true,
          home: 0.2.5-rc.6, lab: 0.1.0, engine: null }
        weights:
          main_sha256: 357a834f702b80161e5b981182c038e18553c1f2ca752ed6cec2052365d4129b # pragma: allowlist secret -- recorded public revision or artifact digest
          source: https://huggingface.co/csukuangfj/speaker-embedding-models/blob/main/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx
        evidence:
          - { source: macos_20261110 }
        limitations:
          - Home's model market found the upstream repository but exposed no installable ONNX variant. Download
            was from the verified public upstream; import, binding and preparation used Home's formal workflow.
          - Requires an admitted macOS managed execution environment. Asset import and a saved configuration do
            not establish preparation, extraction, vector comparison, cancellation or model quality.
      - id: macos-20261110-campplus-prerequisite
        route: local
        models: [ 3dspeaker_speech_campplus_sv_en_voxceleb_16k ONNX ]
        environment: macos_development
        scenario: Inspect Home speaker representation setup and installed weight choices
        result: { execution: NOT-VERIFIED, quality: NOT-VERIFIED }
        summary: The speaker encoder slot was empty. Home provided no direct download; the installed-model
          selector contained no CampPlus speaker encoder. No extraction or comparison was attempted.
        observed_on: 2026-11-10
        version: { runtime_revision: 60d7cb0f3855; modified=true, home: 0.2.5-rc.6, engine: null } # pragma: allowlist secret -- recorded revision or artifact digest
        evidence:
          - { source: macos_20261110 }
        limitations:
          - Requires the exact admitted encoder weights and successful preparation through Home. An unrelated
            ONNX model or Windows speaker result does not satisfy this prerequisite.
      - id: camplus-speaker
        route: local
        models: [ 3dspeaker_speech_campplus_sv_en_voxceleb_16k ONNX ]
        environment: windows_development
        scenario: Extract features from 0.5/3.28-second synthetic audio; compare same/different voices; full export,
          history, cancellation and a new request
        result: { execution: PASS, quality: PASS }
        summary: Finite 512-dimensional vectors shared one space. Cosines were 0.610606 for two segments of one source
          and -0.059441 for a different synthetic voice. Exported values matched; cancellation persisted and a
          later source-segment request succeeded.
        observed_on: 2026-11-06
        version: { implementation_commit: f4e59758f, engine: null, runtime_revision: f7ba4f666 }
        jobs:
          - 01M6R4RSDEM3W3NETDQMES35K2
          - 01M6R4XPHVVDP4BB0H5SHZTTFC
          - 01M6R4YTR5KGAKJ5GXXHET7569
          - 01M6R4YW80W71XRZV8036A2VWQ
          - 01M6R5DG1J4M3FPBHNZ9R2NV0X
        evidence:
          - { source: release_execution }
        limitations:
          - Quality covers discrimination between these synthetic samples only, not human authentication
            thresholds, voiceprint security or every encoder.
          - The input file was not persisted; rerunning history requires selecting it again.
