  - id: macos-20261111-installed-host-import-diagnostic
    status: FAIL
    observed_on: 2026-11-11
    environment: macos_installed
    source_revision: d7d9a776c31dcb5e04dbd073cd078383779c985c # pragma: allowlist secret -- recorded public revision or artifact digest
    package_sha256: 60b153aa4631e25e628794f798172578b5a918481018a49e39283fdba95e1339 # pragma: allowlist secret -- recorded public revision or artifact digest
