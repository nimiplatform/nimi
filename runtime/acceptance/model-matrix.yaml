engineering_evidence:
  - id: macos-20261112-sdcpp-official-metal-int8
    status: FAIL
    observed_on: 2026-11-12
    environment: macos_sdcpp_1088_development
    scope: Whether the official Darwin archive actually executes INT8 ConvRot on Apple Silicon Metal.
    result: The upstream macOS CI omits SD_METAL, whose default is OFF. The official dylib has patched
      CPU INT8 and ordinary Metal kernels, and lacks sd_ggml_register_metal_i8. Real H3 and RelayVSR
      sampling reached sd_cpu::i8_execute. RelayVSR also reached ggml_metal_synchronize.
    repair_candidate: The same source commit with GGML d803c238f67915fb825a9aa4df27b99356d51597 was built
      for arm64 with macOS 26.0, SD_METAL=ON and SD_USE_UPSTREAM_GGML=OFF. It exported the Metal INT8
      registration, reported INT8 TensorOps, and produced a 512x512 RelayVSR 2x PNG in a CLI diagnostic.
    candidate_archive_sha256: 3d7a24780f8193d3835849549b088b34a2de65f5ca0981540caf4a06900a42c9 # pragma: allowlist secret -- local diagnostic archive digest
    limitations:
      - The CLI diagnostic established the replacement archive identity. Separate scenarios cover
        the explicit source-development installation and supervised Lab execution.
  - id: macos-20261112-sdcpp-runtime-adaptation
    status: PASS
    observed_on: 2026-11-12
    environment: macos_sdcpp_1088_development
    scope: Package identity, Mac source catalog projection, Runtime environment preparation and native video ABI.
    result: The exact Home-managed package and Metal consumer were reused across capabilities. The
      Darwin bridge loaded the pinned dylib and used the native aggregate result and destructor. Home
      also materialized the explicit Metal INT8 development archive under its independent digest. C
      header size and offset assertions passed for Darwin arm64. ControlNet and upscale setup needed
      a fix in the Runtime environment dispatcher to use the existing Metal consumer.
  - id: windows-20261111-sdcpp-1050-to-1088
    status: PASS
    observed_on: 2026-11-11
    environment: windows_development
    scope: Integrate the Windows stable-diffusion.cpp master-1050-58bb3c1 to master-1088-32d516c model delta.
    result: The upstream revision comparison identified MiniMax-H3-Image, HyperFlow H3 Flash,
      Sol-H3-VAE, RelayVSR, SeedVR2 and SDXL ControlNet Union support. Packed INT4 ConvRot,
      Metal INT8 ConvRot and H3 performance or LoRA changes are format and execution changes,
      not additional model families. Windows now uses the exact official 1088 CUDA archive;
      macOS retains its independently admitted 1050 package.
    repair: Integrated independent model slots and content contracts, public image and video upscale
      scenarios, typed owned ControlNet input, protected native carriers and Desktop/Lab controls.
      Real acceptance exposed and repaired optional seed and strength validation, missing upscale Job
      response projection, RelayVSR scale-specific VAE admission, source-video timing preservation
      and H3 VAE progress being misread as diffusion progress.
    checks: Runtime full Go suite passed. The affected AI package passed its final full rerun;
      an intermediate Realtime observation test failure was not reproduced in the isolated or full rerun.
      SDK tests, focused Kit/Lab/Desktop and Rust tests, typed-core conformance for all four SDK
      languages, typechecks, proto lint/breaking/drift, catalog/package drift, Kit checks and complete
      authority validation passed. Canonical diff and impact obligations were reviewed against these
      owners and scenario-specific product acceptance.
    limitations: Engineering checks do not establish model output quality. Exact product results,
      parameters and limitations are recorded in the capability scenarios below.
  - id: macos-20261111-installed-realtime-negotiated-format
    status: PASS
    observed_on: 2026-11-11
    environment: macos_installed
    implementation_commit: 29c76a6b5
    failure: The real OpenAI Session negotiated 24 kHz while Lab still displayed the requested 16 kHz
      preference and 640-byte frame hint. A valid 16 kHz recording was rejected; the matching 24 kHz
      recording succeeded. The parser already used the negotiated format, so the displayed input guidance was wrong.
    repair: One current-input projection now supplies the live selector, format hint, microphone capture and
      recording reader. Closed Sessions restore the next Open preference without changing the original request.
    checks: Lab typecheck passed. Eighteen focused Realtime tests passed, including changed negotiation,
      matching recording framing and restoration of the next Open preference after Close.
    recheck: The existing supervised Lab renderer loaded the repair through its official development server.
      A new real Session changed the visible format from the requested 16 kHz to negotiated 24 kHz/960 bytes.
      Matching recording input, actual output, cancellation and subsequent response all succeeded.
    limitations: This changes the Lab consumer only. The signed Home and Runtime remain revision fb618d18d.
  - id: macos-20261111-installed-explicit-weight-imports
    status: PASS
    observed_on: 2026-11-11
    environment: macos_installed
    scope: Complete the exact HyperSwap tuple and CampPlus imports through the native Home file chooser.
    result: The operator completed the HyperSwap picker handoff. Home showed the three HyperSwap components
      and CampPlus as verified one-file ONNX assets. Readable copies matched the original public-weight hashes;
      original model files, permissions and historical records were preserved.
    limitations: The original protected-source import failure remains recorded. Readable input preparation
      is not a repair of that original access condition, and import alone is not model execution.
  - id: macos-20261111-installed-api-connections
    status: PASS
    observed_on: 2026-11-11
    environment: macos_installed
    scope: Independent OpenAI API, Gemini, DashScope and Ark connections through native Home.
    result: Each authorized existing provider credential was entered through its formal native connection form.
      Home saved and checked each connection successfully. No credential value was printed or committed.
    limitations: Connector checks and catalogs are engineering prerequisites only. Exact model calls remain
      separate scenarios; Plan authorization and usage are independent from OpenAI API.
  - id: macos-20261111-installed-model-import-permissions
    status: FAIL
    observed_on: 2026-11-11
    environment: macos_installed
    scope: Native Home import of the retained det_10g ONNX from the development data area.
    result: The selected source was a regular 0600 file owned by the GUI user. Installed service import
      rejected it with AI_LOCAL_MANIFEST_INVALID and created no new inventory row. The file-access boundary
      differs from development, where Runtime runs as the GUI user.
    followup: Exact public-weight copies were staged with read access without changing the originals or their
      permissions. Native Home then imported det_10g and arcface_w600k_r50 as verified one-file assets.
      HyperSwap selection remains pending a native file-picker handoff. This does not repair original-source access.
    limitations: Import does not establish an admitted model tuple, preparation, face replacement or quality.
  - id: macos-20261111-installed-inventory-visibility
    status: PASS
    observed_on: 2026-11-11
    environment: macos_installed
    scope: Native Home inventory after the explicit schema-two conversion.
    result: Home displayed all eight retained model/resource distributions. The existing CustomVoice and ASR
      weights were reused by formal preparation. Preparation installed the missing managed environment components.
    limitations: Inventory visibility is not model quality; real model results are recorded in capability scenarios.
  - id: macos-20261111-installed-managed-file-reveal
    status: FAIL
    observed_on: 2026-11-11
    environment: macos_installed
    scope: Lab native file reveal for the newly generated and saved CustomVoice WAV.
    result: The public reveal action displayed an explicit failure toast and did not select the file in Finder.
      The same managed asset decoded and played through the protected media carrier and reopened from history.
    diagnosis: The installed service owns private managed-asset directories that the GUI user cannot traverse.
      The native reveal owner requires ordinary filesystem metadata and read access before opening Finder.
      The observed permission boundary therefore blocks this downstream action; no copy or permission bypass was used.
    limitations: External-file reveal and consumption of this generated file remain failed or NOT-VERIFIED.
      This storage-consumption failure is separate from successful synthesis and protected in-App playback.
  - id: macos-20261111-installed-host-codec-repair
    status: PASS
    observed_on: 2026-11-11
    environment: macos_installed
    implementation_commit: 1030042ca
    signed_source_revision: fb618d18df8ac9885e96154261cc596e42288617 # pragma: allowlist secret -- recorded public revision or artifact digest
    scope: Signed Host App import and the shared Kit Agent image decoder.
    failure: The bounded native diagnostic identified app-import, Error and sharp.mjs at the module-load
      boundary. The Host exited 78 before readiness. The exact operating-system native-loader cause was not exposed.
    repair: Kit defers loading Sharp until a complete image container actually needs decoding. Native import
      failures still propagate; there is no codec fallback or alternative Host admission path.
    checks: Kit build passed. Two focused Electron Agent image test files passed all eleven tests, including
      module loading without the codec, malformed-container rejection and propagation of codec import failure.
    recheck: The official workspace watcher rebuilt SDK and Kit. The same installed Lab registration started
      through the signed Host and performed real Plan requests through the installed Runtime.
    limitations: This confirms the Lab startup path and lazy-load regression. Actual Agent image decoding
      inside the signed Host remains NOT-VERIFIED and is not certified by Lab text execution.
  - id: macos-20261111-installed-model-storage-conversion
    status: PASS
    observed_on: 2026-11-11
    environment: macos_installed
    scope: Explicit offline conversion of the retained installed ModelAsset inventory to schema two.
    repair: The operator stopped and unloaded Runtime. The repository recovery tool recomputed the reviewed
      eight-distribution plan, converted four registered rows into eight registered distributions and kept
      its metadata backup. An independent final plan reported the content-addressed inventory current.
    preservation: The final content IDs, file counts and byte counts matched all eight reviewed model
