# Runtime model acceptance matrix — manually maintained engineering evidence.
# Not catalog input or product authority. Read scope, interpretation and environments first.
# Imported observations remain scoped to their original versions and routes.
# Descriptive prose is English; observed_output preserves original evidence text.

format_version: 1
maintained_on: 2026-11-12
evidence_cutoff: 2026-11-12
purpose: Versioned engineering acceptance summary. Not an input to Runtime catalog loading, routing,
  admission, or product authority.
scope:
  catalog_snapshot: 0ddc105801267c8e500c534a887ca564ce67b258 # pragma: allowlist secret -- recorded public revision or artifact digest
  capability_count: 21
  imported_campaign: 2026-11-04-runtime-model-release-audit
  new_model_calls_during_import: false
  current_checkout_acceptance: SCENARIO-SPECIFIC
  notes:
    - This file consolidates observations through evidence_cutoff. maintained_on alone does not establish a
      new acceptance run; read each scenario date and environment.
    - Imported Windows observations do not verify commits after 2026-11-07. New macOS observations identify
      their actual source and Runtime revision; unrelated working-tree changes remain unverified.
    - Unlisted models, inputs, formats, parameters, platforms, architectures and distributions remain
      NOT-VERIFIED.
    - Commit concise reusable findings and necessary references only. Keep raw logs, media, credentials,
      account identities and machine paths local.
interpretation:
  statuses:
    PASS: The stated scenario was executed and this result dimension met its stated expectation. Does not certify
      the whole model or capability.
    FAIL: An actual failure or unmet expectation was observed for this dimension. Success in another scenario does
      not erase it.
    NOT-VERIFIED: "Verification is incomplete: prerequisites may be missing, the provider may have rejected the
      request, the path may be unrun, or the evidence may not identify the exact target."
  dimensions:
    execution: A valid model result was obtained through the supported product path. Rejection and cancellation
      are separate observations, not successful generation.
    quality: Only the stated sample content, format, visual result or retrieval outcome. Not a general benchmark,
      listening assessment or speaker-authentication result.
    engineering: Tests, CI, builds and signature verification are recorded separately and never automatically
      promote execution or quality.
  rules:
    - Record OpenAI API, ChatGPT Plan, OpenRouter, Azure, Bedrock, Ark and other routes independently, even
      for models from the same origin.
    - Windows development success does not establish Windows installed or macOS success. A macOS build or
      notarization is not model execution on a Mac.
    - implementation_commit identifies the implementation stage, not necessarily the running binary. Record
      runtime_revision only when directly observed.
    - Keep missing historical weight, engine and revision identities null and retain the limitation. Do not
      infer them from the current catalog.
    - Cancellation claims stop at the observed App or Runtime boundary. Without a provider receipt, compute
      termination, billing cessation and refunds remain unverified.
    - Reverify affected behavior when versions change. Git preserves history; PASS never propagates
      automatically.
  model_identity: Cloud models use exact IDs on their reviewed route. Local models retain the observed filenames
    or display labels; record weights and engine only when established. Missing historical identities are
    explicit.
  platform_summary: SCENARIO-SPECIFIC is not PASS. Read execution and quality per exact environment and scenario.
    Neither development distribution establishes installed acceptance.
  provenance: Source labels identify historical notes imported into this matrix, not repository-accessible
    evidence. Trace and Job IDs are diagnostic references, not public links. Commit and CI links are
    independently inspectable where access permits.
