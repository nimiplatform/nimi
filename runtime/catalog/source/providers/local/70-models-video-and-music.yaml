models:
  - model_id: wan2.1-video-local
    model_type: video
    updated_at: 2026-03-15
    capabilities: [video.generate]
    source_ids: [diffusers_wan_docs]
    video_generation:
      modes: [t2v, i2v_first_frame]
      input_roles:
        t2v: [prompt]
        i2v_first_frame: [prompt, first_frame]
      limits:
        resolution: [480p, 720p]
      options:
        supports: [resolution, ratio, duration_sec]
        constraints: {}
      outputs:
        video_url: true
    aliases:
      - local/wan2.1-video
      - media/wan2.1-video

