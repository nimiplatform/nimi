
# NOTE: local speech source truth is now anchored to the first-wave admitted
# Qwen speech line:
# - STT default lane: Qwen3-ASR-0.6B
# - plain TTS default lane: Qwen3-TTS-12Hz-0.6B-CustomVoice
# - voice clone default lane: Qwen3-TTS-12Hz-0.6B-Base
# - voice design default lane: Qwen3-TTS-12Hz-1.7B-VoiceDesign
# Other local speech families below remain catalog evidence only until their
# own execution plane and admission proof are explicitly cut over.
#
# LOCAL-PLANE ROW SCHEMA (K-MCAT-032 — authoring contract, populated per tier
# in wave-1/wave-2). Each runtime_plane=local models[] row gains a local-plane
# block. It is a plane-conditional block (mirrors the video_generation/voice
# capability-conditional pattern), not a schema fork:
#
#   - model_id: <stable model identity>
#     capabilities: [<canonical K-MCAT-024 tokens only>]
#     install:
#       repo: <huggingface repo>
#       revision: <pinned revision>
#       install_kind: binary | weights | verified-hf-multi-file
#       entry: <engine entry artifact, relative path>
#       artifact_roles: [<bundle roles>]
#       preferred_engine: llama | media | speech | sidecar
#     variants:                       # 1+; each variant is one installable asset
#       - variant_id: <stable per-(model,quant) identity; the installable asset_id>
#         quant: Q4_K_M | Q8_0 | Q6_K | Q5_K_M | Q4_0 | Q3 | Q2 | F16
#         files: [<file>...]
#         hashes: { <file>: "sha256:<hex>" }    # every file; missing => fail-close
#         total_size_bytes: <int>
#         host_requirement:
#           accelerator: cpu | metal | cuda
#           min_ram_bytes: <int>
#           min_vram_bytes: <int>               # required only when accelerator != cpu
#     fitness:
#       param_count: <int>
#       context_length: <int>
#
# CURATED PRESETS SCHEMA (K-MCAT-033 — authoring contract, populated in
# wave-1/wave-2). A top-level `presets:` section binds factory AIProfile
# install levels to concrete model slots. install-level keys are fixed to
# `minimal` and `recommended` (aligns with ai-profile-factory-catalog.yaml
# first_run_install_levels). `text.embed` is deliberately NOT a preset slot in
# either level — embedding is a post-initialization / cloud-default capability,
# not a first-run local baseline slot:
#
#   presets:
#     minimal:
#       factory_aiprofile_alias: local-speech-ready
#       slots:
#         - { slot: chat,  capability: text.generate,    model_ref: <model_id>, required: true }
#         - { slot: stt,   capability: audio.transcribe, model_ref: <model_id>, required: true }
#         - { slot: tts,   capability: audio.synthesize, model_ref: <model_id>, required: true }
#     recommended:
#       factory_aiprofile_alias: local-gpu
#       slots:
#         - { slot: chat,  capability: text.generate,    model_ref: <model_id>, required: true }
#         - { slot: stt,   capability: audio.transcribe, model_ref: <model_id>, required: true }
#         - { slot: tts,   capability: audio.synthesize, model_ref: <model_id>, required: true }
#         - { slot: image, capability: image.generate,   model_ref: <model_id>, required: false, host_conditional: true }
#
# Each slot.model_ref must resolve to an admitted models[] row whose
# capabilities include slot.capability. Each preset's declared capability set
# must be a subset of the bound factory AIProfile's capability_set. The
# deterministic resolver (K-MCAT-034..037) resolves
# (install_level, host_posture) over this catalog into variant-level asset ids.
# Catalog rows are populated in wave-1 (text/speech) and wave-2 (image/gpu).
models:
  - model_id: qwen3-tts-local
    updated_at: 2026-05-21
    capabilities: [audio.synthesize]
    source_ids: [qwen3_tts_customvoice_modelcard]
    voice:
      discovery_mode: dynamic_user_scoped
      dynamic_voice_set_ref: local_qwen3_tts_customvoice_dynamic_voice_set
      supports_voice_ref_kinds: [voice_asset_id, provider_voice_ref]
      langs_ref: short_v1
    install:
      repo: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
