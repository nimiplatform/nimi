schema_version: 3
provider: volcengine
catalog_version: 2026-11-07-volcengine-native-seedream
generated_target: runtime/catalog/providers/volcengine.yaml
runtime:
  inventory_mode: static_source
  runtime_plane: remote
  managed_connector_supported: true
  inline_supported: true
  default_endpoint: https://ark.cn-beijing.volces.com/api/v3
  requires_explicit_endpoint: false
defaults:
  provider: volcengine
  default_text_model: doubao-seed-2-1-pro-260915
  model_type: chat
  capabilities: []
  context_window_tokens: 8192
  pricing:
    unit: token
    input: unknown
    output: unknown
    currency: CNY
    as_of: 2026-06-28
    notes: Volcengine Ark pricing varies by account plan and endpoint tier.
      OpenSpeech speech surfaces are now tracked under the separate
      volcengine_openspeech provider.

