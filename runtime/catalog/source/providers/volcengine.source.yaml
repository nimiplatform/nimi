    url: https://www.volcengine.com/docs/82379/1520757?lang=zh
    retrieved_at: 2026-11-05
    note: Current official API reviewed for exact Seedance 2.5 and 2.0 media roles,
      options, task identity and actual result contract.
  - source_id: volcengine_seedance_query_task_api
    url: https://www.volcengine.com/docs/82379/1521309?lang=zh
    retrieved_at: 2026-11-05
    note: Current official API reviewed for exact Seedance 2.5 and 2.0 media roles,
      options, task identity and actual result contract.
  - source_id: volcengine_openai_sdk_doc
    url: https://www.volcengine.com/docs/6489/1331021
    retrieved_at: 2026-06-28
    note: Volcengine Ark OpenAI-compatible SDK documentation and model examples.
  - source_id: volcengine_model_list_doc
    url: https://www.volcengine.com/docs/82379/1330310
    retrieved_at: 2026-09-28
    note: Volcengine Ark model list documentation with recommended and previous
      model sections; refreshed against a credentialed GET /api/v3/models probe.
  - source_id: volcengine_embedding_doc
    url: https://www.volcengine.com/docs/84716/1288890
    retrieved_at: 2026-04-18
    note: Volcengine embedding model documentation.
  - source_id: volcengine_seedream_doc
    url: https://www.volcengine.com/docs/6492/2172373
    retrieved_at: 2026-04-18
    note: Volcengine Seedream image generation documentation.

  - source_id: volcengine_current_video_variants
    url: https://docs.volcengine.com/docs/ark/model-list?lang=zh
    retrieved_at: 2026-11-07
    note: Current exact Fast/Mini targets and generation-specific480p/720p output support; account access verified separately.

  - source_id: volcengine_embedding_native_api
    url: https://docs.volcengine.com/docs/ark/multimodal-vectorization-api?lang=zh
    retrieved_at: 2026-11-07
    note: Native endpoint returns one dense vector for its input parts; dimensions1024/2048, default2048.
  - source_id: volcengine_embedding_retrieval
    url: https://docs.volcengine.com/docs/ark/vectorization?lang=zh
    retrieved_at: 2026-11-07
    note: 251215 supports separate Query/Corpus instructions;250615 leaves instructions absent. Current Runtime scope is unchanged text-only dense retrieval.

  - source_id: volcengine_seedream_current_api
    url: https://docs.volcengine.com/docs/ark/image-generation-api?lang=zh
    retrieved_at: 2026-11-07
    note: Native single-image operation, generation-specific size/output-format controls, image array, dense image bytes and actual output usage.
  - source_id: volcengine_seedream_current_models
    url: https://docs.volcengine.com/docs/ark/model-list?lang=zh
    retrieved_at: 2026-11-07
    note: Published Pro/Flash and previous5.0Lite/4.5 targets; account access is independent.

