  - source_id: ideogram_v2_poll
    url: https://developer.ideogram.ai/api-reference/generations/get-generation
    retrieved_at: 2026-11-05
    note: Original task identity, closed status set, whole safe image result set and URL custody.
  - source_id: ideogram_api_overview
    url: https://developer.ideogram.ai/
    retrieved_at: 2026-04-18
    note: Ideogram developer API overview centered on current Ideogram 3.0 endpoints.
  - source_id: ideogram_generate_v3_doc
    url: https://developer.ideogram.ai/v1/api-reference/generate-images/generate-v3
    retrieved_at: 2026-11-06
    note: Native v3 multipart generation, aspect and style fields, seed presence, and safe synchronous image results.
  - source_id: ideogram_generate_legacy_doc
    url: https://developer.ideogram.ai/v1/api-reference/legacy-endpoints/generate
    retrieved_at: 2026-11-06
    note: Separate /generate JSON image_request envelope and native V_2_TURBO model identity; no silent model migration.
  - source_id: ideogram_pricing_page
    url: https://ideogram.ai/features/api-pricing
    retrieved_at: 2026-04-18
    note: Official Ideogram API pricing page.

models:
