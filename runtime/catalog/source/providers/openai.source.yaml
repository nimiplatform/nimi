schema_version: 3
provider: openai
catalog_version: 2026-09-28-openai-sora-2-retired
generated_target: runtime/catalog/providers/openai.yaml
runtime:
  inventory_mode: static_source
  runtime_plane: remote
  managed_connector_supported: true
  inline_supported: true
  default_endpoint: https://api.openai.com/v1
  requires_explicit_endpoint: false
resolution_mode: model_anchor_v2
defaults:
  provider: openai
  default_text_model: gpt-5.6-sol
  model_type: tts
  capabilities: []
  context_window_tokens: 8192
  pricing:
    unit: token
    input: unknown
    output: unknown
    currency: USD
    as_of: 2026-04-18
    notes: Official pricing differs by model family, API mode, and service class.

