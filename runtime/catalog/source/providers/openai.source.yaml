language_profiles:
  short_v1: [en, zh, ja, ko, es, fr, de]

selection_profiles:
  - profile_id: text.general
    capability: text.generate
    model_id: gpt-5.6-sol
    reviewed_at: 2026-09-28
    freshness_sla_days: 21
    rationale: Active exact GPT-5.6 Sol model with no announced shutdown; the newer GPT-6 models are not admitted for this standard OpenAI route yet.
  - profile_id: text.fast
    capability: text.generate
    model_id: gpt-5.6-terra
    reviewed_at: 2026-09-28
    freshness_sla_days: 21
    rationale: Active GPT-5.6 Terra for balanced conversational and high-volume workloads; GPT-6 Sol and Luna are not admitted for this route yet.
  - profile_id: text.reasoning
    capability: text.generate
    model_id: gpt-5.6-sol
    reviewed_at: 2026-09-28
    freshness_sla_days: 21
    rationale: Highest-capability admitted standard OpenAI model; GPT-6 Astra is OpenAI's current flagship but is not admitted for this route yet.

voice_sets:
  - voice_set_id: default-tts-v1
    langs_ref: short_v1
    source_ids: [openai_tts_doc]
    voices:
      - voice_id: alloy
        name: Alloy
      - voice_id: nova
        name: Nova
      - voice_id: shimmer
        name: Shimmer

models:
  - model_id: gpt-audio
    updated_at: 2026-03-05
    capabilities: [audio.synthesize]
    source_ids: [openai_tts_doc]
    pricing:
      unit: token
      input: "100.00"
      output: "200.00"
      currency: USD
      as_of: 2026-03-18
      notes: Audio token pricing. Input = text tokens, output = audio tokens. Per 1M tokens.
    voice:
      discovery_mode: static_catalog
      voice_set_ref: default-tts-v1
      supports_voice_ref_kinds: [preset_voice_id, provider_voice_ref]
      langs_ref: short_v1
      request_options:
        timing_modes: [none]
        audio_formats: [mp3]

  - model_id: gpt-audio-mini
    updated_at: 2026-03-05
