      as_of: 2026-03-18
      notes: Speech-to-text. Input = audio tokens. Per 1M tokens. Deprecated, with API removal on 2027-02-26; OpenAI names gpt-transcribe or gpt-live-transcribe as replacements.
    source_ids: [openai_speech_to_text_doc, openai_models_doc, openai_deprecations_doc]
    transcription:
      tiers: [core_transcript]
      response_formats: [text, json]
      supports_language: true
