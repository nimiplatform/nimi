schema_version: 3
provider: openai
catalog_version: 2026-10-02-openai-whisper-word-timing
generated_target: runtime/catalog/providers/openai.yaml
runtime:
  inventory_mode: static_source
  runtime_plane: remote
  managed_connector_supported: true
  inline_supported: true
  default_endpoint: https://api.openai.com/v1
  requires_explicit_endpoint: false
resolution_mode: model_anchor_v2
defaults:
  provider: openai
  default_text_model: gpt-5.6-sol
  model_type: tts
  capabilities: []
  context_window_tokens: 8192
  pricing:
    unit: token
    input: unknown
    output: unknown
    currency: USD
    as_of: 2026-04-18
    notes: Official pricing differs by model family, API mode, and service class.

sources:
  - source_id: openai_realtime_2_1_doc
    url: https://developers.openai.com/api/docs/models/gpt-realtime-2.1
    retrieved_at: 2026-10-01
    note: Exact GA Realtime speech-to-speech target; text/audio input and output. Tools and image input are outside Nimi's current Session contract.
  - source_id: openai_realtime_conversations_doc
    url: https://developers.openai.com/api/docs/guides/realtime-conversations
    retrieved_at: 2026-10-01
    note: GA WebSocket Session events, explicit manual commit/response, 24 kHz PCM and audio transcript output.
  - source_id: openai_tts_doc
    url: https://developers.openai.com/api/docs/guides/text-to-speech
    retrieved_at: 2026-10-01
    note: OpenAI text-to-speech guide; gpt-4o-mini-tts has 13 built-in voices, while tts-1 lacks ballad, verse, marin and cedar.
  - source_id: openai_speech_api_ref
    url: https://developers.openai.com/api/reference/resources/audio/subresources/speech/methods/create
    retrieved_at: 2026-10-01
    note: OpenAI create-speech reference; input of at most 4096 characters, speed from 0.25 to 4.0, and mp3 among the response formats. gpt-audio models are not speech-endpoint models, and the endpoint returned HTTP 404 for them on 2026-10-01.
  - source_id: openai_speech_to_text_doc
    url: https://developers.openai.com/api/docs/guides/speech-to-text
    retrieved_at: 2026-10-01
    note: OpenAI speech-to-text guide; it recommends gpt-transcribe for recorded files and lists the uploadable audio types and the 25 MB file limit.
  - source_id: openai_transcriptions_api_ref
    url: https://developers.openai.com/api/reference/resources/audio/subresources/transcriptions/methods/create
    retrieved_at: 2026-10-01
    note: OpenAI create-transcription reference; gpt-transcribe takes expected languages as the languages[] array instead of language.
  - source_id: openai_models_doc
    url: https://developers.openai.com/api/docs/models
    retrieved_at: 2026-07-20
