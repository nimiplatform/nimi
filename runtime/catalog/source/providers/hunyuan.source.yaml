schema_version: 3
provider: hunyuan
catalog_version: 2026-09-28-hunyuan-legacy-text-retired
generated_target: runtime/catalog/providers/hunyuan.yaml
runtime:
  inventory_mode: static_source
  runtime_plane: remote
  managed_connector_supported: true
  inline_supported: true
  default_endpoint: https://api.hunyuan.cloud.tencent.com/v1
  requires_explicit_endpoint: false
defaults:
  provider: hunyuan
  model_type: chat
  capabilities: []
  context_window_tokens: 8192
  pricing:
    unit: token
    input: unknown
    output: unknown
    currency: CNY
    as_of: 2026-04-18
    notes: Hunyuan pricing is model-specific. The legacy platform text models went offline on 2026-06-22, and its console and API shut down on 2026-09-30.

sources:
  - source_id: hunyuan_model_overview_doc
    url: https://cloud.tencent.com/document/product/1729/104753
    retrieved_at: 2026-04-18
    note: Tencent Hunyuan product overview with current model families, API call names, and version timestamps.
  - source_id: hunyuan_chat_model_doc
    url: https://cloud.tencent.com/document/product/1729/111007
    retrieved_at: 2026-04-18
    note: Tencent Hunyuan OpenAI-compatible API guide with current base URL, public model ids, and embedding constraints.
  - source_id: hunyuan_embedding_doc
    url: https://cloud.tencent.com/document/product/1729/102832
    retrieved_at: 2026-04-18
    note: Tencent Hunyuan embedding API reference.
  - source_id: hunyuan_pricing_doc
    url: https://cloud.tencent.com/document/product/1729/97731
    retrieved_at: 2026-04-18
    note: Tencent Hunyuan pricing overview with current per-million-token rates.
  - source_id: hunyuan_legacy_model_retirement_doc
    url: https://cloud.tencent.com/document/product/1729/131925
    retrieved_at: 2026-09-28
    note: Official notice that 46 legacy Hunyuan text models, including hunyuan-2.0-instruct-20251111, hunyuan-2.0-thinking-20251109, hunyuan-turbos-latest, and hunyuan-t1-latest, went offline at 2026-06-22 00:00 Beijing time; migration requires a TokenHub API key and base URL.
  - source_id: hunyuan_legacy_platform_shutdown_notice
    url: https://cloud.tencent.com/announce/detail/2287
    retrieved_at: 2026-09-28
    note: Official notice that the legacy Tencent Hunyuan platform console and API shut down at 2026-09-30 00:00 Beijing time.

models:
  - model_id: hunyuan-embedding
    model_type: embedding
    updated_at: 2026-04-18
    capabilities: [text.embed]
    # K-MEM-004 / K-AIEXEC-006: Hunyuan OpenAI-compatible embeddings fix
    # dimensions=1024 (see pricing notes below).
    embedding:
      dimension: 1024
    pricing:
      unit: token
      input: "0.7"
      output: "0"
      currency: CNY
      as_of: 2026-04-18
      notes: Embedding pricing is published at 0.7 CNY per 1M input tokens. OpenAI-compatible embeddings currently fix `model=hunyuan-embedding` and `dimensions=1024`. The legacy platform API that serves this row shuts down on 2026-09-30.
    source_ids: [hunyuan_embedding_doc, hunyuan_chat_model_doc, hunyuan_pricing_doc, hunyuan_legacy_platform_shutdown_notice]

  - model_id: hunyuan-dit
    model_type: image
    updated_at: 2026-03-05
    capabilities: [image.generate]
    features: [input.image, input.mask]
    image_request_options:
      response_formats: [b64_json, url]
      max_images_per_request: 1
      supports_negative_prompt: true
      supports_reference_images: true
      supports_mask: true
      supports_seed: true
      supports_size: true
      supports_aspect_ratio: true
      supports_quality: true
      supports_style: true
    pricing:
      unit: request
      input: unknown
      output: unknown
      currency: CNY
      as_of: 2026-03-05
      notes: Image generation pricing varies by quality and resolution. The legacy platform API that serves this row shuts down on 2026-09-30.
    source_ids: [hunyuan_model_overview_doc, hunyuan_legacy_platform_shutdown_notice]
