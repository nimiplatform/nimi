schema_version: 3
provider: mistral
catalog_version: 2026-11-06-mistral-native-text
generated_target: runtime/catalog/providers/mistral.yaml
runtime:
  inventory_mode: static_source
  runtime_plane: remote
  managed_connector_supported: true
  inline_supported: true
  default_endpoint: https://api.mistral.ai/v1
  requires_explicit_endpoint: false
defaults:
  provider: mistral
  default_text_model: mistral-large-4-0
  model_type: chat
  capabilities: []
  context_window_tokens: 8192
  pricing:
    unit: token
    input: unknown
    output: unknown
    currency: USD
    as_of: 2026-04-18
    notes: Mistral pricing varies by model class, region, and account plan.

sources:
  - source_id: mistral_models_doc
    url: https://docs.mistral.ai/models
    retrieved_at: 2026-04-18
    note: Mistral model catalog and lifecycle aliases.
  - source_id: mistral_changelog_doc
    url: https://docs.mistral.ai/resources/changelogs
    retrieved_at: 2026-04-18
    note: Mistral platform changelog with dated model releases.
  - source_id: mistral_large_3_doc
    url: https://docs.mistral.ai/models/mistral-large-3-25-12
    retrieved_at: 2026-04-18
    note: Mistral Large 3 model card.
  - source_id: mistral_medium_3_1_doc
    url: https://docs.mistral.ai/models/mistral-medium-3-1-25-08
    retrieved_at: 2026-04-18
    note: Mistral Medium 3.1 model card.
  - source_id: mistral_small_4_doc
    url: https://docs.mistral.ai/models/mistral-small-4-0-26-03
    retrieved_at: 2026-04-18
    note: Mistral Small 4 model card.
  - source_id: mistral_codestral_doc
    url: https://docs.mistral.ai/models/codestral-25-08
    retrieved_at: 2026-04-18
    note: Codestral 2508 model card.
  - source_id: mistral_embed_model_doc
    url: https://docs.mistral.ai/models/mistral-embed-23-12
    retrieved_at: 2026-04-18
    note: Mistral Embed model card.
  - source_id: mistral_embeddings_doc
    url: https://docs.mistral.ai/studio-api/knowledge-rag/embeddings
    retrieved_at: 2026-04-18
    note: Mistral embeddings capability documentation.
  - source_id: mistral_sdk_clients_doc
    url: https://docs.mistral.ai/getting-started/clients
    retrieved_at: 2026-04-18
    note: Official SDK examples using Mistral latest aliases.
  - source_id: mistral_adjustable_reasoning_doc
    url: https://docs.mistral.ai/capabilities/reasoning/adjustable
    retrieved_at: 2026-04-18
    note: Adjustable reasoning support for mistral-small-latest.

  - source_id: mistral_large4_doc
    url: https://docs.mistral.ai/models/mistral-large-4-0
    retrieved_at: 2026-11-06
    note: Public Preview Large 4 model code, context and pricing.
  - source_id: mistral_native_chat_doc
    url: https://docs.mistral.ai/openapi.yaml
    retrieved_at: 2026-11-06
    note: Native Chat request, content chunks, tool choice, strict JSON Schema and SSE contracts.
  - source_id: mistral_current_reasoning_doc
    url: https://docs.mistral.ai/inference/conversations/reasoning
    retrieved_at: 2026-11-06
    note: Large 4 low/medium/high, Small 4 none/high, native ThinkChunk replay and mixed stream content shapes.
  - source_id: mistral_current_vision_doc
    url: https://docs.mistral.ai/inference/conversations/vision
    retrieved_at: 2026-11-06
    note: Eight images, 10 MB files and PNG/JPEG/WebP/single-frame GIF; native image_url.
  - source_id: mistral_lifecycle_doc
    url: https://docs.mistral.ai/inference/model-lifecycle
    retrieved_at: 2026-11-06
    note: Deprecated models remain available until retirement; aliases can cross generations, preview may silently change, and fixed major.minor targets are preferred.
  - source_id: mistral_medium35_deprecation_doc
    url: https://docs.mistral.ai/models/mistral-medium-3-5-26-04
    retrieved_at: 2026-11-06
    note: Medium 3.5 deprecated on 2026-10-31; official replacement Large 4. Not a claim of immediate endpoint shutdown.

selection_profiles:
  - profile_id: text.general
    capability: text.generate
    model_id: mistral-large-4-0
    reviewed_at: 2026-11-06
    freshness_sla_days: 21
    rationale: Current Large 4 replaces deprecated Large 3 and Medium 3.5 for new integrations; it remains Public Preview with possible silent updates, and live account acceptance is separate.
  - profile_id: text.fast
    capability: text.generate
    model_id: mistral-small-2603
    reviewed_at: 2026-11-06
    freshness_sla_days: 21
    rationale: Current GA Small 4 exact dated target, with native none/high reasoning and efficient 6.5B active parameters; no mutable alias is substituted for the selected model.

models:
  - model_id: mistral-large-4-0
    model_type: chat
    updated_at: 2026-10-06
    capabilities: [text.generate]
    features: [input.image]
    context_window_tokens: 1000000
    pricing:
      unit: token
      input: "0.70"
      output: "2.10"
      currency: USD
      as_of: 2026-11-06
      notes: Public Preview Large 4 exact major.minor target; upstream may silently update preview weights. Native thinking blocks and signatures are replayed without exposing raw reasoning as an answer. Per 1M tokens; account availability and task quality require live acceptance.
    source_ids: [mistral_large4_doc, mistral_native_chat_doc, mistral_current_reasoning_doc, mistral_current_vision_doc, mistral_lifecycle_doc]

  - model_id: mistral-large-4
    model_type: chat
    updated_at: 2026-10-06
    capabilities: [text.generate]
    features: [input.image]
    context_window_tokens: 1000000
    pricing:
      unit: token
      input: "0.70"
      output: "2.10"
      currency: USD
      as_of: 2026-11-06
      notes: Public Preview Large 4 major-version API target; not an immutable weight pin. Its replay kind remains separate from the exact major.minor target. Per 1M tokens; account availability and task quality require live acceptance.
    source_ids: [mistral_large4_doc, mistral_native_chat_doc, mistral_current_reasoning_doc, mistral_current_vision_doc, mistral_lifecycle_doc]

  - model_id: mistral-small-2603
    model_type: chat
    updated_at: 2026-03-16
    capabilities: [text.generate]
    features: [input.image]
    context_window_tokens: 256000
    pricing:
      unit: token
      input: "0.15"
      output: "0.60"
      currency: USD
      as_of: 2026-11-06
      notes: GA Small 4 dated API target, native none/high reasoning and typed thinking replay. Per 1M tokens; account availability and task quality require live acceptance.
    source_ids: [mistral_small_4_doc, mistral_native_chat_doc, mistral_current_reasoning_doc, mistral_current_vision_doc, mistral_lifecycle_doc]

  - model_id: codestral-latest
    model_type: chat
    updated_at: 2025-07-30
    capabilities: [text.generate]
    pricing:
      unit: token
      input: "0.30"
      output: "0.90"
      currency: USD
      as_of: 2026-04-18
      notes: Current alias-backed code-specialized row aligned to Codestral 2508. Per 1M tokens.
    source_ids: [mistral_models_doc, mistral_changelog_doc, mistral_codestral_doc]

  - model_id: mistral-embed
    model_type: embedding
    updated_at: 2023-12-11
    capabilities: [text.embed]
    # K-MEM-004 / K-AIEXEC-006: mistral-embed emits 1024-dim vectors.
    embedding:
      dimension: 1024
    pricing:
      unit: token
      input: "0.10"
      output: "0"
      currency: USD
      as_of: 2026-04-18
      notes: General-purpose text embedding model retained in current source scope. Per 1M tokens.
    source_ids: [mistral_embeddings_doc, mistral_embed_model_doc, mistral_models_doc]
