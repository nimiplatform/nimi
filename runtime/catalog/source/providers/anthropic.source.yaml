sources:
  - source_id: anthropic_models_overview
    url: https://platform.claude.com/docs/en/about-claude/models/overview
    retrieved_at: 2026-09-30
    note: Claude model overview with API model IDs, aliases, thinking mode, context, output limits and retirement commitments; current models are Claude Fable 5.1, Opus 5.5, Sonnet 5.5 and Haiku 4.5, and every current model supports text and image input and tool use.
  - source_id: anthropic_thinking
    url: https://platform.claude.com/docs/en/build-with-claude/thinking
    retrieved_at: 2026-09-30
    note: Per-model thinking configuration; Opus 5.5 and Fable 5.1 reject disabled thinking, Sonnet 5.5 thinks by default, display defaults to omitted, signed thinking and redacted_thinking blocks return unmodified with tool results, and these models reject non-default sampling and forced tool use on every request.
  - source_id: anthropic_structured_outputs
    url: https://platform.claude.com/docs/en/build-with-claude/structured-outputs
    retrieved_at: 2026-09-30
    note: Structured outputs through output_config.format json_schema without a beta header on every current model, with the documented schema limits.
