  default_text_model: MiniMax-M3.1-Flash
  model_type: chat
  capabilities: []
  context_window_tokens: 8192
  pricing:
    unit: token
    input: unknown
    output: unknown
    currency: USD
    as_of: 2026-07-20
    notes: Current MiniMax M3 pricing varies by pay-as-you-go and Token Plan product surface.
sources:
