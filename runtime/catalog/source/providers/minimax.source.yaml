schema_version: 3
provider: minimax
catalog_version: 2026-07-20-minimax-v3
generated_target: runtime/catalog/providers/minimax.yaml
runtime:
  inventory_mode: static_source
  runtime_plane: remote
  managed_connector_supported: true
  inline_supported: true
  default_endpoint: https://api.minimaxi.com/v1
  requires_explicit_endpoint: false
defaults:
  provider: minimax
  default_text_model: MiniMax-M3
  model_type: chat
  capabilities: []
  context_window_tokens: 8192
  pricing:
    unit: token
    input: unknown
    output: unknown
    currency: USD
    as_of: 2026-07-20
    notes: Current MiniMax M3 pricing varies by pay-as-you-go and Token Plan product surface.

sources:
  - source_id: minimax_api_overview
    url: https://platform.minimaxi.com/docs/api-reference/api-overview
    retrieved_at: 2026-07-20
    note: MiniMax API overview with text, image, and video model tables.
  - source_id: minimax_text_openai_api
    url: https://platform.minimaxi.com/docs/api-reference/text-openai-api
    retrieved_at: 2026-07-20
    note: MiniMax OpenAI-compatible text API with supported model IDs.
  - source_id: minimax_text_models_doc
    url: https://platform.minimaxi.com/docs/guides/text-generation
    retrieved_at: 2026-07-20
    note: Current MiniMax text model matrix, exact M3 model id, multimodal input contract, and 1M context limit.
  - source_id: minimax_sdk_quickstart_doc
    url: https://platform.minimaxi.com/docs/guides/quickstart-sdk
    retrieved_at: 2026-07-20
    note: Current SDK quickstart using MiniMax-M3 through the production API endpoint.
  - source_id: minimax_image_intro_doc
    url: https://platform.minimaxi.com/docs/guides/image-generation
    retrieved_at: 2026-07-20
    note: MiniMax image generation overview with the current public image model list.
  - source_id: minimax_video_intro_doc
    url: https://platform.minimaxi.com/docs/guides/video-generation
    retrieved_at: 2026-07-20
    note: MiniMax video generation overview with the current Hailuo video model family.
  - source_id: minimax_pricing_paygo
    url: https://platform.minimaxi.com/docs/guides/pricing-paygo
    retrieved_at: 2026-07-20
    note: MiniMax pay-as-you-go pricing for text, image, and video models.

selection_profiles:
  - profile_id: text.general
    capability: text.generate
    model_id: MiniMax-M3
    reviewed_at: 2026-07-20
    freshness_sla_days: 21
    rationale: Current MiniMax frontier text and multimodal Agent model exposed by the production SDK and API docs.

models:
  - model_id: MiniMax-M3
    model_type: chat
    updated_at: 2026-07-20
    capabilities: [text.generate, text.generate.vision]
    pricing:
      unit: token
      input: unknown
      output: unknown
      currency: USD
      as_of: 2026-07-20
      notes: Current frontier coding and agent model with native image and video inputs and a documented 1M context window.
    source_ids: [minimax_api_overview, minimax_text_openai_api, minimax_text_models_doc, minimax_sdk_quickstart_doc, minimax_pricing_paygo]

  - model_id: MiniMax-M2.7
    model_type: chat
    updated_at: 2026-04-18
    capabilities: [text.generate]
    pricing:
      unit: token
      input: 0.3
      output: 1.2
      currency: USD
      as_of: 2026-04-18
      notes: Official MiniMax pay-as-you-go pricing for the MiniMax-M2.7 text model.
    source_ids: [minimax_api_overview, minimax_text_openai_api, minimax_pricing_paygo]

  - model_id: MiniMax-Hailuo-2.3
    model_type: video
    updated_at: 2026-04-18
    capabilities: [video.generate]
    pricing:
      unit: request
      input: unknown
      output: unknown
      currency: USD
      as_of: 2026-04-18
      notes: Official pricing page exposes MiniMax-Hailuo-2.3-Fast prices clearly, but the non-fast MiniMax-Hailuo-2.3 row is not machine-readable enough to admit a precise stable price here.
    source_ids: [minimax_api_overview, minimax_video_intro_doc, minimax_pricing_paygo]
    video_generation:
      modes: [t2v, i2v_first_frame, i2v_first_last, i2v_reference]
      input_roles:
        t2v: [prompt]
        i2v_first_frame: [prompt, first_frame]
        i2v_first_last: [prompt, first_frame, last_frame]
        i2v_reference: [prompt, reference_image]
      limits:
        resolution: [720p, 1080p]
        duration_sec: [6, 10]
      options:
        supports: [resolution, ratio, duration_sec]
        constraints: {}
      outputs:
        video_url: true

  - model_id: image-01
    model_type: image
    updated_at: 2026-04-18
    capabilities: [image.generate]
    image_request_options:
      response_formats: [b64_json, url]
      max_images_per_request: 1
      supports_negative_prompt: true
      supports_reference_images: false
      supports_mask: false
      supports_seed: false
      supports_size: true
      supports_aspect_ratio: true
      supports_quality: true
      supports_style: true
    pricing:
      unit: request
      input: 0.0035
      output: "0"
      currency: USD
      as_of: 2026-04-18
      notes: Official MiniMax pay-as-you-go pricing for image-01.
    source_ids: [minimax_api_overview, minimax_image_intro_doc, minimax_pricing_paygo]
