      input: unknown
      output: unknown
      currency: USD
      as_of: 2026-09-28
      notes: Stable Flash model for long-horizon agentic and software engineering workloads, with text, image, video, audio, and PDF inputs, a 1,048,576-token input limit, and a 65,536-token output limit.
