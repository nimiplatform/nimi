schema_version: 3
provider: gemini
catalog_version: 2026-10-03-gemini-word-timestamps
generated_target: runtime/catalog/providers/gemini.yaml
runtime:
  inventory_mode: static_source
  runtime_plane: remote
  managed_connector_supported: true
  inline_supported: true
  default_endpoint: https://generativelanguage.googleapis.com/v1beta/openai
  requires_explicit_endpoint: false
defaults:
  provider: gemini
  default_text_model: gemini-3.8-flash
  model_type: chat
  capabilities: []
  context_window_tokens: 8192
  pricing:
    unit: token
    input: unknown
    output: unknown
    currency: USD
    as_of: 2026-04-18
    notes: Gemini public pricing varies by model family, inference tier, and modality mix. This family-scoped refresh only normalizes text and embedding public contract pricing.

