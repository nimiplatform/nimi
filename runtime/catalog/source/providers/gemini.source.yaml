    source_ids: [gemini_2_5_flash_lite_doc, gemini_models_doc, gemini_pricing_doc]

  - model_id: gemini-embedding-001
    model_type: embedding
    updated_at: 2026-04-18
    capabilities: [text.embed]
    # K-MEM-004 / K-AIEXEC-006: native (default) output dimension. Gemini
    # embedding supports Matryoshka truncation (e.g. 1536/768); 3072 is the
    # native default recorded as profile identity.
    embedding:
      dimension: 3072
    pricing:
      unit: token
      input: "0.15"
      output: "0"
      currency: USD
      as_of: 2026-04-18
      notes: Standard paid-tier text-only embedding price. Batch price is lower. Per 1M tokens.
    source_ids: [gemini_embedding_001_doc, gemini_models_doc, gemini_pricing_doc]

  - model_id: gemini-embedding-2-preview
    model_type: embedding
    updated_at: 2026-04-18
    capabilities: [text.embed]
    pricing:
      unit: token
      input: "0.20"
      output: "0"
      currency: USD
      as_of: 2026-04-18
      notes: Text input price for the multimodal embedding model. Image, audio, and video inputs have separate rates. Supports text, image, video, audio, and PDF inputs. Per 1M text tokens. The lifecycle table lists a shortened embedding-2-preview ID with a 2026-08-10 shutdown, while this exact preview ID was still listed and served on 2026-09-28; the row declares no fixed output dimension.
    source_ids: [gemini_embedding_2_preview_doc, gemini_models_doc, gemini_deprecations_doc, gemini_pricing_doc, gemini_changelog_doc]

  - model_id: gemini-3.1-flash-image
    model_type: image
    updated_at: 2026-05-28
    capabilities: [image.generate]
    features: [input.image]
    image_request_options:
      response_formats: [b64_json]
      max_images_per_request: 1
      supports_negative_prompt: false
      supports_reference_images: true
      supports_mask: false
      supports_seed: false
      supports_size: false
      supports_aspect_ratio: true
      supports_quality: false
      supports_style: false
    pricing:
      unit: request
      input: unknown
      output: "0.067"
      currency: USD
      as_of: 2026-09-28
      notes: Standard paid tier bills $0.067 for each default 1K output image; text and image input tokens bill at $0.50 per 1M. Stable replacement for the retired image previews and for gemini-2.5-flash-image, which shuts down on 2026-10-02.
    source_ids: [gemini_3_1_flash_image_doc, gemini_generate_content_image_doc, gemini_models_doc, gemini_deprecations_doc, gemini_pricing_doc]

  - model_id: gemini-3.1-pro-preview
