selection_profiles:
  - profile_id: text.general
    capability: text.generate
    model_id: gemini-3.8-flash
    reviewed_at: 2026-09-28
    freshness_sla_days: 21
    rationale: Newest stable Gemini Flash model and Google's named choice for new projects; base text and image input verified through the OpenAI-compatible endpoint.
  - profile_id: text.fast
    capability: text.generate
    model_id: gemini-3.5-flash-lite
    reviewed_at: 2026-09-28
    freshness_sla_days: 21
    rationale: Google's fastest and most cost-effective stable Flash-Lite model and the announced replacement for Gemini 3.1 Flash-Lite; base text and image input verified through the OpenAI-compatible endpoint.
  - profile_id: text.reasoning
    capability: text.generate
    model_id: gemini-3.1-pro-preview
    reviewed_at: 2026-09-28
    freshness_sla_days: 21
    rationale: Gemini 3.1 Pro Preview remains the only Pro-tier Gemini API text model for advanced reasoning; it is a preview with no announced shutdown date.

