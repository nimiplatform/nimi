    features: [input.image]
    source_ids: [bfl_current_schema]
    video_generation:
      modes: [t2v, i2v_first_frame, i2v_first_last]
      input_roles:
        t2v: [prompt]
        i2v_first_frame: [prompt, first_frame]
        i2v_first_last: [prompt, first_frame, last_frame]
      limits:
        resolution: [720p, 1080p, 1440p, 4k]
        duration_sec: {min: -1, max: 20}
        ratio: [16:9, 4:3, 1:1, 3:4, 9:16, 21:9, 9:21, adaptive]
      options:
        supports: [resolution, ratio, duration_sec, generate_audio, draft]
        constraints: {}
      outputs: {video_url: true, last_frame_url: false}
