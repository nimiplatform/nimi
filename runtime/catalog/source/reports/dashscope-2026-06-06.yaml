gap_summary:
  missing_in_source:
    - qwen3.7-max
    - qwen3.7-plus
    - qwen3.7-max-preview
    - cosyvoice-v3-flash
    - cosyvoice-v3-plus
    - cosyvoice-v3.5-plus
    - cosyvoice-v3.5-flash
    - voice-enrollment workflow bindings for CosyVoice target synthesis models
  stale_in_source:
    - defaults.default_text_model points to qwen3-max instead of current Qwen3.7 max line.
    - selection_profiles[text.general] points to qwen3-max instead of current Qwen3.7 max line.
  extra_legacy_in_source: []
  uncertain_items:
    - The user-provided Alibaba Cloud notice lists qwen-tts historical rows to be removed on 2026-07-06; those rows are already absent from source, so no source removal is required.
    - CosyVoice v3.5 rows have no system voices in official docs, so source should represent them as dynamic-user-scoped voice rows only.
curation_decision:
  keep:
    - qwen3.6-plus and qwen3.6-flash as previous-generation and fast route rows.
    - qwen3 TTS rows because official docs still list them separately from the deprecated qwen-tts historical line.
  add:
    - qwen3.7-max with snapshot alias qwen3.7-max-2026-05-20.
    - qwen3.7-plus with snapshot alias qwen3.7-plus-2026-05-26.
    - qwen3.7-max-preview with snapshot alias qwen3.7-max-2026-05-17.
    - CosyVoice v3/v3.5 synthesis rows and static v3 system voice set for v3-flash/v3-plus.
    - CosyVoice voice clone/design workflow row using voice-enrollment.
  defer:
    - Realtime WebSocket adapter support for CosyVoice, because current runtime scenario job path is HTTP job execution.
  reject_or_noise:
    - qwen-tts-latest and qwen-tts-realtime-latest reintroduction.
review_actions:
  selection_profiles_review_required: true
  defaults_review_required: true
  capability_review_required: true
notes:
  - CosyVoice HTTP synthesis uses /api/v1/services/audio/tts/SpeechSynthesizer, not the Qwen-TTS multimodal-generation endpoint.
  - CosyVoice clone/design uses /api/v1/services/audio/tts/customization with model voice-enrollment and action create_voice.
confidence: high
