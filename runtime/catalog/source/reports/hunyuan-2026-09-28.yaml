notes:
  - No admitted Hunyuan text row remains callable, so the source now carries no recommendation instead of an offline one.
  - The four offline text rows were removed with no replacement row and no substitute provider, so Hunyuan no longer declares text.generate and its catalog_version changed to 2026-09-28-hunyuan-legacy-text-retired.
  - "Provider retirement decision: the project has not launched, no local data root, App, SDK, Kit, or Desktop flow uses a Hunyuan Connector or row, no new legacy API key can be created, and the remaining API ends on 2026-09-30. The provider is therefore removed now instead of leaving selectable rows that cannot serve a new user and stop within two days."
  - "Owners: model-catalog r001 makes the source file set the provider set; ai-provider r032 rejects a non-canonical provider name at Create Connector, Test Connector, List Connector Models, AIConfig, and Job validation; r031 keeps committed Cloud intent and reports a typed reason; r024 serves Connector models only from the active snapshot. No authority unit enumerates hunyuan, so no authority text changes."
  - "Existing hunyuan Connectors stay listed and deletable. Test Connector and List Connector Models reject them with AI_CONNECTOR_INVALID before any credential or provider access; they offer no AIConfig target; a committed hunyuan target projects BLOCKED with AI_REMOTE_MODEL_CATALOG_STALE and fails admission without dispatch. User catalog overlays for hunyuan are ignored by the loader."
