    updated_at: 2026-11-06
    capabilities:
      - video.generate
    pricing:
      unit: request
      input: unknown
      output: unknown
      currency: USD
      as_of: 2026-11-04
      notes: Current stable Omni target. Text, first-frame and image-reference generation allow 3–15 seconds; first/last interpolation remains 3–10 seconds. Native URI storage and cleanup retain exact original resource custody. Price varies by resolution and duration; measured cost is not inferred.
    source_ref:
      url: https://aistudio.google.com/docs/omni
      retrieved_at: 2026-11-06
      note: Stable Omni 1.1 and 1.2 Flash use unary Interactions with stored URI delivery for text, first/last-frame and reference-image tasks up to 4K. Inputs and outputs are temporarily stored by Google. Runtime captures the original interaction and file, takes complete local custody, then requests deletion of both; failures and absent resources are recorded separately without claiming instant deletion or stopped computation/billing. There is no replay of creation or automatic delivery fallback.
    features:
      - input.image
    video_generation:
      modes:
        - t2v
        - i2v_first_frame
        - i2v_first_last
        - i2v_reference
      input_roles:
        t2v:
          - prompt
        i2v_first_frame:
          - prompt
          - first_frame
        i2v_first_last:
          - prompt
          - first_frame
          - last_frame
        i2v_reference:
          - prompt
          - reference_image
      limits:
        reference_images:
          min: 1
          max: 6
        resolution:
          - 360p
          - 720p
          - 1080p
          - 4k
        ratio:
          - 16:9
          - 9:16
        duration_sec:
          min: 3
          max: 15
      options:
        supports:
          - resolution
          - ratio
          - duration_sec
        constraints: {}
      outputs:
        video_url: true
