    freshness_sla_days: 21
    rationale: Retained stable high-speed multimodal reasoning choice; current Step 5 Preview is separately admitted for more demanding agent and knowledge work.
  - provider: stepfun
    profile_id: text.fast
    capability: text.generate
    model_id: step-3.5-flash-2603
    reviewed_at: 2026-11-06
    freshness_sla_days: 21
    rationale: Agent-optimized Step 3.5 Flash snapshot with faster inference and a low-reasoning mode; the previous step-2-mini target was retired on 2026-07-08.
  - provider: stepfun
    profile_id: text.reasoning
    capability: text.generate
    model_id: step-5-preview
    reviewed_at: 2026-11-06
    freshness_sla_days: 21
    rationale: Current vendor recommendation for demanding software engineering, professional knowledge and multi-step agent work; Preview status and live account acceptance remain explicit.
voice_workflow_models:
  - workflow_model_id: stepfun-voice-clone
    workflow_type: reference_audio
    workflow_family: stepfun
    input_contract_ref: stepfun_voice_clone_input_v2
    output_persistence: provider_persistent
    request_options:
      text_prompt_mode: required
      supports_language_hints: false
      supports_preferred_name: false
      reference_audio_uri_input: true
      reference_audio_bytes_input: true
      allowed_reference_audio_mime_types:
        - audio/wav
        - audio/mpeg
    target_model_refs:
      - step-tts-2
    source_ref:
      url: https://platform.stepfun.ai/docs/en/api-reference/audio/create-voice
      retrieved_at: 2026-04-18
      note: StepFun voice cloning API requiring model, text transcript, and file_id.
    langs:
      - zh
      - en
      - ja
model_workflow_bindings:
  - model_id: step-tts-2
    workflow_model_refs:
      - stepfun-voice-clone
    workflow_types:
      - reference_audio
voice_handle_policies:
  - policy_id: stepfun_provider_persistent_default
    applies_to_workflow_types:
      - reference_audio
    persistence: provider_persistent
    default_ttl: none
    scope: user_scoped
    delete_semantics: best_effort_provider_delete
    runtime_reconciliation_required: true
    source_ref:
      url: https://platform.stepfun.ai/docs/en/api-reference/audio/create-voice
      retrieved_at: 2026-04-18
      note: StepFun voice cloning API requiring model, text transcript, and file_id.
