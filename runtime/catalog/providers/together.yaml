    provider: together
    model_type: video
    updated_at: 2026-11-07
    capabilities:
      - video.generate
    pricing:
      unit: request
      input: unknown
      output: unknown
      currency: USD
      as_of: 2026-11-07
      notes: Original v2 video job; 2-15 seconds, 30fps and native audio. First/last images use owned PNG/JPEG. No upstream cancel or fee-stop claim; continuation, R2V and audio inputs are not mapped.
    source_ref:
      url: https://docs.together.ai/docs/serverless/models
      retrieved_at: 2026-11-07
      note: Official Together contract; real account inference is recorded separately.
    video_generation:
      modes:
        - t2v
      input_roles:
        t2v:
          - prompt
      limits:
        resolution:
          - 720p
          - 1080p
        ratio:
          - 16:9
          - 9:16
          - 1:1
          - 4:3
          - 3:4
        duration_sec:
          min: 2
          max: 15
      options:
        supports:
          - resolution
          - ratio
          - duration_sec
          - fps
          - seed
          - generate_audio
        constraints:
          fps:
            allowed:
              - 30
          generate_audio:
            allowed:
              - true
      outputs:
        video_url: true
