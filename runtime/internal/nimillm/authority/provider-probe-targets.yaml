version: 1
table_family: product_catalog
owner: runtime
catalog_id: runtime_provider_probe_targets
production_target_authority: runtime_service_owned_connector_provider_or_engine_state
production_credential_authority: runtime_service_principal_custody_ref_only
production_environment_or_argv_consumption: forbidden
environment_columns_scope: separately_signed_synthetic_non_product_probe_fixture_only
environment_fixture_product_evidence_allowed: false
entries:
  - local
  - local-image
  - local-media
  - local-speech
  - local-sidecar
  - cloud-nimillm
  - cloud-dashscope
  - cloud-volcengine
  - cloud-volcengine-openspeech
  - cloud-gemini
  - cloud-minimax
  - cloud-mimo
  - cloud-kimi
  - cloud-glm
  - cloud-deepseek
  - cloud-openrouter
  - cloud-openai
  - cloud-openai-compatible
  - cloud-openai-codex
targets:
  - name: local
    base_url_env: NIMI_RUNTIME_LOCAL_LLAMA_BASE_URL
    api_key_env: NIMI_RUNTIME_LOCAL_LLAMA_API_KEY
    category: local
    source_rule: K-PROV-002
  - name: local-image
    base_url_env: engine-managed media diffusers backend
    api_key_env: n/a
    category: local
    source_rule: K-PROV-002
  - name: local-media
