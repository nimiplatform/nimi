[project]
name = "nimi-face-swap-profile"
version = "0.0.0"
requires-python = "==3.12.15"
dependencies = [
  "av==19.0.2",
  "insightface==2.1",
  "numpy==2.5.4",
  "onnx==1.23.2",
  "onnxruntime-gpu[cuda,cudnn]==1.31.0",
  "opencv-python-headless==5.0.0.93",
  "pillow==13.0.0",
  "scikit-image==0.26.0",
  "scipy==1.18.1",
  # 13.8.1.7 currently publishes Linux wheels only; this is the latest Windows wheel.
  "nvidia-cublas==13.8.0.4",
  "nvidia-cuda-nvrtc==13.4.92",
  "nvidia-cuda-runtime==13.4.92",
  "nvidia-cudnn-cu13==9.27.0.42",
  "nvidia-cufft==12.4.0.43",
  "nvidia-curand==10.4.4.72",
  "nvidia-nvjitlink==13.4.92",
]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
# The managed profile supplies the headless OpenCV distribution and exactly
# one ONNX Runtime distribution; InsightFace 2.1 provides a pure-Python wheel.
exclude-dependencies = [{ package = { name = "insightface", version = "2.1" }, dependencies = ["opencv-python", "onnxruntime"] }]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
