[project]
name = "nimi-managed-python-profile"
version = "0.0.0"
requires-python = "==3.12.13"
dependencies = [
  "librosa==0.10.2.post1",
  "llvmlite==0.43.0",
  "numba==0.60.0",
  "numpy==1.26.4",
  "onnxruntime==1.20.1",
  "scikit-learn==1.5.2",
  "scipy==1.13.1",
  "soundfile==0.12.1",
  "soxr==0.3.7",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
