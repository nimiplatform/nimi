[project]
name = "nimi-managed-python-profile"
version = "0.0.0"
requires-python = "==3.12.15"
dependencies = [
  "fastapi==0.161.1",
  "huggingface-hub==2.2.0",
  "laya==0.4.13",
  "numpy==2.5.4",
  "safetensors==0.8.0",
  "tokenizers==0.23.3",
  "torch==2.14.1",
  "transformers==5.20.2",
  "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch" }
