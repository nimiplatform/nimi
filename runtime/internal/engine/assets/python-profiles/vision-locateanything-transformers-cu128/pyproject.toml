[project]
name = "nimi-managed-python-profile"
version = "0.0.0"
requires-python = "==3.12.13"
dependencies = [
  "accelerate==1.10.1",
  "decord==0.6.0",
  "fastapi==0.121.1",
  "huggingface-hub==0.35.3",
  "lmdb==1.7.5",
  "numpy==2.2.6",
  "opencv-python-headless==4.11.0.86",
  "peft==0.17.1",
  "Pillow==11.1.0",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "transformers==4.57.1",
  "uvicorn[standard]==0.38.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
