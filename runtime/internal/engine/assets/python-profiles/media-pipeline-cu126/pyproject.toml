[project]
name = "nimi-media-pipeline-profile"
version = "0.0.0"
requires-python = "==3.12.13"
dependencies = [
  "accelerate==1.13.0",
  "diffusers==0.37.0",
  "imageio==2.37.3",
  "imageio-ffmpeg==0.6.0",
  "pillow==12.1.0",
  "protobuf==6.33.5",
  "safetensors==0.7.0",
  "sentencepiece==0.2.1",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "transformers==5.3.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
