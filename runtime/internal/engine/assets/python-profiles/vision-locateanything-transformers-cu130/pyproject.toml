[project]
name = "nimi-managed-python-profile"
version = "0.0.0"
requires-python = "==3.12.15"
dependencies = [
  "accelerate==1.15.0",
  "decord==0.6.0",
  "fastapi==0.161.1",
  "huggingface-hub==0.36.2",
  "lmdb==3.0.0",
  "numpy==2.5.4",
  "opencv-python-headless==5.0.0.93",
  "peft==0.21.2",
  "Pillow==13.0.0",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "transformers==4.57.6",
  "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
