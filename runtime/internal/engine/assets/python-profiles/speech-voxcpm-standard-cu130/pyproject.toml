[project]
name = "nimi-managed-python-profile"
version = "0.0.0"
requires-python = "==3.12.15"
dependencies = [
  "fastapi==0.161.1",
  "python-multipart==0.0.32",
  "soundfile==0.14.0",
  "torch==2.14.1",
  "torchaudio==2.11.0",
  "uvicorn[standard]==0.54.0",
  "voxcpm==2.0.3",
]

[tool.uv]
# Runtime uses VoxCPM inference with load_denoiser=False; upstream demos,
# training datasets, hosted Spaces and ModelScope denoising are not installed.
exclude-dependencies = [{ package = { name = "voxcpm", version = "2.0.3" }, dependencies = ["gradio", "datasets", "modelscope", "funasr", "spaces", "matplotlib"] }]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
package = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }
