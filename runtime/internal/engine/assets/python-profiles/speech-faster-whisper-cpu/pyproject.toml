[project]
name = "nimi-managed-python-profile"
version = "0.0.0"
requires-python = "==3.12.13"
dependencies = [
  "av==18.1.0",
  "ctranslate2==4.8.2",
  "faster-whisper==1.2.1",
  "fastapi==0.121.1",
  "numpy==2.5.3",
  "onnxruntime==1.30.0",
  "python-multipart==0.0.26",
  "silero-vad==6.2.1",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "uvicorn[standard]==0.38.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }
