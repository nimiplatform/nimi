[project]
name = "nimi-hyperswap-macos-profile"
version = "0.0.0"
requires-python = "==3.12.15"
dependencies = [
  "av==19.0.2",
  "insightface==2.1",
  "numpy==2.5.4",
  "onnx==1.23.2",
  "onnxruntime==1.31.0",
  "opencv-python-headless==5.0.0.93",
  "pillow==13.0.0",
  "scikit-image==0.26.0",
  "scipy==1.18.1",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
# The managed profile supplies the headless OpenCV distribution and exactly
# one ONNX Runtime distribution; InsightFace 2.1 provides a pure-Python wheel.
exclude-dependencies = [{ package = { name = "insightface", version = "2.1" }, dependencies = ["opencv-python"] }]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
