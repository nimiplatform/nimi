[project]
name = "nimi-managed-python-profile"
version = "0.0.0"
requires-python = "==3.12.15"
dependencies = [
  "av==19.0.2",
  "numpy==2.5.4",
  "onnxruntime==1.31.0",
  "sherpa-onnx==1.13.8",
  "fastapi==0.161.1",
  "uvicorn[standard]==0.54.0",
]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
