[project]
name = "nimi-managed-python-profile"
version = "0.0.0"
requires-python = "==3.12.15"
dependencies = [
  "fastapi==0.161.1",
  "mlx-audio==0.6.1",
  "python-multipart==0.0.32",
  "soundfile==0.14.0",
  "torch==2.14.1",
  "uvicorn[standard]==0.54.0",
]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]
package = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch" }
