[project]
name = "nimi-managed-python-profile"
version = "0.0.0"
requires-python = "==3.12.15"
dependencies = [
  "accelerate==1.15.0",
  "fastapi==0.161.1",
  "imageio-ffmpeg==0.6.0",
  "librosa==1.0.0",
  "nagisa==0.3.0",
  "python-multipart==0.0.32",
  "soundfile==0.14.0",
  "soynlp==0.0.493",
  "torch==2.14.1",
  "transformers==5.20.2",
  "uvicorn[standard]==0.54.0",
]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
package = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch" }
