[project]
name = "nimi-managed-python-profile"
version = "0.0.0"
requires-python = "==3.12.15"
dependencies = [
  "fastapi==0.161.1",
  "Pillow==13.0.0",
  "huggingface-hub==0.36.2",
  "python-multipart==0.0.32",
  "qwen-tts==0.1.1",
  "soundfile==0.14.0",
  "torch==2.14.1",
  "torchaudio==2.11.0",
  "uvicorn[standard]==0.54.0",
]

[tool.uv]
# The model inference path supports the patched 4.57 branch and current Accelerate.
# qwen_tts.cli.demo is not part of this Runtime-owned inference profile.
override-dependencies = ["transformers==4.57.6", "accelerate==1.15.0"]
exclude-dependencies = [{ package = { name = "qwen-tts", version = "0.1.1" }, dependencies = ["gradio"] }]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
package = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }
