[project]
name = "nimi-managed-python-profile"
version = "0.0.0"
requires-python = "==3.12.15"
dependencies = [
  "librosa==1.0.0",
  "llvmlite==0.50.0",
  "numba==0.68.0",
  "numpy==2.5.4",
  "onnxruntime==1.31.0",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "soundfile==0.14.0",
  "soxr==1.1.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
