[project]
name = "nimi-managed-python-profile"
version = "0.0.0"
requires-python = "==3.12.15"
dependencies = ["tensorflow==2.21.0", "numpy==2.5.4", "soundfile==0.14.0"]
[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
