[project]
name = "nimi-managed-python-profile"
version = "0.0.0"
requires-python = "==3.12.13"
dependencies = [
  "fastapi==0.141.1",
  "mlx==0.32.2",
  "mlx-vlm==0.7.0",
  "Pillow==11.1.0",
  "torch==2.11.0",
  "transformers==5.14.0",
  "uvicorn[standard]==0.38.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch" }
