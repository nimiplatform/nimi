[project]
name = "nimi-managed-python-profile"
version = "0.0.0"
requires-python = "==3.12.15"
dependencies = [
  # faster-whisper 1.2.1 uses av.open(metadata_errors=...), removed in PyAV 19.
  "av==18.1.0",
  "ctranslate2==4.8.3",
  "faster-whisper==1.2.1",
  "fastapi==0.161.1",
  # CTranslate2 4.8.3 still links CUDA 12 cuBLAS; Torch's CUDA 13 DLLs cannot substitute.
  "nvidia-cublas-cu12==12.9.2.10",
  "numpy==2.5.4",
  "onnxruntime==1.31.0",
  "python-multipart==0.0.32",
  "silero-vad==6.2.3",
  "torch==2.14.1",
  "torchaudio==2.11.0",
  "uvicorn[standard]==0.54.0",
]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
package = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }
