[project]
name = "nimi-managed-python-profile"
version = "0.0.0"
requires-python = "==3.12.15"
dependencies = [
  "fastapi==0.161.1",
  "pymorphy3==2.0.6",
  "spacy==3.8.16",
  "spacy-pkuseg==1.0.1",
  "sudachidict-core==20261015",
  "sudachipy==0.7.0",
  "uvicorn[standard]==0.54.0",
]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
