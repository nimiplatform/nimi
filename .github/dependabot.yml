version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: UTC
    open-pull-requests-limit: 4
    rebase-strategy: auto
    ignore:
      - dependency-name: "@nimiplatform/sdk"
      - dependency-name: "@nimiplatform/kit"
      - dependency-name: "@nimiplatform/app-tools"
      - dependency-name: "@nimiplatform/kit-protected-local-win32-x64"
      - dependency-name: "@nimiplatform/kit-protected-local-darwin-arm64"
      - dependency-name: "@nimiplatform/nimi-coding"
      # The scaffold analyser uses the Compiler API, absent from TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7"]
      # Match the supported Node 24 runtime instead of adopting Node 25/26 APIs.
      - dependency-name: "@types/node"
        versions: [">=25"]
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      # Nested overlays share Radix focus and dismissable-layer state.
      npm-radix:
        applies-to: version-updates
        patterns:
          - "@radix-ui/*"
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: gomod
    directories:
      - /runtime
      - /nimi-cognition
    schedule:
      interval: weekly
      day: monday
      time: "03:20"
      timezone: UTC
    open-pull-requests-limit: 4
    rebase-strategy: auto
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      gomod-security:
        applies-to: security-updates
        patterns:
          - "*"
      gomod-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      gomod-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:40"
      timezone: UTC
    open-pull-requests-limit: 4
    rebase-strategy: auto
    cooldown:
      default-days: 7
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      github-actions-all:
        applies-to: version-updates
        patterns:
          - "*"
