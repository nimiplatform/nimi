name: bootstrap-kit-windows-native

# One-time first publication. Remove after npm trusted publishing is configured.
on:
  workflow_dispatch:
    inputs:
      provenance_bundle:
        description: Original signed Sigstore bundle from kit/v0.5.0 run 33948666681
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bootstrap-kit-windows-native-0.5.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'nimiplatform/nimi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify original annotated tag remains on main
        run: |
          set -euo pipefail
          test "$(git cat-file -t refs/tags/kit/v0.5.0)" = tag
          test "$(git rev-parse 'refs/tags/kit/v0.5.0^{commit}')" = bd24f96ddaace66bab43529a08ec1c62f23cb02b
          git merge-base --is-ancestor bd24f96ddaace66bab43529a08ec1c62f23cb02b HEAD
      - name: Setup npm runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download original validated Windows native package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '9964187167'
          run-id: '33948666681'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/kit-windows-native
          merge-multiple: true
      - name: Verify original provenance and publish original bytes
        env:
          ORIGINAL_PROVENANCE: ${{ inputs.provenance_bundle }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${ORIGINAL_PROVENANCE}" > "${RUNNER_TEMP}/original-provenance.sigstore.json"
          node scripts/release/bootstrap-kit-windows-native.mjs \
            "${RUNNER_TEMP}/kit-windows-native/nimiplatform-kit-protected-local-win32-x64-0.5.0.tgz" \
            "${RUNNER_TEMP}/original-provenance.sigstore.json" \
            "$(npm root -g)/npm/package.json" --publish
