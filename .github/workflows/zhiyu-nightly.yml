name: zhiyu-nightly

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zhiyu-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zhiyu-live-runtime-scenarios:
    runs-on: ubuntu-latest
    env:
      NIMI_ZHIYU_SCENARIO_REPEAT: '10'
      ZHIYU_EVIDENCE_ROOT: .nimi/local/plan/2026-07-08-zhiyu-voice-emotion-full-auto-test/evidence
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: package.json

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: runtime/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Linux Electron dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pnpm --filter @nimiplatform/zhiyu exec playwright install-deps

      - name: Run Zhiyu live Runtime scenarios
        run: xvfb-run -a pnpm --filter @nimiplatform/zhiyu test:e2e:electron:live-runtime

      - name: Summarize Zhiyu scenario evidence
        if: always()
        run: |
          node <<'NODE' >> "${GITHUB_STEP_SUMMARY}"
          const fs = require('node:fs');
          const path = require('node:path');

          const root = process.env.ZHIYU_EVIDENCE_ROOT;
          const summaryDir = path.join(root, 'scenario-results');
          console.log('## Zhiyu Live Runtime Scenarios');
          if (!fs.existsSync(summaryDir)) {
            console.log('');
            console.log(`No scenario summary directory found at \`${summaryDir}\`.`);
            process.exit(1);
          }

          const rows = fs.readdirSync(summaryDir)
            .filter((file) => file.endsWith('.json'))
            .map((file) => JSON.parse(fs.readFileSync(path.join(summaryDir, file), 'utf8')))
            .sort((a, b) => `${a.group}-${a.id}`.localeCompare(`${b.group}-${b.id}`));

          console.log('');
          console.log('| Row | Repeat | Pass | Fail | Flake rate |');
          console.log('|---|---:|---:|---:|---:|');
          for (const row of rows) {
            console.log(`| ${row.group}-${row.id} | ${row.repeat} | ${row.passCount} | ${row.failCount} | ${row.flakeRate} |`);
          }

          const failing = rows.filter((row) => row.repeat !== 10 || row.passCount !== 10 || row.failCount !== 0 || row.flakeRate !== 0);
          console.log('');
          console.log(`Rows: ${rows.length}; failing rows: ${failing.length}.`);
          if (failing.length > 0) {
            process.exit(1);
          }
          NODE

      - name: Upload Zhiyu scenario evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: zhiyu-live-runtime-scenarios-${{ github.run_id }}
          path: |
            .nimi/local/plan/2026-07-08-zhiyu-voice-emotion-full-auto-test/evidence/scenario
            .nimi/local/plan/2026-07-08-zhiyu-voice-emotion-full-auto-test/evidence/scenario-results
          if-no-files-found: warn
