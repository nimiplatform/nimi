name: deploy-install-gateway

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character main commit to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-install-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify exact main commit
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if ! [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be an exact lowercase 40-character Git SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${COMMIT_SHA}" origin/main

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Go required by the root install contract
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runtime/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test install gateway
        run: pnpm --filter @nimiplatform/install-gateway test

      - name: Build install gateway assets
        run: pnpm --filter @nimiplatform/install-gateway build

      - name: Sync optional GitHub release token secret
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NIMI_GITHUB_RELEASES_TOKEN: ${{ secrets.NIMI_GITHUB_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${NIMI_GITHUB_RELEASES_TOKEN:-}" ]]; then
            cd apps/install-gateway
            printf '%s' "${NIMI_GITHUB_RELEASES_TOKEN}" | pnpm dlx wrangler@4.127.1 secret put NIMI_GITHUB_RELEASES_TOKEN --config wrangler.jsonc
          fi

      - name: Deploy install gateway worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          cd apps/install-gateway
          pnpm dlx wrangler@4.127.1 deploy --config wrangler.jsonc
