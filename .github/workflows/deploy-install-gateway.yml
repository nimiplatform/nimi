name: deploy-install-gateway

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character main commit to deploy
        required: true
        type: string
      product_feeds:
        description: Require the Platform product key before deploying product update feeds
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-install-gateway
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main commit
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if ! [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be an exact lowercase 40-character Git SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${COMMIT_SHA}" origin/main

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false

      - name: Setup Go required by the root install contract
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runtime/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test install gateway
        run: pnpm --filter @nimiplatform/install-gateway test

      - name: Require product feed trust from this exact source
        if: inputs.product_feeds
        run: node -e "import('./scripts/lib/product-release-assets.mjs').then(m => m.requireProductReleaseTrust())"

      - name: Build install gateway assets
        run: pnpm --filter @nimiplatform/install-gateway build

      - name: Prepare pinned bundler without production credentials
        run: npm install --prefix "$RUNNER_TEMP/cloudflare-cli" --no-audit --no-fund --no-package-lock wrangler@4.127.1

      - name: Bundle the Worker and collect its assets
        run: |
          "$RUNNER_TEMP/cloudflare-cli/node_modules/.bin/wrangler" deploy --dry-run --outdir "$RUNNER_TEMP/install-gateway/worker" --config apps/install-gateway/wrangler.jsonc
          cp -R apps/install-gateway/dist/assets "$RUNNER_TEMP/install-gateway/assets"
          cp apps/install-gateway/wrangler.jsonc "$RUNNER_TEMP/install-gateway/source-config.json"

      - name: Upload the built install gateway
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-gateway
          path: ${{ runner.temp }}/install-gateway
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment tooling only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: apps/install-gateway/scripts/prepare-deployment.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - name: Download this run's built install gateway
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/install-gateway
          merge-multiple: true
      - name: Prepare deployment config and pinned CLI without production credentials
        run: |
          node apps/install-gateway/scripts/prepare-deployment.mjs "$RUNNER_TEMP/install-gateway"
          npm install --prefix "$RUNNER_TEMP/cloudflare-cli" --no-audit --no-fund --no-package-lock wrangler@4.127.1

      - name: Sync optional GitHub release token secret
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          NIMI_GITHUB_RELEASES_TOKEN: ${{ secrets.NIMI_GITHUB_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${NIMI_GITHUB_RELEASES_TOKEN:-}" ]]; then
            printf '%s' "${NIMI_GITHUB_RELEASES_TOKEN}" | "$RUNNER_TEMP/cloudflare-cli/node_modules/.bin/wrangler" secret put NIMI_GITHUB_RELEASES_TOKEN --config "$RUNNER_TEMP/install-gateway/wrangler.json"
          fi

      - name: Deploy install gateway worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          SOURCE_SHA: ${{ inputs.commit_sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/install-gateway-version.jsonl
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cloudflare-cli/node_modules/.bin/wrangler" versions upload --config "$RUNNER_TEMP/install-gateway/wrangler.json" --no-bundle --keep-vars --message "Source $SOURCE_SHA"
          VERSION_ID=$(node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const records=fs.readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH,"utf8").trim().split("\n").map(JSON.parse); const version=records.findLast(record=>record.type==="version-upload"); assert.equal(version?.worker_name,"nimi-install-gateway"); assert.match(version.version_id,/^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$/); console.log(version.version_id);')
          "$RUNNER_TEMP/cloudflare-cli/node_modules/.bin/wrangler" versions deploy "$VERSION_ID@100%" --yes --config "$RUNNER_TEMP/install-gateway/wrangler.json" --message "Source $SOURCE_SHA"
          echo "Install gateway source: $SOURCE_SHA; version: $VERSION_ID" >> "$GITHUB_STEP_SUMMARY"
