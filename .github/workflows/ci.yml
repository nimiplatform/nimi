      - name: gate.dev-loop.high-risk-doc-metadata
        run: pnpm check:high-risk-doc-metadata
      - name: gate.docs.examples-build
        run: pnpm check:examples
      - name: gate.docs.examples-run-comments
        run: pnpm check:examples-run-comments
      - name: gate.docs.first-run-doc-drift
        run: pnpm check:first-run-doc-drift
      - name: gate.docs.install-script-smoke
        run: pnpm check:install-script-smoke
      - name: gate.docs.markdown-lint
