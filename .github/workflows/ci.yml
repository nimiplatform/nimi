name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.detect.outputs.docs_changed }}
      core_changed: ${{ steps.detect.outputs.core_changed }}
      shared_changed: ${{ steps.detect.outputs.shared_changed }}
      sdk_changed: ${{ steps.detect.outputs.sdk_changed }}
      runtime_changed: ${{ steps.detect.outputs.runtime_changed }}
      desktop_web_changed: ${{ steps.detect.outputs.desktop_web_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            {
              echo "docs_changed=true"
              echo "core_changed=true"
              echo "shared_changed=true"
              echo "sdk_changed=true"
              echo "runtime_changed=true"
              echo "desktop_web_changed=true"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          base_sha=""
          head_sha=""
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          else
            base_sha="${PUSH_BEFORE_SHA}"
            head_sha="${PUSH_HEAD_SHA}"
            if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
              base_sha="$(git rev-parse "${head_sha}^" 2>/dev/null || echo "${head_sha}")"
            fi
          fi

          git rev-parse --verify "${base_sha}^{commit}" >/dev/null
          git rev-parse --verify "${head_sha}^{commit}" >/dev/null
          git diff --name-only "${base_sha}" "${head_sha}" > /tmp/nimi_changed_files.txt

          docs_changed=false
          core_changed=false
          shared_changed=false
          sdk_changed=false
          runtime_changed=false
          desktop_web_changed=false

          docs_regex='^(docs/|examples/|README\.md$|CHANGELOG\.md$)'
          shared_regex='^(scripts/|package\.json$|pnpm-workspace\.yaml$|pnpm-lock\.yaml$|\.github/workflows/|\.gitignore$|\.editorconfig$)'

          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue

            if [[ "${file}" =~ ${docs_regex} ]]; then
              docs_changed=true
            else
              core_changed=true
            fi

            if [[ "${file}" =~ ${shared_regex} ]]; then
              shared_changed=true
            fi
            if [[ "${file}" =~ ^sdk/ || "${file}" =~ ^sdks/ || "${file}" =~ ^\.nimi/spec/sdks/ ]]; then
              sdk_changed=true
            fi
            if [[ "${file}" =~ ^runtime/ || "${file}" =~ ^proto/ || "${file}" == ".goreleaser.yml" ]]; then
              runtime_changed=true
            fi
            if [[ ( "${file}" =~ ^apps/desktop/ || "${file}" =~ ^apps/web/ ) && ! "${file}" =~ ^apps/(desktop|web)/AGENTS\.md$ ]]; then
              desktop_web_changed=true
            fi
          done < /tmp/nimi_changed_files.txt

          if [[ "${shared_changed}" == "true" ]]; then
            core_changed=true
          fi
          if [[ "${sdk_changed}" == "true" ]]; then
            core_changed=true
            desktop_web_changed=true
          fi

          {
            echo "docs_changed=${docs_changed}"
            echo "core_changed=${core_changed}"
            echo "shared_changed=${shared_changed}"
            echo "sdk_changed=${sdk_changed}"
            echo "runtime_changed=${runtime_changed}"
            echo "desktop_web_changed=${desktop_web_changed}"
          } >> "${GITHUB_OUTPUT}"

  docs-contract:
    needs: changes
    if: needs.changes.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Compile examples
        run: pnpm check:examples

      - name: Build docs portal
        run: pnpm docs:build

      - name: Markdown lint baseline
        run: pnpm check:markdown

      - name: Enforce first-run docs drift contract
        run: pnpm check:first-run-doc-drift

      - name: Enforce no legacy nimid invocation in docs
        run: pnpm check:no-nimid-doc-invocation

      - name: Install script dry-run smoke
        run: pnpm check:install-script-smoke

      - name: Enforce no absolute user-home paths in docs/spec/examples
        run: pnpm check:no-absolute-user-paths

      - name: Enforce no legacy docs contract aliases
        run: pnpm check:no-legacy-doc-contracts

  core-static:
    needs: changes
    if: needs.changes.outputs.core_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: package.json

      - name: Setup Go for workflow lint
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.4'
          cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: gate.dev-loop.high-risk-doc-metadata
        run: pnpm check:high-risk-doc-metadata
      - name: gate.platform-hardcut.no-legacy-imports
        run: pnpm check:no-legacy-imports
      - name: gate.platform-hardcut.no-retired-methodology-refs
        run: pnpm check:no-retired-methodology-refs
      - name: gate.realm.no-app-rest-bypass
        run: pnpm check:no-app-realm-rest-bypass
      - name: gate.workflow.actionlint
        run: pnpm check:actionlint

  workspace-regression:
    needs: changes
    if: needs.changes.outputs.core_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: gate.workflow.workspace-regression
        run: pnpm test

  sdk-quality:
    needs: changes
    if: needs.changes.outputs.sdk_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: package.json

      - name: Setup Go for deterministic Buf
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.4'
          cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install deterministic Buf CLI
        run: go install github.com/bufbuild/buf/cmd/buf@v1.70.0

      - name: Build SDK
        run: pnpm build:sdk

      - name: SDK generator drift check
        run: PATH="${PWD}/node_modules/.bin:${PATH}" pnpm check:sdks-generators

      - name: SDK typed-core conformance check
        run: pnpm check:sdks-conformance-typed-core

      - name: SDK vNext package contract check
        run: pnpm check:sdk-vnext-package-contract

      - name: SDK vNext public surface smoke
        run: pnpm check:sdk-vnext-public-surface-smoke

      - name: SDK vNext Runtime facade check
        run: pnpm check:sdk-vnext-runtime-facade

  runtime-quality:
    needs: changes
    if: needs.changes.outputs.runtime_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: package.json

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.4'
          cache-dependency-path: runtime/go.sum

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Buf CLI
        run: go install github.com/bufbuild/buf/cmd/buf@v1.70.0

      - name: Runtime compliance
        working-directory: runtime
        run: go run ./cmd/runtime-compliance --gate

      - name: Runtime golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.12.2
          working-directory: runtime

  desktop-web-quality:
    needs: changes
    if: needs.changes.outputs.desktop_web_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: package.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb

      - name: Build workspace surfaces for Desktop/Web
        run: pnpm dev:prepare

      - name: Complete Desktop native quality gate
        run: pnpm check:desktop-native-quality

      - name: Lint desktop
        run: pnpm --filter @nimiplatform/desktop lint

      - name: Typecheck desktop
        run: pnpm --filter @nimiplatform/desktop typecheck

      - name: Build web
        run: pnpm --filter @nimiplatform/web build

  zhiyu-quality:
    needs: changes
    if: needs.changes.outputs.core_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck Zhiyu
        run: pnpm --filter @nimiplatform/zhiyu typecheck

  js-contract:
    needs:
      - changes
      - docs-contract
      - core-static
      - workspace-regression
      - sdk-quality
      - runtime-quality
      - desktop-web-quality
      - zhiyu-quality
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate CI status
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_CONTRACT_RESULT: ${{ needs.docs-contract.result }}
          CORE_STATIC_RESULT: ${{ needs.core-static.result }}
          WORKSPACE_REGRESSION_RESULT: ${{ needs.workspace-regression.result }}
          SDK_QUALITY_RESULT: ${{ needs.sdk-quality.result }}
          RUNTIME_QUALITY_RESULT: ${{ needs.runtime-quality.result }}
          DESKTOP_WEB_QUALITY_RESULT: ${{ needs.desktop-web-quality.result }}
          ZHIYU_QUALITY_RESULT: ${{ needs.zhiyu-quality.result }}
        run: |
          set -euo pipefail
          failed=0

          for item in \
            "changes:${CHANGES_RESULT}" \
            "docs-contract:${DOCS_CONTRACT_RESULT}" \
            "core-static:${CORE_STATIC_RESULT}" \
            "workspace-regression:${WORKSPACE_REGRESSION_RESULT}" \
            "sdk-quality:${SDK_QUALITY_RESULT}" \
            "runtime-quality:${RUNTIME_QUALITY_RESULT}" \
            "desktop-web-quality:${DESKTOP_WEB_QUALITY_RESULT}" \
            "zhiyu-quality:${ZHIYU_QUALITY_RESULT}"; do
            name="${item%%:*}"
            result="${item#*:}"
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              echo "${name} failed with result=${result}" >&2
              failed=1
            fi
          done

          if [[ "${failed}" -ne 0 ]]; then
            exit 1
          fi

          echo "CI aggregate passed (all required jobs succeeded or were skipped by path filters)."
