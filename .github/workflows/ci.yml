      - name: gate.platform-hardcut.no-legacy-app-auth-cli
        run: pnpm check:no-legacy-app-auth-cli
      - name: gate.platform-hardcut.no-legacy-cloud-provider-keys
        run: pnpm check:no-legacy-cloud-provider-keys
      - name: gate.platform-hardcut.no-legacy-imports
        run: pnpm check:no-legacy-imports
      - name: gate.platform-hardcut.no-local-ai-private-calls
        run: pnpm check:no-local-ai-private-calls
      - name: gate.platform-hardcut.no-local-ai-tauri-commands
        run: pnpm check:no-local-ai-tauri-commands
      - name: gate.platform-hardcut.no-nimid-doc-invocation
        run: pnpm check:no-nimid-doc-invocation
      - name: gate.platform-hardcut.no-nimid-source
        run: pnpm check:no-nimid-source
      - name: gate.platform-hardcut.no-retired-methodology-refs
        run: pnpm check:no-retired-methodology-refs
      - name: gate.proto.lint
