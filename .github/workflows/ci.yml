name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.detect.outputs.docs_changed }}
      core_changed: ${{ steps.detect.outputs.core_changed }}
      shared_changed: ${{ steps.detect.outputs.shared_changed }}
      sdk_changed: ${{ steps.detect.outputs.sdk_changed }}
      runtime_changed: ${{ steps.detect.outputs.runtime_changed }}
      desktop_web_changed: ${{ steps.detect.outputs.desktop_web_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            {
              echo "docs_changed=true"
              echo "core_changed=true"
              echo "shared_changed=true"
              echo "sdk_changed=true"
              echo "runtime_changed=true"
              echo "desktop_web_changed=true"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          base_sha=""
          head_sha=""
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          else
            base_sha="${PUSH_BEFORE_SHA}"
            head_sha="${PUSH_HEAD_SHA}"
            if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
              base_sha="$(git rev-parse "${head_sha}^" 2>/dev/null || echo "${head_sha}")"
            fi
          fi

          git rev-parse --verify "${base_sha}^{commit}" >/dev/null
          git rev-parse --verify "${head_sha}^{commit}" >/dev/null
          git diff --name-only "${base_sha}" "${head_sha}" > /tmp/nimi_changed_files.txt

          docs_changed=false
          core_changed=false
          shared_changed=false
          sdk_changed=false
          runtime_changed=false
          desktop_web_changed=false

          docs_regex='^(docs/|examples/|README\.md$|CHANGELOG\.md$)'
          shared_regex='^(scripts/|package\.json$|pnpm-workspace\.yaml$|pnpm-lock\.yaml$|\.github/workflows/|\.gitignore$|\.editorconfig$)'

          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue

            if [[ "${file}" =~ ${docs_regex} ]]; then
              docs_changed=true
            else
              core_changed=true
            fi

            if [[ "${file}" =~ ${shared_regex} ]]; then
              shared_changed=true
            fi
            if [[ "${file}" =~ ^sdk/ || "${file}" =~ ^sdks/ || "${file}" =~ ^\.nimi/spec/sdks/ ]]; then
              sdk_changed=true
            fi
            if [[ "${file}" =~ ^runtime/ || "${file}" =~ ^proto/ || "${file}" == ".goreleaser.yml" ]]; then
              runtime_changed=true
            fi
            if [[ ( "${file}" =~ ^apps/desktop/ || "${file}" =~ ^apps/web/ ) && ! "${file}" =~ ^apps/(desktop|web)/AGENTS\.md$ ]]; then
              desktop_web_changed=true
            fi
          done < /tmp/nimi_changed_files.txt

          if [[ "${shared_changed}" == "true" ]]; then
            core_changed=true
          fi
          if [[ "${sdk_changed}" == "true" ]]; then
            core_changed=true
            desktop_web_changed=true
          fi

          {
            echo "docs_changed=${docs_changed}"
            echo "core_changed=${core_changed}"
            echo "shared_changed=${shared_changed}"
            echo "sdk_changed=${sdk_changed}"
            echo "runtime_changed=${runtime_changed}"
            echo "desktop_web_changed=${desktop_web_changed}"
          } >> "${GITHUB_OUTPUT}"

  docs-contract:
    needs: changes
    if: needs.changes.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Linux desktop E2E dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-driver xvfb
          cargo install tauri-driver --locked

      - name: Build SDK surfaces for examples
        run: pnpm build:sdk

      - name: Compile examples
        run: pnpm check:examples

      - name: Build docs portal
        run: pnpm docs:build

      - name: Markdown lint baseline
        run: pnpm check:markdown

      - name: Enforce first-run docs drift contract
        run: pnpm check:first-run-doc-drift

      - name: Enforce no legacy nimid invocation in docs
        run: pnpm check:no-nimid-doc-invocation

      - name: Install script dry-run smoke
        run: pnpm check:install-script-smoke

      - name: Enforce no absolute user-home paths in docs/spec/examples
        run: pnpm check:no-absolute-user-paths

      - name: Enforce no legacy docs contract aliases
        run: pnpm check:no-legacy-doc-contracts

  core-static:
    needs: changes
    if: needs.changes.outputs.core_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # >>> nimi-release-gate-projection: core-static-checks >>>
      - name: gate.desktop.bootstrap-hardcut
        run: pnpm check:desktop-bootstrap-hardcut
      - name: gate.desktop.chat-authority-anti-patterns
        run: pnpm check:desktop-chat-authority-anti-patterns
      - name: gate.desktop.design-contract
        run: pnpm check:desktop-design-contract
      - name: gate.desktop.lint
        run: pnpm --filter @nimiplatform/desktop lint
      - name: gate.desktop.no-client-alias
        run: pnpm check:desktop-no-client-alias
      - name: gate.desktop.no-cloud-runtime
        run: pnpm check:desktop-cloud-runtime-only
      - name: gate.desktop.no-e2e-bypass
        run: pnpm check:desktop-no-e2e-bypass
      - name: gate.desktop.no-legacy-runtime-config-path
        run: pnpm check:desktop-no-legacy-runtime-config-path
      - name: gate.desktop.scroll-shell
