name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.detect.outputs.docs_changed }}
      core_changed: ${{ steps.detect.outputs.core_changed }}
      shared_changed: ${{ steps.detect.outputs.shared_changed }}
      sdk_changed: ${{ steps.detect.outputs.sdk_changed }}
      sdk_adapter_upstream_changed: ${{ steps.detect.outputs.sdk_adapter_upstream_changed }}
      sdk_conformance_changed: ${{ steps.detect.outputs.sdk_conformance_changed }}
      proto_changed: ${{ steps.detect.outputs.proto_changed }}
      runtime_changed: ${{ steps.detect.outputs.runtime_changed }}
      desktop_web_changed: ${{ steps.detect.outputs.desktop_web_changed }}
      kit_native_changed: ${{ steps.detect.outputs.kit_native_changed }}
      lab_native_changed: ${{ steps.detect.outputs.lab_native_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            {
              echo "docs_changed=true"
              echo "core_changed=true"
              echo "shared_changed=true"
              echo "sdk_changed=true"
              echo "sdk_adapter_upstream_changed=true"
              echo "sdk_conformance_changed=true"
              echo "proto_changed=true"
              echo "runtime_changed=true"
              echo "desktop_web_changed=true"
              echo "kit_native_changed=true"
              echo "lab_native_changed=true"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          base_sha=""
          head_sha=""
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          else
            base_sha="${PUSH_BEFORE_SHA}"
            head_sha="${PUSH_HEAD_SHA}"
            if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
              base_sha="$(git rev-parse "${head_sha}^" 2>/dev/null || echo "${head_sha}")"
            fi
          fi

          git rev-parse --verify "${base_sha}^{commit}" >/dev/null
          git rev-parse --verify "${head_sha}^{commit}" >/dev/null
          git diff --name-only "${base_sha}" "${head_sha}" > /tmp/nimi_changed_files.txt

          docs_changed=false
          core_changed=false
          shared_changed=false
          sdk_changed=false
          sdk_adapter_upstream_changed=false
          sdk_conformance_changed=false
          proto_changed=false
          runtime_changed=false
          desktop_web_changed=false
          kit_native_changed=false
          lab_native_changed=false

          docs_regex='^(docs/|examples/|README\.md$|CHANGELOG\.md$)'
          shared_regex='^(scripts/|package\.json$|pnpm-workspace\.yaml$|pnpm-lock\.yaml$|\.github/workflows/|\.gitignore$|\.editorconfig$)'
          native_ci_regex='^(package\.json$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)'

          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue

            if [[ "${file}" =~ ${docs_regex} ]]; then
              docs_changed=true
            else
              core_changed=true
            fi

            if [[ "${file}" =~ ${shared_regex} ]]; then
              shared_changed=true
            fi
            if [[ "${file}" =~ ^sdk/ || "${file}" =~ ^sdks/ || "${file}" =~ ^\.nimi/spec/sdks/ ]]; then
              sdk_changed=true
            fi
            if [[ "${file}" =~ ^sdks/typescript/ ||
                  "${file}" == "pnpm-lock.yaml" ]]; then
              sdk_adapter_upstream_changed=true
            fi
            if [[ "${file}" =~ ^sdks/conformance/ ||
                  "${file}" =~ ^sdks/generators/ ||
                  "${file}" =~ ^proto/ ||
                  "${file}" =~ ^config/realm-openapi ||
                  "${file}" == "config/sdks-error-codes.yaml" ||
                  "${file}" == "config/sdks-realm-private-operation-carriers.yaml" ||
                  "${file}" =~ ^config/runtime-rpc-auth-posture ||
                  "${file}" == "scripts/lib/read-yaml-with-fragments.mjs" ||
                  "${file}" =~ ^\.nimi/spec/sdks/ ]]; then
              sdk_conformance_changed=true
            fi
            if [[ "${file}" =~ ^proto/ ||
                  "${file}" =~ ^runtime/gen/ ||
                  "${file}" =~ ^runtime/proto/ ||
                  "${file}" == "package.json" ||
                  "${file}" == "pnpm-lock.yaml" ||
                  "${file}" == "scripts/proto-breaking.mjs" ||
                  "${file}" == "scripts/check-proto-drift.mjs" ||
                  "${file}" =~ ^scripts/run-buf ]]; then
              proto_changed=true
            fi
            if [[ "${file}" =~ ^runtime/ ||
                  "${file}" =~ ^nimi-cognition/ ||
                  "${file}" =~ ^proto/ ||
                  "${file}" == "go.work" ||
                  "${file}" == "go.work.sum" ||
                  "${file}" == ".goreleaser.yml" ]]; then
              runtime_changed=true
            fi
            if [[ ( "${file}" =~ ^apps/desktop/ || "${file}" =~ ^apps/web/ ) && ! "${file}" =~ ^apps/(desktop|web)/AGENTS\.md$ ]]; then
              desktop_web_changed=true
            fi
            if [[ "${file}" =~ ^kit/shell/(capabilities|protected-local|protected-local-node|tauri)/ ]]; then
              kit_native_changed=true
              lab_native_changed=true
            fi
            if [[ "${file}" =~ ^apps/lab/src-tauri/ ]]; then
              lab_native_changed=true
            fi
            if [[ "${file}" =~ ${native_ci_regex} ]]; then
              kit_native_changed=true
              lab_native_changed=true
            fi
          done < /tmp/nimi_changed_files.txt

          if [[ "${shared_changed}" == "true" ]]; then
            core_changed=true
          fi
          if [[ "${sdk_changed}" == "true" ]]; then
            core_changed=true
            desktop_web_changed=true
          fi
          if [[ "${sdk_conformance_changed}" == "true" ]]; then
            sdk_changed=true
            core_changed=true
            desktop_web_changed=true
          fi
          if [[ "${sdk_adapter_upstream_changed}" == "true" ]]; then
            sdk_changed=true
            core_changed=true
          fi

          {
            echo "docs_changed=${docs_changed}"
            echo "core_changed=${core_changed}"
            echo "shared_changed=${shared_changed}"
            echo "sdk_changed=${sdk_changed}"
            echo "sdk_adapter_upstream_changed=${sdk_adapter_upstream_changed}"
            echo "sdk_conformance_changed=${sdk_conformance_changed}"
            echo "proto_changed=${proto_changed}"
            echo "runtime_changed=${runtime_changed}"
            echo "desktop_web_changed=${desktop_web_changed}"
            echo "kit_native_changed=${kit_native_changed}"
            echo "lab_native_changed=${lab_native_changed}"
          } >> "${GITHUB_OUTPUT}"

  docs-contract:
    needs: changes
    if: needs.changes.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile examples
        run: pnpm check:examples

      - name: Build docs portal
        run: pnpm docs:build

      - name: Markdown lint baseline
        run: pnpm check:markdown

      - name: Install script dry-run smoke
        run: pnpm check:install-script-smoke

      - name: Enforce no absolute user-home paths in docs and examples
        run: pnpm check:no-absolute-user-paths

  core-static:
    needs: changes
    if: needs.changes.outputs.core_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go for workflow lint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runtime/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux native dependencies for Kit contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: gate.runtime.bridge-method-projection
        run: pnpm check:runtime-bridge-method-drift
      - name: gate.runtime.realm-broker-policy
        run: pnpm check:runtime-broker-operation-policy
      - name: gate.realm.no-app-rest-bypass
        run: pnpm check:no-app-realm-rest-bypass
      - name: Build SDK for Kit contracts
        run: pnpm build:sdk
      - name: Check Kit contracts
        run: pnpm check:nimi-kit
      - name: Check license file map
        run: pnpm check:license-file-map
      - name: Audit SDK and Kit package contents
        run: pnpm check:sdk-kit-pack-audit
      - name: gate.workflow.actionlint
        run: pnpm check:actionlint
      - name: authority.canonical.check
        run: pnpm spec:authority:check
      - name: authority.configured-audit
        run: pnpm spec:authority:audit

  workspace-regression:
    needs: changes
    if: needs.changes.outputs.core_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Workspace owner tests
        run: pnpm test:workspace:full

      - name: Build renderer surfaces for bundle budgets
        run: |
          pnpm dev:prepare
          pnpm --filter @nimiplatform/desktop build:renderer
          pnpm --filter @nimiplatform/web build
          pnpm --filter @nimiplatform/lab build:prepared

      - name: Enforce renderer bundle budgets
        run: pnpm check:bundle-size

  kit-native-tests:
    needs: changes
    if: needs.changes.outputs.kit_native_changed == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # v1
        with:
          toolchain: stable

      - name: Test Kit native crates on the supported Windows host
        run: pnpm test:kit:native

  lab-native-tests:
    needs: changes
    if: needs.changes.outputs.lab_native_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # v1
        with:
          toolchain: stable

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Test Nimi Lab native crate
        run: pnpm test:lab:native

  sdk-quality:
    needs: changes
    if: needs.changes.outputs.sdk_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go for deterministic Buf
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runtime/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install deterministic Buf CLI
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.70.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Build SDK
        run: pnpm build:sdk

      - name: SDK generator drift check
        run: PATH="${PWD}/node_modules/.bin:${PATH}" pnpm check:sdks-generators

      - name: SDK typed-core conformance check
        if: needs.changes.outputs.sdk_conformance_changed == 'true'
        run: pnpm check:sdks-conformance-typed-core

      - name: SDK adapter upstream compatibility
        if: needs.changes.outputs.sdk_adapter_upstream_changed == 'true'
        run: pnpm test:sdks-adapters:upstream

      - name: SDK vNext public surface smoke
        run: pnpm check:sdk-vnext-public-surface-smoke

  runtime-quality:
    needs: changes
    if: needs.changes.outputs.runtime_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: |
            runtime/go.sum
            nimi-cognition/go.sum

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Buf CLI
        run: go install github.com/bufbuild/buf/cmd/buf@v1.70.0

      - name: Runtime tests
        run: pnpm test:runtime:go && pnpm test:runtime:python

      - name: Runtime vet and build
        working-directory: runtime
        run: go vet ./... && go build ./...

      - name: Runtime golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: runtime

      - name: Cognition golangci-lint
        run: pnpm check:cognition-golangci-lint

  proto-quality:
    needs: changes
    if: needs.changes.outputs.proto_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go for deterministic Buf
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runtime/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install deterministic Buf CLI
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.70.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Proto breaking-change gate
        run: pnpm proto:breaking

      - name: Proto generated drift gate
        run: pnpm proto:drift-check

      - name: Proto lint gate
        run: pnpm proto:lint

  desktop-web-quality:
    needs: changes
    if: needs.changes.outputs.desktop_web_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # v1
        with:
          toolchain: stable
          components: clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace surfaces for Desktop/Web
        run: pnpm dev:prepare

      - name: Complete Desktop Electron native quality gate
        run: pnpm check:desktop-native-quality

      - name: Lint and build Desktop Electron
        run: pnpm --filter @nimiplatform/desktop lint && pnpm --filter @nimiplatform/desktop build

      - name: Build web
        run: pnpm --filter @nimiplatform/web build

  zhiyu-quality:
    needs: changes
    if: needs.changes.outputs.core_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Zhiyu
        run: pnpm --filter @nimiplatform/zhiyu typecheck

  ci-required:
    name: ci-required
    if: always()
    needs:
      - changes
      - docs-contract
      - core-static
      - workspace-regression
      - kit-native-tests
      - lab-native-tests
      - sdk-quality
      - runtime-quality
      - proto-quality
      - desktop-web-quality
      - zhiyu-quality
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected CI lane to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failed = Object.entries(needs)
            .filter(([, value]) => !['success', 'skipped'].includes(value.result))
            .map(([name, value]) => `${name}=${value.result}`);
          if (failed.length > 0) {
            throw new Error(`required CI lanes did not pass: ${failed.join(', ')}`);
          }
          NODE
