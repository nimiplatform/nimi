name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      comparison_base_sha: ${{ steps.detect.outputs.comparison_base_sha }}
      changed_files_base_sha: ${{ steps.detect.outputs.changed_files_base_sha }}
      docs_changed: ${{ steps.detect.outputs.docs_changed }}
      remote_clients_changed: ${{ steps.detect.outputs.remote_clients_changed }}
      core_changed: ${{ steps.detect.outputs.core_changed }}
      workspace_changed: ${{ steps.detect.outputs.workspace_changed }}
      workspace_filters: ${{ steps.detect.outputs.workspace_filters }}
      scripts_changed: ${{ steps.detect.outputs.scripts_changed }}
      authority_changed: ${{ steps.detect.outputs.authority_changed }}
      kit_changed: ${{ steps.detect.outputs.kit_changed }}
      sdk_changed: ${{ steps.detect.outputs.sdk_changed }}
      sdk_adapter_upstream_changed: ${{ steps.detect.outputs.sdk_adapter_upstream_changed }}
      sdk_conformance_changed: ${{ steps.detect.outputs.sdk_conformance_changed }}
      proto_changed: ${{ steps.detect.outputs.proto_changed }}
      runtime_changed: ${{ steps.detect.outputs.runtime_changed }}
      cognition_changed: ${{ steps.detect.outputs.cognition_changed }}
      desktop_changed: ${{ steps.detect.outputs.desktop_changed }}
      kit_native_changed: ${{ steps.detect.outputs.kit_native_changed }}
      native_runtime_changed: ${{ steps.detect.outputs.native_runtime_changed }}
      macos_carrier_changed: ${{ steps.detect.outputs.macos_carrier_changed }}
      macos_host_changed: ${{ steps.detect.outputs.macos_host_changed }}
      web_changed: ${{ steps.detect.outputs.web_changed }}
      macos_updater_changed: ${{ steps.detect.outputs.macos_updater_changed }}
      windows_runtime_changed: ${{ steps.detect.outputs.windows_runtime_changed }}
      windows_app_tools_changed: ${{ steps.detect.outputs.windows_app_tools_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - name: Detect changed paths
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/detect-ci-scope.mjs

  main-security:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml
    with:
      source_sha: ${{ github.sha }}

  deploy-web:
    needs: [changes, main-security]
    if: github.event_name == 'push' && needs.changes.outputs.web_changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-web.yml
    with:
      security_sha: ${{ needs.main-security.outputs.verified_sha }}
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}

  docs-contract:
    needs: changes
    if: needs.changes.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate documentation sources and review candidates
        env:
          DOCS_BASE_SHA: ${{ needs.changes.outputs.changed_files_base_sha }}
        run: pnpm check:docs-source --changed-from "$DOCS_BASE_SHA"

      - name: Test documentation source checks
        run: node --test scripts/docs-source.test.mjs scripts/ci-scope.test.mjs

      - name: Compile and test examples
        run: pnpm --filter @nimiplatform/examples run test

      - name: Check remote website reference
        if: needs.changes.outputs.remote_clients_changed == 'true'
        run: pnpm check:examples:remote

      - name: Check Android session contracts and consumer types
        if: needs.changes.outputs.remote_clients_changed == 'true'
        run: |
          pnpm --filter @nimiplatform/kit exec vitest run --config ui/vitest.config.ts core/test/app-session.test.ts auth/test/mobile-app-session.test.ts
          pnpm --filter @nimiplatform/zhiyu typecheck

      - name: Prepare isolated React Native peer reference
        if: needs.changes.outputs.remote_clients_changed == 'true'
        id: mobile-reference
        run: node scripts/prepare-docs-mobile-reference.mjs

      - name: Install isolated React Native dependencies
        if: needs.changes.outputs.remote_clients_changed == 'true'
        env:
          MOBILE_REFERENCE_DIR: ${{ steps.mobile-reference.outputs.directory }}
        run: pnpm --dir "$MOBILE_REFERENCE_DIR" install --no-frozen-lockfile

      - name: Typecheck React Native peer reference
        if: needs.changes.outputs.remote_clients_changed == 'true'
        env:
          MOBILE_REFERENCE_DIR: ${{ steps.mobile-reference.outputs.directory }}
        run: pnpm --dir "$MOBILE_REFERENCE_DIR" check

      - name: Build docs portal
        run: pnpm docs:build

      - name: Markdown lint baseline
        run: pnpm check:markdown

      - name: Install script dry-run smoke
        run: pnpm check:install-script-smoke

      - name: Enforce no absolute user-home paths in docs and examples
        run: pnpm check:no-absolute-user-paths

  core-static:
    needs: changes
    if: needs.changes.outputs.core_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go for workflow lint
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: runtime/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: gate.runtime.realm-broker-policy
        run: pnpm check:runtime-broker-operation-policy
      - name: gate.realm.no-app-rest-bypass
        run: pnpm check:no-app-realm-rest-bypass
      - name: gate.app.identity-surfaces
        run: pnpm check:app-identity-surfaces
      - name: gate.product.no-desktop-as-user-facing-name
        run: pnpm check:no-desktop-as-user-facing-name
      - name: gate.ui.glass-boundary
        run: pnpm check:ui-glass-boundary
      - name: Check Kit contracts
        if: needs.changes.outputs.kit_changed == 'true'
        run: pnpm check:nimi-kit
      - name: Check text-only repository gates
        if: needs.changes.outputs.scripts_changed == 'true' && needs.changes.outputs.workspace_changed != 'true'
        run: pnpm check:text-encoding
      - name: Check license file map
        run: pnpm check:license-file-map
      - name: gate.workflow.actionlint
        run: pnpm check:actionlint
      - name: authority.canonical.check
        if: needs.changes.outputs.authority_changed == 'true'
        run: pnpm spec:authority:check
      - name: authority.history-review
        if: needs.changes.outputs.authority_changed == 'true'
        env:
          AUTHORITY_BASE_SHA: ${{ needs.changes.outputs.comparison_base_sha }}
        run: pnpm spec:authority:review --base "$AUTHORITY_BASE_SHA"

  workspace-regression:
    needs: changes
    if: needs.changes.outputs.workspace_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and build selected workspace consumers
        env:
          WORKSPACE_FILTERS: ${{ needs.changes.outputs.workspace_filters }}
          SCRIPTS_CHANGED: ${{ needs.changes.outputs.scripts_changed }}
        run: node scripts/run-workspace-checks.mjs

  kit-native-tests:
    needs: changes
    if: needs.changes.outputs.kit_native_changed == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1

      - name: Test Kit native crates on the supported Windows host
        run: pnpm test:kit:native

      - name: Install Kit smoke test dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the Win32 Job Object and NTFS guards through Electron Kit
        run: >-
          node scripts/with-workspace-surfaces.mjs -- pnpm --filter @nimiplatform/kit exec
          vitest run --config ui/vitest.config.ts shell/electron/test/agent-session-protected-smoke.test.ts

  windows-runtime-tests:
    needs: changes
    if: needs.changes.outputs.windows_runtime_changed == 'true' || needs.changes.outputs.windows_app_tools_changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        if: needs.changes.outputs.windows_app_tools_changed == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3

      - name: Setup Go
        if: needs.changes.outputs.windows_runtime_changed == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: |
            runtime/go.sum
            nimi-cognition/go.sum

      - name: Build and vet Runtime for Windows
        if: needs.changes.outputs.windows_runtime_changed == 'true'
        working-directory: runtime
        run: |
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...

      - name: Test Windows-specific Runtime owners
        if: needs.changes.outputs.windows_runtime_changed == 'true'
        working-directory: runtime
        run: |
          go test -count=1 -timeout=15m ./cmd/nimi ./cmd/nimi-source-supervisor ./internal/appstorage ./internal/daemon ./internal/daemonctl ./internal/engine ./internal/entrypoint ./internal/nimiappinstall ./internal/nimiappnative ./internal/nimiapppackage ./internal/productrelease ./internal/protectedlocal ./internal/services/app ./internal/services/localservice ./internal/videomedia ./tools/local-model-recovery ./tools/repair-local-agent-chat ./tools/windows-product-updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 -timeout=10m -tags=nimi_windows_source_local_development ./internal/protectedlocal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 -timeout=10m ./internal/grpcserver -run 'Test(ResolveWindowsProfileImagePath|ProtectedProductControlRootReadsCurrentWindowsProfileMapping)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 -timeout=10m ./internal/services/ai -run 'TestScenarioJob(PersistenceRecoversFromTransientWindowsReader|PersistenceFailsClosedForPersistentWindowsReader|AppendFailsClosedForReaderDenyingWrites|ReplacementPreservesOtherFileErrors)'

      - name: Test Windows Runtime installer and acceptance scripts
        if: needs.changes.outputs.windows_runtime_changed == 'true'
        run: node --test scripts/windows-runtime-service-installer-contract.test.mjs scripts/accept-runtime-fixed-service.test.mjs

      - name: Install dependencies for App Tools
        if: needs.changes.outputs.windows_app_tools_changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Test App Tools on Windows
        if: needs.changes.outputs.windows_app_tools_changed == 'true'
        run: pnpm --filter @nimiplatform/app-tools test

  macos-updater-build:
    needs: changes
    if: needs.changes.outputs.macos_updater_changed == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - name: Compile the product updater for Apple Silicon
        run: |
          node apps/desktop/scripts/build-macos-product-updater.mjs
          /usr/bin/lipo '.nimi/local/macos-product-updater/Nimi Product Updater' -verify_arch arm64

  macos-platform-tests:
    needs: changes
    if: needs.changes.outputs.native_runtime_changed == 'true' || needs.changes.outputs.macos_carrier_changed == 'true' || needs.changes.outputs.macos_host_changed == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3

      - name: Setup Go
        if: needs.changes.outputs.native_runtime_changed == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: runtime/go.sum

      - name: Setup Rust
        if: needs.changes.outputs.macos_carrier_changed == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1

      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64

      - name: Install Electron host test dependencies
        if: needs.changes.outputs.macos_host_changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check Darwin Runtime and model storage
        if: needs.changes.outputs.native_runtime_changed == 'true'
        run: |
          go -C runtime test -count=1 -timeout=10m ./cmd/nimi-source-supervisor ./internal/appstorage ./internal/daemon ./internal/entrypoint ./internal/localappkernel ./internal/managedimagebackend ./internal/nimiappinstall ./internal/nimiappnative ./internal/nimiapppackage ./internal/protectedlocal ./internal/services/app ./internal/services/localservice
          go -C runtime test -count=1 -timeout=10m -tags=nimi_macos_source_local_development ./internal/entrypoint ./internal/protectedlocal ./internal/services/app
          go -C runtime test -count=1 -timeout=5m -tags=nimi_macos_local_development ./internal/protectedlocal
          go -C runtime test -count=1 -timeout=5m -tags=nimi_macos_local_development ./internal/grpcserver -run 'TestFixedDevelopmentControlLocatorUsesVerifiedUsersSeparateDirectory'

      - name: Check default and source native carriers
        if: needs.changes.outputs.macos_carrier_changed == 'true'
        run: |
          cargo test --locked --manifest-path kit/shell/protected-local/Cargo.toml
          cargo test --locked --manifest-path kit/shell/protected-local-node/Cargo.toml
          cargo test --locked --manifest-path kit/shell/protected-local/Cargo.toml --features macos-source-local-development
          cargo test --locked --manifest-path kit/shell/protected-local-node/Cargo.toml --features macos-source-local-development
          cargo build --locked --manifest-path kit/shell/protected-local-node/Cargo.toml --features macos-source-local-development
          node kit/shell/protected-local-node/test/native-input-contract.cjs

      - name: Check source launch and diagnostics
        if: needs.changes.outputs.macos_host_changed == 'true'
        run: node --test scripts/dev-runtime.test.mjs scripts/lib/dev-app-launch.test.mjs scripts/doctor-dev.test.mjs

      - name: Check local audio capture and streaming
        if: needs.changes.outputs.native_runtime_changed == 'true'
        run: go -C runtime test -count=1 -timeout=5m ./internal/capabilitydriver ./internal/nimillm ./internal/engine ./internal/services/ai -run 'Test(DemucsOwned|AudioSeparation|NativeSeparation|SeparationArtifacts|HTDemucs)'

      - name: Check supervised Python audio Host
        if: needs.changes.outputs.native_runtime_changed == 'true'
        working-directory: runtime/internal/engine/assets
        run: python3 -m unittest speech_server_test

      - name: Test macOS Electron host behavior
        if: needs.changes.outputs.macos_host_changed == 'true'
        run: |
          node scripts/with-workspace-surfaces.mjs -- pnpm --filter @nimiplatform/desktop test:unit:rest -- electron-desktop-open-intent-host.test.ts electron-support-logs-host.test.ts electron-system-resources-host.test.ts macos-local-app-host-contract.test.ts macos-release-policy.test.mjs
          pnpm --filter @nimiplatform/kit exec vitest run --config ui/vitest.config.ts shell/electron/test/protected-local-binding-loader.test.ts

  sdk-quality:
    needs: changes
    if: needs.changes.outputs.sdk_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go for deterministic Buf
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: runtime/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install deterministic Buf CLI
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.75.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Build SDK and check public surface
        run: pnpm check:sdk-vnext-public-surface-smoke

      - name: SDK generator drift check
        run: PATH="${PWD}/node_modules/.bin:${PATH}" pnpm check:sdks-generators

      - name: gate.sdk.platform-catalog-drift
        run: pnpm check:platform-catalog-drift

      - name: SDK typed-core conformance check
        if: needs.changes.outputs.sdk_conformance_changed == 'true'
        run: pnpm check:sdks-conformance-typed-core

      - name: SDK adapter upstream compatibility
        if: needs.changes.outputs.sdk_adapter_upstream_changed == 'true'
        run: pnpm test:sdks-adapters:upstream

  runtime-quality:
    needs: changes
    if: needs.changes.outputs.runtime_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: |
            runtime/go.sum
            nimi-cognition/go.sum

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Buf CLI
        run: go install github.com/bufbuild/buf/cmd/buf@v1.75.0

      - name: gate.runtime.import-boundary
        run: pnpm check:runtime-import-boundary

      - name: gate.runtime.catalog-drift
        run: pnpm check:runtime-catalog-drift

      - name: gate.runtime.managed-image-backend-package-drift
        run: pnpm check:managed-image-backend-package-drift

      - name: Runtime tests
        # Match the documented development test environment; no model weights.
        run: python -m pip install --requirement runtime/test-requirements.txt && pnpm test:runtime:go && pnpm test:runtime:python

      - name: Runtime race detector tests
        working-directory: runtime
        run: go test -race -count=1 -timeout=10m ./internal/services/account ./internal/services/app ./internal/auditlog ./internal/nimillm ./internal/services/localservice ./internal/engine ./internal/remoteaccess

      - name: Runtime vet and build
        working-directory: runtime
        run: go vet ./... && go build ./...

      - name: Runtime golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: runtime

      - name: Cognition tests and lint
        if: needs.changes.outputs.cognition_changed == 'true'
        run: pnpm --filter @nimiplatform/cognition test && go -C nimi-cognition test -race -count=1 ./... && pnpm check:cognition-golangci-lint

  proto-quality:
    needs: changes
    if: needs.changes.outputs.proto_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go for deterministic Buf
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: runtime/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install deterministic Buf CLI
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.75.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Fetch the published wire baseline source
        run: |
          set -euo pipefail
          source_tag="$(node scripts/proto-breaking.mjs --source-tag)"
          git fetch --no-tags --depth=1 origin "+refs/tags/${source_tag}:refs/tags/${source_tag}"

      - name: Proto breaking-change gate tests
        env:
          NIMI_PROTO_GATE_REQUIRE_BUF: '1'
        run: node --test scripts/proto-breaking.test.mjs

      - name: Proto breaking-change gate
        run: pnpm proto:breaking

      - name: Proto generated drift gate
        run: pnpm proto:drift-check

      - name: Proto lint gate
        run: pnpm proto:lint

  desktop-web-quality:
    needs: changes
    if: needs.changes.outputs.desktop_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Desktop Electron
        run: pnpm --filter @nimiplatform/desktop lint

  ci-required:
    name: ci-required
    if: always()
    needs:
      - changes
      - docs-contract
      - core-static
      - workspace-regression
      - kit-native-tests
      - windows-runtime-tests
      - macos-platform-tests
      - macos-updater-build
      - sdk-quality
      - runtime-quality
      - proto-quality
      - desktop-web-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI selection policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every selected CI lane to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          import { assertCiResults } from './scripts/lib/ci-scope.mjs';
          assertCiResults(JSON.parse(process.env.NEEDS_JSON));
          NODE
