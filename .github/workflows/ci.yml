      - name: gate.docs.no-absolute-user-paths
        run: pnpm check:no-absolute-user-paths
      - name: gate.docs.no-legacy-doc-contracts
        run: pnpm check:no-legacy-doc-contracts
      - name: gate.docs.release-promise-public-copy
