name: Deploy official Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'kit/**'
      - 'sdks/typescript/**'
      - 'config/**'
      - 'runtime/catalog/providers/**'
      - 'scripts/lib/workspace-surfaces.mjs'
      - 'scripts/with-workspace-surfaces.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact main SHA to build and deploy (empty uses this workflow commit)
        type: string
        default: ''
      publish:
        description: Publish after preview verification (false builds and verifies preview only)
        type: boolean
        default: true
      rollback_deployment_id:
        description: Previous successful production deployment UUID; skips build and deploy
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-official-web
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NIMI_REALM_URL: https://realm.nimi.ai
      VITE_NIMI_REALM_ENVIRONMENT_ID: production
      VITE_NIMI_RUNTIME_MANAGER_CLIENT_ID: nimiplatform.runtime-manager.web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source
        env:
          SOURCE_SHA: ${{ inputs.commit_sha || github.sha }}
          ROLLBACK_ID: ${{ inputs.rollback_deployment_id }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          if [[ -n "$ROLLBACK_ID" ]]; then test -z "$REQUESTED_SHA"; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - name: Roll back an existing production deployment
        if: inputs.rollback_deployment_id != ''
        env:
          ROLLBACK_ID: ${{ inputs.rollback_deployment_id }}
        run: node apps/web/scripts/cloudflare-release.mjs rollback "$ROLLBACK_ID"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.rollback_deployment_id == ''
        with:
          version: 10.34.7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.rollback_deployment_id == ''
        with:
          go-version-file: runtime/go.mod
          cache: false
      - name: Install, test and build
        if: inputs.rollback_deployment_id == ''
        run: |
          pnpm install --frozen-lockfile
          node scripts/with-workspace-surfaces.mjs -- pnpm --filter @nimiplatform/web exec sh -c 'pnpm test && pnpm build'
      - name: Deploy and verify preview
        if: inputs.rollback_deployment_id == ''
        env:
          SOURCE_SHA: ${{ inputs.commit_sha || github.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/web-preview.jsonl
        run: |
          pnpm dlx wrangler@4.127.1 pages deploy apps/web/dist --project-name nimi --branch "release-${SOURCE_SHA:0:12}" --commit-hash "$SOURCE_SHA" --commit-dirty=false
          node apps/web/scripts/cloudflare-release.mjs deployment "$WRANGLER_OUTPUT_FILE_PATH"
      - name: Deploy the same build to production
        if: inputs.rollback_deployment_id == '' && (github.event_name == 'push' || inputs.publish)
        env:
          SOURCE_SHA: ${{ inputs.commit_sha || github.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/web-production.jsonl
        run: |
          pnpm dlx wrangler@4.127.1 pages deploy apps/web/dist --project-name nimi --branch main --commit-hash "$SOURCE_SHA" --commit-dirty=false
          node apps/web/scripts/cloudflare-release.mjs deployment "$WRANGLER_OUTPUT_FILE_PATH"
          node apps/web/scripts/cloudflare-release.mjs verify https://nimi.ai
      - name: Record deployment result
        if: always()
        run: |
          echo 'Cloudflare Pages project: nimi (nimi-6jb.pages.dev)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Official portal, account and manager: https://nimi.ai' >> "$GITHUB_STEP_SUMMARY"
          for result in "$RUNNER_TEMP"/web-*.jsonl; do
            if [[ -f "$result" ]]; then
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$result" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
