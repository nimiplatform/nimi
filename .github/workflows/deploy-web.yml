name: Deploy official Web

on:
  workflow_call:
    inputs:
      security_sha:
        description: Source verified by the calling main push security job
        required: true
        type: string
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_PAGES_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact main SHA to build and deploy (empty uses this workflow commit)
        type: string
        default: ''
      publish:
        description: Publish after preview verification (false builds and verifies preview only)
        type: boolean
        default: true
      rollback_deployment_id:
        description: Previous successful production deployment UUID; skips build and deploy
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    if: inputs.rollback_deployment_id == ''
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      source_sha: ${{ steps.source.outputs.sha }}
      current: ${{ steps.current.outputs.current }}
    env:
      NIMI_REALM_URL: https://realm.nimi.ai
      VITE_NIMI_REALM_ENVIRONMENT_ID: production
      VITE_NIMI_RUNTIME_MANAGER_CLIENT_ID: nimiplatform.runtime-manager.web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source
        id: source
        env:
          SOURCE_SHA: ${{ inputs.commit_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runtime/go.mod
          cache: false
      - name: Install, test and build
        run: |
          pnpm install --frozen-lockfile
          node scripts/with-workspace-surfaces.mjs -- pnpm --filter @nimiplatform/web exec sh -c 'pnpm test && pnpm build'
      - name: Upload the built Web
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: official-web
          path: |
            apps/web/dist
            !apps/web/dist/**/*.map
          if-no-files-found: error
          retention-days: 7
      - name: Discard superseded automatic builds before queuing a deployment
        id: current
        if: github.event_name == 'push'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SECURITY_SHA: ${{ inputs.security_sha }}
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          node scripts/release/web-promotion.mjs

  manual-security:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.rollback_deployment_id == ''
    needs: build
    uses: ./.github/workflows/security.yml
    with:
      source_sha: ${{ needs.build.outputs.source_sha }}

  deploy:
    needs: [build, manual-security]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (github.event_name != 'push' || needs.build.outputs.current == 'true') &&
      (needs.manual-security.result == 'success' || needs.manual-security.result == 'skipped')
    concurrency:
      group: deploy-official-web
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            apps/web/scripts/cloudflare-release.mjs
            scripts/release/web-promotion.mjs
            scripts/lib/ci-scope.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - name: Download this run's built Web
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/web-dist
          merge-multiple: true
      - name: Prepare pinned deployment CLI without production credentials
        run: npm install --prefix "$RUNNER_TEMP/cloudflare-cli" --no-audit --no-fund --no-package-lock wrangler@4.127.1
      - name: Deploy and verify preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/web-preview.jsonl
        run: |
          "$RUNNER_TEMP/cloudflare-cli/node_modules/.bin/wrangler" pages deploy "$RUNNER_TEMP/web-dist" --project-name nimi --branch "release-${SOURCE_SHA:0:12}" --commit-hash "$SOURCE_SHA" --commit-dirty=false --no-bundle
          node apps/web/scripts/cloudflare-release.mjs deployment "$WRANGLER_OUTPUT_FILE_PATH" "$RUNNER_TEMP/web-dist"
      - name: Admit the verified source for production
        id: admission
        if: github.event_name == 'push' || inputs.publish
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          SECURITY_SHA: ${{ inputs.security_sha || needs.manual-security.outputs.verified_sha }}
        run: node scripts/release/web-promotion.mjs
      - name: Deploy the same build to production
        if: steps.admission.outputs.current == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/web-production.jsonl
        run: |
          "$RUNNER_TEMP/cloudflare-cli/node_modules/.bin/wrangler" pages deploy "$RUNNER_TEMP/web-dist" --project-name nimi --branch main --commit-hash "$SOURCE_SHA" --commit-dirty=false --no-bundle
          node apps/web/scripts/cloudflare-release.mjs deployment "$WRANGLER_OUTPUT_FILE_PATH" "$RUNNER_TEMP/web-dist"
          node apps/web/scripts/cloudflare-release.mjs verify https://nimi.ai "$RUNNER_TEMP/web-dist"
      - name: Record deployment result
        if: always()
        run: |
          {
            echo 'Cloudflare Pages project: nimi (nimi-6jb.pages.dev)'
            echo 'Official portal, account and manager: https://nimi.ai'
            for result in "$RUNNER_TEMP"/web-*.jsonl; do
              if [[ -f "$result" ]]; then
                echo '```json'
                cat "$result"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  rollback:
    if: inputs.rollback_deployment_id != ''
    concurrency:
      group: deploy-official-web
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: apps/web/scripts/cloudflare-release.mjs
          sparse-checkout-cone-mode: false
      - name: Verify rollback workflow source
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          test -z "$REQUESTED_SHA"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - name: Roll back an existing production deployment
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          ROLLBACK_ID: ${{ inputs.rollback_deployment_id }}
        run: node apps/web/scripts/cloudflare-release.mjs rollback "$ROLLBACK_ID"
