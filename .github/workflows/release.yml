name: release

on:
  push:
    tags:
      - sdk/v*
      - proto/v*
      - desktop/v*
  workflow_dispatch:
    inputs:
      target:
        description: Release target
        required: true
        type: choice
        options:
          - sdk
          - proto
          - desktop
      version:
        description: Semver version (for example 0.1.0 or v0.1.0)
        required: true
        type: string
      publish:
        description: Publish to external registry/release (false = dry-run)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      version: ${{ steps.resolve.outputs.version }}
      version_plain: ${{ steps.resolve.outputs.version_plain }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Resolve release target/version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          semver_regex='^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'

          if [[ "${EVENT_NAME}" == "push" ]]; then
            tag="${REF_NAME}"
            case "${tag}" in
              sdk/v*|proto/v*|desktop/v*)
                target="${tag%%/*}"
                version="${tag#*/}"
                publish="true"
                ;;
              *)
                echo "unsupported tag format: ${tag}" >&2
                exit 1
                ;;
            esac
          else
            target="${INPUT_TARGET}"
            version="${INPUT_VERSION}"
            if [[ "${version}" != v* ]]; then
              version="v${version}"
            fi
            tag="${target}/${version}"
            publish="${INPUT_PUBLISH}"
          fi

          if ! [[ "${version}" =~ ${semver_regex} ]]; then
            echo "invalid semver version: ${version}" >&2
            exit 1
          fi

          version_plain="${version#v}"

          {
            echo "target=${target}"
            echo "version=${version}"
            echo "version_plain=${version_plain}"
            echo "tag=${tag}"
            echo "publish=${publish}"
          } >> "${GITHUB_OUTPUT}"

  live-smoke-gate:
    needs: resolve
    if: needs.resolve.outputs.target == 'desktop'
    runs-on: ubuntu-latest
    env:
      NIMI_LIVE_GEMINI_API_KEY: ${{ secrets.NIMI_LIVE_GEMINI_API_KEY }}
      NIMI_LIVE_GEMINI_MODEL_ID: ${{ vars.NIMI_LIVE_GEMINI_MODEL_ID || 'gemini-3-flash-preview' }}
      NIMI_LIVE_DASHSCOPE_BASE_URL: ${{ vars.NIMI_LIVE_DASHSCOPE_BASE_URL || 'https://dashscope.aliyuncs.com/compatible-mode/v1' }}
      NIMI_LIVE_DASHSCOPE_API_KEY: ${{ secrets.NIMI_LIVE_DASHSCOPE_API_KEY }}
      NIMI_LIVE_DASHSCOPE_MODEL_ID: ${{ vars.NIMI_LIVE_DASHSCOPE_MODEL_ID || 'qwen3-max' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.4'
          cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: gate.live.live2d-companion-timeline-acceptance
        run: pnpm check:live2d-companion-timeline-acceptance
      - name: gate.live.provider-invariants
        run: pnpm check:live-provider-invariants
      - name: gate.live.test-matrix
        run: node scripts/run-live-test-matrix.mjs
      - name: gate.live.smoke-gate
        run: pnpm check:live-smoke-gate --require-release

      - name: Upload live smoke coverage
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: live-test-coverage-${{ needs.resolve.outputs.target }}-${{ needs.resolve.outputs.version }}
          path: .local/report/live-test-coverage.yaml
          if-no-files-found: error

  release-sdk:
    needs: resolve
    if: needs.resolve.outputs.target == 'sdk'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version_plain }}
      PUBLISH: ${{ needs.resolve.outputs.publish }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify SDK package version and metadata
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const pkg = JSON.parse(readFileSync('sdks/typescript/package.json', 'utf8'));
          const expectedVersion = process.env.RELEASE_VERSION;
          if (pkg.name !== '@nimiplatform/sdk') {
            throw new Error(`unexpected SDK package name: ${pkg.name}`);
          }
          if (pkg.version !== expectedVersion) {
            throw new Error(`sdks/typescript/package.json version ${pkg.version} does not match release ${expectedVersion}`);
          }
          if (pkg.private !== false) {
            throw new Error('@nimiplatform/sdk must remain public');
          }
          if (pkg.publishConfig?.access !== 'public') {
            throw new Error('@nimiplatform/sdk publishConfig.access must be public');
          }
          if (pkg.publishConfig?.provenance !== true) {
            throw new Error('@nimiplatform/sdk publishConfig.provenance must be true');
          }
          if (pkg.repository?.url !== 'https://github.com/nimiplatform/nimi') {
            throw new Error('@nimiplatform/sdk repository.url must match provenance repository');
          }
          if (pkg.repository?.directory !== 'sdks/typescript') {
            throw new Error('@nimiplatform/sdk repository.directory must be sdks/typescript');
          }
          NODE

      - name: gate.desktop.open-intent-contract
        run: pnpm check:desktop-open-contract
      - name: gate.sdk.consumer-smoke
        run: pnpm check:sdk-consumer-smoke
      - name: gate.sdk.coverage
        run: pnpm check:sdk-coverage
      - name: gate.sdk.release-contracts
        run: pnpm check:sdk-release-contracts
      - name: gate.sdk.version-matrix
        run: pnpm check:sdk-version-matrix
      - name: gate.security.package-license-matrix
        run: pnpm check:package-license-matrix

      - name: Check duplicate SDK npm version
        run: |
          set -euo pipefail
          if npm view "@nimiplatform/sdk@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            if [[ "${PUBLISH}" == "true" ]]; then
              echo "@nimiplatform/sdk@${RELEASE_VERSION} already exists on npm" >&2
              exit 1
            fi
            echo "@nimiplatform/sdk@${RELEASE_VERSION} already exists on npm; dry-run mode will not publish"
          else
            echo "@nimiplatform/sdk@${RELEASE_VERSION} is not published on npm"
          fi

      - name: SDK npm publish dry-run
        run: pnpm --filter @nimiplatform/sdk publish --access public --no-git-checks --dry-run

      - name: Publish SDK to npm
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          if [[ -z "${NPM_TOKEN:-}" ]]; then
            echo "NPM_TOKEN is required for SDK publish" >&2
            exit 1
          fi
          npm_config="${NPM_CONFIG_USERCONFIG:-${HOME}/.npmrc}"
          mkdir -p "$(dirname "${npm_config}")"
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "${npm_config}"
          export NODE_AUTH_TOKEN="${NPM_TOKEN}"
          pnpm --filter @nimiplatform/sdk publish --access public --no-git-checks --provenance

  release-proto:
    needs: resolve
    if: needs.resolve.outputs.target == 'proto'
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ needs.resolve.outputs.publish }}
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.4'
          cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Buf CLI
        run: go install github.com/bufbuild/buf/cmd/buf@v1.70.0

      - name: gate.proto.baseline-exists
        run: test -s runtime/proto/runtime-v1.baseline.binpb
      - name: gate.proto.breaking
        run: pnpm proto:breaking
      - name: gate.proto.drift-check
        run: pnpm proto:drift-check
      - name: gate.proto.generate
        run: pnpm proto:generate
      - name: gate.proto.lint
        run: pnpm proto:lint

      - name: Push proto module (or dry-run)
        run: |
          set -euo pipefail
          BUF_BIN="$(go env GOPATH)/bin/buf"
          if [[ "${PUBLISH}" == "true" ]]; then
            if [[ -z "${BUF_TOKEN:-}" ]]; then
              echo "BUF_TOKEN is required for proto push" >&2
              exit 1
            fi
            "${BUF_BIN}" push proto
          else
            "${BUF_BIN}" build proto -o /tmp/runtime-v1.binpb
          fi

  release-desktop:
    needs:
      - resolve
      - live-smoke-gate
    if: needs.resolve.outputs.target == 'desktop'
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            extra_args: "appimage"
          - platform: macos-latest
            extra_args: "app"
          - platform: windows-2025-vs2026
            extra_args: "nsis"
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version_plain }}
      PUBLISH: ${{ needs.resolve.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Checkout locked Realm source for first-party product gates
        if: matrix.platform == 'windows-2025-vs2026'
        shell: pwsh
        env:
          REALM_AUTHORITY_REPOSITORY: ${{ secrets.REALM_AUTHORITY_REPOSITORY }}
        run: |
          $commitLine = Get-Content config/realm-contract-lock.yaml | Where-Object { $_ -match '^\s+commit:\s+' } | Select-Object -First 1
          $realmCommit = ($commitLine -split ':', 2)[1].Trim()
          if ($realmCommit -notmatch '^[0-9a-f]{40}$') { throw 'realm contract lock commit is invalid' }
          if ([string]::IsNullOrWhiteSpace($env:REALM_AUTHORITY_REPOSITORY)) { throw 'Realm authority repository secret is required' }
          $realmRoot = Join-Path $env:RUNNER_TEMP 'first-party-realm'
          git clone --filter=blob:none $env:REALM_AUTHORITY_REPOSITORY $realmRoot
          if ($LASTEXITCODE -ne 0) { throw 'Realm clone failed' }
          git -C $realmRoot checkout --detach $realmCommit
          if ($LASTEXITCODE -ne 0) { throw 'Realm locked checkout failed' }
          "REALM_ROOT=$realmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: gate.realm.contract-lock-verify
        if: matrix.platform == 'windows-2025-vs2026'
        shell: pwsh
        run: pnpm check:realm-contract-lock -- --realm-root $env:REALM_ROOT

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Go (for supply chain tooling)
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: runtime/go.mod
          cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build SDK surfaces (desktop runtime dependency)
        run: pnpm build:sdk

      - name: Start and verify local Realm and Nimi Web for product gates
        if: matrix.platform == 'windows-2025-vs2026'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:REALM_ROOT)) { throw 'REALM_ROOT is required' }
          pnpm --dir $env:REALM_ROOT install --no-frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Realm dependency installation failed' }
          $pnpm = (Get-Command pnpm.cmd -ErrorAction Stop).Source
          $logRoot = Join-Path $env:RUNNER_TEMP 'first-party-local-topology'
          New-Item -ItemType Directory -Path $logRoot -Force | Out-Null
          $env:PORT = '3002'
          $env:NIMI_REALM_URL = 'http://localhost:3002'
          $env:NIMI_WEB_URL = 'http://localhost:3000'
          $realm = Start-Process -FilePath $pnpm -ArgumentList @('--dir', $env:REALM_ROOT, 'dev:api') -WorkingDirectory $env:REALM_ROOT -WindowStyle Hidden -PassThru -RedirectStandardOutput (Join-Path $logRoot 'realm.stdout.log') -RedirectStandardError (Join-Path $logRoot 'realm.stderr.log')
          $web = Start-Process -FilePath $pnpm -ArgumentList @('dev:web', '--', '--host', '127.0.0.1', '--port', '3000') -WorkingDirectory $env:GITHUB_WORKSPACE -WindowStyle Hidden -PassThru -RedirectStandardOutput (Join-Path $logRoot 'web.stdout.log') -RedirectStandardError (Join-Path $logRoot 'web.stderr.log')
          $ready = $false
          for ($attempt = 0; $attempt -lt 180; $attempt += 1) {
            if ($realm.HasExited) { throw "Realm lifecycle command exited before readiness; inspect $logRoot" }
            if ($web.HasExited) { throw "Web lifecycle command exited before readiness; inspect $logRoot" }
            try {
              $jwks = Invoke-RestMethod -Uri 'http://localhost:3002/api/auth/jwks' -Method Get -TimeoutSec 2
              $webResponse = Invoke-WebRequest -UseBasicParsing -Uri 'http://localhost:3000/' -Method Get -TimeoutSec 2
              if (@($jwks.keys).Count -gt 0 -and [int]$webResponse.StatusCode -eq 200) { $ready = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw "local Realm/Web topology did not become healthy; inspect $logRoot" }
          "P4_REALM_LIFECYCLE_PID=$($realm.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "P4_WEB_LIFECYCLE_PID=$($web.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: gate.desktop.macos-dev-security-native
        if: matrix.platform == 'macos-latest'
        run: pnpm test:macos:dev-security-native

      - name: Desktop Product Control native smoke (lower-level only)
        if: matrix.platform == 'windows-2025-vs2026'
        run: pnpm --filter @nimiplatform/desktop test:windows:product-control-native

      - name: Provision ephemeral Windows development trust
        if: matrix.platform == 'windows-2025-vs2026'
        run: pnpm provision:windows-dev-trust

      - name: gate.desktop.first-party-product-p4
        if: matrix.platform == 'windows-2025-vs2026'
        env:
          NIMI_FIRST_PARTY_ACCOUNT_EMAIL: ${{ secrets.NIMI_FIRST_PARTY_ACCOUNT_EMAIL }}
          NIMI_FIRST_PARTY_ACCOUNT_PASSWORD: ${{ secrets.NIMI_FIRST_PARTY_ACCOUNT_PASSWORD }}
          NIMI_FIRST_PARTY_DIRECT_PROMPT: ${{ vars.NIMI_FIRST_PARTY_DIRECT_PROMPT }}
          NIMI_FIRST_PARTY_CANCEL_PROMPT: ${{ vars.NIMI_FIRST_PARTY_CANCEL_PROMPT }}
          NIMI_FIRST_PARTY_TIMEOUT_PROMPT: ${{ vars.NIMI_FIRST_PARTY_TIMEOUT_PROMPT }}
          NIMI_FIRST_PARTY_UNAVAILABLE_PROMPT: ${{ vars.NIMI_FIRST_PARTY_UNAVAILABLE_PROMPT }}
          NIMI_FIRST_PARTY_LOCAL_ROUTE_TESTID: ${{ vars.NIMI_FIRST_PARTY_LOCAL_ROUTE_TESTID }}
          NIMI_FIRST_PARTY_UNAVAILABLE_ROUTE_TESTID: ${{ vars.NIMI_FIRST_PARTY_UNAVAILABLE_ROUTE_TESTID }}
          NIMI_FIRST_PARTY_REALM_SOURCE_ID: ${{ vars.NIMI_FIRST_PARTY_REALM_SOURCE_ID }}
          NIMI_FIRST_PARTY_PARTNER_PROMPT: ${{ vars.NIMI_FIRST_PARTY_PARTNER_PROMPT }}
        run: |
          pnpm test:e2e:first-party-product:p4

      - name: Install supply chain tooling (cosign + syft)
        run: |
          set -euo pipefail
          GOBIN="$(go env GOPATH)/bin"
          echo "${GOBIN}" >> "${GITHUB_PATH}"
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.2
          go install github.com/anchore/syft/cmd/syft@v1.42.2

      - name: Resolve macOS signing mode
        id: macos_signing
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [[ "${MATRIX_PLATFORM}" != 'macos-latest' ]]; then
            mode='not-applicable'
            require_apple='false'
          else
            mode='developer-id'
            require_apple='true'
          fi

          {
            echo "mode=${mode}"
            echo "require_apple_credentials=${require_apple}"
          } >> "${GITHUB_OUTPUT}"

      - name: Normalize desktop updater public key
        env:
          NIMI_DESKTOP_UPDATER_PUBLIC_KEY: ${{ vars.NIMI_DESKTOP_UPDATER_PUBLIC_KEY }}
        run: node apps/desktop/scripts/normalize-updater-public-key.mjs --write-github-env

      - name: Write desktop updater Tauri config
        env:
          NIMI_DESKTOP_UPDATER_ENDPOINT: ${{ vars.NIMI_DESKTOP_UPDATER_ENDPOINT }}
        run: |
          node apps/desktop/scripts/write-updater-tauri-config.mjs \
            --output apps/desktop/src-tauri/target/ci-updater.conf.json

      - name: Validate desktop signing inputs
        run: |
          set -euo pipefail
          if [[ -z "${NIMI_DESKTOP_UPDATER_PUBLIC_KEY:-}" ]]; then
            echo "NIMI_DESKTOP_UPDATER_PUBLIC_KEY is required" >&2
            exit 1
          fi
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required" >&2
            exit 1
          fi
          if [[ "${REQUIRE_APPLE_CREDENTIALS}" == 'true' ]]; then
            if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
              echo "APPLE_CERTIFICATE is required for developer-id macOS signing" >&2
              exit 1
            fi
            if [[ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]]; then
              echo "APPLE_CERTIFICATE_PASSWORD is required for developer-id macOS signing" >&2
              exit 1
            fi
            if [[ -z "${APPLE_SIGNING_IDENTITY:-}" ]]; then
              echo "APPLE_SIGNING_IDENTITY is required for developer-id macOS signing" >&2
              exit 1
            fi
            if [[ -z "${APPLE_ID:-}" ]]; then
              echo "APPLE_ID is required for developer-id macOS notarization" >&2
              exit 1
            fi
            if [[ -z "${APPLE_PASSWORD:-}" ]]; then
              echo "APPLE_PASSWORD is required for developer-id macOS notarization" >&2
              exit 1
            fi
            if [[ -z "${APPLE_TEAM_ID:-}" ]]; then
              echo "APPLE_TEAM_ID is required for developer-id macOS notarization" >&2
              exit 1
            fi
          fi
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          REQUIRE_APPLE_CREDENTIALS: ${{ steps.macos_signing.outputs.require_apple_credentials }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Prepare Desktop release metadata
        run: |
          pnpm --filter @nimiplatform/desktop run prepare:desktop-release -- \
            --version "${RELEASE_VERSION}" \
            --channel stable \
            --commit "${GITHUB_SHA}"

      # Release-only pre-bundle consistency gates must run before tauri-action can publish assets.
      - name: gate.desktop.release-sync
        run: pnpm --filter @nimiplatform/desktop run check:desktop-release-sync -- --expected "${RELEASE_VERSION}"
      - name: gate.desktop.version-sync
        run: pnpm --filter @nimiplatform/desktop run check:version-sync -- --expected "${RELEASE_VERSION}"

      - name: Build desktop artifacts (non-macOS)
        id: tauri_build_non_macos
        if: matrix.platform != 'macos-latest'
        uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # action-v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIMI_DESKTOP_UPDATER_ENDPOINT: ${{ vars.NIMI_DESKTOP_UPDATER_ENDPOINT }}
          NIMI_DESKTOP_MACOS_SIGNING_MODE: ${{ steps.macos_signing.outputs.mode }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.resolve.outputs.publish == 'true' && needs.resolve.outputs.tag || '' }}
          releaseName: ${{ needs.resolve.outputs.publish == 'true' && format('Desktop {0}', needs.resolve.outputs.version) || '' }}
          releaseBody: ${{ needs.resolve.outputs.publish == 'true' && 'Automated desktop bundle built by release workflow.' || '' }}
          releaseDraft: false
          prerelease: ${{ contains(needs.resolve.outputs.version, '-') }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.conf.json --config src-tauri/target/ci-updater.conf.json --bundles ${{ matrix.extra_args }} --ci

      - name: Build desktop artifacts (macOS Developer ID)
        id: tauri_build_macos_developer_id
        if: matrix.platform == 'macos-latest' && steps.macos_signing.outputs.require_apple_credentials == 'true'
        uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # action-v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIMI_DESKTOP_UPDATER_ENDPOINT: ${{ vars.NIMI_DESKTOP_UPDATER_ENDPOINT }}
          NIMI_DESKTOP_MACOS_SIGNING_MODE: ${{ steps.macos_signing.outputs.mode }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.resolve.outputs.publish == 'true' && needs.resolve.outputs.tag || '' }}
          releaseName: ${{ needs.resolve.outputs.publish == 'true' && format('Desktop {0}', needs.resolve.outputs.version) || '' }}
          releaseBody: ${{ needs.resolve.outputs.publish == 'true' && 'Automated desktop bundle built by release workflow.' || '' }}
          releaseDraft: false
          prerelease: ${{ contains(needs.resolve.outputs.version, '-') }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.conf.json --config src-tauri/target/ci-updater.conf.json --bundles ${{ matrix.extra_args }} --ci

      - name: Resolve desktop artifact paths
        id: tauri_build
        env:
          ARTIFACT_PATHS_NON_MACOS: ${{ steps.tauri_build_non_macos.outputs.artifactPaths }}
          ARTIFACT_PATHS_MACOS_DEVELOPER_ID: ${{ steps.tauri_build_macos_developer_id.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          artifact_paths="${ARTIFACT_PATHS_NON_MACOS:-${ARTIFACT_PATHS_MACOS_DEVELOPER_ID:-}}"
          if [[ -z "${artifact_paths}" ]]; then
            echo "tauri-action did not report artifact paths" >&2
            exit 1
          fi
          {
            echo 'artifactPaths<<__NIMI_ARTIFACT_PATHS__'
            printf '%s\n' "${artifact_paths}"
            echo '__NIMI_ARTIFACT_PATHS__'
          } >> "${GITHUB_OUTPUT}"

      - name: Project desktop release gate environment
        env:
          NIMI_ARTIFACT_PATHS_JSON: ${{ steps.tauri_build.outputs.artifactPaths }}
          NIMI_SIGN_IDENTITY_REGEX: https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*
          NIMI_SIGN_OUTPUT_MANIFEST: apps/desktop/signing-manifest-${{ matrix.platform }}.json
          NIMI_EXPECTED_BUNDLE: ${{ matrix.extra_args }}
        run: |
          set -euo pipefail
          {
            echo 'NIMI_ARTIFACT_PATHS_JSON<<__NIMI_ARTIFACT_PATHS_JSON__'
            printf '%s\n' "${NIMI_ARTIFACT_PATHS_JSON}"
            echo '__NIMI_ARTIFACT_PATHS_JSON__'
            echo "NIMI_SIGN_IDENTITY_REGEX=${NIMI_SIGN_IDENTITY_REGEX}"
            echo "NIMI_SIGN_OUTPUT_MANIFEST=${NIMI_SIGN_OUTPUT_MANIFEST}"
            echo "NIMI_EXPECTED_BUNDLE=${NIMI_EXPECTED_BUNDLE}"
          } >> "${GITHUB_ENV}"

      - name: gate.desktop.updater-artifacts
        run: pnpm --filter @nimiplatform/desktop run check:desktop-updater-artifacts
      - name: gate.security.runtime-release-signing
        run: pnpm check:runtime-release-signing

      - name: Collect desktop supply chain outputs
        id: desktop_supply_chain
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const outputPath = process.env.GITHUB_OUTPUT;
          if (!outputPath) {
            throw new Error('GITHUB_OUTPUT is required');
          }
          const artifacts = JSON.parse(process.env.NIMI_ARTIFACT_PATHS_JSON || '[]');
          const generated = JSON.parse(fs.readFileSync(process.env.NIMI_SIGN_OUTPUT_MANIFEST, 'utf8'));
          const generatedBundle = [...generated, process.env.NIMI_SIGN_OUTPUT_MANIFEST];
          const combined = [...artifacts, ...generatedBundle];
          fs.appendFileSync(outputPath, `generated_files_json=${JSON.stringify(generatedBundle)}\n`);
          fs.appendFileSync(outputPath, `all_files_json=${JSON.stringify(combined)}\n`);
          NODE

      - name: Upload signed desktop assets to GitHub release
        if: needs.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          FILES_JSON: ${{ steps.desktop_supply_chain.outputs.generated_files_json }}
        run: |
          set -euo pipefail
          mapfile -t release_files < <(node <<'NODE'
          const files = JSON.parse(process.env.FILES_JSON || '[]');
          for (const filePath of files) {
            process.stdout.write(`${filePath}\n`);
          }
          NODE
          )
          gh release upload "${RELEASE_TAG}" "${release_files[@]}" --clobber

      - name: Upload desktop artifacts (workflow_dispatch dry-run)
        if: needs.resolve.outputs.publish != 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: desktop-${{ matrix.platform }}-${{ needs.resolve.outputs.version }}
          path: ${{ join(fromJSON(steps.desktop_supply_chain.outputs.all_files_json), '\n') }}
          if-no-files-found: error
