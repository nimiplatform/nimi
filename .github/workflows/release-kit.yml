name: release-kit

on:
  push:
    tags:
      - kit/v*
  workflow_dispatch:
    inputs:
      version:
        description: Semver version already present in kit/package.json, for example 0.1.0 or v0.1.0
        required: true
        type: string
      publish:
        description: Publish @nimiplatform/kit to npm. false runs the dry-run release gate only.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-kit-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_plain: ${{ steps.resolve.outputs.version_plain }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Resolve kit release version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          semver_regex='^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'

          if [[ "${EVENT_NAME}" == "push" ]]; then
            case "${REF_NAME}" in
              kit/v*)
                version="${REF_NAME#kit/}"
                publish="true"
                ;;
              *)
                echo "unsupported kit tag format: ${REF_NAME}" >&2
                exit 1
                ;;
            esac
          else
            version="${INPUT_VERSION}"
            if [[ "${version}" != v* ]]; then
              version="v${version}"
            fi
            publish="${INPUT_PUBLISH}"
          fi

          if ! [[ "${version}" =~ ${semver_regex} ]]; then
            echo "invalid semver version: ${version}" >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "version_plain=${version#v}"
            echo "publish=${publish}"
          } >> "${GITHUB_OUTPUT}"

  native-windows-x64:
    needs: resolve
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version_plain }}
      PUBLISH: ${{ needs.resolve.outputs.publish }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Verify native package version and metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content 'kit/shell/protected-local-node/npm/win32-x64/package.json' -Raw | ConvertFrom-Json
          if ($pkg.name -ne '@nimiplatform/kit-protected-local-win32-x64') {
            throw "unexpected native package name: $($pkg.name)"
          }
          if ($pkg.version -ne $env:RELEASE_VERSION) {
            throw "native package version $($pkg.version) does not match release $env:RELEASE_VERSION"
          }
          if ($pkg.os.Count -ne 1 -or $pkg.os[0] -ne 'win32') {
            throw 'native package must be restricted to win32'
          }
          if ($pkg.cpu.Count -ne 1 -or $pkg.cpu[0] -ne 'x64') {
            throw 'native package must be restricted to x64'
          }
          if ($pkg.publishConfig.access -ne 'public' -or $pkg.publishConfig.provenance -ne $true) {
            throw 'native package must retain public provenance publication metadata'
          }

      - name: Test and build native carrier
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --manifest-path kit/shell/protected-local-node/Cargo.toml --locked
          node kit/shell/protected-local-node/scripts/build-windows-x64-package.mjs

      - name: Smoke test native exports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          const binding = require('./kit/shell/protected-local-node/npm/win32-x64');
          const keys = Object.keys(binding).sort();
          const expected = ['openInstalledAppSession', 'readInstalledArtifactBytes'];
          if (JSON.stringify(keys) !== JSON.stringify(expected)) {
            throw new Error(`unexpected native exports: ${keys.join(',')}`);
          }
          (async () => {
            const readOutcome = await binding.readInstalledArtifactBytes('artifact-without-session');
            if (readOutcome.status !== 'error'
              || readOutcome.reasonCode !== 'installed-artifact-forbidden'
              || readOutcome.retryable !== false) {
              throw new Error(`native read did not fail closed: ${JSON.stringify(readOutcome)}`);
            }
            const openOutcome = await binding.openInstalledAppSession();
            const admittedOpenReasons = new Set([
              'protected-carrier-required',
              'runtime-service-unavailable',
              'runtime-service-untrusted',
              'runtime-service-repair-required',
            ]);
            if (openOutcome.status !== 'error'
              || !admittedOpenReasons.has(openOutcome.reasonCode)
              || typeof openOutcome.retryable !== 'boolean') {
              throw new Error(`ordinary release runner unexpectedly opened an installed session: ${JSON.stringify(openOutcome)}`);
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          '@ | node -

      - name: Check duplicate native package version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm view "@nimiplatform/kit-protected-local-win32-x64@$env:RELEASE_VERSION" version *> $null
          if ($LASTEXITCODE -eq 0) {
            if ($env:PUBLISH -eq 'true') {
              throw "native package $env:RELEASE_VERSION already exists on npm"
            }
            Write-Output "native package $env:RELEASE_VERSION already exists; dry-run will not publish"
          } else {
            Write-Output "native package $env:RELEASE_VERSION is not published on npm"
          }

      - name: Native npm publish dry-run
        if: needs.resolve.outputs.publish != 'true'
        shell: pwsh
        run: npm publish kit/shell/protected-local-node/npm/win32-x64 --access public --dry-run

      - name: Publish native package
        if: needs.resolve.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:NODE_AUTH_TOKEN)) {
            throw 'NPM_TOKEN is required for native package publish'
          }
          npm publish kit/shell/protected-local-node/npm/win32-x64 --access public --provenance

  release:
    needs: [resolve, native-windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version_plain }}
      PUBLISH: ${{ needs.resolve.outputs.publish }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify kit package version and metadata
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const pkg = JSON.parse(readFileSync('kit/package.json', 'utf8'));
          const sdkPkg = JSON.parse(readFileSync('sdks/typescript/package.json', 'utf8'));
          const expectedVersion = process.env.RELEASE_VERSION;
          const expectedSdkDependency = `^${sdkPkg.version}`;
          if (pkg.name !== '@nimiplatform/kit') {
            throw new Error(`unexpected kit package name: ${pkg.name}`);
          }
          if (pkg.version !== expectedVersion) {
            throw new Error(`kit/package.json version ${pkg.version} does not match release ${expectedVersion}`);
          }
          if (pkg.private !== false) {
            throw new Error('@nimiplatform/kit must remain public');
          }
          if (pkg.publishConfig?.access !== 'public') {
            throw new Error('@nimiplatform/kit publishConfig.access must be public');
          }
          if (pkg.publishConfig?.provenance !== true) {
            throw new Error('@nimiplatform/kit publishConfig.provenance must be true');
          }
          if (pkg.repository?.url !== 'https://github.com/nimiplatform/nimi') {
            throw new Error('@nimiplatform/kit repository.url must match provenance repository');
          }
          if (pkg.repository?.directory !== 'kit') {
            throw new Error('@nimiplatform/kit repository.directory must be kit');
          }
          if (!Array.isArray(pkg.files) || !pkg.files.includes('README.md')) {
            throw new Error('@nimiplatform/kit package files must include README.md');
          }
          const sdkDependency = pkg.dependencies?.['@nimiplatform/sdk'];
          if (typeof sdkDependency !== 'string') {
            throw new Error('@nimiplatform/kit must declare @nimiplatform/sdk in dependencies');
          }
          if (sdkDependency === 'workspace:*') {
            throw new Error('@nimiplatform/kit must not use a wildcard workspace @nimiplatform/sdk dependency');
          }
          const normalizedSdkDependency = sdkDependency.startsWith('workspace:')
            ? sdkDependency.slice('workspace:'.length)
            : sdkDependency;
          if (!/^\^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(normalizedSdkDependency)) {
            throw new Error(`@nimiplatform/kit SDK dependency ${sdkDependency} is not a publishable caret semver range`);
          }
          if (normalizedSdkDependency !== expectedSdkDependency) {
            throw new Error(`@nimiplatform/kit SDK dependency ${sdkDependency} does not match published SDK ${expectedSdkDependency}`);
          }
          if (pkg.optionalDependencies?.['@nimiplatform/kit-protected-local-win32-x64'] !== 'workspace:*') {
            throw new Error('@nimiplatform/kit must consume the fixed Windows x64 protected-local optional package');
          }
          NODE

      - name: Build SDK for local workspace resolution
        run: pnpm --filter @nimiplatform/sdk build

      - name: Build kit
        run: pnpm --filter @nimiplatform/kit build

      - name: Check kit dist package
        run: node scripts/check-kit-package-dist.mjs

      - name: Test kit
        run: pnpm --filter @nimiplatform/kit test && pnpm --filter @nimiplatform/kit test:full

      - name: Check duplicate kit npm version
        run: |
          set -euo pipefail
          if npm view "@nimiplatform/kit@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            if [[ "${PUBLISH}" == "true" ]]; then
              echo "@nimiplatform/kit@${RELEASE_VERSION} already exists on npm" >&2
              exit 1
            fi
            echo "@nimiplatform/kit@${RELEASE_VERSION} already exists on npm; dry-run mode will not publish"
          else
            echo "@nimiplatform/kit@${RELEASE_VERSION} is not published on npm"
          fi

      - name: Kit npm publish dry-run
        run: pnpm --filter @nimiplatform/kit publish --access public --no-git-checks --dry-run

      - name: Publish kit to npm
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          if [[ -z "${NPM_TOKEN:-}" ]]; then
            echo "NPM_TOKEN is required for @nimiplatform/kit publish" >&2
            exit 1
          fi
          npm_config="${NPM_CONFIG_USERCONFIG:-${HOME}/.npmrc}"
          mkdir -p "$(dirname "${npm_config}")"
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "${npm_config}"
          export NODE_AUTH_TOKEN="${NPM_TOKEN}"
          pnpm --filter @nimiplatform/kit publish --access public --no-git-checks --provenance
