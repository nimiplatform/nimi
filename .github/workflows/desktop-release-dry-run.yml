name: desktop-release-dry-run

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional semver version override (for example 0.1.0 or v0.1.0)
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/desktop-release-dry-run.yml
      - .github/workflows/release.yml
      - apps/desktop/**
      - runtime/**
      - sdk/**
      - scripts/release/**
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: desktop-release-dry-run-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_plain: ${{ steps.resolve.outputs.version_plain }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve desktop dry-run version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [[ -z "${version}" ]]; then
            version="$(node -p "JSON.parse(require('node:fs').readFileSync('apps/desktop/package.json', 'utf8')).version")"
          fi
          if [[ "${version}" != v* ]]; then
            version="v${version}"
          fi
          if ! [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid semver version: ${version}" >&2
            exit 1
          fi
          {
            echo "version=${version}"
            echo "version_plain=${version#v}"
          } >> "${GITHUB_OUTPUT}"

  dry-run:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025-vs2026
            extra_args: nsis
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version_plain }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: runtime/go.mod
          cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build SDK surfaces (desktop runtime dependency)
        run: pnpm build:sdk

      - name: Provision Windows native test signer
        shell: pwsh
        run: pnpm provision:windows-dev-trust

      - name: Desktop Product Control native smoke (lower-level only)
        run: pnpm --filter @nimiplatform/desktop test:windows:product-control-native

      - name: Normalize desktop updater public key
        env:
          NIMI_DESKTOP_UPDATER_PUBLIC_KEY: ${{ vars.NIMI_DESKTOP_UPDATER_PUBLIC_KEY }}
        run: node apps/desktop/scripts/normalize-updater-public-key.mjs --write-github-env

      - name: Write desktop updater Tauri config
        env:
          NIMI_DESKTOP_UPDATER_ENDPOINT: ${{ vars.NIMI_DESKTOP_UPDATER_ENDPOINT }}
        run: |
          node apps/desktop/scripts/write-updater-tauri-config.mjs \
            --output apps/desktop/src-tauri/target/ci-updater.conf.json

      - name: Validate desktop signing inputs
        run: |
          set -euo pipefail
          if [[ -z "${NIMI_DESKTOP_UPDATER_PUBLIC_KEY:-}" ]]; then
            echo "NIMI_DESKTOP_UPDATER_PUBLIC_KEY is required" >&2
            exit 1
          fi
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required" >&2
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Prepare Desktop release metadata
        run: |
          pnpm --filter @nimiplatform/desktop run prepare:desktop-release -- \
            --version "${RELEASE_VERSION}" \
            --channel stable \
            --commit "${GITHUB_SHA}"

      - name: Validate desktop version sync
        run: pnpm --filter @nimiplatform/desktop run check:version-sync -- --expected "${RELEASE_VERSION}"

      - name: Validate Desktop-only release manifest
        run: pnpm --filter @nimiplatform/desktop run check:desktop-release-sync -- --expected "${RELEASE_VERSION}"

      - name: Build desktop updater artifacts
        id: tauri_build
        uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # action-v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIMI_DESKTOP_UPDATER_ENDPOINT: ${{ vars.NIMI_DESKTOP_UPDATER_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.conf.json --config src-tauri/target/ci-updater.conf.json --bundles ${{ matrix.extra_args }} --ci

      - name: Validate desktop updater artifacts
        env:
          NIMI_ARTIFACT_PATHS_JSON: ${{ steps.tauri_build.outputs.artifactPaths }}
          NIMI_EXPECTED_BUNDLE: ${{ matrix.extra_args }}
        run: pnpm --filter @nimiplatform/desktop run check:desktop-updater-artifacts

      - name: Compose desktop dry-run upload paths
        id: upload_paths
        env:
          NIMI_ARTIFACT_PATHS_JSON: ${{ steps.tauri_build.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const outputPath = process.env.GITHUB_OUTPUT;
          if (!outputPath) {
            throw new Error('GITHUB_OUTPUT is required');
          }
          const artifactPaths = JSON.parse(process.env.NIMI_ARTIFACT_PATHS_JSON || '[]');
          const uploadPaths = [
            ...artifactPaths,
            'apps/desktop/src-tauri/resources/desktop-release-manifest.json',
          ];
          fs.appendFileSync(outputPath, 'paths<<__NIMI_EOF__\n');
          for (const filePath of uploadPaths) {
            fs.appendFileSync(outputPath, `${filePath}\n`);
          }
          fs.appendFileSync(outputPath, '__NIMI_EOF__\n');
          NODE

      - name: Upload desktop dry-run artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: desktop-dry-run-${{ matrix.platform }}-${{ needs.resolve.outputs.version }}
          path: ${{ steps.upload_paths.outputs.paths }}
          if-no-files-found: error
