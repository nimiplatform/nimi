name: local-agent-product-nightly

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-agent-product-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout Nimi
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run LocalAgent contract tests
        run: pnpm test:local-agent-contracts

  dev-kernel-checkpoint:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Nimi
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Checkout locked Realm source
        shell: pwsh
        env:
          REALM_AUTHORITY_REPOSITORY: ${{ secrets.REALM_AUTHORITY_REPOSITORY }}
        run: |
          $commitLine = Get-Content config/realm-contract-lock.yaml | Where-Object { $_ -match '^\s+commit:\s+' } | Select-Object -First 1
          $realmCommit = ($commitLine -split ':', 2)[1].Trim()
          if ($realmCommit -notmatch '^[0-9a-f]{40}$') { throw 'realm contract lock commit is invalid' }
          if ([string]::IsNullOrWhiteSpace($env:REALM_AUTHORITY_REPOSITORY)) { throw 'Realm authority repository secret is required' }
          $realmRoot = Join-Path $env:RUNNER_TEMP 'external-realm'
          git clone --filter=blob:none $env:REALM_AUTHORITY_REPOSITORY $realmRoot
          if ($LASTEXITCODE -ne 0) { throw 'Realm clone failed' }
          git -C $realmRoot checkout --detach $realmCommit
          if ($LASTEXITCODE -ne 0) { throw 'Realm locked checkout failed' }
          "REALM_ROOT=$realmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: package.json

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: runtime/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify Realm contract lock
        run: pnpm check:realm-contract-lock -- --realm-root "$env:REALM_ROOT"

      - name: Provision ephemeral Windows development trust
        run: pnpm provision:windows-dev-trust

      - name: Build and install the fixed dev-kernel service candidate
        run: |
          pnpm build:dev-kernel-service-candidate
          pnpm install:dev-kernel-service-candidate
          pnpm status:dev-kernel-service-candidate

      - name: Run fixed-service Desktop-to-Zhiyu core stability Journey
        run: pnpm test:e2e:local-agent-product:core-stability -- --repeats 3

      - name: Upload dev-kernel product evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: local-agent-product-dev-kernel-${{ github.run_id }}
          path: .nimi/local/evidence/local-agent-full-chain
          include-hidden-files: true
          if-no-files-found: error
