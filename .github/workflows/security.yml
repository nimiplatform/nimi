name: security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: python -m pip install --upgrade pip && pip install detect-secrets==1.5.0

      - name: Secret baseline gate
        run: pnpm check:secrets

  workflow-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1

      - name: Restore fixed zizmor installation
        id: tool-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/zizmor
          key: security-ci-${{ runner.os }}-${{ runner.arch }}-zizmor-1.31.1
      - name: Install zizmor
        if: steps.tool-cache.outputs.cache-hit != 'true'
        run: cargo install --locked zizmor@1.31.1

      - name: Workflow and dependabot audit (high severity gate)
        run: >
          zizmor
          --no-online-audits
          --min-severity high
          --collect workflows
          --collect dependabot
          --
          .github/workflows
          .github/dependabot.yml

  desktop-electron-native-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1

      - name: Restore fixed cargo-audit installation
        id: tool-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: security-ci-${{ runner.os }}-${{ runner.arch }}-cargo-audit-0.22.2
      - name: Install cargo audit
        if: steps.tool-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-audit@0.22.2

      - name: Audit Electron native Rust dependencies
        run: |
          cargo audit --file apps/desktop/product-control-core/Cargo.lock
          cargo audit --file apps/desktop/product-control-node/Cargo.lock
          cargo audit --file kit/shell/protected-local/Cargo.lock
          cargo audit --file kit/shell/protected-local-node/Cargo.lock
          cargo audit --file kit/shell/tauri/Cargo.lock

  security-required:
    name: security-required
    if: always()
    needs:
      - detect-secrets
      - workflow-audit
      - desktop-electron-native-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Require every security lane to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failed = Object.entries(needs)
            .filter(([, value]) => value.result !== 'success')
            .map(([name, value]) => `${name}=${value.result}`);
          if (failed.length > 0) {
            throw new Error(`security lanes did not pass: ${failed.join(', ')}`);
          }
          NODE
