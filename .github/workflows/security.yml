name: security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: python -m pip install --upgrade pip && pip install detect-secrets==1.5.0

      - name: Secret baseline gate
        run: pnpm check:secrets

  workflow-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # v1
        with:
          toolchain: stable

      - name: Install zizmor
        run: cargo install --locked zizmor@1.29.0

      - name: Workflow and dependabot audit (high severity gate)
        run: >
          zizmor
          --no-online-audits
          --min-severity high
          --collect workflows
          --collect dependabot
          --
          .github/workflows
          .github/dependabot.yml

  desktop-electron-native-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # v1
        with:
          toolchain: stable

      - name: Install cargo audit
        run: cargo install --locked cargo-audit@0.22.2

      - name: Audit Electron native Rust dependencies
        run: |
          cargo audit --file apps/desktop/product-control-core/Cargo.lock
          cargo audit --file apps/desktop/product-control-node/Cargo.lock
          cargo audit --file apps/lab/src-tauri/Cargo.lock
          cargo audit --file kit/shell/protected-local/Cargo.lock
          cargo audit --file kit/shell/protected-local-node/Cargo.lock
          cargo audit --file kit/shell/tauri/Cargo.lock

  security-required:
    name: security-required
    if: always()
    needs:
      - detect-secrets
      - workflow-audit
      - desktop-electron-native-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Require every security lane to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failed = Object.entries(needs)
            .filter(([, value]) => value.result !== 'success')
            .map(([name, value]) => `${name}=${value.result}`);
          if (failed.length > 0) {
            throw new Error(`security lanes did not pass: ${failed.join(', ')}`);
          }
          NODE
