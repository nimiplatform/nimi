name: security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: python -m pip install --upgrade pip && pip install detect-secrets==1.5.0

      - name: Secret baseline gate
        run: pnpm check:secrets

  workflow-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Install zizmor
        run: cargo install --locked zizmor@1.29.0

      - name: Workflow and dependabot audit (high severity gate)
        run: >
          zizmor
          --no-online-audits
          --min-severity high
          --collect workflows
          --collect dependabot
          --
          .github/workflows
          .github/dependabot.yml

  desktop-electron-native-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Install cargo audit
        run: cargo install --locked cargo-audit@0.22.2

      - name: Audit Electron native Rust dependencies
        run: |
          cargo audit --file apps/desktop/product-control-core/Cargo.lock
          cargo audit --file apps/desktop/product-control-node/Cargo.lock
          cargo audit --file apps/lab/src-tauri/Cargo.lock
          cargo audit --file kit/shell/protected-local/Cargo.lock
          cargo audit --file kit/shell/protected-local-node/Cargo.lock
          cargo audit --file kit/shell/tauri/Cargo.lock

  required:
    name: required
    if: always()
    needs:
      - detect-secrets
      - workflow-audit
      - desktop-electron-native-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Require every security lane to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failed = Object.entries(needs)
            .filter(([, value]) => value.result !== 'success')
            .map(([name, value]) => `${name}=${value.result}`);
          if (failed.length > 0) {
            throw new Error(`security lanes did not pass: ${failed.join(', ')}`);
          }
          NODE
