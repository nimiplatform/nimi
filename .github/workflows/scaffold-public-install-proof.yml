name: scaffold-public-install-proof

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: Public @nimiplatform/sdk version to prove
        required: true
        type: string
        default: 0.5.15
      kit_version:
        description: Public @nimiplatform/kit version to prove
        required: true
        type: string
        default: 0.1.0
      app_tools_version:
        description: Public @nimiplatform/app-tools version to use for scaffold generation
        required: true
        type: string
        default: 0.1.2
      shell_tauri_version:
        description: Public nimi-shell-tauri crate version to prove
        required: true
        type: string
        default: 0.1.0

permissions:
  contents: read

concurrency:
  group: scaffold-public-install-proof-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      SDK_VERSION: ${{ inputs.sdk_version }}
      KIT_VERSION: ${{ inputs.kit_version }}
      APP_TOOLS_VERSION: ${{ inputs.app_tools_version }}
      SHELL_TAURI_VERSION: ${{ inputs.shell_tauri_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Verify public package availability
        run: |
          set -euo pipefail
          npm view "@nimiplatform/sdk@${SDK_VERSION}" version >/dev/null
          npm view "@nimiplatform/kit@${KIT_VERSION}" version >/dev/null
          npm view "@nimiplatform/app-tools@${APP_TOOLS_VERSION}" version >/dev/null
          crate_index="$(curl --fail --silent --show-error https://index.crates.io/ni/mi/nimi-shell-tauri)"
          CRATE_INDEX="${crate_index}" SHELL_TAURI_VERSION="${SHELL_TAURI_VERSION}" node --input-type=module <<'NODE'
          const entries = process.env.CRATE_INDEX.trim().split('\n').map((line) => JSON.parse(line));
          const expected = process.env.SHELL_TAURI_VERSION;
          const match = entries.find((entry) => entry.vers === expected && entry.yanked !== true);
          if (!match) {
            throw new Error(`nimi-shell-tauri ${expected} is not visible in the crates.io sparse index`);
          }
          NODE

      - name: Generate clean standalone app from public app-tools
        run: |
          set -euo pipefail
          proof_dir="${RUNNER_TEMP}/nimi-public-install-proof"
          rm -rf "${proof_dir}"
          pnpm dlx --package "@nimiplatform/app-tools@${APP_TOOLS_VERSION}" nimi-app create \
            --dir "${proof_dir}" \
            --profile standalone \
            --title "Nimi Public Install Proof"

          PROOF_DIR="${proof_dir}" node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const proofDir = process.env.PROOF_DIR;
          const pkg = JSON.parse(readFileSync(join(proofDir, 'package.json'), 'utf8'));
          const cargoToml = readFileSync(join(proofDir, 'src-tauri', 'Cargo.toml'), 'utf8');
          const expected = {
            '@nimiplatform/sdk': `^${process.env.SDK_VERSION}`,
            '@nimiplatform/kit': `^${process.env.KIT_VERSION}`,
            '@nimiplatform/app-tools': `^${process.env.APP_TOOLS_VERSION}`,
          };
          for (const [name, version] of Object.entries(expected)) {
            const actual = pkg.dependencies?.[name] ?? pkg.devDependencies?.[name];
            if (actual !== version) {
              throw new Error(`generated ${name} version ${actual} does not match public proof ${version}`);
            }
          }
          if (!cargoToml.includes(`nimi-shell-tauri = "${process.env.SHELL_TAURI_VERSION}"`)) {
            throw new Error(`generated Cargo.toml does not reference public nimi-shell-tauri ${process.env.SHELL_TAURI_VERSION}`);
          }
          if (cargoToml.includes('path =')) {
            throw new Error('standalone public proof must not use a Cargo path dependency');
          }
          if (existsSync(join(proofDir, 'pnpm-lock.yaml'))) {
            throw new Error('scaffold generator must not create pnpm-lock.yaml before public install proof');
          }
          NODE

          echo "PROOF_DIR=${proof_dir}" >> "${GITHUB_ENV}"

      - name: Install generated app from public npm registry
        run: pnpm --dir "${PROOF_DIR}" install --no-frozen-lockfile

      - name: Resolve generated app public Rust crate
        run: cargo generate-lockfile --manifest-path "${PROOF_DIR}/src-tauri/Cargo.toml"
