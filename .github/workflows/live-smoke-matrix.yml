name: live-smoke-matrix

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: live-smoke-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    env:
      NIMI_LIVE_GEMINI_API_KEY: ${{ secrets.NIMI_LIVE_GEMINI_API_KEY }}
      NIMI_LIVE_GEMINI_MODEL_ID: ${{ vars.NIMI_LIVE_GEMINI_MODEL_ID }}
      NIMI_LIVE_DASHSCOPE_BASE_URL: ${{ vars.NIMI_LIVE_DASHSCOPE_BASE_URL }}
      NIMI_LIVE_DASHSCOPE_API_KEY: ${{ secrets.NIMI_LIVE_DASHSCOPE_API_KEY }}
      NIMI_LIVE_DASHSCOPE_MODEL_ID: ${{ vars.NIMI_LIVE_DASHSCOPE_MODEL_ID }}
      NIMI_LIVE_GOLD_SUBJECT_USER_ID: ${{ vars.NIMI_LIVE_GOLD_SUBJECT_USER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: package.json

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: runtime/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # >>> nimi-release-gate-projection: live-smoke-checks >>>
      - name: gate.live.live2d-companion-timeline-acceptance
        run: pnpm check:live2d-companion-timeline-acceptance
      - name: gate.live.local-agent-conversation-report
        run: pnpm test:e2e:local-agent-conversation-report
      - name: gate.live.provider-invariants
        run: pnpm check:live-provider-invariants
      - name: gate.live.test-matrix
        run: node scripts/run-live-test-matrix.mjs
      - name: gate.live.smoke-gate
        run: pnpm check:live-smoke-gate --require-release
      # <<< nimi-release-gate-projection: live-smoke-checks <<<

      - name: Upload live smoke coverage
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: live-test-coverage-${{ github.run_id }}
          path: .local/report/live-test-coverage.yaml
          if-no-files-found: error
