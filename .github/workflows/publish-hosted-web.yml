name: Publish reviewed Web apps
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
jobs:
  policy:
    if: github.ref == 'refs/heads/main' && vars.HOSTED_WEB_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: hosted-web-production
    concurrency:
      group: hosted-web-policy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: nimiplatform/nimi-app-registry
          ref: main
          path: registry-checkout
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
          package-manager-cache: false
      - run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts --filter @nimiplatform/app-tools
      - run: node apps/hosted-web/publish.mjs policy registry-checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_HOSTED_WEB_DATABASE_ID: ${{ vars.CLOUDFLARE_HOSTED_WEB_DATABASE_ID }}
          CLOUDFLARE_HOSTED_WEB_BUCKET: ${{ vars.CLOUDFLARE_HOSTED_WEB_BUCKET }}
          CLOUDFLARE_HOSTED_WEB_API_TOKEN: ${{ secrets.CLOUDFLARE_HOSTED_WEB_API_TOKEN }}
  publish:
    needs: policy
    runs-on: ubuntu-latest
    environment: hosted-web-production
    concurrency:
      group: hosted-web-assets
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: nimiplatform/nimi-app-registry
          ref: main
          path: registry-checkout
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
          package-manager-cache: false
      - run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts --filter @nimiplatform/app-tools
      - run: node apps/hosted-web/publish.mjs publish registry-checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_HOSTED_WEB_DATABASE_ID: ${{ vars.CLOUDFLARE_HOSTED_WEB_DATABASE_ID }}
          CLOUDFLARE_HOSTED_WEB_BUCKET: ${{ vars.CLOUDFLARE_HOSTED_WEB_BUCKET }}
          CLOUDFLARE_HOSTED_WEB_API_TOKEN: ${{ secrets.CLOUDFLARE_HOSTED_WEB_API_TOKEN }}
