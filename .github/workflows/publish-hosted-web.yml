name: Publish reviewed Web apps
on:
  workflow_dispatch:
    inputs:
      run_migration:
        description: Run idempotent D1 storefront schema migration once before deployment
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' && inputs.run_migration == true && github.ref == 'refs/heads/main' && vars.HOSTED_WEB_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: hosted-web-production
    concurrency:
      group: hosted-web-migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nimiplatform/nimi-app-registry
          ref: main
          path: registry-checkout
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - run: corepack enable && pnpm install --prod --frozen-lockfile --ignore-scripts --filter @nimiplatform/app-tools --filter @nimiplatform/hosted-web
      - run: node apps/hosted-web/publish.mjs migrate registry-checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_HOSTED_WEB_DATABASE_ID: ${{ vars.CLOUDFLARE_HOSTED_WEB_DATABASE_ID }}
          CLOUDFLARE_HOSTED_WEB_BUCKET: ${{ vars.CLOUDFLARE_HOSTED_WEB_BUCKET }}
          CLOUDFLARE_HOSTED_WEB_API_TOKEN: ${{ secrets.CLOUDFLARE_HOSTED_WEB_API_TOKEN }}
  policy:
    needs: [migrate]
    if: ${{ !cancelled() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && github.ref == 'refs/heads/main' && vars.HOSTED_WEB_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: hosted-web-production
    concurrency:
      group: hosted-web-policy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nimiplatform/nimi-app-registry
          ref: main
          path: registry-checkout
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - run: corepack enable && pnpm install --prod --frozen-lockfile --ignore-scripts --filter @nimiplatform/app-tools --filter @nimiplatform/hosted-web
      - run: node apps/hosted-web/publish.mjs policy registry-checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_HOSTED_WEB_DATABASE_ID: ${{ vars.CLOUDFLARE_HOSTED_WEB_DATABASE_ID }}
          CLOUDFLARE_HOSTED_WEB_BUCKET: ${{ vars.CLOUDFLARE_HOSTED_WEB_BUCKET }}
          CLOUDFLARE_HOSTED_WEB_API_TOKEN: ${{ secrets.CLOUDFLARE_HOSTED_WEB_API_TOKEN }}
  publish:
    needs: [policy]
    if: ${{ !cancelled() && needs.policy.result == 'success' }}
    runs-on: ubuntu-latest
    environment: hosted-web-production
    concurrency:
      group: hosted-web-assets
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nimiplatform/nimi-app-registry
          ref: main
          path: registry-checkout
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - run: corepack enable && pnpm install --prod --frozen-lockfile --ignore-scripts --filter @nimiplatform/app-tools --filter @nimiplatform/hosted-web
      - run: node apps/hosted-web/publish.mjs publish registry-checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_HOSTED_WEB_DATABASE_ID: ${{ vars.CLOUDFLARE_HOSTED_WEB_DATABASE_ID }}
          CLOUDFLARE_HOSTED_WEB_BUCKET: ${{ vars.CLOUDFLARE_HOSTED_WEB_BUCKET }}
          CLOUDFLARE_HOSTED_WEB_API_TOKEN: ${{ secrets.CLOUDFLARE_HOSTED_WEB_API_TOKEN }}
  storefront:
    needs: [policy]
    if: ${{ !cancelled() && needs.policy.result == 'success' }}
    runs-on: ubuntu-latest
    environment: hosted-web-production
    concurrency:
      group: hosted-web-storefront
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nimiplatform/nimi-app-registry
          ref: main
          path: registry-checkout
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - run: corepack enable && pnpm install --prod --frozen-lockfile --ignore-scripts --filter @nimiplatform/app-tools --filter @nimiplatform/hosted-web
      - run: node apps/hosted-web/publish.mjs storefront registry-checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_HOSTED_WEB_DATABASE_ID: ${{ vars.CLOUDFLARE_HOSTED_WEB_DATABASE_ID }}
          CLOUDFLARE_HOSTED_WEB_BUCKET: ${{ vars.CLOUDFLARE_HOSTED_WEB_BUCKET }}
          CLOUDFLARE_HOSTED_WEB_API_TOKEN: ${{ secrets.CLOUDFLARE_HOSTED_WEB_API_TOKEN }}
