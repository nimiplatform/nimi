name: release-candidate
run-name: release candidate ${{ github.ref_name }}

on:
  push:
    tags:
      - v*-rc.*

permissions:
  actions: read
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - name: Resolve exact global RC tag
        id: release
        env:
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE_TAG}" =~ ^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))-rc\.([1-9][0-9]*)$ ]]; then
            echo "global RC tag must be exactly vX.Y.Z-rc.N" >&2
            exit 1
          fi
          {
            echo "commit_sha=${COMMIT_SHA}"
            echo "release_tag=${RELEASE_TAG}"
            echo "release_version=${BASH_REMATCH[1]}"
          } >> "${GITHUB_OUTPUT}"

  admit-canary:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact_name.outputs.artifact_name }}
    env:
      CANARY_ARTIFACT: release-canary-${{ needs.resolve.outputs.release_version }}-${{ needs.resolve.outputs.commit_sha }}
      COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
      RC_ARTIFACT: release-rc-${{ needs.resolve.outputs.release_version }}-${{ needs.resolve.outputs.commit_sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - name: Checkout exact RC
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked metadata dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate RC versions and changelogs
        run: pnpm check:pre-release -- --release-tag "${RELEASE_TAG}"

      - name: Resolve successful canary artifact
        id: canary
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          artifacts_file="${RUNNER_TEMP}/canary-artifacts.json"
          gh api "repos/${REPOSITORY}/actions/artifacts?name=${CANARY_ARTIFACT}&per_page=100" > "${artifacts_file}"
          ARTIFACTS_FILE="${artifacts_file}" node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.env.ARTIFACTS_FILE, 'utf8'));
          const matches = payload.artifacts
            .filter((artifact) => artifact.name === process.env.CANARY_ARTIFACT && !artifact.expired)
            .sort((left, right) => new Date(right.created_at) - new Date(left.created_at));
          if (matches.length === 0) throw new Error(`no live canary artifact named ${process.env.CANARY_ARTIFACT}`);
          const runId = matches[0].workflow_run?.id;
          if (!Number.isSafeInteger(runId)) throw new Error('canary artifact is missing its workflow run id');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run_id=${runId}\n`);
          NODE

      - name: Download exact canary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.CANARY_ARTIFACT }}
          path: dist/release-train
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.canary.outputs.run_id }}

      - name: Verify canary bytes and reseal as RC
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const sourceRoot = path.resolve('dist/release-train');
          const componentRoot = path.resolve('dist/release-components');
          const manifests = fs.readdirSync(sourceRoot)
            .filter((name) => /^release-manifest-.+\.json$/.test(name));
          if (manifests.length !== 6) throw new Error(`expected 6 component manifests, found ${manifests.length}`);
          const claimed = new Set();
          for (const manifestName of manifests) {
            const manifest = JSON.parse(fs.readFileSync(path.join(sourceRoot, manifestName), 'utf8'));
            const destination = path.join(componentRoot, manifest.component);
            fs.mkdirSync(destination, { recursive: true });
            fs.copyFileSync(path.join(sourceRoot, manifestName), path.join(destination, manifestName));
            for (const artifact of manifest.artifacts) {
              if (claimed.has(artifact.name)) throw new Error(`duplicate artifact claim: ${artifact.name}`);
              claimed.add(artifact.name);
              fs.copyFileSync(path.join(sourceRoot, artifact.name), path.join(destination, artifact.name));
            }
          }
          NODE

          for manifest in dist/release-components/*/release-manifest-*.json; do
            component_dir="$(dirname "${manifest}")"
            component="$(node -p "JSON.parse(require('node:fs').readFileSync('${manifest}', 'utf8')).component")"
            version="$(node -p "JSON.parse(require('node:fs').readFileSync('${manifest}', 'utf8')).version")"
            pnpm release:artifact:verify -- \
              --manifest "${manifest}" \
              --artifacts-dir "${component_dir}" \
              --component "${component}" \
              --version "${version}" \
              --commit "${COMMIT_SHA}" \
              --channel canary
            rm "${manifest}"
            pnpm release:artifact:manifest -- \
              --component "${component}" \
              --version "${version}" \
              --commit "${COMMIT_SHA}" \
              --channel rc \
              --release-tag "${RELEASE_TAG}" \
              --artifacts-dir "${component_dir}" \
              --output "${manifest}"
            pnpm release:artifact:verify -- \
              --manifest "${manifest}" \
              --artifacts-dir "${component_dir}" \
              --component "${component}" \
              --version "${version}" \
              --commit "${COMMIT_SHA}" \
              --channel rc
            cp "${manifest}" dist/release-train/
          done

      - name: Resolve admitted artifact name
        id: artifact_name
        run: echo "artifact_name=${RC_ARTIFACT}" >> "${GITHUB_OUTPUT}"

      - name: Upload admitted RC bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact_name.outputs.artifact_name }}
          path: dist/release-train
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [resolve, admit-canary]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - name: Checkout exact RC
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download sealed RC bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.admit-canary.outputs.artifact_name }}
          path: dist/release-train

      - name: Reconstruct and verify component bundles
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const sourceRoot = path.resolve('dist/release-train');
          const componentRoot = path.resolve('dist/release-components');
          const manifests = fs.readdirSync(sourceRoot)
            .filter((name) => /^release-manifest-.+\.json$/.test(name));
          if (manifests.length !== 6) {
            throw new Error(`expected 6 component manifests, found ${manifests.length}`);
          }
          const claimed = new Set();
          for (const manifestName of manifests) {
            const manifest = JSON.parse(fs.readFileSync(path.join(sourceRoot, manifestName), 'utf8'));
            const destination = path.join(componentRoot, manifest.component);
            fs.mkdirSync(destination, { recursive: true });
            fs.copyFileSync(path.join(sourceRoot, manifestName), path.join(destination, manifestName));
            for (const artifact of manifest.artifacts) {
              if (claimed.has(artifact.name)) throw new Error(`duplicate artifact claim: ${artifact.name}`);
              claimed.add(artifact.name);
              fs.copyFileSync(path.join(sourceRoot, artifact.name), path.join(destination, artifact.name));
            }
          }
          NODE

          for manifest in dist/release-components/*/release-manifest-*.json; do
            component_dir="$(dirname "${manifest}")"
            pnpm release:artifact:verify -- \
              --manifest "${manifest}" \
              --artifacts-dir "${component_dir}" \
              --commit "${COMMIT_SHA}" \
              --channel rc
          done

      - name: Install compatible npm tarballs from the RC bundle
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const os = require('node:os');
          const path = require('node:path');
          const root = path.resolve('dist/release-train');
          const tarballs = fs.readdirSync(root).filter((name) => name.endsWith('.tgz')).sort();
          if (tarballs.length === 0) throw new Error('release train contains no npm tarballs');
          const compatible = [];
          for (const name of tarballs) {
            const file = path.join(root, name);
            const read = spawnSync('tar', ['-xOf', file, 'package/package.json'], { encoding: 'utf8' });
            if (read.status !== 0) throw new Error(`cannot read package metadata from ${name}`);
            const pkg = JSON.parse(read.stdout);
            if (!pkg.name || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(pkg.version)) {
              throw new Error(`invalid final npm package metadata in ${name}`);
            }
            const osAllowed = !pkg.os || pkg.os.includes(process.platform);
            const cpuAllowed = !pkg.cpu || pkg.cpu.includes(process.arch);
            if (osAllowed && cpuAllowed) compatible.push(file);
          }
          const smokeRoot = fs.mkdtempSync(path.join(os.tmpdir(), 'nimi-release-rc-npm-'));
          fs.writeFileSync(path.join(smokeRoot, 'package.json'), '{"private":true}\n');
          const install = spawnSync(
            'npm',
            ['install', '--ignore-scripts', '--no-package-lock', ...compatible],
            { cwd: smokeRoot, encoding: 'utf8', stdio: 'inherit' },
          );
          if (install.status !== 0) throw new Error('installing compatible RC npm tarballs failed');
          const appTools = path.join(smokeRoot, 'node_modules', '.bin', 'nimi-app');
          const help = spawnSync(appTools, ['--help'], { cwd: smokeRoot, encoding: 'utf8' });
          process.stdout.write(help.stdout || '');
          process.stderr.write(help.stderr || '');
          if (help.status !== 0) throw new Error('installed RC app-tools CLI failed its help smoke');
          NODE

      - name: Create draft GitHub prerelease with exact assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists; RC releases are immutable" >&2
            exit 1
          fi
          mapfile -d '' assets < <(find dist/release-train -maxdepth 1 -type f -print0 | sort -z)
          test "${#assets[@]}" -gt 0
          gh release create "${RELEASE_TAG}" "${assets[@]}" \
            --verify-tag \
            --draft \
            --prerelease \
            --title "${RELEASE_TAG}" \
            --generate-notes

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${RELEASE_TAG}" --draft=false --prerelease
