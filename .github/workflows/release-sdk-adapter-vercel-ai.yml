name: release-sdk-adapter-vercel-ai

on:
  push:
    tags:
      - sdk-adapter-vercel-ai/v*
  pull_request:
    paths:
      - .github/workflows/release-security.yml
      - scripts/lib/secret-scan-scope.mjs
      - scripts/lib/secret-scan-result.mjs
      - scripts/check-secrets.mjs
      - .secrets.baseline
      - .github/workflows/release-sdk-adapter-vercel-ai.yml
      - package.json
      - pnpm-lock.yaml
      - proto/**
      - runtime/proto/**
      - scripts/check-sdk-kit-pack-audit.mjs
      - scripts/lib/command-runner.mjs
      - scripts/release/build-component-package.mjs
      - sdks/typescript/**
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable Vercel adapter SemVer for a dry-run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-sdk-adapter-vercel-ai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/release-security.yml
    with:
      component: sdk-adapter-vercel-ai

  validate:
    name: Vercel adapter validate and dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: none
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.34.5
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check package licensing
        run: pnpm check:license-file-map
      - name: Resolve Vercel adapter component identity
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('sdks/typescript/adapters/vercel-ai/package.json','utf8')).version")"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#sdk-adapter-vercel-ai/v}"
            production=true
            test "${GITHUB_REF}" = "refs/tags/sdk-adapter-vercel-ai/v${version}"
            test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
            production=false
          else
            version="${package_version}"
            production=false
          fi
          if ! [[ "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Vercel adapter version must be a stable SemVer: ${version}" >&2
            exit 1
          fi
          test "${package_version}" = "${version}"
          {
            echo "artifact_name=sdk-adapter-vercel-ai-component-package-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
            echo "production=${production}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"
      - name: Test Vercel adapter
        run: |
          pnpm --filter @nimiplatform/sdk build
          pnpm --filter @nimiplatform/sdk-adapter-vercel-ai test
          pnpm --filter @nimiplatform/sdk-adapter-vercel-ai lint
          pnpm check:sdk-version-matrix
      - name: Build deterministic Vercel adapter package
        run: pnpm release:component:pack -- --component sdk-adapter-vercel-ai --output-dir dist/component-release/sdk-adapter-vercel-ai
      - name: Dry-run Vercel adapter publication
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(dist/component-release/sdk-adapter-vercel-ai/*.tgz)
          test "${#tarballs[@]}" -eq 1
          npm publish "${tarballs[0]}" --access public --dry-run
      - name: Require published SDK for tag publication
        if: steps.release.outputs.production == 'true'
        run: |
          sdk_range="$(node -p "require('./sdks/typescript/adapters/vercel-ai/package.json').peerDependencies['@nimiplatform/sdk']")"
          npm view "@nimiplatform/sdk@${sdk_range}" version >/dev/null
      - name: Upload exact Vercel adapter package for tag publication
        if: steps.release.outputs.production == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: dist/component-release/sdk-adapter-vercel-ai/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Vercel adapter publish
    needs: [validate, security]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-adapter-vercel-ai/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact tag source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Require immutable tag identity on main
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/tags/sdk-adapter-vercel-ai/v${RELEASE_VERSION}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
      - name: Setup Node.js for npm OIDC
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Download exact validated Vercel adapter package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
          path: dist/component-release/sdk-adapter-vercel-ai
      - name: Publish or verify exact Vercel adapter package with provenance
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          # npm requires a package to exist before configuring its trusted publisher.
          # The repository bootstrap credential admits that initial publication.
          # Once configured, npm prefers this workflow's independent OIDC identity.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(dist/component-release/sdk-adapter-vercel-ai/*.tgz)
          test "${#tarballs[@]}" -eq 1
          package_identity="$(tar -xOf "${tarballs[0]}" package/package.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s);process.stdout.write(p.name+'@'+p.version)})")"
          test "${package_identity}" = "@nimiplatform/sdk-adapter-vercel-ai@${RELEASE_VERSION}"
          local_sha1="$(shasum -a 1 "${tarballs[0]}" | awk '{print $1}')"
          if remote_sha1="$(npm view "${package_identity}" dist.shasum --json 2>/dev/null)"; then
            remote_sha1="$(printf '%s' "${remote_sha1}" | tr -d '"[:space:]')"
            test "${remote_sha1}" = "${local_sha1}"
          else
            npm publish "${tarballs[0]}" --access public --provenance
          fi
