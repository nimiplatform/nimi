name: Release macOS Electron PKG

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable protected-local release id
        required: true
        type: string
      generation:
        description: Monotonic protected-local release generation
        required: true
        type: string
      valid_from:
        description: RFC3339 UTC validity start at second precision
        required: true
        type: string
      expires_at:
        description: RFC3339 UTC validity end at second precision
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-macos-electron
  cancel-in-progress: false

jobs:
  signed-notarized-pkg:
    name: Signed/notarized arm64 PKG
    runs-on: [self-hosted, macOS, ARM64, nimi-release]
    timeout-minutes: 90
    env:
      NIMI_MACOS_APPLICATION_SIGNING_IDENTITY: ${{ vars.NIMI_MACOS_APPLICATION_SIGNING_IDENTITY }}
      NIMI_MACOS_BUILD_ID: ${{ github.sha }}
      NIMI_MACOS_INSTALLER_SIGNING_IDENTITY: ${{ vars.NIMI_MACOS_INSTALLER_SIGNING_IDENTITY }}
      NIMI_MACOS_RELEASE_EXPIRES_AT: ${{ inputs.expires_at }}
      NIMI_MACOS_RELEASE_GENERATION: ${{ inputs.generation }}
      NIMI_MACOS_RELEASE_ID: ${{ inputs.release_id }}
      NIMI_MACOS_RELEASE_OUTPUT: ${{ github.workspace }}/.nimi/local/macos-electron-release/${{ inputs.release_id }}
      NIMI_MACOS_RELEASE_VALID_FROM: ${{ inputs.valid_from }}
      NIMI_MACOS_TEAM_ID: ${{ vars.NIMI_MACOS_TEAM_ID }}
      NIMI_NOTARYTOOL_KEYCHAIN: ${{ vars.NIMI_NOTARYTOOL_KEYCHAIN }}
      NIMI_NOTARYTOOL_KEYCHAIN_PROFILE: ${{ vars.NIMI_NOTARYTOOL_KEYCHAIN_PROFILE }}
      NIMI_PLATFORM_RELEASE_ROOT_KEY_ID: ${{ vars.NIMI_PLATFORM_RELEASE_ROOT_KEY_ID }}
      NIMI_PLATFORM_RELEASE_ROOT_PUBLIC_KEY_B64URL: ${{ vars.NIMI_PLATFORM_RELEASE_ROOT_PUBLIC_KEY_B64URL }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: runtime/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Install locked workspace
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build, sign, notarize, and verify installer
        run: pnpm release:macos:electron

      - name: Upload authoritative installer candidate
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nimi-macos-electron-${{ inputs.release_id }}
          path: ${{ env.NIMI_MACOS_RELEASE_OUTPUT }}
          if-no-files-found: error
          retention-days: 14
