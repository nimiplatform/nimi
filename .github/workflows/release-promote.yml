name: release-promote
run-name: promote ${{ inputs.rc_tag }} to stable

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: Exact global RC tag to promote, for example v0.1.0-rc.1
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-promote-${{ inputs.rc_tag }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: stable-release
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      RC_TAG: ${{ inputs.rc_tag }}
    steps:
      - name: Resolve stable release tag
        id: release
        run: |
          set -euo pipefail
          if ! [[ "${RC_TAG}" =~ ^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))-rc\.([1-9][0-9]*)$ ]]; then
            echo "rc_tag must be exactly vX.Y.Z-rc.N" >&2
            exit 1
          fi
          {
            echo "release_version=${BASH_REMATCH[1]}"
            echo "stable_tag=v${BASH_REMATCH[1]}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout immutable RC tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.rc_tag }}
          fetch-depth: 0

      - name: Resolve and verify RC identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          release_json="$(gh release view "${RC_TAG}" --json isDraft,isPrerelease,tagName)"
          RELEASE_JSON="${release_json}" node <<'NODE'
          const release = JSON.parse(process.env.RELEASE_JSON);
          if (release.tagName !== process.env.RC_TAG || release.isDraft || !release.isPrerelease) {
            throw new Error('RC must be a published GitHub prerelease for the exact input tag');
          }
          NODE
          if gh release view "${STABLE_TAG}" >/dev/null 2>&1; then
            echo "stable GitHub release ${STABLE_TAG} already exists" >&2
            exit 1
          fi
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: runtime/go.mod
          cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Download exact RC release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/release-train
          gh release download "${RC_TAG}" --dir dist/release-train

      - name: Reconstruct and verify component bundles
        env:
          COMMIT_SHA: ${{ steps.identity.outputs.commit_sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const sourceRoot = path.resolve('dist/release-train');
          const componentRoot = path.resolve('dist/release-components');
          const manifests = fs.readdirSync(sourceRoot)
            .filter((name) => /^release-manifest-.+\.json$/.test(name));
          if (manifests.length !== 7) {
            throw new Error(`expected 7 component manifests, found ${manifests.length}`);
          }
          const claimed = new Set();
          for (const manifestName of manifests) {
            const manifest = JSON.parse(fs.readFileSync(path.join(sourceRoot, manifestName), 'utf8'));
            const destination = path.join(componentRoot, manifest.component);
            fs.mkdirSync(destination, { recursive: true });
            fs.copyFileSync(path.join(sourceRoot, manifestName), path.join(destination, manifestName));
            for (const artifact of manifest.artifacts) {
              if (claimed.has(artifact.name)) throw new Error(`duplicate artifact claim: ${artifact.name}`);
              claimed.add(artifact.name);
              fs.copyFileSync(path.join(sourceRoot, artifact.name), path.join(destination, artifact.name));
            }
          }
          NODE

          for manifest in dist/release-components/*/release-manifest-*.json; do
            component_dir="$(dirname "${manifest}")"
            pnpm release:artifact:verify -- \
              --manifest "${manifest}" \
              --artifacts-dir "${component_dir}" \
              --commit "${COMMIT_SHA}" \
              --channel rc
          done

      - name: Verify Runtime RC signatures
        run: |
          set -euo pipefail
          GOBIN="$(go env GOPATH)/bin"
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.2
          verify_blob() {
            local artifact="$1"
            "${GOBIN}/cosign" verify-blob \
              --certificate "${artifact}.pem" \
              --signature "${artifact}.sig" \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release-candidate.yml@.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${artifact}"
          }
          runtime_dir="dist/release-components/runtime"
          mapfile -d '' archives < <(
            find "${runtime_dir}" -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.zip' \) -print0 | sort -z
          )
          test "${#archives[@]}" -eq 6
          for archive in "${archives[@]}"; do
            verify_blob "${archive}"
            verify_blob "${archive}.spdx.json"
          done
          verify_blob "${runtime_dir}/checksums.txt"

      - name: Require publication credentials before creating stable tag
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${NPM_TOKEN:-}"
          test -n "${CARGO_REGISTRY_TOKEN:-}"
          test -n "${BUF_TOKEN:-}"

      - name: Create or verify same-SHA stable tag
        env:
          COMMIT_SHA: ${{ steps.identity.outputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
        run: |
          set -euo pipefail
          if git rev-parse --verify "refs/tags/${STABLE_TAG}^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/${STABLE_TAG}^{commit}")" = "${COMMIT_SHA}"
          else
            gh api "repos/${REPOSITORY}/git/refs" \
              --method POST \
              -f "ref=refs/tags/${STABLE_TAG}" \
              -f "sha=${COMMIT_SHA}" >/dev/null
            git fetch origin "refs/tags/${STABLE_TAG}:refs/tags/${STABLE_TAG}"
          fi

      - name: Verify same-SHA promotion contract
        env:
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
        run: |
          set -euo pipefail
          for manifest in dist/release-components/*/release-manifest-*.json; do
            pnpm release:promotion:verify -- \
              --manifest "${manifest}" \
              --artifacts-dir "$(dirname "${manifest}")" \
              --rc-tag "${RC_TAG}" \
              --stable-tag "${STABLE_TAG}" \
              --repo-root "${GITHUB_WORKSPACE}"
          done

      - name: Publish exact npm dependency packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(dist/release-components/*/*.tgz)
          publish_exact_npm() {
            local requested_name="$1"
            local matches=()
            local tarball package_name package_version package_spec local_sha1 remote_sha1
            for tarball in "${tarballs[@]}"; do
              package_name="$(tar -xOf "${tarball}" package/package.json | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).name))")"
              if [[ "${package_name}" == "${requested_name}" ]]; then
                matches+=("${tarball}")
              fi
            done
            test "${#matches[@]}" -eq 1
            tarball="${matches[0]}"
            package_version="$(tar -xOf "${tarball}" package/package.json | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")"
            package_spec="${requested_name}@${package_version}"
            local_sha1="$(shasum -a 1 "${tarball}" | awk '{print $1}')"
            remote_sha1="$(npm view "${package_spec}" dist.shasum --json 2>/dev/null | tr -d '"[:space:]' || true)"
            if [[ -n "${remote_sha1}" ]]; then
              test "${remote_sha1}" = "${local_sha1}"
              npm dist-tag add "${package_spec}" latest
            else
              npm publish "${tarball}" --access public --tag latest --provenance
            fi
            for _ in $(seq 1 18); do
              if npm view "${package_spec}" version >/dev/null 2>&1; then
                return 0
              fi
              sleep 10
            done
            echo "${package_spec} is not visible on npm" >&2
            return 1
          }

          publish_exact_npm '@nimiplatform/sdk'
          publish_exact_npm '@nimiplatform/kit-protected-local-win32-x64'
          publish_exact_npm '@nimiplatform/kit'
          for package_name in \
            '@nimiplatform/nimi-darwin-arm64' \
            '@nimiplatform/nimi-darwin-x64' \
            '@nimiplatform/nimi-linux-arm64' \
            '@nimiplatform/nimi-linux-x64' \
            '@nimiplatform/nimi-win32-arm64' \
            '@nimiplatform/nimi-win32-x64'
          do
            publish_exact_npm "${package_name}"
          done
          publish_exact_npm '@nimiplatform/nimi'

      - name: Publish protected-local crate from the admitted SHA
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          rc_crates=(dist/release-components/nimi-shell-protected-local/*.crate)
          test "${#rc_crates[@]}" -eq 1
          cargo package \
            --manifest-path kit/shell/protected-local/Cargo.toml \
            --locked \
            --no-verify
          rebuilt="kit/shell/protected-local/target/package/$(basename "${rc_crates[0]}")"
          test -f "${rebuilt}"
          admitted_checksum="$(sha256sum "${rc_crates[0]}" | awk '{print $1}')"
          test "$(sha256sum "${rebuilt}" | awk '{print $1}')" = "${admitted_checksum}"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' kit/shell/protected-local/Cargo.toml | head -1)"
          version_url="https://crates.io/api/v1/crates/nimi-shell-protected-local/${version}"
          if version_json="$(curl --fail --silent --show-error "${version_url}" 2>/dev/null)"; then
            remote_checksum="$(printf '%s' "${version_json}" | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version.checksum))")"
            test "${remote_checksum}" = "${admitted_checksum}"
          else
            cargo publish \
              --manifest-path kit/shell/protected-local/Cargo.toml \
              --locked \
              --no-verify \
              --token "${CARGO_REGISTRY_TOKEN}"
          fi

      - name: Publish Tauri shell crate from the admitted SHA
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          source_archives=(dist/release-components/nimi-shell-tauri/*-source.tar.gz)
          test "${#source_archives[@]}" -eq 1
          source_staging="$(mktemp -d "${RUNNER_TEMP}/nimi-shell-tauri-promotion.XXXXXX")"
          tar -xzf "${source_archives[0]}" -C "${source_staging}"
          mapfile -t source_roots < <(find "${source_staging}" -mindepth 1 -maxdepth 1 -type d -print)
          test "${#source_roots[@]}" -eq 1
          protected_manifest="${source_roots[0]}/kit/shell/protected-local/Cargo.toml"
          tauri_manifest="${source_roots[0]}/kit/shell/tauri/Cargo.toml"
          dependency_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "${protected_manifest}" | head -1)"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "https://crates.io/api/v1/crates/nimi-shell-protected-local/${dependency_version}" >/dev/null 2>&1; then
              break
            fi
            if [[ "${attempt}" -eq 18 ]]; then
              echo "protected-local ${dependency_version} is not visible on crates.io" >&2
              exit 1
            fi
            sleep 10
          done
          cargo package --manifest-path "${tauri_manifest}" --locked --no-verify
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "${tauri_manifest}" | head -1)"
          rebuilt="$(dirname "${tauri_manifest}")/target/package/nimi-shell-tauri-${version}.crate"
          test -f "${rebuilt}"
          admitted_checksum="$(sha256sum "${rebuilt}" | awk '{print $1}')"
          version_url="https://crates.io/api/v1/crates/nimi-shell-tauri/${version}"
          if version_json="$(curl --fail --silent --show-error "${version_url}" 2>/dev/null)"; then
            remote_checksum="$(printf '%s' "${version_json}" | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version.checksum))")"
            test "${remote_checksum}" = "${admitted_checksum}"
          else
            cargo publish \
              --manifest-path "${tauri_manifest}" \
              --locked \
              --no-verify \
              --token "${CARGO_REGISTRY_TOKEN}"
          fi

      - name: Publish Proto module from the admitted SHA
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: |
          set -euo pipefail
          go install github.com/bufbuild/buf/cmd/buf@v1.70.0
          BUF_BIN="$(go env GOPATH)/bin/buf"
          shopt -s nullglob
          proto_archives=(dist/release-components/proto/*.tar.gz)
          test "${#proto_archives[@]}" -eq 1
          proto_root="$(mktemp -d "${RUNNER_TEMP}/nimi-proto-promotion.XXXXXX")"
          tar -xzf "${proto_archives[0]}" -C "${proto_root}"
          mapfile -t source_dirs < <(find "${proto_root}" -mindepth 1 -maxdepth 1 -type d -print)
          test "${#source_dirs[@]}" -eq 1
          "${BUF_BIN}" build "${source_dirs[0]}" -o "${RUNNER_TEMP}/nimi-proto.binpb"
          "${BUF_BIN}" lint "${source_dirs[0]}"
          "${BUF_BIN}" push "${source_dirs[0]}"

      - name: Publish App Tools after all embedded public dependencies are visible
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          sdk_version="$(node -p "JSON.parse(require('node:fs').readFileSync('sdks/typescript/package.json', 'utf8')).version")"
          kit_version="$(node -p "JSON.parse(require('node:fs').readFileSync('kit/package.json', 'utf8')).version")"
          protected_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' kit/shell/protected-local/Cargo.toml | head -1)"
          tauri_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' kit/shell/tauri/Cargo.toml | head -1)"
          npm view "@nimiplatform/sdk@${sdk_version}" version >/dev/null
          npm view "@nimiplatform/kit@${kit_version}" version >/dev/null
          wait_for_crate() {
            local crate_name="$1"
            local crate_version="$2"
            for _ in $(seq 1 18); do
              if curl --fail --silent --show-error "https://crates.io/api/v1/crates/${crate_name}/${crate_version}" >/dev/null 2>&1; then
                return 0
              fi
              sleep 10
            done
            echo "${crate_name} ${crate_version} is not visible on crates.io" >&2
            return 1
          }
          wait_for_crate nimi-shell-protected-local "${protected_version}"
          wait_for_crate nimi-shell-tauri "${tauri_version}"

          shopt -s nullglob
          tarballs=(dist/release-components/app-tools/*.tgz)
          test "${#tarballs[@]}" -eq 1
          tarball="${tarballs[0]}"
          package_spec="$(tar -xOf "${tarball}" package/package.json | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s); process.stdout.write(p.name+'@'+p.version)})")"
          local_sha1="$(shasum -a 1 "${tarball}" | awk '{print $1}')"
          remote_sha1="$(npm view "${package_spec}" dist.shasum --json 2>/dev/null | tr -d '"[:space:]' || true)"
          if [[ -n "${remote_sha1}" ]]; then
            test "${remote_sha1}" = "${local_sha1}"
            npm dist-tag add "${package_spec}" latest
          else
            npm publish "${tarball}" --access public --tag latest --provenance
          fi

      - name: Create stable GitHub release from the same RC assets
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find dist/release-train -maxdepth 1 -type f -print0 | sort -z)
          test "${#assets[@]}" -gt 0
          gh release create "${STABLE_TAG}" "${assets[@]}" \
            --verify-tag \
            --latest \
            --title "${STABLE_TAG}" \
            --notes "Promoted from ${RC_TAG}; commit and artifact bytes are unchanged."
