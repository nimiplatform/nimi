name: release-dev-tools

on:
  push:
    tags:
      - dev-tools/v*
  workflow_dispatch:
    inputs:
      version:
        description: Semver version already present in dev-tools/package.json, for example 0.5.7 or v0.5.7
        required: true
        type: string
      publish:
        description: Publish @nimiplatform/dev-tools to npm. false runs the dry-run release gate only.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-dev-tools-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_plain: ${{ steps.resolve.outputs.version_plain }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Resolve dev-tools release version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          semver_regex='^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'

          if [[ "${EVENT_NAME}" == "push" ]]; then
            case "${REF_NAME}" in
              dev-tools/v*)
                version="${REF_NAME#dev-tools/}"
                publish="true"
                ;;
              *)
                echo "unsupported dev-tools tag format: ${REF_NAME}" >&2
                exit 1
                ;;
            esac
          else
            version="${INPUT_VERSION}"
            if [[ "${version}" != v* ]]; then
              version="v${version}"
            fi
            publish="${INPUT_PUBLISH}"
          fi

          if ! [[ "${version}" =~ ${semver_regex} ]]; then
            echo "invalid semver version: ${version}" >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "version_plain=${version#v}"
            echo "publish=${publish}"
          } >> "${GITHUB_OUTPUT}"

  release:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version_plain }}
      PUBLISH: ${{ needs.resolve.outputs.publish }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify dev-tools package version and metadata
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const pkg = JSON.parse(readFileSync('dev-tools/package.json', 'utf8'));
          const expectedVersion = process.env.RELEASE_VERSION;
          if (pkg.name !== '@nimiplatform/dev-tools') {
            throw new Error(`unexpected dev-tools package name: ${pkg.name}`);
          }
          if (pkg.version !== expectedVersion) {
            throw new Error(`dev-tools/package.json version ${pkg.version} does not match release ${expectedVersion}`);
          }
          if (pkg.private !== false) {
            throw new Error('@nimiplatform/dev-tools must remain public');
          }
          if (pkg.publishConfig?.access !== 'public') {
            throw new Error('@nimiplatform/dev-tools publishConfig.access must be public');
          }
          if (pkg.publishConfig?.provenance !== true) {
            throw new Error('@nimiplatform/dev-tools publishConfig.provenance must be true');
          }
          if (pkg.bin?.['nimi-app'] !== './bin/nimi-app.mjs') {
            throw new Error('@nimiplatform/dev-tools must expose the nimi-app CLI');
          }
          NODE

      - name: Nimi-app CLI smoke and scaffold dependency alignment
        run: |
          set -euo pipefail
          node dev-tools/bin/nimi-app.mjs --help >/tmp/nimi-app-help.txt
          test -s /tmp/nimi-app-help.txt

          proof_dir="${RUNNER_TEMP}/nimi-app-release-smoke"
          rm -rf "${proof_dir}"
          node dev-tools/bin/nimi-app.mjs create --dir "${proof_dir}" --profile standalone --title "Release Smoke"

          PROOF_DIR="${proof_dir}" node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const proofDir = process.env.PROOF_DIR;
          const appPackage = JSON.parse(readFileSync(join(proofDir, 'package.json'), 'utf8'));
          const sdkPackage = JSON.parse(readFileSync('sdk/package.json', 'utf8'));
          const kitPackage = JSON.parse(readFileSync('kit/package.json', 'utf8'));
          const devToolsPackage = JSON.parse(readFileSync('dev-tools/package.json', 'utf8'));
          const cargoToml = readFileSync('kit/shell/tauri/Cargo.toml', 'utf8');
          const shellVersion = cargoToml.match(/^version = "([^"]+)"/m)?.[1];
          const generatedCargoToml = readFileSync(join(proofDir, 'src-tauri', 'Cargo.toml'), 'utf8');

          const expected = {
            '@nimiplatform/sdk': `^${sdkPackage.version}`,
            '@nimiplatform/nimi-kit': `^${kitPackage.version}`,
            '@nimiplatform/dev-tools': `^${devToolsPackage.version}`,
          };
          for (const [name, version] of Object.entries(expected)) {
            const actual = appPackage.dependencies?.[name] ?? appPackage.devDependencies?.[name];
            if (actual !== version) {
              throw new Error(`generated ${name} version ${actual} does not match expected ${version}`);
            }
          }
          if (!shellVersion || !generatedCargoToml.includes(`nimi-shell-tauri = "${shellVersion}"`)) {
            throw new Error(`generated Cargo.toml does not use public nimi-shell-tauri ${shellVersion}`);
          }
          if (existsSync(join(proofDir, 'pnpm-lock.yaml'))) {
            throw new Error('scaffold generator must not create pnpm-lock.yaml');
          }
          NODE

      - name: Test dev-tools
        run: node --test dev-tools/test/*.test.mjs

      - name: Check duplicate dev-tools npm version
        run: |
          set -euo pipefail
          if npm view "@nimiplatform/dev-tools@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            if [[ "${PUBLISH}" == "true" ]]; then
              echo "@nimiplatform/dev-tools@${RELEASE_VERSION} already exists on npm" >&2
              exit 1
            fi
            echo "@nimiplatform/dev-tools@${RELEASE_VERSION} already exists on npm; dry-run mode will not publish"
          else
            echo "@nimiplatform/dev-tools@${RELEASE_VERSION} is not published on npm"
          fi

      - name: Verify public dependency readiness for real publish
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          sdk_version="$(node -p "JSON.parse(require('node:fs').readFileSync('sdk/package.json', 'utf8')).version")"
          kit_version="$(node -p "JSON.parse(require('node:fs').readFileSync('kit/package.json', 'utf8')).version")"
          shell_version="$(node -e "const fs=require('node:fs'); const m=fs.readFileSync('kit/shell/tauri/Cargo.toml','utf8').match(/^version = \"([^\"]+)\"/m); if (!m) process.exit(1); console.log(m[1]);")"

          npm view "@nimiplatform/sdk@${sdk_version}" version >/dev/null
          npm view "@nimiplatform/nimi-kit@${kit_version}" version >/dev/null
          curl --fail --silent --show-error "https://crates.io/api/v1/crates/nimi-shell-tauri/${shell_version}" >/dev/null

      - name: Dev-tools npm publish dry-run
        run: pnpm --filter @nimiplatform/dev-tools publish --access public --no-git-checks --dry-run

      - name: Publish dev-tools to npm
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          if [[ -z "${NPM_TOKEN:-}" ]]; then
            echo "NPM_TOKEN is required for @nimiplatform/dev-tools publish" >&2
            exit 1
          fi
          npm_config="${NPM_CONFIG_USERCONFIG:-${HOME}/.npmrc}"
          mkdir -p "$(dirname "${npm_config}")"
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "${npm_config}"
          export NODE_AUTH_TOKEN="${NPM_TOKEN}"
          pnpm --filter @nimiplatform/dev-tools publish --access public --no-git-checks --provenance
