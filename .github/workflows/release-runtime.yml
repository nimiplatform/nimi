name: release-runtime

on:
  push:
    tags:
      - runtime/v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke-gate:
    if: startsWith(github.ref, 'refs/tags/runtime/v')
    runs-on: ubuntu-latest
    env:
      NIMI_LIVE_GEMINI_API_KEY: ${{ secrets.NIMI_LIVE_GEMINI_API_KEY }}
      NIMI_LIVE_GEMINI_MODEL_ID: ${{ vars.NIMI_LIVE_GEMINI_MODEL_ID || 'gemini-3-flash-preview' }}
      NIMI_LIVE_DASHSCOPE_BASE_URL: ${{ vars.NIMI_LIVE_DASHSCOPE_BASE_URL || 'https://dashscope.aliyuncs.com/compatible-mode/v1' }}
      NIMI_LIVE_DASHSCOPE_API_KEY: ${{ secrets.NIMI_LIVE_DASHSCOPE_API_KEY }}
      NIMI_LIVE_DASHSCOPE_MODEL_ID: ${{ vars.NIMI_LIVE_DASHSCOPE_MODEL_ID || 'qwen3-max' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: runtime/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # >>> nimi-release-gate-projection: live-smoke-checks >>>
      - name: gate.live.live2d-companion-timeline-acceptance
        run: pnpm check:live2d-companion-timeline-acceptance
      - name: gate.live.provider-invariants
        run: pnpm check:live-provider-invariants
      - name: gate.live.test-matrix
        run: node scripts/run-live-test-matrix.mjs
      - name: gate.live.smoke-gate
        run: pnpm check:live-smoke-gate --require-release
      # <<< nimi-release-gate-projection: live-smoke-checks <<<

      - name: Upload live smoke coverage
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: live-test-coverage-runtime-${{ github.ref_name }}
          path: .local/report/live-test-coverage.yaml
          if-no-files-found: error

  release-tag:
    needs: live-smoke-gate
    if: startsWith(github.ref, 'refs/tags/runtime/v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.runtime_tag.outputs.tag }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: runtime/go.mod
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Resolve runtime semver tag
        id: runtime_tag
        run: |
          if [[ "${GITHUB_REF_NAME}" != runtime/v* ]]; then
            echo "unexpected runtime tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "tag=${GITHUB_REF_NAME#runtime/}" >> "${GITHUB_OUTPUT}"

      # >>> nimi-release-gate-projection: release-target-runtime-static-checks >>>
      - name: gate.proto.baseline-exists
        run: test -s runtime/proto/runtime-v1.baseline.binpb
      - name: gate.runtime.ai-scenario-coverage
        run: pnpm check:runtime-ai-scenario-coverage
      - name: gate.runtime.compliance
        working-directory: runtime
        run: go run ./cmd/runtime-compliance --gate
      - name: gate.runtime.go-build
        working-directory: runtime
        run: go build ./...
      - name: gate.runtime.go-coverage
        run: pnpm check:runtime-go-coverage
      - name: gate.runtime.go-test
        working-directory: runtime
        run: go test ./...
      - name: gate.runtime.go-vet
        working-directory: runtime
        run: go vet ./...
      - name: gate.runtime.golangci-lint
        run: pnpm check:runtime-golangci-lint
      - name: gate.runtime.govulncheck
        run: pnpm check:runtime-govulncheck
      - name: gate.sdk.npm-binary-smoke
        run: pnpm check:npm-binary-smoke
      - name: gate.workflow.runtime-goreleaser-check
        run: go run github.com/goreleaser/goreleaser/v2@latest check --config .goreleaser.yml
      - name: gate.workflow.runtime-goreleaser-snapshot
        run: pnpm check:runtime-goreleaser-snapshot
      # <<< nimi-release-gate-projection: release-target-runtime-static-checks <<<

      - name: Goreleaser release
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config .goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.runtime_tag.outputs.tag }}

      - name: Install supply chain tooling (cosign + syft)
        run: |
          set -euo pipefail
          GOBIN="$(go env GOPATH)/bin"
          echo "${GOBIN}" >> "${GITHUB_PATH}"
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.2
          go install github.com/anchore/syft/cmd/syft@v1.42.2

      - name: Resolve runtime archives for signing
        id: runtime_archives
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const output = process.env.GITHUB_OUTPUT;
          if (!output) {
            throw new Error('GITHUB_OUTPUT is required');
          }

          const distRoot = path.resolve('dist/runtime');
          const files = fs
            .readdirSync(distRoot, { withFileTypes: true })
            .filter((entry) => entry.isFile())
            .map((entry) => path.join(distRoot, entry.name))
            .filter((filePath) => filePath.endsWith('.tar.gz') || filePath.endsWith('.zip'));

          if (files.length === 0) {
            throw new Error(`no runtime archives found in ${distRoot}`);
          }

          fs.appendFileSync(output, `archives_json=${JSON.stringify(files)}\n`);
          NODE

      - name: Generate SBOM + sign runtime archives
        env:
          NIMI_ARTIFACT_PATHS_JSON: ${{ steps.runtime_archives.outputs.archives_json }}
          NIMI_SIGN_IDENTITY_REGEX: https://github.com/${{ github.repository }}/.github/workflows/release-runtime.yml@.*
          NIMI_SIGN_OUTPUT_MANIFEST: dist/runtime/signing-manifest.json
        run: pnpm check:runtime-release-signing

      - name: Sign and verify checksums.txt
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --output-signature dist/runtime/checksums.txt.sig \
            --output-certificate dist/runtime/checksums.txt.pem \
            dist/runtime/checksums.txt

          cosign verify-blob \
            --certificate dist/runtime/checksums.txt.pem \
            --signature dist/runtime/checksums.txt.sig \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release-runtime.yml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/runtime/checksums.txt

      - name: Upload supply chain assets to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.runtime_tag.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t generated_files < <(node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('dist/runtime/signing-manifest.json', 'utf8'));
          for (const filePath of payload) {
            process.stdout.write(`${filePath}\n`);
          }
          NODE
          )
          generated_files+=(
            "dist/runtime/signing-manifest.json"
            "dist/runtime/checksums.txt.sig"
            "dist/runtime/checksums.txt.pem"
          )
          gh release upload "${RELEASE_TAG}" "${generated_files[@]}" --clobber

  publish-npm-binaries:
    needs: release-tag
    if: startsWith(github.ref, 'refs/tags/runtime/v')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-npm-binary.yml
    with:
      runtime_tag: ${{ needs.release-tag.outputs.tag }}
      publish: true
    secrets: inherit

  release-snapshot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: runtime/go.mod
          cache: false

      - name: Install supply chain tooling (cosign + syft)
        run: |
          set -euo pipefail
          GOBIN="$(go env GOPATH)/bin"
          echo "${GOBIN}" >> "${GITHUB_PATH}"
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.2
          go install github.com/anchore/syft/cmd/syft@v1.42.2

      - name: Goreleaser snapshot (dry-run)
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --snapshot --skip=publish --skip=announce --config .goreleaser.yml
