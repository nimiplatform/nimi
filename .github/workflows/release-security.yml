name: release-security

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      source_ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Validate component
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          case "$COMPONENT" in
            sdk|kit|app-tools|sdk-adapter-vercel-ai|protected-local|tauri|macos-production) ;;
            *) echo "Unsupported release component" >&2; exit 1 ;;
          esac
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Scan exact release source
        run: |
          pip install detect-secrets==1.5.0
          pnpm check:secrets

  workflow-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      # Release validation installs tools itself; it does not restore PR tool caches.
      - name: Audit release workflow source
        run: |
          cargo install --locked zizmor@1.29.0
          zizmor --no-online-audits --min-severity high --collect workflows --collect dependabot -- .github/workflows .github/dependabot.yml

  native-dependencies:
    if: contains(fromJSON('["kit","protected-local","tauri","macos-production"]'), inputs.component)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: Audit this component's native dependencies
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          cargo install --locked cargo-audit@0.22.2
          cargo audit --file kit/shell/protected-local/Cargo.lock
          case "$COMPONENT" in
            kit|macos-production) cargo audit --file kit/shell/protected-local-node/Cargo.lock ;;
          esac
          case "$COMPONENT" in
            kit|tauri) cargo audit --file kit/shell/tauri/Cargo.lock ;;
          esac
