name: release-security

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      source_ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Validate component
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          case "$COMPONENT" in
            sdk|kit|app-tools|protected-local|tauri|preview) ;;
            *) echo "Unsupported release component" >&2; exit 1 ;;
          esac
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.34.5
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Scan exact release source
        run: |
          pip install detect-secrets==1.5.0
          pnpm check:secrets

  workflow-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      # Release validation installs tools itself; it does not restore PR tool caches.
      - name: Audit release workflow source
        run: |
          cargo install --locked zizmor@1.29.0
          zizmor --no-online-audits --min-severity high --collect workflows --collect dependabot -- .github/workflows .github/dependabot.yml

  native-dependencies:
    if: contains(fromJSON('["kit","protected-local","tauri","preview"]'), inputs.component)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Audit this component's native dependencies
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          cargo install --locked cargo-audit@0.22.2
          cargo audit --file kit/shell/protected-local/Cargo.lock
          case "$COMPONENT" in
            kit|preview) cargo audit --file kit/shell/protected-local-node/Cargo.lock ;;
          esac
          case "$COMPONENT" in
            kit|tauri) cargo audit --file kit/shell/tauri/Cargo.lock ;;
          esac
          if [[ "$COMPONENT" == preview ]]; then
            cargo audit --file apps/desktop/product-control-core/Cargo.lock
            cargo audit --file apps/desktop/product-control-node/Cargo.lock
          fi
