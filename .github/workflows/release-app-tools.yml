name: release-app-tools

on:
  push:
    tags:
      - app-tools/v*
  pull_request:
    paths:
      - .github/workflows/release-app-tools.yml
      - app-tools/**
      - apps/lab/**
      - kit/package.json
      - kit/shell/protected-local/Cargo.toml
      - kit/shell/tauri/Cargo.toml
      - package.json
      - pnpm-lock.yaml
      - scripts/lib/command-runner.mjs
      - scripts/release/build-component-package.mjs
      - sdks/typescript/package.json
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable App Tools SemVer for a dry-run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-app-tools-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.34.5
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve and verify App Tools component identity
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('app-tools/package.json','utf8')).version")"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#app-tools/v}"
            production=true
            test "${GITHUB_REF}" = "refs/tags/app-tools/v${version}"
            test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
            production=false
          else
            version="${package_version}"
            production=false
          fi
          if ! [[ "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "App Tools version must be a stable SemVer: ${version}" >&2
            exit 1
          fi
          test "${package_version}" = "${version}"
          {
            echo "production=${production}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"
      - name: Test App Tools
        run: |
          pnpm --filter @nimiplatform/app-tools test
          pnpm --filter @nimiplatform/app-tools test:full
      - name: Build deterministic App Tools package and scaffold smoke
        run: pnpm release:component:pack -- --component app-tools --output-dir dist/component-release/app-tools
      - name: Dry-run App Tools publication
        if: steps.release.outputs.production != 'true'
        run: npm publish dist/component-release/app-tools/*.tgz --access public --dry-run
      - name: Require every scaffolded public dependency
        if: steps.release.outputs.production == 'true'
        run: |
          set -euo pipefail
          sdk_version="$(node -p "JSON.parse(require('node:fs').readFileSync('sdks/typescript/package.json','utf8')).version")"
          kit_version="$(node -p "JSON.parse(require('node:fs').readFileSync('kit/package.json','utf8')).version")"
          protected_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' kit/shell/protected-local/Cargo.toml | head -1)"
          tauri_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' kit/shell/tauri/Cargo.toml | head -1)"
          npm view "@nimiplatform/sdk@${sdk_version}" version >/dev/null
          npm view "@nimiplatform/kit@${kit_version}" version >/dev/null
          curl --fail --silent --show-error "https://crates.io/api/v1/crates/nimi-shell-protected-local/${protected_version}" >/dev/null
          curl --fail --silent --show-error "https://crates.io/api/v1/crates/nimi-shell-tauri/${tauri_version}" >/dev/null
      - name: Publish or verify exact App Tools package through npm OIDC
        if: steps.release.outputs.production == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(dist/component-release/app-tools/*.tgz)
          test "${#tarballs[@]}" -eq 1
          package_spec="@nimiplatform/app-tools@${RELEASE_VERSION}"
          local_sha1="$(shasum -a 1 "${tarballs[0]}" | awk '{print $1}')"
          if remote_sha1="$(npm view "${package_spec}" dist.shasum --json 2>/dev/null)"; then
            remote_sha1="$(printf '%s' "${remote_sha1}" | tr -d '"[:space:]')"
            test "${remote_sha1}" = "${local_sha1}"
          else
            npm publish "${tarballs[0]}" --access public --provenance
          fi
