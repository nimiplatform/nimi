name: release-app-tools

on:
  push:
    tags:
      - app-tools/v*
  workflow_dispatch:
    inputs:
      version:
        description: Semver version already present in app-tools/package.json, for example 0.1.0 or v0.1.0
        required: true
        type: string
      publish:
        description: Publish @nimiplatform/app-tools to npm. false runs the dry-run release gate only.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-app-tools-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_plain: ${{ steps.resolve.outputs.version_plain }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Resolve app-tools release version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          semver_regex='^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'

          if [[ "${EVENT_NAME}" == "push" ]]; then
            case "${REF_NAME}" in
              app-tools/v*)
                version="${REF_NAME#app-tools/}"
                publish="true"
                ;;
              *)
                echo "unsupported app-tools tag format: ${REF_NAME}" >&2
                exit 1
                ;;
            esac
          else
            version="${INPUT_VERSION}"
            if [[ "${version}" != v* ]]; then
              version="v${version}"
            fi
            publish="${INPUT_PUBLISH}"
          fi

          if ! [[ "${version}" =~ ${semver_regex} ]]; then
            echo "invalid semver version: ${version}" >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "version_plain=${version#v}"
            echo "publish=${publish}"
          } >> "${GITHUB_OUTPUT}"

  release:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version_plain }}
      PUBLISH: ${{ needs.resolve.outputs.publish }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify app-tools package version and metadata
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const pkg = JSON.parse(readFileSync('app-tools/package.json', 'utf8'));
          const expectedVersion = process.env.RELEASE_VERSION;
          if (pkg.name !== '@nimiplatform/app-tools') {
            throw new Error(`unexpected app-tools package name: ${pkg.name}`);
          }
          if (pkg.version !== expectedVersion) {
            throw new Error(`app-tools/package.json version ${pkg.version} does not match release ${expectedVersion}`);
          }
          if (pkg.private !== false) {
            throw new Error('@nimiplatform/app-tools must remain public');
          }
          if (pkg.publishConfig?.access !== 'public') {
            throw new Error('@nimiplatform/app-tools publishConfig.access must be public');
          }
          if (pkg.publishConfig?.provenance !== true) {
            throw new Error('@nimiplatform/app-tools publishConfig.provenance must be true');
          }
          if (pkg.repository?.url !== 'https://github.com/nimiplatform/nimi') {
            throw new Error('@nimiplatform/app-tools repository.url must match provenance repository');
          }
          if (pkg.repository?.directory !== 'app-tools') {
            throw new Error('@nimiplatform/app-tools repository.directory must be app-tools');
          }
          if (pkg.bin?.['nimi-app'] !== './bin/nimi-app.mjs') {
            throw new Error('@nimiplatform/app-tools must expose the nimi-app CLI');
          }
          NODE

      - name: Build app-tools
        run: pnpm --filter @nimiplatform/app-tools build

      - name: Nimi-app CLI smoke and scaffold dependency alignment
        run: |
          set -euo pipefail
          node app-tools/bin/nimi-app.mjs --help >/tmp/nimi-app-help.txt
          test -s /tmp/nimi-app-help.txt

          proof_dir="${RUNNER_TEMP}/nimi-app-release-smoke"
          rm -rf "${proof_dir}"
          node app-tools/bin/nimi-app.mjs create --dir "${proof_dir}" --profile standalone --title "Release Smoke"

          PROOF_DIR="${proof_dir}" node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const proofDir = process.env.PROOF_DIR;
          const appPackage = JSON.parse(readFileSync(join(proofDir, 'package.json'), 'utf8'));
          const sdkPackage = JSON.parse(readFileSync('sdks/typescript/package.json', 'utf8'));
          const kitPackage = JSON.parse(readFileSync('kit/package.json', 'utf8'));
          const appToolsPackage = JSON.parse(readFileSync('app-tools/package.json', 'utf8'));
          const cargoToml = readFileSync('kit/shell/tauri/Cargo.toml', 'utf8');
          const shellVersion = cargoToml.match(/^version = "([^"]+)"/m)?.[1];
          const generatedCargoToml = readFileSync(join(proofDir, 'src-tauri', 'Cargo.toml'), 'utf8');

          const expected = {
            '@nimiplatform/sdk': `^${sdkPackage.version}`,
            '@nimiplatform/kit': `^${kitPackage.version}`,
            '@nimiplatform/app-tools': `^${appToolsPackage.version}`,
          };
          for (const [name, version] of Object.entries(expected)) {
            const actual = appPackage.dependencies?.[name] ?? appPackage.devDependencies?.[name];
            if (actual !== version) {
              throw new Error(`generated ${name} version ${actual} does not match expected ${version}`);
            }
          }
          if (!shellVersion || !generatedCargoToml.includes(`nimi-shell-tauri = "${shellVersion}"`)) {
            throw new Error(`generated Cargo.toml does not use public nimi-shell-tauri ${shellVersion}`);
          }
          if (existsSync(join(proofDir, 'pnpm-lock.yaml'))) {
            throw new Error('scaffold generator must not create pnpm-lock.yaml');
          }
          NODE

      - name: Test app-tools
        run: pnpm --filter @nimiplatform/app-tools test && pnpm --filter @nimiplatform/app-tools test:full

      - name: Check duplicate app-tools npm version
        run: |
          set -euo pipefail
          if npm view "@nimiplatform/app-tools@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            if [[ "${PUBLISH}" == "true" ]]; then
              echo "@nimiplatform/app-tools@${RELEASE_VERSION} already exists on npm" >&2
              exit 1
            fi
            echo "@nimiplatform/app-tools@${RELEASE_VERSION} already exists on npm; dry-run mode will not publish"
          else
            echo "@nimiplatform/app-tools@${RELEASE_VERSION} is not published on npm"
          fi

      - name: Verify public dependency readiness for real publish
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          sdk_version="$(node -p "JSON.parse(require('node:fs').readFileSync('sdks/typescript/package.json', 'utf8')).version")"
          kit_version="$(node -p "JSON.parse(require('node:fs').readFileSync('kit/package.json', 'utf8')).version")"
          shell_version="$(node -e "const fs=require('node:fs'); const m=fs.readFileSync('kit/shell/tauri/Cargo.toml','utf8').match(/^version = \"([^\"]+)\"/m); if (!m) process.exit(1); console.log(m[1]);")"

          npm view "@nimiplatform/sdk@${sdk_version}" version >/dev/null
          npm view "@nimiplatform/kit@${kit_version}" version >/dev/null
          crate_index="$(curl --fail --silent --show-error https://index.crates.io/ni/mi/nimi-shell-tauri)"
          CRATE_INDEX="${crate_index}" SHELL_VERSION="${shell_version}" node --input-type=module <<'NODE'
          const entries = process.env.CRATE_INDEX.trim().split('\n').map((line) => JSON.parse(line));
          const expected = process.env.SHELL_VERSION;
          const match = entries.find((entry) => entry.vers === expected && entry.yanked !== true);
          if (!match) {
            throw new Error(`nimi-shell-tauri ${expected} is not visible in the crates.io sparse index`);
          }
          NODE

      - name: App-tools npm publish dry-run
        run: pnpm --filter @nimiplatform/app-tools publish --access public --no-git-checks --dry-run

      - name: Publish app-tools to npm
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          if [[ -z "${NPM_TOKEN:-}" ]]; then
            echo "NPM_TOKEN is required for @nimiplatform/app-tools publish" >&2
            exit 1
          fi
          npm_config="${NPM_CONFIG_USERCONFIG:-${HOME}/.npmrc}"
          mkdir -p "$(dirname "${npm_config}")"
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "${npm_config}"
          export NODE_AUTH_TOKEN="${NPM_TOKEN}"
          pnpm --filter @nimiplatform/app-tools publish --access public --no-git-checks --provenance
